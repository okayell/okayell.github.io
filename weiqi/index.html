              '<button type="button" class="btn btn-kaya" data-act="pass" title="無處可爭或單官收完時虛手；雙方連續虛手即終局點目">⏭️ 虛手（Pass）</button>' +
              '<button type="button" class="btn" data-act="terr" title="顯示黑白領地與勢力目數估算">🧮 形勢判斷</button>' +
              '<button type="button" class="btn" data-act="undo">↩️ 悔棋</button>' +
              '<button type="button" class="btn" data-act="hint">💡 AI 提示</button>' +
              '<button type="button" class="btn" data-act="nums">🔢 手數顯示</button>' +
              '<button type="button" class="btn" data-act="new">🔄 新對局</button>' +
              '<button type="button" class="btn btn-danger" data-act="resign">🏳️ 投子認輸</button>' +
            '</div>' +
          '</section>' +
          '<section class="card">' +
            '<div class="card-head"><h2>手數與提子</h2>' +
              '<div class="card-tools">' +
                '<button type="button" class="link-btn" data-act="save">💾 存棋譜</button>' +
                '<button type="button" class="link-btn" data-act="copy">📋 複製 SGF</button>' +
              '</div>' +
            '</div>' +
            '<div class="mv-scroll" id="playMoves"></div>' +
            '<div id="playCaptured" class="cap-box"></div>' +
            '<div id="playKomi" class="komi-note"></div>' +
          '</section>' +
        '</aside>' +
      '</div>';
    play.board = window.WQBoard.create(document.getElementById('playBoard'), { onPoint: onPlayPoint });
    document.getElementById('oppSel').value = String(play.ai);
    document.getElementById('sideSel').value = String(play.human);
    document.getElementById('hcSel').value = String(prefs.handicap || 0);
    refreshPlay();
    maybeAiMove();
  }

  function refreshPlay() {
    if (!document.getElementById('playStatus')) return;
    var g = play.game;
    var res = g.result();
    var live = ratedLive();
    var showTerr = (res && res.reason === 'score') || (!live && !!prefs.terr);
    var est = showTerr ? E.estimateTerritory(g.pos) : null;

    play.board.render({
      size: g.size(),
      board: g.pos.board,
      last: g.lastStone(),
      hint: play.hint,
      moveNums: prefs.nums ? buildMoveNums(g) : null,
      terrMap: est ? est.terrMap : null,
      dead: est ? est.dead : null,
      hoverColor: !res && humanTurn() && !play.thinking ? g.turn() : 0,
    });

    main.querySelectorAll('[data-size]').forEach(function (b) {
      b.classList.toggle('is-on', +b.getAttribute('data-size') === g.size());
    });

    var status = document.getElementById('playStatus');
    var side = g.turn();
    var html;
    if (res) {
      var verdict = '';
      if (play.ai && res.winner !== null) verdict = res.winner === play.human ? ' · 你贏了！' : ' · AI 獲勝';
      html = '<div class="status-result">' + esc(NT.resultText(res) + verdict) + '</div>';
      var rd = play.ratedDone;
      if (rd) {
        html += '<p class="rk-result' + (rd.promoted || rd.placed ? ' is-promo' : (rd.demoted ? ' is-demo' : '')) + '">' +
          (rd.promoted ? '🎉 晉升 <strong>' + esc(rd.to) + '</strong>！' : rd.demoted ? '⬇️ 降為 <strong>' + esc(rd.to) + '</strong>。' : (rd.placed ? '🏅 定級為 <strong>' + esc(rd.to) + '</strong>。' : '🏅 段位賽：')) +
          '棋力分 <strong class="' + (rd.d > 0 ? 'is-up' : (rd.d < 0 ? 'is-down' : '')) + '">' + esc(Rank.signed(rd.d)) + '</strong>（' + rd.before + ' → ' + rd.after + '）</p>';
      }
      if (est) html += territoryBannerHtml(est);
      html += '<p class="muted">共 ' + g.history.length + ' 手。可按「悔棋」退回研究（不影響已結算棋力分），或開啟新對局。</p>';
    } else {
      var passBadge = g.pos.passes === 1 ? '<span class="badge-pass">前一手虛手</span>' : '';
      html = '<div class="status-turn ' + (side === E.WHITE ? 'is-white' : '') + '">' +
        '<span class="turn-dot"></span>' +
        (play.ai ? (humanTurn() ? '輪到你落子（' + sideName(side) + '）' : 'AI 思考中…') : '輪到' + sideName(side) + '落子') +
        passBadge + '</div>' +
        '<p class="muted">第 ' + (g.history.length + 1) + ' 手 · ' + g.size() + ' 路 · ' +
        (play.hinting ? '正在推演選點提示…' : (play.ai ? (play.rated ? '🏅 段位賽・' : '') + '對手：AI ' + aiName() : '同機雙人手談') + '（雙方連續虛手即點目終局）') + '</p>';
      if (est) html += territoryBannerHtml(est);
    }
    status.innerHTML = html;

    var mvBox = document.getElementById('playMoves');
    mvBox.innerHTML = moveListHtml(g, g.history.length, false);
    mvBox.scrollTop = mvBox.scrollHeight;
    document.getElementById('playCaptured').innerHTML = capturesHtml(g);
    document.getElementById('playKomi').textContent = '規則：中國數子／子空皆地 · 黑貼 ' + g.komi() + ' 目';

    var q = function (act) { return main.querySelector('[data-act="' + act + '"]'); };
    q('pass').disabled = !!res || play.thinking || !humanTurn();
    q('terr').disabled = live;
    q('terr').classList.toggle('is-on', showTerr);
    q('terr').title = live ? '段位賽進行中需自行點目判斷，終局後自動揭曉；練習模式可隨時開啟' : '顯示黑白領地與勢力目數估算';
    q('undo').disabled = (!g.history.length && !res) || live;
    q('undo').title = live ? '段位賽進行中不能悔棋；想悔棋請切為練習模式' : '';
    q('hint').disabled = !!res || play.thinking || play.hinting || !humanTurn() || live;
    q('hint').title = live ? '段位賽進行中不能看提示' : '請高段 AI 建議本手急所';
    q('nums').classList.toggle('is-on', !!prefs.nums);
    q('resign').disabled = !!res;
    q('save').disabled = !g.history.length;
    q('copy').disabled = !g.history.length;

    document.getElementById('sideWrap').hidden = !play.ai;
    document.getElementById('modeWrap').hidden = !play.ai;
    var isPractice = !play.ai || (res ? prefs.rated === false : !play.rated);
    document.getElementById('hcWrap').hidden = !isPractice;
    document.getElementById('modeSel').value = (res ? prefs.rated !== false : play.rated) ? '1' : '0';

    var st = statsLoad();
    var statEl = document.getElementById('aiStat');
    statEl.hidden = !play.ai;
    if (play.ai) {
      var pv = Rank.preview(st.rank, aiRating());
      var ratedNext = res ? prefs.rated !== false : play.rated;
      statEl.textContent = (ratedNext
        ? '本局段位賽預估：' + Rank.previewText(pv) + (pv.noGain ? '（此 AI 棋力低於你較多，獲勝不加分）' : '') + '。'
        : '練習／讓子模式不影響棋力分。') +
        '對 AI ' + aiName() + '（' + aiRating() + ' 分）戰績：' + Stats.wldText(st.ai[play.ai]);
    }
    document.getElementById('rankMini').innerHTML = Rank.miniHtml(st.rank, esc);
    refreshRankPill();
  }

  function recordFinished() {
    var g = play.game;
    var res = g.result();
    if (!res || !g.history.length) return;
    play.savedId = upsertSaved(play.savedId, defaultTitle(), g);
    var msg = NT.resultText(res) + '，已存入我的棋譜';
    if (play.ai) {
      var r = res.winner === null ? 'd' : (res.winner === play.human ? 'w' : 'l');
      var st = statsLoad();
      play.counted = Stats.recordAi(st, { lv: play.ai, r: r, prev: play.counted });
      if (play.rated && !play.ratedDone) {
        var info = Rank.apply(st.rank, { lv: play.ai, ai: aiRating(), res: r, at: Date.now() });
        if (info) {
          play.ratedDone = info;
          msg = info.promoted ? '🎉 晉升' + info.to + '！棋力分 ' + Rank.signed(info.d)
            : info.demoted ? '⬇️ 降為' + info.to + '，棋力分 ' + Rank.signed(info.d)
            : (info.placed ? '🏅 定級為' + info.to : '🏅 段位賽：棋力分 ' + Rank.signed(info.d));
        }
      }
      statsSave(st);
    }
    toast(msg);
  }

  function leaveRated(what) {
    var g = play.game;
    if (!g || !ratedLive() || g.history.length < Rank.FORFEIT_PLIES) return true;
    var pv = Rank.preview(statsLoad().rank, aiRating());
    if (!window.confirm('這盤段位賽還沒下完，現在' + what + '會判本盤認輸（棋力分 ' + Rank.signed(pv.l) + '）。確定嗎？')) return false;
    stopThinking();
    g.resign(play.human);
    recordFinished();
    persistPlay();
    return true;
  }
  function ratedLocked() { return ratedLive() && play.game.history.length >= Rank.FORFEIT_PLIES; }

  function afterPlayChange() {
    recordFinished();
    persistPlay();
    refreshPlay();
    maybeAiMove();
  }

  function maybeAiMove() {
    var g = play.game;
    if (!play.ai || play.thinking || g.result() || g.turn() === play.human) return;
    play.thinking = true;
    play.hint = -1;
    refreshPlay();
    var started = Date.now();
    var plies = g.history.length;
    aiClient.request({ fen: g.startFen, moves: g.moveStrings(), level: play.ai }, function (r) {
      setTimeout(function () {
        if (!play.thinking || play.game !== g || g.history.length !== plies) return;
        play.thinking = false;
        if (r.move < 0 || !g.play(r.move)) {
          g.play(E.PASS);
        } else if (r.move === E.PASS && !g.result()) {
          toast('AI 虛手（Pass）：若單官已收完，你也可按「虛手」進入點目');
        }
        afterPlayChange();
      }, Math.max(0, AI_MIN_DELAY - (Date.now() - started)));
    });
  }

  function requestHint() {
    var g = play.game;
    if (g.result() || play.thinking || play.hinting || !humanTurn() || ratedLive()) return;
    play.hinting = true;
    refreshPlay();
    var plies = g.history.length;
    aiClient.request({ fen: g.startFen, moves: g.moveStrings(), level: 9, hint: true }, function (r) {
      if (!play.hinting || play.game !== g || g.history.length !== plies) return;
      play.hinting = false;
      if (r.move === E.PASS) {
        play.hint = -1;
        toast('AI 建議：盤面已無爭處，可按「⏭️ 虛手」終局點目');
      } else if (r.move >= 0) {
        play.hint = r.move;
        toast('AI 建議選點：' + E.sqToStr(r.move, g.size()));
      }
      refreshPlay();
    });
  }

  function onPlayPoint(sq) {
    var g = play.game;
    if (g.result() || !humanTurn() || play.thinking) return;
    if (!g.isLegal(sq)) {
      if (g.pos.board[sq] === E.EMPTY) {
        toast(sq === g.pos.ko ? '打劫禁點：需隔一手（先找劫材）才能提回' : '此處氣盡為禁著點（禁止自殺）或違反禁全同');
      }
      return;
    }
    stopThinking();
    g.play(sq);
    if (g.history.length === 1 || g.result()) campusAct();
    afterPlayChange();
  }

  function startGame(game, title) {
    stopThinking();
    play.game = game;
    play.savedId = null;
    play.counted = null;
    play.rated = false;
    play.ratedDone = null;
    play.savedTitle = title || '';
    syncRated();
    persistPlay();
  }

  function onPlayAction(act) {
    var g = play.game;
    if (act === 'pass') {
      if (g.result() || !humanTurn() || play.thinking) return;
      stopThinking();
      g.play(E.PASS);
      if (g.result()) campusAct();
      afterPlayChange();
    } else if (act === 'terr') {
      if (ratedLive()) return;
      prefs.terr = !prefs.terr;
      savePrefs();
      refreshPlay();
    } else if (act === 'nums') {
      prefs.nums = !prefs.nums;
      savePrefs();
      refreshPlay();
    } else if (act === 'undo') {
      if (ratedLive()) return;
      stopThinking();
      if (!g.undo()) return;
      play.rated = false;
      if (play.ai && !g.result() && g.turn() !== play.human && g.history.length) g.undo();
      persistPlay();
      refreshPlay();
      maybeAiMove();
    } else if (act === 'hint') {
      requestHint();
    } else if (act === 'new') {
      if (ratedLocked()) {
        if (!leaveRated('開新對局')) return;
      } else if (g.history.length && !g.result() && !window.confirm('目前這局還沒結束，確定要重新開局嗎？')) return;
      startGame(makeFreshGame());
      refreshPlay();
      maybeAiMove();
    } else if (act === 'resign') {
      var loser = play.ai ? play.human : g.turn();
      if (!window.confirm((play.ai ? '' : sideName(loser)) + '確定要投子認輸嗎？')) return;
      stopThinking();
      g.resign(loser);
      campusAct();
      afterPlayChange();
    } else if (act === 'save') {
      play.savedId = upsertSaved(play.savedId, defaultTitle(), g);
      persistPlay();
      toast('已存入我的棋譜');
    } else if (act === 'copy') {
      copyText(NT.exportSgf(g, defaultTitle()));
    }
  }

  // ------------------------------------------------------------------ 棋譜回放與 SGF
  var replay = { rec: null, game: null, idx: 0, board: null, timer: 0, speed: 950, showNums: true, showTerr: false };

  function findRecord(id) {
    var i;
    if (id && id.indexOf('my-') === 0) {
      var list = savedGames();
      for (i = 0; i < list.length; i++) {
        if ('my-' + list[i].id === id) {
          return {
            id: id, title: list[i].title, tag: '我的棋譜',
            desc: list[i].date + (list[i].result ? ' · ' + list[i].result : ''),
            snap: list[i],
          };
        }
      }
      return null;
    }
    if (id && id.indexOf('puzzle-') === 0) {
      var pzs = window.WQ_PUZZLES || [];
      for (i = 0; i < pzs.length; i++) {
        if ('puzzle-' + pzs[i].id === id) {
          return {
            id: id, title: pzs[i].name + '・正解圖', tag: '題庫正解', back: '#/puzzle/' + pzs[i].id,
            desc: window.WQStudy.goalText(pzs[i]) + '。',
            snap: { fen: pzs[i].fen, moves: pzs[i].line }, fromStart: true,
          };
        }
      }
      return null;
    }
    var recs = window.WQ_RECORDS || [];
    for (i = 0; i < recs.length; i++) if (recs[i].id === id) return recs[i];
    return null;
  }

  function recordGame(rec) {
    if (rec.snap) return restoreGame(rec.snap);
    return NT.gameFromCoords(rec.fen || rec.size || 19, rec.moves);
  }

  function stopAuto() {
    if (replay.timer) { clearInterval(replay.timer); replay.timer = 0; }
  }

  function replayListHtml(activeId) {
    var recs = window.WQ_RECORDS || [];
    var mine = savedGames();
    function item(id, title, sub, del) {
      return '<li class="rec-item' + (id === activeId ? ' is-active' : '') + '">' +
        '<a href="#/replay/' + esc(id) + '"><strong>' + esc(title) + '</strong><small>' + esc(sub) + '</small></a>' +
        (del ? '<button type="button" class="icon-btn" data-del="' + esc(del) + '" title="刪除這筆棋譜" aria-label="刪除">🗑</button>' : '') +
        '</li>';
    }
    function group(title, tag) {
      var list = recs.filter(function (r) { return r.tag === tag; });
      if (!list.length) return '';
      return '<section class="card">' +
        '<div class="card-head"><h2>' + title + '</h2><span class="count-pill">' + list.length + '</span></div>' +
        '<ul class="rec-list">' + list.map(function (r) {
          var sz = r.size || 19;
          return item(r.id, r.title, sz + ' 路 · ' + r.moves.trim().split(/\s+/).length + ' 手');
        }).join('') + '</ul></section>';
    }
    return '<section class="card">' +
        '<div class="card-head"><h2>我的棋譜</h2><span class="count-pill">' + mine.length + '</span></div>' +
        (mine.length
          ? '<ul class="rec-list">' + mine.map(function (g) {
            return item('my-' + g.id, g.title, g.date + ' · ' + (g.moves || []).length + ' 手' + (g.result ? ' · ' + g.result : ''), g.id);
          }).join('') + '</ul>'
          : '<p class="muted">完賽的對局會自動存到這裡；也可在下方貼上標準 SGF 或座標棋譜匯入覆盤。</p>') +
        '<details class="import-box"><summary>📥 匯入棋譜（標準 SGF 或座標）</summary>' +
          '<textarea id="importText" rows="5" placeholder="貼上 SGF 或座標文字，例如：&#10;(;GM[1]SZ[19]KM[7.5];B[pd];W[dd];B[pq];W[dp])&#10;或：19路: Q16 D16 Q4 D4"></textarea>' +
          '<div class="import-actions"><button type="button" class="btn btn-primary" data-ract="import">匯入覆盤</button>' +
          '<span class="muted" id="importMsg"></span></div>' +
        '</details>' +
      '</section>' +
      statsCardHtml() +
      group('千古名局選粹', '千古名局') +
      group('定石與佈局示範', '定石與佈局') +
      group('九路快棋實戰範本', '九路實戰');
  }

  function renderReplay(id) {
    stopAuto();
    var recs = window.WQ_RECORDS || [];
    var rec = id ? findRecord(id) : null;
    if (!rec) {
      var mine = savedGames();
      rec = mine.length && !id ? findRecord('my-' + mine[0].id) : recs[0];
      if (id && !rec) rec = recs[0];
    }
    if (!rec) {
      rec = { id: 'empty', title: '空白棋盤', tag: '棋譜', desc: '', snap: { fen: E.START_FEN, moves: [] } };
    }
    replay.rec = rec;
    try { replay.game = recordGame(rec); } catch (_) { replay.game = new E.Game(); }
    replay.idx = rec.snap && !rec.fromStart ? replay.game.history.length : 0;

    main.innerHTML =
      '<div class="wq-stage">' +
        '<div class="wq-board-col">' +
          '<div class="wq-board-wrap" id="replayBoard"></div>' +
          '<div class="rp-controls">' +
            '<button type="button" class="btn" data-ract="first" title="回到開局" aria-label="回到開局">⏮</button>' +
            '<button type="button" class="btn" data-ract="prev" title="上一手（←）" aria-label="上一手">◀</button>' +
            '<button type="button" class="btn btn-primary" data-ract="auto" id="rpAuto">▶ 自動播放</button>' +
            '<button type="button" class="btn" data-ract="next" title="下一手（→）" aria-label="下一手">▶</button>' +
            '<button type="button" class="btn" data-ract="last" title="跳到終局" aria-label="跳到終局">⏭</button>' +
          '</div>' +
          '<input type="range" id="rpSlider" class="rp-slider" min="0" max="' + replay.game.history.length + '" step="1" aria-label="手數" />' +
        '</div>' +
        '<aside class="wq-side">' +
          '<section class="card">' +
            '<div class="card-head"><h2>' + esc(rec.title) + '</h2><span class="tag-pill">' + esc(rec.tag || '棋譜') + '</span></div>' +
            '<p class="rec-desc">' + esc(rec.desc || '') + '</p>' +
            (rec.back ? '<p style="margin-top:6px"><a class="link-btn" href="' + esc(rec.back) + '">← 回到該道題目</a></p>' : '') +
            '<div class="rp-pos" id="rpPos"></div>' +
            '<div id="rpTerr"></div>' +
            '<div class="mv-scroll" id="rpMoves"></div>' +
            '<div class="card-tools rp-tools">' +
              '<button type="button" class="link-btn" data-ract="continue">⚫ 從這個局面接著下</button>' +
              '<button type="button" class="link-btn" data-ract="nums" id="rpNumsBtn">🔢 手數</button>' +
              '<button type="button" class="link-btn" data-ract="terr" id="rpTerrBtn">🧮 形勢判斷</button>' +
              '<button type="button" class="link-btn" data-ract="copy">📋 複製 SGF</button>' +
            '</div>' +
          '</section>' +
          '<div id="rpLists">' + replayListHtml(rec.id) + '</div>' +
        '</aside>' +
      '</div>';
    replay.board = window.WQBoard.create(document.getElementById('replayBoard'), {});
    refreshReplay();
  }

  function replayPos() {
    var g = replay.game;
    var pos = E.parseFen(replay.idx === 0 ? g.startFen : g.history[replay.idx - 1].fen);
    if (replay.idx >= 2 && g.history[replay.idx - 1].move === E.PASS && g.history[replay.idx - 2].move === E.PASS) {
      pos.passes = 2;
    } else if (replay.idx >= 1 && g.history[replay.idx - 1].move === E.PASS) {
      pos.passes = 1;
    }
    return pos;
  }

  function refreshReplay() {
    var g = replay.game;
    var pos = replayPos();
    var est = (replay.showTerr || pos.passes >= 2) ? E.estimateTerritory(pos) : null;
    var lastSq = -1;
    for (var k = replay.idx - 1; k >= 0; k--) {
      if (g.history[k].move !== E.PASS) { lastSq = g.history[k].move; break; }
    }
    replay.board.render({
      size: pos.size,
      board: pos.board,
      last: lastSq,
      moveNums: replay.showNums ? buildMoveNums(g, replay.idx) : null,
      terrMap: est ? est.terrMap : null,
      dead: est ? est.dead : null,
    });
    var total = g.history.length;
    var label = '第 ' + replay.idx + ' / ' + total + ' 手（' + pos.size + ' 路）';
    if (replay.idx === total && g.result()) label += ' · ' + NT.resultText(g.result());
    else label += ' · 輪到' + sideName(pos.turn);
    document.getElementById('rpPos').textContent = label;
    document.getElementById('rpTerr').innerHTML = est ? territoryBannerHtml(est) : '';
    var box = document.getElementById('rpMoves');
    box.innerHTML = moveListHtml(g, replay.idx, true);
    var active = box.querySelector('.is-active');
    if (active) {
      var top = active.offsetTop - box.offsetTop;
      if (top < box.scrollTop || top > box.scrollTop + box.clientHeight - 36) box.scrollTop = Math.max(0, top - box.clientHeight / 2);
    } else {
      box.scrollTop = 0;
    }
    document.getElementById('rpSlider').value = replay.idx;
    document.getElementById('rpAuto').textContent = replay.timer ? '⏸ 暫停' : '▶ 自動播放';
  }

  function replayGoto(idx) {
    var total = replay.game.history.length;
    idx = Math.max(0, Math.min(total, idx));
    replay.idx = idx;
    if (idx >= total) stopAuto();
    refreshReplay();
  }

  function onReplayAction(act) {
    var g = replay.game;
    if (act === 'first') { stopAuto(); replayGoto(0); }
    else if (act === 'prev') { stopAuto(); replayGoto(replay.idx - 1); }
    else if (act === 'next') { stopAuto(); replayGoto(replay.idx + 1); }
    else if (act === 'last') { stopAuto(); replayGoto(g.history.length); }
    else if (act === 'auto') {
      if (replay.timer) { stopAuto(); refreshReplay(); return; }
      if (replay.idx >= g.history.length) replay.idx = 0;
      replay.timer = setInterval(function () { replayGoto(replay.idx + 1); }, replay.speed);
      replayGoto(replay.idx + 1);
      campusAct();
    } else if (act === 'nums') {
      replay.showNums = !replay.showNums;
      refreshReplay();
    } else if (act === 'terr') {
      replay.showTerr = !replay.showTerr;
      refreshReplay();
    } else if (act === 'copy') {
      copyText(NT.exportSgf(g, replay.rec.title));
    } else if (act === 'continue') {
      if (!play.game) loadPlay();
      if (ratedLocked()) {
        if (!leaveRated('改下別的局面')) return;
      } else if (play.game.history.length && !play.game.result() &&
          !window.confirm('「對弈」頁還有一局未完賽，要改從這個局面接著下嗎？')) return;
      var ng = E.Game.fromMoves(g.startFen, g.moveStrings().slice(0, replay.idx));
      prefs.size = ng.size();
      savePrefs();
      startGame(ng, replay.rec.title + '（接續手談）');
      location.hash = '#/play';
    } else if (act === 'import') {
      var ta = document.getElementById('importText');
      var msg = document.getElementById('importMsg');
      var r = NT.importText(ta.value, 19);
      if (!r.game || !r.game.history.length) {
        msg.textContent = r.error || '未讀到有效落子。';
        return;
      }
      var id = upsertSaved(null, r.title || '匯入棋譜 ' + nowStr(), r.game);
      if (r.error) toast(r.error);
      else toast('成功匯入 ' + r.game.history.length + ' 手');
      if (location.hash === '#/replay/my-' + id) renderReplay('my-' + id);
      else location.hash = '#/replay/my-' + id;
    }
  }

  // ------------------------------------------------------------------ 棋規與形勢速查（#/rules）
  var RULES_CARDS = [
    {

      fen: '9:5.5:b:-:8X/9/9/9/X3X4/9/9/9/9',
      dots: ['H9', 'J8', 'A6', 'B5', 'A4', 'E6', 'E4', 'D5', 'F5'],
      text: '棋子下在線與線的交叉點上。沿著直線緊鄰的空點叫做「氣」（綠點所示）：中腹一子有 4 口氣，邊上一子只有 3 口氣，角落一子只有 2 口氣；斜角不算氣！',
    },
    {
      name: '連接與虎口：直線相連同生共死',
      fen: '9:5.5:b:-:9/9/9/4X4/3X1X3/4X4/9/9/9',
      dots: ['E5'],
      text: '同色棋子只要上下或左右直線相連，就結合成同一塊棋、共享所有的氣。圖中四顆黑子圍住中央 E5 空點形成「方口／雙虎口」，白子一旦投進 E5 就會自投羅網。',
    },
    {
      name: '叫吃（Atari）與提子：堵住最後一口氣',
      fen: '9:5.5:b:-:9/9/4X4/3XOX3/9/9/9/9/9',
      dots: ['E5'],
      text: '當一塊棋只剩最後一口氣時稱為「被打吃（叫吃）」。圖中白子只剩下方 E5 一口氣，輪到黑棋下在 E5，白子氣盡就會立刻從盤面被提走。',
    },
    {
      name: '禁著點與「提子優先」例外',
      fen: '9:5.5:b:-:9/9/3XO4/2XO1O3/3XO4/9/9/9/9',
      dots: ['E6'],
      text: '自己落子後若整塊棋 0 氣且沒吃到對手，屬於「自殺禁著點」不能下；但若落進 E6 同時把左邊三顆剩 1 氣的白子提掉（或反提單子），提掉對方後自己就有氣了，完全合法！',
    },
    {
      name: '兩眼活棋：真眼永不死',
      fen: '9:5.5:w:-:OOOO5/XXXO5/X1XO5/XXXO5/X1XO5/XXXO5/OOOO5/9/9',
      dots: ['B7', 'B5'],
      text: '圖中黑棋擁有 B7 與 B5 兩個獨立的「真眼」。白棋想下 B7 是自殺（因為 B5 還有氣，提不掉黑棋），想下 B5 也是自殺——黑棋從此永生不死！做活的鐵律就是「做出兩個真眼」。',
    },
    {
      name: '打劫（Ko）與禁全同：需隔一手才能提回',
      fen: '9:5.5:w:E5:9/9/9/3XO4/2X1XO3/3XO4/9/9/9',
      dots: ['E5'],
      text: '黑棋剛在 F5 提掉一顆白子形成「劫」。若允許白棋立刻在 E5 反提一子，盤面會跟上一手一模一樣陷入無限循環！因此白棋必須先在別處下一手「找劫材」，下一輪才能提回。',
    },
    {
      name: '雙活（Seki）：公氣誰都不敢先動',
      fen: '9:5.5:b:-:XO1OX4/XO1OX4/XXOXX4/OOOOO4/9/9/9/9/9',
      dots: ['C9', 'C8'],
      text: '黑白兩塊棋都沒有兩隻眼，卻共享中間 C9、C8 兩口「公氣」。無論黑或白誰先去填 C9，都會讓自己只剩 1 氣而被對方在 C8 一手提光——結果雙方誰也不動，並列「雙活」！',
    },
    {
      name: '雙虛手與中國數子／子空皆地計目',
      fen: '9:5.5:b:-:3XO4/3XO4/3XO4/3XO4/3XO4/3XO4/3XO4/3XO4/3XO4',
      showTerr: true,
      text: '當全盤邊界都收束完畢，雙方輪流按「⏭️ 虛手（Pass）」即進入終局點目。本院採中國數子／子空皆地規則：黑方「活子數＋圍住的純空點數」減去白方「活子數＋純空點數＋貼目」定勝負（9 路貼 5.5 目、13 路 6.5 目、19 路 7.5 目）。',
    },
  ];

  function renderRules() {
    main.innerHTML =
      '<div class="rules-wrap">' +
        '<section class="card rules-intro">' +
          '<h1>圍棋棋規與形勢速查</h1>' +
          '<p>圍棋只有兩條核心規則：<strong>「氣盡則提」</strong>與<strong>「子空皆地、多者為勝」</strong>。黑棋先下，白棋後下並獲得「貼目」補償先手優勢。下方 8 張本榧木圖卡濃縮了實戰必備的全部規則：</p>' +
        '</section>' +
        '<div class="guide-grid">' + RULES_CARDS.map(function (g, i) {
          return '<section class="card guide-card"><div class="guide-board" id="ruleBd' + i + '"></div>' +
            '<div><h2>' + esc(g.name) + '</h2><p>' + esc(g.text) + '</p></div></section>';
        }).join('') + '</div>' +
        '<section class="card">' +
          '<h2>三種棋盤路數怎麼選？</h2>' +
          '<ul class="plain-list">' +
            '<li><strong>9 路棋盤（81 點・黑貼 5.5 目）</strong>：一局約 5 分鐘，開局三手就短兵相接，最適合新手練吃子、死活對殺與快速打段位賽。</li>' +
            '<li><strong>13 路棋盤（169 點・黑貼 6.5 目）</strong>：兼具四角定石與中腹攻防，一局約 12 分鐘，是銜接大盤的最佳橋樑。</li>' +
            '<li><strong>19 路棋盤（361 點・黑貼 7.5 目）</strong>：正式職業比賽規格，擁有完整的星小目佈局、大模樣消長與官子收束之美。</li>' +
          '</ul>' +
        '</section>' +
        '<section class="card">' +
          '<h2>座標與 SGF 棋譜怎麼讀？</h2>' +
          '<ul class="plain-list">' +
            '<li><strong>國際棋盤座標</strong>：橫軸由左至右為 <strong>A～T</strong>（跳過容易和數字 1 混淆的 <strong>I</strong>），縱軸由下至上為 <strong>1～19</strong>。例如 19 路右上角星位是 <strong>Q16</strong>，天元是 <strong>K10</strong>。</li>' +
            '<li><strong>標準 SGF 格式</strong>：全世界圍棋軟體通用的文字棋譜格式，例如 <code>(;GM[1]SZ[19]KM[7.5];B[pd];W[dd])</code>；在「📜 棋譜」頁可一鍵複製匯出或貼上匯入。</li>' +
          '</ul>' +
        '</section>' +
      '</div>';

    RULES_CARDS.forEach(function (g, i) {
      var pos = E.parseFen(g.fen);
      var dots = (g.dots || []).map(function (s) { return E.strToSq(s, pos.size); });
      var terr = g.showTerr ? E.scoreArea(pos).owner : null;
      window.WQBoard.create(document.getElementById('ruleBd' + i), {}).render({
        size: pos.size, board: pos.board, last: -1, dots: dots, terrMap: terr,
      });
    });
  }

  // ------------------------------------------------------------------ 段位頁
  function renderRank() {
    var st = statsLoad();
    main.innerHTML = Rank.pageHtml(st.rank, esc, {
      levels: aiLevels().map(function (x) { x.rec = st.ai[x.lv]; return x; }),
      wldText: Stats.wldText,
    });
    refreshRankPill();
  }

  function challengeAi(lv) {
    if (!window.WQAI.LEVELS[lv]) return;
    if (!play.game) loadPlay();
    var g = play.game;
    if (ratedLocked()) {
      if (!leaveRated('挑戰別的對手')) return;
    } else if (g.history.length && !g.result() &&
        !window.confirm('「對弈」頁還有一局未結束，要放棄它並開啟新的段位賽嗎？')) return;
    stopThinking();
    play.ai = lv;
    prefs.rated = true;
    prefs.handicap = 0;
    savePrefs();
    startGame(new E.Game(E.startSetup(prefs.size || 9)));
    location.hash = '#/play';
  }

  // ------------------------------------------------------------------ 路由與事件
  function route() {
    stopAuto();
    stopThinking();
    if (window.WQStudy) window.WQStudy.stop();
    if (window.WQOnline) window.WQOnline.stop();
    var parts = (location.hash || '#/play').replace(/^#\/?/, '').split('/');
    var view = parts[0] || 'play';
    if (view === 'replay') renderReplay(parts[1] ? decodeURIComponent(parts[1]) : '');
    else if (view === 'rules') renderRules();
    else if (view === 'rank') renderRank();
    else if (window.WQStudy && window.WQStudy.handles(view)) window.WQStudy.render(view, parts.slice(1).map(decodeURIComponent));
    else if (window.WQOnline && window.WQOnline.handles(view)) window.WQOnline.render(parts.slice(1).map(decodeURIComponent));
    else { view = 'play'; renderPlay(); }
    document.querySelectorAll('[data-nav]').forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('data-nav') === view);
    });
    document.body.setAttribute('data-view', view);
  }

  main.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act],[data-ract],[data-goto],[data-del],[data-size],[data-stats-reset],[data-rank-go],[data-rank-reset]');
    if (!t || t.disabled) return;
    if (t.hasAttribute('data-size')) {
      var wantSz = +t.getAttribute('data-size');
      if (!E.validSize(wantSz) || (play.game && play.game.size() === wantSz)) return;
      if (ratedLocked()) {
        if (!leaveRated('切換棋盤路數')) return;
      } else if (play.game && play.game.history.length && !play.game.result() &&
          !window.confirm('切換路數將開啟新對局，確定放棄目前這盤嗎？')) return;
      prefs.size = wantSz;
      savePrefs();
      startGame(makeFreshGame());
      refreshPlay();
      maybeAiMove();
      return;
    }
    if (t.hasAttribute('data-rank-go')) { challengeAi(+t.getAttribute('data-rank-go')); return; }
    if (t.hasAttribute('data-rank-reset')) {
      if (!window.confirm('確定要重新定級嗎？段位、棋力分與段位賽紀錄都會清除（戰績與棋譜保留）。')) return;
      var cur = statsLoad();
      cur.rank = Rank.reset();
      statsSave(cur);
      toast('已重設段位，下一盤段位賽重新定級');
      route();
      return;
    }
    if (t.hasAttribute('data-stats-reset')) {
      if (!window.confirm('確定要清除所有勝負戰績嗎？（棋譜與段位不會被刪除）')) return;
      statsSave(Stats.reset(statsLoad()));
      play.counted = null;
      if (play.game) persistPlay();
      toast('已清除戰績');
      route();
    } else if (t.hasAttribute('data-act')) onPlayAction(t.getAttribute('data-act'));
    else if (t.hasAttribute('data-ract')) onReplayAction(t.getAttribute('data-ract'));
    else if (t.hasAttribute('data-goto')) { stopAuto(); replayGoto(+t.getAttribute('data-goto')); }
    else if (t.hasAttribute('data-del')) {
      var id = t.getAttribute('data-del');
      if (!window.confirm('確定要刪除這筆棋譜嗎？')) return;
      save(KEY_GAMES, savedGames().filter(function (g) { return g.id !== id; }));
      if (replay.rec && replay.rec.id === 'my-' + id) {
        if (location.hash === '#/replay') renderReplay(''); else location.hash = '#/replay';
      } else {
        document.getElementById('rpLists').innerHTML = replayListHtml(replay.rec ? replay.rec.id : '');
      }
    }
  });

  main.addEventListener('change', function (ev) {
    var id = ev.target.id;
    if (id !== 'oppSel' && id !== 'sideSel' && id !== 'modeSel' && id !== 'hcSel') return;
    var g = play.game;
    var val = +ev.target.value;
    function revert() {
      document.getElementById('oppSel').value = String(play.ai);
      document.getElementById('sideSel').value = String(play.human);
      document.getElementById('hcSel').value = String(prefs.handicap || 0);
      refreshPlay();
    }
    var restart = ratedLive() && g.history.length > 0;
    if (restart && !leaveRated('更改對局設定')) { revert(); return; }
    if (id === 'modeSel' && val === 1 && !restart && (!E.isStandardStart(g.startFen) || (g.history.length && !g.result()))) {
      if (!window.confirm('段位賽需從分先新局開始。要放棄目前這局嗎？')) { revert(); return; }
      restart = true;
    }
    if (id === 'hcSel' && !restart && (g.history.length > 0 || !g.result())) {
      if (g.history.length > 0 && !g.result() && !window.confirm('更改讓子需重新開局，確定嗎？')) { revert(); return; }
      restart = true;
    }
    stopThinking();
    if (id === 'oppSel') {
      play.ai = val;
    } else if (id === 'sideSel') {
      play.human = val === E.WHITE ? E.WHITE : E.BLACK;
    } else if (id === 'modeSel') {
      prefs.rated = val === 1;
      if (prefs.rated) prefs.handicap = 0;
      savePrefs();
      if (!prefs.rated) play.rated = false;
    } else if (id === 'hcSel') {
      prefs.handicap = val;
      if (val >= 2) { prefs.rated = false; play.rated = false; }
      savePrefs();
    }
    if (restart || (id === 'hcSel')) startGame(makeFreshGame());
    else { syncRated(); persistPlay(); }
    refreshPlay();
    maybeAiMove();
  });

  main.addEventListener('input', function (ev) {
    if (ev.target.id === 'rpSlider') { stopAuto(); replayGoto(+ev.target.value); }
  });

  window.addEventListener('keydown', function (ev) {
    if (document.body.getAttribute('data-view') !== 'replay') return;
    var tag = ev.target && ev.target.tagName;
    if (tag === 'TEXTAREA' || tag === 'INPUT') return;
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); onReplayAction('prev'); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); onReplayAction('next'); }
  });

  function initReleaseModal() {
    var btn = document.getElementById('versionBadgeBtn');
    var modal = document.getElementById('releaseModal');
    var body = document.getElementById('releaseModalBody');
    var data = window.WEIQI_RELEASES || { current_version: '1.0.0', releases: [] };
    document.getElementById('verText').textContent = 'v' + data.current_version;
    function close() { modal.hidden = true; }
    btn.addEventListener('click', function () {
      body.innerHTML = (data.releases || []).map(function (r) {
        return '<div class="rel-item"><div class="rel-head"><span class="rel-ver">v' + esc(r.version) + '</span>' +
          '<span class="rel-date">' + esc(r.date) + '</span></div><h3>' + esc(r.title) + '</h3><ul>' +
          (r.changes || []).map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>';
      }).join('') || '<p class="muted">尚無版本紀錄。</p>';
      modal.hidden = false;
    });
    document.getElementById('closeReleaseModalBtn').addEventListener('click', close);
    modal.addEventListener('click', function (ev) { if (ev.target === modal) close(); });
    window.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !modal.hidden) close(); });
  }

  window.WQApp = {
    main: main, esc: esc, load: load, save: save, toast: toast, prefs: prefs, copyText: copyText,
    campusAct: campusAct, moveListHtml: moveListHtml, sideName: sideName, buildMoveNums: buildMoveNums,
    upsertSaved: upsertSaved, statsLoad: statsLoad, statsSave: statsSave, statsCardHtml: statsCardHtml,
  };

  function init() {
    initReleaseModal();
    refreshRankPill();
    window.addEventListener('hashchange', route);
    route();
    if (window.CampusNav && typeof window.CampusNav.wire === 'function') window.CampusNav.wire();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

  </script>
