// === js/board.js ===
// ============================================================================
// ⚫ 圍棋學院 — 日向本榧木與那智黑／蛤碁石 SVG 棋盤元件（支援 9 / 13 / 19 路）
//
// WQBoard.create(host, { onPoint }) 回傳 { render(state), destroy() }。
// state：{
//   size: 9 | 13 | 19,
//   board: Int8Array(size * size),
//   last: 最後落子交叉點或 -1,
//   hint: 提示交叉點或 -1,
//   dots: [交叉點, ...]（教學與規則頁的氣點／急所圓點）,
//   targets: [交叉點, ...]（死活題目標棋筋標示）,
//   moveNums: { [sq]: 手數 }（開啟手數顯示或回放時標示在棋子上）,
//   terrMap: Int8Array | null（形勢判斷或點目時的領地歸屬：1 黑、2 白）,
//   dead: Uint8Array | null（點目時判死的殘子，打上紅叉並半透明顯示）,
//   hoverColor: 1 | 2 | 0（滑鼠移到空交叉點時預覽哪一色虛影碁石）,
//   interactive: boolean
// }
// 每個 SVG 實例使用獨立 uid 前綴定義漸層，避免單頁多個示範棋盤 ID 衝突。
// ============================================================================

(function () {
  'use strict';
  var E = window.WQEngine;
  var NS = 'http://www.w3.org/2000/svg';
  var W = 680;
  var _seq = 0;

  function el(name, attrs, text) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  /** 依棋盤路數計算邊距、格距與碁石半徑，確保 9/13/19 路比例都舒展大方。 */
  function metrics(sz) {
    var pad = sz === 9 ? 62 : (sz === 13 ? 52 : 44);
    var span = W - pad * 2;
    var step = span / (sz - 1);
    var r = step * 0.472;
    return { sz: sz, pad: pad, step: step, r: r };
  }

  function create(host, opts) {
    opts = opts || {};
    var uid = 'wqbd' + (++_seq);
    var svg = el('svg', {
      viewBox: '0 0 ' + W + ' ' + W,
      class: 'wq-board',
      role: 'img',
      'aria-label': '圍棋棋盤',
    });

    // 定義日向本榧木紋、那智黑石與蛤碁石立體光澤漸層
    var defs = el('defs', {});
    defs.innerHTML =
      '<linearGradient id="' + uid + '-frame" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0%" stop-color="#7c5624"/><stop offset="50%" stop-color="#5d3f18"/><stop offset="100%" stop-color="#432c0f"/>' +
      '</linearGradient>' +
      '<linearGradient id="' + uid + '-kaya" x1="0.1" y1="0" x2="0.9" y2="1">' +
        '<stop offset="0%" stop-color="#e5bd72"/><stop offset="48%" stop-color="#dbb060"/><stop offset="100%" stop-color="#cca04e"/>' +
      '</linearGradient>' +
      '<radialGradient id="' + uid + '-black" cx="33%" cy="30%" r="68%">' +
        '<stop offset="0%" stop-color="#5d6670"/>' +
        '<stop offset="28%" stop-color="#262c32"/>' +
        '<stop offset="78%" stop-color="#111518"/>' +
        '<stop offset="100%" stop-color="#07090b"/>' +
      '</radialGradient>' +
      '<radialGradient id="' + uid + '-white" cx="32%" cy="28%" r="70%">' +
        '<stop offset="0%" stop-color="#ffffff"/>' +
        '<stop offset="52%" stop-color="#f7f5ed"/>' +
        '<stop offset="86%" stop-color="#e2ddd0"/>' +
        '<stop offset="100%" stop-color="#cbc4b3"/>' +
      '</radialGradient>';
    svg.appendChild(defs);

    // 外層深木包框與本榧木盤面
    svg.appendChild(el('rect', { x: 2, y: 2, width: W - 4, height: W - 4, rx: 14, fill: 'url(#' + uid + '-frame)' }));
    svg.appendChild(el('rect', { x: 8, y: 8, width: W - 16, height: W - 16, rx: 10, fill: 'url(#' + uid + '-kaya)', stroke: '#9b7131', 'stroke-width': 1.4 }));

    // 本榧直木目（細緻縱向木紋）與四角竹節雅飾
    var grainLayer = el('g', { opacity: '0.13', 'pointer-events': 'none' });
    for (var gx = 20; gx < W - 18; gx += 13) {
      var wv = ((gx * 7) % 5) - 2;
      grainLayer.appendChild(el('path', {
        d: 'M' + gx + ',10 Q' + (gx + wv) + ',' + (W / 2) + ' ' + gx + ',' + (W - 10),
        fill: 'none', stroke: '#6e4715', 'stroke-width': (gx % 26 === 0 ? '1.1' : '0.65'),
      }));
    }
    // 四角古雅內框細飾線
    var cornerD = 'M15,29 V15 H29 M' + (W - 29) + ',15 H' + (W - 15) + ' V29 M15,' + (W - 29) + ' V' + (W - 15) + ' H29 M' + (W - 29) + ',' + (W - 15) + ' H' + (W - 15) + ' V' + (W - 29);
    grainLayer.appendChild(el('path', { d: cornerD, fill: 'none', stroke: '#4a300e', 'stroke-width': '1.8', opacity: '0.85' }));
    svg.appendChild(grainLayer);

    var gridLayer = el('g', {});
    var labelLayer = el('g', {});
    var underMarkLayer = el('g', {});
    var stoneLayer = el('g', {});
    var overMarkLayer = el('g', {});
    var hoverLayer = el('g', {});
    svg.appendChild(gridLayer);
    svg.appendChild(labelLayer);
    svg.appendChild(underMarkLayer);
    svg.appendChild(stoneLayer);
    svg.appendChild(overMarkLayer);
    svg.appendChild(hoverLayer);

    host.innerHTML = '';
    host.appendChild(svg);

    var state = null;
    var curSize = 0;
    var M = null;
    var hoverSq = -1;

    function ptOf(sq) {
      var r = (sq / M.sz) | 0, c = sq % M.sz;
      return [M.pad + c * M.step, M.pad + r * M.step];
    }

    function drawStaticGrid(sz) {
      curSize = sz;
      M = metrics(sz);
      gridLayer.innerHTML = '';
      labelLayer.innerHTML = '';

      var p0 = M.pad, p1 = W - M.pad;
      // 外框線微粗，內格線俐落
      gridLayer.appendChild(el('rect', {
        x: p0, y: p0, width: p1 - p0, height: p1 - p0,
        fill: 'none', class: 'wq-grid-line', 'stroke-width': '2.1',
      }));
      for (var i = 1; i < sz - 1; i++) {
        var pos = p0 + i * M.step;
        gridLayer.appendChild(el('line', { x1: pos, y1: p0, x2: pos, y2: p1, class: 'wq-grid-line', 'stroke-width': '1.2' }));
        gridLayer.appendChild(el('line', { x1: p0, y1: pos, x2: p1, y2: pos, class: 'wq-grid-line', 'stroke-width': '1.2' }));
      }

      // 星位與天元
      var starR = sz === 9 ? 4.4 : (sz === 13 ? 4.0 : 3.6);
      E.starCoords(sz).forEach(function (rc) {
        gridLayer.appendChild(el('circle', {
          cx: p0 + rc[1] * M.step, cy: p0 + rc[0] * M.step, r: starR, class: 'wq-star',
        }));
      });

      // 四周座標標示（A–T 跳過 I，1–19）
      var fSize = sz === 19 ? 12.5 : (sz === 13 ? 13.5 : 14.5);
      var off = sz === 9 ? 34 : (sz === 13 ? 28 : 24);
      for (var k = 0; k < sz; k++) {
        var cx = p0 + k * M.step;
        var cy = p0 + k * M.step;
        var colTxt = E.COLS[k];
        var rowTxt = String(sz - k);
        labelLayer.appendChild(el('text', { x: cx, y: p0 - off, 'font-size': fSize, class: 'wq-coord' }, colTxt));
        labelLayer.appendChild(el('text', { x: cx, y: p1 + off, 'font-size': fSize, class: 'wq-coord' }, colTxt));
        labelLayer.appendChild(el('text', { x: p0 - off, y: cy, 'font-size': fSize, class: 'wq-coord' }, rowTxt));
        labelLayer.appendChild(el('text', { x: p1 + off, y: cy, 'font-size': fSize, class: 'wq-coord' }, rowTxt));
      }
    }

    function drawStone(layer, sq, color, isDead, isGhost) {
      var pt = ptOf(sq);
      var cx = pt[0], cy = pt[1], r = M.r;
      var g = el('g', isGhost ? { class: 'wq-hover' } : (isDead ? { opacity: '0.46' } : {}));
      if (!isGhost) {
        g.appendChild(el('circle', { cx: cx + r * 0.08, cy: cy + r * 0.12, r: r * 0.98, class: 'wq-stone-shadow' }));
      }
      g.appendChild(el('circle', {
        cx: cx, cy: cy, r: r,
        fill: 'url(#' + uid + (color === E.BLACK ? '-black' : '-white') + ')',
        stroke: color === E.BLACK ? '#090c0e' : '#aba495',
        'stroke-width': color === E.BLACK ? '0.6' : '0.9',
      }));
      // 蛤碁石微細縞目貝殼弧紋
      if (color === E.WHITE && !isGhost && r >= 13) {
        var arcD = 'M' + (cx - r * 0.55).toFixed(1) + ',' + (cy - r * 0.25).toFixed(1) +
          ' Q' + cx.toFixed(1) + ',' + (cy - r * 0.52).toFixed(1) + ' ' + (cx + r * 0.55).toFixed(1) + ',' + (cy - r * 0.18).toFixed(1) +
          ' M' + (cx - r * 0.62).toFixed(1) + ',' + (cy + r * 0.12).toFixed(1) +
          ' Q' + cx.toFixed(1) + ',' + (cy - r * 0.14).toFixed(1) + ' ' + (cx + r * 0.60).toFixed(1) + ',' + (cy + r * 0.18).toFixed(1);
        g.appendChild(el('path', {
          d: arcD, fill: 'none', stroke: '#cfc9b8', 'stroke-width': '0.75', opacity: '0.55', 'pointer-events': 'none',
        }));
      }
      layer.appendChild(g);
    }

    function refreshHover() {
      hoverLayer.innerHTML = '';
      if (!state || !state.hoverColor || hoverSq < 0) return;
      if (state.board[hoverSq] !== E.EMPTY) return;
      drawStone(hoverLayer, hoverSq, state.hoverColor, false, true);
    }

    function render(next) {
      state = next;
      var sz = state.size || 19;
      if (sz !== curSize) drawStaticGrid(sz);

      underMarkLayer.innerHTML = '';
      stoneLayer.innerHTML = '';
      overMarkLayer.innerHTML = '';

      var b = state.board;
      var dead = state.dead || null;
      var terr = state.terrMap || null;
      var n = sz * sz;
      var sq, pt;

      // 教學綠點（空點氣位／急所標記）
      (state.dots || []).forEach(function (dsq) {
        if (dsq < 0 || dsq >= n) return;
        pt = ptOf(dsq);
        underMarkLayer.appendChild(el('circle', { cx: pt[0], cy: pt[1], r: Math.max(5.5, M.r * 0.34), class: 'wq-mk-dot' }));
      });

      // 棋子本體
      for (sq = 0; sq < n; sq++) {
        if (!b[sq]) continue;
        drawStone(stoneLayer, sq, b[sq], !!(dead && dead[sq]), false);
      }

      // 死子紅叉與領地小方印
      if (terr) {
        var boxR = Math.max(4.2, M.r * 0.30);
        for (sq = 0; sq < n; sq++) {
          pt = ptOf(sq);
          if (dead && dead[sq] && b[sq]) {
            var d = M.r * 0.45;
            overMarkLayer.appendChild(el('path', {
              d: 'M' + (pt[0] - d) + ',' + (pt[1] - d) + ' L' + (pt[0] + d) + ',' + (pt[1] + d) +
                 ' M' + (pt[0] + d) + ',' + (pt[1] - d) + ' L' + (pt[0] - d) + ',' + (pt[1] + d),
              class: 'wq-dead-x',
            }));
          }
          // 在空點（或已被判死的殘子格）畫上領地歸屬小方印
          if ((b[sq] === E.EMPTY || (dead && dead[sq])) && (terr[sq] === E.BLACK || terr[sq] === E.WHITE)) {
            overMarkLayer.appendChild(el('rect', {
              x: pt[0] - boxR, y: pt[1] - boxR, width: boxR * 2, height: boxR * 2, rx: 1.8,
              class: terr[sq] === E.BLACK ? 'wq-terr-b' : 'wq-terr-w',
            }));
          }
        }
      }

      // 死活題目標棋筋外框提示（小三角標記在目標棋子上，幫助看清要救哪塊或殺哪塊）
      (state.targets || []).forEach(function (tsq) {
        if (tsq < 0 || tsq >= n || !b[tsq]) return;
        pt = ptOf(tsq);
        var tr = M.r * 0.42;
        var pStr = pt[0] + ',' + (pt[1] - tr) + ' ' + (pt[0] - tr * 0.87).toFixed(1) + ',' + (pt[1] + tr * 0.5).toFixed(1) + ' ' + (pt[0] + tr * 0.87).toFixed(1) + ',' + (pt[1] + tr * 0.5).toFixed(1);
        overMarkLayer.appendChild(el('polygon', {
          points: pStr,
          fill: 'none',
          stroke: b[tsq] === E.BLACK ? '#fbbf24' : '#b45309',
          'stroke-width': '2',
          'pointer-events': 'none',
        }));
      });

      // 手數編號或最後一手圓環
      var moveNums = state.moveNums || null;
      if (moveNums) {
        var numFont = sz === 19 ? 11 : (sz === 13 ? 13.5 : 16);
        for (sq = 0; sq < n; sq++) {
          if (!b[sq] || !moveNums[sq]) continue;
          pt = ptOf(sq);
          overMarkLayer.appendChild(el('text', {
            x: pt[0], y: pt[1] + 0.5, 'font-size': numFont,
            class: b[sq] === E.BLACK ? 'wq-num-b' : 'wq-num-w',
          }, String(moveNums[sq])));
        }
      } else if (state.last >= 0 && state.last < n && b[state.last]) {
        pt = ptOf(state.last);
        overMarkLayer.appendChild(el('circle', {
          cx: pt[0], cy: pt[1], r: M.r * 0.40,
          class: b[state.last] === E.BLACK ? 'wq-last-b' : 'wq-last-w',
        }));
      }

      // AI 提示選點光圈
      if (state.hint >= 0 && state.hint < n) {
        pt = ptOf(state.hint);
        overMarkLayer.appendChild(el('circle', { cx: pt[0], cy: pt[1], r: M.r * 0.78, class: 'wq-mk-hint' }));
      }

      refreshHover();
    }

    function eventToSq(ev) {
      if (!M) return -1;
      var rect = svg.getBoundingClientRect();
      if (!rect.width) return -1;
      var x = (ev.clientX - rect.left) * W / rect.width;
      var y = (ev.clientY - rect.top) * W / rect.height;
      var c = Math.round((x - M.pad) / M.step);
      var r = Math.round((y - M.pad) / M.step);
      if (r < 0 || r >= M.sz || c < 0 || c >= M.sz) return -1;
      // 距離交叉點太遠（大於 0.48 格）時不算誤觸邊框
      var dx = Math.abs(x - (M.pad + c * M.step));
      var dy = Math.abs(y - (M.pad + r * M.step));
      if (dx > M.step * 0.49 || dy > M.step * 0.49) return -1;
      return r * M.sz + c;
    }

    function onClick(ev) {
      if (!state || !opts.onPoint) return;
      var sq = eventToSq(ev);
      if (sq >= 0) opts.onPoint(sq);
    }

    function onMove(ev) {
      if (!state || !state.hoverColor || ev.pointerType === 'touch') return;
      var sq = eventToSq(ev);
      if (sq !== hoverSq) {
        hoverSq = sq;
        refreshHover();
      }
    }

    function onLeave() {
      if (hoverSq !== -1) {
        hoverSq = -1;
        refreshHover();
      }
    }

    svg.addEventListener('click', onClick);
    svg.addEventListener('pointermove', onMove);
    svg.addEventListener('pointerleave', onLeave);

    return {
      render: render,
      destroy: function () {
        svg.removeEventListener('click', onClick);
        svg.removeEventListener('pointermove', onMove);
        svg.removeEventListener('pointerleave', onLeave);
        host.innerHTML = '';
      },
    };
  }

  window.WQBoard = { create: create, W: W, H: W, metrics: metrics };
})();


// === js/study.js ===
// ============================================================================
// ⚫ 圍棋學院 — 死活與手筋題庫（#/puzzle）與互動圖解課程（#/learn）
//
// 做題規則：照著急所一步一步落子，對方的最強抵抗由題目自動應出。
//   支援 🏠 死活（做活／殺棋／劫活／雙活）與 ⚡ 手筋（叫吃／雙叫吃／征子／枷吃／撲與倒撲／接不歸／對殺）。
//   走錯時不會把子留在盤上，可重新思考；一次都沒走錯、沒用提示、沒看解答即可拿到 ⭐ 完美。
//   進度存在 localStorage（wq.puzzle.v1、wq.learn.v1）。
// ============================================================================

(function () {
  'use strict';
  var E = window.WQEngine;
  var NT = window.WQNotation;
  var App = null;
  var KEY_PUZZLE = 'wq.puzzle.v1';
  var KEY_LEARN = 'wq.learn.v1';
  var LEVEL_NAMES = { 1: '入門', 2: '進階', 3: '挑戰' };
  var LEVEL_DESC = { 1: '一手急所', 2: '三手閱讀', 3: '多手深算' };

  function puzzles() { return window.WQ_PUZZLES || []; }
  function units() { return window.WQ_UNITS || []; }
  function esc(s) { return App.esc(s); }

  function goalText(p) {
    var who = p.side === 'w' ? '白' : '黑';
    if (p.goal === 'live') return who + '先做活：守住標示 △ 的己方棋塊，做出兩眼或吃掉破眼子';
    if (p.goal === 'kill') return who + '先殺棋：點入急所縮小或破壞標示 △ 敵棋的眼位';
    return who + '先手筋：運用吃子或緊氣手筋拿下標示 △ 的敵方要子';
  }
  function goalShort(p) {
    if (p.goal === 'live') return '做活';
    if (p.goal === 'kill') return '殺棋';
    return '手筋吃子';
  }

  function progress() {
    var p = App.load(KEY_PUZZLE, {});
    return p && typeof p === 'object' ? p : {};
  }
  function setProgress(id, patch) {
    var all = progress();
    var cur = all[id] || { s: 0 };
    if (patch.s && patch.s > (cur.s || 0)) cur.s = patch.s;
    if (patch.seen) cur.seen = true;
    all[id] = cur;
    App.save(KEY_PUZZLE, all);
  }
  function statusIcon(st) {
    if (!st) return '';
    if (st.s === 2) return '⭐';
    if (st.s === 1) return '✅';
    return st.seen ? '👀' : '';
  }

  var listFilter = { level: 0, tag: '', kind: '' }; // kind: '' | 'life' | 'tesuji'

  function isTesuji(p) { return p.kind === 'tesuji' || p.goal === 'capture'; }
  function allTags() {
    var count = {};
    puzzles().forEach(function (p) {
      (p.tags || []).forEach(function (t) { count[t] = (count[t] || 0) + 1; });
    });
    return Object.keys(count).sort(function (a, b) { return count[b] - count[a]; }).map(function (t) {
      return { tag: t, n: count[t] };
    });
  }
  function tagPills(p) {
    return (p.tags || []).slice(0, 3).map(function (t) {
      return '<span class="pz-tag' + (isTesuji(p) ? ' is-tesuji' : '') + '">' + esc(t) + '</span>';
    }).join('');
  }

  function renderPuzzleList(tag) {
    if (tag !== undefined) listFilter.tag = tag;
    var prog = progress();
    var all = puzzles();
    var stars = 0, passed = 0;
    all.forEach(function (p) {
      var st = prog[p.id];
      if (st && st.s === 2) stars++;
      if (st && st.s >= 1) passed++;
    });
    var shown = all.filter(function (p) {
      if (listFilter.level && p.level !== listFilter.level) return false;
      if (listFilter.tag && (p.tags || []).indexOf(listFilter.tag) < 0) return false;
      if (listFilter.kind === 'tesuji' && !isTesuji(p)) return false;
      if (listFilter.kind === 'life' && isTesuji(p)) return false;
      return true;
    });
    var tesujiCount = all.filter(isTesuji).length;
    var lifeCount = all.length - tesujiCount;
    function seg(act, v, label, on) {
      return '<button type="button" class="seg-btn' + (on ? ' is-on' : '') + '" data-sact="' + act + '" data-v="' + v + '">' + label + '</button>';
    }

    var html = '<div class="study-wrap">' +
      '<section class="card pz-head">' +
        '<div><h1>死活與手筋題庫</h1>' +
        '<p class="muted">共 ' + all.length + ' 題：' + lifeCount + ' 題「死活」（直三、曲三、丁四、刀把五、梅花五、破眼殺棋、劫爭與雙活），' +
          tesujiCount + ' 題「吃子手筋與對殺」（雙叫吃、征子、枷吃、撲與倒撲、接不歸、對殺緊氣），全數經本院局部搜尋引擎驗證正解。</p></div>' +
        '<div class="pz-score"><span class="pz-score-main">⭐ ' + stars + '<small> / ' + all.length + '</small></span>' +
        '<span class="muted">✅ 過關 ' + passed + ' 題</span></div>' +
      '</section>' +
      '<section class="card pz-filters">' +
        '<div class="seg" role="group" aria-label="類型">' +
          seg('kind', '', '全部', !listFilter.kind) +
          seg('kind', 'life', '🏠 死活（' + lifeCount + '）', listFilter.kind === 'life') +
          seg('kind', 'tesuji', '⚡ 手筋（' + tesujiCount + '）', listFilter.kind === 'tesuji') +
        '</div>' +
        '<div class="seg" role="group" aria-label="難度">' +
          [0, 1, 2, 3].map(function (lv) {
            return seg('level', lv, lv ? LEVEL_NAMES[lv] + '<small>' + LEVEL_DESC[lv] + '</small>' : '全部', listFilter.level === lv);
          }).join('') +
        '</div>' +
        '<label class="pz-select">主題<select id="pzTag"><option value="">全部</option>' +
          allTags().map(function (t) {
            return '<option value="' + esc(t.tag) + '"' + (t.tag === listFilter.tag ? ' selected' : '') + '>' + esc(t.tag) + '（' + t.n + '）</option>';
          }).join('') + '</select></label>' +
      '</section>';

    if (!shown.length) {
      html += '<section class="card"><p class="muted">沒有符合篩選條件的題目，請調整上方篩選。</p></section>';
    }
    [1, 2, 3].forEach(function (lv) {
      var group = shown.filter(function (p) { return p.level === lv; });
      if (!group.length) return;
      html += '<section class="card"><div class="card-head"><h2>' + LEVEL_NAMES[lv] + '・' + LEVEL_DESC[lv] + '</h2>' +
        '<span class="count-pill">' + group.length + ' 題</span></div><div class="pz-grid">' +
        group.map(function (p) {
          var st = prog[p.id];
          return '<a class="pz-card' + (st && st.s ? ' is-done' : '') + '" href="#/puzzle/' + esc(p.id) + '">' +
            '<span class="pz-card-top"><span class="pz-n">' + (p.side === 'w' ? '白先' : '黑先') + '・' + goalShort(p) + '</span><span class="pz-st">' + statusIcon(st) + '</span></span>' +
            '<strong>' + esc(p.name) + '</strong>' +
            '<small>' + tagPills(p) + '</small></a>';
        }).join('') + '</div></section>';
    });
    html += '<p class="muted pz-credit">棋盤上標示 △ 的棋子是本題關鍵目標。想先了解急所口訣（「敵之要點即我之要點」、「二子頭必扳」），可先到「📚 課程」觀看逐步圖解。</p></div>';
    App.main.innerHTML = html;
  }

  var pz = null;
  var replyTimer = 0;

  function stopPuzzle() {
    if (replyTimer) { clearTimeout(replyTimer); replyTimer = 0; }
    if (pz) pz.busy = false;
  }

  function findPuzzle(id) {
    var all = puzzles();
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return { p: all[i], idx: i };
    return null;
  }

  function newAttempt(p, idx) {
    pz = {
      p: p, idx: idx, game: new E.Game(p.fen), step: 0,
      board: pz && pz.p === p ? pz.board : null,
      busy: false, hint: -1, aided: false, wrong: 0, wrongText: '', done: false,
    };
  }

  function mySide() { return pz.p.side === 'w' ? E.WHITE : E.BLACK; }

  function renderPuzzle(id) {
    var found = findPuzzle(id);
    if (!found) { renderPuzzleList(); return; }
    stopPuzzle();
    pz = null;
    newAttempt(found.p, found.idx);
    var p = found.p;
    App.main.innerHTML =
      '<div class="wq-stage">' +
        '<div class="wq-board-col"><div class="wq-board-wrap" id="pzBoard"></div></div>' +
        '<aside class="wq-side">' +
          '<section class="card">' +
            '<div class="card-head"><h2>' + esc(p.name) + '</h2><span class="pz-goal is-' + p.goal + '">' + goalShort(p) + '</span></div>' +
            '<p><strong>' + esc(goalText(p)) + '</strong></p>' +
            '<p class="muted">' + LEVEL_NAMES[p.level] + '・<span class="pz-tags" style="display:inline-flex">' + tagPills(p) + '</span></p>' +
            '<div id="pzStatus" class="pz-status"></div>' +
          '</section>' +
          '<section class="card">' +
            '<div class="btn-grid">' +
              '<button type="button" class="btn btn-kaya" data-sact="pz-hint">💡 提示急所</button>' +
              '<button type="button" class="btn" data-sact="pz-retry">🔁 重擺</button>' +
              '<button type="button" class="btn" data-sact="pz-solution">📜 看正解圖</button>' +
            '</div>' +
            '<p class="muted pz-rule">直接點擊交叉點落子，對方會自動走出最強抵抗。一次都沒下錯、沒用提示也沒看過正解圖即可獲得 ⭐ 完美認證。</p>' +
          '</section>' +
          '<section class="card">' +
            '<div class="card-head"><h2>手順紀錄</h2></div>' +
            '<div class="mv-scroll" id="pzMoves"></div>' +
          '</section>' +
          '<div class="pz-nav">' +
            '<a class="btn" href="#/puzzle">← 回題庫</a>' +
            (found.idx + 1 < puzzles().length
              ? '<a class="btn btn-primary" href="#/puzzle/' + esc(puzzles()[found.idx + 1].id) + '">下一題 →</a>' : '') +
          '</div>' +
        '</aside>' +
      '</div>';
    pz.board = window.WQBoard.create(document.getElementById('pzBoard'), { onPoint: onPuzzlePoint });
    refreshPuzzle();
  }

  function refreshPuzzle() {
    if (!pz || !document.getElementById('pzStatus')) return;
    var g = pz.game;
    var sz = g.size();
    var tSqs = (pz.p.targets || []).map(function (s) { return E.strToSq(s, sz); });
    pz.board.render({
      size: sz,
      board: g.pos.board,
      last: g.lastStone(),
      hint: pz.hint,
      targets: tSqs,
      hoverColor: !pz.done && !pz.busy && g.turn() === mySide() ? mySide() : 0,
    });

    var st = progress()[pz.p.id] || {};
    var total = Math.ceil(pz.p.line.length / 2);
    var html;
    if (pz.done) {
      var perfect = !pz.wrong && !pz.aided && !pz.seenAtStart;
      var winMsg = pz.p.goal === 'live' ? '成功守住急所，做出活形！'
        : (pz.p.goal === 'kill' ? '精準點破眼位，敵棋已死！' : '手筋妙手命中，成功拿下要子！');
      html = '<div class="status-result">' + (perfect ? '⭐ 完美解開！' : '✅ 過關') + '</div>' +
        '<p class="muted">' + winMsg +
        (perfect ? '' : (pz.wrong ? '（嘗試失誤 ' + pz.wrong + ' 次；' : '（') + '未用提示且零失誤可拿 ⭐，歡迎按「重擺」再挑戰）') + '</p>';
    } else if (pz.busy) {
      html = '<div class="status-turn ' + (mySide() === E.WHITE ? '' : 'is-white') + '"><span class="turn-dot"></span>對方應手中…</div>';
    } else {
      html = '<div class="status-turn ' + (mySide() === E.WHITE ? 'is-white' : '') + '"><span class="turn-dot"></span>輪到你下（' + App.sideName(mySide()) + '）</div>' +
        '<p class="muted">第 ' + (Math.floor(pz.step / 2) + 1) + ' / ' + total + ' 手' +
        (st.s === 2 ? '・已拿過 ⭐' : st.seen ? '・已看過正解，最多 ✅' : '') + '</p>' +
        (pz.wrongText ? '<p class="pz-wrong">✗ ' + esc(pz.wrongText) + '</p>' : '');
    }
    document.getElementById('pzStatus').innerHTML = html;
    var box = document.getElementById('pzMoves');
    box.innerHTML = App.moveListHtml(g, g.history.length, false);
    box.scrollTop = box.scrollHeight;
    var q = function (a) { return App.main.querySelector('[data-sact="' + a + '"]'); };
    q('pz-hint').disabled = pz.done || pz.busy;
    q('pz-retry').disabled = !g.history.length && !pz.wrong;
  }

  function finishPuzzle() {
    pz.done = true;
    pz.busy = false;
    var perfect = !pz.wrong && !pz.aided && !pz.seenAtStart;
    setProgress(pz.p.id, { s: perfect ? 2 : 1 });
    App.campusAct();
  }

  function advance() {
    var line = pz.p.line;
    var sz = pz.game.size();
    pz.hint = -1;
    pz.wrongText = '';
    if (pz.step >= line.length || pz.game.result()) { finishPuzzle(); refreshPuzzle(); return; }
    var mine = pz;
    pz.busy = true;
    refreshPuzzle();
    replyTimer = setTimeout(function () {
      replyTimer = 0;
      if (pz !== mine || !mine.busy) return;
      mine.busy = false;
      mine.game.play(E.strToMove(line[mine.step], sz));
      mine.step++;
      if (mine.step >= line.length || mine.game.result()) finishPuzzle();
      refreshPuzzle();
    }, 420);
  }

  function onPuzzlePoint(sq) {
    var g = pz.game;
    if (pz.done || pz.busy || g.turn() !== mySide()) return;
    if (!g.isLegal(sq)) {
      if (g.pos.board[sq] === E.EMPTY) {
        App.toast(sq === g.pos.ko ? '此點正在打劫，需隔一手才能提回' : '此點氣盡為禁著點（禁止自殺）');
      }
      return;
    }
    var sz = g.size();
    var want = E.strToMove(pz.p.line[pz.step], sz);
    var altOk = pz.step === 0 && Array.isArray(pz.p.accept) && pz.p.accept.indexOf(E.sqToStr(sq, sz)) >= 0;
    if (sq !== want && !altOk) {
      pz.wrong++;
      pz.wrongText = E.sqToStr(sq, sz) + ' 不是本題急所，再細算氣數與眼位看看！';
      refreshPuzzle();
      return;
    }
    g.play(sq);
    if (sq !== want && altOk) {
      // 對稱等價正解第一手走完直接過關（或對齊步數）
      pz.step = pz.p.line.length;
    } else {
      pz.step++;
    }
    advance();
  }

  function onPuzzleAction(act) {
    if (act === 'pz-retry') {
      stopPuzzle();
      var seen = !!(progress()[pz.p.id] || {}).seen;
      newAttempt(pz.p, pz.idx);
      pz.seenAtStart = seen;
      refreshPuzzle();
    } else if (act === 'pz-hint') {
      if (pz.done || pz.busy) return;
      var sz = pz.game.size();
      var want = E.strToMove(pz.p.line[pz.step], sz);
      pz.aided = true;
      pz.hint = want;
      App.toast('急所提示：試試看 ' + E.sqToStr(want, sz));
      refreshPuzzle();
    } else if (act === 'pz-solution') {
      setProgress(pz.p.id, { seen: true });
      location.hash = '#/replay/puzzle-' + pz.p.id;
    }
  }

  // ------------------------------------------------------------------ 課程
  function learned() {
    var d = App.load(KEY_LEARN, {});
    return d && typeof d === 'object' ? d : {};
  }
  function flatLessons() {
    var out = [];
    units().forEach(function (u) { u.lessons.forEach(function (l) { out.push({ unit: u, lesson: l }); }); });
    return out;
  }

  function renderLearnHome() {
    var done = learned();
    var all = flatLessons();
    var doneCount = all.filter(function (x) { return done[x.lesson.id]; }).length;
    App.main.innerHTML = '<div class="study-wrap">' +
      '<section class="card pz-head"><div><h1>圍棋課程</h1>' +
      '<p class="muted">共 ' + units().length + ' 大單元、' + all.length + ' 堂課：從零基礎「氣、兩眼活棋、打劫與數子點目」，一路學到「吃子手筋十訣、死活常型急所、星小目定石與 AI 點三三、形勢判斷與官子收束」。每堂課皆附可逐步播放的本榧棋盤圖解。</p></div>' +
      '<div class="pz-score"><span class="pz-score-main">' + doneCount + '<small> / ' + all.length + '</small></span><span class="muted">已修畢</span></div></section>' +
      units().map(function (u) {
        return '<section class="card"><div class="card-head"><h2>' + u.icon + ' ' + esc(u.title) + '</h2>' +
          '<span class="count-pill">' + u.lessons.length + ' 堂</span></div>' +
          '<p class="rec-desc">' + esc(u.intro) + '</p><div class="ls-grid">' +
          u.lessons.map(function (l, i) {
            return '<a class="ls-card' + (done[l.id] ? ' is-done' : '') + '" href="#/learn/' + esc(l.id) + '">' +
              '<span class="ls-no">' + (i + 1) + '</span><span class="ls-text"><strong>' + esc(l.title) + '</strong>' +
              '<small>' + esc(l.summary) + '</small></span><span class="ls-st">' + (done[l.id] ? '✓' : '') + '</span></a>';
          }).join('') + '</div></section>';
      }).join('') + '</div>';
  }

  var demos = [];

  function demoPos(dm) {
    return E.parseFen(dm.idx === 0 ? dm.game.startFen : dm.game.history[dm.idx - 1].fen);
  }

  function refreshDemo(i) {
    var dm = demos[i];
    if (!dm) return;
    var pos = demoPos(dm);
    var d = dm.d;
    var sz = pos.size;
    var dots = [];
    if (dm.idx === 0 && Array.isArray(d.dots) && d.dots.length) {
      dots = d.dots.map(function (s) { return E.strToSq(s, sz); }).filter(function (x) { return x >= 0 && x < sz * sz; });
    }
    var moveNums = null;
    if (dm.idx > 0) {
      moveNums = {};
      for (var k = 0; k < dm.idx; k++) {
        var hm = dm.game.history[k].move;
        if (hm !== E.PASS && pos.board[hm]) moveNums[hm] = k + 1;
      }
    }
    dm.board.render({
      size: sz,
      board: pos.board,
      last: dm.idx > 0 ? dm.game.history[dm.idx - 1].move : -1,
      dots: dots,
      moveNums: moveNums,
      terrMap: d.showTerritory ? E.estimateTerritory(pos).terrMap : null,
    });
    var total = dm.game.history.length;
    var info = document.getElementById('demoInfo' + i);
    if (!info || !total) return;
    var html = '';
    dm.game.history.forEach(function (h, k) {
      var lbl = (h.side === E.WHITE ? '○' : '●') + (k + 1) + ' ' + NT.formatMoveLabel(h.move, sz);
      html += '<span class="demo-mv' + (k + 1 === dm.idx ? ' is-active' : '') + '">' + esc(lbl) + '</span>';
    });
    if (dm.idx === total && d.end) {
      html += '<span class="demo-end">' + esc(d.end) + '</span>';
    }
    info.innerHTML = html;
  }

  function renderLesson(id) {
    var all = flatLessons();
    var at = -1;
    for (var i = 0; i < all.length; i++) if (all[i].lesson.id === id) at = i;
    if (at < 0) { renderLearnHome(); return; }
    var l = all[at].lesson, u = all[at].unit;
    var done = learned();
    if (!done[l.id]) { done[l.id] = 1; App.save(KEY_LEARN, done); App.campusAct(); }

    var related = l.tag ? puzzles().filter(function (p) { return (p.tags || []).indexOf(l.tag) >= 0; }).length : 0;
    var recs = window.WQ_RECORDS || [];
    var html = '<div class="study-wrap lesson">' +
      '<p class="crumb"><a href="#/learn">圍棋課程</a> › ' + u.icon + ' ' + esc(u.title) + '</p>' +
      '<section class="card"><h1>' + esc(l.title) + '</h1><p class="ls-summary">' + esc(l.summary) + '</p>' +
      (l.plain ? '<div class="ls-plain">🧒 <strong>白話比喻：</strong>' + esc(l.plain.replace(/^白話比喻[:：]\s*/, '')) + '</div>' : '') +
      (l.body || []).map(function (p) { return '<p class="ls-p">' + esc(p) + '</p>'; }).join('') +
      ((l.points || []).length
        ? '<ul class="ls-list">' + l.points.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' : '') +
      (l.tip ? '<p class="ls-tip">💡 <strong>實戰心法：</strong>' + esc(l.tip) + '</p>' : '') +
      (l.takeaway ? '<div class="ls-takeaway">📝 <strong>一句話記住：</strong>' + esc(l.takeaway.replace(/^一句話記住[:：]\s*/, '')) + '</div>' : '') +
      ((l.terms || []).length
        ? '<dl class="term-list">' + l.terms.map(function (t) {
          return '<div><dt>' + esc(t[0]) + '</dt><dd>' + esc(t[1]) + '</dd></div>';
        }).join('') + '</dl>' : '') +
      '</section>';

    (l.demos || []).forEach(function (d, k) {
      html += '<section class="card demo-card"><div class="demo-board" id="demoBoard' + k + '"></div>' +
        '<div class="demo-side"><h2>' + esc(d.title || '棋盤示範') + '</h2>' +
        '<p class="ls-p">' + esc(d.caption || '') + '</p>' +
        (d.moves
          ? '<div class="rp-controls demo-controls">' +
            '<button type="button" class="btn" data-sact="demo-first" data-v="' + k + '" aria-label="回到開始">⏮</button>' +
            '<button type="button" class="btn" data-sact="demo-prev" data-v="' + k + '" aria-label="上一手">◀</button>' +
            '<button type="button" class="btn btn-primary" data-sact="demo-next" data-v="' + k + '">下一手 ▶</button></div>' +
            '<div class="demo-info" id="demoInfo' + k + '"></div>'
          : '') +
        '</div></section>';
    });

    var links = '';
    if (related) {
      links += '<a class="btn btn-primary" href="#/puzzle/tag/' + encodeURIComponent(l.tag) + '">🧩 實戰演練「' + esc(l.tag) + '」題庫（' + related + ' 題）</a>';
    }
    (l.records || []).forEach(function (rid) {
      for (var r = 0; r < recs.length; r++) {

            '<label>我方執子<select id="onSide"><option value="rand">隨機猜先</option><option value="black">執黑（先手）</option><option value="white">執白（後手・受貼目）</option></select></label>' +
            '<label>計時設定<select id="onTc">' + Core.TIME_CONTROLS.map(function (t, i) {
              return '<option value="' + i + '"' + (i === 3 ? ' selected' : '') + '>' + esc(t.label) + '</option>';
            }).join('') + '</select></label>' +
            '<label class="pz-check"><input type="checkbox" id="onPublic" checked /> 顯示在大廳，讓其他棋友加入或觀戰</label>' +
            '<button type="button" class="btn btn-primary" data-oact="create">建立房間</button>' +
          '</div></section>' +
          '<section class="card"><h2>輸入房號入座或觀戰</h2><div class="on-form">' +
            '<label>房號<input id="onCode" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="6 碼，例如 K7M2QX" /></label>' +
            '<button type="button" class="btn" data-oact="join">進入房間</button>' +
            '<p class="muted">房間還在等待對手時會自動入座；已經開局的房間則進入旁觀模式。</p>' +
          '</div></section>' +
        '</div>' +
        '<section class="card"><div class="card-head"><h2>公開手談大廳</h2><span class="count-pill" id="onLobbyCount">0</span></div>' +
          '<div id="onLobby"><p class="muted">讀取中…</p></div></section>' +
        '<div id="onStats"></div>' +
        privacyHtml() +
      '</div>';
    drawStats();
    sweepPending();
    sweepOldRooms();
    S.stops.push(S.backend.watch(ROOT + '/lobby', function (val, err) {
      if (err) {
        var box = document.getElementById('onLobby');
        if (box) box.innerHTML = '<p class="muted">無法讀取大廳：' + esc(errText(err)) + '</p>';
        return;
      }
      S.lobby = val || {};
      drawLobby();
    }));
  }

  function drawLobby() {
    var box = document.getElementById('onLobby');
    if (!box) return;
    var now = S.backend.now();
    var rows = Object.keys(S.lobby).map(function (rid) {
      var e = S.lobby[rid] || {};
      return { rid: rid, e: e };
    }).filter(function (x) {
      return Core.normalizeId(x.rid) && x.e.at && now - x.e.at < LOBBY_MAX_AGE;
    }).sort(function (a, b) { return (a.e.st === 'waiting' ? 0 : 1) - (b.e.st === 'waiting' ? 0 : 1) || b.e.at - a.e.at; });
    document.getElementById('onLobbyCount').textContent = rows.length;
    if (!rows.length) {
      box.innerHTML = '<p class="muted">目前沒有公開等待中的對局室。歡迎建立一間，或把房號連結傳給好友手談。</p>';
      return;
    }
    box.innerHTML = '<ul class="rec-list">' + rows.map(function (x) {
      var e = x.e;
      var sz = Core.cleanSize(e.size);
      var waiting = e.st === 'waiting';
      var who = waiting
        ? Core.cleanName(e.black || e.white) + ' 等待對手（' + (e.black ? '缺白方' : '缺黑方') + '）'
        : Core.cleanName(e.black) + '（黑） vs ' + Core.cleanName(e.white) + '（白）';
      return '<li class="rec-item on-room-row"><a href="#/online/' + esc(x.rid) + '"><strong>' + esc(who) + '</strong>' +
        '<small>房號 ' + esc(x.rid) + '・' + sz + ' 路・' + esc(tcLabel(e.tc)) + '</small></a>' +
        '<a class="btn' + (waiting ? ' btn-primary' : '') + '" href="#/online/' + esc(x.rid) + '">' + (waiting ? '入座' : '觀戰') + '</a></li>';
    }).join('') + '</ul>';
  }

  function privacyHtml() {
    return '<details class="card on-privacy"><summary>🔒 隱私說明與資料保存</summary>' +
      '<ul class="plain-list">' +
        '<li><strong>免註冊、零個資</strong>：系統僅以瀏覽器匿名連線代碼辨識座位，不收集姓名、信箱或電話。</li>' +
        '<li><strong>對局同步內容</strong>：暱稱、落子座標、計時與在線狀態透過 Google Firebase 即時同步；暱稱請勿使用真實姓名。</li>' +
        '<li><strong>本機棋譜與戰績</strong>：棋譜、戰績、死活題與課程進度皆保存在本機瀏覽器，不會上傳雲端。</li>' +
        '<li><strong>過期房間自動回收</strong>：結束滿 7 天、等待逾 1 天或逾 14 天無人落子的房間，會由棋友下次進入大廳時自動清除。</li>' +
      '</ul>' +
      '<p class="muted" id="onPurgeMsg"></p></details>';
  }

  function drawStats() {
    var box = document.getElementById('onStats');
    if (box) box.innerHTML = App.statsCardHtml({ unfinished: S.unfinished });
  }

  function readOnce(path, cb) {
    var done = false;
    var off = null;
    function finish() { if (off) { off(); off = null; } }
    off = S.backend.watch(path, function (val, err) {
      if (done) return;
      done = true;
      if (off) finish(); else setTimeout(finish, 0);
      cb(val, err);
    });
    if (done) finish();
    S.stops.push(function () { done = true; finish(); });
  }

  function sweepPending() {
    var st = App.statsLoad();
    var before = Object.keys(st.pending).length;
    var rids = Stats.pendingList(st, Date.now());
    if (rids.length !== before) App.statsSave(st);
    var token = S.token;
    rids.forEach(function (rid) {
      readOnce(gPath(rid), function (val, err) {
        if (token !== S.token || err) return;
        var role = val ? Core.sideOfUid(val, S.uid) : null;
        if (val && role && val.status === 'playing') {
          S.unfinished.push({ rid: rid, name: val[Core.other(role)].name });
        } else if (val && role && val.status === 'over') {
          recordFinished(rid, val, role);
        } else {
          var cur = App.statsLoad();
          if (Stats.dropPending(cur, rid)) App.statsSave(cur);
        }
        drawStats();
      });
    });
  }

  var SWEEP_PER_VISIT = 10;
  var SWEEP_RECHECK_MS = 12 * 3600000;
  var SWEEP_MAX = 400;

  function rememberRoom(rid) {
    var p = prefs();
    if (!p.rooms || typeof p.rooms !== 'object') p.rooms = {};
    if (p.rooms[rid] !== undefined) return;
    p.rooms[rid] = 0;
    var ids = Object.keys(p.rooms);
    if (ids.length > SWEEP_MAX) ids.slice(0, ids.length - SWEEP_MAX).forEach(function (k) { delete p.rooms[k]; });
    App.save(KEY, p);
  }
  function forgetRoom(rid) {
    var p = prefs();
    if (p.rooms && p.rooms[rid] !== undefined) { delete p.rooms[rid]; App.save(KEY, p); }
  }
  function purgeRoom(rid, g) {
    var b = S.backend;
    var quiet = function () {};
    if (g.host === S.uid) b.remove(lobbyPath(rid)).catch(quiet);
    return b.remove(gPath(rid)).then(function () {
      readOnce(pPath(rid), function (val) {
        Object.keys(val || {}).forEach(function (uid) { b.remove(pPath(rid) + '/' + uid).catch(quiet); });
      });
      return true;
    }, function () { return false; });
  }
  function sweepOldRooms() {
    var p = prefs();
    var st = App.statsLoad();
    var known = (p.rooms && typeof p.rooms === 'object') ? p.rooms : (p.rooms = {});
    var added = false;
    st.rids.concat(Object.keys(st.pending)).forEach(function (rid) {
      if (known[rid] === undefined && !(p.swept && p.swept[rid])) { known[rid] = 0; added = true; }
    });
    if (added) App.save(KEY, p);
    var nowLocal = Date.now();
    var todo = Object.keys(known).filter(function (rid) {
      return Core.normalizeId(rid) === rid && nowLocal - known[rid] > SWEEP_RECHECK_MS;
    }).sort(function (a, c) { return known[a] - known[c]; }).slice(0, SWEEP_PER_VISIT);
    var token = S.token;
    var purged = 0;
    function done(rid, gone) {
      var cur = prefs();
      if (!cur.rooms) cur.rooms = {};
      if (gone) {
        delete cur.rooms[rid];
        if (!cur.swept || typeof cur.swept !== 'object') cur.swept = {};
        cur.swept[rid] = 1;
        var ks = Object.keys(cur.swept);
        if (ks.length > 800) ks.slice(0, ks.length - 800).forEach(function (k) { delete cur.swept[k]; });
      } else {
        cur.rooms[rid] = Date.now();
      }
      App.save(KEY, cur);
    }
    todo.forEach(function (rid) {
      readOnce(gPath(rid), function (val, err) {
        if (token !== S.token || err) return;
        if (!val) { done(rid, true); return; }
        if (!Core.sideOfUid(val, S.uid)) { done(rid, true); return; }
        if (!Core.purgeReason(val, S.backend.now())) { done(rid, false); return; }
        if (val.status === 'over') recordFinished(rid, val, Core.sideOfUid(val, S.uid));
        purgeRoom(rid, val).then(function (ok) {
          done(rid, ok);
          if (!ok) return;
          purged++;
          var cur = App.statsLoad();
          if (Stats.dropPending(cur, rid)) App.statsSave(cur);
          var msg = document.getElementById('onPurgeMsg');
          if (msg) msg.textContent = '已自動回收 ' + purged + ' 間過期對局室。';
        });
      });
    });
  }

  function createRoom(opts) {
    var rid = Core.randomId();
    var g = Core.createRoom({
      uid: S.uid, name: myName(), side: opts.side, size: opts.size, tc: opts.tc, pub: opts.pub, ts: S.backend.ts(),
    });
    return S.backend.set(gPath(rid), g).then(function () { rememberRoom(rid); return rid; });
  }

  function enterRoom(rid) {
    S.rid = rid;
    message('<p class="muted">正在進入手談室 ' + esc(rid) + '…</p>');
    var token = S.token;
    S.stops.push(S.backend.watch(gPath(rid), function (val, err) {
      if (token !== S.token) return;
      if (err) {
        message('<h2>無法進入房間</h2><p class="muted">' + esc(errText(err)) + '</p><p><a class="link-btn" href="#/online">← 回大廳</a></p>');
        return;
      }
      if (!val) {
        if (S.g) App.toast('房間已關閉');
        message('<h2>找不到房間 ' + esc(rid) + '</h2><p class="muted">房號可能輸入有誤，或房主已關閉房間。</p><p><a class="link-btn" href="#/online">← 回大廳</a></p>');
        S.g = null;
        return;
      }
      onRoom(val);
    }));
    S.stops.push(S.backend.watch(pPath(rid), function (val) {
      if (token !== S.token) return;
      S.pres = val || {};
      refreshRoom();
    }));
    S.timer = setInterval(tick, 250);
  }

  function startPresence() {
    if (S.presStop) S.presStop();
    var role = S.role;
    var name = role === 'watch' ? myName() : S.g[role].name;
    var ts = S.backend.ts();
    S.presStop = S.backend.presence(
      pPath(S.rid) + '/' + S.uid,
      function () { return { name: name, role: role, on: true }; },
      role === 'watch' ? null : { name: name, role: role, on: false, off: ts }
    );
  }

  function syncLobby() {
    var g = S.g;
    if (!g.pub || g.host !== S.uid) return;
    if (g.status === 'over') {
      if (S.lobbyStop) { S.lobbyStop(); S.lobbyStop = null; }
      return;
    }
    var entry = {
      host: S.uid, st: g.status, size: Core.cleanSize(g.size),
      black: g.black ? g.black.name : '', white: g.white ? g.white.name : '',
      tc: g.tc, at: S.backend.ts(),
    };
    var key = entry.st + '|' + entry.size + '|' + entry.black + '|' + entry.white;
    S.lobbyEntry = entry;
    if (!S.lobbyStop) {
      S.lobbyStop = S.backend.presence(lobbyPath(S.rid), function () { return S.lobbyEntry; }, null);
    } else if (key !== S.lobbyKey) {
      S.backend.set(lobbyPath(S.rid), entry).catch(function () {});
    }
    S.lobbyKey = key;
  }

  function recordFinished(rid, g, role) {
    var st = App.statsLoad();
    if (Stats.hasRoom(st, rid)) return false;
    var opp = g[Core.other(role)];
    var r = Stats.resultFor(g.result, role);
    var gm = Core.gameOf(g);
    if (!opp || !r || !gm || !gm.history.length) {
      if (Stats.dropPending(st, rid)) App.statsSave(st);
      return false;
    }
    var loser = g.result.w === 'black' ? E.WHITE : E.BLACK;
    if (g.result.why === 'resign') gm.resign(loser);
    else if (g.result.why === 'agreed') gm.agreeDraw();
    var sz = Core.cleanSize(g.size);
    var title = '線上（' + sz + '路）：' + g.black.name + '（黑） vs ' + g.white.name + '（白）';
    if (g.result.why === 'timeout' || g.result.why === 'abandon') title += ' ' + Core.resultText(g.result);
    var at = g.clock && g.clock.at > 1e12 ? g.clock.at : Date.now();
    App.upsertSaved('on-' + rid, title, gm, at);
    Stats.recordOnline(st, { rid: rid, uid: opp.uid, name: opp.name, r: r, side: role, why: g.result.why, n: g.n, sz: sz, at: at });
    App.statsSave(st);
    return true;
  }

  function trackRoom(val) {
    if (S.tracked || val.status !== 'playing') return;
    S.tracked = true;
    rememberRoom(S.rid);
    var st = App.statsLoad();
    if (Stats.addPending(st, S.rid, Date.now())) App.statsSave(st);
  }

  function onRoom(val) {
    var game = Core.gameOf(val);
    if (!game) {
      if (!S.warned) App.toast('收到不合規則的對局資料，已忽略');
      S.warned = true;
      return;
    }
    var prev = S.g;
    S.g = val;
    S.game = game;
    var role = Core.sideOfUid(val, S.uid) || 'watch';
    var player = role !== 'watch';

    if (!prev || role !== S.role) {
      var first = !prev;
      S.role = role;
      buildRoom();
      startPresence();
      if (first && !player && val.status === 'waiting') {
        S.backend.tx(gPath(S.rid), function (cur) {
          return Core.join(cur, { uid: S.uid, name: myName(), ts: S.backend.ts() });
        }).then(function (r) {
          if (!r.committed) App.toast('座位已滿，改為旁觀');
        }, function (err) { App.toast('入座失敗：' + errText(err)); });
      } else if (!first && player) {
        App.toast('已入座，你執' + (role === 'black' ? '黑（先手）' : '白（後手）'));
      }
      if (first && player && val.status === 'over') recordFinished(S.rid, val, role);
    }
    if (player) trackRoom(val);
    if (prev) {
      if (prev.status === 'waiting' && val.status === 'playing' && prev.host === S.uid) App.toast('對手已入座，手談開始！');
      if (player && val.status === 'playing') {
        if (val.n === prev.n + 1 && game.lastMove() === E.PASS && Core.turnOf(val) === role) {
          App.toast('對方已虛手（Pass）；若你也按虛手即進入點目終局');
        }
        var mine = prev.offer && prev.offer.by === role;
        if (mine && !val.offer && val.n === prev.n && !S.cancelling) {
          App.toast('對方婉拒了你的' + (prev.offer.kind === 'undo' ? '悔棋' : '和棋') + '請求');
        } else if (prev.offer && prev.offer.kind === 'undo' && val.n < prev.n) {
          App.toast('悔棋成立');
        } else if (val.offer && val.offer.by !== role && !prev.offer) {
          App.toast('對方提出' + (val.offer.kind === 'undo' ? '悔棋' : '和棋') + '請求');
        }
      }
      S.cancelling = false;
      if (prev.status !== 'over' && val.status === 'over') {
        App.toast(Core.resultText(val.result));
        if (player) {
          recordFinished(S.rid, val, role);
          App.campusAct();
        }
      }
    }
    syncLobby();
    refreshRoom();
  }

  function inviteLink() { return location.href.split('#')[0] + '#/online/' + S.rid; }

  function buildRoom() {
    var sz = Core.cleanSize(S.g && S.g.size);
    App.main.innerHTML =
      '<div class="wq-stage">' +
        '<div class="wq-board-col">' +
          '<div class="on-bar" id="onTop"></div>' +
          '<div class="wq-board-wrap" id="onBoard"></div>' +
          '<div class="on-bar" id="onBottom"></div>' +
        '</div>' +
        '<aside class="wq-side">' +
          '<section class="card">' +
            '<div class="card-head"><h2>手談室 ' + esc(S.rid) + '（' + sz + ' 路）</h2><span class="tag-pill" id="onRole"></span></div>' +
            '<div id="onStatus"></div><div id="onOffer"></div><div id="onAway"></div>' +
          '</section>' +
          '<section class="card"><div class="btn-grid" id="onActions"></div></section>' +
          '<section class="card">' +
            '<div class="card-head"><h2>棋譜手數</h2><span class="muted" id="onWatch"></span></div>' +
            '<div class="mv-scroll" id="onMoves"></div>' +
          '</section>' +
          '<div class="pz-nav"><a class="btn" href="#/online">← 大廳</a></div>' +
        '</aside>' +
      '</div>';
    S.board = window.WQBoard.create(document.getElementById('onBoard'), { onPoint: onPoint });
    S.awayHtml = '';
  }

  function presenceOf(side) {
    var seat = S.g[side];
    if (!seat) return null;
    var p = S.pres[seat.uid];
    return { online: !!(p && p.on), off: p && !p.on ? p.off : 0, known: !!p };
  }

  function barHtml(side) {
    var g = S.g;
    var seat = g[side];
    var p = presenceOf(side);
    var turn = g.status === 'playing' && Core.turnOf(g) === side;
    var name = seat ? esc(seat.name) + (seat.uid === S.uid ? '（你）' : '') : '等待對手入座…';
    var caps = S.game ? S.game.pos.caps[side === 'white' ? E.WHITE : E.BLACK] : 0;
    return '<span class="on-dot ' + (side === 'white' ? 'is-white' : '') + '"></span>' +
      '<span class="on-who' + (turn ? ' is-turn' : '') + '">' + name + '</span>' +
      '<span class="on-caps">提 ' + caps + ' 子</span>' +
      (seat ? '<span class="on-conn ' + (p.online ? 'is-on' : 'is-off') + '">' + (p.online ? '在線' : '離線') + '</span>' : '') +
      (g.tc.base ? '<span class="on-clock' + (turn ? ' is-run' : '') + '" id="onClock-' + side + '"></span>' : '');
  }

  function refreshRoom() {
    var g = S.g;
    if (!g || !S.board || !document.getElementById('onStatus')) return;
    var game = S.game;
    var role = S.role;
    var player = role !== 'watch';
    var turn = Core.turnOf(g);
    var myTurn = player && g.status === 'playing' && turn === role && !S.busy;
    var sc = g.status === 'over' && g.result && g.result.why === 'score' ? game.score() : null;

    S.board.render({
      size: game.size(),
      board: game.pos.board,
      last: game.lastStone(),
      hint: -1,
      moveNums: S.showNums ? App.buildMoveNums(game) : null,
      terrMap: sc ? sc.owner : null,
      dead: sc ? sc.dead : null,
      hoverColor: myTurn ? (role === 'white' ? E.WHITE : E.BLACK) : 0,
    });

    var bottomSide = role === 'white' ? 'white' : 'black';
    var topSide = Core.other(bottomSide);
    document.getElementById('onTop').innerHTML = barHtml(topSide);
    document.getElementById('onBottom').innerHTML = barHtml(bottomSide);
    document.getElementById('onRole').textContent = player ? '你執' + (role === 'white' ? '白' : '黑') : '觀戰中';

    var html;
    if (g.status === 'waiting') {
      html = '<div class="status-turn"><span class="turn-dot"></span>等待對手加入</div>' +
        '<p class="muted">複製下方邀請連結傳給朋友，對方打開即可直接入座：</p>' +
        '<div class="on-invite"><input type="text" readonly id="onLink" value="' + esc(inviteLink()) + '" />' +
        '<button type="button" class="btn btn-primary" data-oact="copy">複製</button></div>';
    } else if (g.status === 'over') {
      var verdict = '';
      if (player && g.result.w !== 'draw') verdict = g.result.w === role ? '・你贏了！' : '・你輸了';
      html = '<div class="status-result">' + esc(Core.resultText(g.result) + verdict) + '</div>';
      if (sc) {
        html += '<p class="muted">數子明細：黑方子空合計 ' + sc.blackArea + ' 目 vs 白方 ' + sc.whiteArea + ' 目（白受貼 ' + sc.komi + ' 目）。</p>';
      }
      html += '<p class="muted">共 ' + g.n + ' 手。' + (player && g.n ? '已自動存入「我的棋譜」並計入戰績。' : '') + '</p>' +
        (g.next ? '<p><a class="btn btn-primary on-next" href="#/online/' + esc(g.next) + '">再戰新房已開好，點此入座 →</a></p>' : '');
    } else {
      var label = player ? (turn === role ? '輪到你落子' : '等待對手落子') : '輪到' + sideLabel(turn) + '落子';
      var oppJustPassed = game.pos.passes === 1;
      html = '<div class="status-turn ' + (turn === 'white' ? 'is-white' : '') + '"><span class="turn-dot"></span>' + label +
        (oppJustPassed ? '<span class="badge-pass">前一手虛手</span>' : '') + '</div>' +
        '<p class="muted">第 ' + (g.n + 1) + ' 手・黑貼 ' + game.komi() + ' 目・' + esc(tcLabel(g.tc)) + '</p>';
    }
    var rival = player ? g[Core.other(role)] : null;
    if (rival) {
      var h2h = App.statsLoad().opp[rival.uid];
      html += '<p class="muted on-h2h">與 ' + esc(rival.name) + ' 交手戰績：' +
        (h2h ? esc(Stats.wldText(h2h)) : '首次手談') + '</p>';
    }
    document.getElementById('onStatus').innerHTML = html;

    var offer = '';
    if (g.offer && g.status === 'playing') {
      var what = g.offer.kind === 'undo' ? '悔棋' : '和棋';
      if (player && g.offer.by === role) {
        offer = '<div class="on-offer">已送出' + what + '請求，等待對方回覆。' +
          '<button type="button" class="link-btn" data-oact="cancel-offer">取消請求</button></div>';
      } else if (player) {
        offer = '<div class="on-offer is-ask"><strong>對方請求' + what + '</strong>' +
          '<span class="on-offer-btns"><button type="button" class="btn btn-primary" data-oact="accept">同意</button>' +
          '<button type="button" class="btn" data-oact="decline">婉拒</button></span></div>';
      } else {
        offer = '<div class="on-offer">' + sideLabel(g.offer.by) + '請求' + what + '，等待回覆。</div>';
      }
    }
    document.getElementById('onOffer').innerHTML = offer;

    var btn = function (act, text, dis, cls) {
      return '<button type="button" class="btn' + (cls || '') + '" data-oact="' + act + '"' + (dis ? ' disabled' : '') + '>' + text + '</button>';
    };
    var acts = '';
    if (player && g.status === 'playing') {
      var canUndo = !g.offer && g.n >= (turn === role ? 2 : 1);
      acts += btn('pass', '⏭️ 虛手（Pass）', !myTurn, ' btn-kaya') +
        btn('undo', '↩️ 請求悔棋', !canUndo) +
        btn('draw', '🤝 提和', !!g.offer) +
        btn('resign', '🏳️ 認輸', false, ' btn-danger');
    } else if (player && g.status === 'waiting') {
      acts += btn('cancel-room', '✖️ 關閉房間', false, ' btn-danger');
    } else if (player && g.status === 'over' && !g.next) {
      acts += btn('rematch', '🔁 再來一局（換先）', false, ' btn-primary');
    }
    acts += btn('nums', '🔢 手數', false, S.showNums ? ' is-on' : '') +
      (g.status !== 'waiting' ? btn('copy', '🔗 複製邀請連結') : '');
    document.getElementById('onActions').innerHTML = acts;

    var box = document.getElementById('onMoves');
    box.innerHTML = App.moveListHtml(game, g.n, false);
    box.scrollTop = box.scrollHeight;
    var watchers = Object.keys(S.pres).filter(function (u) { return S.pres[u] && S.pres[u].role === 'watch'; }).length;
    document.getElementById('onWatch').textContent = watchers ? '👀 ' + watchers + ' 人旁觀' : '';
    tick();
  }

  function tick() {
    var g = S.g;
    if (!g || !S.backend || !document.getElementById('onStatus')) return;
    var now = S.backend.now();
    var player = S.role !== 'watch';
    if (g.tc.base) {
      ['black', 'white'].forEach(function (side) {
        var el = document.getElementById('onClock-' + side);
        if (!el) return;
        var ms = Core.remaining(g, side, now);
        var text = Core.formatClock(ms);
        if (el.textContent !== text) el.textContent = text;
        el.classList.toggle('is-low', ms < 30000);
      });
      var turn = Core.turnOf(g);
      if (player && g.status === 'playing' && S.flagN !== g.n && Core.remaining(g, turn, now) <= 0) {
        S.flagN = g.n;
        S.backend.tx(gPath(S.rid), function (cur) { return Core.flag(cur, { uid: S.uid, now: S.backend.now() }); })
          .catch(function () {});
      }
    }
    var away = '';
    if (player && g.status === 'playing') {
      var p = presenceOf(Core.other(S.role));
      if (p && p.known && !p.online && p.off) {
        var gone = Math.max(0, now - p.off);
        away = gone >= Core.ABANDON_MS
          ? '<div class="on-offer is-ask"><strong>對手已離線超過 1 分鐘</strong><span class="on-offer-btns">' +
            '<button type="button" class="btn btn-primary" data-oact="claim">宣告獲勝</button></span></div>'
          : '<div class="on-offer">對手離線中，' + Math.ceil((Core.ABANDON_MS - gone) / 1000) + ' 秒後可宣告獲勝。</div>';
      }
    }
    if (away !== S.awayHtml) {
      S.awayHtml = away;
      document.getElementById('onAway').innerHTML = away;
    }
  }

  function roomTx(fn, failText) {
    return S.backend.tx(gPath(S.rid), fn).then(function (r) {
      if (!r.committed && failText) App.toast(failText);
      return r;
    }, function (err) {
      App.toast('連線異常：' + errText(err));
      return { committed: false };
    });
  }

  function sendMove(mv) {
    var g = S.g;
    if (!g || S.busy || S.role === 'watch' || g.status !== 'playing' || Core.turnOf(g) !== S.role) return;
    if (!S.game.isLegal(mv)) {
      if (mv !== E.PASS && S.game.pos.board[mv] === E.EMPTY) {
        App.toast(mv === S.game.pos.ko ? '打劫禁點：需隔一手才能提回' : '禁著點（禁止自殺）或違反禁全同');
      }
      return;
    }
    S.busy = true;
    refreshRoom();
    var moveText = E.moveToStr(mv, S.game.size());
    roomTx(function (cur) {
      return Core.move(cur, { uid: S.uid, move: moveText, now: S.backend.now(), ts: S.backend.ts() });
    }, '落子未送出，請再試一次').then(function () { S.busy = false; });
  }

  function onPoint(sq) { sendMove(sq); }

  function onAction(act) {
    var g = S.g;
    var uid = S.uid;
    if (act === 'retry') { window.WQOnline.render(S.lastParts || []); return; }
    if (act === 'create' || act === 'join') {
      var nameEl = document.getElementById('onName');
      if (nameEl) saveName(nameEl.value);
      if (act === 'join') {
        var rid = Core.normalizeId(document.getElementById('onCode').value);
        if (!rid) { App.toast('房號為 6 碼英文與數字'); return; }
        location.hash = '#/online/' + rid;
        return;
      }
      var side = document.getElementById('onSide').value;
      if (side === 'rand') side = Math.random() < 0.5 ? 'black' : 'white';
      var sz = +document.getElementById('onSize').value || 19;
      var tc = Core.TIME_CONTROLS[+document.getElementById('onTc').value] || Core.TIME_CONTROLS[0];
      createRoom({ side: side, size: sz, tc: tc, pub: document.getElementById('onPublic').checked }).then(function (newRid) {
        location.hash = '#/online/' + newRid;
      }, function (err) { App.toast('建立失敗：' + errText(err)); });
      return;
    }
    if (act === 'copy') { App.copyText(inviteLink(), '已複製邀請連結'); return; }
    if (act === 'nums') { S.showNums = !S.showNums; refreshRoom(); return; }
    if (!g) return;
    if (act === 'pass') {
      if (S.game && S.game.pos.passes === 1 && !window.confirm('對方剛虛手；你也虛手將立刻結束對局並數子點目，確定嗎？')) return;
      sendMove(E.PASS);
    } else if (act === 'cancel-room') {
      if (g.status !== 'waiting' || g.host !== uid) return;
      var rid0 = S.rid;
      var b = S.backend;
      stop();
      forgetRoom(rid0);
      Promise.all([b.remove(gPath(rid0)), b.remove(lobbyPath(rid0)), b.remove(pPath(rid0) + '/' + uid)])
        .catch(function () {}).then(function () { location.hash = '#/online'; });
    } else if (act === 'resign') {
      if (!window.confirm('確定要投子認輸嗎？')) return;
      roomTx(function (cur) { return Core.resign(cur, { uid: uid }); });
    } else if (act === 'undo' || act === 'draw') {
      roomTx(function (cur) { return Core.offer(cur, { uid: uid, kind: act }); }, '目前無法送出請求');
    } else if (act === 'cancel-offer') {
      S.cancelling = true;
      roomTx(function (cur) { return Core.cancelOffer(cur, { uid: uid }); });
    } else if (act === 'accept' || act === 'decline') {
      roomTx(function (cur) { return Core.answer(cur, { uid: uid, ok: act === 'accept', ts: S.backend.ts() }); });
    } else if (act === 'claim') {
      roomTx(function (cur) { return Core.claim(cur, { uid: uid }); });
    } else if (act === 'rematch') {
      if (S.role === 'watch') return;
      createRoom({ side: Core.other(S.role), size: Core.cleanSize(g.size), tc: g.tc, pub: g.pub }).then(function (newRid) {
        return roomTx(function (cur) { return Core.setNext(cur, { uid: uid, rid: newRid }); }).then(function (r) {
          location.hash = '#/online/' + (r.val && r.val.next ? r.val.next : newRid);
        });
      }, function (err) { App.toast('開新局失敗：' + errText(err)); });
    }
  }

  function init() {
    App = window.WQApp;
    App.main.addEventListener('click', function (ev) {
      var t = ev.target.closest('[data-oact]');
      if (t && !t.disabled) onAction(t.getAttribute('data-oact'));
    });
    App.main.addEventListener('change', function (ev) {
      if (ev.target.id === 'onName') saveName(ev.target.value);
    });
    App.main.addEventListener('keydown', function (ev) {
      // IME 安全判斷（CAMPUS_CONTRACT §4）
      if (ev.isComposing || ev.keyCode === 229) return;
      if (ev.target.id === 'onCode' && ev.key === 'Enter') { ev.preventDefault(); onAction('join'); }
    });
  }

  window.WQOnline = {
    handles: function (view) { return view === 'online'; },
    render: function (parts) {
      if (!App) init();
      stop();
      S.lastParts = parts;
      var token = S.token;
      var rid = parts[0] ? Core.normalizeId(parts[0]) : '';
      if (parts[0] && !rid) {
        message('<h2>房號格式不正確</h2><p class="muted">房號為 6 碼英文與數字。</p><p><a class="link-btn" href="#/online">← 回大廳</a></p>');
        return;
      }
      message('<p class="muted">正在連線至手談大廳…</p>');
      ensureBackend().then(function () {
        if (token !== S.token) return;
        if (rid) enterRoom(rid); else renderLobby();
      }, function (err) {
        if (token !== S.token) return;
        message('<h2>無法連線至線上對弈服務</h2><p class="muted">' + esc(errText(err)) + '</p>' +
          '<p style="margin-top:10px"><button type="button" class="btn" data-oact="retry">重試</button></p>');
      });
      window.scrollTo(0, 0);
    },
    stop: stop,
  };
})();


// === js/app.js ===
// ============================================================================
// ⚫ 圍棋學院 — 主頁面與互動控制（對弈、棋譜回放與 SGF、棋規與形勢速查、段位）
// 純前端：對局、棋譜與戰績皆存在瀏覽器 localStorage（key 一律 wq. 前綴）。
// ============================================================================

(function () {
  'use strict';
  var E = window.WQEngine;
  var NT = window.WQNotation;
  var Stats = window.WQStats;
  var Rank = window.WQRank;
  var main = document.getElementById('appMain');

  var KEY_PLAY = 'wq.play.v1';
  var KEY_GAMES = 'wq.games.v1';
  var KEY_PREFS = 'wq.prefs.v1';
  var MAX_SAVED = 60;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function load(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (_) { return fallback; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (_) {}
  }
  function nowStr(at) {
    var d = at ? new Date(at) : new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function sideName(side) { return NT.sideName(side); }
  function campusAct() {
    try {
      if (window.CampusNav && typeof window.CampusNav.recordAct === 'function') window.CampusNav.recordAct('weiqi');
    } catch (_) {}
  }
  var toastTimer = 0;
  function toast(msg) {
    var t = document.getElementById('wqToast');
    if (!t) return;
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2400);
  }
  function copyText(text, done) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).catch(fallback);
    } else {
      fallback();
    }
    toast(done || '已複製 SGF 棋譜');
  }

  var prefs = load(KEY_PREFS, {}) || {};
  if (!E.validSize(prefs.size)) prefs.size = 19;
  function savePrefs() {
    save(KEY_PREFS, {
      size: E.validSize(prefs.size) ? prefs.size : 19,
      nums: !!prefs.nums,
      terr: !!prefs.terr,
      rated: prefs.rated !== false,
      handicap: prefs.handicap || 0,
    });
  }

  /** 建立目前盤面上每顆存活棋子最新一次落下的手數表（供棋盤開啟手數顯示時繪製）。 */
  function buildMoveNums(game, uptoIdx) {
    var lim = uptoIdx === undefined ? game.history.length : uptoIdx;
    var map = {};
    for (var i = 0; i < lim && i < game.history.length; i++) {
      var m = game.history[i].move;
      if (m !== E.PASS) map[m] = i + 1;
    }
    return map;
  }

  // ------------------------------------------------------------------ 我的棋譜
  function savedGames() {
    var list = load(KEY_GAMES, []);
    return Array.isArray(list) ? list : [];
  }
  function gameSnapshot(game) {
    return {
      fen: game.startFen,
      moves: game.moveStrings(),
      resigned: game.resigned,
      draw: game.drawAgreed,
    };
  }
  function restoreGame(snap) {
    var g = E.Game.fromMoves(snap.fen || E.START_FEN, snap.moves || []);
    if (snap.resigned === E.BLACK || snap.resigned === E.WHITE) g.resign(snap.resigned);
    if (snap.draw) g.agreeDraw();
    return g;
  }
  function upsertSaved(id, title, game, at) {
    var list = savedGames();
    var rec = gameSnapshot(game);
    rec.id = id || 'g' + Date.now().toString(36);
    rec.title = title;
    rec.date = nowStr(at);
    rec.result = NT.resultText(game.result());
    rec.size = game.size();
    list = list.filter(function (x) { return x.id !== rec.id; });
    list.unshift(rec);
    save(KEY_GAMES, list.slice(0, MAX_SAVED));
    return rec.id;
  }

  // ------------------------------------------------------------------ 我的戰績與段位
  function statsLoad() { return Stats.normalize(load(Stats.KEY, null)); }
  function statsSave(st) { save(Stats.KEY, st); }
  function statsCardHtml(extra) {
    var levels = {};
    Stats.AI_LEVELS.forEach(function (lv) { levels[lv] = window.WQAI.LEVELS[lv].name; });
    var saved = {};
    savedGames().forEach(function (g) { saved[g.id] = true; });
    return Stats.cardHtml(statsLoad(), esc, {
      levels: levels, saved: saved,
      whyText: window.WQOnlineCore ? window.WQOnlineCore.whyText : null,
      unfinished: extra && extra.unfinished,
    });
  }
  function aiLevels() {
    return Stats.AI_LEVELS.map(function (lv) {
      var cfg = window.WQAI.LEVELS[lv];
      return { lv: lv, name: 'AI ' + cfg.name, rating: cfg.rating };
    });
  }
  function refreshRankPill() {
    var el = document.getElementById('rankPill');
    if (el) el.textContent = '🏅 ' + Rank.badgeText(statsLoad().rank);
  }

  function moveListHtml(game, activeIdx, clickable) {
    var sz = game.size();
    var hist = game.history;
    if (!hist.length) return '<p class="muted mv-none">尚未落子（黑方先手）。</p>';
    var rows = [];
    for (var i = 0; i < hist.length; i += 2) {
      var turnNo = Math.floor(i / 2) + 1;
      rows.push('<li><span class="mv-no">' + turnNo + '.</span>' + cell(i) + cell(i + 1) + '</li>');
    }
    function cell(idx) {
      if (idx >= hist.length) return '<span class="mv mv-empty"></span>';
      var h = hist[idx];
      var cls = 'mv' + (idx + 1 === activeIdx ? ' is-active' : '') + (h.side === E.WHITE ? ' mv-white' : ' mv-black');
      var txt = (idx + 1) + ' ' + NT.formatMoveLabel(h.move, sz);
      var inner = '<span class="mv-stone"></span>' + esc(txt);
      return clickable
        ? '<button type="button" class="' + cls + '" data-goto="' + (idx + 1) + '">' + inner + '</button>'
        : '<span class="' + cls + '">' + inner + '</span>';
    }
    return '<ol class="mv-list">' + rows.join('') + '</ol>';
  }

  function capturesHtml(game) {
    var cb = game.pos.caps[E.BLACK] || 0;
    var cw = game.pos.caps[E.WHITE] || 0;
    return '<div class="cap-pill"><span>⚫ 黑方提子</span><strong>' + cb + ' 顆</strong></div>' +
      '<div class="cap-pill"><span>⚪ 白方提子</span><strong>' + cw + ' 顆</strong></div>';
  }

  function territoryBannerHtml(est) {
    if (!est) return '';
    var tot = Math.max(1, est.blackArea + est.whiteArea);
    var bPct = Math.round(est.blackArea * 100 / tot);
    var leadTxt = est.lead === 0 ? '局勢細微持平'
      : (est.lead > 0 ? '黑方領先約 ' + est.margin + ' 目' : '白方領先約 ' + est.margin + ' 目');
    return '<div class="terr-banner">' +
      '<div><strong>' + (est.exact ? '📐 終局數子點目：' : '🧮 即時形勢判斷：') + esc(leadTxt) + '</strong></div>' +
      '<div class="muted">黑（子 ' + est.blackStones + '＋空 ' + est.blackTerritory + '＝' + est.blackArea + '） vs ' +
      '白（子 ' + est.whiteStones + '＋空 ' + est.whiteTerritory + '＋貼 ' + est.komi + '＝' + (est.whiteArea + est.komi) + '）</div>' +
      '<div class="terr-bar"><span class="terr-bar-b" style="width:' + bPct + '%"></span><span class="terr-bar-w" style="width:' + (100 - bPct) + '%"></span></div>' +
    '</div>';
  }

  // ------------------------------------------------------------------ 對弈頁
  var play = {
    game: null, board: null, savedId: null, savedTitle: '',
    ai: 0, human: E.BLACK, thinking: false, hinting: false, hint: -1,
    counted: null, rated: false, ratedDone: null,
  };
  var aiClient = window.WQAI.createClient();
  var AI_MIN_DELAY = 280;

  function aiName() { return play.ai ? window.WQAI.LEVELS[play.ai].name : ''; }
  function aiRating() { return play.ai ? window.WQAI.LEVELS[play.ai].rating : 0; }
  function ratedLive() { return !!(play.rated && play.game && !play.game.result()); }
  function syncRated() {
    var g = play.game;
    if (g.history.length || g.result() || !E.isStandardStart(g.startFen)) return;
    play.rated = !!play.ai && prefs.rated !== false;
    play.ratedDone = null;
  }
  function humanTurn() { return !play.ai || play.game.turn() === play.human; }
  function defaultTitle() {
    if (play.savedTitle) return play.savedTitle;
    var szTag = play.game.size() + '路・';
    return szTag + (play.ai ? (play.rated ? '段位賽・' : '') + '對 AI（' + aiName() + '）' + (play.human === E.WHITE ? '執白' : '執黑') : '同機手談') + ' ' + nowStr();
  }
  function stopThinking() {
    aiClient.cancel();
    play.thinking = false;
    play.hinting = false;
    play.hint = -1;
  }

  function makeFreshGame() {
    var sz = E.validSize(prefs.size) ? prefs.size : 19;
    var hc = (!play.ai || prefs.rated === false) ? (prefs.handicap || 0) : 0;
    return new E.Game(E.startSetup(sz, hc));
  }

  function loadPlay() {
    var snap = load(KEY_PLAY, null);
    play.savedId = null;
    try {
      play.game = snap ? restoreGame(snap) : makeFreshGame();
      if (snap && snap.savedId) play.savedId = snap.savedId;
      var old = !!snap && snap.v !== 2;
      var lv = snap ? (old ? Stats.legacyLevel(snap.ai) : +snap.ai) : 2;
      if (window.WQAI.LEVELS[lv]) play.ai = lv; else if (snap && +snap.ai === 0) play.ai = 0;
      if (snap && snap.human === E.WHITE) play.human = E.WHITE; else play.human = E.BLACK;
      play.counted = snap && snap.counted && typeof snap.counted === 'object' ? snap.counted : null;
      if (play.counted && old) play.counted = { lv: Stats.legacyLevel(play.counted.lv), r: play.counted.r };
      play.rated = !!snap && !old && !!snap.rated && !!play.ai;
      play.ratedDone = snap && !old && snap.ratedDone && typeof snap.ratedDone === 'object' ? snap.ratedDone : null;
      prefs.size = play.game.size();
    } catch (_) {
      play.game = makeFreshGame();
    }
    syncRated();
  }
  function persistPlay() {
    var snap = gameSnapshot(play.game);
    snap.savedId = play.savedId;
    snap.ai = play.ai;
    snap.human = play.human;
    snap.counted = play.counted;
    snap.v = 2;
    snap.rated = !!play.rated;
    snap.ratedDone = play.ratedDone;
    save(KEY_PLAY, snap);
  }

  function renderPlay() {
    if (!play.game) loadPlay();
    main.innerHTML =
      '<div class="wq-stage">' +
        '<div class="wq-board-col"><div class="wq-board-wrap" id="playBoard"></div></div>' +
        '<aside class="wq-side">' +
          '<section class="card" id="playStatus"></section>' +
          '<section class="card opp-card">' +
            '<div class="size-bar" role="group" aria-label="棋盤路數">' +
              [9, 13, 19].map(function (sz) {
                var sub = sz === 9 ? '快棋・貼5.5目' : (sz === 13 ? '中盤・貼6.5目' : '全局・貼7.5目');
                return '<button type="button" class="size-btn" data-size="' + sz + '">' +
                  '<strong>' + sz + ' 路棋盤</strong><small>' + sub + '</small></button>';
              }).join('') +
            '</div>' +
            '<label class="opp-wide">對手<select id="oppSel">' +
              '<option value="0">👥 同機雙人手談</option>' +
              Stats.AI_LEVELS.map(function (lv) {
                return '<option value="' + lv + '">⚫ AI ' + esc(window.WQAI.LEVELS[lv].name) + '（' + window.WQAI.LEVELS[lv].rating + ' 分）</option>';
              }).join('') +
            '</select></label>' +
            '<label id="sideWrap">我方執子<select id="sideSel">' +
              '<option value="1">執黑（先手）</option><option value="2">執白（後手・受貼目）</option>' +
            '</select></label>' +
            '<label id="modeWrap" title="段位賽：分先開局、不能悔棋與提示，結果會增減棋力分。練習：可悔棋、提示、看即時形勢或下讓子棋。">對局模式<select id="modeSel">' +
              '<option value="1">🏅 段位賽</option><option value="0">🎓 練習／讓子</option>' +
            '</select></label>' +

              '<option value="0">分先（標準貼目）</option>' +
