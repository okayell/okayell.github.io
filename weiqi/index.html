 路、19 路本榧木蛤碁石棋盤，內建完整圍棋規則引擎（提子、禁著點、打劫與禁全同、雙虛手數子點目與即時形勢判斷），支援免註冊線上對弈、十位不同段位的 AI 陪練與段位賽、死活與手筋題庫、定石佈局與官子課程、SGF 棋譜回放與匯入。" /><style>
/* ==========================================================================
   ⚫ 圍棋學院 — 幽玄棋院・松煙竹露 × 青瓷和紙 × 日向本榧木與蛤碁石
   （與 2F 象棋朱砂宣紙書院、4F 西洋棋牛津深藍皇家紋章廳形成鮮明三院美學對比）
   ========================================================================== */
:root {
  --bg: #ebefe9;
  --card: #fbfcfb;
  --surface-soft: #f2f6f2;
  --surface-washi: #f5f7f2;
  --line: #cad7ce;
  --line-strong: #aabdb1;
  --text: #15221c;
  --text-2: #2f4339;
  --muted: #556b60;
  --accent: #1b5c46;
  --accent-hover: #134433;
  --accent-soft: #dff0e9;
  --kaya: #c8963e;
  --kaya-soft: #fbf3e2;
  --kaya-border: #dbb264;
  --red: #b42318;
  --white-stone: #fbfaf5;
  --black-stone: #12171a;
  --radius: 12px;
  --font-serif: 'Noto Serif TC', 'Noto Serif CJK TC', 'Songti TC', 'PMingLiU', 'DFKai-SB', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 12% 8%, rgba(27, 92, 70, .06) 0%, transparent 45%),
    radial-gradient(circle at 88% 90%, rgba(200, 150, 62, .08) 0%, transparent 48%),
    linear-gradient(180deg, #f1f5ef 0%, #e5ece4 100%);
  background-attachment: fixed;
  color: var(--text);
  font: 15px/1.62 var(--font-sans);
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
h1, h2 {
  font-family: var(--font-serif);
  letter-spacing: .04em;
  color: #12241c;
}
button { font: inherit; color: inherit; }
.muted { color: var(--muted); font-size: 13px; }

/* ---------- 松煙竹影障子門楣頁首 ---------- */
.top-header {
  position: sticky; top: 0; z-index: 30;
  background: linear-gradient(180deg, #162b22 0%, #0e1d17 100%);
  border-bottom: 2px solid var(--kaya);
  box-shadow: 0 4px 18px rgba(12, 28, 21, .22);
}
.header-inner {
  max-width: 1150px; margin: 0 auto; padding: 8px 16px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.brand-link {
  display: inline-flex; align-items: center; gap: 9px;
  text-decoration: none; color: #f3f7f4;
}
.brand-crest {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 8px; box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-name {
  font-family: var(--font-serif); font-size: 18px; font-weight: 800;
  letter-spacing: .08em; color: #f6faf7;
}
.brand-sub {
  font-size: 10.5px; letter-spacing: .12em; color: #9fc4b4; font-weight: 500;
}
.ver-pill {
  border: 1px solid rgba(159, 196, 180, .35); background: rgba(255, 255, 255, .07);
  border-radius: 999px; padding: 1px 9px; font-size: 12px; color: #c5ded3; cursor: pointer;
}
.ver-pill:hover { border-color: var(--kaya-border); color: #f7e4bc; }

.rank-pill {
  border: 1px solid rgba(219, 178, 100, .65);
  background: linear-gradient(135deg, rgba(200, 150, 62, .22), rgba(200, 150, 62, .10));
  color: #f8e3b4; border-radius: 999px;
  padding: 2px 11px; font-size: 12.5px; font-weight: 700; text-decoration: none; white-space: nowrap;
}
.rank-pill:hover, .rank-pill.active {
  background: rgba(200, 150, 62, .34); border-color: #f0cb7e; color: #fff8e7;
}

.main-nav { display: flex; gap: 4px; margin-left: auto; }
.nav-tab {
  padding: 6px 12px; border-radius: 999px; text-decoration: none;
  color: #bcd3c8; font-weight: 600; font-size: 14px; white-space: nowrap;
  transition: background .15s, color .15s;
}
.nav-tab:hover { background: rgba(255, 255, 255, .09); color: #ffffff; }
.nav-tab.active {
  background: linear-gradient(135deg, #dfB464 0%, #c6923a 100%);
  color: #1a1306; font-weight: 700;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .28);
}

.main-container { max-width: 1150px; margin: 0 auto; padding: 18px 16px 28px; outline: none; }
.loading-state { padding: 64px 0; text-align: center; color: var(--muted); font-family: var(--font-serif); }

/* ---------- 對弈／回放共用版面 ---------- */
.wq-stage { display: grid; grid-template-columns: minmax(0, 1fr) 356px; gap: 20px; align-items: start; }
.wq-board-col { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
.wq-board-wrap {
  width: min(100%, calc(100vh - 102px), 660px);
  padding: 6px;
  border-radius: 16px;
  background: linear-gradient(145deg, rgba(255, 255, 255, .65), rgba(215, 226, 218, .48));
  box-shadow: 0 14px 34px rgba(18, 36, 28, .15), inset 0 1px 0 rgba(255, 255, 255, .85);
}
body[data-view='replay'] .wq-board-wrap { width: min(100%, calc(100vh - 180px), 650px); }
body[data-view='online'] .wq-board-wrap { width: min(100%, calc(100vh - 194px), 650px); }
.wq-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* ---------- 和紙竹節雅閣卡片 ---------- */
.card {
  position: relative;
  background: var(--card);
  border: 1px solid var(--line);
  border-top: 2.5px solid #2b6e56;
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: 0 3px 12px rgba(20, 42, 32, .05);
}
.card h2 { font-size: 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.card-tools { display: flex; gap: 12px; flex-wrap: wrap; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; font-weight: 600; }
.link-btn:hover { text-decoration: underline; }
.link-btn:disabled { color: #b5c2ba; cursor: default; text-decoration: none; }
.icon-btn { border: 0; background: none; cursor: pointer; padding: 4px 6px; border-radius: 8px; color: var(--muted); }
.icon-btn:hover { background: var(--surface-soft); color: var(--text); }

.count-pill, .tag-pill {
  font-size: 12px; padding: 1px 9px; border-radius: 999px; white-space: nowrap;
  background: var(--surface-soft); color: var(--muted); border: 1px solid var(--line);
}
.tag-pill { background: var(--accent-soft); color: var(--accent); border-color: #b7dccd; font-weight: 600; }

/* ---------- 按鈕與棋盤路數快切列 ---------- */
.btn {
  border: 1px solid var(--line-strong); background: #fff; border-radius: 10px;
  padding: 8px 10px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap;
  transition: border-color .14s, background .14s, transform .08s;
}
.btn:hover { border-color: var(--accent); background: var(--surface-soft); }
.btn:disabled { opacity: .45; cursor: default; border-color: var(--line); background: #fff; }
.btn.is-on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-kaya {
  background: var(--kaya-soft); border-color: var(--kaya-border); color: #6e4811;
}
.btn-kaya:hover { background: #f8e8c4; border-color: #b5822a; }
.btn-danger:hover { border-color: var(--red); color: var(--red); background: #fef3f2; }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-grid .btn:last-child:nth-child(odd) { grid-column: 1 / -1; }

.size-bar {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px;
}
.size-btn {
  border: 1px solid var(--line); background: var(--surface-washi); border-radius: 9px;
  padding: 6px 6px; cursor: pointer; text-align: center; line-height: 1.25;
}
.size-btn strong { display: block; font-size: 13.5px; color: var(--text); }
.size-btn small { font-size: 11px; color: var(--muted); }
.size-btn:hover { border-color: var(--accent); }
.size-btn.is-on {
  background: var(--accent-soft); border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.size-btn.is-on strong { color: var(--accent); }

.opp-card { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opp-card > .size-bar, .opp-card > label.opp-wide { grid-column: 1 / -1; }
.opp-card label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
.opp-card select {
  font: inherit; font-size: 14px; font-weight: 600; color: var(--text); padding: 7px 8px;
  border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; width: 100%; max-width: 100%;
}

.status-turn { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; font-family: var(--font-serif); }
.turn-dot {
  width: 15px; height: 15px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 32%, #525b65, #111619 72%);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .35);
}
.status-turn.is-white .turn-dot {
  background: radial-gradient(circle at 35% 30%, #ffffff, #eae6da 75%);
  box-shadow: inset 0 0 0 1.5px #646b68, 0 1px 3px rgba(0, 0, 0, .18);
}
.badge-pass {
  margin-left: auto; background: var(--kaya-soft); color: #7c5110; border: 1px solid var(--kaya-border);
  border-radius: 999px; padding: 1px 10px; font-size: 12.5px; font-family: var(--font-sans);
}
.status-result { font-size: 20px; font-weight: 800; color: var(--accent); font-family: var(--font-serif); }
#playStatus .muted { margin-top: 4px; }

.terr-banner {
  margin-top: 8px; padding: 8px 10px; border-radius: 10px;
  background: var(--surface-washi); border: 1px solid var(--line);
  font-size: 13px; display: grid; gap: 3px;
}
.terr-banner strong { color: var(--accent); }
.terr-bar {
  display: flex; height: 7px; border-radius: 999px; overflow: hidden; background: #d6ded9; margin-top: 2px;
}
.terr-bar-b { background: #1e262b; }
.terr-bar-w { background: #f8f6ee; box-shadow: inset 0 0 0 1px #9ca3af; }

/* ---------- 手數與提子面板 ---------- */
.mv-scroll { max-height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-washi); }
.mv-list { list-style: none; margin: 0; padding: 4px 0; }
.mv-list li { display: grid; grid-template-columns: 42px 1fr 1fr; align-items: center; padding: 1px 8px; }
.mv-list li:nth-child(even) { background: #ebf1ec; }
.mv-no { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.mv { border: 0; background: none; text-align: left; padding: 3px 6px; border-radius: 6px; font-size: 14px; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 5px; }
.mv-stone { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.mv-black .mv-stone { background: #161b1f; }
.mv-white .mv-stone { background: #fcfbf6; box-shadow: inset 0 0 0 1.4px #4b5563; }
button.mv { cursor: pointer; }
button.mv:hover { background: #dce7e0; }
.mv.is-active { background: var(--accent-soft); font-weight: 700; box-shadow: inset 0 0 0 1px var(--accent); }
.mv-none { padding: 14px; text-align: center; }

.cap-box {
  margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.cap-pill {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: 6px 10px; border-radius: 9px; background: var(--surface-washi); border: 1px solid var(--line);
  font-size: 13px;
}
.cap-pill strong { font-variant-numeric: tabular-nums; font-size: 14px; }
.komi-note { margin-top: 6px; font-size: 12px; color: var(--muted); text-align: right; }

/* ---------- 回放與棋譜列表 ---------- */
.rp-controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.rp-controls .btn { min-width: 46px; }
.rp-slider { width: min(100%, 520px); accent-color: var(--accent); }
.rp-pos { font-size: 13px; color: var(--muted); margin: 8px 0 6px; }
.rec-desc { font-size: 14px; color: var(--text-2); }
.rp-tools { margin-top: 10px; }
.rec-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.rec-item { display: flex; align-items: center; border-radius: 10px; }
.rec-item a { flex: 1; min-width: 0; display: grid; padding: 6px 10px; text-decoration: none; color: var(--text); border-radius: 10px; }
.rec-item a:hover { background: var(--surface-soft); }
.rec-item.is-active a { background: var(--accent-soft); }
.rec-item strong { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec-item small { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.import-box { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
.import-box summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); }
.import-box textarea {
  width: 100%; margin-top: 8px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 10px;
  font: 13.5px/1.5 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; resize: vertical; background: var(--surface-washi);
}
.import-actions { display: flex; align-items: center; gap: 10px; margin-top: 6px; }

/* ---------- 棋規與形勢速查 ---------- */
.rules-wrap { display: grid; gap: 14px; }
.rules-intro h1 { font-size: 20px; margin-bottom: 4px; }
.guide-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 430px), 1fr)); gap: 14px; }
.guide-card { display: grid; grid-template-columns: 200px 1fr; gap: 14px; align-items: start; }
.guide-card h2 { margin-bottom: 4px; font-size: 16px; }
.guide-card p { font-size: 14px; color: var(--text-2); }
.plain-list { margin: 8px 0; padding-left: 20px; display: grid; gap: 5px; }

/* ---------- 日向本榧木棋盤與那智黑／蛤碁石 SVG ---------- */
.wq-board {
  display: block; width: 100%; height: auto;
  user-select: none; -webkit-user-select: none; touch-action: manipulation; cursor: pointer;
}
.guide-board .wq-board, #replayBoard .wq-board, .demo-board .wq-board { cursor: default; }
.wq-grid-line { stroke: #281b0c; stroke-linecap: square; }
.wq-star { fill: #231709; }
.wq-coord {
  font-family: ui-sans-serif, -apple-system, 'Segoe UI', sans-serif;
  fill: #4f3717; text-anchor: middle; dominant-baseline: central; font-weight: 700; opacity: .82;
}
.wq-stone-shadow { fill: rgba(24, 15, 4, .30); }
.wq-hover { pointer-events: none; opacity: .45; }
.wq-last-b { fill: none; stroke: #8ee0c4; stroke-width: 2.3; pointer-events: none; }
.wq-last-w { fill: none; stroke: #175440; stroke-width: 2.3; pointer-events: none; }
.wq-num-b { fill: #f4f7f5; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.wq-num-w { fill: #15221c; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.wq-mk-dot { fill: #15803d; stroke: #ffffff; stroke-width: 1.8; pointer-events: none; }
.wq-mk-target { fill: none; stroke: #dc2626; stroke-width: 2.4; stroke-dasharray: 4 3; pointer-events: none; }
.wq-mk-hint { fill: rgba(27, 92, 70, .26); stroke: #0f766e; stroke-width: 3; pointer-events: none; }
.wq-terr-b { fill: #12171b; stroke: rgba(255, 255, 255, .65); stroke-width: 1; pointer-events: none; }
.wq-terr-w { fill: #fcfbf6; stroke: #262e35; stroke-width: 1.3; pointer-events: none; }
.wq-dead-x { stroke: #dc2626; stroke-width: 2.6; stroke-linecap: round; pointer-events: none; }

/* ---------- 視窗與提示 ---------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 60; background: rgba(12, 26, 20, .52);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal-card { background: var(--card); border-radius: var(--radius); width: min(620px, 100%); max-height: 84vh; display: flex; flex-direction: column; border: 1px solid var(--line); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 17px; }
.modal-body { padding: 14px 16px; overflow-y: auto; }
.rel-item + .rel-item { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.rel-head { display: flex; gap: 10px; align-items: baseline; }
.rel-ver { font-weight: 800; color: var(--accent); }
.rel-date { color: var(--muted); font-size: 12px; }
.rel-item h3 { font-size: 15px; margin: 2px 0 4px; }
.rel-item ul { margin: 0; padding-left: 20px; font-size: 14px; }
.wq-toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 70;
  background: rgba(16, 35, 27, .94); color: #f5faf7; padding: 8px 18px; border-radius: 999px; font-size: 14px;
  border: 1px solid rgba(200, 150, 62, .45);
  max-width: calc(100vw - 32px); text-align: center;
}

/* ---------- 死活與手筋題庫＆課程 ---------- */
.study-wrap { display: grid; gap: 14px; }
.study-wrap h1 { font-size: 20px; margin-bottom: 4px; }
.pz-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.pz-score { display: grid; justify-items: end; flex: none; }
.pz-score-main { font-size: 26px; font-weight: 800; color: var(--accent); line-height: 1.2; white-space: nowrap; }
.pz-score-main small { font-size: 14px; color: var(--muted); font-weight: 600; }
.pz-filters { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
.seg-btn {
  border: 0; border-right: 1px solid var(--line); background: #fff; padding: 6px 14px; cursor: pointer;

  function setCookieBoth(name, val) {
    if (window.location && window.location.protocol === 'file:') return;
    try {
      document.cookie = name + '=' + val + '; path=/; max-age=31536000; SameSite=Lax';
      var hParts = String(window.location.hostname || '').split('.');
      if (hParts.length >= 4 && /^[ab][0-9a-f]{20,}$/i.test(hParts[0])) {
        document.cookie = name + '=' + val + '; domain=.' + hParts.slice(1).join('.') + '; path=/; max-age=31536000; SameSite=Lax';
      }
    } catch (e) { /* ignore */ }
  }

  function readCookieJson(name) {
    if (window.location && window.location.protocol === 'file:') return null;
    try {
      var parts = (document.cookie || '').split(';');
      for (var i = 0; i < parts.length; i++) {
        var kv = parts[i].trim();
        if (kv.indexOf(name + '=') === 0) {
          var obj = JSON.parse(decodeURIComponent(kv.slice(name.length + 1)));
          return obj && typeof obj === 'object' ? obj : null;
        }
      }
    } catch (e) { /* ignore */ }
    return null;
  }

  function writeStuCookie(obj) {

  function scanSavedFeedbackCount() {
    var total = 0;
    for (var i = 0; i < ALL_FB_KEYS.length; i++) {
      try {
        var raw = window.localStorage.getItem(ALL_FB_KEYS[i]);
        if (!raw) continue;
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) total += parsed.length;
        else if (parsed && typeof parsed === 'object' && Array.isArray(parsed.items)) total += parsed.items.length;
      } catch (e) { /* ignore */ }
    }
    return total;
  }

  function mergeDailyRecord(a, b, tDay) {
    var da = isPlainObj(a) && (a.date === tDay || a.day === tDay) ? a : null;
    var db = isPlainObj(b) && (b.date === tDay || b.day === tDay) ? b : null;
    if (!da && !db) {
      return {
        date: tDay, day: tDay, checkin: 0, visit: 0, acts: 0, visitedIds: {},
        study: 0, studySec: 0, sport: 0, eco: 0,
        claimed: {}, bonusClaimed: false, fullClaimed: false, allClearClaimed: false
      };
    }
    var srcA = da || {}, srcB = db || {};
    var claimed = Object.assign({}, isPlainObj(srcA.claimed) ? srcA.claimed : {}, isPlainObj(srcB.claimed) ? srcB.claimed : {});
    var visitedIds = Object.assign({}, isPlainObj(srcA.visitedIds) ? srcA.visitedIds : {}, isPlainObj(srcB.visitedIds) ? srcB.visitedIds : {});
    var studyVal = Math.max(+srcA.study || 0, +srcA.studySec || 0, +srcB.study || 0, +srcB.studySec || 0);
    var bonus = !!(srcA.bonusClaimed || srcA.fullClaimed || srcB.bonusClaimed || srcB.fullClaimed);
    var allClear = !!(srcA.allClearClaimed || srcB.allClearClaimed);
    return Object.assign({}, srcA, srcB, {
      date: tDay,
      day: tDay,
      checkin: Math.max(+srcA.checkin || 0, +srcB.checkin || 0),
      visit: Math.max(+srcA.visit || 0, +srcB.visit || 0, Object.keys(visitedIds).length),
      acts: Math.max(+srcA.acts || 0, +srcB.acts || 0),
      visitedIds: visitedIds,
      study: studyVal,
      studySec: studyVal,
      sport: Math.max(+srcA.sport || 0, +srcB.sport || 0),
      eco: Math.max(+srcA.eco || 0, +srcB.eco || 0),
      claimed: claimed,
      bonusClaimed: bonus,
      fullClaimed: bonus,
      allClearClaimed: allClear,
    });
  }

  function loadFunState() {
    var ls = {}, ck = readCookieJson(FUN_COOKIE) || {};
    try { ls = JSON.parse(window.localStorage.getItem(FUN_KEY) || '{}') || {}; } catch (e) { ls = {}; }
    var badges = Object.assign({}, isPlainObj(ls.ach) ? ls.ach : {}, isPlainObj(ls.badges) ? ls.badges : {});
    if (Array.isArray(ck.ach)) {
      ck.ach.forEach(function (id) { if (id && !badges[id]) badges[id] = Date.now(); });
    }
    var academyActs = Object.assign({}, isPlainObj(ck.aact) ? ck.aact : {});
    if (isPlainObj(ls.academyActs)) {
      Object.keys(ls.academyActs).forEach(function (k) {
        academyActs[k] = Math.max(+academyActs[k] || 0, +ls.academyActs[k] || 0);
      });
    }
    var academySec = Object.assign({}, isPlainObj(ck.asec) ? ck.asec : {});
    if (isPlainObj(ls.academySec)) {
      Object.keys(ls.academySec).forEach(function (k) {
        academySec[k] = Math.max(+academySec[k] || 0, +ls.academySec[k] || 0);
      });
    }
    var days = Object.assign({}, isPlainObj(ls.studyDays) ? ls.studyDays : {});
    if (Array.isArray(ck.days)) {
      ck.days.forEach(function (d) { if (d) days[d] = 1; });
    }
    var tDay = todayStr();
    days[tDay] = 1;
    var daily = mergeDailyRecord(ck.dl, ls.daily, tDay);
    return {
      raw: ls,
      badges: badges,
      academyActs: academyActs,
      academySec: academySec,
      days: days,
      studySec: Math.max(+ls.studySec || 0, +ck.sec || 0),

      daily: daily,

    try {
      var latest = {};
      try { latest = JSON.parse(window.localStorage.getItem(FUN_KEY) || '{}') || {}; } catch (e0) { latest = {}; }
      var mergedAch = Object.assign({}, isPlainObj(latest.ach) ? latest.ach : {}, st.badges || {});
      var mergedActs = Object.assign({}, isPlainObj(latest.academyActs) ? latest.academyActs : {});
      Object.keys(st.academyActs || {}).forEach(function (k) {
        mergedActs[k] = Math.max(+mergedActs[k] || 0, +st.academyActs[k] || 0);
      });
      var mergedSec = Object.assign({}, isPlainObj(latest.academySec) ? latest.academySec : {});
      Object.keys(st.academySec || {}).forEach(function (k) {
        mergedSec[k] = Math.max(+mergedSec[k] || 0, +st.academySec[k] || 0);
      });
      var mergedDays = Object.assign({}, isPlainObj(latest.studyDays) ? latest.studyDays : {}, st.days || {});
      var mergedDaily = mergeDailyRecord(latest.daily, st.daily, tDay);
      st.badges = mergedAch;
      st.academyActs = mergedActs;
      st.academySec = mergedSec;
      st.days = mergedDays;
      st.daily = mergedDaily;
      st.studySec = Math.max(+latest.studySec || 0, +st.studySec || 0);
      st.dailyPts = Math.max(+latest.dailyPts || 0, +st.dailyPts || 0);
      st.dailyFullDays = Math.max(+latest.dailyFullDays || 0, +st.dailyFullDays || 0);
      st.dailyAllClearDays = Math.max(+latest.dailyAllClearDays || 0, +st.dailyAllClearDays || 0);
      st.feedbackCount = Math.max(+latest.feedbackCount || 0, +st.feedbackCount || 0);

      var merged = Object.assign({}, st.raw || {}, latest, {
        ach: mergedAch,
        academyActs: mergedActs,
        academySec: mergedSec,
        studyDays: mergedDays,
        studySec: st.studySec,
        dailyPts: st.dailyPts,
        dailyFullDays: st.dailyFullDays,
        dailyAllClearDays: st.dailyAllClearDays,
        feedbackCount: st.feedbackCount,
        triviaSubmitted: !!(latest.triviaSubmitted || st.triviaSubmitted),
        daily: mergedDaily,
      });
      window.localStorage.setItem(FUN_KEY, JSON.stringify(merged));
    } catch (e) { /* ignore */ }
    try {
      var prevCk = readCookieJson(FUN_COOKIE) || {};
      var dayKeys = Object.keys(st.days || {}).sort().slice(-30);
      var min = Object.assign({}, prevCk, {
        ach: Object.keys(st.badges || {}),
        sec: +st.studySec || 0,
        asec: st.academySec || {},
        aact: st.academyActs || {},
        days: dayKeys,
        dpts: +st.dailyPts || 0,
        dfull: +st.dailyFullDays || 0,
        fbc: +st.feedbackCount || 0,
        dl: st.daily || null,
      });
      var enc = encodeURIComponent(JSON.stringify(min));
      if (enc.length > 3500) {
        delete min.pkmn;
        delete min.cars;
        enc = encodeURIComponent(JSON.stringify(min));
      }
      if (enc.length > 3700) {
        min.ach = (min.ach || []).slice(-80);
        delete min.asec;
        delete min.aact;
        enc = encodeURIComponent(JSON.stringify(min));
      }
      if (enc.length <= 3900) {
        setCookieBoth(FUN_COOKIE, enc);
      }
    } catch (e) { /* ignore */ }
  }

  function evaluateDailyInAcademy(st) {
    if (!st) return;
    var tDay = todayStr();
    st.daily = mergeDailyRecord(null, st.daily, tDay);
    var d = st.daily;
    d.claimed = isPlainObj(d.claimed) ? d.claimed : {};
    d.visitedIds = isPlainObj(d.visitedIds) ? d.visitedIds : {};
    var sSec = Math.max(+d.study || 0, +d.studySec || 0);
    d.study = sSec;
    d.studySec = sSec;
    var vCnt = Math.max(+d.visit || 0, Object.keys(d.visitedIds).length);
    d.visit = vCnt;
    var aCnt = Math.max(+d.acts || 0, 0);

    var changed = false;
    var toastItem = null;
    NAV_DAILY_SPECS.forEach(function (sp) {
      var val = 0;
      if (sp.id === 'study' || sp.id === 'study15' || sp.id === 'study30' || sp.id === 'study45') val = sSec;
      else if (sp.id === 'visit' || sp.id === 'visit3' || sp.id === 'visit5') val = vCnt;
      else if (sp.id === 'acts10' || sp.id === 'acts30') val = aCnt;
      else val = +d[sp.id] || 0;
      if (val >= sp.goal && !d.claimed[sp.id]) {
        d.claimed[sp.id] = Date.now();
        st.dailyPts = (+st.dailyPts || 0) + sp.pts;
        changed = true;
        if (sp.id !== 'visit') {
          toastItem = { icon: sp.icon, name: '每日任務達成：' + sp.name, pts: sp.pts, title: '' };
        }
      }
    });
    var doneCnt = NAV_DAILY_SPECS.filter(function (sp) { return !!d.claimed[sp.id]; }).length;
    if (doneCnt >= 5 && !d.bonusClaimed) {

      d.fullClaimed = true;
      st.dailyPts = (+st.dailyPts || 0) + 10;
      st.dailyFullDays = (+st.dailyFullDays || 0) + 1;

      var pHex = ('0000' + p.toString(16)).slice(-4).toLowerCase();
      if (label.length === 31 && /^a[0-9a-f]{30}$/i.test(label)) {
        return loc.protocol + '//' + (label.slice(0, 9) + pHex + label.slice(13)).toLowerCase() + host.slice(dot);

        return loc.protocol + '//' + (label.slice(0, 33) + pHex + label.slice(37)).toLowerCase() + host.slice(dot);

    return loc.protocol + '//' + host + ':' + p;
  }

        Object.keys(funSt.badges || {}).forEach(function (b) { if (b) mergedBadges[b] = 1; });

      } catch (e) { /* ignore */ }
      var minBadgeScore = 0;
      (stu.badges || []).forEach(function (bid) {

        else if (ACAD_ACH[bid]) minBadgeScore += (+ACAD_ACH[bid].pts || 0);

      stu.score = Math.max(+stu.score || 0, +lsStu.score || 0, +ckStu.score || 0, minBadgeScore);

      var isLeave = !!opts.leave;
      var idleSec = Math.max(0, Math.floor((Date.now() - _lastActMs) / 1000));
      var actSec = Math.max(0, navNowSec() - idleSec);
      var prevActSec = Math.max(+lsStu.activeTs || 0, +ckStu.activeTs || 0);
      if (prevActSec > actSec && prevActSec <= navNowSec()) actSec = prevActSec;
      var curState = isLeave ? 'offline' : (((!document.hidden && idleSec < 90) || _anyOtherTabActive) ? 'active' : 'away');

      stu.ts = navNowSec();
      stu.activeTs = actSec;

      var wireMsg = Object.assign({}, stu, {
        name: dispName,
        avatar: stu.avatar || '🧑‍🎓',
        title: stu.title || (isConfirmed ? '🌱 開心學園新生' : '🌱 校園訪客'),

      var loc = window.location;
      if (loc.protocol !== 'http:' && loc.protocol !== 'https:') return;

      var bodyStr = JSON.stringify(wireMsg);

      if (isLeave) {

        if (!isGhPages) sendBeaconSafe(campusBase() + 'api/presence', bodyStr, true);
        sendBeaconSafe('https://ntfy.sh/' + NTFY_TOPIC, bodyStr, false);
        return;
      }

      var mqttGap = document.hidden ? 28000 : 18000;
      var mqttSent = 0;
      if (opts.forceRemote || nowMs - _lastMqttSendMs >= mqttGap) {

        navMqttPublish(MQTT_PEER_PREFIX + stu.uid, bodyStr, true);

      var ntfyGap = mqttSent > 0 ? 180000 : (document.hidden ? 60000 : 35000);

        _lastNtfySendMs = nowMs;
        fetch('https://ntfy.sh/' + NTFY_TOPIC, { method: 'POST', body: bodyStr, keepalive: true }).catch(function () {});
      }
    } catch (e) { /* ignore */ }
  }

  function connectSingleAcademyMqtt(url, idx, toolId) {
    if (!window.WebSocket || isNavBot()) return;
    var existing = _navMqttClients[idx];
    if (existing && existing.ws && (existing.ws.readyState === 0 || existing.ws.readyState === 1)) return;
    if (existing && existing.pingT) { clearInterval(existing.pingT); existing.pingT = 0; }
    if (existing && existing.retryT) { clearTimeout(existing.retryT); existing.retryT = 0; }

    var entry = existing || { url: url, ws: null, ready: false, backoff: 1500, pingT: 0, retryT: 0, pktId: 1 };
    entry.ready = false;
    _navMqttClients[idx] = entry;

    var ws;
    try {
      ws = new WebSocket(url, 'mqtt');
      ws.binaryType = 'arraybuffer';
    } catch (e) {
      return;
    }
    entry.ws = ws;
    var rxBuf = new Uint8Array(0);

    ws.onopen = function () {
      if (entry.ws !== ws) return;
      var cid = 'hc_ac_' + TAB_ID.replace(/[^a-zA-Z0-9]/g, '').slice(-10) + '_' + idx + '_' + (Date.now() % 10000);
      try { ws.send(mqttConnectPkt(cid)); } catch (e) { /* ignore */ }
    };

    ws.onmessage = function (ev) {
      if (entry.ws !== ws || !ev || !ev.data) return;
      var chunk = new Uint8Array(ev.data);
      var merged = new Uint8Array(rxBuf.length + chunk.length);
      merged.set(rxBuf, 0);
      merged.set(chunk, rxBuf.length);
      rxBuf = merged;

      while (rxBuf.length >= 2) {
        var byte0 = rxBuf[0];
        var pktType = byte0 >> 4;
        var flags = byte0 & 0x0f;
        var mult = 1, remLen = 0, pos = 1, b;
        do {
          if (pos >= rxBuf.length) return;
          b = rxBuf[pos++];
          remLen += (b & 0x7f) * mult;
          mult *= 128;
        } while ((b & 0x80) !== 0 && pos < 5);

        var totalLen = pos + remLen;
        if (rxBuf.length < totalLen) return;

        var body = rxBuf.subarray(pos, totalLen);
        rxBuf = rxBuf.subarray(totalLen);

        if (pktType === 2) { // CONNACK
          entry.ready = true;
          entry.backoff = 1500;
          try {
            ws.send(mqttSubscribePkt(entry.pktId++, [MQTT_CTL_TOPIC]));
          } catch (e) { /* ignore */ }
          if (entry.pingT) clearInterval(entry.pingT);
          entry.pingT = setInterval(function () {
            if (entry.ws === ws && ws.readyState === 1 && entry.ready) {
              try { ws.send(mqttPingReqPkt()); } catch (e) { /* ignore */ }
            }
          }, 25000);
          // 連上後立即廣播一次目前在該學院的狀態
          if (!_leftSent) {
            sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
          }
        } else if (pktType === 3 && body.length >= 2) { // PUBLISH
          var tLen = (body[0] << 8) | body[1];
          var pStart = 2 + tLen;
          var qos = (flags >> 1) & 0x03;
          if (qos > 0) pStart += 2;
          if (pStart <= body.length) {
            var topicStr = mqttUtf8Decode(body.subarray(2, 2 + tLen));
            var payloadStr = mqttUtf8Decode(body.subarray(pStart));
            if (topicStr === MQTT_CTL_TOPIC && payloadStr) {
              try {
                var d = JSON.parse(payloadStr);
                if (d && (d.event === 'ping' || d.action === 'ping')) {
                  if (Date.now() - _lastPongSentMs >= 3500) {
                    _lastPongSentMs = Date.now();
                    setTimeout(function () {
                      if (!_leftSent) sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'pong' });
                    }, 80 + Math.floor(Math.random() * 280));
                  }
                }
              } catch (e) { /* ignore */ }
            }
          }
        }
      }
    };

    var onDisconnect = function () {
      if (entry.ws !== ws) return;
      entry.ready = false;
      entry.ws = null;
      if (entry.pingT) { clearInterval(entry.pingT); entry.pingT = 0; }
      if (entry.retryT) clearTimeout(entry.retryT);
      var wait = entry.backoff + Math.floor(Math.random() * 600);
      entry.backoff = Math.min(18000, Math.round(entry.backoff * 1.7));
      entry.retryT = setTimeout(function () {
        entry.retryT = 0;
        connectSingleAcademyMqtt(url, idx, toolId);
      }, wait);
    };
    ws.onerror = onDisconnect;
    ws.onclose = onDisconnect;
  }

  function connectAcademyMqtt(toolId) {
    if (!window.WebSocket || isNavBot()) return;
    MQTT_BROKERS.forEach(function (url, idx) {
      connectSingleAcademyMqtt(url, idx, toolId);
    });
  }

  function connectAcademyRollCall(toolId) {
    connectAcademyMqtt(toolId);
    if (!window.EventSource || isNavBot()) return;
    if (_navEs) {
      try { _navEs.close(); } catch (e) { /* ignore */ }
      _navEs = null;
    }
    try {
      var es = new EventSource('https://ntfy.sh/' + NTFY_TOPIC + '/sse');
      _navEs = es;
      es.onopen = function () { _navEsBackoff = 2000; };
      es.onmessage = function (ev) {
        try {
          var m = JSON.parse(ev.data);
          if (m && m.time) syncNavClock(+m.time);
          if (!m || m.event !== 'message' || !m.message) return;
          var d = JSON.parse(m.message);
          if (d && (d.event === 'ping' || d.action === 'ping')) {
            if (Date.now() - _lastPongSentMs >= 3500) {
              _lastPongSentMs = Date.now();
              setTimeout(function () {
                if (!_leftSent) sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'pong' });
              }, 100 + Math.floor(Math.random() * 350));
            }
          }
        } catch (e) { /* ignore */ }
      };
      es.onerror = function () {
        try { es.close(); } catch (e) { /* ignore */ }
        if (_navEs === es) _navEs = null;
        if (_navEsRetryT) clearTimeout(_navEsRetryT);
        var wait = _navEsBackoff + Math.floor(Math.random() * 800);
        _navEsBackoff = Math.min(20000, Math.floor(_navEsBackoff * 1.8));
        _navEsRetryT = setTimeout(function () {
          _navEsRetryT = 0;
          connectAcademyRollCall(toolId);
        }, wait);
      };
    } catch (e) { /* ignore */ }
  }

  function startAcademyPresenceLoop(toolId) {
    if (!toolId || !TOOL_MAP[toolId] || _presenceLoopBound || isNavBot()) return;
    _presenceLoopBound = true;
    touchTabLease(toolId);

    window.addEventListener('keydown', function (e) {
      if (!e) return;
      if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.key === 'R'))) {
        markInternalNav();
      }
    }, true);

    if (window.BroadcastChannel) {
      try {
        _navBc = new BroadcastChannel(BC_NAME);
        _navBc.onmessage = function (ev) {
          var d = ev && ev.data;
          if (!d) return;
          if (d.event === 'tab_closed' && d.tabId !== TAB_ID && !document.hidden) {
            sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
          } else if (d.event === 'ping' && Date.now() - _lastPongSentMs >= 3000) {
            _lastPongSentMs = Date.now();
            sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'pong' });
          }
        };
      } catch (e) { _navBc = null; }
    }

    var onUserAct = function () {
      var wasAway = (Date.now() - _lastActMs) >= 90000;
      _lastActMs = Date.now();
      _leftSent = false;
      if (wasAway && !document.hidden) {
        sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'active' });
      }
    };
    ['pointerdown', 'keydown', 'touchstart', 'touchmove', 'wheel'].forEach(function (evName) {
      window.addEventListener(evName, onUserAct, { passive: true });
    });

    setInterval(function () {
      touchTabLease(toolId);
      sendPresenceHeartbeat(toolId, { forceRemote: false });
    }, 10000);

    document.addEventListener('visibilitychange', function () {
      touchTabLease(toolId);
      if (!document.hidden) {
        _leftSent = false;
        _lastActMs = Date.now();
        connectAcademyMqtt(toolId);
        if (!_navEs) connectAcademyRollCall(toolId);
        sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'active' });
      } else {
        sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'away' });
      }
    });
    window.addEventListener('online', function () {
      _leftSent = false;
      connectAcademyRollCall(toolId);
      sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
    });
    window.addEventListener('pageshow', function () {
      _leftSent = false;
      _internalNav = false;
      touchTabLease(toolId);
      connectAcademyRollCall(toolId);
      sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
    });

    function onUnload() {
      if (_leftSent) return;
      _leftSent = true;
      var otherTabs = removeTabLease();
      var recentNavTs = 0;
      try { recentNavTs = +window.localStorage.getItem(NAV_TS_KEY) || 0; } catch (e) { /* ignore */ }
      var isInternal = _internalNav || (Date.now() - recentNavTs < 5000);
      if (otherTabs > 0) {
        if (_navBc) {
          try { _navBc.postMessage({ event: 'tab_closed', tabId: TAB_ID }); } catch (e) { /* ignore */ }
        }
        return;
      }
      if (!isInternal) {
        sendPresenceHeartbeat(toolId, { leave: true });
      }
    }
    window.addEventListener('pagehide', onUnload);
    window.addEventListener('beforeunload', onUnload);

    connectAcademyRollCall(toolId);
  }

    function flushActs() {

      if (cur.daily) cur.daily.acts = (+cur.daily.acts || 0) + pendingActs;

  var START_FEN = startSetup(19);
  var START_FEN_9 = startSetup(9);
  var START_FEN_13 = startSetup(13);

  function isStandardStart(fen) {
    return fen === START_FEN || fen === START_FEN_9 || fen === START_FEN_13;
  }

  function encodeRows(board, sz) {
    var out = [];
    for (var r = 0; r < sz; r++) {
      var row = '';
      var empty = 0;
      for (var c = 0; c < sz; c++) {
        var v = board[r * sz + c];
        if (!v) { empty++; continue; }
        if (empty) { row += empty; empty = 0; }
        row += v === BLACK ? 'X' : 'O';
      }
      if (empty) row += empty;
      out.push(row);
    }
    return out.join('/');
  }

  function encodeBoardSetup(board, sz, komi, turn, ko) {
    return sz + ':' + komi + ':' + (turn === WHITE ? 'w' : 'b') + ':' +
      (ko >= 0 ? sqToStr(ko, sz) : '-') + ':' + encodeRows(board, sz);
  }

  /**
   * 解析局面字串：
   *   "19:7.5:b:-:19/19/..." 或簡寫數字 9 / 13 / 19（建立對應大小的空盤）。
   *   列內支援 X/B 黑、O/W 白、. 空點或數字連續空點。
   */
  function parseFen(spec) {
    if (spec === 9 || spec === 13 || spec === 19) spec = startSetup(spec);
    var s = String(spec || START_FEN).trim();
    if (s === '9' || s === '13' || s === '19') s = startSetup(+s);
    var parts = s.split(':');
    if (parts.length < 5) throw new Error('局面格式錯誤：' + s.slice(0, 40));
    var sz = parseInt(parts[0], 10);
    if (!validSize(sz)) throw new Error('不支援的棋盤路數：' + parts[0]);
    var komi = parseFloat(parts[1]);
    if (!isFinite(komi)) komi = defaultKomi(sz, 0);
    var turn = parts[2].toLowerCase() === 'w' ? WHITE : BLACK;
    var ko = parts[3] && parts[3] !== '-' ? strToSq(parts[3], sz) : -1;
    var rows = parts.slice(4).join(':').split('/');
    if (rows.length !== sz) throw new Error('棋盤必須有 ' + sz + ' 列（得到 ' + rows.length + ' 列）');
    var board = new Int8Array(sz * sz);
    for (var r = 0; r < sz; r++) {
      var c = 0;
      var line = rows[r];
      var i = 0;
      while (i < line.length) {
        var ch = line[i];
        if (ch >= '0' && ch <= '9') {
          var j = i + 1;
          while (j < line.length && line[j] >= '0' && line[j] <= '9') j++;
          c += parseInt(line.slice(i, j), 10);
          i = j;
          continue;
        }
        if (ch === '.') { c++; i++; continue; }
        if (ch === 'X' || ch === 'B' || ch === 'b') {
          if (c >= sz) throw new Error('第 ' + (r + 1) + ' 列超出寬度');
          board[r * sz + c] = BLACK; c++; i++; continue;
        }
        if (ch === 'O' || ch === 'W' || ch === 'w') {
          if (c >= sz) throw new Error('第 ' + (r + 1) + ' 列超出寬度');
          board[r * sz + c] = WHITE; c++; i++; continue;
        }
        throw new Error('第 ' + (r + 1) + ' 列含未知符號：' + ch);
      }
      if (c !== sz) throw new Error('第 ' + (r + 1) + ' 列長度不是 ' + sz + '（得到 ' + c + '）');
    }
    if (ko >= 0 && board[ko] !== EMPTY) ko = -1;
    return {
      size: sz,
      komi: komi,
      board: board,
      turn: turn,
      ko: ko,
      passes: 0,
      caps: [0, 0, 0], // caps[BLACK] = 黑方提掉的白子數；caps[WHITE] = 白方提掉的黑子數
    };
  }

  function toFen(pos) {
    return encodeBoardSetup(pos.board, pos.size, pos.komi, pos.turn, pos.ko);
  }

  /** 純盤面鍵（用於禁全同 Positional Superko 判定）。 */
  function boardKey(pos) {
    return encodeRows(pos.board, pos.size);
  }

  function posKey(pos) {
    return pos.size + ':' + (pos.turn === WHITE ? 'w:' : 'b:') + (pos.ko >= 0 ? pos.ko : '-') + ':' + boardKey(pos);
  }

  function clonePos(pos) {
    return {
      size: pos.size,
      komi: pos.komi,
      board: new Int8Array(pos.board),
      turn: pos.turn,
      ko: pos.ko,
      passes: pos.passes,
      caps: [0, pos.caps[1], pos.caps[2]],
    };
  }

  // ------------------------------------------------------------------ 棋塊與氣數計算
  var _stamp = 1;
  var _seen = new Int32Array(361);
  var _libSeen = new Int32Array(361);

  function nextStamp() {
    _stamp = (_stamp + 1) | 0;
    if (_stamp <= 0 || _stamp > 0x7ffffff0) {
      _stamp = 1;
      for (var i = 0; i < 361; i++) { _seen[i] = 0; _libSeen[i] = 0; }
    }
    return _stamp;
  }

  /**
   * 查詢 sq 所在棋塊：{ color, stones: [...], libs: [...] }。
   * 空點回傳 null。
   */
  function groupAt(pos, sq) {
    var b = pos.board, sz = pos.size;
    var color = b[sq];
    if (!color) return null;
    var n4 = NB4[sz];
    var st = nextStamp();
    var lst = nextStamp();
    var stones = [sq];
    var libs = [];
    _seen[sq] = st;
    for (var h = 0; h < stones.length; h++) {
      var u = stones[h];
      var adj = n4[u];
      for (var i = 0; i < adj.length; i++) {
        var v = adj[i];
        var cv = b[v];
        if (cv === EMPTY) {
          if (_libSeen[v] !== lst) { _libSeen[v] = lst; libs.push(v); }
        } else if (cv === color && _seen[v] !== st) {
          _seen[v] = st;
          stones.push(v);
        }
      }
    }
    return { color: color, stones: stones, libs: libs };
  }

  /** 快速判斷 sq 所在棋塊是否至少有 minLibs 口氣（不做完整陣列配置，供合法性與 AI 快速呼叫）。 */
  function hasLibertiesAtLeast(board, sz, sq, minLibs) {
    var color = board[sq];
    if (!color) return false;
    var n4 = NB4[sz];
    var st = nextStamp();
    var lst = nextStamp();
    var stack = [sq];
    _seen[sq] = st;
    var count = 0;
    while (stack.length) {
      var u = stack.pop();
      var adj = n4[u];
      for (var i = 0; i < adj.length; i++) {
        var v = adj[i];
        var cv = board[v];
        if (cv === EMPTY) {
          if (_libSeen[v] !== lst) {
            _libSeen[v] = lst;
            if (++count >= minLibs) return true;
          }
        } else if (cv === color && _seen[v] !== st) {
          _seen[v] = st;
          stack.push(v);
        }
      }
    }
    return false;
  }

  function collectGroupStones(board, sz, sq) {
    var color = board[sq];
    var n4 = NB4[sz];
    var st = nextStamp();
    var stones = [sq];
    _seen[sq] = st;
    for (var h = 0; h < stones.length; h++) {
      var adj = n4[stones[h]];
      for (var i = 0; i < adj.length; i++) {
        var v = adj[i];
        if (board[v] === color && _seen[v] !== st) {
          _seen[v] = st;
          stones.push(v);
        }
      }
    }
    return stones;
  }

  /**
   * 檢查目前輪走方在 sq 落子是否符合「局部規則」（空點、非單劫禁點、非自殺）；
   * 不檢查全局禁全同（Superko 由 Game 檢查）。
   */
  function isPseudoLegal(pos, m) {
    if (m === PASS) return true;
    var sz = pos.size;
    if (m < 0 || m >= sz * sz) return false;
    var b = pos.board;
    if (b[m] !== EMPTY || m === pos.ko) return false;
    var side = pos.turn, enemy = 3 - side;
    var adj = NB4[sz][m];
    // 鄰點只要有一個空點，落子後必有氣。
    for (var i = 0; i < adj.length; i++) {
      if (b[adj[i]] === EMPTY) return true;
    }
    b[m] = side;
    var ok = false;
    // 若能提掉任一塊敵子，必有氣；否則檢查連通後的己方棋塊是否還有氣。
    for (i = 0; i < adj.length; i++) {
      var v = adj[i];
      if (b[v] === enemy && !hasLibertiesAtLeast(b, sz, v, 1)) { ok = true; break; }
    }
    if (!ok && hasLibertiesAtLeast(b, sz, m, 1)) ok = true;
    b[m] = EMPTY;
    return ok;
  }

  /**
   * 在 pos 上走一步 m（落子或 PASS），直接修改 pos 並回傳復原紀錄 u；
   * 不合法時不修改 pos 並回傳 null。
   */
  function makeMove(pos, m) {
    var side = pos.turn;
    var enemy = 3 - side;
    if (m === PASS) {
      var uPass = { m: PASS, side: side, ko: pos.ko, passes: pos.passes, captured: null };
      pos.ko = -1;
      pos.passes = pos.passes + 1;
      pos.turn = enemy;
      return uPass;
    }
    var sz = pos.size;
    if (m < 0 || m >= sz * sz) return null;
    var b = pos.board;
    if (b[m] !== EMPTY || m === pos.ko) return null;

    b[m] = side;
    var adj = NB4[sz][m];
    var captured = [];
    for (var i = 0; i < adj.length; i++) {
      var v = adj[i];
      if (b[v] === enemy && !hasLibertiesAtLeast(b, sz, v, 1)) {
        var dead = collectGroupStones(b, sz, v);
        for (var k = 0; k < dead.length; k++) {
          b[dead[k]] = EMPTY;
          captured.push(dead[k]);
        }
      }
    }
    if (!captured.length && !hasLibertiesAtLeast(b, sz, m, 1)) {
      b[m] = EMPTY;
      return null; // 禁止自殺
    }
    var nextKo = -1;
    if (captured.length === 1) {
      var g = groupAt(pos, m);
      if (g && g.stones.length === 1 && g.libs.length === 1) nextKo = captured[0];
    }
    var u = { m: m, side: side, ko: pos.ko, passes: pos.passes, captured: captured };
    pos.caps[side] += captured.length;
    pos.ko = nextKo;
    pos.passes = 0;
    pos.turn = enemy;
    return u;
  }

  function undoMove(pos, u) {
    if (!u) return;
    pos.turn = u.side;
    pos.ko = u.ko;
    pos.passes = u.passes;
    if (u.m === PASS) return;
    var b = pos.board;
    b[u.m] = EMPTY;
    var enemy = 3 - u.side;
    if (u.captured && u.captured.length) {
      pos.caps[u.side] -= u.captured.length;
      for (var i = 0; i < u.captured.length; i++) b[u.captured[i]] = enemy;
    }
  }

  /** 盤面上所有只有一口氣（被打吃／叫吃）的棋子索引陣列。 */
  function atariStones(pos, sideFilter) {
    var sz = pos.size, n = sz * sz, b = pos.board;
    var visited = new Uint8Array(n);
    var out = [];
    for (var sq = 0; sq < n; sq++) {
      var c = b[sq];
      if (!c || visited[sq]) continue;
      if (sideFilter && c !== sideFilter) continue;
      var g = groupAt(pos, sq);
      for (var i = 0; i < g.stones.length; i++) visited[g.stones[i]] = 1;
      if (g.libs.length === 1) {
        for (i = 0; i < g.stones.length; i++) out.push(g.stones[i]);
      }
    }
    return out;
  }

  // ------------------------------------------------------------------ 死子偵測、數子點目與形勢估算
  /**
   * 終局自動死子清理：在雙方連續虛手後，找出明顯被困在對方活棋勢力圈內、
   * 氣數極少且完全沒有做兩眼空間的孤立殘子（例如留在對方大空裡的 1～5 顆廢子），
   * 讓初學者不必在自己的空裡多補好幾手把每顆死子都提光，點目結果依然精準。
   */
  function detectDeadStones(pos) {
    var sz = pos.size, n = sz * sz, b = pos.board, n4 = NB4[sz];
    var dead = new Uint8Array(n);

    // 建立棋塊清單與相鄰空域。
    var gidOf = new Int16Array(n);
    for (var i = 0; i < n; i++) gidOf[i] = -1;
    var groups = [];
    for (var sq = 0; sq < n; sq++) {
      if (!b[sq] || gidOf[sq] >= 0) continue;
      var g = groupAt(pos, sq);
      var gid = groups.length;
      for (i = 0; i < g.stones.length; i++) gidOf[g.stones[i]] = gid;
      groups.push(g);
    }

    // 找出每一塊空點連通區域，統計它接觸到哪些棋塊與顏色。
    var regOf = new Int16Array(n);
    for (i = 0; i < n; i++) regOf[i] = -1;
    var regions = [];
    for (sq = 0; sq < n; sq++) {
      if (b[sq] !== EMPTY || regOf[sq] >= 0) continue;
      var rid = regions.length;
      var pts = [sq];
      regOf[sq] = rid;
      var touchBlack = false, touchWhite = false;
      var gset = {};
      for (var h = 0; h < pts.length; h++) {
        var adj = n4[pts[h]];
        for (i = 0; i < adj.length; i++) {
          var v = adj[i];
          if (b[v] === EMPTY) {
            if (regOf[v] < 0) { regOf[v] = rid; pts.push(v); }
          } else {
            if (b[v] === BLACK) touchBlack = true;
            else touchWhite = true;
            gset[gidOf[v]] = true;
          }
        }
      }
      regions.push({
        pts: pts,
        pureColor: touchBlack && !touchWhite ? BLACK : (!touchBlack && touchWhite ? WHITE : 0),
        gids: Object.keys(gset).map(Number),
      });
    }

    // 統計每個棋塊擁有的「純己方小眼位（<= 6 點）」數量。
    var eyeCount = new Int16Array(groups.length);
    for (i = 0; i < regions.length; i++) {
      var reg = regions[i];
      if (reg.pureColor && reg.pts.length <= 8) {
        reg.gids.forEach(function (gid) { eyeCount[gid]++; });
      }
    }

    // 判斷孤立殘子：棋子數 <= 5、完全沒有純己方眼位，且氣數 <= 2（做不出兩眼），
    // 周圍包圍它的敵方棋塊氣數充足（排除雙活或對殺緊氣）。
    for (var gid2 = 0; gid2 < groups.length; gid2++) {
      var grp = groups[gid2];
      if (grp.stones.length > 5 || eyeCount[gid2] >= 1) continue;
      if (grp.libs.length > 2) continue;
      var maxEmpty = 0;
      var allEnemyWalled = true;
      var enemyStrong = false;
      var enemyWeak = false;
      for (i = 0; i < grp.stones.length; i++) {
        var adj2 = n4[grp.stones[i]];
        for (var k = 0; k < adj2.length; k++) {
          var u = adj2[k];
          if (b[u] === EMPTY) {
            var regU = regions[regOf[u]];
            if (regU.pts.length > maxEmpty) maxEmpty = regU.pts.length;
            var hasEnemyWall = false;
            for (var rg = 0; rg < regU.gids.length; rg++) {
              var og = regU.gids[rg];
              if (og !== gid2 && groups[og].color === grp.color) allEnemyWalled = false;
              if (groups[og].color !== grp.color && (groups[og].libs.length >= 3 || groups[og].stones.length >= 5)) hasEnemyWall = true;
            }
            if (!hasEnemyWall) allEnemyWalled = false;
          } else if (b[u] !== grp.color) {
            var eg = groups[gidOf[u]];
            if (eg.libs.length >= 3 || eyeCount[gidOf[u]] >= 2 || (grp.libs.length === 1 && eg.libs.length >= 2)) enemyStrong = true;
            if (eg.libs.length < grp.libs.length) enemyWeak = true;
          }
        }
      }
      for (i = 0; i < grp.libs.length; i++) {
        var adjL = n4[grp.libs[i]];
        for (k = 0; k < adjL.length; k++) {
          var w = adjL[k];
          if (b[w] && b[w] !== grp.color) {
            var eg2 = groups[gidOf[w]];
            if (eg2.libs.length >= 3 || eyeCount[gidOf[w]] >= 2 || (grp.libs.length === 1 && eg2.libs.length >= 2)) enemyStrong = true;
          }
        }
      }
      var enclosedDead = (maxEmpty <= 4) || (allEnemyWalled && grp.stones.length <= 3);
      if (enclosedDead && enemyStrong && !enemyWeak) {
        for (i = 0; i < grp.stones.length; i++) dead[grp.stones[i]] = 1;
      }
    }
    return dead;
  }

  /**
   * 中國數子／子空皆地計目：
   *   deadMask 可傳入自訂死子標記（Uint8Array），省略時自動呼叫 detectDeadStones(pos)。
   *   回傳 { blackArea, whiteArea, blackStones, whiteStones, blackTerritory, whiteTerritory,
   *          neutral, komi, lead（黑減白減貼目）, winner, margin, owner, dead }。
   */
  function scoreArea(pos, deadMask) {
    var sz = pos.size, n = sz * sz, b = pos.board, n4 = NB4[sz];
    var dead = deadMask || detectDeadStones(pos);
    var eff = new Int8Array(n);
    var blackStones = 0, whiteStones = 0;
    for (var sq = 0; sq < n; sq++) {
      var c = dead[sq] ? EMPTY : b[sq];
      eff[sq] = c;
      if (c === BLACK) blackStones++;
      else if (c === WHITE) whiteStones++;
    }

    var owner = new Int8Array(n);
    var visited = new Uint8Array(n);
    var blackTerritory = 0, whiteTerritory = 0, neutral = 0;
    for (sq = 0; sq < n; sq++) {
      if (eff[sq] !== EMPTY) { owner[sq] = eff[sq]; continue; }
      if (visited[sq]) continue;
      var pts = [sq];
      visited[sq] = 1;
      var tb = false, tw = false;
      for (var h = 0; h < pts.length; h++) {
        var adj = n4[pts[h]];
        for (var i = 0; i < adj.length; i++) {
          var v = adj[i];
          if (eff[v] === EMPTY) {
            if (!visited[v]) { visited[v] = 1; pts.push(v); }
          } else if (eff[v] === BLACK) tb = true;
          else if (eff[v] === WHITE) tw = true;
        }
      }
      var terr = tb && !tw ? BLACK : (!tb && tw ? WHITE : 0);
      for (i = 0; i < pts.length; i++) owner[pts[i]] = terr;
      if (terr === BLACK) blackTerritory += pts.length;
      else if (terr === WHITE) whiteTerritory += pts.length;
      else neutral += pts.length;
    }

    var blackArea = blackStones + blackTerritory;
    var whiteArea = whiteStones + whiteTerritory;
    // 若全盤連一顆活子都沒有（空盤雙虛手），只計貼目。
    var lead = blackArea - whiteArea - pos.komi;
    lead = Math.round(lead * 2) / 2;
    return {
      blackArea: blackArea,
      whiteArea: whiteArea,
      blackStones: blackStones,
      whiteStones: whiteStones,
      blackTerritory: blackTerritory,
      whiteTerritory: whiteTerritory,
      neutral: neutral,
      komi: pos.komi,
      lead: lead,
      winner: lead > 0 ? BLACK : (lead < 0 ? WHITE : null),
      margin: Math.abs(lead),
      owner: owner,
      dead: dead,
    };
  }

  /**
   * 即時形勢判斷（中盤與終局皆適用）：
   *   若已經雙虛手終局，直接回傳精確 scoreArea；
   *   否則用 Bouzy 輻射擴散與侵蝕（5 輪擴張 + 2 輪收斂）估算雙方的控制領地與勢力。
   */
  function estimateTerritory(pos) {
    if (pos.passes >= 2) {
      var exact = scoreArea(pos);
      exact.exact = true;
      exact.terrMap = exact.owner;
      return exact;
    }
    var sz = pos.size, n = sz * sz, b = pos.board, n4 = NB4[sz];
    var dead = detectDeadStones(pos);
    var inf = new Float32Array(n);
    var tmp = new Float32Array(n);
    var sq, i, step;
    for (sq = 0; sq < n; sq++) {
      var c = dead[sq] ? EMPTY : b[sq];
      inf[sq] = c === BLACK ? 64 : (c === WHITE ? -64 : 0);
    }
    // 4 輪勢力擴散
    for (step = 0; step < 4; step++) {
      for (sq = 0; sq < n; sq++) {
        var c0 = dead[sq] ? EMPTY : b[sq];
        if (c0) { tmp[sq] = c0 === BLACK ? 64 : -64; continue; }
        var sum = inf[sq];
        var adj = n4[sq];
        for (i = 0; i < adj.length; i++) sum += inf[adj[i]] * 0.55;
        tmp[sq] = sum;
      }
      inf.set(tmp);
    }
    // 1 輪邊界收斂（抵消雙方交界處的公氣虛胖）
    for (sq = 0; sq < n; sq++) {
      var c1 = dead[sq] ? EMPTY : b[sq];
      if (c1) { tmp[sq] = c1 === BLACK ? 64 : -64; continue; }
      var adj2 = n4[sq];
      var posCnt = 0, negCnt = 0;
      for (i = 0; i < adj2.length; i++) {
        if (inf[adj2[i]] > 4) posCnt++;
        else if (inf[adj2[i]] < -4) negCnt++;
      }
      tmp[sq] = (posCnt && negCnt) ? inf[sq] * 0.35 : inf[sq];
    }

    var terrMap = new Int8Array(n);
    var bStones = 0, wStones = 0, bTerr = 0, wTerr = 0, neutral = 0;
    var THRESH = 14;
    for (sq = 0; sq < n; sq++) {
      var live = dead[sq] ? EMPTY : b[sq];
      if (live === BLACK) { bStones++; terrMap[sq] = BLACK; }
      else if (live === WHITE) { wStones++; terrMap[sq] = WHITE; }
      else if (tmp[sq] >= THRESH) { bTerr++; terrMap[sq] = BLACK; }
      else if (tmp[sq] <= -THRESH) { wTerr++; terrMap[sq] = WHITE; }
      else neutral++;
    }
    var bArea = bStones + bTerr;
    var wArea = wStones + wTerr;
    var lead = Math.round((bArea - wArea - pos.komi) * 2) / 2;
    return {
      exact: false,
      blackArea: bArea,
      whiteArea: wArea,
      blackStones: bStones,

          if (playedBy && !playedBy[cand]) playedBy[cand] = side;
          if (uC.captured.length) {
            for (var ci = 0; ci < uC.captured.length; ci++) empties.push(uC.captured[ci]);
          }
          lastMove = cand;
          chosen = -2; // 已直接落子
          break;
        }
      }

      // 3. 若抽樣沒找到，掃描一輪所有空點找任何非真眼合法點，真的都沒有就虛手 Pass
      if (chosen === -1) {
        var startIdx = (rng() * n) | 0;
        for (var k = 0; k < n; k++) {
          var s2 = (startIdx + k) % n;
          if (simPos.board[s2] !== E.EMPTY || s2 === simPos.ko || isTrueEye(simPos, s2, side)) continue;
          var u2 = E.makeMove(simPos, s2);
          if (!u2) continue;
          if (!u2.captured.length && !E.hasLibertiesAtLeast(simPos.board, sz, s2, 2)) {
            E.undoMove(simPos, u2);
            continue;
          }
          if (playedBy && !playedBy[s2]) playedBy[s2] = side;
          if (u2.captured.length) {
            for (var c2 = 0; c2 < u2.captured.length; c2++) empties.push(u2.captured[c2]);
          }
          lastMove = s2;
          chosen = -2;
          break;
        }
      }

      if (chosen >= 0) {
        var uChosen = E.makeMove(simPos, chosen);
        if (uChosen) {
          if (playedBy && !playedBy[chosen]) playedBy[chosen] = side;
          if (uChosen.captured.length) {
            for (var c3 = 0; c3 < uChosen.captured.length; c3++) empties.push(uChosen.captured[c3]);
          }
          lastMove = chosen;
        } else {
          E.makeMove(simPos, E.PASS);
          lastMove = E.PASS;
        }
      } else if (chosen === -1) {
        E.makeMove(simPos, E.PASS);
        lastMove = E.PASS;
      }
    }

    var lead = fastPlayoutScore(simPos, rng);
    if (lead === 0) return 0.5;
    return (lead > 0) === (rootSide === E.BLACK) ? 1 : 0;
  }

  /** 判斷是否已進入「雙官收完、應該虛手 Pass」的終局狀態。 */
  function shouldPassNow(game, bestCand) {
    var pos = game.pos;
    if (!bestCand) return true;
    var stones = countStones(pos);
    var n = pos.size * pos.size;
    // 對方剛虛手，且我方目前評估已穩贏且最佳候選點沒有提子／救子價值時，跟著虛手結束對局
    if (pos.passes >= 1 && stones >= Math.floor(n * 0.28)) {
      var sc = E.scoreArea(pos);
      var myWin = (pos.turn === E.BLACK && sc.lead > 0) || (pos.turn === E.WHITE && sc.lead < 0);
      if (myWin && bestCand.s < 85) return true;
      if (bestCand.s < 15) return true;
    }
    // 盤面已相當飽滿，檢查是否還存在「黑白交界的公氣／未定區域」或被打吃的棋塊
    if (stones >= Math.floor(n * 0.45) && bestCand.s < 20) {
      var owner = E.scoreArea(pos).owner;
      var hasNeutral = false;
      for (var sq = 0; sq < n; sq++) {
        if (pos.board[sq] === E.EMPTY && owner[sq] === 0 && !isTrueEye(pos, sq, pos.turn) && !isTrueEye(pos, sq, 3 - pos.turn)) {
          if (game.isLegal(sq)) { hasNeutral = true; break; }
        }
      }
      if (!hasNeutral) return true;
    }
    return false;
  }

  /** 淺層戰術極小化極大搜尋（給初學者～中級 AI 與 MCTS 先驗加權共用）。 */
  function minimaxScore(pos, depth, alpha, beta, lastSq) {
    if (depth <= 0) return evaluate(pos);
    var width = depth >= 3 ? 8 : 10;
    var cands = topCandidates(pos, width, lastSq, depth >= 2, null);
    if (!cands.length) return evaluate(pos);
    var best = -1e9;
    for (var i = 0; i < cands.length; i++) {
      var m = cands[i].m;
      var u = E.makeMove(pos, m);
      if (!u) continue;
      var val = -minimaxScore(pos, depth - 1, -beta, -alpha, m);
      E.undoMove(pos, u);
      if (val > best) best = val;
      if (val > alpha) alpha = val;
      if (alpha >= beta) break;
    }
    return best === -1e9 ? evaluate(pos) : best;
  }

  /**
   * 主選步函式：替 game 目前輪走方選一手（回傳 { move, score, depth, nodes }）。
   */
  function think(game, cfg, rng) {
    rng = rng || Math.random;
    cfg = cfg || LEVELS[4];
    if (game.result()) return { move: -1, score: 0, depth: 0, nodes: 0 };

    var pos = E.clonePos(game.pos);
    var sz = pos.size, n = sz * sz;
    var banned = {};
    // 預先排除違反全局禁全同（Positional Superko）的點
    for (var sq = 0; sq < n; sq++) {
      if (pos.board[sq] === E.EMPTY && sq !== pos.ko && !game.isLegal(sq)) banned[sq] = 1;
    }

    var lastSq = game.lastStone();
    var useLadder = (cfg.depth || 1) >= 2 || (cfg.playouts || 0) >= 200;
    var cands = topCandidates(pos, sz === 9 ? 28 : 26, lastSq, useLadder, banned);

    if (!cands.length || shouldPassNow(game, cands[0])) {
      return { move: E.PASS, score: 0, depth: 0, nodes: 1 };
    }

    // 開局第一手定石／星小目多樣化（標準空盤第一手選星位、小目或九路天元附近）
    if (!game.history.length && E.isStandardStart(game.startFen) && !cfg.randomProb && cfg.margin > 0) {
      var openBook = sz === 9
        ? ['E5', 'E5', 'D5', 'E4', 'D4', 'F6']
        : (sz === 13
          ? ['D10', 'K10', 'D4', 'K4', 'G7', 'D9', 'C10']
          : ['Q16', 'D16', 'Q4', 'D4', 'Q17', 'R16', 'D17', 'C16']);
      var pickStr = openBook[(rng() * openBook.length) | 0];
      var bm = E.strToMove(pickStr, sz);
      if (bm >= 0 && game.isLegal(bm)) return { move: bm, score: 0, depth: 1, nodes: 1 };
    }

    // 最入門難度的隨機擾動（仍只從非填真眼的合法候選點中選，不會亂自殺或亂填眼）
    if (cfg.randomProb && rng() < cfg.randomProb) {
      var pool = cands.slice(0, Math.min(cands.length, 12));
      return { move: pool[(rng() * pool.length) | 0].m, score: 0, depth: 0, nodes: pool.length };
    }

    var start = Date.now();
    var deadline = start + (cfg.timeMs || 800);
    var nodes = 0;

    // -------------------------------------------------------------- MCTS + RAVE（中段～職業段位 AI）
    if (cfg.playouts && cfg.playouts > 0) {
      var K = Math.min(cands.length, sz === 9 ? 20 : 18);
      var rootMoves = cands.slice(0, K);
      // 用先驗分數給予虛擬勝場（Prior Knowledge），讓 MCTS 一開始就聚焦好形與急所
      var maxPrior = rootMoves[0].s;
      var minPrior = rootMoves[rootMoves.length - 1].s;
      var span = Math.max(1, maxPrior - minPrior);

      var visits = new Float64Array(K);
      var wins = new Float64Array(K);
      var raveVisits = new Float64Array(n);
      var raveWins = new Float64Array(n);
      for (var i = 0; i < K; i++) {
        var norm = 0.25 + 0.55 * ((rootMoves[i].s - minPrior) / span);
        visits[i] = 4;
        wins[i] = 4 * norm;
      }

      var maxSteps = sz === 9 ? 95 : (sz === 13 ? 175 : 300);
      var playedBy = new Uint8Array(n);
      var rootSide = pos.turn;
      var totalPlayouts = cfg.playouts;
      // 大盤每次模擬步數較長，適度縮放模擬次數以確保回應時間流暢
      if (sz === 13) totalPlayouts = Math.max(60, Math.round(totalPlayouts * 0.55));
      else if (sz === 19) totalPlayouts = Math.max(45, Math.round(totalPlayouts * 0.30));

      for (var p = 0; p < totalPlayouts; p++) {
        if ((p & 15) === 15 && Date.now() > deadline) break;
        // UCB1 + RAVE 選取根節點分支
        var bestIdx = 0, bestUcb = -1e9;
        var logTotal = Math.log(p + 1 + K * 4);
        for (i = 0; i < K; i++) {
          var mv = rootMoves[i].m;
          var qVal = wins[i] / visits[i];
          var rv = raveVisits[mv];
          var betaRave = rv / (visits[i] + rv + 4 + 0.015 * visits[i] * rv);
          var raveQ = rv > 0 ? raveWins[mv] / rv : qVal;
          var val = (1 - betaRave) * qVal + betaRave * raveQ + 0.62 * Math.sqrt(logTotal / visits[i]);
          if (val > bestUcb) { bestUcb = val; bestIdx = i; }
        }

        var sim = E.clonePos(pos);
        var chosenMv = rootMoves[bestIdx].m;
        E.makeMove(sim, chosenMv);
        playedBy.fill(0);
        playedBy[chosenMv] = rootSide;
        var win = runPlayout(sim, rootSide, maxSteps, rng, playedBy);
        nodes++;
        visits[bestIdx] += 1;
        wins[bestIdx] += win;
        for (var q = 0; q < K; q++) {
          var rm = rootMoves[q].m;
          if (playedBy[rm] === rootSide) {
            raveVisits[rm] += 1;
            raveWins[rm] += win;
          }
        }
      }

      // 若模擬結果顯示勝率極低（< 3%）且盤面已進入官子尾聲、落後極大，也不主動投子，而是堂堂正正下到終局點目（讓玩家享受數子樂趣）
      var scoredRoot = [];
      for (i = 0; i < K; i++) {
        var wr = wins[i] / visits[i];
        // 混合訪問量與勝率換算成整數分數
        scoredRoot.push({ m: rootMoves[i].m, score: Math.round(wr * 1000 + visits[i] * 0.4), wr: wr });
      }
      scoredRoot.sort(function (a, c) { return c.score - a.score; });

      // 若最強一手的勝率還不如直接虛手終局（例如已收完所有單官），檢查是否該虛手
      if (pos.passes >= 1 && scoredRoot[0].wr > 0.85 && rootMoves[0].s < 40) {
        var curSc = E.scoreArea(pos);
        if ((rootSide === E.BLACK && curSc.lead > 0) || (rootSide === E.WHITE && curSc.lead < 0)) {
          return { move: E.PASS, score: scoredRoot[0].score, depth: cfg.depth || 2, nodes: nodes };
        }
      }

      var margin = cfg.bookPlies && game.history.length >= cfg.bookPlies ? 0 : (cfg.margin || 0);
      var topSc = scoredRoot[0].score;
      var poolMcts = scoredRoot.filter(function (x) { return x.score >= topSc - margin * 3; });
      var chosen = poolMcts[(rng() * poolMcts.length) | 0];
      return { move: chosen.m, score: chosen.score, depth: cfg.depth || 3, nodes: nodes };
    }

    // -------------------------------------------------------------- 啟發＋淺層戰術搜尋（級位入門 AI）
    var topK = cands.slice(0, Math.min(cands.length, 14));
    var depth = cfg.depth || 1;
    var results = [];
    for (var j = 0; j < topK.length; j++) {
      var cm = topK[j].m;
      var scEval = topK[j].s;
      if (depth >= 2 && Date.now() <= deadline) {
        var uTop = E.makeMove(pos, cm);
        if (uTop) {
          nodes++;
          scEval = topK[j].s * 0.65 - minimaxScore(pos, depth - 1, -1e8, 1e8, cm) * 0.35;
          E.undoMove(pos, uTop);
        }
      } else {
        nodes++;
      }
      results.push({ m: cm, score: Math.round(scEval) });
    }
    results.sort(function (a, c) { return c.score - a.score; });
    var effMargin = cfg.bookPlies && game.history.length >= cfg.bookPlies ? 0 : (cfg.margin || 0);
    var bestS = results[0].score;
    var near = results.filter(function (x) { return x.score >= bestS - effMargin; });
    var pick = near[(rng() * near.length) | 0];
    return { move: pick.m, score: pick.score, depth: depth, nodes: nodes };
  }

  // ------------------------------------------------------------------ 局部死活與手筋精確驗證器（solveTsumego）
  /**
   * 檢查目標座標陣列 targets 上的棋子是否已被吃掉（或剩 0 氣）。
   */
  function anyTargetCaptured(pos, targets, victimColor) {
    for (var i = 0; i < targets.length; i++) {
      if (pos.board[targets[i]] !== victimColor) return true;
    }
    return false;
  }

  /**
   * 統計某一方連通棋塊在局部區域內的獨立真眼數（用於做活／殺棋終端判定）。
   */
  function countLocalTrueEyes(pos, anchorSqs, color) {
    var sz = pos.size, b = pos.board, n4 = E.NB4[sz];
    var aliveStones = {};
    for (var i = 0; i < anchorSqs.length; i++) {
      var sq = anchorSqs[i];
      if (b[sq] !== color) return 0; // 核心棋筋已被提掉！
      var g = E.groupAt(pos, sq);
      for (var k = 0; k < g.stones.length; k++) aliveStones[g.stones[k]] = 1;
    }
    // 找出與這片棋相鄰的所有獨立封閉小空域，檢查是否為真眼
    var visited = {};
    var eyes = 0;
    var stoneKeys = Object.keys(aliveStones).map(Number);
    for (i = 0; i < stoneKeys.length; i++) {
      var adj = n4[stoneKeys[i]];
      for (k = 0; k < adj.length; k++) {
        var eSq = adj[k];
        if (b[eSq] !== E.EMPTY || visited[eSq]) continue;
        // Flood-fill 這個小眼位（<= 3 點）
        var reg = [eSq];
        visited[eSq] = 1;
        var pure = true;
        for (var h = 0; h < reg.length && reg.length <= 4; h++) {
          var a2 = n4[reg[h]];
          for (var j = 0; j < a2.length; j++) {
            var w = a2[j];
            if (b[w] === E.EMPTY) {
              if (!visited[w]) { visited[w] = 1; reg.push(w); }
            } else if (b[w] !== color) {
              pure = false;
            }
          }
        }
        if (!pure) continue;
        if (reg.length === 1 && isTrueEye(pos, reg[0], color)) {
          eyes++;
        } else if (reg.length >= 3 && reg.length <= 4) {
          // 直三／曲三／直四等未被點眼的空間：內部至少可做出兩眼（若長度 >= 4 直接兩眼活）
          if (reg.length >= 4) eyes += 2;
          else eyes += 1;
        } else if (reg.length === 2) {
          eyes += 1;
        }
      }
    }
    return eyes;
  }

  /**
   * 自動推導死活／手筋題的局部作戰區域（既有棋子外擴 2 格內的空點）。
   */
  function buildLocalRegion(pos, pad) {
    pad = pad || 2;
    var sz = pos.size, n = sz * sz, b = pos.board;
    var mark = new Uint8Array(n);
    var out = [];
    for (var sq = 0; sq < n; sq++) {
      if (!b[sq]) continue;
      var r = (sq / sz) | 0, c = sq % sz;
      for (var nr = Math.max(0, r - pad); nr <= Math.min(sz - 1, r + pad); nr++) {
        for (var nc = Math.max(0, c - pad); nc <= Math.min(sz - 1, c + pad); nc++) {
          mark[nr * sz + nc] = 1;
        }
      }
    }
    for (sq = 0; sq < n; sq++) if (mark[sq]) out.push(sq);
    return out;
  }

  /**
   * 局部精確搜尋驗證器（供 tools/check_engine.js 驗證題庫唯一解與正確性）：
   *   p = { fen, goal: 'capture' | 'live' | 'kill', targets: ['D8', ...], maxPlies }
   *   回傳 { wins: [moveStr, ...], nodes }。
   */
  function solveTsumego(p) {
    var pos = E.parseFen(p.fen);
    var sz = pos.size;
    var attacker = pos.turn;
    var defender = 3 - attacker;
    var targetSqs = (p.targets || []).map(function (s) { return typeof s === 'number' ? s : E.strToSq(s, sz); });
    var region = p.region
      ? p.region.map(function (s) { return typeof s === 'number' ? s : E.strToSq(s, sz); })
      : buildLocalRegion(pos, 2);
    var maxPlies = p.maxPlies || (p.line ? p.line.length + 2 : 5);
    var nodes = 0;
    var memo = {};

    function terminalState(curPos, ply) {
      if (p.goal === 'capture') {
        if (anyTargetCaptured(curPos, targetSqs, defender)) return 1;
        if (ply >= maxPlies) return -1;
        return 0;
      }
      if (p.goal === 'live') {
        if (anyTargetCaptured(curPos, targetSqs, attacker)) return -1;
        if (countLocalTrueEyes(curPos, targetSqs, attacker) >= 2 && curPos.turn === defender) {
          // 再讓防守方試最後一手看能不能破眼或提掉，若已是純兩真眼且氣 >= 2 則必活
          var minLib = 99;
          for (var i = 0; i < targetSqs.length; i++) {
            var g = E.groupAt(curPos, targetSqs[i]);
            if (g && g.libs.length < minLib) minLib = g.libs.length;
          }
          if (minLib >= 2) return 1;
        }
        if (ply >= maxPlies || curPos.passes >= 2) {
          return countLocalTrueEyes(curPos, targetSqs, attacker) >= 2 ? 1 : -1;
        }
        return 0;
      }
      if (p.goal === 'kill') {
        if (anyTargetCaptured(curPos, targetSqs, defender)) return 1;
        if (ply >= maxPlies || curPos.passes >= 2) {
          return countLocalTrueEyes(curPos, targetSqs, defender) >= 2 ? -1 : 1;
        }
        return 0;
      }
      return 0;
    }

    function search(curPos, ply, seenSet) {
      nodes++;
      var term = terminalState(curPos, ply);
      if (term !== 0) return term;

      var key = ply + ':' + E.posKey(curPos);
      if (memo[key] !== undefined) return memo[key];

      var isMax = curPos.turn === attacker;
      var moves = [];
      for (var i = 0; i < region.length; i++) {
        var sq = region[i];
        if (curPos.board[sq] === E.EMPTY && sq !== curPos.ko && E.isPseudoLegal(curPos, sq)) {
          moves.push(sq);
        }
      }
      if (p.goal !== 'capture') moves.push(E.PASS);

      if (!moves.length) {
        var resEmpty = p.goal === 'live'
          ? (countLocalTrueEyes(curPos, targetSqs, attacker) >= 2 ? 1 : -1)
          : -1;
        memo[key] = resEmpty;
        return resEmpty;
      }

      var best = isMax ? -1 : 1;
      for (i = 0; i < moves.length; i++) {
        var m = moves[i];
        var u = E.makeMove(curPos, m);
        if (!u) continue;
        var bk = m === E.PASS ? null : E.boardKey(curPos);
        if (bk && seenSet[bk]) {
          E.undoMove(curPos, u);
          continue; // 禁全同
        }
        if (bk) seenSet[bk] = 1;
        var val = search(curPos, ply + 1, seenSet);
        if (bk) delete seenSet[bk];
        E.undoMove(curPos, u);
        if (isMax) {
          if (val > best) best = val;
          if (best === 1) break;
        } else {
          if (val < best) best = val;
          if (best === -1) break;
        }
      }
      memo[key] = best;
      return best;
    }

    var wins = [];
    var initSeen = {};
    initSeen[E.boardKey(pos)] = 1;
    for (var i = 0; i < region.length; i++) {
      var m = region[i];
      if (pos.board[m] !== E.EMPTY || m === pos.ko) continue;
      var u = E.makeMove(pos, m);
      if (!u) continue;
      var bk = E.boardKey(pos);
      if (initSeen[bk]) { E.undoMove(pos, u); continue; }
      initSeen[bk] = 1;
      var v = search(pos, 1, initSeen);
      delete initSeen[bk];
      E.undoMove(pos, u);
      if (v === 1) wins.push(E.sqToStr(m, sz));
    }
    return { wins: wins, nodes: nodes };
  }

  function thinkFromMoves(fen, moves, level, hint) {
    var game = E.Game.fromMoves(fen, moves || []);
    return think(game, hint ? HINT : (LEVELS[level] || LEVELS[4]));
  }

  function handle(req) {
    return thinkFromMoves(req.fen, req.moves, req.level, req.hint);
  }

  return {
    LEVELS: LEVELS,
    TOP_LEVEL: TOP_LEVEL,
    HINT: HINT,
    isTrueEye: isTrueEye,
    isLadderDead: isLadderDead,
    evaluate: evaluate,
    scoreCandidate: scoreCandidate,
    topCandidates: topCandidates,
    think: think,
    thinkFromMoves: thinkFromMoves,
    handle: handle,
    solveTsumego: solveTsumego,
  };
});

(function () {

  var units = (window.WQ_UNITS = window.WQ_UNITS || []);

  // ==========================================================================
  // 單元一：入門規則與氣的奧秘（6 堂）

  units.push({
    id: 'rules',
    icon: '⚫',
    title: '入門規則與氣的奧秘',
    intro: '圍棋的規則極度精煉，卻能演化出浩瀚無窮的變化。只要搞懂「氣」的計算、提子與禁著點、兩眼活棋、打劫規矩以及終局數子點目，你就能從零開始下完一整盤正規圍棋！每一堂課都附有九路或十九路互動示範棋盤，帶你親眼看懂每個核心觀念。',
    lessons: [
      {
        id: 'ru-liberties',
        title: '棋盤、星位與「氣」',
        summary: '一顆棋子能活多久，全看它身邊還剩幾口上下左右相鄰的空交叉點。',
        plain: '白話比喻：把棋子想成水底的潛水員，從棋子往上下左右延伸出去的直線空點就是「氧氣管」；斜角沒有線連通，不能當氣呼吸！',
        takeaway: '一句話記住：中腹一子四口氣、邊線三口、角落兩口；同色棋子直線相連時，所有的氣會共享相加。',
        body: [
