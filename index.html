      C.driveCarToBuilding(b.id);
      return;
    }
    if (C.isLive(b) && !C.infoMode) {
      C.recordVisit(b.id);
      var url = C.primaryUrl(b);
      C.toast('🚀 正在進入「' + b.name + '」…');
      window.location.href = url;
      return;
    }
    C.emit('open', b.id);
  }

  function activate(target) {
    if (!target || !target.closest) return;
    var el = target.closest('[data-id], .svc, .sign, .lot, [data-banner], .lbl-svc, [data-car], .campus-vehicle, [data-animal], [data-fun]');
    if (!el || !M.svg.contains(el)) return;
    if (el.hasAttribute('data-car')) {
      C.emit('fun', { kind: 'car', idx: +el.getAttribute('data-car'), el: el });
      return;
    }
    if (el.classList.contains('campus-vehicle')) {
      C.emit('fun', { kind: 'vehicle', id: el.getAttribute('data-vid') || 'bus', el: el });
      return;
    }
    if (el.hasAttribute('data-animal')) {
      C.emit('fun', { kind: 'animal', id: el.getAttribute('data-animal'), el: el });
      return;
    }
    if (el.hasAttribute('data-fun')) {
      C.emit('fun', { kind: el.getAttribute('data-fun'), fish: el.getAttribute('data-fish-name') || '', el: el });
      return;
    }
    var id = el.getAttribute('data-id');
    if (id) { enterOrOpen(id); return; }
    if (el.classList.contains('svc') || el.classList.contains('lbl-svc')) { C.emit('about'); return; }
    if (el.getAttribute('data-banner') === 'practice') { enterOrOpen('stock'); return; }
    if (el.getAttribute('data-banner') === 'tech-link') { enterOrOpen('coding'); return; }
    if (el.classList.contains('sign')) {
      var did = el.getAttribute('data-district');
      if (did) focusDistrict(did);
      else C.toast('🏗️ 這塊地預留給未來的新學區，歡迎到「意見回饋」許願！');
      return;
    }
    if (el.classList.contains('lot')) C.emit('wish', el.getAttribute('data-district') || '');
  }

  function bindPointer() {
    var svg = M.svg;
    var pts = {};
    var drag = null, pinch = null;
    function count() { return Object.keys(pts).length; }
    function startDrag(e, moved) {
      drag = { x: e.clientX, y: e.clientY, v: M.view, target: e.target, moved: !!moved, pointerType: e.pointerType || 'mouse', captured: false };
    }
    // 防止手機點擊 SVG 後 10-30ms 產生的合成 click 穿透點到剛彈出的底部面板遮罩 (#sheetBd / .modal-bd) 而瞬間閃退
    window.addEventListener('click', function (e) {
      if (M.lastTapAt && Date.now() - M.lastTapAt < 420 && M.svg && !M.svg.contains(e.target)) {
        e.stopPropagation();
        e.preventDefault();
      }
    }, true);
    svg.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    svg.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      cancelAnimationFrame(M.anim);
      pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      if (count() === 1) startDrag(e, false);
      else if (count() === 2) {
        var p = Object.keys(pts).map(function (k) { return pts[k]; });
        pinch = { d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1, mx: (p[0].x + p[1].x) / 2, my: (p[0].y + p[1].y) / 2, v: M.view };
        if (drag) drag.moved = true;
      }
    });
    svg.addEventListener('pointermove', function (e) {
      if (!pts[e.pointerId]) {
        if (e.pointerType === 'mouse') {
          var el = e.target && e.target.closest ? e.target.closest('.bld, .svc, .sign, .lot, .fun-spot, .parked-car, .parking-sign, .campus-vehicle, .animal, .lake-fish') : null;
          if (el !== M.hoverEl) {
            if (M.hoverEl) M.hoverEl.classList.remove('hover');
            M.hoverEl = el;
            if (el) { el.classList.add('hover'); showTip(el); } else hideTip();
          }
        }
        return;
      }
      pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      if (pinch && count() >= 2) {
        var p = Object.keys(pts).map(function (k) { return pts[k]; });
        var d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1;
        var mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
        var r = svg.getBoundingClientRect();
        var v0 = pinch.v, s0 = M.cw / v0.w;
        var wx = v0.x + (pinch.mx - r.left) / s0, wy = v0.y + (pinch.my - r.top) / s0;
        var lim = limits();
        var w = clamp(v0.w * pinch.d / d, lim.minW, lim.maxW);
        var s1 = M.cw / w;
        applyView({ x: wx - (mx - r.left) / s1, y: wy - (my - r.top) / s1, w: w, h: w * M.ch / M.cw });
        return;
      }
      if (drag) {
        var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        var slop = drag.pointerType === 'touch' ? 16 : 6;
        if (!drag.moved && Math.hypot(dx, dy) > slop) {
          drag.moved = true;
          if (!drag.captured) {
            drag.captured = true;
            try { svg.setPointerCapture(e.pointerId); } catch (er) { /* 舊瀏覽器 */ }
          }
          M.wrap.classList.add('dragging');
          hideTip();
        }
        if (drag.moved) {
          var s = M.cw / drag.v.w;
          applyView({ x: drag.v.x - dx / s, y: drag.v.y - dy / s, w: drag.v.w, h: drag.v.h });
        }
      }
    });
    function end(e) {
      if (!pts[e.pointerId]) return;
      delete pts[e.pointerId];
      if (pinch && count() < 2) {
        pinch = null;
        var rest = Object.keys(pts);
        if (rest.length === 1) { var p = pts[rest[0]]; drag = { x: p.x, y: p.y, v: M.view, target: null, moved: true, pointerType: e.pointerType || 'touch', captured: false }; }
        else drag = null;
        return;
      }
      if (count() === 0) {
        var wasTap = drag && !drag.moved && e.type === 'pointerup';
        var tapTarget = drag ? drag.target : null;
        drag = null;
        M.wrap.classList.remove('dragging');
        if (wasTap && tapTarget) {
          if (e.cancelable) e.preventDefault();
          M.lastTapAt = Date.now();
          activate(tapTarget);
        }
      }
    }
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('pointerleave', function (e) {
      if (e.pointerType === 'mouse' && M.hoverEl) { M.hoverEl.classList.remove('hover'); M.hoverEl = null; hideTip(); }
    });
    svg.addEventListener('wheel', function (e) {
      e.preventDefault();
      var dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
      var f = Math.exp(-dy * (e.ctrlKey ? 0.012 : 0.0016));
      zoomAt(e.clientX, e.clientY, clamp(f, 0.5, 2), false);
    }, { passive: false });
    // 鍵盤：Tab 走訪建築／看板，Enter／空白鍵開啟；方向鍵平移、+／- 縮放、0 回到全覽
    svg.addEventListener('keydown', function (e) {
      var t = e.target;
      if ((e.key === 'Enter' || e.key === ' ') && t && t.closest && t.closest('.bld, .svc, .sign, .lot, .fun-spot, .parked-car, .parking-sign, .campus-vehicle, .animal')) {
        e.preventDefault();
        activate(t);
        return;
      }
      var s = scale(), step = 90 / s;
      var v = M.view;
      if (e.key === 'ArrowLeft') applyView({ x: v.x - step, y: v.y, w: v.w, h: v.h });
      else if (e.key === 'ArrowRight') applyView({ x: v.x + step, y: v.y, w: v.w, h: v.h });
      else if (e.key === 'ArrowUp') applyView({ x: v.x, y: v.y - step, w: v.w, h: v.h });
      else if (e.key === 'ArrowDown') applyView({ x: v.x, y: v.y + step, w: v.w, h: v.h });
      else if (e.key === '+' || e.key === '=') zoomBy(1.35);
      else if (e.key === '-' || e.key === '_') zoomBy(1 / 1.35);
      else if (e.key === '0') reset();
      else return;
      e.preventDefault();
    });
    svg.addEventListener('focusin', function (e) {
      var el = e.target && e.target.closest ? e.target.closest('.bld, .svc, .sign') : null;
      if (el && M.wrap.classList.contains('kbd')) ensureVisible(el);
    });
  }
  function ensureVisible(el) {
    var r = el.getBoundingClientRect(), wr = M.wrap.getBoundingClientRect();
    if (r.left < wr.left + 20 || r.right > wr.right - 20 || r.top < wr.top + 20 || r.bottom > wr.bottom - 20) {
      var s = scale();
      var cx = M.view.x + (r.left + r.width / 2 - wr.left) / s, cy = M.view.y + (r.top + r.height / 2 - wr.top) / s;
      flyTo({ x: cx - M.view.w / 2, y: cy - M.view.h / 2, w: M.view.w, h: M.view.h }, 300);
    }
  }

  /* ------------------------------------------------------------ 對外操作 */
  function slotOf(id) { var p = M.asg && M.asg.placed[id]; return p ? p.slot : null; }
  function zoneOf(did) {
    if (!M.asg) return null;
    for (var i = 0; i < M.asg.zones.length; i++) if (M.asg.zones[i].district.id === did) return M.asg.zones[i];
    return null;
  }
  function focusDistrict(did, ms) {
    var z = zoneOf(did);
    if (!z) return false;
    var b = z.layout.box;
    flyTo(fitView({ x: b[0], y: b[1] - 10, w: b[2] - b[0], h: b[3] - b[1] + 30 }, M.cw < 720 ? 8 : 40), ms);
    var g = M.svg.querySelector('.zone[data-district="' + did + '"]');
    if (g) {
      g.classList.remove('zfocus');
      void g.getBoundingClientRect();
      g.classList.add('zfocus');
      setTimeout(function () { g.classList.remove('zfocus'); }, 2400);
    }
    return true;
  }
  // 把建築移到可視區（panelW：右側抽屜寬度，桌機開啟介紹卡時讓出空間）
  function focusBuilding(id, opts) {
    opts = opts || {};
    var sl = slotOf(id);
    if (!sl) return false;
    var v = M.view;
    var w = v.w;
    if (opts.zoom) {
      var target = Math.max(sl.w * 3.2, 520);
      w = Math.min(w, target * Math.max(1, M.cw / M.ch) * (M.cw < 720 ? 1 : 0.75));
      w = Math.max(w, limits().minW);
    }
    var h = w * M.ch / M.cw;
    var s = M.cw / w;
    var offX = (opts.panelW || 0) / 2 / s;
    var offY = (opts.sheetH || 0) / 2 / s;
    var cx = sl.x + offX, cy = sl.y - sl.h / 2 + offY;
    var nv = { x: cx - w / 2, y: cy - h / 2, w: w, h: h };
    if (opts.ifNeeded) {
      var r = { x: sl.x - sl.w / 2, y: sl.y - sl.h, w: sl.w, h: sl.h + 30 };
      var visW = v.w - (opts.panelW || 0) / scale(), visH = v.h - (opts.sheetH || 0) / scale();
      if (r.x > v.x + 10 && r.x + r.w < v.x + visW - 10 && r.y > v.y + 10 && r.y + r.h < v.y + visH - 10) return true;
    }
    flyTo(nv, opts.ms);
    return true;
  }
  function reset(ms) { flyTo(homeView(), ms); }
  function highlight(ids) {
    M.searchIds = ids;
    var on = Array.isArray(ids);
    M.svg.classList.toggle('searching', on);
    var nodes = M.svg.querySelectorAll('.bld, .lbl[data-id]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].classList.toggle('hit', on && ids.indexOf(nodes[i].getAttribute('data-id')) >= 0);
    }
  }
  function select(id) {
    M.selId = id;
    var nodes = M.svg.querySelectorAll('.bld');
    for (var i = 0; i < nodes.length; i++) nodes[i].classList.toggle('sel', nodes[i].getAttribute('data-id') === id);
  }
  function markFrom(id) {
    var sl = slotOf(id);
    var fx = M.svg.querySelector('.m-fx');
    if (!sl || !fx) return false;
    M.fromId = id;
    var g = M.svg.querySelector('.bld[data-id="' + id + '"]');
    if (g) g.classList.add('from');
    var above = sl.y < 260;
    var y = above ? sl.y - sl.h - 4 : sl.y + 34;
    var bubble = above
      ? '<path d="M-74,-44 H74 Q84,-44 84,-34 V-18 Q84,-8 74,-8 H9 L0,1 L-9,-8 H-74 Q-84,-8 -84,-18 V-34 Q-84,-44 -74,-44 Z" fill="#1d6b57" stroke="#0f3f33" stroke-width="1.5"/>' +
        '<text x="0" y="-20.5" text-anchor="middle" font-family="' + FONT + '" font-size="14.5" font-weight="800" fill="#fffaf0">📍 你剛剛在這裡</text>'
      : '<path d="M-74,8 H-8 L0,0 L8,8 H74 Q84,8 84,18 V34 Q84,44 74,44 H-74 Q-84,44 -84,34 V18 Q-84,8 -74,8 Z" fill="#1d6b57" stroke="#0f3f33" stroke-width="1.5"/>' +
        '<text x="0" y="31.5" text-anchor="middle" font-family="' + FONT + '" font-size="14.5" font-weight="800" fill="#fffaf0">📍 你剛剛在這裡</text>';
    fx.innerHTML = '<g class="from-callout lbl" transform="translate(' + sl.x + ',' + n(y) + ')"><g class="lbl-s" transform="scale(' + M.k.toFixed(3) + ')">' +
      '<g class="fc-bob">' + bubble + '</g></g></g>';
    return true;
  }

  function measure() {
    var r = M.wrap.getBoundingClientRect();
    M.cw = Math.max(1, Math.round(r.width));
    M.ch = Math.max(1, Math.round(r.height));
  }
  function resize() {
    if (!M.svg) return;
    var old = { cx: M.view.x + M.view.w / 2, cy: M.view.y + M.view.h / 2, s: scale() };
    var pw = M.cw;
    measure();
    if (!M.cw || M.cw < 2) return;
    if (!pw || pw < 2 || !M.ready) { M.ready = true; applyView(homeView()); return; }
    var w = M.cw / old.s;
    var h = M.ch / old.s;
    applyView({ x: old.cx - w / 2, y: old.cy - h / 2, w: w, h: h });
  }

  function init(wrap) {
    M.wrap = wrap;
    M.svg = wrap.querySelector('svg.campus-map');
    M.tip = wrap.querySelector('.map-tip');
    if (C.registryError) {
      wrap.classList.add('map-error');
      var msg = document.createElement('div');
      msg.className = 'map-err';
      msg.textContent = '⚠️ 校園資料載入失敗：' + C.registryError;
      wrap.appendChild(msg);
      return;
    }
    M.asg = C.assignLayout(C.reg);
    var scene = buildScene(M.asg);
    M.svg.innerHTML = scene.svg;
    M.labelMeta = scene.labels;
    measure();
    layoutLabels();
    M.ready = M.cw > 2;
    applyView(homeView());
    bindPointer();
    var zi = document.getElementById('zoomIn'), zo = document.getElementById('zoomOut'), zr = document.getElementById('zoomReset');
    if (zi) zi.addEventListener('click', function () { zoomBy(1.4); });
    if (zo) zo.addEventListener('click', function () { zoomBy(1 / 1.4); });
    if (zr) zr.addEventListener('click', function () { reset(); });
    var rt = 0;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(resize, 80); });
    // 只有用鍵盤操作時才自動捲動到焦點
    document.addEventListener('keydown', function (e) { if (e.key === 'Tab') wrap.classList.add('kbd'); }, true);
    document.addEventListener('pointerdown', function () { wrap.classList.remove('kbd'); }, true);
  }

  function flyToPoint(x, y, zoomW, ms) {
    var w = zoomW || Math.min(M.view.w, 820);
    w = clamp(w, limits().minW, limits().maxW);
    var h = w * M.ch / Math.max(1, M.cw);
    flyTo({ x: x - w / 2, y: y - h / 2, w: w, h: h }, ms);
  }

  C.map = {
    init: init,
    resize: resize,
    relayout: function () { layoutLabels(); },
    reset: reset,
    zoomBy: zoomBy,
    focusDistrict: focusDistrict,
    focusBuilding: focusBuilding,
    flyToPoint: flyToPoint,
    highlight: highlight,
    select: select,
    markFrom: markFrom,
    placed: function () { return M.asg ? M.asg.placed : {}; },
    layout: function () { return M.asg; },
    view: function () { return M.view; },
  };
})();

</script>
  <script>/* js/panel.js */
/* 開心學園 · panel.js — 建築介紹卡：桌機右側抽屜、手機底部滑出面板
 *   圖示、中英名稱、學區、標語、介紹、特色、深連結、主要入口（進入學院／進入實戰館）、複製網址、
 *   Cloudtop 模式另有「🖥️ Cloudtop 版」與即時服務狀態 🟢／⚪。
 */
(function () {
  'use strict';
  var C = window.CAMPUS;
  var esc = C.util.esc;
  var P = { el: null, body: null, bd: null, id: null, lastFocus: null, openedAt: 0 };

  function isMobile() { return !!(window.matchMedia && window.matchMedia('(max-width: 720px)').matches); }

  function statusChip(b) {
    var st = C.STATUS[b.status] || C.STATUS.live;
    return '<span class="chip" style="background:' + st.bg + ';color:' + st.fg + ';border-color:' + st.bd + '">' + esc(st.t) + '</span>';
  }
  function primaryLabel(b) {
    if (b.kind === 'arena') return '進入實戰館 →';
    if (b.kind === 'department') return '進入分院 →';
    return '進入學院 →';
  }
  function ctRow(b) {
    if (C.env.mode !== 'cloudtop' || !b.local_port || !C.isLive(b)) return '';
    var up = C.portUp(b);
    var dot = up === true ? '🟢' : up === false ? '⚪' : '⏳';
    var txt = up === true ? '本機服務運作中' : up === false ? '本機服務未啟動' : '檢查本機服務中…';
    return '<div class="pn-ct" data-ct="' + esc(b.id) + '">' +
      '<span class="ct-state"><span aria-hidden="true">' + dot + '</span> ' + esc(txt) + ' <code>:' + esc(b.local_port) + '</code></span>' +
      '</div>';
  }

  function render(b) {
    var d = C.districtOf(b) || { name: '', color: '#64748b', soft: '#f1f5f9', icon: '' };
    var live = C.isLive(b);
    var parent = b.parent ? C.building(b.parent) : null;
    var children = C.reg.buildings.filter(function (x) { return x.parent === b.id; });
    var h = '';
    h += '<div class="pn-hero" style="--dc:' + esc(d.color) + ';--ds:' + esc(d.soft) + '">' +
      '<div class="pn-ic" aria-hidden="true">' + esc(b.icon || '🏫') + '</div>' +
      '<div class="pn-hd">' +
      '<h2 id="pnTitle" tabindex="-1">' + esc(b.name) + ' ' + statusChip(b) + '</h2>' +
      '<div class="pn-en">' + esc(b.en || '') + '</div>' +
      '<button type="button" class="pn-dist" data-district="' + esc(b.district) + '">' + esc((d.icon ? d.icon + ' ' : '') + d.name) + ' <span aria-hidden="true">›</span></button>' +
      '</div></div>';
    if (parent) {
      h += '<div class="pn-parent">隸屬 <button type="button" class="linkish" data-open="' + esc(parent.id) + '">' + esc((parent.icon || '') + ' ' + parent.name) + '</button> 的分院</div>';
    }
    if (b.tagline) h += '<p class="pn-tag">' + esc(b.tagline) + '</p>';
    if (b.desc) h += '<p class="pn-desc">' + esc(b.desc) + '</p>';
    if (b.features.length) {
      h += '<ul class="pn-feat">' + b.features.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>';
    }
    if (children.length) {
      h += '<div class="pn-sec">' + (children.length === 4 ? '四大分院' : '隸屬分院（' + children.length + '）') + '</div><div class="pn-kids">' + children.map(function (k) {
        return '<button type="button" class="kid" data-open="' + esc(k.id) + '"><span aria-hidden="true">' + esc(k.icon || '') + '</span> ' + esc(k.name) + '</button>';
      }).join('') + '</div>';
    }
    if (live && b.links.length) {
      h += '<div class="pn-sec">快速前往</div><div class="pn-links">' + b.links.map(function (l) {
        return '<a href="' + esc(C.linkUrl(b, l.hash)) + '" data-visit="' + esc(b.id) + '">' + esc(l.label) + '</a>';
      }).join('') + '</div>';
    }
    if (b.related && b.related.length) {
      var relItems = b.related.map(function (r) {
        var rb = C.building(r.id);
        if (!rb) return '';
        if (C.isLive(rb)) {
          var rUrl = r.hash ? C.linkUrl(rb, r.hash) : C.primaryUrl(rb);
          return '<a class="pn-rel-link" href="' + esc(rUrl) + '" data-visit="' + esc(rb.id) + '" data-rel-id="' + esc(rb.id) + '" data-rel-hash="' + esc(r.hash || '') + '">' + esc(r.label || rb.name) + ' ↗</a>';
        }
        return '<button type="button" class="pn-rel-link pn-rel-btn" data-open="' + esc(rb.id) + '">' + esc(r.label || rb.name) + ' ›</button>';
      }).filter(Boolean);
      if (relItems.length) {
        var relSec = b.district === 'tech' ? '🔗 軟硬整合・跨院連動' : '🔗 理論 ⇄ 實戰連動';
        h += '<div class="pn-sec">' + relSec + '</div><div class="pn-links pn-related">' + relItems.join('') + '</div>';
      }
    }
    h += '<div class="pn-actions">';
    if (live) {
      h += '<a class="btn primary big" href="' + esc(C.primaryUrl(b)) + '" data-visit="' + esc(b.id) + '" data-primary="1">' + esc(primaryLabel(b)) + '</a>' +
        '<div style="display:flex;gap:8px;width:100%"><button type="button" class="btn" style="flex:1" data-drive-to="' + esc(b.id) + '">🚗 派專車開來這裡</button>' +
        '<button type="button" class="btn" style="flex:1" data-copy="' + esc(b.id) + '">🔗 複製網址</button></div>';
    } else {
      h += '<button type="button" class="btn big" disabled>🚧 建設中・敬請期待</button>' +
        '<div style="display:flex;gap:8px;width:100%"><button type="button" class="btn" style="flex:1" data-drive-to="' + esc(b.id) + '">🚗 派車去工地巡視</button>' +
        '<button type="button" class="btn" style="flex:1" data-wish="' + esc(b.id) + '">💬 許願開課</button></div>';
    }
    h += '</div>';
    h += ctRow(b);
    if (live) {
      h += '<div class="pn-meta">短網址 <code>' + esc(C.shortUrl(b)) + '</code><span class="sep">·</span>' +
        '<button type="button" class="linkish" data-share="' + esc(b.id) + '">分享這張介紹卡</button></div>';
    }
    return h;
  }

  function ensure() {
    if (P.el) return;
    P.el = document.getElementById('panel');
    P.body = P.el.querySelector('.pn-body');
    P.bd = document.getElementById('sheetBd');
    P.el.querySelector('.pn-close').addEventListener('click', function () {
      if (P.openedAt && Date.now() - P.openedAt < 380) return;
      close();
    });
    if (P.bd) P.bd.addEventListener('click', function () {
      if (P.openedAt && Date.now() - P.openedAt < 420) return;
      close();
    });
    P.el.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-open],[data-district],[data-copy],[data-share],[data-wish],[data-visit],[data-drive-to]') : null;
      if (!t) return;
      if (t.hasAttribute('data-drive-to')) {
        var dtId = t.getAttribute('data-drive-to');
        if (isMobile()) close();
        if (C.driveCarToBuilding) C.driveCarToBuilding(dtId, { keepPanel: !isMobile() });
        return;
      }
      if (t.hasAttribute('data-open')) { C.emit('open', t.getAttribute('data-open')); return; }
      if (t.classList.contains('pn-dist')) {
        var did = t.getAttribute('data-district');
        if (isMobile()) close();
        C.emit('district', did);
        return;
      }
      if (t.hasAttribute('data-copy')) {
        var b = C.building(t.getAttribute('data-copy'));
        var targetUrl = C.primaryUrl(b);
        C.copyText(targetUrl).then(function (ok) {
          C.toast(ok ? '🔗 已複製網址：' + targetUrl : '複製失敗，請手動複製：' + targetUrl, ok ? 'ok' : 'bad');
        });
        return;
      }
      if (t.hasAttribute('data-share')) {
        var sb = C.building(t.getAttribute('data-share'));
        var url = C.campusHome() + '?b=' + encodeURIComponent(sb.id);
        C.copyText(url).then(function (ok) { C.toast(ok ? '🔗 已複製介紹卡連結：' + url : url, ok ? 'ok' : ''); });
        return;
      }
      if (t.hasAttribute('data-wish')) {
        var wb = C.building(t.getAttribute('data-wish'));
        C.emit('wish', { building: wb });
        return;
      }
      if (t.hasAttribute('data-visit')) {
        if (t.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
        C.recordVisit(t.getAttribute('data-visit'));
      }
    });
    // 手機：往下拖曳把手關閉
    var head = P.el.querySelector('.pn-head');
    var drag = null;
    head.addEventListener('pointerdown', function (e) {
      if (!isMobile() || (e.target.closest && e.target.closest('button'))) return;
      drag = { y: e.clientY, dy: 0 };
      try { head.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ }
      P.el.classList.add('dragging');
    });
    head.addEventListener('pointermove', function (e) {
      if (!drag) return;
      drag.dy = Math.max(0, e.clientY - drag.y);
      P.el.style.transform = 'translateY(' + drag.dy + 'px)';
    });
    function endDrag() {
      if (!drag) return;
      P.el.classList.remove('dragging');
      P.el.style.transform = '';
      if (drag.dy > 90) close();
      drag = null;
    }
    head.addEventListener('pointerup', endDrag);
    head.addEventListener('pointercancel', endDrag);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !e.isComposing && P.id && !document.querySelector('.modal-bd.open')) close();
    });
    C.on('status', function () { if (P.id) refresh(); });
  }

  function syncUrl(id) {
    try {
      var u = new URL(window.location.href);
      if (id) u.searchParams.set('b', id); else u.searchParams.delete('b');
      u.searchParams.delete('go');
      u.searchParams.delete('to');
      window.history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
    } catch (e) { /* file:// 舊瀏覽器 */ }
  }

  function open(id) {
    ensure();
    var b = C.building(id);
    if (!b) return false;
    if (!P.id) P.lastFocus = document.activeElement;
    P.id = b.id;
    P.openedAt = Date.now();
    P.body.innerHTML = render(b);
    P.body.scrollTop = 0;
    P.el.setAttribute('aria-hidden', 'false');
    P.el.classList.add('open');
    document.body.classList.add('panel-open');
    if (P.bd) { P.bd.hidden = false; P.bd.classList.add('open'); }
    var t = document.getElementById('pnTitle');
    if (t) try { t.focus({ preventScroll: true }); } catch (e) { t.focus(); }
    syncUrl(b.id);
    if (C.env.mode === 'cloudtop' && b.local_port) C.refreshStatus();
    return true;
  }
  function refresh() {
    if (!P.id) return;
    var b = C.building(P.id);
    var ct = P.body.querySelector('.pn-ct');
    if (ct) {
      var tmp = document.createElement('div');
      tmp.innerHTML = ctRow(b);
      if (tmp.firstChild) ct.parentNode.replaceChild(tmp.firstChild, ct);
    }
    var pr = P.body.querySelector('[data-primary]');
    if (pr) pr.setAttribute('href', C.primaryUrl(b));
    var links = P.body.querySelectorAll('.pn-links a');
    for (var i = 0; i < links.length && i < b.links.length; i++) links[i].setAttribute('href', C.linkUrl(b, b.links[i].hash));
  }
  function close() {
    if (!P.el || !P.id) return;
    P.id = null;
    P.el.classList.remove('open');
    P.el.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('panel-open');
    if (P.bd) { P.bd.classList.remove('open'); P.bd.hidden = true; }
    syncUrl(null);
    C.emit('panelclose');
    if (P.lastFocus && P.lastFocus.focus && document.contains(P.lastFocus)) {
      try { P.lastFocus.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    }
  }

  C.panel = {
    open: open,
    close: close,
    refresh: refresh,
    current: function () { return P.id; },
    isMobile: isMobile,
    // 桌機：抽屜寬度；手機：面板高度（讓地圖把建築移到看得到的地方）
    coverW: function () { return !isMobile() && P.el ? P.el.offsetWidth : 0; },
    coverH: function () { return isMobile() && P.el ? Math.min(P.el.offsetHeight, window.innerHeight * 0.8) : 0; },
  };
})();

</script>
  <script>/* js/directory.js */
/* 開心學園 · directory.js — 📋 目錄：依學區分組的建築卡片（手機上一鍵切換），支援搜尋篩選 */
(function () {
  'use strict';
  var C = window.CAMPUS;
  var esc = C.util.esc;
  var D = { el: null, rendered: false };

  function chip(b) {
    var st = C.STATUS[b.status] || C.STATUS.live;
    return '<span class="chip" style="background:' + st.bg + ';color:' + st.fg + ';border-color:' + st.bd + '">' + esc(st.t) + '</span>';
  }
  function ctDot(b) {
    if (C.env.mode !== 'cloudtop' || !b.local_port || !C.isLive(b)) return '';
    var up = C.portUp(b);
    var t = up === true ? '🟢 Cloudtop 運作中' : up === false ? '⚪ Cloudtop 未啟動' : '⏳ 檢查中';
    return '<span class="ct-mini" data-ct="' + esc(b.id) + '">' + t + '</span>';
  }
  function card(b) {
    var live = C.isLive(b);
    var label = b.kind === 'arena' ? '進入實戰館 →' : b.kind === 'department' ? '進入分院 →' : '進入學院 →';
    var feats = b.features.slice(0, 4).map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('');
    var links = live ? b.links.slice(0, 4).map(function (l) {
      return '<a href="' + esc(C.linkUrl(b, l.hash)) + '" data-visit="' + esc(b.id) + '">' + esc(l.label) + '</a>';
    }).join('') : '';
    var rels = b.related && b.related.length ? b.related.slice(0, 3).map(function (r) {
      var rb = C.building(r.id);
      if (!rb) return '';
      if (C.isLive(rb)) {
        var rUrl = r.hash ? C.linkUrl(rb, r.hash) : C.primaryUrl(rb);
        return '<a class="card-rel" href="' + esc(rUrl) + '" data-visit="' + esc(rb.id) + '">' + esc(r.label || rb.name) + ' ↗</a>';
      }
      return '<button type="button" class="card-rel card-rel-btn" data-more="' + esc(rb.id) + '">' + esc(r.label || rb.name) + ' ›</button>';
    }).filter(Boolean).join('') : '';
    return '<article class="card' + (live ? '' : ' planned') + '" data-id="' + esc(b.id) + '" tabindex="0" aria-label="' + esc(b.name + '：' + (b.tagline || '')) + '">' +
      '<div class="card-top"><span class="card-ic" aria-hidden="true">' + esc(b.icon || '🏫') + '</span>' +
      '<div class="card-tt"><h3>' + esc(b.name) + '</h3><div class="card-en">' + esc(b.en || '') + '</div></div>' + chip(b) + '</div>' +
      (b.tagline ? '<p class="card-tag">' + esc(b.tagline) + '</p>' : '') +
      (feats ? '<ul class="card-feat">' + feats + '</ul>' : (b.desc ? '<p class="card-desc">' + esc(b.desc) + '</p>' : '')) +
      (links ? '<div class="card-links">' + links + '</div>' : '') +
      (rels ? '<div class="card-rels"><span class="card-rel-lbl">🔗 連動</span>' + rels + '</div>' : '') +
      '<div class="card-act">' +
      (live ? '<a class="btn primary" href="' + esc(C.primaryUrl(b)) + '" data-visit="' + esc(b.id) + '" data-primary="1">' + esc(label) + '</a>'
        : '<button type="button" class="btn" data-wish="' + esc(b.id) + '">💬 許願</button>') +
      '<button type="button" class="btn ghost" data-more="' + esc(b.id) + '">介紹</button>' + ctDot(b) +
      '</div></article>';
  }
  function lotCard(d) {
    var what = d.id === 'games' ? '學院或運彩館' : d.id === 'finance' ? '分院或實戰館' : d.id === 'tech' ? '程式語言或硬體實作學院' : d.id === 'care' ? '社工、心理諮商或健康照護學院' : '學院';
    return '<button type="button" class="card lotcard" data-wish-district="' + esc(d.id) + '">' +
      '<span class="lot-ic" aria-hidden="true">🚧</span><b>預定地</b><span>未來的新' + what + '會自動進駐這裡</span><em>想要什麼' + what + '？點我許願 →</em></button>';
  }

  function render() {
    D.el = document.getElementById('dirView');
    if (!D.el) return;
    var reg = C.reg;
    var h = '<div class="dir-intro"><h1>📋 學園目錄</h1><p>依學區瀏覽全部學院與實戰館；點卡片看完整介紹，或直接「進入」。</p></div>';
    reg.districts.forEach(function (d) {
      var list = reg.buildings.filter(function (b) { return b.district === d.id; });
      h += '<section class="dir-d" data-district="' + esc(d.id) + '" style="--dc:' + esc(d.color || '#64748b') + ';--ds:' + esc(d.soft || '#f1f5f9') + '">' +
        '<header class="dir-dh"><span class="dir-di" aria-hidden="true">' + esc(d.icon || '📍') + '</span>' +
        '<div class="dir-dt"><h2>' + esc(d.name) + ' <small>' + esc(d.en || '') + '</small>' +
        (d.status === 'planned' ? ' <span class="chip" style="background:#ffedd5;color:#9a3412;border-color:#fdba74">🚧 建設中</span>' : '') +
        '</h2><p>' + esc(d.desc || '') + '</p></div>' +
        '<button type="button" class="btn sm" data-focus="' + esc(d.id) + '">🗺️ 在地圖上看</button></header>' +
        '<div class="dir-grid">' + list.map(card).join('') + lotCard(d) + '</div></section>';
    });
    h += '<div class="dir-empty" id="dirEmpty" hidden></div>';
    D.el.innerHTML = h;
    D.rendered = true;
    if (!D.bound) {
      D.bound = true;
      D.el.addEventListener('click', function (e) {
        var t = e.target.closest ? e.target.closest('[data-visit],[data-more],[data-focus],[data-wish],[data-wish-district],.card[data-id]') : null;
        if (!t) return;
        if (t.hasAttribute('data-visit')) { C.recordVisit(t.getAttribute('data-visit')); return; }
        if (t.hasAttribute('data-focus')) { C.emit('district', t.getAttribute('data-focus')); return; }
        if (t.hasAttribute('data-wish')) { C.emit('wish', { building: C.building(t.getAttribute('data-wish')) }); return; }
        if (t.hasAttribute('data-wish-district')) { C.emit('wish', t.getAttribute('data-wish-district')); return; }
        if (t.hasAttribute('data-more')) { C.emit('open', t.getAttribute('data-more')); return; }
        var id = t.getAttribute('data-id');
        if (id) {
          var b = C.building(id);
          if (b && C.isLive(b) && !C.infoMode) {
            C.recordVisit(b.id);
            window.location.href = C.primaryUrl(b);
            return;
          }
          C.emit('open', id);
        }
      });
      D.el.addEventListener('keydown', function (e) {
        if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('card') && e.target.hasAttribute('data-id')) {
          e.preventDefault();
          C.emit('open', e.target.getAttribute('data-id'));
        }
      });
      C.on('status', refreshStatus);
    }
  }
  function refreshStatus() {
    if (!D.el) return;
    var nodes = D.el.querySelectorAll('.ct-mini');
    for (var i = 0; i < nodes.length; i++) {
      var b = C.building(nodes[i].getAttribute('data-ct'));
      var tmp = document.createElement('div');
      tmp.innerHTML = ctDot(b);
      if (tmp.firstChild) nodes[i].parentNode.replaceChild(tmp.firstChild, nodes[i]);
    }
    var prim = D.el.querySelectorAll('.card[data-id] [data-primary]');
    for (var k = 0; k < prim.length; k++) {
      var cb = C.building(prim[k].closest('.card').getAttribute('data-id'));
      prim[k].setAttribute('href', C.primaryUrl(cb));
    }
  }
  function filter(ids, q) {
    if (!D.el) return;
    var on = Array.isArray(ids);
    var cards = D.el.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
      var id = cards[i].getAttribute('data-id');
      cards[i].hidden = on && (!id || ids.indexOf(id) < 0);
    }
    var secs = D.el.querySelectorAll('.dir-d');
    var shown = 0;
    for (var j = 0; j < secs.length; j++) {
      var vis = secs[j].querySelectorAll('.card:not([hidden])').length;
      secs[j].hidden = on && !vis;
      if (!secs[j].hidden) shown++;
    }
    var empty = document.getElementById('dirEmpty');
    if (empty) {
      empty.hidden = !(on && !shown);
      empty.innerHTML = on && !shown ? '🔍 找不到符合「' + esc(q || '') + '」的建築。試試「藥癮個管」「英語」「Python」「K 線」「NBA」…' : '';
    }
  }

  C.dir = { render: render, filter: filter };
})();

  let cachedStatus = null;

  function esc(s) {

  function data() {

  function isStaticEnv() {

      window.CAMPUS_STATIC_ONLY ||

    return (status && status.current_version) || data().current_version || '1.0.0';

  function updateBadgeUI(status) {
    const btn = document.getElementById('verBadgeBtn');
    if (!btn) return;
    const ver = currentVersion(status);
    const local = isLocal(status);
    const dirty = local && !!status.has_changes;
    const n = dirty ? (status.changed_files || []).length : 0;
    btn.classList.add('rel-badge');
    btn.classList.toggle('rel-has-changes', dirty);

    const first = items[0];
    const last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }

  function renderReleaseModal(status) {
    injectCss();
    const bd = ensureBackdrop();
    const local = isLocal(status);
    const ver = currentVersion(status);
    const releases = (status && status.releases) || data().releases || [];
    const title = local ? '🚀 開心學園 · 版本紀錄與發布中心' : '📜 開心學園 · Release Notes';
    const sub = local
      ? '<p class="rel-sub">語意化版號 MAJOR.MINOR.PATCH：大改版進第 1 位、新功能或新學院進第 2 位、細節修正進第 3 位。</p>'
      : '';
    bd.innerHTML =
      '<div class="rel-box" role="dialog" aria-modal="true" aria-labelledby="relTitle">' +
        '<div class="rel-grip" aria-hidden="true"></div>' +
        '<header class="rel-head">' +
          '<div class="rel-head-main"><h3 class="rel-title" id="relTitle">' + esc(title) +
            ' <span class="rel-ver-pill">v' + esc(ver) + '</span></h3>' + sub + '</div>' +
          '<button type="button" class="rel-btn rel-ghost" id="relCloseBtn" aria-label="關閉">✕<span class="rel-close-txt"> 關閉</span></button>' +
        '</header>' +
        '<div class="rel-body">' +
          '<div class="rel-msg" id="relMsg" role="status" aria-live="polite" hidden></div>' +
          (local ? exportCardHtml(status) + statusHtml(status) : '') +
          '<h4 class="rel-sec">📜 Release Notes 歷史版本紀錄</h4>' +
          '<div class="rel-timeline">' + historyHtml(releases) + '</div>' +
        '</div>' +
      '</div>';
    const wasOpen = bd.classList.contains('open');
    if (!wasOpen) lastFocus = document.activeElement;
    bd.classList.add('open');
    bd.querySelector('#relCloseBtn').addEventListener('click', closeReleaseModal);
    bd.querySelectorAll('input[name="relBump"]').forEach((radio) => {
      radio.addEventListener('change', () => {
        bd.querySelectorAll('.rel-bump').forEach((el) => el.classList.toggle('on', el.contains(radio)));
        const v = bd.querySelector('#relPubVer');
        if (v && status && status.next_versions) v.textContent = status.next_versions[radio.value] || '';
      });
    });
    const pub = bd.querySelector('#relPublishBtn');
    if (pub) pub.addEventListener('click', () => publish(status, pub));
    if (!wasOpen) {
      try { bd.querySelector('#relCloseBtn').focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    }
  }

  async function publish(status, btn) {
    const bd = document.getElementById('relModal');
    const checked = bd && bd.querySelector('input[name="relBump"]:checked');
    const bump = checked ? checked.value : (status.recommended_bump || 'patch');
    const title = ((document.getElementById('relTitleInp') || {}).value || '').trim();
    const highlights = ((document.getElementById('relHlInp') || {}).value || '')
      .split('\n').map((s) => s.trim()).filter(Boolean);
    btn.disabled = true;
    btn.textContent = '⏳ 發布並重新打包中…';
    try {
      const res = await fetch('/api/release_publish', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bump_type: bump, title: title, highlights: highlights }),
      });
      const out = await res.json().catch(() => null);
      if (!res.ok || !out || !out.ok) throw new Error((out && out.error) || ('HTTP ' + res.status));
      cachedStatus = out.status;
      data().current_version = out.new_version;
      data().releases = out.status.releases;
      updateBadgeUI(cachedStatus);
      renderReleaseModal(cachedStatus);
      notify('🎉 已發布 v' + out.new_version + '，dist/site 與 okayell.github.io.zip 已重新打包', 'ok');
    } catch (err) {
      btn.disabled = false;
      btn.textContent = '🚀 重新嘗試發布';
      notify('發布失敗：' + ((err && err.message) || err), 'bad', 'relPubMsg');
    }
  }

  function closeReleaseModal() {
    const bd = document.getElementById('relModal');
    if (!bd || !bd.classList.contains('open')) return;
    bd.classList.remove('open');
    const back = lastFocus && document.contains(lastFocus) && lastFocus !== document.body
      ? lastFocus : document.getElementById('verBadgeBtn');
    lastFocus = null;
    if (back && back.focus) {
      try { back.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    }
  }

  async function openReleaseModal(opts) {
    const bd = ensureBackdrop();
    bd.classList.toggle('rel-instant', !!(opts && opts.instant));
    if (cachedStatus || (isStaticEnv() && !window.__MOCK_RELEASE_STATUS)) {
      renderReleaseModal(cachedStatus);
      if (!cachedStatus) return;
      const before = JSON.stringify(cachedStatus);
      const st = await fetchReleaseStatus();
      const typing = document.activeElement && document.activeElement.closest &&
        document.activeElement.closest('#relModal .rel-form');
      if (st && isOpen() && !typing && JSON.stringify(st) !== before) renderReleaseModal(st);
      return;
    }
    const st = await fetchReleaseStatus();
    renderReleaseModal(st || cachedStatus);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !e.isComposing && e.keyCode !== 229 && isOpen()) closeReleaseModal();
  });

  function initVersionBadge() {
    injectCss();
    const btn = document.getElementById('verBadgeBtn');
    if (btn && !btn.dataset.relBound) {
      btn.dataset.relBound = '1';
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        openReleaseModal();
      });
    }
    updateBadgeUI(cachedStatus);
    fetchReleaseStatus().then(() => {
      // ?releases=1 / #releases deep link: open without the slide-in animation (also keeps screenshots stable).
      if (/[?&]releases=1(?:&|$)/.test(location.search) || /^#\/?releases$/.test(location.hash)) openReleaseModal({ instant: true });
    });
  }

  CAMPUS.openReleaseModal = openReleaseModal;
  CAMPUS.closeReleaseModal = closeReleaseModal;
  CAMPUS.refreshReleaseStatus = fetchReleaseStatus;
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVersionBadge);
  } else {
    initVersionBadge();
  }
})();

</script>
  <script>/* js/app.js */
/* 開心學園 · app.js — 啟動流程：標題列搜尋、🗺️ 地圖／📋 目錄切換、最近造訪、學區快捷、網址參數、
 *   學園服務中心（使用說明）、意見回饋／許願、Cloudtop 即時狀態
 */
(function () {
  'use strict';
  var C = window.CAMPUS;
  if (!C || C.redirecting) return;
  var esc = C.util.esc;
  var qs = C.util.qs;
  var FEEDBACK_KEY = 'okayell.campus.feedback.v1';
  var HINT_KEY = 'okayell.campus.hint.v1';
  var FEEDBACK_EMAIL = 'okayell@hotmail.com';
  var view = 'map';

  function $(id) { return document.getElementById(id); }

  /* ------------------------------------------------------------ 檢視切換 */
  function setView(v, opts) {
    opts = opts || {};
    view = v === 'dir' ? 'dir' : 'map';
    var isDir = view === 'dir';
    $('mapView').hidden = isDir;
    $('dirView').hidden = !isDir;
    $('tabMap').setAttribute('aria-selected', String(!isDir));
    $('tabDir').setAttribute('aria-selected', String(isDir));
    document.body.classList.toggle('view-dir', isDir);
    if (!isDir) {
      C.map.resize();
      C.map.relayout();
    }
    if (!opts.noHash) {
      try {
        var u = new URL(window.location.href);
        u.hash = isDir ? '#dir' : '';
        window.history.replaceState(null, '', u.pathname + u.search + u.hash);
      } catch (e) { /* ignore */ }
    }
    if (opts.scrollTop !== false) window.scrollTo(0, 0);
  }

  /* ------------------------------------------------------------ 開啟建築 */
  function openBuilding(id, opts) {
    opts = opts || {};
    var b = C.building(id);
    if (!b) return false;
    C.panel.open(b.id);
    if (view === 'map') {
      C.map.select(b.id);
      C.map.focusBuilding(b.id, {
        ifNeeded: !opts.zoom,
        zoom: !!opts.zoom,
        panelW: C.panel.coverW(),
        sheetH: C.panel.coverH(),
      });
    }
    return true;
  }

  /* ------------------------------------------------------------ 搜尋（IME 安全 Enter） */
  function initSearch() {
    var inp = $('q'), pop = $('qPop'), clr = $('qClear');
    var results = [], sel = -1;
    function renderPop(q) {
      if (!q) { pop.hidden = true; pop.innerHTML = ''; return; }
      if (!results.length) {
        pop.innerHTML = '<div class="s-none">找不到「' + esc(q) + '」，試試「藥癮個管」「日語」「Python」「K 線」「NBA」</div>';
        pop.hidden = false;
        return;
      }
      pop.innerHTML = results.slice(0, 7).map(function (r, i) {
        var b = r.b, d = C.districtOf(b) || {};
        var st = C.STATUS[b.status] || C.STATUS.live;
        return '<button type="button" role="option" class="s-item' + (i === sel ? ' on' : '') + '" data-id="' + esc(b.id) + '" aria-selected="' + (i === sel) + '">' +
          '<span class="s-ic2" aria-hidden="true">' + esc(b.icon || '🏫') + '</span>' +
          '<span class="s-tx"><b>' + esc(b.name) + '</b><small>' + esc((d.icon || '') + ' ' + (d.name || '') + ' · ' + (b.tagline || '')) + '</small></span>' +
          '<span class="chip" style="background:' + st.bg + ';color:' + st.fg + ';border-color:' + st.bd + '">' + esc(st.t) + '</span></button>';
      }).join('');
      pop.hidden = false;
    }
    function run() {
      var q = inp.value.trim();
      clr.hidden = !q;
      results = q ? C.search(q) : [];
      sel = results.length ? 0 : -1;
      var ids = q ? results.map(function (r) { return r.b.id; }) : null;
      C.map.highlight(ids);
      C.dir.filter(ids, q);
      renderPop(q);
    }
    function pick(id) {
      pop.hidden = true;
      if (window.matchMedia('(max-width: 720px)').matches) inp.blur();
      openBuilding(id, { zoom: view === 'map' && C.panel.isMobile() });
    }
    inp.addEventListener('input', run);
    inp.addEventListener('focus', function () { if (inp.value.trim()) renderPop(inp.value.trim()); });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (!results.length) return;
        e.preventDefault();
        sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + Math.min(7, results.length)) % Math.min(7, results.length);
        renderPop(inp.value.trim());
        return;
      }
      if (e.key === 'Escape') {
        if (inp.value) { inp.value = ''; run(); } else inp.blur();
        pop.hidden = true;
        return;
      }
      if (C.isEnterSend(e)) {
        e.preventDefault();
        if (!results.length) { if (inp.value.trim()) C.toast('找不到「' + inp.value.trim() + '」'); return; }
        pick(results[Math.max(0, sel)].b.id);
      }
    });
    pop.addEventListener('mousedown', function (e) { e.preventDefault(); });
    pop.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('.s-item') : null;
      if (t) pick(t.getAttribute('data-id'));
    });
    clr.addEventListener('click', function () { inp.value = ''; run(); inp.focus(); });
    document.addEventListener('click', function (e) {
      if (!e.target.closest || !e.target.closest('#searchBox')) pop.hidden = true;
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && document.activeElement && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
        e.preventDefault();
        inp.focus();
      }
    });
    C.searchFor = function (q) { inp.value = q; run(); };
  }

  /* ------------------------------------------------------------ 最近造訪 */
  function renderRibbon() {
    var rb = $('ribbon');
    var list = C.recentVisits(6);
    if (!list.length) { rb.hidden = true; document.body.classList.remove('has-ribbon'); return; }
    rb.hidden = false;
    document.body.classList.add('has-ribbon');
    rb.querySelector('.rb-list').innerHTML = list.map(function (v) {
      return '<a class="rb-chip" href="' + esc(C.primaryUrl(v.b)) + '" data-visit="' + esc(v.b.id) + '" title="' + esc(v.b.name + '：' + (v.b.tagline || '')) + '">' +
        '<span aria-hidden="true">' + esc(v.b.icon || '🏫') + '</span> ' + esc(v.b.name) + ' <small>' + esc(C.util.timeAgo(v.at)) + '</small></a>';
    }).join('');
  }

  /* ------------------------------------------------------------ 學區快捷 */
  function renderChips() {
    var el = $('mapChips');
    var h = '<button type="button" class="mc" data-home="1">🏫 全覽</button>';
    var asg = C.map.layout();
    C.reg.districts.forEach(function (d) {
      if (asg && !asg.zones.some(function (z) { return z.district.id === d.id; })) return;
      h += '<button type="button" class="mc" data-district="' + esc(d.id) + '" style="--dc:' + esc(d.color || '#64748b') + '">' +
        esc((d.icon ? d.icon + ' ' : '') + String(d.name || '').replace(/學區$/, '')) + '</button>';
    });
    h += '<button type="button" class="mc mc-fun" id="mapFunBtn" data-fun-hub="1" title="打開校園遊樂場：釣魚、投籃、足球 PK、網球、專車導航與動物圖鑑">🎮 校園互動</button>';
    h += '<button type="button" class="mc mc-mode' + (C.infoMode ? ' on' : '') + '" id="mapModeBtn" data-info-mode="1" aria-pressed="' + (C.infoMode ? 'true' : 'false') + '" title="切換點建築的行為：直接進入 vs 看介紹卡">' +
      (C.infoMode ? '📖 點建築：看介紹' : '🚀 點建築：直接進入') + '</button>';
    el.innerHTML = h;
    el.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('.mc') : null;
      if (!t) return;
      if (t.hasAttribute('data-fun-hub')) {
        C.emit('fun', { kind: 'hub' });
        return;
      }
      if (t.hasAttribute('data-info-mode')) {
        C.infoMode = !C.infoMode;
        t.classList.toggle('on', C.infoMode);
        t.setAttribute('aria-pressed', C.infoMode ? 'true' : 'false');
        t.textContent = C.infoMode ? '📖 點建築：看介紹' : '🚀 點建築：直接進入';
        C.toast(C.infoMode ? '📖 已切換為「看介紹」模式：點地圖建築會先打開介紹卡' : '🚀 已切換為「直接進入」模式：點地圖建築會直接進入學院／實戰館');
        return;
      }
      if (t.hasAttribute('data-home')) C.map.reset();
      else C.map.focusDistrict(t.getAttribute('data-district'));
    });
  }

  /* ------------------------------------------------------------ 視窗（服務中心、意見回饋） */
  var lastFocus = null;
  var modalOpenedAt = 0;
  function openModal(id, html) {
    var bd = $(id);
    lastFocus = document.activeElement;
    modalOpenedAt = Date.now();
    bd.querySelector('.modal-body').innerHTML = html;
    bd.hidden = false;
    bd.classList.add('open');
    document.body.classList.add('modal-open');
    var f = bd.querySelector('h2');
    if (f) { f.setAttribute('tabindex', '-1'); f.focus(); }
  }
  function closeModal(bd) {
    bd.classList.remove('open');
    bd.hidden = true;
    if (!document.querySelector('.modal-bd.open')) document.body.classList.remove('modal-open');
    if (lastFocus && lastFocus.focus && document.contains(lastFocus)) try { lastFocus.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }
  function bindModals() {
    var mods = document.querySelectorAll('.modal-bd');
    for (var i = 0; i < mods.length; i++) {
      (function (bd) {
        bd.addEventListener('click', function (e) {
          if (Date.now() - modalOpenedAt < 420) return;
          if (e.target === bd || (e.target.closest && e.target.closest('.modal-x'))) closeModal(bd);
        });
      })(mods[i]);
    }
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape' || e.isComposing) return;
      var open = document.querySelector('.modal-bd.open');
      if (open) closeModal(open);
    });
  }

  function aboutHtml() {
    var reg = C.reg;
    var base = String(C.campusHome()).replace(/^https?:\/\//, '');
    var shorts = reg.buildings.filter(C.isLive).map(function (b) {
      return '<tr><td><a href="' + esc(C.primaryUrl(b)) + '"><code>' + esc(C.shortUrl(b)) + '</code></a></td><td>' + esc((b.icon || '') + ' ' + b.name) + '</td></tr>';
    }).join('');
    var dists = reg.districts.map(function (d) {
      return '<li><button type="button" class="linkish" data-goto-district="' + esc(d.id) + '">' + esc((d.icon || '') + ' ' + d.name) + '</button>：' + esc(d.desc || '') + '</li>';
    }).join('');
    var eg = reg.buildings.filter(function (b) { return b.id === 'english'; })[0] || reg.buildings[0];
    var egLink = eg && eg.links[1] ? eg.links[1] : null;
    return '<h2>🕰️ 學園服務中心 · 使用說明</h2>' +
      '<p class="lead">歡迎來到 <b>' + esc(reg.brand.name || '開心學園') + '</b>！' + esc(reg.brand.tagline || '') + '。每間學院與實戰館都保留自己的網址，左上角的「🏫 校園」按鈕隨時帶你回到這張地圖。</p>' +
      '<h3>🧭 怎麼逛</h3><ul>' +
      '<li><b>點建築</b>直接進入該學院或實戰館（想先看特色介紹與深連結，可點地圖上方「🚀 點建築：直接進入」切換為「📖 點建築：看介紹」，或到「📋 目錄」點「介紹」）</li>' +
      '<li><b>拖曳</b>平移，<b>滾輪或雙指</b>縮放；右下角 ＋／−／⟲ 回到全覽</li>' +
      '<li><b>點學區看板</b>（或地圖上方的學區按鈕）聚焦整個學區</li>' +
      '<li><b>搜尋</b>：輸入「日語」「K 線」「NBA」，按 Enter 直接打開最符合的建築（快捷鍵 <kbd>/</kbd>）</li>' +
      '<li><b>📋 目錄</b>：用清單瀏覽全部建築，手機上更好點</li>' +
      '<li>鍵盤：<kbd>Tab</kbd> 走訪建築、<kbd>Enter</kbd> 開啟、方向鍵平移、<kbd>+</kbd>／<kbd>-</kbd> 縮放、<kbd>0</kbd> 全覽</li></ul>' +
      '<h3>🏛️ 學區</h3><ul class="dist-list">' + dists + '</ul>' +
      '<h3>🔗 短網址與深連結</h3>' +
      '<table class="short-t"><tbody>' + shorts + '</tbody></table>' +
      '<ul class="deep">' +
      (egLink ? '<li><code>' + esc(base) + '?go=' + esc(eg.id) + '&amp;to=' + esc(egLink.hash.replace(/^#/, '')) + '</code> → 直接打開' + esc(eg.name) + '的「' + esc(egLink.label) + '」</li>' : '') +
      '<li><code>?b=&lt;建築&gt;</code> 打開介紹卡、<code>?d=&lt;學區&gt;</code> 聚焦學區（例：<code>?d=finance</code>）</li></ul>' +
      '<h3>🔒 資料與隱私</h3><p>所有學習進度都只存在你自己的瀏覽器（localStorage），不會上傳到任何伺服器；換瀏覽器或清除網站資料就會重新開始。</p>' +
      '<h3>⚠️ 免責聲明</h3><p>實戰區（台股智慧選股、NBA／英超／F1 運彩智庫）的投資與運彩資訊僅供研究與學習參考，不構成任何投資或投注建議，請自行判斷並承擔風險；運彩請量力而為，未滿 18 歲請勿購買。</p>' +
      '<div class="modal-acts"><button type="button" class="btn primary" data-act="feedback">💬 意見回饋／許願新學院</button>' +
      '<button type="button" class="btn" data-act="releases">📜 Release Notes</button></div>';
  }
  function openAbout() { openModal('aboutModal', aboutHtml()); }

  /* 意見回饋（Pattern 175：三欄 類型／標題／內容；本機 → /api/feedback，公開版 → FormSubmit＋mailto 備援） */
  var KINDS = [
    { id: 'feature', label: '✨ 許願新學院／功能' },
    { id: 'bug', label: '🐞 問題回報' },
    { id: 'ux', label: '🎨 介面建議' },
    { id: 'other', label: '💬 其他' },
  ];
  function feedbackHtml(pre) {
    pre = pre || {};
    return '<h2>💬 意見回饋・許願新學院</h2>' +
      '<p class="lead">想要什麼新學院、發現 Bug、或有任何建議都歡迎留言，送出後會寄信通知站長。</p>' +
      '<form id="fbForm" class="fb-form" novalidate>' +
      '<label class="fb-l">1. 類型</label><div class="fb-kinds">' + KINDS.map(function (k) {
        return '<button type="button" class="btn sm' + ((pre.kind || 'feature') === k.id ? ' primary' : '') + '" data-kind="' + k.id + '">' + esc(k.label) + '</button>';
      }).join('') + '</div>' +
      '<label class="fb-l" for="fbTitle">2. 標題</label>' +
      '<input id="fbTitle" maxlength="150" required placeholder="例：想要一間烹飪學院" value="' + esc(pre.title || '') + '">' +
      '<label class="fb-l" for="fbDesc">3. 內容</label>' +
      '<textarea id="fbDesc" rows="5" maxlength="4000" required placeholder="想學什麼、希望怎麼設計，或遇到的問題…">' + esc(pre.desc || '') + '</textarea>' +
      '<div class="modal-acts"><button type="submit" class="btn primary" id="fbSend">📨 送出</button><span class="fb-msg" id="fbMsg" role="status"></span></div>' +
      '</form>';
  }
  function openFeedback(pre) {
    openModal('fbModal', feedbackHtml(pre));
    var form = $('fbForm');
    var kind = (pre && pre.kind) || 'feature';
    var sending = false;
    form.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-kind]') : null;
      if (!t) return;
      kind = t.getAttribute('data-kind');
      var bs = form.querySelectorAll('[data-kind]');
      for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('primary', bs[i] === t);
    });
    $('fbTitle').addEventListener('keydown', function (e) {
      if (C.isEnterSend(e)) { e.preventDefault(); $('fbDesc').focus(); }
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (sending) return;
      var title = $('fbTitle').value.trim(), desc = $('fbDesc').value.trim(), msg = $('fbMsg');
      if (!title || !desc) { msg.textContent = '請填寫標題與內容'; return; }
      sending = true;
      var btn = $('fbSend');
      btn.disabled = true;
      btn.textContent = '⏳ 送出中…';
      var kindLabel = (KINDS.filter(function (k) { return k.id === kind; })[0] || KINDS[0]).label;
      var item = { kind: kind, kind_label: kindLabel, title: title, description: desc, created_at: new Date().toISOString(), page: 'campus' };
      try {
        var hist = JSON.parse(localStorage.getItem(FEEDBACK_KEY) || '[]');
        hist.unshift(item);
        localStorage.setItem(FEEDBACK_KEY, JSON.stringify(hist.slice(0, 30)));
      } catch (er) { /* ignore */ }
      var subject = '[開心學園 意見回饋] ' + kindLabel + ' — ' + title;
      var mailto = 'mailto:' + FEEDBACK_EMAIL + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent('類型：' + kindLabel + '\n標題：' + title + '\n\n' + desc);
      var send = C.env.mode === 'cloudtop'
        ? fetch('/api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item) }).then(function (r) { return r.json(); }).then(function (j) { return !!(j && j.ok !== false); })
        : fetch('https://formsubmit.co/ajax/' + FEEDBACK_EMAIL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ _subject: subject, _template: 'table', _captcha: 'false', 工具名稱: '開心學園', 回饋類型: kindLabel, 標題: title, 內容描述: desc }),
        }).then(function (r) { return r.json().then(function (j) { return r.ok && (j.success === true || j.success === 'true'); }); });
      send.catch(function () { return false; }).then(function (ok) {
        sending = false;
        btn.disabled = false;
        btn.textContent = '📨 送出';
        if (ok) {
          msg.innerHTML = '✅ 已送出，謝謝你的回饋！';
          form.reset();
        } else {
          msg.innerHTML = '目前無法自動寄出，<a href="' + esc(mailto) + '">改用 Email 寄送 ✉️</a>';
        }
      });
    });
  }

  /* ------------------------------------------------------------ 網址參數 */
  function handleParams() {
    var go = C.goTarget();
    if (go && go.error) {
      C.toast('找不到「' + go.error + '」，幫你在校園裡搜尋看看');
      if (C.searchFor) C.searchFor(go.error);
    } else if (go && go.planned) {
      openBuilding(go.planned.id, { zoom: true });
      C.toast('🚧 ' + go.planned.name + ' 還在建設中，敬請期待');
      return;
    }
    var from = qs('from'), b = qs('b'), d = qs('d'), q0 = qs('q');
    if (q0 && C.searchFor) C.searchFor(q0);
    var fromB = from ? C.building(from) : null;
    if (fromB) {
      C.map.markFrom(fromB.id);
      if (C.panel.isMobile() && !b && !d) C.map.focusBuilding(fromB.id, { ms: 0 });
    }
    if (b && C.building(b)) {
      if (location.hash === '#dir') setView('map', { noHash: false });
      openBuilding(b, { zoom: false });
    } else if (d) {
      var dist = C.district(d);
      if (dist) {
        if (view !== 'map') setView('map');
        C.map.focusDistrict(dist.id, 0);
      }
    }
  }

  /* ------------------------------------------------------------ 啟動 */
  function boot() {
    if (C.reg && C.reg.brand && C.reg.brand.name) {
      var bn = document.querySelector('.brand-name');
      if (bn) bn.textContent = C.reg.brand.name;
      document.title = C.reg.brand.name + ' · 校園地圖';
    }
    initSearch();
    bindModals();
    C.map.init($('mapWrap'));
    C.dir.render();
    renderChips();
    renderRibbon();
    if (location.hash === '#dir') setView('dir', { noHash: true });

    $('tabMap').addEventListener('click', function () { setView('map'); });
    $('tabDir').addEventListener('click', function () { setView('dir'); });
    document.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-act],[data-goto-district],.rb-chip') : null;
      if (!t) return;
      if (t.classList.contains('rb-chip')) { C.recordVisit(t.getAttribute('data-visit')); return; }
      if (t.hasAttribute('data-goto-district')) {
        var open = document.querySelector('.modal-bd.open');
        if (open) closeModal(open);
        C.emit('district', t.getAttribute('data-goto-district'));
        return;
      }
      var act = t.getAttribute('data-act');
      if (act === 'about') openAbout();
      else if (act === 'feedback') { var o = document.querySelector('.modal-bd.open'); if (o) closeModal(o); openFeedback(); }
      else if (act === 'releases') {
        var o2 = document.querySelector('.modal-bd.open');
        if (o2) closeModal(o2);
        if (C.openReleaseModal) C.openReleaseModal();
        else { var vb = $('verBadgeBtn'); if (vb) vb.click(); }
      }
    });
    window.addEventListener('storage', function (e) { if (e.key === 'okayell.campus.visits.v1') renderRibbon(); });

    C.on('open', function (id) { openBuilding(id); });
    C.on('about', openAbout);
    C.on('district', function (did) {
      if (view !== 'map') setView('map');
      if (C.panel.current() && C.panel.isMobile()) C.panel.close();
      C.map.focusDistrict(did);
    });
    C.on('wish', function (x) {
      var pre = { kind: 'feature' };
      if (x && x.building) {
        pre.title = '許願：' + x.building.name + ' 快點開張';
        pre.desc = '我最想先學的內容：';
      } else {
        var d = C.district(x);
        pre.title = d ? '許願：' + d.name + '的新' + (d.id === 'arena' ? '實戰館' : '學院') : '許願：新的學區';
      }
      openFeedback(pre);
    });
    C.on('panelclose', function () { C.map.select(null); });

    if (C.env.mode === 'cloudtop') {
      var chip = $('envChip');
      if (chip) chip.hidden = false;
      C.refreshStatus(true);
      setInterval(function () { if (!document.hidden) C.refreshStatus(); }, 20000);
      C.on('status', renderRibbon);
    }

    handleParams();

    // 第一次來：操作提示
    var hint = $('mapHint');
    var seen = false;
    try { seen = !!localStorage.getItem(HINT_KEY); } catch (e) { seen = true; }
    if (hint && !seen && view === 'map') {
      hint.hidden = false;
      setTimeout(function () { hint.classList.add('show'); }, 400);
      var hide = function () {
        hint.classList.remove('show');
        setTimeout(function () { hint.hidden = true; }, 400);
        try { localStorage.setItem(HINT_KEY, '1'); } catch (e) { /* ignore */ }
        $('mapWrap').removeEventListener('pointerdown', hide);
      };
      $('mapWrap').addEventListener('pointerdown', hide);
      setTimeout(hide, 6000);
    }
    document.body.classList.add('ready');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
  <script>/* js/fun.js */
/* 開心學園 · fun.js — 校園互動生態與小遊戲系統
 *   1. 🚗 停車場車隊＆🚌 開心校車：點車子立即發動兜風，或指定開往任一學院（沿校園道路導航行駛）

 */
(function () {

  var ST = loadState();
  function saveState() {

    { id: 'dragon_koi', name: '黃金龍魚王', icon: '👑', col: '#d97706', stars: '★★★★★', pts: 120, cm: [58, 88], desc: '學園湖傳說級霸主！全身閃耀金色鱗片，釣到代表今日運勢大吉！' },

  /* ------------------------------------------------------------ 地圖特效泡泡（動物／車子喇叭／釣魚水花） */

  /* ------------------------------------------------------------ 🐾 校園動物互動 */

  /* ------------------------------------------------------------ 🚗 校園專車與道路導航系統 */
  var V = {
    layer: null,

  // 校車巡航路線（校門 ⇄ 中央廣場 ⇄ 語言學區 ⇄ 財經學區）
  var BUS_LOOP = [
    { x: 1000, y: 1140 },
    { x: 1000, y: 500 },
    { x: 280, y: 500 },
    { x: 1000, y: 500 },
    { x: 1436, y: 500 },

  function ensureVehicleLayer() {
    if (V.layer && document.contains(V.layer)) return V.layer;
    V.layer = document.getElementById('mapVehicles');
    if (!V.layer) return null;
    // 建立巡迴開心校車

      '<rect x="-14" y="-7.5" width="6" height="2" fill="#e0f2fe"/><rect x="-5" y="-7.5" width="6" height="2" fill="#e0f2fe"/><rect x="3" y="-7.5" width="5" height="2" fill="#e0f2fe"/>' +
      '<rect x="-14" y="5.5" width="6" height="2" fill="#e0f2fe"/><rect x="-5" y="5.5" width="6" height="2" fill="#e0f2fe"/><rect x="3" y="5.5" width="5" height="2" fill="#e0f2fe"/>' +
      '<circle cx="19" cy="-5.5" r="2" fill="#fef08a"/><circle cx="19" cy="5.5" r="2" fill="#fef08a"/>' +

  function startBusLoop() {
    cancelAnimationFrame(V.busRaf);
    var segs = [];
    var totalLen = 0;
    for (var i = 0; i < BUS_LOOP.length - 1; i++) {
      var a = BUS_LOOP[i], b = BUS_LOOP[i + 1];
      var len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      segs.push({ a: a, b: b, len: len, start: totalLen, ang: Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI });
      totalLen += len;
    }
    var speed = 58; // px per second
    var last = performance.now();
    function tick(now) {
      var dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      if (!V.busEl || !document.contains(V.busEl)) {
        if (document.getElementById('mapVehicles')) ensureVehicleLayer();
      }
      if (!document.hidden && V.busEl) {
        V.busT = (V.busT + speed * dt) % totalLen;
        var d = V.busT;
        var seg = segs[0];
        for (var j = 0; j < segs.length; j++) {
          if (d <= segs[j].start + segs[j].len) { seg = segs[j]; break; }
        }
        var u = (d - seg.start) / seg.len;
        var x = seg.a.x + (seg.b.x - seg.a.x) * u;
        var y = seg.a.y + (seg.b.y - seg.a.y) * u;
        V.busEl.setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')');
        var rot = V.busEl.querySelector('.veh-rot');
        if (rot) rot.setAttribute('transform', 'rotate(' + seg.ang.toFixed(1) + ')');
      }
      V.busRaf = requestAnimationFrame(tick);
    }
    V.busRaf = requestAnimationFrame(tick);
  }

    if (rot) rot.setAttribute('transform', 'rotate(' + (V.carPos.ang || 0).toFixed(1) + ')');
    return V.carEl;
  }

  // 依據校園道路網計算從 p0 到目標點 (tx, ty, district) 的轉折路徑
  function buildRoadWaypoints(p0, tx, ty, districtId) {
    var pts = [{ x: p0.x, y: p0.y }];
    function add(x, y) {
      var last = pts[pts.length - 1];
      if (Math.hypot(x - last.x, y - last.y) > 4) pts.push({ x: x, y: y });
    }
    // 1. 先從目前位置回到最近的主幹道節點
    if (p0.y > 1020 && p0.x < 960) {
      add(p0.x, 1084);
      add(1000, 1084);
    } else if (Math.abs(p0.x - 1000) > 25 && Math.abs(p0.y - 500) > 25) {
      if (p0.x > 1400 && p0.y < 520) add(1436, p0.y);
      else if (p0.y < 520) add(p0.x, 500);
      else add(1000, p0.y);
    }
    // 2. 走中央南北大道 (x=1000) 與東西大道 (y=500)
    var cur = pts[pts.length - 1];
    if (districtId === 'language') {
      if (cur.y !== 500) { add(1000, cur.y); add(1000, 500); }
      add(280, 500);
      add(280, 436);
      add(tx, 436);
      add(tx, ty);
    } else if (districtId === 'finance') {
      if (cur.y !== 500) { add(1000, cur.y); add(1000, 500); }
      add(1436, 500);
      add(1436, 286);
      add(tx, 286);
      add(tx, ty);
    } else if (districtId === 'tech') {
      if (cur.y !== 500) { add(1000, cur.y); add(1000, 500); }
      add(424, 500);
      add(424, 698);
      if (tx < 360) { add(300, 698); add(300, ty); add(tx, ty); }
      else if (tx > 600) { add(584, 698); add(584, ty); add(tx, ty); }
      else { add(tx, ty); }
    } else if (districtId === 'games') {
      if (cur.x !== 1000) { add(cur.x, 500); add(1000, 500); }
      add(1000, 790);
      add(tx, 790);
      add(tx, ty);
    } else if (districtId === 'care' || districtId === 'arts') {
      if (cur.x !== 1000) { add(cur.x, 500); add(1000, 500); }
      add(1000, 1132);
      add(tx, 1132);
      add(tx, ty);
    } else if (districtId === 'parking') {
      if (cur.x !== 1000) { add(cur.x, 500); add(1000, 500); }
      add(1000, 1084);
      add(tx, 1084);
      add(tx, ty);
    } else {
      // 球場或湖邊
      if (cur.y !== 500) { add(1000, cur.y); add(1000, 500); }
      add(tx, 500);
      add(tx, ty);
    }
    return pts;
  }

  function animateCarAlong(pts, labelText, onDone) {
    cancelAnimationFrame(V.carRaf);
    var car = ensureActiveCar();
    if (!car || pts.length < 2) { if (onDone) onDone(); return; }
    var tag = car.querySelector('.car-tag-txt');
    if (tag && labelText) tag.textContent = labelText;

    var segs = [];
    var total = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var a = pts[i], b = pts[i + 1];
      var len = Math.hypot(b.x - a.x, b.y - a.y);
      if (len < 1) continue;
      segs.push({ a: a, b: b, len: len, start: total, ang: Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI });
      total += len;
    }
    if (!segs.length) { if (onDone) onDone(); return; }
    var speed = 340; // px/sec
    var dur = Math.max(0.65, total / speed);
    var t0 = performance.now();
    function step(now) {
      var p = Math.min(1, (now - t0) / (dur * 1000));
      var ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      var dist = ease * total;
      var seg = segs[segs.length - 1];
      for (var j = 0; j < segs.length; j++) {
        if (dist <= segs[j].start + segs[j].len) { seg = segs[j]; break; }
      }
      var u = seg.len ? (dist - seg.start) / seg.len : 1;
      var x = seg.a.x + (seg.b.x - seg.a.x) * u;
      var y = seg.a.y + (seg.b.y - seg.a.y) * u;
      V.carPos = { x: x, y: y, ang: seg.ang };
      car.setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')');
      var rot = car.querySelector('.veh-rot');
      if (rot) rot.setAttribute('transform', 'rotate(' + seg.ang.toFixed(1) + ')');
      if (p < 1) {
        V.carRaf = requestAnimationFrame(step);
      } else {
        if (onDone) onDone();
      }
    }
    V.carRaf = requestAnimationFrame(step);
  }

  function selectParkedCar(idx) {
    var cars = document.querySelectorAll('#campusMap .parked-car');
    for (var i = 0; i < cars.length; i++) {
      var isThis = +cars[i].getAttribute('data-car') === idx;
      cars[i].classList.toggle('car-out', isThis);
      if (isThis) {
        V.activeCarIdx = idx;
        V.activeCarColor = cars[i].getAttribute('data-car-color') || '#f87171';
        V.activeCarName = cars[i].getAttribute('data-car-name') || '🏎️ 校園專車';
        V.carPos = {
          x: Number(cars[i].getAttribute('data-cx')) || 517,
          y: Number(cars[i].getAttribute('data-cy')) || 1084,
          ang: -90,
        };
      }
    }
    ensureActiveCar(V.activeCarColor, V.activeCarName);
  }

  function driveCarToBuilding(id, opts) {
    opts = opts || {};
    var b = C.building(id);
    var placed = C.map.placed ? C.map.placed() : {};
    var p = placed[id];
    if (!b || !p || !p.slot) return;
    if (V.activeCarIdx < 0) selectParkedCar(0);
    C.carPickMode = false;
    updateCarHud();
    var tx = p.slot.x, ty = p.slot.y + 6;
    var pts = buildRoadWaypoints(V.carPos, tx, ty, b.district);
    spawnMapBubble(V.carPos.x, V.carPos.y, '叭叭！出發前往 ' + b.name + ' 🚗💨', '#2563eb');
    C.toast('🚗 ' + V.activeCarName + ' 正在開往「' + b.name + '」…');
    ST.carTrips = (ST.carTrips || 0) + 1;
    saveState();
    animateCarAlong(pts, '🚗 → ' + b.name, function () {
      spawnMapBubble(tx, ty, '🎉 已抵達 ' + b.name + '！', '#1d6b57');
      var tag = V.carEl && V.carEl.querySelector('.car-tag-txt');
      if (tag) tag.textContent = '📍 ' + b.name;

        C.recordVisit(b.id);
        C.toast('🚀 專車已抵達「' + b.name + '」，正在為你進入學院…');
        setTimeout(function () { window.location.href = C.primaryUrl(b); }, 550);
      } else if (V.arrivalAction === 'panel' && !opts.keepPanel) {
        C.emit('open', b.id);
      } else {
        C.map.focusBuilding(b.id, { zoom: false });
      }
    });

  function driveCarToSpot(spotKind) {
    if (V.activeCarIdx < 0) selectParkedCar(0);

    if (spotKind === 'parking') {
      var pts0 = buildRoadWaypoints(V.carPos, 517, 1084, 'parking');

        V.carEl = null;
        V.activeCarIdx = -1;

    else if (spotKind === 'tennis') { tx = 1316; ty = 370; label = '🎾 森林網球場'; }
    else if (spotKind === 'soccer') { tx = 802; ty = 1084; label = '⚽ 綠茵足球場'; }
    var pts = buildRoadWaypoints(V.carPos, tx, ty, spotKind === 'soccer' ? 'parking' : '');
    C.toast('🚗 ' + V.activeCarName + ' 正在開往「' + label + '」…');
    animateCarAlong(pts, '🚗 → ' + label, function () {

  function startRandomCruise() {
    var liveBlds = (C.reg.buildings || []).filter(function (b) { return C.isLive(b); });
    if (!liveBlds.length) liveBlds = C.reg.buildings || [];
    if (!liveBlds.length) return;
    var pick = liveBlds[Math.floor(Math.random() * liveBlds.length)];
    var prevMode = V.arrivalAction;
    V.arrivalAction = 'cruise';
    driveCarToBuilding(pick.id, { keepPanel: true });
    V.arrivalAction = prevMode;

  function openCarHud(carIdx) {
    if (typeof carIdx === 'number' && carIdx >= 0) selectParkedCar(carIdx);
    else if (V.activeCarIdx < 0) selectParkedCar(0);
    if (!V.hudEl) {
      var wrap = document.getElementById('mapWrap');
      if (!wrap) return;
      var div = document.createElement('div');
      div.className = 'car-hud';
      div.id = 'carNavHud';
      wrap.appendChild(div);
      V.hudEl = div;
      div.addEventListener('click', function (e) {
        var btn = e.target.closest ? e.target.closest('button[data-car-act]') : null;
        if (!btn) return;
        var act = btn.getAttribute('data-car-act');
        if (act === 'close') {
          C.carPickMode = false;
          div.hidden = true;
        } else if (act === 'random') {
          startRandomCruise();
        } else if (act === 'pick-map') {
          C.carPickMode = !C.carPickMode;
          updateCarHud();
          C.toast(C.carPickMode ? '👆 請直接點擊地圖上的任一棟建築，專車就會開過去！' : '已取消地圖點選導航');
        } else if (act === 'mode') {
          V.arrivalAction = V.arrivalAction === 'panel' ? 'enter' : (V.arrivalAction === 'enter' ? 'cruise' : 'panel');
          updateCarHud();
        } else if (act === 'goto-bld') {
          driveCarToBuilding(btn.getAttribute('data-bld'));
        } else if (act === 'goto-spot') {
          driveCarToSpot(btn.getAttribute('data-spot'));
        }
      });
    }
    V.hudEl.hidden = false;
    updateCarHud();
  }

  /* ------------------------------------------------------------ 🎮 小遊戲視窗（Modal 容器） */
  var activeCleanup = null;
