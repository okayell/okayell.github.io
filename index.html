  /* ------------------------------------------------------------ 對外操作 */
  function slotOf(id) { var p = M.asg && M.asg.placed[id]; return p ? p.slot : null; }
  function zoneOf(did) {
    if (!M.asg) return null;
    for (var i = 0; i < M.asg.zones.length; i++) if (M.asg.zones[i].district.id === did) return M.asg.zones[i];
    return null;
  }
  function focusDistrict(did, ms) {
    var z = zoneOf(did);
    if (!z) return false;
    var b = z.layout.box;
    flyTo(fitView({ x: b[0], y: b[1] - 10, w: b[2] - b[0], h: b[3] - b[1] + 30 }, M.cw < 720 ? 8 : 40), ms);
    var g = M.svg.querySelector('.zone[data-district="' + did + '"]');
    if (g) {
      g.classList.remove('zfocus');
      void g.getBoundingClientRect();
      g.classList.add('zfocus');
      setTimeout(function () { g.classList.remove('zfocus'); }, 2400);
    }
    return true;
  }
  // 把建築移到可視區（panelW：右側抽屜寬度，桌機開啟介紹卡時讓出空間）
  function focusBuilding(id, opts) {
    opts = opts || {};
    var sl = slotOf(id);
    if (!sl) return false;
    var v = M.view;
    var w = v.w;
    if (opts.zoom) {
      var target = Math.max(sl.w * 3.2, 520);
      w = Math.min(w, target * Math.max(1, M.cw / M.ch) * (M.cw < 720 ? 1 : 0.75));
      w = Math.max(w, limits().minW);
    }
    var h = w * M.ch / M.cw;
    var s = M.cw / w;
    var offX = (opts.panelW || 0) / 2 / s;
    var offY = (opts.sheetH || 0) / 2 / s;
    var cx = sl.x + offX, cy = sl.y - sl.h / 2 + offY;
    var nv = { x: cx - w / 2, y: cy - h / 2, w: w, h: h };
    if (opts.ifNeeded) {
      var r = { x: sl.x - sl.w / 2, y: sl.y - sl.h, w: sl.w, h: sl.h + 30 };
      var visW = v.w - (opts.panelW || 0) / scale(), visH = v.h - (opts.sheetH || 0) / scale();
      if (r.x > v.x + 10 && r.x + r.w < v.x + visW - 10 && r.y > v.y + 10 && r.y + r.h < v.y + visH - 10) return true;
    }
    flyTo(nv, opts.ms);
    return true;
  }
  function reset(ms) { flyTo(homeView(), ms); }
  function highlight(ids) {
    var on = Array.isArray(ids);
    if (on) ids = ids.map(function (id) { var b = C.building(id); return b && b.inside && b.parent ? b.parent : id; });
    M.searchIds = ids;
    M.svg.classList.toggle('searching', on);
    var nodes = M.svg.querySelectorAll('.bld, .lbl[data-id]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].classList.toggle('hit', on && ids.indexOf(nodes[i].getAttribute('data-id')) >= 0);
    }
  }
  function select(id) {
    M.selId = id;
    var nodes = M.svg.querySelectorAll('.bld');
    for (var i = 0; i < nodes.length; i++) nodes[i].classList.toggle('sel', nodes[i].getAttribute('data-id') === id);
  }
  function markFrom(id) {
    var sl = slotOf(id);
    var fx = M.svg.querySelector('.m-fx');
    if (!sl || !fx) return false;
    M.fromId = id;
    var g = M.svg.querySelector('.bld[data-id="' + id + '"]');
    if (g) g.classList.add('from');
    var above = sl.y < 260;
    var y = above ? sl.y - sl.h - 4 : sl.y + 34;
    var bubble = above
      ? '<path d="M-74,-44 H74 Q84,-44 84,-34 V-18 Q84,-8 74,-8 H9 L0,1 L-9,-8 H-74 Q-84,-8 -84,-18 V-34 Q-84,-44 -74,-44 Z" fill="#1d6b57" stroke="#0f3f33" stroke-width="1.5"/>' +
        '<text x="0" y="-20.5" text-anchor="middle" font-family="' + FONT + '" font-size="14.5" font-weight="800" fill="#fffaf0">📍 你剛剛在這裡</text>'
      : '<path d="M-74,8 H-8 L0,0 L8,8 H74 Q84,8 84,18 V34 Q84,44 74,44 H-74 Q-84,44 -84,34 V18 Q-84,8 -74,8 Z" fill="#1d6b57" stroke="#0f3f33" stroke-width="1.5"/>' +
        '<text x="0" y="31.5" text-anchor="middle" font-family="' + FONT + '" font-size="14.5" font-weight="800" fill="#fffaf0">📍 你剛剛在這裡</text>';
    fx.innerHTML = '<g class="from-callout lbl" transform="translate(' + sl.x + ',' + n(y) + ')"><g class="lbl-s">' +
      '<g class="fc-bob">' + bubble + '</g></g></g>';
    return true;
  }

  function measure() {
    var r = M.wrap.getBoundingClientRect();
    M.cw = Math.max(1, Math.round(r.width));
    M.ch = Math.max(1, Math.round(r.height));
  }
  function resize() {
    if (!M.svg) return;
    var old = { cx: M.view.x + M.view.w / 2, cy: M.view.y + M.view.h / 2, s: scale() };
    var pw = M.cw;
    measure();
    if (!M.cw || M.cw < 2) return;
    if (!pw || pw < 2 || !M.ready) { M.ready = true; applyView(homeView()); return; }
    var w = M.cw / old.s;
    var h = M.ch / old.s;
    applyView({ x: old.cx - w / 2, y: old.cy - h / 2, w: w, h: h });
  }

  function init(wrap) {
    M.wrap = wrap;
    M.svg = wrap.querySelector('svg.campus-map');
    M.tip = wrap.querySelector('.map-tip');
    if (C.registryError) {
      wrap.classList.add('map-error');
      var msg = document.createElement('div');
      msg.className = 'map-err';
      msg.textContent = '⚠️ 校園資料載入失敗：' + C.registryError;
      wrap.appendChild(msg);
      return;
    }
    M.asg = C.assignLayout(C.reg);
    var scene = buildScene(M.asg);
    M.svg.innerHTML = scene.svg;
    M.labelMeta = scene.labels;
    measure();
    layoutLabels();
    M.ready = M.cw > 2;
    applyView(homeView());
    bindPointer();
    var zi = document.getElementById('zoomIn'), zo = document.getElementById('zoomOut'), zr = document.getElementById('zoomReset');
    if (zi) zi.addEventListener('click', function () { zoomBy(1.4); });
    if (zo) zo.addEventListener('click', function () { zoomBy(1 / 1.4); });
    if (zr) zr.addEventListener('click', function () { reset(); });
    var rt = 0;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(resize, 80); });
    // 只有用鍵盤操作時才自動捲動到焦點
    document.addEventListener('keydown', function (e) { if (e.key === 'Tab') wrap.classList.add('kbd'); }, true);
    document.addEventListener('pointerdown', function () { wrap.classList.remove('kbd'); }, true);
  }

  function flyToPoint(x, y, zoomW, ms) {
    var w = zoomW || Math.min(M.view.w, 820);
    w = clamp(w, limits().minW, limits().maxW);
    var h = w * M.ch / Math.max(1, M.cw);
    flyTo({ x: x - w / 2, y: y - h / 2, w: w, h: h }, ms);
  }

  C.map = {
    init: init,
    resize: resize,
    relayout: function () { layoutLabels(); },
    reset: reset,
    zoomBy: zoomBy,
    focusDistrict: focusDistrict,
    focusBuilding: focusBuilding,
    flyToPoint: flyToPoint,
    highlight: highlight,
    select: select,
    markFrom: markFrom,
    placed: function () { return M.asg ? M.asg.placed : {}; },
    layout: function () { return M.asg; },
    view: function () { return M.view; },
  };
})();

</script>
  <script>/* js/panel.js */
/* 開心學園 · panel.js — 建築介紹卡：桌機右側抽屜、手機底部滑出面板
 *   圖示、中英名稱、學區、標語、介紹、特色、深連結、主要入口（進入學院／進入實戰館）、複製網址、
 *   Cloudtop 模式另有「🖥️ Cloudtop 版」與即時服務狀態 🟢／⚪。
 */
(function () {
  'use strict';
  var C = window.CAMPUS;
  var esc = C.util.esc;
  var P = { el: null, body: null, bd: null, id: null, lastFocus: null, openedAt: 0 };

  function isMobile() { return !!(window.matchMedia && window.matchMedia('(max-width: 720px)').matches); }

  function statusChip(b) {
    var st = C.STATUS[b.status] || C.STATUS.live;
    return '<span class="chip" style="background:' + st.bg + ';color:' + st.fg + ';border-color:' + st.bd + '">' + esc(st.t) + '</span>';
  }
  function primaryLabel(b) {
    if (b.kind === 'arena') return '進入實戰館 →';
    if (b.kind === 'department') return '進入分院 →';
    return '進入學院 →';
  }
  function ctRow(b) {
    if (C.env.mode !== 'cloudtop' || !b.local_port || !C.isLive(b)) return '';
    var up = C.portUp(b);
    var dot = up === true ? '🟢' : up === false ? '⚪' : '⏳';
    var txt = up === true ? '本機服務運作中' : up === false ? '本機服務未啟動' : '檢查本機服務中…';
    return '<div class="pn-ct" data-ct="' + esc(b.id) + '">' +
      '<span class="ct-state"><span aria-hidden="true">' + dot + '</span> ' + esc(txt) + ' <code>:' + esc(b.local_port) + '</code></span>' +
      '</div>';
  }

  function render(b) {
    var d = C.districtOf(b) || { name: '', color: '#64748b', soft: '#f1f5f9', icon: '' };
    var live = C.isLive(b);
    var parent = b.parent ? C.building(b.parent) : null;
    var children = C.reg.buildings.filter(function (x) { return x.parent === b.id; });
    var h = '';
    h += '<div class="pn-hero" style="--dc:' + esc(d.color) + ';--ds:' + esc(d.soft) + '">' +
      '<div class="pn-ic" aria-hidden="true">' + esc(b.icon || '🏫') + '</div>' +
      '<div class="pn-hd">' +
      '<h2 id="pnTitle" tabindex="-1">' + esc(b.name) + ' ' + statusChip(b) + '</h2>' +
      '<div class="pn-en">' + esc(b.en || '') + '</div>' +
      '<button type="button" class="pn-dist" data-district="' + esc(b.district) + '">' + esc((d.icon ? d.icon + ' ' : '') + d.name) + ' <span aria-hidden="true">›</span></button>' +
      '</div></div>';
    if (parent) {
      h += '<div class="pn-parent">' + (b.inside ? '位於' : '隸屬') + ' <button type="button" class="linkish" data-open="' + esc(parent.id) + '">' + esc((parent.icon || '') + ' ' + parent.name) + '</button> ' + (b.inside ? '館內' : '的分院') + '</div>';
    }
    if (b.tagline) h += '<p class="pn-tag">' + esc(b.tagline) + '</p>';
    if (b.desc) h += '<p class="pn-desc">' + esc(b.desc) + '</p>';
    if (b.features.length) {
      h += '<ul class="pn-feat">' + b.features.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>';
    }
    if (children.length) {
      var kidsTitle = b.kind === 'venue' ? '館內學院' : (children.length === 4 ? '四大分院' : '隸屬分院（' + children.length + '）');
      h += '<div class="pn-sec">' + kidsTitle + '</div><div class="pn-kids">' + children.map(function (k) {
        return '<button type="button" class="kid" data-open="' + esc(k.id) + '"><span aria-hidden="true">' + esc(k.icon || '') + '</span> ' + esc(k.name) + '</button>';
      }).join('') + '</div>';
    }
    if (live && b.links.length) {
      h += '<div class="pn-sec">快速前往</div><div class="pn-links">' + b.links.map(function (l) {
        return '<a href="' + esc(C.linkUrl(b, l.hash)) + '" data-visit="' + esc(b.id) + '">' + esc(l.label) + '</a>';
      }).join('') + '</div>';
    }
    if (b.related && b.related.length) {
      var relItems = b.related.map(function (r) {
        var rb = C.building(r.id);
        if (!rb) return '';
        if (C.isLive(rb)) {
          var rUrl = r.hash ? C.linkUrl(rb, r.hash) : C.primaryUrl(rb);
          return '<a class="pn-rel-link" href="' + esc(rUrl) + '" data-visit="' + esc(rb.id) + '" data-rel-id="' + esc(rb.id) + '" data-rel-hash="' + esc(r.hash || '') + '">' + esc(r.label || rb.name) + ' ↗</a>';
        }
        return '<button type="button" class="pn-rel-link pn-rel-btn" data-open="' + esc(rb.id) + '">' + esc(r.label || rb.name) + ' ›</button>';
      }).filter(Boolean);
      if (relItems.length) {
        var relSec = b.district === 'tech' ? '🔗 軟硬整合・跨院連動' : '🔗 理論 ⇄ 實戰連動';
        h += '<div class="pn-sec">' + relSec + '</div><div class="pn-links pn-related">' + relItems.join('') + '</div>';
      }
    }
    h += '<div class="pn-actions">';
    if (live) {
      h += '<a class="btn primary big" href="' + esc(C.primaryUrl(b)) + '" data-visit="' + esc(b.id) + '" data-primary="1">' + esc(primaryLabel(b)) + '</a>' +
        '<div style="display:flex;gap:8px;width:100%"><button type="button" class="btn" style="flex:1" data-drive-to="' + esc(b.id) + '">🚗 派專車開來這裡</button>' +
        '<button type="button" class="btn" style="flex:1" data-copy="' + esc(b.id) + '">🔗 複製網址</button></div>';
    } else {
      h += '<button type="button" class="btn big" disabled>🚧 建設中・敬請期待</button>' +
        '<div style="display:flex;gap:8px;width:100%"><button type="button" class="btn" style="flex:1" data-drive-to="' + esc(b.id) + '">🚗 派車去工地巡視</button>' +
        '<button type="button" class="btn" style="flex:1" data-wish="' + esc(b.id) + '">💬 許願開課</button></div>';
    }
    h += '</div>';
    h += ctRow(b);
    if (live) {
      h += '<div class="pn-meta">短網址 <code>' + esc(C.shortUrl(b)) + '</code><span class="sep">·</span>' +
        '<button type="button" class="linkish" data-share="' + esc(b.id) + '">分享這張介紹卡</button></div>';
    }
    return h;
  }

  function ensure() {
    if (P.el) return;
    P.el = document.getElementById('panel');
    P.body = P.el.querySelector('.pn-body');
    P.bd = document.getElementById('sheetBd');
    P.el.querySelector('.pn-close').addEventListener('click', function () {
      if (P.openedAt && Date.now() - P.openedAt < 380) return;
      close();
    });
    if (P.bd) P.bd.addEventListener('click', function () {
      if (P.openedAt && Date.now() - P.openedAt < 420) return;
      close();
    });
    P.el.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-open],[data-district],[data-copy],[data-share],[data-wish],[data-visit],[data-drive-to]') : null;
      if (!t) return;
      if (t.hasAttribute('data-drive-to')) {
        var dtId = t.getAttribute('data-drive-to');
        if (isMobile()) close();
        if (C.driveCarToBuilding) C.driveCarToBuilding(dtId, { keepPanel: !isMobile() });
        return;
      }
      if (t.hasAttribute('data-open')) { C.emit('open', t.getAttribute('data-open')); return; }
      if (t.classList.contains('pn-dist')) {
        var did = t.getAttribute('data-district');
        if (isMobile()) close();
        C.emit('district', did);
        return;
      }
      if (t.hasAttribute('data-copy')) {
        var b = C.building(t.getAttribute('data-copy'));
        var targetUrl = C.primaryUrl(b);
        C.copyText(targetUrl).then(function (ok) {
          C.toast(ok ? '🔗 已複製網址：' + targetUrl : '複製失敗，請手動複製：' + targetUrl, ok ? 'ok' : 'bad');
        });
        return;
      }
      if (t.hasAttribute('data-share')) {
        var sb = C.building(t.getAttribute('data-share'));
        var url = C.campusHome() + '?b=' + encodeURIComponent(sb.id);
        C.copyText(url).then(function (ok) { C.toast(ok ? '🔗 已複製介紹卡連結：' + url : url, ok ? 'ok' : ''); });
        return;
      }
      if (t.hasAttribute('data-wish')) {
        var wb = C.building(t.getAttribute('data-wish'));
        C.emit('wish', { building: wb });
        return;
      }
      if (t.hasAttribute('data-visit')) {
        if (t.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
        C.recordVisit(t.getAttribute('data-visit'));
      }
    });
    // 手機：往下拖曳把手關閉
    var head = P.el.querySelector('.pn-head');
    var drag = null;
    head.addEventListener('pointerdown', function (e) {
      if (!isMobile() || (e.target.closest && e.target.closest('button'))) return;
      drag = { y: e.clientY, dy: 0 };
      try { head.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ }
      P.el.classList.add('dragging');
    });
    head.addEventListener('pointermove', function (e) {
      if (!drag) return;
      drag.dy = Math.max(0, e.clientY - drag.y);
      P.el.style.transform = 'translateY(' + drag.dy + 'px)';
    });
    function endDrag() {
      if (!drag) return;
      P.el.classList.remove('dragging');
      P.el.style.transform = '';
      if (drag.dy > 90) close();
      drag = null;
    }
    head.addEventListener('pointerup', endDrag);
    head.addEventListener('pointercancel', endDrag);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !e.isComposing && P.id && !document.querySelector('.modal-bd.open')) close();
    });
    C.on('status', function () { if (P.id) refresh(); });
  }

  function syncUrl(id) {
    try {
      var u = new URL(window.location.href);
      if (id) u.searchParams.set('b', id); else u.searchParams.delete('b');
      u.searchParams.delete('go');
      u.searchParams.delete('to');
      window.history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
    } catch (e) { /* file:// 舊瀏覽器 */ }
  }

  function open(id) {
    ensure();
    var b = C.building(id);
    if (!b) return false;
    if (!P.id) P.lastFocus = document.activeElement;
    P.id = b.id;
    P.openedAt = Date.now();
    P.body.innerHTML = render(b);
    P.body.scrollTop = 0;
    P.el.setAttribute('aria-hidden', 'false');
    P.el.classList.add('open');
    document.body.classList.add('panel-open');
    if (P.bd) { P.bd.hidden = false; P.bd.classList.add('open'); }
    var t = document.getElementById('pnTitle');
    if (t) try { t.focus({ preventScroll: true }); } catch (e) { t.focus(); }
    syncUrl(b.id);
    if (C.env.mode === 'cloudtop' && b.local_port) C.refreshStatus();
    return true;
  }
  function refresh() {
    if (!P.id) return;
    var b = C.building(P.id);
    var ct = P.body.querySelector('.pn-ct');
    if (ct) {
      var tmp = document.createElement('div');
      tmp.innerHTML = ctRow(b);
      if (tmp.firstChild) ct.parentNode.replaceChild(tmp.firstChild, ct);
    }
    var pr = P.body.querySelector('[data-primary]');
    if (pr) pr.setAttribute('href', C.primaryUrl(b));
    var links = P.body.querySelectorAll('.pn-links a');
    for (var i = 0; i < links.length && i < b.links.length; i++) links[i].setAttribute('href', C.linkUrl(b, b.links[i].hash));
  }
  function close() {
    if (!P.el || !P.id) return;
    P.id = null;
    P.el.classList.remove('open');
    P.el.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('panel-open');
    if (P.bd) { P.bd.classList.remove('open'); P.bd.hidden = true; }
    syncUrl(null);
    C.emit('panelclose');
    if (P.lastFocus && P.lastFocus.focus && document.contains(P.lastFocus)) {
      try { P.lastFocus.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    }
  }

  C.panel = {
    open: open,
    close: close,
    refresh: refresh,
    current: function () { return P.id; },
    isMobile: isMobile,
    // 桌機：抽屜寬度；手機：面板高度（讓地圖把建築移到看得到的地方）
    coverW: function () { return !isMobile() && P.el ? P.el.offsetWidth : 0; },
    coverH: function () { return isMobile() && P.el ? Math.min(P.el.offsetHeight, window.innerHeight * 0.8) : 0; },
  };
})();

</script>
  <script>/* js/directory.js */
/* 開心學園 · directory.js — 📋 目錄：依學區分組的建築卡片（手機上一鍵切換），支援搜尋篩選 */
(function () {
  'use strict';
  var C = window.CAMPUS;
  var esc = C.util.esc;
  var D = { el: null, rendered: false };

  function chip(b) {

    return '<span class="chip" style="background:' + st.bg + ';color:' + st.fg + ';border-color:' + st.bd + '">' + esc(st.t) + '</span>';
  }
  function ctDot(b) {
    if (C.env.mode !== 'cloudtop' || !b.local_port || !C.isLive(b)) return '';
    var up = C.portUp(b);
    var t = up === true ? '🟢 Cloudtop 運作中' : up === false ? '⚪ Cloudtop 未啟動' : '⏳ 檢查中';
    return '<span class="ct-mini" data-ct="' + esc(b.id) + '">' + t + '</span>';
  }
  function card(b) {
    var live = C.isLive(b);
    var label = b.kind === 'arena' ? '進入實戰館 →' : b.kind === 'department' ? '進入分院 →' : '進入學院 →';
    var feats = b.features.slice(0, 4).map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('');
    var links = live ? b.links.slice(0, 4).map(function (l) {
      return '<a href="' + esc(C.linkUrl(b, l.hash)) + '" data-visit="' + esc(b.id) + '">' + esc(l.label) + '</a>';
    }).join('') : '';
    var rels = b.related && b.related.length ? b.related.slice(0, 3).map(function (r) {
      var rb = C.building(r.id);
      if (!rb) return '';
      if (C.isLive(rb)) {
        var rUrl = r.hash ? C.linkUrl(rb, r.hash) : C.primaryUrl(rb);
        return '<a class="card-rel" href="' + esc(rUrl) + '" data-visit="' + esc(rb.id) + '">' + esc(r.label || rb.name) + ' ↗</a>';
      }
      return '<button type="button" class="card-rel card-rel-btn" data-more="' + esc(rb.id) + '">' + esc(r.label || rb.name) + ' ›</button>';
    }).filter(Boolean).join('') : '';
    return '<article class="card' + (live ? '' : ' planned') + '" data-id="' + esc(b.id) + '" tabindex="0" aria-label="' + esc(b.name + '：' + (b.tagline || '')) + '">' +
      '<div class="card-top"><span class="card-ic" aria-hidden="true">' + esc(b.icon || '🏫') + '</span>' +
      '<div class="card-tt"><h3>' + esc(b.name) + '</h3><div class="card-en">' + esc(b.en || '') + '</div></div>' + chip(b) + '</div>' +
      (b.tagline ? '<p class="card-tag">' + esc(b.tagline) + '</p>' : '') +
      (feats ? '<ul class="card-feat">' + feats + '</ul>' : (b.desc ? '<p class="card-desc">' + esc(b.desc) + '</p>' : '')) +
      (links ? '<div class="card-links">' + links + '</div>' : '') +
      (rels ? '<div class="card-rels"><span class="card-rel-lbl">🔗 連動</span>' + rels + '</div>' : '') +
      '<div class="card-act">' +
      (live ? '<a class="btn primary" href="' + esc(C.primaryUrl(b)) + '" data-visit="' + esc(b.id) + '" data-primary="1">' + esc(label) + '</a>'
        : '<button type="button" class="btn" data-wish="' + esc(b.id) + '">💬 許願</button>') +
      '<button type="button" class="btn ghost" data-more="' + esc(b.id) + '">介紹</button>' + ctDot(b) +
      '</div></article>';
  }
  function lotCard(d) {
    var what = d.id === 'games' ? '學院或運彩館' : d.id === 'finance' ? '分院或實戰館' : d.id === 'tech' ? '程式語言或硬體實作學院' : d.id === 'care' ? '社工、心理諮商或健康照護學院' : '學院';
    return '<button type="button" class="card lotcard" data-wish-district="' + esc(d.id) + '">' +
      '<span class="lot-ic" aria-hidden="true">🚧</span><b>預定地</b><span>未來的新' + what + '會自動進駐這裡</span><em>想要什麼' + what + '？點我許願 →</em></button>';

  function render() {
    D.el = document.getElementById('dirView');
    if (!D.el) return;
    var reg = C.reg;
    var h = '<div class="dir-intro"><div class="dir-intro-row"><h1>📋 學園目錄</h1>' +
      '<button type="button" class="btn sm primary" data-act="feedback">💬 意見回饋／許願</button></div>' +
      '<p>依學區瀏覽全部學院與實戰館；點卡片看完整介紹，或直接「進入」。</p></div>';
    reg.districts.forEach(function (d) {
      var list = reg.buildings.filter(function (b) { return b.district === d.id; });
      h += '<section class="dir-d" data-district="' + esc(d.id) + '" style="--dc:' + esc(d.color || '#64748b') + ';--ds:' + esc(d.soft || '#f1f5f9') + '">' +
        '<header class="dir-dh"><span class="dir-di" aria-hidden="true">' + esc(d.icon || '📍') + '</span>' +
        '<div class="dir-dt"><h2>' + esc(d.name) + ' <small>' + esc(d.en || '') + '</small>' +
        (d.status === 'planned' ? ' <span class="chip" style="background:#ffedd5;color:#9a3412;border-color:#fdba74">🚧 建設中</span>' : '') +
        '</h2><p>' + esc(d.desc || '') + '</p></div>' +
        '<button type="button" class="btn sm" data-focus="' + esc(d.id) + '">🗺️ 在地圖上看</button></header>' +
        '<div class="dir-grid">' + list.map(card).join('') + lotCard(d) + '</div></section>';
    });
    h += '<div class="dir-empty" id="dirEmpty" hidden></div>';
    D.el.innerHTML = h;
    D.rendered = true;
    if (!D.bound) {
      D.bound = true;
      D.el.addEventListener('click', function (e) {
        var t = e.target.closest ? e.target.closest('[data-visit],[data-more],[data-focus],[data-wish],[data-wish-district],.card[data-id]') : null;
        if (!t) return;
        if (t.hasAttribute('data-visit')) { C.recordVisit(t.getAttribute('data-visit')); return; }
        if (t.hasAttribute('data-focus')) { C.emit('district', t.getAttribute('data-focus')); return; }
        if (t.hasAttribute('data-wish')) { C.emit('wish', { building: C.building(t.getAttribute('data-wish')) }); return; }
        if (t.hasAttribute('data-wish-district')) { C.emit('wish', t.getAttribute('data-wish-district')); return; }
        if (t.hasAttribute('data-more')) { C.emit('open', t.getAttribute('data-more')); return; }
        var id = t.getAttribute('data-id');
        if (id) {
          var b = C.building(id);
          if (b && C.isLive(b) && !C.infoMode) {
            C.recordVisit(b.id);
            window.location.href = C.primaryUrl(b);
            return;
          }
          C.emit('open', id);
        }
      });
      D.el.addEventListener('keydown', function (e) {
        if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('card') && e.target.hasAttribute('data-id')) {
          e.preventDefault();
          C.emit('open', e.target.getAttribute('data-id'));
        }
      });
      C.on('status', refreshStatus);
    }
  }
  function refreshStatus() {
    if (!D.el) return;
    var nodes = D.el.querySelectorAll('.ct-mini');
    for (var i = 0; i < nodes.length; i++) {
      var b = C.building(nodes[i].getAttribute('data-ct'));
      var tmp = document.createElement('div');
      tmp.innerHTML = ctDot(b);
      if (tmp.firstChild) nodes[i].parentNode.replaceChild(tmp.firstChild, nodes[i]);
    }
    var prim = D.el.querySelectorAll('.card[data-id] [data-primary]');
    for (var k = 0; k < prim.length; k++) {
      var cb = C.building(prim[k].closest('.card').getAttribute('data-id'));
      prim[k].setAttribute('href', C.primaryUrl(cb));
    }
  }
  function filter(ids, q) {
    if (!D.el) return;
    var on = Array.isArray(ids);
    var cards = D.el.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
      var id = cards[i].getAttribute('data-id');
      cards[i].hidden = on && (!id || ids.indexOf(id) < 0);
    }
    var secs = D.el.querySelectorAll('.dir-d');
    var shown = 0;
    for (var j = 0; j < secs.length; j++) {
      var vis = secs[j].querySelectorAll('.card:not([hidden])').length;
      secs[j].hidden = on && !vis;
      if (!secs[j].hidden) shown++;
    }
    var empty = document.getElementById('dirEmpty');
    if (empty) {
      empty.hidden = !(on && !shown);
      empty.innerHTML = on && !shown ? '🔍 找不到符合「' + esc(q || '') + '」的建築。試試「藥癮個管」「英語」「Python」「K 線」「NBA」…' : '';
    }
  }

  C.dir = { render: render, filter: filter };
})();

  let cachedStatus = null;

  function esc(s) {

      .replace(/"/g, '&quot;');

  function data() {

  function isStaticEnv() {
    return !!(
      window.CAMPUS_STATIC_ONLY ||
      (location.protocol !== 'http:' && location.protocol !== 'https:') ||

    const ver = currentVersion(status);

    const dirty = local && !!status.has_changes;
    const n = dirty ? (status.changed_files || []).length : 0;

    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
