    return src.filter(function (p) {
      var until = p && parseDate(p.until);
      return p && p.id && p.title && !(until && until < today);
    }).map(function (p) {
      var b = p.building ? C.building(p.building) : null, d = p.district ? C.district(p.district) : null;
      return {
        id: 'pin:' + p.id, cat: 'pin', icon: p.icon || '📌', title: String(p.title), text: String(p.text || ''),
        ts: parseDate(p.date), b: b, d: d, url: String(p.url || ''), label: String(p.label || ''),
        act: p.url ? 'url' : b ? 'enter' : d ? 'district' : 'board',
      };
    });
  }

  function hotItems(stats) {
    var items = [];
    var crowd = stats.filter(function (r) { return r.b && r.now >= 2; })
      .sort(function (a, b) { return b.now - a.now || b.heat - a.heat; });
    if (crowd.length) {
      var c0 = crowd[0];
      items.push({
        id: 'hot:now', cat: 'hot', icon: c0.b.icon || '🔥', title: c0.b.name + ' 正熱鬧！',
        text: '現在有 ' + c0.now + ' 位同學在這裡：' + names(c0, 3) + (c0.today > c0.now ? '（今日 ' + c0.today + ' 人次）' : ''),
        b: c0.b, act: 'see',
      });
    }
    var king = stats.filter(function (r) { return r.b && r.today >= 2; })
      .sort(function (a, b) { return b.today - a.today || b.heat - a.heat; })[0];
    if (king && !(crowd.length && crowd[0].id === king.id)) {
      items.push({
        id: 'hot:today', cat: 'hot', icon: '📈', title: '今日人氣王：' + king.b.name,
        text: '今天已經有 ' + king.today + ' 人次造訪' + (king.now ? '，現在還有 ' + names(king, 2) + ' 在這裡' : '') + '。',
        b: king.b, act: 'see',
      });
    }
    if (!items.length) {
      var ppl = snapshot().filter(function (p) { return !p.me && p.online; });
      if (ppl.length) {
        items.push({
          id: 'hot:who', cat: 'hot', icon: '👀', title: ppl.length + ' 位同學正在校園',
          text: ppl.slice(0, 3).map(function (p) { return personLabel(p) + ' 在' + shortName(C.building(p.buildingId).name); }).join('、') + (ppl.length > 3 ? '…' : ''),
          act: 'online',
        });
      }
    }
    return items;
  }

  function openingItems() {
    var list = C.reg.buildings.filter(function (b) { return b.status === 'new' && C.isLive(b); });
    var isNew = {};
    list.forEach(function (b) { isNew[b.id] = true; });
    var items = [];
    list.forEach(function (b) {
      if (b.parent && isNew[b.parent]) return; // 分院併入本部那一則
      var kids = list.filter(function (k) { return k.parent === b.id; });
      var h = openedRelease(b);
      var text = b.tagline || '';
      if (kids.length) {
        text = kids.map(function (k) { return k.name.replace(/學院$/, ''); }).join('・') + ' 分院同步開課' + (text ? '｜' + text : '');
      }
      items.push({
        id: 'open:' + b.id, cat: 'open', icon: b.icon || '🎉',
        title: b.name + (kids.length ? '與' + cnNum(kids.length) + '大分院' : '') + ' 新開幕', text: text,
        ts: h ? parseDate(h.r.date) : 0, meta: h ? 'v' + h.r.version + ' 開幕' : '', b: b, act: 'enter', order: h ? h.i : 999,
      });
    });
    return items.sort(function (a, b) { return a.order - b.order; });
  }

  function updateItems() {
    return releases().slice(0, 2).map(function (r) {
      var hl = Array.isArray(r.highlights) ? r.highlights : [];
      return {
        id: 'rel:' + r.version, cat: 'update', icon: '', title: 'v' + r.version + ' ' + (r.title || '版本更新'),
        text: hl[0] || r.notes || '', ts: parseDate(r.date), meta: hl.length > 1 ? '共 ' + hl.length + ' 項更新' : '', act: 'releases',
      };
    });
  }

  function eventItems() {
    var items = [];
    var dk = L.dayKey || 0;
    var got = (F.ST && F.ST.ach) || {};
    var todo = (F.ACH || []).filter(function (a) { return !a.secret && !got[a.id] && GAME_OF[a.id]; });
    if (todo.length) {
      var a = todo[dk % todo.length], t = F.TIERS ? F.TIERS[a.tier] : null;
      items.push({
        id: 'ev:goal', cat: 'event', icon: '🎯', title: '今日挑戰：' + a.icon + ' ' + a.name,
        text: a.desc + (t ? '，完成就拿' + t.name + '牌 +' + t.pts + ' 點！' : '！'), act: 'game', game: GAME_OF[a.id],
      });
    }
    var lead = rawPresence().filter(function (p) { return (p.score || 0) > 0; })
      .sort(function (x, y) { return y.score - x.score || (x.me - y.me); })[0];
    if (lead) {
      items.push({
        id: 'ev:lead', cat: 'event', icon: '🏆', title: '成就榜首：' + personLabel(lead) + '（' + lead.score + ' 點）',
        text: lead.me ? '你正領先全校，繼續保持！' : '想超越 ' + lead.name + '？玩小遊戲、摸萌寵、砍樹都能拿徽章。', act: 'rank',
      });
    }
    var an = L.animals || [];
    if (an.length) {
      var pet = an[dk % an.length];
      items.push({
        id: 'ev:pet', cat: 'event', icon: '🐾', title: '今日萌寵：' + pet.name,
        text: '今天在「' + pet.where + '」出沒，去摸摸牠收進萌寵圖鑑！', act: 'pet', pet: pet.id,
      });
    }
    if (L.frog && !got.frog) {
      items.push({
        id: 'ev:frog', cat: 'event', icon: '🐸', title: '傳說小綠蛙又換位置了',
        text: '牠每天躲在學園湖不同的睡蓮葉上，和葉子幾乎一樣綠……放大地圖找找看！', act: 'lake',
      });
    }
    return items;
  }

  function soonItems() {
    var by = {};
    C.reg.buildings.forEach(function (b) { if (b.status === 'planned') (by[b.district] = by[b.district] || []).push(b); });
    return C.reg.districts.filter(function (d) { return by[d.id]; }).map(function (d) {
      var list = by[d.id];
      return {
        id: 'soon:' + d.id + ':' + list.map(function (b) { return b.id; }).join(','), cat: 'soon', icon: d.icon || '🚧',
        title: d.name + (d.status === 'planned' ? ' 整區施工中' : ' 新建築施工中'),
        text: list.map(function (b) { return (b.icon ? b.icon + ' ' : '') + b.name; }).join('、') + ' 正在興建，敬請期待！',
        d: d, list: list, act: 'district',
      };
    });
  }

  var ITEMS = [];
  var STATS = [];
  function rebuild() {
    logSnapshot();
    STATS = heatStats();
    ITEMS = [].concat(pinnedItems(), hotItems(STATS), openingItems(), updateItems(), eventItems(), soonItems());
  }
  function unreadIds() {
    return ITEMS.filter(function (it) { return UNREADABLE[it.cat] && !S.seen[it.id]; }).map(function (it) { return it.id; });
  }
  function markAllSeen() {
    var now = Date.now(), keep = {};
    ITEMS.forEach(function (it) { if (UNREADABLE[it.cat]) keep[it.id] = S.seen[it.id] || now; });
    // 已下架的公告也記住最近 200 筆，重新上架不會再亮紅點
    Object.keys(S.seen).sort(function (a, b) { return S.seen[b] - S.seen[a]; }).slice(0, 200)
      .forEach(function (id) { if (!keep[id]) keep[id] = S.seen[id]; });
    S.seen = keep;
    saveStore();
  }
  // 輪播順序：沒看過的置頂 → 人氣、開幕、更新、活動、施工輪流各一則 → 看過的置頂
  function tickerList() {
    var g = {};
    ITEMS.forEach(function (it) { (g[it.cat] = g[it.cat] || []).push(it); });
    var pins = g.pin || [];
    var out = pins.filter(function (it) { return !S.seen[it.id]; });
    var lanes = ['hot', 'open', 'update', 'event', 'soon'].map(function (c) { return (g[c] || []).slice(0, LANE_CAP[c]); });
    lanes.push(pins.filter(function (it) { return S.seen[it.id]; }));
    for (var more = true; more;) {
      more = false;
      for (var i = 0; i < lanes.length; i++) {
        if (lanes[i].length) { out.push(lanes[i].shift()); more = true; }
      }
    }
    return out;
  }

  /* ------------------------------------------------------------ 動作（輪播點標題、公告欄按鈕共用） */
  function showBuilding(id) { C.emit('open', id); }
  function playGame(kind) {
    if (kind === 'car') { if (F.openCarHud) F.openCarHud(); return; }
    if (kind === 'dir') { var tb = document.getElementById('tabDir'); if (tb) tb.click(); return; }
    if (F.openFunModal) F.openFunModal(kind || 'hub');
  }
  function findPet(pid) {
    var a = (L.animals || []).filter(function (x) { return x.id === pid; })[0];
    if (!a || !C.map.flyToPoint) return;
    C.map.flyToPoint(a.x, a.y, 640, 520);
    setTimeout(function () { if (F.bubble) F.bubble(a.x, a.y - 6, a.name + '：我在這裡～', '#be185d'); }, 560);
  }
  function findFrog() {
    if (C.map.flyToPoint) C.map.flyToPoint(1004, 236, 560, 560);
    C.toast('🐸 小綠蛙就躲在某片睡蓮葉上，放大仔細看看吧！');
  }
  function primary(it) {
    var a = it.act;
    if ((a === 'enter' || a === 'see') && it.b) showBuilding(it.b.id);
    else if (a === 'district' && it.d) C.emit('district', it.d.id);
    else if (a === 'releases') { if (C.openReleaseModal) C.openReleaseModal(); }
    else if (a === 'game') playGame(it.game);
    else if (a === 'rank' || a === 'online') { if (F.openOnline) F.openOnline(a); }
    else if (a === 'pet') findPet(it.pet);
    else if (a === 'lake') findFrog();
    else if (a === 'url' && it.url) window.open(it.url, '_blank', 'noopener');
    else openBoard({ focus: it.id });
  }

  /* ------------------------------------------------------------ 📢 地圖上方輪播 */
  var T = { el: null, mini: null, item: null, pos: null, badge: null, list: [], i: 0, curId: '', hover: false, kbd: false, swipeAt: 0 };
  function headline(it) {
    var c = CATS[it.cat];
    return '<span class="nb-cat ncat-' + it.cat + '"><span aria-hidden="true">' + c.icon + '</span><span class="nb-cat-t">' + c.label + '</span></span>' +
      '<span class="nb-txt"><b>' + esc((it.icon ? it.icon + ' ' : '') + it.title) + '</b>' +
      (it.text ? '<span class="nb-sub">　' + esc(it.text) + '</span>' : '') + '</span>';
  }
  function paintTicker(anim) {
    if (!T.el) return;
    var n = T.list.length;
    if (!n) {
      T.item.innerHTML = '<span class="nb-txt"><span class="nb-sub">目前沒有新公告</span></span>';
      T.item._html = '';
      T.pos.textContent = '';
      return;
    }
    T.i = ((T.i % n) + n) % n;
    var it = T.list[T.i];
    T.curId = it.id;
    var html = headline(it);
    if (anim || T.item._html !== html) {
      T.item.innerHTML = html;
      T.item._html = html;
      T.item.title = it.title + (it.text ? '：' + it.text : '');
      T.item.setAttribute('aria-label', CATS[it.cat].label + '：' + it.title + (it.text ? '。' + it.text : ''));
    }
    if (anim) {
      T.item.classList.remove('nb-swap');
      void T.item.offsetWidth;
      T.item.classList.add('nb-swap');
    }
    T.pos.textContent = (T.i + 1) + ' / ' + n;
  }
  function step(dir) { T.i += dir; paintTicker(true); }
  function jumpTo(id) {
    for (var i = 0; i < T.list.length; i++) {
      if (T.list[i].id === id) { T.i = i; paintTicker(true); return true; }
    }
    return false;
  }
  function canRotate() {
    var bc = document.body.classList;
    return !!T.el && !T.el.hidden && T.list.length > 1 && !T.hover && !T.kbd && !document.hidden &&
      !bc.contains('view-dir') && !bc.contains('modal-open');
  }
  function paintBadge() {
    var n = unreadIds().length;
    if (T.badge) { T.badge.hidden = !n; T.badge.textContent = n > 9 ? '9+' : String(n); }
    var dot = T.mini && T.mini.querySelector('.nb-dot');
    if (dot) dot.hidden = !n;
  }
  function syncTicker() {
    T.list = tickerList();
    for (var i = 0; i < T.list.length; i++) if (T.list[i].id === T.curId) { T.i = i; break; }
    paintTicker(false);
    paintBadge();
  }
  function applyMin() {
    T.el.hidden = !!S.min;
    T.mini.hidden = !S.min;
    document.body.classList.toggle('news-on', !S.min);
  }
  function setMin(min) {
    S.min = !!min;
    S.minIds = S.min ? unreadIds() : [];
    saveStore();
    applyMin();
  }
  function newSinceMin() {
    return unreadIds().filter(function (id) { return S.minIds.indexOf(id) < 0; });
  }
  function buildTicker(wrap) {
    var el = document.createElement('div');
    el.className = 'news-bar';
    el.id = 'newsBar';
    el.setAttribute('role', 'region');
    el.setAttribute('aria-label', '校園公告');
    el.innerHTML = '<button type="button" class="nb-tag" data-nb="board" title="打開校園公告欄，看全部公告"><span class="nb-mega" aria-hidden="true">📢</span><span class="nb-tag-t">校園公告</span></button>' +
      '<button type="button" class="nb-item" data-nb="item"></button>' +
      '<span class="nb-pos" aria-hidden="true"></span>' +
      '<button type="button" class="nb-all" data-nb="board" title="打開校園公告欄">全部<span class="nb-badge" hidden></span></button>' +
      '<button type="button" class="nb-x" data-nb="min" aria-label="收起校園公告" title="收起（有新公告會自動打開）">✕</button>';
    var mini = document.createElement('button');
    mini.type = 'button';
    mini.className = 'nb-mini';
    mini.id = 'newsMini';
    mini.hidden = true;
    mini.title = '打開校園公告';
    mini.setAttribute('aria-label', '打開校園公告');
    mini.innerHTML = '📢<i class="nb-dot" hidden></i>';
    var chips = document.getElementById('mapChips');
    wrap.insertBefore(el, chips && chips.parentNode === wrap ? chips.nextSibling : wrap.firstChild);
    wrap.insertBefore(mini, el.nextSibling);
    T.el = el;
    T.mini = mini;
    T.item = el.querySelector('.nb-item');
    T.pos = el.querySelector('.nb-pos');
    T.badge = el.querySelector('.nb-badge');

    el.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-nb]') : null;
      if (!t) return;
      var k = t.getAttribute('data-nb');
      if (k === 'board') openBoard();
      else if (k === 'min') {
        setMin(true);
        C.toast('📢 校園公告已收起：點左上角 📢 隨時打開，有新公告會自動出現');
      } else if (k === 'item' && Date.now() - T.swipeAt > 350 && T.list[T.i]) primary(T.list[T.i]);
    });
    mini.addEventListener('click', function () { setMin(false); paintTicker(true); });
    el.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') T.hover = true; });
    el.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') T.hover = false; });
    el.addEventListener('focusin', function (e) { T.kbd = !!(e.target.matches && e.target.matches(':focus-visible')); });
    el.addEventListener('focusout', function () { T.kbd = false; });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); step(1); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
    });
    // 手機：左右滑動換一則
    var sx = null;
    T.item.addEventListener('pointerdown', function (e) { sx = { x: e.clientX, y: e.clientY }; });
    T.item.addEventListener('pointercancel', function () { sx = null; });
    T.item.addEventListener('pointerup', function (e) {
      if (!sx) return;
      var dx = e.clientX - sx.x, dy = e.clientY - sx.y;
      sx = null;
      if (Math.abs(dx) > 36 && Math.abs(dx) > Math.abs(dy)) { T.swipeAt = Date.now(); step(dx < 0 ? 1 : -1); }
    });
  }

  /* ------------------------------------------------------------ 📌 校園公告欄 */
  var B = { el: null, tab: 'all', openedAt: 0, unread: [], prevFocus: null, hotHtml: '', statsHtml: '' };
  var ROT = [-0.9, 0.7, -0.5, 0.9, -0.7, 0.5, -0.3];
  function btn(act, label, extra, primaryBtn) {
    return '<button type="button" class="btn sm' + (primaryBtn ? ' primary' : '') + '" data-nw-act="' + act + '"' + (extra || '') + '>' + esc(label) + '</button>';
  }
  function bid(b) { return ' data-bid="' + esc(b.id) + '"'; }
  function actsHtml(it) {
    var a = [], b = it.b;
    if (it.act === 'enter' && b) {
      if (C.isLive(b)) a.push('<a class="btn sm primary" href="' + esc(C.primaryUrl(b)) + '" data-nw-enter="' + esc(b.id) + '">' + (b.kind === 'arena' ? '進入實戰館 →' : '進入學院 →') + '</a>');
      a.push(btn('see', '📍 地圖上看', bid(b)));
    } else if (it.act === 'see' && b) {
      a.push(btn('see', '📍 地圖上看', bid(b), !C.isLive(b)));
      if (C.isLive(b)) a.push(btn('drive', '🚗 開車過去', bid(b), true));
    } else if (it.act === 'district' && it.d) {
      a.push(btn('district', '📍 看' + String(it.d.name || '').replace(/學區$/, '') + '學區', ' data-did="' + esc(it.d.id) + '"'));
      if (it.cat === 'soon') a.push(btn('wish', '🙋 許願先開', ' data-did="' + esc(it.d.id) + '"' + (it.list && it.list.length === 1 ? bid(it.list[0]) : '')));
    } else if (it.act === 'releases') a.push(btn('releases', '📜 看更新內容'));
    else if (it.act === 'game') a.push(btn('game', '🎮 去挑戰', ' data-game="' + esc(it.game) + '"', true));
    else if (it.act === 'rank') a.push(btn('rank', '🏆 看排行榜'));
    else if (it.act === 'online') a.push(btn('online', '🟢 看在線名單'));
    else if (it.act === 'pet') a.push(btn('pet', '📍 去找牠', ' data-pet="' + esc(it.pet) + '"', true));
    else if (it.act === 'lake') a.push(btn('lake', '🔎 去湖邊找找'));
    else if (it.act === 'url' && it.url) a.push('<a class="btn sm primary" href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.label || '前往 →') + '</a>');
    if (it.cat === 'pin' && it.d && it.act !== 'district') a.push(btn('district', '📍 看學區', ' data-did="' + esc(it.d.id) + '"'));
    return a.length ? '<div class="nw-acts">' + a.join('') + '</div>' : '';

  function noteHtml(it, i) {
    var c = CATS[it.cat];

    if (it.meta) meta.push(it.meta);
    return '<article class="nw-note ncat-' + it.cat + (B.unread.indexOf(it.id) >= 0 ? ' unread' : '') + '" data-note="' + esc(it.id) + '" style="--rot:' + ROT[i % ROT.length] + 'deg">' +
      '<span class="nw-tape">' + c.icon + ' ' + c.label + '</span>' +
      '<h3><span aria-hidden="true">' + esc(it.icon || c.icon) + '</span><span>' + esc(it.title) + '</span></h3>' +
      (it.text ? '<p>' + esc(it.text) + '</p>' : '') +

  }
  function statsHtml() {
    var live = C.reg.buildings.filter(C.isLive).length;
    var fresh = C.reg.buildings.filter(function (b) { return b.status === 'new' && C.isLive(b); }).length;
    var planned = C.reg.buildings.filter(function (b) { return b.status === 'planned'; }).length;
    var online = rawPresence().filter(function (p) { return p.online; }).length;
    return '<div class="nw-stats"><span class="nw-stat">🏫 營運中 <b>' + live + '</b> 間</span>' +
      '<span class="nw-stat ncat-open">🎉 新開幕 <b>' + fresh + '</b> 間</span>' +
      '<span class="nw-stat ncat-hot">🟢 在線 <b>' + online + '</b> 人</span>' +
      '<span class="nw-stat ncat-soon">🚧 施工中 <b>' + planned + '</b> 棟</span></div>';
  }
  function hotHtml() {
    var rows = STATS.filter(function (r) { return r.b && r.heat > 0; }).slice(0, 5);
    var h = '<section class="nw-hot" aria-label="即時人氣榜"><div class="nw-hot-h"><b>🔥 即時人氣榜</b><small>依現在在線、停靠的同學與今日人次排名' + (simOn() ? '（含 🤖 模擬同學）' : '') + '</small></div>';
    if (!rows.length) {
      return h + '<div class="nw-empty"><span>目前校園很安靜，開著你的座駕去學院報到，成為今天第一位吧！</span>' + btn('car', '🚗 校園專車導航') + '</div></section>';
    }
    var max = rows[0].heat || 1;
    return h + '<div class="nw-rank">' + rows.map(function (r, i) {
      var ppl = people(r);
      var parts = [];
      if (r.online.length) parts.push('🟢 ' + r.online.length + ' 在線');
      if (r.parked.length) parts.push('🅿️ ' + r.parked.length + ' 停靠');
      if (r.today) parts.push('👣 今日 ' + r.today + ' 人次');
      var avs = ppl.slice(0, 4).map(function (p) {
        return '<span title="' + esc((p.me ? '你' : p.name) + (p.online ? '（在線）' : '（停靠）')) + '">' + esc(p.avatar || '🧑‍🎓') + '</span>';
      }).join('') + (ppl.length > 4 ? '<small>+' + (ppl.length - 4) + '</small>' : '');
      return '<div class="nw-rrow"><span class="nw-rk">' + (['🥇', '🥈', '🥉'][i] || '<span class="nw-rk-n">' + (i + 1) + '</span>') + '</span>' +
        '<button type="button" class="nw-rname" data-nw-act="see"' + bid(r.b) + '><span aria-hidden="true">' + esc(r.b.icon || '🏫') + '</span><span>' + esc(r.b.name) + '</span></button>' +
        '<span class="nw-bar"><i style="width:' + Math.max(10, Math.round(r.heat / max * 100)) + '%"></i><em>' + esc(parts.join(' · ')) + '</em></span>' +
        '<span class="nw-ravs">' + avs + '</span>' +
        (C.isLive(r.b) ? btn('drive', '🚗 開過去', bid(r.b)) : btn('see', '📍 看看', bid(r.b))) + '</div>';
    }).join('') + '</div></section>';
  }
  function renderBoard() {
    var body = B.el.querySelector('.modal-body');
    var counts = {};
    ITEMS.forEach(function (it) { counts[it.cat] = (counts[it.cat] || 0) + 1; });
    if (B.tab !== 'all' && !counts[B.tab]) B.tab = 'all';
    B.statsHtml = statsHtml();
    B.hotHtml = hotHtml();
    var list = ITEMS.filter(function (it) { return B.tab === 'all' || it.cat === B.tab; });
    body.innerHTML = '<div class="nw-head"><div><h2>📌 校園公告欄</h2><p class="nw-sub">新學院開幕、哪間學院最熱鬧、施工進度與每日活動，全部自動更新。</p></div>' + B.statsHtml + '</div>' +
      B.hotHtml +
      '<div class="seg-tabs nw-tabs" role="tablist" aria-label="公告分類">' + ['all'].concat(CAT_IDS).filter(function (c) { return c === 'all' || counts[c]; }).map(function (c) {
        var on = B.tab === c;
        return '<button type="button" role="tab" class="seg-tab' + (on ? ' on' : '') + '" aria-selected="' + on + '" data-nw-tab="' + c + '">' +
          (c === 'all' ? '全部' : CATS[c].icon + ' ' + CATS[c].label) + ' <small>' + (c === 'all' ? ITEMS.length : counts[c]) + '</small></button>';
      }).join('') + '</div>' +
      '<div class="nw-board">' + (list.length ? '<div class="nw-grid">' + list.map(noteHtml).join('') + '</div>' : '<div class="nw-none">這個分類目前沒有公告</div>') + '</div>';
  }
  // 公告欄開著時只更新「人氣榜＋統計」，便利貼不跟著跳動
  function liveBoard() {
    var swap = function (sel, html) {
      var cur = B.el.querySelector(sel);
      if (!cur) return;
      var tmp = document.createElement('div');
      tmp.innerHTML = html;
      if (tmp.firstChild) cur.parentNode.replaceChild(tmp.firstChild, cur);
    };
    var hh = hotHtml(), sh = statsHtml();
    if (hh !== B.hotHtml) { B.hotHtml = hh; swap('.nw-hot', hh); }
    if (sh !== B.statsHtml) { B.statsHtml = sh; swap('.nw-stats', sh); }
  }
  function ensureBoard() {
    if (B.el) return B.el;
    var bd = document.createElement('div');
    bd.className = 'modal-bd';
    bd.id = 'newsModal';
    bd.hidden = true;
    bd.innerHTML = '<div class="modal news-modal" role="dialog" aria-modal="true" aria-label="校園公告欄"><button type="button" class="modal-x" aria-label="關閉">✕</button><div class="modal-body"></div></div>';
    document.body.appendChild(bd);
    bd.addEventListener('click', onBoardClick);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !e.isComposing && !bd.hidden) closeBoard(); });
    B.el = bd;
    return bd;
  }
  function openBoard(opts) {
    opts = opts || {};
    var bd = ensureBoard();
    rebuild();
    B.unread = unreadIds();
    if (opts.tab) B.tab = opts.tab;
    renderBoard();
    B.prevFocus = document.activeElement;
    bd.hidden = false;
    bd.classList.add('open');
    document.body.classList.add('modal-open');
    B.openedAt = Date.now();
    markAllSeen();
    paintBadge();
    var mod = bd.querySelector('.modal');
    if (mod) mod.scrollTop = 0;
    var h2 = bd.querySelector('h2');
    if (h2) { h2.setAttribute('tabindex', '-1'); try { h2.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
    if (opts.focus) {
      var n = bd.querySelector('[data-note="' + attrSel(opts.focus) + '"]');
      if (n) { n.scrollIntoView({ block: 'center' }); n.classList.add('flash'); }
    }
  }
  function closeBoard() {
    if (!B.el || B.el.hidden) return;
    B.el.classList.remove('open');
    B.el.hidden = true;
    if (!document.querySelector('.modal-bd.open')) document.body.classList.remove('modal-open');
    if (B.prevFocus && B.prevFocus.focus && document.contains(B.prevFocus)) {
      try { B.prevFocus.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    }
  }
  function onBoardClick(e) {
    var t = e.target;
    if (t === B.el || (t.closest && t.closest('.modal-x'))) {
      if (Date.now() - B.openedAt > 420) closeBoard();
      return;
    }
    var tab = t.closest ? t.closest('[data-nw-tab]') : null;
    if (tab) { B.tab = tab.getAttribute('data-nw-tab'); renderBoard(); return; }
    var go = t.closest ? t.closest('[data-nw-enter]') : null;
    if (go) { C.recordVisit(go.getAttribute('data-nw-enter')); return; }
    var a = t.closest ? t.closest('[data-nw-act]') : null;
    if (!a) return;
    var act = a.getAttribute('data-nw-act');
    var b = C.building(a.getAttribute('data-bid') || '');
    var did = a.getAttribute('data-did') || '';
    closeBoard();
    if (act === 'see' && b) showBuilding(b.id);
    else if (act === 'drive' && b) {
      if (C.driveCarToBuilding) { C.map.focusBuilding(b.id, { ifNeeded: true }); C.driveCarToBuilding(b.id); }
      else showBuilding(b.id);
    } else if (act === 'district' && did) C.emit('district', did);
    else if (act === 'wish') C.emit('wish', b ? { building: b } : did);
    else if (act === 'releases') { if (C.openReleaseModal) C.openReleaseModal(); }
    else if (act === 'game') playGame(a.getAttribute('data-game'));
    else if (act === 'rank' || act === 'online') { if (F.openOnline) F.openOnline(act); }
    else if (act === 'pet') findPet(a.getAttribute('data-pet'));
    else if (act === 'lake') findFrog();
    else if (act === 'car') { if (F.openCarHud) F.openCarHud(); }
  }

  /* ------------------------------------------------------------ 🔥 地圖人氣標記（2 人以上的建築，最多 4 個） */
  var HM = { layer: null, sig: '' };
  function heatLayer() {
    var svg = document.getElementById('campusMap');
    if (!svg || !svg.querySelector('.m-blds')) return null;
    if (HM.layer && svg.contains(HM.layer)) return HM.layer;
    var g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'm-news');
    g.setAttribute('id', 'mapNews');
    svg.insertBefore(g, svg.querySelector('#mapSky'));
    g.addEventListener('click', function (e) {
      var mk = e.target.closest ? e.target.closest('.heat-mk') : null;
      if (mk) heatTap(mk.getAttribute('data-heat'));
    });
    HM.layer = g;
    HM.sig = '';
    return g;
  }
  function heatMarks() {
    var placed = C.map && C.map.placed ? C.map.placed() : {};
    var by = {};
    STATS.forEach(function (r) {
      if (!r.b || !r.now) return;
      var key = r.b.inside && r.b.parent ? r.b.parent : r.id;
      if (!placed[key]) return;
      var m = by[key] || (by[key] = { key: key, now: 0, rows: [], slot: placed[key].slot });
      m.now += r.now;
      m.rows.push(r);
    });
    return Object.keys(by).map(function (k) { return by[k]; })
      .filter(function (m) { return m.now >= 2; })
      .sort(function (a, b) { return b.now - a.now; })
      .slice(0, 4);
  }
  function renderHeat() {
    var layer = heatLayer();
    if (!layer) return;
    var marks = heatMarks();
    var sig = marks.map(function (m) { return m.key + ':' + m.now; }).join('|');
    if (sig === HM.sig) return;
    HM.sig = sig;
    layer.innerHTML = marks.map(function (m) {
      var sl = m.slot, lvl = m.now >= 4 ? 3 : m.now >= 3 ? 2 : 1;
      var label = (lvl === 3 ? '🔥 爆滿 ' : lvl === 2 ? '🔥 熱門 ' : '🔥 ') + m.now + ' 人';
      var w = Math.round(textW(label, 12.5) + 24), hw = w / 2;
      return '<g class="heat-mk lvl-' + lvl + '" data-heat="' + esc(m.key) + '" transform="translate(' + Math.round(sl.x) + ',' + Math.round(sl.y - sl.h - 6) + ')">' +
        '<rect class="hit" x="' + (-hw - 4) + '" y="-30" width="' + (w + 8) + '" height="36" fill="transparent"/>' +
        '<g class="heat-in" pointer-events="none">' +
        '<path class="heat-bg" d="M' + (-hw + 11) + ',-27H' + (hw - 11) + 'A11,11 0 0 1 ' + (hw - 11) + ',-5H6L0,2L-6,-5H' + (-hw + 11) + 'A11,11 0 0 1 ' + (-hw + 11) + ',-27Z" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>' +
        '<text x="0" y="-11.5" text-anchor="middle" font-size="12.5" font-weight="900" fill="#c2410c">' + esc(label) + '</text></g></g>';
    }).join('');
  }
  function heatTap(key) {
    var m = heatMarks().filter(function (x) { return x.key === key; })[0];
    var b = C.building(key);
    if (!m || !b) return;
    var who = [];
    m.rows.forEach(function (r) { who = who.concat(people(r)); });
    var txt = '🔥 ' + who.slice(0, 3).map(function (p) { return p.me ? '你' : p.name; }).join('、') + (who.length > 3 ? ' 等 ' + who.length + ' 人' : '') + ' 在這裡';
    if (F.bubble) F.bubble(m.slot.x, m.slot.y - m.slot.h - 32, txt, '#c2410c');
    C.toast('🔥 ' + b.name + ' 現在有 ' + m.now + ' 位同學' + (C.isLive(b) ? '，點建築就能加入他們！' : '在這裡逛逛'));
  }

  /* ------------------------------------------------------------ 介紹卡：🔥 人氣列（插在按鈕上方） */
  function panelHeat() {
    var body = document.querySelector('#panel .pn-body');
    if (!body || !C.panel || !C.panel.current) return;
    var b = C.building(C.panel.current());
    var old = body.querySelector('.pn-heat');
    var r = b ? STATS.filter(function (x) { return x.id === b.id; })[0] : null;
    var html = '', cls = 'pn-heat';
    if (b && r && (r.now || r.today)) {
      var ppl = people(r), others = ppl.filter(function (p) { return !p.me; }), meHere = others.length < ppl.length;
      var parts = [];
      if (others.length) {
        parts.push('現在 <b>' + others.length + '</b> 位同學在這裡：' + esc(others.slice(0, 4).map(personLabel).join('、') + (others.length > 4 ? ' 等' : '')) + (meHere ? '（你也在）' : ''));
      } else if (meHere) parts.push('你的座駕停在這裡');
      if (r.today) parts.push('今日 <b>' + r.today + '</b> 人次');
      html = '<span aria-hidden="true">' + (others.length >= 2 ? '🔥' : others.length ? '👥' : '👣') + '</span><span>' + parts.join('　·　') + '</span>';
    } else if (b && C.isLive(b)) {
      cls += ' cold';
      html = '<span aria-hidden="true">🌱</span><span>今天還沒有同學來過，成為第一位吧！</span>';
    }
    if (!html) { if (old) old.parentNode.removeChild(old); return; }
    if (old && old._html === html && old.className === cls) return;
    var el = old || document.createElement('div');
    el.className = cls;
    el.innerHTML = html;
    el._html = html;
    if (!old) {
      // 放在標題區下面（標語之前），一打開介紹卡就看得到
      var ref = body.querySelector('.pn-tag') || body.querySelector('.pn-desc') || body.querySelector('.pn-actions');
      if (ref && ref.parentNode) ref.parentNode.insertBefore(el, ref);
      else body.appendChild(el);
    }
  }
  function observePanel() {
    var body = document.querySelector('#panel .pn-body');
    if (!body || !window.MutationObserver) return;
    var t = 0;
    new MutationObserver(function () { clearTimeout(t); t = setTimeout(panelHeat, 30); }).observe(body, { childList: true });
  }

  /* ------------------------------------------------------------ 更新流程 */
  var refreshTimer = 0;
  function dirty(ms) { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, ms == null ? 450 : ms); }
  function refresh() {
    rebuild();
    if (T.el) {
      syncTicker();
      if (S.min) {
        var fresh = newSinceMin();
        if (fresh.length) { S.min = false; S.minIds = []; saveStore(); applyMin(); jumpTo(fresh[0]); }
      }
    }
    renderHeat();
    panelHeat();
    if (B.el && !B.el.hidden) liveBoard();
  }

  C.on('presence', function () { dirty(); });
  C.on('presence-msg', function (u) {
    if (!u || typeof u !== 'object') return;
    var ts = +u.ts || 0;
    if (ts && ts < 2e10) ts *= 1000;
    if (logVisit(String(u.uid || ''), String(u.buildingId || ''), ts || Date.now())) dirty(900);
  });
  C.on('visit', function (id) { logVisit(myUid(), id, Date.now()); dirty(); });
  window.addEventListener('storage', function (e) {
    if (e.key === STORE_KEY) { S = loadStore(); if (T.el) { applyMin(); paintBadge(); } }
    else if (e.key === VISITS_KEY) { seedMyVisits(); dirty(); }
  });

  function init() {
    var wrap = document.getElementById('mapWrap');
    if (!wrap || C.registryError || T.el) return;
    seedMyVisits();
    rebuild();
    buildTicker(wrap);
    T.list = tickerList();
    var first = S.min ? newSinceMin()[0] : unreadIds()[0];
    if (S.min && first) { S.min = false; S.minIds = []; saveStore(); }
    applyMin();
    if (!(first && jumpTo(first))) paintTicker(true);
    paintBadge();
    setInterval(function () { if (canRotate()) step(1); }, ROTATE_MS);
    renderHeat();
    observePanel();
    document.body.classList.add('has-news');
  }

  C.news = {
    open: function (opts) { openBoard(opts); },
    refresh: function () { dirty(0); },
    items: function () { return ITEMS.slice(); },
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(init, 60); });
  else setTimeout(init, 60);
})();

</script>
</body>
</html>
