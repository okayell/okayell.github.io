  /* ============================================================
   * GAME 1: 🎣 學園湖釣魚樂 (Lake Fishing Mini-Game)
   * ============================================================ */
  function renderFishingGame(container) {
    var caughtKinds = Object.keys(ST.fishCaught).length;
    container.innerHTML = funNavHtml('fishing') +
      '<div class="fg-head">' +
      '<div><h2>🎣 學園湖垂釣樂</h2><p class="fg-sub">點擊湖面任意位置拋竿，等浮標大力下沉顯示「❗上鉤了」時立刻點「⚡收線拉竿」！</p></div>' +
      '<div class="fg-stats"><span class="fg-badge">🏆 累積漁獲：<b id="fishTotalCnt">' + ST.fishTotal + '</b> 尾</span>' +
      '<span class="fg-badge">📖 圖鑑：<b id="fishDexCnt">' + caughtKinds + ' / ' + FISH_SPECIES.length + '</b></span></div>' +
      '</div>' +
      '<div class="pond-stage" id="pondStage">' +
      '<canvas id="pondCanvas" width="620" height="270"></canvas>' +
      '<div class="pond-hud">' +
      '<span class="pond-status" id="pondStatus">👆 點擊湖面拋竿，或按右側按鈕開始垂釣</span>' +
      '<button type="button" class="btn primary sm" id="pondActionBtn">🎯 拋竿下水</button>' +
      '</div>' +
      '<div class="catch-banner" id="catchBanner" hidden></div>' +
      '</div>' +
      '<div class="fg-dex-title">📖 學園湖魚類圖鑑（點擊湖面收集全部 7 種！）</div>' +
      '<div class="fg-dex" id="fishDexGrid"></div>';

    function renderDex() {
      var grid = document.getElementById('fishDexGrid');
      if (!grid) return;
      grid.innerHTML = FISH_SPECIES.map(function (sp) {
        var cnt = ST.fishCaught[sp.id] || 0;
        return '<div class="dex-card' + (cnt ? ' unlocked' : ' locked') + '">' +
          '<div class="dex-ic">' + (cnt ? sp.icon : '❔') + '</div>' +
          '<div class="dex-info"><b>' + esc(cnt ? sp.name : '？？？未知魚種') + '</b>' +
          '<small>' + esc(sp.stars + ' · +' + sp.pts + '分' + (cnt ? ' · 已釣 ' + cnt + ' 次' : '')) + '</small>' +
          '<p>' + esc(cnt ? sp.desc : '在學園湖拋竿垂釣即可解鎖此圖鑑') + '</p></div></div>';
      }).join('');
      var tc = document.getElementById('fishTotalCnt'), dc = document.getElementById('fishDexCnt');
      if (tc) tc.textContent = ST.fishTotal;
      if (dc) dc.textContent = Object.keys(ST.fishCaught).length + ' / ' + FISH_SPECIES.length;
    }
    renderDex();

    var cvs = document.getElementById('pondCanvas');
    var ctx = cvs.getContext('2d');
    var statusEl = document.getElementById('pondStatus');
    var actBtn = document.getElementById('pondActionBtn');
    var banner = document.getElementById('catchBanner');

    var fishes = [];
    for (var i = 0; i < 8; i++) {
      var sp = FISH_SPECIES[i % FISH_SPECIES.length];
      fishes.push({
        sp: sp,
        x: 60 + Math.random() * 500,
        y: 55 + Math.random() * 185,
        vx: (Math.random() < 0.5 ? -1 : 1) * (28 + Math.random() * 32),
        vy: (Math.random() - 0.5) * 14,
        size: sp.id === 'dragon_koi' ? 18 : (sp.id === 'koi_rw' ? 14 : 11),
        wobble: Math.random() * 6.28,
      });
    }
    var state = 'idle'; // 'idle' | 'cast' | 'nibble' | 'bite' | 'reel'
    var bobber = { x: 310, y: 145, r: 0, sink: 0 };
    var targetFish = null;
    var timer = 0;
    var reelPos = 0.5, reelDir = 1, reelProg = 0;
    var ripples = [];

    function castAt(x, y) {
      banner.hidden = true;
      bobber.x = clamp(x, 70, 550);
      bobber.y = clamp(y, 65, 225);
      bobber.sink = 0;
      ripples.push({ x: bobber.x, y: bobber.y, r: 4, a: 1 });
      state = 'cast';
      timer = 1.1 + Math.random() * 1.2;
      // 挑選一隻幸運魚游過來
      var roll = Math.random();
      var chosenSp = roll < 0.12 ? FISH_SPECIES[6] : (roll < 0.25 ? FISH_SPECIES[4] : (roll < 0.42 ? FISH_SPECIES[3] : (roll < 0.62 ? FISH_SPECIES[1] : FISH_SPECIES[Math.floor(Math.random() * 3)])));
      targetFish = fishes[0];
      targetFish.sp = chosenSp;
      targetFish.size = chosenSp.id === 'dragon_koi' ? 19 : 13;
      statusEl.textContent = '🌊 浮標已拋出！魚兒正在靠近中…';
      actBtn.textContent = '⏳ 等待咬餌…';
    }

    function triggerPull() {
      if (state === 'idle') {
        castAt(160 + Math.random() * 300, 85 + Math.random() * 120);
        return;
      }
      if (state === 'cast' || state === 'nibble') {
        state = 'idle';
        statusEl.textContent = '😅 太早拉竿把魚嚇跑了！再點一次湖面拋竿吧';
        actBtn.textContent = '🎯 重新拋竿';
        return;
      }
      if (state === 'bite') {
        // 進入拉竿判定或直接釣起
        var sp = targetFish ? targetFish.sp : FISH_SPECIES[0];
        var cm = Math.round(sp.cm[0] + Math.random() * (sp.cm[1] - sp.cm[0]));
        ST.fishCaught[sp.id] = (ST.fishCaught[sp.id] || 0) + 1;
        ST.fishTotal += 1;
        saveState();
        renderDex();
        state = 'idle';
        ripples.push({ x: bobber.x, y: bobber.y, r: 6, a: 1 });
        statusEl.textContent = '🎉 恭喜釣獲「' + sp.name + '」（' + cm + ' cm · +' + sp.pts + ' 分）！';
        actBtn.textContent = '🎯 再拋一竿';
        banner.hidden = false;
        banner.innerHTML = '<div class="cb-card"><span class="cb-ic">' + sp.icon + '</span>' +
          '<div><b>釣到了！' + esc(sp.name) + ' <span class="cb-cm">' + cm + ' cm</span></b>' +
          '<p>' + esc(sp.desc) + '（+' + sp.pts + ' 分）</p></div></div>';
        if (targetFish) {
          targetFish.x = Math.random() < 0.5 ? 40 : 580;
          targetFish.y = 60 + Math.random() * 170;
        }
      }
    }

    cvs.addEventListener('pointerdown', function (e) {
      var r = cvs.getBoundingClientRect();
      var x = (e.clientX - r.left) * (cvs.width / r.width);
      var y = (e.clientY - r.top) * (cvs.height / r.height);
      if (state === 'bite') triggerPull();
      else castAt(x, y);
    });
    actBtn.addEventListener('click', function () {
      if (state === 'bite') triggerPull();
      else castAt(160 + Math.random() * 300, 85 + Math.random() * 120);
    });

    var raf = 0, last = performance.now();
    function loop(now) {
      var dt = Math.min(0.08, (now - last) / 1000);
      last = now;
      // 背景湖水
      var grad = ctx.createLinearGradient(0, 0, 0, cvs.height);
      grad.addColorStop(0, '#7dd3fc');
      grad.addColorStop(1, '#0284c7');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, cvs.width, cvs.height);

      // 岸邊木棧道（下方中央）
      ctx.fillStyle = '#d9a066';
      ctx.strokeStyle = '#6b4a32';
      ctx.lineWidth = 2;
      ctx.fillRect(285, 232, 50, 38);
      ctx.strokeRect(285, 232, 50, 38);

      // 睡蓮
      [[90, 70, 18], [122, 92, 13], [520, 68, 19], [490, 205, 16]].forEach(function (p) {
        ctx.fillStyle = '#86bf78';
        ctx.beginPath();
        ctx.arc(p[0], p[1], p[2], 0.2, Math.PI * 1.9);
        ctx.lineTo(p[0], p[1]);
        ctx.closePath();
        ctx.fill();
      });

      // 更新並繪製魚群
      for (var i = 0; i < fishes.length; i++) {
        var f = fishes[i];
        f.wobble += dt * 7;
        if ((state === 'cast' || state === 'nibble' || state === 'bite') && f === targetFish) {
          var dx = bobber.x - f.x, dy = bobber.y - f.y;
          var dist = Math.hypot(dx, dy) || 1;
          if (dist > 14) {
            f.vx = (dx / dist) * 85;
            f.vy = (dy / dist) * 85;
          } else {
            f.vx *= 0.8;
            f.vy *= 0.8;
          }
        } else {
          if (f.x < 35 || f.x > cvs.width - 35) f.vx = -f.vx;
          if (f.y < 35 || f.y > cvs.height - 35) f.vy = -f.vy;
        }
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        var ang = Math.atan2(f.vy, f.vx);
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(ang);
        ctx.fillStyle = f.sp.col || '#ef4444';
        ctx.beginPath();
        ctx.ellipse(0, 0, f.size, f.size * 0.46, 0, 0, Math.PI * 2);
        ctx.fill();
        var tailY = Math.sin(f.wobble) * 3.5;
        ctx.beginPath();
        ctx.moveTo(-f.size + 2, 0);
        ctx.lineTo(-f.size - 8, -5 + tailY);
        ctx.lineTo(-f.size - 8, 5 + tailY);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(f.size * 0.45, -1.8, 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 釣魚狀態計時
      if (state === 'cast') {
        timer -= dt;
        if (timer <= 0) {
          state = 'nibble';
          timer = 0.8 + Math.random() * 0.9;
          bobber.sink = 3;
          ripples.push({ x: bobber.x, y: bobber.y, r: 3, a: 0.9 });
          statusEl.textContent = '💧 浮標動了一下… 魚兒正在試探！準備拉竿！';
        }
      } else if (state === 'nibble') {
        timer -= dt;
        bobber.sink = Math.sin(now * 0.025) * 3;
        if (timer <= 0) {
          state = 'bite';
          timer = 1.65;
          bobber.sink = 8;
          ripples.push({ x: bobber.x, y: bobber.y, r: 5, a: 1 });
          statusEl.textContent = '❗ 魚上鉤了！快點湖面或「⚡ 立即拉竿」！';
          actBtn.textContent = '⚡ 立即拉竿！';
        }
      } else if (state === 'bite') {
        timer -= dt;
        bobber.sink = 7 + Math.sin(now * 0.05) * 3;
        if (timer <= 0) {
          state = 'idle';
          statusEl.textContent = '🐟 哎呀！魚兒吃完餌溜走了，再拋一竿試試！';
          actBtn.textContent = '🎯 重新拋竿';
        }
      }

      // 漣漪
      for (var r = ripples.length - 1; r >= 0; r--) {
        var rp = ripples[r];
        rp.r += dt * 36;
        rp.a -= dt * 0.9;
        if (rp.a <= 0) { ripples.splice(r, 1); continue; }
        ctx.strokeStyle = 'rgba(255,255,255,' + rp.a.toFixed(2) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(rp.x, rp.y, rp.r, rp.r * 0.55, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 釣竿與浮標
      if (state !== 'idle') {
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(310, 265);
        ctx.quadraticCurveTo(310, 200, 310 + (bobber.x - 310) * 0.28, 185);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,.85)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(310 + (bobber.x - 310) * 0.28, 185);
        ctx.lineTo(bobber.x, bobber.y + bobber.sink);
        ctx.stroke();

        // 浮標
        var by = bobber.y + bobber.sink;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(bobber.x, by, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(bobber.x, by, 6, Math.PI, 0);
        ctx.fill();
        if (state === 'bite') {
          ctx.fillStyle = '#fef08a';
          ctx.font = '900 18px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('❗上鉤了！點此拉竿！', bobber.x, by - 14);
        }
      }

      raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);
    activeCleanup = function () { cancelAnimationFrame(raf); };
  }

  /* ============================================================
   * GAME 2: 🏀 陽光籃球場 · 街頭三分投籃大賽 (Basketball Mini-Game)
   * ============================================================ */
  function renderBasketballGame(container) {
    container.innerHTML = funNavHtml('basketball') +
      '<div class="fg-head">' +
      '<div><h2>🏀 陽光籃球場 · 街頭三分投籃大賽</h2><p class="fg-sub">當下方準度指針滑到「🎯 綠色／金色甜蜜點」時，點擊球場或按「🏀 出手投籃」！（連進 3 球開啟 🔥 手感發燙加成）</p></div>' +
      '<div class="fg-stats"><span class="fg-badge">🏀 目前得分：<b id="bbScore">0</b></span>' +
      '<span class="fg-badge">🔥 連進：<b id="bbStreak">0</b></span>' +
      '<span class="fg-badge">🏆 最高紀錄：<b id="bbHigh">' + ST.bballHigh + '</b></span></div>' +
      '</div>' +
      '<div class="pond-stage">' +
      '<canvas id="bbCanvas" width="620" height="275"></canvas>' +
      '<div class="pond-hud">' +
      '<span class="pond-status" id="bbStatus">🎯 抓準指針通過中央綠色／金色區域時出手！</span>' +
      '<button type="button" class="btn primary sm" id="bbShootBtn">🏀 出手投籃 (空白鍵)</button>' +
      '</div></div>';

    var cvs = document.getElementById('bbCanvas');
    var ctx = cvs.getContext('2d');
    var scoreEl = document.getElementById('bbScore');
    var streakEl = document.getElementById('bbStreak');
    var highEl = document.getElementById('bbHigh');
    var statusEl = document.getElementById('bbStatus');
    var shootBtn = document.getElementById('bbShootBtn');

    var score = 0, streak = 0;
    var meter = 0.2, meterDir = 1;
    var hoopX = 485, hoopY = 105, hoopDir = 1;
    var ball = null; // {t, x0, y0, x1, y1, hit, swish, pts}
    var popTxt = null;

    function shoot() {
      if (ball) return;
      var diff = Math.abs(meter - 0.5);
      var swish = diff <= 0.055;
      var hit = diff <= 0.145;
      var tx = hit ? hoopX : (meter < 0.5 ? hoopX - 34 : hoopX + 28);
      var pts = 0;
      if (hit) {
        streak += 1;
        pts = (swish ? 3 : 2) + (streak >= 3 ? 1 : 0);
        score += pts;
        if (score > ST.bballHigh) { ST.bballHigh = score; saveState(); }
      } else {
        streak = 0;
      }
      ball = { t: 0, x0: 120, y0: 195, x1: tx, y1: hoopY, hit: hit, swish: swish, pts: pts };
    }

    cvs.addEventListener('pointerdown', shoot);
    shootBtn.addEventListener('click', shoot);
    function onKey(e) {
      if (e.code === 'Space') { e.preventDefault(); shoot(); }
    }
    window.addEventListener('keydown', onKey);

    var raf = 0, last = performance.now();
    function loop(now) {
      var dt = Math.min(0.08, (now - last) / 1000);
      last = now;

      // 移動準度條與籃框
      var spd = 0.85 + Math.min(0.65, streak * 0.08);
      if (!ball) {
        meter += meterDir * spd * dt;
        if (meter >= 0.96) { meter = 0.96; meterDir = -1; }
        if (meter <= 0.04) { meter = 0.04; meterDir = 1; }
      }
      if (streak >= 2) {
        hoopX += hoopDir * 38 * dt;
        if (hoopX > 525) { hoopX = 525; hoopDir = -1; }
        if (hoopX < 435) { hoopX = 435; hoopDir = 1; }
      }

      // 球場背景
      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(0, 0, cvs.width, cvs.height);
      ctx.fillStyle = '#f2a65a';
      ctx.fillRect(0, 185, cvs.width, 90);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 185);
      ctx.lineTo(cvs.width, 185);
      ctx.stroke();

      // 籃架與籃板
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(hoopX + 34, 225);
      ctx.lineTo(hoopX + 34, hoopY - 28);
      ctx.lineTo(hoopX + 18, hoopY - 12);
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      ctx.fillRect(hoopX + 16, hoopY - 42, 6, 46);
      ctx.strokeRect(hoopX + 16, hoopY - 42, 6, 46);

      // 籃框與籃網
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(hoopX - 18, hoopY);
      ctx.lineTo(hoopX + 16, hoopY);
      ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(hoopX - 16, hoopY + 2);
      ctx.lineTo(hoopX - 11, hoopY + 24);
      ctx.lineTo(hoopX + 9, hoopY + 24);
      ctx.lineTo(hoopX + 14, hoopY + 2);
      ctx.stroke();

      // 球員
      ctx.fillStyle = '#1d4ed8';
      ctx.beginPath();
      ctx.arc(110, 162, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(100, 175, 20, 38);

      // 拋物線預覽
      ctx.strokeStyle = 'rgba(234,88,12,.25)';
      ctx.setLineDash([5, 5]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(120, 185);
      ctx.quadraticCurveTo((120 + hoopX) / 2, 18, hoopX, hoopY);
      ctx.stroke();
      ctx.setLineDash([]);

      // 籃球飛行
      var bx = 124, by = 172;
      if (ball) {
        ball.t += dt * 1.45;
        var u = Math.min(1, ball.t);
        bx = ball.x0 + (ball.x1 - ball.x0) * u;
        var peakY = 26;
        by = (1 - u) * (1 - u) * ball.y0 + 2 * (1 - u) * u * peakY + u * u * ball.y1;
        if (ball.t >= 1) {
          if (ball.hit) {
            statusEl.textContent = ball.swish
              ? '🔥 空心入網 SWISH！+' + ball.pts + ' 分（連進 ' + streak + ' 球）'
              : '🏀 擦板命中！+' + ball.pts + ' 分（連進 ' + streak + ' 球）';
            popTxt = { x: hoopX, y: hoopY - 18, text: (ball.swish ? '🔥 SWISH +' : '🏀 +') + ball.pts, col: ball.swish ? '#d97706' : '#16a34a', a: 1 };
          } else {
            statusEl.textContent = '💥 打鐵彈框而出！調整節奏再投一球！';
            popTxt = { x: hoopX, y: hoopY - 18, text: '💦 差一點！', col: '#dc2626', a: 1 };
          }
          scoreEl.textContent = score;
          streakEl.textContent = streak + (streak >= 3 ? ' 🔥' : '');
          highEl.textContent = ST.bballHigh;
          ball = null;
        }
      }
      ctx.fillStyle = '#ea580c';
      ctx.strokeStyle = '#4a3b2f';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(bx, by, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      if (popTxt) {
        popTxt.y -= dt * 28;
        popTxt.a -= dt * 0.85;
        if (popTxt.a <= 0) popTxt = null;
        else {
          ctx.fillStyle = popTxt.col;
          ctx.font = '900 18px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(popTxt.text, popTxt.x, popTxt.y);
        }
      }

      // 下方準度槽
      var mx = 130, my = 242, mw = 360, mh = 18;
      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.roundRect(mx, my, mw, mh, 9);
      ctx.fill();
      // 綠色命中區
      ctx.fillStyle = '#4ade80';
      ctx.fillRect(mx + mw * 0.355, my + 2, mw * 0.29, mh - 4);
      // 金色空心區
      ctx.fillStyle = '#facc15';
      ctx.fillRect(mx + mw * 0.445, my + 2, mw * 0.11, mh - 4);
      // 指針
      var px = mx + meter * mw;
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(px, my + mh / 2, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);
    activeCleanup = function () {
      cancelAnimationFrame(raf);
      window.removeEventListener('keydown', onKey);
    };
  }

  /* ============================================================
   * GAME 3: ⚽ 綠茵足球場 · 黃金十二碼 PK 賽 (Soccer Penalty Shootout)
   * ============================================================ */
  function renderSoccerGame(container) {
    var ZONES = [
      { id: 0, label: '↖ 左上死角', x: 175, y: 74 },
      { id: 1, label: '↑ 中路勺子球', x: 310, y: 72 },
      { id: 2, label: '↗ 右上死角', x: 445, y: 74 },
      { id: 3, label: '↙ 左下低平球', x: 175, y: 138 },
      { id: 4, label: '↓ 中路抽射', x: 310, y: 138 },
      { id: 5, label: '↘ 右下低平球', x: 445, y: 138 },
    ];
    container.innerHTML = funNavHtml('soccer') +
      '<div class="fg-head">' +
      '<div><h2>⚽ 綠茵足球場 · 黃金十二碼 PK 大戰</h2><p class="fg-sub">點擊球門上的 6 個射門死角，騙過守門員破網得分！</p></div>' +
      '<div class="fg-stats"><span class="fg-badge">⚽ 進球數：<b id="scGoals">0</b> / <b id="scShots">0</b></span>' +
      '<span class="fg-badge">🏆 最高進球：<b id="scHigh">' + ST.soccerHigh + '</b></span></div>' +
      '</div>' +
      '<div class="pond-stage">' +
      '<canvas id="scCanvas" width="620" height="270"></canvas>' +
      '<div class="pond-hud">' +
      '<span class="pond-status" id="scStatus">👆 點擊球門中的「🎯 射門標靶」直接起腳射門！</span>' +
      '<div class="sc-zone-btns">' + ZONES.map(function (z) {
        return '<button type="button" class="btn sm" data-sc-zone="' + z.id + '">' + esc(z.label) + '</button>';
      }).join('') + '</div></div></div>';

    var cvs = document.getElementById('scCanvas');
    var ctx = cvs.getContext('2d');
    var goalsEl = document.getElementById('scGoals');
    var shotsEl = document.getElementById('scShots');
    var highEl = document.getElementById('scHigh');
    var statusEl = document.getElementById('scStatus');

    var goals = 0, shots = 0;
    var keeper = { x: 310, y: 112, tx: 310, ty: 112 };
    var kick = null; // {t, tx, ty, saved, zone}

    function shootZone(zid) {
      if (kick) return;
      var z = ZONES[zid] || ZONES[0];
      // 守門員隨機撲向一格（約 25% 機率猜中同格）
      var keeperPick = Math.random() < 0.25 ? zid : Math.floor(Math.random() * ZONES.length);
      var kz = ZONES[keeperPick];
      keeper.tx = kz.x;
      keeper.ty = kz.y;
      kick = { t: 0, tx: z.x, ty: z.y, saved: keeperPick === zid, label: z.label };
    }

    cvs.addEventListener('pointerdown', function (e) {
      var r = cvs.getBoundingClientRect();
      var x = (e.clientX - r.left) * (cvs.width / r.width);
      var y = (e.clientY - r.top) * (cvs.height / r.height);
      var best = 0, bestD = 9999;
      ZONES.forEach(function (z) {
        var d = Math.hypot(x - z.x, y - z.y);
        if (d < bestD) { bestD = d; best = z.id; }
      });
      shootZone(best);
    });
    container.querySelectorAll('[data-sc-zone]').forEach(function (b) {
      b.addEventListener('click', function () { shootZone(+b.getAttribute('data-sc-zone')); });
    });

    var raf = 0, last = performance.now();
    function loop(now) {
      var dt = Math.min(0.08, (now - last) / 1000);
      last = now;

      // 球場草皮與天空
      ctx.fillStyle = '#bae6fd';
      ctx.fillRect(0, 0, cvs.width, 155);
      ctx.fillStyle = '#40916c';
      ctx.fillRect(0, 155, cvs.width, 115);
      for (var i = 0; i < 6; i++) {
        if (i % 2) {
          ctx.fillStyle = '#52b788';
          ctx.fillRect(i * 104, 155, 52, 115);
        }
      }

      // 球門與球網
      ctx.fillStyle = 'rgba(255,255,255,.22)';
      ctx.fillRect(140, 46, 340, 112);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 6;
      ctx.strokeRect(140, 46, 340, 112);

      // 6 個射門標靶
      if (!kick) {
        ZONES.forEach(function (z) {
          ctx.fillStyle = 'rgba(250,204,21,.28)';
          ctx.strokeStyle = '#facc15';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(z.x, z.y, 20, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.font = '800 11px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('🎯', z.x, z.y + 4);
        });
      }

      // 守門員移動
      keeper.x += (keeper.tx - keeper.x) * Math.min(1, dt * 10);
      keeper.y += (keeper.ty - keeper.y) * Math.min(1, dt * 10);
      ctx.fillStyle = '#ef4444';
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(keeper.x - 22, keeper.y - 16, 44, 34, 8);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.arc(keeper.x, keeper.y - 24, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(keeper.x - 26, keeper.y - 6, 7, 0, Math.PI * 2);
      ctx.arc(keeper.x + 26, keeper.y - 6, 7, 0, Math.PI * 2);
      ctx.fill();

      // 足球飛行
      var bx = 310, by = 238, br = 12;
      if (kick) {
        kick.t += dt * 1.9;
        var u = Math.min(1, kick.t);
        bx = 310 + (kick.tx - 310) * u;
        by = 238 + (kick.ty - 238) * u - Math.sin(u * Math.PI) * 28;
        br = 12 - u * 3.5;
        if (kick.t >= 1) {
          shots += 1;
          if (!kick.saved) {
            goals += 1;
            if (goals > ST.soccerHigh) { ST.soccerHigh = goals; saveState(); }
            statusEl.textContent = '⚽ GOAL!! 「' + kick.label + '」完美破網得分！';
          } else {
            statusEl.textContent = '🧤 守門員神撲擋下了「' + kick.label + '」！再踢一球！';
          }
          goalsEl.textContent = goals;
          shotsEl.textContent = shots;
          highEl.textContent = ST.soccerHigh;
          setTimeout(function () { keeper.tx = 310; keeper.ty = 112; }, 350);
          kick = null;
        }
      }
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);
    activeCleanup = function () { cancelAnimationFrame(raf); };
  }

  /* ============================================================
   * GAME 4: 🎾 森林網球場 · 王牌對打挑戰 (Tennis Rally Mini-Game)

      '<div><h2>🎾 森林網球場 · 王牌對打挑戰</h2><p class="fg-sub">在球場上移動滑鼠或手指控制下方球拍，與網球教練對抽過招！球拍正中央擊球可打出「⚡黃金扣殺」！</p></div>' +
      '<div class="fg-stats"><span class="fg-badge">🔥 目前連擊：<b id="tnRally">0</b></span>' +
      '<span class="fg-badge">🏆 最高連擊：<b id="tnHigh">' + ST.tennisHigh + '</b></span>' +
      '<span class="fg-badge">🏅 得分：<b id="tnScore">0 : 0</b></span></div>' +
      '</div>' +
      '<div class="pond-stage">' +
      '<canvas id="tnCanvas" width="620" height="275"></canvas>' +
      '<div class="pond-hud">' +
      '<span class="pond-status" id="tnStatus">🎾 左右移動滑鼠／手指接球對抽！</span>' +
      '<button type="button" class="btn primary sm" id="tnServeBtn">🎾 重新發球</button>' +
      '</div></div>';

    var cvs = document.getElementById('tnCanvas');
    var ctx = cvs.getContext('2d');
    var rallyEl = document.getElementById('tnRally');
    var highEl = document.getElementById('tnHigh');
    var scoreEl = document.getElementById('tnScore');
    var statusEl = document.getElementById('tnStatus');
    var serveBtn = document.getElementById('tnServeBtn');

    var playerX = 310, botX = 310;
    var pScore = 0, bScore = 0, rally = 0;
    var ball = { x: 310, y: 137, vx: 110, vy: 165, smash: false };

    function resetBall(dir) {
      ball.x = 310;
      ball.y = 137;
      ball.vx = (Math.random() - 0.5) * 160;
      ball.vy = (dir || 1) * 165;
      ball.smash = false;
      rally = 0;
      rallyEl.textContent = '0';
    }

    function movePaddle(clientX) {
      var r = cvs.getBoundingClientRect();
      playerX = clamp((clientX - r.left) * (cvs.width / r.width), 130, 490);
    }
    cvs.addEventListener('pointermove', function (e) { movePaddle(e.clientX); });
    cvs.addEventListener('pointerdown', function (e) { movePaddle(e.clientX); });
    serveBtn.addEventListener('click', function () { resetBall(1); });

    var raf = 0, last = performance.now();
    function loop(now) {
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;

      // 球場繪製
      ctx.fillStyle = '#4d9078';
      ctx.fillRect(0, 0, cvs.width, cvs.height);
      ctx.fillStyle = '#2563eb';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      ctx.fillRect(95, 16, 430, 243);
      ctx.strokeRect(95, 16, 430, 243);
      ctx.beginPath();
      ctx.moveTo(95, 137.5);
      ctx.lineTo(525, 137.5);
      ctx.moveTo(310, 62);
      ctx.lineTo(310, 213);
      ctx.moveTo(95, 62);
      ctx.lineTo(525, 62);
      ctx.moveTo(95, 213);
      ctx.lineTo(525, 213);
      ctx.stroke();

      // 教練 AI 移動
      var botSpd = 195;
      if (ball.x > botX + 8) botX = Math.min(485, botX + botSpd * dt);
      else if (ball.x < botX - 8) botX = Math.max(135, botX - botSpd * dt);

      // 球移動與碰撞
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      if (ball.x < 105) { ball.x = 105; ball.vx = Math.abs(ball.vx); }
      if (ball.x > 515) { ball.x = 515; ball.vx = -Math.abs(ball.vx); }

      // 玩家球拍接球 (y = 242)
      if (ball.vy > 0 && ball.y >= 232 && ball.y <= 252 && Math.abs(ball.x - playerX) <= 44) {
        var off = (ball.x - playerX) / 44;
        var isSmash = Math.abs(off) < 0.24;
        rally += 1;
        if (rally > ST.tennisHigh) { ST.tennisHigh = rally; saveState(); highEl.textContent = ST.tennisHigh; }
        rallyEl.textContent = rally + (isSmash ? ' ⚡' : '');
        var spd = Math.min(310, 175 + rally * 9) * (isSmash ? 1.22 : 1);
        ball.vy = -spd;
        ball.vx = off * 220 + (Math.random() - 0.5) * 30;
        ball.smash = isSmash;
        statusEl.textContent = isSmash ? '⚡ 完美甜區擊球！黃金扣殺 Smash！（連擊 ' + rally + '）' : '🎾 漂亮回擊！（連擊 ' + rally + '）';
      }

      // 教練球拍接球 (y = 32)
      if (ball.vy < 0 && ball.y <= 42 && ball.y >= 22 && Math.abs(ball.x - botX) <= 38) {
        var boff = (ball.x - botX) / 38;
        ball.vy = Math.min(280, 170 + rally * 7);
        ball.vx = boff * 190;
        ball.smash = false;
      }

      // 得分判定
      if (ball.y < 10) {
        pScore += 1;
        scoreEl.textContent = pScore + ' : ' + bScore;
        statusEl.textContent = '🏆 穿越得分！你拿下一分！（' + pScore + ' : ' + bScore + '）';
        resetBall(1);
      } else if (ball.y > 265) {
        bScore += 1;
        scoreEl.textContent = pScore + ' : ' + bScore;
        statusEl.textContent = '😅 沒接到球，左右移動球拍再接再厲！';
        resetBall(-1);
      }

      // 繪製球拍
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.roundRect(botX - 34, 24, 68, 10, 5);
      ctx.fill();

      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.roundRect(playerX - 40, 240, 80, 11, 5.5);
      ctx.fill();
      ctx.fillStyle = '#fde047';
      ctx.fillRect(playerX - 10, 240, 20, 11);

      // 網球
      ctx.fillStyle = ball.smash ? '#facc15' : '#bef264';
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.smash ? 8 : 6.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);
    activeCleanup = function () { cancelAnimationFrame(raf); };
  }

  /* ============================================================
   * HUB: 🐾 校園互動總覽（動物圖鑑、專車派遣、4 大遊戲入口）
   * ============================================================ */
  function renderFunHub(container) {
    var animals = L.animals || [];
    var metCnt = Object.keys(ST.animalsMet).length;
    var fishCnt = Object.keys(ST.fishCaught).length;
    container.innerHTML = funNavHtml('hub') +
      '<div class="fg-head">' +
      '<div><h2>🎮 開心學園 · 校園互動與圖鑑中心</h2><p class="fg-sub">點擊地圖上的湖泊、球場、停車場車子與小動物，或從這裡一鍵體驗所有校園彩蛋！</p></div>' +
      '</div>' +
      '<div class="hub-grid">' +
      '<button type="button" class="hub-card" data-fun-tab="fishing"><span class="hub-ic">🎣</span><div><b>學園湖垂釣樂</b><small>已收集 ' + fishCnt + ' / ' + FISH_SPECIES.length + ' 種魚 · 累積 ' + ST.fishTotal + ' 尾</small></div></button>' +
      '<button type="button" class="hub-card" data-fun-tab="basketball"><span class="hub-ic">🏀</span><div><b>陽光籃球場 · 三分大賽</b><small>最高紀錄：' + ST.bballHigh + ' 分</small></div></button>' +
      '<button type="button" class="hub-card" data-fun-tab="soccer"><span class="hub-ic">⚽</span><div><b>綠茵足球場 · 十二碼 PK</b><small>最高進球：' + ST.soccerHigh + ' 球</small></div></button>' +
      '<button type="button" class="hub-card" data-fun-tab="tennis"><span class="hub-ic">🎾</span><div><b>森林網球場 · 王牌對打</b><small>最高連擊：' + ST.tennisHigh + ' 拍</small></div></button>' +
      '</div>' +
      '<div class="fg-dex-title">🚗 校園專車接送（已出車 ' + ST.carTrips + ' 趟 · 點擊立即派車開往學院）</div>' +
      '<div class="hub-car-bar">' +
      '<button type="button" class="btn primary sm" id="hubOpenCarBtn">🚗 打開校園專車導航列</button>' +
      '<button type="button" class="btn sm" id="hubRandomCarBtn">🎲 派車隨機巡遊校園</button>' +
      '</div>' +
      '<div class="fg-dex-title">🐾 校園萌寵圖鑑（已遇見 ' + metCnt + ' / ' + animals.length + ' 隻 · 點擊可直接飛去地圖找牠！）</div>' +
      '<div class="fg-dex">' + animals.map(function (a) {
        var cnt = ST.animalsMet[a.id] || 0;
        var ic = a.name.split(' ')[0];
        return '<button type="button" class="dex-card unlocked hub-animal-btn" data-find-animal="' + esc(a.id) + '">' +
          '<div class="dex-ic">' + esc(ic) + '</div>' +
          '<div class="dex-info"><b>' + esc(a.name) + (cnt ? ' <span class="chip" style="background:#dcfce7;color:#166534">互動 ' + cnt + ' 次</span>' : ' <span class="chip" style="background:#f1f5f9;color:#475569">去地圖找牠 ›</span>') + '</b>' +
          '<p>' + esc(a.msg) + '</p></div></button>';
      }).join('') + '</div>';

    var oc = document.getElementById('hubOpenCarBtn');
    if (oc) oc.addEventListener('click', function () { closeFunModal(); openCarHud(0); startRandomCruise(); });
    var rc = document.getElementById('hubRandomCarBtn');
    if (rc) rc.addEventListener('click', function () { closeFunModal(); openCarHud(Math.floor(Math.random() * 7)); startRandomCruise(); });

    container.querySelectorAll('[data-find-animal]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var aid = btn.getAttribute('data-find-animal');
        var a = animals.filter(function (x) { return x.id === aid; })[0];
        if (!a) return;
        closeFunModal();
        if (C.map.flyToPoint) C.map.flyToPoint(a.x, a.y, 680, 480);
        var el = document.querySelector('#campusMap .animal[data-animal="' + aid + '"]');
        setTimeout(function () { handleAnimalClick(aid, el); }, 450);
      });
    });
  }

  /* ------------------------------------------------------------ 事件綁定與啟動 */
  C.on('fun', function (ev) {
    if (!ev || !ev.kind) return;
    if (ev.kind === 'animal') {
      handleAnimalClick(ev.id, ev.el);
      return;
    }
    if (ev.kind === 'car') {
      openCarHud(ev.idx);
      startRandomCruise();
      return;
    }
    if (ev.kind === 'car-hub' || ev.kind === 'vehicle') {
      openCarHud(V.activeCarIdx >= 0 ? V.activeCarIdx : 0);
      if (ev.kind === 'vehicle' && ev.id === 'bus') {
        C.toast('🚌 叭叭～開心校車巡航中！可在下方導航列選擇想去的學院');
      } else {
        startRandomCruise();
      }
      return;
    }
    if (ev.kind === 'fishing') {
      if (ev.fish) C.toast('🐟 水裡有「' + ev.fish + '」游過去了！準備拋竿垂釣～');
      openFunModal('fishing');
      return;
    }
    if (ev.kind === 'basketball' || ev.kind === 'tennis' || ev.kind === 'soccer' || ev.kind === 'hub') {
      openFunModal(ev.kind);
    }
  });

  function initFun() {
    ensureVehicleLayer();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initFun);
  else setTimeout(initFun, 50);
})();

</script>
</body>
</html>
