  <style>/* css/campus.css */
/* 開心學園 · campus.css — 溫暖淺色、插畫風校園地圖入口 */
:root {
  --ink: #3b2f25;
  --muted: #6b5a4a;
  --soft-ink: #8a7559;
  --paper: #fbf7ef;
  --card: #ffffff;
  --line: #eadfcd;
  --line-2: #dccdb2;
  --brand: #1d6b57;
  --brand-d: #155446;
  --gold: #e3a72f;
  --accent: #c8553d;
  --hdr-h: 62px;
  --rb-h: 0px;
  --r: 14px;
  --shadow: 0 8px 24px rgba(59, 47, 37, .10);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body.has-ribbon { --rb-h: 42px; }
button { font-family: inherit; }
a { color: var(--brand); }
code, kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; }
code { background: #f6efe1; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
kbd { background: #fff; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 6px; padding: 0 5px; }
[hidden] { display: none !important; }
.skip { position: absolute; left: -9999px; top: 8px; z-index: 100; background: #fff; padding: 8px 12px; border-radius: 10px; box-shadow: var(--shadow); }
.skip:focus { left: 8px; }

/* ?go= 轉址中：不畫地圖 */
html.redirecting body > * { display: none !important; }
html.redirecting body::before {
  content: "🚌 正在前往目的地…";
  display: flex; align-items: center; justify-content: center; height: 100vh;
  font: 700 18px var(--font); color: var(--muted);
}

/* ------------------------------------------------------------ 標題列 */
.topbar {
  position: sticky; top: 0; z-index: 50;
  height: var(--hdr-h);
  background: rgba(255, 252, 246, .97);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 2px 10px rgba(59, 47, 37, .05);
}
.tb-row { display: flex; align-items: center; gap: 16px; height: 100%; padding: 0 18px; }
.brand-wrap { display: flex; align-items: center; gap: 9px; flex: none; }
.brand { display: flex; align-items: center; gap: 7px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.brand-ic { font-size: 23px; line-height: 1; }
.brand-txt { display: inline-flex; align-items: baseline; gap: 7px; }
.brand-name { font-size: 19px; font-weight: 900; letter-spacing: .2px; }
.brand-sub { font-size: 16px; font-weight: 700; color: var(--muted); }
.brand-sub::before { content: "· "; }
.ver-badge {
  height: 24px; padding: 0 9px; border-radius: 999px;
  border: 1px solid #cfe3da; background: #eef7f3; color: var(--brand);
  font-size: 12px; font-weight: 800; cursor: pointer; position: relative; white-space: nowrap;
}
.ver-badge:hover { background: #e2f1ea; }
.ver-badge .ver-dot { position: absolute; top: -2px; right: -2px; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); border: 2px solid #fff; }

.search { position: relative; flex: 1 1 auto; max-width: 540px; margin: 0 auto; }
.search input {
  width: 100%; height: 40px; border-radius: 999px;
  border: 1.5px solid var(--line-2); background: #fff;
  padding: 0 38px 0 40px; font: inherit; font-size: 14.5px; color: var(--ink);
  outline: none; transition: border-color .15s, box-shadow .15s;
}
.search input::placeholder { color: #a8957a; }
.search input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(29, 107, 87, .12); }
.search input::-webkit-search-cancel-button { display: none; }
.s-ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; pointer-events: none; }
.s-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 26px; height: 26px; border-radius: 50%; border: 0; background: #f3ebdc; color: var(--muted); cursor: pointer;
}
.s-pop {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 70;
  background: #fffdf8; border: 1px solid var(--line-2); border-radius: 16px;
  box-shadow: 0 16px 40px rgba(59, 47, 37, .18); padding: 6px; max-height: 70vh; overflow: auto;
}
.s-item {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 8px 10px; border: 0; background: transparent; border-radius: 11px; cursor: pointer; color: var(--ink);
}
.s-item:hover, .s-item.on { background: #f5eddd; }
.s-ic2 { font-size: 22px; width: 32px; text-align: center; flex: none; }
.s-tx { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.s-tx b { font-size: 14.5px; }
.s-tx small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-none { padding: 12px; font-size: 13.5px; color: var(--muted); }

.tb-right { display: flex; align-items: center; gap: 10px; flex: none; }
.env-chip { font-size: 12px; font-weight: 800; color: #1e40af; background: #dbeafe; border: 1px solid #bfdbfe; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.seg { display: inline-flex; background: #f1e8d7; border-radius: 999px; padding: 3px; }
.seg button {
  border: 0; background: transparent; height: 34px; padding: 0 15px; border-radius: 999px;
  font-size: 14px; font-weight: 800; color: var(--muted); cursor: pointer; white-space: nowrap;
}
.seg button[aria-selected="true"] { background: #fff; color: var(--brand); box-shadow: 0 2px 6px rgba(59, 47, 37, .14); }

/* ------------------------------------------------------------ 最近造訪 */
.ribbon {
  display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 18px;
  background: #fffaf0; border-bottom: 1px solid var(--line);
  overflow-x: auto; white-space: nowrap; scrollbar-width: none;
}
.ribbon::-webkit-scrollbar { display: none; }
.rb-t { font-size: 13px; font-weight: 800; color: var(--muted); flex: none; }
.rb-list { display: flex; gap: 8px; }
.rb-chip {
  display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 12px;
  border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--ink);
  text-decoration: none; font-size: 13px; font-weight: 700;
}
.rb-chip:hover { border-color: var(--brand); color: var(--brand); }
.rb-chip small { color: var(--soft-ink); font-weight: 600; font-size: 11.5px; }

/* ------------------------------------------------------------ 地圖 */
.map-view { position: relative; }
.map-wrap {
  position: relative; overflow: hidden;
  height: calc(100vh - var(--hdr-h) - var(--rb-h));
  min-height: 520px;
  background: #ebe3cd;
}
.campus-map {
  display: block; width: 100%; height: 100%;
  touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  cursor: grab; outline: none;
}
.map-wrap.dragging .campus-map { cursor: grabbing; }
.campus-map:focus-visible { box-shadow: inset 0 0 0 3px rgba(29, 107, 87, .45); }
.campus-map .bld, .campus-map .svc, .campus-map .sign, .campus-map .lot, .campus-map .lbl { cursor: pointer; }
.map-wrap.dragging .campus-map * { cursor: grabbing !important; }
.campus-map .bld-in { transition: transform .18s ease; }
.campus-map .bld.hover .bld-in, .campus-map .bld:focus-visible .bld-in,
.campus-map .svc.hover .bld-in, .campus-map .svc:focus-visible .bld-in { transform: translateY(-7px); }
.campus-map .bld:focus, .campus-map .svc:focus, .campus-map .sign:focus, .campus-map .lot:focus { outline: none; }
.campus-map .bld:focus-visible .hit, .campus-map .svc:focus-visible .hit { stroke: var(--brand); stroke-width: 3; stroke-dasharray: 7 5; }
.campus-map .sign .lbl-s > * { transition: opacity .15s; }
.campus-map .sign.hover .sign-bg, .campus-map .sign:focus-visible .sign-bg { stroke-width: 3.5; fill: #fff; }
.campus-map .lot.hover > :not(.hit) { opacity: .82; }
.campus-map .bld-ring { fill: none; stroke: none; }
.campus-map .bld.sel .bld-ring { fill: rgba(29, 107, 87, .12); stroke: var(--brand); stroke-width: 3; stroke-dasharray: 9 6; }
.campus-map .bld.hit .bld-ring { fill: rgba(227, 167, 47, .22); stroke: var(--gold); stroke-width: 3.5; }
.campus-map.searching .bld:not(.hit), .campus-map.searching .lbl[data-id]:not(.hit) { opacity: .26; transition: opacity .15s; }
.campus-map .bld.from .bld-ring {
  stroke: var(--brand); stroke-width: 4; fill: rgba(29, 107, 87, .15);
  transform-box: fill-box; transform-origin: center; animation: cm-ring 1.7s ease-out infinite;
}
.campus-map .fc-bob { animation: cm-bob 1.9s ease-in-out infinite; }
.campus-map .from-callout { pointer-events: none; }
@keyframes cm-ring { 0% { transform: scale(.75); opacity: 1; } 100% { transform: scale(1.45); opacity: 0; } }
@keyframes cm-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.campus-map .zone.zfocus .zone-bg { stroke-width: 6; stroke-opacity: 1; stroke-dasharray: none; animation: cm-zone 1.2s ease 2; }
@keyframes cm-zone { 50% { stroke-width: 10; } }
@media (prefers-reduced-motion: reduce) {
  .campus-map .bld.from .bld-ring, .campus-map .fc-bob, .campus-map .zone.zfocus .zone-bg { animation: none; }
}

.map-chips {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px; max-width: calc(100% - 24px); overflow-x: auto; scrollbar-width: none;
  padding: 2px; pointer-events: auto;
}
.map-chips::-webkit-scrollbar { display: none; }
.mc {
  flex: none; height: 32px; padding: 0 12px; border-radius: 999px;
  border: 1.5px solid var(--dc, var(--line-2)); background: rgba(255, 253, 248, .95);
  color: var(--ink); font-size: 13px; font-weight: 800; cursor: pointer; white-space: nowrap;
  box-shadow: 0 3px 10px rgba(59, 47, 37, .12);
}
.mc:hover { background: #fff; transform: translateY(-1px); }
.mc[data-home] { border-color: var(--brand); color: var(--brand); }
.mc.mc-mode { border-color: #cbd5e1; color: var(--muted); }
.mc.mc-mode.on { border-color: var(--brand); background: #eef7f3; color: var(--brand); }
.map-zoom {
  position: absolute; right: 14px; bottom: 16px; display: flex; flex-direction: column; gap: 6px;
}
.map-zoom button {
  width: 42px; height: 42px; border-radius: 13px; border: 1.5px solid var(--line-2);
  background: rgba(255, 253, 248, .96); color: var(--ink); font-size: 19px; font-weight: 800; cursor: pointer;
  box-shadow: 0 4px 12px rgba(59, 47, 37, .14);
}
.map-zoom button:hover:not(:disabled) { background: #fff; border-color: var(--brand); color: var(--brand); }
.map-zoom button:disabled { opacity: .45; cursor: default; }
.map-tip {
  position: absolute; left: 0; top: 0; z-index: 20; pointer-events: none;
  max-width: 270px; padding: 10px 12px; border-radius: 13px;
  background: #fffdf8; border: 1px solid var(--line-2); box-shadow: 0 12px 28px rgba(59, 47, 37, .2);
  font-size: 13px; line-height: 1.5;
}
.map-tip b { font-size: 14.5px; }
.map-tip p { margin: 4px 0 2px; color: var(--muted); }
.map-tip em { font-style: normal; font-size: 12px; color: var(--brand); font-weight: 700; }
.tip-st { margin-left: 6px; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 1px 7px; vertical-align: 1px; }
.map-hint {
  position: absolute; left: 50%; bottom: 22px; transform: translate(-50%, 12px); opacity: 0;
  background: rgba(29, 107, 87, .94); color: #fff; font-weight: 800; font-size: 14px;
  padding: 9px 16px; border-radius: 999px; box-shadow: 0 8px 20px rgba(29, 107, 87, .3);
  transition: opacity .35s, transform .35s; pointer-events: none; white-space: nowrap;
}
.map-hint.show { opacity: 1; transform: translate(-50%, 0); }
.map-err { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; color: var(--accent); }

/* ------------------------------------------------------------ 共用元件 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 38px; padding: 0 16px; border-radius: 12px;
  border: 1.5px solid var(--line-2); background: #fff; color: var(--ink);
  font: inherit; font-size: 14px; font-weight: 800; text-decoration: none; cursor: pointer; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .15s, box-shadow .15s;
}
.btn:hover { border-color: #c9b189; background: #fffaf0; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-d); border-color: var(--brand-d); box-shadow: 0 6px 16px rgba(29, 107, 87, .25); transform: translateY(-1px); }
.btn.big { height: 48px; font-size: 16px; padding: 0 22px; border-radius: 14px; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn.ghost { background: transparent; }
.btn[disabled], .btn.off { opacity: .55; cursor: not-allowed; }
.chip {
  display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px;
  border: 1px solid transparent; font-size: 12px; font-weight: 800; white-space: nowrap; vertical-align: middle; line-height: 1;
}
.linkish {
  background: none; border: 0; padding: 0; color: var(--brand); font: inherit; font-weight: 700;
  cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(29, 107, 87, .35);
}
.toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 120; max-width: min(92vw, 560px);
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  background: var(--brand); color: #fff; font-weight: 700; font-size: 14px;
  padding: 11px 18px; border-radius: 14px; box-shadow: 0 12px 30px rgba(29, 107, 87, .32);
  transition: opacity .25s, transform .25s; overflow-wrap: anywhere;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: #b4432f; }

/* ------------------------------------------------------------ 介紹卡（抽屜／底部面板） */
.panel {
  position: fixed; top: var(--hdr-h); right: 0; bottom: 0; z-index: 60;
  width: 410px; max-width: 94vw; display: flex; flex-direction: column;
  background: #fffdf8; border-left: 1px solid var(--line);
  box-shadow: -14px 0 34px rgba(59, 47, 37, .14);
  transform: translateX(104%); transition: transform .28s cubic-bezier(.2, .8, .2, 1);
  visibility: hidden;
}
.panel.open { transform: none; visibility: visible; }
.panel.dragging { transition: none; }
.pn-head { display: flex; justify-content: flex-end; padding: 12px 14px 0; flex: none; }
.pn-grab { display: none; }
.pn-close {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-2); background: #fff;
  color: var(--muted); font-size: 15px; cursor: pointer;
}
.pn-close:hover { color: var(--ink); border-color: #c9b189; }
.pn-body { flex: 1; overflow-y: auto; padding: 0 22px 26px; overscroll-behavior: contain; }
.pn-hero { display: flex; gap: 14px; align-items: flex-start; margin-top: -6px; }
.pn-ic {
  flex: none; width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 34px;
  background: var(--ds); border: 2px solid var(--dc); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .05);
}
.pn-hd { min-width: 0; padding-right: 30px; }
.pn-hd h2 { margin: 2px 0 0; font-size: 22px; line-height: 1.3; outline: none; }
.pn-hd h2 .chip { margin-left: 4px; vertical-align: 3px; }
.pn-en { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 1px; }
.pn-dist {
  margin-top: 7px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1.5px solid var(--dc);
  background: var(--ds); color: var(--ink); font-size: 12.5px; font-weight: 800; cursor: pointer;
}
.pn-parent { margin-top: 12px; font-size: 13px; color: var(--muted); background: #f8f1e3; border-radius: 10px; padding: 7px 10px; }
.pn-tag { margin: 16px 0 6px; font-size: 16px; font-weight: 800; line-height: 1.5; }
.pn-desc { margin: 0; font-size: 14px; color: #5b4a3a; line-height: 1.75; }
.pn-feat { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 7px; }
.pn-feat li { font-size: 13.5px; font-weight: 700; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; }
.pn-sec { margin: 18px 0 8px; font-size: 12.5px; font-weight: 800; color: var(--soft-ink); letter-spacing: 1px; }
.pn-links, .pn-kids { display: flex; flex-wrap: wrap; gap: 7px; }
.pn-links a, .pn-links button.pn-rel-btn, .kid {
  display: inline-flex; align-items: center; min-height: 32px; padding: 4px 12px; border-radius: 999px;
  background: #eef7f3; border: 1px solid #cfe3da; color: var(--brand); font: inherit; font-size: 13px; font-weight: 800; line-height: 1.35; text-decoration: none; cursor: pointer; max-width: 100%;
}
.pn-links a:hover, .pn-links button.pn-rel-btn:hover, .kid:hover { background: #e0f0e8; }
.pn-related a.pn-rel-link, .pn-related button.pn-rel-btn {
  background: #fffbeb; border-color: #fcd34d; color: #92400e; border-radius: 16px; text-align: left;
}
.pn-related a.pn-rel-link:hover, .pn-related button.pn-rel-btn:hover { background: #fef3c7; }
.pn-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
.pn-actions .btn { width: 100%; }
.pn-ct {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 12px;
  padding: 10px 12px; border-radius: 12px; background: #f1f6fd; border: 1px solid #d6e4f7; font-size: 13px;
}
.pn-ct .ct-state { font-weight: 700; color: #334155; }
.pn-meta { margin-top: 14px; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.pn-meta .sep { color: #c9b189; }
.sheet-bd { display: none; }

/* ------------------------------------------------------------ 目錄 */
.dir-view { max-width: 1260px; margin: 0 auto; padding: 26px 22px 44px; min-height: calc(100vh - var(--hdr-h) - var(--rb-h)); }
.dir-intro-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.dir-intro h1 { margin: 0; font-size: 25px; }
.dir-intro p { margin: 0; color: var(--muted); font-size: 14.5px; }
.dir-d { margin-top: 28px; }
.dir-dh {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px;
  background: var(--ds); border: 1.5px solid var(--line); border-left: 7px solid var(--dc);
}
.dir-di { flex: none; width: 52px; height: 52px; border-radius: 15px; background: #fff; display: grid; place-items: center; font-size: 28px; }
.dir-dt { min-width: 0; }
.dir-dt h2 { margin: 0; font-size: 19px; }
.dir-dt h2 small { font-size: 12.5px; font-weight: 700; color: var(--muted); margin-left: 4px; }
.dir-dt p { margin: 3px 0 0; font-size: 13.5px; color: #5b4a3a; }
.dir-dh .btn { margin-left: auto; flex: none; }
.dir-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: 14px; margin-top: 14px; }
.card {
  position: relative; display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 14px;
  background: #fff; border: 1.5px solid var(--line); border-radius: 18px; cursor: pointer; overflow: hidden;
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--dc); opacity: .8; }
.card:hover, .card:focus-visible { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(59, 47, 37, .12); border-color: #d8c6a4; outline: none; }
.card-top { display: flex; align-items: flex-start; gap: 11px; }
.card-ic { flex: none; width: 46px; height: 46px; border-radius: 13px; background: var(--ds); display: grid; place-items: center; font-size: 25px; }
.card-tt { flex: 1; min-width: 0; }
.card-tt h3 { margin: 1px 0 0; font-size: 16.5px; }
.card-en { font-size: 12px; color: var(--muted); font-weight: 600; }
.card-tag { margin: 0; font-size: 14px; font-weight: 700; color: #4a3b2f; }
.card-desc { margin: 0; font-size: 13px; color: var(--muted); }
.card-feat { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.card-feat li { font-size: 12px; font-weight: 700; background: #faf5ea; border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; }
.card-links { display: flex; flex-wrap: wrap; gap: 6px; }
.card-links a { font-size: 12.5px; font-weight: 800; color: var(--brand); text-decoration: none; padding: 4px 10px; border-radius: 999px; background: #eef7f3; border: 1px solid #d5e8df; }
.card-links a:hover { background: #e0f0e8; }
.card-rels { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding-top: 2px; }
.card-rel-lbl { font-size: 11.5px; font-weight: 800; color: #92400e; margin-right: 2px; }
.card-rels .card-rel { font: inherit; font-size: 12px; font-weight: 800; color: #92400e; text-decoration: none; padding: 3px 9px; border-radius: 999px; background: #fffbeb; border: 1px solid #fcd34d; cursor: pointer; }
.card-rels .card-rel:hover { background: #fef3c7; }
.card-act { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 2px; flex-wrap: wrap; }
.ct-mini { font-size: 12px; font-weight: 700; color: #475569; margin-left: auto; }
.card.planned { border-style: dashed; background: #fffdf8; }
.lotcard {
  font: inherit; text-align: left; align-items: flex-start; color: var(--muted); gap: 4px;
  border: 2px dashed #d8c39b; justify-content: center; min-height: 150px;
  background: repeating-linear-gradient(45deg, #fffaf0, #fffaf0 10px, #fbf2df 10px, #fbf2df 20px);
}
.lotcard::before { display: none; }
.lotcard .lot-ic { font-size: 26px; }
.lotcard b { font-size: 16px; color: var(--ink); }
.lotcard span { font-size: 13px; }
.lotcard em { font-style: normal; font-size: 12.5px; font-weight: 800; color: var(--brand); margin-top: 4px; }
.dir-empty { margin-top: 30px; padding: 26px; text-align: center; color: var(--muted); background: #fff; border: 1.5px dashed var(--line-2); border-radius: 18px; }

/* ------------------------------------------------------------ 頁尾 */
.foot { text-align: center; padding: 18px 16px 26px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); background: #f8f1e4; }
.foot p { margin: 4px 0; }
.foot .disc { color: #7a4f2e; font-weight: 700; }
.foot-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 10px; }
.foot-links span { color: #c9b189; }
.foot .copy { font-size: 12px; color: var(--soft-ink); }

/* ------------------------------------------------------------ 視窗 */
.modal-bd {
  position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center;
  padding: 20px; background: rgba(59, 47, 37, .34);
}
.modal {
  position: relative; width: min(700px, 100%); max-height: min(88vh, 940px); overflow: auto;
  background: #fffdf8; border-radius: 22px; padding: 26px 28px 24px; box-shadow: 0 26px 70px rgba(59, 47, 37, .3);
}
.modal-x {
  position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--line-2); background: #fff; color: var(--muted); cursor: pointer; font-size: 15px;
}
.modal h2 { margin: 0 40px 8px 0; font-size: 21px; outline: none; }
.modal h3 { margin: 18px 0 6px; font-size: 15.5px; }
.modal p { margin: 6px 0; font-size: 14px; line-height: 1.7; color: #4f3f31; }
.modal .lead { font-size: 14.5px; }
.modal ul { margin: 0; padding-left: 20px; }
.modal li { margin: 4px 0; font-size: 14px; line-height: 1.65; }
.short-t { width: 100%; border-collapse: collapse; font-size: 13px; }
.short-t td { padding: 5px 6px; border-bottom: 1px dashed var(--line); }
.short-t td:first-child { white-space: nowrap; }
.modal .deep { margin-top: 8px; }
.modal-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
.fb-form { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.fb-l { font-weight: 800; font-size: 14px; margin-top: 8px; }
.fb-kinds { display: flex; flex-wrap: wrap; gap: 6px; }
.fb-form input, .fb-form textarea {
  width: 100%; border: 1.5px solid var(--line-2); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 14px;
  background: #fff; color: var(--ink); outline: none;
}
.fb-form input:focus, .fb-form textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(29, 107, 87, .12); }
.fb-msg { font-size: 13.5px; font-weight: 700; color: var(--muted); }
.fb-banner-slot { margin-top: 8px; }
.cfb-ok { padding: 11px 14px; border-radius: 12px; background: #ecfdf5; border: 1.5px solid #86efac; color: #166534; font-size: 13.5px; font-weight: 700; }
.cfb-box { padding: 12px 14px; border-radius: 14px; background: #fffbeb; border: 1.5px solid #fcd34d; color: #78350f; font-size: 13px; line-height: 1.55; }
.cfb-hd { font-weight: 800; color: #92400e; margin-bottom: 3px; }
.cfb-hd code { background: #fef3c7; border: 1px solid #fde68a; border-radius: 5px; padding: 1px 5px; font-size: 12px; }
.cfb-sub { font-size: 12px; color: #92400e; opacity: .94; margin-bottom: 9px; }
.cfb-btns { display: flex; flex-wrap: wrap; gap: 7px; }
.cfb-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 35px; padding: 5px 12px;
  border-radius: 10px; border: 1.5px solid #f59e0b; background: #fff; color: #92400e !important;
  font: inherit; font-size: 12.5px; font-weight: 800; text-decoration: none !important; cursor: pointer;
  transition: background .15s, transform .12s;
}
.cfb-btn:hover { background: #fef3c7; transform: translateY(-1px); }
.cfb-btn.primary { background: var(--brand); border-color: var(--brand); color: #fff !important; }
.cfb-btn.primary:hover { background: var(--brand-d); border-color: var(--brand-d); }
body.modal-open { overflow: hidden; }

/* ------------------------------------------------------------ 校園互動：車隊・行人・萌寵・樹木・飛機 */
.campus-map .fun-spot, .campus-map .parked-car, .campus-map .parking-sign, .campus-map .campus-vehicle,
.campus-map .animal, .campus-map .lake-fish, .campus-map .ped, .campus-map .plane { cursor: pointer; outline: none; }
.campus-map .bld-in, .campus-map .spot-in, .campus-map .car-in, .campus-map .animal-in, .campus-map .fish-swim,
.campus-map .court-ball, .campus-map .bobber-float, .campus-map .bobber-ring, .campus-map .ped-in,
.campus-map .m-fx, .campus-map .lbl:not(.lbl-banner) .lbl-s > :not(.lbl-hit) { pointer-events: none; }
.campus-map .fun-pop text, .campus-map .float-fx, .campus-map .veh-tag text, .campus-map .plane text { font-family: var(--font); }

.campus-map .lake-fish .fish-swim { transform-box: fill-box; transform-origin: center; animation: cm-fish 6.5s ease-in-out infinite; }
.campus-map .lake-fish:nth-child(2n) .fish-swim { animation-duration: 8.2s; animation-direction: reverse; }
.campus-map .lake-fish:nth-child(3n) .fish-swim { animation-duration: 5.4s; }
@keyframes cm-fish { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(14px, -6px) rotate(6deg); } }
.campus-map .bobber-float { transform-box: fill-box; transform-origin: center; animation: cm-bobber 2.1s ease-in-out infinite; }
.campus-map .bobber-ring { transform-box: fill-box; transform-origin: center; animation: cm-ripple 2.4s ease-out infinite; }
@keyframes cm-bobber { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
@keyframes cm-ripple { 0% { transform: scale(.7); opacity: .85; } 100% { transform: scale(1.7); opacity: 0; } }

.campus-map .parked-car { transition: opacity .25s ease; }
.campus-map .parked-car .car-in { transform-box: fill-box; transform-origin: center; transition: transform .18s ease; }
.campus-map .parked-car.hover .car-in, .campus-map .parked-car:focus-visible .car-in { transform: translateY(-4px) scale(1.08); }
.campus-map .parked-car.car-out { opacity: .25; }
.campus-map .parking-sign.hover rect, .campus-map .parking-sign:hover rect { stroke: #fbbf24; stroke-width: 2.5; }
.campus-map .campus-vehicle.hover .veh-rot, .campus-map .campus-vehicle:hover .veh-rot { filter: brightness(1.08); }
/* 停好的車只顯示頭像小圓章（名字看 tooltip／在線名單），行駛中才顯示名牌，避免擋住學院名稱 */
.campus-map .campus-vehicle .veh-tag { display: none; }
.campus-map .campus-vehicle.moving .veh-tag { display: inline; }
.campus-map .campus-vehicle.moving .veh-badge { display: none; }
.campus-map .veh-badge text, .campus-map .car-cluster text { font-family: var(--font); }
.campus-map .campus-vehicle.hover .veh-badge circle, .campus-map .car-cluster.hover rect { stroke-width: 3; }

.campus-map .fun-spot .spot-in { transition: transform .18s ease; }
.campus-map .fun-spot.hover .spot-in, .campus-map .fun-spot:focus-visible .spot-in { transform: translateY(-5px); }
.campus-map .court-ball { transform-box: fill-box; transform-origin: center; animation: cm-ball 1.8s ease-in-out infinite; }
@keyframes cm-ball { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

.campus-map .animal .animal-in {
  transform-box: fill-box; transform-origin: center bottom;
  transition: transform .2s cubic-bezier(.2, .9, .3, 1.4); animation: cm-pet-idle 3.6s ease-in-out infinite;
}
.campus-map .animal:nth-child(2n) .animal-in { animation-delay: -1.4s; }
.campus-map .animal:nth-child(3n) .animal-in { animation-delay: -2.5s; }
.campus-map .animal.hover .animal-in, .campus-map .animal:focus-visible .animal-in { transform: translateY(-6px) scale(1.14); }
.campus-map .animal.animal-jump .animal-in { animation: cm-pet-jump .65s cubic-bezier(.2, .9, .3, 1.4) 2; }
@keyframes cm-pet-idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
@keyframes cm-pet-jump {
  0%, 100% { transform: translateY(0) scale(1); }
  45% { transform: translateY(-13px) scale(1.18) rotate(-5deg); }
  75% { transform: translateY(-5px) scale(1.08) rotate(4deg); }
}
.campus-map .hidden-frog g { transform-box: fill-box; transform-origin: center bottom; }
.campus-map .hidden-frog.frog-found g { animation: cm-frog .9s cubic-bezier(.2, .9, .3, 1.4) 2; }
@keyframes cm-frog { 0%, 100% { transform: none; } 40% { transform: translateY(-9px) scale(1.6); } }

/* 🪓 樹木：直接點擊砍樹 */
.campus-map .m-deco { pointer-events: none; }
.campus-map .m-deco .tree { pointer-events: visiblePainted; cursor: pointer; }
.campus-map .tree-in { transform-box: fill-box; transform-origin: 50% 100%; }
.campus-map .tree:hover .tree-in { filter: brightness(1.07); }
.campus-map .tree-in.chop { animation: cm-chop .3s ease-out; }
.campus-map .tree-in.fall { animation: cm-fall .48s ease-in forwards; }
.campus-map .tree-in.regrow { animation: cm-grow 1.4s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes cm-chop { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-7deg); } 65% { transform: rotate(5deg); } }
@keyframes cm-fall { to { transform: rotate(84deg) translateY(4px); opacity: 0; } }
@keyframes cm-grow { from { transform: scale(.15); opacity: .4; } to { transform: scale(1); opacity: 1; } }
.campus-map .float-fx { font-size: 13px; font-weight: 900; fill: #92400e; paint-order: stroke; stroke: #fff; stroke-width: 3px; animation: cm-float .75s ease-out forwards; }
@keyframes cm-float { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-22px); opacity: 0; } }

/* 🧑‍🎓 行人 */
.campus-map .ped .leg { transform-box: fill-box; transform-origin: 50% 0; }
.campus-map .ped.walking .leg { animation: cm-leg .4s ease-in-out infinite alternate; }
.campus-map .ped.walking .leg.r { animation-direction: alternate-reverse; }
.campus-map .ped.playing .ped-in { transform-box: fill-box; transform-origin: 50% 100%; animation: cm-hop .55s ease-in-out infinite alternate; }
.campus-map .ped:hover .ped-in { filter: brightness(1.08); }
@keyframes cm-leg { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
@keyframes cm-hop { from { transform: translateY(0); } to { transform: translateY(-4px); } }

/* ✈️ 飛機 */
.campus-map .plane .prop { transform-box: fill-box; transform-origin: center; animation: cm-prop .12s linear infinite; }
@keyframes cm-prop { 50% { transform: scaleY(.15); } }
.campus-map .fun-pop-in { transform-box: fill-box; transform-origin: center bottom; animation: cm-pop .24s cubic-bezier(.2, .9, .3, 1.3); }
@keyframes cm-pop { from { opacity: 0; transform: translateY(8px) scale(.85); } to { opacity: 1; transform: none; } }

.mc.mc-fun { border-color: #d97706; background: linear-gradient(180deg, #fffbeb, #fef3c7); color: #92400e; }
.mc.mc-fun:hover { background: #fde68a; border-color: #b45309; }
.mc.mc-fb { border-color: var(--brand); background: #eef7f3; color: var(--brand); }
.mc.mc-fb:hover { background: #dff0e8; border-color: var(--brand-d); }

/* 頂部：學生證、在線名單＆意見回饋 */
.stu-chip, .online-chip, .fb-chip {
  display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 12px; border-radius: 999px;
  font-size: 13px; font-weight: 800; cursor: pointer; white-space: nowrap; transition: transform .15s, background .15s;
}
.fb-chip { background: #eef7f3; border: 1.5px solid var(--brand); color: var(--brand); }
.fb-chip:hover { background: #dff0e8; transform: translateY(-1px); }
.stu-chip { background: #fffbeb; border: 1.5px solid #f59e0b; color: #92400e; }
.stu-chip:hover { background: #fef3c7; transform: translateY(-1px); }
.online-chip { background: #ecfdf5; border: 1.5px solid #34d399; color: #065f46; }
.online-chip:hover { background: #d1fae5; transform: translateY(-1px); }
.online-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: cm-online 1.8s ease-in-out infinite; }
@keyframes cm-online { 0%, 100% { box-shadow: 0 0 0 2px rgba(16, 185, 129, .3); } 50% { box-shadow: 0 0 0 5px rgba(16, 185, 129, .06); } }

/* 底部專車導航列、伐木挑戰 HUD */
.car-hud {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 25; width: min(800px, calc(100% - 120px));
  background: rgba(255, 253, 248, .97); border: 2px solid var(--gold); border-radius: 18px; padding: 9px 13px 10px;
  box-shadow: 0 14px 34px rgba(59, 47, 37, .22);
}
.car-hud-top { display: flex; align-items: center; justify-content: space-between; gap: 8px 10px; flex-wrap: wrap; }
.car-hud-title { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 800; }
.car-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #3b2f25; flex: none; }
.car-hud-ctrls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.car-btn, .car-close {
  height: 27px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-2);
  background: #fff; color: var(--ink); font-size: 12px; font-weight: 800; cursor: pointer;
}
.car-close { width: 27px; padding: 0; color: var(--muted); }
.car-btn:hover, .car-btn.on { border-color: var(--brand); color: var(--brand); background: #eef7f3; }
.car-hud-pills { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: 7px; padding-bottom: 2px; }
.car-hud-pills::-webkit-scrollbar { display: none; }
.car-hud-lbl { font-size: 12px; font-weight: 800; color: var(--muted); flex: none; }
.car-pill {
  flex: none; height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line-2); background: #fffaf0;
  color: var(--ink); font-size: 12.5px; font-weight: 800; cursor: pointer; white-space: nowrap; transition: background .15s, transform .12s;
}
.car-pill:hover { background: #eef7f3; border-color: var(--brand); color: var(--brand); transform: translateY(-1px); }
.chop-hud {
  position: absolute; left: 50%; top: 58px; transform: translateX(-50%); z-index: 26; display: flex; align-items: center; gap: 10px;
  padding: 8px 10px 8px 14px; border-radius: 999px; background: #fffdf8; border: 2px solid #92400e;
  box-shadow: 0 10px 26px rgba(59, 47, 37, .22); font-size: 13.5px; font-weight: 800; white-space: nowrap;
}
.chop-hud .ch-t { font-variant-numeric: tabular-nums; color: #92400e; }
.chop-hud .ch-t.warn { color: #dc2626; animation: cm-online 1s infinite; }
.chop-hud .ch-bar { width: 110px; height: 9px; border-radius: 9px; background: #f1e4cf; overflow: hidden; }
.chop-hud .ch-bar i { display: block; height: 100%; background: linear-gradient(90deg, #f59e0b, #16a34a); transition: width .2s; }
.chop-hud.win { border-color: #16a34a; background: #f0fdf4; padding-right: 16px; }
.chop-hud.lose { border-color: #dc2626; background: #fef2f2; padding-right: 16px; }

/* 🏅 成就解鎖提示 */
.badge-toast {
  position: fixed; left: 50%; top: 74px; z-index: 120; display: flex; align-items: center; gap: 12px;
  min-width: 280px; max-width: calc(100% - 24px); padding: 11px 16px 11px 12px; border-radius: 18px;
  background: linear-gradient(135deg, #fffbeb, #fff); border: 2px solid #f59e0b; box-shadow: 0 18px 40px rgba(146, 64, 14, .25);
  transform: translate(-50%, -140%); opacity: 0; transition: transform .35s cubic-bezier(.2, .9, .3, 1.2), opacity .3s; pointer-events: none;
}
.badge-toast.show { transform: translate(-50%, 0); opacity: 1; }
.badge-toast div { display: flex; flex-direction: column; line-height: 1.3; }
.badge-toast small { font-size: 11.5px; font-weight: 800; color: #b45309; }
.badge-toast b { font-size: 16px; }
.badge-toast span:last-child { font-size: 12px; color: var(--muted); }
.bt-ic { width: 48px; height: 48px; flex: none; display: grid; place-items: center; font-size: 26px; border-radius: 14px; }

/* 徽章（成就等級色） */
.bdg { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 9px; font-size: 15px; border: 1.5px solid; margin: 0 3px 3px 0; }
.bdg.more { width: auto; padding: 0 6px; font-size: 11px; font-weight: 800; color: var(--muted); border-color: var(--line-2); background: #fff; }
.t1, .bdg.t1 { background: #fdf0e3; border-color: #d6a77a; }
.t2, .bdg.t2 { background: #f1f5f9; border-color: #94a3b8; }
.t3, .bdg.t3 { background: #fef9c3; border-color: #eab308; }
.t4, .bdg.t4 { background: linear-gradient(135deg, #ede9fe, #dcfce7); border-color: #8b5cf6; }

/* 共用：視窗標題、統計膠囊、分頁 */
.fun-modal, .stu-modal, .online-modal { width: min(780px, 100%); padding: 20px 22px 22px; }
.fun-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 0 40px 10px 0; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.fun-tabs::-webkit-scrollbar { display: none; }
.fun-tab, .seg-tab {
  flex: none; height: 34px; padding: 0 13px; border-radius: 999px; border: 1.5px solid var(--line-2);
  background: #fffaf0; color: var(--muted); font-size: 13px; font-weight: 800; cursor: pointer; white-space: nowrap;
}
.fun-tab:hover, .seg-tab:hover { border-color: var(--brand); color: var(--ink); }
.fun-tab.on, .seg-tab.on { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 3px 10px rgba(29, 107, 87, .24); }
.seg-tabs { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.seg-sp { flex: 1; }
.fg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.fg-head h2 { margin: 0; font-size: 20px; }
.fg-sub { margin: 3px 0 0 !important; font-size: 13px !important; color: var(--muted) !important; line-height: 1.6 !important; }
.fg-stats { display: flex; flex-wrap: wrap; gap: 6px; }
.fg-badge {
  display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 11px; border-radius: 999px;
  background: #f6efe1; border: 1px solid var(--line-2); font-size: 12.5px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.fg-badge.gold { background: #fef3c7; border-color: #f59e0b; color: #92400e; }
.fg-sec { margin: 16px 0 8px; font-size: 14px; font-weight: 800; }

/* 🎮 小遊戲舞台 */
.g-stage { position: relative; border-radius: 16px; overflow: hidden; border: 2px solid var(--line-2); background: #0f172a; }
.g-cvs { display: block; width: 100%; height: auto; aspect-ratio: auto; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
.g-ov { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(15, 23, 42, .42); padding: 12px; }
.g-card {
  width: min(340px, 100%); text-align: center; background: #fffdf8; border-radius: 20px; padding: 18px 18px 16px;
  box-shadow: 0 18px 44px rgba(0, 0, 0, .3); border: 2px solid var(--line-2); animation: cm-pop .28s cubic-bezier(.2, .9, .3, 1.3);
}

.nw-stats { display: flex; flex-wrap: wrap; gap: 6px; }
.nw-stat {
  display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 11px; border-radius: 999px;

.nw-rank { display: grid; gap: 7px; }

  align-items: center; gap: 10px;
}
.nw-rk { grid-area: rk; font-size: 20px; text-align: center; line-height: 1; }

.nw-rname {

}

  .nw-grid { gap: 14px 10px; }

  <script>/* js/core.js */
/* 開心學園 · core.js — 共用核心：registry、執行環境、網址組裝、最近造訪、搜尋、IME 安全 Enter、提示訊息
 *
 * registry 來源：window.CAMPUS_REGISTRY（本機 server 由 /js/registry_data.js 產生；單一檔建置時內嵌）。
 * 執行環境：
 *   - github：*.github.io      → 公開網址
 *   - file：file:// 單一檔     → 公開網址
 *   - cloudtop：:8918 / :8919  → http://<location.hostname>:<local_port>/<local_hash|hash>
 */
(function () {
  'use strict';
  var C = (window.CAMPUS = window.CAMPUS || {});
  var VISITS_KEY = 'okayell.campus.visits.v1';
  var CAMPUS_PORTS = ['8918', '8919'];

  /* ------------------------------------------------------------ 小工具 */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function qs(name, search) {
    try { return new URLSearchParams(search == null ? location.search : search).get(name); }
    catch (e) { return null; }
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function stripHash(u) { var i = String(u || '').indexOf('#'); return i >= 0 ? u.slice(0, i) : String(u || ''); }
  function normHash(h) {
    h = String(h || '').trim();
    if (!h) return '';
    if (h.charAt(0) === '#') return h;
    if (h.charAt(0) !== '/') h = '/' + h;
    return '#' + h;
  }

  /* ------------------------------------------------------------ registry */
  var raw = window.CAMPUS_REGISTRY;
  var reg = { brand: {}, campus: {}, districts: [], buildings: [] };
  if (raw && typeof raw === 'object') {
    reg.brand = raw.brand || {};
    reg.campus = raw.campus || {};
    reg.districts = Array.isArray(raw.districts) ? raw.districts.filter(function (d) { return d && d.id; }) : [];
    reg.buildings = Array.isArray(raw.buildings) ? raw.buildings.filter(function (b) { return b && b.id; }) : [];
  }
  reg.buildings.forEach(function (b) {
    b.features = Array.isArray(b.features) ? b.features : [];
    b.links = Array.isArray(b.links) ? b.links : [];
    b.related = Array.isArray(b.related) ? b.related : [];
    b.aliases = Array.isArray(b.aliases) ? b.aliases : [];
    b.status = b.status || 'live';
    b.kind = b.kind || 'academy';
  });
  var byId = {};
  var districtById = {};
  reg.buildings.forEach(function (b) { byId[b.id] = b; });
  reg.districts.forEach(function (d) { districtById[d.id] = d; });

  // 別名表（小寫）：id、aliases、repo 名稱、子資料夾名稱 → 建築 id
  var aliasMap = {};
  // id 優先（強），aliases / repo / 子資料夾為弱別名：不覆蓋已存在的對應
  function addAlias(k, id, weak) {
    k = String(k || '').toLowerCase().replace(/^\/+|\/+$/g, '');
    if (!k) return;
    if (weak && aliasMap[k]) return;
    aliasMap[k] = id;
  }
  reg.buildings.forEach(function (b) { addAlias(b.id, b.id); });
  reg.buildings.forEach(function (b) { b.aliases.forEach(function (a) { addAlias(a, b.id, true); }); });
  reg.buildings.forEach(function (b) {
    if (b.repo && b.repo !== reg.campus.repo) addAlias(b.repo, b.id, true);
    if (b.path) addAlias(b.path, b.id, true);
  });

  function building(idOrAlias) {
    if (!idOrAlias) return null;
    var k = String(idOrAlias).toLowerCase().trim().replace(/^\/+|\/+$/g, '');
    if (byId[k]) return byId[k];
    var id = aliasMap[k];
    return id ? byId[id] : null;
  }
  function districtOf(b) { return b ? districtById[b.district] || null : null; }
  function district(id) {
    if (!id) return null;
    var k = String(id).toLowerCase().trim();
    if (districtById[k]) return districtById[k];
    // 也接受中文名稱（例：語言學區 / 語言）
    for (var i = 0; i < reg.districts.length; i++) {
      var d = reg.districts[i];
      if (d.name === id || String(d.name || '').replace('學區', '') === id) return d;
    }
    return null;
  }

  /* ------------------------------------------------------------ 執行環境與網址 */
  function detectEnv() {
    var loc = window.location;
    var host = loc.hostname || '';
    if (loc.protocol === 'file:') return { mode: 'file' };
    if (/(^|\.)github\.io$/i.test(host)) return { mode: 'github' };
    if (loc.protocol === 'http:' || loc.protocol === 'https:') {
      return { mode: 'cloudtop', host: host, proto: loc.protocol };
    }
    return { mode: 'other' };
  }
  var env = detectEnv();

  function isLive(b) { return !!(b && b.status !== 'planned' && b.url); }
  // 支援直接主機名（host:port）與反向代理編碼子網域（a+30hex / b+54hex，將 4 位數 hex port 寫入子網域且不加 :port）
  function localOrigin(port) {
    var p = parseInt(port, 10);
    if (env.mode !== 'cloudtop' || !(p > 0 && p < 65536)) return '';
    var host = env.host || '';
    var dot = host.indexOf('.');
    if (dot > 0) {
      var label = host.slice(0, dot);
      var pHex = ('0000' + p.toString(16)).slice(-4).toLowerCase();
      if (label.length === 31 && /^a[0-9a-f]{30}$/i.test(label)) {
        return env.proto + '//' + (label.slice(0, 9) + pHex + label.slice(13)).toLowerCase() + host.slice(dot);
      }
      if (label.length === 55 && /^b[0-9a-f]{54}$/i.test(label)) {
        return env.proto + '//' + (label.slice(0, 33) + pHex + label.slice(37)).toLowerCase() + host.slice(dot);
      }
    }
    return env.proto + '//' + host + ':' + p;
  }
  function currentLocalPort() {
    if (window.location.port) return window.location.port;
    var host = env.host || '';
    var dot = host.indexOf('.');
    if (dot > 0) {
      var label = host.slice(0, dot);
      if (label.length === 31 && /^a[0-9a-f]{30}$/i.test(label)) return String(parseInt(label.slice(9, 13), 16));
      if (label.length === 55 && /^b[0-9a-f]{54}$/i.test(label)) return String(parseInt(label.slice(33, 37), 16));
    }
    return '';
  }
  function localBase(b) {
    if (env.mode !== 'cloudtop' || !b || !b.local_port) return '';
    var orig = localOrigin(b.local_port);
    return orig ? orig + '/' : '';
  }
  function publicUrl(b) { return b && b.url ? b.url : ''; }
  // 主要入口：Local (cloudtop) 版一律使用 Local 網址；GitHub / file 版一律使用 GitHub 公開網址
  function primaryUrl(b) {
    if (!isLive(b)) return '';
    var lb = localBase(b);
    if (lb) return lb + (b.local_hash || '');
    return publicUrl(b);
  }
  function linkUrl(b, hash) {
    if (!isLive(b)) return '';
    var h = normHash(hash);
    var lb = localBase(b);
    if (lb) return lb + h;
    return stripHash(publicUrl(b)) + h;
  }
  function localUrl(b) {
    var lb = localBase(b);
    return lb ? lb + (b.local_hash || '') : '';
  }
  // 校園首頁網址（404 頁、分享用）
  function campusHome() {
    if (env.mode === 'file') return 'index.html';
    if (env.mode === 'github') return window.location.origin + '/';
    if (env.mode === 'cloudtop') {
      var p = currentLocalPort();
      if (p && CAMPUS_PORTS.indexOf(p) >= 0) return window.location.origin + '/';
      return localOrigin(CAMPUS_PORTS[0]) + '/';
    }
    return reg.campus.public_url || 'https://okayell.github.io/';
  }
  function shortUrl(b) {
    var a = b && (b.aliases[0] || b.id);
    if (env.mode === 'cloudtop') {
      return a ? window.location.host + '/' + a : '';
    }
    var base = String(reg.campus.public_url || 'https://okayell.github.io/').replace(/^https?:\/\//, '');
    return a ? base + a : '';
  }

  /* Cloudtop 即時服務狀態（/api/status，伺服器端 ≤5 秒快取） */
  var status = { ports: null, at: 0, inflight: null };
  C.portUp = function (b) {
    if (!b || !b.local_port || !status.ports) return null;
    var v = status.ports[String(b.local_port)];
    return v == null ? null : !!v;
  };
  C.refreshStatus = function (force) {
    if (env.mode !== 'cloudtop') return Promise.resolve(null);
    if (status.inflight) return status.inflight;
    if (!force && status.ports && Date.now() - status.at < 8000) return Promise.resolve(status.ports);
    status.inflight = fetch('/api/status', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        status.inflight = null;
        if (j && j.ports) {
          status.ports = j.ports;
          status.at = Date.now();
          C.emit('status', status.ports);
        }
        return status.ports;
      })
      .catch(function () { status.inflight = null; return null; });
    return status.inflight;
  };

  /* ------------------------------------------------------------ 最近造訪（campus_nav.js 也寫同一個 key） */
  function readVisits() {
    try {
      var v = JSON.parse(window.localStorage.getItem(VISITS_KEY) || '{}');
      return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
    } catch (e) { return {}; }
  }
  function recentVisits(limit) {
    var v = readVisits();
    return Object.keys(v)
      .filter(function (id) { return byId[id] && isLive(byId[id]) && typeof v[id] === 'number'; })
      .sort(function (a, b) { return v[b] - v[a]; })
      .slice(0, limit || 6)
      .map(function (id) { return { b: byId[id], at: v[id] }; });
  }
  function recordVisit(id) {
    if (!id || !byId[id]) return;
    try {
      var v = readVisits();
      v[id] = Date.now();
      window.localStorage.setItem(VISITS_KEY, JSON.stringify(v));
    } catch (e) { /* 無痕模式：略過 */ }
    C.emit('visit', id);
  }
  function timeAgo(ts) {
    var s = Math.max(0, (Date.now() - ts) / 1000);
    if (s < 60) return '剛剛';
    if (s < 3600) return Math.floor(s / 60) + ' 分鐘前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小時前';
    if (s < 86400 * 30) return Math.floor(s / 86400) + ' 天前';
    return new Date(ts).toLocaleDateString('zh-TW');
  }

  /* ------------------------------------------------------------ 搜尋 */
  function norm(s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
  var searchIndex = reg.buildings.map(function (b) {
    var d = districtById[b.district] || {};
    return {
      b: b,
      name: norm(b.name), en: norm(b.en), aliases: b.aliases.map(norm).concat([norm(b.id)]),
      district: norm((d.name || '') + ' ' + (d.en || '')),
      meta: norm([b.tagline].concat(b.features, b.links.map(function (l) { return l.label; })).join(' ')),
      desc: norm(b.desc),
    };
  });
  function scoreToken(e, t) {
    var s = 0;
    if (e.aliases.indexOf(t) >= 0) s = Math.max(s, 100);
    if (e.name === t) s = Math.max(s, 100);
    else if (e.name.indexOf(t) === 0) s = Math.max(s, 90);
    else if (e.name.indexOf(t) >= 0) s = Math.max(s, 80);
    if (e.en.indexOf(t) >= 0) s = Math.max(s, e.en.indexOf(t) === 0 ? 70 : 60);
    if (e.aliases.some(function (a) { return a.indexOf(t) === 0; })) s = Math.max(s, 65);
    if (e.district.indexOf(t) >= 0) s = Math.max(s, 45);
    if (e.meta.indexOf(t) >= 0) s = Math.max(s, 35);
    if (e.desc.indexOf(t) >= 0) s = Math.max(s, 18);
    return s;
  }
  function search(q) {
    var tokens = norm(q).split(' ').filter(Boolean);
    if (!tokens.length) return [];
    var res = [];
    searchIndex.forEach(function (e, i) {
      var total = 0;
      for (var k = 0; k < tokens.length; k++) {
        var s = scoreToken(e, tokens[k]);
        if (!s) return;
        total += s;
      }
      if (e.b.status === 'planned') total -= 5;
      res.push({ b: e.b, score: total, order: i });
    });
    res.sort(function (a, b) { return b.score - a.score || a.order - b.order; });
    return res;
  }

  /* ------------------------------------------------------------ IME 安全 Enter（注音／倉頡選字時的 Enter 不送出） */
  var ime = { composing: false, endAt: 0 };
  document.addEventListener('compositionstart', function () { ime.composing = true; }, true);
  document.addEventListener('compositionend', function () { ime.composing = false; ime.endAt = Date.now(); }, true);
  function isEnterSend(ev) {
    return ev.key === 'Enter' && !ev.isComposing && ev.keyCode !== 229 && !ime.composing && Date.now() - ime.endAt >= 150;
  }

  /* ------------------------------------------------------------ 事件、提示、複製 */
  var listeners = {};
  C.on = function (name, fn) { (listeners[name] = listeners[name] || []).push(fn); };
  C.emit = function (name, data) { (listeners[name] || []).forEach(function (fn) { try { fn(data); } catch (e) { /* 單一監聽失敗不影響其他 */ } }); };

  var toastTimer = 0;
  function toast(msg, kind) {
    var el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      el.setAttribute('role', 'status');
      el.setAttribute('aria-live', 'polite');
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.className = 'toast show ' + (kind || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'toast ' + (kind || ''); }, 2600);
  }
  function copyText(text) {
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return Promise.resolve(ok);
      } catch (e) { return Promise.resolve(false); }
    }
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, fallback);
    }
    return fallback();
  }

  /* ------------------------------------------------------------ 意見回饋多通道寄送（靜態／GitHub Pages 3.6s timeout + 一鍵備援卡） */
  var DEFAULT_FB_EMAIL = 'okayell@hotmail.com';
  var GH_ISSUES_URL = 'https://github.com/okayell/okayell.github.io/issues/new';

  function feedbackLinks(opts) {
    opts = opts || {};
    var email = opts.email || DEFAULT_FB_EMAIL;
    var tool = opts.tool || '開心學園';
    var kindLabel = opts.kindLabel || '💬 意見回饋';
    var title = String(opts.title || '').trim();
    var description = String(opts.description || '').trim();
    var subject = '[' + tool + ' 意見回饋] ' + kindLabel + ' — ' + title;
    var body = '工具名稱：' + tool + '\n回饋類型：' + kindLabel + '\n標題：' + title + '\n\n內容描述：\n' + description + '\n';
    var copyPayload = '收件信箱：' + email + '\n主旨：' + subject + '\n\n' + body;
    return {
      email: email,
      subject: subject,
      body: body,
      copyPayload: copyPayload,
      mailto: 'mailto:' + email + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body),
      gmail: 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(email) + '&su=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body),
      outlook: 'https://outlook.live.com/mail/0/deeplink/compose?to=' + encodeURIComponent(email) + '&subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body),
      github: (opts.repoIssues || GH_ISSUES_URL) + '?title=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body),
    };
  }

  function postJsonWithTimeout(url, payload, ms) {
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { try { ctrl.abort(); } catch (e) { /* ignore */ } }, ms || 3600) : 0;
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify(payload),
      signal: ctrl ? ctrl.signal : undefined,
    }).then(function (r) {
      clearTimeout(timer);
      return r.json().catch(function () { return {}; }).then(function (d) {
        var ok = r.ok && (d.success === true || d.success === 'true' || d.success === 1 || d.success === '1' || d.ok === true);
        return { ok: ok, status: r.status, data: d };
      });
    }, function () {
      clearTimeout(timer);
      return { ok: false, status: 0, data: {} };
    });
  }

  function sendStaticFeedback(opts) {
    opts = opts || {};
    var links = feedbackLinks(opts);
    var relay = window.CAMPUS_FEEDBACK_RELAY || '';
    if (env.mode === 'file' && !relay) {
      return Promise.resolve({ sent: false, channel: 'file_offline', links: links });
    }
    var payload = {
      _subject: links.subject,
      _template: 'table',
      _captcha: 'false',
      '工具名稱': opts.tool || '開心學園',
      '回饋類型': opts.kindLabel || '💬 意見回饋',
      '標題': String(opts.title || '').trim(),
      '內容描述': String(opts.description || '').trim(),
      '送出時間': opts.createdAt || new Date().toISOString().slice(0, 19).replace('T', ' '),
    };
    var tryRelay = relay ? postJsonWithTimeout(relay, payload, 3600) : Promise.resolve({ ok: false });
    return tryRelay.then(function (r1) {
      if (r1 && r1.ok) return { sent: true, channel: 'relay', links: links };
      return postJsonWithTimeout('https://formsubmit.co/ajax/' + links.email, payload, 3600).then(function (r2) {
        if (r2 && r2.ok) return { sent: true, channel: 'formsubmit', links: links };
        return { sent: false, channel: 'fallback', links: links };
      });
    });
  }

  function feedbackFallbackHtml(opts) {
    var links = (opts && opts.links) || feedbackLinks(opts);
    var note = (opts && opts.note) || '✅ 您的回饋已先保存在本機紀錄；因靜態網頁自動寄信服務暫時忙碌，請任選下方一種方式一鍵寄達站長：';
    return '<div class="cfb-box">' +
      '<div class="cfb-hd">📬 <b>請選擇任一方式一鍵寄出</b>（主旨與內容皆已自動帶入，收件信箱：<code>' + esc(links.email) + '</code>）</div>' +
      '<div class="cfb-sub">' + esc(note) + '</div>' +
      '<div class="cfb-btns">' +
        '<a class="cfb-btn primary" href="' + esc(links.gmail) + '" target="_blank" rel="noopener">📧 用 Gmail 網頁寄出</a>' +
        '<a class="cfb-btn" href="' + esc(links.outlook) + '" target="_blank" rel="noopener">📬 用 Outlook 寄出</a>' +
        '<a class="cfb-btn" href="' + esc(links.mailto) + '">📱 開啟手機／預設信箱 App</a>' +
        '<button type="button" class="cfb-btn" data-campus-fb-copy="' + esc(links.copyPayload) + '" data-campus-fb-email="' + esc(links.email) + '">📋 複製信件內容與信箱</button>' +
        '<a class="cfb-btn" href="' + esc(links.github) + '" target="_blank" rel="noopener">🐙 GitHub Issue 留言</a>' +
      '</div></div>';
  }

  document.addEventListener('click', function (e) {
    var cp = e.target && e.target.closest ? e.target.closest('[data-campus-fb-copy]') : null;
    if (!cp) return;
    e.preventDefault();
    var txt = cp.getAttribute('data-campus-fb-copy') || '';
    var em = cp.getAttribute('data-campus-fb-email') || DEFAULT_FB_EMAIL;
    copyText(txt).then(function (ok) {
      var orig = cp.getAttribute('data-orig-label') || cp.textContent;
      cp.setAttribute('data-orig-label', orig);
      cp.textContent = ok ? ('✅ 已複製！可貼到信箱寄至 ' + em) : ('信箱：' + em);
      toast(ok ? ('✅ 已複製信件內容與收件信箱 ' + em) : ('收件信箱：' + em));
      setTimeout(function () { cp.textContent = orig; }, 3800);
    });
  }, true);

  /* ------------------------------------------------------------ ?go= 立即轉址（盡早執行，地圖不必畫） */
  function goTarget(search) {
    var go = qs('go', search);
    if (!go) return null;
    var b = building(go);
    if (!b) return { error: go };
    if (!isLive(b)) return { planned: b };
    var to = qs('to', search);
    return { b: b, url: to ? linkUrl(b, to) : primaryUrl(b) };
  }

  C.VERSION_KEY = 'okayell.campus';
  C.reg = reg;
  C.aliases = aliasMap;
  C.env = env;
  C.util = { esc: esc, qs: qs, clamp: clamp, normHash: normHash, stripHash: stripHash, timeAgo: timeAgo };
  C.building = building;
  C.district = district;
  C.districtOf = districtOf;
  C.isLive = isLive;
  C.primaryUrl = primaryUrl;
  C.publicUrl = publicUrl;
  C.linkUrl = linkUrl;
  C.localUrl = localUrl;
  C.campusHome = campusHome;
  C.shortUrl = shortUrl;
  C.recentVisits = recentVisits;
  C.recordVisit = recordVisit;
  C.search = search;
  C.isEnterSend = isEnterSend;
  C.toast = toast;
  C.copyText = copyText;
  C.feedbackLinks = feedbackLinks;
  C.sendStaticFeedback = sendStaticFeedback;
  C.feedbackFallbackHtml = feedbackFallbackHtml;
  C.goTarget = goTarget;
  C.registryError = window.CAMPUS_REGISTRY_ERROR || (raw ? '' : '找不到校園資料（registry）');

  var go = goTarget();
  if (go && go.url) {
    C.redirecting = go;
    document.documentElement.className += ' redirecting';
    recordVisit(go.b.id);
    window.location.replace(go.url);
  }
})();

</script>

  <script>/* js/art.js */
/* 開心學園 · 校園建築插畫 (CampusArt)
 * Plain browser script — ES2017, no modules, no DOM access; also loads in Node (globalThis.CampusArt).
 *
 *   CampusArt.draw(art, o)      → building markup (no outer <svg>)
 *   CampusArt.lot(o)            → empty 預定地 plot filling o.w × o.h
 *   CampusArt.serviceCenter(o)  → 學園服務中心 clock tower (nominal 150×165)
 *   CampusArt.gate(o)           → 校門 (nominal 300×125; the road, 64 wide, passes through x∈[-32,32])
 *   CampusArt.bull(o)           → bronze charging bull on a plinth (nominal 64×46)
 *   CampusArt.deco(kind, o)     → 'tree' | 'pine' | 'palm' | 'sakura' | 'bush' | 'lamp' | 'bench' | 'flag'  (o.s = scale)
 *   CampusArt.defs()            → shared <defs> markup (none needed → '')
 *   CampusArt.arts / size(art)  → supported keys / nominal {w, h}
 *
 * Local coordinates: (0,0) = bottom-centre of the front baseline; the art fills x∈[-w/2, w/2], y∈[-h, 0]
 * (up = negative y); a soft ground shadow may reach y≤+10. Every art is drawn at its nominal size and
 * scaled uniformly by min(w/W0, h/H0), staying bottom-centred.
 * o = {w, h, color, soft, status: 'live'|'new'|'planned', icon, id, name}
 */
(function (root) {
  'use strict';

  const OL = '#4a3b2f';
  const FONT = "-apple-system,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif";
  const C = {
    cream: '#fbf3e4', sand: '#f1dfc0', brick: '#d98b5f', stone: '#e9e1d3', roof: '#c8553d',
    slate: '#5b7c99', copper: '#6aa38f', win: '#fff6d5', glass: '#cfe8f7',
    gold: '#e8b03a', navy: '#2f4a6b', red: '#d9473c', wood: '#a8754f', leaf: '#7fb069', paper: '#fffaf0'
  };
  const SHADOW = 'rgba(74,59,47,.18)';
  const NS = ' stroke="none"';
  let K = 1; // stroke compensation for the art being drawn

  // ---------- tiny helpers ----------
  const f = (v) => Math.round(v * 10) / 10;
  const f2 = (v) => Math.round(v * 100) / 100;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const num = (v, d) => { const n = +v; return isFinite(n) && n > 0 ? n : d; };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const isHex = (c) => typeof c === 'string' && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c.trim());
  function rgb(h) { let s = h.trim().slice(1); if (s.length === 3) s = s.replace(/./g, '$&$&'); const n = parseInt(s, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function mix(a, b, t) { const A = rgb(a), B = rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
  const dk = (c, t) => mix(c, '#3a2b20', t == null ? 0.22 : t);
  const lt = (c, t) => mix(c, '#ffffff', t == null ? 0.35 : t);
  const sw = (w) => ` stroke-width="${f2(w * K)}"`;
  const stk = (c, w) => ` stroke="${c}"` + sw(w);

  const P = (d, fill, ex) => `<path d="${d}" fill="${fill || 'none'}"${ex || ''}/>`;
  const R = (x, y, w, h, fill, ex) => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="${fill}"${ex || ''}/>`;
  const Ci = (cx, cy, r, fill, ex) => `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="${fill}"${ex || ''}/>`;
  const El = (cx, cy, rx, ry, fill, ex) => `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx)}" ry="${f(ry)}" fill="${fill}"${ex || ''}/>`;
  const Tx = (x, y, s, size, fill, ex) => `<text x="${f(x)}" y="${f(y)}" font-size="${f(size)}" fill="${fill}" stroke="none" text-anchor="middle" font-family="${FONT}" font-weight="800"${ex || ''}>${s}</text>`;

  const rp = (x, y, w, h) => `M${f(x)} ${f(y)}h${f(w)}v${f(h)}h${f(-w)}Z`;
  function pts(close, a) { let d = ''; for (let i = 0; i < a.length; i += 2) d += (i ? 'L' : 'M') + f(a[i]) + ' ' + f(a[i + 1]); return close ? d + 'Z' : d; }
  const pg = (...a) => pts(true, a);
  const ep = (cx, cy, rx, ry) => `M${f(cx - rx)} ${f(cy)}a${f(rx)} ${f(ry)} 0 1 0 ${f(2 * rx)} 0a${f(rx)} ${f(ry)} 0 1 0 ${f(-2 * rx)} 0Z`;
  const cp = (cx, cy, r) => ep(cx, cy, r, r);
  const arch = (x, y, w, h) => `M${f(x)} ${f(y + h)}V${f(y + w / 2)}A${f(w / 2)} ${f(w / 2)} 0 0 1 ${f(x + w)} ${f(y + w / 2)}V${f(y + h)}Z`;
  const goth = (x, y, w, h) => `M${f(x)} ${f(y + h)}V${f(y + w * 0.8)}Q${f(x)} ${f(y + w * 0.15)} ${f(x + w / 2)} ${f(y)}Q${f(x + w)} ${f(y + w * 0.15)} ${f(x + w)} ${f(y + w * 0.8)}V${f(y + h)}Z`;
  function grid(x, y, cols, rows, w, h, gx, gy, shape) { let d = ''; const fn = shape || rp; for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) d += fn(x + c * (w + gx), y + r * (h + gy), w, h); return d; }
  function cloud(cx, cy, rx, ry, n, k) {
    const p = [];
    for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2 - Math.PI / 2; p.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); }
    let d = `M${f(p[0][0])} ${f(p[0][1])}`;
    for (let i = 1; i <= n; i++) { const a = p[i - 1], b = p[i % n]; const r = Math.hypot(b[0] - a[0], b[1] - a[1]) * (k || 0.62); d += `A${f(r)} ${f(r)} 0 0 1 ${f(b[0])} ${f(b[1])}`; }
    return d + 'Z';
  }
  function spikes(x, y, w, step, h, hw) { let d = ''; hw = hw || 1.4; for (let px = x + step / 2; px < x + w - 0.5; px += step) d += pg(px - hw, y, px, y - h, px + hw, y); return d; }
  // windows etc. on a right side face that starts at x0 (rises 0.6 per unit to the right)
  const skew = (x0, inner) => `<g transform="matrix(1 -.6 0 1 0 ${f2(0.6 * x0)})">${inner}</g>`;
  // a shape drawn in (depth, height) coords centred on a side face point
  const onSide = (cx, cy, inner) => `<g transform="matrix(.5 -.3 0 1 ${f(cx)} ${f(cy)})">${inner}</g>`;

  // oblique box: front face [x, x+w] × [y-h, y]; depth goes up-right by (dx, -dy)
  function box(x, y, w, h, dx, dy, front, side, top) {
    let s = '';
    if (top !== false) s += P(pg(x, y - h, x + dx, y - h - dy, x + w + dx, y - h - dy, x + w, y - h), top || lt(front, 0.3));
    if (side !== false) s += P(pg(x + w, y, x + w, y - h, x + w + dx, y - h - dy, x + w + dx, y - dy), side || dk(front, 0.2));
    return s + R(x, y - h, w, h, front);
  }
  // front-facing gable roof over eaves (x..x+w, y)
  function gable(x, y, w, rh, dx, dy, face, roof) {
    const ax = x + w / 2, ay = y - rh;
    return P(pg(ax, ay, ax + dx, ay - dy, x + w + dx, y - dy, x + w, y), roof)
      + P(pg(x, y, ax, ay, x + w, y), face)
      + P(pg(x - 3, y + 1.5, ax, ay - 3, x + w + 3, y + 1.5, x + w - 0.5, y + 1.5, ax, ay + 2.4, x + 0.5, y + 1.5), dk(roof, 0.08));
  }
  // side-gabled roof (ridge parallel to the facade) over a box whose front top edge is (x..x+w, y)
  function sideRoof(x, y, w, dx, dy, rh, roof, wall) {
    const ry = y - dy / 2 - rh, rx = x + w + dx / 2;
    return P(pg(x + w, y, x + w + dx, y - dy, rx, ry), wall)
      + P(pg(rx, ry, x + w + dx + 2, y - dy + 1.5, x + w + dx - 0.6, y - dy + 1.5, rx, ry + 2.6), dk(roof, 0.12))
      + P(pg(x - 3, y + 1.5, x + w + 2, y + 1.5, rx + 0.6, ry, x + dx / 2 - 1.2, ry), roof);

  const shadow = (cx, rx, ry, cy) => El(cx, cy == null ? 0.5 : cy, rx, ry || 5.5, SHADOW, NS);
  function flag(px, py, len, hgt, poleH, col) {
    const ty = py - poleH;
    return P(`M${f(px)} ${f(py)}V${f(ty - 1.2)}`, 'none', sw(1.1))
      + P(`M${f(px)} ${f(ty)}c${f(len * 0.35)} ${f(-hgt * 0.3)} ${f(len * 0.6)} ${f(hgt * 0.3)} ${f(len)} 0v${f(hgt)}c${f(-len * 0.4)} ${f(hgt * 0.3)} ${f(-len * 0.65)} ${f(-hgt * 0.3)} ${f(-len)} 0Z`, col, sw(0.9));

  // coin / chip stacks: list of [x, height]
  function stacks(list, r, ry, col, top, edge) {
    let body = '', lines = '', tops = '';
    list.forEach((q) => {
      const x = q[0], h = q[1];
      body += `M${f(x - r)} ${f(-h)}V0A${r} ${ry} 0 0 0 ${f(x + r)} 0V${f(-h)}Z`;
      for (let y = -h + 3; y < -0.5; y += 3) lines += `M${f(x - r)} ${f(y)}A${r} ${ry} 0 0 0 ${f(x + r)} ${f(y)}`;
      tops += ep(x, -h, r, ry);
    });
    return P(body, col) + P(lines, 'none', stk(edge, 0.7)) + P(tops, top);
  }

  // ---------- status overlays ----------
  function festive(sp, ac, soft) {
    const x1 = sp[0], y1 = sp[1], x2 = sp[2], y2 = sp[3], bx = sp[4], by = sp[5];
    const sag = Math.max(4, Math.abs(x2 - x1) * 0.07);
    const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2 + 2 * sag;
    const n = clamp(Math.round(Math.abs(x2 - x1) / 9), 4, 16);
    let a = '', b = '';
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n, u = 1 - t;
      const px = u * u * x1 + 2 * u * t * cx + t * t * x2, py = u * u * y1 + 2 * u * t * cy + t * t * y2;
      let tx = 2 * u * (cx - x1) + 2 * t * (x2 - cx), ty = 2 * u * (cy - y1) + 2 * t * (y2 - cy);
      const L = Math.hypot(tx, ty) || 1; tx /= L; ty /= L;
      const tri = pg(px - tx * 2.6, py - ty * 2.6, px + tx * 2.6, py + ty * 2.6, px - ty * 5.4, py + tx * 5.4);
      if (i % 2) b += tri; else a += tri;
    }
    const gold = '#f4c242', third = isHex(soft) ? soft : lt(ac, 0.55);
    const bl = [[bx - 6, by - 19, ac], [bx + 1, by - 25, gold], [bx + 7, by - 17, third]];
    let str = '', hi = '';
    bl.forEach((q) => { str += `M${f(bx)} ${f(by)}Q${f((bx + q[0]) / 2 + 2)} ${f((by + q[1]) / 2)} ${f(q[0])} ${f(q[1] + 5)}`; hi += `M${f(q[0] - 2.2)} ${f(q[1] - 0.5)}q0.4 -2.4 2.4 -3.2`; });
    return P(`M${f(x1)} ${f(y1)}Q${f(cx)} ${f(cy)} ${f(x2)} ${f(y2)}`, 'none', sw(0.8))
      + P(a, ac, sw(0.7)) + P(b, gold, sw(0.7)) + P(str, 'none', sw(0.6))
      + bl.map((q) => El(q[0], q[1], 4.2, 5.2, q[2], sw(0.8))).join('')
      + P(hi, 'none', ' stroke="#ffffff" stroke-opacity=".8"' + sw(0.9));
  }

  function dayKey(d) {
    d = d || new Date();
    return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  }
  function dayHash(key, salt) {
    var h = (key * 2654435761 + salt * 40503) >>> 0;
    h ^= h >>> 15; h = Math.imul(h, 2246822519) >>> 0; h ^= h >>> 13;
    return h >>> 0;
  }
  function resolveDaily() {
    var key = dayKey();
    LAYOUT.dayKey = key;
    LAYOUT.animals = LAYOUT.animalDefs.map(function (a, i) {
      var s = a.spots[dayHash(key, i + 1) % a.spots.length];
      return { id: a.id, name: a.name, msg: a.msg, x: s[0], y: s[1], where: s[2] };
    });
    var pads = LAYOUT.lake.pads;
    var p = pads[dayHash(key, 97) % pads.length];

  /* 把 registry 的建築分配到學區的建築位：先放指定位置，其餘依序進駐預定地。
   * 回傳 { zones: [{district, layout, slots:[{slot, building|null, lot:boolean}]}], placed: {id: {...}} } */
  function assign(reg) {
    var out = { zones: [], placed: {}, overflow: [] };
    var expansionPool = LAYOUT.expansion.slice();
    var byDistrict = {};
    var insideList = [];
    (reg.buildings || []).forEach(function (b) {
      if (b.inside && b.parent) { insideList.push(b); return; }
      (byDistrict[b.district] = byDistrict[b.district] || []).push(b);
    });
    var districts = (reg.districts || []).slice();
    // 建築指到不存在的學區 → 補一個臨時學區，避免建築消失
    Object.keys(byDistrict).forEach(function (did) {
      if (!districts.some(function (d) { return d.id === did; })) {
        districts.push({ id: did, name: did, en: '', icon: '📍', color: '#64748b', soft: '#f1f5f9', desc: '' });
      }
    });
    districts.forEach(function (d) {
      var lay = LAYOUT.zones[d.id];
      var isExpansion = false;
      if (!lay) {
        lay = expansionPool.shift();
        isExpansion = true;
      }
      if (!lay) {
        (byDistrict[d.id] || []).forEach(function (b) { out.overflow.push(b.id); });
        return;
      }
      var slots = lay.slots.map(function (s) { return { slot: s, building: null }; });
      var pending = [];
      (byDistrict[d.id] || []).forEach(function (b) {
        var hit = null;
        for (var i = 0; i < slots.length; i++) {
          if (!slots[i].building && slots[i].slot.ids && slots[i].slot.ids.indexOf(b.id) >= 0) { hit = slots[i]; break; }
        }
        if (hit) hit.building = b;
        else pending.push(b);
      });
      // 下一塊空地：先用一般預定地，再用「指定建築已不在 registry」的設計位置
      var free = slots.filter(function (s) { return !s.building && !s.slot.ids; })
        .concat(slots.filter(function (s) { return !s.building && s.slot.ids; }));
      pending.forEach(function (b) {
        var s = free.shift();
        if (s) {
          s.building = b;
        } else {
          var bx = lay.box;
          var n = slots.filter(function (x) { return x.extra; }).length;
          slots.push({ slot: { x: bx[0] + 60 + n * 104, y: bx[3] - 10, w: 92, h: 76, small: true }, building: b, extra: true });
        }
      });
      slots.forEach(function (s) {
        s.lot = !s.building;
        if (s.building) out.placed[s.building.id] = { district: d, slot: s.slot };
      });
      out.zones.push({ district: d, layout: lay, slots: slots, expansion: isExpansion });
    });
    insideList.forEach(function (b) {
      if (out.placed[b.parent]) out.placed[b.id] = out.placed[b.parent];
    });
    out.freeExpansion = expansionPool;
    return out;
  }

  C.LAYOUT = LAYOUT;
  C.assignLayout = assign;
})();

(function () {

  /* ------------------------------------------------------------ 插畫（CampusArt，art.js 永遠先載入） */
  function call(name, args) {
    var a = window.CampusArt;

  }
  function n(v) { return Math.round(v * 10) / 10; }
  var DECO_BOX = { tree: [34, 46], pine: [30, 50], sakura: [36, 44], palm: [42, 64], bush: [26, 16], lamp: [10, 36], bench: [28, 14], flag: [16, 40] };

  /* ------------------------------------------------------------ 幾何工具 */
  function rng(seed) {
    return function () {
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function R(x, y, w, h) { return { x: x, y: y, w: w, h: h }; }
  function overlap(a, b) { return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h; }
  function inLake(x, y, m) {
    m = m || 0;
    function el(cx, cy, rx, ry) { var dx = (x - cx) / (rx + m), dy = (y - cy) / (ry + m); return dx * dx + dy * dy <= 1; }
    return el(900, 224, 104, 100) || el(1105, 226, 106, 104) || (x > 980 && x < 1020 && y > 160 - m && y < 294 + m);
  }
  function textW(str, fs) {
    var w = 0;
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      if (c >= 0xD800 && c <= 0xDBFF) { w += fs * 1.2; i++; continue; }
      if (c === 0xFE0F || c === 0x200D) continue;
      if (c > 0x2E80) w += fs;
      else if (c > 0x2000) w += fs * 1.1;
      else w += fs * 0.58;
    }
    return w;
  }
  function labelName(b) { return (b.icon ? b.icon + ' ' : '') + b.name; }

  /* ------------------------------------------------------------ 場景組裝 */
  function buildScene(asg) {

      '<path d="M' + B.x + ',40 L' + B.x + ',-20 C-150,-70 -40,-95 90,-60 C200,-30 300,-110 430,-96 C560,-82 600,-40 700,-58 C820,-80 900,-128 1030,-104 ' +
      'C1160,-80 1220,-40 1330,-62 C1450,-86 1520,-118 1640,-92 C1760,-66 1860,-108 1980,-84 C2100,-60 2220,-96 ' + (B.x + B.w) + ',-60 L' + (B.x + B.w) + ',40 Z" fill="#d6e2d3"/>' +

      '</g>');

    // --- 草地（校地）
    var tuft = '';
    var rnd = rng(11);
    for (var i = 0; i < 190; i++) {
      var tx = 30 + rnd() * (L.W - 60), ty = 100 + rnd() * (L.H - 130);

  function layoutLabels() {
    var groups = M.svg.querySelectorAll('.m-labels .lbl[data-id], .m-labels .lbl-svc');
    for (var i = 0; i < groups.length; i++) {
      var g = groups[i];
      var t = g.querySelector('.lbl-t'), ct = g.querySelector('.chip-t');
      var bg = g.querySelector('.lbl-bg'), cb = g.querySelector('.chip-bg');
      if (!t || !bg) continue;
      var meta = null;
      var id = g.getAttribute('data-id');
      for (var m = 0; m < M.labelMeta.length; m++) {
        if ((id && M.labelMeta[m].id === id) || (!id && M.labelMeta[m].svc)) { meta = M.labelMeta[m]; break; }
      }
      var tw = 0, cw = 0;
      try { tw = t.getComputedTextLength(); cw = ct ? ct.getComputedTextLength() : 0; } catch (e) { tw = 0; }
      if (!tw && meta) { tw = textW(meta.name, meta.fs); cw = textW(meta.chip || '', 10.5); }
      var chipW = ct ? cw + 13 : 0;
      var total = 11 + tw + (ct ? 7 + chipW : 0) + 5;
      var x0 = -total / 2;
      bg.setAttribute('x', n(x0));
      bg.setAttribute('width', n(total));
      var lhit = g.querySelector('.lbl-hit');
      if (lhit) {
        lhit.setAttribute('x', n(x0 - 8));
        lhit.setAttribute('width', n(total + 16));
      }
      t.setAttribute('x', n(x0 + 11));
      if (ct && cb) {
        var cx = x0 + 11 + tw + 7;
        cb.setAttribute('x', n(cx));
        cb.setAttribute('width', n(chipW));
        ct.setAttribute('x', n(cx + 6.5));
      }
      if (meta) {
        var half = total / 2;
        var ax = clamp(meta.x, 8 + half, L.W - 8 - half);
        var tr = g.getAttribute('transform') || '';
        g.setAttribute('transform', tr.replace(/translate\(([-\d.]+),/, 'translate(' + n(ax) + ','));
      }
    }
  }
