    const local = isLocal(status);
    const ver = currentVersion(status);
    const releases = (status && status.releases) || data().releases || [];
    const title = local ? '🚀 開心學園 · 版本紀錄與發布中心' : '📜 開心學園 · Release Notes';
    const sub = local
      ? '<p class="rel-sub">語意化版號 MAJOR.MINOR.PATCH：大改版進第 1 位、新功能或新學院進第 2 位、細節修正進第 3 位。</p>'
      : '';
    bd.innerHTML =
      '<div class="rel-box" role="dialog" aria-modal="true" aria-labelledby="relTitle">' +
        '<div class="rel-grip" aria-hidden="true"></div>' +
        '<header class="rel-head">' +
          '<div class="rel-head-main"><h3 class="rel-title" id="relTitle">' + esc(title) +
            ' <span class="rel-ver-pill">v' + esc(ver) + '</span></h3>' + sub + '</div>' +
          '<button type="button" class="rel-btn rel-ghost" id="relCloseBtn" aria-label="關閉">✕<span class="rel-close-txt"> 關閉</span></button>' +
        '</header>' +
        '<div class="rel-body">' +
          '<div class="rel-msg" id="relMsg" role="status" aria-live="polite" hidden></div>' +
          (local ? exportCardHtml(status) + statusHtml(status) : '') +
          '<h4 class="rel-sec">📜 Release Notes 歷史版本紀錄</h4>' +
          '<div class="rel-timeline">' + historyHtml(releases) + '</div>' +
        '</div>' +
      '</div>';
    const wasOpen = bd.classList.contains('open');
    if (!wasOpen) lastFocus = document.activeElement;
    bd.classList.add('open');
    bd.querySelector('#relCloseBtn').addEventListener('click', closeReleaseModal);
    bd.querySelectorAll('input[name="relBump"]').forEach((radio) => {
      radio.addEventListener('change', () => {
        bd.querySelectorAll('.rel-bump').forEach((el) => el.classList.toggle('on', el.contains(radio)));
        const v = bd.querySelector('#relPubVer');
        if (v && status && status.next_versions) v.textContent = status.next_versions[radio.value] || '';
      });
    });
    const pub = bd.querySelector('#relPublishBtn');
    if (pub) pub.addEventListener('click', () => publish(status, pub));
    if (!wasOpen) {
      try { bd.querySelector('#relCloseBtn').focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    }
  }

  async function publish(status, btn) {
    const bd = document.getElementById('relModal');
    const checked = bd && bd.querySelector('input[name="relBump"]:checked');
    const bump = checked ? checked.value : (status.recommended_bump || 'patch');
    const title = ((document.getElementById('relTitleInp') || {}).value || '').trim();
    const highlights = ((document.getElementById('relHlInp') || {}).value || '')
      .split('\n').map((s) => s.trim()).filter(Boolean);
    btn.disabled = true;
    btn.textContent = '⏳ 發布並重新打包中…';
    try {
      const res = await fetch('/api/release_publish', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bump_type: bump, title: title, highlights: highlights }),
      });
      const out = await res.json().catch(() => null);
      if (!res.ok || !out || !out.ok) throw new Error((out && out.error) || ('HTTP ' + res.status));
      cachedStatus = out.status;
      data().current_version = out.new_version;
      data().releases = out.status.releases;
      updateBadgeUI(cachedStatus);
      renderReleaseModal(cachedStatus);
      notify('🎉 已發布 v' + out.new_version + '，dist/site 與 okayell.github.io.zip 已重新打包', 'ok');
    } catch (err) {
      btn.disabled = false;
      btn.textContent = '🚀 重新嘗試發布';
      notify('發布失敗：' + ((err && err.message) || err), 'bad', 'relPubMsg');
    }
  }

  function closeReleaseModal() {
    const bd = document.getElementById('relModal');
    if (!bd || !bd.classList.contains('open')) return;
    bd.classList.remove('open');
    const back = lastFocus && document.contains(lastFocus) && lastFocus !== document.body
      ? lastFocus : document.getElementById('verBadgeBtn');
    lastFocus = null;
    if (back && back.focus) {
      try { back.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    }
  }

  async function openReleaseModal(opts) {
    const bd = ensureBackdrop();
    bd.classList.toggle('rel-instant', !!(opts && opts.instant));
    if (cachedStatus || (isStaticEnv() && !window.__MOCK_RELEASE_STATUS)) {
      renderReleaseModal(cachedStatus);
      if (!cachedStatus) return;
      const before = JSON.stringify(cachedStatus);
      const st = await fetchReleaseStatus();
      const typing = document.activeElement && document.activeElement.closest &&
        document.activeElement.closest('#relModal .rel-form');
      if (st && isOpen() && !typing && JSON.stringify(st) !== before) renderReleaseModal(st);
      return;
    }
    const st = await fetchReleaseStatus();
    renderReleaseModal(st || cachedStatus);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !e.isComposing && e.keyCode !== 229 && isOpen()) closeReleaseModal();
  });

  function initVersionBadge() {
    injectCss();
    const btn = document.getElementById('verBadgeBtn');
    if (btn && !btn.dataset.relBound) {
      btn.dataset.relBound = '1';
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        openReleaseModal();
      });
    }
    updateBadgeUI(cachedStatus);
    fetchReleaseStatus().then(() => {
      // ?releases=1 / #releases deep link: open without the slide-in animation (also keeps screenshots stable).
      if (/[?&]releases=1(?:&|$)/.test(location.search) || /^#\/?releases$/.test(location.hash)) openReleaseModal({ instant: true });
    });
  }

  CAMPUS.openReleaseModal = openReleaseModal;
  CAMPUS.closeReleaseModal = closeReleaseModal;
  CAMPUS.refreshReleaseStatus = fetchReleaseStatus;
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVersionBadge);
  } else {
    initVersionBadge();
  }
})();

</script>
  <script>/* js/app.js */
/* 開心學園 · app.js — 啟動流程：標題列搜尋、🗺️ 地圖／📋 目錄切換、最近造訪、學區快捷、網址參數、
 *   學園服務中心（使用說明）、意見回饋／許願、Cloudtop 即時狀態
 */
(function () {
  'use strict';
  var C = window.CAMPUS;
  if (!C || C.redirecting) return;
  var esc = C.util.esc;
  var qs = C.util.qs;
  var FEEDBACK_KEY = 'okayell.campus.feedback.v1';
  var HINT_KEY = 'okayell.campus.hint.v1';
  var FEEDBACK_EMAIL = 'okayell@hotmail.com';
  var view = 'map';

  function $(id) { return document.getElementById(id); }

  /* ------------------------------------------------------------ 檢視切換 */
  function setView(v, opts) {
    opts = opts || {};
    view = v === 'dir' ? 'dir' : 'map';
    var isDir = view === 'dir';
    $('mapView').hidden = isDir;
    $('dirView').hidden = !isDir;
    $('tabMap').setAttribute('aria-selected', String(!isDir));
    $('tabDir').setAttribute('aria-selected', String(isDir));
    document.body.classList.toggle('view-dir', isDir);
    if (!isDir) {
      C.map.resize();
      C.map.relayout();
    }
    if (!opts.noHash) {
      try {
        var u = new URL(window.location.href);
        u.hash = isDir ? '#dir' : '';
        window.history.replaceState(null, '', u.pathname + u.search + u.hash);
      } catch (e) { /* ignore */ }
    }
    if (opts.scrollTop !== false) window.scrollTo(0, 0);
  }

  /* ------------------------------------------------------------ 開啟建築 */
  function openBuilding(id, opts) {
    opts = opts || {};
    var b = C.building(id);
    if (!b) return false;
    C.panel.open(b.id);
    if (view === 'map') {
      C.map.select(b.id);
      C.map.focusBuilding(b.id, {
        ifNeeded: !opts.zoom,
        zoom: !!opts.zoom,
        panelW: C.panel.coverW(),
        sheetH: C.panel.coverH(),
      });
    }
    return true;
  }

  /* ------------------------------------------------------------ 搜尋（IME 安全 Enter） */
  function initSearch() {
    var inp = $('q'), pop = $('qPop'), clr = $('qClear');
    var results = [], sel = -1;
    function renderPop(q) {
      if (!q) { pop.hidden = true; pop.innerHTML = ''; return; }
      if (!results.length) {
        pop.innerHTML = '<div class="s-none">找不到「' + esc(q) + '」，試試「藥癮個管」「日語」「Python」「K 線」「NBA」</div>';
        pop.hidden = false;
        return;
      }
      pop.innerHTML = results.slice(0, 7).map(function (r, i) {
        var b = r.b, d = C.districtOf(b) || {};
        var st = C.STATUS[b.status] || C.STATUS.live;
        return '<button type="button" role="option" class="s-item' + (i === sel ? ' on' : '') + '" data-id="' + esc(b.id) + '" aria-selected="' + (i === sel) + '">' +
          '<span class="s-ic2" aria-hidden="true">' + esc(b.icon || '🏫') + '</span>' +
          '<span class="s-tx"><b>' + esc(b.name) + '</b><small>' + esc((d.icon || '') + ' ' + (d.name || '') + ' · ' + (b.tagline || '')) + '</small></span>' +
          '<span class="chip" style="background:' + st.bg + ';color:' + st.fg + ';border-color:' + st.bd + '">' + esc(st.t) + '</span></button>';
      }).join('');
      pop.hidden = false;
    }
    function run() {
      var q = inp.value.trim();
      clr.hidden = !q;
      results = q ? C.search(q) : [];
      sel = results.length ? 0 : -1;
      var ids = q ? results.map(function (r) { return r.b.id; }) : null;
      C.map.highlight(ids);
      C.dir.filter(ids, q);
      renderPop(q);
    }
    function pick(id) {
      pop.hidden = true;
      if (window.matchMedia('(max-width: 720px)').matches) inp.blur();
      openBuilding(id, { zoom: view === 'map' && C.panel.isMobile() });
    }
    inp.addEventListener('input', run);
    inp.addEventListener('focus', function () { if (inp.value.trim()) renderPop(inp.value.trim()); });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (!results.length) return;
        e.preventDefault();
        sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + Math.min(7, results.length)) % Math.min(7, results.length);
        renderPop(inp.value.trim());
        return;
      }
      if (e.key === 'Escape') {
        if (inp.value) { inp.value = ''; run(); } else inp.blur();
        pop.hidden = true;
        return;
      }
      if (C.isEnterSend(e)) {
        e.preventDefault();
        if (!results.length) { if (inp.value.trim()) C.toast('找不到「' + inp.value.trim() + '」'); return; }
        pick(results[Math.max(0, sel)].b.id);
      }
    });
    pop.addEventListener('mousedown', function (e) { e.preventDefault(); });
    pop.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('.s-item') : null;
      if (t) pick(t.getAttribute('data-id'));
    });
    clr.addEventListener('click', function () { inp.value = ''; run(); inp.focus(); });
    document.addEventListener('click', function (e) {
      if (!e.target.closest || !e.target.closest('#searchBox')) pop.hidden = true;
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && document.activeElement && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
        e.preventDefault();
        inp.focus();
      }
    });
    C.searchFor = function (q) { inp.value = q; run(); };
  }

  /* ------------------------------------------------------------ 最近造訪 */
  function renderRibbon() {
    var rb = $('ribbon');
    var list = C.recentVisits(6);
    if (!list.length) { rb.hidden = true; document.body.classList.remove('has-ribbon'); return; }
    rb.hidden = false;
    document.body.classList.add('has-ribbon');
    rb.querySelector('.rb-list').innerHTML = list.map(function (v) {
      return '<a class="rb-chip" href="' + esc(C.primaryUrl(v.b)) + '" data-visit="' + esc(v.b.id) + '" title="' + esc(v.b.name + '：' + (v.b.tagline || '')) + '">' +
        '<span aria-hidden="true">' + esc(v.b.icon || '🏫') + '</span> ' + esc(v.b.name) + ' <small>' + esc(C.util.timeAgo(v.at)) + '</small></a>';
    }).join('');
  }

  /* ------------------------------------------------------------ 學區快捷 */
  function renderChips() {
    var el = $('mapChips');
    var h = '<button type="button" class="mc" data-home="1">🏫 全覽</button>';
    var asg = C.map.layout();
    C.reg.districts.forEach(function (d) {
      if (asg && !asg.zones.some(function (z) { return z.district.id === d.id; })) return;
      h += '<button type="button" class="mc" data-district="' + esc(d.id) + '" style="--dc:' + esc(d.color || '#64748b') + '">' +
        esc((d.icon ? d.icon + ' ' : '') + String(d.name || '').replace(/學區$/, '')) + '</button>';
    });
    h += '<button type="button" class="mc mc-fun" id="mapFunBtn" data-fun-hub="1" title="打開校園遊樂場：小遊戲、成就徽章、萌寵圖鑑、伐木挑戰與排行榜">🎮 校園互動</button>';
    h += '<button type="button" class="mc mc-fb" data-act="feedback" title="意見回饋與許願新學院">💬 意見回饋</button>';
    h += '<button type="button" class="mc mc-mode' + (C.infoMode ? ' on' : '') + '" id="mapModeBtn" data-info-mode="1" aria-pressed="' + (C.infoMode ? 'true' : 'false') + '" title="切換點建築的行為：直接進入 vs 看介紹卡">' +
      (C.infoMode ? '📖 點建築：看介紹' : '🚀 點建築：直接進入') + '</button>';
    el.innerHTML = h;
    el.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('.mc') : null;
      if (!t || t.hasAttribute('data-act')) return;
      if (t.hasAttribute('data-fun-hub')) {
        C.emit('fun', { kind: 'hub' });
        return;
      }
      if (t.hasAttribute('data-info-mode')) {
        C.infoMode = !C.infoMode;
        t.classList.toggle('on', C.infoMode);
        t.setAttribute('aria-pressed', C.infoMode ? 'true' : 'false');
        t.textContent = C.infoMode ? '📖 點建築：看介紹' : '🚀 點建築：直接進入';
        C.toast(C.infoMode ? '📖 已切換為「看介紹」模式：點地圖建築會先打開介紹卡' : '🚀 已切換為「直接進入」模式：點地圖建築會直接進入學院／實戰館');
        return;
      }
      if (t.hasAttribute('data-home')) C.map.reset();
      else C.map.focusDistrict(t.getAttribute('data-district'));
    });
  }

  /* ------------------------------------------------------------ 視窗（服務中心、意見回饋） */
  var lastFocus = null;
  var modalOpenedAt = 0;
  function openModal(id, html) {
    var bd = $(id);
    lastFocus = document.activeElement;
    modalOpenedAt = Date.now();
    bd.querySelector('.modal-body').innerHTML = html;
    bd.hidden = false;
    bd.classList.add('open');
    document.body.classList.add('modal-open');
    var f = bd.querySelector('h2');
    if (f) { f.setAttribute('tabindex', '-1'); f.focus(); }
  }
  function closeModal(bd) {
    bd.classList.remove('open');
    bd.hidden = true;
    if (!document.querySelector('.modal-bd.open')) document.body.classList.remove('modal-open');
    if (lastFocus && lastFocus.focus && document.contains(lastFocus)) try { lastFocus.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }
  function bindModals() {
    var mods = document.querySelectorAll('.modal-bd');
    for (var i = 0; i < mods.length; i++) {
      (function (bd) {
        bd.addEventListener('click', function (e) {
          if (Date.now() - modalOpenedAt < 420) return;
          if (e.target === bd || (e.target.closest && e.target.closest('.modal-x'))) closeModal(bd);
        });
      })(mods[i]);
    }
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape' || e.isComposing) return;
      var open = document.querySelector('.modal-bd.open');
      if (open) closeModal(open);
    });
  }

  function aboutHtml() {
    var reg = C.reg;
    var base = String(C.campusHome()).replace(/^https?:\/\//, '');
    var shorts = reg.buildings.filter(C.isLive).map(function (b) {
      return '<tr><td><a href="' + esc(C.primaryUrl(b)) + '"><code>' + esc(C.shortUrl(b)) + '</code></a></td><td>' + esc((b.icon || '') + ' ' + b.name) + '</td></tr>';
    }).join('');
    var dists = reg.districts.map(function (d) {
      return '<li><button type="button" class="linkish" data-goto-district="' + esc(d.id) + '">' + esc((d.icon || '') + ' ' + d.name) + '</button>：' + esc(d.desc || '') + '</li>';
    }).join('');
    var eg = reg.buildings.filter(function (b) { return b.id === 'english'; })[0] || reg.buildings[0];
    var egLink = eg && eg.links[1] ? eg.links[1] : null;
    return '<h2>🕰️ 學園服務中心 · 使用說明</h2>' +
      '<p class="lead">歡迎來到 <b>' + esc(reg.brand.name || '開心學園') + '</b>！' + esc(reg.brand.tagline || '') + '。每間學院與實戰館都保留自己的網址，左上角的「🏫 校園」按鈕隨時帶你回到這張地圖。</p>' +
      '<h3>🧭 怎麼逛</h3><ul>' +
      '<li><b>點建築</b>直接進入該學院或實戰館（想先看特色介紹與深連結，可點地圖上方「🚀 點建築：直接進入」切換為「📖 點建築：看介紹」，或到「📋 目錄」點「介紹」）</li>' +
      '<li><b>拖曳</b>平移，<b>滾輪或雙指</b>縮放；右下角 ＋／−／⟲ 回到全覽</li>' +
      '<li><b>點學區看板</b>（或地圖上方的學區按鈕）聚焦整個學區</li>' +
      '<li><b>搜尋</b>：輸入「日語」「K 線」「NBA」，按 Enter 直接打開最符合的建築（快捷鍵 <kbd>/</kbd>）</li>' +
      '<li><b>📋 目錄</b>：用清單瀏覽全部建築，手機上更好點</li>' +
      '<li>鍵盤：<kbd>Tab</kbd> 走訪建築、<kbd>Enter</kbd> 開啟、方向鍵平移、<kbd>+</kbd>／<kbd>-</kbd> 縮放、<kbd>0</kbd> 全覽</li></ul>' +
      '<h3>🎮 校園互動</h3><ul>' +
      '<li><b>小遊戲</b>：釣魚大賽、三分投籃、十二碼 PK、網球對決，都有輸贏與星等；點地圖上的湖邊棧道與球場，或上方「🎮 校園互動」</li>' +
      '<li><b>🏅 成就＆🏆 排行榜</b>：玩遊戲、摸萌寵（每天換地點）、砍樹（點樹 3 下，75 秒後長回來）都能解鎖徽章，其他學員看得到</li>' +
      '<li><b>🪪 學生證與座駕</b>：點哪間學院，你的車就開到門口停；車子遇到走在斑馬線上的同學會自動停車禮讓</li>' +
      '<li>偶爾會有飛機飛過、湖裡還躲著一隻傳說生物……仔細看看吧！</li></ul>' +
      '<h3>🏛️ 學區</h3><ul class="dist-list">' + dists + '</ul>' +
      '<h3>🔗 短網址與深連結</h3>' +
      '<table class="short-t"><tbody>' + shorts + '</tbody></table>' +
      '<ul class="deep">' +
      (egLink ? '<li><code>' + esc(base) + '?go=' + esc(eg.id) + '&amp;to=' + esc(egLink.hash.replace(/^#/, '')) + '</code> → 直接打開' + esc(eg.name) + '的「' + esc(egLink.label) + '」</li>' : '') +
      '<li><code>?b=&lt;建築&gt;</code> 打開介紹卡、<code>?d=&lt;學區&gt;</code> 聚焦學區（例：<code>?d=finance</code>）</li></ul>' +
      '<h3>🔒 資料與隱私</h3><p>所有學習進度都只存在你自己的瀏覽器（localStorage），不會上傳到任何伺服器；換瀏覽器或清除網站資料就會重新開始。</p>' +
      '<h3>⚠️ 免責聲明</h3><p>實戰區（台股智慧選股、NBA／英超／F1 運彩智庫）的投資與運彩資訊僅供研究與學習參考，不構成任何投資或投注建議，請自行判斷並承擔風險；運彩請量力而為，未滿 18 歲請勿購買。</p>' +
      '<div class="modal-acts"><button type="button" class="btn primary" data-act="feedback">💬 意見回饋／許願新學院</button>' +
      '<button type="button" class="btn" data-act="releases">📜 Release Notes</button></div>';
  }
  function openAbout() { openModal('aboutModal', aboutHtml()); }

  /* 意見回饋（Pattern 175：三欄 類型／標題／內容；本機 → /api/feedback，公開版 → FormSubmit＋mailto 備援） */
  var KINDS = [
    { id: 'feature', label: '✨ 許願新學院／功能' },
    { id: 'bug', label: '🐞 問題回報' },
    { id: 'ux', label: '🎨 介面建議' },
    { id: 'other', label: '💬 其他' },
  ];
  function feedbackHtml(pre) {
    pre = pre || {};
    return '<h2>💬 意見回饋・許願新學院</h2>' +
      '<p class="lead">想要什麼新學院、發現 Bug、或有任何建議都歡迎留言，送出後會寄信通知站長（<code>' + esc(FEEDBACK_EMAIL) + '</code>）。</p>' +
      '<form id="fbForm" class="fb-form" novalidate>' +
      '<label class="fb-l">1. 類型</label><div class="fb-kinds">' + KINDS.map(function (k) {
        return '<button type="button" class="btn sm' + ((pre.kind || 'feature') === k.id ? ' primary' : '') + '" data-kind="' + k.id + '">' + esc(k.label) + '</button>';
      }).join('') + '</div>' +
      '<label class="fb-l" for="fbTitle">2. 標題</label>' +
      '<input id="fbTitle" maxlength="150" required placeholder="例：想要一間烹飪學院" value="' + esc(pre.title || '') + '">' +
      '<label class="fb-l" for="fbDesc">3. 內容</label>' +
      '<textarea id="fbDesc" rows="5" maxlength="4000" required placeholder="想學什麼、希望怎麼設計，或遇到的問題…">' + esc(pre.desc || '') + '</textarea>' +
      '<div id="fbBanner" class="fb-banner-slot" hidden></div>' +
      '<div class="modal-acts"><button type="submit" class="btn primary" id="fbSend">📨 送出回饋</button><span class="fb-msg" id="fbMsg" role="status"></span></div>' +
      '</form>';
  }
  function openFeedback(pre) {
    openModal('fbModal', feedbackHtml(pre));
    var form = $('fbForm');
    var kind = (pre && pre.kind) || 'feature';
    var sending = false;
    form.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-kind]') : null;
      if (!t) return;
      kind = t.getAttribute('data-kind');
      var bs = form.querySelectorAll('[data-kind]');
      for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('primary', bs[i] === t);
    });
    $('fbTitle').addEventListener('keydown', function (e) {
      if (C.isEnterSend(e)) { e.preventDefault(); $('fbDesc').focus(); }
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (sending) return;
      var title = $('fbTitle').value.trim(), desc = $('fbDesc').value.trim(), msg = $('fbMsg'), banner = $('fbBanner');
      if (!title || !desc) { msg.textContent = '⚠️ 請填寫標題與內容'; return; }
      msg.textContent = '';
      if (banner) { banner.hidden = true; banner.innerHTML = ''; }
      sending = true;
      var btn = $('fbSend');
      btn.disabled = true;
      btn.textContent = '⏳ 送出中…';
      var kindLabel = (KINDS.filter(function (k) { return k.id === kind; })[0] || KINDS[0]).label;
      var createdAt = new Date().toISOString().slice(0, 19).replace('T', ' ');
      var item = { kind: kind, kind_label: kindLabel, title: title, description: desc, created_at: createdAt, page: 'campus' };
      try {
        var hist = JSON.parse(localStorage.getItem(FEEDBACK_KEY) || '[]');
        hist.unshift(item);
        localStorage.setItem(FEEDBACK_KEY, JSON.stringify(hist.slice(0, 30)));
      } catch (er) { /* ignore */ }
      var fbOpts = { tool: '開心學園', kindLabel: kindLabel, title: title, description: desc, email: FEEDBACK_EMAIL, createdAt: createdAt };
      var send = (C.env.mode === 'cloudtop' && !window.CAMPUS_STATIC_ONLY)
        ? fetch('/api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item) })
          .then(function (r) { return r.json(); })
          .then(function (j) { return { sent: !!(j && j.ok !== false && (!j.item || j.item.mail_sent !== false)) }; })
        : C.sendStaticFeedback(fbOpts);
      send.catch(function () { return { sent: false }; }).then(function (res) {
        sending = false;
        btn.disabled = false;
        btn.textContent = '📨 送出回饋';
        if (res && res.sent) {
          if (banner) {
            banner.hidden = false;
            banner.innerHTML = '<div class="cfb-ok">✅ 已成功寄出通知信至 <code>' + esc(FEEDBACK_EMAIL) + '</code>，謝謝你的寶貴回饋！</div>';
          } else {
            msg.innerHTML = '✅ 已送出，謝謝你的回饋！';
          }
          form.reset();
        } else if (banner) {
          banner.hidden = false;
          banner.innerHTML = C.feedbackFallbackHtml(fbOpts);
          try { banner.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (er2) { /* ignore */ }
        } else {
          msg.innerHTML = C.feedbackFallbackHtml(fbOpts);
        }
      });
    });
  }

  /* ------------------------------------------------------------ 網址參數 */
  function handleParams() {
    var go = C.goTarget();
    if (go && go.error) {
      C.toast('找不到「' + go.error + '」，幫你在校園裡搜尋看看');
      if (C.searchFor) C.searchFor(go.error);
    } else if (go && go.planned) {
      openBuilding(go.planned.id, { zoom: true });
      C.toast('🚧 ' + go.planned.name + ' 還在建設中，敬請期待');
      return;
    }
    var from = qs('from'), b = qs('b'), d = qs('d'), q0 = qs('q');
    if (q0 && C.searchFor) C.searchFor(q0);
    var fromB = from ? C.building(from) : null;
    if (fromB) {
      C.map.markFrom(fromB.id);
      if (C.panel.isMobile() && !b && !d) C.map.focusBuilding(fromB.id, { ms: 0 });
    }
    if (b && C.building(b)) {
      if (location.hash === '#dir') setView('map', { noHash: false });
      openBuilding(b, { zoom: false });
    } else if (d) {
      var dist = C.district(d);
      if (dist) {
        if (view !== 'map') setView('map');
        C.map.focusDistrict(dist.id, 0);
      }
    }
  }

  /* ------------------------------------------------------------ 啟動 */
  function boot() {
    if (C.reg && C.reg.brand && C.reg.brand.name) {
      var bn = document.querySelector('.brand-name');
      if (bn) bn.textContent = C.reg.brand.name;
      document.title = C.reg.brand.name + ' · 校園地圖';
    }
    initSearch();
    bindModals();
    C.map.init($('mapWrap'));
    C.dir.render();
    renderChips();
    renderRibbon();
    if (location.hash === '#dir') setView('dir', { noHash: true });

    $('tabMap').addEventListener('click', function () { setView('map'); });
    $('tabDir').addEventListener('click', function () { setView('dir'); });
    document.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-act],[data-goto-district],.rb-chip') : null;
      if (!t) return;
      if (t.classList.contains('rb-chip')) { C.recordVisit(t.getAttribute('data-visit')); return; }
      if (t.hasAttribute('data-goto-district')) {
        var open = document.querySelector('.modal-bd.open');
        if (open) closeModal(open);
        C.emit('district', t.getAttribute('data-goto-district'));
        return;
      }
      var act = t.getAttribute('data-act');
      if (act === 'about') openAbout();
      else if (act === 'feedback') { var o = document.querySelector('.modal-bd.open'); if (o) closeModal(o); openFeedback(); }
      else if (act === 'releases') {
        var o2 = document.querySelector('.modal-bd.open');
        if (o2) closeModal(o2);
        if (C.openReleaseModal) C.openReleaseModal();
        else { var vb = $('verBadgeBtn'); if (vb) vb.click(); }
      }
    });
    window.addEventListener('storage', function (e) { if (e.key === 'okayell.campus.visits.v1') renderRibbon(); });

    C.on('open', function (id) { openBuilding(id); });
    C.on('about', openAbout);
    C.on('district', function (did) {
      if (view !== 'map') setView('map');
      if (C.panel.current() && C.panel.isMobile()) C.panel.close();
      C.map.focusDistrict(did);
    });
    C.on('wish', function (x) {
      var pre = { kind: 'feature' };
      if (x && x.building) {
        pre.title = '許願：' + x.building.name + ' 快點開張';
        pre.desc = '我最想先學的內容：';
      } else {
        var d = C.district(x);
        pre.title = d ? '許願：' + d.name + '的新' + (d.id === 'arena' ? '實戰館' : '學院') : '許願：新的學區';
      }
      openFeedback(pre);
    });
    C.on('panelclose', function () { C.map.select(null); });

    if (C.env.mode === 'cloudtop') {
      var chip = $('envChip');
      if (chip) chip.hidden = false;
      C.refreshStatus(true);
      setInterval(function () { if (!document.hidden) C.refreshStatus(); }, 20000);
      C.on('status', renderRibbon);
    }

    handleParams();

    // 第一次來：操作提示
    var hint = $('mapHint');
    var seen = false;
    try { seen = !!localStorage.getItem(HINT_KEY); } catch (e) { seen = true; }
    if (hint && !seen && view === 'map') {
      hint.hidden = false;
      setTimeout(function () { hint.classList.add('show'); }, 400);
      var hide = function () {
        hint.classList.remove('show');
        setTimeout(function () { hint.hidden = true; }, 400);
        try { localStorage.setItem(HINT_KEY, '1'); } catch (e) { /* ignore */ }
        $('mapWrap').removeEventListener('pointerdown', hide);
      };
      $('mapWrap').addEventListener('pointerdown', hide);
      setTimeout(hide, 6000);
    }
    document.body.classList.add('ready');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
  <script>/* js/fun.js */
/* 開心學園 · fun.js — 校園互動核心
 *   存檔與 🏅 成就徽章（其他學員可在排行榜看到）、地圖特效泡泡、🐾 萌寵（每日換位置）＋🐸 傳說小綠蛙、
 *   🪓 地圖上直接砍樹（75 秒後長回來）與伐木挑戰、🎮 遊樂場視窗與成就／圖鑑中心。
 *   小遊戲本體在 games.js，車輛／行人／飛機／學生證／在線名單在 traffic.js（皆掛在 CAMPUS.fun）。
 */
(function () {
  'use strict';
  var C = window.CAMPUS;
  if (!C || C.redirecting) return;
  var L = C.LAYOUT;
  var esc = C.util.esc;
  var F = (C.fun = C.fun || {});
  var STORE_KEY = 'okayell.campus.fun.v1';
  var VISITS_KEY = 'okayell.campus.visits.v1';

  /* ------------------------------------------------------------ 存檔 */
  function obj(v) { return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; }
  function loadState() {
    var raw = {};
    try { raw = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { raw = {}; }
    return {
      fishCaught: obj(raw.fishCaught),
      fishTotal: +raw.fishTotal || 0,
      animalsMet: obj(raw.animalsMet),
      carTrips: +raw.carTrips || 0,
      wood: +raw.wood || 0,
      games: obj(raw.games),
      ach: obj(raw.ach),
      simEnabled: !!(C.env && C.env.mode !== 'github' && raw.simManual === true),
      simManual: !!(C.env && C.env.mode !== 'github' && raw.simManual === true),
      chopHint: !!raw.chopHint,
    };
  }
  var ST = (F.ST = loadState());
  var saveTimer = 0;
  function writeNow() { try { localStorage.setItem(STORE_KEY, JSON.stringify(ST)); } catch (e) { /* 無痕模式 */ } }
  function save(now) {
    clearTimeout(saveTimer);
    if (now) writeNow(); else saveTimer = setTimeout(writeNow, 400);
  }
  F.save = save;
  window.addEventListener('pagehide', writeNow);

  /* ------------------------------------------------------------ 🏅 成就徽章 */
  var TIERS = {
    1: { pts: 10, name: '銅', cls: 't1' },
    2: { pts: 25, name: '銀', cls: 't2' },
    3: { pts: 50, name: '金', cls: 't3' },
    4: { pts: 100, name: '傳說', cls: 't4' },
  };
  var ACH = [
    { id: 'fish1', icon: '🎣', name: '初次上鉤', desc: '在學園湖釣到第一條魚', tier: 1 },
    { id: 'fishwin', icon: '🏆', name: '垂釣大賽冠軍', desc: '60 秒釣魚大賽達到 150 分', tier: 2 },
    { id: 'fishdex', icon: '📖', name: '魚類圖鑑大師', desc: '收集全部 7 種湖中生物', tier: 3 },
    { id: 'bbwin', icon: '🏀', name: '街頭神射手', desc: '贏得三分投籃大賽（10 球 18 分）', tier: 2 },
    { id: 'bb25', icon: '🔥', name: '三分雨', desc: '單場投籃拿下 25 分以上', tier: 3 },
    { id: 'pkwin', icon: '⚽', name: 'PK 英雄', desc: '贏得十二碼 PK 大戰', tier: 2 },
    { id: 'pksave', icon: '🧤', name: '神之守門員', desc: '單場 PK 撲出 3 球以上', tier: 3 },
    { id: 'tnwin', icon: '🎾', name: '網球王子', desc: '先拿 5 分擊敗網球教練', tier: 2 },
    { id: 'tnrally', icon: '⚡', name: '連擊大師', desc: '網球單一回合連續回擊 12 拍', tier: 3 },
    { id: 'pet4', icon: '🐾', name: '萌寵之友', desc: '和 4 種校園萌寵互動', tier: 1 },
    { id: 'petall', icon: '💞', name: '萌寵全收集', desc: '和全部 8 種校園萌寵互動', tier: 2 },
    { id: 'frog', icon: '🐸', name: '傳說發現者', desc: '找到每天躲在睡蓮葉上的小綠蛙', tier: 4, secret: true },
    { id: 'wood10', icon: '🪓', name: '小小樵夫', desc: '累積砍倒 10 棵樹', tier: 1 },
    { id: 'wood50', icon: '🌲', name: '伐木達人', desc: '累積砍倒 50 棵樹', tier: 2 },
    { id: 'chopwin', icon: '🪵', name: '伐木挑戰王', desc: '45 秒內砍倒 8 棵樹', tier: 3 },
    { id: 'trip20', icon: '🏎️', name: '校園車神', desc: '開車出遊 20 趟', tier: 2 },
    { id: 'tour6', icon: '🏫', name: '學院巡禮', desc: '造訪 6 間不同的學院／實戰館', tier: 2 },
    { id: 'plane', icon: '✈️', name: '追飛機的人', desc: '點到偶爾飛過校園上空的飛機', tier: 2, secret: true },
  ];
  var ACH_BY = {};
  ACH.forEach(function (a) { ACH_BY[a.id] = a; });
  var MAX_SCORE = ACH.reduce(function (s, a) { return s + TIERS[a.tier].pts; }, 0);
  function scoreOf(ids) {
    var s = 0;
    (ids || []).forEach(function (id) { if (ACH_BY[id]) s += TIERS[ACH_BY[id].tier].pts; });
    return s;
  }
  function myBadges() { return ACH.filter(function (a) { return ST.ach[a.id]; }).map(function (a) { return a.id; }); }
  F.ACH = ACH;
  F.ACH_BY = ACH_BY;
  F.TIERS = TIERS;
  F.MAX_SCORE = MAX_SCORE;
  F.scoreOf = scoreOf;
  F.myBadges = myBadges;
  F.myScore = function () { return scoreOf(myBadges()); };
  F.badgeChips = function (ids, max) {
    var list = (ids || []).filter(function (id) { return ACH_BY[id]; });
    list.sort(function (a, b) { return ACH_BY[b].tier - ACH_BY[a].tier; });
    var shown = list.slice(0, max || 8).map(function (id) {
      var a = ACH_BY[id];
      return '<span class="bdg ' + TIERS[a.tier].cls + '" title="' + esc(a.name + '（' + TIERS[a.tier].name + '）：' + a.desc) + '">' + a.icon + '</span>';
    }).join('');
    return shown + (list.length > (max || 8) ? '<span class="bdg more">+' + (list.length - (max || 8)) + '</span>' : '');
  };

  var toastQ = [];
  var toastBusy = false;
  function showBadgeToast(a) {
    toastQ.push(a);
    if (toastBusy) return;
    var el = document.getElementById('badgeToast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'badgeToast';
      el.className = 'badge-toast';
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    (function next() {
      var it = toastQ.shift();
      if (!it) { toastBusy = false; return; }
      toastBusy = true;
      var t = TIERS[it.tier];
      el.innerHTML = '<span class="bt-ic ' + t.cls + '">' + it.icon + '</span><div><small>🏅 解鎖' + t.name + '牌成就 · +' + t.pts + ' 點</small><b>' + esc(it.name) + '</b><span>' + esc(it.desc) + '</span></div>';
      el.classList.add('show');
      setTimeout(function () {
        el.classList.remove('show');
        setTimeout(next, 320);
      }, 2800);
    })();
  }
  function unlock(id) {
    var a = ACH_BY[id];
    if (!a || ST.ach[id]) return false;
    ST.ach[id] = Date.now();
    save(true);
    showBadgeToast(a);
    if (F.syncPresence) F.syncPresence(true);
    return true;
  }
  F.unlock = unlock;

  function visitCount() {
    try {
      var v = JSON.parse(localStorage.getItem(VISITS_KEY) || '{}') || {};
      return Object.keys(v).filter(function (id) { return C.building(id); }).length;
    } catch (e) { return 0; }
  }
  function checkProgress() {
    if (ST.fishTotal >= 1) unlock('fish1');
    if (Object.keys(ST.fishCaught).length >= 7) unlock('fishdex');
    var pets = Object.keys(ST.animalsMet).length;
    if (pets >= 4) unlock('pet4');
    if (pets >= (L.animals || []).length) unlock('petall');
    if (ST.wood >= 10) unlock('wood10');
    if (ST.wood >= 50) unlock('wood50');
    if (ST.carTrips >= 20) unlock('trip20');
    if (visitCount() >= 6) unlock('tour6');
  }
  F.checkProgress = checkProgress;

  // 小遊戲回報結果：統計勝場／最佳成績並解鎖成就
  F.reportGame = function (kind, res) {
    var g = ST.games[kind] = obj(ST.games[kind]);
    g.plays = (g.plays || 0) + 1;
    if (res.win) g.wins = (g.wins || 0) + 1;
    if (typeof res.score === 'number' && res.score > (g.best || 0)) g.best = res.score;
    save(true);
    var rules = {
      fishing: function () { if (res.win) unlock('fishwin'); },
      basketball: function () { if (res.win) unlock('bbwin'); if (res.score >= 25) unlock('bb25'); },
      soccer: function () { if (res.win) unlock('pkwin'); if ((res.saves || 0) >= 3) unlock('pksave'); },
      tennis: function () { if (res.win) unlock('tnwin'); },
      chop: function () { if (res.win) unlock('chopwin'); },
    };
    if (rules[kind]) rules[kind]();
    checkProgress();
  };

  /* ------------------------------------------------------------ 地圖特效 */
  var SVGNS = 'http://www.w3.org/2000/svg';
  function fxLayer() { return document.querySelector('#campusMap .m-fx'); }
  function spawnMapBubble(x, y, text, color) {
    var fx = fxLayer();
    if (!fx) return;
    var g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'fun-pop');
    g.setAttribute('transform', 'translate(' + Math.round(x) + ',' + Math.round(y - 26) + ')');
    var w = Math.max(80, Math.min(300, text.length * 13 + 24));
    var bg = color || '#1d6b57';
    g.innerHTML = '<g class="fun-pop-in"><rect x="' + (-w / 2) + '" y="-28" width="' + w + '" height="26" rx="13" fill="' + bg + '" stroke="#ffffff" stroke-width="1.5"/>' +
      '<path d="M-5,-2 L0,5 L5,-2 Z" fill="' + bg + '"/>' +
      '<text x="0" y="-10.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">' + esc(text) + '</text></g>';
    fx.appendChild(g);
    setTimeout(function () { if (g.parentNode) g.parentNode.removeChild(g); }, 2300);
  }
  F.bubble = spawnMapBubble;
  function floatFx(x, y, text) {
    var fx = fxLayer();
    if (!fx) return;
    var t = document.createElementNS(SVGNS, 'text');
    t.setAttribute('class', 'float-fx');
    t.setAttribute('x', Math.round(x));
    t.setAttribute('y', Math.round(y));
    t.setAttribute('text-anchor', 'middle');
    t.textContent = text;
    fx.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 750);
  }
  function restartClass(el, cls) {
    el.classList.remove(cls);
    void el.getBoundingClientRect();
    el.classList.add(cls);
  }
  function posOf(el) {
    var m = /translate\(\s*([-\d.]+)[ ,]+([-\d.]+)/.exec(el.getAttribute('transform') || '');
    return m ? { x: +m[1], y: +m[2] } : { x: 0, y: 0 };
  }
  F.posOf = posOf;
  var lastToastAt = {};
  function toastOnce(key, msg, ms) {
    var now = Date.now();
    if (now - (lastToastAt[key] || 0) < (ms || 3000)) return;
    lastToastAt[key] = now;
    C.toast(msg);
  }

  /* ------------------------------------------------------------ 🐾 萌寵（每日位置）＋ 🐸 傳說小綠蛙 */
  var PET_SAY = {
    shiba: '汪汪！🐶❤️', cat: '喵嗚～🐾💕', ducks: '呱呱呱！🦆💦', swan: '優雅行禮 🦢✨',
    squirrel: '送你幸運松果 🌰', turtle: '穩紮穩打 🐢🌿', owl: '咕咕！智慧 +100 🦉', bunny: '蹦蹦跳跳！🐰🎵',
  };
  function handleAnimalClick(id, el) {
    var a = (L.animals || []).filter(function (x) { return x.id === id; })[0];
    if (!a) return;
    ST.animalsMet[a.id] = (ST.animalsMet[a.id] || 0) + 1;
    save();
    if (el) {
      restartClass(el, 'animal-jump');
      setTimeout(function () { el.classList.remove('animal-jump'); }, 900);
    }
    spawnMapBubble(a.x, a.y, PET_SAY[a.id] || a.name, '#be185d');
    C.toast(a.msg + '（萌寵圖鑑 ' + Object.keys(ST.animalsMet).length + ' / ' + L.animals.length + '）');
    checkProgress();
  }
  function handleFrog(el) {
    var f = L.frog;
    restartClass(el, 'frog-found');
    spawnMapBubble(f.x, f.y - 4, '🐸 呱！被你發現了！', '#15803d');
    if (!unlock('frog')) C.toast('🐸 小綠蛙：呱～明天我會換一片睡蓮葉躲喔！');
  }

  /* ------------------------------------------------------------ 🪓 砍樹（75 秒後長回來）＋ 伐木挑戰 */
  var TREE_HP = 3;
  var REGROW_MS = 75000;
  var STUMP = '<ellipse cx="0" cy="1" rx="6.5" ry="2.2" fill="rgba(74,59,47,.18)" stroke="none"/>' +
    '<path d="M-4 0V-5h8V0Z" fill="#9b6b47"/><ellipse cx="0" cy="-5" rx="4" ry="1.6" fill="#e6c08f"/>' +
    '<path d="M-1.4 -5.1a1.4 .55 0 1 0 2.8 0" fill="none" stroke="#b07a4a" stroke-width=".5"/>';
  function chopTree(el) {
    var inn = el.querySelector('.tree-in');
    if (!inn) return;
    if (el._down) { toastOnce('regrow', '🌱 這棵樹正在重新長大，換一棵吧！'); return; }
    if (!ST.chopHint) {
      ST.chopHint = true;
      save();
      C.toast('🪓 砍樹：每棵樹點 3 下就會倒下，75 秒後會自己長回來！到「🎮 校園互動」還有伐木挑戰');
    }
    if (el._hp == null) el._hp = TREE_HP;
    el._hp -= 1;
    var p = posOf(el);
    restartClass(inn, 'chop');
    floatFx(p.x + (Math.random() * 10 - 5), p.y - 26, el._hp > 0 ? '咚！' : '倒～');
    if (el._hp > 0) return;
    el._down = true;
    if (!el._art) el._art = inn.innerHTML;
    var sc = inn.firstElementChild ? inn.firstElementChild.getAttribute('transform') || '' : '';
    inn.classList.remove('chop');
    inn.classList.add('fall');
    setTimeout(function () {
      inn.classList.remove('fall');
      inn.innerHTML = '<g class="ca-deco"' + (sc ? ' transform="' + sc + '"' : '') + ' stroke="#4a3b2f" stroke-width="1">' + STUMP + '</g>';
    }, 480);
    ST.wood += 1;
    save();
    spawnMapBubble(p.x, p.y - 8, '🪵 +1 木材（共 ' + ST.wood + '）', '#92400e');
    checkProgress();
    if (CH) chChop();
    setTimeout(function () {
      if (!document.contains(el)) return;
      inn.innerHTML = el._art;
      restartClass(inn, 'regrow');
      el._down = false;
      el._hp = TREE_HP;
    }, REGROW_MS);
  }

  var CH = null;
  function chopHud() {
    var el = document.getElementById('chopHud');
    if (!el) {
      el = document.createElement('div');
      el.id = 'chopHud';
      el.className = 'chop-hud';
      var wrap = document.getElementById('mapWrap');
      if (wrap) wrap.appendChild(el);
    }
    return el;
  }
  function renderChopHud() {
    if (!CH) return;
    var el = chopHud();
    el.hidden = false;
    var pct = Math.round((CH.got / CH.need) * 100);
    el.innerHTML = '<b>🪓 伐木挑戰</b><span class="ch-t' + (CH.left <= 10 ? ' warn' : '') + '">⏱ ' + Math.ceil(CH.left) + ' 秒</span>' +
      '<span class="ch-bar"><i style="width:' + pct + '%"></i></span><span>' + CH.got + ' / ' + CH.need + ' 棵</span>' +
      '<button type="button" class="car-close" id="chopQuit" aria-label="放棄挑戰">✕</button>';
  }
  function startChopChallenge() {
    closeFunModal();
    if (CH) return;
    CH = { left: 45, got: 0, need: 8, last: performance.now() };
    if (C.map && C.map.reset) C.map.reset();
    C.toast('🪓 伐木挑戰開始！45 秒內砍倒 8 棵樹（每棵點 3 下）');
    renderChopHud();
    CH.timer = setInterval(function () {
      var now = performance.now();
      if (!document.hidden) CH.left -= (now - CH.last) / 1000;
      CH.last = now;
      if (CH.left <= 0) { finishChop(false); return; }
      renderChopHud();
    }, 200);
  }
  function chChop() {
    CH.got += 1;
    renderChopHud();
    if (CH.got >= CH.need) finishChop(true);
  }
  function finishChop(win, quit) {
    if (!CH) return;
    clearInterval(CH.timer);
    var used = Math.round(45 - CH.left);
    CH = null;
    var el = chopHud();
    el.innerHTML = win
      ? '<b>🏆 挑戰成功！</b><span>' + used + ' 秒砍倒 8 棵樹，伐木王就是你！</span>'
      : '<b>' + (quit ? '🏳️ 已放棄挑戰' : '⏰ 時間到！') + '</b><span>差一點點，再挑戰一次吧！</span>';
    el.classList.add(win ? 'win' : 'lose');
    if (!quit) F.reportGame('chop', { win: win, score: win ? 45 - used : 0 });
    setTimeout(function () { el.hidden = true; el.classList.remove('win', 'lose'); }, 3600);
  }
  document.addEventListener('click', function (e) {
    if (e.target && e.target.id === 'chopQuit') finishChop(false, true);
  });

  /* ------------------------------------------------------------ 🎮 遊樂場視窗 */
  var activeCleanup = null;
  function ensureFunModal() {
    var bd = document.getElementById('funModal');
    if (bd) return bd;
    bd = document.createElement('div');
    bd.className = 'modal-bd';
    bd.id = 'funModal';
    bd.hidden = true;
    bd.innerHTML = '<div class="modal fun-modal" role="dialog" aria-modal="true" aria-label="校園遊樂場">' +
      '<button type="button" class="modal-x" id="funModalClose" aria-label="關閉">✕</button>' +
      '<div class="modal-body" id="funModalBody"></div></div>';
    document.body.appendChild(bd);
    bd.addEventListener('click', function (e) {
      if (e.target === bd || (e.target.closest && e.target.closest('#funModalClose'))) { closeFunModal(); return; }
      var tab = e.target.closest ? e.target.closest('[data-fun-tab]') : null;
      if (tab) { openFunModal(tab.getAttribute('data-fun-tab')); return; }
      var act = e.target.closest ? e.target.closest('[data-hub-act]') : null;
      if (act) hubAction(act.getAttribute('data-hub-act'), act);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !bd.hidden) closeFunModal();
    });
    return bd;
  }
  function closeFunModal() {
    if (activeCleanup) { try { activeCleanup(); } catch (e) { /* ignore */ } activeCleanup = null; }
    var bd = document.getElementById('funModal');
    if (!bd || bd.hidden) return;
    bd.classList.remove('open');
    bd.hidden = true;
    if (!document.querySelector('.modal-bd.open')) document.body.classList.remove('modal-open');
  }
  F.closeFunModal = closeFunModal;
  var TABS = [
    { id: 'hub', label: '🏅 成就＆圖鑑' },
    { id: 'fishing', label: '🎣 釣魚大賽' },
    { id: 'basketball', label: '🏀 三分大賽' },
    { id: 'soccer', label: '⚽ PK 大戰' },
    { id: 'tennis', label: '🎾 網球對決' },
  ];
  F.tabsHtml = function (active) {
    return '<div class="fun-tabs" role="tablist">' + TABS.map(function (t) {
      return '<button type="button" role="tab" class="fun-tab' + (t.id === active ? ' on' : '') + '" aria-selected="' + (t.id === active) + '" data-fun-tab="' + t.id + '">' + esc(t.label) + '</button>';
    }).join('') + '</div>';
  };
  function openFunModal(kind) {
    if (activeCleanup) { try { activeCleanup(); } catch (e) { /* ignore */ } activeCleanup = null; }
    var bd = ensureFunModal();
    var body = document.getElementById('funModalBody');
    bd.hidden = false;
    bd.classList.add('open');
    document.body.classList.add('modal-open');
    var game = F.games && F.games[kind];
    if (game) activeCleanup = game(body) || null;
    else renderHub(body);
    body.scrollTop = 0;
  }
  F.openFunModal = openFunModal;

  /* ------------------------------------------------------------ 🏅 成就＆圖鑑中心 */
  var GAME_CARDS = [
    { id: 'fishing', icon: '🎣', name: '學園湖釣魚大賽', rule: '60 秒內釣到 150 分' },
    { id: 'basketball', icon: '🏀', name: '三分投籃大賽', rule: '10 球拿下 18 分' },
    { id: 'soccer', icon: '⚽', name: '十二碼 PK 大戰', rule: '5 輪踢＋守，進球多者勝' },
    { id: 'tennis', icon: '🎾', name: '網球對決', rule: '先拿 5 分擊敗教練' },
  ];
  function renderHub(body) {
    var badges = myBadges();
    var score = scoreOf(badges);
    var rank = F.myRank ? F.myRank() : null;
    var animals = L.animals || [];
    var html = F.tabsHtml('hub') +
      '<div class="hub-hero"><div><h2>🎮 校園遊樂場 · 成就中心</h2><p class="fg-sub">玩小遊戲、摸萌寵、砍樹、找傳說生物都能解鎖徽章，成就點數會同步到「🏆 排行榜」讓其他學員看到！</p></div>' +
      '<div class="hub-score"><b>' + score + '</b><small>/ ' + MAX_SCORE + ' 成就點數</small>' +
      '<span>🏅 ' + badges.length + ' / ' + ACH.length + ' 徽章' + (rank ? ' · 第 ' + rank + ' 名' : '') + '</span></div></div>';
    html += '<div class="hub-grid">' + GAME_CARDS.map(function (g) {
      var s = obj(ST.games[g.id]);
      return '<button type="button" class="hub-card" data-fun-tab="' + g.id + '"><span class="hub-ic">' + g.icon + '</span><b>' + g.name + '</b><small>' + g.rule + '</small>' +
        '<em>' + (s.plays ? '勝 ' + (s.wins || 0) + ' / ' + s.plays + ' 場' : '還沒挑戰過') + '</em></button>';
    }).join('') +
      '<button type="button" class="hub-card chop" data-hub-act="chop"><span class="hub-ic">🪓</span><b>伐木挑戰</b><small>45 秒內在地圖上砍倒 8 棵樹</small><em>累積木材 ' + ST.wood + ' 根</em></button>' +
      '</div>';
    html += '<div class="hub-acts"><button type="button" class="btn sm primary" data-hub-act="rank">🏆 成就排行榜</button>' +
      '<button type="button" class="btn sm" data-hub-act="card">🪪 我的學生證</button>' +
      '<button type="button" class="btn sm" data-hub-act="car">🚗 校園專車導航</button></div>';
    html += '<div class="fg-sec">🏅 成就徽章（' + badges.length + ' / ' + ACH.length + '）</div><div class="ach-grid">' + ACH.map(function (a) {
      var got = !!ST.ach[a.id];
      var t = TIERS[a.tier];
      var hidden = a.secret && !got;
      return '<div class="ach ' + t.cls + (got ? ' got' : '') + '"><span class="ach-ic">' + (hidden ? '❔' : a.icon) + '</span>' +
        '<div><b>' + esc(hidden ? '？？？ 隱藏成就' : a.name) + '</b><small>' + esc(hidden ? '在校園裡仔細觀察，也許會有驚喜…' : a.desc) + '</small></div>' +
        '<span class="ach-pt">' + t.name + ' ' + t.pts + '</span></div>';
    }).join('') + '</div>';
    var met = Object.keys(ST.animalsMet).length;
    html += '<div class="fg-sec">🐾 校園萌寵圖鑑（' + met + ' / ' + animals.length + ' · 每天出沒地點都不一樣）</div><div class="fg-dex">' + animals.map(function (a) {
      var cnt = ST.animalsMet[a.id] || 0;
      return '<button type="button" class="dex-card unlocked" data-hub-act="find" data-animal="' + esc(a.id) + '">' +
        '<span class="dex-ic">' + esc(a.name.split(' ')[0]) + '</span><span class="dex-info"><b>' + esc(a.name) + '</b>' +
        '<small>📍 今日出沒：' + esc(a.where) + '</small><small>' + (cnt ? '💕 已互動 ' + cnt + ' 次' : '👀 還沒遇見 · 點我飛過去') + '</small></span></button>';
    }).join('') +
      '<div class="dex-card legend' + (ST.ach.frog ? ' unlocked' : '') + '"><span class="dex-ic">' + (ST.ach.frog ? '🐸' : '❔') + '</span><span class="dex-info"><b>' + (ST.ach.frog ? '🐸 睡蓮小綠蛙（傳說）' : '？？？ 傳說生物') + '</b>' +
      '<small>📜 傳說學園湖有個害羞的綠色小傢伙，每天換一片睡蓮葉曬太陽，牠和葉子幾乎一樣綠……放大地圖仔細找！</small></span></div></div>';
    body.innerHTML = html;
  }
  function hubAction(act, el) {
    if (act === 'chop') { startChopChallenge(); return; }
    closeFunModal();
    if (act === 'rank' && F.openOnline) F.openOnline('rank');
    else if (act === 'card' && F.openStudent) F.openStudent();
    else if (act === 'car' && F.openCarHud) F.openCarHud();
    else if (act === 'find') {
      var aid = el.getAttribute('data-animal');
      var a = (L.animals || []).filter(function (x) { return x.id === aid; })[0];
      if (!a) return;
      if (C.map.flyToPoint) C.map.flyToPoint(a.x, a.y, 640, 480);
      setTimeout(function () { handleAnimalClick(aid, document.querySelector('#campusMap .animal[data-animal="' + aid + '"]')); }, 520);
    }
  }

  /* ------------------------------------------------------------ 事件 */
  C.on('fun', function (ev) {
    if (!ev || !ev.kind) return;
    var k = ev.kind;
    if (k === 'animal') handleAnimalClick(ev.id, ev.el);
    else if (k === 'frog') handleFrog(ev.el);
    else if (k === 'tree') chopTree(ev.el);
    else if (k === 'fishing') {
      if (ev.fish) C.toast('🐟 水裡有「' + ev.fish + '」游過去了！準備拋竿～');
      openFunModal('fishing');
    } else if (k === 'basketball' || k === 'tennis' || k === 'soccer' || k === 'hub') openFunModal(k);
  });
  C.on('visit', checkProgress);
  setTimeout(checkProgress, 1200);
})();

</script>
  <script>/* js/games.js */
/* 開心學園 · games.js — 校園小遊戲（有輸贏、難度中等、60fps 流暢）
 *   🎣 學園湖釣魚大賽：60 秒內拿 150 分（上鉤後按住收線，讓綠色收線框罩住魚）
 *   🏀 三分投籃大賽：10 球拿 18 分（看準力道條甜蜜點，連進加分，後半場籃框會移動）
 *   ⚽ 十二碼 PK 大戰：5 輪輪流踢＋守（守門員會記住你的習慣、對手起腳前有假動作提示），進球多者勝
 *   🎾 網球對決：先拿 5 分擊敗會預判的網球教練
 * 共用：高解析度 Canvas（devicePixelRatio）、靜態背景預先繪製、分頁隱藏自動暫停、結果卡＋星等＋成就。
 */
(function () {
  'use strict';
  var C = window.CAMPUS;
  if (!C || C.redirecting) return;
  var F = (C.fun = C.fun || {});
  var esc = C.util.esc;
  var clamp = C.util.clamp;
  var FONT = "-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC',sans-serif";

  /* ------------------------------------------------------------ 共用工具 */
  function dpr() { return Math.min(2, window.devicePixelRatio || 1); }
  function setup(cvs, W, H) {
    var r = dpr();
    cvs.width = Math.round(W * r);
    cvs.height = Math.round(H * r);
    var ctx = cvs.getContext('2d');
    ctx.setTransform(r, 0, 0, r, 0, 0);
    return ctx;
  }
  function prerender(W, H, draw) {
    var c = document.createElement('canvas');
    draw(setup(c, W, H));
    return c;
  }
  function loop(step) {
    var alive = true, raf = 0, last = performance.now();
    function f(now) {
      if (!alive) return;
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (!document.hidden) step(dt, now);
      raf = requestAnimationFrame(f);
    }
    raf = requestAnimationFrame(f);
    return function () { alive = false; cancelAnimationFrame(raf); };
  }
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function text(ctx, s, x, y, size, color, align, weight) {
    ctx.font = (weight || 800) + ' ' + size + 'px ' + FONT;
    ctx.fillStyle = color;
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(s, x, y);
  }
  function stars(score, th) { return score >= th[2] ? 3 : score >= th[1] ? 2 : score >= th[0] ? 1 : 0; }
  function starStr(n) { return '★★★'.slice(0, n) + '☆☆☆'.slice(0, 3 - n); }
  function shell(body, kind, title, rule, stats, hud) {
    body.innerHTML = F.tabsHtml(kind) +
      '<div class="fg-head"><div><h2>' + title + '</h2><p class="fg-sub">' + rule + '</p></div><div class="fg-stats">' + stats + '</div></div>' +
      '<div class="g-stage"><canvas class="g-cvs" id="gCvs"></canvas><div class="g-ov" id="gOv" hidden></div></div>' +
      '<div class="g-hud"><span class="g-status" id="gStatus"></span><div class="g-btns">' + hud + '</div></div>';
    return { cvs: document.getElementById('gCvs'), ov: document.getElementById('gOv'), status: document.getElementById('gStatus') };
  }
  function overlay(ov, o) {
    var cls = o.win === true ? ' win' : o.win === false ? ' lose' : '';
    ov.innerHTML = '<div class="g-card' + cls + '"><div class="g-ic">' + o.icon + '</div><h3>' + esc(o.title) + '</h3>' +
      (o.stars != null ? '<div class="g-stars">' + starStr(o.stars) + '</div>' : '') +
      '<p>' + o.sub + '</p><button type="button" class="btn primary big" id="gOvBtn">' + esc(o.btn) + '</button></div>';
    ov.hidden = false;
    var b = document.getElementById('gOvBtn');
    b.focus({ preventScroll: true });
    b.onclick = function () { ov.hidden = true; o.onBtn(); };
  }
  function bestOf(kind) { var g = F.ST.games[kind]; return g && g.best ? g.best : 0; }
  function keys(onDown, onUp) {
    function d(e) {
      if (e.repeat && e.code === 'Space') { e.preventDefault(); return; }
      if (onDown(e) === true) e.preventDefault();
    }
    function u(e) { if (onUp && onUp(e) === true) e.preventDefault(); }
    window.addEventListener('keydown', d);
    window.addEventListener('keyup', u);
    return function () { window.removeEventListener('keydown', d); window.removeEventListener('keyup', u); };
  }
  function canvasPoint(cvs, e, W, H) {
    var r = cvs.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  }

  /* ============================================================
   * 🎣 學園湖釣魚大賽
   * ============================================================ */
  var FISH = [
    { id: 'crucian', name: '學園小鯽魚', icon: '🐟', col: '#60a5fa', pts: 10, w: 30, spd: 0.5, zw: 0.27 },
    { id: 'koi_rw', name: '紅白錦鯉', icon: '🐠', col: '#ef4444', pts: 25, w: 20, spd: 0.68, zw: 0.24 },
    { id: 'shrimp', name: '湖畔大螯蝦', icon: '🦐', col: '#f97316', pts: 20, w: 15, spd: 0.8, zw: 0.23 },
    { id: 'puffer', name: '氣噗噗河豚', icon: '🐡', col: '#f59e0b', pts: 35, w: 12, spd: 0.9, zw: 0.21 },
    { id: 'turtle_sp', name: '長壽小靈龜', icon: '🐢', col: '#10b981', pts: 50, w: 8, spd: 0.6, zw: 0.2 },
    { id: 'boot', name: '傳說的黃金雨鞋', icon: '👢', col: '#eab308', pts: 5, w: 8, spd: 0.3, zw: 0.3 },
    { id: 'dragon_koi', name: '黃金龍魚王', icon: '👑', col: '#d97706', pts: 100, w: 7, spd: 1.15, zw: 0.17 },
  ];
  F.FISH = FISH;
  function pickFish() {
    var tot = FISH.reduce(function (s, f) { return s + f.w; }, 0), r = Math.random() * tot;
    for (var i = 0; i < FISH.length; i++) { r -= FISH[i].w; if (r <= 0) return FISH[i]; }
    return FISH[0];
  }
  function fishing(body) {
    var W = 640, H = 320, GOAL = 150, TIME = 60, TH = [150, 230, 320];
    var ST = F.ST;
    var ui = shell(body, 'fishing', '🎣 學園湖釣魚大賽',
      '點湖面拋竿 → 浮標猛沉出現「❗」時馬上點擊 → <b>按住</b>滑鼠／空白鍵讓綠框往右、放開往左，罩住魚直到收線條滿格！',
      '<span class="fg-badge">⏱ <b id="fsTime">60</b> 秒</span><span class="fg-badge gold">🎯 <b id="fsScore">0</b> / ' + GOAL + '</span><span class="fg-badge">🏆 最佳 ' + bestOf('fishing') + '</span>',
      '<button type="button" class="btn primary sm" id="fsAct">🎯 拋竿</button><button type="button" class="btn sm g-hold" id="fsHold" hidden>✊ 按住收線</button>');
    body.insertAdjacentHTML('beforeend', '<div class="fg-sec">📖 學園湖圖鑑（<span id="fsDexN"></span>）</div><div class="fg-dex" id="fsDex"></div>');
    var ctx = setup(ui.cvs, W, H);
    var tEl = document.getElementById('fsTime'), sEl = document.getElementById('fsScore');

  // 你的座駕沿道路開到 (tx,ty)；遇到行人會停車禮讓
  function driveMine(tx, ty, endAng, label, opts, done) {
    opts = opts || {};

    if (V.carMover) dropMover(V.carMover);
    if (label) setTag(car, 'car-tag', label);
    car.classList.add('moving');
    var pts = route(V.carPos, tx, ty);
    var m = new Mover(car, pts, {
      vmax: opts.vmax || 380, acc: opts.acc || 900,
      onMove: function (p) { V.carPos = { x: p.x, y: p.y, ang: p.ang }; },
      onDone: function () {
        V.carMover = null;

        car.querySelector('.veh-rot').setAttribute('transform', 'rotate(' + V.carPos.ang + ')');
        setTag(car, 'car-tag', myLabel());
        car.classList.remove('moving');
        if (done) done();
      },
    });
    if (m.done) { V.carPos = { x: tx, y: ty, ang: endAng == null ? V.carPos.ang : endAng }; m.onDone(); return; }

  /* ------------------------------------------------------------ ✈️ 觀光飛機 */
  var BANNERS = ['🎓 開心學園 歡迎新生！', '📚 今天也要好好學習！', '🏆 成就排行榜等你挑戰', '🐸 聽說湖裡有傳說生物…', '🪓 樹砍了會再長回來喔', '🚸 開車記得禮讓行人'];
  function schedulePlane(ms) { setTimeout(launchPlane, ms != null ? ms : 40000 + Math.random() * 50000); }
  function launchPlane() {
    var sky = document.getElementById('mapSky');
    if (!sky || plane || document.hidden || document.body.classList.contains('view-dir')) { schedulePlane(); return; }
    var ltr = Math.random() < 0.5, y0 = 90 + Math.random() * 300, y1 = y0 + (Math.random() - 0.5) * 140;
    var msg = BANNERS[Math.floor(Math.random() * BANNERS.length)];
    var bw = msg.length * 12 + 24;
    var sh = document.createElementNS(SVGNS, 'g');
    sh.setAttribute('class', 'plane-shadow');

    g.innerHTML = '<g transform="scale(' + (ltr ? 1 : -1) + ',1)">' +
      '<rect class="hit" x="' + (-bw - 64) + '" y="-30" width="' + (bw + 108) + '" height="60" fill="transparent"/>' +
      '<g pointer-events="none"><path d="M-36 0H-60" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>' +
      '<g transform="translate(' + (-60 - bw) + ',-11)"><path d="M0 0H' + bw + 'V22H0L7 11Z" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>' +
      '<text x="' + (bw / 2 + 3) + '" y="15" text-anchor="middle" font-size="12" font-weight="800" fill="#92400e"' + (ltr ? '' : ' transform="scale(-1,1) translate(' + (-bw - 6) + ',0)"') + '>' + esc(msg) + '</text></g>' +
      '<path d="M-36 0C-36 -7 -26 -9 -10 -9H22C30 -9 36 -5 38 0C36 5 30 9 22 9H-10C-26 9 -36 7 -36 0Z" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>' +
      '<path d="M-2 -8L10 -30H18L12 -8ZM-2 8L10 30H18L12 8Z" fill="#60a5fa" stroke="#334155" stroke-width="1.2"/>' +
      '<path d="M-30 -6L-36 -20H-30L-22 -7Z" fill="#ef4444" stroke="#334155" stroke-width="1.1"/>' +
      '<path d="M-4 -3h4v3h-4zM4 -3h4v3h-4zM12 -3h4v3h-4zM20 -3h4v3h-4z" fill="#bae6fd"/>' +
      '<g transform="translate(39,0)"><ellipse class="prop" rx="2" ry="9" fill="#475569"/></g></g></g>';
    sky.appendChild(sh);
    sky.appendChild(g);
    plane = { el: g, sh: sh, t: 0, dur: 15, x0: ltr ? -320 : L.W + 320, x1: ltr ? L.W + 320 : -320, y0: y0, y1: y1 };
  }
  function stepPlane(dt) {
    plane.t += dt / plane.dur;
    if (plane.t >= 1) {
      plane.el.remove(); plane.sh.remove(); plane = null;
      schedulePlane();
      return;
    }
    var x = plane.x0 + (plane.x1 - plane.x0) * plane.t, y = plane.y0 + (plane.y1 - plane.y0) * plane.t + Math.sin(plane.t * 12) * 4;
    plane.el.setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')');
    plane.sh.setAttribute('transform', 'translate(' + (x + 30).toFixed(1) + ',' + (y + 150).toFixed(1) + ')');
  }

  /* ============================================================

   * ============================================================ */
  var PEERS = {};
  var bc = null, lastNtfy = 0;
  var SIMS = [
    { uid: 'sim_azhe', name: '阿哲', avatar: '🦊', title: '💹 財經特攻隊', carIdx: 1, blds: ['stock', 'finance', 'finance-ta', 'finance-chip'], badges: ['fish1', 'fishwin', 'trip20', 'tour6', 'pet4', 'bbwin'] },

  ];
  function myPayload() {
    var badges = F.myBadges();
    return {
      uid: MY.uid, stuNo: MY.stuNo, name: MY.name, confirmed: !!MY.confirmed, avatar: MY.avatar, title: MY.title,
      carIdx: MY.carIdx, carColor: MY.carColor, carName: MY.carName,

      badges: badges, score: F.scoreOf(badges), ts: Math.floor(Date.now() / 1000),

  function syncPresence(remote) {
    // 只有使用者親自設定並確認名稱後（MY.confirmed && MY.name）才廣播上線，徹底杜絕自動隨機分身與測試瀏覽器
    if (IS_BOT || !MY.confirmed || !MY.name) { updateCount(); return; }
    var payload = myPayload();
    if (bc) { try { bc.postMessage(payload); } catch (e) { /* ignore */ } }
    if (C.env.mode === 'cloudtop') {
      fetch('/api/presence', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), keepalive: true })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) { if (j && Array.isArray(j.peers)) ingestList(j.peers); })
        .catch(function () { /* 離線 */ });
    }
    var now = Date.now();
    if (remote || now - lastNtfy > 55000) {
      lastNtfy = now;
      fetch('https://ntfy.sh/' + NTFY_TOPIC, { method: 'POST', body: JSON.stringify(payload), keepalive: true }).catch(function () { /* 離線 */ });
    }
    updateCount();
  }
  F.syncPresence = syncPresence;
  function isOnline(p) { return p.isSim ? ST.simEnabled : Math.floor(Date.now() / 1000) - p.ts <= 240; }
  function isVisible(p) { return p.isSim ? ST.simEnabled : Math.floor(Date.now() / 1000) - p.ts <= 21600; }
  function ingest(u) {
    if (!u || typeof u !== 'object') return;
    var uid = String(u.uid || '').trim();
    if (!uid || uid === MY.uid) return;
    var isSim = uid.indexOf('sim_') === 0 || !!u.is_sim;
    if (isSim && !ST.simEnabled) return;
    var uname = String(u.name || '').trim().slice(0, 16);
    // 忽略未經本人確認（!u.confirmed）或空白／預設名稱的訪客，避免任何虛擬或未設定分身出現在名單
    if (!isSim && (!u.confirmed || !uname || uname === '學員' || uname === '開心學員')) return;
    C.emit('presence-msg', u); // 📢 校園公告（news.js）累積今日人次
    var c = CAR_CATALOG[clamp(+u.carIdx || 0, 0, 6)];
    var b = C.building(u.buildingId);
    var ts = +u.ts || Math.floor(Date.now() / 1000);
    if (ts > 2e10) ts = Math.floor(ts / 1000);
    var p = PEERS[uid];
    if (p && ts < p.ts) return;
    var prevB = p ? p.buildingId : null;
    p = p || { uid: uid, el: null, pos: null, mover: null };
    p.name = uname || '學員';
    p.confirmed = true;
    p.avatar = String(u.avatar || '🧑‍🎓').slice(0, 8);
    p.title = String(u.title || '開心學園學員').slice(0, 24);
    p.carIdx = c.idx; p.carColor = c.color; p.carName = c.name;
    p.buildingId = String(u.buildingId || 'english');
    p.buildingName = u.buildingName || (b ? b.name : '校園');
    p.buildingIcon = u.buildingIcon || (b ? b.icon : '🏫');
    p.badges = (Array.isArray(u.badges) ? u.badges : []).filter(function (id) { return F.ACH_BY[id]; }).slice(0, 40);
    p.score = F.scoreOf(p.badges);
    p.ts = ts;

      setInterval(function () {

    var sessionOk = false;

      else { try { sessionStorage.setItem(SESSION_KEY, '1'); } catch (e) { /* ignore */ } }
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(init, 0); });
  else setTimeout(init, 0);
})();

  <script>/* js/news.js */
/* 開心學園 · news.js — 📢 校園公告（地圖上方輪播）＋ 📌 校園公告欄（全部公告視窗）＋ 🔥 地圖人氣標記＋介紹卡人氣列

 *   🎉 開幕：registry status=new（分院併入本部一則），開幕版本由 Release Notes 推算

(function () {

  var LOG_KEY = 'okayell.campus.newslog.v3';
  var VISITS_KEY = 'okayell.campus.visits.v1';
  var STU_KEY = 'okayell.campus.student.v1';

  };
  var CAT_IDS = ['pin', 'hot', 'open', 'update', 'event', 'soon'];
  var UNREADABLE = { pin: 1, open: 1, update: 1, soon: 1 };
  // 輪播每類最多幾則（公告欄裡全部都看得到）
  var LANE_CAP = { hot: 2, open: 6, update: 1, event: 3, soon: 2 };
  var CN_NUM = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
  // 成就 → 去哪裡挑戰
  var GAME_OF = {

    pkwin: 'soccer', pksave: 'soccer', tnwin: 'tennis', tnrally: 'tennis', chopwin: 'hub', wood10: 'hub',

  /* ------------------------------------------------------------ 小工具 */
  function midnight() { var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }

  function textW(s, fs) {

    Array.from(String(s)).forEach(function (ch) {
      var c = ch.codePointAt(0);
      if (c === 0xFE0F || c === 0x200D) return;
      if (c === 32) w += 4;
      else if (c >= 0x1F000 || (c >= 0x2600 && c <= 0x27BF)) w += 15;

  /* ------------------------------------------------------------ 在線學員（traffic.js 的 CAMPUS.fun.presence） */

  // 你自己今天進過的學院（各工具的「🏫 校園」按鈕也會寫 okayell.campus.visits.v1）
  function seedMyVisits() {

  function personLabel(p) { return (p.avatar ? p.avatar + ' ' : '') + (p.me ? '你' : p.name || '同學'); }

  // 每棟建築：在線／停靠的同學、今日人次、人氣指數（在線 ×3＋停靠＋今日人次）
  function heatStats() {

      r.now = r.online.length + r.parked.length;
      r.heat = r.online.length * 3 + r.parked.length + r.today;

    }).sort(function (a, b) { return b.heat - a.heat || b.now - a.now || (a.id < b.id ? -1 : 1); });

  /* ------------------------------------------------------------ 公告產生器 */

  function openedRelease(b) {

    var src = window.CAMPUS_NEWS && Array.isArray(window.CAMPUS_NEWS.pinned) ? window.CAMPUS_NEWS.pinned : [];
