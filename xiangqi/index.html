// ============================================================================
// ♟️ 象棋學院 — SVG 棋盤元件
//
// XQBoard.create(host, { onSquare }) 回傳 { render(state), destroy() }。
// state：{ board(Int8Array 90), flipped, faceToFace, selected, targets[], last, check, hint(走法或 -1) }
// 棋盤格線只畫一次；棋子與標記每次 render 重畫，走子時用 CSS transition 滑動。
// ============================================================================

(function () {
  'use strict';
  var E = window.XQEngine;
  var NT = window.XQNotation;

  var S = 60; // 格距
  var M = 56; // 邊距（含路數標示）
  var W = S * 8 + M * 2;
  var H = S * 9 + M * 2;
  var PR = 26; // 棋子半徑
  var NS = 'http://www.w3.org/2000/svg';
  var CN = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];

  function el(name, attrs, text) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  function gridSvg() {
    var d = '';
    var r, c;
    for (r = 0; r < 10; r++) d += 'M' + M + ',' + (M + r * S) + 'H' + (M + 8 * S);
    for (c = 0; c < 9; c++) {
      var x = M + c * S;
      if (c === 0 || c === 8) d += 'M' + x + ',' + M + 'V' + (M + 9 * S);
      else d += 'M' + x + ',' + M + 'V' + (M + 4 * S) + 'M' + x + ',' + (M + 5 * S) + 'V' + (M + 9 * S);
    }
    // 九宮斜線
    [0, 7].forEach(function (r0) {
      d += 'M' + (M + 3 * S) + ',' + (M + r0 * S) + 'L' + (M + 5 * S) + ',' + (M + (r0 + 2) * S);
      d += 'M' + (M + 5 * S) + ',' + (M + r0 * S) + 'L' + (M + 3 * S) + ',' + (M + (r0 + 2) * S);
    });
    // 炮位與兵位的折角標記
    var marks = [[2, 1], [2, 7], [7, 1], [7, 7]];
    for (c = 0; c < 9; c += 2) { marks.push([3, c]); marks.push([6, c]); }
    var g = 5, len = 11;
    marks.forEach(function (mk) {
      var x = M + mk[1] * S, y = M + mk[0] * S;
      [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (q) {
        if ((mk[1] === 0 && q[0] < 0) || (mk[1] === 8 && q[0] > 0)) return;
        var px = x + q[0] * g, py = y + q[1] * g;
        d += 'M' + (px + q[0] * len) + ',' + py + 'H' + px + 'V' + (py + q[1] * len);
      });
    });
    return d;
  }

  function create(host, opts) {
    opts = opts || {};
    var svg = el('svg', {
      viewBox: '0 0 ' + W + ' ' + H, class: 'xq-board', role: 'img', 'aria-label': '象棋棋盤',
    });
    svg.appendChild(el('rect', { x: 4, y: 4, width: W - 8, height: H - 8, rx: 14, class: 'xq-bd-frame' }));
    svg.appendChild(el('rect', {
      x: M - 7, y: M - 7, width: 8 * S + 14, height: 9 * S + 14, class: 'xq-bd-border',
    }));
    svg.appendChild(el('path', { d: gridSvg(), class: 'xq-bd-grid' }));
    var river = el('g', { class: 'xq-bd-river' });
    svg.appendChild(river);
    var labels = el('g', { class: 'xq-bd-labels' });
    svg.appendChild(labels);
    var markLayer = el('g', {});
    svg.appendChild(markLayer);
    var pieceLayer = el('g', {});
    svg.appendChild(pieceLayer);
    var topLayer = el('g', {});
    svg.appendChild(topLayer);
    host.innerHTML = '';
    host.appendChild(svg);

    var state = null;
    var lastFlip = null;
    var prevBoard = null;

    function xy(sq) {
      var r = E.rowOf(sq), c = E.colOf(sq);
      if (state && state.flipped) { r = 9 - r; c = 8 - c; }
      return [M + c * S, M + r * S];
    }

    function drawStatic() {
      river.innerHTML = '';
      labels.innerHTML = '';
      var flipped = state.flipped;
      var y = M + 4.5 * S + 1;
      // 楚河在黑方一側、漢界在紅方一側；翻轉時左右對調。
      var left = flipped ? '漢界' : '楚河';
      var right = flipped ? '楚河' : '漢界';
      river.appendChild(el('text', { x: M + 2 * S, y: y }, left));
      river.appendChild(el('text', { x: M + 6 * S, y: y }, right));
      for (var c = 0; c < 9; c++) {
        var x = M + c * S;
        var boardCol = flipped ? 8 - c : c;
        var blackLabel = String(boardCol + 1);
        var redLabel = CN[8 - boardCol];
        labels.appendChild(el('text', { x: x, y: flipped ? H - 15 : 16 }, blackLabel));
        labels.appendChild(el('text', { x: x, y: flipped ? 16 : H - 15 }, redLabel));
      }
    }

    function pieceNode(p, sq, rotate) {
      var pt = xy(sq);
      var red = E.sideOf(p) === E.RED;
      var g = el('g', { class: 'xq-pc ' + (red ? 'is-red' : 'is-black'), 'data-sq': sq });
      g.style.transform = 'translate(' + pt[0] + 'px,' + pt[1] + 'px)';
      var inner = el('g', rotate ? { transform: 'rotate(180)' } : {});
      inner.appendChild(el('circle', { r: PR, cy: 2.5, class: 'xq-pc-shadow' }));
      inner.appendChild(el('circle', { r: PR, class: 'xq-pc-body' }));
      inner.appendChild(el('circle', { r: PR - 5, class: 'xq-pc-ring' }));
      inner.appendChild(el('text', { y: 1, class: 'xq-pc-text' }, NT.pieceName(p)));
      g.appendChild(inner);
      return g;
    }

    function render(next) {
      state = next;
      if (lastFlip !== state.flipped) { drawStatic(); lastFlip = state.flipped; prevBoard = null; }
      markLayer.innerHTML = '';
      pieceLayer.innerHTML = '';
      topLayer.innerHTML = '';
      var b = state.board;
      var pt;

      if (state.last >= 0) {
        [(state.last / 100) | 0, state.last % 100].forEach(function (sq) {
          pt = xy(sq);
          markLayer.appendChild(el('rect', {
            x: pt[0] - PR - 2, y: pt[1] - PR - 2, width: PR * 2 + 4, height: PR * 2 + 4, rx: 8, class: 'xq-mk-last',
          }));
        });
      }
      if (state.check >= 0) {
        pt = xy(state.check);
        markLayer.appendChild(el('circle', { cx: pt[0], cy: pt[1], r: PR + 6, class: 'xq-mk-check' }));
      }

      // 走子動畫：找出剛移動的棋子，先放在原位，下一個影格再移到新位置。
      var slide = null;
      if (prevBoard && state.last >= 0 && state.animate !== false) {
        var from = (state.last / 100) | 0, to = state.last % 100;
        if (prevBoard[from] && prevBoard[from] === b[to] && !b[from]) slide = { from: from, to: to };
      }
      for (var sq = 0; sq < 90; sq++) {
        if (!b[sq]) continue;
        var side = E.sideOf(b[sq]);
        // 對坐模式：畫面上方那一側的棋子倒過來，讓坐在對面的人看得懂。
        var topSide = state.flipped ? E.RED : E.BLACK;
        var node = pieceNode(b[sq], sq, !!state.faceToFace && side === topSide);
        if (state.selected === sq) node.classList.add('is-selected');
        if (slide && slide.to === sq) {
          var o = xy(slide.from);
          var dst = node.style.transform;
          node.style.transform = 'translate(' + o[0] + 'px,' + o[1] + 'px)';
          pieceLayer.appendChild(node);
          (function (n, t) {
            // 強制 reflow 後再設定終點，transition 才會生效。
            n.getBoundingClientRect();
            n.classList.add('is-sliding');
            n.style.transform = t;
          })(node, dst);
        } else {
          pieceLayer.appendChild(node);
        }
      }

      (state.targets || []).forEach(function (sq) {
        pt = xy(sq);
        topLayer.appendChild(el('circle', {
          cx: pt[0], cy: pt[1], r: b[sq] ? PR + 3 : 9, class: b[sq] ? 'xq-mk-capture' : 'xq-mk-target',
        }));
      });
    if (state.hint >= 0) {
      var hf = xy((state.hint / 100) | 0), ht = xy(state.hint % 100);
      topLayer.appendChild(el('line', { x1: hf[0], y1: hf[1], x2: ht[0], y2: ht[1], class: 'xq-mk-hint-line' }));
      topLayer.appendChild(el('circle', { cx: hf[0], cy: hf[1], r: PR + 3, class: 'xq-mk-hint' }));
      topLayer.appendChild(el('circle', { cx: ht[0], cy: ht[1], r: PR + 3, class: 'xq-mk-hint is-to' }));
    }
    prevBoard = new Int8Array(b);
    }

    function onClick(ev) {
      if (!state || !opts.onSquare) return;
      var rect = svg.getBoundingClientRect();
      if (!rect.width) return;
      var x = (ev.clientX - rect.left) * W / rect.width;
      var y = (ev.clientY - rect.top) * H / rect.height;
      var c = Math.round((x - M) / S), r = Math.round((y - M) / S);
      if (r < 0 || r > 9 || c < 0 || c > 8) return;
      if (Math.abs(x - (M + c * S)) > S * 0.48 || Math.abs(y - (M + r * S)) > S * 0.48) return;
      if (state.flipped) { r = 9 - r; c = 8 - c; }
      opts.onSquare(r * 9 + c);
    }
    svg.addEventListener('click', onClick);

    return {
      render: render,
      destroy: function () { svg.removeEventListener('click', onClick); host.innerHTML = ''; },
    };
  }

  window.XQBoard = { create: create, W: W, H: H };
})();


// === js/study.js ===
// ============================================================================
// ♟️ 象棋學院 — 殘局題庫（#/puzzle）與象棋知識課程（#/learn）
//
// 做題規則：紅方（玩家）先走，黑方由程式應著，一直下到分出勝負。
//   ⭐ 完美：在標示步數內獲勝，而且這一局沒用提示、悔棋，也沒看過解答。
//   ✅ 過關：其他方式獲勝。輸棋或和棋可以重來。
// 進度存在 localStorage（xq.puzzle.v1、xq.learn.v1）。
// ============================================================================

(function () {
  'use strict';
  var E = window.XQEngine;
  var NT = window.XQNotation;
  var App = null; // window.XQApp，app.js 載入後才有
  var KEY_PUZZLE = 'xq.puzzle.v1';
  var KEY_LEARN = 'xq.learn.v1';
  var LEVEL_NAMES = { 1: '入門', 2: '進階', 3: '挑戰' };
  var LEVEL_DESC = { 1: '1–2 步殺', 2: '3 步殺', 3: '4–5 步殺' };

  function puzzles() { return window.XQ_PUZZLES || []; }
  function units() { return window.XQ_UNITS || []; }
  function esc(s) { return App.esc(s); }

  // ------------------------------------------------------------------ 進度
  // progress[id] = { s: 0 未過關 | 1 過關 | 2 完美, seen: 看過解答 }
  function progress() {
    var p = App.load(KEY_PUZZLE, {});
    return p && typeof p === 'object' ? p : {};
  }
  function setProgress(id, patch) {
    var all = progress();
    var cur = all[id] || { s: 0 };
    if (patch.s && patch.s > (cur.s || 0)) cur.s = patch.s;
    if (patch.seen) cur.seen = true;
    all[id] = cur;
    App.save(KEY_PUZZLE, all);
  }
  function statusIcon(st) {
    if (!st) return '';
    if (st.s === 2) return '⭐';
    if (st.s === 1) return '✅';
    return st.seen ? '👀' : '';
  }

  // ------------------------------------------------------------------ 題庫列表
  var listFilter = { level: 0, tag: '', ancient: false };

  function allTags() {
    var count = {};
    puzzles().forEach(function (p) {
      (p.tags || []).forEach(function (t) { count[t] = (count[t] || 0) + 1; });
    });
    return Object.keys(count).sort(function (a, b) { return count[b] - count[a]; }).map(function (t) {
      return { tag: t, n: count[t] };
    });
  }

  function renderPuzzleList(tag) {
    if (tag !== undefined) listFilter.tag = tag;
    var prog = progress();
    var all = puzzles();
    var stars = 0, passed = 0;
    all.forEach(function (p) {
      var st = prog[p.id];
      if (st && st.s === 2) stars++;
      if (st && st.s >= 1) passed++;
    });
    var shown = all.filter(function (p) {
      if (listFilter.level && p.level !== listFilter.level) return false;
      if (listFilter.tag && (p.tags || []).indexOf(listFilter.tag) < 0) return false;
      if (listFilter.ancient && !p.ancient) return false;
      return true;
    });
    var ancientCount = all.filter(function (p) { return p.ancient; }).length;

    var html = '<div class="study-wrap">' +
      '<section class="card pz-head">' +
        '<div><h1>殘局題庫</h1>' +
        '<p class="muted">共 ' + all.length + ' 題，紅先勝。其中 ' + ancientCount + ' 題出自古譜《適情雅趣》《夢入神機》《爛柯神機》，其餘是由引擎從實戰對局挑出的練習題；每一題都經過程式窮舉驗證。</p></div>' +
        '<div class="pz-score"><span class="pz-score-main">⭐ ' + stars + '<small> / ' + all.length + '</small></span>' +
        '<span class="muted">✅ 過關 ' + passed + ' 題</span></div>' +
      '</section>' +
      '<section class="card pz-filters">' +
        '<div class="seg" role="group" aria-label="難度">' +
          [0, 1, 2, 3].map(function (lv) {
            return '<button type="button" class="seg-btn' + (listFilter.level === lv ? ' is-on' : '') + '" data-sact="level" data-v="' + lv + '">' +
              (lv ? LEVEL_NAMES[lv] + '<small>' + LEVEL_DESC[lv] + '</small>' : '全部') + '</button>';
          }).join('') +
        '</div>' +
        '<label class="pz-select">殺法<select id="pzTag"><option value="">全部</option>' +
          allTags().map(function (t) {
            return '<option value="' + esc(t.tag) + '"' + (t.tag === listFilter.tag ? ' selected' : '') + '>' + esc(t.tag) + '（' + t.n + '）</option>';
          }).join('') + '</select></label>' +
        '<label class="pz-check"><input type="checkbox" id="pzAncient"' + (listFilter.ancient ? ' checked' : '') + ' /> 只看古譜</label>' +
      '</section>';

    if (!shown.length) {
      html += '<section class="card"><p class="muted">沒有符合條件的題目，請調整上方的篩選。</p></section>';
    }
    [1, 2, 3].forEach(function (lv) {
      var group = shown.filter(function (p) { return p.level === lv; });
      if (!group.length) return;
      html += '<section class="card"><div class="card-head"><h2>' + LEVEL_NAMES[lv] + '・' + LEVEL_DESC[lv] + '</h2>' +
        '<span class="count-pill">' + group.length + ' 題</span></div><div class="pz-grid">' +
        group.map(function (p) {
          var st = prog[p.id];
          return '<a class="pz-card' + (st && st.s ? ' is-done' : '') + '" href="#/puzzle/' + esc(p.id) + '">' +
            '<span class="pz-card-top"><span class="pz-n">' + p.n + ' 步殺</span><span class="pz-st">' + statusIcon(st) + '</span></span>' +
            '<strong>' + esc(p.name) + '</strong>' +
            '<small class="' + (p.ancient ? 'pz-src-ancient' : '') + '">' + esc(p.src) + '</small></a>';
        }).join('') + '</div></section>';
    });
    html += '<p class="muted pz-credit">古譜局面的電子資料取自開放原始碼專案 CchessGo（MIT 授權）所整理的棋譜檔；本院只收錄其中經程式驗證、步數與原譜著法一致的局面。</p>';
    html += '</div>';
    App.main.innerHTML = html;
  }

  // ------------------------------------------------------------------ 做題
  var pz = null; // 目前這一題的狀態
  var client = null;

  function getClient() {
    if (!client) client = window.XQAI.createClient();
    return client;
  }

  function stopPuzzle() {
    if (client) client.cancel();
    if (pz) { pz.thinking = false; pz.hinting = false; }
  }

  function findPuzzle(id) {
    var all = puzzles();
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return { p: all[i], idx: i };
    return null;
  }

  function newAttempt(p, idx) {
    pz = {
      p: p, idx: idx, game: new E.Game(p.fen), selected: -1, board: pz && pz.p === p ? pz.board : null,
      thinking: false, hinting: false, hint: -1, aided: false, animate: false,
    };
  }

  function renderPuzzle(id) {
    var found = findPuzzle(id);
    if (!found) { renderPuzzleList(); return; }
    stopPuzzle();
    pz = null;
    newAttempt(found.p, found.idx);
    var p = found.p;
    App.main.innerHTML =
      '<div class="xq-stage">' +
        '<div class="xq-board-col"><div class="xq-board-wrap" id="pzBoard"></div></div>' +
        '<aside class="xq-side">' +
          '<section class="card">' +
            '<div class="card-head"><h2>' + esc(p.name) + '</h2><span class="tag-pill">' + p.n + ' 步殺</span></div>' +
            '<p class="muted">' + esc(p.src) + '・' + LEVEL_NAMES[p.level] +
              ((p.tags || []).length ? '・' + p.tags.map(esc).join('、') : '') + '</p>' +
            '<div id="pzStatus" class="pz-status"></div>' +
          '</section>' +
          '<section class="card">' +
            '<div class="btn-grid">' +
              '<button type="button" class="btn" data-sact="pz-hint">💡 提示</button>' +
              '<button type="button" class="btn" data-sact="pz-undo">↩️ 悔棋</button>' +
              '<button type="button" class="btn" data-sact="pz-retry">🔁 重來</button>' +
              '<button type="button" class="btn" data-sact="pz-solution">📜 看解答</button>' +
            '</div>' +
            '<p class="muted pz-rule">紅方先走，一直下到分出勝負。在 ' + p.n + ' 步內獲勝，而且沒用提示、悔棋、沒看過解答，才能拿到 ⭐。</p>' +
          '</section>' +
          '<section class="card">' +
            '<div class="card-head"><h2>著法</h2></div>' +
            '<div class="mv-scroll" id="pzMoves"></div>' +
          '</section>' +
          '<div class="pz-nav">' +
            '<a class="btn" href="#/puzzle">← 題庫</a>' +
            (found.idx + 1 < puzzles().length
              ? '<a class="btn btn-primary" href="#/puzzle/' + esc(puzzles()[found.idx + 1].id) + '">下一題 →</a>' : '') +
          '</div>' +
        '</aside>' +
      '</div>';
    pz.board = window.XQBoard.create(document.getElementById('pzBoard'), { onSquare: onPuzzleSquare });
    refreshPuzzle();
  }

  function redMoveCount() { return Math.ceil(pz.game.history.length / 2); }

  function refreshPuzzle() {
    if (!pz || !document.getElementById('pzStatus')) return;
    var g = pz.game;
    var res = g.result();
    var targets = pz.selected >= 0 ? g.legalMovesFrom(pz.selected).map(function (m) { return m % 100; }) : [];
    pz.board.render({
      board: g.pos.board, flipped: false, faceToFace: false, selected: pz.selected, targets: targets,
      last: g.lastMove(), check: App.checkSquare(g.pos), animate: pz.animate, hint: pz.hint,
    });
    pz.animate = true;

    var st = progress()[pz.p.id] || {};
    var html;
    if (res) {
      if (res.winner === E.RED) {
        var perfect = redMoveCount() <= pz.p.n && !pz.aided && !st.seen;
        html = '<div class="status-result">' + (perfect ? '⭐ 完美！' : '✅ 過關') + '</div>' +
          '<p class="muted">' + esc(NT.resultText(res)) + '，紅方共走 ' + redMoveCount() + ' 步。' +
          (perfect ? '' : (redMoveCount() > pz.p.n ? '這題最快 ' + pz.p.n + ' 步可以將死，' : '') +
            (pz.aided || st.seen ? '用過提示、悔棋或看過解答就拿不到 ⭐。' : '再試一次看看能不能更快。')) + '</p>';
      } else {
        html = '<div class="status-result is-fail">未過關</div>' +
          '<p class="muted">' + esc(NT.resultText(res)) + '。按「重來」再試一次，或看解答。</p>';
      }
    } else if (pz.thinking) {
      html = '<div class="status-turn is-black"><span class="turn-dot"></span>黑方應著中…</div>';
    } else {
      html = '<div class="status-turn is-red"><span class="turn-dot"></span>輪到你走（紅方）' +
        (g.inCheck() ? '<span class="badge-check">將軍！</span>' : '') + '</div>' +
        '<p class="muted">' + (pz.hinting ? '正在計算提示…' : '已走 ' + redMoveCount() + ' 步' +
          (redMoveCount() >= pz.p.n && g.history.length ? '，已超過 ' + pz.p.n + ' 步，贏了也只算過關' : '')) +
        (st.s === 2 ? '・這題已拿過 ⭐' : st.seen ? '・已看過解答，最多 ✅' : '') + '</p>';
    }
    document.getElementById('pzStatus').innerHTML = html;
    var box = document.getElementById('pzMoves');
    box.innerHTML = App.moveListHtml(g, g.history.length, false);
    box.scrollTop = box.scrollHeight;
    var q = function (a) { return App.main.querySelector('[data-sact="' + a + '"]'); };
    q('pz-hint').disabled = !!res || pz.thinking || pz.hinting;
    q('pz-undo').disabled = !g.history.length || pz.thinking;
    q('pz-retry').disabled = !g.history.length;
  }

  function finishIfOver() {
    var res = pz.game.result();
    if (!res) return false;
    if (res.winner === E.RED) {
      var st = progress()[pz.p.id] || {};
      var perfect = redMoveCount() <= pz.p.n && !pz.aided && !st.seen;
      setProgress(pz.p.id, { s: perfect ? 2 : 1 });
      App.campusAct();
    }
    return true;
  }

  function blackReply() {
    var g = pz.game;
    var mine = pz;
    pz.thinking = true;
    refreshPuzzle();
    var plies = g.history.length;
    var started = Date.now();
    getClient().request({ kind: 'defend', fen: g.startFen, moves: g.moveStrings() }, function (r) {
      setTimeout(function () {
        if (pz !== mine || !mine.thinking || g.history.length !== plies) return;
        mine.thinking = false;
        if (r.move < 0 || !g.play(r.move)) {
          App.toast('黑方沒有走出合法的一步，請按「重來」');
        } else {
          finishIfOver();
        }
        refreshPuzzle();
      }, Math.max(0, 300 - (Date.now() - started)));
    });
  }

  function onPuzzleSquare(sq) {
    var g = pz.game;
    if (g.result() || pz.thinking || g.turn() !== E.RED) return;
    if (pz.selected >= 0) {
      var m = pz.selected * 100 + sq;
      if (g.legalMoves().indexOf(m) >= 0) {
        if (pz.hinting) { getClient().cancel(); pz.hinting = false; }
        pz.hint = -1;
        g.play(m);
        pz.selected = -1;
        if (finishIfOver()) refreshPuzzle();
        else blackReply();
        return;
      }
    }
    var p = g.pos.board[sq];
    pz.selected = p && E.sideOf(p) === E.RED && pz.selected !== sq ? sq : -1;
    pz.animate = false;
    refreshPuzzle();
  }

  function onPuzzleAction(act) {
    var g = pz.game;
    if (act === 'pz-retry') {
      stopPuzzle();
      newAttempt(pz.p, pz.idx);
      refreshPuzzle();
    } else if (act === 'pz-undo') {
      stopPuzzle();
      pz.aided = true;
      pz.hint = -1;
      g.undo();
      if (g.turn() !== E.RED && g.history.length) g.undo();
      pz.selected = -1;
      pz.animate = false;
      refreshPuzzle();
    } else if (act === 'pz-hint') {
      if (g.result() || pz.thinking || pz.hinting) return;
      var mine = pz;
      pz.aided = true;
      pz.hinting = true;
      pz.selected = -1;
      pz.animate = false;
      refreshPuzzle();
      var plies = g.history.length;
      getClient().request({ kind: 'phint', fen: g.startFen, moves: g.moveStrings() }, function (r) {
        if (pz !== mine || !mine.hinting || g.history.length !== plies) return;
        mine.hinting = false;
        mine.animate = false;
        if (r.move >= 0) {
          mine.hint = r.move;
          App.toast('建議走：' + NT.moveToChinese(g.pos, r.move) + (r.forced ? '（' + r.forced + ' 步內可殺）' : ''));
        }
        refreshPuzzle();
      });
    } else if (act === 'pz-solution') {
      setProgress(pz.p.id, { seen: true });
      location.hash = '#/replay/puzzle-' + pz.p.id;
    }
  }

  // ------------------------------------------------------------------ 課程
  function learned() {
    var d = App.load(KEY_LEARN, {});
    return d && typeof d === 'object' ? d : {};
  }

  function flatLessons() {
    var out = [];
    units().forEach(function (u) { u.lessons.forEach(function (l) { out.push({ unit: u, lesson: l }); }); });
    return out;
  }

  function renderLearnHome() {
    var done = learned();
    var all = flatLessons();
    var doneCount = all.filter(function (x) { return done[x.lesson.id]; }).length;
    App.main.innerHTML = '<div class="study-wrap">' +
      '<section class="card pz-head"><div><h1>象棋知識課程</h1>' +
      '<p class="muted">' + units().length + ' 個單元、' + all.length + ' 堂課。殺法課的示範棋盤都能一步一步看，學完可以直接到殘局題庫練習同一種殺法。</p></div>' +
      '<div class="pz-score"><span class="pz-score-main">' + doneCount + '<small> / ' + all.length + '</small></span><span class="muted">已讀</span></div></section>' +
      units().map(function (u) {
        return '<section class="card"><div class="card-head"><h2>' + u.icon + ' ' + esc(u.title) + '</h2>' +
          '<span class="count-pill">' + u.lessons.length + ' 堂</span></div>' +
          '<p class="rec-desc">' + esc(u.intro) + '</p><div class="ls-grid">' +
          u.lessons.map(function (l, i) {
            return '<a class="ls-card' + (done[l.id] ? ' is-done' : '') + '" href="#/learn/' + esc(l.id) + '">' +
              '<span class="ls-no">' + (i + 1) + '</span><span class="ls-text"><strong>' + esc(l.title) + '</strong>' +
              '<small>' + esc(l.summary) + '</small></span><span class="ls-st">' + (done[l.id] ? '✓' : '') + '</span></a>';
          }).join('') + '</div></section>';
      }).join('') + '</div>';
  }

  var demos = []; // 目前課程頁上的示範棋盤 { d, game, idx, board }

  function demoPos(dm) {
    return E.parseFen(dm.idx === 0 ? dm.game.startFen : dm.game.history[dm.idx - 1].fen);
  }

  function refreshDemo(i, animate) {
    var dm = demos[i];
    var pos = demoPos(dm);
    dm.board.render({
      board: pos.board, flipped: false, faceToFace: false, selected: -1, targets: [],
      last: dm.idx > 0 ? dm.game.history[dm.idx - 1].move : -1, check: App.checkSquare(pos), animate: !!animate,
    });
    var total = dm.game.history.length;
    var info = document.getElementById('demoInfo' + i);
    if (!info) return;
    if (!total) { info.textContent = ''; return; }
    var names = NT.gameToChinese(dm.game);
    info.innerHTML = names.map(function (n, k) {
      return '<span class="demo-mv' + (k + 1 === dm.idx ? ' is-active' : '') + (k % 2 ? ' mv-black' : ' mv-red') + '">' + esc(n) + '</span>';
    }).join('') + (dm.idx === total && dm.game.result() ? '<span class="demo-end">將死</span>' : '');
  }

  function renderLesson(id) {
    var all = flatLessons();
    var at = -1;
    for (var i = 0; i < all.length; i++) if (all[i].lesson.id === id) at = i;
    if (at < 0) { renderLearnHome(); return; }
    var l = all[at].lesson, u = all[at].unit;
    var done = learned();
    if (!done[l.id]) { done[l.id] = 1; App.save(KEY_LEARN, done); App.campusAct(); }

    var related = l.tag ? puzzles().filter(function (p) { return (p.tags || []).indexOf(l.tag) >= 0; }).length : 0;
    var recs = window.XQ_RECORDS || [];
    var html = '<div class="study-wrap lesson">' +
      '<p class="crumb"><a href="#/learn">課程</a> › ' + u.icon + ' ' + esc(u.title) + '</p>' +
      '<section class="card"><h1>' + esc(l.title) + '</h1><p class="ls-summary">' + esc(l.summary) + '</p>' +
      (l.body || []).map(function (p) { return '<p class="ls-p">' + esc(p) + '</p>'; }).join('') +
      ((l.terms || []).length
        ? '<dl class="term-list">' + l.terms.map(function (t) {
          return '<div><dt>' + esc(t[0]) + '</dt><dd>' + esc(t[1]) + '</dd></div>';
        }).join('') + '</dl>' : '') +
      '</section>';

    (l.demos || []).forEach(function (d, k) {
      html += '<section class="card demo-card"><div class="demo-board" id="demoBoard' + k + '"></div>' +
        '<div class="demo-side"><h2>示範' + (d.mate ? '：' + d.mate + ' 步殺' : '') + '</h2>' +
        '<p class="ls-p">' + esc(d.caption || '') + '</p>' +
        (d.moves
          ? '<div class="rp-controls demo-controls">' +
            '<button type="button" class="btn" data-sact="demo-first" data-v="' + k + '" aria-label="回到開始">⏮</button>' +
            '<button type="button" class="btn" data-sact="demo-prev" data-v="' + k + '" aria-label="上一步">◀</button>' +
            '<button type="button" class="btn btn-primary" data-sact="demo-next" data-v="' + k + '">下一步 ▶</button></div>' +
            '<div class="demo-info" id="demoInfo' + k + '"></div>'
          : '<div class="demo-info" id="demoLegal' + k + '"></div>') +
        '</div></section>';
    });

    var links = '';
    if (related) {
      links += '<a class="btn btn-primary" href="#/puzzle/tag/' + encodeURIComponent(l.tag) + '">🧩 練習「' + esc(l.tag) + '」的殘局題（' + related + ' 題）</a>';
    }
    (l.records || []).forEach(function (rid) {
      for (var r = 0; r < recs.length; r++) {
        if (recs[r].id === rid) links += '<a class="btn" href="#/replay/' + esc(rid) + '">📜 看示範棋譜：' + esc(recs[r].title) + '</a>';
      }
    });
    if (l.id === 'mate-practice') links += '<a class="btn btn-primary" href="#/puzzle">🧩 前往殘局題庫</a>';
    if (links) html += '<section class="card ls-links">' + links + '</section>';

    html += '<div class="pz-nav">' +
      (at > 0 ? '<a class="btn" href="#/learn/' + esc(all[at - 1].lesson.id) + '">← ' + esc(all[at - 1].lesson.title) + '</a>' : '<span></span>') +
      (at + 1 < all.length ? '<a class="btn btn-primary" href="#/learn/' + esc(all[at + 1].lesson.id) + '">' + esc(all[at + 1].lesson.title) + ' →</a>' : '') +
      '</div></div>';
    App.main.innerHTML = html;

    demos = (l.demos || []).map(function (d, k) {
      var game = d.moves ? E.Game.fromMoves(d.fen, d.moves.split(/\s+/)) : new E.Game(d.fen);
      var dm = { d: d, game: game, idx: 0, board: window.XQBoard.create(document.getElementById('demoBoard' + k), {}) };
      return dm;
    });
    demos.forEach(function (dm, k) {
      refreshDemo(k, false);
      if (!dm.d.moves) {
        // 沒有示範走法的局面：列出所有合法應著。
        var pos = demoPos(dm);
        var el = document.getElementById('demoLegal' + k);
        el.innerHTML = '<span class="muted">合法走法：</span>' + E.legalMoves(pos).map(function (m) {
          return '<span class="demo-mv mv-red">' + esc(NT.moveToChinese(pos, m)) + '</span>';
        }).join('');
      }
    });
  }

  function onDemoAction(act, k) {
    var dm = demos[k];
    if (!dm) return;
    var before = dm.idx;
    if (act === 'demo-first') dm.idx = 0;
    else if (act === 'demo-prev') dm.idx = Math.max(0, dm.idx - 1);
    else if (act === 'demo-next') dm.idx = dm.idx >= dm.game.history.length ? 0 : dm.idx + 1;
    refreshDemo(k, dm.idx === before + 1);
  }

  // ------------------------------------------------------------------ 對外介面
  function init() {
    App = window.XQApp;
    App.main.addEventListener('click', function (ev) {
      var t = ev.target.closest('[data-sact]');
      if (!t || t.disabled) return;
      var act = t.getAttribute('data-sact');
      if (act === 'level') { listFilter.level = +t.getAttribute('data-v'); renderPuzzleList(); }
      else if (act.indexOf('pz-') === 0) { if (pz) onPuzzleAction(act); }
      else if (act.indexOf('demo-') === 0) onDemoAction(act, +t.getAttribute('data-v'));
    });
    App.main.addEventListener('change', function (ev) {
      if (ev.target.id === 'pzTag') {
        listFilter.tag = ev.target.value;
        // 讓篩選結果有自己的網址，課程頁才能直接連過來。
        var want = listFilter.tag ? '#/puzzle/tag/' + encodeURIComponent(listFilter.tag) : '#/puzzle';
        if (location.hash !== want) location.hash = want; else renderPuzzleList();
      } else if (ev.target.id === 'pzAncient') {
        listFilter.ancient = ev.target.checked;
        renderPuzzleList();
      }
    });
  }

  window.XQStudy = {
    handles: function (view) { return view === 'puzzle' || view === 'learn'; },
    render: function (view, parts) {
      if (!App) init();
      stopPuzzle();
      if (view === 'puzzle') {
        if (parts[0] === 'tag') renderPuzzleList(parts[1] || '');
        else if (parts[0]) renderPuzzle(parts[0]);
        else renderPuzzleList('');
      } else if (parts[0]) {
        renderLesson(parts[0]);
      } else {
        renderLearnHome();
      }
      window.scrollTo(0, 0);
    },
    stop: stopPuzzle,
  };
})();


// === js/app.js ===
// ============================================================================
// ♟️ 象棋學院 — 頁面與互動（對弈、棋譜回放、走法速查）
// 純前端：對局與棋譜都存在瀏覽器 localStorage（key 一律 xq. 前綴）。
// ============================================================================

(function () {
  'use strict';
  var E = window.XQEngine;
  var NT = window.XQNotation;
  var main = document.getElementById('appMain');

  var KEY_PLAY = 'xq.play.v1';
  var KEY_GAMES = 'xq.games.v1';
  var KEY_PREFS = 'xq.prefs.v1';
  var MAX_SAVED = 60;

  // ------------------------------------------------------------------ 工具
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function load(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (_) { return fallback; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (_) {}
  }
  function nowStr() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function sideName(side) { return side === E.RED ? '紅方' : '黑方'; }
  function campusAct() {
    try {
      if (window.CampusNav && typeof window.CampusNav.recordAct === 'function') window.CampusNav.recordAct('xiangqi');
    } catch (_) {}
  }
  var toastTimer = 0;
  function toast(msg) {
    var t = document.getElementById('xqToast');
    if (!t) return;
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2200);
  }
  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).catch(fallback);
    } else {
      fallback();
    }
    toast('已複製棋譜');
  }

  var prefs = load(KEY_PREFS, {}) || {};
  function savePrefs() { save(KEY_PREFS, { flipped: !!prefs.flipped, face: !!prefs.face }); }

  // ------------------------------------------------------------------ 我的棋譜
  function savedGames() {
    var list = load(KEY_GAMES, []);
    return Array.isArray(list) ? list : [];
  }
  function gameSnapshot(game) {
    return {
      fen: game.startFen,
      moves: game.moveStrings(),
      resigned: game.resigned,
      draw: game.drawAgreed,
    };
  }
  function restoreGame(snap) {
    var g = E.Game.fromMoves(snap.fen || E.START_FEN, snap.moves || []);
    if (snap.resigned === E.RED || snap.resigned === E.BLACK) g.resign(snap.resigned);
    if (snap.draw) g.agreeDraw();
    return g;
  }
  /** 新增或更新一筆棋譜，回傳 id。 */
  function upsertSaved(id, title, game) {
    var list = savedGames();
    var rec = gameSnapshot(game);
    rec.id = id || 'g' + Date.now().toString(36);
    rec.title = title;
    rec.date = nowStr();
    rec.result = NT.resultText(game.result());
    list = list.filter(function (x) { return x.id !== rec.id; });
    list.unshift(rec);
    save(KEY_GAMES, list.slice(0, MAX_SAVED));
    return rec.id;
  }

  // ------------------------------------------------------------------ 共用版面
  function moveListHtml(game, activeIdx, clickable) {
    var moves = NT.gameToChinese(game);
    var firstBlack = E.parseFen(game.startFen).turn === E.BLACK;
    var rows = [];
    var i = 0;
    var n = 1;
    function cell(idx) {
      if (idx < 0) return '<span class="mv mv-empty">……</span>';
      if (idx >= moves.length) return '<span class="mv mv-empty"></span>';
      var cls = 'mv' + (idx + 1 === activeIdx ? ' is-active' : '') + (idx % 2 === (firstBlack ? 1 : 0) ? ' mv-red' : ' mv-black');
      return clickable
        ? '<button type="button" class="' + cls + '" data-goto="' + (idx + 1) + '">' + esc(moves[idx]) + '</button>'
        : '<span class="' + cls + '">' + esc(moves[idx]) + '</span>';
    }
    if (firstBlack && moves.length) {
      rows.push('<li><span class="mv-no">' + n + '.</span>' + cell(-1) + cell(0) + '</li>');
      n++; i = 1;
    }
    for (; i < moves.length; i += 2) {
      rows.push('<li><span class="mv-no">' + n + '.</span>' + cell(i) + cell(i + 1) + '</li>');
      n++;
    }
    if (!rows.length) return '<p class="muted mv-none">還沒有走任何一步。</p>';
    return '<ol class="mv-list">' + rows.join('') + '</ol>';
  }

  function capturedHtml(game) {
    var byRed = [], byBlack = [];
    game.history.forEach(function (h) {
      if (!h.cap) return;
      (E.sideOf(h.cap) === E.BLACK ? byRed : byBlack).push(h.cap);
    });
    function row(label, arr, cls) {
      arr.sort(function (a, b) { return E.typeOf(a) - E.typeOf(b); });
      var chips = arr.map(function (p) { return '<span class="cap-pc ' + cls + '">' + NT.pieceName(p) + '</span>'; }).join('');
      return '<div class="cap-row"><span class="cap-label">' + label + '</span>' + (chips || '<span class="muted">—</span>') + '</div>';
    }
    return row('紅方吃子', byRed, 'is-black') + row('黑方吃子', byBlack, 'is-red');
  }

  function checkSquare(pos) {
    return E.inCheck(pos, pos.turn) ? E.findKing(pos, pos.turn) : -1;
  }

  // ------------------------------------------------------------------ 對弈
  // ai：0 = 同機雙人，1–4 = AI 難度；human：玩家執紅或執黑（AI 模式才有意義）。
  var play = {
    game: null, selected: -1, board: null, savedId: null, animate: true,
    ai: 0, human: E.RED, thinking: false, hinting: false, hint: -1,
  };
  var aiClient = window.XQAI.createClient();
  var AI_MIN_DELAY = 350; // AI 太快回應會像瞬移，至少停一下

  function aiName() { return play.ai ? window.XQAI.LEVELS[play.ai].name : ''; }
  function humanTurn() { return !play.ai || play.game.turn() === play.human; }
  function defaultTitle() {
    if (play.savedTitle) return play.savedTitle;
    return (play.ai ? '對 AI（' + aiName() + '）' + (play.human === E.RED ? '執紅' : '執黑') : '同機對弈') + ' ' + nowStr();
  }
  function stopThinking() {
    aiClient.cancel();
    play.thinking = false;
    play.hinting = false;
    play.hint = -1;
  }

  function loadPlay() {
    var snap = load(KEY_PLAY, null);
    play.savedId = null;
    try {
      play.game = snap ? restoreGame(snap) : new E.Game();
      if (snap && snap.savedId) play.savedId = snap.savedId;
      if (snap && snap.ai >= 1 && snap.ai <= 4) play.ai = snap.ai;
      if (snap && snap.human === E.BLACK) play.human = E.BLACK;
    } catch (_) {
      play.game = new E.Game();
    }
    play.selected = -1;
  }
  function persistPlay() {
    var snap = gameSnapshot(play.game);
    snap.savedId = play.savedId;
    snap.ai = play.ai;
    snap.human = play.human;
    save(KEY_PLAY, snap);
  }

  function renderPlay() {
    if (!play.game) loadPlay();
    main.innerHTML =
      '<div class="xq-stage">' +
        '<div class="xq-board-col"><div class="xq-board-wrap" id="playBoard"></div></div>' +
        '<aside class="xq-side">' +
          '<section class="card" id="playStatus"></section>' +
          '<section class="card opp-card">' +
            '<label>對手<select id="oppSel">' +
              '<option value="0">👥 同機雙人</option>' +
              [1, 2, 3, 4].map(function (lv) {
                return '<option value="' + lv + '">🤖 AI ' + window.XQAI.LEVELS[lv].name + '</option>';
              }).join('') +
            '</select></label>' +
            '<label id="sideWrap">我方<select id="sideSel">' +
              '<option value="0">執紅（先走）</option><option value="8">執黑（後走）</option>' +
            '</select></label>' +
          '</section>' +
          '<section class="card">' +
            '<div class="btn-grid">' +
              '<button type="button" class="btn" data-act="undo">↩️ 悔棋</button>' +
              '<button type="button" class="btn" data-act="hint" title="請 AI 建議這一步怎麼走">💡 提示</button>' +
              '<button type="button" class="btn" data-act="new">🔄 新對局</button>' +
              '<button type="button" class="btn" data-act="flip">🔃 翻轉棋盤</button>' +
              '<button type="button" class="btn" data-act="face" title="畫面上方那一側的棋子倒過來顯示，適合把手機或平板平放、兩人面對面下棋">👥 對坐模式</button>' +
              '<button type="button" class="btn" data-act="draw">🤝 議和</button>' +
              '<button type="button" class="btn btn-danger" data-act="resign">🏳️ 認輸</button>' +
            '</div>' +
          '</section>' +
          '<section class="card">' +
            '<div class="card-head"><h2>棋譜</h2>' +
              '<div class="card-tools">' +
                '<button type="button" class="link-btn" data-act="save">💾 存入我的棋譜</button>' +
                '<button type="button" class="link-btn" data-act="copy">📋 複製</button>' +
              '</div>' +
            '</div>' +
            '<div class="mv-scroll" id="playMoves"></div>' +
            '<div id="playCaptured" class="cap-box"></div>' +
          '</section>' +
        '</aside>' +
      '</div>';
    play.board = window.XQBoard.create(document.getElementById('playBoard'), { onSquare: onPlaySquare });
    play.animate = false;
    document.getElementById('oppSel').value = String(play.ai);
    document.getElementById('sideSel').value = String(play.human);
    refreshPlay();
    maybeAiMove();
  }

  function refreshPlay() {
    if (!document.getElementById('playStatus')) return; // 已經離開對弈頁
    var g = play.game;
    var res = g.result();
    var targets = play.selected >= 0 ? g.legalMovesFrom(play.selected).map(function (m) { return m % 100; }) : [];
    play.board.render({
      board: g.pos.board, flipped: !!prefs.flipped, faceToFace: !!prefs.face,
      selected: play.selected, targets: targets, last: g.lastMove(),
      check: checkSquare(g.pos), animate: play.animate, hint: play.hint,
    });
    play.animate = true;

    var status = document.getElementById('playStatus');
    var side = g.turn();
    var html;
    if (res) {
      var verdict = '';
      if (play.ai && res.winner !== null) verdict = res.winner === play.human ? ' · 你贏了！' : ' · AI 獲勝';
      html = '<div class="status-result">' + esc(NT.resultText(res) + verdict) + '</div>' +
        '<p class="muted">共 ' + g.history.length + ' 步。可以按「悔棋」回到上一步，或開始新對局。</p>';
    } else {
      html = '<div class="status-turn ' + (side === E.RED ? 'is-red' : 'is-black') + '">' +
        '<span class="turn-dot"></span>' +
        (play.ai ? (humanTurn() ? '輪到你走（' + sideName(side) + '）' : 'AI 思考中…') : '輪到' + sideName(side) + '走') +
        (g.inCheck() ? '<span class="badge-check">將軍！</span>' : '') + '</div>' +
        '<p class="muted">第 ' + (Math.floor(g.history.length / 2) + 1) + ' 回合 · ' +
        (play.hinting ? '正在計算提示…' : (play.ai ? '對手：AI ' + aiName() : '同機雙人對弈') + '：點棋子，再點要走到的位置。') + '</p>';
    }
    status.innerHTML = html;

    document.getElementById('playMoves').innerHTML = moveListHtml(g, g.history.length, false);
    var sc = document.getElementById('playMoves');
    sc.scrollTop = sc.scrollHeight;
    document.getElementById('playCaptured').innerHTML = capturedHtml(g);

    var q = function (act) { return main.querySelector('[data-act="' + act + '"]'); };
    q('undo').disabled = !g.history.length && !res;
    q('draw').disabled = !!res || !g.history.length || !!play.ai;
    q('resign').disabled = !!res;
    q('hint').disabled = !!res || play.thinking || play.hinting || !humanTurn();
    document.getElementById('sideWrap').hidden = !play.ai;
    q('save').disabled = !g.history.length;
    q('copy').disabled = !g.history.length;
    q('face').classList.toggle('is-on', !!prefs.face);
    q('flip').classList.toggle('is-on', !!prefs.flipped);
  }

  function afterPlayChange() {
    var g = play.game;
    var res = g.result();
    // 對局結束時自動存進我的棋譜（同一局只存一筆）。
    if (res && g.history.length) {
      play.savedId = upsertSaved(play.savedId, defaultTitle(), g);
      toast(NT.resultText(res) + '，已存入我的棋譜');
    }
    persistPlay();
    refreshPlay();
    maybeAiMove();
  }

  /** 輪到 AI 時請 Worker 選步；回來時若局面已經變了（悔棋、開新局）就丟棄。 */
  function maybeAiMove() {
    var g = play.game;
    if (!play.ai || play.thinking || g.result() || g.turn() === play.human) return;
    play.thinking = true;
    play.hint = -1;
    refreshPlay();
    var started = Date.now();
    var plies = g.history.length;
    aiClient.request({ fen: g.startFen, moves: g.moveStrings(), level: play.ai }, function (r) {
      setTimeout(function () {
        if (!play.thinking || play.game !== g || g.history.length !== plies) return;
        play.thinking = false;
        if (r.move < 0 || !g.play(r.move)) {
          toast('AI 沒有走出合法的一步，請按悔棋或開新對局');
          refreshPlay();
          return;
        }
        afterPlayChange();
      }, Math.max(0, AI_MIN_DELAY - (Date.now() - started)));
    });
  }

  function requestHint() {
    var g = play.game;
    if (g.result() || play.thinking || play.hinting || !humanTurn()) return;
    play.hinting = true;
    play.selected = -1;
    play.animate = false;
    refreshPlay();
    var plies = g.history.length;
    aiClient.request({ fen: g.startFen, moves: g.moveStrings(), level: 3, hint: true }, function (r) {
      if (!play.hinting || play.game !== g || g.history.length !== plies) return;
      play.hinting = false;
      play.animate = false;
      if (r.move >= 0) {
        play.hint = r.move;
        toast('建議走：' + NT.moveToChinese(g.pos, r.move));
      }
      refreshPlay();
    });
  }

  function onPlaySquare(sq) {
    var g = play.game;
    if (g.result() || !humanTurn()) return;
    var p = g.pos.board[sq];
    if (play.selected >= 0) {
      var m = play.selected * 100 + sq;
      if (g.legalMoves().indexOf(m) >= 0) {
        stopThinking(); // 取消還在算的提示
        g.play(m);
        play.selected = -1;
        // 校園成就以「開局」與「下完一局」計次，不是每走一步都算。
        if (g.history.length === 1 || g.result()) campusAct();
        afterPlayChange();
        return;
      }
    }
    if (p && E.sideOf(p) === g.turn()) {
      play.selected = play.selected === sq ? -1 : sq;
    } else {
      play.selected = -1;
    }
    play.animate = false;
    refreshPlay();
  }

  function startGame(game, title) {
    stopThinking();
    play.game = game;
    play.selected = -1;
    play.savedId = null;
    play.savedTitle = title || '';
    play.animate = false;
    persistPlay();
  }

  function onPlayAction(act) {
    var g = play.game;
    if (act === 'undo') {
      stopThinking();
      if (!g.undo()) return;
      // 對 AI 時一次退兩步，回到玩家自己上一次走棋之前。
      if (play.ai && !g.result() && g.turn() !== play.human && g.history.length) g.undo();
      play.selected = -1;
      play.animate = false;
      persistPlay();
      refreshPlay();
      maybeAiMove();
    } else if (act === 'hint') {
      requestHint();
    } else if (act === 'new') {
      if (g.history.length && !g.result() && !window.confirm('目前的對局還沒結束，確定要開始新對局嗎？')) return;
      startGame(new E.Game());
      refreshPlay();
      maybeAiMove();
    } else if (act === 'flip') {
      prefs.flipped = !prefs.flipped;
      savePrefs();
      play.animate = false;
      refreshPlay();
    } else if (act === 'face') {
      prefs.face = !prefs.face;
      savePrefs();
      play.animate = false;
      refreshPlay();
    } else if (act === 'draw') {
      if (!window.confirm('雙方都同意和棋嗎？')) return;
      g.agreeDraw();
      afterPlayChange();
    } else if (act === 'resign') {
      var loser = play.ai ? play.human : g.turn();
      if (!window.confirm((play.ai ? '' : sideName(loser)) + '確定要認輸嗎？')) return;
      stopThinking();
      g.resign(loser);
      afterPlayChange();
    } else if (act === 'save') {
      play.savedId = upsertSaved(play.savedId, defaultTitle(), g);
      persistPlay();
      toast('已存入我的棋譜');
    } else if (act === 'copy') {
      copyText(NT.exportText(g, ''));
    }
  }

  // ------------------------------------------------------------------ 棋譜回放
  var replay = { rec: null, game: null, idx: 0, board: null, timer: 0, speed: 1200, animate: false };

  function findRecord(id) {
    var i;
    if (id && id.indexOf('my-') === 0) {
      var list = savedGames();
      for (i = 0; i < list.length; i++) {
        if ('my-' + list[i].id === id) {
          return { id: id, title: list[i].title, tag: '我的棋譜', desc: list[i].date + (list[i].result ? ' · ' + list[i].result : ''), snap: list[i] };
        }
      }
      return null;
    }
    if (id && id.indexOf('puzzle-') === 0) {
      // 殘局題的解答：用題庫裡附的主變著法回放。
      var pzs = window.XQ_PUZZLES || [];
      for (i = 0; i < pzs.length; i++) {
        if ('puzzle-' + pzs[i].id === id) {
          return {
            id: id, title: pzs[i].name + '・解答', tag: '殘局解答', back: '#/puzzle/' + pzs[i].id,
            desc: pzs[i].src + '，' + pzs[i].n + ' 步殺。黑方走的是撐得最久的應法；其他應法會更快被將死。',
            fen: pzs[i].fen, moves: pzs[i].line.join(' '),
          };
        }
      }
      return null;
    }
    var recs = window.XQ_RECORDS || [];
    for (i = 0; i < recs.length; i++) if (recs[i].id === id) return recs[i];
    return null;
  }

  function recordGame(rec) {
    if (rec.snap) return restoreGame(rec.snap);
    var r = NT.importText((rec.fen ? 'FEN：' + rec.fen + '\n' : '') + rec.moves);
    return r.game || new E.Game();
  }

  function stopAuto() {
    if (replay.timer) { clearInterval(replay.timer); replay.timer = 0; }
  }

  function replayListHtml(activeId) {
    var recs = window.XQ_RECORDS || [];
    var mine = savedGames();
    function item(id, title, sub, del) {
      return '<li class="rec-item' + (id === activeId ? ' is-active' : '') + '">' +
        '<a href="#/replay/' + esc(id) + '"><strong>' + esc(title) + '</strong><small>' + esc(sub) + '</small></a>' +
        (del ? '<button type="button" class="icon-btn" data-del="' + esc(del) + '" title="刪除這筆棋譜" aria-label="刪除">🗑</button>' : '') +
        '</li>';
    }
    return '<section class="card">' +
        '<div class="card-head"><h2>我的棋譜</h2><span class="count-pill">' + mine.length + '</span></div>' +
        (mine.length
          ? '<ul class="rec-list">' + mine.map(function (g) {
            return item('my-' + g.id, g.title, g.date + ' · ' + (g.moves || []).length + ' 步' + (g.result ? ' · ' + g.result : ''), g.id);
          }).join('') + '</ul>'
          : '<p class="muted">下完的對局會自動存到這裡；也可以在下方貼上棋譜匯入。</p>') +
        '<details class="import-box"><summary>📥 匯入棋譜</summary>' +
          '<textarea id="importText" rows="5" placeholder="貼上棋譜文字，例如：&#10;1. 炮二平五 馬8進7&#10;2. 馬二進三 車9平8"></textarea>' +
          '<div class="import-actions"><button type="button" class="btn btn-primary" data-ract="import">匯入</button>' +
          '<span class="muted" id="importMsg"></span></div>' +
        '</details>' +
      '</section>' +
      '<section class="card">' +
        '<div class="card-head"><h2>開局示範</h2><span class="count-pill">' + recs.length + '</span></div>' +
        '<ul class="rec-list">' + recs.map(function (r) {
          return item(r.id, r.title, r.moves.split(/\s+/).length + ' 步');
        }).join('') + '</ul>' +
      '</section>';
  }

  function renderReplay(id) {
    stopAuto();
    var recs = window.XQ_RECORDS || [];
    var rec = id ? findRecord(id) : null;
    if (!rec) {
      var mine = savedGames();
      rec = mine.length && !id ? findRecord('my-' + mine[0].id) : recs[0];
      if (id && !rec) rec = recs[0];
    }
    replay.rec = rec;
    try {
      replay.game = recordGame(rec);
    } catch (_) {
      replay.game = new E.Game();
    }
    replay.idx = rec.snap ? replay.game.history.length : 0;
    replay.animate = false;

    main.innerHTML =
      '<div class="xq-stage">' +
        '<div class="xq-board-col">' +
          '<div class="xq-board-wrap" id="replayBoard"></div>' +
          '<div class="rp-controls">' +
            '<button type="button" class="btn" data-ract="first" title="回到開局" aria-label="回到開局">⏮</button>' +
            '<button type="button" class="btn" data-ract="prev" title="上一步（←）" aria-label="上一步">◀</button>' +
            '<button type="button" class="btn btn-primary" data-ract="auto" id="rpAuto">▶ 自動播放</button>' +
            '<button type="button" class="btn" data-ract="next" title="下一步（→）" aria-label="下一步">▶</button>' +
            '<button type="button" class="btn" data-ract="last" title="跳到最後" aria-label="跳到最後">⏭</button>' +
          '</div>' +
          '<input type="range" id="rpSlider" class="rp-slider" min="0" max="' + replay.game.history.length + '" step="1" aria-label="步數" />' +
        '</div>' +
        '<aside class="xq-side">' +
          '<section class="card">' +
            '<div class="card-head"><h2>' + esc(rec.title) + '</h2><span class="tag-pill">' + esc(rec.tag || '棋譜') + '</span></div>' +
            '<p class="rec-desc">' + esc(rec.desc || '') + '</p>' +
            (rec.back ? '<p><a class="link-btn" href="' + esc(rec.back) + '">← 回到這一題</a></p>' : '') +
            '<div class="rp-pos" id="rpPos"></div>' +
            '<div class="mv-scroll" id="rpMoves"></div>' +
            '<div class="card-tools rp-tools">' +
              '<button type="button" class="link-btn" data-ract="continue">♟️ 從這個局面接著下</button>' +
              '<button type="button" class="link-btn" data-ract="flip">🔃 翻轉</button>' +
              '<button type="button" class="link-btn" data-ract="copy">📋 複製棋譜</button>' +
            '</div>' +
          '</section>' +
          '<div id="rpLists">' + replayListHtml(rec.id) + '</div>' +
        '</aside>' +
      '</div>';
    replay.board = window.XQBoard.create(document.getElementById('replayBoard'), {});
    refreshReplay();
  }

  function replayPos() {
    var g = replay.game;
    return E.parseFen(replay.idx === 0 ? g.startFen : g.history[replay.idx - 1].fen);
  }

  function refreshReplay() {
    var g = replay.game;
    var pos = replayPos();
    replay.board.render({
      board: pos.board, flipped: !!prefs.flipped, faceToFace: false, selected: -1, targets: [],
      last: replay.idx > 0 ? g.history[replay.idx - 1].move : -1,
      check: checkSquare(pos), animate: replay.animate,
    });
    replay.animate = false;
    var total = g.history.length;
    var label = '第 ' + replay.idx + ' / ' + total + ' 步';
    if (replay.idx === total && g.result()) label += ' · ' + NT.resultText(g.result());
    else if (replay.idx < total || !g.result()) label += ' · 輪到' + sideName(pos.turn);
    document.getElementById('rpPos').textContent = label;
    var box = document.getElementById('rpMoves');
    box.innerHTML = moveListHtml(g, replay.idx, true);
    var active = box.querySelector('.is-active');
    if (active) {
      var top = active.offsetTop - box.offsetTop;
      if (top < box.scrollTop || top > box.scrollTop + box.clientHeight - 36) box.scrollTop = Math.max(0, top - box.clientHeight / 2);
    } else {
      box.scrollTop = 0;
    }
    document.getElementById('rpSlider').value = replay.idx;
    document.getElementById('rpAuto').textContent = replay.timer ? '⏸ 暫停' : '▶ 自動播放';
  }

  function replayGoto(idx) {
    var total = replay.game.history.length;
    idx = Math.max(0, Math.min(total, idx));
    replay.animate = idx === replay.idx + 1;
    replay.idx = idx;
    if (idx >= total) stopAuto();
    refreshReplay();
  }

  function onReplayAction(act) {
    var g = replay.game;
    if (act === 'first') { stopAuto(); replayGoto(0); }
    else if (act === 'prev') { stopAuto(); replayGoto(replay.idx - 1); }
    else if (act === 'next') { stopAuto(); replayGoto(replay.idx + 1); }
    else if (act === 'last') { stopAuto(); replayGoto(g.history.length); }
    else if (act === 'auto') {
      if (replay.timer) { stopAuto(); refreshReplay(); return; }
      if (replay.idx >= g.history.length) replay.idx = 0;
      replay.timer = setInterval(function () { replayGoto(replay.idx + 1); }, replay.speed);
      replayGoto(replay.idx + 1);
      campusAct();
    } else if (act === 'flip') {
      prefs.flipped = !prefs.flipped;
      savePrefs();
      refreshReplay();
    } else if (act === 'copy') {
      copyText(NT.exportText(g, replay.rec.title));
    } else if (act === 'continue') {
      if (!play.game) loadPlay();
      if (play.game.history.length && !play.game.result() &&
          !window.confirm('「對弈」頁還有一局沒下完，要改從這個局面接著下嗎？')) return;
      var ng = E.Game.fromMoves(g.startFen, g.moveStrings().slice(0, replay.idx));
      startGame(ng, replay.rec.title + '（接續對弈）');
      location.hash = '#/play';
    } else if (act === 'import') {
      var ta = document.getElementById('importText');
      var msg = document.getElementById('importMsg');
      var r = NT.importText(ta.value);
      if (!r.game || !r.game.history.length) {
        msg.textContent = r.error || '沒有讀到任何走法。';
        return;
      }
      var id = upsertSaved(null, r.title || '匯入棋譜 ' + nowStr(), r.game);
      if (r.error) toast(r.error);
      else toast('已匯入 ' + r.game.history.length + ' 步');
      if (location.hash === '#/replay/my-' + id) renderReplay('my-' + id);
      else location.hash = '#/replay/my-' + id;
    }
  }

  // ------------------------------------------------------------------ 走法速查
  var GUIDE = [
    { name: '帥／將', fen: '3k5/9/9/9/9/9/9/9/4K4/9 w', sq: ['e1'],
      text: '只能在九宮內走，一次直走或橫走一格。雙方的帥與將不能在同一條直線上直接照面（中間沒有任何棋子）；示範中帥不能往左走，就是因為會和對面的將照面。' },
    { name: '仕／士', fen: '3k5/9/9/9/9/9/9/9/4A4/5K3 w', sq: ['e1'],
      text: '只能在九宮內沿斜線走一格，所以只有五個位置可以站。' },
    { name: '相／象', fen: '3k5/9/9/9/9/9/3P5/4B4/9/5K3 w', sq: ['e2'],
      text: '沿斜線走兩格（走「田」字），不能過河。田字中心有棋子時不能走，叫做「塞象眼」；示範中左上方被自己的兵擋住。' },
    { name: '傌／馬', fen: '3k5/9/9/9/4P4/4N4/9/9/9/5K3 w', sq: ['e4'],
      text: '先直走或橫走一格，再斜走一格（走「日」字）。第一格有棋子時不能往那個方向跳，叫做「拐馬腳」；示範中馬的正前方有兵，所以不能往前跳。' },
    { name: '俥／車', fen: '3k5/9/4p4/9/9/1P2R4/9/9/9/5K3 w', sq: ['e4'],
      text: '直走或橫走，格數不限，但不能越過其他棋子。遇到對方的棋子可以吃掉並停在那裡。' },
    { name: '炮／包', fen: '3k5/9/4n4/9/9/4P4/9/4C4/9/5K3 w', sq: ['e2'],
      text: '不吃子時走法和車一樣。吃子時必須隔著剛好一個棋子（炮架）跳過去吃；示範中炮隔著自己的兵吃掉對方的馬。' },
    { name: '兵／卒', fen: '3k5/9/9/9/6P2/9/2P6/9/9/5K3 w', sq: ['c3', 'g5'],
      text: '過河前只能往前走一格；過河後可以往前或往左右走一格，但永遠不能後退。示範中左邊的兵還沒過河，右邊的兵已經過河。' },
  ];

  function renderRules() {
    main.innerHTML =
      '<div class="rules-wrap">' +
        '<section class="card rules-intro">' +
          '<h1>走法速查</h1>' +
          '<p>紅方先走，雙方輪流各走一步。把對方的帥（將）逼到無路可逃就獲勝。下面每個棋盤上的圓點是該棋子可以走到的位置，紅圈是可以吃掉的棋子。</p>' +
        '</section>' +
        '<div class="guide-grid">' + GUIDE.map(function (g, i) {
          return '<section class="card guide-card"><div class="guide-board" id="guide' + i + '"></div>' +
            '<div><h2>' + esc(g.name) + '</h2><p>' + esc(g.text) + '</p></div></section>';
        }).join('') + '</div>' +
        '<section class="card">' +
          '<h2>勝負怎麼算</h2>' +
          '<ul class="plain-list">' +
            '<li><strong>絕殺</strong>：被將軍而且沒有任何走法可以解除，判負。</li>' +
            '<li><strong>困斃</strong>：沒有被將軍，但輪到自己時沒有任何合法走法，同樣判負。</li>' +
            '<li><strong>長將</strong>：同一局面出現三次，而且其中一方每一步都在將軍，長將的一方判負。</li>' +
            '<li><strong>和棋</strong>：同一局面出現三次但不是長將、連續六十回合沒有吃子，或雙方同意議和。</li>' +
          '</ul>' +
          '<p class="muted">以上四項由本院自動判定。「長捉」等其他禁止著法目前不會自動判定，同機對弈時請雙方自行約定。</p>' +
        '</section>' +
        '<section class="card">' +
          '<h2>學院規劃</h2>' +
          '<ul class="plain-list">' +
            '<li>🌐 線上對弈、計時與觀戰（籌備中）</li>' +
          '</ul>' +
        '</section>' +
      '</div>';
    GUIDE.forEach(function (g, i) {
      var pos = E.parseFen(g.fen);
      var targets = [];
      g.sq.forEach(function (s) {
        E.legalMovesFrom(pos, E.strToSq(s)).forEach(function (m) { targets.push(m % 100); });
      });
      window.XQBoard.create(document.getElementById('guide' + i), {}).render({
        board: pos.board, flipped: false, faceToFace: false,
        selected: g.sq.length === 1 ? E.strToSq(g.sq[0]) : -1, targets: targets, last: -1, check: -1,
      });
    });
  }

  // ------------------------------------------------------------------ 路由
  function route() {
    stopAuto();
    // 離開對弈頁時停止 AI 思考；回來時 renderPlay 會再請 AI 接手。
    stopThinking();
    if (window.XQStudy) window.XQStudy.stop();
    var parts = (location.hash || '#/play').replace(/^#\/?/, '').split('/');
    var view = parts[0] || 'play';
    if (view === 'replay') renderReplay(parts[1] ? decodeURIComponent(parts[1]) : '');
    else if (view === 'rules') renderRules();
    else if (window.XQStudy && window.XQStudy.handles(view)) window.XQStudy.render(view, parts.slice(1).map(decodeURIComponent));
    else { view = 'play'; renderPlay(); }
    document.querySelectorAll('[data-nav]').forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('data-nav') === view);
    });
    document.body.setAttribute('data-view', view);
  }

  main.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act],[data-ract],[data-goto],[data-del]');
    if (!t || t.disabled) return;
    if (t.hasAttribute('data-act')) onPlayAction(t.getAttribute('data-act'));
    else if (t.hasAttribute('data-ract')) onReplayAction(t.getAttribute('data-ract'));
    else if (t.hasAttribute('data-goto')) { stopAuto(); replayGoto(+t.getAttribute('data-goto')); }
    else if (t.hasAttribute('data-del')) {
      var id = t.getAttribute('data-del');
      if (!window.confirm('確定要刪除這筆棋譜嗎？')) return;
      save(KEY_GAMES, savedGames().filter(function (g) { return g.id !== id; }));
      if (replay.rec && replay.rec.id === 'my-' + id) {
        if (location.hash === '#/replay') renderReplay(''); else location.hash = '#/replay';
      } else {
        document.getElementById('rpLists').innerHTML = replayListHtml(replay.rec ? replay.rec.id : '');
      }
    }
  });
  main.addEventListener('change', function (ev) {
    var id = ev.target.id;
    if (id !== 'oppSel' && id !== 'sideSel') return;
    stopThinking();
    if (id === 'oppSel') {
      play.ai = +ev.target.value;
    } else {
      play.human = +ev.target.value === E.BLACK ? E.BLACK : E.RED;
      prefs.flipped = play.human === E.BLACK; // 自己的棋子放在畫面下方
      savePrefs();
    }
    play.selected = -1;
    play.animate = false;
    persistPlay();
    refreshPlay();
    maybeAiMove();
  });
  main.addEventListener('input', function (ev) {
    if (ev.target.id === 'rpSlider') { stopAuto(); replayGoto(+ev.target.value); }
  });
  window.addEventListener('keydown', function (ev) {
    if (document.body.getAttribute('data-view') !== 'replay') return;
    var tag = ev.target && ev.target.tagName;
    if (tag === 'TEXTAREA' || tag === 'INPUT') return;
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); onReplayAction('prev'); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); onReplayAction('next'); }
  });

  // ------------------------------------------------------------------ 版本紀錄
  function initReleaseModal() {
    var btn = document.getElementById('versionBadgeBtn');
    var modal = document.getElementById('releaseModal');
    var body = document.getElementById('releaseModalBody');
    var data = window.XIANGQI_RELEASES || { current_version: '1.0.0', releases: [] };
    document.getElementById('verText').textContent = 'v' + data.current_version;
    function close() { modal.hidden = true; }
    btn.addEventListener('click', function () {
      body.innerHTML = (data.releases || []).map(function (r) {
        return '<div class="rel-item"><div class="rel-head"><span class="rel-ver">v' + esc(r.version) + '</span>' +
          '<span class="rel-date">' + esc(r.date) + '</span></div><h3>' + esc(r.title) + '</h3><ul>' +
          (r.changes || []).map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>';
      }).join('') || '<p class="muted">尚無版本紀錄。</p>';
      modal.hidden = false;
    });
    document.getElementById('closeReleaseModalBtn').addEventListener('click', close);
    modal.addEventListener('click', function (ev) { if (ev.target === modal) close(); });
    window.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !modal.hidden) close(); });
  }

  // 給 study.js（殘局題庫與課程）共用的工具。
  window.XQApp = {
    main: main, esc: esc, load: load, save: save, toast: toast, prefs: prefs,
    campusAct: campusAct, moveListHtml: moveListHtml, checkSquare: checkSquare, sideName: sideName,
  };

  function init() {
    initReleaseModal();
    window.addEventListener('hashchange', route);
    route();
    if (window.CampusNav && typeof window.CampusNav.wire === 'function') window.CampusNav.wire();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

  </script>
</body>
