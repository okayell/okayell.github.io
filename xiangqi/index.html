<html lang="zh-Hant"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="referrer" content="no-referrer" /><title>🐘 象棋學院 · AI 對弈、殘局題庫與象棋課程</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23b45309'/%3E%3Cstop offset='100%25' stop-color='%237c2d12'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='21' fill='%23fef3c7'/%3E%3Ccircle cx='32' cy='32' r='16.5' fill='none' stroke='%23b91c1c' stroke-width='2.5'/%3E%3Cpath d='M32 21v22M24 26h16M24 32h16M25 38h14' stroke='%23b91c1c' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" /><link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23b45309'/%3E%3Cstop offset='100%25' stop-color='%237c2d12'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='21' fill='%23fef3c7'/%3E%3Ccircle cx='32' cy='32' r='16.5' fill='none' stroke='%23b91c1c' stroke-width='2.5'/%3E%3Cpath d='M32 21v22M24 26h16M24 32h16M25 38h14' stroke='%23b91c1c' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" /><meta name="description" content="象棋學院（Xiangqi Academy）：免安裝的象棋棋盤，內建完整規則引擎，支援四種難度的 AI 對弈與提示、100 題殘局題庫（含古譜）、象棋知識課程、同機雙人對弈、悔棋、中文棋譜記錄、棋譜回放與匯入，以及七種棋子的走法速查。" /><style>
/* ♟️ 象棋學院 — 淺色、乾淨、以棋盤為主角的版面 */
:root {
  --bg: #f8f6f1;
  --card: #ffffff;
  --line: #e7e2d8;
  --text: #1f2937;
  --muted: #6b7280;
  --accent: #b45309;
  --accent-soft: #fef3c7;
  --red: #b91c1c;
  --black: #111827;
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
.muted { color: var(--muted); font-size: 13px; }

/* ---------- 標題列 ---------- */
.top-header {
  position: sticky; top: 0; z-index: 30;
  background: rgba(255, 255, 255, .96);
  border-bottom: 1px solid var(--line);
}
.header-inner {
  max-width: 1120px; margin: 0 auto; padding: 8px 16px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.brand-link { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--text); }
.brand-icon { font-size: 22px; line-height: 1; }
.brand-name { font-size: 18px; font-weight: 700; letter-spacing: .04em; }
.ver-pill {
  border: 1px solid var(--line); background: #fff; border-radius: 999px;
  padding: 1px 9px; font-size: 12px; color: var(--muted); cursor: pointer;
}
.ver-pill:hover { border-color: var(--accent); color: var(--accent); }
.main-nav { display: flex; gap: 4px; margin-left: auto; }
.nav-tab {
  padding: 6px 12px; border-radius: 999px; text-decoration: none;
  color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap;
}
.nav-tab:hover { background: #f3f0e8; color: var(--text); }
.nav-tab.active { background: var(--accent-soft); color: var(--accent); }

.main-container { max-width: 1120px; margin: 0 auto; padding: 16px; outline: none; }
.loading-state { padding: 60px 0; text-align: center; color: var(--muted); }

/* ---------- 對弈／回放共用版面 ---------- */
.xq-stage { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.xq-board-col { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
.xq-board-wrap {
  /* 棋盤長寬比 592:652；高度不超過視窗，手機則佔滿寬度。 */
  width: min(100%, calc((100vh - 96px) * 0.908), 640px);
}
body[data-view='replay'] .xq-board-wrap { width: min(100%, calc((100vh - 176px) * 0.908), 640px); }
.xq-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px;
}
.card h2 { font-size: 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.card-tools { display: flex; gap: 12px; flex-wrap: wrap; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; font-weight: 600; }
.link-btn:hover { text-decoration: underline; }
.link-btn:disabled { color: #c4c0b6; cursor: default; text-decoration: none; }
.icon-btn { border: 0; background: none; cursor: pointer; padding: 4px 6px; border-radius: 8px; color: var(--muted); }
.icon-btn:hover { background: #f3f0e8; color: var(--text); }
.count-pill, .tag-pill {
  font-size: 12px; padding: 1px 9px; border-radius: 999px; white-space: nowrap;
  background: #f3f0e8; color: var(--muted);
}
.tag-pill { background: var(--accent-soft); color: var(--accent); }

.btn {
  border: 1px solid var(--line); background: #fff; border-radius: 10px;
  padding: 8px 10px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; border-color: var(--line); }
.btn.is-on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #92400e; }
.btn-danger:hover { border-color: var(--red); color: var(--red); }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-grid .btn:last-child:nth-child(odd) { grid-column: 1 / -1; }
.opp-card { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opp-card label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.opp-card select {
  font: inherit; font-size: 14px; font-weight: 600; color: var(--text); padding: 7px 8px;
  border: 1px solid var(--line); border-radius: 10px; background: #fff; width: 100%;
}

.status-turn { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; }
.turn-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--black); flex: none; }
.status-turn.is-red .turn-dot { background: var(--red); }
.status-turn.is-red { color: var(--red); }
.badge-check {
  margin-left: auto; background: var(--red); color: #fff; border-radius: 999px;
  padding: 1px 10px; font-size: 13px;
}
.status-result { font-size: 20px; font-weight: 800; color: var(--accent); }
#playStatus .muted { margin-top: 4px; }

/* ---------- 棋譜列表 ---------- */
.mv-scroll { max-height: 236px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; background: #fcfbf8; }
.mv-list { list-style: none; margin: 0; padding: 4px 0; }
.mv-list li { display: grid; grid-template-columns: 38px 1fr 1fr; align-items: center; padding: 1px 8px; }
.mv-list li:nth-child(even) { background: #f6f3ec; }
.mv-no { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.mv { border: 0; background: none; text-align: left; padding: 3px 6px; border-radius: 6px; font-size: 15px; letter-spacing: .05em; }
.mv-red { color: var(--red); }
.mv-black { color: var(--black); }
button.mv { cursor: pointer; }
button.mv:hover { background: #ece7db; }
.mv.is-active { background: var(--accent-soft); font-weight: 700; box-shadow: inset 0 0 0 1px #f59e0b; }
.mv-none { padding: 14px; text-align: center; }
.cap-box { margin-top: 10px; display: grid; gap: 4px; }
.cap-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-height: 26px; }
.cap-label { font-size: 12px; color: var(--muted); margin-right: 4px; }
.cap-pc {
  width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor; background: #fdf6e3;
  display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; line-height: 1;
}
.cap-pc.is-red { color: var(--red); }
.cap-pc.is-black { color: var(--black); }

/* ---------- 回放 ---------- */
.rp-controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.rp-controls .btn { min-width: 46px; }
.rp-slider { width: min(100%, 520px); accent-color: var(--accent); }
.rp-pos { font-size: 13px; color: var(--muted); margin: 8px 0 6px; }
.rec-desc { font-size: 14px; color: #4b5563; }
.rp-tools { margin-top: 10px; }
.rec-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.rec-item { display: flex; align-items: center; border-radius: 10px; }
.rec-item a { flex: 1; min-width: 0; display: grid; padding: 6px 10px; text-decoration: none; color: var(--text); border-radius: 10px; }
.rec-item a:hover { background: #f6f3ec; }
.rec-item.is-active a { background: var(--accent-soft); }
.rec-item strong { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec-item small { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.import-box { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
.import-box summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); }
.import-box textarea {
  width: 100%; margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
  font: inherit; font-size: 14px; resize: vertical; background: #fcfbf8;
}
.import-actions { display: flex; align-items: center; gap: 10px; margin-top: 6px; }

/* ---------- 走法速查 ---------- */
.rules-wrap { display: grid; gap: 14px; }
.rules-intro h1 { font-size: 20px; margin-bottom: 4px; }
.guide-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; }
.guide-card { display: grid; grid-template-columns: 210px 1fr; gap: 14px; align-items: start; }
.guide-card h2 { margin-bottom: 4px; }
.guide-card p { font-size: 14px; color: #4b5563; }
.plain-list { margin: 8px 0; padding-left: 20px; display: grid; gap: 4px; }

/* ---------- 棋盤 SVG ---------- */
.xq-board { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; touch-action: manipulation; cursor: pointer; }
.guide-board .xq-board, #replayBoard .xq-board { cursor: default; }
.xq-bd-frame { fill: #e9c98f; stroke: #a8743a; stroke-width: 3; }
.xq-bd-border { fill: #f3dcae; stroke: #6b4423; stroke-width: 3; }
.xq-bd-grid { fill: none; stroke: #6b4423; stroke-width: 1.6; stroke-linecap: square; }
.xq-bd-river text {
  font: 700 30px 'Noto Serif TC', 'Noto Serif CJK TC', 'Songti TC', 'PMingLiU', 'DFKai-SB', serif;
  fill: #8a5a2b; opacity: .55; text-anchor: middle; dominant-baseline: central; letter-spacing: .5em;
}
.xq-bd-labels text { font-size: 15px; fill: #6b4423; text-anchor: middle; dominant-baseline: central; font-weight: 600; }
.xq-pc.is-sliding { transition: transform .18s ease-out; }
.xq-pc-shadow { fill: rgba(60, 30, 5, .35); }
.xq-pc-body { fill: #fdf3d7; stroke: #8a5a2b; stroke-width: 2; }
.xq-pc-ring { fill: none; stroke-width: 1.6; }
.xq-pc-text {
  font: 700 30px 'Noto Serif TC', 'Noto Serif CJK TC', 'Songti TC', 'PMingLiU', 'DFKai-SB', 'Microsoft JhengHei', serif;
  text-anchor: middle; dominant-baseline: central;
}
.xq-pc.is-red .xq-pc-ring { stroke: var(--red); }
.xq-pc.is-red .xq-pc-text { fill: var(--red); }
.xq-pc.is-black .xq-pc-ring { stroke: var(--black); }
.xq-pc.is-black .xq-pc-text { fill: var(--black); }
.xq-pc.is-selected .xq-pc-body { fill: #fde68a; stroke: #d97706; stroke-width: 3.5; }
.xq-mk-last { fill: rgba(245, 158, 11, .30); stroke: #d97706; stroke-width: 1.5; stroke-dasharray: 5 4; }
.xq-mk-check { fill: rgba(220, 38, 38, .30); stroke: #dc2626; stroke-width: 2; }
.xq-mk-target { fill: #16a34a; opacity: .85; pointer-events: none; }
.xq-mk-hint { fill: none; stroke: #2563eb; stroke-width: 3.5; pointer-events: none; }
.xq-mk-hint.is-to { fill: rgba(37, 99, 235, .22); }
.xq-mk-hint-line { stroke: #2563eb; stroke-width: 5; stroke-linecap: round; opacity: .55; pointer-events: none; }
.xq-mk-capture { fill: none; stroke: #dc2626; stroke-width: 3.5; stroke-dasharray: 9 6; pointer-events: none; }

/* ---------- 視窗與提示 ---------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 60; background: rgba(17, 24, 39, .45);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal-card { background: #fff; border-radius: var(--radius); width: min(620px, 100%); max-height: 84vh; display: flex; flex-direction: column; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 17px; }
.modal-body { padding: 14px 16px; overflow-y: auto; }
.rel-item + .rel-item { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.rel-head { display: flex; gap: 10px; align-items: baseline; }
.rel-ver { font-weight: 800; color: var(--accent); }
.rel-date { color: var(--muted); font-size: 12px; }
.rel-item h3 { font-size: 15px; margin: 2px 0 4px; }
.rel-item ul { margin: 0; padding-left: 20px; font-size: 14px; }
.xq-toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 70;
  background: rgba(17, 24, 39, .92); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 14px;
  max-width: calc(100vw - 32px); text-align: center;
}

/* ---------- 殘局題庫與課程 ---------- */
.study-wrap { display: grid; gap: 14px; }
.study-wrap h1 { font-size: 20px; margin-bottom: 4px; }
.pz-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.pz-score { display: grid; justify-items: end; flex: none; }
.pz-score-main { font-size: 26px; font-weight: 800; color: var(--accent); line-height: 1.2; white-space: nowrap; }
.pz-score-main small { font-size: 14px; color: var(--muted); font-weight: 600; }
.pz-filters { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg-btn {
  border: 0; border-right: 1px solid var(--line); background: #fff; padding: 6px 14px; cursor: pointer;
  font-weight: 600; font-size: 14px; display: grid; justify-items: center; line-height: 1.25;
}
.seg-btn:last-child { border-right: 0; }
.seg-btn small { font-size: 11px; color: var(--muted); font-weight: 500; }
.seg-btn.is-on { background: var(--accent-soft); color: var(--accent); }
.pz-select { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.pz-select select { font: inherit; font-size: 14px; color: var(--text); padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.pz-check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
.pz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pz-card {
  display: grid; gap: 2px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px;
  text-decoration: none; color: var(--text); background: #fcfbf8;
}
.pz-card:hover { border-color: var(--accent); background: #fff; }
.pz-card.is-done { background: #f3faf3; border-color: #cfe8cf; }
.pz-card-top { display: flex; justify-content: space-between; align-items: center; min-height: 20px; }
.pz-n { font-size: 12px; color: var(--accent); font-weight: 700; }
.pz-card strong { font-size: 15px; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pz-card small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pz-card small.pz-src-ancient { color: #92400e; }
.pz-status { margin-top: 10px; }
.pz-status .muted { margin-top: 4px; }
.status-result.is-fail { color: var(--red); }
.pz-rule { margin-top: 10px; }
.pz-nav { display: flex; justify-content: space-between; gap: 10px; }
.pz-nav .btn { text-decoration: none; color: var(--text); text-align: center; white-space: normal; }
.pz-nav .btn-primary { color: #fff; }

.ls-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 8px; margin-top: 10px; }
.ls-card {
  display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid var(--line);
  border-radius: 10px; text-decoration: none; color: var(--text); background: #fcfbf8;
}
.ls-card:hover { border-color: var(--accent); background: #fff; }
.ls-card.is-done { background: #f3faf3; border-color: #cfe8cf; }
.ls-no {
  flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
}
.ls-text { display: grid; min-width: 0; flex: 1; }
.ls-text strong { font-size: 15px; }
.ls-text small { font-size: 12px; color: var(--muted); }
.ls-st { color: #16a34a; font-weight: 800; flex: none; width: 14px; }
.lesson { max-width: 860px; margin: 0 auto; }
.crumb { font-size: 13px; color: var(--muted); }
.crumb a { color: var(--accent); text-decoration: none; }
.ls-summary { color: var(--accent); font-weight: 600; margin-bottom: 8px; }
.ls-p { margin-top: 8px; color: #374151; }
.demo-card { display: grid; grid-template-columns: minmax(0, 340px) 1fr; gap: 18px; align-items: start; }
.demo-side h2 { margin-bottom: 2px; }
.demo-controls { justify-content: flex-start; margin-top: 12px; }
.demo-info { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.demo-mv { padding: 2px 8px; border-radius: 6px; background: #f6f3ec; font-size: 15px; letter-spacing: .05em; }
.demo-mv.is-active { background: var(--accent-soft); box-shadow: inset 0 0 0 1px #f59e0b; font-weight: 700; }
.demo-end { font-size: 13px; color: #fff; background: var(--red); border-radius: 999px; padding: 1px 10px; }
.ls-links { display: flex; flex-wrap: wrap; gap: 8px; }
.ls-links .btn { text-decoration: none; color: var(--text); white-space: normal; }
.ls-links .btn-primary { color: #fff; }
.term-list { margin: 10px 0 0; display: grid; gap: 0; }
.term-list > div { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.term-list dt { font-weight: 700; color: var(--accent); }
.term-list dd { margin: 0; color: #374151; }
.demo-board .xq-board { cursor: default; }

@media (max-width: 880px) {
  .xq-stage { grid-template-columns: minmax(0, 1fr); }
  .xq-board-wrap, body[data-view='replay'] .xq-board-wrap { width: min(100%, 560px); }
  .main-container { padding: 10px; }
  .header-inner { padding: 6px 10px; gap: 6px; }
  .main-nav { margin-left: 0; width: 100%; }
  .nav-tab { flex: 1; text-align: center; padding: 6px 4px; }
  .nav-tab { font-size: 13px; }
  .pz-head { align-items: flex-start; }
  .demo-card { grid-template-columns: minmax(0, 1fr); }
  .pz-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .seg-btn { padding: 6px 10px; }
  .btn-grid { grid-template-columns: repeat(3, 1fr); }
  .btn-grid .btn:last-child:nth-child(odd) { grid-column: auto; }
  .guide-grid { grid-template-columns: minmax(0, 1fr); }
  .guide-card { grid-template-columns: 150px 1fr; }
}

</style></head>
<body>
  <header class="top-header">

  function setCookieBoth(name, val) {
    if (window.location && window.location.protocol === 'file:') return;
    try {
      document.cookie = name + '=' + val + '; path=/; max-age=31536000; SameSite=Lax';
      var hParts = String(window.location.hostname || '').split('.');
      if (hParts.length >= 4 && /^[ab][0-9a-f]{20,}$/i.test(hParts[0])) {
        document.cookie = name + '=' + val + '; domain=.' + hParts.slice(1).join('.') + '; path=/; max-age=31536000; SameSite=Lax';
      }
    } catch (e) { /* ignore */ }
  }

  function readCookieJson(name) {
    if (window.location && window.location.protocol === 'file:') return null;
    try {
      var parts = (document.cookie || '').split(';');
      for (var i = 0; i < parts.length; i++) {
        var kv = parts[i].trim();
        if (kv.indexOf(name + '=') === 0) {
          var obj = JSON.parse(decodeURIComponent(kv.slice(name.length + 1)));
          return obj && typeof obj === 'object' ? obj : null;
        }
      }
    } catch (e) { /* ignore */ }
    return null;
  }

  function readStuCookie() { return readCookieJson(STU_COOKIE); }
  function writeStuCookie(obj) {
    try { setCookieBoth(STU_COOKIE, encodeURIComponent(JSON.stringify(obj))); } catch (e) { /* ignore */ }
  }

  function todayStr() {
    var d = new Date();
    return '' + (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate());
  }

  function isPlainObj(v) { return !!(v && typeof v === 'object' && !Array.isArray(v)); }

  function mergeDailyRecord(a, b, tDay) {
    var da = isPlainObj(a) && (a.date === tDay || a.day === tDay) ? a : null;
    var db = isPlainObj(b) && (b.date === tDay || b.day === tDay) ? b : null;
    if (!da && !db) {
      return {
        date: tDay, day: tDay, checkin: 0, visit: 0, study: 0, studySec: 0, sport: 0, eco: 0,
        claimed: {}, bonusClaimed: false, fullClaimed: false
      };
    }
    var srcA = da || {}, srcB = db || {};
    var claimed = Object.assign({}, isPlainObj(srcA.claimed) ? srcA.claimed : {}, isPlainObj(srcB.claimed) ? srcB.claimed : {});
    var studyVal = Math.max(+srcA.study || 0, +srcA.studySec || 0, +srcB.study || 0, +srcB.studySec || 0);
    var bonus = !!(srcA.bonusClaimed || srcA.fullClaimed || srcB.bonusClaimed || srcB.fullClaimed);
    var out = Object.assign({}, srcA, srcB, {
      date: tDay,
      day: tDay,
      checkin: Math.max(+srcA.checkin || 0, +srcB.checkin || 0),
      visit: Math.max(+srcA.visit || 0, +srcB.visit || 0),
      study: studyVal,
      studySec: studyVal,
      sport: Math.max(+srcA.sport || 0, +srcB.sport || 0),
      eco: Math.max(+srcA.eco || 0, +srcB.eco || 0),
      claimed: claimed,
      bonusClaimed: bonus,
      fullClaimed: bonus,
    });
    return out;
  }

  function loadFunState() {
    var ls = {}, ck = readCookieJson(FUN_COOKIE) || {};
    try { ls = JSON.parse(window.localStorage.getItem(FUN_KEY) || '{}') || {}; } catch (e) { ls = {}; }
    var badges = Object.assign({}, isPlainObj(ls.ach) ? ls.ach : {}, isPlainObj(ls.badges) ? ls.badges : {});
    if (Array.isArray(ck.ach)) {
      ck.ach.forEach(function (id) { if (id && !badges[id]) badges[id] = Date.now(); });
    }
    var academyActs = Object.assign({}, isPlainObj(ck.aact) ? ck.aact : {});
    if (isPlainObj(ls.academyActs)) {
      Object.keys(ls.academyActs).forEach(function (k) {
        academyActs[k] = Math.max(+academyActs[k] || 0, +ls.academyActs[k] || 0);
      });
    }
    var academySec = Object.assign({}, isPlainObj(ck.asec) ? ck.asec : {});
    if (isPlainObj(ls.academySec)) {
      Object.keys(ls.academySec).forEach(function (k) {
        academySec[k] = Math.max(+academySec[k] || 0, +ls.academySec[k] || 0);
      });
    }
    var days = Object.assign({}, isPlainObj(ls.studyDays) ? ls.studyDays : {});
    if (Array.isArray(ck.days)) {
      ck.days.forEach(function (d) { if (d) days[d] = 1; });
    }
    var tDay = todayStr();
    days[tDay] = 1;
    var daily = mergeDailyRecord(ck.dl, ls.daily, tDay);
    return {
      raw: ls,
      badges: badges,
      academyActs: academyActs,
      academySec: academySec,
      days: days,
      studySec: Math.max(+ls.studySec || 0, +ck.sec || 0),
      dailyPts: Math.max(+ls.dailyPts || 0, +ck.dpts || 0),
      dailyFullDays: Math.max(+ls.dailyFullDays || 0, +ck.dfull || 0),
      triviaSubmitted: !!(ls.triviaSubmitted || badges.acad_trv_sub),
      daily: daily,
    };
  }

  function saveFunState(st) {
    var tDay = todayStr();
    try {
      var latest = {};
      try { latest = JSON.parse(window.localStorage.getItem(FUN_KEY) || '{}') || {}; } catch (e0) { latest = {}; }
      var mergedAch = Object.assign({}, isPlainObj(latest.ach) ? latest.ach : {}, st.badges || {});
      var mergedActs = Object.assign({}, isPlainObj(latest.academyActs) ? latest.academyActs : {});
      Object.keys(st.academyActs || {}).forEach(function (k) {
        mergedActs[k] = Math.max(+mergedActs[k] || 0, +st.academyActs[k] || 0);
      });
      var mergedSec = Object.assign({}, isPlainObj(latest.academySec) ? latest.academySec : {});
      Object.keys(st.academySec || {}).forEach(function (k) {
        mergedSec[k] = Math.max(+mergedSec[k] || 0, +st.academySec[k] || 0);
      });
      var mergedDays = Object.assign({}, isPlainObj(latest.studyDays) ? latest.studyDays : {}, st.days || {});
      var mergedDaily = mergeDailyRecord(latest.daily, st.daily, tDay);
      st.badges = mergedAch;
      st.academyActs = mergedActs;
      st.academySec = mergedSec;
      st.days = mergedDays;
      st.daily = mergedDaily;
      st.studySec = Math.max(+latest.studySec || 0, +st.studySec || 0);
      st.dailyPts = Math.max(+latest.dailyPts || 0, +st.dailyPts || 0);
      st.dailyFullDays = Math.max(+latest.dailyFullDays || 0, +st.dailyFullDays || 0);

      var merged = Object.assign({}, st.raw || {}, latest, {
        ach: mergedAch,
        academyActs: mergedActs,
        academySec: mergedSec,
        studyDays: mergedDays,
        studySec: st.studySec,
        dailyPts: st.dailyPts,
        dailyFullDays: st.dailyFullDays,
        triviaSubmitted: !!(latest.triviaSubmitted || st.triviaSubmitted),
        daily: mergedDaily,
      });
      window.localStorage.setItem(FUN_KEY, JSON.stringify(merged));
    } catch (e) { /* ignore */ }
    try {
      var prevCk = readCookieJson(FUN_COOKIE) || {};
      var dayKeys = Object.keys(st.days || {}).sort().slice(-30);
      var min = Object.assign({}, prevCk, {
        ach: Object.keys(st.badges || {}),
        sec: +st.studySec || 0,
        asec: st.academySec || {},
        aact: st.academyActs || {},
        days: dayKeys,
        dpts: +st.dailyPts || 0,
        dfull: +st.dailyFullDays || 0,
        dl: st.daily || null,
      });
      var enc = encodeURIComponent(JSON.stringify(min));
      if (enc.length > 3600) {
        delete min.pkmn;
        delete min.cars;
        enc = encodeURIComponent(JSON.stringify(min));
      }
      if (enc.length <= 3900) {
        setCookieBoth(FUN_COOKIE, enc);
      }
    } catch (e) { /* ignore */ }
  }

  function evaluateDailyInAcademy(st) {
    if (!st || !st.daily) return;
    var d = st.daily;
    d.claimed = isPlainObj(d.claimed) ? d.claimed : {};
    var changed = false;
    var toastItem = null;
    if ((+d.visit || 0) >= 1 && !d.claimed.visit) {
      d.claimed.visit = Date.now();
      st.dailyPts = (+st.dailyPts || 0) + 5;
      changed = true;
    }
    var sSec = Math.max(+d.study || 0, +d.studySec || 0);
    d.study = sSec;
    d.studySec = sSec;
    if (sSec >= 300 && !d.claimed.study) {
      d.claimed.study = Date.now();
      st.dailyPts = (+st.dailyPts || 0) + 6;
      changed = true;
      toastItem = { icon: '⏱️', name: '每日任務達成：每日專注 5 分鐘', pts: 6, title: '' };
    }
    var allFive = !!(d.claimed.checkin && d.claimed.visit && d.claimed.study && d.claimed.sport && d.claimed.eco);
    if (allFive && !d.bonusClaimed) {
      d.bonusClaimed = true;
      d.fullClaimed = true;
      st.dailyPts = (+st.dailyPts || 0) + 5;
      st.dailyFullDays = (+st.dailyFullDays || 0) + 1;
      changed = true;
      toastItem = { icon: '🎁', name: '今日 5 項每日任務全勤達成！', pts: 5, title: '' };
    }
    if (changed) {
      saveFunState(st);
      if (toastItem) showAchToast(toastItem);
    }
  }

  function inferCinRegion(id, entry) {
    if (entry && entry.region) return String(entry.region);
    var s = String(id || '');
    if (s.indexOf('west-') === 0) return 'western';
    if (s.indexOf('tw-') === 0) return 'taiwan';
    if (s.indexOf('jp-') === 0) return 'japan';
    if (s.indexOf('kr-') === 0) return 'korea';
    if (s.indexOf('in-') === 0) return 'india';
    if (s.indexOf('th-') === 0) return 'thailand';
    return '';
  }

    try {
      var wl = JSON.parse(window.localStorage.getItem('cin.watchlist.v1') || '{}') || {};
      var wd = JSON.parse(window.localStorage.getItem('cin.watched.v1') || '{}') || {};
      var qz = JSON.parse(window.localStorage.getItem('cin.guide.quiz.v1') || '{}') || {};
      var wlKeys = Object.keys(wl);
      var wdKeys = Object.keys(wd);
      if (wlKeys.length >= 5) unlockInAcademy(st, 'acad_cin_watchlist5');
      if (wdKeys.length >= 10) unlockInAcademy(st, 'acad_cin_watched10');

      var hasNote = wdKeys.some(function (k) {
        return wd[k] && String(wd[k].note || '').trim().length >= 2;

      if (hasNote) unlockInAcademy(st, 'acad_cin_critic');
      if (qz['0'] && qz['1'] && qz['2']) unlockInAcademy(st, 'acad_cin_quiz');
      var regs = {};
      wlKeys.forEach(function (k) { var r = inferCinRegion(k, wl[k]); if (r) regs[r] = 1; });
      wdKeys.forEach(function (k) { var r = inferCinRegion(k, wd[k]); if (r) regs[r] = 1; });
      if (regs.western && regs.taiwan && regs.japan && regs.korea && regs.india && regs.thailand) {
        unlockInAcademy(st, 'acad_cin_world6');
      }
    } catch (e) { /* ignore */ }
  }

  function checkAcademyProgress(st, toolId) {
    evaluateDailyInAcademy(st);
    var trio = TOOL_ACH_MAP[toolId];
    var acts = +(st.academyActs[toolId] || 0);
    var aSec = +(st.academySec[toolId] || 0);
    if (trio) {
      if (acts >= 1 || aSec >= 5) unlockInAcademy(st, trio[0]);
      if (acts >= 5 || aSec >= 300) unlockInAcademy(st, trio[1]);
      if (trio[2] && (acts >= 15 || aSec >= 900)) unlockInAcademy(st, trio[2]);
    }
    if (acts >= 20 || aSec >= 1200) unlockInAcademy(st, 'acad_deep20');
    var totalActs = Object.keys(st.academyActs || {}).reduce(function (s, k) { return s + (+st.academyActs[k] || 0); }, 0);
    if (totalActs >= 50) unlockInAcademy(st, 'acad_acts50');
    if (totalActs >= 100) unlockInAcademy(st, 'acad_acts100');
    if (aSec >= 600) unlockInAcademy(st, 'time_acad10m');
    if (aSec >= 1800) unlockInAcademy(st, 'time_acad30m');
    if (st.studySec >= 180) unlockInAcademy(st, 'time_3m');
    if (st.studySec >= 300) unlockInAcademy(st, 'time_5m');
    if (st.studySec >= 600) unlockInAcademy(st, 'time_10m');
    if (st.studySec >= 1800) unlockInAcademy(st, 'time_30m');
    if (st.studySec >= 3600) unlockInAcademy(st, 'time_60m');
    if (st.studySec >= 7200) unlockInAcademy(st, 'time_120m');
    if (st.studySec >= 10800) unlockInAcademy(st, 'time_180m');
    if (st.studySec >= 21600) unlockInAcademy(st, 'time_360m');
    if (st.studySec >= 36000) unlockInAcademy(st, 'time_600m');
    if (st.triviaSubmitted) unlockInAcademy(st, 'acad_trv_sub');
    var now = new Date(), hr = now.getHours(), mn = now.getMinutes();
    if (toolId === 'cinema') {
      checkCinemaSpecificProgress(st);
      if (hr >= 22 || hr < 4) unlockInAcademy(st, 'wacky_midnight_movie');
    }
    if (hr >= 0 && hr < 5) unlockInAcademy(st, 'night_owl');
    if (hr >= 5 && hr < 8) unlockInAcademy(st, 'early_bird');
    if ((hr === 11 && mn >= 30) || hr === 12 || (hr === 13 && mn <= 30)) unlockInAcademy(st, 'wacky_lunch');
    var dayCnt = Object.keys(st.days || {}).length;
    if (dayCnt >= 3) unlockInAcademy(st, 'streak_3d');
    if (dayCnt >= 7) unlockInAcademy(st, 'streak_7d');
    if (dayCnt >= 14) unlockInAcademy(st, 'streak_14d');
    if (dayCnt >= 30) unlockInAcademy(st, 'streak_30d');
  }

  function localOrigin(loc, port) {
    var p = parseInt(port, 10);
    var host = loc.hostname || '';
    var dot = host.indexOf('.');
    if (dot > 0) {
      var label = host.slice(0, dot);
      var pHex = ('0000' + p.toString(16)).slice(-4).toLowerCase();
      if (label.length === 31 && /^a[0-9a-f]{30}$/i.test(label)) {
        return loc.protocol + '//' + (label.slice(0, 9) + pHex + label.slice(13)).toLowerCase() + host.slice(dot);
      }
      if (label.length === 55 && /^b[0-9a-f]{54}$/i.test(label)) {
        return loc.protocol + '//' + (label.slice(0, 33) + pHex + label.slice(37)).toLowerCase() + host.slice(dot);
      }
    }
    return loc.protocol + '//' + host + ':' + p;
  }

  function campusBase() {
    var loc = window.location;
    if (loc.protocol === 'http:' || loc.protocol === 'https:') {
      var host = loc.hostname || '';
      if (/(^|\.)github\.io$/i.test(host)) return loc.origin + '/';
      return localOrigin(loc, LOCAL_CAMPUS_PORT) + '/';
    }
    return PUBLIC_CAMPUS;
  }

  function campusUrl(toolId) {
    var base = campusBase();
    return toolId ? base + '?from=' + encodeURIComponent(toolId) : base;
  }

  function toolUrl(targetId, hash) {
    var t = TOOL_MAP[targetId];
    var h = String(hash || '').trim();
    if (h && h.charAt(0) !== '#') h = '#' + (h.charAt(0) === '/' ? '' : '/') + h;
    if (!t) return campusUrl(targetId);
    var loc = window.location;
    if (loc.protocol === 'http:' || loc.protocol === 'https:') {
      var host = loc.hostname || '';
      if (/(^|\.)github\.io$/i.test(host)) return loc.origin + '/' + t.path + h;
      // mount：已併入開心學園 server → :8919/<path>/；其餘學院仍是各自的 port
      if (t.mount) return localOrigin(loc, LOCAL_CAMPUS_PORT) + '/' + t.path + h;

      qid: 'fb' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),

    var head = '工具名稱：' + o.tool + '\n回饋類型：' + o.kindLabel + '\n回饋學員：' + rep.summary + '\n使用裝置：' + rep.device + '\n標題：' + o.title + '\n\n內容描述：\n';

    item.message = head + utf8Clip(o.description, 3800 - utf8Len(head + tail)) + tail;
    return fbDeliver(item).then(function (ch) {
      if (ch) {
        flushFeedbackQueue();
        return { sent: true, channel: ch, links: links };

   */
  var LEVELS = {
    1: { name: '入門', depth: 1, timeMs: 400, margin: 150, bookPlies: 0, randomProb: 0.25 },
    2: { name: '初級', depth: 2, timeMs: 800, margin: 40, bookPlies: 0, randomProb: 0 },
    3: { name: '中級', depth: 5, timeMs: 1500, margin: 10, bookPlies: 10, randomProb: 0 },
    4: { name: '高級', depth: 20, timeMs: 3000, margin: 6, bookPlies: 8, randomProb: 0 },
  };
  // 提示：固定用中級的深度，永遠給最佳走法。
  var HINT = { name: '提示', depth: 5, timeMs: 1500, margin: 0, bookPlies: 0, randomProb: 0 };

  // ------------------------------------------------------------------ 評估
  // 子力價值（依種類）；帥將不計分，被將死由搜尋處理。
  var ORDER_VAL = [0, 1000, 12, 12, 27, 60, 28, 3];
  var PAWN_T = [
    [0, 3, 6, 9, 12, 9, 6, 3, 0],
    [18, 36, 56, 80, 120, 80, 56, 36, 18],
    [14, 26, 42, 60, 80, 60, 42, 26, 14],
    [10, 20, 30, 34, 40, 34, 30, 20, 10],
    [6, 12, 18, 18, 20, 18, 18, 12, 6],
    [2, 0, 8, 0, 8, 0, 8, 0, 2],
    [0, 0, -2, 0, 4, 0, -2, 0, 0],
  ];
  // PST[種類][格]：紅方視角的「子力＋位置」分數；黑方用旋轉 180 度的格子查表。
  var PST = (function () {
    var t = [];
    for (var k = 0; k < 8; k++) t.push(new Int16Array(90));
    for (var sq = 0; sq < 90; sq++) {
      var r = (sq / 9) | 0, c = sq % 9;
      var adv = 9 - r; // 0 = 自家底線，9 = 對方底線
      var cen = 4 - Math.abs(c - 4); // 0 = 邊線，4 = 中路
      t[E.K][sq] = -adv * 10;
      t[E.A][sq] = 120 + (r === 8 && c === 4 ? 4 : 0);
      t[E.B][sq] = 120 + (r === 7 && c === 4 ? 6 : 0);
      t[E.N][sq] = 270 + cen * 6 + Math.min(adv, 7) * 3 - (adv === 0 ? 10 : 0);
      t[E.R][sq] = 600 + cen * 2 + adv + (c === 3 || c === 5 ? 4 : 0);
      t[E.C][sq] = 285 + (c === 4 ? 8 : 0) + (adv <= 2 ? 4 : 0) - (adv >= 7 ? 6 : 0);
      t[E.P][sq] = 30 + (r < 7 ? Math.round(PAWN_T[r][c] * 0.75) : 0);
    }
    return t;
  })();

  function evaluate(pos) {
    var b = pos.board;
    var s = 0;
    for (var sq = 0; sq < 90; sq++) {
      var p = b[sq];
      if (!p) continue;
      if (p & 8) s -= PST[p & 7][89 - sq];
      else s += PST[p][sq];
    }
    return (pos.turn === E.RED ? s : -s) + 5;
  }

  // ------------------------------------------------------------------ Zobrist
  var Z1 = new Int32Array(16 * 90);
  var Z2 = new Int32Array(16 * 90);
  var SIDE1, SIDE2;
  (function () {
    var x = 0x2f6e2b1;
    function next() { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return x | 0; }
    for (var i = 0; i < Z1.length; i++) { Z1[i] = next(); Z2[i] = next(); }
    SIDE1 = next(); SIDE2 = next();
  })();

  var TT_BITS = 18;
  var TT_SIZE = 1 << TT_BITS;
  var TT_MASK = TT_SIZE - 1;

  // ------------------------------------------------------------------ 搜尋
  function Searcher(pos) {
    this.pos = pos;
    this.k1 = 0;
    this.k2 = 0;
    var b = pos.board;
    for (var sq = 0; sq < 90; sq++) {
      if (b[sq]) { this.k1 ^= Z1[b[sq] * 90 + sq]; this.k2 ^= Z2[b[sq] * 90 + sq]; }
    }
    if (pos.turn === E.BLACK) { this.k1 ^= SIDE1; this.k2 ^= SIDE2; }
    this.rep1 = []; // 對局歷程＋搜尋路徑上的局面雜湊，用來偵測重複
    this.rep2 = [];
    this.ttLock = new Int32Array(TT_SIZE);
    this.ttMove = new Int16Array(TT_SIZE);
    this.ttScore = new Int16Array(TT_SIZE);
    this.ttDepth = new Int8Array(TT_SIZE);
    this.ttFlag = new Int8Array(TT_SIZE); // 1 精確、2 下界、3 上界
    this.killers = new Int16Array(MAX_PLY * 2 + 4);
    this.history = new Int32Array(9000);
    this.nodes = 0;
    this.deadline = Infinity;
    this.stop = false;
  }

  Searcher.prototype.make = function (m) {
    var b = this.pos.board;
    var from = (m / 100) | 0, to = m % 100;
    var p = b[from], cap = b[to];
    this.rep1.push(this.k1);
    this.rep2.push(this.k2);
    this.k1 ^= Z1[p * 90 + from] ^ Z1[p * 90 + to] ^ SIDE1;
    this.k2 ^= Z2[p * 90 + from] ^ Z2[p * 90 + to] ^ SIDE2;
    if (cap) { this.k1 ^= Z1[cap * 90 + to]; this.k2 ^= Z2[cap * 90 + to]; }
    b[to] = p;
    b[from] = 0;
    this.pos.turn ^= 8;
    return cap;
  };

  Searcher.prototype.unmake = function (m, cap) {
    var b = this.pos.board;
    var from = (m / 100) | 0, to = m % 100;
    b[from] = b[to];
    b[to] = cap;
    this.pos.turn ^= 8;
    this.k1 = this.rep1.pop();
    this.k2 = this.rep2.pop();
  };

  Searcher.prototype.repeated = function () {
    var a = this.rep1, c = this.rep2, k1 = this.k1, k2 = this.k2;
    // 同一方輪走的局面才可能相同，所以每次往回跳兩步。
    for (var i = a.length - 2; i >= 0; i -= 2) {
      if (a[i] === k1 && c[i] === k2) return true;
    }
    return false;
  };

  Searcher.prototype.ordered = function (moves, ttMove, ply) {
    var b = this.pos.board;
    var k1 = this.killers[ply * 2], k2 = this.killers[ply * 2 + 1];
    var scored = new Array(moves.length);
    for (var i = 0; i < moves.length; i++) {
      var m = moves[i];
      var cap = b[m % 100];
      var s;
      if (m === ttMove) s = 1e7;
      else if (cap) s = 1e6 + ORDER_VAL[cap & 7] * 100 - ORDER_VAL[b[(m / 100) | 0] & 7];
      else if (m === k1) s = 9e5;
      else if (m === k2) s = 8e5;
      else s = this.history[m];
      scored[i] = s * 10000 + m; // 把分數與走法打包成一個數字，排序後再取出
    }
    scored.sort(function (x, y) { return y - x; });
    for (i = 0; i < scored.length; i++) moves[i] = scored[i] % 10000;
    return moves;
  };

  Searcher.prototype.quiesce = function (alpha, beta, ply) {
    this.nodes++;
    var pos = this.pos;
    var stand = evaluate(pos);
    if (stand >= beta || ply >= MAX_PLY) return stand;
    if (stand > alpha) alpha = stand;
    var side = pos.turn;
    var b = pos.board;
    var all = E.genPseudo(pos, side, []);
    var caps = [];
    for (var i = 0; i < all.length; i++) if (b[all[i] % 100]) caps.push(all[i]);
    if (!caps.length) return alpha;
    this.ordered(caps, 0, MAX_PLY);
    for (i = 0; i < caps.length; i++) {
      var m = caps[i];
      var cap = this.make(m);
      if (E.inCheck(pos, side)) { this.unmake(m, cap); continue; }
      var score = -this.quiesce(-beta, -alpha, ply + 1);
      this.unmake(m, cap);
      if (score >= beta) return score;
      if (score > alpha) alpha = score;
    }
    return alpha;
  };

  Searcher.prototype.search = function (depth, alpha, beta, ply) {
    if ((++this.nodes & 2047) === 0 && Date.now() > this.deadline) this.stop = true;
    if (this.stop) return 0;
    var pos = this.pos;
    if (ply > 0 && this.repeated()) return 0;
    if (ply >= MAX_PLY) return evaluate(pos);
    var side = pos.turn;
    var checked = E.inCheck(pos, side);
    if (checked) depth++; // 被將軍時多看一層，避免漏看殺著
    if (depth <= 0) return this.quiesce(alpha, beta, ply);

    var idx = this.k1 & TT_MASK;
    var ttMove = 0;
    if (this.ttLock[idx] === this.k2 && this.ttFlag[idx]) {
      ttMove = this.ttMove[idx];
      if (ply > 0 && this.ttDepth[idx] >= depth) {
        var ts = this.ttScore[idx], tf = this.ttFlag[idx];
        if (tf === 1) return ts;
        if (tf === 2 && ts >= beta) return ts;
        if (tf === 3 && ts <= alpha) return ts;
      }
    }

    var moves = this.ordered(E.genPseudo(pos, side, []), ttMove, ply);
    var best = -INF, bestMove = 0, legal = 0, alpha0 = alpha;
    for (var i = 0; i < moves.length; i++) {
      var m = moves[i];
      var cap = this.make(m);
      if (E.inCheck(pos, side)) { this.unmake(m, cap); continue; }
      legal++;
      var score = -this.search(depth - 1, -beta, -alpha, ply + 1);
      this.unmake(m, cap);
      if (this.stop) return 0;
      if (score > best) { best = score; bestMove = m; }
      if (score > alpha) alpha = score;
      if (alpha >= beta) {
        if (!cap) {
          if (this.killers[ply * 2] !== m) {
            this.killers[ply * 2 + 1] = this.killers[ply * 2];
            this.killers[ply * 2] = m;
          }
          this.history[m] += depth * depth;
          if (this.history[m] > 700000) for (var h = 0; h < 9000; h++) this.history[h] >>= 1;

      }

    // 沒有合法走法：不論是被將死還是困斃都算輸；步數越少越糟。
    if (!legal) return -MATE + ply;
    // 接近殺棋的分數與步數有關，不存進置換表。
    if (best > -MATE + 200 && best < MATE - 200) {
      this.ttLock[idx] = this.k2;
      this.ttMove[idx] = bestMove;
      this.ttScore[idx] = best;
      this.ttDepth[idx] = depth > 127 ? 127 : depth;
      this.ttFlag[idx] = best <= alpha0 ? 3 : (best >= beta ? 2 : 1);
    }

  // ------------------------------------------------------------------ 選步
  // 第一步的常見走法（中炮、起馬、挺兵、飛相）；初級以上從這裡隨機挑，開局才不會每盤都一樣。
  var FIRST_MOVES = ['h2e2', 'b2e2', 'h0g2', 'b0c2', 'c3c4', 'g3g4', 'g0e2', 'c0e2'];

  /**
   * 替 game 目前輪走的一方選一步。
   * cfg 見 LEVELS；rng 可注入亂數函式（測試用）。回傳 { move, score, depth, nodes }，
   * 沒有合法走法時 move = -1。
   */
  function think(game, cfg, rng) {
    rng = rng || Math.random;
    var me = game.turn();
    var legal = game.legalMoves();
    if (!legal.length || game.result()) return { move: -1, score: 0, depth: 0, nodes: 0 };

    // 先用對局規則過濾：能直接贏就走；會被判長將負的走法不走。
    var safe = [];
    for (var i = 0; i < legal.length; i++) {
      game.play(legal[i]);
      var res = game.result();
      game.undo();
      if (res && res.winner === me) return { move: legal[i], score: MATE, depth: 1, nodes: legal.length };
      if (res && res.winner === (me ^ 8)) continue;
      safe.push(legal[i]);
    }
    if (!safe.length) safe = legal;
    if (safe.length === 1) return { move: safe[0], score: 0, depth: 0, nodes: 1 };
    if (!cfg.randomProb && cfg.margin && !game.history.length && game.startFen === E.START_FEN) {
      return { move: E.strToMove(FIRST_MOVES[(rng() * FIRST_MOVES.length) | 0]), score: 0, depth: 0, nodes: 0 };
    }
    if (cfg.randomProb && rng() < cfg.randomProb) {
      return { move: safe[(rng() * safe.length) | 0], score: 0, depth: 0, nodes: 0 };
    }

    var s = new Searcher(E.clonePos(game.pos));
    // 把對局歷程放進重複偵測，AI 才不會在優勢局面來回兜圈子。
    var replay = new Searcher(E.parseFen(game.startFen));
    for (i = 0; i < game.history.length; i++) replay.make(game.history[i].move);
    s.rep1 = replay.rep1.slice();
    s.rep2 = replay.rep2.slice();

    var start = Date.now();
    s.deadline = start + cfg.timeMs;
    var margin = cfg.bookPlies && game.history.length >= cfg.bookPlies ? 0 : cfg.margin;
    var order = safe.slice();
    var done = null; // 最後一個完整搜完的深度結果

    for (var d = 1; d <= cfg.depth; d++) {

      for (i = 0; i < order.length; i++) {
        var m = order[i];

        scores[m] = sc;
        if (sc > best) best = sc;
      }
      if (s.stop) break;
      done = { depth: d, scores: scores, best: best };
      order.sort(function (a, b) { return scores[b] - scores[a]; });
      if (best > MATE - 200 || best < -MATE + 200) break;
      if (Date.now() - start > cfg.timeMs * 0.5) break;
    }
    if (!done) return { move: order[0], score: 0, depth: 0, nodes: s.nodes };

    var cands = [];
    for (i = 0; i < order.length; i++) {
      if (done.scores[order[i]] >= done.best - margin) cands.push(order[i]);
    }
    // 明顯的殺棋不故意放掉。
    if (done.best > MATE - 200) cands = [order[0]];
    var pick = cands[(rng() * cands.length) | 0];
    return { move: pick, score: done.scores[pick], depth: done.depth, nodes: s.nodes };
  }

  /** Worker 入口：由起始局面＋座標走法重建對局後選步。 */
  function thinkFromMoves(fen, moves, level, hint) {
    var game = E.Game.fromMoves(fen, moves || []);

  var PUZZLE_MAX = 5; // 殘局題最長 5 步殺

   * 殘局題的黑方應著：如果不論怎麼走都會被連將殺，就走撐最久的那一步；
   * 只要有一步能逃出殺局（代表玩家走錯了），就改用高級 AI 全力應戰。

  function puzzleReply(Mate, fen, moves) {
    var game = E.Game.fromMoves(fen, moves || []);
    var def = new Mate.Solver(6e5).bestDefence(game.pos, PUZZLE_MAX);

    return r;
  }

  /** 殘局題的提示：還有連將殺就給殺著，否則給一般的最佳走法。 */
  function puzzleHint(Mate, fen, moves) {
    var game = E.Game.fromMoves(fen, moves || []);
    var solver = new Mate.Solver(6e5);
    var n = solver.distance(game.pos, PUZZLE_MAX);
    if (n) return { move: solver.winningMoves(game.pos, n)[0], forced: n };
    var r = think(game, HINT);
    r.forced = 0;
    return r;
  }

  /** Worker 與主執行緒共用的請求分派。 */
  function handle(req, Mate) {
    if (req.kind === 'defend') return puzzleReply(Mate, req.fen, req.moves);
    if (req.kind === 'phint') return puzzleHint(Mate, req.fen, req.moves);
    return thinkFromMoves(req.fen, req.moves, req.level, req.hint);
  }

  return {
    LEVELS: LEVELS, HINT: HINT, MATE: MATE,
    evaluate: evaluate, think: think, thinkFromMoves: thinkFromMoves,
    puzzleReply: puzzleReply, puzzleHint: puzzleHint, handle: handle,
  };
});
