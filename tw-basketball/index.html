        var rec = st.recommended_bump || 'patch', nv = st.next_versions || {};
        html += '<div class="card rel-pub"><div class="sec-hdr"><div><strong>🛠️ 偵測到 ' + st.changed_files.length + ' 個未發布檔案變更（+' +
          st.total_added + ' / -' + st.total_removed + ' 行）</strong><div class="sub">' + TWB.esc(st.recommend_reason || '') + '</div></div>' +
          '<span class="chip warn">目前 v' + TWB.esc(st.current_version) + '</span></div><div class="rel-bumps">' +
          ['patch', 'minor', 'major'].map(function (b) {
            return '<label class="rel-bump' + (rec === b ? ' on' : '') + '"><input type="radio" name="relBump" value="' + b + '"' + (rec === b ? ' checked' : '') +
              '> <strong>v' + TWB.esc(nv[b] || '') + '</strong><div class="sub">' + TWB.esc((st.bump_descriptions || {})[b] || '') + '</div></label>';
          }).join('') + '</div>' +
          '<input class="inp" id="relTitleInp" value="' + TWB.esc(st.suggested_title || '') + '" placeholder="版本標題">' +
          '<textarea class="inp" id="relHlInp" rows="3" placeholder="每行一條更新重點">' + TWB.esc((st.suggested_highlights || []).join('\n')) + '</textarea>' +
          '<div class="rel-actions"><button type="button" class="btn btn-primary" id="relPublishBtn">🚀 發布新版本並重新打包</button></div></div>';
      } else {
        html += '<div class="card ok-box">✅ 目前程式碼與最新發布版 <strong>v' + TWB.esc(st.current_version) + '</strong> 同步，沒有待發布的修改。</div>';
      }
    }
    html += '<h4 class="rel-h">📜 Release Notes 歷史版本紀錄</h4>' + (st.releases || []).map(function (r) {
      return '<div class="card rel-item"><div class="rel-top"><span class="chip info">v' + TWB.esc(r.version) + '</span> <strong>' + TWB.esc(r.title || '') +
        '</strong><span class="sub">' + TWB.esc(r.date || '') + '</span></div><ul>' +
        (r.highlights || []).map(function (h) { return '<li>' + TWB.esc(h) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    document.getElementById('relModalBody').innerHTML = html;
    var btn = document.getElementById('relPublishBtn');
    if (btn) {
      btn.onclick = function () {
        var picked = (document.querySelector('input[name="relBump"]:checked') || {}).value || 'patch';
        if (!publishArmed) { publishArmed = true; btn.textContent = '⚠️ 確定發布 v' + ((st.next_versions || {})[picked] || '') + '？再按一次確認'; return; }
        btn.disabled = true;
        btn.textContent = '⏳ 發布並打包中…';
        apiPost('/api/release_publish', {
          bump_type: picked, title: document.getElementById('relTitleInp').value,
          highlights: document.getElementById('relHlInp').value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean)
        }).then(function (next) {
          publishArmed = false;
          TWB.version = next.current_version;
          paintHeader();
          renderRelease(next);
          TWB.toast('🎉 已發布 v' + next.current_version);
        }, function (e) { publishArmed = false; btn.disabled = false; TWB.toast('⚠️ ' + e.message); });
      };
    }
  }
  TWB.openReleaseModal = openReleaseModal;

  // ------------------------------------------------------------------ live data (local server only)
  var metaTimer = 0, metaDue = false;
  function anyLive(m) {
    var lv = (m && m.live) || {};
    return Object.keys(lv).some(function (k) { return lv[k] > 0; });
  }
  function scheduleMeta() {
    clearTimeout(metaTimer);
    if (IS_STATIC || !TWB.meta) return;
    if (anyLive(TWB.meta) || (TWB.meta.sync && TWB.meta.sync.running)) { metaTimer = setTimeout(pollMeta, 60000); return; }
    // Idle: no polling — one wake-up at the next scheduled update (+45 s) or next tip-off (+3 min).
    var cands = [Date.parse(TWB.meta.next_update || '') + 45000];
    var nt = TWB.meta.next_tip || {};
    Object.keys(nt).forEach(function (k) { if (nt[k]) cands.push(Date.parse(nt[k]) + 180000); });
    var t = Math.min.apply(null, cands.filter(function (x) { return isFinite(x) && x > Date.now(); }));
    if (isFinite(t)) {
      var ms = t - Date.now();
      if (ms > 0 && ms < 12 * 3600 * 1000) metaTimer = setTimeout(pollMeta, ms);
    }
  }
  function pollMeta() {
    if (document.hidden) { metaDue = true; return; }
    metaDue = false;
    apiGet('/api/meta').then(function (m) {
      var changed = TWB.meta && m.updated_at && m.updated_at !== TWB.meta.updated_at;
      TWB.meta = m;
      if (changed) return loadSnapshot().then(function () { TWB.render(true); });
      renderUpdStrip();
    }).catch(function () { /* keep the current data */ }).then(scheduleMeta);
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && metaDue) pollMeta();
  });
  function loadSnapshot() {
    return apiGet('/api/snapshot').then(function (s) { TWB.snap = s; TWB.version = s.version || TWB.version; });
  }

  // ------------------------------------------------------------------ boot
  function boot() {
    document.getElementById('relModalClose').onclick = function () { document.getElementById('relModal').classList.add('hidden'); };
    document.getElementById('relModal').onclick = function (e) { if (e.target.id === 'relModal') e.target.classList.add('hidden'); };
    document.getElementById('verBadgeBtn').onclick = openReleaseModal;
    document.getElementById('verBadgeBtn').title = IS_STATIC ? '查看 Release Notes' : '查看版本紀錄與發布中心';
    document.querySelectorAll('#lgSwitch .lg-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        var lg = b.getAttribute('data-lg');
        if (lg !== TWB.league) TWB.setLeague(lg);
      });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') document.getElementById('relModal').classList.add('hidden');
    });
    window.addEventListener('hashchange', function () { requestAnimationFrame(function () { TWB.render(); }); });
    if (IS_STATIC) {
      TWB.meta = TWB.snap ? TWB.snap.meta : null;
      TWB.render();
      return;
    }
    Promise.all([apiGet('/api/meta').catch(function () { return null; }), loadSnapshot()]).then(function (r) {
      TWB.meta = r[0] || (TWB.snap && TWB.snap.meta);
      if (r[0] && r[0].version) TWB.version = r[0].version;
      TWB.render();
      scheduleMeta();
    }).catch(function (e) {
      document.getElementById('appMain').innerHTML = '<div class="empty-box">⚠️ 資料載入失敗：' + TWB.esc(e.message) + '</div>';
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
<script>/* js/page_home.js */
/* Page: 🏠 今日賽事＆賽前預測 (#/) + shared game card. */
(function () {
  'use strict';
  var T = window.TWB;
  var esc = T.esc;

  function recMap(L, season) {
    var m = {};
    ((L.standings || {})[season] || []).forEach(function (r) { m[r.team_id] = r.w + '-' + r.l; });
    return m;
  }

  function edge(a, b, higherBetter) {
    if (a === null || a === undefined || b === null || b === undefined || a === b) return ['', ''];
    var aBetter = higherBetter ? a > b : a < b;
    return aBetter ? ['edge', ''] : ['', 'edge'];
  }
  function restTxt(d, b2b) {
    if (d === null || d === undefined) return '季初首戰';
    return (b2b ? '<span class="b2b">背靠背</span>' : d + ' 天');
  }
  function factorTable(g, f) {
    if (!f || !f.elo) return '';
    var A = T.team(g.a).short, H = T.team(g.h).short;
    var e = edge(f.elo[0], f.elo[1], true);
    var r = edge(f.rest[0] === null ? 7 : f.rest[0], f.rest[1] === null ? 7 : f.rest[1], true);
    var pp = edge(f.ppg[0], f.ppg[1], true);
    var op = edge(f.opp[0], f.opp[1], false);
    function wins(s) { var m = /^(\d+)-(\d+)$/.exec(s || ''); return m ? Number(m[1]) - Number(m[2]) : null; }
    var l5 = edge(wins(f.last5[0]), wins(f.last5[1]), true);
    return '<table class="factors"><thead><tr><td class="muted">' + esc(A) + '（客）</td><th>關鍵因素</th><td class="muted">' + esc(H) + '（主）</td></tr></thead><tbody>' +
      '<tr><td class="' + e[0] + '">' + f.elo[0] + '</td><th data-tip="Elo 戰力分數：依每場勝負與分差累積，越高越強">Elo</th><td class="' + e[1] + '">' + f.elo[1] + '</td></tr>' +
      '<tr><td class="' + l5[0] + '">' + esc(f.last5[0]) + '</td><th>近 5 場</th><td class="' + l5[1] + '">' + esc(f.last5[1]) + '</td></tr>' +
      '<tr><td>' + esc(f.split[0]) + '</td><th>主客場</th><td>' + esc(f.split[1]) + '</td></tr>' +
      '<tr><td class="' + r[0] + '">' + restTxt(f.rest[0], f.b2b[0]) + '</td><th data-tip="距離上一場比賽的天數；前一天剛比賽＝背靠背">休息天數</th><td class="' + r[1] + '">' + restTxt(f.rest[1], f.b2b[1]) + '</td></tr>' +
      '<tr><td class="' + pp[0] + '">' + T.num(f.ppg[0]) + '</td><th data-tip="本季場均得分（反映節奏與進攻效率）">場均得分</th><td class="' + pp[1] + '">' + T.num(f.ppg[1]) + '</td></tr>' +
      '<tr><td class="' + op[0] + '">' + T.num(f.opp[0]) + '</td><th data-tip="本季場均失分（反映防守）">場均失分</th><td class="' + op[1] + '">' + T.num(f.opp[1]) + '</td></tr>' +
      '</tbody></table>';
  }
  T.factorTable = factorTable;

  function notes(g, p) {
    var f = p && p.f;
    if (!f || !f.elo) return [];
    var A = T.team(g.a).short, H = T.team(g.h).short, out = [];
    var de = f.elo[1] - f.elo[0];
    out.push(Math.abs(de) >= 15 ? 'Elo 差距 ' + Math.abs(de) + ' 分，' + (de > 0 ? H : A) + '帳面較強' : '兩隊 Elo 接近（差 ' + Math.abs(de) + ' 分），勝負較難預料');
    if (f.b2b[1]) out.push(H + '背靠背出賽（前一天剛比賽），模型略為扣分');
    if (f.b2b[0]) out.push(A + '背靠背出賽（前一天剛比賽），模型略為扣分');
    if (f.hca_pts) out.push('主場優勢約 +' + f.hca_pts + ' 分');
    if (f.gp && (f.gp[0] < 3 || f.gp[1] < 3)) out.push('本季已賽場數少，預測主要參考上季戰力，信心較低');
    return out.slice(0, 4);
  }

  /** Game card used on the home page and the team page. opts: {compact, rec} */
  T.gameCard = function (g, opts) {
    opts = opts || {};
    var L = T.L();
    var p = T.pred(g.id);
    var rec = opts.rec || recMap(L, g.s);
    var live = g.status === 'live', fin = T.isFinal(g);
    var hasScore = (live || fin) && g.hs !== null;
    var score = hasScore
      ? '<div class="gc-score"><span class="' + (g.as > g.hs ? 'w' : (fin ? 'l' : 'w')) + '">' + g.as + '</span> : <span class="' +
        (g.hs > g.as ? 'w' : (fin ? 'l' : 'w')) + '">' + g.hs + '</span></div>'
      : '<div class="gc-vs">VS</div>';
    var top = '<div class="gc-top"><span class="chip stage">' + esc(T.stageLabel(g.st)) + (g.c ? ' ' + esc(g.c) : '') + '</span>' +
      '<span>' + esc(T.dayLabel(g.d)) + ' ' + esc(g.t) + '</span>' + (g.v ? '<span>· ' + esc(g.v) + '</span>' : '') +
      '<span class="sp"></span>' + (p && !fin && p.conf ? T.confChip(p.conf) : '') + T.statusChip(g) + '</div>';
    var teams = '<div class="gc-teams"><div class="gc-side away">' + T.teamLink(g.a) +
      '<span class="gc-rec"><span class="ha">客</span> ' + esc(rec[g.a] || '') + '</span></div>' +
      '<div class="gc-mid">' + score + '</div>' +
      '<div class="gc-side home">' + T.teamLink(g.h) + '<span class="gc-rec">' + esc(rec[g.h] || '') + ' <span class="ha">主</span></span></div></div>';
    var body = '';
    if (g.st === 'pre') {
      body = '<div class="note-line">熱身賽不列入模型與戰績計算。</div>';
    } else if (p) {
      body += T.probBar(p.p, g);
      var favH = p.m >= 0;
      body += '<div class="gc-pred"><div><div class="k">預測比分</div><div class="v">' + T.num(p.ap) + ' : ' + T.num(p.hp) + '</div></div>' +
        '<div><div class="k">預測分差</div><div class="v">' + esc(T.team(favH ? g.h : g.a).short) + ' +' + T.num(Math.abs(p.m)) + '</div></div>' +
        '<div><div class="k">預測總得分</div><div class="v">' + T.num(p.tot) + '</div></div></div>';
      if (fin) {
        var gr = T.grade(g, p);
        if (gr) {
          body += '<div class="gc-grade"><span class="' + (gr.hit ? 'hit' : 'miss') + '">' + (gr.hit ? '✔ 命中勝方' : '✘ 未命中勝方') + '</span>' +
            '<span>實際分差 ' + esc(T.team(g.hs > g.as ? g.h : g.a).short) + ' +' + Math.abs(g.hs - g.as) + '（誤差 ' + T.num(gr.marginErr) + '）</span>' +
            '<span>實際總分 ' + (g.hs + g.as) + '（誤差 ' + T.num(gr.totalErr) + '）</span></div>';
        }
      }
      if (!opts.compact && !fin && p.f) {
        body += factorTable(g, p.f);
        var ns = notes(g, p);
        if (ns.length) body += '<ul class="gc-notes">' + ns.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
      }
    } else {
      body = '<div class="note-line">模型尚無這場的預測（兩隊歷史資料不足）。</div>';
    }
    var foot = '<div class="gc-foot"><span>' + (p ? esc(T.predKind(p)) + (p.at ? '（' + esc(T.whenTw(p.at)) + ' 更新）' : '') : '') +
      (fin && g.att ? ' · 觀眾 ' + Number(g.att).toLocaleString() + (g.cap ? ' / ' + Number(g.cap).toLocaleString() : '') : '') + '</span>' +
      '<a href="' + T.href('game/' + g.id) + '">比賽詳情 →</a></div>';
    return '<div class="gcard' + (live ? ' is-live' : '') + '">' + top + teams + body + foot + '</div>';
  };

  function otherHint(lg) {
    var o = lg === 'plg' ? 'tpbl' : 'plg';
    var L2 = T.L(o);
    if (!L2) return '';
    var today = T.today();
    var live = 0, cnt = 0, next = null;
    L2.games.forEach(function (g) {
      if (g.status === 'live') live++;
      if (g.d === today) cnt++;
      if (g.status === 'scheduled' && g.d > today && (!next || g.d < next)) next = g.d;
    });
    var label = live ? L2.name + ' 進行中 ' + live + ' 場' : (cnt ? L2.name + ' 今日 ' + cnt + ' 場' : (next ? L2.name + ' 下一個比賽日 ' + T.md(next) : L2.name));
    return '<button type="button" class="lg-hint" data-switch-lg="' + o + '"><span class="lg-dot" style="background:var(--' + o + ')"></span>' + esc(label) + ' →</button>';
  }

  function section(title, sub, cards) {
    if (!cards.length) return '';
    return '<div class="sec-hdr"><h2 class="sec-title sm">' + title + '</h2>' + (sub ? '<span class="sub">' + sub + '</span>' : '') + '</div>' +
      '<div class="games-grid">' + cards.join('') + '</div>';
  }

  T.pages.home = function (root, ctx) {
    var L = ctx.L;
    T.pageTitle = '今日賽事＆賽前預測';
    var today = T.today();
    var games = L.games.filter(function (g) { return g.st !== 'other'; });
    var live = games.filter(function (g) { return g.status === 'live'; });
    var todays = games.filter(function (g) { return g.d === today && g.status !== 'live'; });
    var remainingToday = todays.some(function (g) { return g.status === 'scheduled'; });
    var nextDate = null;
    games.forEach(function (g) { if (g.status === 'scheduled' && g.d > today && (!nextDate || g.d < nextDate)) nextDate = g.d; });
    var nextGames = nextDate && !remainingToday ? games.filter(function (g) { return g.d === nextDate && g.status === 'scheduled'; }) : [];
    var recentDate = null;
    games.forEach(function (g) { if (T.isFinal(g) && g.d < today && (!recentDate || g.d > recentDate)) recentDate = g.d; });
    var recent = recentDate ? games.filter(function (g) { return g.d === recentDate && T.isFinal(g); }) : [];
    var rec = recMap(L, L.current_season);

    var season = L.current_season;
    var seasonGames = games.filter(function (g) { return g.s === season && g.st !== 'pre'; });
    var graded = seasonGames.map(function (g) { return T.grade(g, T.pred(g.id)); }).filter(Boolean);
    var hits = graded.filter(function (x) { return x.hit; }).length;

    var html = '<div class="lg-hero"><h1>' + esc(L.name) + '</h1><span class="sub">' + esc(season || '') + ' 賽季</span><div class="hero-meta">' +
      (live.length ? '<span class="chip live"><i class="pulse"></i>進行中 ' + live.length + ' 場</span>' : '') +
      '<span class="chip">今日 ' + (live.length + todays.length) + ' 場</span>' +
      (nextDate ? '<span class="chip info">下一個比賽日 ' + esc(T.md(nextDate)) + '（' + esc(T.wd(nextDate)) + '）</span>' : '') +
      (graded.length ? '<span class="chip ok" data-tip="本季已完賽場次中，模型賽前看好的一方獲勝的比例（含回測與賽前凍結預測）">本季命中 ' + hits + '/' + graded.length + '</span>' : '') +
      '</div>' + otherHint(ctx.lg) + '</div>';
    if (L.banner) html += '<div class="banner">📢 ' + esc(L.banner) + '</div>';

    var body = '';
    body += section('🔴 進行中', '', live.map(function (g) { return T.gameCard(g, { rec: rec }); }));
    body += section('📅 今日賽事 · ' + esc(T.dayLabel(today)), '', todays.map(function (g) { return T.gameCard(g, { rec: rec }); }));
    if (nextGames.length) {
      body += section('📅 下一個比賽日 · ' + esc(T.dayLabel(nextDate)), '賽前預測會在每次更新時重算，開賽前最後一次更新的版本即凍結',
        nextGames.map(function (g) { return T.gameCard(g, { rec: rec }); }));
    }
    if (recent.length && recentDate !== today) {
      body += section('✅ 最近完賽 · ' + esc(T.dayLabel(recentDate)), '預測 vs 實際',
        recent.map(function (g) { return T.gameCard(g, { compact: true, rec: rec }); }));
    }
    if (!body) body = '<div class="empty-box">目前沒有排定的比賽。可到 <a href="' + T.href('schedule') + '">賽程比分</a> 查看過去賽季。</div>';
    html += body + '<div class="study-note">' + esc((T.snap.meta && T.snap.meta.study_note) || '本站為籃球數據研究與教學用途') + '</div>';
    root.innerHTML = html;
    root.querySelectorAll('[data-switch-lg]').forEach(function (b) {
      b.addEventListener('click', function () { T.setLeague(b.getAttribute('data-switch-lg')); });
    });
  };
})();

</script>
<script>/* js/page_schedule.js */
/* Page: 📅 賽程與比分 (#/schedule) — filters: season / stage / team / month / status. */
(function () {
  'use strict';
  var T = window.TWB;
  var esc = T.esc;
  var STATUS = [['', '全部狀態'], ['final', '已完賽'], ['live', '進行中'], ['scheduled', '未開賽'], ['other', '延賽／未進行']];

  function predCell(g) {
    var p = T.pred(g.id);
    if (g.st === 'pre' || !p) return '';
    var favH = p.p >= 0.5, prob = Math.round((favH ? p.p : 1 - p.p) * 100);
    var fav = T.team(favH ? g.h : g.a).short;
    if (T.isFinal(g)) {
      var gr = T.grade(g, p);
      return '<span class="' + (gr.hit ? 'hit' : 'miss') + '" data-tip="' + esc(T.predKind(p) + '：看好' + fav + ' ' + prob + '%') + '">' +
        (gr.hit ? '✔' : '✘') + '</span> <span class="muted">看好' + esc(fav) + ' ' + prob + '%</span>';
    }
    return '<span data-tip="' + esc(T.predKind(p)) + '">看好 <b>' + esc(fav) + '</b> ' + prob + '%</span>';
  }

  function row(g) {
    var fin = T.isFinal(g), live = g.status === 'live';
    var sc;
    if ((fin || live) && g.hs !== null) {
      sc = '<span class="' + (fin && g.as < g.hs ? 'l' : '') + '">' + g.as + '</span> : <span class="' + (fin && g.hs < g.as ? 'l' : '') + '">' + g.hs + '</span>';
    } else if (g.status === 'postponed') {
      sc = '<span class="chip warn">延賽</span>';
    } else if (g.status === 'cancelled') {
      sc = '<span class="chip muted" data-tip="系列賽已分出勝負，這場沒有進行">未進行</span>';
    } else {
      sc = '<span class="muted">VS</span>';
    }
    var stage = '<span class="chip stage">' + esc(T.stageLabel(g.st)) + '</span>' + (g.c ? ' <span class="muted small">' + esc(g.c) + '</span>' : '');
    return '<div class="srow"><span class="s-time">' + esc(g.t || '—') + '</span><span class="s-stage">' + stage +
      (live ? ' ' + T.statusChip(g) : '') + '</span>' +
      '<span class="s-match"><span class="away">' + T.teamLink(g.a) + '</span><a class="s-sc" href="' + T.href('game/' + g.id) + '">' + sc + '</a>' +
      '<span class="home">' + T.teamLink(g.h) + '</span></span>' +
      '<span class="s-venue" title="' + esc(g.v) + '">' + esc(g.v) + (fin && g.att ? ' · ' + Number(g.att).toLocaleString() + ' 人' : '') + '</span>' +
      '<span class="s-pred">' + predCell(g) + '</span></div>';
  }

  T.pages.schedule = function (root, ctx) {
    var L = ctx.L, q = ctx.query;
    T.pageTitle = '賽程與比分';
    var seasons = T.seasonOptions();
    var season = seasons.some(function (s) { return s.season === q.season; }) ? q.season : T.displaySeason();
    var all = T.games(season);
    var teams = {};
    all.forEach(function (g) { teams[g.h] = 1; teams[g.a] = 1; });
    var months = [];
    all.forEach(function (g) { var m = g.d.slice(0, 7); if (months.indexOf(m) < 0) months.push(m); });
    months.sort();
    var stages = [];
    all.forEach(function (g) { if (stages.indexOf(g.st) < 0) stages.push(g.st); });
    var order = ['pre', 'regular', 'playin', 'playoffs', 'finals', 'other'];
    stages.sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); });
    var month = q.month || '';
    if (!month) {
      var tm = T.today().slice(0, 7);
      month = months.indexOf(tm) >= 0 && season === L.current_season ? tm : 'all';
    }
    var team = teams[q.team] ? q.team : '';
    var status = q.status || '';
    var stage = stages.indexOf(q.stage) >= 0 ? q.stage : '';
    var list = all.filter(function (g) {
      if (month !== 'all' && g.d.slice(0, 7) !== month) return false;
      if (team && g.h !== team && g.a !== team) return false;
      if (stage && g.st !== stage) return false;
      if (status === 'other') return g.status === 'postponed' || g.status === 'cancelled';
      if (status && g.status !== status) return false;
      return true;
    });
    var fin = list.filter(T.isFinal);
    var graded = fin.map(function (g) { return T.grade(g, T.pred(g.id)); }).filter(Boolean);
    var hits = graded.filter(function (x) { return x.hit; }).length;

    var html = '<div class="sec-hdr"><div><h1 class="sec-title">📅 ' + esc(L.name) + ' 賽程與比分</h1>' +
      '<div class="sub">' + esc(season) + ' 賽季 · 共 ' + list.length + ' 場（已完賽 ' + fin.length + '）' +
      (graded.length ? ' · 模型命中 ' + hits + '/' + graded.length + '（' + Math.round(100 * hits / graded.length) + '%）' : '') + '</div></div></div>';
    html += '<div class="filters">' + T.seasonSelect(season) +
      '<select class="inp sel" id="stageSel" aria-label="賽事類型"><option value="">全部賽事</option>' + stages.map(function (s) {
        return '<option value="' + s + '"' + (s === stage ? ' selected' : '') + '>' + esc(T.stageLabel(s)) + '</option>';
      }).join('') + '</select>' +
      '<select class="inp sel" id="teamSel" aria-label="球隊"><option value="">全部球隊</option>' + Object.keys(teams).sort(function (a, b) {
        return T.team(a).short.localeCompare(T.team(b).short, 'zh-Hant');
      }).map(function (t) {
        return '<option value="' + esc(t) + '"' + (t === team ? ' selected' : '') + '>' + esc(T.team(t).short) + '</option>';
      }).join('') + '</select>' +
      '<select class="inp sel" id="monthSel" aria-label="月份"><option value="all"' + (month === 'all' ? ' selected' : '') + '>全部月份</option>' +
      months.map(function (m) { return '<option value="' + m + '"' + (m === month ? ' selected' : '') + '>' + m.slice(0, 4) + ' 年 ' + Number(m.slice(5)) + ' 月</option>'; }).join('') +
      '</select><select class="inp sel" id="statusSel" aria-label="狀態">' + STATUS.map(function (s) {
        return '<option value="' + s[0] + '"' + (s[0] === status ? ' selected' : '') + '>' + s[1] + '</option>';
      }).join('') + '</select></div>';
    if (!list.length) {
      html += '<div class="empty-box">沒有符合條件的比賽。</div>';
    } else {
      var byDay = {}, days = [];
      list.forEach(function (g) { if (!byDay[g.d]) { byDay[g.d] = []; days.push(g.d); } byDay[g.d].push(g); });
      html += days.map(function (d) {
        return '<div class="day-group"><div class="day-hdr">' + esc(T.dayLabel(d)) + '<span class="muted small">' + byDay[d].length + ' 場</span></div>' +
          byDay[d].map(row).join('') + '</div>';
      }).join('');
    }
    html += '<div class="note-line">✔／✘ 代表模型賽前看好的一方是否獲勝；預測種類（賽前凍結／回測）可把滑鼠移到符號上查看。</div>';
    root.innerHTML = html;
    ['stageSel', 'teamSel', 'monthSel', 'statusSel'].forEach(function (id) {
      var key = { stageSel: 'stage', teamSel: 'team', monthSel: 'month', statusSel: 'status' }[id];
      T.bindSelect(root, id, key);
    });
    var ss = root.querySelector('#seasonSel');
    if (ss) ss.addEventListener('change', function () { T.setQuery({ season: ss.value, month: '', team: '', stage: '' }); });
  };
})();

</script>
<script>/* js/page_standings.js */
/* Page: 🏆 戰績排行 (#/standings) — computed from regular-season results. */
(function () {
  'use strict';
  var T = window.TWB;
  var esc = T.esc;

  T.pages.standings = function (root, ctx) {
    var L = ctx.L, q = ctx.query;
    T.pageTitle = '戰績排行';
    var withReg = function (s) { return ((L.standings || {})[s.season] || []).length > 0; };
    var opts = T.seasonOptions(withReg);
    var season = opts.some(function (s) { return s.season === q.season; }) ? q.season : T.displaySeason();
    if (!opts.some(function (s) { return s.season === season; }) && opts.length) season = opts[0].season;
    var rows = (L.standings || {})[season] || [];
    var isCur = season === L.current_season;
    var html = '<div class="sec-hdr"><div><h1 class="sec-title">🏆 ' + esc(L.name) + ' 戰績排行</h1>' +
      '<div class="sub">' + esc(season) + ' 賽季例行賽 · 依勝率排序（同勝率依勝敗差、淨勝分）</div></div>' +
      '<div class="filters" style="margin:0">' + T.seasonSelect(season, withReg) + '</div></div>';
    if (!rows.length) {
      html += '<div class="empty-box">這個賽季還沒有例行賽戰績。</div>';
    } else {
      html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>排名</th><th class="left sticky">球隊</th><th>勝</th><th>敗</th><th>勝率</th>' +
        '<th>勝差</th><th>主場</th><th>客場</th><th>連勝敗</th><th>近 10 場</th><th>近 5 場</th><th>場均得分</th><th>場均失分</th><th>淨勝分</th>' +
        (isCur ? '<th data-tip="模型目前的 Elo 戰力分數">Elo</th>' : '') + '</tr></thead><tbody>' +
        rows.map(function (r) {
          var dots = (r.last5 || '').split('').map(function (x) { return '<i class="' + x + '"></i>'; }).join('');
          return '<tr><td><span class="rank-badge' + (r.rank === 1 ? ' top' : '') + '">' + r.rank + '</span></td>' +
            '<td class="left sticky">' + T.teamLink(r.team_id) + '</td><td><b>' + r.w + '</b></td><td>' + r.l + '</td>' +
            '<td><b>' + (r.gp ? (r.pct * 100).toFixed(1) + '%' : '—') + '</b></td><td>' + esc(r.gb) + '</td><td>' + esc(r.home) + '</td>' +
            '<td>' + esc(r.away) + '</td><td class="' + (/勝/.test(r.strk) ? 'pos' : 'neg') + '">' + esc(r.strk || '—') + '</td>' +
            '<td>' + esc(r.l10) + '</td><td><span class="dots">' + dots + '</span></td><td>' + T.num(r.ppg) + '</td><td>' + T.num(r.opp) + '</td>' +
            '<td class="' + ((r.diff || 0) >= 0 ? 'pos' : 'neg') + '"><b>' + T.signed(r.diff) + '</b></td>' +
            (isCur ? '<td>' + (r.elo || '—') + '</td>' : '') + '</tr>';
        }).join('') + '</tbody></table></div>';
      html += '<div class="note-line">戰績由本站依官方公布的每場比分計算；官方排名若另含對戰成績等規則，請以官方公告為準。季後挑戰賽、季後賽與總冠軍賽不列入。</div>';
    }
    root.innerHTML = html;
    T.bindSelect(root, 'seasonSel', 'season');
  };
})();

</script>
<script>/* js/page_teams.js */
/* Pages: 🛡️ 球隊數據 (#/teams) and 球隊詳情 (#/team/<id>). */
(function () {
  'use strict';
  var T = window.TWB;
  var esc = T.esc;

  function teamsInSeason(season) {
    var m = {};
    T.games(season).forEach(function (g) { if (g.st !== 'pre') { m[g.h] = 1; m[g.a] = 1; } });
    return Object.keys(m);
  }
  function standRow(L, season, tid) {
    return ((L.standings || {})[season] || []).filter(function (r) { return r.team_id === tid; })[0] || null;
  }
  function eloPoints(L, tid, season) {
    var h = ((L.model || {}).history || {})[tid] || [];
    var seasonGames = {};
    if (season) T.games(season).forEach(function (g) { seasonGames[g.d] = 1; });
    return h.filter(function (p) { return !season || seasonGames[p[0]]; });
  }
  function leagueAvg(stats, key) {
    var vals = Object.keys(stats || {}).map(function (k) { return stats[k][key]; }).filter(function (v) { return v !== null && v !== undefined; });
    return vals.length ? vals.reduce(function (a, b) { return a + b; }, 0) / vals.length : null;
  }

  // ------------------------------------------------------------------ list
  T.pages.teams = function (root, ctx) {
    var L = ctx.L, q = ctx.query;
    T.pageTitle = '球隊數據';
    var opts = T.seasonOptions(function (s) { return s.stages.indexOf('regular') >= 0; });
    var season = opts.some(function (s) { return s.season === q.season; }) ? q.season : T.displaySeason();
    var tids = teamsInSeason(season);
    var stats = (L.team_stats || {})[season] || {};
    var isCur = season === L.current_season;
    var elo = {};
    ((L.model || {}).ladder || []).forEach(function (x) { elo[x.team_id] = x.elo; });
    tids.sort(function (a, b) {
      var ra = standRow(L, season, a), rb = standRow(L, season, b);
      return (ra ? ra.rank : 99) - (rb ? rb.rank : 99);
    });
    var html = '<div class="sec-hdr"><div><h1 class="sec-title">🛡️ ' + esc(L.name) + ' 球隊數據</h1><div class="sub">' + esc(season) +
      ' 賽季 · ' + tids.length + ' 隊 · 點球隊看陣容、賽果與 Elo 走勢</div></div><div class="filters" style="margin:0">' +
      T.seasonSelect(season, function (s) { return s.stages.indexOf('regular') >= 0; }) + '</div></div><div class="team-grid">';
    html += tids.map(function (tid) {
      var t = T.team(tid), r = standRow(L, season, tid), s = stats[tid];
      var pts = eloPoints(L, tid, season);
      var dots = r ? (r.last5 || '').split('').map(function (x) { return '<i class="' + x + '"></i>'; }).join('') : '';
      return '<a class="card tcard" style="--tc:' + esc(t.color) + '" href="' + T.href('team/' + tid, { season: season }) + '">' +
        '<div class="tc-hd">' + T.logo(tid, 40) + '<div><div class="nm">' + esc(t.name) + '</div><div class="en">' + esc(t.en || '') + '</div></div></div>' +
        '<div class="chips">' + (r ? '<span class="chip info">第 ' + r.rank + ' 名 · ' + r.w + '-' + r.l + '</span>' : '') +
        (isCur && elo[tid] ? '<span class="chip">Elo ' + Math.round(elo[tid]) + '</span>' : '') +
        (r && r.strk ? '<span class="chip ' + (/勝/.test(r.strk) ? 'ok' : 'bad') + '">' + esc(r.strk) + '</span>' : '') + '<span class="dots">' + dots + '</span></div>' +
        '<div class="tc-stats"><div><div class="k">場均得分</div><div class="v">' + T.num(r && r.ppg) + '</div></div>' +
        '<div><div class="k">場均失分</div><div class="v">' + T.num(r && r.opp) + '</div></div>' +
        '<div><div class="k">淨勝分</div><div class="v ' + ((r && r.diff) >= 0 ? 'pos' : 'neg') + '">' + T.signed(r && r.diff) + '</div></div>' +
        (s ? '<div><div class="k">有效命中率</div><div class="v">' + T.num(s.efg) + '%</div></div><div><div class="k">節奏</div><div class="v">' + T.num(s.pace) +
          '</div></div><div><div class="k">攻守效率差</div><div class="v ' + ((s.net || 0) >= 0 ? 'pos' : 'neg') + '">' + T.signed(s.net) + '</div></div>' : '') +
        '</div>' + (pts.length > 1 ? '<div class="muted small">Elo 走勢 ' + T.sparkline(pts, { w: 220, h: 34, color: t.color }) + '</div>' : '') + '</a>';
    }).join('') + '</div>';
    if (!Object.keys(stats).length) html += '<div class="note-line">這個賽季沒有逐場數據（本站只保留最近兩季的逐場數據），因此只顯示得失分。</div>';
    root.innerHTML = html;
    T.bindSelect(root, 'seasonSel', 'season');
  };

  // ------------------------------------------------------------------ detail
  function ffRow(label, tip, mine, opp, avg, higherBetter) {
    var good = mine !== null && avg !== null ? (higherBetter ? mine >= avg : mine <= avg) : null;
    return '<tr><td class="left" data-tip="' + esc(tip) + '">' + label + '</td><td class="' + (good === null ? '' : (good ? 'pos' : 'neg')) + '"><b>' +
      T.num(mine) + '%</b></td><td>' + T.num(opp) + '%</td><td class="muted">' + T.num(avg) + '%</td></tr>';
  }

  T.pages.team = function (root, ctx) {
    var L = ctx.L, q = ctx.query;
    var tid = ctx.params[0];
    if (!tid || !L.teams[tid]) {
      root.innerHTML = '<div class="empty-box">找不到這支球隊（球隊編號只在同一個聯盟內有效）。<a href="' + T.href('teams') + '">回到球隊列表</a></div>';
      return;
    }
    var t = T.team(tid);
    T.pageTitle = t.name;
    var played = T.seasonOptions(function (s) {
      return T.games(s.season).some(function (g) { return g.h === tid || g.a === tid; });
    });
    var season = played.some(function (s) { return s.season === q.season; }) ? q.season :
      (played.some(function (s) { return s.season === T.displaySeason(); }) ? T.displaySeason() : (played[0] || {}).season);
    var r = standRow(L, season, tid);
    var s = ((L.team_stats || {})[season] || {})[tid];
    var stats = (L.team_stats || {})[season] || {};
    var isCur = season === L.current_season;
    var elo = null;
    ((L.model || {}).ladder || []).forEach(function (x) { if (x.team_id === tid) elo = x.elo; });

    var html = '<div class="card" style="border-top:4px solid ' + esc(t.color) + '"><div class="tc-hd team-hd">' + T.logo(tid, 56) +
      '<div style="flex:1;min-width:0"><div class="sec-title">' + esc(t.name) + '</div><div class="sub">' + esc([t.en, L.name].filter(Boolean).join(' · ')) + '</div></div>' +
      '<div class="filters" style="margin:0">' + T.seasonSelect(season, function (x) { return played.indexOf(x) >= 0; }) + '</div></div>' +
      '<div class="chips" style="margin-top:8px">' + (r ? '<span class="chip info">例行賽第 ' + r.rank + ' 名</span><span class="chip">' + r.w + ' 勝 ' + r.l +
        ' 敗（' + (r.pct * 100).toFixed(1) + '%）</span><span class="chip">主場 ' + esc(r.home) + '</span><span class="chip">客場 ' + esc(r.away) + '</span>' +
        (r.strk ? '<span class="chip ' + (/勝/.test(r.strk) ? 'ok' : 'bad') + '">' + esc(r.strk) + '</span>' : '') : '') +
      (isCur && elo ? '<span class="chip">Elo ' + Math.round(elo) + '</span>' : '') + '</div></div>';

    // KPIs + four factors
    html += '<div class="kpis" style="margin-top:12px">' +
      '<div class="card kpi"><div class="k">場均得分 / 失分</div><div class="v">' + T.num(r && r.ppg) + ' / ' + T.num(r && r.opp) + '</div><div class="d">淨勝分 ' + T.signed(r && r.diff) + '</div></div>' +
      '<div class="card kpi"><div class="k" data-tip="每場大約的進攻回合數（40 分鐘，延長賽未扣除）">節奏 Pace</div><div class="v">' + T.num(s && s.pace) + '</div><div class="d">聯盟平均 ' + T.num(leagueAvg(stats, 'pace')) + '</div></div>' +
      '<div class="card kpi"><div class="k" data-tip="每 100 回合得分">進攻效率 ORtg</div><div class="v">' + T.num(s && s.ortg) + '</div><div class="d">聯盟平均 ' + T.num(leagueAvg(stats, 'ortg')) + '</div></div>' +
      '<div class="card kpi"><div class="k" data-tip="每 100 回合失分（越低越好）">防守效率 DRtg</div><div class="v">' + T.num(s && s.drtg) + '</div><div class="d">攻守效率差 ' + T.signed(s && s.net) + '</div></div></div>';

    var hist = eloPoints(L, tid, null);
    html += '<div class="grid-2" style="margin-top:12px"><div class="card"><div class="sec-hdr" style="margin-top:0"><h2 class="sec-title sm">📐 Four Factors（四大致勝因素）</h2><span class="sub">本隊 vs 對手 vs 聯盟平均</span></div>' +
      (s ? '<table class="tbl"><thead><tr><th class="left">項目</th><th>本隊</th><th>對手</th><th>聯盟平均</th></tr></thead><tbody>' +
        ffRow('有效命中率 eFG%', '(命中 + 0.5×三分命中) ÷ 出手；越高越好', s.efg, s.o_efg, leagueAvg(stats, 'efg'), true) +
        ffRow('失誤率 TOV%', '失誤 ÷ (出手 + 0.44×罰球出手 + 失誤)；越低越好', s.tov_pct, s.o_tov_pct, leagueAvg(stats, 'tov_pct'), false) +
        ffRow('進攻籃板率 ORB%', '本隊進攻籃板 ÷ (本隊進攻籃板 + 對手防守籃板)；越高越好', s.orb_pct, s.drb_pct === null ? null : 100 - s.drb_pct, leagueAvg(stats, 'orb_pct'), true) +
        ffRow('罰球率 FT/FGA', '罰球命中 ÷ 投籃出手；越高越好', s.ftr, s.o_ftr, leagueAvg(stats, 'ftr'), true) + '</tbody></table>' +
        '<div class="note-line">三分 ' + T.num(s.tp) + '%（場均出手 ' + T.num(s.tpa) + '）· 罰球 ' + T.num(s.ft) + '% · 場均籃板 ' + T.num(s.reb) + ' · 助攻 ' + T.num(s.ast) + ' · 失誤 ' + T.num(s.tov) + '</div>'
        : '<div class="muted">這個賽季沒有逐場數據（本站只保留最近兩季）。</div>') + '</div>' +
      '<div class="card"><div class="sec-hdr" style="margin-top:0"><h2 class="sec-title sm">📈 Elo 走勢</h2><span class="sub">最近兩季，虛線＝1500 聯盟平均</span></div>' +
      T.lineChart([{ name: t.short, color: t.color, points: hist, bold: true }], { w: 560, h: 200 }) + '</div></div>';

    // results + upcoming
    var games = T.games(season).filter(function (g) { return g.h === tid || g.a === tid; });
    var done = games.filter(T.isFinal).reverse();
    var upcoming = games.filter(function (g) { return g.status === 'scheduled' || g.status === 'live'; }).slice(0, 4);
    if (upcoming.length) {
      html += '<div class="sec-hdr"><h2 class="sec-title sm">🗓️ 接下來的比賽</h2></div><div class="games-grid">' +
        upcoming.map(function (g) { return T.gameCard(g, { compact: true }); }).join('') + '</div>';
    }
    html += '<div class="sec-hdr"><h2 class="sec-title sm">📋 賽果（' + done.length + ' 場）</h2><span class="sub">✔／✘＝模型賽前看好的一方是否獲勝</span></div>';
    if (done.length) {
      html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>日期</th><th>賽事</th><th class="left">對手</th><th>比分</th><th>勝負</th><th>模型</th><th></th></tr></thead><tbody>' +
        done.map(function (g) {
          var home = g.h === tid, my = home ? g.hs : g.as, op = home ? g.as : g.hs, won = my > op;
          var gr = T.grade(g, T.pred(g.id));
          return '<tr><td>' + esc(T.md(g.d)) + '</td><td><span class="chip stage">' + esc(T.stageLabel(g.st)) + '</span></td><td class="left">' +
            (home ? 'vs ' : '@ ') + T.teamLink(home ? g.a : g.h) + '</td><td><b>' + my + ' : ' + op + '</b></td><td class="' + (won ? 'pos' : 'neg') + '"><b>' + (won ? '勝' : '敗') + '</b></td>' +
            '<td>' + (gr ? '<span class="' + (gr.hit ? 'hit' : 'miss') + '">' + (gr.hit ? '✔' : '✘') + '</span>' : (g.st === 'pre' ? '<span class="muted">熱身</span>' : '—')) + '</td>' +
            '<td><a href="' + T.href('game/' + g.id) + '">詳情</a></td></tr>';
        }).join('') + '</tbody></table></div>';
    } else {
      html += '<div class="empty-box">這個賽季還沒有完賽紀錄。</div>';
    }

    // roster
    var roster = T.playerRows(season).filter(function (p) { return p.team_id === tid; }).sort(function (a, b) { return b.pts_g - a.pts_g; });
    html += '<div class="sec-hdr"><h2 class="sec-title sm">👥 陣容與球員數據（例行賽場均）</h2><span class="sub">依場均得分排序</span></div>';
    if (roster.length) {
      html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="left sticky">球員</th><th>背號</th><th>出賽</th><th>先發</th><th>時間</th><th>得分</th><th>籃板</th>' +
        '<th>助攻</th><th>抄截</th><th>阻攻</th><th>失誤</th><th>命中率</th><th>三分%</th><th>罰球%</th><th data-tip="真實命中率：把三分與罰球都算進去的得分效率">TS%</th><th data-tip="效率值 EFF">效率</th></tr></thead><tbody>' +
        roster.map(function (p) {
          return '<tr><td class="left sticky"><b>' + esc(p.name) + '</b>' + (p.pos ? ' <span class="muted small">' + esc(p.pos) + '</span>' : '') + '</td><td>' + esc(p.number) +
            '</td><td>' + p.gp + '</td><td>' + p.gs + '</td><td>' + T.num(p.min) + '</td><td class="on">' + T.num(p.pts_g) + '</td><td>' + T.num(p.reb_g) + '</td><td>' + T.num(p.ast_g) +
            '</td><td>' + T.num(p.stl_g) + '</td><td>' + T.num(p.blk_g) + '</td><td>' + T.num(p.tov_g) + '</td><td>' + T.num(p.fg) + '</td><td>' + T.num(p.tp) + '</td><td>' + T.num(p.ft) +
            '</td><td>' + T.num(p.ts) + '</td><td>' + T.num(p.eff_g) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    } else {
      html += '<div class="empty-box">' + (s ? '這個賽季還沒有例行賽逐場數據。' : '這個賽季沒有逐場數據（本站只保留最近兩季）。') + '</div>';
    }
    root.innerHTML = html;
    T.bindSelect(root, 'seasonSel', 'season');
  };
})();

</script>
<script>/* js/page_players.js */
/* Page: ⛹️ 球員排行 (#/players) — leaders + sortable per-game table (regular season, from box scores). */
(function () {
  'use strict';
  var T = window.TWB;
  var esc = T.esc;
  var COLS = [
    ['gp', '出賽', 0], ['min', '時間', 1], ['pts_g', '得分', 1], ['reb_g', '籃板', 1], ['ast_g', '助攻', 1], ['stl_g', '抄截', 1],
    ['blk_g', '阻攻', 1], ['tov_g', '失誤', 1], ['fg', '命中率', 1], ['tp', '三分%', 1], ['ft', '罰球%', 1], ['ts', 'TS%', 1],
    ['efg', 'eFG%', 1], ['eff_g', '效率', 1], ['pm_g', '+/-', 1]
  ];
  var TIPS = { ts: '真實命中率：得分 ÷ (2 × (投籃出手 + 0.44 × 罰球出手))', efg: '有效命中率：(命中 + 0.5 × 三分命中) ÷ 出手',
    eff_g: '效率值 EFF = 得分 + 籃板 + 助攻 + 抄截 + 阻攻 − 投籃不進 − 罰球不進 − 失誤（場均）', pm_g: '場上正負值（場均）' };
  var LEADERS = [
    ['pts_g', '🏀 得分', ''], ['reb_g', '🧱 籃板', ''], ['ast_g', '🎯 助攻', ''], ['stl_g', '🖐️ 抄截', ''], ['blk_g', '⛔ 阻攻', ''],
    ['fg', '✅ 投籃命中率', '%'], ['tp', '🎯 三分命中率', '%'], ['ts', '💧 真實命中率 TS%', '%'], ['eff_g', '⚡ 效率值', '']
  ];

  function qualifies(p, key, minGp) {
    if (p.gp < minGp) return false;
    if (key === 'fg') return p.fga_g >= 5;
    if (key === 'tp') return p.tpa_g >= 2;
    if (key === 'ft') return p.fta_g >= 1.5;
    if (key === 'ts' || key === 'efg') return p.fga_g >= 5;
    return true;
  }

  T.pages.players = function (root, ctx) {
    var L = ctx.L, q = ctx.query;
    T.pageTitle = '球員排行';
    var bs = L.box_seasons || [];
    var opts = T.seasonOptions(function (s) { return bs.indexOf(s.season) >= 0 && ((L.players || {})[s.season] || []).length > 0; });
    var season = opts.some(function (s) { return s.season === q.season; }) ? q.season :
      (opts.some(function (s) { return s.season === T.displaySeason(); }) ? T.displaySeason() : (opts[0] || {}).season);
    var all = season ? T.playerRows(season) : [];
    var teamIds = {};
    all.forEach(function (p) { teamIds[p.team_id] = 1; });
    var team = teamIds[q.team] ? q.team : '';
    var maxGp = all.reduce(function (m, p) { return Math.max(m, p.gp); }, 0);
    var minGp = Math.max(1, Math.round(maxGp * 0.4));
    var list = all.filter(function (p) { return !team || p.team_id === team; });
    var sort = COLS.some(function (c) { return c[0] === q.sort; }) ? q.sort : 'pts_g';
    var pctKey = ['fg', 'tp', 'ft', 'ts', 'efg'].indexOf(sort) >= 0;

    var html = '<div class="sec-hdr"><div><h1 class="sec-title">⛹️ ' + esc(L.name) + ' 球員排行</h1><div class="sub">' + esc(season || '—') +
      ' 賽季例行賽 · 依逐場數據統計 · 排行門檻：出賽 ≥ ' + minGp + ' 場（命中率另需場均出手 ≥ 5，三分 ≥ 2）</div></div></div>';
    if (!all.length) {
      root.innerHTML = html + '<div class="empty-box">目前沒有球員逐場數據（本站只保留最近兩季，賽季剛開打時資料較少）。</div>';
      return;
    }
    if (season === L.current_season && maxGp < 5) {
      html += '<div class="banner">📢 ' + esc(season) + ' 賽季才剛開打（最多 ' + maxGp + ' 場），排行波動大；可切換到上一季參考完整數據。</div>';
    }
    html += '<div class="filters">' + T.seasonSelect(season, function (s) { return opts.indexOf(s) >= 0; }) +
      '<select class="inp sel" id="teamSel" aria-label="球隊"><option value="">全部球隊</option>' + Object.keys(teamIds).sort(function (a, b) {
        return T.team(a).short.localeCompare(T.team(b).short, 'zh-Hant');
      }).map(function (t) { return '<option value="' + esc(t) + '"' + (t === team ? ' selected' : '') + '>' + esc(T.team(t).short) + '</option>'; }).join('') +
      '</select><input class="inp" id="plSearch" type="search" placeholder="搜尋球員姓名" autocomplete="off" style="width:160px"></div>';

    // leader cards
    html += '<div class="grid-3">' + LEADERS.map(function (ld) {
      var key = ld[0];
      var top = list.filter(function (p) { return qualifies(p, key, minGp) && p[key] !== null; })
        .sort(function (a, b) { return b[key] - a[key]; }).slice(0, 5);
      return '<div class="card"><div class="sec-hdr" style="margin:0 0 6px"><h3 class="sec-title sm">' + ld[1] + '</h3>' +
        '<a class="small" href="' + T.href('players', { season: season, team: team, sort: key }) + '">完整排行</a></div>' +
        (top.length ? top.map(function (p, i) {
          return '<div class="bar-row" style="grid-template-columns:22px minmax(0,1fr) 58px"><span class="rank-badge' + (i === 0 ? ' top' : '') + '">' + (i + 1) + '</span>' +
            '<span class="tm-nm"><b>' + esc(p.name) + '</b> <span class="muted small">' + esc(T.team(p.team_id).short) + '</span></span>' +
            '<b class="num" style="text-align:right">' + T.num(p[key]) + ld[2] + '</b></div>';
        }).join('') : '<div class="muted small">尚無符合門檻的球員</div>') + '</div>';
    }).join('') + '</div>';

    // table
    var rows = list.filter(function (p) { return !pctKey || qualifies(p, sort, minGp); })
      .sort(function (a, b) { return (b[sort] === null ? -1e9 : b[sort]) - (a[sort] === null ? -1e9 : a[sort]); });
    var showAll = q.all === '1';
    html += '<div class="sec-hdr"><h2 class="sec-title sm">📊 完整數據（場均）</h2><span class="sub">點欄位標題排序' +
      (pctKey ? '；命中率排序只列出達出手門檻的球員' : '') + '</span></div>';
    html += '<div class="tbl-wrap"><table class="tbl" id="plTable"><thead><tr><th>#</th><th class="left sticky">球員</th><th class="left">球隊</th>' +
      COLS.map(function (c) {
        return '<th class="sortable' + (c[0] === sort ? ' on' : '') + '" data-sort="' + c[0] + '"' + (TIPS[c[0]] ? ' data-tip="' + esc(TIPS[c[0]]) + '"' : '') + '>' + c[1] + '</th>';
      }).join('') + '</tr></thead><tbody>' +
      rows.map(function (p, i) {
        var more = !showAll && i >= 60;
        return '<tr data-name="' + esc(p.name) + '"' + (more ? ' data-more="1" style="display:none"' : '') + '><td>' + (i + 1) + '</td><td class="left sticky"><b>' + esc(p.name) + '</b>' + (p.number ? ' <span class="muted small">#' + esc(p.number) + '</span>' : '') +
          '</td><td class="left">' + T.teamLink(p.team_id, { size: 18 }) + '</td>' +
          COLS.map(function (c) {
            var v = p[c[0]];
            var txt = c[0] === 'pm_g' ? T.signed(v) : (c[2] === 0 ? String(v) : T.num(v));
            return '<td class="' + (c[0] === sort ? 'on' : '') + '">' + txt + '</td>';
          }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
    if (!showAll && rows.length > 60) {
      html += '<div style="text-align:center;margin-top:10px"><a class="btn btn-sm" href="' + T.href('players', { season: season, team: team, sort: sort, all: 1 }) +
        '">顯示全部 ' + rows.length + ' 位球員</a></div>';
    }
    html += '<div class="note-line">官方資料未提供球員國籍／身分欄位，因此本站不區分本土與洋將。</div>';
    root.innerHTML = html;
    T.bindSelect(root, 'teamSel', 'team');
    var ss = root.querySelector('#seasonSel');
    if (ss) ss.addEventListener('change', function () { T.setQuery({ season: ss.value, team: '', all: '' }); });
    var table = root.querySelector('#plTable');
    table.tHead.addEventListener('click', function (ev) {
      var th = ev.target.closest('th[data-sort]');
      if (th) T.setQuery({ sort: th.getAttribute('data-sort') });
    });
    var search = root.querySelector('#plSearch');
    if (search) {
      var trs = Array.prototype.slice.call(table.tBodies[0].rows), raf = 0;
      var apply = function () {
        raf = 0;
        var k = search.value.trim();
        trs.forEach(function (tr) {
          var match = (tr.getAttribute('data-name') || '').indexOf(k) >= 0;
          var d = k ? (match ? '' : 'none') : (tr.getAttribute('data-more') ? 'none' : '');
          if (tr.style.display !== d) tr.style.display = d;
        });
      };
      search.addEventListener('input', function () { if (!raf) raf = requestAnimationFrame(apply); });
      search.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && !T.isEnterSend(ev)) ev.preventDefault(); });
    }
  };
})();

</script>
<script>/* js/page_game.js */
/* Page: 🏟️ 比賽詳情 (#/game/<id>) — quarters, box score, team comparison, frozen prediction vs result. */
(function () {
  'use strict';
  var T = window.TWB;
  var esc = T.esc;

  function rowsToObj(rows, fields) {
    return (rows || []).map(function (r) { var o = {}; fields.forEach(function (f, i) { o[f] = r[i]; }); return o; });
  }
  function poss(t, o) {
    return ((t.fga + 0.44 * t.fta - t.oreb + t.tov) + (o.fga + 0.44 * o.fta - o.oreb + o.tov)) / 2;
  }

  function quarterTable(g) {
    if (!g.q || !g.q.length) return '';
    var heads = g.q.map(function (_, i) { return i < 4 ? 'Q' + (i + 1) : 'OT' + (i - 3); });
    var line = function (tid, idx, total) {
      return '<tr><td class="left">' + T.teamLink(tid) + '</td>' + g.q.map(function (q) { return '<td>' + q[idx] + '</td>'; }).join('') +
        '<td><b>' + (total === null ? '—' : total) + '</b></td></tr>';
    };
    return '<div class="tbl-wrap" style="margin-top:12px"><table class="tbl qtbl"><thead><tr><th class="left">球隊</th>' +
      heads.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '<th>總分</th></tr></thead><tbody>' +
      line(g.a, 0, g.as) + line(g.h, 1, g.hs) + '</tbody></table></div>';
  }

  function compare(g, ta, th) {
    var pa = poss(ta, th), ph = pa;
    var items = [
      ['投籃命中率', T.pct(ta.fgm, ta.fga), T.pct(th.fgm, th.fga), ta.fga ? ta.fgm / ta.fga : 0, th.fga ? th.fgm / th.fga : 0],
      ['三分命中率', T.pct(ta.tpm, ta.tpa), T.pct(th.tpm, th.tpa), ta.tpa ? ta.tpm / ta.tpa : 0, th.tpa ? th.tpm / th.tpa : 0],
      ['罰球命中率', T.pct(ta.ftm, ta.fta), T.pct(th.ftm, th.fta), ta.fta ? ta.ftm / ta.fta : 0, th.fta ? th.ftm / th.fta : 0],
      ['有效命中率', T.pct(ta.fgm + 0.5 * ta.tpm, ta.fga), T.pct(th.fgm + 0.5 * th.tpm, th.fga), ta.fga ? (ta.fgm + 0.5 * ta.tpm) / ta.fga : 0, th.fga ? (th.fgm + 0.5 * th.tpm) / th.fga : 0],
      ['籃板', ta.reb, th.reb, ta.reb, th.reb], ['進攻籃板', ta.oreb, th.oreb, ta.oreb, th.oreb], ['助攻', ta.ast, th.ast, ta.ast, th.ast],
      ['抄截', ta.stl, th.stl, ta.stl, th.stl], ['阻攻', ta.blk, th.blk, ta.blk, th.blk], ['失誤', ta.tov, th.tov, ta.tov, th.tov],
      ['每百回合得分', T.num(100 * ta.pts / pa), T.num(100 * th.pts / ph), ta.pts, th.pts]
    ];
    var ca = T.team(g.a).color, ch = T.team(g.h).color;
    return '<div class="card"><div class="sec-hdr" style="margin-top:0"><h2 class="sec-title sm">⚖️ 兩隊數據對比</h2><span class="sub">估計回合數 ' + T.num(pa) +
      '</span></div>' + items.map(function (it) {
        var tot = (it[3] + it[4]) || 1;
        return '<div class="cmp-row"><span class="va">' + it[1] + '</span><div class="cmp-bar away"><i style="width:' + (100 * it[3] / tot).toFixed(1) +
          '%;background:' + esc(ca) + '"></i></div><span class="lbl">' + it[0] + '</span><div class="cmp-bar"><i style="width:' + (100 * it[4] / tot).toFixed(1) +
          '%;background:' + esc(ch) + '"></i></div><span class="vh">' + it[2] + '</span></div>';
      }).join('') + '</div>';
  }

  function boxTable(tid, players, tot) {
    var starters = players.filter(function (p) { return p.starter; });
    var bench = players.filter(function (p) { return !p.starter; });
    var line = function (p) {
      return '<tr><td class="left sticky"><b>' + esc(p.name) + '</b>' + (p.number ? ' <span class="muted small">#' + esc(p.number) + '</span>' : '') +
        (p.pos ? ' <span class="muted small">' + esc(p.pos) + '</span>' : '') + '</td><td>' + T.fmtMin(p.sec) + '</td><td class="on">' + p.pts + '</td>' +
        '<td>' + p.fgm + '-' + p.fga + '</td><td>' + p.tpm + '-' + p.tpa + '</td><td>' + p.ftm + '-' + p.fta + '</td><td>' + p.oreb + '</td><td>' + p.dreb +
        '</td><td>' + p.reb + '</td><td>' + p.ast + '</td><td>' + p.stl + '</td><td>' + p.blk + '</td><td>' + p.tov + '</td><td>' + p.pf + '</td><td class="' +
        ((p.pm || 0) >= 0 ? 'pos' : 'neg') + '">' + (p.pm === null || p.pm === undefined ? '—' : T.signed(p.pm, 0)) + '</td></tr>';
    };
    var sep = function (t) { return '<tr class="sep"><td colspan="15">' + t + '</td></tr>'; };
    return '<div class="card"><div class="sec-hdr" style="margin-top:0"><h2 class="sec-title sm">' + T.teamLink(tid, { full: true }) + '</h2></div>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="left sticky">球員</th><th>時間</th><th>得分</th><th>投籃</th><th>三分</th><th>罰球</th>' +
      '<th>進攻板</th><th>防守板</th><th>籃板</th><th>助攻</th><th>抄截</th><th>阻攻</th><th>失誤</th><th>犯規</th><th>+/-</th></tr></thead><tbody>' +
      (starters.length ? sep('先發') + starters.map(line).join('') : '') + (bench.length ? sep('替補') + bench.map(line).join('') : '') +
      (tot ? '<tr class="tot"><td class="left sticky">全隊</td><td></td><td>' + tot.pts + '</td><td>' + tot.fgm + '-' + tot.fga + '</td><td>' + tot.tpm + '-' + tot.tpa +
        '</td><td>' + tot.ftm + '-' + tot.fta + '</td><td>' + tot.oreb + '</td><td>' + tot.dreb + '</td><td>' + tot.reb + '</td><td>' + tot.ast + '</td><td>' + tot.stl +
        '</td><td>' + tot.blk + '</td><td>' + tot.tov + '</td><td>' + tot.pf + '</td><td></td></tr>' : '') + '</tbody></table></div></div>';
  }

  T.pages.game = function (root, ctx) {
    var L = ctx.L;
    var g = T.game(ctx.params[0]);
    if (!g) {
      root.innerHTML = '<div class="empty-box">找不到這場比賽（比賽編號只在同一個聯盟內有效）。<a href="' + T.href('schedule') + '">回到賽程</a></div>';
      return;
    }
    var A = T.team(g.a), H = T.team(g.h);
    T.pageTitle = A.short + ' vs ' + H.short;
    var p = T.pred(g.id);
    var fin = T.isFinal(g), live = g.status === 'live';
    var html = '<div class="card"><div class="gc-top" style="margin-bottom:10px"><span class="chip stage">' + esc(T.stageLabel(g.st)) + (g.c ? ' ' + esc(g.c) : '') +
      '</span><span>' + esc(g.s) + ' 賽季</span><span>· ' + esc(T.dayLabel(g.d)) + ' ' + esc(g.t) + '</span>' + (g.v ? '<span>· ' + esc(g.v) + '</span>' : '') +
      (g.att ? '<span>· 觀眾 ' + Number(g.att).toLocaleString() + (g.cap ? ' / ' + Number(g.cap).toLocaleString() : '') + '</span>' : '') +
      '<span class="sp"></span>' + T.statusChip(g) + '</div>' +
      '<div class="gp-hero"><a class="gp-team" href="' + T.href('team/' + g.a) + '">' + T.logo(g.a, 56) + '<span class="nm">' + esc(A.name) + '</span><span class="ha">客隊</span></a>' +
      '<div class="gp-score">' + ((fin || live) && g.hs !== null ? '<span class="' + (fin && g.as < g.hs ? 'muted' : '') + '">' + g.as + '</span> : <span class="' +
        (fin && g.hs < g.as ? 'muted' : '') + '">' + g.hs + '</span>' : '<span class="gc-vs">VS</span>') + '</div>' +
      '<a class="gp-team" href="' + T.href('team/' + g.h) + '">' + T.logo(g.h, 56) + '<span class="nm">' + esc(H.name) + '</span><span class="ha">主隊</span></a></div>' +
      quarterTable(g) + '</div>';

    // prediction vs result
    if (g.st !== 'pre' && p) {
      var gr = T.grade(g, p);
      var favH = p.m >= 0;
      html += '<div class="card"><div class="sec-hdr" style="margin-top:0"><h2 class="sec-title sm">🔮 ' + esc(T.predKind(p)) + (fin ? ' vs 實際結果' : '') + '</h2>' +
        (p.at ? '<span class="sub">預測時間 ' + esc(T.whenTw(p.at)) + '</span>' : '') + '</div>' + T.probBar(p.p, g) +
        '<div class="gc-pred" style="margin-top:8px"><div><div class="k">預測比分（客：主）</div><div class="v">' + T.num(p.ap) + ' : ' + T.num(p.hp) + '</div></div>' +
        '<div><div class="k">預測分差</div><div class="v">' + esc(T.team(favH ? g.h : g.a).short) + ' +' + T.num(Math.abs(p.m)) + '</div></div>' +
        '<div><div class="k">預測總得分</div><div class="v">' + T.num(p.tot) + '</div></div></div>' +
        (gr ? '<div class="gc-grade" style="margin-top:8px"><span class="' + (gr.hit ? 'hit' : 'miss') + '">' + (gr.hit ? '✔ 命中勝方' : '✘ 未命中勝方') + '</span>' +
          '<span>實際比分 ' + g.as + ' : ' + g.hs + '</span><span>分差誤差 ' + T.num(gr.marginErr) + '</span><span>總分誤差 ' + T.num(gr.totalErr) + '</span></div>' : '') +
        (p.f ? '<div style="margin-top:10px">' + T.factorTable(g, p.f) + '</div>' : '') +
        (p.kind === 'backtest' ? '<div class="note-line">這是用「比賽前已知的資料」逐場往前推算的回測預測，不是當時即時發布的版本。</div>' : '') + '</div>';
    } else if (g.st === 'pre') {
      html += '<div class="card note-line">熱身賽不列入模型與戰績計算。</div>';
    }

    // box score
    var box = (L.box || {})[g.id];
    var F = (T.snap.meta && T.snap.meta.box_fields) || {};
    if (box && box.t && box.t.length === 2) {
      var teams = rowsToObj(box.t, F.team || []);
      var players = rowsToObj(box.p, F.player || []);
      var ta = teams.filter(function (t) { return t.team_id === g.a; })[0];
      var th = teams.filter(function (t) { return t.team_id === g.h; })[0];
      if (ta && th) html += compare(g, ta, th);
      html += boxTable(g.a, players.filter(function (x) { return x.team_id === g.a; }), ta) +
        boxTable(g.h, players.filter(function (x) { return x.team_id === g.h; }), th);
    } else if (fin) {
      html += '<div class="card note-line">' + ((L.box_seasons || []).indexOf(g.s) >= 0 ? '這場比賽的逐場數據還沒抓到，下次更新會補上。' :
        '本站只保留最近兩季的逐場數據，較早的比賽只有比分。') + '</div>';
    } else if (live) {
      html += '<div class="card note-line">比賽進行中，逐場數據會在完賽後更新；即時比分每 2 分鐘更新（本機版）。</div>';
    }
    html += '<div style="margin-top:12px"><a href="' + T.href('schedule', { season: g.s }) + '">← 回到 ' + esc(g.s) + ' 賽程</a></div>';
    root.innerHTML = html;
  };
})();

</script>
<script>/* js/page_model.js */
/* Page: 🧠 模型準確率與檢討 (#/model) — per league, never mixed. */
(function () {
  'use strict';
  var T = window.TWB;
  var esc = T.esc;

  function pctTxt(x) { return x === null || x === undefined ? '—' : (100 * x).toFixed(1) + '%'; }
  function kpi(label, val, desc, tip) {
    return '<div class="card kpi"><div class="k"' + (tip ? ' data-tip="' + esc(tip) + '"' : '') + '>' + label + '</div><div class="v">' + val + '</div><div class="d">' + desc + '</div></div>';
  }
  function mini(title, m, note) {
    if (!m || !m.n) return '<div class="card"><h3 class="sec-title sm">' + title + '</h3><div class="muted small" style="margin-top:6px">' + note + '</div></div>';
    return '<div class="card"><h3 class="sec-title sm">' + title + '</h3><div class="chips" style="margin-top:8px"><span class="chip info">' + m.n + ' 場</span>' +
      '<span class="chip ok">命中率 ' + pctTxt(m.hit) + '</span><span class="chip">Brier ' + T.num(m.brier, 3) + '</span><span class="chip">分差誤差 ' + T.num(m.mae_margin) +
      '</span><span class="chip">總分誤差 ' + T.num(m.mae_total) + '</span></div><div class="note-line">' + note + '</div></div>';
  }

  T.pages.model = function (root, ctx) {
    var L = ctx.L;
    T.pageTitle = '模型準確率與檢討';
    var M = L.model || {};
    var m = M.metrics_all || {};
    var P = M.params || {};
    var evalS = (M.eval_seasons || []).join('、');
    var html = '<div class="sec-hdr"><div><h1 class="sec-title">🧠 ' + esc(L.name) + ' 模型準確率與檢討</h1><div class="sub">只用 ' + esc(L.name) +
      ' 自己的比賽訓練與評估 · 模型版本 ' + esc(M.model_version || '—') + (M.run_at ? ' · 計算於 ' + esc(T.whenTw(M.run_at)) : '') + '</div></div></div>';
    if (!m.n) {
      root.innerHTML = html + '<div class="empty-box">已完賽場次還不夠，暫時無法評估模型。</div>';
      return;
    }
    html += '<div class="kpis">' +
      kpi('勝方命中率', pctTxt(m.hit), '對照「永遠猜主隊」' + pctTxt(m.home_base) + ' · ' + m.n + ' 場', '模型賽前看好的一方最後獲勝的比例') +
      kpi('Brier 分數', T.num(m.brier, 3), '越低越好；亂猜 50% = 0.250', '機率預測的平均平方誤差，衡量勝率給得準不準') +
      kpi('分差平均誤差', T.num(m.mae_margin) + ' 分', '預測分差與實際分差的平均差距', 'MAE：|預測分差 − 實際分差| 的平均') +
      kpi('總分平均誤差', T.num(m.mae_total) + ' 分', '預測總得分與實際總分的平均差距', 'MAE：|預測總分 − 實際總分| 的平均') + '</div>' +
      '<div class="note-line">回測區間：' + esc(evalS || '—') + '（第一個賽季只用來建立 Elo 起始戰力，不計分）。每場都只用「開賽前已知」的資料預測，沒有偷看結果。</div>';
    html += '<div class="grid-2" style="margin-top:12px">' +
      mini('📅 本季（' + esc(M.current_season || '') + '）', M.metrics_current, '本季已完賽場次的回測／凍結預測表現；季初樣本少，波動大。') +
      mini('🧊 賽前凍結預測（真正的未來預測）', M.metrics_frozen, '每場在開賽前最後一次更新時凍結，開賽後不再修改；這是最誠實的實戰成績，會隨著比賽進行累積。') + '</div>';

    // calibration
    var cal = (m.calibration || []).filter(function (b) { return b.n; });
    html += '<div class="grid-2" style="margin-top:12px"><div class="card"><div class="sec-hdr" style="margin-top:0"><h2 class="sec-title sm">🎯 校準：模型說 X% 時，實際贏幾次？</h2></div>' +
      '<table class="tbl"><thead><tr><th>看好方勝率區間</th><th>場數</th><th>平均預測</th><th>實際勝率</th><th class="left" style="width:40%">對照</th></tr></thead><tbody>' +
      cal.map(function (b) {
        var diff = b.actual - b.pred;
        return '<tr><td>' + b.lo + '–' + b.hi + '%</td><td>' + b.n + '</td><td>' + T.num(b.pred) + '%</td><td class="' + (Math.abs(diff) <= 5 ? 'pos' : (diff < 0 ? 'neg' : '')) + '"><b>' +
          T.num(b.actual) + '%</b></td><td class="left"><div class="bar" title="預測 ' + b.pred + '%／實際 ' + b.actual + '%"><i style="width:' + Math.min(100, b.actual) +
          '%;background:var(--accent);opacity:.75"></i></div></td></tr>';
      }).join('') + '</tbody></table><div class="note-line">實際勝率越接近平均預測，代表模型給的機率越可信。</div></div>';

    // ladder
    var ladder = M.ladder || [];
    var lo = Math.min.apply(null, ladder.map(function (x) { return x.elo; }).concat([1450])) - 20;
    var hi = Math.max.apply(null, ladder.map(function (x) { return x.elo; }).concat([1550])) + 10;
    html += '<div class="card"><div class="sec-hdr" style="margin-top:0"><h2 class="sec-title sm">🪜 Elo 戰力排行（' + esc(M.current_season || '') + '）</h2><span class="sub">1500 = 聯盟平均</span></div>' +
      ladder.map(function (x, i) {
        var t = T.team(x.team_id);
        return '<div class="bar-row" style="grid-template-columns:22px 96px minmax(0,1fr) 46px"><span class="rank-badge' + (i === 0 ? ' top' : '') + '">' + (i + 1) + '</span>' +
          T.teamLink(x.team_id, { size: 18 }) + '<div class="bar"><i style="width:' + (100 * (x.elo - lo) / (hi - lo)).toFixed(1) + '%;background:' + esc(t.color) + '"></i></div>' +
          '<b class="num" style="text-align:right">' + Math.round(x.elo) + '</b></div>';
      }).join('') + '</div></div>';

    // trend
    var hist = M.history || {};
    var series = ladder.map(function (x) {
      var t = T.team(x.team_id);
      return { name: t.short, color: t.color, points: hist[x.team_id] || [] };
    });
    html += '<div class="card"><div class="sec-hdr" style="margin-top:0"><h2 class="sec-title sm">📈 Elo 走勢（最近兩季）</h2><span class="sub">每場賽後更新；換季時會往平均值回歸</span></div>' +
      T.lineChart(series, { w: 980, h: 260 }) + '<div class="legend">' + series.map(function (s) {
        return '<span><i style="background:' + esc(s.color) + '"></i>' + esc(s.name) + '</span>';
      }).join('') + '</div></div>';

    // params + tune log
    var tl = L.tune_log || [];
    html += '<div class="grid-2" style="margin-top:12px"><div class="card"><div class="sec-hdr" style="margin-top:0"><h2 class="sec-title sm">⚙️ 目前參數</h2><span class="sub">由自動調參決定</span></div>' +
      '<table class="tbl"><tbody>' +
      '<tr><td class="left">K 值（每場調整幅度）</td><td><b>' + T.num(P.k, 0) + '</b></td></tr>' +
      '<tr><td class="left">主場優勢</td><td><b>' + T.num(P.hca, 0) + ' Elo</b>（約 ' + T.num(P.hca / (P.epp || 28)) + ' 分）</td></tr>' +
      '<tr><td class="left">換季回歸平均</td><td><b>' + Math.round(100 * (P.regress || 0)) + '%</b></td></tr>' +
      '<tr><td class="left">背靠背扣分</td><td><b>' + T.num(P.b2b, 0) + ' Elo</b></td></tr>' +
      '<tr><td class="left">每 1 分分差對應 Elo</td><td><b>' + T.num(P.epp, 0) + '</b></td></tr>' +
      '</tbody></table><div class="note-line">預測分差 = 60% Elo 分差 + 40% 攻守模型（各隊得失分相對聯盟水準的加權平均）；勝率由預測分差換算。</div></div>' +
      '<div class="card"><div class="sec-hdr" style="margin-top:0"><h2 class="sec-title sm">🛠️ 調整紀錄</h2><span class="sub">每累積 6 場新比賽或每 3 天自動重新搜尋參數</span></div>' +
      (tl.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>時間</th><th>樣本</th><th class="left">結果</th><th>Brier 前→後</th><th>命中率 前→後</th></tr></thead><tbody>' +
        tl.map(function (r) {
          var pm = r.prev_metrics || {}, nm = r.metrics || {}, pp = r.params || {};
          return '<tr><td>' + esc(T.whenTw(r.run_at)) + '</td><td>' + (r.games || 0) + '</td><td class="left" data-tip="' + esc('K ' + pp.k + '／主場 ' + pp.hca + '／回歸 ' + pp.regress +
            '／背靠背 ' + pp.b2b + '／每分 Elo ' + pp.epp) + '">' + esc(r.note || '') + '</td><td>' + T.num(pm.brier, 3) + ' → <b>' + T.num(nm.brier, 3) + '</b></td><td>' +
            pctTxt(pm.hit) + ' → <b>' + pctTxt(nm.hit) + '</b></td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="muted small">尚未執行自動調參（完賽場次滿 30 場後開始）。</div>') + '</div></div>';
    html += '<div class="card prose" style="margin-top:12px"><h3>📖 怎麼看這些數字？</h3><ul>' +
      '<li><b>命中率</b>：只看「誰贏」。台灣職籃隊伍少、戰力接近，60% 上下已比「永遠猜主隊」好。</li>' +
      '<li><b>Brier 分數</b>：檢查勝率給得準不準；全部猜 50% 會得到 0.250，越低越好。</li>' +
      '<li><b>分差／總分誤差</b>：預測比分和實際差幾分，用來檢討攻守模型。</li>' +
      '<li><b>回測 vs 賽前凍結</b>：回測是事後用當時已知資料重算；凍結預測是開賽前就固定、事後不能改的版本，兩者都列出來，讓模型好壞一目了然。</li></ul></div>';
    html += '<div class="study-note">' + esc((T.snap.meta && T.snap.meta.study_note) || '') + '</div>';
    root.innerHTML = html;
  };
})();

</script>
<script>/* js/page_about.js */
/* Page: 📖 說明 (#/about) — data sources, update schedule, the model in plain Chinese, glossary. */
(function () {
  'use strict';
  var T = window.TWB;
  var esc = T.esc;

  T.pages.about = function (root, ctx) {
    var L = ctx.L;
    T.pageTitle = '說明';
    var m = (T.snap && T.snap.meta) || {};
    var s = m.schedule_slots || { sync: [], notes: {} };
    var P = (L.model || {}).params || {};
    var html = '<div class="sec-hdr"><div><h1 class="sec-title">📖 關於台籃戰情室</h1><div class="sub">' + esc(m.study_note || '') + '</div></div></div>';
    html += '<div class="grid-2"><div class="card prose"><h3>🏀 這是什麼？</h3>' +
      '<p>台灣兩大職籃聯盟 <b>P. LEAGUE+</b> 與 <b>TPBL</b> 的數據分析戰情室。頁首可以一鍵切換聯盟，每一頁都只顯示所選聯盟的球隊、戰績、球員與模型，兩個聯盟的資料與模型完全分開、不會混在一起。</p>' +
      '<ul><li>今日賽事：即時比分、賽前預測（勝率、比分、分差、總得分、信心等級與關鍵因素）。</li>' +
      '<li>賽程比分、戰績排行、球隊數據、球員排行與每場比賽的逐場數據。</li>' +
      '<li>模型檢討：命中率、Brier 分數、分差與總分誤差、校準表、Elo 排行與自動調參紀錄。</li></ul>' +
      '<p class="muted small">分享網址可加上 <code>?lg=plg</code> 或 <code>?lg=tpbl</code> 直接指定聯盟，例如 <code>#/standings?lg=plg</code>。</p></div>' +
      '<div class="card prose"><h3>📡 資料來源</h3><ul>' +
      '<li><b>P. LEAGUE+</b>：<a href="https://pleagueofficial.com" target="_blank" rel="noopener">pleagueofficial.com</a> 官網的賽程頁（比分、場館、觀眾）、比賽頁的逐場數據與賽況。</li>' +
      '<li><b>TPBL</b>：<a href="https://tpbl.basketball" target="_blank" rel="noopener">tpbl.basketball</a> 官網使用的公開資料介面（賽季、賽程、比分、逐場數據）。</li></ul>' +
      '<p>抓取時每次請求間隔 1 秒以上、已完賽的比賽只抓一次並永久快取；歷史賽季只用賽程頁的最終比分建立 Elo，逐場數據保留最近兩季。比分與數據一律以官方公布為準。</p>' +
      '<p class="muted small">官方資料沒有提供球員國籍／身分欄位，因此本站不區分本土與洋將；戰績由本站依比分計算，官方排名若另含對戰成績等規則請以官方為準。</p></div></div>';

    html += '<div class="card prose" style="margin-top:12px"><h3>🔄 什麼時候更新？</h3><ul>' +
      s.sync.map(function (t) { return '<li><b>' + esc(t) + '</b>　' + esc((s.notes || {})[t] || '') + '</li>'; }).join('') +
      '<li><b>比賽進行中</b>　本機版每 ' + (s.live_every_min || 2) + ' 分鐘更新一次即時比分；完賽後自動抓逐場數據並重新計算模型。</li></ul>' +
      '<p class="muted small">GitHub 公開版由雲端排程在相同時段自動更新並重新發布（可能晚幾分鐘到半小時）；下載的離線檔案則停在打包當下，不會自動更新。</p></div>';

    html += '<div class="card prose" style="margin-top:12px"><h3>🧠 模型白話說明（每個聯盟各自一套）</h3><ol>' +
      '<li><b>Elo 戰力分數</b>：每隊從 1500 分開始，贏球加分、輸球扣分；贏越多分、或爆冷贏強隊，加得越多（分差乘數）。目前每場調整幅度 K = ' + T.num(P.k, 0) + '。</li>' +
      '<li><b>主場優勢</b>：主隊預設多 ' + T.num(P.hca, 0) + ' Elo（約 ' + T.num((P.hca || 0) / (P.epp || 28)) + ' 分）。</li>' +
      '<li><b>休息天數／背靠背</b>：前一天剛比賽的球隊扣 ' + T.num(P.b2b, 0) + ' Elo。</li>' +
      '<li><b>換季回歸</b>：新賽季開始時，每隊的 Elo 往聯盟平均拉回 ' + Math.round(100 * (P.regress || 0)) + '%（陣容會變動）。</li>' +
      '<li><b>攻守模型</b>：用每隊最近比賽「得分、失分比聯盟水準高或低多少」的加權平均（同時反映節奏與效率），推算雙方預期得分 → 預測總得分。</li>' +
      '<li><b>合成預測</b>：預測分差 = 60% Elo 分差 + 40% 攻守模型分差；勝率由預測分差換算（分差越大、勝率越接近 100%）。</li>' +
      '<li><b>信心等級</b>：看好方勝率 ≥ 72% 為「高」、≥ 60% 為「中」，其餘為「低」；兩隊本季出賽少於 3 場時一律降一級。</li>' +
      '<li><b>逐場前推回測</b>：依時間順序重播每一場，每場只用比賽前已知的資料預測，再把結果加進去，所以沒有偷看答案。</li>' +
      '<li><b>自動調參</b>：每累積 6 場新比賽或每 3 天，自動搜尋 K、主場優勢、回歸、背靠背等參數，只有在 Brier 分數明顯變好時才採用，並寫入調整紀錄。</li>' +
      '<li><b>賽前凍結</b>：每次更新都會重算未開賽的預測；開賽後那一版就固定不再修改，賽後誠實對照命中與否。</li></ol></div>';

    html += '<div class="card" style="margin-top:12px"><h3 class="sec-title sm" style="margin-bottom:8px">📚 名詞解釋</h3><dl class="gloss">' +
      '<dt>真實命中率 TS%</dt><dd>得分 ÷ (2 × (投籃出手 + 0.44 × 罰球出手))。把三分與罰球都算進去，最能反映得分效率。</dd>' +
      '<dt>有效命中率 eFG%</dt><dd>(投籃命中 + 0.5 × 三分命中) ÷ 投籃出手。三分球多算半顆，讓外線球員與內線球員能公平比較。</dd>' +
      '<dt>節奏 Pace</dt><dd>每場大約打幾個進攻回合（回合 ≈ 出手 + 0.44 × 罰球出手 − 進攻籃板 + 失誤，取兩隊平均；延長賽未扣除）。</dd>' +
      '<dt>進攻效率 ORtg／防守效率 DRtg</dt><dd>每 100 個回合得幾分／失幾分。排除節奏快慢的影響，ORtg 越高越好、DRtg 越低越好，相減就是攻守效率差。</dd>' +
      '<dt>Four Factors 四大因素</dt><dd>有效命中率、失誤率、進攻籃板率、罰球率：Dean Oliver 歸納的四個決定勝負的關鍵。</dd>' +
      '<dt>效率值 EFF</dt><dd>得分 + 籃板 + 助攻 + 抄截 + 阻攻 − 投籃不進 − 罰球不進 − 失誤。</dd>' +
      '<dt>Elo</dt><dd>源自西洋棋的戰力評分，1500 為平均；兩隊相差 100 分，大約代表強隊有 64% 勝率（未計主場）。</dd>' +
      '<dt>Brier 分數</dt><dd>(預測勝率 − 實際結果)² 的平均，0 最好、0.25 等於每場都猜 50%。</dd>' +
      '<dt>平均誤差 MAE</dt><dd>預測值和實際值差距的平均，例如分差誤差 10 分＝平均每場差 10 分。</dd>' +
      '<dt>背靠背</dt><dd>連續兩天出賽（第二天的那一場）。</dd>' +
      '<dt>勝差</dt><dd>與第一名的差距：((第一名勝 − 本隊勝) + (本隊敗 − 第一名敗)) ÷ 2。</dd></dl></div>';
    html += '<div class="study-note">' + esc(m.study_note || '') + '</div>';
    root.innerHTML = html;
  };
})();

</script>
<script>/* js/page_feedback.js */

(function () {

  var TOOL = '台籃戰情室';

  var KINDS = [
    { id: 'feature', label: '✨ 功能許願' },

    { id: 'other', label: '💬 其他意見' }
  ];
  var items = null, selKind = 'feature', sending = false, statusHtml = '';

  function loadLocal() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { return []; }
  }
  function saveLocal(list) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(list.slice(0, 50))); } catch (e) { /* ignore */ }
  }
  function fallback(kindLabel, title, desc, note) {
    if (window.CampusNav && window.CampusNav.fallbackHtml) {
      return window.CampusNav.fallbackHtml({ email: TARGET_EMAIL, tool: TOOL, kindLabel: kindLabel, title: title, description: desc, note: note });
    }
    var subject = '[' + TOOL + ' 意見回饋] ' + kindLabel + ' — ' + title;
    var href = 'mailto:' + TARGET_EMAIL + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(desc);
    return '<div class="card banner">' + esc(note || '請改用郵件寄送：') + ' <a href="' + esc(href) + '">📩 寄信給站長</a></div>';
  }
  function sendStatic(item) {
    if (window.CampusNav && window.CampusNav.sendStaticFeedback) {
      return window.CampusNav.sendStaticFeedback({ email: TARGET_EMAIL, tool: TOOL, kindLabel: item.kind_label, title: item.title,
        description: item.description, createdAt: item.created_at });
    }
    return Promise.resolve({ sent: false });
  }

  T.pages.feedback = function (root) {
    T.pageTitle = '意見回饋';
    if (items === null) {
      items = loadLocal();
      if (!T.isStatic) {
        T.apiGet('/api/feedback').then(function (res) {
          if (res && Array.isArray(res.items)) {
            items = res.items;
            if (T.route === 'feedback') T.render(true);
          }
        }).catch(function () { /* keep local history */ });
      }
    }
    root.innerHTML = '<div class="sec-hdr"><div><h1 class="sec-title">💬 意見回饋</h1><div class="sub">問題回報、功能許願或任何建議都歡迎，送出後會寄到站長信箱。</div></div></div>' +
      '<div class="fb-layout"><form class="card fb-form" id="fbForm" novalidate>' +
      '<div><label>類型</label><div class="fb-type-pills">' + KINDS.map(function (k) {
        return '<button type="button" class="fb-type-pill' + (k.id === selKind ? ' active' : '') + '" data-kind="' + k.id + '">' + k.label + '</button>';
      }).join('') + '</div></div>' +
      '<div><label for="fbTitle">標題</label><input class="inp" id="fbTitle" maxlength="150" placeholder="一句話說明建議或問題" style="width:100%"></div>' +
      '<div><label for="fbDesc">內容</label><textarea class="inp" id="fbDesc" rows="6" maxlength="4000" placeholder="詳細描述情境、希望增加的數據，或遇到的異常…"></textarea></div>' +
      '<div id="fbStatus">' + statusHtml + '</div>' +
      '<div style="display:flex;justify-content:flex-end"><button type="submit" class="btn btn-primary" id="fbSubmit">📨 送出</button></div></form>' +
      '<div class="card"><h2 class="sec-title sm" style="margin-bottom:8px">🗂️ 已送出的回饋（' + items.length + '）</h2><div class="fb-list">' +
      (items.length ? items.map(function (it) {
        return '<div class="fb-item"><div style="display:flex;justify-content:space-between;gap:8px"><span class="chip info">' + esc(it.kind_label || it.kind) +
          '</span><span class="muted small">' + esc(it.created_at || '') + '</span></div><div style="font-weight:800;margin-top:4px">' + esc(it.title) + '</div>' +
          '<div class="small" style="white-space:pre-wrap;color:#334155;margin-top:2px">' + esc(it.description) + '</div></div>';
      }).join('') : '<div class="muted small">還沒有回饋紀錄。</div>') + '</div></div></div>';

    var pills = root.querySelector('.fb-type-pills');
    pills.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-kind]');
      if (!b) return;
      selKind = b.getAttribute('data-kind');
      pills.querySelectorAll('[data-kind]').forEach(function (x) { x.classList.toggle('active', x === b); });
    });
    var titleInp = root.querySelector('#fbTitle');
    titleInp.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !T.isEnterSend(ev)) ev.preventDefault();
    });
    root.querySelector('#fbForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (sending) return;
      var title = titleInp.value.trim();
      var desc = root.querySelector('#fbDesc').value.trim();
      if (!title || !desc) { T.toast('⚠️ 請填寫標題與內容'); return; }
      var kind = KINDS.filter(function (k) { return k.id === selKind; })[0] || KINDS[0];
      sending = true;
      var btn = root.querySelector('#fbSubmit');
      btn.disabled = true;
      btn.textContent = '⏳ 送出中…';
      var done = function (html) {
        sending = false;
        statusHtml = html;
        T.render(true);
      };
      if (!T.isStatic) {
        T.apiPost('/api/feedback', { kind: selKind, title: title, description: desc }).then(function (res) {
          items = res.items || [res.item].concat(items);
          saveLocal(items);
          var ok = !res.item || res.item.mail_sent !== false;
          if (ok) T.toast('✅ 感謝回饋！已寄到站長信箱');
          done(ok ? '<div class="card ok-box">✅ 已收到並寄出通知信，感謝你的建議！</div>' :
            fallback(kind.label, title, desc, '✅ 回饋已存到伺服器；自動寄信暫時忙碌，請任選下方一種方式一鍵寄給站長：'));
        }, function (e) {
          done(fallback(kind.label, title, desc, '⚠️ 伺服器暫時無法寄信（' + (e.message || '連線忙碌') + '），請任選下方一種方式一鍵寄給站長：'));
        });
        return;
      }
      var item = { id: 'FB-' + Date.now().toString(36).toUpperCase(), kind: selKind, kind_label: kind.label, title: title, description: desc,
        created_at: new Date().toISOString().slice(0, 19).replace('T', ' ') };
      sendStatic(item).then(function (r) {
        items = [item].concat(items);
        saveLocal(items);
        done(r && r.sent ? '<div class="card ok-box">✅ 感謝回饋！已寄到站長信箱。</div>' : fallback(kind.label, title, desc));
      }, function () {
        items = [item].concat(items);
        saveLocal(items);
        done(fallback(kind.label, title, desc));
      });
    });
  };
})();

</script>
</body>
</html>
