  <style>
/* 台籃戰情室 — clean, information-dense light theme (Playbook design system). */
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --surface: #f8fafc;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-sub: #475569;
  --muted: #64748b;
  --primary: #2563eb;
  --primary-soft: #eff6ff;
  --ok-bg: #dcfce7; --ok-txt: #166534;
  --warn-bg: #fef3c7; --warn-txt: #92400e;
  --bad-bg: #fee2e2; --bad-txt: #991b1b;
  --info-bg: #dbeafe; --info-txt: #1e40af;
  --plg: #1e3a8a; --plg-soft: #e8edfb; --plg-badge: #b8935a;
  --tpbl: #c8102e; --tpbl-soft: #fdecef;
  --accent: #c8102e; --accent-soft: #fdecef;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
  --hdr-h: 58px;
}
body[data-lg="plg"] { --accent: var(--plg); --accent-soft: var(--plg-soft); }
body[data-lg="tpbl"] { --accent: var(--tpbl); --accent-soft: var(--tpbl-soft); }

* { box-sizing: border-box; }
html { overflow-y: scroll; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 14px; line-height: 1.5; }
body { margin: 0; background: var(--bg); color: var(--text); }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
code { background: #f1f5f9; padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
.top-hdr { position: sticky; top: 0; z-index: 60; background: #fff; border-bottom: 1px solid var(--border); box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03); border-top: 3px solid var(--accent); }
.hdr-inner { max-width: 1380px; margin: 0 auto; padding: 6px 18px; min-height: var(--hdr-h); display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.brand-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.brand-wrap > .campus-home { height: 26px; }
.brand { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 17px; color: var(--text); text-decoration: none !important; letter-spacing: -0.01em; white-space: nowrap; }
.brand-icon { font-size: 20px; }
.ver-badge { display: inline-flex; align-items: center; padding: 2px 9px; font-size: 11.5px; font-weight: 700; border-radius: 999px; background: var(--primary-soft); color: var(--primary); border: 1px solid #bfdbfe; cursor: pointer; }
.ver-badge:hover { background: #dbeafe; }

.lg-switch { display: inline-flex; padding: 3px; gap: 3px; background: #f1f5f9; border: 1px solid var(--border); border-radius: 11px; flex-shrink: 0; }
.lg-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 6px 13px; border-radius: 8px; font-size: 13.5px; font-weight: 800; color: var(--text-sub); cursor: pointer; letter-spacing: .01em; white-space: nowrap; }
.lg-btn .lg-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.lg-plg .lg-dot { background: var(--plg); box-shadow: 0 0 0 2px var(--plg-badge) inset; }
.lg-tpbl .lg-dot { background: var(--tpbl); }
.lg-btn:hover { background: #fff; color: var(--text); }
.lg-btn.lg-plg.active { background: var(--plg); color: #fff; box-shadow: 0 1px 4px rgba(30, 58, 138, .35); }
.lg-btn.lg-tpbl.active { background: var(--tpbl); color: #fff; box-shadow: 0 1px 4px rgba(200, 16, 46, .3); }
.lg-btn.active .lg-dot { background: #fff; box-shadow: none; }

.main-nav { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; flex: 1 1 auto; justify-content: flex-end; }
.nav-item { padding: 6px 10px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--text-sub); text-decoration: none !important; white-space: nowrap; }
.nav-item:hover { background: var(--surface); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 800; }

/* ---------- layout ---------- */
.app-main { max-width: 1380px; margin: 0 auto; padding: 14px 18px 40px; min-height: calc(100vh - var(--hdr-h) - 80px); }
.loading-box, .empty-box { padding: 36px 18px; text-align: center; color: var(--muted); background: #fff; border: 1px dashed var(--border-strong); border-radius: var(--radius); }
.site-foot { border-top: 1px solid var(--border); background: #fff; }
.site-foot-inner { max-width: 1380px; margin: 0 auto; padding: 12px 18px; display: flex; flex-wrap: wrap; gap: 4px 18px; justify-content: space-between; font-size: 12px; color: var(--muted); }

/* 🔄 資料更新頻率 strip (Pattern 205) */
.upd-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-bottom: 12px; padding: 7px 12px; border: 1px solid #dbeafe; border-radius: 10px; background: #f5f9ff; color: #1e3a8a; font-size: 12.5px; line-height: 1.5; }
.upd-strip:empty { display: none; }
.upd-strip .us-lbl { color: #1d4ed8; font-weight: 700; white-space: nowrap; }
.upd-strip .us-main { font-weight: 600; white-space: nowrap; }
.upd-strip .us-seg { display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: 0 6px; padding-left: 14px; border-left: 1px solid #c7dbfb; }
.upd-strip .us-seg b { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.upd-strip .us-desc { color: var(--muted); }
.upd-strip .us-when { margin-left: auto; color: #475569; font-variant-numeric: tabular-nums; white-space: nowrap; }
.upd-strip .us-warn { flex-basis: 100%; color: var(--warn-txt); background: var(--warn-bg); border-radius: 6px; padding: 2px 8px; }

/* ---------- sections, cards ---------- */
.sec-hdr { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px 14px; flex-wrap: wrap; margin: 14px 0 10px; }
.sec-hdr:first-child { margin-top: 0; }
.sec-title { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
.sec-title.sm { font-size: 15.5px; }
.sub { color: var(--muted); font-size: 12.5px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.card + .card { margin-top: 12px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.grid-2 > .card + .card, .grid-3 > .card + .card, .kpis > .card + .card { margin-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; height: 22px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #f1f5f9; color: var(--text-sub); white-space: nowrap; border: 1px solid transparent; }
.chip.ok { background: var(--ok-bg); color: var(--ok-txt); }
.chip.warn { background: var(--warn-bg); color: var(--warn-txt); }
.chip.bad { background: var(--bad-bg); color: var(--bad-txt); }
.chip.info { background: var(--info-bg); color: var(--info-txt); }
.chip.muted { background: #f8fafc; color: var(--muted); border-color: var(--border); }
.chip.stage { background: var(--accent-soft); color: var(--accent); }
.chip.live { background: #fee2e2; color: #b91c1c; }
.pulse { position: relative; width: 7px; height: 7px; border-radius: 50%; background: #ef4444; display: inline-block; }
/* Ripple runs on transform/opacity only (compositor), never on box-shadow. */
.pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: rgba(239, 68, 68, .6); animation: pulse 1.4s infinite; will-change: transform, opacity; }
@keyframes pulse { 0% { transform: scale(1); opacity: 1; } 70% { transform: scale(2.7); opacity: 0; } 100% { transform: scale(2.7); opacity: 0; } }
.hit { color: #15803d; font-weight: 800; }
.miss { color: #b91c1c; font-weight: 800; }
.note-line { font-size: 12px; color: var(--muted); margin-top: 8px; }
.study-note { margin-top: 18px; text-align: center; font-size: 12px; color: var(--muted); }
.banner { padding: 9px 13px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-txt); border: 1px solid #fcd34d; font-weight: 600; margin-bottom: 12px; }

/* league hero */
.lg-hero { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding: 12px 16px; border-radius: var(--radius); background: #fff; border: 1px solid var(--border); border-left: 5px solid var(--accent); margin-bottom: 12px; }
.lg-hero h1 { margin: 0; font-size: 19px; font-weight: 900; color: var(--accent); letter-spacing: .01em; }
.lg-hero .hero-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.lg-hint { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); font-size: 12.5px; font-weight: 700; color: var(--text-sub); cursor: pointer; text-decoration: none !important; }
.lg-hint:hover { background: #fff; color: var(--text); }
.lg-hint .lg-dot { width: 8px; height: 8px; border-radius: 50%; }

/* team label */
.tm-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text); font-weight: 700; text-decoration: none !important; min-width: 0; }
.tm-link:hover .tm-nm { color: var(--accent); text-decoration: underline; }
.tm-nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tm-logo { object-fit: contain; flex-shrink: 0; }
.tm-logo-wrap { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
/* Team-colour dot until the logo has loaded (or forever if it fails / the network blocks it). */
.tm-logo-wrap:not(.ok) { background: radial-gradient(circle, var(--tc, #94a3b8) 0 58%, transparent 61%); }
.tm-logo-wrap:not(.ok) img { opacity: 0; }

/* ---------- game cards ---------- */
.games-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.gcard { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.gcard.is-live { border-color: #fca5a5; box-shadow: 0 0 0 3px rgba(239, 68, 68, .08); }
.gc-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.gc-top .sp { margin-left: auto; }
.gc-teams { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.gc-side { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.gc-side.home { align-items: flex-end; text-align: right; }
.gc-side .tm-link { font-size: 15.5px; }
.gc-side.home .tm-link { flex-direction: row-reverse; }
.gc-rec { font-size: 11.5px; color: var(--muted); }
.gc-mid { text-align: center; min-width: 92px; }
.gc-score { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.gc-score .w { color: var(--text); }
.gc-score .l { color: #94a3b8; }
.gc-vs { font-size: 13px; font-weight: 800; color: #94a3b8; }
.ha { font-size: 10.5px; font-weight: 800; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.prob { display: flex; align-items: center; gap: 8px; }
.prob-n { font-size: 13px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; width: 38px; text-align: center; }
.prob-n.fav { color: var(--text); }
.prob-bar { flex: 1; display: flex; height: 9px; border-radius: 999px; overflow: hidden; background: #e2e8f0; }
.prob-bar i { display: block; height: 100%; }
.prob-bar i + i { border-left: 2px solid #fff; }
.gc-pred { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.gc-pred > div { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; text-align: center; }
.gc-pred .k { font-size: 11px; color: var(--muted); }
.gc-pred .v { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.gc-grade { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12.5px; padding: 6px 9px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); }
.factors { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.factors th, .factors td { padding: 3px 6px; border-bottom: 1px dashed var(--border); font-variant-numeric: tabular-nums; }
.factors th { color: var(--muted); font-weight: 600; text-align: center; width: 34%; }
.factors td { text-align: center; }
.factors td.edge { font-weight: 800; color: var(--text); }
.factors tr:last-child th, .factors tr:last-child td { border-bottom: 0; }
.gc-notes { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--text-sub); }
.gc-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.b2b { color: #b45309; font-weight: 700; }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { padding: 7px 9px; border-bottom: 1px solid #eef2f7; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl th { background: #f8fafc; color: var(--text-sub); font-weight: 700; font-size: 12px; position: sticky; top: 0; z-index: 1; }
.tbl th.sortable { cursor: pointer; user-select: none; }
.tbl th.sortable:hover { color: var(--text); }
.tbl th.on { color: var(--accent); background: var(--accent-soft); }
.tbl td.on { background: #fffbeb; font-weight: 800; }
.tbl .left { text-align: left; }
.tbl tbody tr:hover td { background: #f8fafc; }
.tbl tbody tr:hover td.on { background: #fef3c7; }
.tbl .sticky { position: sticky; left: 0; background: #fff; z-index: 2; box-shadow: 1px 0 0 #eef2f7; }
.tbl th.sticky { z-index: 3; background: #f8fafc; }
.tbl tbody tr:hover td.sticky { background: #f8fafc; }
.tbl tr.sep td { background: #f1f5f9; font-size: 11.5px; font-weight: 800; color: var(--text-sub); text-align: left; }
.tbl tr.tot td { font-weight: 800; background: #f8fafc; }
.rank-badge { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; background: #f1f5f9; }
.rank-badge.top { background: var(--accent); color: #fff; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dots i.W { background: #16a34a; }
.dots i.L { background: #ef4444; }
.pos { color: #15803d; }
.neg { color: #b91c1c; }

/* ---------- filters ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.inp { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: #fff; color: var(--text); min-width: 0; }
.inp:focus { outline: 2px solid #bfdbfe; border-color: #93c5fd; }
.sel { padding-right: 26px; }
textarea.inp { width: 100%; resize: vertical; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 7px 13px; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 700; border: 1px solid var(--border-strong); background: #fff; color: var(--text); cursor: pointer; text-decoration: none !important; }
.btn:hover { background: var(--surface); }
.btn:disabled { opacity: .6; cursor: default; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-soft { background: var(--primary-soft); border-color: #bfdbfe; color: var(--primary); }
.btn-sm { padding: 4px 9px; font-size: 12px; }

/* schedule list */
.day-group + .day-group { margin-top: 12px; }
.day-hdr { font-size: 13px; font-weight: 800; color: var(--text-sub); margin: 0 0 6px; display: flex; gap: 8px; align-items: center; }
.srow { display: grid; grid-template-columns: 62px 104px minmax(0, 1fr) 150px 116px; align-items: center; gap: 8px; padding: 8px 12px; background: #fff; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; }
.srow + .srow { margin-top: 6px; }
.srow:hover { border-color: var(--border-strong); }
.srow .s-time { font-weight: 800; font-variant-numeric: tabular-nums; }
.srow .s-match { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; }
.srow .s-match > span { display: flex; align-items: center; min-width: 0; }
.srow .s-match .home { justify-self: start; }
.srow .s-match .away { justify-self: end; }
.srow .s-sc { font-weight: 900; font-size: 15px; font-variant-numeric: tabular-nums; text-align: center; min-width: 74px; color: var(--text); text-decoration: none !important; }
.srow .s-sc .l { color: #94a3b8; }
.srow .s-venue { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .s-pred { text-align: right; font-size: 12px; }

/* teams grid */
.team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.tcard { display: flex; flex-direction: column; gap: 8px; text-decoration: none !important; color: var(--text); border-top: 4px solid var(--tc, var(--accent)); }
.tcard:hover { box-shadow: 0 6px 18px rgba(15, 23, 42, .08); }
.tc-hd { display: flex; align-items: center; gap: 10px; }
.tc-hd .nm { font-weight: 900; font-size: 16px; }
.tc-hd .en { font-size: 11.5px; color: var(--muted); }
.tc-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tc-stats > div { background: var(--surface); border-radius: 8px; padding: 5px 6px; text-align: center; }
.tc-stats .k { font-size: 11px; color: var(--muted); }
.tc-stats .v { font-weight: 800; font-variant-numeric: tabular-nums; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi .k { font-size: 12px; color: var(--muted); font-weight: 700; }
.kpi .v { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.kpi .d { font-size: 12px; color: var(--text-sub); }
.bar-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 54px; gap: 8px; align-items: center; font-size: 12.5px; }
.bar-row + .bar-row { margin-top: 6px; }
.bar { height: 12px; background: #eef2f7; border-radius: 999px; overflow: hidden; position: relative; }
.bar i { display: block; height: 100%; border-radius: 999px; }
.cmp-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 92px minmax(0, 1fr) 64px; gap: 8px; align-items: center; font-size: 12.5px; }
.cmp-row + .cmp-row { margin-top: 6px; }
.cmp-row .lbl { text-align: center; color: var(--muted); font-weight: 700; }
.cmp-row .va { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.cmp-row .vh { text-align: left; font-weight: 800; font-variant-numeric: tabular-nums; }
.cmp-bar { height: 9px; background: #eef2f7; border-radius: 999px; overflow: hidden; display: flex; }
.cmp-bar.away { justify-content: flex-end; }
.cmp-bar i { display: block; height: 100%; }
.chart { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }

/* game page */
.gp-hero { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; }
.gp-team { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; text-decoration: none !important; color: var(--text); }
.gp-team .nm { font-weight: 900; font-size: 18px; }
.gp-score { font-size: 42px; font-weight: 900; font-variant-numeric: tabular-nums; text-align: center; line-height: 1.1; }
.qtbl td:first-child, .qtbl th:first-child { text-align: left; }

/* about / glossary */
.prose { font-size: 13.5px; line-height: 1.75; color: #1e293b; }
.prose h3 { font-size: 15px; margin: 4px 0 6px; }
.prose ul { margin: 4px 0; padding-left: 20px; }
.gloss { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 6px 14px; font-size: 13px; }
.gloss dt { font-weight: 800; }
.gloss dd { margin: 0; color: var(--text-sub); }

/* feedback */
.fb-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 14px; align-items: start; }
.fb-type-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.fb-type-pill { border: 1px solid var(--border-strong); background: #fff; border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 12.5px; font-weight: 700; color: var(--text-sub); cursor: pointer; }
.fb-type-pill.active { background: var(--primary-soft); border-color: #93c5fd; color: var(--primary); }
.fb-form { display: flex; flex-direction: column; gap: 12px; }
.fb-form label { font-weight: 800; font-size: 13.5px; display: block; margin-bottom: 4px; }
.fb-list { display: flex; flex-direction: column; gap: 8px; max-height: 520px; overflow-y: auto; }
.fb-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
.ok-box { background: #f0fdf4 !important; border-color: #bbf7d0 !important; color: #166534; font-size: 13px; }

/* modal, toast, tooltip */
.modal-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(15, 23, 42, .45); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 14px; overflow-y: auto; }
.modal-card { background: #fff; border-radius: 14px; width: 100%; max-width: 640px; box-shadow: 0 20px 60px rgba(15, 23, 42, .25); }
.modal-card.modal-lg { max-width: 820px; }
.modal-hdr { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.modal-hdr h3 { margin: 0; font-size: 16px; }
.modal-body { padding: 14px 16px 18px; }
.icon-close { border: 0; background: transparent; font-size: 18px; cursor: pointer; color: var(--muted); }
.rel-dl { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface); margin-bottom: 12px; }
.rel-pub { border-color: #fcd34d; background: #fffdf7; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
.rel-bumps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rel-bump { border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 10px; cursor: pointer; background: #fff; }
.rel-bump.on { border-color: var(--primary); background: var(--primary-soft); }
.rel-actions { display: flex; justify-content: flex-end; }
.rel-h { margin: 10px 0 8px; }
.rel-item { margin-bottom: 10px; }
.rel-item ul { margin: 6px 0 0; padding-left: 18px; color: #334155; font-size: 13px; }
.rel-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rel-top .sub { margin-left: auto; }
.toast-box { position: fixed; right: 16px; bottom: 16px; z-index: 120; display: flex; flex-direction: column; gap: 8px; }
.toast-msg { background: #0f172a; color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(15, 23, 42, .25); max-width: 340px; }
.tip { position: fixed; left: 0; top: 0; z-index: 130; display: none; max-width: 320px; padding: 7px 10px; border-radius: 8px; background: #0f172a; color: #f8fafc; font-size: 12px; line-height: 1.55; white-space: pre-line; pointer-events: none; box-shadow: 0 6px 20px rgba(15, 23, 42, .25); }
.cfb-box { margin-top: 4px; }

@media (max-width: 1100px) {
  .main-nav { justify-content: flex-start; flex-basis: 100%; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

  .srow .s-venue { display: none; }

  function setCookieBoth(name, val) {
    if (window.location && window.location.protocol === 'file:') return;
    try {
      document.cookie = name + '=' + val + '; path=/; max-age=31536000; SameSite=Lax';
      var hParts = String(window.location.hostname || '').split('.');
      if (hParts.length >= 4 && /^[ab][0-9a-f]{20,}$/i.test(hParts[0])) {
        document.cookie = name + '=' + val + '; domain=.' + hParts.slice(1).join('.') + '; path=/; max-age=31536000; SameSite=Lax';
      }
    } catch (e) { /* ignore */ }
  }

  function readCookieJson(name) {
    if (window.location && window.location.protocol === 'file:') return null;
    try {
      var parts = (document.cookie || '').split(';');
      for (var i = 0; i < parts.length; i++) {
        var kv = parts[i].trim();
        if (kv.indexOf(name + '=') === 0) {
          var obj = JSON.parse(decodeURIComponent(kv.slice(name.length + 1)));
          return obj && typeof obj === 'object' ? obj : null;
        }
      }
    } catch (e) { /* ignore */ }
    return null;
  }

  function readStuCookie() { return readCookieJson(STU_COOKIE); }
  function writeStuCookie(obj) {
    try { setCookieBoth(STU_COOKIE, encodeURIComponent(JSON.stringify(obj))); } catch (e) { /* ignore */ }
  }

  function todayStr() {
    var d = new Date();
    return '' + (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate());
  }

  function isPlainObj(v) { return !!(v && typeof v === 'object' && !Array.isArray(v)); }

  function mergeDailyRecord(a, b, tDay) {
    var da = isPlainObj(a) && (a.date === tDay || a.day === tDay) ? a : null;
    var db = isPlainObj(b) && (b.date === tDay || b.day === tDay) ? b : null;
    if (!da && !db) {
      return {
        date: tDay, day: tDay, checkin: 0, visit: 0, study: 0, studySec: 0, sport: 0, eco: 0,
        claimed: {}, bonusClaimed: false, fullClaimed: false
      };
    }
    var srcA = da || {}, srcB = db || {};
    var claimed = Object.assign({}, isPlainObj(srcA.claimed) ? srcA.claimed : {}, isPlainObj(srcB.claimed) ? srcB.claimed : {});
    var studyVal = Math.max(+srcA.study || 0, +srcA.studySec || 0, +srcB.study || 0, +srcB.studySec || 0);
    var bonus = !!(srcA.bonusClaimed || srcA.fullClaimed || srcB.bonusClaimed || srcB.fullClaimed);
    var out = Object.assign({}, srcA, srcB, {
      date: tDay,
      day: tDay,
      checkin: Math.max(+srcA.checkin || 0, +srcB.checkin || 0),
      visit: Math.max(+srcA.visit || 0, +srcB.visit || 0),
      study: studyVal,
      studySec: studyVal,
      sport: Math.max(+srcA.sport || 0, +srcB.sport || 0),
      eco: Math.max(+srcA.eco || 0, +srcB.eco || 0),
      claimed: claimed,
      bonusClaimed: bonus,
      fullClaimed: bonus,
    });
    return out;
  }

  function loadFunState() {
    var ls = {}, ck = readCookieJson(FUN_COOKIE) || {};
    try { ls = JSON.parse(window.localStorage.getItem(FUN_KEY) || '{}') || {}; } catch (e) { ls = {}; }
    var badges = Object.assign({}, isPlainObj(ls.ach) ? ls.ach : {}, isPlainObj(ls.badges) ? ls.badges : {});
    if (Array.isArray(ck.ach)) {
      ck.ach.forEach(function (id) { if (id && !badges[id]) badges[id] = Date.now(); });
    }
    var academyActs = Object.assign({}, isPlainObj(ck.aact) ? ck.aact : {});
    if (isPlainObj(ls.academyActs)) {
      Object.keys(ls.academyActs).forEach(function (k) {
        academyActs[k] = Math.max(+academyActs[k] || 0, +ls.academyActs[k] || 0);
      });

    var academySec = Object.assign({}, isPlainObj(ck.asec) ? ck.asec : {});
    if (isPlainObj(ls.academySec)) {
      Object.keys(ls.academySec).forEach(function (k) {
        academySec[k] = Math.max(+academySec[k] || 0, +ls.academySec[k] || 0);
      });
    }
    var days = Object.assign({}, isPlainObj(ls.studyDays) ? ls.studyDays : {});
    if (Array.isArray(ck.days)) {
      ck.days.forEach(function (d) { if (d) days[d] = 1; });
    }
    var tDay = todayStr();
    days[tDay] = 1;
    var daily = mergeDailyRecord(ck.dl, ls.daily, tDay);
    return {
      raw: ls,
      badges: badges,
      academyActs: academyActs,

  function localOrigin(loc, port) {
    var p = parseInt(port, 10);
    var host = loc.hostname || '';
    var dot = host.indexOf('.');
    if (dot > 0) {
      var label = host.slice(0, dot);
      var pHex = ('0000' + p.toString(16)).slice(-4).toLowerCase();
      if (label.length === 31 && /^a[0-9a-f]{30}$/i.test(label)) {
        return loc.protocol + '//' + (label.slice(0, 9) + pHex + label.slice(13)).toLowerCase() + host.slice(dot);
      }
      if (label.length === 55 && /^b[0-9a-f]{54}$/i.test(label)) {
        return loc.protocol + '//' + (label.slice(0, 33) + pHex + label.slice(37)).toLowerCase() + host.slice(dot);
      }
    }
    return loc.protocol + '//' + host + ':' + p;
  }

        writeStuCookie(persisted);
      }
      var isConfirmed = !!(stu.confirmed === true && stu.name);
      var dispName = isConfirmed ? String(stu.name).trim() : ('訪客 #' + String(stu.stuNo || stu.uid).slice(-4).toUpperCase());
      if (TEST_UID_RE.test(String(stu.uid)) || (isConfirmed && TEST_NAMES[dispName])) return;
      if (!isConfirmed) return; // 🪪 未在校園地圖取名的訪客不對外廣播（取名後才會出現在在線名單與排行榜）

      var wireMsg = Object.assign({}, stu, {
        name: dispName,
        avatar: stu.avatar || '🧑‍🎓',
        title: stu.title || (isConfirmed ? '🌱 開心學園新生' : '🌱 校園訪客'),
        confirmed: isConfirmed,
        guest: !isConfirmed,
        activeTs: actSec,
        idleSec: idleSec,
      });
      if (isLeave) {
        wireMsg.action = 'leave';
        wireMsg.event = 'leave';
      } else if (opts.event) {
        wireMsg.event = opts.event;
      }

      if (_navBc) {
        try { _navBc.postMessage(wireMsg); } catch (e) { /* ignore */ }
      } else if (window.BroadcastChannel) {
        try {
          var tmpBc = new BroadcastChannel(BC_NAME);
          tmpBc.postMessage(wireMsg);
          tmpBc.close();
        } catch (e) { /* ignore */ }
      }

      var loc = window.location;
      if (loc.protocol !== 'http:' && loc.protocol !== 'https:') return;
      var host = loc.hostname || '';
      var isGhPages = /(^|\.)github\.io$/i.test(host);
      var bodyStr = JSON.stringify(wireMsg);
      var nowMs = Date.now();

      if (isLeave) {
        navMqttPublish(MQTT_LIVE_TOPIC, bodyStr, false);
        navMqttPublish(MQTT_PEER_PREFIX + stu.uid, bodyStr, true);
        if (!isGhPages) sendBeaconSafe(campusBase() + 'api/presence', bodyStr, true);
        sendBeaconSafe('https://ntfy.sh/' + NTFY_TOPIC, bodyStr, false);
        return;
      }

      var mqttGap = document.hidden ? 28000 : 18000;
      var mqttSent = 0;
      if (opts.forceRemote || nowMs - _lastMqttSendMs >= mqttGap) {
        _lastMqttSendMs = nowMs;
        mqttSent = navMqttPublish(MQTT_LIVE_TOPIC, bodyStr, false);
        navMqttPublish(MQTT_PEER_PREFIX + stu.uid, bodyStr, true);
      }

      if (!isGhPages && (opts.forceRemote || nowMs - _lastApiSendMs >= 14000)) {
        _lastApiSendMs = nowMs;
        fetch(campusBase() + 'api/presence', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: bodyStr,
          keepalive: true
        }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
          if (j && (j.now_sec || j.now)) syncNavClock(j.now_sec || j.now);
        }).catch(function () {});
      }

      // ntfy.sh 每日每 IP 僅 250 則配額：當 MQTT 已連線時由 MQTT 負責即時同步，僅在 MQTT 未就緒或每 180 秒低頻備援
      var ntfyGap = mqttSent > 0 ? 180000 : (document.hidden ? 60000 : 35000);
      if ((opts.forceRemote && mqttSent === 0) || nowMs - _lastNtfySendMs >= ntfyGap) {
        _lastNtfySendMs = nowMs;
        fetch('https://ntfy.sh/' + NTFY_TOPIC, { method: 'POST', body: bodyStr, keepalive: true }).catch(function () {});
      }
    } catch (e) { /* ignore */ }
  }

  function connectSingleAcademyMqtt(url, idx, toolId) {
    if (!window.WebSocket || isNavBot()) return;
    var existing = _navMqttClients[idx];
    if (existing && existing.ws && (existing.ws.readyState === 0 || existing.ws.readyState === 1)) return;
    if (existing && existing.pingT) { clearInterval(existing.pingT); existing.pingT = 0; }
    if (existing && existing.retryT) { clearTimeout(existing.retryT); existing.retryT = 0; }

    var entry = existing || { url: url, ws: null, ready: false, backoff: 1500, pingT: 0, retryT: 0, pktId: 1 };
    entry.ready = false;
    _navMqttClients[idx] = entry;

    var ws;
    try {
      ws = new WebSocket(url, 'mqtt');
      ws.binaryType = 'arraybuffer';
    } catch (e) {
      return;
    }
    entry.ws = ws;
    var rxBuf = new Uint8Array(0);

    ws.onopen = function () {
      if (entry.ws !== ws) return;
      var cid = 'hc_ac_' + TAB_ID.replace(/[^a-zA-Z0-9]/g, '').slice(-10) + '_' + idx + '_' + (Date.now() % 10000);
      try { ws.send(mqttConnectPkt(cid)); } catch (e) { /* ignore */ }
    };

    ws.onmessage = function (ev) {
      if (entry.ws !== ws || !ev || !ev.data) return;
      var chunk = new Uint8Array(ev.data);
      var merged = new Uint8Array(rxBuf.length + chunk.length);
      merged.set(rxBuf, 0);
      merged.set(chunk, rxBuf.length);
      rxBuf = merged;

      while (rxBuf.length >= 2) {
        var byte0 = rxBuf[0];
        var pktType = byte0 >> 4;
        var flags = byte0 & 0x0f;
        var mult = 1, remLen = 0, pos = 1, b;
        do {
          if (pos >= rxBuf.length) return;
          b = rxBuf[pos++];
          remLen += (b & 0x7f) * mult;
          mult *= 128;
        } while ((b & 0x80) !== 0 && pos < 5);

        var totalLen = pos + remLen;
        if (rxBuf.length < totalLen) return;

        var body = rxBuf.subarray(pos, totalLen);
        rxBuf = rxBuf.subarray(totalLen);

        if (pktType === 2) { // CONNACK
          entry.ready = true;
          entry.backoff = 1500;
          try {
            ws.send(mqttSubscribePkt(entry.pktId++, [MQTT_CTL_TOPIC]));
          } catch (e) { /* ignore */ }
          if (entry.pingT) clearInterval(entry.pingT);
          entry.pingT = setInterval(function () {
            if (entry.ws === ws && ws.readyState === 1 && entry.ready) {
              try { ws.send(mqttPingReqPkt()); } catch (e) { /* ignore */ }
            }
          }, 25000);
          // 連上後立即廣播一次目前在該學院的狀態
          if (!_leftSent) {
            sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
          }
        } else if (pktType === 3 && body.length >= 2) { // PUBLISH
          var tLen = (body[0] << 8) | body[1];
          var pStart = 2 + tLen;
          var qos = (flags >> 1) & 0x03;
          if (qos > 0) pStart += 2;
          if (pStart <= body.length) {
            var topicStr = mqttUtf8Decode(body.subarray(2, 2 + tLen));
            var payloadStr = mqttUtf8Decode(body.subarray(pStart));
            if (topicStr === MQTT_CTL_TOPIC && payloadStr) {
              try {
                var d = JSON.parse(payloadStr);
                if (d && (d.event === 'ping' || d.action === 'ping')) {
                  if (Date.now() - _lastPongSentMs >= 3500) {
                    _lastPongSentMs = Date.now();
                    setTimeout(function () {
                      if (!_leftSent) sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'pong' });
                    }, 80 + Math.floor(Math.random() * 280));
                  }
                }
              } catch (e) { /* ignore */ }
            }
          }
        }
      }
    };

    var onDisconnect = function () {
      if (entry.ws !== ws) return;
      entry.ready = false;
      entry.ws = null;
      if (entry.pingT) { clearInterval(entry.pingT); entry.pingT = 0; }
      if (entry.retryT) clearTimeout(entry.retryT);
      var wait = entry.backoff + Math.floor(Math.random() * 600);
      entry.backoff = Math.min(18000, Math.round(entry.backoff * 1.7));
      entry.retryT = setTimeout(function () {
        entry.retryT = 0;
        connectSingleAcademyMqtt(url, idx, toolId);
      }, wait);
    };
    ws.onerror = onDisconnect;
    ws.onclose = onDisconnect;
  }

  function connectAcademyMqtt(toolId) {
    if (!window.WebSocket || isNavBot()) return;
    MQTT_BROKERS.forEach(function (url, idx) {
      connectSingleAcademyMqtt(url, idx, toolId);
    });
  }

  function connectAcademyRollCall(toolId) {
    connectAcademyMqtt(toolId);
    if (!window.EventSource || isNavBot()) return;
    if (_navEs) {
      try { _navEs.close(); } catch (e) { /* ignore */ }
      _navEs = null;
    }
    try {
      var es = new EventSource('https://ntfy.sh/' + NTFY_TOPIC + '/sse');
      _navEs = es;
      es.onopen = function () { _navEsBackoff = 2000; };
      es.onmessage = function (ev) {
        try {
          var m = JSON.parse(ev.data);
          if (m && m.time) syncNavClock(+m.time);
          if (!m || m.event !== 'message' || !m.message) return;
          var d = JSON.parse(m.message);
          if (d && (d.event === 'ping' || d.action === 'ping')) {
            if (Date.now() - _lastPongSentMs >= 3500) {
              _lastPongSentMs = Date.now();
              setTimeout(function () {
                if (!_leftSent) sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'pong' });
              }, 100 + Math.floor(Math.random() * 350));
            }
          }
        } catch (e) { /* ignore */ }
      };
      es.onerror = function () {
        try { es.close(); } catch (e) { /* ignore */ }
        if (_navEs === es) _navEs = null;
        if (_navEsRetryT) clearTimeout(_navEsRetryT);
        var wait = _navEsBackoff + Math.floor(Math.random() * 800);
        _navEsBackoff = Math.min(20000, Math.floor(_navEsBackoff * 1.8));
        _navEsRetryT = setTimeout(function () {
          _navEsRetryT = 0;
          connectAcademyRollCall(toolId);
        }, wait);
      };
    } catch (e) { /* ignore */ }
  }

  function startAcademyPresenceLoop(toolId) {
    if (!toolId || !TOOL_MAP[toolId] || _presenceLoopBound || isNavBot()) return;
    _presenceLoopBound = true;
    touchTabLease(toolId);

    window.addEventListener('keydown', function (e) {
      if (!e) return;
      if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.key === 'R'))) {
        markInternalNav();
      }
    }, true);

    if (window.BroadcastChannel) {
      try {
        _navBc = new BroadcastChannel(BC_NAME);
        _navBc.onmessage = function (ev) {
          var d = ev && ev.data;
          if (!d) return;
          if (d.event === 'tab_closed' && d.tabId !== TAB_ID && !document.hidden) {
            sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
          } else if (d.event === 'ping' && Date.now() - _lastPongSentMs >= 3000) {
            _lastPongSentMs = Date.now();
            sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'pong' });
          }
        };
      } catch (e) { _navBc = null; }
    }

    var onUserAct = function () {
      var wasAway = (Date.now() - _lastActMs) >= 90000;
      _lastActMs = Date.now();
      _leftSent = false;
      if (wasAway && !document.hidden) {
        sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'active' });
      }
    };
    ['pointerdown', 'keydown', 'touchstart', 'touchmove', 'wheel'].forEach(function (evName) {
      window.addEventListener(evName, onUserAct, { passive: true });
    });

    setInterval(function () {
      touchTabLease(toolId);
      sendPresenceHeartbeat(toolId, { forceRemote: false });
    }, 10000);

    document.addEventListener('visibilitychange', function () {
      touchTabLease(toolId);
      if (!document.hidden) {
        _leftSent = false;
        _lastActMs = Date.now();
        connectAcademyMqtt(toolId);
        if (!_navEs) connectAcademyRollCall(toolId);
        sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'active' });
      } else {
        sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'away' });
      }
    });
    window.addEventListener('online', function () {
      _leftSent = false;
      connectAcademyRollCall(toolId);
      sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
    });
    window.addEventListener('pageshow', function () {
      _leftSent = false;
      _internalNav = false;
      touchTabLease(toolId);
      connectAcademyRollCall(toolId);
      sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
    });

    function onUnload() {
      if (_leftSent) return;
      _leftSent = true;
      var otherTabs = removeTabLease();
      var recentNavTs = 0;
      try { recentNavTs = +window.localStorage.getItem(NAV_TS_KEY) || 0; } catch (e) { /* ignore */ }
      var isInternal = _internalNav || (Date.now() - recentNavTs < 5000);
      if (otherTabs > 0) {
        if (_navBc) {
          try { _navBc.postMessage({ event: 'tab_closed', tabId: TAB_ID }); } catch (e) { /* ignore */ }
        }
        return;
      }
      if (!isInternal) {
        sendPresenceHeartbeat(toolId, { leave: true });
      }
    }
    window.addEventListener('pagehide', onUnload);
    window.addEventListener('beforeunload', onUnload);

    connectAcademyRollCall(toolId);
  }

  function fbEsc(s) {

  function fbCopyText(text) {
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return Promise.resolve(ok);
      } catch (e) { return Promise.resolve(false); }
    }
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, fallback);
    }
    return fallback();
  }

  // ---------- 意見回饋：靜態網頁（GitHub Pages／file://）按下送出就直接寄出，不讓使用者挑管道 ----------
  // 1) ntfy.sh 中轉頻道（免帳號、CORS 開放）：Cloudtop 校園後端每分鐘收件、存檔並寄信給站長；

    if (candName && !TEST_NAMES[candName] && !/^訪客\s*#/i.test(candName) && (lsStu.confirmed || ckStu.confirmed || legacyStu.name)) {
      if (!lsStu.confirmed || !lsStu.name) {
        var synced = Object.assign({}, ckStu, lsStu, {
          uid: lsStu.uid || ckStu.uid || legacyStu.id || ('stu_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7)),
          stuNo: lsStu.stuNo || ckStu.stuNo || String(1000 + Math.floor(Math.random() * 9000)),
          name: candName.slice(0, 16),
          avatar: lsStu.avatar || ckStu.avatar || legacyStu.avatar || '🧑‍🎓',
          title: lsStu.title || ckStu.title || '🌱 開心學園新生',
          confirmed: true,
          guest: false,
        });
        try { window.localStorage.setItem(STU_KEY, JSON.stringify(synced)); } catch (e3) { /* ignore */ }
        writeStuCookie(synced);
      }
      return;
    }
    if (document.getElementById('campusAcademyNameGate')) return;
    var tInfo = TOOL_MAP[toolId] || { name: '開心學園', icon: '🏫' };
    var avList = ['🧑‍🎓', '🦊', '🐱', '🐶', '🐼', '🐰', '🦉', '🐧', '🦄', '🐉', '🍀', '🧋'];
    var pickedAv = (lsStu && lsStu.avatar) || (ckStu && ckStu.avatar) || '🧑‍🎓';
    if (avList.indexOf(pickedAv) < 0) pickedAv = '🧑‍🎓';

    var wrap = document.createElement('div');
    wrap.id = 'campusAcademyNameGate';
    wrap.className = 'campus-name-gate-backdrop';
    wrap.setAttribute('role', 'dialog');
    wrap.setAttribute('aria-modal', 'true');
    wrap.innerHTML =
      '<div class="campus-name-gate-card">' +
        '<div class="campus-name-gate-hd"><span class="cng-ic">' + fbEsc(tInfo.icon || '🏫') + '</span>' +
          '<h3>歡迎進入「' + fbEsc(tInfo.name) + '」！請先設定學員暱稱</h3></div>' +
        '<p class="campus-name-gate-sub">設定專屬暱稱與頭像後即可開始進修，你的學習紀錄、成就點數與座駕會在全校 20 間學院與校園地圖自動同步（取名後享有 1 次免費改名機會）。</p>' +
        '<label class="campus-name-gate-lbl">1. 選擇你的學員頭像</label>' +
        '<div class="campus-name-gate-avs">' +
          avList.map(function (av) {
            return '<button type="button" class="campus-name-gate-av' + (av === pickedAv ? ' on' : '') + '" data-cng-av="' + fbEsc(av) + '">' + fbEsc(av) + '</button>';
          }).join('') +
        '</div>' +
        '<label class="campus-name-gate-lbl" for="cngNameInput">2. 輸入你的學員暱稱（2～16 字）</label>' +
        '<input id="cngNameInput" class="campus-name-gate-inp" type="text" maxlength="16" placeholder="例如：小傑夫、Livia、阿哲…" autocomplete="off">' +
        '<div id="cngErrMsg" class="campus-name-gate-err"></div>' +
        '<button type="button" id="cngSubmitBtn" class="campus-name-gate-btn">🎓 完成入學報到，開始進修！</button>' +
      '</div>';
    document.body.appendChild(wrap);

    var inp = wrap.querySelector('#cngNameInput');
    var errEl = wrap.querySelector('#cngErrMsg');
    var subBtn = wrap.querySelector('#cngSubmitBtn');
    wrap.addEventListener('click', function (e) {
      var avBtn = e.target && e.target.closest ? e.target.closest('[data-cng-av]') : null;
      if (!avBtn) return;
      pickedAv = avBtn.getAttribute('data-cng-av') || '🧑‍🎓';
      var all = wrap.querySelectorAll('[data-cng-av]');
      for (var i = 0; i < all.length; i++) {
        all[i].classList.toggle('on', all[i] === avBtn);
      }
    });

    function submitGate() {
      var val = String((inp && inp.value) || '').trim();
      if (val.length < 2) {
        if (errEl) errEl.textContent = '⚠️ 請輸入至少 2 個字的學員暱稱喔！';
        if (inp) inp.focus();
        return;
      }
      if (TEST_NAMES[val] || /^訪客\s*#?/i.test(val)) {
        if (errEl) errEl.textContent = '⚠️ 請使用專屬暱稱，不要使用「訪客」或預設測試名稱喔！';
        if (inp) inp.focus();
        return;
      }
      var curLs = {}, curCk = readStuCookie() || {};
      try { curLs = JSON.parse(window.localStorage.getItem(STU_KEY) || '{}') || {}; } catch (e) { curLs = {}; }
      var uid = curLs.uid || curCk.uid || ('stu_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7));
      var stuNo = curLs.stuNo || curCk.stuNo || String(1000 + Math.floor(Math.random() * 9000));
      var saved = Object.assign({}, curCk, curLs, {
        uid: uid,
        stuNo: stuNo,
        name: val.slice(0, 16),
        avatar: pickedAv,
        title: curLs.title || curCk.title || '🌱 開心學園新生',
        carId: curLs.carId || curCk.carId || 'campus-bike',
        confirmed: true,
        guest: false,
        renameCount: 0,
      });
      try { window.localStorage.setItem(STU_KEY, JSON.stringify(saved)); } catch (e2) { /* ignore */ }
      writeStuCookie(saved);
      wrap.remove();
      sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
    }

    if (subBtn) subBtn.addEventListener('click', submitGate);
    if (inp) {
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
          e.preventDefault();
          submitGate();
        }
      });
      setTimeout(function () { try { inp.focus(); } catch (e) { /* ignore */ } }, 80);
    }
  }

  function init() {
    injectCss();
    var toolId = window.CAMPUS_TOOL_ID || '';
    var nodes = document.querySelectorAll('[data-campus-home]');
    if (nodes.length) {
      for (var i = 0; i < nodes.length; i++) {
        var id = nodes[i].getAttribute('data-campus-home') || toolId;
        if (!toolId) toolId = id;
        decorate(nodes[i], id);
      }
    } else if (document.body) {
      var a = document.createElement('a');
      a.className = 'campus-home floating';
      document.body.appendChild(a);
      decorate(a, toolId);
    }
    wireGoLinks(document);
    if (window.MutationObserver && document.body) {
      // 只處理新插入的節點（SPA 每次重繪不再整份文件 querySelectorAll）；點擊時仍會再補一次 href
      var mo = new MutationObserver(function (recs) {
        for (var r = 0; r < recs.length; r++) {
          var added = recs[r].addedNodes;
          for (var k = 0; k < added.length; k++) {
            var n = added[k];
            if (n.nodeType !== 1) continue;
            if (n.hasAttribute('data-campus-go')) wireGoLinks(n.parentNode);
            else if (n.firstElementChild) wireGoLinks(n);
          }
        }
      });
      mo.observe(document.body, { childList: true, subtree: true });
    }
    document.addEventListener('click', function (e) {
      var cp = e.target && e.target.closest ? e.target.closest('[data-campus-fb-copy]') : null;
      if (cp) {
        e.preventDefault();
        var txt = cp.getAttribute('data-campus-fb-copy') || '';
        var em = cp.getAttribute('data-campus-fb-email') || DEFAULT_FB_EMAIL;
        fbCopyText(txt).then(function (ok) {
          var orig = cp.getAttribute('data-orig-label') || cp.textContent;
          cp.setAttribute('data-orig-label', orig);
          cp.textContent = ok ? ('✅ 已複製！可貼到信箱寄至 ' + em) : ('信箱：' + em);
          setTimeout(function () { cp.textContent = orig; }, 3800);
        });
        return;
      }
      var anyLink = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (anyLink && !e.metaKey && !e.ctrlKey && !e.shiftKey && anyLink.getAttribute('target') !== '_blank') {
        if (anyLink.classList.contains('campus-home') || anyLink.hasAttribute('data-campus-go') || isInternalHref(anyLink.getAttribute('href'))) {
          markInternalNav();
        }
      }
      var a = e.target && e.target.closest ? e.target.closest('[data-campus-go]') : null;
      if (!a) return;
      var tid = a.getAttribute('data-campus-go');
      var h = a.getAttribute('data-campus-hash') || '';
      if (tid) {
        markInternalNav();
        recordVisit(tid);
        a.href = toolUrl(tid, h);
      }
    }, true);
    ensureAcademyIcon(toolId);
    ensureAcademyNameGate(toolId);
    wrapFeedbackFetch();
    recordVisit(toolId);
    startAcademyPresenceLoop(toolId);
    initAcademyAchievements(toolId);
    setTimeout(flushFeedbackQueue, 3000);
    window.addEventListener('online', function () { flushFeedbackQueue(); });
  }

  function recordActPublic(tid) {
    var target = tid || window.CAMPUS_TOOL_ID || '';
    if (!target) {
      var n = document.querySelector && document.querySelector('[data-campus-home]');
      if (n) target = n.getAttribute('data-campus-home') || '';
    }
    if (!target || !TOOL_MAP[target]) return;
    var st = loadFunState();
    st.academyActs[target] = (+st.academyActs[target] || 0) + 1;
    saveFunState(st);
    checkAcademyProgress(st, target);
  }

  function unlockAchPublic(achId) {
    if (!achId || !ACAD_ACH[achId]) return false;
    var st = loadFunState();
    return unlockInAcademy(st, achId);
  }

  wrapFeedbackFetch();
  window.CampusNav = {
    base: campusBase,
    url: campusUrl,
    toolUrl: toolUrl,
    wire: wireGoLinks,
    init: init,
    recordAct: recordActPublic,
    bumpAct: recordActPublic,
    unlockAch: unlockAchPublic,
    markInternalNav: markInternalNav,
    visitsKey: VISITS_KEY,
    getReporterInfo: getReporterInfo,
    detectDeviceInfo: detectDeviceInfo,
    deliveryLinks: deliveryLinks,
    sendStaticFeedback: sendStaticFeedback,
    flushFeedbackQueue: flushFeedbackQueue,
    fallbackHtml: fallbackHtml
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>

<script>/* js/app.js */
/* 台籃戰情室 — core: router, league switcher, snapshot store, update strip, shared UI, release modal.
 * Pages live in static/js/page_*.js and register TWB.pages[name] = function (root, ctx) {...}.
 */
(function () {
  'use strict';

  var IS_STATIC = Boolean(
    window.TWB_STATIC_ONLY || location.protocol === 'file:' ||
    /\.github\.io$|\.pages\.dev$|\.netlify\.app$|\.vercel\.app$/i.test(location.hostname || '')
  );
  var LS_LEAGUE = 'twb.league';
  var LEAGUES = ['plg', 'tpbl'];
  var WEEKDAY = '日一二三四五六';

  var TWB = window.TWB = {
    isStatic: IS_STATIC,
    snap: window.__TWB_SNAPSHOT__ || null,
    meta: null,
    pages: {},
    route: 'home',
    params: [],
    query: {},
    league: null,
    version: (window.TWB_RELEASES && window.TWB_RELEASES.current_version) || '1.0.0',
    state: {}
  };

  // ------------------------------------------------------------------ small utils
  TWB.esc = function (s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  /** Zero-flicker: only touch innerHTML when the markup actually changed. */
  TWB.setHtml = function (el, html) {
    if (!el) return false;
    if (el.__html === html) return false;
    el.innerHTML = html;
    el.__html = html;
    return true;
  };
  TWB.num = function (v, d) {
    if (v === null || v === undefined || v === '' || !isFinite(v)) return '—';
    return Number(v).toFixed(d === undefined ? 1 : d);
  };
  TWB.signed = function (v, d) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    var n = Number(v);
    return (n > 0 ? '+' : '') + n.toFixed(d === undefined ? 1 : d);
  };
  TWB.pct = function (m, a, d) {
    if (!a) return '—';
    return (100 * m / a).toFixed(d === undefined ? 1 : d) + '%';
  };
  TWB.fmtMin = function (sec) {
    sec = Math.round(sec || 0);
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  };
  function twToday(addDays) {
    return new Date(Date.now() + (8 + 24 * (addDays || 0)) * 3600000).toISOString().slice(0, 10);
  }
  TWB.today = function () { return twToday(0); };
  TWB.md = function (d) { return d && d.length >= 10 ? Number(d.slice(5, 7)) + '/' + Number(d.slice(8, 10)) : (d || '—'); };
  TWB.wd = function (d) { return d ? WEEKDAY.charAt(new Date(d + 'T00:00:00Z').getUTCDay()) : ''; };
  TWB.dayLabel = function (d) {
    if (!d) return '—';
    var base = TWB.md(d) + '（' + TWB.wd(d) + '）';
    if (d === twToday(0)) return '今天 ' + base;
    if (d === twToday(1)) return '明天 ' + base;
    if (d === twToday(-1)) return '昨天 ' + base;
    return base;
  };
  /** Taipei ISO → 16:10 (today) / 昨天 21:30 / 明天 07:45 / 11/02（一）07:45 */
  TWB.whenTw = function (iso) {
    var d = String(iso || '').slice(0, 10), hm = String(iso || '').slice(11, 16);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || !/^\d{2}:\d{2}$/.test(hm)) return '';
    if (d === twToday(0)) return hm;
    if (d === twToday(-1)) return '昨天 ' + hm;
    if (d === twToday(1)) return '明天 ' + hm;
    return TWB.md(d) + '（' + TWB.wd(d) + '）' + hm;
  };

  // IME-safe Enter (注音／倉頡 candidate confirmation must never submit).
  var IME_ON = false, IME_END = 0;
  document.addEventListener('compositionstart', function () { IME_ON = true; }, true);
  document.addEventListener('compositionend', function () { IME_ON = false; IME_END = Date.now(); }, true);
  TWB.isEnterSend = function (ev) {
    return ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing && ev.keyCode !== 229 && !IME_ON &&
      Date.now() - IME_END >= 150;
  };

  TWB.toast = function (msg) {
    var box = document.getElementById('toastBox');
    if (!box) return;
    var el = document.createElement('div');
    el.className = 'toast-msg';
    el.textContent = msg;
    box.appendChild(el);
    while (box.children.length > 3) box.removeChild(box.firstChild);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 3200);
  };

  // Tooltip for [data-tip] (desktop hover; tap shows native title on mobile).
  (function initTips() {
    var tip = null, target = null;
    document.addEventListener('mouseover', function (ev) {
      tip = tip || document.getElementById('tip');
      if (!tip) return;
      var t = ev.target && ev.target.closest ? ev.target.closest('[data-tip]') : null;
      if (t === target) return;
      target = t;
      var txt = t ? t.getAttribute('data-tip') : '';
      if (!t || !txt) { tip.style.display = 'none'; return; }
      tip.textContent = txt;
      tip.style.display = 'block';
      var r = t.getBoundingClientRect();
      var w = tip.offsetWidth, h = tip.offsetHeight;
      var x = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
      var y = r.bottom + 6;
      if (y + h > window.innerHeight - 8) y = Math.max(8, r.top - h - 6);
      tip.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';
    });
    var hide = function () { target = null; if (tip) tip.style.display = 'none'; };
    document.addEventListener('scroll', hide, { passive: true, capture: true });
    window.addEventListener('blur', hide);
  })();

  // ------------------------------------------------------------------ league + data access
  TWB.L = function (lg) {
    var s = TWB.snap;
    return (s && s.leagues && s.leagues[lg || TWB.league]) || null;
  };
  TWB.leagueName = function (lg) {
    var L = TWB.L(lg);
    return (L && L.name) || (lg === 'plg' ? 'P. LEAGUE+' : 'TPBL');
  };
  TWB.team = function (id, lg) {
    var L = TWB.L(lg);
    var t = L && L.teams ? L.teams[id] : null;
    return t || { id: id, name: '球隊 ' + id, short: '球隊 ' + id, en: '', logo: '', color: '#64748b' };
  };
  TWB.logo = function (id, size, lg) {
    var t = TWB.team(id, lg);
    size = size || 22;
    // The wrapper shows the team colour as a dot whenever the logo is missing or fails to load.

  /** SVG sparkline / line chart. points: [[label, value], ...] */

  /** Season player lines (regular season) -> objects with per-game numbers and shooting splits. */
  TWB.playerRows = function (season, lg) {
    var L = TWB.L(lg);

  /** Multi-series SVG line chart. series: [{name, color, points: [[dateStr, value], ...]}] */
  TWB.lineChart = function (series, opts) {
    opts = opts || {};
    var w = opts.w || 760, h = opts.h || 220, padL = 40, padR = 10, padT = 10, padB = 22;
    var all = [];
    series.forEach(function (s) { s.points.forEach(function (p) { all.push(p); }); });
    if (all.length < 2) return '<div class="muted small">資料不足，無法繪圖</div>';
    var dates = all.map(function (p) { return p[0]; }).sort();
    var d0 = Date.parse(dates[0]), d1 = Date.parse(dates[dates.length - 1]);
    if (d1 <= d0) d1 = d0 + 86400000;
    var vals = all.map(function (p) { return p[1]; });
    var lo = Math.floor(Math.min.apply(null, vals) / 25) * 25, hi = Math.ceil(Math.max.apply(null, vals) / 25) * 25;
    if (hi - lo < 50) { hi += 25; lo -= 25; }
    var X = function (d) { return padL + (Date.parse(d) - d0) / (d1 - d0) * (w - padL - padR); };
    var Y = function (v) { return padT + (hi - v) / (hi - lo) * (h - padT - padB); };
    var grid = '';
    for (var v = lo; v <= hi; v += (hi - lo > 200 ? 50 : 25)) {
      grid += '<line x1="' + padL + '" x2="' + (w - padR) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="#eef2f7"/>' +
        '<text x="' + (padL - 6) + '" y="' + (Y(v) + 4).toFixed(1) + '" font-size="10" text-anchor="end" fill="#94a3b8">' + v + '</text>';
    }
    if (lo < 1500 && hi > 1500) grid += '<line x1="' + padL + '" x2="' + (w - padR) + '" y1="' + Y(1500).toFixed(1) + '" y2="' + Y(1500).toFixed(1) + '" stroke="#cbd5e1" stroke-dasharray="4 3"/>';
    var months = {};
    dates.forEach(function (d) { months[d.slice(0, 7)] = 1; });
    var mk = Object.keys(months).sort();
    var stepM = Math.max(1, Math.ceil(mk.length / 8));
    mk.forEach(function (m, i) {
      if (i % stepM) return;
      var x = X(m + '-01');
      if (x < padL) x = padL;
      grid += '<text x="' + x.toFixed(1) + '" y="' + (h - 6) + '" font-size="10" fill="#94a3b8">' + m.slice(2, 4) + '/' + Number(m.slice(5)) + '</text>';
    });
    var lines = series.map(function (s) {
      if (s.points.length < 2) return '';
      var pts = s.points.map(function (p) { return X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1); }).join(' ');
      var last = s.points[s.points.length - 1];
      return '<polyline fill="none" stroke="' + TWB.esc(s.color) + '" stroke-width="' + (s.bold ? 2.6 : 1.6) + '" stroke-linejoin="round" opacity="' +
        (s.dim ? 0.35 : 1) + '" points="' + pts + '"><title>' + TWB.esc(s.name) + '</title></polyline>' +
        '<circle cx="' + X(last[0]).toFixed(1) + '" cy="' + Y(last[1]).toFixed(1) + '" r="3" fill="' + TWB.esc(s.color) + '"/>';
    }).join('');
    return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + TWB.esc(opts.label || 'Elo 走勢') + '">' + grid + lines + '</svg>';
  };
