  <script>/* js/core.js */
/* 開心學園 · core.js — 共用核心：registry、執行環境、網址組裝、最近造訪、搜尋、IME 安全 Enter、提示訊息
 *
 * registry 來源：window.CAMPUS_REGISTRY（本機 server 由 /js/registry_data.js 產生；單一檔建置時內嵌）。
 * 執行環境：
 *   - github：*.github.io      → 公開網址
 *   - file：file:// 單一檔     → 公開網址
 *   - cloudtop：:8918 / :8919  → http://<location.hostname>:<local_port>/<local_hash|hash>
 */
(function () {
  'use strict';
  var C = (window.CAMPUS = window.CAMPUS || {});
  var VISITS_KEY = 'okayell.campus.visits.v1';
  var CAMPUS_PORTS = ['8918', '8919'];

  /* ------------------------------------------------------------ 小工具 */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function qs(name, search) {
    try { return new URLSearchParams(search == null ? location.search : search).get(name); }
    catch (e) { return null; }
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function stripHash(u) { var i = String(u || '').indexOf('#'); return i >= 0 ? u.slice(0, i) : String(u || ''); }
  function normHash(h) {
    h = String(h || '').trim();
    if (!h) return '';
    if (h.charAt(0) === '#') return h;
    if (h.charAt(0) !== '/') h = '/' + h;
    return '#' + h;
  }

  /* ------------------------------------------------------------ registry */
  var raw = window.CAMPUS_REGISTRY;
  var reg = { brand: {}, campus: {}, districts: [], buildings: [] };
  if (raw && typeof raw === 'object') {
    reg.brand = raw.brand || {};
    reg.campus = raw.campus || {};
    reg.districts = Array.isArray(raw.districts) ? raw.districts.filter(function (d) { return d && d.id; }) : [];
    reg.buildings = Array.isArray(raw.buildings) ? raw.buildings.filter(function (b) { return b && b.id; }) : [];
  }
  reg.buildings.forEach(function (b) {
    b.features = Array.isArray(b.features) ? b.features : [];
    b.links = Array.isArray(b.links) ? b.links : [];
    b.aliases = Array.isArray(b.aliases) ? b.aliases : [];
    b.status = b.status || 'live';
    b.kind = b.kind || 'academy';
  });
  var byId = {};
  var districtById = {};
  reg.buildings.forEach(function (b) { byId[b.id] = b; });
  reg.districts.forEach(function (d) { districtById[d.id] = d; });

  // 別名表（小寫）：id、aliases、repo 名稱、子資料夾名稱 → 建築 id
  var aliasMap = {};
  // id 優先（強），aliases / repo / 子資料夾為弱別名：不覆蓋已存在的對應
  function addAlias(k, id, weak) {
    k = String(k || '').toLowerCase().replace(/^\/+|\/+$/g, '');
    if (!k) return;
    if (weak && aliasMap[k]) return;
    aliasMap[k] = id;
  }
  reg.buildings.forEach(function (b) { addAlias(b.id, b.id); });
  reg.buildings.forEach(function (b) { b.aliases.forEach(function (a) { addAlias(a, b.id, true); }); });
  reg.buildings.forEach(function (b) {
    if (b.repo && b.repo !== reg.campus.repo) addAlias(b.repo, b.id, true);
    if (b.path) addAlias(b.path, b.id, true);
  });

  function building(idOrAlias) {
    if (!idOrAlias) return null;
    var k = String(idOrAlias).toLowerCase().trim().replace(/^\/+|\/+$/g, '');
    if (byId[k]) return byId[k];
    var id = aliasMap[k];
    return id ? byId[id] : null;
  }
  function districtOf(b) { return b ? districtById[b.district] || null : null; }
  function district(id) {
    if (!id) return null;
    var k = String(id).toLowerCase().trim();
    if (districtById[k]) return districtById[k];
    // 也接受中文名稱（例：語言學區 / 語言）
    for (var i = 0; i < reg.districts.length; i++) {
      var d = reg.districts[i];
      if (d.name === id || String(d.name || '').replace('學區', '') === id) return d;
    }
    return null;
  }

  /* ------------------------------------------------------------ 執行環境與網址 */
  function detectEnv() {
    var loc = window.location;
    var host = loc.hostname || '';
    if (loc.protocol === 'file:') return { mode: 'file' };
    if (/(^|\.)github\.io$/i.test(host)) return { mode: 'github' };
    if (loc.protocol === 'http:' || loc.protocol === 'https:') {
      return { mode: 'cloudtop', host: host, proto: loc.protocol };
    }
    return { mode: 'other' };
  }
  var env = detectEnv();

  function isLive(b) { return !!(b && b.status !== 'planned' && b.url); }
  function localBase(b) {
    if (env.mode !== 'cloudtop' || !b || !b.local_port) return '';
    return env.proto + '//' + env.host + ':' + b.local_port + '/';
  }
  function publicUrl(b) { return b && b.url ? b.url : ''; }
  // 主要入口：Local (cloudtop) 版一律使用 Local 網址；GitHub / file 版一律使用 GitHub 公開網址
  function primaryUrl(b) {
    if (!isLive(b)) return '';
    var lb = localBase(b);
    if (lb) return lb + (b.local_hash || '');
    return publicUrl(b);
  }
  function linkUrl(b, hash) {
    if (!isLive(b)) return '';
    var h = normHash(hash);
    var lb = localBase(b);
    if (lb) return lb + h;
    return stripHash(publicUrl(b)) + h;
  }
  function localUrl(b) {
    var lb = localBase(b);
    return lb ? lb + (b.local_hash || '') : '';
  }
  // 校園首頁網址（404 頁、分享用）
  function campusHome() {
    if (env.mode === 'file') return 'index.html';
    if (env.mode === 'github') return window.location.origin + '/';
    if (env.mode === 'cloudtop') {
      var p = window.location.port;
      if (p && CAMPUS_PORTS.indexOf(p) >= 0) return window.location.origin + '/';
      return env.proto + '//' + env.host + ':' + CAMPUS_PORTS[0] + '/';
    }
    return reg.campus.public_url || 'https://okayell.github.io/';
  }
  function shortUrl(b) {
    var a = b && (b.aliases[0] || b.id);
    if (env.mode === 'cloudtop') {
      return a ? window.location.host + '/' + a : '';
    }
    var base = String(reg.campus.public_url || 'https://okayell.github.io/').replace(/^https?:\/\//, '');
    return a ? base + a : '';
  }

  /* Cloudtop 即時服務狀態（/api/status，伺服器端 ≤5 秒快取） */
  var status = { ports: null, at: 0, inflight: null };
  C.portUp = function (b) {
    if (!b || !b.local_port || !status.ports) return null;
    var v = status.ports[String(b.local_port)];
    return v == null ? null : !!v;
  };
  C.refreshStatus = function (force) {
    if (env.mode !== 'cloudtop') return Promise.resolve(null);
    if (status.inflight) return status.inflight;
    if (!force && status.ports && Date.now() - status.at < 8000) return Promise.resolve(status.ports);
    status.inflight = fetch('/api/status', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        status.inflight = null;
        if (j && j.ports) {
          status.ports = j.ports;
          status.at = Date.now();
          C.emit('status', status.ports);
        }
        return status.ports;
      })
      .catch(function () { status.inflight = null; return null; });
    return status.inflight;
  };

  /* ------------------------------------------------------------ 最近造訪（campus_nav.js 也寫同一個 key） */
  function readVisits() {
    try {
      var v = JSON.parse(window.localStorage.getItem(VISITS_KEY) || '{}');
      return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
    } catch (e) { return {}; }
  }
  function recentVisits(limit) {
    var v = readVisits();
    return Object.keys(v)
      .filter(function (id) { return byId[id] && isLive(byId[id]) && typeof v[id] === 'number'; })
      .sort(function (a, b) { return v[b] - v[a]; })
      .slice(0, limit || 6)
      .map(function (id) { return { b: byId[id], at: v[id] }; });
  }
  function recordVisit(id) {
    if (!id || !byId[id]) return;
    try {
      var v = readVisits();
      v[id] = Date.now();
      window.localStorage.setItem(VISITS_KEY, JSON.stringify(v));
    } catch (e) { /* 無痕模式：略過 */ }
  }
  function timeAgo(ts) {
    var s = Math.max(0, (Date.now() - ts) / 1000);
    if (s < 60) return '剛剛';
    if (s < 3600) return Math.floor(s / 60) + ' 分鐘前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小時前';
    if (s < 86400 * 30) return Math.floor(s / 86400) + ' 天前';
    return new Date(ts).toLocaleDateString('zh-TW');
  }

  /* ------------------------------------------------------------ 搜尋 */
  function norm(s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
  var searchIndex = reg.buildings.map(function (b) {
    var d = districtById[b.district] || {};
    return {
      b: b,
      name: norm(b.name), en: norm(b.en), aliases: b.aliases.map(norm).concat([norm(b.id)]),
      district: norm((d.name || '') + ' ' + (d.en || '')),
      meta: norm([b.tagline].concat(b.features, b.links.map(function (l) { return l.label; })).join(' ')),
      desc: norm(b.desc),
    };
  });
  function scoreToken(e, t) {
    var s = 0;
    if (e.aliases.indexOf(t) >= 0) s = Math.max(s, 100);
    if (e.name === t) s = Math.max(s, 100);
    else if (e.name.indexOf(t) === 0) s = Math.max(s, 90);
    else if (e.name.indexOf(t) >= 0) s = Math.max(s, 80);
    if (e.en.indexOf(t) >= 0) s = Math.max(s, e.en.indexOf(t) === 0 ? 70 : 60);
    if (e.aliases.some(function (a) { return a.indexOf(t) === 0; })) s = Math.max(s, 65);
    if (e.district.indexOf(t) >= 0) s = Math.max(s, 45);
    if (e.meta.indexOf(t) >= 0) s = Math.max(s, 35);
    if (e.desc.indexOf(t) >= 0) s = Math.max(s, 18);
    return s;
  }
  function search(q) {
    var tokens = norm(q).split(' ').filter(Boolean);
    if (!tokens.length) return [];
    var res = [];
    searchIndex.forEach(function (e, i) {
      var total = 0;
      for (var k = 0; k < tokens.length; k++) {
        var s = scoreToken(e, tokens[k]);
        if (!s) return;
        total += s;
      }
      if (e.b.status === 'planned') total -= 5;
      res.push({ b: e.b, score: total, order: i });
    });
    res.sort(function (a, b) { return b.score - a.score || a.order - b.order; });
    return res;
  }

  /* ------------------------------------------------------------ IME 安全 Enter（注音／倉頡選字時的 Enter 不送出） */
  var ime = { composing: false, endAt: 0 };
  document.addEventListener('compositionstart', function () { ime.composing = true; }, true);
  document.addEventListener('compositionend', function () { ime.composing = false; ime.endAt = Date.now(); }, true);
  function isEnterSend(ev) {
    return ev.key === 'Enter' && !ev.isComposing && ev.keyCode !== 229 && !ime.composing && Date.now() - ime.endAt >= 150;
  }

  /* ------------------------------------------------------------ 事件、提示、複製 */
  var listeners = {};
  C.on = function (name, fn) { (listeners[name] = listeners[name] || []).push(fn); };
  C.emit = function (name, data) { (listeners[name] || []).forEach(function (fn) { try { fn(data); } catch (e) { /* 單一監聽失敗不影響其他 */ } }); };

  var toastTimer = 0;
  function toast(msg, kind) {
    var el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      el.setAttribute('role', 'status');
      el.setAttribute('aria-live', 'polite');
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.className = 'toast show ' + (kind || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'toast ' + (kind || ''); }, 2600);
  }
  function copyText(text) {
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return Promise.resolve(ok);
      } catch (e) { return Promise.resolve(false); }
    }
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, fallback);
    }
    return fallback();
  }

  /* ------------------------------------------------------------ ?go= 立即轉址（盡早執行，地圖不必畫） */
  function goTarget(search) {
    var go = qs('go', search);
    if (!go) return null;
    var b = building(go);
    if (!b) return { error: go };
    if (!isLive(b)) return { planned: b };
    var to = qs('to', search);
    return { b: b, url: to ? linkUrl(b, to) : primaryUrl(b) };
  }

  C.VERSION_KEY = 'okayell.campus';
  C.reg = reg;
  C.aliases = aliasMap;
  C.env = env;
  C.util = { esc: esc, qs: qs, clamp: clamp, normHash: normHash, stripHash: stripHash, timeAgo: timeAgo };
  C.building = building;
  C.district = district;
  C.districtOf = districtOf;
  C.isLive = isLive;
  C.primaryUrl = primaryUrl;
  C.publicUrl = publicUrl;
  C.linkUrl = linkUrl;
  C.localUrl = localUrl;
  C.campusHome = campusHome;
  C.shortUrl = shortUrl;
  C.recentVisits = recentVisits;
  C.recordVisit = recordVisit;
  C.search = search;
  C.isEnterSend = isEnterSend;
  C.toast = toast;
  C.copyText = copyText;
  C.goTarget = goTarget;
  C.registryError = window.CAMPUS_REGISTRY_ERROR || (raw ? '' : '找不到校園資料（registry）');

  var go = goTarget();
  if (go && go.url) {
    C.redirecting = go;
    document.documentElement.className += ' redirecting';
    recordVisit(go.b.id);
    window.location.replace(go.url);
  }
})();

</script>
</head>
<body>

      <g stroke="#4a3b2f" stroke-width="1.4" stroke-linejoin="round">
        <rect x="314" y="58" width="9" height="112" fill="#a0784f"/>

        <rect x="150" y="116" width="5" height="20" fill="#8a6d52"/><circle cx="152" cy="106" r="16" fill="#8cc077"/>
        <rect x="508" y="100" width="6" height="28" fill="#8a6d52"/><circle cx="511" cy="88" r="22" fill="#f6b8cf"/>

      <g fill="#fffdf8" opacity=".9"><ellipse cx="120" cy="36" rx="34" ry="11"/><ellipse cx="146" cy="30" rx="22" ry="10"/><ellipse cx="500" cy="44" rx="30" ry="10"/></g>
    </svg>
    <div class="nf-body">
      <div id="nfGo" hidden>
        <p class="going">🚌 正在前往 <span id="nfGoName"></span>…</p>
        <p class="muted">沒有自動跳轉？<a id="nfGoLink" href="#">點這裡前往</a></p>
      </div>
      <div id="nfMsg">
        <h1 id="nfTitle">找不到這棟建築</h1>
        <p id="nfText">你要找的網址不在校園地圖上，可能打錯字，或這間學院還沒開張。</p>
        <div class="sug" id="nfSug" hidden></div>
        <div class="acts">
          <a class="btn primary" id="nfHome" href="/">🗺️ 回到校園地圖</a>
          <a class="btn" id="nfSearch" href="/" hidden>🔍 在地圖上搜尋</a>
        </div>
        <details>
          <summary>所有建築與短網址</summary>
          <ul class="all" id="nfAll"></ul>
        </details>
      </div>

  <script>/* js/notfound.js */
/* 開心學園 · notfound.js — 404.html（okayell.github.io 使用者網站根目錄）
 *   依 registry 的 aliases／id／repo 名稱轉址：/nba → /nba-betting-iq/、/ta → /finance/#/track/ta、/english → /english-speak-listen/
 *   不分大小寫、容許結尾斜線與子路徑（/english/words → #/words）；/<學區> → 校園地圖 ?d=<學區>。
 *   找不到 → 「找不到這棟建築」頁，附相近建議與全部短網址。
 *   測試：?path=/nba 指定路徑（file:// 時必用），加 &dry=1 只顯示目標、不跳轉（window.CAMPUS_404 可讀結果）。
 *   防無限轉址：目標網址與目前頁面相同（例：該 repo 尚未發布），或 8 秒內重複轉往同一目標時停止。
 */
(function () {
  'use strict';
  var C = window.CAMPUS;
  if (!C || C.redirecting) return;
  var esc = C.util.esc;
  var qs = C.util.qs;
  var GUARD_KEY = 'okayell.campus.404guard.v1';
  var dry = qs('dry') === '1';

  function $(id) { return document.getElementById(id); }
  function dec(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }
  function normPath(p) { return String(p || '/').replace(/\/index\.html?$/i, '/').replace(/\/+$/, '').toLowerCase() || '/'; }

  var override = qs('path');
  var rawPath = override != null ? override : (C.env.mode === 'file' ? '' : window.location.pathname);
  var segs = String(rawPath).split('/').filter(Boolean).map(dec);
  if (segs.length && /^(index|404)\.html?$/i.test(segs[segs.length - 1])) segs.pop();
  var first = (segs[0] || '').toLowerCase().trim();
  var rest = segs.slice(1);
  if (first === 'go' && rest.length) { first = rest[0].toLowerCase(); rest = rest.slice(1); }

  var home = C.campusHome();
  $('nfHome').setAttribute('href', home);

  function samePage(target) {
    if (override != null) return false;
    try {
      var u = new URL(target, window.location.href);
      return u.origin === window.location.origin && normPath(u.pathname) === normPath(window.location.pathname);
    } catch (e) { return false; }
  }
  function guardHit(target) {
    try {
      var g = JSON.parse(window.sessionStorage.getItem(GUARD_KEY) || 'null');
      var now = Date.now();
      if (g && g.t === target && now - g.at < 8000 && g.n >= 2) return true;
      var n = g && g.t === target && now - g.at < 8000 ? g.n + 1 : 1;
      window.sessionStorage.setItem(GUARD_KEY, JSON.stringify({ t: target, at: now, n: n }));
    } catch (e) { /* 無痕模式：只靠 samePage 判斷 */ }
    return false;
  }
  function go(target, name) {
    window.CAMPUS_404 = { target: target, name: name, path: rawPath };
    $('nfMsg').hidden = true;
    $('nfGo').hidden = false;
    $('nfGoName').textContent = name;
    $('nfGoLink').setAttribute('href', target);
    document.title = '前往 ' + name + ' · 開心學園';
    if (dry) { $('nfGoName').textContent = name + '（測試模式：' + target + '）'; return; }
    window.location.replace(target);
  }
  function show(title, html) {
    $('nfTitle').textContent = title;
    $('nfText').innerHTML = html;
  }

  function renderAll() {
    $('nfAll').innerHTML = C.reg.buildings.filter(C.isLive).map(function (b) {
      return '<li><a href="' + esc(C.primaryUrl(b)) + '" data-visit="' + esc(b.id) + '">' + esc((b.icon || '') + ' ' + b.name) +
        '<small>' + esc(C.shortUrl(b)) + '</small></a></li>';
    }).join('');
  }
  function lev(a, b) {
    if (a === b) return 0;
    var m = a.length, n = b.length;
    if (!m || !n) return m || n;
    var prev = [], cur = [];
    for (var j = 0; j <= n; j++) prev[j] = j;
    for (var i = 1; i <= m; i++) {
      cur = [i];
      for (var k = 1; k <= n; k++) {
        cur[k] = Math.min(prev[k] + 1, cur[k - 1] + 1, prev[k - 1] + (a.charAt(i - 1) === b.charAt(k - 1) ? 0 : 1));
      }
      prev = cur;
    }
    return prev[n];
  }
  function suggest(q) {
    if (!q) return [];
    var seen = {}, out = [];
    Object.keys(C.aliases).forEach(function (k) {
      var id = C.aliases[k];
      var b = C.building(id);
      if (!b || !C.isLive(b) || seen[id]) return;
      var d = lev(q, k);
      var ok = d <= (k.length <= 3 ? 1 : 2) || (q.length >= 2 && (k.indexOf(q) === 0 || q.indexOf(k) === 0));
      if (ok) { seen[id] = 1; out.push({ b: b, d: d }); }
    });
    C.search(q).slice(0, 3).forEach(function (r) {
      if (!seen[r.b.id] && C.isLive(r.b)) { seen[r.b.id] = 1; out.push({ b: r.b, d: 9 }); }
    });
    out.sort(function (x, y) { return x.d - y.d; });
    return out.slice(0, 4).map(function (x) { return x.b; });
  }

  renderAll();
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-visit]') : null;
    if (t) C.recordVisit(t.getAttribute('data-visit'));
  });

  var b = first ? C.building(first) : null;
  var dist = !b && first ? C.district(first) : null;
  if (b && C.isLive(b)) {
    var target = C.primaryUrl(b);
    var to = qs('to');
    var sub = rest.join('/').replace(/\/+$/, '');
    if (to) target = C.linkUrl(b, to);
    else if (sub) {
      var want = '#/' + sub.toLowerCase();
      var hit = b.links.filter(function (l) { return String(l.hash || '').toLowerCase() === want; })[0];
      if (hit) target = C.linkUrl(b, hit.hash);
    } else if (window.location.hash && window.location.hash.length > 2 && target.indexOf('#') < 0) {
      target += window.location.hash;
    }
    if (samePage(target) || guardHit(target)) {
      window.CAMPUS_404 = { target: null, blocked: target, path: rawPath };
      show('🚧 ' + b.name + ' 還沒搬進這個網址', '這間' + (b.kind === 'arena' ? '實戰館' : '學院') + '的網址 <code>' + esc(target) +
        '</code> 目前還沒有上線（可能還沒發布到 GitHub Pages）。先回校園地圖看看其他建築吧！');
      $('nfHome').setAttribute('href', home + (home.indexOf('?') >= 0 ? '&' : '?') + 'b=' + encodeURIComponent(b.id));
    } else {
      go(target, (b.icon ? b.icon + ' ' : '') + b.name);
    }
  } else if (b) {
    window.CAMPUS_404 = { target: null, planned: b.id, path: rawPath };
    show('🚧 ' + b.name + ' 建設中', esc(b.desc || b.tagline || '這間學院還在規劃中') + '，敬請期待！');
    $('nfHome').setAttribute('href', home + (home.indexOf('?') >= 0 ? '&' : '?') + 'b=' + encodeURIComponent(b.id));
  } else if (dist) {
    go(home + (home.indexOf('?') >= 0 ? '&' : '?') + 'd=' + encodeURIComponent(dist.id), (dist.icon ? dist.icon + ' ' : '') + dist.name);
  } else {
    window.CAMPUS_404 = { target: null, notFound: true, path: rawPath };
    var label = segs.length ? '/' + segs.join('/') : '';
    if (label) show('找不到這棟建築', '網址 <code>' + esc(label) + '</code> 不在校園地圖上，可能打錯字，或這間學院還沒開張。');
    var sug = suggest(first);
    if (sug.length) {
      var box = $('nfSug');
      box.hidden = false;
      box.innerHTML = '<p class="muted" style="width:100%;margin:0">你是不是要找：</p>' + sug.map(function (x) {
        return '<a href="' + esc(C.primaryUrl(x)) + '" data-visit="' + esc(x.id) + '">' + esc((x.icon || '') + ' ' + x.name) + '</a>';
      }).join('');
    }
    if (first) {
      var s = $('nfSearch');
      s.hidden = false;
      s.setAttribute('href', home + (home.indexOf('?') >= 0 ? '&' : '?') + 'q=' + encodeURIComponent(first));
    }
  }
})();

</script>
