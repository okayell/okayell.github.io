  const jp = JA.jp;
  const esc = JA.esc;
  const ST = { new: ['新字', 'info'], learning: ['學習中', 'warn'], mastered: ['已熟記', 'ok'] };

  function srcLabel(v) {
    if (!v.src) return '';
    if (String(v.src).startsWith('words:')) return `<a href="${JA.hashFor('words', [], { level: v.src.slice(6) })}">🔤 單字庫 ${esc(v.src.slice(6))}</a>`;
    const L = JA.lesson(v.src);
    return L ? `<a href="#/lesson/${esc(L.id)}">📖 ${esc(jp.surface(L.title))}</a>` : '';
  }
  JA.vocabRowHtml = (v) => {
    const s = JA.vocab.status(v);
    const due = (v.srs && v.srs.due) || 0;
    return `<div class="vrow" data-key="${esc(v.key)}">
      <div class="vr-head"><b class="vr-w ja-txt">${JA.ruby(v.w || v.key.split('|')[0])}</b><span class="ro">${esc(jp.romaji(v.w || ''))}</span>
        ${v.pos ? `<span class="chip">${esc(v.pos)}</span>` : ''}
        <button type="button" class="icon-btn" data-say="${esc(jp.surface(v.w || ''))}" title="發音">🔊</button>
        <span class="vr-st chip ${ST[s][1]}">${ST[s][0]}${s !== 'new' ? ` · ${due <= Date.now() ? '該複習了' : JA.fmtRel(due)}` : ''}</span>
        <span class="vr-acts"><button type="button" class="icon-btn" data-edit title="編輯">✏️</button><button type="button" class="icon-btn" data-del title="刪除">🗑</button></span></div>
      <div class="vr-zh">${v.zh ? esc(v.zh) : '<span class="muted">（還沒有中文意思，按 ✏️ 補上）</span>'}</div>
      ${v.ex ? `<div class="vr-ex"><button type="button" class="icon-btn sm" data-say="${esc(jp.surface(v.ex))}">▶</button><div><span class="ja-txt">${JA.ruby(v.ex)}</span>
        ${v.ex_zh ? `<div class="muted small">${esc(v.ex_zh)}</div>` : ''}</div></div>` : ''}
      <div class="vr-meta">${v.lvl ? JA.lvlBadge(v.lvl) : ''}${srcLabel(v)}<span>加入於 ${JA.fmtDate(v.added)}</span>
        ${v.note ? `<span class="vr-note">📝 ${esc(v.note)}</span>` : ''}</div></div>`;
  };

  /** 輸入的單字＋讀音 → 標記格式：已含 {…|…} 就照用；漢字詞給了讀音就整組標成 {漢字|讀音}。 */
  function toMarkup(word, reading) {
    const w = String(word || '').trim();
    const r = jp.toHira(String(reading || '').trim());
    if (!w || w.includes('{') || !jp.hasKanji(w) || !r) return w;
    return `{${w}|${r}}`;
  }
  function editModal(v, onDone) {
    const isNew = !v;
    v = v || { w: '', zh: '', pos: '', ex: '', ex_zh: '', note: '' };
    const m = JA.modal({
      title: isNew ? '＋ 新增單字' : `✏️ 編輯：${esc(jp.surface(v.w))}`,
      body: `<div class="form">
        <div class="row2"><label class="field"><span>單字</span><div class="row"><input type="text" id="vfW" lang="ja" value="${esc(isNew ? '' : jp.surface(v.w))}" ${isNew ? '' : 'disabled'} autocomplete="off" placeholder="例如：勉強">
            ${isNew ? '<button type="button" class="btn sm" id="vfLookup">🔍 查詢</button>' : ''}</div></label>
          <label class="field"><span>讀音（平假名，可打羅馬拼音）</span><input type="text" id="vfR" lang="ja" value="${esc(isNew ? '' : jp.reading(v.w))}" ${isNew ? '' : 'disabled'} placeholder="べんきょう／benkyou"></label></div>
        <div class="row2"><label class="field"><span>中文意思</span><input type="text" id="vfZh" value="${esc(v.zh || '')}" autocomplete="off"></label>
          <label class="field"><span>詞性</span><input type="text" id="vfPos" value="${esc(v.pos || '')}" placeholder="名詞 / 動詞 / い形容詞 …"></label></div>
        <label class="field"><span>例句（可用 {漢字|かな} 標振假名）</span><textarea id="vfEx" rows="2" lang="ja">${esc(v.ex || '')}</textarea></label>
        <label class="field"><span>例句翻譯</span><input type="text" id="vfExZh" value="${esc(v.ex_zh || '')}"></label>
        <label class="field"><span>筆記</span><input type="text" id="vfNote" value="${esc(v.note || '')}" placeholder="例如：常和「に」一起用"></label>
        <div id="vfMsg" class="muted small"></div></div>`,
      actions: [
        { label: '取消' },
        {
          label: isNew ? '⭐ 加入單字本' : '💾 儲存',
          primary: true,
          onClick: (api) => {
            const g = (id) => JA.$(id, api.el).value.trim();
            const raw = g('#vfR');
            const reading = /[a-z]/i.test(raw) ? jp.romajiToKana(raw) : raw;
            const w = isNew ? toMarkup(g('#vfW'), reading) : v.w;
            if (!w) { JA.toast('請輸入單字'); return true; }
            const data = { w, zh: g('#vfZh'), pos: g('#vfPos'), ex: g('#vfEx'), ex_zh: g('#vfExZh'), note: g('#vfNote') };
            if (isNew) {
              if (JA.vocab.has(w)) JA.vocab.update(w, data);
              else JA.vocab.save({ ...data, lvl: JA.settings().level || '' });
              JA.toast(`⭐ 已加入：${jp.surface(w)}`, 'ok');
            } else {
              JA.vocab.update(v.key, data);
              JA.toast('💾 已儲存', 'ok');
            }
            if (onDone) onDone();
            return false;
          },
        },
      ],
    });
    const lk = JA.$('#vfLookup', m.el);
    if (lk) {
      const run = () => {
        const w = JA.$('#vfW', m.el).value.trim();
        if (!w) return;
        const msg = JA.$('#vfMsg', m.el);
        const hit = JA.WORD_INDEX && (JA.words(), JA.WORD_INDEX.get(w));
        const lv = JA.VOCAB_INDEX.get(w);
        const e = hit || (lv && lv.entry);
        if (!e) { msg.textContent = '單字庫和課程裡找不到，請自行填寫。'; return; }
        const set = (id, val) => { const el = JA.$(id, m.el); if (val && !el.value) el.value = val; };
        set('#vfR', jp.reading(e.w)); set('#vfZh', e.zh); set('#vfPos', e.pos); set('#vfEx', e.ex); set('#vfExZh', e.ex_zh);
        msg.textContent = `✓ 已從${hit ? `單字庫（${hit.level}）` : '課程單字'}帶入`;
      };
      lk.onclick = run;
      JA.$('#vfW', m.el).addEventListener('keydown', (e) => { if (JA.isEnterSend(e)) { e.preventDefault(); run(); } });
      setTimeout(() => JA.$('#vfW', m.el).focus(), 50);
    }
  }

  function exportCsv(list) {
    const q = (s) => `"${String(s == null ? '' : s).replace(/"/g, '""')}"`;
    const rows = [['word', 'reading', 'romaji', 'pos', 'chinese', 'example', 'example_zh', 'level', 'status', 'added', 'next_review']];
    list.forEach((v) => rows.push([jp.surface(v.w), jp.reading(v.w), jp.romaji(v.w), v.pos, v.zh, jp.surface(v.ex || ''), v.ex_zh, v.lvl,
      JA.vocab.status(v), JA.fmtDate(v.added), JA.fmtDate(v.srs && v.srs.due)]));
    const blob = new Blob(['\ufeff' + rows.map((r) => r.map(q).join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `japanese_vocab_${JA.todayKey()}.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  JA.route('vocab', (main, params, query) => {
    const f = { q: query.q || '', st: query.st || 'all', sort: 'added' };
    main.innerHTML = `<div class="page-hd"><div><h1>📒 單字本</h1><p class="muted" id="vbSummary"></p></div>
        <div class="page-acts"><a class="btn primary" href="#/review" id="vbReview">🧠 開始複習</a>
        <button type="button" class="btn" id="vbAdd">＋ 新增</button><button type="button" class="btn ghost" id="vbExport">⬇ 匯出 CSV</button></div></div>
      <div class="card lib-toolbar">
        <input type="search" id="vbQ" placeholder="🔍 搜尋單字、讀音、中文、例句…" value="${esc(f.q)}" autocomplete="off">
        <div class="seg" id="vbSt">${[['all', '全部'], ['due', '⏰ 該複習'], ['new', '新字'], ['learning', '學習中'], ['mastered', '已熟記']].map(([k, t]) =>
          `<button type="button" data-st="${k}" class="${f.st === k ? 'active' : ''}">${t} <small data-n="${k}"></small></button>`).join('')}</div>
        <select id="vbSort"><option value="added">最新加入</option><option value="kana">五十音順</option><option value="due">下次複習</option><option value="level">等級</option></select>
      </div>
      <div class="vocab-list ${JA.settings().showRomaji ? '' : 'no-ro'} ${JA.settings().showFuri === false ? 'no-furi' : ''}" id="vbList"></div>`;
    const listEl = JA.$('#vbList', main);
    const render = () => {
      const all = JA.vocab.list();
      const now = Date.now();
      const counts = { all: all.length, due: 0, new: 0, learning: 0, mastered: 0 };
      all.forEach((v) => { counts[JA.vocab.status(v)]++; if (((v.srs && v.srs.due) || 0) <= now) counts.due++; });
      JA.$$('[data-n]', main).forEach((s) => { s.textContent = counts[s.dataset.n]; });
      JA.$('#vbSummary', main).textContent = all.length
        ? `共 ${all.length} 個 · ${counts.due} 個該複習 · ${counts.mastered} 個已熟記（複習間隔超過 21 天）`
        : '在課文裡點漢字詞 → ⭐ 加入單字本，或到「🔤 單字學習」每天學新字；系統會在你快忘記時提醒複習。';
      JA.$('#vbReview', main).textContent = counts.due ? `🧠 開始複習（${counts.due}）` : '🧠 複習 / 測驗';
      const q = f.q.trim().toLowerCase();
      const qk = q ? jp.toHira(jp.romajiToKana(q)) : '';
      let list = all.filter((v) => (f.st === 'all' || (f.st === 'due' ? ((v.srs && v.srs.due) || 0) <= now : JA.vocab.status(v) === f.st)) &&
        (!q || [jp.surface(v.w || ''), jp.reading(v.w || ''), jp.romaji(v.w || ''), v.zh, jp.surface(v.ex || ''), v.note].join(' ').toLowerCase().includes(q) ||
          (qk && jp.toHira(jp.reading(v.w || '')).includes(qk))));
      if (f.sort === 'kana') list = list.sort((a, b) => jp.toHira(jp.reading(a.w || '')).localeCompare(jp.toHira(jp.reading(b.w || '')), 'ja'));
      else if (f.sort === 'due') list = list.sort((a, b) => ((a.srs && a.srs.due) || 0) - ((b.srs && b.srs.due) || 0));
      else if (f.sort === 'level') list = list.sort((a, b) => (JA.LV_ORDER[a.lvl] ?? 9) - (JA.LV_ORDER[b.lvl] ?? 9));
      listEl.innerHTML = list.length ? list.slice(0, 400).map(JA.vocabRowHtml).join('') + (list.length > 400 ? '<p class="muted">只顯示前 400 筆，請用搜尋縮小範圍。</p>' : '')
        : all.length ? '<div class="card empty"><div class="empty-ic">🔎</div><h3>沒有符合的單字</h3></div>'
          : `<div class="card empty"><div class="empty-ic">📒</div><h3>單字本還是空的</h3>
            <p class="muted">到「🔤 單字學習」按 <b>✨ 今日新字</b>，或在課文裡點漢字詞 → <b>⭐ 加入單字本</b>。</p>
            <a class="btn primary" href="#/words">🔤 去學單字</a> <a class="btn" href="#/library">📚 看課程</a></div>`;
    };
    JA.$('#vbSt', main).onclick = (e) => {
      const b = e.target.closest('[data-st]');
      if (!b) return;
      f.st = b.dataset.st;
      JA.$$('#vbSt button', main).forEach((x) => x.classList.toggle('active', x === b));
      render();
    };
    JA.$('#vbSort', main).onchange = (e) => { f.sort = e.target.value; render(); };
    JA.$('#vbQ', main).addEventListener('input', JA.debounce((e) => { f.q = e.target.value; render(); }, 150));
    JA.$('#vbAdd', main).onclick = () => editModal(null, render);
    JA.$('#vbExport', main).onclick = () => { const l = JA.vocab.list(); if (!l.length) { JA.toast('單字本是空的'); return; } exportCsv(l); };
    listEl.addEventListener('click', async (e) => {
      const row = e.target.closest('.vrow');
      if (!row) return;
      const v = JA.vocab.list().find((x) => x.key === row.dataset.key);
      if (!v) return;
      if (e.target.closest('[data-edit]')) editModal(v, render);
      else if (e.target.closest('[data-del]')) {
        if (await JA.confirm(`從單字本刪除「${esc(jp.surface(v.w))}」？`, '刪除')) { JA.vocab.remove(v.key); render(); }
      }
    });
    const onVocab = () => { if (JA.curRoute && JA.curRoute.name === 'vocab') render(); };
    JA.on('vocab', onVocab);
    JA.onCleanup(() => JA.off('vocab', onVocab));
    render();
  });
})();

</script>
  <script>/* /js/review.js */
/* 日語學院 Japanese Academy — review.js
 * 🧠 複習 (#/review)：🃏 單字卡（SM-2 間隔重複）、🎯 選意思、👂 聽音選字、⌨️ 打讀音、🧩 例句填空、🎤 說說看，
 * 外加「あ 假名複習」入口。題目來源：我的單字本 / 讀過的課程單字 / 我的等級單字庫。單字本裡的字會依作答結果更新排程。
 */
(function () {
  'use strict';
  const JA = window.JA;
  const jp = JA.jp;
  const esc = JA.esc;
  const MODES = [
    { k: 'cards', ic: '🃏', t: '單字卡', d: '間隔重複：快忘記時剛好複習，記得越牢間隔越長（只用單字本）' },
    { k: 'meaning', ic: '🎯', t: '選意思', d: '看日文單字，選出正確的中文意思' },
    { k: 'listen', ic: '👂', t: '聽音選字', d: '只聽發音，選出你聽到的單字' },
    { k: 'reading', ic: '⌨️', t: '打讀音', d: '看中文與漢字，打出讀音（假名或羅馬拼音都可以）' },
    { k: 'cloze', ic: '🧩', t: '例句填空', d: '在例句裡選出缺少的單字' },
    { k: 'speak', ic: '🎤', t: '說說看', d: '看中文，用日語說出來（語音辨識評分）' },
  ];
  const SOURCES = [['book', '我的單字本'], ['studied', '讀過的課程單字'], ['level', '我的等級單字庫']];

  function itemOf(v, extra) {
    const w = v.w || '';
    return { key: JA.vocab.key(w), w, s: jp.surface(w), r: jp.reading(w), zh: v.zh, pos: v.pos, ex: v.ex, ex_zh: v.ex_zh, lvl: v.lvl || v.level, ...(extra || {}) };
  }
  function poolOf(src) {
    if (src === 'book') return JA.vocab.list().filter((v) => v.w).map((v) => itemOf(v, { inBook: true, srs: v.srs }));
    const out = [];
    const seen = new Set();
    const lv = JA.settings().level || 'A1';
    if (src === 'level') {
      JA.words(lv).forEach((w) => { if (!seen.has(w.key)) { seen.add(w.key); out.push(itemOf(w, { inBook: JA.vocab.has(w.key), lvl: w.level })); } });
      return out;
    }
    JA.lessons().forEach((L) => {
      if (!JA.prog(L.id).last) return;
      (L.vocab || []).forEach((v) => {
        const k = JA.vocab.key(v.w);
        if (seen.has(k) || !v.zh) return;
        seen.add(k);
        const line = JA.LUI.lineWith(L, v);
        out.push(itemOf({ ...v, ex: line ? line.ja : '', ex_zh: line ? line.zh : '' }, { inBook: JA.vocab.has(v.w), lvl: L.level, src: L.id }));
      });
    });
    return out;
  }
  function globalPool() {
    return JA.words().map((w) => itemOf(w));
  }
  function distractors(item, pool, field, n) {
    const val = (x) => (field === 'zh' ? x.zh : x.s);
    const want = val(item);
    const out = [];
    for (const c of [...JA.shuffle(pool), ...JA.shuffle(globalPool())]) {
      const v = val(c);
      if (v && v !== want && !out.includes(v) && !(field === 's' && jp.toHira(c.r) === jp.toHira(item.r))) out.push(v);
      if (out.length >= n) break;
    }
    return out;
  }
  /** 例句中實際出現的單字形式（動詞 / 形容詞可變化）。 */
  function clozeOf(item) {
    if (!item.ex) return null;
    const ex = jp.surface(item.ex);
    const forms = JA.LUI.vocabForms({ w: item.w, pos: item.pos });
    for (const f of forms) {
      const at = ex.indexOf(f);
      if (at >= 0 && f.length >= 1) return { answer: f, before: ex.slice(0, at), after: ex.slice(at + f.length) };
    }
    return null;
  }
  function gradeBook(item, ok) {
    if (!item.inBook) return;
    const v = JA.vocab.get(item.key);
    if (!v) return;
    if (!ok) JA.vocab.grade(item.key, 1);
    else if (((v.srs && v.srs.due) || 0) <= Date.now()) JA.vocab.grade(item.key, 4);
  }
  const acceptReading = (item, val) => {
    const t = String(val || '').trim();
    if (!t) return false;
    const asKana = /[a-z]/i.test(t) ? jp.romajiToKana(t.toLowerCase().replace(/\s+/g, '')) : t;
    const norm = (x) => jp.expandLong(jp.normalize(x));
    return norm(asKana) === norm(item.r) || norm(t) === norm(item.s);
  };

  JA.route('review', (main, params, query) => {
    let src = query.src || (JA.vocab.list().length ? 'book' : 'level');
    const asrOk = JA.asr.status().ok;
    let keyHandler = null;
    const setKey = (fn) => {
      if (keyHandler) document.removeEventListener('keydown', keyHandler);
      keyHandler = fn;
      if (fn) document.addEventListener('keydown', fn);
    };
    JA.onCleanup(() => setKey(null));
    const view = () => `${JA.settings().showRomaji ? '' : 'no-ro'}`;
    function menu() {
      setKey(null);
      JA.tts.stop();
      JA.asr.abort();
      const book = JA.vocab.list();
      const due = JA.vocab.due(book);
      const pool = poolOf(src);
      const kStats = JA.kanaApi ? JA.kanaApi.stats() : { due: 0, seen: 0 };
      main.innerHTML = `<div class="page-hd"><div><h1>🧠 複習・測驗</h1>
          <p class="muted">${book.length ? `單字本 ${book.length} 個，<b>${due.length}</b> 個到期該複習。` : '單字本還是空的，可以先用等級單字庫練習。'}間隔重複會在你快忘記時安排複習，比死背更有效。</p></div></div>
        <a class="card kana-review-link ${kStats.due ? 'due' : ''}" href="#/kana/quiz?type=pick&scope=due&s=mix">
          <span class="kr-ic">あ</span><span><b>假名複習</b><small>${kStats.seen ? (kStats.due ? `${kStats.due} 個假名到期，練一下就記牢` : '假名都複習完了，再來一輪？') : '還沒開始學五十音 → 從清音開始'}</small></span>
          <span class="chip ${kStats.due ? 'warn' : 'ok'}">${kStats.due ? `${kStats.due} 個到期` : '開始'}</span></a>
        <div class="card src-bar"><span class="fr-lbl">題目來源</span><div class="seg" id="rvSrc">${SOURCES.map(([k, t]) =>
          `<button type="button" data-src="${k}" class="${k === src ? 'active' : ''}">${t} <small>${poolOf(k).length}</small></button>`).join('')}</div></div>
        <div class="rv-modes">${MODES.map((m) => {
          const disabled = (m.k === 'cards' && !book.length) || (m.k === 'speak' && !asrOk) || (m.k !== 'cards' && pool.length < 2);
          const badge = m.k === 'cards' ? (book.length ? `<span class="chip ${due.length ? 'warn' : 'ok'}">${due.length ? `${due.length} 個到期` : '今天複習完了'}</span>` : '<span class="chip">需要單字本</span>')
            : m.k === 'speak' && !asrOk ? '<span class="chip">需要麥克風</span>' : '';
          return `<button type="button" class="rv-mode ${disabled ? 'disabled' : ''}" data-mode="${m.k}" ${disabled ? 'disabled' : ''}>
            <span class="rv-ic">${m.ic}</span><b>${m.t}</b><span class="muted">${m.d}</span>${badge}</button>`;
        }).join('')}</div>
        ${!asrOk ? JA.micHelpHtml() : ''}
        ${!book.length ? `<div class="card tip-card"><b>📒 如何把單字加入單字本？</b><p>到「🔤 單字學習」按 <b>✨ 今日新字</b>，或在課文裡點漢字詞 → ⭐ 加入單字本；也可以在課程的「📒 單字・文法」分頁按「⭐ 全部加入單字本」。</p></div>` : ''}`;
      JA.$('#rvSrc', main).onclick = (e) => { const b = e.target.closest('[data-src]'); if (b) { src = b.dataset.src; menu(); } };
      JA.$('.rv-modes', main).onclick = (e) => { const b = e.target.closest('[data-mode]'); if (b && !b.disabled) start(b.dataset.mode); };
    }

    function start(mode) {
      if (mode === 'cards') return cards();
      const pool = poolOf(src);
      const book = src === 'book';
      const now = Date.now();
      const ordered = book ? [...pool].sort((a, b) => ((a.srs && a.srs.due) || 0) - ((b.srs && b.srs.due) || 0)) : JA.shuffle(pool);
      const prio = book ? ordered.filter((x) => ((x.srs && x.srs.due) || 0) <= now) : [];
      let items = [...prio, ...JA.shuffle(ordered.filter((x) => !prio.includes(x)))].slice(0, 10);
      if (mode === 'cloze') {
        const withEx = pool.filter((x) => clozeOf(x));
        if (withEx.length < 2) { JA.toast('有例句的單字太少，改用選意思'); mode = 'meaning'; } else items = JA.shuffle(withEx).slice(0, 10);
      }
      quiz(mode, JA.shuffle(items), pool);
    }
    function shell(title, n) {
      main.innerHTML = `<div class="rv-session ${view()}"><div class="rv-top"><button type="button" class="btn sm ghost" id="rvBack">← 返回</button>
        <b>${title}</b><span class="muted" id="rvCount"></span></div><div class="rv-bar"><i id="rvBar"></i></div>
        <div class="card rv-card" id="rvCard"></div></div>`;
      JA.$('#rvBack', main).onclick = () => { JA.tts.stop(); JA.asr.abort(); menu(); };
      return { card: JA.$('#rvCard', main), progress: (i) => { JA.$('#rvCount', main).textContent = `${Math.min(i + 1, n)} / ${n}`; JA.$('#rvBar', main).style.width = `${(i / n) * 100}%`; } };
    }
    function summary(card, title, results, again) {
      const ok = results.filter((r) => r.ok).length;
      const pct = results.length ? Math.round((ok / results.length) * 100) : 0;
      const wrong = results.filter((r) => !r.ok);
      card.innerHTML = `<div class="quiz-done"><div class="score-ring big ${pct >= 80 ? 'ok' : pct >= 60 ? 'warn' : 'bad'}" style="--p:${pct}"><b>${pct}</b><small>分</small></div>
        <h3>${title}</h3><p class="muted">答對 ${ok} / ${results.length}</p>
        ${wrong.length ? `<div class="wrong-list"><b>要再加強的單字</b>${wrong.map((r) => `<div class="wl-row"><button type="button" class="icon-btn sm" data-say="${esc(r.item.s)}">🔊</button>
          <b class="ja-txt">${JA.ruby(r.item.w)}</b><span>${esc(r.item.zh || '')}</span>${r.item.inBook || JA.vocab.has(r.item.key) ? '' : `<button type="button" class="btn xs" data-addw="${esc(r.item.key)}">⭐ 加入單字本</button>`}</div>`).join('')}</div>` : ''}
        <div class="q-nav"><button type="button" class="btn primary" id="rvAgain">⟳ 再來一輪</button><button type="button" class="btn" id="rvMenu">換個模式</button></div></div>`;
      JA.$('#rvAgain', card).onclick = again;
      JA.$('#rvMenu', card).onclick = menu;
      card.onclick = (e) => {
        const b = e.target.closest('[data-addw]');
        if (!b) return;
        const r = wrong.find((x) => x.item.key === b.dataset.addw);
        if (r) { JA.vocab.save({ w: r.item.w, zh: r.item.zh, pos: r.item.pos, ex: r.item.ex, ex_zh: r.item.ex_zh, lvl: r.item.lvl }); b.replaceWith(document.createTextNode('✓')); JA.toast(`⭐ 已加入：${r.item.s}`, 'ok'); }
      };
    }

    // 🃏 單字卡
    function cards() {
      const now = Date.now();
      const book = JA.vocab.list().filter((v) => v.w);
      let queue = book.filter((v) => ((v.srs && v.srs.due) || 0) <= now).sort((a, b) => ((a.srs && a.srs.due) || 0) - ((b.srs && b.srs.due) || 0)).slice(0, 30);
      let extra = false;
      if (!queue.length) { queue = JA.shuffle(book).slice(0, 15); extra = true; }
      const n = queue.length;
      const { card, progress } = shell(extra ? '🃏 單字卡（額外練習：今天沒有到期的字）' : '🃏 單字卡', n);
      const results = [];
      let i = 0;
      let flipped = false;
      const ivlText = (v, q) => {
        if (q < 3) return '10 分鐘';
        const s = JA.sm2(v.srs, q);
        return s.ivl >= 30 ? `${Math.round(s.ivl / 30)} 個月` : `${s.ivl} 天`;
      };
      function render() {
        if (i >= queue.length) { summary(card, '🃏 這輪複習完成！', results, cards); return; }
        progress(Math.min(i, n - 1));
        const v = JA.vocab.get(queue[i].key) || queue[i];
        const it = itemOf(v);
        card.innerHTML = `<div class="flash ${flipped ? 'flipped' : ''}">
          <div class="fl-front"><div class="fl-w ja-txt ${flipped ? '' : 'no-furi'}">${JA.ruby(it.w)}</div>
            <div class="fl-acts"><button type="button" class="icon-btn lg" data-say="${esc(it.s)}">🔊</button></div>
            ${!flipped ? '<button type="button" class="btn primary big" id="flFlip">顯示答案 <small>（空白鍵）</small></button><p class="muted small">先試著回想讀音和意思，再翻面</p>' : ''}</div>
          ${flipped ? `<div class="fl-back"><div class="ro">${esc(jp.romaji(it.w))}</div><div class="fl-zh">${esc(it.zh || '（沒有中文意思）')}</div>
            ${it.ex ? `<div class="vr-ex"><button type="button" class="icon-btn sm" data-say="${esc(jp.surface(it.ex))}">▶</button><div><span class="ja-txt">${JA.ruby(it.ex)}</span>${it.ex_zh ? `<div class="muted small">${esc(it.ex_zh)}</div>` : ''}</div></div>` : ''}
            <div class="fl-grades">${[[0, '😵 忘記了', 'bad'], [3, '😅 有點難', 'warn'], [4, '🙂 記得', 'info'], [5, '😎 很簡單', 'ok']].map(([q, t, c], k) =>
              `<button type="button" class="grade ${c}" data-q="${q}"><b>${t}</b><small>${ivlText(v, q)} · ${k + 1}</small></button>`).join('')}</div></div>` : ''}
        </div>`;
        if (!flipped) JA.tts.speak(it.w);
      }
      const flip = () => { if (!flipped && i < queue.length) { flipped = true; render(); } };
      const grade = (q) => {
        const v = queue[i];
        JA.vocab.grade(v.key, q);
        results.push({ item: itemOf(v, { inBook: true }), ok: q >= 3 });
        JA.addXP(1, 'review');
        if (q < 3 && queue.filter((x) => x.key === v.key).length < 2) queue.push(v);
        i++;
        flipped = false;
        render();
      };
      card.addEventListener('click', (e) => {
        if (e.target.closest('#flFlip')) flip();
        const g = e.target.closest('[data-q]');
        if (g) grade(+g.dataset.q);
      });
      setKey((e) => {
        if (e.target.closest('input,textarea')) return;
        if (e.code === 'Space') { e.preventDefault(); flip(); } else if (flipped && /^[1-4]$/.test(e.key)) grade([0, 3, 4, 5][+e.key - 1]);
      });
      render();
    }

    // 🎯👂⌨️🧩🎤 測驗
    function quiz(mode, items, pool) {
      const meta = MODES.find((m) => m.k === mode);
      const n = items.length;
      const { card, progress } = shell(`${meta.ic} ${meta.t}`, n);
      const results = [];
      let i = 0;
      let answered = false;
      const finish = (ok, item) => {
        answered = true;
        results.push({ item, ok });
        gradeBook(item, ok);
        if (ok) JA.addXP(2, 'review');
        const nx = JA.$('#qNext', card);
        if (nx) { nx.hidden = false; nx.focus({ preventScroll: true }); }
      };
      const answerBox = (item, ok, extra) => `<div class="${ok ? 'ok-txt' : 'bad-txt'}">${ok ? '✅ 答對了！' : '❌ 答錯了'}</div>
        <div class="rv-ans"><button type="button" class="icon-btn sm" data-say="${esc(item.s)}">🔊</button><b class="ja-txt">${JA.ruby(item.w)}</b><span class="ro">${esc(jp.romaji(item.w))}</span><span>${esc(item.zh || '')}</span></div>${extra || ''}`;
      function render() {
        if (i >= n) { summary(card, `${meta.ic} ${meta.t} 完成！`, results, () => start(mode)); return; }
        progress(i);
        answered = false;
        const item = items[i];
        let body = '';
        if (mode === 'meaning' || mode === 'listen' || mode === 'cloze') {
          const field = mode === 'meaning' ? 'zh' : 's';
          const opts = JA.shuffle([item[field], ...distractors(item, pool, field, 3)]);
          item._opts = opts;
          item._ans = opts.indexOf(item[field]);
          if (mode === 'meaning') body = `<div class="rv-prompt"><div class="fl-w ja-txt">${JA.ruby(item.w)}</div><button type="button" class="icon-btn" data-say="${esc(item.s)}">🔊</button></div>`;
          else if (mode === 'listen') body = `<div class="rv-prompt"><button type="button" class="btn primary big" data-say="${esc(item.s)}">🔊 再聽一次</button><button type="button" class="btn" data-say="${esc(item.s)}" data-slow="1">🐢 慢速</button></div>`;
          else {
            const cz = clozeOf(item);
            body = `<div class="rv-cloze ja-txt">${esc(cz.before)}<span class="blank">${'＿'.repeat(Math.max(2, cz.answer.length))}</span>${esc(cz.after)}</div><div class="muted">${esc(item.ex_zh || item.zh || '')}</div>`;
          }
          body += `<div class="opts">${opts.map((o, k) => `<button type="button" class="opt" data-k="${k}"><span class="opt-k">${k + 1}</span><span class="${field === 's' ? 'ja-txt' : ''}">${esc(o)}</span></button>`).join('')}</div>`;
        } else if (mode === 'reading') {
          body = `<div class="rv-prompt"><div class="fl-zh">${esc(item.zh || '')}</div></div><div class="rv-kanji ja-txt">${esc(item.s)}</div>
            <div class="muted small">打出讀音：假名或羅馬拼音（例：${esc(jp.romaji(item.w).slice(0, 1))}…）</div>
            <div class="rv-input"><input type="text" id="rvIn" lang="ja" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="讀音…（Enter 送出）"><button type="button" class="btn primary" id="rvCheck">✔ 檢查</button></div>`;
        } else if (mode === 'speak') {
          body = `<div class="rv-prompt"><div class="fl-zh">${esc(item.zh || '')}</div></div><div class="muted small">用日語說出這個字（${jp.toHira(item.r).length} 個假名）</div>
            <div class="rv-input"><button type="button" class="btn primary big mic" id="rvMic">🎤 說出日語</button><button type="button" class="btn ghost" id="rvGive">🤷 我不知道</button></div><div class="sh-live" id="rvLive"></div>`;
        }
        card.innerHTML = `${body}<div class="q-exp" id="rvExp"></div><div class="q-nav"><button type="button" class="btn primary" id="qNext" hidden>${i === n - 1 ? '看結果' : '下一題 →'}</button></div>`;
        if (mode === 'listen') setTimeout(() => JA.tts.speak(item.w), 150);
        if (mode === 'meaning') JA.tts.speak(item.w);
        const inp = JA.$('#rvIn', card);
        if (inp) {
          setTimeout(() => inp.focus({ preventScroll: true }), 50);
          inp.addEventListener('keydown', (e) => { if (JA.isEnterSend(e)) { e.preventDefault(); if (answered) next(); else checkInput(); } });
        }
      }
      function checkInput() {
        const item = items[i];
        const val = JA.$('#rvIn', card).value;
        if (!val.trim()) return;
        const ok = acceptReading(item, val);
        JA.$('#rvIn', card).disabled = true;
        JA.$('#rvCheck', card).disabled = true;
        JA.$('#rvExp', card).innerHTML = answerBox(item, ok, !ok ? `<div class="muted">你寫的：<s>${esc(val)}</s> → 正確讀音：<b>${esc(item.r)}</b></div>` : '');
        JA.tts.speak(item.w);
        finish(ok, item);
      }
      async function mic() {
        if (JA.asr.listening) { JA.asr.stop(); return; }
        const item = items[i];
        const btn = JA.$('#rvMic', card);
        btn.textContent = '⏹ 說完了';
        btn.classList.add('rec');
        const live = JA.$('#rvLive', card);
        const r = await JA.asr.listen({ maxMs: 6000, onInterim: (t) => { live.textContent = `🎙️ ${t}`; } });
        if (items[i] !== item || answered) return;
        btn.textContent = '🎤 再說一次';
        btn.classList.remove('rec');
        if (!r.text) { live.innerHTML = `<span class="bad-txt">${esc(r.msg || '沒有聽到')}</span>`; return; }
        const res = JA.score(item.w, r.alts.length ? r.alts : [r.text]);
        const ok = res.score >= 80;
        if (!ok && !item._tried) { item._tried = true; live.innerHTML = `🎧 聽到「${esc(r.text)}」— 不太對，再試一次？`; return; }
        live.textContent = `🎧 聽到「${r.text}」`;
        JA.$('#rvExp', card).innerHTML = answerBox(item, ok);
        btn.disabled = true;
        JA.$('#rvGive', card).disabled = true;
        JA.tts.speak(item.w);
        finish(ok, item);
      }
      function next() { JA.tts.stop(); JA.asr.abort(); i++; render(); }
      function pick(k) {
        const item = items[i];
        const ok = k === item._ans;
        JA.$$('.opt', card).forEach((x) => {
          x.disabled = true;
          if (+x.dataset.k === item._ans) x.classList.add('correct');
          else if (+x.dataset.k === k) x.classList.add('wrong');
        });
        JA.$('#rvExp', card).innerHTML = answerBox(item, ok, item.ex ? `<div class="vr-ex"><button type="button" class="icon-btn sm" data-say="${esc(jp.surface(item.ex))}">▶</button><span class="ja-txt">${JA.ruby(item.ex)}</span></div>` : '');
        if (mode !== 'meaning' || !ok) JA.tts.speak(item.w);
        finish(ok, item);
      }
      card.addEventListener('click', (e) => {
        if (e.target.closest('#qNext')) { next(); return; }
        if (e.target.closest('#rvCheck') && !answered) { checkInput(); return; }
        if (e.target.closest('#rvMic') && !answered) { mic(); return; }
        if (e.target.closest('#rvGive') && !answered) {
          const item = items[i];
          JA.asr.abort();
          JA.$('#rvExp', card).innerHTML = answerBox(item, false);
          JA.$('#rvMic', card).disabled = true;
          e.target.disabled = true;
          JA.tts.speak(item.w);
          finish(false, item);
          return;
        }
        const b = e.target.closest('.opt');
        if (!b || answered) return;
        pick(+b.dataset.k);
      });
      setKey((e) => {
        if (e.target.closest('input,textarea')) return;
        if (!answered && /^[1-4]$/.test(e.key) && JA.$('.opt', card)) pick(+e.key - 1);
        else if (answered && e.key === 'Enter') next();
      });
      render();
    }

    if (query.mode && MODES.some((m) => m.k === query.mode)) start(query.mode);
    else menu();
  });
})();

</script>
  <script>/* /js/progress.js */
/* 日語學院 Japanese Academy — progress.js
 * 📈 進度 (#/progress)：連續天數、累計時間、XP、完成課程、五十音熟練度、單字、近 16 週熱度圖、近 14 天練習時間、各級完成度；
 * ⚙️ 設定：程度、每日目標、每日新字數、日語聲音（只列 ja-JP，可試聽；沒有時顯示安裝說明）、語音引擎、語速、顯示偏好；
 * 💾 資料：同步狀態、匯出 / 匯入備份、清除紀錄；本機版另有 GitHub Pages 單一檔下載。
 */
(function () {
  'use strict';
  const JA = window.JA;
  const esc = JA.esc;

  function heatmap() {
    const weeks = 16;
    const today = new Date();
    const start = new Date(today);
    start.setDate(start.getDate() - (weeks * 7 - 1) - today.getDay());
    let cells = '';
    const months = [];
    for (let w = 0; w < weeks + 1; w++) {
      let col = '';
      for (let d = 0; d < 7; d++) {
        const dt = new Date(start);
        dt.setDate(start.getDate() + w * 7 + d);
        if (dt > today) { col += '<i class="hm-cell empty"></i>'; continue; }
        const k = JA.dayKey(dt);
        const rec = JA.state.days[k];
        const min = rec ? Math.round((rec.sec || 0) / 60) : 0;
        const xp = rec ? rec.xp || 0 : 0;
        const lv = !rec || (!min && !xp) ? 0 : min < 5 ? 1 : min < 15 ? 2 : min < 30 ? 3 : 4;
        col += `<i class="hm-cell l${lv}" title="${k}：${min} 分鐘 · ${xp} XP"></i>`;
        if (d === 0 && dt.getDate() <= 7) months.push([w, dt.getMonth() + 1]);
      }
      cells += `<div class="hm-col">${col}</div>`;
    }
    return `<div class="heatmap"><div class="hm-months">${months.map(([w, m]) => `<span style="left:${w * 15}px">${m}月</span>`).join('')}</div>
      <div class="hm-grid"><div class="hm-days"><span>日</span><span></span><span>二</span><span></span><span>四</span><span></span><span>六</span></div>${cells}</div>
      <div class="hm-legend muted small">少 <i class="hm-cell l0"></i><i class="hm-cell l1"></i><i class="hm-cell l2"></i><i class="hm-cell l3"></i><i class="hm-cell l4"></i> 多（每日練習分鐘）</div></div>`;
  }
  function last14() {
    const goal = JA.settings().goalMin || 15;
    const rows = [];
    for (let i = 13; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const rec = JA.state.days[JA.dayKey(d)];
      rows.push({ d, min: rec ? Math.round((rec.sec || 0) / 60) : 0, xp: rec ? rec.xp || 0 : 0 });
    }
    const max = Math.max(goal, ...rows.map((r) => r.min), 1);
    return `<div class="bars14">${rows.map((r) => `<div class="b14" title="${JA.dayKey(r.d)}：${r.min} 分鐘 · ${r.xp} XP">
      <div class="b14-track"><i class="${r.min >= goal ? 'hit' : ''}" style="height:${(r.min / max) * 100}%"></i><span class="b14-goal" style="bottom:${(goal / max) * 100}%"></span></div>
      <small>${r.d.getMonth() + 1}/${r.d.getDate()}</small></div>`).join('')}</div>
      <div class="muted small">虛線 = 每日目標 ${goal} 分鐘；綠色 = 達標</div>`;
  }
  function kanaBars() {
    return ['h', 'k'].map((s) => {
      const st = JA.kanaApi.stats(s);
      const pc = (n) => (st.total ? (n / st.total) * 100 : 0);
      return `<a class="kbar" href="#/kana?s=${s}"><span class="kb-lbl">${s === 'h' ? 'ひらがな 平假名' : 'カタカナ 片假名'}</span>
        <span class="kb-track"><i class="m" style="width:${pc(st.mastered)}%"></i><i class="f" style="width:${pc(st.familiar - st.mastered)}%"></i><i class="s" style="width:${pc(st.seen - st.familiar)}%"></i></span>
        <span class="kb-n">${st.familiar}/${st.total}</span></a>`;
    }).join('') + '<div class="muted small">綠 = 精熟、藍 = 熟悉、黃 = 學習中（依間隔複習的記憶強度）</div>';
  }
  function voiceOptions(gender) {
    const vs = JA.tts.voices();
    const cur = gender === 'M' ? JA.settings().voiceM : JA.settings().voiceF;
    const auto = JA.tts.voiceFor(gender);
    const label = (v) => `${v.name} (${v.lang})${JA.tts.guessGender(v) ? ` ${JA.tts.guessGender(v) === 'F' ? '♀' : '♂'}` : ''}`;
    if (!vs.length) return '<option value="">（這台裝置沒有日語聲音，使用 🌐 雲端語音）</option>';
    return `<option value="">自動選擇${auto && !cur ? `（${esc(auto.name)}）` : ''}</option>` +
      vs.map((v) => `<option value="${esc(v.voiceURI)}" ${cur === v.voiceURI ? 'selected' : ''}>${esc(label(v))}</option>`).join('');
  }

  JA.route('progress', (main) => {
    const st = JA.settings();
    const lessons = JA.lessons();
    const done = lessons.filter((L) => JA.prog(L.id).done).length;
    const vocab = JA.vocab.list();
    const mastered = vocab.filter((v) => JA.vocab.status(v) === 'mastered').length;
    const shadowScores = lessons.map((L) => JA.prog(L.id).shadow).filter((s) => s && s.best != null).map((s) => s.best);
    const shAvg = shadowScores.length ? Math.round(shadowScores.reduce((a, b) => a + b, 0) / shadowScores.length) : null;
    const days = Object.values(JA.state.days).filter((d) => (d.xp || 0) > 0 || (d.sec || 0) >= 60).length;
    const recent = lessons.filter((L) => JA.prog(L.id).last).sort((a, b) => JA.prog(b.id).last - JA.prog(a.id).last).slice(0, 6);
    const kh = JA.kanaApi.stats('h');
    const kk = JA.kanaApi.stats('k');
    const local = !JA.isStatic() && JA.serverAvailable;
    main.innerHTML = `<div class="page-hd"><div><h1>📈 進度</h1><p class="muted">每天一點點，持續最重要。已練習 ${days} 天。</p></div></div>
      <section class="kpis">
        <div class="kpi"><span>🔥 連續天數</span><b>${JA.streak()}</b><small>天</small></div>
        <div class="kpi"><span>⏱ 累計練習</span><b>${Math.round(JA.totalSec() / 60)}</b><small>分鐘</small></div>
        <div class="kpi"><span>⭐ 總經驗值</span><b>${JA.totalXP()}</b><small>XP</small></div>
        <div class="kpi"><span>あ 五十音</span><b>${kh.familiar + kk.familiar}</b><small>/ ${kh.total + kk.total}</small></div>
        <div class="kpi"><span>📚 完成課程</span><b>${done}</b><small>/ ${lessons.length}</small></div>
        <div class="kpi"><span>📒 單字</span><b>${vocab.length}</b><small>已熟記 ${mastered}</small></div>
      </section>
      <div class="prog-grid">
        <section class="card"><div class="card-hd"><h3>🗓️ 近 16 週練習熱度</h3></div>${heatmap()}</section>
        <section class="card"><div class="card-hd"><h3>⏱ 近 14 天練習時間</h3></div>${last14()}</section>
        <section class="card"><div class="card-hd"><h3>あ 五十音熟練度</h3><a class="btn sm ghost" href="#/kana">去練習 →</a></div>${kanaBars()}</section>
        <section class="card"><div class="card-hd"><h3>📶 各等級：課程 ／ 單字</h3><span class="muted small">🗣️ 跟讀平均 ${shAvg == null ? '—' : `${shAvg} 分`}</span></div>
          <div class="lv-bars">${JA.LEVELS.map((l) => {
            const ls = lessons.filter((L) => L.level === l.id);
            const d = ls.filter((L) => JA.prog(L.id).done).length;
            const wp = JA.wordProgress(l.id);
            return `<a class="lv-bar" href="#/words?level=${l.id}" style="--lv:${l.color};--lv-soft:${l.soft}"><span class="lvb-id">${l.id}</span><span class="lvb-name">${l.name} <small>${l.jlpt}</small></span>
              <span class="lvb-track"><i style="width:${wp.total ? (wp.learned / wp.total) * 100 : 0}%"></i></span><span class="lvb-n">${d}/${ls.length} 課 · ${wp.learned}/${wp.total} 字</span></a>`;
          }).join('')}</div></section>
        <section class="card"><div class="card-hd"><h3>🕘 最近練習</h3></div>
          ${recent.length ? `<div class="recent">${recent.map((L) => `<a href="#/lesson/${esc(L.id)}" class="recent-row">${JA.lvlBadge(L.level)}<b class="ja-txt">${JA.ruby(L.title)}</b>
            <span class="muted">${esc(L.title_zh || '')}</span><span class="muted small">${JA.fmtDate(JA.prog(L.id).last)}</span></a>`).join('')}</div>` : '<p class="muted">還沒有練習紀錄，從「今日」開始吧！</p>'}</section>
      </div>

      <section class="card settings" id="settings">
        <div class="card-hd"><h3>⚙️ 設定</h3></div>
        <div class="set-grid">
          <div class="set-row"><span class="fr-lbl">我的程度</span><div class="seg" id="setLevel">${JA.LEVELS.map((l) =>
            `<button type="button" data-v="${l.id}" class="${st.level === l.id ? 'active' : ''}" title="${esc(l.can)}">${l.id} ${l.name} <small>${l.jlpt}</small></button>`).join('')}</div></div>
          <div class="set-row"><span class="fr-lbl">每日目標</span><div class="seg" id="setGoal">${[5, 10, 15, 20, 30, 45].map((m) =>
            `<button type="button" data-v="${m}" class="${(st.goalMin || 15) === m ? 'active' : ''}">${m} 分鐘</button>`).join('')}</div></div>
          <div class="set-row"><span class="fr-lbl">每日新字</span><div class="seg" id="setNew">${[5, 10, 15, 20, 30].map((m) =>
            `<button type="button" data-v="${m}" class="${(+st.newPerDay || 10) === m ? 'active' : ''}">${m} 個</button>`).join('')}</div></div>
          <div class="set-row"><span class="fr-lbl">語音引擎</span><div>${JA.LUI.ttsEngineSeg()}<div class="muted small" style="margin-top:4px">💡 在 GitHub 網頁版、Linux 或手機上按播放沒聲音時，選「<b>🌐 雲端語音</b>」。本站只會用日語聲音唸日文。</div></div></div>
          <div class="set-row"><span class="fr-lbl">預設語速</span>${JA.LUI.rateSeg()}</div>
          <div class="set-row"><span class="fr-lbl">女聲（♀ 角色）</span><div class="row"><select id="setVF">${voiceOptions('F')}</select>
            <button type="button" class="btn sm" data-test="F">▶ 試聽</button></div></div>
          <div class="set-row"><span class="fr-lbl">男聲（♂ 角色）</span><div class="row"><select id="setVM">${voiceOptions('M')}</select>
            <button type="button" class="btn sm" data-test="M">▶ 試聽</button></div></div>
          <div class="set-row"><span class="fr-lbl">顯示</span><div class="toggles">
            <label class="tg"><input type="checkbox" id="setFuri" ${st.showFuri !== false ? 'checked' : ''}><span>振假名</span></label>
            <label class="tg"><input type="checkbox" id="setRo" ${st.showRomaji ? 'checked' : ''}><span>羅馬拼音</span></label>
            <label class="tg"><input type="checkbox" id="setZh" ${st.showZh !== false ? 'checked' : ''}><span>中文翻譯</span></label>
            <label class="tg"><input type="checkbox" id="setRec" ${st.recordVoice !== false ? 'checked' : ''}><span>跟讀時錄下我的聲音</span></label></div></div>
          <div class="set-row"><span class="fr-lbl">裝置狀態</span><div class="muted small" id="setEnv"></div></div>
        </div>
        <div id="voiceHelpBox">${JA.tts.hasJaVoice() ? '<p class="muted small">💡 聲音清單只列出日語（ja-JP）聲音。Chrome 內建「Google 日本語」；Mac 的 Kyoko / O-ren、Windows 的 Nanami 也很自然。</p>' : JA.voiceHelpHtml()}</div>
      </section>

      ${local ? `<section class="card" id="share-export">
        <div class="card-hd"><h3>📦 GitHub Pages 單一檔 ＆ 離線版</h3><button type="button" class="btn sm" id="openRelFromProg">🏷️ 版本資訊 &amp; Release Notes</button></div>
        <p class="muted" style="margin:0 0 12px">全站（五十音、課程、單字庫）可打包成單一 <code>index.html</code>：上傳到 <code>okayell.github.io</code> repo 的 <code>japanese/</code> 資料夾即可發布（https 下麥克風可用）。</p>

          <a class="btn" href="/download/zip" download="Japanese_Academy_Web_Package.zip">📦 下載網站包 (.zip)</a></div>
      </section>` : ''}

      <section class="card">
        <div class="card-hd"><h3>💾 學習資料</h3></div>
        <p id="syncInfo" class="muted"></p>
        <div class="row wrap"><button type="button" class="btn" id="dataExport">⬇ 匯出備份（JSON）</button>
          <label class="btn">⬆ 匯入備份<input type="file" id="dataImport" accept="application/json" hidden></label>
          <button type="button" class="btn ghost danger" id="dataReset">🗑 清除所有學習紀錄</button></div>
      </section>`;
    bind(main);
  });

  function bind(main) {
    const seg = (id, key, conv) => {
      JA.$(id, main).onclick = (e) => {
        const b = e.target.closest('[data-v]');
        if (!b) return;
        JA.setSetting(key, conv ? conv(b.dataset.v) : b.dataset.v);
        JA.$$(`${id} button`, main).forEach((x) => x.classList.toggle('active', x === b));
        JA.toast('已儲存設定', 'ok');
      };
    };
    seg('#setLevel', 'level');
    seg('#setGoal', 'goalMin', Number);
    seg('#setNew', 'newPerDay', Number);
    JA.LUI.bindRateSeg(main);
    JA.$('#setVF', main).onchange = (e) => JA.setSetting('voiceF', e.target.value);
    JA.$('#setVM', main).onchange = (e) => JA.setSetting('voiceM', e.target.value);
    JA.$('#setFuri', main).onchange = (e) => JA.setSetting('showFuri', e.target.checked);
    JA.$('#setRo', main).onchange = (e) => JA.setSetting('showRomaji', e.target.checked);
    JA.$('#setZh', main).onchange = (e) => JA.setSetting('showZh', e.target.checked);
    JA.$('#setRec', main).onchange = (e) => JA.setSetting('recordVoice', e.target.checked);
    main.addEventListener('click', (e) => {
      const t = e.target.closest('[data-test]');
      if (!t) return;
      const g = t.dataset.test;
      JA.tts.speak(g === 'M' ? 'こんにちは。男性の声です。一緒に日本語を練習しましょう。' : 'こんにちは。女性の声です。はじめまして、よろしくお願いします。', { gender: g });
    });
    const asr = JA.asr.status();
    const updateEnv = () => {
      const envEl = JA.$('#setEnv', main);
      if (!envEl) return;
      envEl.innerHTML = [
        `🔊 日語朗讀：${esc(JA.tts.activeEngineLabel())}`,
        asr.ok ? '🎤 日語語音辨識（ja-JP）：可用' : `🎤 語音辨識：${esc(asr.msg)}`,
        JA.rec.supported && window.isSecureContext ? '🔈 錄音回放：可用' : '🔈 錄音回放：需要安全連線',
        JA.aiAvailable() ? '🤖 AI 功能：可用（Cloudtop Jetski）' : '🤖 AI 功能：未偵測到 Jetski（AI 回饋 / 產生對話會隱藏）',
      ].map((x) => `<div>${x}</div>`).join('');
    };
    updateEnv();
    main.addEventListener('click', (e) => { if (e.target.closest('[data-tts-engine]')) setTimeout(updateEnv, 20); });
    const onVoices = () => {
      updateEnv();
      const vf = JA.$('#setVF', main);
      const vm = JA.$('#setVM', main);
      if (vf) vf.innerHTML = voiceOptions('F');
      if (vm) vm.innerHTML = voiceOptions('M');
      const box = JA.$('#voiceHelpBox', main);
      if (box && JA.tts.hasJaVoice()) box.innerHTML = '<p class="muted small">💡 聲音清單只列出日語（ja-JP）聲音。</p>';
    };
    JA.on('voices', onVoices);
    JA.onCleanup(() => JA.off('voices', onVoices));
    const sync = JA.state.meta && JA.state.meta.synced;
    JA.$('#syncInfo', main).innerHTML = JA.serverAvailable
      ? `☁️ 學習紀錄會自動同步到 Cloudtop（換瀏覽器也不會不見）。${sync ? `最近同步：${new Date(sync).toLocaleString('zh-TW')}` : ''}`
      : '📴 學習紀錄存在這個瀏覽器裡（localStorage，前綴 ja.），建議定期匯出備份。';
    const relBtn = JA.$('#openRelFromProg', main);
    if (relBtn) relBtn.onclick = () => { if (JA.openReleaseModal) JA.openReleaseModal(); };
    JA.$('#dataExport', main).onclick = () => {
      const blob = new Blob([JSON.stringify(JA.state, null, 1)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `japanese_academy_backup_${JA.todayKey()}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    };
    JA.$('#dataImport', main).onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      try {
        const data = JSON.parse(await f.text());
        if (!data || typeof data !== 'object' || !data.v) throw new Error('不是有效的備份檔');
        JA.state = JA.mergeState(JA.state, data);
        JA.save({ delay: 200 });
        JA.toast('✅ 已匯入並合併備份', 'ok');
        JA.renderRoute();
      } catch (err) {
        JA.toast(`匯入失敗：${err.message}`, 'bad');
      }
    };
    JA.$('#dataReset', main).onclick = async () => {
      if (!(await JA.confirm('確定要清除所有學習紀錄（進度、五十音、單字本、連續天數）？這個動作會同步到所有裝置，建議先匯出備份。', '清除'))) return;
      const now = Date.now();
      JA.state = { v: 1, settings: JA.state.settings, meta: { _u: now, reset: now }, lessons: {}, vocab: {}, kana: {}, days: {} };
      JA.save({ delay: 100 });
      JA.toast('已清除學習紀錄');
      JA.renderRoute();
    };
  }
})();

  <script>/* /js/feedback.js */
/* 日語學院 Japanese Academy — feedback.js
 * 💬 意見回饋・問題回報・功能許願 (#/feedback) — 三欄（類型／標題／內容）；送出後寄信至 okayell@hotmail.com
 * 本機版走 /api/feedback（Gmail CLI → FormSubmit 備援）；GitHub / 單一檔版直接呼叫 FormSubmit，失敗時提供 mailto。
 */
(function () {
  'use strict';
  const JA = window.JA;
  const esc = JA.esc;
  const TARGET_EMAIL = 'okayell@hotmail.com';
  const TOOL = '日語學院';
  const LS_KEY = 'ja.feedback.v1';
  const KINDS = [
    { id: 'feature', label: '✨ 功能許願' },
    { id: 'bug', label: '🐞 問題回報 (Bug)' },
    { id: 'ux', label: '🎨 介面與課程建議' },
    { id: 'other', label: '💬 其他意見' },
  ];
  let itemsCache = null;
  let selKind = 'feature';
  let sending = false;

  function loadLocal() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (_) { return []; }
  }
  function saveLocal(items) {
    try { localStorage.setItem(LS_KEY, JSON.stringify((items || []).slice(0, 50))); } catch (_) { /* ignore */ }
  }
  function buildMailto(kindLabel, title, desc) {
    const subject = `[${TOOL} 意見回饋] ${kindLabel} — ${title}`;
    const body = `工具名稱：${TOOL}\n回饋類型：${kindLabel}\n標題：${title}\n\n內容描述：\n${desc}\n`;
    return `mailto:${TARGET_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }
  function fallbackCard(kindLabel, title, desc, note) {
    if (window.CampusNav && CampusNav.fallbackHtml) {
      return CampusNav.fallbackHtml({ email: TARGET_EMAIL, tool: TOOL, kindLabel, title, description: desc, note });
    }
    return `✅ 意見已記錄！也可以點 <a href="${esc(buildMailto(kindLabel, title, desc))}">📩 一鍵開啟郵件直接寄給站長</a>。`;
  }
  async function sendStaticEmail(item) {
    if (window.CampusNav && CampusNav.sendStaticFeedback) {
      return CampusNav.sendStaticFeedback({
        email: TARGET_EMAIL,
        tool: TOOL,
        kindLabel: item.kind_label,
        title: item.title,
        description: item.description,
        createdAt: item.created_at,
      });
    }
    try {
      const resp = await fetch(`https://formsubmit.co/ajax/${TARGET_EMAIL}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ _subject: `[${TOOL} 意見回饋] ${item.kind_label} — ${item.title}`, _template: 'table', _captcha: 'false',
          工具名稱: TOOL, 回饋類型: item.kind_label, 標題: item.title, 內容描述: item.description, 送出時間: item.created_at }),
      });
      const data = await resp.json().catch(() => ({}));
      if (resp.ok && (data.success === 'true' || data.success === true)) return { sent: true };
    } catch (_) { /* fallback */ }
    return { sent: false };
  }
  const banner = (el, kind, html) => {
    if (!el) return;
    el.hidden = false;
    el.className = kind ? `fb-banner ${kind}` : '';
    el.innerHTML = html;
  };

  JA.route('feedback', (root) => {
    const isLocal = !!(JA.serverAvailable && !JA.isStatic());
    if (itemsCache === null) {
      itemsCache = loadLocal();
      if (isLocal) {
        JA.api('/api/feedback').then((res) => {
          if (res && Array.isArray(res.items)) {
            itemsCache = res.items;
            if (JA.curRoute && JA.curRoute.name === 'feedback') JA.renderRoute();
          }
        }).catch(() => {});
      }
    }
    root.innerHTML = `
      <section class="card fb-head"><h1>💬 意見回饋・問題回報・功能許願</h1>
        <p class="muted">想加的課程主題、五十音或發音的問題、介面建議都歡迎留言！送出後會自動寄送通知信到站長信箱（<code>${TARGET_EMAIL}</code>）。</p></section>
      <div class="fb-grid">
        <form class="card fb-form" id="jaFeedbackForm">
          <div><label class="fb-lbl">1. 回饋類型</label>
            <div class="row wrap">${KINDS.map((k) => `<button type="button" class="btn sm ${selKind === k.id ? 'primary' : ''}" data-fb-kind="${k.id}">${k.label}</button>`).join('')}</div></div>
          <div><label class="fb-lbl" for="jaFbTitle">2. 標題</label>
            <input id="jaFbTitle" class="fb-input" required maxlength="150" placeholder="簡短說明你的許願功能、課程建議或遇到的問題…"></div>
          <div><label class="fb-lbl" for="jaFbDesc">3. 內容描述</label>
            <textarea id="jaFbDesc" class="fb-input" required rows="6" maxlength="4000" placeholder="請描述詳細建議、希望新增的課程主題，或發生問題的頁面與步驟…"></textarea></div>
          <div id="jaFbBanner" hidden></div>
          <div class="fb-actions"><span class="muted small">📩 送出後寄信通知 <code>${TARGET_EMAIL}</code></span>
            <button type="submit" class="btn primary" id="jaFbSubmit">📨 送出回饋</button></div>
        </form>
        <section class="card"><h3>🗂️ 已送出的回饋紀錄（${(itemsCache || []).length}）</h3>
          <div class="fb-list">${(itemsCache || []).map((it) => `<div class="fb-item">
              <div class="fb-item-hd"><span class="fb-kind">${esc(it.kind_label || it.kind)}</span><span class="muted small">${esc(it.created_at || '')}</span></div>
              <div class="fb-title">${esc(it.title)}</div><div class="fb-desc">${esc(it.description)}</div></div>`).join('')
            || '<div class="muted fb-empty">目前尚無回饋紀錄，歡迎留下第一則建議！</div>'}</div></section>
      </div>`;
    JA.$$('[data-fb-kind]', root).forEach((btn) => {
      btn.onclick = () => {
        selKind = btn.dataset.fbKind;
        JA.$$('[data-fb-kind]', root).forEach((b) => b.classList.toggle('primary', b === btn));
      };
    });
    JA.$('#jaFbTitle', root).addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !JA.isEnterSend(ev)) ev.preventDefault(); });
    JA.$('#jaFeedbackForm', root).onsubmit = async (ev) => {
      ev.preventDefault();
      if (sending) return;
      const title = (JA.$('#jaFbTitle', root).value || '').trim();
      const description = (JA.$('#jaFbDesc', root).value || '').trim();
      if (!title || !description) { JA.toast('請填寫標題與內容描述', 'bad'); return; }
      sending = true;
      const btn = JA.$('#jaFbSubmit', root);
      btn.disabled = true;
      btn.textContent = '⏳ 寄送中…';
      const kindObj = KINDS.find((k) => k.id === selKind) || KINDS[0];
      try {
        if (isLocal) {
          const res = await JA.api('/api/feedback', { body: { kind: selKind, title, description } });
          itemsCache = res.items || [res.item, ...(itemsCache || [])];
          saveLocal(itemsCache);
          const sentOk = !res.item || res.item.mail_sent !== false;
          if (sentOk) JA.toast('✅ 感謝你的回饋！已寄送至站長信箱', 'ok');
          JA.renderRoute();
          if (sentOk) {
            banner(JA.$('#jaFbBanner'), 'ok', `✅ 已收到並寄送通知信至 <strong>${TARGET_EMAIL}</strong>，感謝你的寶貴意見！`);
          } else {
            banner(JA.$('#jaFbBanner'), '', fallbackCard(kindObj.label, title, description, '✅ 回饋已儲存至伺服器紀錄；但自動寄信暫時忙碌，請任選下方一種方式一鍵寄達站長：'));
          }
        } else {
          const item = { id: `FB-${Date.now().toString(36).toUpperCase()}`, kind: selKind, kind_label: kindObj.label, title, description,
            created_at: new Date().toISOString().slice(0, 19).replace('T', ' ') };
          const mail = await sendStaticEmail(item);
          itemsCache = [item, ...(itemsCache || [])];
          saveLocal(itemsCache);
          JA.renderRoute();
          if (mail.sent) banner(JA.$('#jaFbBanner'), 'ok', `✅ 感謝回饋！已寄送至 <strong>${TARGET_EMAIL}</strong>。`);
          else banner(JA.$('#jaFbBanner'), '', fallbackCard(kindObj.label, title, description));
        }
      } catch (e) {
        banner(JA.$('#jaFbBanner', root), '', fallbackCard(kindObj.label, title, description, `⚠️ 暫時無法連線（${e.message || '連線忙碌'}），請任選下方一種方式一鍵寄達站長：`));
      } finally {
        sending = false;
        if (btn) { btn.disabled = false; btn.textContent = '📨 送出回饋'; }
      }
    };
  });
})();

</script>

/* 日語學院 Japanese Academy — releases.js
 * 標題列版號徽章 + Release Notes 視窗（Pattern 164 / 173）：
 *   本機 Cloudtop 版：📦 GitHub Pages 單一檔下載 + 待發布變更偵測 / 1.x.x 智慧進位發布中心 + 歷史紀錄
 *   GitHub Pages / file:// / 單一檔靜態版：只顯示 📜 Release Notes
 * 版本資料在 releases_data.js（由 tools/release_mgr.py 產生）。
 */
(function () {
  'use strict';
  const JA = (window.JA = window.JA || {});
  JA.RELEASES_DATA = JA.RELEASES_DATA || { current_version: '1.0.0', releases: [] };
  const BUMP = {
    major: { badge: 'Major 大改版', cls: 'bad' },
    minor: { badge: 'Minor 功能擴充', cls: 'info' },
    patch: { badge: 'Patch 細節修正', cls: 'ok' },
  };
  let cachedStatus = null;
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const isStaticEnv = () => !!(window.JA_STATIC_ONLY || (location.protocol !== 'http:' && location.protocol !== 'https:') ||
    /\.github\.io$|\.pages\.dev$|\.netlify\.app$|\.vercel\.app$/i.test(location.hostname || ''));

  function updateBadge(status) {
    const btn = document.getElementById('verBadgeBtn');
    if (!btn) return;
    const ver = (status && status.current_version) || JA.RELEASES_DATA.current_version || '1.0.0';
    const isLocal = !!status && !isStaticEnv();
    const dirty = isLocal && !!status.has_changes;
    btn.className = `ver-badge${dirty ? ' has-changes' : ''}`;
    btn.innerHTML = `<span>v${esc(ver)}</span>${dirty ? '<i class="ver-dot" title="有未發布的修改檔案"></i>' : ''}`;
    btn.title = !isLocal ? `版本 v${ver}（點擊查看 Release Notes）`
      : dirty ? `目前版本 v${ver}（偵測到 ${status.changed_files.length} 個檔案已修改，點擊查看與發布新版本）` : `目前版本 v${ver}（點擊查看 Release Notes 與發布中心）`;
  }
  async function fetchStatus() {
    if (isStaticEnv()) return null;
    try {
      const res = await fetch('/api/release_status', { cache: 'no-store' });
      if (!res.ok || !(res.headers.get('content-type') || '').includes('application/json')) return null;
      cachedStatus = await res.json();
      if (cachedStatus && cachedStatus.current_version) {
        JA.RELEASES_DATA.current_version = cachedStatus.current_version;
        JA.RELEASES_DATA.releases = cachedStatus.releases || JA.RELEASES_DATA.releases;
      }
      updateBadge(cachedStatus);
      return cachedStatus;
    } catch (e) {
      return null;
    }
  }
  function publisherHtml(status, ver) {
    const exportBox = `<div class="rel-status-box export"><div class="rs-head"><div><strong>📦 GitHub Pages 單一檔案匯出（免安裝靜態版）</strong>
        <div class="muted small">五十音、A1–C2 課程、單字庫與所有介面打包成單一 <code>index.html</code>，上傳到 <code>okayell.github.io</code> repo 的 <code>japanese/</code> 資料夾即可（公開版只顯示 Release Notes）。</div></div>
        <div class="row wrap"><a class="btn sm primary" href="/download/index.html" download="index.html">⬇️ 直接下載最新 index.html</a>
          <a class="btn sm" href="/download/zip" download="Japanese_Academy_Web_Package.zip">📦 下載網站包 (.zip)</a></div></div></div>`;
    if (!status.has_changes) {
      return `${exportBox}<div class="rel-status-box clean">✅ 目前工作目錄所有程式碼與教材皆與最新發布版 <strong>v${esc(ver)}</strong> 同步，無待發布修改。</div>`;
    }
    const rec = status.recommended_bump || 'patch';
    const nv = status.next_versions || {};
    const rows = status.changed_files.map((f) => `<tr><td><span class="chip info">${esc(f.cat)}</span></td>
      <td><code>${esc(f.path)}</code><div class="muted small">${esc(f.desc)}</div></td><td><span class="chip warn">${esc(f.status_zh)}</span></td>
      <td class="nowrap"><b class="add">+${f.added_lines}</b> / <b class="del">-${f.removed_lines}</b> 行</td></tr>`).join('');
    const desc = { patch: '進第 3 位數（1.x.X）：微調樣式、文字修正、小 Bug 修復', minor: '進第 2 位數（1.X.0）：新增功能、課程或單字擴充',
      major: '進第 1 位數（X.0.0）：全站架構大改版、跨模組大規模升級' };
    const opts = ['patch', 'minor', 'major'].map((b) => `<label class="rel-bump-opt${b === rec ? ' on' : ''}"><input type="radio" name="relBumpType" value="${b}"${b === rec ? ' checked' : ''}>
      <div class="rbo-top"><strong>v${esc(nv[b] || '')}</strong>${b === rec ? '<span class="chip ok">🤖 系統推薦</span>' : ''}</div><div class="rbo-sub">${esc(desc[b])}</div></label>`).join('');
    return `${exportBox}<div class="rel-status-box dirty">
      <div class="rs-head"><div><span class="chip warn">⚠️ 偵測到未發布變更</span> <strong>共有 ${status.changed_files.length} 個檔案自 v${esc(ver)} 後有修改</strong></div>
        <span class="muted small">總變動：<b class="add">+${status.total_added}</b> / <b class="del">-${status.total_removed}</b> 行</span></div>
      <div class="rel-ai-advice">🧭 <strong>智慧版號進位判斷（1.x.x）：</strong>${esc(status.recommendation_reason)}</div>
      <div class="rel-tbl-wrap"><table class="rel-tbl"><thead><tr><th>分類</th><th>修改檔案與說明</th><th>狀態</th><th>行數變動</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="rel-bump-grid">${opts}</div>
      <div class="rel-form"><label><b>新版本標題（Release Title）</b><input type="text" id="relTitleInp" class="rf-input" value="${esc(status.suggested_title || '')}"></label>
        <label><b>更新細項（每行一條，已依修改檔案預填）</b><textarea id="relHighlightsInp" class="rf-input" rows="3">${esc((status.suggested_highlights || []).join('\n'))}</textarea></label>
        <div class="rel-actions"><button type="button" class="btn primary" id="publishRelBtn">🚀 發布新版本 v <span id="publishVerTxt">${esc(nv[rec] || '')}</span> 並同步重新打包</button></div></div></div>`;
  }
  function render(status) {
    let bd = document.getElementById('relModal');
    if (!bd) {
      bd = document.createElement('div');
      bd.id = 'relModal';
      bd.className = 'rel-modal-bd';
      bd.addEventListener('click', (e) => { if (e.target === bd) bd.classList.remove('open'); });
      document.body.appendChild(bd);
    }
    const ver = (status && status.current_version) || JA.RELEASES_DATA.current_version || '1.0.0';
    const releases = (status && status.releases) || JA.RELEASES_DATA.releases || [];
    const isLocal = !!status && !isStaticEnv();
    const history = releases.map((r, i) => {
      const b = BUMP[r.bump] || BUMP.minor;
      return `<div class="rel-item${i === 0 ? ' latest' : ''}"><div class="ri-head"><span class="ri-ver">v${esc(r.version)}</span>${i === 0 ? '<span class="chip ok">目前版本</span>' : ''}
        <span class="chip ${b.cls}">${esc(b.badge)}</span><span class="ri-date">📅 ${esc(r.date)}${r.files_count ? ` · 涵蓋 ${r.files_count} 個檔案` : ''}</span></div>
        <h4 class="ri-title">${esc(r.title)}</h4><ul class="ri-list">${(r.highlights || []).map((h) => `<li>${esc(h)}</li>`).join('')}</ul></div>`;
    }).join('');
    bd.innerHTML = `<div class="modal-box rel-modal-box" role="dialog" aria-label="Release Notes">
      <div class="rel-modal-head"><div><div class="row wrap"><h3>${isLocal ? '🚀 日語學院 · 版本紀錄與發布中心' : '📜 日語學院 · Release Notes'}</h3><span class="ver-pill-lg">v${esc(ver)}</span></div>
        ${isLocal ? '<p class="muted small">遵循語意化版本 <code>MAJOR.MINOR.PATCH (1.x.x)</code>：大改版進第 1 位、新功能 / 內容擴充進第 2 位、細節微調與修正進第 3 位。</p>' : ''}</div>
        <button type="button" class="btn sm ghost" id="closeRelModalBtn">✕ 關閉</button></div>
      <div class="rel-modal-body">${isLocal ? publisherHtml(status, ver) : ''}
        <h4 class="rel-sec-title"${isLocal ? '' : ' style="margin-top:0"'}>📜 Release Notes 歷史版本紀錄</h4><div class="rel-timeline">${history}</div></div></div>`;
    bd.classList.add('open');
    bd.querySelector('#closeRelModalBtn').onclick = () => bd.classList.remove('open');
    bd.querySelectorAll('[name="relBumpType"]').forEach((radio) => {
      radio.onchange = () => {
        bd.querySelectorAll('.rel-bump-opt').forEach((el) => el.classList.remove('on'));
        radio.closest('.rel-bump-opt').classList.add('on');
        const t = bd.querySelector('#publishVerTxt');
        if (t && status && status.next_versions) t.textContent = status.next_versions[radio.value] || '';
      };
    });
    const pub = bd.querySelector('#publishRelBtn');
    if (pub) {
      pub.onclick = async () => {
        const checked = bd.querySelector('[name="relBumpType"]:checked');
        const bump = checked ? checked.value : (status.recommended_bump || 'patch');
        const title = (bd.querySelector('#relTitleInp') || {}).value || '';
        const highlights = ((bd.querySelector('#relHighlightsInp') || {}).value || '').split('\n').map((s) => s.trim()).filter(Boolean);
        pub.disabled = true;
        pub.textContent = '⏳ 正在發布並重新打包 index.html …';
        try {
          const res = await fetch('/api/release_publish', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bump_type: bump, title, highlights }) });
          const out = await res.json();
          if (out && out.ok) {
            cachedStatus = out.status;
            JA.RELEASES_DATA.current_version = out.new_version;
            JA.RELEASES_DATA.releases = out.status.releases;
            updateBadge(cachedStatus);
            render(cachedStatus);
            if (JA.toast) JA.toast(`🎉 已發布 v${out.new_version} 並重新打包 GitHub 單一檔！`, 'ok');
          } else {
            pub.disabled = false;
            pub.textContent = '🚀 重新嘗試發布';
            if (JA.toast) JA.toast(`發布失敗：${(out && out.error) || '未知錯誤'}`, 'bad');
          }
        } catch (err) {
          pub.disabled = false;
          pub.textContent = '🚀 重新嘗試發布';
          if (JA.toast) JA.toast('網路錯誤，無法連線至本機伺服器', 'bad');
        }
      };
    }
  }
  async function openReleaseModal() {
    const st = await fetchStatus();
    render(st || (isStaticEnv() ? null : cachedStatus));
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !e.isComposing) {
      const bd = document.getElementById('relModal');
      if (bd && bd.classList.contains('open')) bd.classList.remove('open');
    }
  });
  function init() {
    const btn = document.getElementById('verBadgeBtn');
    if (btn && !btn.dataset.bound) {
      btn.dataset.bound = '1';
      btn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); openReleaseModal(); });
    }
    updateBadge(null);
    fetchStatus().then(() => { if (location.search.includes('releases=1')) openReleaseModal(); });
  }
  JA.openReleaseModal = openReleaseModal;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
  <script>/* /js/app.js */
/* 日語學院 Japanese Academy — app.js
 * 導覽列（桌機頂部 + 手機底部）、頂部狀態（連續天數 / 今日目標 / 到期複習）、啟動流程與伺服器同步。
 */
(function () {
  'use strict';
  const JA = window.JA;
  const NAV = [
    ['home', '🏠', '今日'], ['kana', 'あ', '五十音'], ['library', '📚', '課程'], ['words', '🔤', '單字'],
    ['review', '🧠', '複習'], ['progress', '📈', '進度'], ['feedback', '💬', '回饋'],
  ];
  const ROUTE_NAV = { lesson: 'library', vocab: 'words' };

  function renderNav() {
    const icon = (k, ic) => (k === 'kana' ? `<span class="nav-kana">${ic}</span>` : ic);
    JA.$('#mainNav').innerHTML = NAV.map(([k, ic, t]) => `<a class="nav-link" data-nav="${k}" href="#/${k}" title="${t}"><span class="nav-ic">${icon(k, ic)}</span><span class="nav-t">${t}</span>
      ${k === 'review' ? '<i class="nav-badge" id="dueBadge" hidden></i>' : ''}</a>`).join('');
    JA.$('#mobileNav').innerHTML = NAV.map(([k, ic, t]) => `<a class="mnav-link" data-nav="${k}" href="#/${k}"><span>${icon(k, ic)}</span><small>${t}</small>
      ${k === 'review' ? '<i class="nav-badge" id="dueBadgeM" hidden></i>' : ''}</a>`).join('');
  }
  function setActive(name) {
    const key = ROUTE_NAV[name] || name;
    JA.$$('[data-nav]').forEach((a) => a.classList.toggle('active', a.dataset.nav === key));
  }
  function renderHeader() {
    const st = JA.settings();
    const day = JA.day();
    const goal = (st.goalMin || 15) * 60;
    const pct = Math.min(1, (day.sec || 0) / goal);
    const streak = JA.streak();
    JA.$('#headerStats').innerHTML = `
      <a class="hs-chip ${streak ? 'fire' : ''}" href="#/progress" title="連續練習天數">🔥 <b>${streak}</b></a>
      <a class="hs-goal" href="#/home" title="今日練習 ${Math.floor((day.sec || 0) / 60)} / ${st.goalMin || 15} 分鐘">${JA.ringSvg(pct, 30, 4, pct >= 1 ? '#16a34a' : 'var(--primary)')}
        <span>${Math.floor((day.sec || 0) / 60)}<small>/${st.goalMin || 15}′</small></span></a>
      <a class="hs-chip" href="#/progress#settings" title="設定">⚙️</a>`;
    const due = JA.vocab.due().length + (JA.kanaApi ? JA.kanaApi.due('mix').length : 0);
    ['#dueBadge', '#dueBadgeM'].forEach((id) => {
      const b = JA.$(id);
      if (!b) return;
      b.hidden = !due;
      b.textContent = due > 99 ? '99+' : due;
    });
  }
  const renderHeaderSoon = JA.debounce(renderHeader, 200);

  async function boot() {
    JA.indexLessons();
    JA.indexWords();
    renderNav();
    renderHeader();
    if (!location.hash) location.replace('#/home');
    JA.renderRoute();
    JA.on('route', (r) => setActive(r.name));
    setActive(JA.curRoute ? JA.curRoute.name : 'home');
    ['xp', 'state', 'tick', 'vocab', 'kana'].forEach((ev) => JA.on(ev, renderHeaderSoon));
    JA.tts.ready.then(() => JA.emit('voices', JA.tts.voices()));
    const before = JSON.stringify(JA.state);
    const onboardTimer = setTimeout(() => { if (!JA.settings().onboarded && !JA.$('.modal-wrap')) JA.showOnboarding(); }, 2500);
    await JA.initSync();
    clearTimeout(onboardTimer);
    renderHeader();
    const changed = JSON.stringify(JA.state) !== before;
    const r = JA.curRoute;
    if ((changed || (r && (r.name === 'progress' || r.name === 'feedback'))) && r && ['home', 'library', 'vocab', 'review', 'progress', 'feedback', 'words'].includes(r.name) &&
      !(r.name === 'words' && r.params[0]) && !JA.$('.modal-wrap')) JA.renderRoute();
    if (!JA.settings().onboarded && !JA.$('.modal-wrap.onboard, .modal.onboard') && !/[?&]shot=1/.test(location.search)) JA.showOnboarding();
    if (JA.aiAvailable() && r && r.name === 'library') JA.renderRoute();
    setInterval(async () => {
      if (document.hidden || !JA.serverAvailable) return;
      try { JA.health = await JA.api('/api/health', { timeout: 5000 }); } catch (e) { /* ignore */ }
    }, 60000);
  }

  window.addEventListener('error', (e) => { console.error(e.error || e.message); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
