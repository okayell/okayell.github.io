  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇯🇵</text></svg>">

/* 日語學院 Japanese Academy — app.css（由英語學院的設計系統改編：紅白和風配色 + 日文排版）
 * 清爽的 Light Theme：
 *   1. Design tokens / 基礎
 *   2. 頂部導覽、手機底部導覽
 *   3. 通用元件（按鈕、膠囊、分段、開關、卡片、彈窗、提示、進度環）
 *   4. 首頁、文章列表、課程卡
 *   5. 課程頁：標題區、模式分頁、播放器、對話泡泡、查字彈窗
 *   6. 練習：跟讀、角色扮演、聽寫、測驗、單字句型、口說回饋
 *   7. 單字本、複習、進度、設定
 *   8. RWD
 */
:root {
  --bg: #f5f7fb;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --surface-hover: #f1f5f9;
  --border: #e3e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-2: #334155;
  --muted: #64748b;
  --primary: #e11d48;
  --primary-hover: #be123c;
  --primary-soft: #fff1f2;
  --accent: #db2777;
  --ok: #16a34a;
  --ok-bg: #dcfce7;
  --ok-fg: #166534;
  --warn-bg: #fef3c7;
  --warn-fg: #92400e;
  --bad-bg: #fee2e2;
  --bad-fg: #991b1b;
  --info-bg: #dbeafe;
  --info-fg: #1e40af;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 2px 8px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.10);
  --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.20);
  --header-h: 62px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --font-ja: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Meiryo", "Noto Sans JP", "Noto Sans CJK JP", -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}
* { box-sizing: border-box; }
html { overflow-y: scroll; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; letter-spacing: -0.01em; }
h1 { font-size: 26px; }
h3 { font-size: 16.5px; }
p { margin: 6px 0; }
code { background: var(--surface-hover); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; font-family: var(--mono); font-size: 0.88em; word-break: break-all; }
mark { background: #fef08a; color: inherit; border-radius: 3px; padding: 0 2px; }
::selection { background: #bfdbfe; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.ok-txt { color: var(--ok-fg); font-weight: 700; }
.bad-txt { color: var(--bad-fg); font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint { color: var(--muted); font-size: 13px; margin: 10px 4px 18px; }

/* =========================================================================
 * 2. 頂部導覽 / 手機底部導覽
 * ========================================================================= */
.site-header { position: sticky; top: 0; z-index: 50; background: #fff; border-bottom: 1px solid var(--border); }
.header-inner { max-width: 1200px; margin: 0 auto; height: var(--header-h); display: flex; align-items: center; gap: 16px; padding: 0 20px; }
.brand-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none !important; flex-shrink: 0; }
.ver-badge { position: relative; display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: #eff6ff; border: 1px solid #bfdbfe;
  color: #1d4ed8; font-family: var(--mono); font-size: 12px; font-weight: 800; cursor: pointer; transition: background-color 0.15s, border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  align-self: flex-start; margin-top: 2px; }
.ver-badge:hover { background: #dbeafe; border-color: #60a5fa; transform: translateY(-1px); box-shadow: 0 2px 6px rgba(37, 99, 235, 0.16); }
.ver-badge.has-changes { background: #fffbeb; border-color: #fbbf24; color: #b45309; }
.ver-dot { width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.28); display: inline-block; }
.ver-pill-lg { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; font-family: var(--mono);
  font-size: 13px; font-weight: 800; margin-left: 6px; vertical-align: middle; }
.brand-logo { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 20px;
  background: linear-gradient(135deg, #e11d48 0%, #f472b6 100%); box-shadow: 0 4px 12px rgba(225, 29, 72, 0.28); color: #fff; font-family: var(--font-ja); font-weight: 800; }
.brand-txt b { display: block; font-size: 15.5px; line-height: 1.2; }
.brand-txt small { display: block; font-size: 11.5px; color: var(--muted); }
.main-nav { display: flex; gap: 2px; flex: 1; justify-content: center; }
.nav-link { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; color: var(--text-2);
  font-weight: 650; font-size: 14.5px; text-decoration: none !important; transition: background-color 0.15s, color 0.15s; white-space: nowrap; }
.nav-link:hover { background: var(--surface-hover); }
.nav-link.active { background: var(--primary-soft); color: var(--primary-hover); }
.nav-badge { position: absolute; top: 2px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #ef4444;
  color: #fff; font-size: 11px; font-style: normal; font-weight: 700; line-height: 18px; text-align: center; }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.hs-chip { display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 11px; border-radius: 17px; border: 1px solid var(--border);
  background: #fff; color: var(--text-2); font-size: 14px; text-decoration: none !important; }
.hs-chip:hover { border-color: var(--border-strong); }
.hs-chip.fire { background: #fff7ed; border-color: #fed7aa; color: #c2410c; }
.hs-goal { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); text-decoration: none !important; font-weight: 700; font-size: 14px; }
.hs-goal small { color: var(--muted); font-weight: 500; }
.app-main { max-width: 1200px; margin: 0 auto; padding: 22px 20px 60px; }
.mobile-nav { display: none; }

/* =========================================================================
 * 3. 通用元件
 * ========================================================================= */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 15px; border-radius: 10px; border: 1px solid var(--border-strong);
  background: #fff; color: var(--text); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none !important;
  transition: background-color 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.05s; white-space: nowrap; }
.btn:hover { background: var(--surface-hover); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .icon-btn:focus-visible, .opt:focus-visible { outline: 3px solid #93c5fd; outline-offset: 1px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-hover); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-hover); }
.btn.danger { color: #b91c1c; }
.btn.sm { padding: 5px 11px; font-size: 13px; border-radius: 9px; }
.btn.xs { padding: 2px 8px; font-size: 12px; border-radius: 7px; }
.btn.big { padding: 12px 22px; font-size: 15.5px; border-radius: 12px; }
.btn.rec, .btn.mic.rec { background: #ef4444; border-color: #ef4444; color: #fff; animation: pulse 1.2s ease-in-out infinite; }
.btn.star.on { background: #fffbeb; border-color: #fcd34d; color: #b45309; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.45); } 50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); } }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; border: 1px solid transparent; background: transparent;
  cursor: pointer; font-size: 15px; color: var(--text-2); text-decoration: none !important; transition: background-color 0.15s; flex-shrink: 0; }
.icon-btn:hover { background: var(--surface-hover); }
.icon-btn.lg { width: 40px; height: 40px; font-size: 18px; }
.icon-btn.sm { width: 26px; height: 26px; font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: var(--surface-hover); border: 1px solid var(--border);
  color: var(--text-2); font-size: 12.5px; font-weight: 600; white-space: nowrap; line-height: 1.6; }
.chip.ok { background: var(--ok-bg); border-color: #bbf7d0; color: var(--ok-fg); }
.chip.warn { background: var(--warn-bg); border-color: #fde68a; color: var(--warn-fg); }
.chip.bad { background: var(--bad-bg); border-color: #fecaca; color: var(--bad-fg); }
.chip.info { background: var(--info-bg); border-color: #bfdbfe; color: var(--info-fg); }
button.chip { cursor: pointer; font-family: inherit; }
.chip.sp { padding-left: 3px; }
.chip.sp .avatar { width: 20px; height: 20px; font-size: 11px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.lvl { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 7px; background: var(--lv-soft); color: var(--lv);
  border: 1px solid color-mix(in srgb, var(--lv) 30%, transparent); font-weight: 800; font-size: 12.5px; letter-spacing: 0.02em; white-space: nowrap; }
.lvl small { font-weight: 600; font-size: 11.5px; }
.seg { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 3px; background: var(--surface-hover); border: 1px solid var(--border); border-radius: 10px; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer; white-space: nowrap; }
.seg button:hover { background: #fff; }
.seg button.active { background: #fff; color: var(--primary-hover); box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12); }
.seg button small { color: var(--muted); font-weight: 500; }
.seg-lbl { font-size: 12.5px; color: var(--muted); padding: 0 6px 0 4px; font-weight: 600; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.tg { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--text-2); cursor: pointer; user-select: none; }
.tg input { width: 16px; height: 16px; accent-color: var(--primary); margin: 0; }
.tg.sm { font-size: 12.5px; }
.field { display: flex; flex-direction: column; gap: 5px; margin: 10px 0; font-size: 13px; color: var(--text-2); font-weight: 600; }
input[type="text"], input[type="search"], select, textarea { font: inherit; font-size: 14px; color: var(--text); background: #fff; border: 1px solid var(--border-strong);
  border-radius: 10px; padding: 8px 11px; transition: border-color 0.15s, box-shadow 0.15s; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
input:disabled, textarea:disabled { background: var(--surface-2); color: var(--text-2); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 16px; }
.card-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-hd h3 .muted { font-weight: 500; font-size: 13px; margin-left: 6px; }
.card.empty { text-align: center; padding: 40px 20px; }
.empty-ic { font-size: 40px; margin-bottom: 6px; }
.card.empty .btn { margin-top: 10px; }
.page-hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 4px 2px 16px; flex-wrap: wrap; }
.page-hd p { margin: 4px 0 0; }
.page-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.tip-card { background: linear-gradient(135deg, #fffbeb 0%, #fff 70%); border-color: #fde68a; }
.tip-card p { color: var(--text-2); font-size: 14px; }
.tip-card b, .tip-card h3 { color: #92400e; }
.ring { display: block; }
.ring circle { transition: stroke-dashoffset 0.5s ease; }
.score-ring { --p: 0; --c: var(--primary); position: relative; width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
  background: conic-gradient(var(--c) calc(var(--p) * 1%), #e2e8f0 0); }
.score-ring::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: #fff; }
.score-ring b, .score-ring small { position: relative; line-height: 1; }
.score-ring b { font-size: 20px; }
.score-ring small { position: absolute; bottom: 12px; font-size: 10px; color: var(--muted); }
.score-ring.ok { --c: #16a34a; }
.score-ring.warn { --c: #f59e0b; }
.score-ring.bad { --c: #ef4444; }
.score-ring.big { width: 110px; height: 110px; }
.score-ring.big::before { inset: 9px; }
.score-ring.big b { font-size: 34px; }
.score-ring.big small { bottom: 22px; font-size: 12px; }

/* toast / modal */
#toastBox { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: #0f172a; color: #fff; padding: 10px 18px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(10px);
  transition: opacity 0.2s, transform 0.2s; max-width: min(560px, 90vw); }
.toast.show { opacity: 1; transform: none; }
.toast.ok { background: #166534; }
.toast.bad { background: #b91c1c; }
.modal-wrap { position: fixed; inset: 0; z-index: 200; background: rgba(15, 23, 42, 0.42); display: flex; align-items: flex-start; justify-content: center;
  padding: 7vh 16px 16px; opacity: 0; transition: opacity 0.18s; overflow-y: auto; }
.modal-wrap.show { opacity: 1; }
.modal { background: #fff; border-radius: 16px; box-shadow: var(--shadow-lg); width: min(520px, 100%); max-height: 86vh; display: flex; flex-direction: column; }
.modal.wide { width: min(820px, 100%); }
.modal-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px 10px; }
.modal-bd { padding: 4px 20px 12px; overflow-y: auto; }
.modal-ft { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--border); }
.confirm-msg { font-size: 15px; color: var(--text-2); }
.ob-intro { font-size: 15px; color: var(--text-2); }
.ob-levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 14px 0 10px; }
.ob-lv { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 14px; border-radius: 12px; border: 1.5px solid var(--border); background: #fff; cursor: pointer;
  font: inherit; color: var(--text-2); font-size: 13px; transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s; }
.ob-lv:hover { border-color: var(--lv); box-shadow: 0 0 0 3px var(--lv-soft); transform: translateY(-1px); }
.ob-lv b { color: var(--text); font-size: 15px; }
.ob-lv b small { color: var(--muted); font-weight: 500; font-size: 12px; }
.ob-id { align-self: flex-start; padding: 1px 9px; border-radius: 7px; background: var(--lv-soft); color: var(--lv); font-weight: 800; }

/* =========================================================================
 * 4. 首頁 / 文章列表 / 課程卡
 * ========================================================================= */
.today { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px 28px;
  background: linear-gradient(135deg, #eef4ff 0%, #f6f0ff 55%, #fff 100%); border-color: #dbe4ff; }
.greet { color: var(--text-2); font-weight: 600; }
.today h1 { font-size: 30px; margin: 4px 0 10px; }
.today-stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.85); border: 1px solid var(--border); font-size: 13.5px; color: var(--text-2); }
.today-plan-mini { margin-top: 12px; color: var(--text-2); font-size: 14px; }
.today-ring { position: relative; flex-shrink: 0; }
.ring-txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-txt b { font-size: 34px; line-height: 1; }
.ring-txt small { color: var(--muted); font-size: 12px; }
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); }
.step.ok { background: #f0fdf4; border-color: #bbf7d0; }
.step-n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; background: #fff; border: 1.5px solid var(--border-strong); color: var(--text-2); flex-shrink: 0; }
.step.ok .step-n { background: var(--ok); border-color: var(--ok); color: #fff; }
.step-ic { font-size: 22px; }
.step-txt { flex: 1; min-width: 0; }
.step-txt .muted { font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.continue h3, .wotd h3 { margin: 6px 0 4px; font-size: 18px; }
.continue .btn, .wotd-acts { margin-top: 12px; }
.wotd-w { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.wotd-w b { font-size: 24px; }
.ipa { color: var(--muted); font-family: "Lucida Sans Unicode", "Arial Unicode MS", var(--font); font-size: 14px; }
.wotd-zh { font-size: 16px; font-weight: 600; margin: 4px 0; }
.wotd-ex { display: flex; gap: 6px; align-items: flex-start; color: var(--text-2); font-size: 14px; }
.wotd-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.lv-bars { display: flex; flex-direction: column; gap: 8px; }
.lv-bar { display: grid; grid-template-columns: 40px 70px 1fr 64px; align-items: center; gap: 10px; color: var(--text-2); text-decoration: none !important; padding: 4px 6px; border-radius: 8px; }
.lv-bar:hover { background: var(--surface-hover); }
.lvb-id { font-weight: 800; color: var(--lv); }
.lvb-name { font-size: 13px; }
.lvb-track { height: 10px; border-radius: 5px; background: var(--lv-soft); overflow: hidden; }
.lvb-track i { display: block; height: 100%; background: var(--lv); border-radius: 5px; transition: width 0.4s; }
.lvb-n { font-size: 13px; text-align: right; color: var(--muted); }
.lesson-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.lcard { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 15px 16px 13px; background: #fff; border: 1px solid var(--border); border-radius: 14px;
  color: var(--text); text-decoration: none !important; box-shadow: var(--shadow); transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s; border-top: 3px solid var(--lv); }
.lcard:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: color-mix(in srgb, var(--lv) 45%, var(--border)); }
.lcard.done { background: linear-gradient(180deg, #f7fdf9 0%, #fff 60%); }
.lc-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lc-ic { font-size: 20px; }
.lc-fav { color: #f59e0b; font-size: 15px; }
.lc-done { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.lcard h3 { font-size: 16px; margin-top: 6px; }
.lc-zh { color: var(--text-2); font-size: 13.5px; font-weight: 600; }

/* =========================================================================

/* 播放器 */

/* 對話泡泡 */

.chat.hide-zh .bubble .zh { display: none; }

.vw { border-bottom: 2px solid #f59e0b; background: linear-gradient(transparent 62%, #fef3c7 62%); }

/* 查字彈窗 */
.wpop { position: absolute; z-index: 150; background: #fff; border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 12px 14px; max-height: 70vh; overflow-y: auto; }

  font-weight: 600; cursor: pointer; box-shadow: var(--shadow-md); white-space: nowrap; }

.dict-layout, .quiz-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }

  function readStuCookie() {
    if (window.location && window.location.protocol === 'file:') return null;
    try {

      for (var i = 0; i < parts.length; i++) {

  // 1. 振假名標記

  /** 解析成片段：{t:'ruby', b, r} | {t:'text', s} | {t:'sp'}。格式錯誤時 errors 會有訊息。 */
  function parse(markup) {
    const src = String(markup == null ? '' : markup);
    const segs = [];
    const errors = [];
    let buf = '';
    const flush = () => { if (buf) { segs.push({ t: 'text', s: buf }); buf = ''; } };
    for (let i = 0; i < src.length; i++) {
      const c = src[i];
      if (c === '{') {
        const end = src.indexOf('}', i);

        if (end < 0 || bar < 0 || bar > end) { errors.push(`括號不完整（位置 ${i}）`); buf += c; continue; }

    const out = [];

    for (const g of segsOf(m)) {

      if (!cur) { cur = { raw: '', surface: '', reading: '', kanaOnly: true }; out.push(cur); }
      if (g.t === 'ruby') { cur.raw += `{${g.b}|${g.r}}`; cur.surface += g.b; cur.reading += g.r; cur.kanaOnly = false; } else { cur.raw += g.s; cur.surface += g.s; cur.reading += g.s; }

  JA.topic = (k) => {
    const t = JA.TOPICS[k] || ['其他', '📘'];
    return { key: k, zh: t[0], icon: t[1] };
  };

  // ---------------------------------------------------------------------------
  // 5. 課程與單字庫索引
  // ---------------------------------------------------------------------------
  let LESSON_MAP = null;
  JA.indexLessons = () => {
    LESSON_MAP = new Map();
    JA.VOCAB_INDEX = new Map();
    JA.LESSONS.sort((a, b) => (JA.LV_ORDER[a.level] - JA.LV_ORDER[b.level]) || (a.custom ? 1 : 0) - (b.custom ? 1 : 0) ||
      String(a.id).localeCompare(String(b.id)));
    for (const L of JA.LESSONS) {
      if (!L || !L.id || !Array.isArray(L.lines)) continue;
      LESSON_MAP.set(L.id, L);
      L._chars = L.lines.reduce((n, ln) => n + jp.surface(ln.ja || '').length, 0);
      L._min = Math.max(1, Math.round(L._chars / 140));
      L._hay = [jp.surface(L.title || ''), jp.reading(L.title || ''), L.title_zh, L.scene_zh, JA.topic(L.topic).zh, L.level,
        JA.level(L.level).jlpt, ...L.lines.map((x) => `${jp.surface(x.ja || '')} ${x.zh || ''}`)].join(' ').toLowerCase();
      for (const v of L.vocab || []) {
        const key = jp.surface(v.w || '');
        if (key && !JA.VOCAB_INDEX.has(key)) JA.VOCAB_INDEX.set(key, { entry: v, lessonId: L.id, level: L.level });
      }
    }
  };
  JA.lessons = () => { if (!LESSON_MAP) JA.indexLessons(); return JA.LESSONS.filter((L) => LESSON_MAP.has(L.id)); };
  JA.lesson = (id) => { if (!LESSON_MAP) JA.indexLessons(); return LESSON_MAP.get(id) || null; };
  JA.speakerOf = (L, key) => (L.speakers && L.speakers[key]) || { name: key, gender: 'F' };
  JA.voiceOf = (L, key) => {
    const sp = JA.speakerOf(L, key);
    const same = Object.keys(L.speakers || {}).filter((k) => (L.speakers[k] || {}).gender === sp.gender);
    return { gender: sp.gender, rank: Math.max(0, same.indexOf(key)) };
  };

  /** 單字庫：JA.WORDS（扁平陣列，帶 level / key / 表層 / 讀音），JA.WORD_INDEX（表層 → 單字）。 */
  let WORDS = null;
  JA.indexWords = () => {
    WORDS = [];
    JA.WORD_INDEX = new Map();
    const seen = new Set();
    for (const lv of JA.LEVELS.map((l) => l.id)) {
      (JA.WORD_BANKS[lv] || []).forEach((v, i) => {
        if (!v || !v.w) return;
        const s = jp.surface(v.w);
        const r = jp.reading(v.w);
        const key = `${s}|${jp.toHira(r)}`;
        if (seen.has(key)) return;
        seen.add(key);
        const it = { ...v, level: lv, idx: i, key, s, r, ro: jp.romaji(v.w) };
        it._hay = `${s} ${r} ${jp.toHira(r)} ${it.ro} ${v.zh || ''} ${jp.surface(v.ex || '')}`.toLowerCase();
        WORDS.push(it);
        if (!JA.WORD_INDEX.has(s)) JA.WORD_INDEX.set(s, it);
      });
    }
    return WORDS;
  };
  JA.words = (lv) => { if (!WORDS) JA.indexWords(); return lv ? WORDS.filter((w) => w.level === lv) : WORDS; };

  // ---------------------------------------------------------------------------
  // 6. 學習狀態（localStorage + /api/state 同步）
  // ---------------------------------------------------------------------------
  const KEY = 'ja.state.v1';
  function defaults() {
    return {
      v: 1,
      settings: { _u: 0, level: '', goalMin: 15, rate: 1, ttsEngine: 'auto', voiceF: '', voiceM: '', showZh: true, showFuri: true,
        showRomaji: false, showVocab: true, recordVoice: true, kanaScript: 'h', newPerDay: 10, onboarded: false, beginner: false },
      meta: { _u: 0 },
      lessons: {},
      vocab: {},
      kana: {},
      days: {},
    };
  }
  const isObj = (x) => !!x && typeof x === 'object' && !Array.isArray(x);
  const isNum = (v) => typeof v === 'number' && isFinite(v);
  const U = (x) => (isObj(x) ? +x._u || 0 : 0);
  const clone = (x) => (x == null ? x : JSON.parse(JSON.stringify(x)));
  function lww(x, y) {
    if (!isObj(x)) return isObj(y) ? clone(y) : null;
    if (!isObj(y)) return clone(x);
    return clone(U(y) >= U(x) ? y : x);
  }
  function maxMerge(base, other) {
    const out = clone(base);
    for (const k of Object.keys(other)) {
      const ov = other[k];
      const bv = out[k];
      if (isNum(ov) && (bv == null || isNum(bv))) out[k] = bv == null ? ov : Math.max(bv, ov);
      else if (isObj(ov) && isObj(bv)) out[k] = maxMerge(bv, ov);
      else if (isObj(ov) && bv == null) out[k] = clone(ov);
    }
    return out;
  }
  const mergeLesson = (x, y) => {
    if (!isObj(x) || !isObj(y)) return lww(x, y);
    return U(y) >= U(x) ? maxMerge(y, x) : maxMerge(x, y);
  };
  const mergeDay = (x, y) => (!isObj(x) || !isObj(y) ? lww(x, y) : maxMerge(x, y));
  function mergeMap(a, b, fn) {
    a = isObj(a) ? a : {};
    b = isObj(b) ? b : {};
    const out = {};
    for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) {
      const v = fn(a[k], b[k]);
      if (v != null) out[k] = v;
    }
    return out;
  }
  JA.mergeState = (a, b) => {
    a = isObj(a) ? a : {};
    b = isObj(b) ? b : {};
    const out = { v: 1 };
    out.settings = lww(a.settings, b.settings) || {};
    const meta = lww(a.meta, b.meta) || {};
    const reset = Math.max(+((a.meta || {}).reset) || 0, +((b.meta || {}).reset) || 0);
    if (reset) meta.reset = reset;
    out.meta = meta;
    out.lessons = mergeMap(a.lessons, b.lessons, mergeLesson);
    out.vocab = mergeMap(a.vocab, b.vocab, lww);
    out.kana = mergeMap(a.kana, b.kana, lww);
    out.days = mergeMap(a.days, b.days, mergeDay);
    if (reset) {
      for (const k of ['lessons', 'vocab', 'kana', 'days']) {
        for (const id of Object.keys(out[k])) if (U(out[k][id]) < reset) delete out[k][id];
      }
    }
    return out;
  };

  function loadLocal() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const st = JSON.parse(raw);
        const d = defaults();
        return { ...d, ...st, settings: { ...d.settings, ...(st.settings || {}) }, kana: st.kana || {} };
      }
    } catch (e) { /* corrupted storage → start fresh */ }
    return defaults();
  }
  JA.state = loadLocal();
  JA.serverAvailable = false;
  JA.health = null;

  function writeLocal() {
    try { localStorage.setItem(KEY, JSON.stringify(JA.state)); } catch (e) { /* quota */ }
  }
  let syncTimer = null;
  let syncing = false;
  let syncAgain = false;
  JA.save = (opts) => {
    writeLocal();
    if (!(opts && opts.silent)) JA.emit('state');
    if (JA.serverAvailable) {
      clearTimeout(syncTimer);
      syncTimer = setTimeout(doSync, (opts && opts.delay) || 2500);
    }
  };
  async function doSync() {
    if (syncing) { syncAgain = true; return; }
    syncing = true;
    try {
      const merged = await JA.api('/api/state', { body: JA.state, timeout: 20000 });
      if (merged && merged.v) {
        const d = defaults();
        JA.state = JA.mergeState(JA.state, merged);
        JA.state.settings = { ...d.settings, ...JA.state.settings };
        writeLocal();
      }
    } catch (e) { /* offline — localStorage still has everything; retry on next change */ }
    syncing = false;
    if (syncAgain) { syncAgain = false; clearTimeout(syncTimer); syncTimer = setTimeout(doSync, 400); }
  }
  JA.flushSync = () => {
    if (!JA.serverAvailable || !navigator.sendBeacon) return;
    clearTimeout(syncTimer);
    try { navigator.sendBeacon('/api/state', new Blob([JSON.stringify(JA.state)], { type: 'application/json' })); } catch (e) { /* ignore */ }
  };
  /** GitHub Pages / file:// / 打包的單一檔：沒有後端。 */
  JA.isStatic = () => !!(window.JA_STATIC_ONLY || (location.protocol !== 'http:' && location.protocol !== 'https:') ||
    /\.github\.io$|\.pages\.dev$|\.netlify\.app$|\.vercel\.app$/i.test(location.hostname || ''));
  JA.initSync = async () => {
    if (JA.isStatic()) { JA.serverAvailable = false; return false; }
    try {
      JA.health = await JA.api('/api/health', { timeout: 5000 });
      JA.serverAvailable = !!(JA.health && JA.health.ok);
    } catch (e) {
      JA.serverAvailable = false;
    }
    if (!JA.serverAvailable) return false;
    try {
      const remote = await JA.api('/api/state', { timeout: 12000 });
      const d = defaults();
      JA.state = JA.mergeState(JA.state, remote || {});
      JA.state.settings = { ...d.settings, ...JA.state.settings };
      writeLocal();
      await doSync();
      JA.emit('state');
    } catch (e) { /* keep local */ }
    return true;
  };
  document.addEventListener('visibilitychange', () => { if (document.hidden) JA.flushSync(); });
  window.addEventListener('pagehide', () => JA.flushSync());

  JA.settings = () => JA.state.settings;
  JA.setSetting = (k, v) => {
    JA.state.settings[k] = v;
    JA.state.settings._u = Date.now();
    JA.save();
  };
  JA.prog = (id) => JA.state.lessons[id] || {};
  JA.updateProg = (id, fn) => {
    const p = clone(JA.state.lessons[id] || {});
    fn(p);
    p._u = Date.now();
    p.last = Date.now();
    JA.state.lessons[id] = p;
    JA.state.meta.last = { lesson: id, mode: p.mode || 'read', at: Date.now() };
    JA.state.meta._u = Date.now();
    if (!p.done && JA.lessonDone(p)) {
      p.done = Date.now();
      JA.addXP(20, 'done');
      JA.toast('🎉 太棒了！完成一課，+20 XP', 'ok');
    }
    JA.save();
    return p;
  };
  /** 一課算「完成」：完整聽過一次，加上任一種口說 / 聽寫 / 測驗練習。 */
  JA.lessonDone = (p) => !!(p && p.listen && ((p.quiz && p.quiz.best >= 60) || (p.shadow && p.shadow.n >= 3) ||
    (p.role && p.role.n >= 1) || (p.dict && p.dict.n >= 3)));

  // ---------------------------------------------------------------------------
  // 7. 單字本（SM-2 間隔重複）：key = 表層|平假名讀音
  // ---------------------------------------------------------------------------
  const DAY = 86400000;
  const keyOf = (w) => {
    const s = String(w || '').trim();
    if (!s) return '';
    if (s.indexOf('{') < 0 && s.indexOf('|') > 0) return s;
    return `${jp.surface(s)}|${jp.toHira(jp.reading(s))}`;
  };
  JA.vocab = {
    key: keyOf,
    get(w) {
      const v = JA.state.vocab[keyOf(w)];
      return v && !v.deleted ? v : null;
    },
    has(w) { return !!this.get(w); },
    list() {
      return Object.entries(JA.state.vocab).filter(([, v]) => v && !v.deleted).map(([k, v]) => ({ ...v, key: k }))
        .sort((a, b) => (b.added || 0) - (a.added || 0));
    },
    /** 新增或更新一個單字（w 為標記格式）；回傳是否為新加入。 */
    save(entry) {
      const k = keyOf(entry.w);
      if (!k) return false;
      const old = this.get(k);
      const now = Date.now();
      const v = old ? { ...old } : { added: now, srs: { ease: 2.5, ivl: 0, reps: 0, lapses: 0, due: now } };
      for (const f of ['w', 'zh', 'pos', 'ex', 'ex_zh', 'src', 'lvl', 'note']) {
        if (entry[f] != null && entry[f] !== '' && (!old || !old[f] || entry.force)) v[f] = entry[f];
      }
      v._u = now;
      JA.state.vocab[k] = v;
      if (!old) JA.addXP(1, 'words');
      else JA.save();
      JA.emit('vocab');
      return !old;
    },
    update(w, patch) {
      const k = keyOf(w);
      const old = this.get(k);
      if (!old) return;
      JA.state.vocab[k] = { ...old, ...patch, _u: Date.now() };
      JA.save();
      JA.emit('vocab');
    },
    remove(w) {
      const k = keyOf(w);
      JA.state.vocab[k] = { deleted: true, _u: Date.now() };
      JA.save();
      JA.emit('vocab');
    },
    status(v) {
      const s = (v && v.srs) || {};
      if (!s.reps) return 'new';
      return (s.ivl || 0) >= 21 ? 'mastered' : 'learning';
    },
    due(list) {
      const now = Date.now();
      return (list || this.list()).filter((v) => ((v.srs && v.srs.due) || 0) <= now);
    },
    /** SM-2：q = 0 忘記 / 3 困難 / 4 記得 / 5 簡單。 */
    grade(w, q) {
      const v = this.get(w);
      if (!v) return null;
      const s = JA.sm2(v.srs, q);
      this.update(w, { srs: s });
      return s;
    },
  };
  /** 共用的 SM-2 排程（單字本與五十音都用）。 */
  JA.sm2 = (srs, q, opts) => {
    const s = { ease: 2.5, ivl: 0, reps: 0, lapses: 0, ...(srs || {}) };
    const first = (opts && opts.first) || [1, 6];
    if (q < 3) {
      s.reps = 0;
      s.lapses = (s.lapses || 0) + 1;
      s.ivl = 0;
      s.due = Date.now() + 10 * 60000;
    } else {
      s.reps += 1;
      if (s.reps === 1) s.ivl = q === 5 ? first[0] * 3 : first[0];
      else if (s.reps === 2) s.ivl = q === 5 ? first[1] + 2 : q === 3 ? Math.max(2, first[1] - 3) : first[1];
      else s.ivl = Math.round(s.ivl * s.ease * (q === 3 ? 0.75 : q === 5 ? 1.3 : 1));
      s.ivl = Math.min(Math.max(1, s.ivl), 365);
      s.due = Date.now() + s.ivl * DAY;
    }
    s.ease = JA.clamp(s.ease + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)), 1.3, 3.0);
    s.last = Date.now();
    return s;
  };
  /** 一個單字庫 / 課程單字的「已學」狀態（在單字本裡）。 */
  JA.wordLearned = (it) => JA.vocab.has(it.key || it.w);

  // ---------------------------------------------------------------------------
  // 8. 每日紀錄：XP、練習時間、連續天數
  // ---------------------------------------------------------------------------
  JA.day = (k) => {
    k = k || JA.todayKey();
    if (!JA.state.days[k]) JA.state.days[k] = { sec: 0, xp: 0, act: {}, _u: Date.now() };
    const d = JA.state.days[k];
    d.act = d.act || {};
    return d;
  };
  JA.addXP = (n, act, count) => {
    const d = JA.day();
    d.xp = (d.xp || 0) + (n || 0);
    if (act) d.act[act] = (d.act[act] || 0) + (count == null ? 1 : count);
    d._u = Date.now();
    JA.save();
    JA.emit('xp', n);
  };
  const dayActive = (k) => {
    const d = JA.state.days[k];
    return !!d && ((d.xp || 0) > 0 || (d.sec || 0) >= 60);
  };
  JA.streak = () => {
    const d = new Date();
    if (!dayActive(JA.dayKey(d))) d.setDate(d.getDate() - 1);
    let n = 0;
    while (dayActive(JA.dayKey(d)) && n < 3650) { n++; d.setDate(d.getDate() - 1); }
    return n;
  };
  JA.totalXP = () => Object.values(JA.state.days).reduce((a, d) => a + (d.xp || 0), 0);
  JA.totalSec = () => Object.values(JA.state.days).reduce((a, d) => a + (d.sec || 0), 0);

  // 練習時間：只在練習頁面、分頁可見、且 60 秒內有操作時累計
  let lastActive = 0;
  let pendingSec = 0;
  JA.markActive = () => { lastActive = Date.now(); };
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach((ev) => window.addEventListener(ev, JA.markActive, { passive: true }));
  const PRACTICE = new Set(['lesson', 'review', 'vocab', 'kana', 'words']);
  setInterval(() => {
    if (document.hidden || !JA.curRoute || !PRACTICE.has(JA.curRoute.name)) return;
    if (Date.now() - lastActive > 60000) return;
    const d = JA.day();
    d.sec = (d.sec || 0) + 5;
    d._u = Date.now();
    pendingSec += 5;
    if (pendingSec >= 30) { pendingSec = 0; JA.save(); } else { writeLocal(); }
    JA.emit('tick');
  }, 5000);

  // ---------------------------------------------------------------------------
  // 9. API
  // ---------------------------------------------------------------------------
  JA.api = async (path, opts) => {
    opts = opts || {};
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), opts.timeout || 15000);
    try {
      const res = await fetch(path, {
        method: opts.method || (opts.body ? 'POST' : 'GET'),
        headers: opts.body ? { 'Content-Type': 'application/json' } : {},
        body: opts.body ? JSON.stringify(opts.body) : undefined,
        signal: ctrl.signal,
        cache: 'no-store',
      });
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('json')) throw new Error(`伺服器沒有回應（HTTP ${res.status}）`);
      const data = await res.json();
      if (!res.ok && data && data.error) throw new Error(data.error);
      return data;
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('連線逾時，請稍後再試');
      throw e;
    } finally {
      clearTimeout(t);
    }
  };
  JA.aiAvailable = () => !!(JA.serverAvailable && JA.health && JA.health.ai);
  /** 啟動伺服器端 AI 工作並輪詢結果。onTick(elapsedSec) 可顯示進度。 */
  JA.aiRun = async (kind, payload, onTick) => {
    const st = await JA.api('/api/ai/start', { body: { kind, ...payload } });
    if (!st.ok) throw new Error(st.error || 'AI 無法啟動');
    const t0 = Date.now();
    while (Date.now() - t0 < 210000) {
      await JA.sleep(1500);
      const r = await JA.api(`/api/ai/task?id=${encodeURIComponent(st.task)}`);
      if (r.state === 'done') {
        if (!r.result || !r.result.ok) throw new Error((r.result && r.result.error) || 'AI 失敗');
        return r.result;
      }
      if (r.state === 'missing') throw new Error(r.error || 'AI 工作不見了');
      if (onTick) onTick(Math.round((Date.now() - t0) / 1000));
    }
    throw new Error('AI 回覆逾時，請再試一次');
  };

  // ---------------------------------------------------------------------------
  // 10. 路由（#/page/param?query）
  // ---------------------------------------------------------------------------
  JA.routes = {};
  JA.route = (name, fn) => { JA.routes[name] = fn; };
  const cleanups = [];
  JA.onCleanup = (fn) => cleanups.push(fn);
  JA.parseHash = () => {
    const raw = location.hash.replace(/^#\/?/, '');
    const hi = raw.indexOf('#');
    const anchor = hi >= 0 ? raw.slice(hi + 1) : '';
    const h = hi >= 0 ? raw.slice(0, hi) : raw;
    const qi = h.indexOf('?');
    const p = qi >= 0 ? h.slice(0, qi) : h;
    const qs = qi >= 0 ? h.slice(qi + 1) : '';
    const parts = p.split('/').filter(Boolean).map((x) => { try { return decodeURIComponent(x); } catch (e) { return x; } });
    const query = Object.fromEntries(new URLSearchParams(qs));
    if (anchor && !query.sec) query.sec = anchor;
    return { name: parts[0] || 'home', params: parts.slice(1), query, anchor };
  };
  JA.hashFor = (name, params, query) => {
    const q = new URLSearchParams();
    Object.entries(query || {}).forEach(([k, v]) => { if (v != null && v !== '') q.set(k, v); });
    const qs = q.toString();
    return `#/${[name, ...(params || [])].map(encodeURIComponent).join('/')}${qs ? `?${qs}` : ''}`;
  };
  JA.go = (hash) => {
    if (location.hash === hash) JA.renderRoute();
    else location.hash = hash;
  };
  /** 換掉目前網址的 query（不新增瀏覽紀錄），觸發重新渲染。 */
  JA.setQuery = (patch) => {
    const r = JA.parseHash();
    location.replace(JA.hashFor(r.name, r.params, { ...r.query, ...patch }));
  };
  JA.runCleanups = () => {
    while (cleanups.length) {
      const fn = cleanups.pop();
      try { fn(); } catch (e) { console.error(e); }
    }
    if (JA.tts) JA.tts.stop();
    if (JA.asr) JA.asr.abort();
    if (JA.wpop) JA.wpop.close();
  };
  JA.renderRoute = () => {
    JA.runCleanups();
    const r = JA.parseHash();
    const main = JA.$('#appMain');
    const fn = JA.routes[r.name] || JA.routes.home;
    const prev = JA.curRoute;
    JA.curRoute = r;
    main.innerHTML = '';
    main.className = `app-main page-${r.name}`;
    try {
      fn(main, r.params, r.query);
    } catch (e) {
      console.error(e);
      main.innerHTML = `<div class="card empty"><h3>這個頁面出了點問題</h3><p class="muted">${JA.esc(e.message)}</p>
        <a class="btn primary" href="#/home">回首頁</a></div>`;
    }
    JA.emit('route', r);
    const samePage = prev && prev.name === r.name && prev.params.join('/') === r.params.join('/');
    const targetId = r.anchor || (r.query && r.query.sec);
    const targetEl = targetId ? document.getElementById(targetId) : null;
    if (targetEl) targetEl.scrollIntoView({ behavior: 'auto', block: 'start' });
    else if (!samePage) window.scrollTo({ top: 0, behavior: 'auto' });
  };
  window.addEventListener('hashchange', JA.renderRoute);
})();

</script>
  <script>/* /js/speech.js */
/* 日語學院 Japanese Academy — speech.js
 * 1. JA.tts   — 日語朗讀：只用 ja-JP 聲音（Google 日本語 / Kyoko / O-ren / Microsoft Nanami …），
 *               沒有日語聲音時自動改用 🌐 雲端語音並顯示安裝說明 —— 絕不讓英文聲音唸日文

  <!-- 介面 -->
  <script>/* /js/kana.js */
/* 日語學院 Japanese Academy — kana.js
 * 「あ 五十音」(#/kana)：平假名 ↔ 片假名切換、清音 / 濁音・半濁音 / 拗音表、點字即發音（ja-JP）、
 * 例字與字源記憶法、一行一行學（#/kana/row/<id>）、三種測驗（看字選音 / 聽音選字 / 打字輸入羅馬拼音，#/kana/quiz）、
 * 每個假名的熟練度（SM-2 間隔複習）。
 */
(function () {
  'use strict';
  const JA = window.JA;
  const jp = JA.jp;
  const esc = JA.esc;
  const K = () => JA.KANA || { rows: [], info: {}, notes: [] };
  const TABS = [
    { id: 'seion', label: '清音', groups: ['seion'] },
    { id: 'daku', label: '濁音・半濁音', groups: ['dakuon', 'handakuon'] },
    { id: 'yoon', label: '拗音', groups: ['yoon'] },
    { id: 'notes', label: '發音重點', groups: [] },
  ];
  const GROUP_ZH = { seion: '清音', dakuon: '濁音', handakuon: '半濁音', yoon: '拗音' };
  const LV = [['未學', ''], ['學習中', 'warn'], ['熟悉', 'info'], ['精熟', 'ok']];
  // 形狀容易混淆的假名：測驗時優先當干擾選項
  const CONFUSE = [['さ', 'ち'], ['ぬ', 'め'], ['ね', 'れ', 'わ'], ['る', 'ろ'], ['は', 'ほ', 'ま'], ['き', 'さ'], ['い', 'り'],
    ['こ', 'に'], ['あ', 'お', 'め'], ['う', 'つ', 'ら'], ['く', 'へ'], ['シ', 'ツ'], ['ソ', 'ン', 'リ'], ['ク', 'ケ', 'タ'],
    ['ウ', 'ワ', 'フ'], ['コ', 'ユ', 'ロ'], ['チ', 'テ'], ['ヌ', 'ス'], ['マ', 'ム'], ['ノ', 'メ', 'ナ'], ['エ', 'ニ'], ['ア', 'マ']];
  // 聽音選字時發音相同、無法分辨的假名不出題
  const NO_LISTEN = new Set(['を', 'ヲ', 'ぢ', 'ヂ', 'づ', 'ヅ']);

  // ---------------------------------------------------------------------------
  // 資料與熟練度
  // ---------------------------------------------------------------------------
  let ALL = null;
  function all() {
    if (ALL) return ALL;
    ALL = [];
    for (const row of K().rows) {
      row.h.forEach((h, i) => {
        if (!h) return;
        const r = row.r[i];
        ALL.push({ ch: h, script: 'h', r, row: row.id, group: row.group, col: i });
        ALL.push({ ch: row.k[i], script: 'k', r, row: row.id, group: row.group, col: i });
      });
    }
    return ALL;
  }
  const rowName = (row, s) => {
    const first = s === 'k' ? row.k[0] : row.h[0];
    return row.id === 'n' ? first : `${first}行`;
  };
  const romajiMain = (r) => String(r || '').split('/')[0];
  const DAY = 86400000;
  const kana = (JA.kanaApi = {
    all,
    rows: () => K().rows,
    info: (ch) => K().info[ch] || {},
    rec: (ch) => JA.state.kana[ch] || null,
    level(ch) {
      const v = JA.state.kana[ch];
      if (!v || !v.n) return 0;
      const ivl = (v.srs && v.srs.ivl) || 0;
      return ivl >= 7 ? 3 : ivl >= 2 ? 2 : 1;
    },
    grade(ch, ok) {
      const old = JA.state.kana[ch] || {};
      const srs = JA.sm2(old.srs, ok ? 4 : 1, { first: [1, 3] });
      JA.state.kana[ch] = { ...old, srs, n: (old.n || 0) + 1, ok: (old.ok || 0) + (ok ? 1 : 0), _u: Date.now() };
      JA.save();
      JA.emit('kana');
    },
    due(script) {
      const now = Date.now();
      return all().filter((k) => (!script || script === 'mix' || k.script === script) && JA.state.kana[k.ch] &&
        ((JA.state.kana[k.ch].srs || {}).due || 0) <= now);
    },
    stats(script) {
      const list = all().filter((k) => !script || k.script === script);
      const lv = list.map((k) => this.level(k.ch));
      return { total: list.length, seen: lv.filter((x) => x > 0).length, mastered: lv.filter((x) => x >= 3).length,
        familiar: lv.filter((x) => x >= 2).length, due: this.due(script).length };
    },
    rowLearned: (s, id) => !!(JA.state.kana[`row:${s}:${id}`] || {}).learned,
    markRow(s, id) {
      JA.state.kana[`row:${s}:${id}`] = { learned: Date.now(), _u: Date.now() };
      JA.save();
    },
    /** 下一個還沒學的行（首頁「今日計畫」用）。 */
    nextRow(s) {
      s = s || 'h';
      return K().rows.find((r) => !this.rowLearned(s, r.id)) || null;
    },
    rowName,
  });

  /** 一個假名的發音（單字假名唸慢一點）。 */
  const sayKana = (ch, slow) => JA.tts.speak(ch, { gender: 'F', rate: slow ? 0.6 : 0.85 });

  // ---------------------------------------------------------------------------
  // #/kana 主頁
  // ---------------------------------------------------------------------------
  function scriptSeg(s) {
    return `<div class="seg script-seg" role="group" aria-label="平假名 / 片假名">
      <button type="button" data-script="h" class="${s === 'h' ? 'active' : ''}">ひらがな <small>平假名</small></button>
      <button type="button" data-script="k" class="${s === 'k' ? 'active' : ''}">カタカナ <small>片假名</small></button></div>`;
  }
  function statChips() {
    const h = kana.stats('h');
    const k = kana.stats('k');
    return `<div class="kana-stats">
      <span class="chip ${h.familiar === h.total ? 'ok' : ''}" title="熟悉以上 / 全部">平假名 ${h.familiar}/${h.total}</span>
      <span class="chip ${k.familiar === k.total ? 'ok' : ''}" title="熟悉以上 / 全部">片假名 ${k.familiar}/${k.total}</span>
      ${h.due + k.due ? `<a class="chip warn" href="#/kana/quiz?type=pick&scope=due&s=mix">⏰ ${h.due + k.due} 個該複習</a>` : ''}</div>`;
  }
  function cellHtml(ch, r) {
    if (!ch) return '<span class="kc empty" aria-hidden="true"></span>';
    const lv = kana.level(ch);
    return `<button type="button" class="kc lv${lv}" data-ch="${esc(ch)}" title="${esc(romajiMain(r))} · ${LV[lv][0]}">
      <b>${esc(ch)}</b><small>${esc(romajiMain(r))}</small></button>`;
  }
  function tableHtml(tab, s) {
    const rows = K().rows.filter((r) => tab.groups.includes(r.group));
    const yoon = tab.id === 'yoon';
    const cols = yoon ? ['ya', 'yu', 'yo'] : ['a', 'i', 'u', 'e', 'o'];
    let html = `<div class="ktable ${yoon ? 'yoon' : ''}"><div class="kt-row kt-head"><span></span>${cols.map((c) => `<span>${c}</span>`).join('')}</div>`;
    let lastGroup = '';
    for (const row of rows) {
      if (tab.id === 'daku' && row.group !== lastGroup) {
        html += `<div class="kt-group">${GROUP_ZH[row.group]}${row.group === 'handakuon' ? '（右上角加「゜」）' : '（右上角加「゛」）'}</div>`;
        lastGroup = row.group;
      }
      const chars = s === 'k' ? row.k : row.h;
      const learned = kana.rowLearned(s, row.id);
      html += `<div class="kt-row"><a class="kt-lbl ${learned ? 'done' : ''}" href="${JA.hashFor('kana', ['row', row.id], { s })}" title="一行一行學：${esc(rowName(row, s))}">
        ${esc(rowName(row, s))}${learned ? '<i>✓</i>' : ''}</a>${chars.map((ch, i) => cellHtml(ch, row.r[i])).join('')}</div>`;
    }
    return `${html}</div>
      <div class="kt-legend muted small">${LV.map(([t], i) => `<span><i class="kc-dot lv${i}"></i>${t}</span>`).join('')}
        <span>· 點假名聽發音，點行名一行一行學</span></div>`;
  }
  function notesHtml() {
    return `<div class="knotes">${(K().notes || []).map((n) => `<section class="card knote">
      <h3>${esc(n.title)}</h3><p>${esc(n.body)}</p>
      <div class="knote-ex">${(n.ex || []).map((x) => `<button type="button" class="kn-ex" data-say="${esc(jp.surface(x.ja))}">
        <span class="ja-txt">${JA.ruby(x.ja)}</span><small>${esc(jp.romaji(x.ja))}</small><em>${esc(x.zh)}</em><i>🔊</i></button>`).join('')}</div>
    </section>`).join('')}</div>`;
  }
  function detailHtml(ch) {
    const it = all().find((k) => k.ch === ch);
    if (!it) return '<div class="kd-empty muted">點任何一個假名：會唸出發音，並在這裡顯示例字與記憶法。</div>';
    const inf = kana.info(ch);
    const twin = it.script === 'h' ? jp.toKata(ch) : jp.toHira(ch);
    const row = K().rows.find((r) => r.id === it.row);
    const v = kana.rec(ch);
    const lv = kana.level(ch);
    return `<div class="kd">
      <div class="kd-top"><div class="kd-ch">${esc(ch)}</div>
        <div class="kd-side"><div class="kd-ro">${esc(it.r)}</div>
          <div class="kd-twin" title="${it.script === 'h' ? '對應的片假名' : '對應的平假名'}">${it.script === 'h' ? '片假名' : '平假名'} <b>${esc(twin)}</b></div>
          <span class="chip">${GROUP_ZH[it.group]}</span></div></div>
      <div class="kd-acts"><button type="button" class="btn primary" data-kd="say">🔊 發音</button>
        <button type="button" class="btn" data-kd="slow">🐢 慢速</button></div>
      ${inf.src ? `<div class="kd-row"><span class="kd-lbl">字源</span><span>由漢字「<b class="kd-src">${esc(inf.src)}</b>」的${it.script === 'h' ? '草書' : '一部分'}演變而來</span></div>` : ''}
      ${inf.ex ? `<div class="kd-row kd-exrow"><span class="kd-lbl">例字</span><button type="button" class="kd-ex" data-say="${esc(jp.surface(inf.ex))}">
        <span class="ja-txt">${JA.ruby(inf.ex)}</span><small>${esc(jp.romaji(inf.ex))}</small><em>${esc(inf.zh || '')}</em><i>🔊</i></button></div>` : ''}
      ${inf.note ? `<div class="kd-note">💡 ${esc(inf.note)}</div>` : ''}
      <div class="kd-row"><span class="kd-lbl">熟練度</span><span><span class="chip ${LV[lv][1]}">${LV[lv][0]}</span>
        ${v && v.n ? `<span class="muted small"> 答對 ${v.ok || 0}/${v.n} · ${(v.srs && v.srs.due) > Date.now() ? `下次複習 ${JA.fmtRel(v.srs.due)}` : '該複習了'}</span>` : ''}</span></div>
      ${row ? `<div class="kd-foot"><a class="btn sm" href="${JA.hashFor('kana', ['row', row.id], { s: it.script })}">✍️ 學「${esc(rowName(row, it.script))}」</a>
        <a class="btn sm ghost" href="${JA.hashFor('kana', ['quiz'], { type: 'pick', scope: `row:${row.id}`, s: it.script })}">🎯 測驗這一行</a></div>` : ''}
    </div>`;
  }
  function launcherHtml(tab, s) {
    const scopes = [['tab', `這一頁（${tab.id === 'notes' ? '清音' : tab.label}）`], ['learned', '學過的假名'], ['due', '⏰ 到期複習'], ['all', '全部假名']];
    return `<section class="card kquiz-launch"><div class="card-hd"><h3>🎯 假名測驗</h3></div>
      <div class="kq-types">
        <button type="button" class="kq-type" data-kq="pick"><b>👀 看字選音</b><small>看假名，選出正確的羅馬拼音</small></button>
        <button type="button" class="kq-type" data-kq="listen"><b>👂 聽音選字</b><small>只聽發音，選出正確的假名</small></button>
        <button type="button" class="kq-type" data-kq="type"><b>⌨️ 打字輸入</b><small>看假名，打出羅馬拼音</small></button>
      </div>
      <div class="kq-opts"><label class="field-inline">範圍 <select id="kqScope">${scopes.map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select></label>
        <label class="field-inline">文字 <select id="kqScript"><option value="${s}" selected>${s === 'k' ? '片假名' : '平假名'}</option><option value="mix">平假名＋片假名</option></select></label>
        <label class="field-inline">題數 <select id="kqN"><option>10</option><option>20</option><option>30</option></select></label></div>
    </section>`;
  }

  JA.route('kana', (main, params, query) => {
    if (params[0] === 'row') return rowPage(main, params[1], query);
    if (params[0] === 'quiz') return quizPage(main, query);
    const st = JA.settings();
    const s = query.s === 'k' || query.s === 'h' ? query.s : (st.kanaScript || 'h');
    const tab = TABS.find((t) => t.id === query.tab) || TABS[0];
    let sel = query.ch || '';
    main.innerHTML = `<div class="page-hd"><div><h1><span class="kana-logo">あ</span> 五十音</h1>
        <p class="muted">平假名・片假名一次學：點任何假名就會用日語發音，附例字與字源記憶法；學完一行就測驗，系統依熟練度安排複習。</p></div>
        <div class="page-acts">${scriptSeg(s)}</div></div>
      ${statChips()}
      <div class="seg kana-tabs" id="kTabs">${TABS.map((t) => {
        const n = t.groups.length ? all().filter((k) => k.script === s && t.groups.includes(k.group)).length : 0;
        return `<button type="button" data-tab="${t.id}" class="${t.id === tab.id ? 'active' : ''}">${t.label}${n ? ` <small>${n}</small>` : ''}</button>`;
      }).join('')}</div>
      <div class="kana-layout">
        <section class="card kana-main">${tab.id === 'notes' ? notesHtml() : tableHtml(tab, s)}</section>
        <aside class="kana-side"><section class="card kana-detail" id="kDetail">${detailHtml(sel)}</section>
          ${launcherHtml(tab, s)}</aside>
      </div>`;
    const detail = JA.$('#kDetail', main);
    const isMobile = () => window.matchMedia('(max-width: 960px)').matches;
    let sheet = null;
    const showDetail = (ch) => {
      sel = ch;
      JA.$$('.kc.sel', main).forEach((x) => x.classList.remove('sel'));
      const cell = JA.$(`.kc[data-ch="${CSS.escape(ch)}"]`, main);
      if (cell) cell.classList.add('sel');
      if (isMobile()) {
        if (sheet) sheet.close();
        sheet = JA.modal({ title: `${esc(ch)} 的發音與例字`, body: detailHtml(ch), cls: 'kana-sheet' });
        bindDetail(sheet.el, ch);
      } else {
        detail.innerHTML = detailHtml(ch);
        bindDetail(detail, ch);
      }
    };
    const bindDetail = (root, ch) => {
      root.querySelectorAll('[data-kd]').forEach((b) => {
        b.onclick = () => sayKana(ch, b.dataset.kd === 'slow');
      });
    };
    main.addEventListener('click', (e) => {
      const c = e.target.closest('.kc[data-ch]');
      if (c) { sayKana(c.dataset.ch); showDetail(c.dataset.ch); return; }
      const sc = e.target.closest('[data-script]');
      if (sc) { JA.setSetting('kanaScript', sc.dataset.script); JA.setQuery({ s: sc.dataset.script, ch: '' }); return; }
      const t = e.target.closest('[data-tab]');
      if (t) { JA.setQuery({ tab: t.dataset.tab === 'seion' ? '' : t.dataset.tab, ch: '' }); return; }
      const q = e.target.closest('[data-kq]');
      if (q) {
        const scope = JA.$('#kqScope', main).value;
        JA.go(JA.hashFor('kana', ['quiz'], { type: q.dataset.kq, scope: scope === 'tab' ? `tab:${tab.id === 'notes' ? 'seion' : tab.id}` : scope,
          s: JA.$('#kqScript', main).value, n: JA.$('#kqN', main).value }));
      }
    });
    if (sel) bindDetail(detail, sel);
    const onKana = () => { const box = JA.$('.kana-stats', main); if (box) box.outerHTML = statChips(); };
    JA.on('kana', onKana);
    JA.onCleanup(() => { JA.off('kana', onKana); if (sheet) sheet.close(); });
  });

  // ---------------------------------------------------------------------------
  // #/kana/row/<id>：一行一行學
  // ---------------------------------------------------------------------------
  function rowPage(main, rowId, query) {
    const rows = K().rows;
    const row = rows.find((r) => r.id === rowId);
    const s = query.s === 'k' ? 'k' : 'h';
    if (!row) { JA.go('#/kana'); return; }
    const chars = (s === 'k' ? row.k : row.h).map((ch, i) => ({ ch, r: row.r[i] })).filter((x) => x.ch);
    const ri = rows.indexOf(row);
    const next = rows[ri + 1];
    let i = 0;
    main.innerHTML = `<div class="rv-session"><div class="rv-top"><a class="btn sm ghost" href="${JA.hashFor('kana', [], { s, tab: row.group === 'yoon' ? 'yoon' : row.group === 'seion' ? '' : 'daku' })}">← 五十音</a>
      <b>✍️ 一行一行學：${esc(rowName(row, s))}</b><span class="muted" id="krCount"></span></div>
      <div class="rv-bar"><i id="krBar"></i></div><div class="card rv-card krow-card" id="krCard"></div></div>`;
    const card = JA.$('#krCard', main);
    function render() {
      if (i >= chars.length) return finish();
      const c = chars[i];
      const inf = kana.info(c.ch);
      JA.$('#krCount', main).textContent = `${i + 1} / ${chars.length}`;
      JA.$('#krBar', main).style.width = `${(i / chars.length) * 100}%`;
      card.innerHTML = `<div class="kr-dots">${chars.map((x, k) => `<button type="button" class="kr-dot ${k === i ? 'cur' : k < i ? 'done' : ''}" data-k="${k}">${esc(x.ch)}</button>`).join('')}</div>
        <div class="kr-big" data-say-kana>${esc(c.ch)}</div>
        <div class="kr-ro">${esc(c.r)}</div>
        <div class="kr-acts"><button type="button" class="btn primary" data-kr="say">🔊 再聽一次</button><button type="button" class="btn" data-kr="slow">🐢 慢速</button></div>
        ${inf.src ? `<div class="kr-src">字源：漢字「<b>${esc(inf.src)}</b>」→ <b>${esc(c.ch)}</b></div>` : ''}
        ${inf.ex ? `<button type="button" class="kd-ex big" data-say="${esc(jp.surface(inf.ex))}"><span class="ja-txt">${JA.ruby(inf.ex)}</span>
          <small>${esc(jp.romaji(inf.ex))}</small><em>${esc(inf.zh || '')}</em><i>🔊</i></button>` : ''}
        ${inf.note ? `<div class="kd-note">💡 ${esc(inf.note)}</div>` : ''}
        <p class="muted small">跟著大聲唸 2–3 次，再按「下一個」。</p>
        <div class="q-nav"><button type="button" class="btn ghost" data-kr="prev" ${i === 0 ? 'disabled' : ''}>← 上一個</button>
          <button type="button" class="btn primary" data-kr="next">${i === chars.length - 1 ? '學完了，來測驗 →' : '下一個 →'}</button></div>`;
      setTimeout(() => sayKana(c.ch), 120);
    }
    function finish() {
      JA.$('#krBar', main).style.width = '100%';
      card.innerHTML = `<div class="quiz-done"><div class="big-emoji">🎉</div><h3>「${esc(rowName(row, s))}」看完了！</h3>
        <p class="muted">馬上做個小測驗，答對 80% 以上就把這一行標成已學會。</p>
        <div class="q-nav"><a class="btn primary" href="${JA.hashFor('kana', ['quiz'], { type: 'pick', scope: `row:${row.id}`, s, n: Math.max(6, chars.length * 2), learn: 1 })}">🎯 開始測驗</a>
          <button type="button" class="btn" data-kr="again">⟳ 再看一次</button>
          ${next ? `<a class="btn ghost" href="${JA.hashFor('kana', ['row', next.id], { s })}">下一行：${esc(rowName(next, s))} →</a>` : ''}</div></div>`;
    }
    card.addEventListener('click', (e) => {
      const b = e.target.closest('[data-kr]');
      const d = e.target.closest('[data-k]');
      if (d) { i = +d.dataset.k; render(); return; }
      if (e.target.closest('[data-say-kana]')) { sayKana(chars[i].ch); return; }
      if (!b) return;
      const a = b.dataset.kr;
      if (a === 'say' || a === 'slow') sayKana(chars[i].ch, a === 'slow');
      else if (a === 'next') { i++; render(); } else if (a === 'prev') { i = Math.max(0, i - 1); render(); } else if (a === 'again') { i = 0; render(); }
    });
    const onKey = (e) => {
      if (e.target.closest('input,textarea,select')) return;
      if (e.key === 'ArrowRight' || e.key === 'Enter') { if (i < chars.length) { i++; render(); } } else if (e.key === 'ArrowLeft') { i = Math.max(0, i - 1); render(); } else if (e.code === 'Space') { e.preventDefault(); if (chars[i]) sayKana(chars[i].ch); }
    };
    document.addEventListener('keydown', onKey);
    JA.onCleanup(() => document.removeEventListener('keydown', onKey));
    render();
  }

  // ---------------------------------------------------------------------------
  // #/kana/quiz：看字選音 / 聽音選字 / 打字輸入
  // ---------------------------------------------------------------------------
  const TYPE_META = { pick: ['👀', '看字選音'], listen: ['👂', '聽音選字'], type: ['⌨️', '打字輸入羅馬拼音'] };
  function poolFor(scope, s) {
    const inScript = (k) => s === 'mix' || k.script === s;
    let list = all().filter(inScript);
    if (scope.startsWith('row:')) list = list.filter((k) => k.row === scope.slice(4));
    else if (scope.startsWith('tab:')) {
      const tab = TABS.find((t) => t.id === scope.slice(4)) || TABS[0];
      list = list.filter((k) => tab.groups.includes(k.group));
    } else if (scope === 'learned') {
      list = list.filter((k) => kana.level(k.ch) > 0 || kana.rowLearned(k.script, k.row));
    } else if (scope === 'due') {
      const due = new Set(kana.due(s).map((k) => k.ch));
      list = list.filter((k) => due.has(k.ch));
    }
    return list;
  }
  function accept(item, typed) {
    const t = String(typed || '').trim().toLowerCase().replace(/\s+/g, '');
    if (!t) return false;
    const alts = String(item.r).split('/').map((x) => x.trim());
    if (alts.includes(t)) return true;
    const asKana = jp.romajiToKana(t);
    if (jp.toHira(asKana) === jp.toHira(item.ch)) return true;
    if (item.ch === 'ん' || item.ch === 'ン') return t === 'n' || t === 'nn' || t === "n'";
    if ((item.ch === 'を' || item.ch === 'ヲ') && (t === 'o' || t === 'wo')) return true;
    return false;
  }
  function distractors(item, pool, n, field) {
    const want = field === 'ch' ? item.ch : romajiMain(item.r);
    const val = (k) => (field === 'ch' ? k.ch : romajiMain(k.r));
    const same = all().filter((k) => k.script === item.script);
    const conf = (CONFUSE.find((g) => g.includes(item.ch)) || []).map((ch) => same.find((k) => k.ch === ch)).filter(Boolean);
    const cands = [...JA.shuffle(conf), ...JA.shuffle(pool.filter((k) => k.script === item.script && k.group === item.group)),
      ...JA.shuffle(same.filter((k) => k.group === item.group)), ...JA.shuffle(same)];
    const out = [];
    for (const c of cands) {
      const v = val(c);
      if (v !== want && !out.includes(v) && !(field === 'r' && accept(item, v))) out.push(v);
      if (out.length >= n) break;
    }
    return out;
  }
  function quizPage(main, query) {
    const type = TYPE_META[query.type] ? query.type : 'pick';
    const s = ['h', 'k', 'mix'].includes(query.s) ? query.s : (JA.settings().kanaScript || 'h');
    let scope = query.scope || 'tab:seion';
    const n = JA.clamp(+query.n || 10, 4, 50);
    let pool = poolFor(scope, s);
    if (type === 'listen') pool = pool.filter((k) => !NO_LISTEN.has(k.ch));
    if (!pool.length) {
      const fallback = scope === 'due' ? '今天沒有到期的假名，改練最需要加強的假名' : '這個範圍還沒有學過的假名，先從清音開始';
      JA.toast(fallback);
      scope = 'tab:seion';
      pool = poolFor(scope, s).filter((k) => type !== 'listen' || !NO_LISTEN.has(k.ch));
      pool = pool.sort((a, b) => kana.level(a.ch) - kana.level(b.ch));
    }
    // 出題：優先不熟的假名；範圍太小時同一個假名最多出兩次
    const weighted = JA.shuffle(pool).sort((a, b) => kana.level(a.ch) - kana.level(b.ch));
    let items = weighted.slice(0, n);
    if (items.length < n) items = items.concat(JA.shuffle(weighted).slice(0, n - items.length));
    items = JA.shuffle(items);
    const [ic, title] = TYPE_META[type];
    const back = JA.hashFor('kana', [], { s: s === 'mix' ? '' : s });
    main.innerHTML = `<div class="rv-session"><div class="rv-top"><a class="btn sm ghost" href="${back}">← 五十音</a>
      <b>${ic} ${title}</b><span class="muted" id="kqCount"></span></div><div class="rv-bar"><i id="kqBar"></i></div>
      <div class="card rv-card kq-card" id="kqCard"></div></div>`;
    const card = JA.$('#kqCard', main);
    const results = [];
    let i = 0;
    let answered = false;
    function progress() {
      JA.$('#kqCount', main).textContent = `${Math.min(i + 1, items.length)} / ${items.length}`;
      JA.$('#kqBar', main).style.width = `${(i / items.length) * 100}%`;
    }
    function render() {
      if (i >= items.length) return summary();
      progress();
      answered = false;
      const it = items[i];
      let body = '';
      if (type === 'pick') {
        const opts = JA.shuffle([romajiMain(it.r), ...distractors(it, pool, 3, 'r')]);
        it._opts = opts;
        it._ans = opts.indexOf(romajiMain(it.r));
        body = `<div class="kq-big">${esc(it.ch)}</div><p class="muted small">這個假名怎麼念？</p>
          <div class="opts kq-optgrid">${opts.map((o, k) => `<button type="button" class="opt" data-k="${k}"><span class="opt-k">${k + 1}</span><span class="kq-ro">${esc(o)}</span></button>`).join('')}</div>`;
      } else if (type === 'listen') {
        const opts = JA.shuffle([it.ch, ...distractors(it, pool, 3, 'ch')]);
        it._opts = opts;
        it._ans = opts.indexOf(it.ch);
        body = `<div class="kq-listen"><button type="button" class="btn primary big" data-kq-say>🔊 再聽一次</button><button type="button" class="btn" data-kq-say="slow">🐢 慢速</button></div>
          <p class="muted small">選出你聽到的假名</p>
          <div class="opts kq-optgrid">${opts.map((o, k) => `<button type="button" class="opt" data-k="${k}"><span class="opt-k">${k + 1}</span><span class="kq-ch">${esc(o)}</span></button>`).join('')}</div>`;
        setTimeout(() => sayKana(it.ch), 150);
      } else {
        body = `<div class="kq-big">${esc(it.ch)}</div><p class="muted small">打出羅馬拼音（例如 ka、shi、tsu）</p>
          <div class="rv-input"><input type="text" id="kqIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="羅馬拼音…（Enter 送出）">
          <button type="button" class="btn primary" id="kqCheck">✔ 檢查</button></div>`;
      }
      card.innerHTML = `${body}<div class="q-exp" id="kqExp"></div>
        <div class="q-nav"><button type="button" class="btn primary" id="kqNext" hidden>${i === items.length - 1 ? '看結果' : '下一題 →'}</button></div>`;
      const inp = JA.$('#kqIn', card);
      if (inp) {
        setTimeout(() => inp.focus({ preventScroll: true }), 40);
        inp.addEventListener('keydown', (e) => { if (JA.isEnterSend(e)) { e.preventDefault(); if (answered) next(); else checkTyped(); } });
      }
    }
    function explain(it, ok, extra) {
      const inf = kana.info(it.ch);
      return `<div class="${ok ? 'ok-txt' : 'bad-txt'}">${ok ? '✅ 答對了！' : '❌ 答錯了'}</div>
        <div class="rv-ans"><button type="button" class="icon-btn sm" data-kq-say>🔊</button><b class="kq-ans-ch">${esc(it.ch)}</b><span>${esc(it.r)}</span>
        ${inf.ex ? `<span class="muted">例：<span class="ja-txt">${JA.ruby(inf.ex)}</span> ${esc(inf.zh || '')}</span>` : ''}</div>${extra || ''}`;
    }
    function finishOne(ok) {
      answered = true;
      const it = items[i];
      results.push({ it, ok });
      kana.grade(it.ch, ok);
      if (ok) JA.addXP(1, 'kana');
      const nx = JA.$('#kqNext', card);
      nx.hidden = false;
      nx.focus({ preventScroll: true });
    }
    function pick(k) {
      if (answered) return;
      const it = items[i];
      const ok = k === it._ans;
      JA.$$('.opt', card).forEach((x) => {
        x.disabled = true;
        if (+x.dataset.k === it._ans) x.classList.add('correct');
        else if (+x.dataset.k === k) x.classList.add('wrong');
      });
      JA.$('#kqExp', card).innerHTML = explain(it, ok);
      sayKana(it.ch);
      finishOne(ok);
    }
    function checkTyped() {
      const it = items[i];
      const inp = JA.$('#kqIn', card);
      if (!inp.value.trim()) return;
      const ok = accept(it, inp.value);
      inp.disabled = true;
      JA.$('#kqCheck', card).disabled = true;
      JA.$('#kqExp', card).innerHTML = explain(it, ok, ok ? '' : `<div class="muted">你打的：<s>${esc(inp.value)}</s> → 正確：<b>${esc(it.r)}</b></div>`);
      sayKana(it.ch);
      finishOne(ok);
    }
    function next() { JA.tts.stop(); i++; render(); }
    function summary() {
      JA.$('#kqBar', main).style.width = '100%';
      const ok = results.filter((r) => r.ok).length;
      const pct = results.length ? Math.round((ok / results.length) * 100) : 0;
      const wrong = results.filter((r) => !r.ok);
      const learnRow = query.learn && scope.startsWith('row:') && pct >= 80;
      if (learnRow) {
        const rid = scope.slice(4);
        (s === 'mix' ? ['h', 'k'] : [s]).forEach((sc) => kana.markRow(sc, rid));
        JA.addXP(5, 'kanaRow');
      }
      const row = scope.startsWith('row:') ? K().rows.find((r) => r.id === scope.slice(4)) : null;
      const nextRow = row ? K().rows[K().rows.indexOf(row) + 1] : null;
      card.innerHTML = `<div class="quiz-done"><div class="score-ring big ${pct >= 80 ? 'ok' : pct >= 60 ? 'warn' : 'bad'}" style="--p:${pct}"><b>${pct}</b><small>分</small></div>
        <h3>${learnRow ? `🎉「${esc(rowName(row, s === 'k' ? 'k' : 'h'))}」學會了！` : pct >= 80 ? '🎉 太厲害了！' : pct >= 60 ? '👍 不錯喔！' : '💪 多練幾次就會了'}</h3>
        <p class="muted">答對 ${ok} / ${results.length}</p>
        ${wrong.length ? `<div class="wrong-list"><b>要再加強的假名</b><div class="kq-wrong">${[...new Map(wrong.map((r) => [r.it.ch, r.it])).values()].map((it) =>
          `<button type="button" class="kq-w" data-say="${esc(it.ch)}"><b>${esc(it.ch)}</b><small>${esc(romajiMain(it.r))}</small></button>`).join('')}</div></div>` : ''}
        <div class="q-nav"><button type="button" class="btn primary" id="kqAgain">⟳ 再來一輪</button>
          ${learnRow && nextRow ? `<a class="btn" href="${JA.hashFor('kana', ['row', nextRow.id], { s: s === 'k' ? 'k' : 'h' })}">下一行：${esc(rowName(nextRow, s === 'k' ? 'k' : 'h'))} →</a>` : ''}
          <a class="btn ghost" href="${back}">回五十音</a></div></div>`;
      JA.$('#kqAgain', card).onclick = () => JA.renderRoute();
    }
    card.addEventListener('click', (e) => {
      if (e.target.closest('#kqNext')) { next(); return; }
      if (e.target.closest('#kqCheck')) { if (!answered) checkTyped(); return; }
      const sy = e.target.closest('[data-kq-say]');
      if (sy) { sayKana(items[i] ? items[i].ch : '', sy.dataset.kqSay === 'slow'); return; }
      const b = e.target.closest('.opt');
      if (b) pick(+b.dataset.k);
    });
    const onKey = (e) => {
      if (e.target.closest('input,textarea,select')) return;
      if (!answered && /^[1-4]$/.test(e.key) && JA.$('.opt', card)) pick(+e.key - 1);
      else if (answered && e.key === 'Enter') { e.preventDefault(); next(); } else if (e.code === 'Space' && type === 'listen' && items[i]) { e.preventDefault(); sayKana(items[i].ch); }
    };
    document.addEventListener('keydown', onKey);
    JA.onCleanup(() => document.removeEventListener('keydown', onKey));
    render();
  }
})();

</script>
  <script>/* /js/lesson.js */
/* 日語學院 Japanese Academy — lesson.js
 * 課程頁外框：標題區、模式分頁（閱讀聽力 / 跟讀 / 角色扮演 / 聽寫 / 測驗 / 單字・文法），
 * 「📖 閱讀・聽力」（逐句 ja-JP 朗讀、0.6–1.2×、盲聽、振假名 / 羅馬拼音 / 中文切換）與「📒 單字・文法」。
 * 點課文裡的漢字詞或重點單字 → 讀音 / 意思小視窗（JA.wpop），可 ⭐ 加入單字本。其餘練習模式在 practice.js。
 */
(function () {
  'use strict';
  const JA = window.JA;
  const jp = JA.jp;
  const esc = JA.esc;

  const SP_COLORS = { A: ['#e11d48', '#fff1f2'], B: ['#0f766e', '#f0fdfa'], C: ['#7c3aed', '#f5f3ff'], D: ['#b45309', '#fffbeb'] };
  const MODES = [
    ['read', '📖', '閱讀・聽力'], ['shadow', '🗣️', '跟讀'], ['role', '🎭', '角色扮演'],
    ['dict', '✍️', '聽寫'], ['quiz', '❓', '測驗'], ['words', '📒', '單字・文法'],
  ];

  // ---------------------------------------------------------------------------
  // 共用（practice.js / review.js 也會用）
  // ---------------------------------------------------------------------------
  const LUI = (JA.LUI = JA.LUI || {});
  LUI.modes = LUI.modes || {};
  LUI.MODES = MODES;
  /** 把一行（標記）依「。！？」切成句子，太短的句子併到前後句。 */
  LUI.splitMarkup = (ja) => {
    const src = String(ja || '');
    const parts = [];
    let buf = '';
    let depth = 0;
    for (let i = 0; i < src.length; i++) {
      const c = src[i];
      buf += c;
      if (c === '{') depth++;
      else if (c === '}') depth--;
      else if (!depth && /[。！？]/.test(c)) {
        while (i + 1 < src.length && /[」』）]/.test(src[i + 1])) buf += src[++i];
        parts.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) parts.push(buf.trim());
    const out = [];
    for (const p of parts) {
      const prev = out[out.length - 1];
      if (prev && jp.surface(prev).length < 7) out[out.length - 1] = `${prev} ${p}`;
      else out.push(p);
    }
    if (out.length > 1 && jp.surface(out[out.length - 1]).length < 6) {
      const last = out.pop();
      out[out.length - 1] = `${out[out.length - 1]} ${last}`;
    }
    return out.length ? out : [src];
  };
  LUI.unitsOf = (L) => {
    if (L._units) return L._units;
    const out = [];
    L.lines.forEach((ln, li) => {
      LUI.splitMarkup(ln.ja).forEach((t, si) => out.push({ key: `${li}-${si}`, li, si, s: ln.s, ja: t, zh: ln.zh }));
    });
    L._units = out;
    return out;
  };
  LUI.sideOf = (L, key) => ((key === 'A' || key === 'C') ? 'left' : 'right');
  LUI.colorVars = (key) => {
    const [c, soft] = SP_COLORS[key] || SP_COLORS.A;
    return `--c:${c};--soft:${soft}`;
  };
  LUI.spName = (L, key) => JA.ruby(JA.speakerOf(L, key).name || key);
  LUI.avatar = (L, key) => {
    const sp = JA.speakerOf(L, key);
    const ch = Array.from(jp.surface(sp.name || key))[0] || key;
    return `<span class="avatar" style="${LUI.colorVars(key)}" title="${esc(jp.surface(sp.name || key))}">${esc(ch)}</span>`;
  };
  /** 重點單字在句子中的表層形式（m → w → 動詞 / 形容詞語幹）。 */
  LUI.vocabForms = (v) => {
    const s = jp.surface(v.w || '');
    const forms = [];
    if (v.m) forms.push(jp.surface(v.m));
    forms.push(s);
    if (/動詞|形容詞/.test(v.pos || '')) {
      let stem = s.endsWith('来る') ? s.slice(0, -1) : s.replace(/(する|くる)$/, '');
      if (stem === s) stem = s.slice(0, -1);
      if (stem && (jp.hasKanji(stem) || stem.length >= 2)) forms.push(stem);
    }
    forms.push(jp.reading(v.w || ''));
    return forms.filter(Boolean);
  };
  /** 一句日文 → 可點擊、可高亮的 HTML（每個漢字詞 / 假名一個 .u，重點單字加 .vw）。 */
  LUI.jaHtml = (L, ja) => {
    const units = JA.unitsOf(ja);
    const surf = jp.surface(ja);
    const ranges = [];
    (L && L.vocab ? L.vocab : []).forEach((v, vi) => {
      for (const f of LUI.vocabForms(v)) {
        const at = surf.indexOf(f);
        if (at >= 0) { ranges.push([at, at + f.length, vi]); break; }
      }
    });
    return units.map((u) => {
      if (u.kind === 'punct') return esc(u.b);
      const r = ranges.find(([a, b]) => u.ci >= a && u.ci < b);
      const inner = u.kind === 'ruby' ? `<ruby>${esc(u.b)}<rt>${esc(u.rt)}</rt></ruby>` : esc(u.b);
      return `<span class="u${u.kind === 'ruby' ? ' rb' : ''}${r ? ' vw' : ''}" data-ci="${u.ci}"${r ? ` data-v="${r[2]}"` : ''}${u.kind === 'ruby' ? ` data-b="${esc(u.b)}" data-r="${esc(u.rt)}"` : ''}>${inner}</span>`;
    }).join('');
  };
  /** 依朗讀位置（表層字元偏移）高亮單位。 */
  LUI.highlightAt = (root, charIndex) => {
    let hit = null;
    for (const s of root.querySelectorAll('.u')) { if (+s.dataset.ci <= charIndex) hit = s; else break; }
    root.querySelectorAll('.u.hl').forEach((x) => x.classList.remove('hl'));
    if (hit) hit.classList.add('hl');
  };
  const RATES = [0.6, 0.8, 1, 1.2];
  const TTS_ENGINES = [
    ['auto', '⚡ 自動', '優先用裝置內建的日語聲音；沒有或沒聲音時自動改用雲端語音'],
    ['cloud', '🌐 雲端語音', '直接播放 Google 日語雲端語音（需要網路；GitHub 網頁沒聲音時選這個）'],
    ['browser', '💻 內建', '只用瀏覽器 / 作業系統內建的日語聲音'],
  ];
  LUI.rateSeg = () => {
    const r = +JA.settings().rate || 1;
    return `<div class="seg rate-seg" role="group" aria-label="播放速度"><span class="seg-lbl">速度</span>${RATES.map((v) =>
      `<button type="button" data-rate="${v}" class="${Math.abs(v - r) < 0.01 ? 'active' : ''}">${v === 1 ? '1.0' : v}×</button>`).join('')}</div>`;
  };
  LUI.ttsEngineSeg = () => {
    const cur = JA.settings().ttsEngine || 'auto';
    return `<div class="seg tts-engine-seg" role="group" aria-label="語音引擎"><span class="seg-lbl">🔊</span>${TTS_ENGINES.map(([k, lb, tip]) =>
      `<button type="button" data-tts-engine="${k}" class="${cur === k ? 'active' : ''}" title="${esc(tip)}">${lb}</button>`).join('')}</div>`;
  };
  LUI.bindRateSeg = (root) => {
    root.addEventListener('click', (e) => {
      const b = e.target.closest('[data-rate]');
      if (b) {
        JA.setSetting('rate', +b.dataset.rate);
        JA.$$('.rate-seg [data-rate]', root).forEach((x) => x.classList.toggle('active', x.dataset.rate === b.dataset.rate));
        return;
      }
      const eng = e.target.closest('[data-tts-engine]');
      if (eng) {
        const mode = eng.dataset.ttsEngine;
        JA.setSetting('ttsEngine', mode);
        JA.$$('.tts-engine-seg [data-tts-engine]', root).forEach((x) => x.classList.toggle('active', x.dataset.ttsEngine === mode));

  /** 麥克風無法使用時的一次性設定說明。 */

  // ---------------------------------------------------------------------------
  // 單字小視窗（點漢字詞 / 重點單字）
  // ---------------------------------------------------------------------------
  let popEl = null;
  JA.wpop = {
    close() { if (popEl) { popEl.remove(); popEl = null; } },
    /** info: {w(標記), zh, pos, note, ex, ex_zh, level, src, lineJa, lineZh}；anchor: 被點的元素 */
    open(info, anchor) {
      this.close();
      const w = info.w;
      const saved = JA.vocab.has(w);
      const el = document.createElement('div');
      el.className = 'wpop wpop-keep';
      el.innerHTML = `<div class="wp-hd"><div class="wp-word ja-txt">${JA.ruby(w)}</div>
          <button type="button" class="icon-btn" data-wp="say" title="發音">🔊</button><button type="button" class="icon-btn" data-wp="close" aria-label="關閉">✕</button></div>
        <div class="wp-meta"><span class="ro">${esc(jp.romaji(w))}</span>${info.pos ? `<span class="chip">${esc(info.pos)}</span>` : ''}${info.level ? JA.lvlBadge(info.level) : ''}</div>
        ${info.zh ? `<div class="wp-zh">${esc(info.zh)}</div>` : '<div class="wp-empty muted small">課程單字與單字庫裡沒有這個詞的解釋，先聽讀音吧。</div>'}
        ${info.note ? `<div class="wp-ctx">💡 ${esc(info.note)}</div>` : ''}
        ${info.ex ? `<div class="wp-ex"><button type="button" class="icon-btn sm" data-wp="ex">▶</button><span class="ja-txt">${JA.ruby(info.ex)}</span>${info.ex_zh ? `<div class="muted small">${esc(info.ex_zh)}</div>` : ''}</div>` : ''}
        ${info.zh ? `<div class="wp-acts"><button type="button" class="btn sm ${saved ? '' : 'primary'}" data-wp="save">${saved ? '✓ 已在單字本' : '⭐ 加入單字本'}</button></div>` : ''}`;
      document.body.appendChild(el);
      popEl = el;
      if (window.matchMedia('(max-width: 760px)').matches || !anchor) el.classList.add('sheet');
      else {
        const r = anchor.getBoundingClientRect();
        const wdt = Math.min(340, window.innerWidth - 24);
        el.style.width = `${wdt}px`;
        el.style.left = `${Math.max(12, Math.min(window.scrollX + r.left, window.scrollX + window.innerWidth - wdt - 12))}px`;
        el.style.top = `${window.scrollY + r.bottom + 8}px`;
      }
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-wp]');
        if (!b) return;
        const a = b.dataset.wp;
        if (a === 'close') this.close();
        else if (a === 'say') JA.tts.speak(w);
        else if (a === 'ex') JA.tts.speak(info.ex);
        else if (a === 'save' && !JA.vocab.has(w)) {
          JA.vocab.save({ w, zh: info.zh, pos: info.pos, note: info.note, ex: info.lineJa || info.ex, ex_zh: info.lineJa ? info.lineZh : info.ex_zh,
            src: info.src, lvl: info.level });
          b.textContent = '✓ 已在單字本';
          b.classList.remove('primary');
          JA.toast(`⭐ 已加入單字本：${jp.surface(w)}`, 'ok');
        }
      });
      JA.tts.speak(w);
    },
  };
  document.addEventListener('mousedown', (e) => {
    if (popEl && !e.target.closest('.wpop') && !e.target.closest('.u')) JA.wpop.close();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') JA.wpop.close(); });
  /** 處理課文裡被點的 .u：重點單字 → 課程解釋；其他漢字詞 → 單字庫。 */
  LUI.onUnitClick = (L, unitEl, lineJa, lineZh) => {
    const vi = unitEl.dataset.v;
    if (vi != null && L.vocab && L.vocab[+vi]) {
      const v = L.vocab[+vi];
      const wb = JA.WORD_INDEX && JA.WORD_INDEX.get(jp.surface(v.w));
      JA.wpop.open({ w: v.w, zh: v.zh, pos: v.pos, note: v.note, ex: wb && wb.ex, ex_zh: wb && wb.ex_zh, level: L.level, src: L.id, lineJa, lineZh }, unitEl);
      return true;
    }
    if (unitEl.dataset.b) {
      const b = unitEl.dataset.b;
      const wb = JA.words() && JA.WORD_INDEX.get(b);
      const lv = JA.VOCAB_INDEX.get(b);
      const w = wb ? wb.w : lv ? lv.entry.w : `{${b}|${unitEl.dataset.r}}`;
      JA.wpop.open({ w, zh: wb ? wb.zh : lv ? lv.entry.zh : '', pos: wb ? wb.pos : lv ? lv.entry.pos : '', ex: wb && wb.ex, ex_zh: wb && wb.ex_zh,
        level: wb ? wb.level : lv ? lv.level : '', src: L.id, lineJa, lineZh }, unitEl);

  // ---------------------------------------------------------------------------

  function progChips(L) {
    const p = JA.prog(L.id);

      ${item(LUI.modeDone(L, 'role'), '🎭', '角色扮演最佳分數', sc(p.role))}
      ${item(LUI.modeDone(L, 'dict'), '✍️', '聽寫平均分數', sc(p.dict))}

  function heroHtml(L) {

  LUI.refreshHero = (L) => {
    const side = JA.$('#heroSide');

    JA.$$('.mode-tab').forEach((a) => {

    });
