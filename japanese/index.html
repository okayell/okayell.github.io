  JA.route('lesson', (main, params, query) => {
    const L = JA.lesson(params[0]);
    if (!L) {
      main.innerHTML = `<div class="card empty"><div class="empty-ic">🔎</div><h3>找不到這一課</h3>
        <p class="muted">可能是網址打錯，或 AI 生成的課程已被刪除。</p><a class="btn primary" href="#/library">回課程列表</a></div>`;
      return;
    }
    const mode = MODES.some((m) => m[0] === query.mode) ? query.mode : 'read';
    const p = JA.prog(L.id);
    if (p.mode !== mode || !p.last || Date.now() - p.last > 60000) JA.updateProg(L.id, (q) => { q.mode = mode; });
    main.innerHTML = `<div class="lesson" data-lesson="${esc(L.id)}">
      ${heroHtml(L)}
      <nav class="mode-tabs" role="tablist">${MODES.map(([k, ic, label]) => `<a role="tab" class="mode-tab ${k === mode ? 'active' : ''}"
        href="${JA.hashFor('lesson', [L.id], { mode: k })}" data-mode="${k}"><span class="mt-ic">${ic}</span><span class="mt-lb">${label}</span>
        ${LUI.modeDone(L, k) ? '<i class="done-dot" title="已完成"></i>' : ''}</a>`).join('')}</nav>
      <div class="mode-pane" id="modePane"></div>

    JA.$('.mode-tabs', main).addEventListener('click', (e) => {
      const a = e.target.closest('.mode-tab');

    JA.$('#favBtn', main).onclick = (e) => {
      const q = JA.updateProg(L.id, (x) => { x.fav = !x.fav; });
      e.target.textContent = q.fav ? '★ 已收藏' : '☆ 收藏';
      JA.toast(q.fav ? '★ 已加入收藏' : '已取消收藏');
    };
    const del = JA.$('#delCustom', main);
    if (del) del.onclick = () => JA.deleteCustomLesson(L);
    const pane = JA.$('#modePane', main);
    const fn = mode === 'read' ? renderRead : mode === 'words' ? renderWords : LUI.modes[mode];
    (fn || renderRead)(pane, L, query);
    const tabs = JA.$('.mode-tabs', main);
    const syncTabsH = () => document.documentElement.style.setProperty('--tabs-h', `${tabs.offsetHeight}px`);

    if (window.scrollY > tabsTop + 2) window.scrollTo({ top: tabsTop, behavior: 'auto' });
  });

  // ---------------------------------------------------------------------------
  // 📖 閱讀・聽力
  // ---------------------------------------------------------------------------
  function lineHtml(L, ln, i) {
    return `<div class="msg ${LUI.sideOf(L, ln.s)}" data-line="${i}" id="ln${i}">
      ${LUI.avatar(L, ln.s)}
      <div class="bubble" style="${LUI.colorVars(ln.s)}">
        <div class="who">${LUI.spName(L, ln.s)}</div>
        <div class="ja">${LUI.jaHtml(L, ln.ja)}</div>
        <div class="ro">${esc(jp.romaji(ln.ja))}</div>
        <div class="zh">${esc(ln.zh || '')}</div>
        <div class="blind-mask">🎧 先用聽的 · 點一下看日文</div>
        <div class="msg-acts">
          <button type="button" class="icon-btn" data-act="play" title="播放這句">▶</button>
          <button type="button" class="icon-btn" data-act="slow" title="慢速播放">🐢</button>
          <a class="icon-btn" href="${JA.hashFor('lesson', [L.id], { mode: 'shadow', u: `${i}-0` })}" title="跟讀這句">🎤</a>
        </div>
      </div></div>`;
  }
  function renderRead(pane, L) {
    const st = JA.settings();
    const view = { ja: true, furi: st.showFuri !== false, ro: !!st.showRomaji, zh: st.showZh !== false, vocab: st.showVocab !== false, loop: false };
    pane.innerHTML = `${LUI.voiceBanner()}
      <div class="player card" id="player">
        <div class="pl-row">
          <button type="button" class="btn primary pl-play" id="plPlay">▶ 播放全部</button>
          <button type="button" class="icon-btn lg" id="plPrev" title="上一句（←）">⏮</button>
          <button type="button" class="icon-btn lg" id="plNext" title="下一句（→）">⏭</button>
          <span class="pl-pos" id="plPos">共 ${L.lines.length} 句</span>
          <div class="pl-spacer"></div>
          ${LUI.ttsEngineSeg()}
          ${LUI.rateSeg()}
        </div>
        <div class="pl-row toggles">
          <label class="tg" title="關掉＝盲聽模式：只聽不看"><input type="checkbox" id="tgJa" checked><span>日文</span></label>
          <label class="tg"><input type="checkbox" id="tgFuri" ${view.furi ? 'checked' : ''}><span>振假名</span></label>
          <label class="tg"><input type="checkbox" id="tgRo" ${view.ro ? 'checked' : ''}><span>羅馬拼音</span></label>
          <label class="tg"><input type="checkbox" id="tgZh" ${view.zh ? 'checked' : ''}><span>中文翻譯</span></label>
          <label class="tg"><input type="checkbox" id="tgVocab" ${view.vocab ? 'checked' : ''}><span>標示重點單字</span></label>
          <label class="tg"><input type="checkbox" id="tgLoop"><span>🔁 單句重複</span></label>
        </div>
        <div class="pl-bar"><i id="plBar"></i></div>
      </div>
      <div class="chat clickable-text" id="chat">${L.lines.map((ln, i) => lineHtml(L, ln, i)).join('')}</div>
      <p class="hint">💡 點任何漢字詞可看讀音、意思並加入單字本。鍵盤：空白鍵 播放 / 暫停，← → 切換句子。想練「盲聽」？把「日文」關掉，先用聽的再對答案。</p>
      ${vocabTeaser(L)}`;
    LUI.bindRateSeg(pane);
    const chat = JA.$('#chat', pane);
    const applyView = () => {
      chat.classList.toggle('hide-ja', !view.ja);
      chat.classList.toggle('no-furi', !view.furi);
      chat.classList.toggle('no-ro', !view.ro);
      chat.classList.toggle('hide-zh', !view.zh);
      chat.classList.toggle('hide-vocab', !view.vocab);
    };
    applyView();
    JA.$('#tgJa', pane).onchange = (e) => { view.ja = e.target.checked; JA.$$('.msg.reveal', chat).forEach((m) => m.classList.remove('reveal')); applyView(); };
    JA.$('#tgFuri', pane).onchange = (e) => { view.furi = e.target.checked; JA.setSetting('showFuri', view.furi); applyView(); };
    JA.$('#tgRo', pane).onchange = (e) => { view.ro = e.target.checked; JA.setSetting('showRomaji', view.ro); applyView(); };
    JA.$('#tgZh', pane).onchange = (e) => { view.zh = e.target.checked; JA.setSetting('showZh', view.zh); applyView(); };
    JA.$('#tgVocab', pane).onchange = (e) => { view.vocab = e.target.checked; JA.setSetting('showVocab', view.vocab); applyView(); };
    JA.$('#tgLoop', pane).onchange = (e) => { view.loop = e.target.checked; };

    let cur = -1;
    let playing = false;
    const playBtn = JA.$('#plPlay', pane);
    const updateBtn = () => {
      playBtn.textContent = playing ? '⏸ 暫停' : cur >= 0 && cur < L.lines.length - 1 ? '▶ 繼續播放' : '▶ 播放全部';
      playBtn.classList.toggle('playing', playing);
    };
    function setCur(i, scroll) {
      JA.$$('.msg.playing', chat).forEach((e) => e.classList.remove('playing'));
      JA.$$('.u.hl', chat).forEach((e) => e.classList.remove('hl'));
      cur = i;
      const el = JA.$(`#ln${i}`, chat);
      if (el) {
        el.classList.add('playing');
        if (scroll) {
          const r = el.getBoundingClientRect();
          if (r.top < 140 || r.bottom > window.innerHeight - 40) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
      }
      JA.$('#plPos', pane).textContent = i >= 0 ? `第 ${i + 1} / ${L.lines.length} 句` : `共 ${L.lines.length} 句`;
      JA.$('#plBar', pane).style.width = `${i >= 0 ? ((i + 1) / L.lines.length) * 100 : 0}%`;
    }
    function playLine(i, slow) {
      const ln = L.lines[i];
      setCur(i, true);
      const rate = +JA.settings().rate || 1;
      const jaEl = JA.$(`#ln${i} .ja`, chat);
      return JA.tts.speak(ln.ja, { ...JA.voiceOf(L, ln.s), rate: slow ? Math.min(rate, 0.6) : rate,
        onBoundary: (e) => { if (jaEl && (!e.name || e.name === 'word')) LUI.highlightAt(jaEl, e.charIndex); } });
    }
    function onListenedAll() {
      const today = JA.todayKey();
      const before = JA.prog(L.id);
      JA.updateProg(L.id, (q) => { q.listen = q.listen || Date.now(); q.listenN = (q.listenN || 0) + 1; q.listenDay = today; });
      if (before.listenDay !== today) JA.addXP(10, 'listen');
      JA.toast(before.listen ? '🎧 又聽完一遍，很棒！' : '🎧 聽完整課了！+10 XP · 接著試試「跟讀」或「角色扮演」', 'ok');
      LUI.refreshHero(L);
    }
    async function playFrom(i) {
      JA.tts.stop();
      const tok = JA.tts.token();
      playing = true;
      updateBtn();
      let k = Math.max(0, i);
      while (k < L.lines.length && JA.tts.alive(tok)) {
        const r = await playLine(k);
        if (!JA.tts.alive(tok) || r.canceled) break;
        await JA.sleep(view.loop ? 700 : 300);
        if (!JA.tts.alive(tok)) break;
        if (!view.loop) k++;
      }
      if (!JA.tts.alive(tok)) return;
      playing = false;
      JA.$$('.u.hl', chat).forEach((x) => x.classList.remove('hl'));
      if (k >= L.lines.length) { setCur(L.lines.length - 1, false); onListenedAll(); cur = -1; }
      updateBtn();
    }
    const pause = () => { JA.tts.stop(); playing = false; updateBtn(); };
    const toggle = () => (playing ? pause() : playFrom(cur >= 0 && cur < L.lines.length ? cur : 0));
    const jump = (d) => {
      const n = JA.clamp((cur < 0 ? 0 : cur) + d, 0, L.lines.length - 1);
      if (playing) playFrom(n);
      else { JA.tts.stop(); playLine(n).then(() => updateBtn()); }
    };
    playBtn.onclick = toggle;
    JA.$('#plPrev', pane).onclick = () => jump(-1);
    JA.$('#plNext', pane).onclick = () => jump(1);
    chat.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]');
      const msg = e.target.closest('.msg');
      if (!msg) return;
      const i = +msg.dataset.line;
      if (btn) {
        e.preventDefault();
        playing = false;
        JA.tts.stop();
        updateBtn();
        playLine(i, btn.dataset.act === 'slow').then(() => updateBtn());
        return;
      }
      if (!view.ja && !msg.classList.contains('reveal')) { msg.classList.add('reveal'); return; }
      const u = e.target.closest('.u');
      if (u && LUI.onUnitClick(L, u, L.lines[i].ja, L.lines[i].zh)) return;
    });
    const onKey = (e) => {
      if (e.target.closest('input, textarea, select, [contenteditable], .modal-wrap')) return;
      if (e.code === 'Space') { e.preventDefault(); toggle(); } else if (e.key === 'ArrowRight') { e.preventDefault(); jump(1); } else if (e.key === 'ArrowLeft') { e.preventDefault(); jump(-1); }
    };
    document.addEventListener('keydown', onKey);
    JA.onCleanup(() => document.removeEventListener('keydown', onKey));
    pane.querySelectorAll('[data-vchip]').forEach((b) => {
      b.onclick = () => {
        const v = L.vocab[+b.dataset.vchip];
        const line = lineWith(L, v);
        JA.wpop.open({ w: v.w, zh: v.zh, pos: v.pos, note: v.note, level: L.level, src: L.id, lineJa: line && line.ja, lineZh: line && line.zh }, b);
      };
    });
  }
  function vocabTeaser(L) {
    if (!L.vocab || !L.vocab.length) return '';
    return `<section class="card teaser"><div class="card-hd"><h3>📒 本課重點單字</h3>
      <a class="btn sm ghost" href="${JA.hashFor('lesson', [L.id], { mode: 'words' })}">看全部單字與文法 →</a></div>
      <div class="chips">${L.vocab.map((v, i) => `<button type="button" class="chip vchip ${JA.vocab.has(v.w) ? 'saved' : ''}" data-vchip="${i}">
        <span class="ja-txt">${JA.ruby(v.w)}</span><small>${esc(v.zh)}</small></button>`).join('')}</div></section>`;
  }
  /** 課文中含有這個單字的那一行（存進單字本當語境）。 */
  function lineWith(L, v) {
    const forms = LUI.vocabForms(v);
    for (const ln of L.lines) {
      const s = jp.surface(ln.ja);
      if (forms.some((f) => s.includes(f))) return ln;
    }
    return null;
  }
  LUI.lineWith = lineWith;
  LUI.saveVocab = (L, v) => {
    const line = lineWith(L, v);
    return JA.vocab.save({ w: v.w, zh: v.zh, pos: v.pos, note: v.note, ex: line ? line.ja : '', ex_zh: line ? line.zh : '', src: L.id, lvl: L.level });
  };

  // ---------------------------------------------------------------------------
  // 📒 單字・文法・文化小提醒
  // ---------------------------------------------------------------------------
  function renderWords(pane, L) {
    const vocab = L.vocab || [];
    const vcard = (v, i) => {
      const saved = JA.vocab.has(v.w);
      return `<div class="vcard" data-i="${i}">
        <div class="vc-hd"><b class="vc-w ja-txt">${JA.ruby(v.w)}</b>${v.pos ? `<span class="chip">${esc(v.pos)}</span>` : ''}
          <button type="button" class="icon-btn" data-say="${esc(jp.surface(v.w))}" title="發音">🔊</button>
          <button type="button" class="btn xs star ${saved ? 'on' : ''}" data-star="${i}">${saved ? '★ 已收藏' : '☆ 收藏'}</button></div>
        <div class="vc-ro ro">${esc(jp.romaji(v.w))}</div>
        <div class="vc-zh">${esc(v.zh)}</div>
        ${v.note ? `<div class="vc-en">💡 ${esc(v.note)}</div>` : ''}
      </div>`;
    };
    const gram = (L.grammar || []).map((g, gi) => `<div class="gram">
        <div class="gram-hd"><span class="gram-n">${gi + 1}</span><b class="gram-pt ja-txt">${JA.ruby(g.pt)}</b></div>
        <div class="gram-zh">${esc(g.zh)}</div>
        <p class="gram-exp">${esc(g.explain || '')}</p>
        <div class="gram-exs">${(g.ex || []).map((x) => `<div class="gram-ex"><button type="button" class="icon-btn sm" data-say="${esc(jp.surface(x.ja))}">▶</button>
          <div><div class="ja-txt">${JA.ruby(x.ja)}</div><div class="ro small">${esc(jp.romaji(x.ja))}</div><div class="muted small">${esc(x.zh)}</div></div></div>`).join('')}</div>
      </div>`).join('');
    pane.innerHTML = `<div class="words-layout ${LUI.viewClasses()}">
      <section class="card"><div class="card-hd"><h3>📒 重點單字 <span class="muted">${vocab.length}</span></h3>
        <button type="button" class="btn sm" id="saveAll">⭐ 全部加入單字本</button></div>
        <div class="vgrid">${vocab.map(vcard).join('') || '<p class="muted">這課沒有單字表。</p>'}</div></section>
      <div class="words-side">
        <section class="card"><div class="card-hd"><h3>📐 文法重點</h3></div>${gram || '<p class="muted">—</p>'}</section>
        ${L.tip ? `<section class="card tip-card"><h3>⛩️ 文化・用法小提醒</h3><p>${esc(L.tip)}</p></section>` : ''}
      </div></div>`;
    const refreshStars = () => {
      JA.$$('[data-star]', pane).forEach((b) => {
        const on = JA.vocab.has(vocab[+b.dataset.star].w);
        b.classList.toggle('on', on);
        b.textContent = on ? '★ 已收藏' : '☆ 收藏';
      });
    };
    pane.addEventListener('click', (e) => {
      const st = e.target.closest('[data-star]');
      if (st) {
        const v = vocab[+st.dataset.star];
        if (JA.vocab.has(v.w)) { JA.vocab.remove(v.w); JA.toast(`已移除：${jp.surface(v.w)}`); } else { LUI.saveVocab(L, v); JA.toast(`⭐ 已加入單字本：${jp.surface(v.w)}`, 'ok'); }
        refreshStars();
        return;
      }
      if (e.target.closest('#saveAll')) {
        let n = 0;
        vocab.forEach((v) => { if (!JA.vocab.has(v.w)) { LUI.saveVocab(L, v); n++; } });
        refreshStars();
        JA.toast(n ? `⭐ 已加入 ${n} 個單字` : '全部單字都已經在單字本裡了', 'ok');
      }
    });
  }

  /** 呼叫 AI 口說回饋並渲染結果（Cloudtop 有 Jetski 時）。 */
  LUI.aiFeedback = async (btn, out, task, transcript, level) => {
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> AI 分析中…';
    try {
      const fb = await JA.aiRun('feedback', { task, transcript, level: level || JA.settings().level || 'A1' },
        (s) => { btn.innerHTML = `<span class="spin"></span> AI 分析中… ${s}s`; });
      btn.remove();
      const sc = Math.round(+fb.score || 0);
      out.innerHTML = `<div class="fb"><div class="fb-top"><div class="score-ring ${sc >= 80 ? 'ok' : sc >= 60 ? 'warn' : 'bad'}" style="--p:${sc}"><b>${sc}</b></div>
        <p>${esc(fb.summary_zh || '')}</p></div>
        ${fb.natural ? `<div class="fb-row"><span class="chip ok">更自然</span><button type="button" class="icon-btn sm" data-say="${esc(fb.natural)}">▶</button>${esc(fb.natural)}</div>` : ''}
        ${(fb.tips_zh || []).length ? `<div class="fb-tips">${fb.tips_zh.map((t) => `<div>💡 ${esc(t)}</div>`).join('')}</div>` : ''}</div>`;
    } catch (err) {
      btn.disabled = false;
      btn.textContent = '🤖 AI 口說回饋';
      JA.toast(err.message, 'bad');
    }
  };
})();

</script>
  <script>/* /js/practice.js */
/* 日語學院 Japanese Academy — practice.js
 * 課程練習模式：🗣️ 跟讀（ja-JP 語音辨識 + 表層 / 讀音雙重對齊評分）、🎭 角色扮演、✍️ 聽寫（漢字 / 假名 / 羅馬拼音都可作答）、❓ 4 題理解測驗。
 */
(function () {
  'use strict';
  const JA = window.JA;
  const jp = JA.jp;
  const esc = JA.esc;
  const LUI = JA.LUI;

  const cls = (s) => (s >= 80 ? 'ok' : s >= 55 ? 'warn' : 'bad');
  const avg = (arr) => (arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : 0);
  const speakUnit = (L, u, slow) => JA.tts.speak(u.ja, { ...JA.voiceOf(L, u.s),
    rate: slow ? Math.min(+JA.settings().rate || 1, 0.6) : (+JA.settings().rate || 1) });
  const legend = '<span class="tok ok">綠</span> 正確、<span class="tok alt">綠色虛線</span> 讀音對但寫法不同、<span class="tok near">橘</span> 部分正確、<span class="tok miss">紅</span> 漏掉或不清楚';
  function resultHtml(res) {
    const [label] = JA.scoreLabel(res.score);
    const missed = [...new Set(JA.missedOf(res))];
    return `<div class="score-row"><div class="score-ring ${cls(res.score)}" style="--p:${res.score}"><b>${res.score}</b><small>分</small></div>
      <div class="score-info"><div class="score-label">${label}</div>
        <div class="heard">🎧 辨識到：「${esc(res.heard || '（沒有聽到）')}」</div>
        ${missed.length ? `<div class="missed">再聽一次：${missed.slice(0, 8).map((w) => `<button type="button" class="chip bad" data-say="${esc(w)}">${esc(w)} 🔊</button>`).join(' ')}</div>` : ''}
      </div></div>`;
  }
  /** 記錄某個練習模式的單句最佳分數：p[mode] = {s:{key:best}, n, best(平均)}。 */
  function recordUnit(L, mode, key, score) {
    let isNew = false;
    const p = JA.updateProg(L.id, (q) => {
      const o = q[mode] || {};
      o.s = o.s || {};
      isNew = o.s[key] == null;
      o.s[key] = Math.max(o.s[key] || 0, score);
      const vals = Object.values(o.s);
      o.n = vals.length;
      o.best = avg(vals);
      q[mode] = o;
      q.mode = mode;
    });
    return { p, isNew };
  }
  const viewToggles = (id) => {
    const st = JA.settings();
    return `<label class="tg"><input type="checkbox" data-view="furi" ${st.showFuri !== false ? 'checked' : ''}><span>振假名</span></label>
      <label class="tg"><input type="checkbox" data-view="ro" ${st.showRomaji ? 'checked' : ''}><span>羅馬拼音</span></label>
      <label class="tg"><input type="checkbox" data-view="zh" ${st.showZh !== false ? 'checked' : ''}><span>中文</span></label>${id ? '' : ''}`;
  };
  function bindViewToggles(root, target) {
    root.addEventListener('change', (e) => {
      const v = e.target.closest('[data-view]');
      if (!v) return;
      const k = v.dataset.view;
      const on = v.checked;
      JA.setSetting(k === 'furi' ? 'showFuri' : k === 'ro' ? 'showRomaji' : 'showZh', on);
      target.classList.toggle(k === 'furi' ? 'no-furi' : k === 'ro' ? 'no-ro' : 'no-zh', !on);
    });
  }

  // ---------------------------------------------------------------------------
  // 🗣️ 跟讀
  // ---------------------------------------------------------------------------
  LUI.modes.shadow = (pane, L, query) => {
    const units = LUI.unitsOf(L);
    const asrOk = JA.asr.status().ok;
    const best = () => ((JA.prog(L.id).shadow || {}).s || {});
    let idx = units.findIndex((u) => u.key === query.u);
    if (idx < 0) idx = Math.max(0, units.findIndex((u) => best()[u.key] == null));
    const opt = { hide: false };
    let lastRec = null;
    let lastRes = null;
    let autoOn = false;
    pane.innerHTML = `${LUI.voiceBanner()}<div class="shadow-layout ${LUI.viewClasses()}" id="shWrap">
      <aside class="sh-list card" id="shList"></aside>
      <section class="sh-main">
        ${JA.micHelpHtml()}
        <div class="card sh-card" id="shCard"></div>
        <div class="card sh-opts">
          <label class="tg"><input type="checkbox" id="shHide"><span>🙈 隱藏日文（挑戰模式）</span></label>
          <label class="tg"><input type="checkbox" id="shAuto" ${asrOk ? '' : 'disabled'}><span>🔄 自動模式：播放 → 跟讀 → 評分 → 下一句</span></label>
          ${viewToggles()}
          ${LUI.rateSeg()}
        </div>
        <div class="card tip-card"><b>🗣️ 跟讀（Shadowing）怎麼練？</b><p>先按 ▶ 聽一次，注意長音、促音「っ」與語調；再按 🎤 模仿著唸，系統用日語語音辨識逐字比對：${legend}。每句練到 80 分以上再換下一句！
          ${JA.rec.supported ? '跟讀時會同時錄音，按「🔈 聽我的錄音」和原音比較。' : ''}</p></div>
      </section></div>`;
    LUI.bindRateSeg(pane);
    const wrap = JA.$('#shWrap', pane);
    bindViewToggles(pane, wrap);
    const list = JA.$('#shList', pane);
    const card = JA.$('#shCard', pane);
    function renderList() {
      const b = best();
      const done = units.filter((u) => b[u.key] != null).length;
      list.innerHTML = `<div class="sh-list-hd"><b>句子</b><span class="muted">${done} / ${units.length} 已練習</span></div>
        <div class="sh-items">${units.map((u, i) => {
          const s = b[u.key];
          return `<button type="button" class="sh-item ${i === idx ? 'active' : ''}" data-i="${i}">
            <span class="sh-badge ${s == null ? '' : cls(s)}">${s == null ? i + 1 : s}</span><span class="sh-txt">${esc(jp.surface(u.ja))}</span></button>`;
        }).join('')}</div>`;
      const act = JA.$('.sh-item.active', list);
      if (act && list.scrollHeight > list.clientHeight) act.scrollIntoView({ block: 'nearest' });
    }
    function renderCard() {
      const u = units[idx];
      const b = best()[u.key];
      const res = lastRes && lastRes.key === u.key ? lastRes : null;
      card.innerHTML = `<div class="sh-top"><span class="sh-n">第 ${idx + 1} / ${units.length} 句</span>
          <span class="chip sp">${LUI.avatar(L, u.s)}${LUI.spName(L, u.s)}</span>
          ${b != null ? `<span class="chip ${cls(b)}">最佳 ${b} 分</span>` : ''}</div>
        <div class="sh-sentence clickable-text ${opt.hide && !res ? 'masked' : ''}">${res ? JA.scoredHtml(res) : LUI.jaHtml(L, u.ja)}</div>
        <div class="ro sh-ro">${esc(jp.romaji(u.ja))}</div>
        <div class="sh-zh">${esc(u.zh)}</div>
        <div class="sh-ctrls">
          <button type="button" class="btn" data-sh="listen">▶ 聽原音</button>
          <button type="button" class="btn" data-sh="slow">🐢 慢速</button>
          <button type="button" class="btn primary big mic" data-sh="mic" ${asrOk ? '' : 'disabled'}>🎤 開始跟讀</button>
          <button type="button" class="btn" data-sh="mine" ${lastRec && res ? '' : 'disabled'}>🔈 聽我的錄音</button>
        </div>
        <div class="sh-live" id="shLive"></div>
        <div class="sh-result">${res ? resultHtml(res) : ''}</div>
        <div class="sh-nav">
          <button type="button" class="btn ghost" data-sh="prev" ${idx === 0 ? 'disabled' : ''}>⏮ 上一句</button>
          ${asrOk ? '' : '<button type="button" class="btn" data-sh="self">👍 我跟著唸完了</button>'}
          <button type="button" class="btn ghost" data-sh="next" ${idx >= units.length - 1 ? 'disabled' : ''}>下一句 ⏭</button>
        </div>`;
    }
    function go(i) {
      JA.tts.stop();
      JA.asr.abort();
      idx = JA.clamp(i, 0, units.length - 1);
      lastRes = null;
      lastRec = null;
      renderList();
      renderCard();
    }
    async function doMic() {
      if (JA.asr.listening) { JA.asr.stop(); return null; }
      JA.tts.stop();
      const u = units[idx];
      const micBtn = JA.$('[data-sh="mic"]', card);
      micBtn.classList.add('rec');
      micBtn.textContent = '⏹ 說完了';
      const live = JA.$('#shLive', card);
      live.textContent = '🎙️ 請開始說…';
      const recOn = await JA.rec.start();
      const chars = jp.surface(u.ja).length;
      const r = await JA.asr.listen({ maxMs: 4500 + chars * 280, onInterim: (t) => { live.textContent = `🎙️ ${t}`; } });
      lastRec = recOn ? await JA.rec.stop() : null;
      if (units[idx] !== u) return null;
      if (!r.text) {
        renderCard();
        JA.$('#shLive', card).innerHTML = `<span class="bad-txt">${esc(r.msg || '沒有聽到聲音')}</span>`;
        return null;
      }
      const res = JA.score(u.ja, r.alts.length ? r.alts : [r.text]);
      res.key = u.key;
      lastRes = res;
      const { isNew } = recordUnit(L, 'shadow', u.key, res.score);
      JA.addXP(res.score >= 80 ? 3 : 2, 'shadow');
      if (isNew && LUI.modeDone(L, 'shadow') && JA.prog(L.id).shadow.n === Math.ceil(units.length / 2)) {
        JA.toast('🗣️ 跟讀已完成一半以上的句子，這個模式打勾了！', 'ok');
      }
      renderList();
      renderCard();
      LUI.refreshHero(L);
      return res;
    }
    async function autoRun() {
      autoOn = true;
      let tries = 0;
      while (autoOn) {
        const u = units[idx];
        lastRes = null;
        renderList();
        renderCard();
        await speakUnit(L, u);
        if (!autoOn) break;
        await JA.sleep(350);
        if (!autoOn) break;
        const res = await doMic();
        if (!autoOn || !res) break;
        await JA.sleep(1600);
        if (!autoOn) break;
        if (res.score >= 70 || ++tries >= 2) {
          tries = 0;
          if (idx >= units.length - 1) { JA.toast('🎉 整課跟讀完成！', 'ok'); break; }
          idx++;
        }
      }
      autoOn = false;
      const cb = JA.$('#shAuto', pane);
      if (cb) cb.checked = false;
    }
    list.addEventListener('click', (e) => {
      const b = e.target.closest('.sh-item');
      if (b) { autoOn = false; JA.$('#shAuto', pane).checked = false; go(+b.dataset.i); }
    });
    card.addEventListener('click', async (e) => {
      const uel = e.target.closest('.u');
      if (uel && !e.target.closest('[data-sh]')) { LUI.onUnitClick(L, uel, units[idx].ja, units[idx].zh); return; }
      const b = e.target.closest('[data-sh]');
      if (!b) return;
      const a = b.dataset.sh;
      const u = units[idx];
      if (a === 'listen' || a === 'slow') { JA.asr.abort(); speakUnit(L, u, a === 'slow'); } else if (a === 'mic') doMic();
      else if (a === 'mine') JA.playUrl(lastRec);
      else if (a === 'prev') go(idx - 1);
      else if (a === 'next') go(idx + 1);
      else if (a === 'self') {
        recordUnit(L, 'shadow', u.key, 70);
        JA.addXP(1, 'shadow');
        if (idx < units.length - 1) go(idx + 1); else { renderList(); JA.toast('🎉 整課跟讀完成！', 'ok'); }
      }
    });
    JA.$('#shHide', pane).onchange = (e) => { opt.hide = e.target.checked; renderCard(); };
    JA.$('#shAuto', pane).onchange = (e) => {
      if (e.target.checked) autoRun();
      else { autoOn = false; JA.tts.stop(); JA.asr.abort(); }
    };
    JA.onCleanup(() => { autoOn = false; JA.rec.release(); });
    renderList();
    renderCard();
  };

  // ---------------------------------------------------------------------------
  // 🎭 角色扮演
  // ---------------------------------------------------------------------------
  LUI.modes.role = (pane, L) => {
    const keys = Object.keys(L.speakers || {}).filter((k) => L.lines.some((ln) => ln.s === k));
    const asrOk = JA.asr.status().ok;
    let role = keys[keys.length > 1 ? 1 : 0];
    let hint = 'ja';
    let running = false;
    let waiter = null;
    const stopAll = () => { running = false; JA.tts.stop(); JA.asr.abort(); if (waiter) waiter('stop'); };
    JA.onCleanup(stopAll);
    const HINTS = [['ja', '看日文台詞'], ['zh', '只看中文提示'], ['none', '不給提示（挑戰）']];

    function setup() {
      const p = JA.prog(L.id);
      pane.innerHTML = `${LUI.voiceBanner()}${JA.micHelpHtml()}
        <div class="card role-setup">
          <h3>🎭 選一個角色，和電腦用日語對話</h3>
          <p class="muted">電腦會唸出對方的台詞；輪到你時，對著麥克風說出你的台詞，系統即時評分。${p.role && p.role.best != null ? `目前最佳：<b>${p.role.best} 分</b>` : ''}</p>
          <div class="role-pick">${keys.map((k) => {
            const n = L.lines.filter((ln) => ln.s === k).length;
            return `<button type="button" class="role-card ${k === role ? 'active' : ''}" data-role="${k}">${LUI.avatar(L, k)}
              <b>我來演 ${LUI.spName(L, k)}</b><small>${n} 句台詞</small></button>`;
          }).join('')}</div>
          <div class="field-row"><span class="fr-lbl">提示方式</span>
            <div class="seg" id="hintSeg">${HINTS.map(([k, t]) => `<button type="button" data-hint="${k}" class="${k === hint ? 'active' : ''}">${t}</button>`).join('')}</div></div>
          <div class="field-row"><span class="fr-lbl">對方語速</span>${LUI.rateSeg()}</div>
          <button type="button" class="btn primary big" id="roleStart">▶ 開始角色扮演</button>
        </div>`;
      LUI.bindRateSeg(pane);
      pane.querySelector('.role-pick').onclick = (e) => {
        const b = e.target.closest('[data-role]');
        if (!b) return;
        role = b.dataset.role;
        JA.$$('.role-card', pane).forEach((x) => x.classList.toggle('active', x === b));
      };
      JA.$('#hintSeg', pane).onclick = (e) => {
        const b = e.target.closest('[data-hint]');
        if (!b) return;
        hint = b.dataset.hint;
        JA.$$('#hintSeg button', pane).forEach((x) => x.classList.toggle('active', x === b));
      };
      JA.$('#roleStart', pane).onclick = () => run();
    }
    function choice(ctrl, buttons) {
      ctrl.innerHTML = buttons.map(([k, label, primary]) => `<button type="button" class="btn ${primary ? 'primary' : ''}" data-choice="${k}">${label}</button>`).join('');
      return new Promise((resolve) => {
        waiter = (v) => { waiter = null; resolve(v); };
        ctrl.onclick = (e) => { const b = e.target.closest('[data-choice]'); if (b && waiter) waiter(b.dataset.choice); };
      });
    }
    async function run() {
      running = true;
      pane.innerHTML = `<div class="card role-run ${LUI.viewClasses()}">
        <div class="role-hd"><span>你是 <b>${LUI.spName(L, role)}</b> · ${(HINTS.find((h) => h[0] === hint) || HINTS[0])[1]}</span>
          <button type="button" class="btn sm ghost" id="roleStop">⏹ 結束</button></div>
        <div class="chat rp-chat clickable-text" id="rpChat"></div>
        <div class="rp-ctrl" id="rpCtrl"></div></div>`;
      const chat = JA.$('#rpChat', pane);
      const ctrl = JA.$('#rpCtrl', pane);
      JA.$('#roleStop', pane).onclick = () => { stopAll(); setup(); };
      const scores = [];
      const addMsg = (i, inner, mine) => {
        const ln = L.lines[i];
        chat.insertAdjacentHTML('beforeend', `<div class="msg ${LUI.sideOf(L, ln.s)} ${mine ? 'mine' : ''}" data-line="${i}" id="rp${i}">
          ${LUI.avatar(L, ln.s)}<div class="bubble" style="${LUI.colorVars(ln.s)}"><div class="who">${LUI.spName(L, ln.s)}${mine ? '（你）' : ''}</div>${inner}</div></div>`);
        const el = JA.$(`#rp${i}`, chat);
        el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        return el;
      };
      const lineInner = (ln) => `<div class="ja">${LUI.jaHtml(L, ln.ja)}</div><div class="ro">${esc(jp.romaji(ln.ja))}</div><div class="zh">${esc(ln.zh)}</div>`;
      for (let i = 0; i < L.lines.length && running; i++) {
        const ln = L.lines[i];
        if (ln.s !== role) {
          const el = addMsg(i, lineInner(ln), false);
          el.classList.add('playing');
          ctrl.innerHTML = '<span class="muted">🔊 對方說話中…</span>';
          await JA.tts.speak(ln.ja, JA.voiceOf(L, ln.s));
          el.classList.remove('playing');
          if (!running) break;
          await JA.sleep(250);
          continue;
        }
        const prompt = hint === 'ja' ? lineInner(ln)
          : hint === 'zh' ? `<div class="zh-hint">💬 ${esc(ln.zh)}</div><div class="hidden-line">${lineInner(ln)}</div>`
            : `<div class="zh-hint">🤔 輪到你了，試著用日語接話…</div><div class="hidden-line">${lineInner(ln)}</div>`;
        const el = addMsg(i, `${prompt}<div class="rp-live"></div><div class="rp-res"></div>`, true);
        el.classList.add('your-turn');
        if (!asrOk) {
          const c = await choice(ctrl, [['demo', '▶ 聽示範'], ['done', '✓ 我說完了', true]]);
          if (c === 'demo') { await JA.tts.speak(ln.ja, JA.voiceOf(L, role)); i--; el.remove(); continue; }
          if (c === 'stop' || !running) break;
          el.classList.remove('your-turn');
          JA.$$('.hidden-line', el).forEach((x) => x.classList.remove('hidden-line'));
          scores.push(null);
          continue;
        }
        let res = null;
        let attempt = 0;
        while (running) {
          ctrl.innerHTML = '<span class="rec-dot"></span> <b>輪到你說了</b> <span class="muted">（說完會自動停止）</span> <button type="button" class="btn sm" id="rpDone">⏹ 說完了</button> <button type="button" class="btn sm ghost" id="rpSkip">⏭ 跳過</button>';
          let skipped = false;
          JA.$('#rpDone', ctrl).onclick = () => JA.asr.stop();
          JA.$('#rpSkip', ctrl).onclick = () => { skipped = true; JA.asr.abort(); };
          const live = JA.$('.rp-live', el);
          const r = await JA.asr.listen({ maxMs: 6000 + jp.surface(ln.ja).length * 300, onInterim: (t) => { live.textContent = `🎙️ ${t}`; } });
          live.textContent = '';
          if (!running || skipped) break;
          if (!r.text) {
            JA.$('.rp-res', el).innerHTML = `<span class="bad-txt">${esc(r.msg || '沒有聽到聲音')}</span>`;
            const c = await choice(ctrl, [['retry', '⟳ 再說一次', true], ['demo', '▶ 聽示範'], ['skip', '⏭ 跳過']]);
            if (c === 'demo') { await JA.tts.speak(ln.ja, JA.voiceOf(L, role)); continue; }
            if (c !== 'retry') break;
            continue;
          }
          res = JA.score(ln.ja, r.alts.length ? r.alts : [r.text]);
          JA.$$('.hidden-line', el).forEach((x) => x.classList.remove('hidden-line'));
          JA.$('.ja', el).innerHTML = JA.scoredHtml(res);
          JA.$('.rp-res', el).innerHTML = `<span class="chip ${cls(res.score)}">${res.score} 分</span> <span class="muted">${esc(JA.scoreLabel(res.score)[0])}</span>`;
          if (res.score >= 60 || attempt >= 1) { await JA.sleep(900); break; }
          attempt++;
          const c = await choice(ctrl, [['retry', '⟳ 再說一次', true], ['demo', '▶ 聽示範'], ['next', '繼續 ⏭']]);
          if (c === 'demo') { await JA.tts.speak(ln.ja, JA.voiceOf(L, role)); continue; }
          if (c !== 'retry') break;
        }
        el.classList.remove('your-turn');
        JA.$$('.hidden-line', el).forEach((x) => x.classList.remove('hidden-line'));
        scores.push(res ? res.score : 0);
      }
      if (!running) return;
      running = false;
      const valid = scores.filter((s) => s != null);
      const a = valid.length ? avg(valid) : null;
      JA.updateProg(L.id, (q) => {
        q.role = q.role || {};
        q.role.n = (q.role.n || 0) + 1;
        if (a != null) q.role.best = Math.max(q.role.best || 0, a);
        q.mode = 'role';
      });
      JA.addXP(15, 'role');
      LUI.refreshHero(L);
      ctrl.innerHTML = `<div class="rp-summary">
        ${a != null ? `<div class="score-ring ${cls(a)}" style="--p:${a}"><b>${a}</b><small>分</small></div>` : '<div class="big-emoji">🎉</div>'}
        <div><b>角色扮演完成！+15 XP</b><div class="muted">你說了 ${scores.length} 句台詞${a != null ? `，平均 ${a} 分` : ''}。換個角色或提高難度再挑戰一次吧！</div></div>
        <div class="rp-sum-acts"><button type="button" class="btn primary" data-again>⟳ 再來一次</button><button type="button" class="btn" data-swap>🔄 換角色</button></div></div>`;
      JA.$('[data-again]', ctrl).onclick = () => run();
      JA.$('[data-swap]', ctrl).onclick = () => { role = keys[(keys.indexOf(role) + 1) % keys.length]; setup(); };
    }
    setup();
  };

  // ---------------------------------------------------------------------------
  // ✍️ 聽寫
  // ---------------------------------------------------------------------------
  /** 提示：1 → 只給每個詞的第一個假名；2 → 一半假名；3 → 完整平假名讀音。 */
  function hintText(ja, level) {
    return jp.tokens(ja).map((tk) => {
      const r = Array.from(jp.toHira(tk.reading));
      if (level >= 3) return r.join('');
      const keep = Math.max(1, Math.ceil((r.length * level) / 3));
      return r.map((ch, i) => (i < keep || jp.PUNCT_RE.test(ch) ? ch : '＿')).join('');
    }).join(' ');
  }
  LUI.modes.dict = (pane, L, query) => {
    const units = LUI.unitsOf(L);
    const best = () => ((JA.prog(L.id).dict || {}).s || {});
    let idx = units.findIndex((u) => u.key === query.u);
    if (idx < 0) idx = Math.max(0, units.findIndex((u) => best()[u.key] == null));
    let plays = 0;
    let hintLv = 0;
    let checked = null;
    pane.innerHTML = `${LUI.voiceBanner()}<div class="dict-layout ${LUI.viewClasses()}">
      <section class="card dict-card" id="dictCard"></section>
      <aside class="card dict-side"><h3>✍️ 聽寫怎麼練？</h3>
        <ol class="small"><li>按 ▶ 播放（可以重聽、放慢）。</li><li>把聽到的句子打出來，<b>Enter</b> 檢查（Shift+Enter 換行）。</li>
        <li>可以用<b>日文輸入法</b>打漢字或假名；沒有日文輸入法也可以打<b>羅馬拼音</b>（例：watashi wa gakusei desu）。</li>
        <li>標點不計分；漢字寫成假名也算對。卡住就按 💡 提示。</li></ol>
        <div class="dict-prog" id="dictProg"></div>${LUI.rateSeg()}</aside></div>`;
    LUI.bindRateSeg(pane);
    const card = JA.$('#dictCard', pane);
    const prog = JA.$('#dictProg', pane);
    function renderProg() {
      const b = best();
      const vals = Object.values(b);
      prog.innerHTML = `<div class="muted small">已完成 ${vals.length} / ${units.length} 句 · 平均 ${vals.length ? avg(vals) : '—'} 分</div>
        <div class="dots">${units.map((u, i) => `<button type="button" class="dot ${b[u.key] == null ? '' : cls(b[u.key])} ${i === idx ? 'cur' : ''}" data-i="${i}" title="第 ${i + 1} 句"></button>`).join('')}</div>`;
    }
    function render() {
      const u = units[idx];
      card.innerHTML = `<div class="sh-top"><span class="sh-n">第 ${idx + 1} / ${units.length} 句</span>
          <span class="chip sp">${LUI.avatar(L, u.s)}${LUI.spName(L, u.s)}</span>${best()[u.key] != null ? `<span class="chip ${cls(best()[u.key])}">最佳 ${best()[u.key]} 分</span>` : ''}</div>
        <div class="dict-ctrls"><button type="button" class="btn primary" data-d="play">▶ 播放 <small>${plays ? `（${plays}）` : ''}</small></button>
          <button type="button" class="btn" data-d="slow">🐢 慢速</button>
          <button type="button" class="btn ghost" data-d="hint" ${checked ? 'disabled' : ''}>💡 提示</button></div>
        ${hintLv && !checked ? `<div class="dict-hint">${esc(hintText(u.ja, hintLv))}</div>` : ''}
        <textarea id="dictIn" class="dict-in" rows="3" lang="ja" placeholder="聽到什麼就打什麼…（漢字、假名或羅馬拼音；Enter 檢查）" ${checked ? 'disabled' : ''} spellcheck="false" autocomplete="off"></textarea>
        ${checked ? `<div class="dict-res"><div class="score-row"><div class="score-ring ${cls(checked.score)}" style="--p:${checked.score}"><b>${checked.score}</b><small>分</small></div>
            <div class="score-info"><div class="score-label">${esc(JA.scoreLabel(checked.score)[0])}</div>
            <div class="dict-ans ja-txt">${JA.scoredHtml(checked)}</div>
            <div class="muted small">你打的：${esc(checked.heard || '')}</div></div></div>
            <div class="dict-orig"><div class="ro">${esc(jp.romaji(u.ja))}</div><div class="zh">${esc(u.zh)}</div></div></div>` : ''}
        <div class="sh-nav"><button type="button" class="btn ghost" data-d="prev" ${idx === 0 ? 'disabled' : ''}>⏮ 上一句</button>
          ${checked ? '<button type="button" class="btn" data-d="retry">⟳ 重寫這句</button>' : '<button type="button" class="btn primary" data-d="check">✔ 檢查</button>'}
          <button type="button" class="btn ghost" data-d="next" ${idx >= units.length - 1 ? 'disabled' : ''}>下一句 ⏭</button></div>`;
      const inp = JA.$('#dictIn', card);
      if (checked) inp.value = checked.heard || '';
      else setTimeout(() => inp.focus({ preventScroll: true }), 30);
      inp.addEventListener('keydown', (e) => { if (JA.isEnterSend(e)) { e.preventDefault(); check(); } });
    }
    function play(slow) { plays++; speakUnit(L, units[idx], slow); const b = JA.$('[data-d="play"] small', card); if (b) b.textContent = `（${plays}）`; }
    function check() {
      const u = units[idx];
      const typed = JA.$('#dictIn', card).value.trim();
      if (!typed) { JA.toast('先打出你聽到的內容喔'); return; }
      const res = JA.score(u.ja, [typed], { altFull: true, romaji: true });
      res.score = Math.max(0, res.score - hintLv * 5);
      checked = res;
      recordUnit(L, 'dict', u.key, res.score);
      JA.addXP(res.score >= 90 ? 3 : 2, 'dict');
      render();
      renderProg();
      LUI.refreshHero(L);
    }
    function go(i) { JA.tts.stop(); idx = JA.clamp(i, 0, units.length - 1); plays = 0; hintLv = 0; checked = null; render(); renderProg(); play(); }
    card.addEventListener('click', (e) => {
      const b = e.target.closest('[data-d]');
      if (!b) return;
      const a = b.dataset.d;
      if (a === 'play') play(false);
      else if (a === 'slow') play(true);
      else if (a === 'hint') { hintLv = Math.min(3, hintLv + 1); const v = JA.$('#dictIn', card).value; render(); JA.$('#dictIn', card).value = v; }
      else if (a === 'check') check();
      else if (a === 'retry') { checked = null; hintLv = 0; render(); }
      else if (a === 'prev') go(idx - 1);
      else if (a === 'next') go(idx + 1);
    });
    prog.addEventListener('click', (e) => { const d = e.target.closest('[data-i]'); if (d) go(+d.dataset.i); });
    render();
    renderProg();
  };

  // ---------------------------------------------------------------------------
  // ❓ 理解測驗（4 題）
  // ---------------------------------------------------------------------------
  LUI.modes.quiz = (pane, L) => {
    const qs = (L.questions || []).slice(0, 4);
    let i = 0;
    let correct = 0;
    let answered = false;
    let showZh = ['A1', 'A2'].includes(L.level);
    if (!qs.length) { pane.innerHTML = '<div class="card empty"><h3>這課沒有測驗題</h3></div>'; return; }
    pane.innerHTML = `<div class="quiz-layout ${LUI.viewClasses()}"><section class="card quiz-card" id="qCard"></section>
      <aside class="card quiz-side"><h3>🎧 先聽再作答</h3><p class="muted small">建議先不看文字聽完整段對話，再回答理解題，最能練到真實聽力。</p>
        <button type="button" class="btn" id="qListen">▶ 播放整段（不看文字）</button>
        <button type="button" class="btn ghost" id="qStop" hidden>⏹ 停止</button>
        <p class="muted small">共 ${qs.length} 題聽力理解題 · 答對 60% 以上這個模式就會打勾</p></aside></div>`;
    const card = JA.$('#qCard', pane);
    const listenAll = async () => {
      JA.tts.stop();
      const tok = JA.tts.token();
      JA.$('#qStop', pane).hidden = false;
      for (const ln of L.lines) {
        if (!JA.tts.alive(tok)) break;
        await JA.tts.speak(ln.ja, JA.voiceOf(L, ln.s));
        await JA.sleep(250);
      }
      if (JA.tts.alive(tok)) JA.$('#qStop', pane).hidden = true;
    };
    JA.$('#qListen', pane).onclick = listenAll;
    JA.$('#qStop', pane).onclick = () => { JA.tts.stop(); JA.$('#qStop', pane).hidden = true; };
    function render() {
      if (i >= qs.length) return finish();
      const q = qs[i];
      answered = false;
      const hasZh = Array.isArray(q.opts_zh) && q.opts_zh.length === 4;
      card.innerHTML = `<div class="q-top"><span class="sh-n">第 ${i + 1} / ${qs.length} 題</span>
          <label class="tg sm"><input type="checkbox" id="qZh" ${showZh ? 'checked' : ''}><span>中文提示</span></label>
          <div class="q-bar"><i style="width:${(i / qs.length) * 100}%"></i></div></div>
        <h3 class="q-q ja-txt">${JA.ruby(q.q)} <button type="button" class="icon-btn sm" data-say="${esc(jp.surface(q.q))}">🔊</button></h3>
        <div class="q-zh ${showZh ? '' : 'hidden'}">${esc(q.q_zh || '')}</div>
        <div class="opts">${q.opts.map((o, k) => `<button type="button" class="opt" data-k="${k}"><span class="opt-k">${'ABCD'[k]}</span>
          <span><span class="ja-txt">${JA.ruby(o)}</span>${hasZh ? `<small class="opt-zh ${showZh ? '' : 'hidden'}">${esc(q.opts_zh[k])}</small>` : ''}</span></button>`).join('')}</div>
        <div class="q-exp"></div>
        <div class="q-nav"><button type="button" class="btn primary" id="qNext" hidden>${i === qs.length - 1 ? '看結果' : '下一題 →'}</button></div>`;
      JA.$('#qZh', card).onchange = (e) => {
        showZh = e.target.checked;
        JA.$$('.q-zh, .opt-zh', card).forEach((x) => x.classList.toggle('hidden', !showZh));
      };
      JA.$('#qNext', card).onclick = () => { i++; render(); };
    }
    card.addEventListener('click', (e) => {
      const b = e.target.closest('.opt');
      if (!b || answered) return;
      answered = true;
      const q = qs[i];
      const k = +b.dataset.k;
      const ok = k === q.ans;
      if (ok) { correct++; JA.addXP(2, 'quiz'); }
      JA.$$('.opt', card).forEach((x) => {
        x.disabled = true;
        if (+x.dataset.k === q.ans) x.classList.add('correct');
        else if (x === b) x.classList.add('wrong');
      });
      JA.$$('.opt-zh', card).forEach((x) => x.classList.remove('hidden'));
      JA.$('.q-exp', card).innerHTML = `<div class="${ok ? 'ok-txt' : 'bad-txt'}">${ok ? '✅ 答對了！' : `❌ 正確答案是 ${'ABCD'[q.ans]}`}</div>${q.exp ? `<p>${esc(q.exp)}</p>` : ''}`;
      JA.$('#qNext', card).hidden = false;
    });
    function finish() {
      const score = Math.round((correct / qs.length) * 100);
      JA.updateProg(L.id, (q) => { q.quiz = q.quiz || {}; q.quiz.best = Math.max(q.quiz.best || 0, score); q.quiz.n = (q.quiz.n || 0) + 1; q.mode = 'quiz'; });
      LUI.refreshHero(L);
      card.innerHTML = `<div class="quiz-done"><div class="score-ring big ${cls(score)}" style="--p:${score}"><b>${score}</b><small>分</small></div>
        <h3>${score >= 80 ? '🎉 太厲害了！' : score >= 60 ? '👍 不錯喔！' : '💪 再聽一次會更好'}</h3>
        <p class="muted">答對 ${correct} / ${qs.length} 題 · +${correct * 2} XP</p>
        <div class="q-nav"><button type="button" class="btn primary" id="qAgain">⟳ 再做一次</button>
          <a class="btn" href="${JA.hashFor('lesson', [L.id], { mode: 'read' })}">📖 回去看課文</a></div></div>`;
      JA.$('#qAgain', card).onclick = () => { i = 0; correct = 0; render(); };
    }
    render();
  };
})();

</script>
  <script>/* /js/home.js */
/* 日語學院 Japanese Academy — home.js
 * 🏠 今日：連續天數、今日目標圈、今日計畫（あ 五十音 → 📚 課程 → 🔤 單字複習）、繼續上次、今日單字、推薦課程、各級進度；
 * 第一次使用的程度選擇（🔰 完全新手 → 從五十音開始）。
 */
(function () {
  'use strict';
  const JA = window.JA;
  const jp = JA.jp;
  const esc = JA.esc;

  /** 依目前程度挑「下一課」：同級第一課未完成 → 下一級 → 任一課。 */
  JA.nextLesson = (level) => {
    const lv = level || JA.settings().level || 'A1';
    const all = JA.lessons().filter((L) => !L.custom);
    const order = JA.LEVELS.map((l) => l.id);
    for (let k = Math.max(0, order.indexOf(lv)); k < order.length; k++) {
      const hit = all.find((L) => L.level === order[k] && !JA.prog(L.id).done);
      if (hit) return hit;
    }
    return all.find((L) => L.level === lv) || all[0] || null;
  };
  JA.ringSvg = (pct, size, stroke, color) => {
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const p = JA.clamp(pct, 0, 1);
    return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="${stroke}"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color || 'var(--primary)'}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>`;
  };
  JA.lessonCard = (L) => {
    const t = JA.topic(L.topic);
    const p = JA.prog(L.id);
    const lv = JA.level(L.level);
    const m = (k, ic) => `<span class="${JA.LUI.modeDone(L, k) ? 'on' : ''}" title="${{ read: '聽力', shadow: '跟讀', role: '角色扮演', dict: '聽寫', quiz: '測驗' }[k]}">${ic}</span>`;
    return `<a class="lcard ${p.done ? 'done' : ''}" href="#/lesson/${esc(L.id)}" style="--lv:${lv.color};--lv-soft:${lv.soft}">
      <div class="lc-top"><span class="lc-ic">${t.icon}</span>${JA.lvlBadge(L.level)}<span class="jlpt">${lv.jlpt}</span>
        ${L.custom ? '<span class="chip info">🤖 AI</span>' : ''}${p.fav ? '<span class="lc-fav" title="已收藏">★</span>' : ''}
        ${p.done ? '<span class="lc-done" title="已完成">✓</span>' : ''}</div>
      <h3 class="ja-title">${JA.ruby(L.title)}</h3>
      <div class="lc-zh">${esc(L.title_zh || '')}</div>
      <p class="lc-scene">${esc(L.scene_zh || '')}</p>
      <div class="lc-ft"><span>⏱ ${L._min} 分</span><span>${L.lines.length} 句</span><span class="lc-topic">${esc(t.zh)}</span>
        <span class="lc-modes">${m('read', '🎧')}${m('shadow', '🗣️')}${m('role', '🎭')}${m('dict', '✍️')}${m('quiz', '❓')}</span></div></a>`;
  };
  function greet() {
    const h = new Date().getHours();
    return h < 5 ? 'こんばんは・夜深了' : h < 11 ? 'おはよう・早安' : h < 18 ? 'こんにちは・午安' : 'こんばんは・晚安';
  }
  function wordOfDay() {
    const lv = JA.settings().level || 'A1';
    const pool = JA.words(lv);
    if (!pool.length) return null;
    const d = new Date();
    return pool[(d.getFullYear() * 400 + d.getMonth() * 31 + d.getDate()) % pool.length];
  }

  JA.route('home', (main) => {
    const st = JA.settings();
    const lv = st.level || 'A1';
    const day = JA.day();
    const goalSec = (st.goalMin || 15) * 60;
    const pct = Math.min(1, (day.sec || 0) / goalSec);
    const act = day.act || {};
    const rec = JA.nextLesson(lv);
    const vlist = JA.vocab.list();
    const due = JA.vocab.due(vlist);
    const last = JA.state.meta && JA.state.meta.last;
    const lastL = last && JA.lesson(last.lesson);
    const streak = JA.streak();
    const wotd = wordOfDay();
    const ks = JA.kanaApi.stats('h');
    const kk = JA.kanaApi.stats('k');
    const kDue = JA.kanaApi.due('mix').length;
    const kanaAll = ks.familiar + kk.familiar;
    const kanaDone = kanaAll >= ks.total + kk.total;
    const script = ks.familiar < ks.total ? 'h' : 'k';
    const nextRow = JA.kanaApi.nextRow(script);
    const newN = +st.newPerDay || 10;
    const newToday = JA.newWordsToday();
    const modeName = { read: '閱讀・聽力', shadow: '跟讀', role: '角色扮演', dict: '聽寫', quiz: '測驗', words: '單字・文法' };
    const steps = [
      { ok: kanaDone || (act.kana || 0) >= 10 || ((act.kanaRow || 0) >= 1),
        ic: 'あ', t: '五十音', d: kanaDone ? `平假名、片假名都熟悉了${kDue ? `，還有 ${kDue} 個到期複習` : ' 👍'}`
          : nextRow ? `下一行：${JA.kanaApi.rowName(nextRow, script)}（${script === 'h' ? '平假名' : '片假名'} ${script === 'h' ? ks.familiar : kk.familiar}/${ks.total}）${kDue ? ` · ${kDue} 個到期` : ''}` : `${kDue} 個假名到期複習`,
        href: kDue && (kanaDone || !nextRow) ? '#/kana/quiz?type=pick&scope=due&s=mix' : nextRow ? JA.hashFor('kana', ['row', nextRow.id], { s: script }) : '#/kana',
        btn: kDue && (kanaDone || !nextRow) ? '複習假名' : '學一行' },
      { ok: (act.listen || 0) >= 1 || (act.done || 0) >= 1, ic: '📚', t: '上一課',
        d: rec ? `推薦：${jp.surface(rec.title)}（${rec.title_zh || ''}）· 聽 → 跟讀 → 測驗` : '從課程列表挑一課',
        href: rec ? JA.hashFor('lesson', [rec.id], { mode: 'read' }) : '#/library', btn: '開始上課' },
      { ok: newToday >= newN && (due.length === 0 || (act.review || 0) >= Math.min(10, due.length + (act.review || 0))), ic: '🔤', t: '單字：新字＋複習',
        d: `今日新字 ${Math.min(newToday, newN)}/${newN}${vlist.length ? ` · ${due.length ? `${due.length} 個單字到期` : '複習都完成了'}` : ''}`,
        href: newToday < newN ? JA.hashFor('words', ['today'], { level: lv }) : '#/review', btn: newToday < newN ? '學新字' : '去複習' },
    ];
    const doneSteps = steps.filter((s) => s.ok).length;
    const recs = JA.lessons().filter((L) => L.level === lv && !JA.prog(L.id).done && (!rec || L.id !== rec.id)).slice(0, 5);
    main.innerHTML = `
      <section class="today card">
        <div class="today-txt">
          <div class="greet">${greet()}！今天也來練日語吧 🌸</div>
          <h1>今日練習</h1>
          <div class="today-stats">
            <span class="stat"><b>🔥 ${streak}</b> 天連續</span>
            <span class="stat"><b>⭐ ${day.xp || 0}</b> XP 今日</span>
            <span class="stat"><b>あ ${kanaAll}</b>/${ks.total + kk.total} 假名</span>
            <span class="stat"><b>📒 ${vlist.length}</b> 個單字</span>
            <span class="stat">${JA.lvlBadge(lv, JA.level(lv).name)} ${JA.jlptChip(lv)}</span>
          </div>
          <div class="today-plan-mini">今日計畫完成 <b>${doneSteps} / ${steps.length}</b> · ${pct >= 1 ? '🎯 今日目標達成！' : `再練 ${Math.max(1, Math.ceil((goalSec - (day.sec || 0)) / 60))} 分鐘達成目標`}</div>
        </div>
        <div class="today-ring">${JA.ringSvg(pct, 132, 12, pct >= 1 ? '#16a34a' : 'var(--primary)')}
          <div class="ring-txt"><b>${Math.floor((day.sec || 0) / 60)}</b><small>/ ${st.goalMin || 15} 分鐘</small></div></div>
      </section>

      <section class="card plan">
        <div class="card-hd"><h3>📋 今日計畫 <span class="muted">五十音 → 課程 → 單字複習</span></h3></div>
        <div class="steps">${steps.map((s, i) => `<div class="step ${s.ok ? 'ok' : ''}">
          <div class="step-n">${s.ok ? '✓' : i + 1}</div><div class="step-ic">${s.ic}</div>
          <div class="step-txt"><b>${s.t}</b><div class="muted">${esc(s.d)}</div></div>
          <a class="btn ${s.ok ? 'ghost' : 'primary'} sm" href="${s.href}">${s.ok ? '再練一次' : s.btn}</a></div>`).join('')}</div>
      </section>

      <div class="home-grid">
        ${lastL ? `<section class="card continue"><div class="muted small">▶ 繼續上次</div>
          <h3 class="ja-title"><a href="${JA.hashFor('lesson', [lastL.id], { mode: last.mode || 'read' })}">${JA.ruby(lastL.title)}</a></h3>
          <div class="muted">${JA.lvlBadge(lastL.level)} ${esc(lastL.title_zh || '')} · ${esc(modeName[last.mode] || '閱讀・聽力')}</div>
          <a class="btn primary sm" href="${JA.hashFor('lesson', [lastL.id], { mode: last.mode || 'read' })}">繼續練習 →</a></section>`
          : `<section class="card continue"><div class="muted small">🚀 ${st.beginner ? '先從五十音開始' : '開始第一課'}</div>
          ${st.beginner ? '<h3>あ 平假名：あ行</h3><div class="muted">每天學 1–2 行，搭配測驗很快就能讀懂假名</div><a class="btn primary sm" href="#/kana/row/a?s=h">開始學五十音 →</a>'
            : `<h3 class="ja-title">${rec ? JA.ruby(rec.title) : '挑一課'}</h3><div class="muted">${rec ? `${JA.lvlBadge(rec.level)} ${esc(rec.title_zh || '')}` : ''}</div>
          <a class="btn primary sm" href="${rec ? `#/lesson/${esc(rec.id)}` : '#/library'}">開始 →</a>`}</section>`}
        ${wotd ? `<section class="card wotd"><div class="muted small">📌 今日單字 · ${esc(lv)}</div>
          <div class="wotd-w"><b class="ja-txt">${JA.ruby(wotd.w)}</b><span class="ro-inline">${esc(wotd.ro)}</span>
            <button type="button" class="icon-btn" data-say="${esc(wotd.s)}">🔊</button></div>
          <div class="wotd-zh">${esc(wotd.zh)}</div>
          ${wotd.ex ? `<div class="wotd-ex"><button type="button" class="icon-btn sm" data-say="${esc(jp.surface(wotd.ex))}">▶</button><span class="ja-txt">${JA.ruby(wotd.ex)}</span></div>` : ''}
          <div class="wotd-acts"><button type="button" class="btn sm ${JA.vocab.has(wotd.key) ? 'ghost' : 'primary'}" id="wotdSave">${JA.vocab.has(wotd.key) ? '✓ 已在單字本' : '⭐ 加入單字本'}</button>
            <a class="btn sm ghost" href="${JA.hashFor('words', [], { level: lv })}">🔤 ${esc(lv)} 單字庫</a></div></section>` : ''}
      </div>

      <section class="card">
        <div class="card-hd"><h3>為你推薦 · ${JA.lvlBadge(lv, JA.level(lv).name)}</h3><a class="btn sm ghost" href="#/library?level=${esc(lv)}">看全部 ${esc(lv)} →</a></div>
        <div class="lesson-grid">${(rec ? [rec, ...recs] : recs).slice(0, 6).map(JA.lessonCard).join('') || '<p class="muted">這個等級都完成了！試試更高一級 💪</p>'}</div>
      </section>

      <section class="card">
        <div class="card-hd"><h3>📶 各等級進度</h3><span class="muted small">課程完成數 · 單字已學</span></div>
        <div class="lv-bars">${JA.LEVELS.map((l) => {
          const ls = JA.lessons().filter((L) => L.level === l.id);
          const d = ls.filter((L) => JA.prog(L.id).done).length;
          const wp = JA.wordProgress(l.id);
          return `<a class="lv-bar" href="#/library?level=${l.id}" style="--lv:${l.color};--lv-soft:${l.soft}">
            <span class="lvb-id">${l.id}</span><span class="lvb-name">${l.name} <small>${l.jlpt}</small></span>
            <span class="lvb-track"><i style="width:${ls.length ? (d / ls.length) * 100 : 0}%"></i></span>
            <span class="lvb-n">${d}/${ls.length} 課 · ${wp.learned}/${wp.total} 字</span></a>`;
        }).join('')}</div>
      </section>`;
    const ws = JA.$('#wotdSave', main);
    if (ws && wotd && !JA.vocab.has(wotd.key)) {
      ws.onclick = () => {
        JA.saveWord(wotd);
        ws.textContent = '✓ 已在單字本';
        ws.classList.replace('primary', 'ghost');
        JA.toast(`⭐ 已加入單字本：${wotd.s}`, 'ok');
      };
    }
  });

  /** 第一次使用：選程度（完全新手 → 五十音）。 */
  JA.showOnboarding = () => {
    const body = `<p class="ob-intro">每天 15 分鐘，從五十音一路學到 A1–C2（約對應 JLPT N5–N1）：<b>あ 五十音</b> → <b>📚 生活對話課程</b>（聽、跟讀、角色扮演）→ <b>🔤 單字複習</b>。先選一個最接近你的程度（之後可以在「進度 → 設定」調整）：</p>
      <div class="ob-levels">
        <button type="button" class="ob-lv ob-new" data-lv="new" style="--lv:#e11d48;--lv-soft:#fff1f2"><span class="ob-id">🔰</span><b>完全新手</b>
          <span>還不會假名：從平假名「あ行」開始，一行一行學、點字就發音。</span></button>
        ${JA.LEVELS.map((l) => `<button type="button" class="ob-lv" data-lv="${l.id}" style="--lv:${l.color};--lv-soft:${l.soft}">
        <span class="ob-id">${l.id}</span><b>${l.name} <small>≈ JLPT ${l.jlpt}</small></b><span>${esc(l.can)}</span></button>`).join('')}</div>
      <p class="muted small">不確定？看得懂平假名就選 <b>A1</b>；還不會假名就選「完全新手」。</p>`;
    const m = JA.modal({ title: '👋 歡迎來到日語學院', body, wide: true, cls: 'onboard' });
    JA.$('.ob-levels', m.el).onclick = (e) => {
      const b = e.target.closest('[data-lv]');
      if (!b) return;
      const beginner = b.dataset.lv === 'new';
      JA.state.settings.level = beginner ? 'A1' : b.dataset.lv;
      JA.state.settings.beginner = beginner;
      JA.state.settings.onboarded = true;
      JA.state.settings._u = Date.now();
      JA.save();
      m.close();
      if (beginner) {
        JA.toast('從平假名「あ行」開始吧！點任何假名都會發音 🌸', 'ok');
        JA.go('#/kana/row/a?s=h');
      } else {
        JA.toast(`已設定程度：${b.dataset.lv}（JLPT ${JA.level(b.dataset.lv).jlpt}），開始今天的練習吧！`, 'ok');
        JA.renderRoute();
      }
    };
  };
})();

</script>
  <script>/* /js/library.js */
/* 日語學院 Japanese Academy — library.js
 * 📚 分級課程 (#/library)：依 A1–C2（JLPT N5–N1+）、主題、完成狀態篩選與搜尋（日文、假名、中文都能搜）。
 */
(function () {
  'use strict';
  const JA = window.JA;
  const jp = JA.jp;
  const esc = JA.esc;

  JA.route('library', (main, params, query) => {
    const all = JA.lessons();
    const f = {
      level: JA.LEVELS.some((l) => l.id === query.level) ? query.level : '',
      topic: query.topic || '',
      status: query.status || 'all',
      q: query.q || '',
    };
    const topics = [...new Set(all.map((L) => L.topic))].sort((a, b) => JA.topic(a).zh.localeCompare(JA.topic(b).zh, 'zh-Hant'));
    const lvCount = (id) => {
      const ls = all.filter((L) => !id || L.level === id);
      return [ls.length, ls.filter((L) => JA.prog(L.id).done).length];
    };
    main.innerHTML = `
      <div class="page-hd"><div><h1>📚 分級課程</h1><p class="muted">${all.length} 課生活對話，依程度分成 A1–C2（約對應 JLPT N5–N1）。每課都有振假名、羅馬拼音、中文翻譯、重點單字與 2–3 個文法重點，可以聽、跟讀、角色扮演、聽寫和測驗。</p></div>
        ${JA.aiAvailable() ? '<button type="button" class="btn primary" id="aiGen">🤖 用 AI 產生新對話</button>' : ''}</div>
      <div class="lib-levels">${[['', '全部', '#334155', '#f1f5f9', ''], ...JA.LEVELS.map((l) => [l.id, l.name, l.color, l.soft, l.jlpt])].map(([id, name, c, soft, jl]) => {
        const [n, d] = lvCount(id);
        return `<button type="button" class="lib-lv ${f.level === id ? 'active' : ''}" data-level="${id}" style="--lv:${c};--lv-soft:${soft}">
          <b>${id || '全部'}${jl ? ` <span class="jlpt">${jl}</span>` : ''}</b><span>${id ? name : '所有等級'}</span><small>${d}/${n} 完成</small></button>`;
      }).join('')}</div>
      <div class="card lib-toolbar">
        <input type="search" id="libQ" placeholder="🔍 搜尋標題、情境、日文或中文…" value="${esc(f.q)}" autocomplete="off">
        <select id="libTopic"><option value="">所有主題</option>${topics.map((t) => `<option value="${t}" ${f.topic === t ? 'selected' : ''}>${JA.topic(t).icon} ${esc(JA.topic(t).zh)}</option>`).join('')}</select>
        <div class="seg" id="libStatus">${[['all', '全部'], ['todo', '未完成'], ['done', '已完成'], ['fav', '★ 收藏']].map(([k, t]) =>
          `<button type="button" data-status="${k}" class="${f.status === k ? 'active' : ''}">${t}</button>`).join('')}</div>
      </div>
      <div class="lib-count muted" id="libCount"></div>
      <div class="lesson-grid ${JA.settings().showFuri === false ? 'no-furi' : ''}" id="libGrid"></div>`;
    const grid = JA.$('#libGrid', main);
    const render = () => {
      const q = f.q.trim().toLowerCase();
      const qk = q ? jp.toHira(jp.romajiToKana(q)) : '';
      const list = all.filter((L) => (!f.level || L.level === f.level) && (!f.topic || L.topic === f.topic) &&
        (f.status === 'all' || (f.status === 'done' ? !!JA.prog(L.id).done : f.status === 'todo' ? !JA.prog(L.id).done : !!JA.prog(L.id).fav)) &&
        (!q || L._hay.includes(q) || (qk && L._hay.includes(qk))));
      JA.$('#libCount', main).textContent = `顯示 ${list.length} 課`;
      grid.innerHTML = list.map(JA.lessonCard).join('') || `<div class="card empty"><div class="empty-ic">🔎</div><h3>沒有符合條件的課程</h3><p class="muted">換個關鍵字或篩選條件試試。</p></div>`;
    };
    const sync = () => {
      const r = JA.parseHash();
      history.replaceState(null, '', JA.hashFor(r.name, r.params, { level: f.level, topic: f.topic, status: f.status === 'all' ? '' : f.status, q: f.q }));
    };
    JA.$('.lib-levels', main).onclick = (e) => {
      const b = e.target.closest('[data-level]');
      if (!b) return;
      f.level = b.dataset.level;
      JA.$$('.lib-lv', main).forEach((x) => x.classList.toggle('active', x === b));
      sync();
      render();
    };
    JA.$('#libStatus', main).onclick = (e) => {
      const b = e.target.closest('[data-status]');
      if (!b) return;
      f.status = b.dataset.status;
      JA.$$('#libStatus button', main).forEach((x) => x.classList.toggle('active', x === b));
      sync();
      render();
    };
    JA.$('#libTopic', main).onchange = (e) => { f.topic = e.target.value; sync(); render(); };
    JA.$('#libQ', main).addEventListener('input', JA.debounce((e) => { f.q = e.target.value; sync(); render(); }, 150));
    const gen = JA.$('#aiGen', main);
    if (gen) gen.onclick = () => JA.openAiGenerate(f.level || JA.settings().level || 'A1', f.topic);
    render();
  });

  /** 🤖 AI 產生新對話（Cloudtop 有 Jetski 時）。 */
  JA.openAiGenerate = (level, topic) => {
    const body = `<p class="muted">AI 會依你選的等級和主題，寫一段全新的日語生活對話（含振假名、中文翻譯、重點單字、文法與測驗），約需 1–2 分鐘。</p>
      <label class="field"><span>等級</span><select id="agLevel">${JA.LEVELS.map((l) => `<option value="${l.id}" ${l.id === level ? 'selected' : ''}>${l.id} · ${l.name}（JLPT ${l.jlpt}）</option>`).join('')}</select></label>
      <label class="field"><span>主題</span><select id="agTopic">${Object.keys(JA.TOPICS).map((k) => `<option value="${k}" ${k === topic ? 'selected' : ''}>${JA.topic(k).icon} ${esc(JA.topic(k).zh)}</option>`).join('')}</select></label>
      <label class="field"><span>想練的情境（選填）</span><input type="text" id="agIdea" maxlength="200" placeholder="例如：在藥妝店問商品、跟同事約下班去居酒屋"></label>
      <div id="agStatus" class="ag-status"></div>`;
    let busy = false;
    JA.modal({
      title: '🤖 用 AI 產生新對話',
      body,
      actions: [
        { label: '取消' },
        {
          label: '✨ 開始產生',
          primary: true,
          onClick: async (m) => {
            if (busy) return true;
            busy = true;
            const st = JA.$('#agStatus', m.el);
            const payload = { level: JA.$('#agLevel', m.el).value, topic: JA.$('#agTopic', m.el).value, idea: JA.$('#agIdea', m.el).value.trim() };
            JA.$$('.modal-ft button', m.el).forEach((b) => { b.disabled = true; });
            st.innerHTML = '<span class="spin"></span> AI 撰寫中…（完成會自動打開）';
            try {
              const res = await JA.aiRun('generate', payload, (s) => { st.innerHTML = `<span class="spin"></span> AI 撰寫中… ${s} 秒`; });
              const L = res.lesson;
              L.custom = true;
              JA.LESSONS.push(L);
              JA.indexLessons();
              m.close();
              JA.toast(`✨ 新對話完成：${jp.surface(L.title)}`, 'ok');
              JA.go(`#/lesson/${L.id}`);
            } catch (err) {
              st.innerHTML = `<span class="bad-txt">${esc(err.message)}</span>`;
              JA.$$('.modal-ft button', m.el).forEach((b) => { b.disabled = false; });
              busy = false;
            }
            return true;
          },
        },
      ],
    });
  };
  /** 刪除 AI 產生的課程。 */
  JA.deleteCustomLesson = async (L) => {
    if (!(await JA.confirm(`確定刪除 AI 產生的「${esc(jp.surface(L.title))}」？（學習紀錄會保留）`, '刪除'))) return;
    try { await JA.api('/api/custom_lessons/delete', { body: { id: L.id } }); } catch (e) { /* already gone */ }
    JA.LESSONS = JA.LESSONS.filter((x) => x.id !== L.id);
    JA.indexLessons();
    JA.toast('已刪除');
    JA.go('#/library');
  };
})();

</script>
  <script>/* /js/words.js */
/* 日語學院 Japanese Academy — words.js
 * 「🔤 單字學習」(#/words)：A1–C2（≈ JLPT N5–N1+）分級單字庫（漢字、讀音、羅馬拼音、詞性、中文、例句），
 * 等級 / 主題 / 狀態篩選與搜尋（漢字、假名、羅馬拼音、中文都能搜），每級學習進度；
 * 「✨ 今日新字」(#/words/today)：每天 N 個新字 → 認識 / 不熟自評 → 小測驗，全部進入單字本的 SM-2 複習。
 */
(function () {
  'use strict';
  const JA = window.JA;
  const jp = JA.jp;
  const esc = JA.esc;
  const PAGE = 60;

  const userLevel = () => JA.settings().level || 'A1';
  /** 每級：已學（在單字本）/ 總數。 */
  JA.wordProgress = (lv) => {
    const list = JA.words(lv);
    return { total: list.length, learned: list.filter((w) => JA.vocab.has(w.key)).length };
  };
  /** 今天已學的新字數。 */
  JA.newWordsToday = () => (JA.day().act || {}).newWords || 0;
  /** 下一批新字：從某級開始找還沒在單字本裡的字。 */
  JA.nextNewWords = (lv, n) => {
    const order = JA.LEVELS.map((l) => l.id);
    const out = [];
    for (let k = Math.max(0, order.indexOf(lv)); k < order.length && out.length < n; k++) {
      for (const w of JA.words(order[k])) {
        if (!JA.vocab.has(w.key)) out.push(w);
        if (out.length >= n) break;
      }
    }
    return out;
  };
  JA.saveWord = (w) => JA.vocab.save({ w: w.w, zh: w.zh, pos: w.pos, ex: w.ex, ex_zh: w.ex_zh, lvl: w.level, src: `words:${w.level}` });

  function wordRow(w) {
    const saved = JA.vocab.has(w.key);
    const v = saved ? JA.vocab.get(w.key) : null;
    const st = v ? JA.vocab.status(v) : '';
    return `<div class="wrow ${saved ? 'saved' : ''}" data-key="${esc(w.key)}">
      <div class="wr-main">
        <div class="wr-head"><b class="wr-w ja-txt">${JA.ruby(w.w)}</b><button type="button" class="icon-btn" data-say="${esc(w.s)}" title="發音">🔊</button>
          <span class="ro">${esc(w.ro)}</span>${w.pos ? `<span class="chip">${esc(w.pos)}</span>` : ''}
          ${st ? `<span class="chip ${st === 'mastered' ? 'ok' : st === 'learning' ? 'warn' : 'info'}">${st === 'mastered' ? '已熟記' : st === 'learning' ? '學習中' : '新字'}</span>` : ''}</div>
        <div class="wr-zh">${esc(w.zh)}</div>
        ${w.ex ? `<div class="wr-ex"><button type="button" class="icon-btn sm" data-say="${esc(jp.surface(w.ex))}" title="播放例句">▶</button>
          <div><div class="ja-txt">${JA.ruby(w.ex)}</div><div class="ro small">${esc(jp.romaji(w.ex))}</div><div class="muted small">${esc(w.ex_zh || '')}</div></div></div>` : ''}
      </div>
      <button type="button" class="btn xs star ${saved ? 'on' : ''}" data-star>${saved ? '★ 已收藏' : '☆ 加入單字本'}</button>
    </div>`;
  }

  JA.route('words', (main, params, query) => {
    if (params[0] === 'today') return todaySession(main, query);
    const st = JA.settings();
    const f = {
      level: JA.LEVELS.some((l) => l.id === query.level) ? query.level : userLevel(),
      topic: query.topic || '',
      st: query.st || 'all',
      q: query.q || '',
    };
    let shown = PAGE;
    const n = +st.newPerDay || 10;
    const today = JA.newWordsToday();
    main.innerHTML = `<div class="page-hd"><div><h1>🔤 單字學習</h1>
        <p class="muted">A1–C2 分級單字庫（約對應 JLPT N5–N1），每個字都有讀音、羅馬拼音、中文與生活例句。每天學幾個新字，系統會在快忘記時安排複習。</p></div>
        <div class="page-acts"><a class="btn primary" href="${JA.hashFor('words', ['today'], { level: f.level })}">✨ 今日新字 <small>${Math.min(today, n)}/${n}</small></a>
          <a class="btn" href="#/vocab">📒 單字本</a><a class="btn ghost" href="#/review">🧠 複習</a></div></div>
      <div class="lib-levels words-levels">${JA.LEVELS.map((l) => {
        const p = JA.wordProgress(l.id);
        return `<button type="button" class="lib-lv ${f.level === l.id ? 'active' : ''}" data-level="${l.id}" style="--lv:${l.color};--lv-soft:${l.soft}">
          <b>${l.id} <span class="jlpt">${l.jlpt}</span></b><span>${l.name}</span><small>${p.learned}/${p.total} 已學</small>
          <i class="lv-mini"><i style="width:${p.total ? (p.learned / p.total) * 100 : 0}%"></i></i></button>`;
      }).join('')}</div>
      <div class="card lib-toolbar">
        <input type="search" id="wQ" placeholder="🔍 搜尋漢字、假名、羅馬拼音或中文…" value="${esc(f.q)}" autocomplete="off">
        <select id="wTopic"><option value="">所有主題</option></select>
        <div class="seg" id="wSt">${[['all', '全部'], ['todo', '未學'], ['learned', '已學'], ['mastered', '已熟記']].map(([k, t]) =>
          `<button type="button" data-st="${k}" class="${f.st === k ? 'active' : ''}">${t}</button>`).join('')}</div>
        <label class="tg"><input type="checkbox" id="wFuri" ${st.showFuri !== false ? 'checked' : ''}><span>振假名</span></label>
        <label class="tg"><input type="checkbox" id="wRo" ${st.showRomaji ? 'checked' : ''}><span>羅馬拼音</span></label>
      </div>
      <div class="lib-count muted" id="wCount"></div>
      <div class="word-list ${st.showFuri === false ? 'no-furi' : ''} ${st.showRomaji ? '' : 'no-ro'}" id="wList"></div>
      <div class="more-row"><button type="button" class="btn" id="wMore" hidden>顯示更多</button></div>`;
    const list = JA.$('#wList', main);
    const topicSel = JA.$('#wTopic', main);
    const fillTopics = () => {
      const ts = [...new Set(JA.words(f.level).map((w) => w.t).filter(Boolean))].sort((a, b) => JA.topic(a).zh.localeCompare(JA.topic(b).zh, 'zh-Hant'));
      topicSel.innerHTML = `<option value="">所有主題</option>${ts.map((t) => `<option value="${t}" ${f.topic === t ? 'selected' : ''}>${JA.topic(t).icon} ${esc(JA.topic(t).zh)}</option>`).join('')}`;
    };
    const filtered = () => {
      const q = f.q.trim().toLowerCase();
      const qk = q ? jp.toHira(jp.romajiToKana(q)) : '';
      return JA.words(f.level).filter((w) => {
        if (f.topic && w.t !== f.topic) return false;
        const v = JA.vocab.get(w.key);
        if (f.st === 'todo' && v) return false;
        if (f.st === 'learned' && !v) return false;
        if (f.st === 'mastered' && !(v && JA.vocab.status(v) === 'mastered')) return false;
        return !q || w._hay.includes(q) || (qk && w._hay.includes(qk));
      });
    };
    const render = () => {
      const all = filtered();
      JA.$('#wCount', main).textContent = all.length ? `${JA.level(f.level).id}（JLPT ${JA.level(f.level).jlpt}）· 顯示 ${Math.min(shown, all.length)} / ${all.length} 個字` : '';
      list.innerHTML = all.length ? all.slice(0, shown).map(wordRow).join('')
        : JA.words(f.level).length ? '<div class="card empty"><div class="empty-ic">🔎</div><h3>沒有符合的單字</h3><p class="muted">換個關鍵字或篩選條件試試。</p></div>'
          : '<div class="card empty"><div class="empty-ic">🌱</div><h3>這個等級的單字庫準備中</h3><p class="muted">先學其他等級的單字吧。</p></div>';
      JA.$('#wMore', main).hidden = all.length <= shown;
    };
    const sync = () => {
      const r = JA.parseHash();
      history.replaceState(null, '', JA.hashFor(r.name, r.params, { level: f.level, topic: f.topic, st: f.st === 'all' ? '' : f.st, q: f.q }));
    };
    JA.$('.words-levels', main).onclick = (e) => {
      const b = e.target.closest('[data-level]');
      if (!b) return;
      f.level = b.dataset.level;
      f.topic = '';
      shown = PAGE;
      JA.$$('.words-levels .lib-lv', main).forEach((x) => x.classList.toggle('active', x === b));
      JA.$('.page-acts a.btn.primary', main).href = JA.hashFor('words', ['today'], { level: f.level });
      fillTopics();
      sync();
      render();
    };
    JA.$('#wSt', main).onclick = (e) => {
      const b = e.target.closest('[data-st]');
      if (!b) return;
      f.st = b.dataset.st;
      shown = PAGE;
      JA.$$('#wSt button', main).forEach((x) => x.classList.toggle('active', x === b));
      sync();
      render();
    };
    topicSel.onchange = (e) => { f.topic = e.target.value; shown = PAGE; sync(); render(); };
    JA.$('#wQ', main).addEventListener('input', JA.debounce((e) => { f.q = e.target.value; shown = PAGE; sync(); render(); }, 150));
    JA.$('#wFuri', main).onchange = (e) => { JA.setSetting('showFuri', e.target.checked); list.classList.toggle('no-furi', !e.target.checked); };
    JA.$('#wRo', main).onchange = (e) => { JA.setSetting('showRomaji', e.target.checked); list.classList.toggle('no-ro', !e.target.checked); };
    JA.$('#wMore', main).onclick = () => { shown += PAGE; render(); };
    list.addEventListener('click', (e) => {
      const b = e.target.closest('[data-star]');
      if (!b) return;
      const row = b.closest('.wrow');
      const w = JA.words(f.level).find((x) => x.key === row.dataset.key);
      if (!w) return;
      if (JA.vocab.has(w.key)) { JA.vocab.remove(w.key); JA.toast(`已移除：${w.s}`); } else { JA.saveWord(w); JA.toast(`⭐ 已加入單字本：${w.s}`, 'ok'); }
      row.outerHTML = wordRow(w);
    });
    fillTopics();
    render();
  });

  // ---------------------------------------------------------------------------
  // ✨ 今日新字
  // ---------------------------------------------------------------------------
  function todaySession(main, query) {
    const n = +JA.settings().newPerDay || 10;
    const lv = JA.LEVELS.some((l) => l.id === query.level) ? query.level : userLevel();
    const items = JA.nextNewWords(lv, n);
    const back = JA.hashFor('words', [], { level: lv });
    if (!items.length) {
      main.innerHTML = `<div class="card empty"><div class="empty-ic">🏆</div><h3>${esc(lv)} 以上的單字都學過了！</h3>
        <p class="muted">到「🧠 複習」把學過的字練熟，或換一個等級。</p><a class="btn primary" href="#/review">🧠 去複習</a> <a class="btn" href="${back}">回單字庫</a></div>`;
      return;
    }
    main.innerHTML = `<div class="rv-session ${JA.settings().showRomaji ? '' : 'no-ro'}"><div class="rv-top"><a class="btn sm ghost" href="${back}">← 單字庫</a>
      <b>✨ 今日新字 · ${JA.lvlBadge(lv)} ${JA.jlptChip(lv)}</b><span class="muted" id="tdCount"></span></div>
      <div class="rv-bar"><i id="tdBar"></i></div><div class="card rv-card" id="tdCard"></div></div>`;
    const card = JA.$('#tdCard', main);
    let i = 0;
    let flipped = false;
    const rated = [];
    function progress(k, total) {
      JA.$('#tdCount', main).textContent = `${Math.min(k + 1, total)} / ${total}`;
      JA.$('#tdBar', main).style.width = `${(k / total) * 100}%`;
    }
    function renderCard() {
      if (i >= items.length) return quizIntro();
      progress(i, items.length);
      const w = items[i];
      card.innerHTML = `<div class="flash ${flipped ? 'flipped' : ''}">
        <div class="fl-front"><div class="fl-w ja-txt">${JA.ruby(w.w)}</div><div class="ro">${esc(w.ro)}</div>
          <div class="fl-acts"><button type="button" class="icon-btn lg" data-say="${esc(w.s)}">🔊</button></div>
          ${!flipped ? '<button type="button" class="btn primary big" id="tdFlip">顯示意思 <small>（空白鍵）</small></button>' : ''}</div>
        ${flipped ? `<div class="fl-back"><div class="fl-zh">${esc(w.zh)}</div>${w.pos ? `<span class="chip">${esc(w.pos)}</span>` : ''}
          ${w.ex ? `<div class="vr-ex"><button type="button" class="icon-btn sm" data-say="${esc(jp.surface(w.ex))}">▶</button>
            <div><div class="ja-txt">${JA.ruby(w.ex)}</div><div class="ro small">${esc(jp.romaji(w.ex))}</div><div class="muted small">${esc(w.ex_zh || '')}</div></div></div>` : ''}
          <div class="fl-grades two"><button type="button" class="grade warn" data-rate="0"><b>🤔 不熟</b><small>10 分鐘後再複習 · 1</small></button>
            <button type="button" class="grade ok" data-rate="1"><b>😊 認識</b><small>明天複習 · 2</small></button></div></div>` : ''}
      </div>`;
      if (!flipped) JA.tts.speak(w.w);
    }
    const flip = () => { if (!flipped && i < items.length) { flipped = true; renderCard(); if (items[i].ex) setTimeout(() => JA.tts.speak(items[i].ex), 600); } };
    const rate = (know) => {
      const w = items[i];
      JA.saveWord(w);
      JA.vocab.grade(w.key, know ? 4 : 1);
      rated.push({ w, know });
      JA.addXP(1, 'newWords');
      i++;
      flipped = false;
      renderCard();
    };
    // 小測驗：看單字選中文
    let qi = 0;
    const results = [];
    let answered = false;
    function quizIntro() {
      qi = 0;
      renderQuiz();
    }
    function renderQuiz() {
      if (qi >= items.length) return summary();
      progress(qi, items.length);
      answered = false;
      const w = items[qi];
      const pool = JA.words(w.level).filter((x) => x.key !== w.key && x.zh !== w.zh);
      const opts = JA.shuffle([w.zh, ...JA.shuffle([...items.filter((x) => x !== w).map((x) => x.zh), ...JA.shuffle(pool).slice(0, 6).map((x) => x.zh)])
        .filter((z, k, a) => z !== w.zh && a.indexOf(z) === k).slice(0, 3)]);
      w._opts = opts;
      w._ans = opts.indexOf(w.zh);
      card.innerHTML = `<div class="muted small">🎯 小測驗：這個字是什麼意思？</div>
        <div class="rv-prompt"><div class="fl-w ja-txt">${JA.ruby(w.w)}</div><button type="button" class="icon-btn" data-say="${esc(w.s)}">🔊</button></div>
        <div class="opts">${opts.map((o, k) => `<button type="button" class="opt" data-k="${k}"><span class="opt-k">${k + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <div class="q-exp" id="tdExp"></div><div class="q-nav"><button type="button" class="btn primary" id="tdNext" hidden>${qi === items.length - 1 ? '看結果' : '下一題 →'}</button></div>`;
    }
    function pick(k) {
      if (answered) return;
      answered = true;
      const w = items[qi];
      const ok = k === w._ans;
      results.push({ w, ok });
      if (ok) JA.addXP(1, 'review');
      else JA.vocab.grade(w.key, 1);
      JA.$$('.opt', card).forEach((x) => {
        x.disabled = true;
        if (+x.dataset.k === w._ans) x.classList.add('correct');
        else if (+x.dataset.k === k) x.classList.add('wrong');
      });
      JA.$('#tdExp', card).innerHTML = `<div class="${ok ? 'ok-txt' : 'bad-txt'}">${ok ? '✅ 答對了！' : '❌ 再記一下'}</div>`;
      JA.tts.speak(w.w);
      const nx = JA.$('#tdNext', card);
      nx.hidden = false;
      nx.focus({ preventScroll: true });
    }
    function summary() {
      JA.$('#tdBar', main).style.width = '100%';
      const ok = results.filter((r) => r.ok).length;
      const pct = results.length ? Math.round((ok / results.length) * 100) : 0;
      const p = JA.wordProgress(lv);
      card.innerHTML = `<div class="quiz-done"><div class="score-ring big ${pct >= 80 ? 'ok' : pct >= 60 ? 'warn' : 'bad'}" style="--p:${pct}"><b>${pct}</b><small>分</small></div>
        <h3>🎉 今天學了 ${items.length} 個新字！</h3>
        <p class="muted">小測驗答對 ${ok} / ${results.length} · ${esc(lv)} 進度 ${p.learned} / ${p.total} · 這些字已放進單字本，明天會提醒你複習。</p>
        <div class="td-list">${items.map((w) => `<button type="button" class="chip" data-say="${esc(w.s)}"><span class="ja-txt">${JA.ruby(w.w)}</span> ${esc(w.zh)}</button>`).join('')}</div>
        <div class="q-nav"><a class="btn primary" href="#/review">🧠 去複習</a><button type="button" class="btn" id="tdMore">✨ 再學 ${n} 個</button><a class="btn ghost" href="${back}">回單字庫</a></div></div>`;
      JA.$('#tdMore', card).onclick = () => JA.renderRoute();
    }
    card.addEventListener('click', (e) => {
      if (e.target.closest('#tdFlip')) { flip(); return; }
      const r = e.target.closest('[data-rate]');
      if (r) { rate(r.dataset.rate === '1'); return; }
      if (e.target.closest('#tdNext')) { JA.tts.stop(); qi++; renderQuiz(); return; }
      const o = e.target.closest('.opt');
      if (o) pick(+o.dataset.k);
    });
    const onKey = (e) => {
      if (e.target.closest('input,textarea,select')) return;
      if (i < items.length) {
        if (e.code === 'Space') { e.preventDefault(); flip(); } else if (flipped && (e.key === '1' || e.key === '2')) rate(e.key === '2');
      } else if (!answered && /^[1-4]$/.test(e.key) && JA.$('.opt', card)) pick(+e.key - 1);
      else if (answered && e.key === 'Enter') { e.preventDefault(); JA.tts.stop(); qi++; renderQuiz(); }
    };
    document.addEventListener('keydown', onKey);
    JA.onCleanup(() => document.removeEventListener('keydown', onKey));
    renderCard();
  }
})();

</script>
  <script>/* /js/vocab.js */
/* 日語學院 Japanese Academy — vocab.js
 * 📒 單字本 (#/vocab)：收藏的單字（含語境例句、出處、SM-2 複習排程），搜尋、篩選、排序、編輯、新增、匯出 CSV。
 */
(function () {
  'use strict';
  const JA = window.JA;
