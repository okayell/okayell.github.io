/* ==========================================================================
 * 💡 冷知識學院 (Fun Facts Academy) — Stylesheet
 * Indigo（通識學區）＋ Bulb Yellow light palette · Zero horizontal overflow · 320px – 1600px
 * ========================================================================== */

:root {
  --bg: #f7f7fc;
  --surface: #ffffff;
  --surface-alt: #f1f5f9;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-sub: #334155;
  --muted: #64748b;
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-soft: #eef2ff;
  --primary-border: #c7d2fe;
  --accent: #f59e0b;
  --accent-soft: #fef3c7;
  --good: #15803d;
  --good-soft: #dcfce7;
  --bad: #dc2626;
  --bad-soft: #fee2e2;
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
  --shadow: 0 6px 20px rgba(15, 23, 42, 0.07);
  --shadow-lg: 0 16px 40px rgba(15, 23, 42, 0.16);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --cc: #4f46e5;
  --cs: #eef2ff;
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  max-width: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.55; }
kbd {
  display: inline-block;
  min-width: 18px;
  padding: 0 5px;
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  border-radius: 5px;
  background: #fff;
  color: var(--muted);
  font: 600 11px/16px ui-monospace, SFMono-Regular, Menlo, monospace;
  text-align: center;
}
h1, h2, h3 { line-height: 1.3; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.center { text-align: center; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.end { justify-content: flex-end; }
.center-row { justify-content: center; }
[hidden] { display: none !important; }

/* -------------------- Buttons & Inputs -------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 36px;
  padding: 6px 14px;
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  background: #fff;
  color: var(--text);
  font-weight: 700;
  font-size: 14px;
  text-decoration: none !important;
  white-space: nowrap;
  transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.15s;
}
.btn:hover:not(:disabled) { background: var(--surface-alt); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn.danger { background: #fff; border-color: #fca5a5; color: var(--bad); }
.btn.danger:hover:not(:disabled) { background: var(--bad-soft); }
.modal-ft .btn.primary.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { min-height: 30px; padding: 3px 10px; font-size: 13px; border-radius: 8px; }
.btn.big { min-height: 44px; padding: 8px 20px; font-size: 15px; border-radius: 12px; }
.btn.more { margin: 18px auto 4px; }
.btn kbd { margin-left: 4px; }
.btn.primary kbd { background: rgba(255, 255, 255, 0.18); color: #fff; border-color: rgba(255, 255, 255, 0.4); }
.link-btn { border: 0; background: none; color: var(--primary); font-weight: 700; padding: 0 4px; }
.icon-btn {
  width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 8px; background: #fff;
  display: inline-flex; align-items: center; justify-content: center; font-size: 14px; color: var(--muted);
}
.inp {
  width: 100%;
  min-height: 38px;
  padding: 7px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  background: #fff;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.inp:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
.inp.sel { width: auto; min-width: 128px; padding-right: 8px; }
textarea.inp { resize: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chip-btn {
  display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 3px 11px;
  border: 1px solid var(--border); border-radius: 999px; background: #fff; color: var(--text-sub);
  font-size: 13px; font-weight: 700; white-space: nowrap; transition: all 0.15s;
}
.chip-btn:hover { border-color: var(--cc, var(--primary)); color: var(--cc, var(--primary)); }
.chip-btn.on { background: var(--cs, var(--primary-soft)); border-color: var(--cc, var(--primary)); color: var(--cc, var(--primary)); }
.chip { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.chip.info { background: #dbeafe; color: #1e40af; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 10px; overflow: hidden; background: #fff; flex: none; }
.seg button { border: 0; background: none; padding: 5px 11px; font-size: 13px; font-weight: 700; color: var(--text-sub); min-height: 34px; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--primary); color: #fff; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text-sub); white-space: nowrap; }
.chk input { width: 16px; height: 16px; accent-color: var(--primary); }
.bar { display: block; height: 6px; border-radius: 99px; background: #e2e8f0; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--cc, var(--primary)); transition: width 0.3s; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: 18px;
}
.card.empty { text-align: center; padding: 34px 18px; color: var(--text-sub); grid-column: 1 / -1; }
.empty-ic { font-size: 38px; line-height: 1; margin-bottom: 8px; }

/* -------------------- Header -------------------- */
.site-header {
  position: sticky; top: 0; z-index: 80;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1440px; margin: 0 auto; padding: 8px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0;
}
.brand-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; min-width: 0; }
.brand-link {
  display: inline-flex; align-items: center; gap: 7px; font-weight: 800; font-size: 16px; color: var(--text);
  text-decoration: none !important; white-space: nowrap; min-width: 0;
}
.brand-logo {
  display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, #4f46e5, #7c3aed); font-size: 15px; flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(79, 70, 229, 0.35);
}
.brand-sub {
  font-size: 11px; font-weight: 700; color: #4338ca; padding: 1px 8px; border-radius: 999px;
  background: var(--primary-soft); border: 1px solid var(--primary-border);
}
.ver-badge {
  display: inline-flex; align-items: center; gap: 4px; height: 23px; padding: 0 8px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-alt); color: var(--text-sub);
  font-size: 11px; font-weight: 700; white-space: nowrap; flex-shrink: 0;
}
.ver-badge:hover { background: #e2e8f0; }
.ver-badge .ver-dot { width: 6px; height: 6px; border-radius: 50%; background: #f59e0b; display: inline-block; }
.main-nav { display: flex; align-items: center; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.main-nav::-webkit-scrollbar { display: none; }
.nav-link {
  display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 9px;
  color: var(--text-sub); font-weight: 700; font-size: 14px; white-space: nowrap; text-decoration: none !important;
  transition: background 0.15s, color 0.15s;
}
.nav-link:hover { background: var(--surface-alt); color: var(--text); }
.nav-link.active { background: var(--primary-soft); color: var(--primary); }
.nav-ic { font-size: 15px; }
.header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.hdr-chip {
  display: inline-flex; align-items: center; height: 30px; padding: 0 10px; border-radius: 999px;
  font-size: 12.5px; font-weight: 800; white-space: nowrap; text-decoration: none !important;
  border: 1px solid var(--border); background: #fff; color: var(--text-sub);
}
.hdr-chip.streak { background: #fff7ed; border-color: #fed7aa; color: #c2410c; }
.hdr-chip.prog { background: var(--primary-soft); border-color: var(--primary-border); color: var(--primary); }
.hdr-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 9px;
  border: 1px solid var(--border-strong); background: #fff; color: var(--text-sub); font-size: 13px; font-weight: 700;
}
.hdr-btn:hover { background: var(--surface-alt); }

/* -------------------- Layout -------------------- */
.app-main { max-width: 1320px; margin: 0 auto; padding: 22px 18px 40px; min-height: 70vh; }
.page-hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.page-hd h1 { margin: 0 0 4px; font-size: 26px; }
.page-hd p { margin: 0; }
.sec { margin-top: 26px; }
.sec.card { padding: 18px; }
.sec-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.sec-hd h2 { margin: 0; font-size: 19px; }
.sec-link { font-weight: 700; font-size: 14px; }

/* -------------------- Hero -------------------- */
.hero {
  display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 22px; align-items: stretch;
  padding: 24px; border-radius: 22px; border: 1px solid var(--primary-border);
  background:
    radial-gradient(circle at 8% 12%, rgba(253, 224, 71, 0.35), transparent 32%),
    radial-gradient(circle at 92% 90%, rgba(167, 139, 250, 0.28), transparent 38%),
    linear-gradient(135deg, #eef2ff 0%, #ffffff 55%, #faf5ff 100%);
}
.hero-text { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.hero-kicker { font-size: 12.5px; font-weight: 800; color: var(--primary); letter-spacing: 0.04em; }
.hero h1 { margin: 6px 0 10px; font-size: 38px; letter-spacing: 0.02em; }
.hero-bulb { display: inline-block; margin-right: 6px; animation: bulb 3.2s ease-in-out infinite; }
@keyframes bulb { 0%, 100% { filter: drop-shadow(0 0 0 rgba(250, 204, 21, 0)); } 50% { filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.9)); } }
.hero-lead { margin: 0 0 16px; color: var(--text-sub); font-size: 15.5px; }
.hero-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.hs {
  display: flex; flex-direction: column; gap: 2px; padding: 10px 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.85);
  border: 1px solid var(--border); text-decoration: none !important; color: var(--text); min-width: 0;
}
.hs b { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hs b small { font-size: 12px; color: var(--muted); }
.hs span { font-size: 12px; color: var(--muted); font-weight: 600; }
.hs:hover { border-color: var(--primary-border); }
.hero-today { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.today-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.today-label { font-weight: 800; color: var(--primary); font-size: 14px; }

/* -------------------- Quick actions -------------------- */
.quick-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.quick {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #fff;
  border: 1px solid var(--border); box-shadow: var(--shadow-sm); color: var(--text); text-decoration: none !important;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; min-width: 0;
}
.quick:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--primary-border); }
.qi { font-size: 28px; line-height: 1; flex: none; }
.quick b { display: block; font-size: 15px; }
.quick small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.45; }

/* -------------------- Category grid -------------------- */
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 12px; }
.cat-card {
  display: flex; gap: 12px; padding: 14px; border-radius: 14px; background: #fff; border: 1px solid var(--border);
  color: var(--text); text-decoration: none !important; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; min-width: 0;
}
.cat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--cc); }
.cc-ic {
  flex: none; width: 48px; height: 48px; border-radius: 13px; background: var(--cs); display: flex; align-items: center;
  justify-content: center; font-size: 25px; border: 1px solid color-mix(in srgb, var(--cc) 22%, transparent);
}
.cc-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.cc-name { font-weight: 800; font-size: 15.5px; color: var(--cc); }
.cc-name small { color: var(--muted); font-weight: 600; font-size: 11.5px; margin-left: 4px; }
.cc-desc { font-size: 12.5px; color: var(--text-sub); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cc-prog { display: block; height: 5px; border-radius: 99px; background: #edf2f7; overflow: hidden; margin-top: 4px; }
.cc-prog i { display: block; height: 100%; background: var(--cc); border-radius: 99px; }
.cc-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 600; }

/* -------------------- Fact card -------------------- */
.fact-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; align-items: start; }
.fact-card {
  position: relative; display: flex; flex-direction: column; gap: 8px; min-width: 0;
  padding: 14px 16px 12px; border-radius: 14px; background: #fff; border: 1px solid var(--border);
  border-top: 4px solid var(--cc); box-shadow: var(--shadow-sm); transition: box-shadow 0.15s;
}
.fact-card:hover { box-shadow: var(--shadow); }
.fact-card.big { padding: 18px 20px 14px; border-radius: 16px; }
.fc-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding-right: 34px; min-height: 26px; }
.cat-badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; background: var(--cs);
  color: var(--cc); font-size: 12px; font-weight: 800; white-space: nowrap; text-decoration: none !important;
  border: 1px solid color-mix(in srgb, var(--cc) 25%, transparent);
}
a.cat-badge:hover { filter: brightness(0.96); }
.cold-badge { display: inline-flex; align-items: center; gap: 2px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 800; white-space: nowrap; }
.cold-badge.cold-1 { background: #f0f9ff; color: #0369a1; }
.cold-badge.cold-2 { background: #e0f2fe; color: #075985; }
.cold-badge.cold-3 { background: #dbeafe; color: #1e3a8a; box-shadow: inset 0 0 0 1px #93c5fd; }
.fc-num { font-size: 11.5px; color: var(--muted); font-weight: 700; font-family: ui-monospace, Menlo, monospace; }
.fc-seen { font-size: 11.5px; font-weight: 800; color: var(--good); }
.fc-fav {
  position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid transparent;
  background: transparent; color: #94a3b8; font-size: 20px; line-height: 1; display: flex; align-items: center; justify-content: center;
}
.fc-fav:hover { background: var(--accent-soft); color: var(--accent); }
.fc-fav.on { color: #f59e0b; }
.fc-title { margin: 0; font-size: 17px; line-height: 1.4; }
.fc-myth { margin: 0; display: flex; align-items: baseline; gap: 6px; font-size: 13.5px; font-weight: 700; color: #7f1d1d; }
.fc-myth span { flex: none; padding: 0 7px; border-radius: 6px; background: #fee2e2; color: #b91c1c; font-size: 11.5px; font-weight: 800; }
.fact-card.big .fc-title { font-size: 21px; }
.fc-title a { color: var(--text); }
.fc-title a:hover { color: var(--cc); text-decoration: none; }
.fc-fact { margin: 0; color: var(--text-sub); font-size: 15px; }
.fact-card.big .fc-fact { font-size: 16px; }
.fc-why { border-radius: 10px; background: #f8fafc; border: 1px solid var(--border); }
.fc-why summary {
  list-style: none; cursor: pointer; padding: 7px 12px; font-size: 13px; font-weight: 800; color: var(--cc);
  display: flex; align-items: center; gap: 6px; user-select: none;
}
.fc-why summary::-webkit-details-marker { display: none; }
.fc-why summary::after { content: '▾'; margin-left: auto; transition: transform 0.2s; color: var(--muted); }
.fc-why[open] summary::after { transform: rotate(180deg); }
.fc-why p { margin: 0; padding: 0 12px 10px; font-size: 14px; color: var(--text-sub); line-height: 1.7; }
.fc-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.fc-tags { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.tag { font-size: 12px; font-weight: 700; color: var(--muted); padding: 0 6px; border-radius: 6px; background: var(--surface-alt); }
.tag:hover { color: var(--cc); text-decoration: none; }
.fc-src { font-size: 11.5px; color: var(--muted); }
.fc-actions { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 8px; border-top: 1px dashed var(--border); }
.react-btn, .ghost-btn {
  display: inline-flex; align-items: center; gap: 4px; min-height: 30px; padding: 2px 11px; border-radius: 999px;
  border: 1px solid var(--border); background: #fff; color: var(--text-sub); font-size: 12.5px; font-weight: 700;
  transition: all 0.15s;
}
.react-btn:hover, .ghost-btn:hover { border-color: var(--border-strong); background: var(--surface-alt); }
.react-btn.learned.on { background: var(--accent-soft); border-color: #fcd34d; color: #92400e; }
.react-btn.knew.on { background: var(--primary-soft); border-color: var(--primary-border); color: var(--primary); }
.ghost-btn { margin-left: auto; }

/* -------------------- Browse -------------------- */
.browse { display: grid; grid-template-columns: 228px minmax(0, 1fr); gap: 20px; align-items: start; }
.cat-side {
  position: sticky; top: 66px; display: flex; flex-direction: column; gap: 2px; padding: 8px; border-radius: 14px;
  background: #fff; border: 1px solid var(--border); max-height: calc(100vh - 86px); overflow-y: auto;
}
.cs-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 9px;
  color: var(--text-sub); font-size: 14px; font-weight: 700; text-decoration: none !important; white-space: nowrap;
}
.cs-item b { font-size: 12px; color: var(--muted); font-weight: 700; }
.cs-item b em { font-style: normal; color: var(--good); }
.cs-item:hover { background: var(--surface-alt); }
.cs-item.on { background: var(--cs, var(--primary-soft)); color: var(--cc, var(--primary)); box-shadow: inset 3px 0 0 var(--cc, var(--primary)); }
.browse-main { min-width: 0; }
.browse-hd {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 18px;
  border-radius: 16px; background: linear-gradient(135deg, var(--cs) 0%, #fff 75%); border: 1px solid color-mix(in srgb, var(--cc) 25%, var(--border));
}
.bh-ic { font-size: 40px; line-height: 1; }
.bh-text h1 { margin: 0; font-size: 24px; color: var(--cc); }
.bh-text h1 small { font-size: 13px; color: var(--muted); font-weight: 600; margin-left: 6px; }
.bh-text p { margin: 4px 0 0; color: var(--text-sub); font-size: 14px; }
.bh-prog { display: flex; flex-direction: column; gap: 6px; min-width: 170px; font-size: 13px; color: var(--text-sub); }
.bh-acts { display: flex; gap: 6px; flex-wrap: wrap; }
.detail-tools { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-size: 13.5px; font-weight: 700; }
.filter-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 14px 0 10px; }
.filter-bar .inp[type="search"] { flex: 1 1 240px; width: auto; }
.tag-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; }
.tag-l { font-size: 12.5px; font-weight: 800; color: var(--muted); margin-right: 2px; }
.tag-btn {
  border: 1px solid var(--border); background: #fff; color: var(--text-sub); border-radius: 999px; padding: 2px 10px;
  font-size: 12.5px; font-weight: 700; min-height: 28px;
}
.tag-btn small { color: var(--muted); font-weight: 600; }
.tag-btn:hover { border-color: var(--primary-border); color: var(--primary); }
.tag-btn.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.tag-btn.on small { color: #e0e7ff; }
.result-meta { font-size: 13.5px; color: var(--text-sub); margin: 4px 0 12px; }

/* -------------------- Fact detail -------------------- */
.crumb { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; font-weight: 700; margin-bottom: 12px; }
.crumb > span { color: var(--muted); }
.detail-wrap { max-width: 880px; margin: 0 auto; }
.detail-q {
  margin-bottom: 10px; padding: 12px 16px; border-radius: 12px; background: var(--cs); color: var(--cc);
  font-weight: 800; font-size: 17px; border: 1px dashed color-mix(in srgb, var(--cc) 45%, transparent);
}
.detail-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.dn {
  display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: 12px; background: #fff;
  border: 1px solid var(--border); color: var(--text); text-decoration: none !important; min-width: 0;
}
.dn small { color: var(--muted); font-weight: 700; }
.dn span { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dn.next { text-align: right; }
.dn:hover { border-color: var(--cc); }

/* -------------------- Gacha (轉蛋) -------------------- */
.gacha-filters { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; }
.gf-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.gf-l { font-size: 13px; font-weight: 800; color: var(--text-sub); flex: none; }
.gacha-stage { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 22px; align-items: start; margin-top: 18px; }
.machine { position: relative; width: 200px; height: 270px; margin: 0 auto; cursor: pointer; }
.machine .dome {
  position: absolute; left: 10px; top: 0; width: 180px; height: 180px; border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.95), rgba(224, 231, 255, 0.55) 45%, rgba(199, 210, 254, 0.75));
  border: 4px solid #a5b4fc; overflow: hidden; box-shadow: inset 0 -12px 24px rgba(79, 70, 229, 0.18);
}
.machine .ball { position: absolute; width: 38px; height: 38px; border-radius: 50%; box-shadow: inset -5px -6px 0 rgba(0, 0, 0, 0.12), inset 4px 4px 0 rgba(255, 255, 255, 0.35); }
.machine .ball::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: rgba(255, 255, 255, 0.55); }
.ball.b1 { left: 18px; top: 108px; background: #f97316; }
.ball.b2 { left: 52px; top: 122px; background: #22c55e; }
.ball.b3 { left: 90px; top: 118px; background: #e11d48; }
.ball.b4 { left: 124px; top: 104px; background: #6366f1; }
.ball.b5 { left: 36px; top: 76px; background: #eab308; }
.ball.b6 { left: 74px; top: 84px; background: #06b6d4; }
.ball.b7 { left: 110px; top: 70px; background: #a855f7; }
.ball.b8 { left: 58px; top: 44px; background: #84cc16; }
.ball.b9 { left: 96px; top: 34px; background: #ec4899; }
.machine .base {
  position: absolute; left: 22px; top: 168px; width: 156px; height: 96px; border-radius: 18px 18px 14px 14px;
  background: linear-gradient(180deg, #6366f1, #4338ca); box-shadow: 0 8px 18px rgba(67, 56, 202, 0.3);
}
.machine .knob {
  position: absolute; left: 22px; top: 24px; width: 44px; height: 44px; border-radius: 50%; background: #fde047;
  border: 4px solid #facc15; box-shadow: 0 2px 0 #ca8a04;
}
.machine .knob::before { content: ''; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 8px; margin-left: -4px; border-radius: 4px; background: #ca8a04; }
.machine .slot { position: absolute; right: 18px; top: 34px; width: 52px; height: 36px; border-radius: 10px; background: #1e1b4b; box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.45); }
.machine .drop-cap { position: absolute; right: 42px; top: 206px; width: 26px; height: 26px; border-radius: 50%; background: #4f46e5; opacity: 0; box-shadow: inset -4px -4px 0 rgba(0, 0, 0, 0.15); }
.machine:hover .knob { filter: brightness(1.05); }
.machine.spin .knob { animation: knobSpin 0.5s ease-in-out; }
.machine.spin .ball { animation: jiggle 0.5s ease-in-out; }
.machine.spin .ball:nth-child(even) { animation-direction: reverse; }
.machine.spin .drop-cap { animation: capDrop 0.52s ease-out; }
@keyframes knobSpin { to { transform: rotate(360deg); } }
@keyframes jiggle { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(5px, -9px); } 50% { transform: translate(-6px, -4px); } 75% { transform: translate(4px, -7px); } }
@keyframes capDrop { 0% { opacity: 0; transform: translateY(-28px) scale(0.6); } 40% { opacity: 1; } 75% { transform: translateY(18px) scale(1); } 100% { opacity: 0; transform: translateY(26px) scale(1); } }
.gacha-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.q-card {
  padding: 22px 22px 18px; border-top: 5px solid var(--cc); background: linear-gradient(180deg, var(--cs) 0%, #fff 70%);
  cursor: pointer; min-height: 168px; display: flex; flex-direction: column; gap: 8px;
}
.q-card.pop { animation: pop 0.35s ease-out; }
@keyframes pop { 0% { transform: scale(0.96); opacity: 0.4; } 100% { transform: scale(1); opacity: 1; } }
.q-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.q-top .muted { margin-left: auto; }
.q-text { margin: 6px 0 0; font-size: 24px; font-weight: 800; line-height: 1.45; color: var(--text); }
.q-hint { margin: 0; }
.g-answer { animation: slideIn 0.3s ease-out; }
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.gacha-ctrl { display: flex; gap: 10px; flex-wrap: wrap; }
.gacha-session { min-height: 20px; }

/* -------------------- Quiz -------------------- */
.quiz-setup { display: flex; flex-direction: column; gap: 14px; }
.qs-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.qs-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 4px; }
.quiz-records { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.rec { display: flex; flex-direction: column; gap: 2px; padding: 14px; text-align: center; }
.rec b { font-size: 24px; color: var(--primary); }
.rec span { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.quiz-play { max-width: 860px; margin: 0 auto; padding: 18px 20px; border-top: 5px solid var(--cc); }
.qp-top { display: flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 700; color: var(--text-sub); flex-wrap: wrap; }
.qp-mode { padding: 1px 9px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 12px; }
.qp-bar { flex: 1 1 120px; height: 8px; border-radius: 99px; background: #e2e8f0; overflow: hidden; min-width: 80px; }
.qp-bar i { display: block; height: 100%; background: var(--cc); border-radius: 99px; transition: width 0.3s; }
.qp-streak.hot { color: #ea580c; animation: pop 0.3s; }
.qp-q { margin: 18px 0 14px; padding: 18px; border-radius: 14px; background: var(--cs); border: 1px solid color-mix(in srgb, var(--cc) 22%, transparent); }
.qp-stmt { margin: 12px 0 6px; font-size: 22px; font-weight: 800; line-height: 1.5; }
.qp-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tf-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 62px; border-radius: 14px;
  border: 2px solid var(--border-strong); background: #fff; font-size: 19px; font-weight: 800; color: var(--text);
  transition: transform 0.12s, background 0.15s, border-color 0.15s;
}
.tf-btn span { font-size: 22px; }
.tf-btn kbd { margin-left: 4px; }
.tf-btn.yes:hover:not(:disabled) { border-color: #22c55e; background: #f0fdf4; transform: translateY(-2px); }
.tf-btn.no:hover:not(:disabled) { border-color: #ef4444; background: #fef2f2; transform: translateY(-2px); }
.tf-btn.correct { border-color: #16a34a; background: #dcfce7; color: #14532d; opacity: 1; }
.tf-btn.wrong { border-color: #dc2626; background: #fee2e2; color: #7f1d1d; opacity: 1; }
.qp-fb { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; animation: slideIn 0.25s ease-out; }
.fb-head { padding: 10px 14px; border-radius: 12px; font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fb-head.ok { background: var(--good-soft); color: #14532d; }
.fb-head.bad { background: var(--bad-soft); color: #7f1d1d; }
.combo { margin-left: auto; color: #ea580c; }
.quiz-result { max-width: 760px; margin: 0 auto; text-align: center; padding: 28px 20px; }
.qr-ic { font-size: 58px; line-height: 1; }
.quiz-result h1 { margin: 8px 0 2px; font-size: 40px; color: var(--primary); }
.qr-name { margin: 0; font-weight: 800; font-size: 18px; }
.qr-stats { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 12px 0 18px; font-size: 14px; color: var(--text-sub); }
.review-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.review-list li { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: #fff; }
.review-list li.bad { background: #fffafa; border-color: #fecaca; }
.review-list p { margin: 0 0 2px; font-weight: 600; }
.rv-ans { margin-left: 6px; padding: 0 8px; border-radius: 99px; background: var(--surface-alt); font-size: 12px; }

/* -------------------- Me -------------------- */
.me-hero { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 18px; align-items: center; }
.me-rank { display: flex; align-items: center; gap: 14px; min-width: 0; }
.me-rank-ic { font-size: 54px; line-height: 1; }
.me-rank > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.me-rank small { color: var(--muted); font-weight: 700; }
.me-rank b { font-size: 24px; color: var(--primary); }
.me-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.me-stats > div { display: flex; flex-direction: column; padding: 10px; border-radius: 12px; background: var(--surface-alt); text-align: center; }
.me-stats b { font-size: 19px; }
.me-stats b small { font-size: 12px; color: var(--muted); }
.me-stats span { font-size: 12px; color: var(--muted); font-weight: 600; }
.heat { display: grid; grid-template-columns: repeat(28, minmax(0, 24px)); gap: 5px; }
.hm { display: block; aspect-ratio: 1; border-radius: 4px; background: #eef2f7; }
.hm.lv1 { background: #c7d2fe; }
.hm.lv2 { background: #818cf8; }
.hm.lv3 { background: #6366f1; }
.hm.lv4 { background: #4338ca; }
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.badge-card {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 10px; border-radius: 14px; background: #fff;
  border: 1px solid var(--border); color: var(--text); text-decoration: none !important; text-align: center;
}
.badge-card.lv0 { filter: grayscale(0.85); opacity: 0.75; }
.badge-card:hover { border-color: var(--cc); filter: none; opacity: 1; }
.badge-card .bar { width: 100%; }
.bc-ic { font-size: 28px; line-height: 1; }
.badge-card b { font-size: 14px; color: var(--cc); }
.bc-medal { font-size: 12.5px; font-weight: 700; color: var(--text-sub); }
.badge-card small { color: var(--muted); font-size: 11.5px; }
.mini-list { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 6px 14px; }
.mini-list a { display: flex; gap: 8px; font-weight: 600; color: var(--text-sub); }
.danger-zone { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 14px; border: 1px dashed #fca5a5; background: #fffafa; flex-wrap: wrap; }
.danger-zone p { margin: 2px 0 0; }

/* -------------------- Feedback -------------------- */
.fb-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); gap: 16px; align-items: start; }
.fb-form { display: flex; flex-direction: column; gap: 8px; }
.fb-l { font-weight: 800; font-size: 14px; margin-top: 6px; }
.fb-banner { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
.fb-banner.ok { background: var(--good-soft); color: #14532d; }
.fb-banner.warn { background: var(--accent-soft); color: #78350f; }
.fb-hist h3 { margin: 0 0 10px; font-size: 16px; }
.fb-items { display: flex; flex-direction: column; gap: 10px; max-height: 560px; overflow-y: auto; }
.fb-item { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: #f8fafc; }

/* -------------------- Search modal -------------------- */
.modal-bd {
  position: fixed; inset: 0; z-index: 110; display: none; align-items: flex-start; justify-content: center;
  padding: 8vh 14px 14px; background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(3px);
}
.modal-bd.open { display: flex; }
.modal-card { width: min(720px, 100%); max-height: 80vh; display: flex; flex-direction: column; background: #fff; border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; }
.search-modal-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.search-ic { font-size: 18px; }
.search-modal-top input { flex: 1; min-width: 0; border: 0; outline: none; font-size: 16px; padding: 6px 0; background: transparent; }
.modal-close { border: 1px solid var(--border); background: #fff; border-radius: 8px; width: 32px; height: 32px; color: var(--muted); }
.search-modal-body { overflow-y: auto; padding: 8px 10px 14px; }
.s-res-sec { margin-top: 8px; }
.s-res-title { font-size: 12.5px; font-weight: 800; color: var(--muted); padding: 4px 8px; }
.s-cat-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 6px; }
.s-cat { padding: 3px 10px; border-radius: 999px; background: var(--cs); color: var(--cc); font-size: 12.5px; font-weight: 800; text-decoration: none !important; }
.s-res-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px; border-radius: 10px; color: var(--text); text-decoration: none !important; }
.s-res-item:hover { background: var(--surface-alt); }
.s-res-badge { flex: none; padding: 1px 8px; border-radius: 999px; background: var(--cs); color: var(--cc); font-size: 11.5px; font-weight: 800; white-space: nowrap; margin-top: 2px; }
.s-res-main { display: flex; flex-direction: column; min-width: 0; }
.s-res-main strong { font-size: 14px; }
.s-res-main span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* -------------------- Generic modal & toast -------------------- */
.modal-wrap { position: fixed; inset: 0; z-index: 120; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(15, 23, 42, 0.45); opacity: 0; transition: opacity 0.18s; }
.modal-wrap.show { opacity: 1; }
.modal { width: min(480px, 100%); background: #fff; border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; }
.modal.wide { width: min(760px, 100%); }
.modal-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.modal-hd h3 { margin: 0; font-size: 17px; }
.modal-body { padding: 16px; }
.modal-ft { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: #f8fafc; }
.confirm-msg { margin: 0; }
#toastBox { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 130; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { padding: 9px 16px; border-radius: 999px; background: #1e1b4b; color: #fff; font-size: 14px; font-weight: 700; box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(10px); transition: all 0.25s; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: none; }
.toast.ok { background: #312e81; }
.toast.bad { background: #b91c1c; }

/* -------------------- Footer & mobile nav -------------------- */
.site-footer { border-top: 1px solid var(--border); background: #fff; }
.footer-inner { max-width: 1320px; margin: 0 auto; padding: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--muted); }
.footer-inner p { margin: 0; }
.footer-links { display: flex; flex-wrap: wrap; gap: 14px; font-weight: 700; }
.mobile-nav { display: none; }

/* -------------------- Responsive -------------------- */
@media (max-width: 1360px) {
  .brand-sub { display: none; }
  .nav-link { padding: 6px 8px; }
  .hdr-btn .btn-txt, .hdr-btn kbd { display: none; }
}
@media (max-width: 1080px) {
  .hero { grid-template-columns: 1fr; }
  .quick-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .me-hero { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .main-nav { display: none; }
  .mobile-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 90; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
    background: rgba(255, 255, 255, 0.97); backdrop-filter: blur(10px); border-top: 1px solid var(--border);
    padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
  }
  .m-nav-item { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 0; border-radius: 10px; color: var(--muted); font-size: 11px; font-weight: 700; text-decoration: none !important; min-width: 0; }
  .m-nav-item .m-ic { font-size: 19px; line-height: 1.2; }
  .m-nav-item.active { color: var(--primary); background: var(--primary-soft); }
  body { padding-bottom: 64px; }
  .browse { grid-template-columns: 1fr; gap: 12px; }
  .cat-side {
    position: static; flex-direction: row; overflow-x: auto; max-height: none; padding: 6px; gap: 4px; scrollbar-width: thin;
  }
  .cs-item { flex: none; padding: 6px 10px; }
  .cs-item.on { box-shadow: inset 0 -3px 0 var(--cc, var(--primary)); }
  .browse-hd { grid-template-columns: auto minmax(0, 1fr); }
  .bh-prog { grid-column: 1 / -1; min-width: 0; }
  .gacha-stage { grid-template-columns: 1fr; gap: 10px; }
  .machine { transform: scale(0.62); transform-origin: top center; height: 172px; margin-bottom: -4px; }
  .fb-grid { grid-template-columns: 1fr; }
  .quiz-records { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .app-main { padding: 14px 12px 28px; }
  .header-inner { padding: 7px 10px; gap: 6px; }
  .brand-title { font-size: 15px; }
  .hdr-chip.streak { display: none; }
  .hero { padding: 16px; border-radius: 18px; gap: 14px; }
  .hero h1 { font-size: 29px; }
  .hero-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .quick-grid { gap: 8px; }
  .quick { padding: 12px; gap: 8px; }
  .qi { font-size: 24px; }
  .quick small { display: none; }
  .fact-grid, .cat-grid { grid-template-columns: 1fr; }
  .fact-card.big .fc-title { font-size: 19px; }
  .page-hd h1 { font-size: 22px; }
  .q-text { font-size: 20px; }
  .qp-stmt { font-size: 19px; }
  .tf-btn { min-height: 56px; font-size: 17px; }
  .tf-btn kbd { display: none; }
  .me-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .heat { grid-template-columns: repeat(14, minmax(0, 1fr)); }
  .detail-nav { grid-template-columns: 1fr; }
  .dn.next { text-align: left; }
  .bh-ic { font-size: 32px; }
  .bh-text h1 { font-size: 20px; }
  .ghost-btn { margin-left: 0; }
}
@media print {
  .site-header, .mobile-nav, .site-footer, .fc-actions, .fc-fav { display: none !important; }
}

/* -------------------- 📮 投稿 & 🛡️ 審核台 -------------------- */

  <script>/* js/campus_nav.js */
/* 開心學園 · 校園導覽按鈕（共用片段 campus_nav.js）
 *
 * 唯一來源：~/campus_map_platform/shared/campus_nav.js
 *   各工具 static/ 裡的副本請勿直接修改 —— 改這裡，再跑 python3 ~/campus_map_platform/tools/sync_campus_nav.py 同步。
 *
 * 用法（每個學院／實戰工具）：
 *   1. 在 header 品牌區最前面放 placeholder（工具 id 見 ~/campus_map_platform/registry.json）：
 *        <a class="campus-home" data-campus-home="english" href="https://okayell.github.io/">🏫 校園</a>
 *      深色 header 加 data-campus-theme="dark"。
 *   2. 用一般的 <script src="…/campus_nav.js"><\/script> 載入（各工具的 build_dist 會把它內嵌進單一 index.html）。
 *   沒有 placeholder 時，會在畫面左上角產生浮動的「🏫 校園」按鈕。
 *
 * 連結目標：
 *   - GitHub Pages（*.github.io）            → 同網域根目錄 /（= https://okayell.github.io/ 校園地圖）
 *   - Cloudtop 本機（已知工具 port，非 localhost）→ 同主機 :8919 的本機校園地圖
 *   - file:// 單一檔、localhost、其他網域        → https://okayell.github.io/
 *   連結會帶 ?from=<工具 id>，校園地圖會標示「你剛剛在這裡」；同網域時另在 localStorage 記錄最近造訪。
 */
(function () {
  'use strict';
  if (window.CampusNav) return;

  var PUBLIC_CAMPUS = 'https://okayell.github.io/';
  var LOCAL_CAMPUS_PORT = '8919';
  // Cloudtop 上各工具的 Autobahn proxy 與 Python backend port（registry.json 的 local_port / backend_port）。
  var LOCAL_PORTS = ['8919', '8918', '8911', '8910', '8923', '8922', '8925', '8924', '8927', '8926', '8929', '8928', '8931', '8930', '8899', '8898',
    '8905', '8904', '8913', '8912', '8915', '8914', '8917', '8916'];
  var TOOL_MAP = {
    english: { port: '8911', path: 'english-speak-listen/', name: '英語學院', icon: '🇬🇧' },
    japanese: { port: '8923', path: 'japanese/', name: '日語學院', icon: '🇯🇵' },
    finance: { port: '8925', path: 'finance/', name: '財經學院', icon: '🏛️' },
    'addiction-cm': { port: '8927', path: 'addiction-cm/', name: '藥癮個管師學院', icon: '💚' },
    music: { port: '8929', path: 'music/', name: '音樂學院', icon: '🎵' },
    trivia: { port: '8931', path: 'trivia/', name: '冷知識學院', icon: '💡' },
    stock: { port: '8905', path: 'tw-stock-insight/', name: '台股智慧選股', icon: '📈' },
    poker: { port: '8899', path: 'poker-gto/', name: 'GTO 撲克學院', icon: '♠️' },
    nba: { port: '8913', path: 'nba-betting-iq/', name: 'NBA 運彩智庫', icon: '🏀' },
    epl: { port: '8917', path: 'epl-odds-iq/', name: '英超運彩智庫', icon: '⚽' },
    f1: { port: '8915', path: 'f1-odds-iq/', name: 'F1 運彩智庫', icon: '🏎️' }
  };
  var VISITS_KEY = 'okayell.campus.visits.v1';
  var STU_KEY = 'okayell.campus.student.v1';
  var STU_COOKIE = 'okayell_campus_stu_v1';
  var NTFY_TOPIC = 'okayell_happy_campus_v3';
  var BC_NAME = 'okayell.campus.presence.v1';

  function readStuCookie() {
    if (window.location && window.location.protocol === 'file:') return null;
    try {
      var parts = (document.cookie || '').split(';');
      for (var i = 0; i < parts.length; i++) {
        var kv = parts[i].trim();
        if (kv.indexOf(STU_COOKIE + '=') === 0) {
          var obj = JSON.parse(decodeURIComponent(kv.slice(STU_COOKIE.length + 1)));
          return obj && typeof obj === 'object' ? obj : null;
        }
      }
    } catch (e) { /* ignore */ }
    return null;
  }

  function writeStuCookie(obj) {
    if (window.location && window.location.protocol === 'file:') return;
    try {
      var val = encodeURIComponent(JSON.stringify(obj));
      document.cookie = STU_COOKIE + '=' + val + '; path=/; max-age=31536000; SameSite=Lax';
    } catch (e) { /* ignore */ }
  }

  function localOrigin(loc, port) {
    var p = parseInt(port, 10);
    var host = loc.hostname || '';
    var dot = host.indexOf('.');
    if (dot > 0) {
      var label = host.slice(0, dot);
      var pHex = ('0000' + p.toString(16)).slice(-4).toLowerCase();
      if (label.length === 31 && /^a[0-9a-f]{30}$/i.test(label)) {
        return loc.protocol + '//' + (label.slice(0, 9) + pHex + label.slice(13)).toLowerCase() + host.slice(dot);
      }
      if (label.length === 55 && /^b[0-9a-f]{54}$/i.test(label)) {
        return loc.protocol + '//' + (label.slice(0, 33) + pHex + label.slice(37)).toLowerCase() + host.slice(dot);
      }
    }
    return loc.protocol + '//' + host + ':' + p;
  }

  function campusBase() {
    var loc = window.location;
    if (loc.protocol === 'http:' || loc.protocol === 'https:') {
      var host = loc.hostname || '';
      if (/(^|\.)github\.io$/i.test(host)) return loc.origin + '/';
      return localOrigin(loc, LOCAL_CAMPUS_PORT) + '/';
    }
    return PUBLIC_CAMPUS;
  }

  function campusUrl(toolId) {
    var base = campusBase();
    return toolId ? base + '?from=' + encodeURIComponent(toolId) : base;
  }

  function toolUrl(targetId, hash) {
    var t = TOOL_MAP[targetId];
    var h = String(hash || '').trim();
    if (h && h.charAt(0) !== '#') h = '#' + (h.charAt(0) === '/' ? '' : '/') + h;
    if (!t) return campusUrl(targetId);
    var loc = window.location;
    if (loc.protocol === 'http:' || loc.protocol === 'https:') {
      var host = loc.hostname || '';
      if (/(^|\.)github\.io$/i.test(host)) return loc.origin + '/' + t.path + h;
      return localOrigin(loc, t.port) + '/' + h;
    }
    return PUBLIC_CAMPUS + t.path + h;
  }

  function recordVisit(toolId) {
    if (!toolId) return;
    try {
      var raw = window.localStorage.getItem(VISITS_KEY);
      var visits = raw ? JSON.parse(raw) : {};
      if (!visits || typeof visits !== 'object' || Array.isArray(visits)) visits = {};
      visits[toolId] = Date.now();
      window.localStorage.setItem(VISITS_KEY, JSON.stringify(visits));
    } catch (e) { /* 無痕模式或空間不足：略過 */ }
    sendPresenceHeartbeat(toolId);
  }

  function sendPresenceHeartbeat(toolId) {
    if (!toolId || !TOOL_MAP[toolId]) return;
    if (typeof navigator !== 'undefined' && navigator.webdriver) return;
    try {
      var t = TOOL_MAP[toolId];
      var lsStu = JSON.parse(window.localStorage.getItem(STU_KEY) || '{}') || {};
      var ckStu = readStuCookie() || {};
      var stu = (lsStu && lsStu.confirmed && lsStu.name) ? lsStu : (ckStu && ckStu.confirmed && ckStu.name) ? ckStu : lsStu;
      if (!stu.uid) {
        stu.uid = (ckStu && ckStu.uid) || ('stu_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7));
      }
      stu.renameCount = Math.max(+lsStu.renameCount || 0, +ckStu.renameCount || 0);
      stu.buildingId = toolId;
      stu.buildingName = t.name;
      stu.buildingIcon = t.icon;
      stu.activity = '正在「' + t.name + '」進修中';
      stu.ts = Math.floor(Date.now() / 1000);
      window.localStorage.setItem(STU_KEY, JSON.stringify(stu));
      writeStuCookie(stu);
      // 只有使用者已在校園地圖設定並確認名稱（stu.confirmed && stu.name）才對外同步，不自動偽造「學員」分身
      if (stu.confirmed !== true || !stu.name || stu.name === '學員' || stu.name === '開心學員') return;
      if (window.BroadcastChannel) {
        try {
          var bc = new BroadcastChannel(BC_NAME);
          bc.postMessage(stu);
          bc.close();
        } catch (e) { /* ignore */ }
      }
      var loc = window.location;
      if (loc.protocol === 'http:' || loc.protocol === 'https:') {
        var host = loc.hostname || '';
        if (/(^|\.)github\.io$/i.test(host)) {
          fetch('https://ntfy.sh/' + NTFY_TOPIC, { method: 'POST', body: JSON.stringify(stu), keepalive: true }).catch(function () {});
        } else {
          fetch(campusBase() + 'api/presence', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(stu),
            keepalive: true
          }).catch(function () {});
        }
      }
    } catch (e) { /* ignore */ }
  }

  var CSS = [
    '.campus-home{display:inline-flex;align-items:center;gap:5px;flex:none;box-sizing:border-box;height:30px;',
    'padding:0 11px 0 9px;margin:0 6px 0 0;border-radius:999px;border:1px solid #c7d2fe;background:#eef2ff;',
    'color:#3730a3;font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",',
    '"Microsoft JhengHei",sans-serif;letter-spacing:0;text-decoration:none!important;white-space:nowrap;',
    'cursor:pointer;vertical-align:middle;transition:background .15s,box-shadow .15s,transform .15s}',
    '.campus-home:hover{background:#e0e7ff;box-shadow:0 2px 8px rgba(55,48,163,.18);transform:translateY(-1px)}',
    '.campus-home:focus-visible{outline:2px solid #6366f1;outline-offset:2px}',
    '.campus-home .ch-ic{font-size:15px;line-height:1}',
    '.campus-home.campus-sibling{background:#fffbeb;border-color:#fcd34d;color:#92400e;margin-right:10px}',
    '.campus-home.campus-sibling:hover{background:#fef3c7;box-shadow:0 2px 8px rgba(180,83,9,.16)}',
    '.campus-home[data-campus-theme="dark"]{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.30);color:#f8fafc}',
    '.campus-home[data-campus-theme="dark"]:hover{background:rgba(255,255,255,.18)}',
    '.campus-home.floating{position:fixed;left:12px;top:12px;z-index:2147483000;margin:0;',
    'box-shadow:0 4px 14px rgba(15,23,42,.18)}',
    '.campus-acad-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 12px;margin:8px 0 12px;',
    'border-radius:12px;background:linear-gradient(90deg,#fffbeb,#fef3c7);border:1px solid #fcd34d;font-size:13px;color:#78350f}',

  var DEFAULT_FB_EMAIL = 'okayell@hotmail.com';
  var GH_ISSUES_URL = 'https://github.com/okayell/okayell.github.io/issues/new';

  function fbEsc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function fbCopyText(text) {
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return Promise.resolve(ok);
      } catch (e) { return Promise.resolve(false); }
    }
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, fallback);
    }
    return fallback();
  }

  function deliveryLinks(opts) {
    opts = opts || {};
    var email = opts.email || DEFAULT_FB_EMAIL;
    var tool = opts.tool || '開心學園';
    var kindLabel = opts.kindLabel || '💬 意見回饋';
    var title = String(opts.title || '').trim();
    var description = String(opts.description || '').trim();
    var subject = '[' + tool + ' 意見回饋] ' + kindLabel + ' — ' + title;
    var body = '工具名稱：' + tool + '\n回饋類型：' + kindLabel + '\n標題：' + title + '\n\n內容描述：\n' + description + '\n';
    var copyPayload = '收件信箱：' + email + '\n主旨：' + subject + '\n\n' + body;
    return {
      email: email,
      subject: subject,
      body: body,
      copyPayload: copyPayload,
      mailto: 'mailto:' + email + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body),
      gmail: 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(email) + '&su=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body),
      outlook: 'https://outlook.live.com/mail/0/deeplink/compose?to=' + encodeURIComponent(email) + '&subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body),
      github: (opts.repoIssues || GH_ISSUES_URL) + '?title=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body)
    };
  }

  function postJsonWithTimeout(url, payload, ms) {
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, ms || 3600) : 0;
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify(payload),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) {
      clearTimeout(timer);
      return r.json().catch(function () { return {}; }).then(function (d) {
        var ok = r.ok && (d.success === true || d.success === 'true' || d.success === 1 || d.success === '1' || d.ok === true);
        return { ok: ok, status: r.status, data: d };
      });
    }, function () {
      clearTimeout(timer);
      return { ok: false, status: 0, data: {} };
    });
  }

  function sendStaticFeedback(opts) {
    opts = opts || {};
    var links = deliveryLinks(opts);
    var relay = window.CAMPUS_FEEDBACK_RELAY || '';
    if (window.location.protocol === 'file:' && !relay) {
      return Promise.resolve({ sent: false, channel: 'file_offline', links: links });

    var payload = {
      _subject: links.subject,
      _template: 'table',
      _captcha: 'false',

        '<a class="cfb-btn" href="' + fbEsc(links.github) + '" target="_blank" rel="noopener">🐙 GitHub Issue 留言</a>' +
      '</div></div>';
  }

  function injectCss() {
    if (document.getElementById('campusNavCss')) return;
    var st = document.createElement('style');
    st.id = 'campusNavCss';
    st.textContent = CSS;
    (document.head || document.documentElement).appendChild(st);
  }

  function decorate(a, toolId) {
    a.href = campusUrl(toolId);
    a.classList.add('campus-home');
    a.removeAttribute('target');
    a.setAttribute('title', '回到開心學園 · 校園地圖');

    a.innerHTML = '<span class="ch-ic" aria-hidden="true">🏫</span><span class="ch-txt">校園</span>';
  }

  function wireGoLinks(root) {
    var scope = root && root.querySelectorAll ? root : document;
    var links = scope.querySelectorAll('[data-campus-go]');
    for (var i = 0; i < links.length; i++) {
      var el = links[i];
      var tid = el.getAttribute('data-campus-go');
      var h = el.getAttribute('data-campus-hash') || '';
      if (tid) {
        el.href = toolUrl(tid, h);
        el.removeAttribute('target');
      }
    }
  }

  function init() {
    injectCss();
    var toolId = window.CAMPUS_TOOL_ID || '';
    var nodes = document.querySelectorAll('[data-campus-home]');
    if (nodes.length) {
      for (var i = 0; i < nodes.length; i++) {
        var id = nodes[i].getAttribute('data-campus-home') || toolId;
        if (!toolId) toolId = id;
        decorate(nodes[i], id);
      }
    } else if (document.body) {
      var a = document.createElement('a');
      a.className = 'campus-home floating';
      document.body.appendChild(a);
      decorate(a, toolId);

    wireGoLinks(document);

      var mo = new MutationObserver(function () { wireGoLinks(document); });
      mo.observe(document.body, { childList: true, subtree: true });

      var cp = e.target && e.target.closest ? e.target.closest('[data-campus-fb-copy]') : null;

      var a = e.target && e.target.closest ? e.target.closest('[data-campus-go]') : null;

      var tid = a.getAttribute('data-campus-go');
      var h = a.getAttribute('data-campus-hash') || '';
      if (tid) {
        recordVisit(tid);
        a.href = toolUrl(tid, h);
      }
    }, true);
    recordVisit(toolId);
  }

  window.CampusNav = {
    base: campusBase,
    url: campusUrl,
    toolUrl: toolUrl,
    wire: wireGoLinks,
    init: init,
    visitsKey: VISITS_KEY,
    deliveryLinks: deliveryLinks,
    sendStaticFeedback: sendStaticFeedback,
    fallbackHtml: fallbackHtml
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

  fact: '1969 年 10 月 29 日，加州大學洛杉磯分校想透過 ARPANET 傳送「LOGIN」到史丹佛研究院，才打到「LO」對方系統就當機，第一則訊息只有兩個字母。',

  fact: '提姆·柏納－李（Tim Berners-Lee）在歐洲核子研究組織（CERN）用一台 NeXT 電腦架起第一個網站，機殼上貼著紅字：「This machine is a server. DO NOT POWER IT DOWN!!」',

  q: '被稱為第一台網路攝影機的鏡頭，一直對著什麼？',
  fact: '1991 年，英國劍橋大學電腦實驗室把攝影機對準「特洛伊室」的咖啡壺，讓其他樓層的人不必白跑一趟；1993 年畫面接上全球資訊網，成了著名的第一台網路攝影機。',

  fact: '1973 年 4 月 3 日，摩托羅拉的馬丁·庫柏（Martin Cooper）站在紐約街頭，用手機原型打給對手貝爾實驗室的喬爾·恩格爾，告訴他：我正在用真正的手持行動電話打給你。',

  q: '用鍵盤打出的笑臉 :-) 是誰先提議的？',
  fact: '1982 年 9 月 19 日，卡內基美隆大學的電腦科學家史考特·法爾曼（Scott Fahlman）在校內電子留言板建議：開玩笑的貼文標上 :-) ，認真的貼文則標上 :-( 。',

  fact: 'CAPTCHA 是「全自動區分電腦與人類的公開圖靈測試」的英文縮寫，這個名稱在 2000 年由卡內基美隆大學的路易斯·馮安等人提出，用扭曲的文字考倒程式、放行真人。',

  fact: '1971 年，BBN 公司的鮑伯·湯瑪斯寫出實驗程式 Creeper，它會在 ARPANET 的電腦之間移動，並印出「I’M THE CREEPER: CATCH ME IF YOU CAN」，常被視為最早的電腦蠕蟲。',

  id: 'psy-001', cat: 'psych',
  title: '你以為大家都在看你，其實沒那麼多人',
  q: '穿了一件很糗的衣服，真的有那麼多人注意到嗎？',
  fact: '2000 年康乃爾大學的實驗中，學生穿著自覺很糗的歌手頭像 T 恤走進教室，自己猜約一半的人會注意到，實際上只有約 23% 的人記得。',

  fact: '1960 年英國心理學家華森（Peter Wason）出了「2、4、6」猜規則的題目，發現多數人只會舉符合自己猜想的例子來驗證，很少舉可能推翻它的例子。',

  fact: '1948 年心理學家佛瑞（Bertram Forer）發給 39 名學生「個人化」的性格分析，內容其實一模一樣，學生打的準確度卻平均高達 4.26 分（滿分 5 分）。',

  title: '預設勾選，大幅改變器官捐贈同意率',
  q: '器官捐贈改成「預設同意」，同意率會差多少？',

  why: '兩國文化和經濟條件相近，差別主要在「預設選項」。改變預設要花時間、要做決定，很多人乾脆維持原狀，這就是「預設效應」。強生（Eric Johnson）與戈德斯坦（Daniel Goldstein）的這篇論文，後來成為「推力」（nudge）政策的經典案例。不過登記同意率不等於實際捐贈數，實際捐贈還受到醫療體系、家屬意願等因素影響，兩國的實際差距並沒有那麼懸殊。',

  fact: '1956 年心理學家米勒提出「神奇的數字 7±2」，但 2001 年考恩（Nelson Cowan）整理大量研究後認為，扣掉默念和分組的幫助，人一次大約只能記住 4 個項目。',

  fact: '莫萊森（Henry Molaison，代號 H.M.）在 1953 年為了治療癲癇，切除了兩側顳葉內側的部分組織，包括大部分海馬迴。術後他無法再形成新的長期記憶，卻還記得許多童年往事。',

  // ---------------------------------------------------------------------------
  TRV.$ = (sel, root) => (root || document).querySelector(sel);
  TRV.$$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  TRV.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
  TRV.pad = (n) => String(n).padStart(2, '0');
  TRV.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  TRV.shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  TRV.pick = (arr) => (arr && arr.length ? arr[Math.floor(Math.random() * arr.length)] : null);
  TRV.debounce = (fn, ms) => {
    let t = null;
    return function (...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), ms); };
  };
  TRV.dayKey = (d) => `${d.getFullYear()}-${TRV.pad(d.getMonth() + 1)}-${TRV.pad(d.getDate())}`;
  TRV.todayKey = () => TRV.dayKey(new Date());
  TRV.fmtNum = (n) => Number(n || 0).toLocaleString('zh-TW');

  /** 中文 IME 選字時的 Enter 不算送出（注音／倉頡／速成安全防護）。 */
  let imeComposing = false;
  let imeEndAt = 0;
  document.addEventListener('compositionstart', () => { imeComposing = true; }, true);
  document.addEventListener('compositionend', () => { imeComposing = false; imeEndAt = Date.now(); }, true);
  TRV.isComposing = (ev) => !!(ev && (ev.isComposing || ev.keyCode === 229)) || imeComposing ||
    Date.now() - imeEndAt < 150;
  TRV.isEnterSend = (ev) => ev.key === 'Enter' && !ev.shiftKey && !TRV.isComposing(ev);
  TRV.isTyping = (ev) => {
    const el = ev && ev.target;
    const tag = (el && el.tagName) || '';
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || !!(el && el.isContentEditable);
  };

  TRV.copy = async (text, msg) => {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e2) { /* ignore */ }
      ta.remove();
    }
    TRV.toast(msg || '📋 已複製到剪貼簿', 'ok');
  };

  // ---------------------------------------------------------------------------
  // 2. 事件匯流排
  // ---------------------------------------------------------------------------
  const listeners = {};
  TRV.on = (evt, fn) => { (listeners[evt] = listeners[evt] || []).push(fn); };
  TRV.off = (evt, fn) => {
    const arr = listeners[evt];
    const i = arr ? arr.indexOf(fn) : -1;
    if (i >= 0) arr.splice(i, 1);
  };
  TRV.emit = (evt, data) => (listeners[evt] || []).forEach((fn) => {
    try { fn(data); } catch (e) { console.error(e); }
  });

  // ---------------------------------------------------------------------------
  // 3. 提示與彈窗
  // ---------------------------------------------------------------------------
  TRV.toast = (msg, kind) => {
    let box = TRV.$('#toastBox');
    if (!box) {
      box = document.createElement('div');
      box.id = 'toastBox';
      box.setAttribute('role', 'status');
      document.body.appendChild(box);
    }
    const el = document.createElement('div');
    el.className = `toast ${kind || ''}`;
    el.textContent = msg;
    box.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, kind === 'bad' ? 4000 : 2400);
  };

  TRV.modal = ({ title, body, actions, wide, onClose, cls }) => {
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    wrap.innerHTML = `<div class="modal ${wide ? 'wide' : ''} ${cls || ''}" role="dialog" aria-modal="true" aria-label="${TRV.esc(String(title || '').replace(/<[^>]+>/g, ''))}">
      <div class="modal-hd"><h3>${title || ''}</h3><button type="button" class="icon-btn" data-close aria-label="關閉">✕</button></div>
      <div class="modal-body"></div><div class="modal-ft"></div></div>`;
    const bd = TRV.$('.modal-body', wrap);
    if (typeof body === 'string') bd.innerHTML = body;
    else if (body) bd.appendChild(body);
    const ft = TRV.$('.modal-ft', wrap);
    (actions || []).forEach((a) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = `btn ${a.primary ? 'primary' : ''} ${a.danger ? 'danger' : ''}`;
      b.textContent = a.label;
      b.onclick = async () => { const keep = a.onClick ? await a.onClick(api) : false; if (keep !== true) api.close(); };
      ft.appendChild(b);
    });
    if (!(actions || []).length) ft.remove();
    const onKey = (e) => { if (e.key === 'Escape' && !e.isComposing) api.close(); };
    const api = {
      el: wrap,
      body: bd,
      close() {
        document.removeEventListener('keydown', onKey);
        wrap.classList.remove('show');
        setTimeout(() => wrap.remove(), 180);
        if (onClose) onClose();
      },
    };
    wrap.addEventListener('mousedown', (e) => { if (e.target === wrap) api.close(); });
    TRV.$('[data-close]', wrap).onclick = () => api.close();
    document.addEventListener('keydown', onKey);
    document.body.appendChild(wrap);
    requestAnimationFrame(() => wrap.classList.add('show'));
    return api;
  };

  TRV.confirm = (msg, okLabel) => new Promise((resolve) => {
    let done = false;
    TRV.modal({
      title: '請確認',
      body: `<p class="confirm-msg">${msg}</p>`,
      actions: [
        { label: '取消', onClick: () => { done = true; resolve(false); } },
        { label: okLabel || '確定', primary: true, danger: true, onClick: () => { done = true; resolve(true); } },
      ],
      onClose: () => { if (!done) resolve(false); },
    });
  });

  // ---------------------------------------------------------------------------
  // 4. 冷知識與分類索引
  // ---------------------------------------------------------------------------
  let FACT_MAP = null;
  let CAT_MAP = null;
  let BY_CAT = null;
  let ALL = null;
  TRV.COLD = {
    1: { label: '微冷', ice: '🧊', desc: '不少人聽過' },
    2: { label: '很冷', ice: '🧊🧊', desc: '少有人知' },
    3: { label: '極冷', ice: '🧊🧊🧊', desc: '超冷門' },
  };
  TRV.index = () => {
    CAT_MAP = new Map();
    TRV.CATEGORIES.forEach((c, i) => { c.order = i; CAT_MAP.set(c.id, c); });
    FACT_MAP = new Map();
    BY_CAT = new Map(TRV.CATEGORIES.map((c) => [c.id, []]));
    TRV.FACTS.forEach((f) => {
      if (!f || !f.id || FACT_MAP.has(f.id) || !CAT_MAP.has(f.cat)) return;
      f._hay = [f.title, f.q, f.fact, f.why, (f.tags || []).join(' '), f.src || '', CAT_MAP.get(f.cat).name]
        .join(' ').toLowerCase();
      FACT_MAP.set(f.id, f);
      BY_CAT.get(f.cat).push(f);
    });
    BY_CAT.forEach((arr) => arr.sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0)));
    ALL = [];
    TRV.CATEGORIES.forEach((c) => { ALL.push(...BY_CAT.get(c.id)); });
  };
  const ensure = () => { if (!FACT_MAP) TRV.index(); };
  TRV.cats = () => { ensure(); return TRV.CATEGORIES.filter((c) => BY_CAT.get(c.id).length); };
  TRV.cat = (id) => { ensure(); return CAT_MAP.get(id) || null; };
  TRV.fact = (id) => { ensure(); return FACT_MAP.get(id) || null; };
  TRV.facts = (catId) => { ensure(); return catId ? (BY_CAT.get(catId) || []).slice() : ALL.slice(); };
  TRV.total = () => { ensure(); return ALL.length; };
  TRV.catTags = (catId, limit) => {
    const cnt = new Map();
    TRV.facts(catId).forEach((f) => (f.tags || []).forEach((t) => cnt.set(t, (cnt.get(t) || 0) + 1)));
    return Array.from(cnt.entries()).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh-Hant'))
      .slice(0, limit || 14).map(([t, n]) => ({ tag: t, n }));
  };
  TRV.neighbors = (id) => {
    const f = TRV.fact(id);
    if (!f) return { prev: null, next: null };
    const list = TRV.facts(f.cat);
    const i = list.findIndex((x) => x.id === id);
    return { prev: i > 0 ? list[i - 1] : null, next: i < list.length - 1 ? list[i + 1] : null };
  };
  TRV.related = (id, n) => {
    const f = TRV.fact(id);
    if (!f) return [];
    const tags = new Set(f.tags || []);
    const scored = TRV.facts(f.cat).filter((x) => x.id !== id)
      .map((x) => ({ x, s: (x.tags || []).filter((t) => tags.has(t)).length + Math.random() * 0.5 }));
    scored.sort((a, b) => b.s - a.s);
    return scored.slice(0, n || 4).map((o) => o.x);
  };
  TRV.search = (q, limit) => {
    ensure();
    const terms = String(q || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return [];
    const out = [];
    for (const f of ALL) {
      if (terms.every((t) => f._hay.includes(t))) {
        const inTitle = terms.every((t) => (f.title + f.q).toLowerCase().includes(t));
        out.push({ f, s: inTitle ? 2 : 1 });
      }
    }
    out.sort((a, b) => b.s - a.s);
    return out.slice(0, limit || 60).map((o) => o.f);
  };

  /** 每日一則：用固定種子把全部冷知識洗牌一次，依「日期序號」輪播，全部看完才會重複。 */
  function seeded(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  let DAILY_ORDER = null;
  TRV.dailyFact = (d) => {
    ensure();
    if (!ALL.length) return null;
    if (!DAILY_ORDER || DAILY_ORDER.length !== ALL.length) {
      const ids = ALL.map((f) => f.id).sort();
      const rnd = seeded(20261030);
      for (let i = ids.length - 1; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        [ids[i], ids[j]] = [ids[j], ids[i]];
      }
      DAILY_ORDER = ids;
    }
    const day = d || new Date();
    const n = Math.floor(Date.UTC(day.getFullYear(), day.getMonth(), day.getDate()) / 86400000);
    return FACT_MAP.get(DAILY_ORDER[((n % DAILY_ORDER.length) + DAILY_ORDER.length) % DAILY_ORDER.length]);
  };

  // ---------------------------------------------------------------------------
  // 5. 學習狀態（localStorage 一律使用 `trv.*` 前綴）
  // ---------------------------------------------------------------------------
  const KEY = 'trv.state.v1';
  function defaults() {
    return {
      v: 1,
      seen: {},
      learned: {},
      knew: {},
      fav: {},
      days: {},
      quiz: { rounds: 0, answered: 0, correct: 0, best: 0, bestStreak: 0, wrong: {} },
      draws: 0,
      meta: { created: Date.now(), welcomeDismissed: false },
    };
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const st = JSON.parse(raw);
        const d = defaults();
        return {
          ...d,
          ...st,
          seen: { ...(st.seen || {}) },
          learned: { ...(st.learned || {}) },
          knew: { ...(st.knew || {}) },
          fav: { ...(st.fav || {}) },
          days: { ...(st.days || {}) },
          quiz: { ...d.quiz, ...(st.quiz || {}), wrong: { ...((st.quiz && st.quiz.wrong) || {}) } },
          meta: { ...d.meta, ...(st.meta || {}) },
        };
      }
    } catch (e) { /* 損毀或無痕模式：使用預設值 */ }
    return defaults();
  }
  TRV.state = load();
  let saveTimer = null;
  TRV.save = (now) => {
    const write = () => {
      saveTimer = null;
      try { localStorage.setItem(KEY, JSON.stringify(TRV.state)); } catch (e) { /* 空間不足略過 */ }
    };
    if (now) { clearTimeout(saveTimer); write(); } else if (!saveTimer) saveTimer = setTimeout(write, 120);
    TRV.emit('state');
  };
  window.addEventListener('pagehide', () => { if (saveTimer) { clearTimeout(saveTimer); TRV.save(true); } });
  TRV.resetState = () => { TRV.state = defaults(); TRV.save(true); };

  TRV.day = (k) => {
    k = k || TRV.todayKey();
    if (!TRV.state.days[k]) TRV.state.days[k] = { xp: 0, act: {} };
    const d = TRV.state.days[k];
    d.act = d.act || {};
    return d;
  };
  TRV.addXP = (n, act) => {
    const d = TRV.day();
    d.xp = (d.xp || 0) + (n || 0);
    if (act) d.act[act] = (d.act[act] || 0) + 1;
    TRV.save();
  };
  const dayActive = (k) => !!TRV.state.days[k] && (TRV.state.days[k].xp || 0) > 0;
  TRV.streak = () => {
    const d = new Date();
    if (!dayActive(TRV.dayKey(d))) d.setDate(d.getDate() - 1);
    let n = 0;
    while (dayActive(TRV.dayKey(d)) && n < 3650) { n++; d.setDate(d.getDate() - 1); }
    return n;
  };
  TRV.totalXP = () => Object.values(TRV.state.days).reduce((a, d) => a + (d.xp || 0), 0);

  TRV.isSeen = (id) => !!TRV.state.seen[id];
  TRV.isFav = (id) => !!TRV.state.fav[id];
  TRV.reaction = (id) => (TRV.state.learned[id] ? 'learned' : TRV.state.knew[id] ? 'knew' : '');
  TRV.markSeen = (id) => {
    if (!id || TRV.state.seen[id] || !TRV.fact(id)) return false;
    TRV.state.seen[id] = Date.now();
    TRV.addXP(1, 'seen');
    return true;
  };
  TRV.toggleFav = (id) => {
    if (TRV.state.fav[id]) delete TRV.state.fav[id];
    else { TRV.state.fav[id] = Date.now(); TRV.markSeen(id); }
    TRV.save();
    return !!TRV.state.fav[id];
  };
  TRV.react = (id, kind) => {
    const was = TRV.reaction(id);
    delete TRV.state.learned[id];
    delete TRV.state.knew[id];
    if (was !== kind) TRV.state[kind === 'knew' ? 'knew' : 'learned'][id] = Date.now();
    TRV.markSeen(id);
    TRV.save();
    return TRV.reaction(id);
  };
  TRV.seenCount = (catId) => TRV.facts(catId).filter((f) => TRV.state.seen[f.id]).length;
  TRV.catProgress = (catId) => {
    const total = TRV.facts(catId).length;
    const seen = TRV.seenCount(catId);
    return { total, seen, pct: total ? seen / total : 0 };
  };

  TRV.RANKS = [
    { min: 0, icon: '🐣', name: '好奇新生' },
    { min: 10, icon: '🔍', name: '好奇寶寶' },
    { min: 50, icon: '📘', name: '冷知識學徒' },
    { min: 120, icon: '🎓', name: '冷知識達人' },
    { min: 250, icon: '🧠', name: '冷知識博士' },
    { min: 400, icon: '🏆', name: '冷知識教授' },
  ];
  TRV.rank = () => {
    const seen = Object.keys(TRV.state.seen).filter((id) => TRV.fact(id)).length;
    const total = TRV.total();
    if (total && seen >= total) return { icon: '👑', name: '冷知識之神', seen, next: null };
    let cur = TRV.RANKS[0];
    let next = null;
    TRV.RANKS.forEach((r, i) => {
      if (seen >= r.min) { cur = r; next = TRV.RANKS[i + 1] || { min: total, icon: '👑', name: '冷知識之神' }; }
    });
    if (next && total && next.min > total) next = { min: total, icon: '👑', name: '冷知識之神' };
    return { ...cur, seen, next };
  };
  TRV.badge = (catId) => {
    const p = TRV.catProgress(catId);
    if (p.total && p.seen >= p.total) return { lv: 3, icon: '🥇', name: '金牌' };
    if (p.seen >= 20) return { lv: 2, icon: '🥈', name: '銀牌' };
    if (p.seen >= 10) return { lv: 1, icon: '🥉', name: '銅牌' };
    return { lv: 0, icon: '🔒', name: '未解鎖' };
  };

  TRV.recordQuiz = (id, ok) => {
    const q = TRV.state.quiz;
    q.answered = (q.answered || 0) + 1;
    if (ok) {
      q.correct = (q.correct || 0) + 1;
      if (q.wrong[id]) delete q.wrong[id];
    } else {
      q.wrong[id] = ((q.wrong[id]) || 0) + 1;
    }
    TRV.markSeen(id);
    TRV.addXP(ok ? 2 : 0, ok ? 'correct' : 'quiz');
  };
  TRV.finishQuiz = (score, n, bestStreak) => {
    const q = TRV.state.quiz;
    q.rounds = (q.rounds || 0) + 1;
    if (n >= 10) q.best = Math.max(q.best || 0, Math.round((score / n) * 100));
    q.bestStreak = Math.max(q.bestStreak || 0, bestStreak || 0);
    TRV.addXP(5, 'round');
  };

  // ---------------------------------------------------------------------------
  // 6. 執行環境與分享網址
  // ---------------------------------------------------------------------------
  TRV.PUBLIC_URL = 'https://okayell.github.io/trivia/';
  // window.TRV_E2E_LOCAL：只給 tools/e2e_check.mjs 在 file:// 模擬本機版（審核台）用。
  TRV.isStatic = () => !window.TRV_E2E_LOCAL && !!(window.TRV_STATIC_ONLY || (location.protocol !== 'http:' && location.protocol !== 'https:') ||
    /\.github\.io$|\.pages\.dev$|\.netlify\.app$|\.vercel\.app$/i.test(location.hostname || ''));
  TRV.baseUrl = () => ((location.protocol === 'http:' || location.protocol === 'https:')
    ? location.origin + location.pathname : TRV.PUBLIC_URL);
  TRV.factUrl = (id) => `${TRV.baseUrl()}#/fact/${encodeURIComponent(id)}`;

  // ---------------------------------------------------------------------------
  // 7. Hash 路由（#/page/param?query）
  // ---------------------------------------------------------------------------
  TRV.routes = {};
  TRV.route = (name, fn) => { TRV.routes[name] = fn; };
  const cleanups = [];
  TRV.onCleanup = (fn) => cleanups.push(fn);
  TRV.parseHash = () => {
    const raw = location.hash.replace(/^#\/?/, '');
    const qi = raw.indexOf('?');
    const p = qi >= 0 ? raw.slice(0, qi) : raw;
    const qs = qi >= 0 ? raw.slice(qi + 1) : '';
    const parts = p.split('/').filter(Boolean).map((x) => { try { return decodeURIComponent(x); } catch (e) { return x; } });
    return { name: parts[0] || 'home', params: parts.slice(1), query: Object.fromEntries(new URLSearchParams(qs)) };
  };
  TRV.go = (hash) => {
    if (location.hash === hash) TRV.renderRoute();
    else location.hash = hash;
  };
  /** 只更新網址的查詢參數（不重繪頁面、不新增瀏覽紀錄）。 */
  TRV.setQuery = (query) => {
    const r = TRV.parseHash();
    const qs = new URLSearchParams(Object.entries(query).filter(([, v]) => v !== '' && v != null)).toString();
    const path = [r.name].concat(r.params.map(encodeURIComponent)).join('/');
    const next = `#/${path}${qs ? `?${qs}` : ''}`;
    if (location.hash !== next) history.replaceState(null, '', next);
    TRV.curRoute = TRV.parseHash();
  };
  TRV.runCleanups = () => {
    while (cleanups.length) {
      const fn = cleanups.pop();
      try { fn(); } catch (e) { console.error(e); }
    }
  };
  TRV.renderRoute = () => {
    TRV.runCleanups();
    const r = TRV.parseHash();
    const main = TRV.$('#appMain');
    const name = TRV.routes[r.name] ? r.name : 'home';
    const prev = TRV.curRoute;
    TRV.curRoute = r;
    main.innerHTML = '';
    main.className = `app-main page-${name}`;
    try {
      TRV.routes[name](main, r.params, r.query);
    } catch (e) {
      console.error(e);
      main.innerHTML = `<div class="card empty"><h3>這個頁面發生問題</h3><p class="muted">${TRV.esc(e.message)}</p>
        <a class="btn primary" href="#/home">回學院大廳</a></div>`;
    }
    TRV.emit('route', r);
    const samePage = prev && prev.name === r.name && prev.params.join('/') === r.params.join('/');
    if (!samePage) window.scrollTo({ top: 0, behavior: 'auto' });
  };
  window.addEventListener('hashchange', TRV.renderRoute);
})();

</script>
  <script>/* js/cards.js */
/* 冷知識學院 — cards.js
 * 冷知識卡片、分類／冷度徽章、卡片動作（⭐ 收藏、🤯 長知識了、😎 早就知道、🔗 分享）的事件委派，
 * 以及「卡片在畫面上停留 1.6 秒自動記為已讀」的 IntersectionObserver。
 */
(function () {
  'use strict';
  const TRV = window.TRV;
  const esc = TRV.esc;

  TRV.catStyle = (c) => (c ? `--cc:${c.color};--cs:${c.soft}` : '');
  TRV.catBadge = (c, link) => {
    if (!c) return '';
    const inner = `<span aria-hidden="true">${c.icon}</span> ${esc(c.name)}`;
    return link === false
      ? `<span class="cat-badge" style="${TRV.catStyle(c)}">${inner}</span>`
      : `<a class="cat-badge" style="${TRV.catStyle(c)}" href="#/browse/${c.id}">${inner}</a>`;
  };
  TRV.coldBadge = (n) => {
    const c = TRV.COLD[n] || TRV.COLD[1];
    return `<span class="cold-badge cold-${n}" title="冷度 ${n}／3：${c.desc}">${c.ice} ${c.label}</span>`;
  };

  function actionsHtml(f) {
    const r = TRV.reaction(f.id);
    return `<button type="button" class="react-btn learned ${r === 'learned' ? 'on' : ''}" data-act="learned" aria-pressed="${r === 'learned'}">🤯 長知識了</button>
      <button type="button" class="react-btn knew ${r === 'knew' ? 'on' : ''}" data-act="knew" aria-pressed="${r === 'knew'}">😎 早就知道</button>
      <button type="button" class="ghost-btn" data-act="share" title="複製冷知識與連結">🔗 分享</button>`;
  }

  /**
   * @param {object} f 冷知識
   * @param {{open?: boolean, big?: boolean, showCat?: boolean, num?: string, hideQ?: boolean}} opts
   *   hideQ：迷思卡片不重複顯示提問（轉蛋答案、單則頁上方已經顯示過）。
   */
  TRV.factCard = (f, opts) => {
    const o = opts || {};
    if (!f) return '<div class="card empty"><p class="muted">冷知識載入中…</p></div>';
    const c = TRV.cat(f.cat);
    const seen = TRV.isSeen(f.id);
    const fav = TRV.isFav(f.id);
    const tags = (f.tags || []).map((t) =>
      `<a class="tag" href="#/browse/${f.cat}?tag=${encodeURIComponent(t)}">#${esc(t)}</a>`).join('');
    return `<article class="fact-card ${o.big ? 'big' : ''} ${seen ? 'is-seen' : ''}" data-fact="${esc(f.id)}" style="${TRV.catStyle(c)}">
      <header class="fc-top">
        ${o.showCat === false ? '' : TRV.catBadge(c)}
        ${TRV.coldBadge(f.cold)}
        ${o.num ? `<span class="fc-num">${esc(o.num)}</span>` : ''}
        <span class="fc-seen" ${seen ? '' : 'hidden'}>✓ 已讀</span>
        <button type="button" class="fc-fav ${fav ? 'on' : ''}" data-act="fav" aria-pressed="${fav}" title="${fav ? '取消收藏' : '加入收藏'}">${fav ? '★' : '☆'}</button>
      </header>
      ${f.cat === 'myth' && !o.hideQ ? `<p class="fc-myth"><span>🙅 迷思</span>${esc(f.q)}</p>` : ''}
      <h3 class="fc-title"><a href="#/fact/${encodeURIComponent(f.id)}">${esc(f.title)}</a></h3>
      <p class="fc-fact">${esc(f.fact)}</p>
      <details class="fc-why" ${o.open ? 'open' : ''}>
        <summary>🤔 為什麼？背後的原因</summary>
        <p>${esc(f.why)}</p>
      </details>
      <footer class="fc-foot">
        <div class="fc-tags">${tags}</div>
        ${f.by ? `<span class="fc-by" title="讀者投稿">✍️ 投稿：${esc(f.by)}</span>` : f.sid ? '<span class="fc-by">✍️ 讀者投稿</span>' : ''}
        ${f.src ? `<span class="fc-src" title="出處">📚 ${esc(f.src)}</span>` : ''}
      </footer>
      <div class="fc-actions">${actionsHtml(f)}</div>
    </article>`;
  };

  /** 只更新卡片上的狀態（收藏、反應、已讀），不重繪整張卡片，展開的「為什麼」不會被收起。 */
  TRV.refreshCards = (id) => {
    TRV.$$(`.fact-card[data-fact="${CSS.escape(id)}"]`).forEach((el) => {
      const f = TRV.fact(id);
      if (!f) return;
      const seen = TRV.isSeen(id);
      el.classList.toggle('is-seen', seen);
      const s = TRV.$('.fc-seen', el);
      if (s) s.hidden = !seen;
      const fav = TRV.isFav(id);
      const fb = TRV.$('.fc-fav', el);
      if (fb) {
        fb.classList.toggle('on', fav);
        fb.textContent = fav ? '★' : '☆';
        fb.title = fav ? '取消收藏' : '加入收藏';
        fb.setAttribute('aria-pressed', String(fav));
      }
      const acts = TRV.$('.fc-actions', el);
      if (acts) acts.innerHTML = actionsHtml(f);
    });
  };

  TRV.shareFact = async (f) => {
