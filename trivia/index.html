    if (!f) return;
    const url = TRV.factUrl(f.id);
    const text = `💡 冷知識｜${f.title}\n${f.fact}\n— 開心學園・冷知識學院`;
    if (navigator.share && /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent || '')) {
      try {
        await navigator.share({ title: `💡 ${f.title}`, text, url });
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
    }
    TRV.copy(`${text}\n${url}`, '🔗 已複製冷知識與連結，貼給朋友吧！');
  };

  document.addEventListener('click', (e) => {
    const btn = e.target.closest && e.target.closest('[data-act]');
    if (!btn) return;
    const card = btn.closest('[data-fact]');
    const id = card && card.getAttribute('data-fact');
    const f = id && TRV.fact(id);
    if (!f) return;
    const act = btn.getAttribute('data-act');
    if (act === 'fav') {
      const on = TRV.toggleFav(id);
      TRV.toast(on ? '⭐ 已加入收藏' : '已取消收藏', on ? 'ok' : '');
    } else if (act === 'learned' || act === 'knew') {
      const r = TRV.react(id, act);
      if (r === 'learned') TRV.toast('🤯 長知識了！已記錄', 'ok');
      else if (r === 'knew') TRV.toast('😎 太強了，你早就知道', 'ok');
    } else if (act === 'share') {
      TRV.shareFact(f);
      TRV.markSeen(id);
    } else {
      return;
    }
    TRV.refreshCards(id);
    TRV.emit('fact-action', { id, act });
  });

  // 展開「為什麼？」也算已讀（toggle 事件不會冒泡，所以用捕獲階段監聽）。
  document.addEventListener('toggle', (e) => {
    const d = e.target;
    if (!d || !d.classList || !d.classList.contains('fc-why') || !d.open) return;
    const card = d.closest('[data-fact]');
    const id = card && card.getAttribute('data-fact');
    if (id && TRV.markSeen(id)) TRV.refreshCards(id);
  }, true);

  /** 卡片至少 60% 出現在畫面上並停留 1.6 秒 → 自動記為已讀。回傳停止觀察的函式。 */
  TRV.observeSeen = (root) => {
    if (!('IntersectionObserver' in window)) return () => {};
    const timers = new Map();
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        const id = en.target.getAttribute('data-fact');
        if (!id) return;
        if (en.isIntersecting && en.intersectionRatio >= 0.6 && !TRV.isSeen(id)) {
          if (!timers.has(id)) {
            timers.set(id, setTimeout(() => {
              timers.delete(id);
              if (TRV.markSeen(id)) TRV.refreshCards(id);
              io.unobserve(en.target);
            }, 1600));
          }
        } else if (timers.has(id)) {
          clearTimeout(timers.get(id));
          timers.delete(id);
        }
      });
    }, { threshold: [0, 0.6, 1] });
    const watch = (scope) => TRV.$$('.fact-card[data-fact]:not(.is-seen)', scope || root).forEach((el) => io.observe(el));
    watch(root);
    const stop = () => { io.disconnect(); timers.forEach((t) => clearTimeout(t)); timers.clear(); };
    stop.watch = watch;
    return stop;
  };
})();

</script>
  <script>/* js/pages.js */
/* 冷知識學院 — pages.js
 * 🏠 學院大廳（#/home）、📚 冷知識圖書館（#/browse/<分類>?tag=&cold=&sort=&q=&fav=1）、
 * 單則冷知識（#/fact/<id>）與 ⭐ 我的冷知識（#/me：稱號、徽章、收藏、學習日曆）。
 */
(function () {
  'use strict';
  const TRV = window.TRV;
  const esc = TRV.esc;
  const PAGE = 24;

  function catCard(c) {
    const p = TRV.catProgress(c.id);
    const b = TRV.badge(c.id);
    return `<a class="cat-card" href="#/browse/${c.id}" style="${TRV.catStyle(c)}">
      <span class="cc-ic" aria-hidden="true">${c.icon}</span>
      <span class="cc-main">
        <span class="cc-name">${esc(c.name)} <small>${esc(c.en)}</small></span>
        <span class="cc-desc">${esc(c.desc)}</span>
        <span class="cc-prog"><i style="width:${Math.round(p.pct * 100)}%"></i></span>
        <span class="cc-meta"><span>已讀 ${p.seen}/${p.total}</span><span title="分類徽章：${b.name}">${b.lv ? b.icon : ''}</span></span>
      </span>
    </a>`;
  }

  function coldPicks(n) {
    const pool = TRV.facts().filter((f) => f.cold === 3);
    const unseen = pool.filter((f) => !TRV.isSeen(f.id));
    return TRV.shuffle(unseen.length >= n ? unseen : pool).slice(0, n);
  }

  // ---------------------------------------------------------------------------
  // 🏠 學院大廳
  // ---------------------------------------------------------------------------
  TRV.route('home', (main) => {
    const total = TRV.total();
    const cats = TRV.cats();
    const rank = TRV.rank();
    const favs = Object.keys(TRV.state.fav).filter((id) => TRV.fact(id)).length;
    const badges = cats.filter((c) => TRV.badge(c.id).lv > 0).length;
    const now = new Date();
    let todayFact = TRV.dailyFact(now);
    main.innerHTML = `
      <section class="hero">
        <div class="hero-text">
          <div class="hero-kicker">🏫 開心學園 · 🧠 通識學區</div>
          <h1><span class="hero-bulb" aria-hidden="true">💡</span>冷知識學院</h1>
          <p class="hero-lead">收錄 <b>${TRV.fmtNum(total)}</b> 則五花八門的冷知識，分成 <b>${cats.length}</b> 大類：
            動物、人體、宇宙、歷史、美食、語言、科技、台灣在地……大大小小通通有。每天一則，打開好奇心！</p>
          <div class="hero-stats">
            <a href="#/me" class="hs"><b>${rank.icon} ${esc(rank.name)}</b><span>目前稱號</span></a>
            <a href="#/me" class="hs"><b>${rank.seen}<small>/${total}</small></b><span>已讀冷知識</span></a>
            <a href="#/me" class="hs"><b>⭐ ${favs}</b><span>收藏</span></a>
            <a href="#/me" class="hs"><b>🔥 ${TRV.streak()}</b><span>連續天數</span></a>
          </div>
        </div>
        <div class="hero-today">
          <div class="today-hd">
            <span class="today-label" id="todayLabel">📅 今日冷知識 · ${now.getMonth() + 1}/${now.getDate()}</span>
            <button type="button" class="btn sm" id="todayShuffle" title="隨機換一則（不影響今日冷知識）">🎲 換一則</button>
          </div>
          <div id="todayCard">${TRV.factCard(todayFact, { open: true, big: true })}</div>
        </div>
      </section>

      <section class="quick-grid">
        <a class="quick" href="#/random"><span class="qi">🎰</span><span><b>冷知識轉蛋</b><small>先看問題猜猜看，再翻面揭曉</small></span></a>
        <a class="quick" href="#/quiz"><span class="qi">🤔</span><span><b>真的假的？挑戰</b><small>是非題連答，測測你的冷知識力</small></span></a>
        <a class="quick" href="#/browse"><span class="qi">📚</span><span><b>冷知識圖書館</b><small>依分類、標籤、冷度慢慢逛</small></span></a>
        <a class="quick" href="#/me"><span class="qi">⭐</span><span><b>我的收藏與徽章</b><small>收藏 ${favs} 則 · 徽章 ${badges} 枚</small></span></a>
      </section>

      <section class="sec">
        <div class="sec-hd"><h2>📚 ${cats.length} 大分類</h2><a href="#/browse" class="sec-link">逛全部 ${TRV.fmtNum(total)} 則 →</a></div>
        <div class="cat-grid">${cats.map(catCard).join('')}</div>
      </section>

      <section class="sec">
        <div class="sec-hd"><h2>🧊 極冷精選</h2><button type="button" class="btn sm" id="coldRefresh">🔄 換一批</button></div>
        <div class="fact-grid" id="coldPicks">${coldPicks(3).map((f) => TRV.factCard(f)).join('')}</div>
      </section>

      <section class="home-cta">
        <span class="cta-ic" aria-hidden="true">📮</span>
        <div><b>你也知道什麼冷知識嗎？</b><p>投稿給我們，編輯查證後就會收錄，卡片上還會掛上你的名字 ✍️${TRV.communityFacts && TRV.communityFacts().length ? `（已收錄 ${TRV.communityFacts().length} 則讀者投稿）` : ''}</p></div>
        <a class="btn primary" href="#/submit">📮 我要投稿</a>
      </section>`;

    let stopSeen = TRV.observeSeen(main);
    TRV.onCleanup(() => stopSeen());
    TRV.$('#todayShuffle', main).addEventListener('click', () => {
      const pool = TRV.facts().filter((f) => f.id !== todayFact.id && !TRV.isSeen(f.id));
      todayFact = TRV.pick(pool.length ? pool : TRV.facts());
      TRV.$('#todayLabel', main).textContent = '🎲 隨機冷知識';
      TRV.$('#todayCard', main).innerHTML = TRV.factCard(todayFact, { open: true, big: true });
      stopSeen.watch(TRV.$('#todayCard', main));
    });
    TRV.$('#coldRefresh', main).addEventListener('click', () => {
      const box = TRV.$('#coldPicks', main);
      box.innerHTML = coldPicks(3).map((f) => TRV.factCard(f)).join('');
      stopSeen.watch(box);
    });
  });

  // ---------------------------------------------------------------------------
  // 📚 冷知識圖書館
  // ---------------------------------------------------------------------------
  function sortFacts(list, sort, seed) {
    if (sort === 'cold') return list.slice().sort((a, b) => b.cold - a.cold || (a.id < b.id ? -1 : 1));
    if (sort === 'unread') return list.slice().sort((a, b) => (TRV.isSeen(a.id) - TRV.isSeen(b.id)) || (a.id < b.id ? -1 : 1));
    if (sort === 'random') {
      let s = seed;
      const rnd = () => { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
      return list.map((f) => ({ f, k: rnd() })).sort((a, b) => a.k - b.k).map((o) => o.f);
    }
    return list;
  }

  function browsePage(main, params, query) {
    const catId = params[0] && TRV.cat(params[0]) ? params[0] : '';
    const c = catId ? TRV.cat(catId) : null;
    const cats = TRV.cats();
    const st = {
      q: query.q || '',
      tag: query.tag || '',
      cold: ['1', '2', '3'].includes(query.cold) ? query.cold : '',
      sort: ['cold', 'unread', 'random'].includes(query.sort) ? query.sort : '',
      fav: query.fav === '1',
      community: query.community === '1',
      shown: PAGE,
      seed: Math.floor(Math.random() * 1e9),
    };
    const base = TRV.facts(catId);
    const p = TRV.catProgress(catId || undefined);
    const b = catId ? TRV.badge(catId) : null;
    const tags = TRV.catTags(catId || undefined, catId ? 16 : 24);

    main.innerHTML = `
      <div class="browse">
        <aside class="cat-side" aria-label="分類">
          <a class="cs-item ${catId ? '' : 'on'}" href="#/browse"><span>📚 全部分類</span><b>${TRV.fmtNum(TRV.total())}</b></a>
          ${cats.map((x) => {
            const xp = TRV.catProgress(x.id);
            return `<a class="cs-item ${x.id === catId ? 'on' : ''}" href="#/browse/${x.id}" style="${TRV.catStyle(x)}">
              <span>${x.icon} ${esc(x.name)}</span><b>${xp.seen ? `<em>${xp.seen}/</em>` : ''}${xp.total}</b></a>`;
          }).join('')}
        </aside>
        <section class="browse-main">
          <div class="browse-hd" style="${TRV.catStyle(c || { color: '#4f46e5', soft: '#eef2ff' })}">
            <span class="bh-ic" aria-hidden="true">${c ? c.icon : '📚'}</span>
            <div class="bh-text">
              <h1>${c ? esc(c.name) : '冷知識圖書館'} <small>${c ? esc(c.en) : 'All Fun Facts'}</small></h1>
              <p>${c ? esc(c.desc) : `全部 ${cats.length} 大類、${TRV.fmtNum(TRV.total())} 則冷知識，用分類、標籤、冷度與搜尋找你有興趣的。`}</p>
            </div>
            <div class="bh-prog">
              <span>已讀 <b>${p.seen}</b>/${p.total}${b && b.lv ? ` · ${b.icon} ${b.name}` : ''}</span>
              <span class="bar"><i style="width:${Math.round(p.pct * 100)}%"></i></span>
              <span class="bh-acts">
                <a class="btn sm" href="#/random${catId ? `?cat=${catId}` : ''}">🎰 抽${c ? '這類' : ''}轉蛋</a>
                <a class="btn sm" href="#/quiz${catId ? `?cat=${catId}` : ''}">🤔 ${c ? '挑戰這類' : '真假挑戰'}</a>
              </span>
            </div>
          </div>
          <div class="filter-bar">
            <input type="search" class="inp" id="bq" placeholder="${c ? `在「${esc(c.name)}」裡搜尋…` : '搜尋全部冷知識（例：章魚、馬拉松、OK）…'}" value="${esc(st.q)}" autocomplete="off">
            <div class="seg" id="bCold" role="group" aria-label="冷度">
              <button type="button" data-cold="" class="${st.cold ? '' : 'on'}">全部</button>
              ${[1, 2, 3].map((n) => `<button type="button" data-cold="${n}" class="${st.cold === String(n) ? 'on' : ''}" title="${TRV.COLD[n].desc}">${TRV.COLD[n].ice}</button>`).join('')}
            </div>
            <select id="bSort" class="inp sel" aria-label="排序">
              <option value="">依編號</option>
              <option value="cold" ${st.sort === 'cold' ? 'selected' : ''}>冷度高→低</option>
              <option value="unread" ${st.sort === 'unread' ? 'selected' : ''}>沒看過的優先</option>
              <option value="random" ${st.sort === 'random' ? 'selected' : ''}>隨機打亂</option>
            </select>
            <button type="button" class="chip-btn ${st.fav ? 'on' : ''}" id="bFav">⭐ 只看收藏</button>
            ${base.some((f) => f.sid || f.by) ? `<button type="button" class="chip-btn ${st.community ? 'on' : ''}" id="bCommunity">✍️ 讀者投稿</button>` : ''}
          </div>
          <div class="tag-row" id="bTags">
            <span class="tag-l">🏷️ ${c ? '子分類' : '熱門標籤'}</span>
            ${tags.map((t) => `<button type="button" class="tag-btn ${st.tag === t.tag ? 'on' : ''}" data-tag="${esc(t.tag)}">#${esc(t.tag)} <small>${t.n}</small></button>`).join('')}
          </div>
          <div class="result-meta" id="bMeta"></div>
          <div class="fact-grid" id="bList"></div>
          <div class="center"><button type="button" class="btn more" id="bMore" hidden></button></div>
        </section>
      </div>`;

    const listEl = TRV.$('#bList', main);
    const metaEl = TRV.$('#bMeta', main);
    const moreEl = TRV.$('#bMore', main);
    let stopSeen = () => {};
    TRV.onCleanup(() => stopSeen());

    function filtered() {
      const terms = st.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
      let list = base.filter((f) =>
        (!st.tag || (f.tags || []).includes(st.tag)) &&
        (!st.cold || String(f.cold) === st.cold) &&
        (!st.fav || TRV.isFav(f.id)) &&
        (!st.community || !!(f.sid || f.by)) &&
        (!terms.length || terms.every((t) => f._hay.includes(t))));
      list = sortFacts(list, st.sort, st.seed);
      return list;
    }

    function render() {
      const list = filtered();
      const shown = list.slice(0, st.shown);
      const parts = [];
      if (st.tag) parts.push(`標籤 #${esc(st.tag)}`);
      if (st.cold) parts.push(`冷度 ${TRV.COLD[st.cold].ice}`);
      if (st.fav) parts.push('只看收藏');
      if (st.community) parts.push('✍️ 讀者投稿');
      if (st.q.trim()) parts.push(`搜尋「${esc(st.q.trim())}」`);
      metaEl.innerHTML = `找到 <b>${list.length}</b> 則${parts.length ? `（${parts.join('・')}）<button type="button" class="link-btn" id="bClear">清除篩選</button>` : ''}`;
      const clear = TRV.$('#bClear', metaEl);
      if (clear) clear.onclick = () => {
        Object.assign(st, { q: '', tag: '', cold: '', fav: false, community: false, shown: PAGE });
        TRV.$('#bq', main).value = '';
        syncControls();
        update();
      };
      listEl.innerHTML = shown.length
        ? shown.map((f) => TRV.factCard(f, { showCat: !catId })).join('')
        : `<div class="card empty"><div class="empty-ic">🔍</div><p>沒有符合條件的冷知識。</p><p class="muted small">換個關鍵字，或清除篩選看看。</p></div>`;
      const left = list.length - shown.length;
      moreEl.hidden = left <= 0;
      moreEl.textContent = `顯示更多（還有 ${left} 則）`;
      stopSeen();
      stopSeen = TRV.observeSeen(listEl);
    }

    function syncControls() {
      TRV.$$('#bCold [data-cold]', main).forEach((x) => x.classList.toggle('on', x.dataset.cold === st.cold));
      TRV.$$('#bTags [data-tag]', main).forEach((x) => x.classList.toggle('on', x.dataset.tag === st.tag));
      TRV.$('#bFav', main).classList.toggle('on', st.fav);
      const cb = TRV.$('#bCommunity', main);
      if (cb) cb.classList.toggle('on', st.community);
      TRV.$('#bSort', main).value = st.sort;
    }

    function update() {
      TRV.setQuery({ q: st.q.trim(), tag: st.tag, cold: st.cold, sort: st.sort, fav: st.fav ? '1' : '', community: st.community ? '1' : '' });
      render();
    }

    const qEl = TRV.$('#bq', main);
    const onInput = TRV.debounce(() => { st.q = qEl.value; st.shown = PAGE; update(); }, 180);
    qEl.addEventListener('input', (e) => { if (!e.isComposing) onInput(); });
    qEl.addEventListener('compositionend', onInput);
    qEl.addEventListener('keydown', (e) => {
      if (TRV.isEnterSend(e)) { e.preventDefault(); st.q = qEl.value; st.shown = PAGE; update(); }
    });
    TRV.$('#bCold', main).addEventListener('click', (e) => {
      const btn = e.target.closest('[data-cold]');
      if (!btn) return;
      st.cold = btn.dataset.cold;
      st.shown = PAGE;
      syncControls();
      update();
    });
    TRV.$('#bTags', main).addEventListener('click', (e) => {
      const btn = e.target.closest('[data-tag]');
      if (!btn) return;
      st.tag = st.tag === btn.dataset.tag ? '' : btn.dataset.tag;
      st.shown = PAGE;
      syncControls();
      update();
    });
    TRV.$('#bSort', main).addEventListener('change', (e) => {
      st.sort = e.target.value;
      st.seed = Math.floor(Math.random() * 1e9);
      update();
    });
    TRV.$('#bFav', main).addEventListener('click', () => { st.fav = !st.fav; st.shown = PAGE; syncControls(); update(); });
    const commBtn = TRV.$('#bCommunity', main);
    if (commBtn) commBtn.addEventListener('click', () => { st.community = !st.community; st.shown = PAGE; syncControls(); update(); });
    moreEl.addEventListener('click', () => { st.shown += PAGE * 2; render(); });
    render();
    const on = TRV.$('.cs-item.on', main);
    if (on && on.scrollIntoView && window.matchMedia('(max-width: 900px)').matches) {
      on.scrollIntoView({ block: 'nearest', inline: 'center' });
    }
  }
  TRV.route('browse', browsePage);
  TRV.route('cat', (main, params, query) => browsePage(main, params, query));

  // ---------------------------------------------------------------------------
  // 單則冷知識
  // ---------------------------------------------------------------------------
  TRV.route('fact', (main, params) => {
    const f = TRV.fact(params[0]);
    if (!f) {
      main.innerHTML = `<div class="card empty"><div class="empty-ic">🤔</div><h3>找不到這則冷知識</h3>
        <p class="muted">它可能改了編號。去圖書館逛逛，或抽一張轉蛋吧！</p>
        <div class="row center-row"><a class="btn primary" href="#/browse">📚 冷知識圖書館</a><a class="btn" href="#/random">🎰 冷知識轉蛋</a></div></div>`;
      return;
    }
    const c = TRV.cat(f.cat);
    const nb = TRV.neighbors(f.id);
    const list = TRV.facts(f.cat);
    const idx = list.findIndex((x) => x.id === f.id) + 1;
    TRV.markSeen(f.id);
    main.innerHTML = `
      <nav class="crumb" aria-label="導覽路徑"><a href="#/browse">📚 圖書館</a><span>›</span>
        <a href="#/browse/${c.id}">${c.icon} ${esc(c.name)}</a><span>›</span><span class="muted">第 ${idx}/${list.length} 則</span></nav>
      <div class="detail-wrap" style="${TRV.catStyle(c)}">
        <div class="detail-q">❓ ${esc(f.q)}</div>
        ${TRV.factCard(f, { open: true, big: true, num: f.id, hideQ: true })}
        <div class="detail-tools">
          <a href="#/random?cat=${c.id}">🎰 抽一張${esc(c.name)}轉蛋</a>
          <a href="#/feedback?kind=content&fact=${encodeURIComponent(f.id)}">🧐 這則有錯？回報給我們</a>
        </div>
        <div class="detail-nav">
          ${nb.prev ? `<a class="dn prev" href="#/fact/${encodeURIComponent(nb.prev.id)}"><small>← 上一則</small><span>${esc(nb.prev.title)}</span></a>` : '<span></span>'}
          ${nb.next ? `<a class="dn next" href="#/fact/${encodeURIComponent(nb.next.id)}"><small>下一則 →</small><span>${esc(nb.next.title)}</span></a>` : '<span></span>'}
        </div>
        <section class="sec">
          <div class="sec-hd"><h2>${c.icon} 同分類你可能也喜歡</h2><a class="sec-link" href="#/browse/${c.id}">看全部 ${list.length} 則 →</a></div>
          <div class="fact-grid">${TRV.related(f.id, 4).map((x) => TRV.factCard(x, { showCat: false })).join('')}</div>
        </section>
      </div>`;
    const stopSeen = TRV.observeSeen(main);
    TRV.onCleanup(stopSeen);
    const onKey = (e) => {
      if (TRV.isTyping(e) || e.metaKey || e.ctrlKey || e.altKey || document.querySelector('.modal-wrap, .modal-bd.open')) return;
      if (e.key === 'ArrowLeft' && nb.prev) TRV.go(`#/fact/${encodeURIComponent(nb.prev.id)}`);
      if (e.key === 'ArrowRight' && nb.next) TRV.go(`#/fact/${encodeURIComponent(nb.next.id)}`);
    };
    document.addEventListener('keydown', onKey);
    TRV.onCleanup(() => document.removeEventListener('keydown', onKey));
  });

  // ---------------------------------------------------------------------------
  // ⭐ 我的冷知識
  // ---------------------------------------------------------------------------
  function heatmap(days) {
    const cells = [];
    const d = new Date();
    d.setDate(d.getDate() - (days - 1));
    for (let i = 0; i < days; i++) {
      const k = TRV.dayKey(d);
      const xp = (TRV.state.days[k] && TRV.state.days[k].xp) || 0;
      const lv = xp === 0 ? 0 : xp < 5 ? 1 : xp < 15 ? 2 : xp < 30 ? 3 : 4;
      cells.push(`<i class="hm lv${lv}" title="${d.getMonth() + 1}/${d.getDate()}：${xp} XP"></i>`);
      d.setDate(d.getDate() + 1);
    }
    return cells.join('');
  }

  TRV.route('me', (main) => {
    const st = TRV.state;
    const total = TRV.total();
    const rank = TRV.rank();
    const valid = (obj) => Object.keys(obj).filter((id) => TRV.fact(id));
    const favIds = valid(st.fav).sort((a, b) => st.fav[b] - st.fav[a]);
    const learnedIds = valid(st.learned).sort((a, b) => st.learned[b] - st.learned[a]);
    const knew = valid(st.knew).length;
    const q = st.quiz;
    const acc = q.answered ? Math.round((q.correct / q.answered) * 100) : 0;
    const cats = TRV.cats();
    const nextNeed = rank.next ? Math.max(0, rank.next.min - rank.seen) : 0;
    const span = rank.next ? Math.max(1, rank.next.min - (TRV.RANKS.slice().reverse().find((r) => rank.seen >= r.min) || TRV.RANKS[0]).min) : 1;
    const pct = rank.next ? TRV.clamp(1 - nextNeed / span, 0, 1) : 1;
    main.innerHTML = `
      <section class="page-hd"><div><h1>⭐ 我的冷知識</h1><p class="muted">學習紀錄只存在這台裝置的瀏覽器（localStorage），不需要登入。</p></div></section>
      <section class="me-hero card">
        <div class="me-rank"><span class="me-rank-ic">${rank.icon}</span><div><small>目前稱號</small><b>${esc(rank.name)}</b>
          <span class="muted small">${rank.next ? `再讀 ${nextNeed} 則升級為「${rank.next.icon} ${esc(rank.next.name)}」` : '你已經讀完全部冷知識，太神啦！'}</span>
          <span class="bar"><i style="width:${Math.round(pct * 100)}%"></i></span></div></div>
        <div class="me-stats">
          <div><b>${rank.seen}<small>/${total}</small></b><span>📖 已讀</span></div>
          <div><b>${learnedIds.length}</b><span>🤯 長知識了</span></div>
          <div><b>${knew}</b><span>😎 早就知道</span></div>
          <div><b>${favIds.length}</b><span>⭐ 收藏</span></div>
          <div><b>${q.answered ? `${acc}%` : '—'}</b><span>🤔 挑戰正確率</span></div>
          <div><b>${q.bestStreak || 0}</b><span>🔥 最佳連對</span></div>
          <div><b>${TRV.streak()}</b><span>📅 連續天數</span></div>
          <div><b>${TRV.fmtNum(TRV.totalXP())}</b><span>✨ 累積 XP</span></div>
        </div>
      </section>
      <section class="sec card">
        <div class="sec-hd"><h2>📅 最近 8 週學習日曆</h2><span class="muted small">讀冷知識 +1 XP、答對挑戰 +2 XP</span></div>
        <div class="heat">${heatmap(56)}</div>
      </section>
      <section class="sec">
        <div class="sec-hd"><h2>🏅 分類徽章</h2><span class="muted small">每類讀 10 則 🥉、20 則 🥈、全部讀完 🥇</span></div>
        <div class="badge-grid">${cats.map((c) => {
          const bd = TRV.badge(c.id);
          const p = TRV.catProgress(c.id);
          return `<a class="badge-card lv${bd.lv}" href="#/browse/${c.id}" style="${TRV.catStyle(c)}">
            <span class="bc-ic">${c.icon}</span><b>${esc(c.name)}</b><span class="bc-medal">${bd.icon} ${bd.name}</span>
            <span class="bar"><i style="width:${Math.round(p.pct * 100)}%"></i></span><small>${p.seen}/${p.total}</small></a>`;
        }).join('')}</div>
      </section>
      <section class="sec">
        <div class="sec-hd"><h2>⭐ 我的收藏（${favIds.length}）</h2>${favIds.length ? '<a class="sec-link" href="#/browse?fav=1">在圖書館篩選 →</a>' : ''}</div>
        ${favIds.length ? `<div class="fact-grid">${favIds.map((id) => TRV.factCard(TRV.fact(id))).join('')}</div>`
          : '<div class="card empty"><div class="empty-ic">☆</div><p>還沒有收藏。看到喜歡的冷知識，按右上角的 ☆ 就能收進來。</p><a class="btn primary" href="#/random">🎰 去抽一張</a></div>'}
      </section>
      ${learnedIds.length ? `<section class="sec card"><div class="sec-hd"><h2>🤯 最近長知識的冷知識</h2></div>
        <ul class="mini-list">${learnedIds.slice(0, 12).map((id) => {
          const f = TRV.fact(id);
          const c = TRV.cat(f.cat);
          return `<li><a href="#/fact/${encodeURIComponent(id)}"><span>${c.icon}</span>${esc(f.title)}</a></li>`;
        }).join('')}</ul></section>` : ''}
      <section class="sec danger-zone">
        <div><b>🗑️ 清除學習紀錄</b><p class="muted small">清除已讀、收藏、反應、挑戰成績與學習日曆（無法復原）。</p></div>
        <button type="button" class="btn danger" id="meReset">清除全部紀錄</button>
      </section>`;
    TRV.$('#meReset', main).addEventListener('click', async () => {
      if (await TRV.confirm('確定要清除全部學習紀錄嗎？已讀、收藏與挑戰成績都會歸零。', '確定清除')) {
        TRV.resetState();
        TRV.toast('已清除學習紀錄', 'ok');
        TRV.renderRoute();
      }
    });
  });
})();

</script>
  <script>/* js/random.js */
/* 冷知識學院 — random.js
 * 🎰 冷知識轉蛋（#/random?cat=animals,space&cold=3）：轉一顆膠囊 → 先看問題猜猜看 → 揭曉答案與原因。
 * 鍵盤：空白鍵／Enter 揭曉或下一顆、→ 下一顆。
 */
(function () {
  'use strict';
  const TRV = window.TRV;
  const esc = TRV.esc;
  const recent = [];

  TRV.route('random', (main, params, query) => {
    const cats = TRV.cats();
    const meta = TRV.state.meta;
    const st = {
      cats: new Set((query.cat || '').split(',').filter((id) => TRV.cat(id))),
      cold: ['1', '2', '3'].includes(query.cold) ? query.cold : '',
      unseen: query.all === '1' ? false : meta.gachaUnseen !== false,
      cur: null,
      revealed: false,
      session: { n: 0, learned: 0, knew: 0 },
      busy: false,
    };

    main.innerHTML = `
      <section class="page-hd"><div><h1>🎰 冷知識轉蛋</h1>
        <p class="muted">轉一顆膠囊，先看問題猜一猜，再揭曉答案！<kbd>空白鍵</kbd> 揭曉／下一顆、<kbd>→</kbd> 直接下一顆。</p></div></section>
      <div class="gacha">
        <div class="gacha-filters card">
          <div class="gf-row"><span class="gf-l">分類</span><div class="chips" id="gCats">
            <button type="button" class="chip-btn ${st.cats.size ? '' : 'on'}" data-cat="">全部</button>
            ${cats.map((c) => `<button type="button" class="chip-btn ${st.cats.has(c.id) ? 'on' : ''}" data-cat="${c.id}" style="${TRV.catStyle(c)}">${c.icon} ${esc(c.name)}</button>`).join('')}
          </div></div>
          <div class="gf-row"><span class="gf-l">冷度</span>
            <div class="seg" id="gCold">
              <button type="button" data-cold="" class="${st.cold ? '' : 'on'}">全部</button>
              ${[1, 2, 3].map((n) => `<button type="button" data-cold="${n}" class="${st.cold === String(n) ? 'on' : ''}" title="${TRV.COLD[n].desc}">${TRV.COLD[n].ice} ${TRV.COLD[n].label}</button>`).join('')}
            </div>
            <label class="chk"><input type="checkbox" id="gUnseen" ${st.unseen ? 'checked' : ''}> 只抽沒看過的</label>
            <span class="muted small" id="gPool"></span>
          </div>
        </div>
        <div class="gacha-stage">
          <div class="machine" id="gMachine" aria-hidden="true">
            <div class="dome">${Array.from({ length: 9 }, (_, i) => `<i class="ball b${i + 1}"></i>`).join('')}</div>
            <div class="base"><span class="knob"></span><span class="slot"></span></div>
            <span class="drop-cap"></span>
          </div>
          <div class="gacha-main">
            <div class="q-card card" id="gQ"></div>
            <div class="g-answer" id="gAns" hidden></div>
            <div class="gacha-ctrl">
              <button type="button" class="btn big" id="gReveal">👀 揭曉答案</button>
              <button type="button" class="btn big primary" id="gNext">🎰 再轉一顆</button>
            </div>
            <div class="gacha-session muted small" id="gSession"></div>
          </div>
        </div>
      </div>`;

    const qEl = TRV.$('#gQ', main);
    const ansEl = TRV.$('#gAns', main);
    const revealBtn = TRV.$('#gReveal', main);
    const machine = TRV.$('#gMachine', main);
    let alive = true;
    let spinTimer = null;

    function pool() {
      let list = TRV.facts().filter((f) => (!st.cats.size || st.cats.has(f.cat)) && (!st.cold || String(f.cold) === st.cold));
      const all = list.length;
      if (st.unseen) list = list.filter((f) => !TRV.isSeen(f.id));
      return { list, all };
    }

    function updatePool() {
      const p = pool();
      TRV.$('#gPool', main).textContent = st.unseen ? `沒看過的 ${p.list.length}／${p.all} 則` : `共 ${p.all} 則`;
      TRV.setQuery({ cat: Array.from(st.cats).join(','), cold: st.cold, all: st.unseen ? '' : '1' });
    }

    function sessionText() {
      const s = st.session;
      TRV.$('#gSession', main).textContent = s.n
        ? `本次已轉 ${s.n} 顆 · 🤯 長知識 ${s.learned} · 😎 早就知道 ${s.knew} · 累計轉蛋 ${TRV.state.draws || 0} 次`
        : `累計轉蛋 ${TRV.state.draws || 0} 次`;
    }

    function showQuestion(f) {
      const c = TRV.cat(f.cat);
      st.cur = f;
      st.revealed = false;
      qEl.style.cssText = TRV.catStyle(c);
      qEl.innerHTML = `<div class="q-top">${TRV.catBadge(c, false)}${TRV.coldBadge(f.cold)}<span class="muted small">#${st.session.n}</span></div>
        <p class="q-text">❓ ${esc(f.q)}</p>
        <p class="q-hint muted small">先在心裡猜一下答案，再按「揭曉答案」</p>`;
      ansEl.hidden = true;
      ansEl.innerHTML = '';
      revealBtn.hidden = false;
      qEl.classList.remove('pop');
      void qEl.offsetWidth;
      qEl.classList.add('pop');
    }

    function reveal() {
      if (!st.cur || st.revealed) return;
      st.revealed = true;
      ansEl.innerHTML = TRV.factCard(st.cur, { open: true, big: true, hideQ: true });
      ansEl.hidden = false;
      revealBtn.hidden = true;
      TRV.markSeen(st.cur.id);
      TRV.refreshCards(st.cur.id);
      const q = TRV.$('.q-hint', qEl);
      if (q) q.textContent = '答案揭曉！覺得有收穫就按「🤯 長知識了」';
    }

    function next() {
      if (st.busy) return;
      let { list } = pool();
      if (!list.length) {
        if (st.unseen) {
          TRV.toast('這個範圍的冷知識你都看過了，改成全部隨機抽', 'ok');
          st.unseen = false;
          meta.gachaUnseen = false;
          TRV.$('#gUnseen', main).checked = false;
          TRV.save();
          updatePool();
          list = pool().list;
        }
        if (!list.length) {
          qEl.innerHTML = '<div class="empty"><div class="empty-ic">🫙</div><p>這個條件沒有冷知識，換個分類或冷度吧。</p></div>';
          ansEl.hidden = true;
          revealBtn.hidden = true;
          return;
        }
      }
      const fresh = list.filter((f) => !recent.includes(f.id) && (!st.cur || f.id !== st.cur.id));
      const f = TRV.pick(fresh.length ? fresh : list);
      recent.push(f.id);
      if (recent.length > 40) recent.shift();
      st.busy = true;
      const cap = TRV.$('.drop-cap', machine);
      cap.style.background = (TRV.cat(f.cat) || {}).color || '#4f46e5';
      machine.classList.remove('spin');
      void machine.offsetWidth;
      machine.classList.add('spin');
      spinTimer = setTimeout(() => {
        spinTimer = null;
        if (!alive) return;
        st.busy = false;
        st.session.n += 1;
        TRV.state.draws = (TRV.state.draws || 0) + 1;
        TRV.save();
        showQuestion(f);
        sessionText();
        updatePool();
      }, 520);
    }

    TRV.$('#gCats', main).addEventListener('click', (e) => {
      const b = e.target.closest('[data-cat]');
      if (!b) return;
      const id = b.dataset.cat;
      if (!id) st.cats.clear();
      else if (st.cats.has(id)) st.cats.delete(id);
      else st.cats.add(id);
      TRV.$$('#gCats [data-cat]', main).forEach((x) => x.classList.toggle('on', x.dataset.cat ? st.cats.has(x.dataset.cat) : !st.cats.size));
      updatePool();
    });
    TRV.$('#gCold', main).addEventListener('click', (e) => {
      const b = e.target.closest('[data-cold]');
      if (!b) return;
      st.cold = b.dataset.cold;
      TRV.$$('#gCold [data-cold]', main).forEach((x) => x.classList.toggle('on', x.dataset.cold === st.cold));
      updatePool();
    });
    TRV.$('#gUnseen', main).addEventListener('change', (e) => {
      st.unseen = e.target.checked;
      meta.gachaUnseen = st.unseen;
      TRV.save();
      updatePool();
    });
    revealBtn.addEventListener('click', reveal);
    qEl.addEventListener('click', (e) => { if (!e.target.closest('a,button')) reveal(); });
    TRV.$('#gNext', main).addEventListener('click', next);
    machine.addEventListener('click', next);

    const onAction = ({ id, act }) => {
      if (!st.cur || id !== st.cur.id) return;
      const r = TRV.reaction(id);
      if (act === 'learned' && r === 'learned') st.session.learned += 1;
      if (act === 'knew' && r === 'knew') st.session.knew += 1;
      sessionText();
    };
    TRV.on('fact-action', onAction);
    const onKey = (e) => {
      if (TRV.isTyping(e) || e.metaKey || e.ctrlKey || e.altKey || TRV.isComposing(e)) return;
      if (document.querySelector('.modal-wrap, .modal-bd.open, .rel-bd.open')) return;
      if (e.key === ' ' || e.key === 'Enter') {
        if (e.target && e.target.closest && e.target.closest('button,a,summary')) return;
        e.preventDefault();
        if (st.cur && !st.revealed) reveal();
        else next();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        next();
      }
    };
    document.addEventListener('keydown', onKey);
    TRV.onCleanup(() => {
      alive = false;
      if (spinTimer) clearTimeout(spinTimer);
      document.removeEventListener('keydown', onKey);
      TRV.off('fact-action', onAction);
      st.cur = null;
    });

    updatePool();
    sessionText();
    next();
  });
})();

</script>
  <script>/* js/quiz.js */
/* 冷知識學院 — quiz.js
 * 🤔 真的假的？挑戰（#/quiz）：從冷知識的 tf 敘述出題，判斷真假後立刻看解析；錯題自動進入錯題本。
 * 鍵盤：← / T / 1 = 真的、→ / F / 2 = 假的、Enter = 下一題。
 */
(function () {
  'use strict';
  const TRV = window.TRV;
  const esc = TRV.esc;

  function cfg() {
    const c = TRV.state.meta.quizCfg || {};
    return {
      cats: Array.isArray(c.cats) ? c.cats.filter((id) => TRV.cat(id)) : [],
      n: [10, 20, 30].includes(c.n) ? c.n : 10,
      cold: ['1', '2', '3'].includes(c.cold) ? c.cold : '',
    };
  }

  function verdict(pct) {
    if (pct >= 90) return { icon: '🏆', name: '冷知識大師', msg: '幾乎全對，你根本是行走的百科全書！' };
    if (pct >= 70) return { icon: '🎓', name: '很有料', msg: '表現亮眼，再挑戰更冷的題目吧！' };
    if (pct >= 50) return { icon: '👍', name: '還不錯', msg: '過半答對，多讀幾則冷知識就能更上一層樓。' };
    return { icon: '🐣', name: '再接再厲', msg: '冷知識就是要「沒想到」才好玩，去轉蛋多抽幾顆吧！' };
  }

  TRV.route('quiz', (main, params, query) => {
    if (query && query.cat) {
      const preset = String(query.cat).split(',').filter((id) => TRV.cat(id));
      if (preset.length) {
        TRV.state.meta.quizCfg = { ...cfg(), cats: preset };
        TRV.save();
      }
      TRV.setQuery({});
    }
    let keyHandler = null;
    const setKey = (fn) => {
      if (keyHandler) document.removeEventListener('keydown', keyHandler);
      keyHandler = fn;
      if (fn) document.addEventListener('keydown', fn);
    };
    TRV.onCleanup(() => setKey(null));
    const blocked = (e) => TRV.isTyping(e) || e.metaKey || e.ctrlKey || e.altKey || TRV.isComposing(e) ||
      !!document.querySelector('.modal-wrap, .modal-bd.open, .rel-bd.open');

    function setup() {
      const c = cfg();
      const cats = TRV.cats();
      const q = TRV.state.quiz;
      const wrongIds = Object.keys(q.wrong || {}).filter((id) => TRV.fact(id));
      const acc = q.answered ? Math.round((q.correct / q.answered) * 100) : 0;
      main.innerHTML = `
        <section class="page-hd"><div><h1>🤔 真的假的？挑戰</h1>
          <p class="muted">每題一句冷知識敘述，判斷它是真的還是假的！答完立刻看解析，答錯的題目會收進錯題本。</p></div></section>
        <div class="quiz-setup card">
          <div class="qs-row"><span class="gf-l">題目範圍</span><div class="chips" id="qCats">
            <button type="button" class="chip-btn ${c.cats.length ? '' : 'on'}" data-cat="">全部分類</button>
            ${cats.map((x) => `<button type="button" class="chip-btn ${c.cats.includes(x.id) ? 'on' : ''}" data-cat="${x.id}" style="${TRV.catStyle(x)}">${x.icon} ${esc(x.name)}</button>`).join('')}
          </div></div>
          <div class="qs-row"><span class="gf-l">題數</span><div class="seg" id="qN">
            ${[10, 20, 30].map((n) => `<button type="button" data-n="${n}" class="${c.n === n ? 'on' : ''}">${n} 題</button>`).join('')}
          </div>
          <span class="gf-l" style="margin-left:8px">冷度</span><div class="seg" id="qCold">
            <button type="button" data-cold="" class="${c.cold ? '' : 'on'}">全部</button>
            ${[1, 2, 3].map((n) => `<button type="button" data-cold="${n}" class="${c.cold === String(n) ? 'on' : ''}">${TRV.COLD[n].ice} ${TRV.COLD[n].label}</button>`).join('')}
          </div></div>
          <div class="qs-actions">
            <button type="button" class="btn big primary" id="qStart">🚀 開始挑戰</button>
            <button type="button" class="btn big" id="qWrong" ${wrongIds.length ? '' : 'disabled'}>📕 錯題複習（${wrongIds.length} 題）</button>
            <span class="muted small" id="qPool"></span>
          </div>
        </div>
        <div class="quiz-records">
          <div class="rec card"><b>${q.best ? `${q.best}%` : '—'}</b><span>🏆 最佳成績（10 題以上）</span></div>
          <div class="rec card"><b>${q.bestStreak || 0}</b><span>🔥 最佳連對</span></div>
          <div class="rec card"><b>${q.rounds || 0}</b><span>🎯 完成輪數</span></div>
          <div class="rec card"><b>${q.answered ? `${acc}%` : '—'}</b><span>📊 總正確率（${q.answered || 0} 題）</span></div>
        </div>`;

      const save = () => { TRV.state.meta.quizCfg = c; TRV.save(); updatePool(); };
      const pool = () => TRV.facts().filter((f) => f.tf && (!c.cats.length || c.cats.includes(f.cat)) && (!c.cold || String(f.cold) === c.cold));
      function updatePool() {
        const n = pool().length;
        TRV.$('#qPool', main).textContent = `題庫 ${n} 題${n < c.n ? `（不足 ${c.n} 題，會全部出完）` : ''}`;
        TRV.$('#qStart', main).disabled = n === 0;
      }
      TRV.$('#qCats', main).addEventListener('click', (e) => {
        const b = e.target.closest('[data-cat]');
        if (!b) return;
        const id = b.dataset.cat;
        if (!id) c.cats = [];
        else if (c.cats.includes(id)) c.cats = c.cats.filter((x) => x !== id);
        else c.cats.push(id);
        TRV.$$('#qCats [data-cat]', main).forEach((x) => x.classList.toggle('on', x.dataset.cat ? c.cats.includes(x.dataset.cat) : !c.cats.length));
        save();
      });
      TRV.$('#qN', main).addEventListener('click', (e) => {
        const b = e.target.closest('[data-n]');
        if (!b) return;
        c.n = Number(b.dataset.n);
        TRV.$$('#qN [data-n]', main).forEach((x) => x.classList.toggle('on', x === b));
        save();
      });
      TRV.$('#qCold', main).addEventListener('click', (e) => {
        const b = e.target.closest('[data-cold]');
        if (!b) return;
        c.cold = b.dataset.cold;
        TRV.$$('#qCold [data-cold]', main).forEach((x) => x.classList.toggle('on', x === b));
        save();
      });
      TRV.$('#qStart', main).addEventListener('click', () => play(TRV.shuffle(pool()).slice(0, c.n), '一般挑戰'));
      TRV.$('#qWrong', main).addEventListener('click', () => {
        const list = TRV.shuffle(wrongIds.map((id) => TRV.fact(id))).slice(0, 30);
        if (list.length) play(list, '錯題複習');
      });
      updatePool();
      setKey((e) => {
        if (blocked(e)) return;
        if (TRV.isEnterSend(e) && !(e.target && e.target.closest && e.target.closest('button,a'))) {
          e.preventDefault();
          TRV.$('#qStart', main).click();
        }
      });
    }

    function play(list, mode) {
      const s = { list, i: 0, score: 0, streak: 0, best: 0, answers: [], answered: false, xp0: TRV.totalXP() };
      main.innerHTML = `<div class="quiz-play card" id="qp"></div>`;
      const box = TRV.$('#qp', main);

      function renderQ() {
        const f = s.list[s.i];
        const c = TRV.cat(f.cat);
        s.answered = false;
        box.style.cssText = TRV.catStyle(c);
        box.innerHTML = `
          <div class="qp-top">
            <span class="qp-mode">${esc(mode)}</span>
            <span>第 <b>${s.i + 1}</b>/${s.list.length} 題</span>
            <span class="qp-bar"><i style="width:${Math.round((s.i / s.list.length) * 100)}%"></i></span>
            <span title="答對題數">✅ ${s.score}</span>
            <span class="qp-streak ${s.streak >= 3 ? 'hot' : ''}" title="目前連對">🔥 ${s.streak}</span>
          </div>
          <div class="qp-q">
            <div class="q-top">${TRV.catBadge(c, false)}${TRV.coldBadge(f.cold)}</div>
            <p class="qp-stmt">「${esc(f.tf.s)}」</p>
            <p class="muted small">這句話是真的還是假的？</p>
          </div>
          <div class="qp-btns">
            <button type="button" class="tf-btn yes" data-a="1"><span>⭕</span>真的<kbd>←</kbd></button>
            <button type="button" class="tf-btn no" data-a="0"><span>❌</span>假的<kbd>→</kbd></button>
          </div>
          <div class="qp-fb" id="qpFb" hidden></div>`;
        TRV.$$('.tf-btn', box).forEach((b) => b.addEventListener('click', () => answer(b.dataset.a === '1')));
      }

      function answer(saysTrue) {
        if (s.answered) return;
        s.answered = true;
        const f = s.list[s.i];
        const ok = saysTrue === f.tf.a;
        if (ok) { s.score += 1; s.streak += 1; s.best = Math.max(s.best, s.streak); } else s.streak = 0;
        s.answers.push({ f, ok, saysTrue });
        TRV.recordQuiz(f.id, ok);
        TRV.$$('.tf-btn', box).forEach((b) => {
          const isTrueBtn = b.dataset.a === '1';
          b.disabled = true;
          if (isTrueBtn === f.tf.a) b.classList.add('correct');
          if (isTrueBtn === saysTrue && !ok) b.classList.add('wrong');
        });
        const fb = TRV.$('#qpFb', box);
        const last = s.i === s.list.length - 1;
        fb.innerHTML = `<div class="fb-head ${ok ? 'ok' : 'bad'}"><span>${ok ? '✅ 答對了！' : '❌ 答錯了！'}這句話是<b>${f.tf.a ? '真的' : '假的'}</b>。</span>
            ${ok && s.streak >= 3 ? `<span class="combo">🔥 ${s.streak} 連對！</span>` : ''}</div>
          ${TRV.factCard(f, { open: true })}
          <div class="row end"><button type="button" class="btn primary big" id="qpNext">${last ? '🏁 看成績' : '下一題 →'} <kbd>Enter</kbd></button></div>`;
        fb.hidden = false;
        TRV.$('.qp-top .qp-streak', box).textContent = `🔥 ${s.streak}`;
        TRV.$('#qpNext', box).addEventListener('click', nextQ);
        fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }

      function nextQ() {
        if (!s.answered) return;
        s.i += 1;
        if (s.i >= s.list.length) result();
        else { renderQ(); box.scrollIntoView({ block: 'nearest' }); }
      }

      function result() {
        const n = s.list.length;
        const pct = Math.round((s.score / n) * 100);
        TRV.finishQuiz(s.score, n, s.best);
        const v = verdict(pct);
        const gained = TRV.totalXP() - s.xp0;
        setKey(null);
        main.innerHTML = `
          <div class="quiz-result card">
            <div class="qr-ic">${v.icon}</div>
            <h1>${s.score} / ${n}</h1>
            <p class="qr-name">${esc(v.name)} · 正確率 ${pct}%</p>
            <p class="muted">${esc(v.msg)}</p>
            <div class="qr-stats"><span>🔥 本輪最佳連對 <b>${s.best}</b></span><span>✨ 獲得 <b>${gained}</b> XP</span><span>📕 錯題本 <b>${Object.keys(TRV.state.quiz.wrong).length}</b> 題</span></div>
            <div class="row center-row">
              <button type="button" class="btn big primary" id="qrAgain">🔁 再來一輪</button>
              <button type="button" class="btn big" id="qrSetup">⚙️ 調整範圍</button>
              <a class="btn big" href="#/random">🎰 去轉蛋</a>
            </div>
          </div>
          <section class="sec card">
            <div class="sec-hd"><h2>📝 本輪題目回顧</h2></div>
            <ol class="review-list">${s.answers.map((a) => {
              const c = TRV.cat(a.f.cat);
              return `<li class="${a.ok ? 'ok' : 'bad'}"><span class="rv-mark">${a.ok ? '✅' : '❌'}</span>
                <div><p>「${esc(a.f.tf.s)}」<b class="rv-ans">${a.f.tf.a ? '真的' : '假的'}</b></p>
                <a href="#/fact/${encodeURIComponent(a.f.id)}" class="small">${c.icon} ${esc(a.f.title)} →</a></div></li>`;
            }).join('')}</ol>
          </section>`;
        TRV.$('#qrAgain', main).addEventListener('click', () => {
          if (mode === '錯題複習') {
            const ids = Object.keys(TRV.state.quiz.wrong).filter((id) => TRV.fact(id));
            if (!ids.length) { TRV.toast('🎉 錯題本已經清空了！', 'ok'); setup(); return; }
            play(TRV.shuffle(ids.map((id) => TRV.fact(id))).slice(0, 30), mode);
          } else {
            const c = cfg();
            const pool = TRV.facts().filter((f) => f.tf && (!c.cats.length || c.cats.includes(f.cat)) && (!c.cold || String(f.cold) === c.cold));
            play(TRV.shuffle(pool).slice(0, c.n), mode);
          }
        });
        TRV.$('#qrSetup', main).addEventListener('click', setup);
        window.scrollTo({ top: 0, behavior: 'auto' });
      }

      setKey((e) => {
        if (blocked(e)) return;
        const k = e.key;
        if (!s.answered) {
          if (k === 'ArrowLeft' || k === 't' || k === 'T' || k === '1') { e.preventDefault(); answer(true); }
          else if (k === 'ArrowRight' || k === 'f' || k === 'F' || k === '2') { e.preventDefault(); answer(false); }
        } else if (k === 'Enter' || k === 'ArrowRight') {
          if (e.target && e.target.closest && e.target.closest('a,summary')) return;
          e.preventDefault();
          nextQ();
        }
      });
      renderQ();
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    setup();
  });
})();

</script>
  <script>/* js/feedback.js */
/* 冷知識學院 — feedback.js
 * 💬 意見回饋 #/feedback（極簡三欄：類型／標題／內容描述）。
 * 本機伺服器模式 → POST api/feedback（寄信至站長並存檔）；
 * GitHub Pages／離線單檔模式 → FormSubmit AJAX，失敗時提供 mailto 一鍵寄信。
 * 本機快取鍵名統一使用 `trv.feedback.v1`。
 */
(function () {
  'use strict';
  const TRV = window.TRV;
  const esc = TRV.esc;
  const TARGET = 'okayell@hotmail.com';
  const LS_KEY = 'trv.feedback.v1';
  const KINDS = [
    { id: 'content', label: '🧐 內容勘誤' },
    { id: 'feature', label: '✨ 功能建議' },
    { id: 'bug', label: '🐛 問題回報' },
    { id: 'other', label: '💬 其他' },
  ];
  const HINTS = {
    submit: { t: '一句話寫出冷知識（例：海獺睡覺時會手牽手）', d: '請寫下冷知識內容、你覺得它屬於哪個分類，若有出處（書名、網站、新聞）也一併附上，我們查證後收錄。' },
    content: { t: '哪一則需要修正（例：ani-012 數字有誤）', d: '請附上冷知識編號或標題、哪裡有誤，以及正確說法與出處。' },
    feature: { t: '一句話說明你的建議', d: '請描述你希望新增或改善的功能。' },
    bug: { t: '一句話描述問題', d: '請描述在哪個頁面、做了什麼操作、看到什麼狀況。' },
    other: { t: '標題', d: '想說的話都可以寫在這裡。' },
  };

  let items = null;
  let kind = 'content';
  let sending = false;

  const loadLocal = () => {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { return []; }
  };
  const saveLocal = (arr) => {
    try { localStorage.setItem(LS_KEY, JSON.stringify((arr || []).slice(0, 50))); } catch (e) { /* ignore */ }
  };
  const mailto = (kl, title, desc) =>
    `mailto:${TARGET}?subject=${encodeURIComponent(`[冷知識學院] ${kl} — ${title}`)}&body=${encodeURIComponent(
      `工具名稱：冷知識學院（開心學園）\n回饋類型：${kl}\n標題：${title}\n\n內容描述：\n${desc}\n`
    )}`;

  async function sendStatic(item) {
    try {
      const resp = await fetch(`https://formsubmit.co/ajax/${TARGET}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({
          _subject: `[冷知識學院] ${item.kind_label} — ${item.title}`,
          _template: 'table',
          _captcha: 'false',
          工具名稱: '冷知識學院',
          回饋類型: item.kind_label,
          標題: item.title,
          內容描述: item.description,
          送出時間: item.created_at,
        }),
      });
      const data = await resp.json().catch(() => ({}));
      return resp.ok && (data.success === true || data.success === 'true' || data.success === 1 || data.success === '1');
    } catch (e) {
      return false;
    }
  }

  TRV.route('feedback', (main, params, query) => {
    const local = !!(TRV.serverAvailable && !TRV.isStatic());
    if (KINDS.some((k) => k.id === query.kind)) kind = query.kind;
    if (items === null) {
      items = loadLocal();
      if (local) {
        fetch('api/feedback', { cache: 'no-store' })
          .then((r) => r.json())
          .then((res) => {
            if (res && Array.isArray(res.items)) {
              items = res.items;
              if (TRV.curRoute && TRV.curRoute.name === 'feedback') TRV.renderRoute();
            }
          })
          .catch(() => {});
      }
    }
    const h = HINTS[kind] || HINTS.other;
    const prefill = query.fact && TRV.fact(query.fact) ? TRV.fact(query.fact) : null;

    main.innerHTML = `<section class="page-hd"><div><h1>💬 意見回饋</h1><p class="muted">回報內容錯誤、許願新功能或任何建議都歡迎，送出後會寄信通知站長。想分享你知道的冷知識？請到 <a href="#/submit">📮 投稿冷知識</a>。</p></div></section>
      <div class="fb-grid">
        <form class="card fb-form" id="fbForm">
          <label class="fb-l">1. 回饋類型</label>
          <div class="chips" id="fbKinds">${KINDS.map((k) =>
            `<button type="button" class="chip-btn ${kind === k.id ? 'on' : ''}" data-k="${k.id}">${k.label}</button>`
          ).join('')}</div>
          <label class="fb-l" for="fbTitle">2. 標題</label>
          <input id="fbTitle" class="inp" required maxlength="160" placeholder="${esc(h.t)}" value="${prefill ? esc(`${prefill.id}「${prefill.title}」`) : ''}">
          <label class="fb-l" for="fbDesc">3. 內容描述</label>
          <textarea id="fbDesc" class="inp" required rows="7" maxlength="4000" placeholder="${esc(h.d)}"></textarea>
          <div id="fbBanner" class="fb-banner" hidden></div>
          <div class="row between" style="margin-top:14px"><span class="muted small">📩 送出後自動通知站長</span><button type="submit" class="btn primary" id="fbSubmit">📨 送出回饋</button></div>
        </form>
        <section class="card fb-hist"><h3>🗂️ 已送出的回饋（${items.length}）</h3><div class="fb-items">${items.map((it) =>
          `<div class="fb-item"><div class="row between"><span class="chip info">${esc(it.kind_label || it.kind)}</span><small class="muted">${esc(it.created_at || '')}</small></div>
            <b style="display:block;margin:6px 0 4px">${esc(it.title)}</b><p class="small" style="margin:0;white-space:pre-wrap">${esc(it.description)}</p></div>`
        ).join('') || '<p class="muted center" style="padding:18px 0">目前還沒有回饋紀錄，歡迎投稿第一則冷知識！</p>'}</div></section>
      </div>`;

    TRV.$('#fbKinds', main).addEventListener('click', (e) => {
      const b = e.target.closest('[data-k]');
      if (!b) return;
      kind = b.dataset.k;
      TRV.$$('[data-k]', main).forEach((x) => x.classList.toggle('on', x === b));
      const hh = HINTS[kind] || HINTS.other;
      TRV.$('#fbTitle', main).placeholder = hh.t;
      TRV.$('#fbDesc', main).placeholder = hh.d;
    });
    TRV.$('#fbTitle', main).addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !TRV.isEnterSend(e)) e.preventDefault();
    });
    TRV.$('#fbForm', main).addEventListener('submit', async (e) => {
      e.preventDefault();
      if (sending) return;
      const title = TRV.$('#fbTitle', main).value.trim();
      const desc = TRV.$('#fbDesc', main).value.trim();
      if (!title || !desc) {
        TRV.toast('請填寫標題與內容描述', 'bad');
        return;
      }
      sending = true;
      const btn = TRV.$('#fbSubmit', main);
      btn.disabled = true;
      btn.textContent = '⏳ 寄送中…';
      const k = KINDS.find((x) => x.id === kind) || KINDS[0];
      const banner = (cls, html) => {
        const b = TRV.$('#fbBanner');
        if (b) {
          b.hidden = false;
          b.className = `fb-banner ${cls}`;
          b.innerHTML = html;
        }
      };
      try {
        if (local) {
          const r = await fetch('api/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ kind, title, description: desc }),
          });
          const res = await r.json();
          if (!res.ok) throw new Error(res.error || '送出失敗');
          items = res.items || [res.item].concat(items);
          saveLocal(items);
          TRV.renderRoute();
          banner('ok', '✅ 已收到回饋並寄出通知信，感謝你！');
        } else {
          const now = new Date();
          const created = `${now.getFullYear()}-${TRV.pad(now.getMonth() + 1)}-${TRV.pad(now.getDate())} ${TRV.pad(now.getHours())}:${TRV.pad(now.getMinutes())}:${TRV.pad(now.getSeconds())}`;
          const item = {
            id: `FB-${Date.now().toString(36).toUpperCase()}`,
            kind,
            kind_label: k.label,
            title,
            description: desc,
            created_at: created,
          };
          const sent = await sendStatic(item);
          items = [item].concat(items);
          saveLocal(items);
          TRV.renderRoute();
          banner(
            'ok',
            sent
              ? '✅ 感謝回饋！已成功寄送給站長。'
              : `✅ 已記錄在本機瀏覽器；你也可以 <a href="${esc(mailto(k.label, title, desc))}">📩 一鍵開啟郵件寄給站長</a>。`
          );
        }
      } catch (err) {
        banner('warn', `⚠️ 暫時無法自動送出（${esc(err.message)}），請改點 <a href="${esc(mailto(k.label, title, desc))}">📩 直接寄信給站長</a>。`);
      } finally {
        sending = false;
        const b2 = TRV.$('#fbSubmit');
        if (b2) {
          b2.disabled = false;
          b2.textContent = '📨 送出回饋';
        }
      }
    });
  });
})();

</script>
  <script>/* js/submit.js */
/* 冷知識學院 — submit.js
 * 📮 投稿冷知識（#/submit，公開）＋ 🛡️ 投稿審核台（#/review，只在 Cloudtop 本機版）。
 *
 * 投稿送到哪裡：
 *   本機伺服器版 → POST api/submissions（直接進審核佇列，伺服器寄信通知站長）
 *   GitHub Pages／離線單檔 → 同時 ① POST 到公開轉送站 ntfy.sh（Cloudtop 每 5 分鐘自動收進審核佇列）
 *                           ② FormSubmit 寄信給站長（信裡附「匯入代碼」，審核台可一鍵匯入）
 *                           兩者都失敗才改用 mailto 讓投稿者自己寄信。
 * 審核台：🤖 AI 整理成冷知識卡（可查證）→ 人工修改 → 🔍 檢查（同 validate_content.py）→ ✅ 收錄寫入分類檔
 *        → 版本中心發布新版。收錄的冷知識帶 `by`（署名）與 `sid`，投稿者的「📮 我的投稿」會自動顯示已收錄。
 * localStorage：`trv.submits.v1`（我的投稿）。
 */
(function () {
  'use strict';
  const TRV = window.TRV;
  const esc = TRV.esc;
  const RELAY_URL = 'https://ntfy.sh/okayell_trivia_submit_v1_q7m3x9';
  const MAIL_TO = 'okayell@hotmail.com';
  const LS_KEY = 'trv.submits.v1';
  const LIM = { text: 80, detail: 600, source: 200, nick: 20 };
  let sending = false;

  TRV.isLocalServer = () => !!(TRV.serverAvailable && !TRV.isStatic());
  const mySubs = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { return []; } };
  const saveMySubs = (arr) => { try { localStorage.setItem(LS_KEY, JSON.stringify(arr.slice(0, 50))); } catch (e) { /* ignore */ } };
  TRV.communityFacts = () => TRV.facts().filter((f) => f.sid || f.by);
  const factBySid = (sid) => TRV.facts().find((f) => f.sid === sid) || null;
  const nowStr = () => {
    const d = new Date();
    return `${d.getFullYear()}-${TRV.pad(d.getMonth() + 1)}-${TRV.pad(d.getDate())} ${TRV.pad(d.getHours())}:${TRV.pad(d.getMinutes())}:${TRV.pad(d.getSeconds())}`;
  };
  const newSid = () => `sub-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;

  /** 和現有冷知識比對（雙字 Jaccard），回傳最像的幾則。 */
  const norm = (s) => String(s || '').replace(/[\s，。、；：「」『』？！（）()…—\-,.?!:;"'·]/g, '');
  const grams = (s) => { const t = norm(s); const g = new Set(); for (let i = 0; i < t.length - 1; i++) g.add(t.slice(i, i + 2)); return g; };
  let GRAM_CACHE = null;
  TRV.similarFacts = (text, n) => {
    const g = grams(text);
    if (g.size < 3) return [];
    if (!GRAM_CACHE || GRAM_CACHE.size !== TRV.total()) {
      GRAM_CACHE = new Map(TRV.facts().map((f) => [f.id, grams(f.title + String(f.fact).slice(0, 40))]));
    }
    const out = [];
    GRAM_CACHE.forEach((h, id) => {
      let inter = 0;
      g.forEach((x) => { if (h.has(x)) inter += 1; });
      if (inter < 3) return;
      const j = inter / (g.size + h.size - inter);
      if (j >= 0.22) out.push({ f: TRV.fact(id), j });
    });
    return out.sort((a, b) => b.j - a.j).slice(0, n || 3);
  };

  function previewHtml(d) {
    const c = TRV.cat(d.cat) || { icon: '💡', name: '待編輯分類', color: '#4f46e5', soft: '#eef2ff' };
    return `<article class="fact-card preview" style="${TRV.catStyle(c)}">
      <header class="fc-top"><span class="cat-badge" style="${TRV.catStyle(c)}">${c.icon} ${esc(c.name)}</span>
        ${d.cold ? TRV.coldBadge(d.cold) : '<span class="cold-badge cold-1">🧊 冷度待定</span>'}</header>
      <h3 class="fc-title">${esc(d.title || '（你的一句話冷知識會顯示在這裡）')}</h3>
      ${d.fact ? `<p class="fc-fact">${esc(d.fact)}</p>` : ''}
      ${d.why ? `<details class="fc-why" open><summary>🤔 為什麼？背後的原因</summary><p>${esc(d.why)}</p></details>` : ''}
      <footer class="fc-foot"><div class="fc-tags">${(d.tags || []).map((t) => `<span class="tag">#${esc(t)}</span>`).join('')}</div>
        ${d.by ? `<span class="fc-by">✍️ 投稿：${esc(d.by)}</span>` : '<span class="fc-by">✍️ 讀者投稿</span>'}</footer>
    </article>`;
  }

  // ---------------------------------------------------------------------------
  // 投稿送出（本機 → API；靜態 → 轉送站 + Email；都失敗 → mailto）
  // ---------------------------------------------------------------------------
  async function sendRelay(payload) {
    try {
      const r = await fetch(RELAY_URL, { method: 'POST', body: JSON.stringify(payload) });
      return r.ok;
    } catch (e) {
      return false;
    }
  }
  async function sendEmail(payload, catName) {
    try {
      const r = await fetch(`https://formsubmit.co/ajax/${MAIL_TO}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({
          _subject: `[冷知識學院] 📮 新投稿 — ${payload.text.slice(0, 40)}`,
          _template: 'table',
          _captcha: 'false',
          工具名稱: '冷知識學院（讀者投稿）',
          分類: catName,
          一句話冷知識: payload.text,
          詳細說明: payload.detail || '—',
          出處: payload.source || '—',
          暱稱: (payload.nick || '—') + (payload.credit ? '（同意署名）' : ''),
          投稿編號: payload.sid,
          匯入代碼: JSON.stringify(payload),
        }),
      });
      const data = await r.json().catch(() => ({}));
      return r.ok && [true, 'true', 1, '1'].includes(data.success);
    } catch (e) {
      return false;
    }
  }
  const mailtoHref = (payload, catName) => `mailto:${MAIL_TO}?subject=${encodeURIComponent(`[冷知識學院] 📮 投稿 — ${payload.text.slice(0, 40)}`)}&body=${encodeURIComponent(
    `分類：${catName}\n一句話冷知識：${payload.text}\n詳細說明：${payload.detail || '—'}\n出處：${payload.source || '—'}\n暱稱：${payload.nick || '—'}\n\n匯入代碼：${JSON.stringify(payload)}\n`)}`;

  async function deliver(payload) {
    const catName = (TRV.cat(payload.cat) || {}).name || '不確定';
    if (TRV.isLocalServer()) {
      const r = await fetch('api/submissions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const res = await r.json();
      if (!res.ok) throw new Error(res.error || '送出失敗');
      return { via: 'local', relay: true, email: true };
    }
    const [relay, email] = await Promise.all([sendRelay(payload), sendEmail(payload, catName)]);
    return { via: relay ? 'relay' : email ? 'email' : 'none', relay, email, mailto: mailtoHref(payload, catName) };
  }

  // ---------------------------------------------------------------------------
  // 📮 投稿冷知識（#/submit）
  // ---------------------------------------------------------------------------
  TRV.route('submit', (main) => {
    const cats = TRV.cats();
    const st = { cat: '' };
    const subs = mySubs();
    const community = TRV.communityFacts();
    main.innerHTML = `
      <section class="page-hd"><div><h1>📮 投稿冷知識</h1>
        <p class="muted">你知道什麼讓人「蛤？真的假的！」的冷知識嗎？投稿給我們，編輯查證、潤飾後就會收錄進冷知識學院，還會掛上你的名字！</p></div></section>
      <div class="sub-grid">
        <form class="card sub-form" id="subForm" novalidate>
          <label class="fb-l">1. 分類 <small class="muted">（不確定也沒關係）</small></label>
          <div class="chips" id="subCats">
            <button type="button" class="chip-btn on" data-cat="">🤷 不確定</button>
            ${cats.map((c) => `<button type="button" class="chip-btn" data-cat="${c.id}" style="${TRV.catStyle(c)}">${c.icon} ${esc(c.name)}</button>`).join('')}
          </div>
          <label class="fb-l" for="subText">2. 一句話冷知識 <b class="req">*</b> <small class="cnt" id="cntText">0/${LIM.text}</small></label>
          <input id="subText" class="inp" maxlength="${LIM.text}" placeholder="例：海獺睡覺時會手牽手，避免被海流沖散" autocomplete="off">

          <p class="sub-note">🔒 請勿填寫電話、地址等個人資料。投稿會經過公開的轉送服務交給編輯，審核通過後內容（含署名暱稱）會公開在冷知識學院。</p>

        </form>
        <aside class="sub-side">
          ${TRV.isLocalServer() ? '<a class="btn sub-review-link" href="#/review">🛡️ 前往投稿審核台</a>' : ''}
          <section class="card"><h3 class="side-h">👀 預覽</h3><div id="subPreview">${previewHtml({})}</div></section>

            ${subs.length ? `<ul class="my-subs">${subs.map((s) => {
              const f = factBySid(s.sid);
              return `<li><span class="ms-st ${f ? 'ok' : ''}">${f ? '🎉 已收錄' : '⏳ 審核中'}</span>
                <span class="ms-t">${f ? `<a href="#/fact/${encodeURIComponent(f.id)}">${esc(f.title)}</a>` : esc(s.text)}</span>

            }).join('')}</ul>` : '<p class="muted small">還沒有投稿紀錄。送出後會出現在這裡，收錄上架時會自動變成 🎉 已收錄。</p>'}

              <li><b>收錄上架</b>：新版本發布後出現在圖書館，卡片掛上 ✍️ 你的暱稱</li></ol>
            <p class="muted small">不收錄：政治與宗教爭議、謠言或查不到可靠來源的說法、已經收錄過的題目。</p>
            ${community.length ? `<a class="small" href="#/browse?community=1">✍️ 看看已收錄的 ${community.length} 則讀者投稿 →</a>` : ''}
          </section>

    const $ = (sel) => TRV.$(sel, main);
    const textEl = $('#subText');

        `<a href="#/fact/${encodeURIComponent(h.f.id)}" target="_blank" rel="noopener">${(TRV.cat(h.f.cat) || {}).icon || ''} ${esc(h.f.title)}</a>`).join('')}` : '';

    creditEl.addEventListener('change', refresh);

    $('#subForm').addEventListener('submit', async (e) => {

      <div class="seg rv-tabs" id="rvTabs"></div>

    const $ = (sel) => TRV.$(sel, main);

    function renderTabs() {

            <small>${esc(CHANNEL[it.channel] || it.channel || '')}</small><small class="muted">${esc((it.received_at || it.created_at || '').slice(5, 16))}</small></span>
          <b>${esc(it.text)}</b>
          <small class="muted">${it.nick ? `✍️ ${esc(it.nick)}` : '匿名'}${it.fact_id ? ` · ${esc(it.fact_id)}` : ''}${it.status === 'rejected' && it.note ? ` · ${esc(it.note)}` : ''}</small>
        </button>`;
      }).join('') : `<div class="card empty"><div class="empty-ic">📭</div><p>${st.tab === 'pending' ? '目前沒有待審核的投稿 🎉' : '這裡還沒有投稿'}</p></div>`;
    }

    function initialDraft(it) {
      if (it.fact) return { ...it.fact };
      if (it.draft && it.draft.title) return { ...it.draft };
      const isUrl = /https?:\/\//i.test(it.source || '');
      return {
        cat: it.cat || '', title: (it.text || '').slice(0, 32), q: '', fact: it.text || '', why: it.detail || '',
        tags: [], cold: 2, tf: { s: '', a: true }, src: isUrl ? '' : (it.source || '').slice(0, 40), by: it.credit && it.nick ? it.nick : '',
      };
    }
    const field = (k, label, lim, tag) => `<label class="rv-l" for="rv_${k}">${label} <small class="cnt" data-cnt="${k}"></small></label>
      ${tag === 'textarea' ? `<textarea id="rv_${k}" class="inp" rows="${k === 'why' ? 4 : 3}" maxlength="${lim}"></textarea>` : `<input id="rv_${k}" class="inp" maxlength="${lim}" autocomplete="off">`}`;

    function renderEditor() {
      const box = $('#rvEditor');
      const it = st.items.find((x) => x.sid === st.sel);
      if (!it) { box.innerHTML = '<div class="card empty"><p class="muted">從左邊選一則投稿開始審核。</p></div>'; return; }
      const d = initialDraft(it);
      const done = it.status === 'approved';
      box.innerHTML = `<div class="card rv-card">
        <div class="rv-orig">
          <div class="row between"><b>原始投稿</b><span class="chip ${done ? 'ok' : it.status === 'rejected' ? 'bad' : 'info'}">${STATUS[it.status || 'pending']}</span></div>
          <p class="rv-text">「${esc(it.text)}」</p>
          ${it.detail ? `<p class="rv-detail">${esc(it.detail)}</p>` : ''}
          <dl class="rv-dl"><dt>出處</dt><dd>${it.source ? (/^https?:\/\//i.test(it.source) ? `<a href="${esc(it.source)}" target="_blank" rel="noopener noreferrer">${esc(it.source)}</a>` : esc(it.source)) : '—'}</dd>
            <dt>投稿者</dt><dd>${it.nick ? esc(it.nick) : '匿名'}${it.credit ? '（同意署名）' : '（不署名）'}</dd>
            <dt>來源</dt><dd>${esc(CHANNEL[it.channel] || it.channel || '')} · ${esc(it.received_at || '')} · <code>${esc(it.sid)}</code></dd></dl>
        </div>
        ${done ? `<div class="fb-banner ok">✅ 已收錄為 <a href="#/fact/${encodeURIComponent(it.fact_id)}">${esc(it.fact_id)}</a>（${esc(it.approved_at || '')}）。</div>` : `
        <div class="rv-ai">
          ${st.ai ? `<button type="button" class="btn sm" id="rvAi">🤖 AI 查證並整理成冷知識卡</button>` : '<span class="muted small">🤖 AI 整理需要 Cloudtop 開著 Jetski</span>'}
          <span id="rvAiMsg" class="muted small"></span>
        </div>
        <div id="rvAiNotes"></div>
        <form class="rv-form" id="rvForm" novalidate>
          <div class="rv-row2">
            <div><label class="rv-l" for="rv_cat">分類</label><select id="rv_cat" class="inp"><option value="">請選擇分類</option>
              ${TRV.cats().map((c) => `<option value="${c.id}">${c.icon} ${esc(c.name)}</option>`).join('')}</select></div>
            <div><label class="rv-l">冷度</label><div class="seg" id="rv_cold">${[1, 2, 3].map((n) => `<button type="button" data-v="${n}">${TRV.COLD[n].ice} ${TRV.COLD[n].label}</button>`).join('')}</div></div>
          </div>
          ${field('title', '標題（陳述句）', 32)}
          ${field('q', '猜猜看提問（以「？」結尾）', 40)}
          ${field('fact', '答案', 160, 'textarea')}
          ${field('why', '為什麼／背景', 360, 'textarea')}
          <div class="rv-row2"><div>${field('tags', '標籤（用逗號分隔，1–4 個）', 40)}</div><div>${field('src', '出處名稱（不放網址）', 40)}</div></div>
          <label class="rv-l" for="rv_tfs">真假挑戰題 <small class="cnt" data-cnt="tfs"></small></label>
          <div class="row rv-tf"><input id="rv_tfs" class="inp" maxlength="70" autocomplete="off">
            <div class="seg" id="rv_tfa"><button type="button" data-v="1">⭕ 真的</button><button type="button" data-v="0">❌ 假的</button></div></div>
          ${field('by', '署名（留空＝不署名）', 20)}
        </form>
        <div id="rvCheck"></div>
        <div class="rv-actions">
          <button type="button" class="btn" id="rvSave">💾 暫存</button>
          <button type="button" class="btn" id="rvCheckBtn">🔍 檢查</button>
          <button type="button" class="btn primary" id="rvApprove">✅ 收錄</button>
          ${it.status === 'rejected' ? '<button type="button" class="btn" id="rvReopen">↩ 重新審核</button>' : '<button type="button" class="btn danger" id="rvReject">🚫 不收錄</button>'}
          <button type="button" class="btn danger" id="rvDelete" title="垃圾訊息直接刪除">🗑️</button>
        </div>`}
        <h4 class="rv-pv-h">👀 收錄後的樣子</h4><div id="rvPreview"></div>
      </div>`;
      if (done) { $('#rvPreview').innerHTML = previewHtml(it.fact || d); return; }
      fill(d);
      bindEditor(it);
    }

    function fill(d) {
      $('#rv_cat').value = d.cat || '';
      ['title', 'q', 'fact', 'why', 'src', 'by'].forEach((k) => { $(`#rv_${k}`).value = d[k] || ''; });
      $('#rv_tags').value = (d.tags || []).join('、');
      $('#rv_tfs').value = (d.tf && d.tf.s) || '';
      setSeg('#rv_cold', String(d.cold || 2));
      setSeg('#rv_tfa', d.tf && d.tf.a === false ? '0' : '1');
      updatePreview();
    }
    function setSeg(sel, v) { TRV.$$(`${sel} [data-v]`, main).forEach((b) => b.classList.toggle('on', b.dataset.v === v)); }
    const segVal = (sel) => { const b = TRV.$(`${sel} [data-v].on`, main); return b ? b.dataset.v : ''; };
    function collect() {
      return {
        cat: $('#rv_cat').value, title: $('#rv_title').value.trim(), q: $('#rv_q').value.trim(), fact: $('#rv_fact').value.trim(),
        why: $('#rv_why').value.trim(), tags: $('#rv_tags').value.split(/[,，、\s#]+/).map((t) => t.trim()).filter(Boolean).slice(0, 4),
        cold: Number(segVal('#rv_cold') || 2), tf: { s: $('#rv_tfs').value.trim(), a: segVal('#rv_tfa') !== '0' },
        src: $('#rv_src').value.trim(), by: $('#rv_by').value.trim(),
      };
    }
    function updatePreview() {
      const d = collect();
      $('#rvPreview').innerHTML = previewHtml(d);
      const lims = { title: [6, 32], q: [6, 40], fact: [20, 160], why: [40, 360], tfs: [6, 70] };
      Object.entries(lims).forEach(([k, [lo, hi]]) => {
        const el = TRV.$(`[data-cnt="${k}"]`, main);
        const n = (k === 'tfs' ? d.tf.s : d[k]).length;
        if (el) { el.textContent = `${n}/${hi}`; el.classList.toggle('bad', n < lo || n > hi); }
      });
    }
    function showCheck(res) {
      const box = $('#rvCheck');
      const errs = res.errors || [];
      const warns = res.warnings || [];
      const sim = res.similar || [];
      box.innerHTML = `<div class="rv-check ${errs.length ? 'bad' : 'ok'}">
        ${errs.length ? `<b>❌ 還有 ${errs.length} 個問題要修：</b><ul>${errs.map((e) => `<li>${esc(String(e).replace(/^投稿 /, ''))}</li>`).join('')}</ul>` : `<b>✅ 格式檢查通過${res.fact ? `，收錄後編號將是 ${esc(res.fact.id)}` : ''}</b>`}
        ${warns.length ? `<ul class="warn">${warns.map((w) => `<li>⚠️ ${esc(String(w).replace(/^投稿 /, ''))}</li>`).join('')}</ul>` : ''}
        ${sim.length ? `<div class="small">🔍 相似的既有冷知識：${sim.map((s) => `<a href="#/fact/${encodeURIComponent(s.id)}" target="_blank" rel="noopener">${esc(s.id)} ${esc(s.title)}（${Math.round(s.score * 100)}%）</a>`).join('、')}</div>` : ''}
      </div>`;
    }

    function bindEditor(it) {
      const form = $('#rvForm');
      form.addEventListener('input', (e) => { if (!e.isComposing) updatePreview(); });
      form.addEventListener('compositionend', updatePreview);
      form.addEventListener('change', updatePreview);
      form.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.preventDefault(); });
      ['#rv_cold', '#rv_tfa'].forEach((sel) => $(sel).addEventListener('click', (e) => {
        const b = e.target.closest('[data-v]');
        if (b) { setSeg(sel, b.dataset.v); updatePreview(); }
      }));
      $('#rvSave').onclick = async () => {
        await api('api/submissions/save', { sid: it.sid, draft: collect() });
        it.draft = collect();
        TRV.toast('💾 已暫存', 'ok');
      };
      $('#rvCheckBtn').onclick = async () => { showCheck(await api('api/submissions/check', { sid: it.sid, fact: collect() })); };
      $('#rvApprove').onclick = async () => {
        const btn = $('#rvApprove');
        btn.disabled = true;
        btn.textContent = '⏳ 收錄中…';
        try {
          const res = await api('api/submissions/approve', { sid: it.sid, fact: collect() });
          if (!res.ok) { showCheck(res); TRV.toast('還有問題要修，請看下方檢查結果', 'bad'); return; }
          if (res.item && res.item.fact && !TRV.fact(res.item.fact.id)) { TRV.FACTS.push(res.item.fact); TRV.index(); }
          TRV.toast(`✅ 已收錄為 ${res.fact_id}，記得發布新版`, 'ok');
          st.sel = it.sid;
          await load(true);
        } catch (e) {
          TRV.toast(`收錄失敗：${e.message}`, 'bad');
        } finally {
          const b2 = $('#rvApprove');
          if (b2) { b2.disabled = false; b2.textContent = '✅ 收錄'; }
        }
      };
      const rej = $('#rvReject');
      if (rej) rej.onclick = () => {
        const body = document.createElement('div');
        body.innerHTML = `<p class="muted small" style="margin:0 0 8px">不收錄的原因（只有你看得到，可留空）：</p>
          <div class="chips" style="margin-bottom:8px">${['已經收錄過', '查不到可靠來源', '內容有誤', '不適合本站'].map((r) => `<button type="button" class="chip-btn" data-r="${r}">${r}</button>`).join('')}</div>
          <input class="inp" id="rvRejNote" maxlength="200" placeholder="其他原因">`;
        body.addEventListener('click', (e) => { const b = e.target.closest('[data-r]'); if (b) TRV.$('#rvRejNote', body).value = b.dataset.r; });
        TRV.modal({ title: '🚫 不收錄這則投稿', body, actions: [{ label: '取消' }, { label: '確定不收錄', primary: true, danger: true, onClick: async () => {

          TRV.toast('已標記為不收錄', 'ok');
          await load(true);
        } }] });
      };
      const reo = $('#rvReopen');
      if (reo) reo.onclick = async () => { await api('api/submissions/reopen', { sid: it.sid }); await load(true); };

        if (!(await TRV.confirm('確定刪除這則投稿？（適合垃圾訊息，刪除後無法復原）', '刪除'))) return;
        await api('api/submissions/delete', { sid: it.sid });
        st.sel = '';
        await load(false);
      };
      const aiBtn = $('#rvAi');
      if (aiBtn) aiBtn.onclick = () => runAi(it);

    function renderNotes(n) {
      const v = VERDICT[n.verdict] || VERDICT.uncertain;
      $('#rvAiNotes').innerHTML = `<div class="rv-notes ${v.cls}"><b>${v.t}</b>${n.notes ? `<p>${esc(n.notes)}</p>` : ''}</div>`;
    }
    async function runAi(it) {
      if (st.aiBusy) return;
      st.aiBusy = true;
      const btn = $('#rvAi');
      const msg = $('#rvAiMsg');
      btn.disabled = true;
      btn.textContent = '🤖 AI 查證整理中…';
      try {
        const start = await api('api/submissions/draft', { sid: it.sid });
        if (!start.ok) throw new Error(start.error || '無法啟動 AI');
        const t0 = Date.now();
        let res = null;
        while (st.alive && Date.now() - t0 < 260000) {
          await new Promise((r) => setTimeout(r, 2000));
          res = await api(`api/submissions/task?id=${encodeURIComponent(start.task)}`);
          if (!res.ok) throw new Error(res.error || 'AI 工作遺失');
          if (res.state === 'done') break;
          if (TRV.$('#rvAiMsg', main)) TRV.$('#rvAiMsg', main).textContent = `已等待 ${res.elapsed || Math.round((Date.now() - t0) / 1000)} 秒（AI 會上網查證，約需 1–3 分鐘）`;

        if (!st.alive || st.sel !== it.sid) return;
        if (!res || res.state !== 'done') throw new Error('AI 逾時，請再試一次');

        fill({ ...d, by: $('#rv_by').value.trim() || (it.credit && it.nick ? it.nick : '') });
        st.draftNotes = { sid: it.sid, verdict: d.verdict, notes: d.notes };
        renderNotes(st.draftNotes);
        if (TRV.$('#rvAiMsg', main)) TRV.$('#rvAiMsg', main).textContent = '已填入，請人工確認後再收錄';

      } catch (e) {
        if (TRV.$('#rvAiMsg', main)) TRV.$('#rvAiMsg', main).textContent = `⚠️ ${e.message}`;
      } finally {
        st.aiBusy = false;
        const b2 = TRV.$('#rvAi', main);
        if (b2) { b2.disabled = false; b2.textContent = '🤖 AI 查證並整理成冷知識卡'; }
      }
    }

    async function checkRelease() {
      try {
        const r = await (await fetch('api/release_status', { cache: 'no-store' })).json();
        const btn = $('#rvPublish');
        if (btn) btn.hidden = !(r && r.has_changes);
      } catch (e) { /* ignore */ }
    }

    $('#rvTabs').addEventListener('click', (e) => {
      const b = e.target.closest('[data-tab]');
      if (!b) return;
      st.tab = b.dataset.tab;
      TRV.setQuery({ tab: st.tab === 'pending' ? '' : st.tab });
      const first = visible()[0];
      st.sel = first ? first.sid : '';
      renderTabs();
      renderList();
      renderEditor();
    });
    $('#rvList').addEventListener('click', (e) => {
      const b = e.target.closest('[data-sid]');
      if (!b) return;
      st.sel = b.dataset.sid;
      TRV.setQuery({ tab: st.tab === 'pending' ? '' : st.tab, sid: st.sel });
      renderList();
      renderEditor();
      if (window.matchMedia('(max-width: 900px)').matches) $('#rvEditor').scrollIntoView({ block: 'start' });
    });
    $('#rvSync').onclick = async () => {
      await api('api/submissions/sync', {});
      TRV.toast('🔄 已向轉送站要求同步，幾秒後更新', 'ok');
      setTimeout(() => { if (st.alive) load(true); }, 3500);
    };
    $('#rvImport').onclick = () => {
      const body = document.createElement('div');
      body.innerHTML = `<p class="muted small" style="margin:0 0 8px">把投稿通知信的內容整封貼上（只要包含「匯入代碼」那一行即可），可一次貼多封。</p>
        <textarea class="inp" id="rvImpText" rows="8" placeholder='匯入代碼：{"app":"trivia-submit",…}'></textarea>`;
      TRV.modal({ title: '📋 從 Email 匯入投稿', wide: true, body, actions: [{ label: '取消' }, { label: '匯入', primary: true, onClick: async () => {
        try {
          const res = await api('api/submissions/import', { text: TRV.$('#rvImpText', body).value });
          if (!res.ok) throw new Error(res.error || '匯入失敗');
          TRV.toast(`📋 找到 ${res.found} 則，新增 ${res.added} 則`, 'ok');
          await load(true);
          return false;
        } catch (e) { TRV.toast(e.message, 'bad'); return true; }
      } }] });
    };
    $('#rvPublish').onclick = () => { if (TRV.openReleaseModal) TRV.openReleaseModal(); };
    load(false);
  });
})();
