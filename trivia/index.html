    '.rel-bd{position:fixed;inset:0;z-index:115;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,42,.48);backdrop-filter:blur(3px)}',
    '.rel-bd.open{display:flex}',
    '.rel-box{position:relative;width:min(760px,100%);max-height:min(88vh,920px);display:flex;flex-direction:column;background:#fff;color:#0f172a;border:1px solid #cbd5e1;border-radius:14px;box-shadow:0 24px 60px rgba(15,23,42,.26);overflow:hidden;font-size:14px;line-height:1.55}',
    '.rel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px 12px;border-bottom:1px solid #e2e8f0;background:linear-gradient(180deg,#eef2ff 0%,#fff 100%)}',
    '.rel-title{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}',
    '.rel-ver-pill{display:inline-block;padding:2px 10px;border-radius:999px;background:#e0e7ff;border:1px solid #a5b4fc;color:#3730a3;font-size:13px;font-weight:800}',
    '.rel-sub{margin:4px 0 0;font-size:12.5px;color:#64748b}',
    '.rel-body{padding:16px 20px 22px;overflow-y:auto}',
    '.rel-card{border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;background:#f8fafc;margin:0 0 12px}',
    '.rel-card.rel-clean{background:#f0fdf4;border-color:#bbf7d0;color:#15803d;font-weight:600}',
    '.rel-card.rel-dirty{background:#fffbeb;border-color:#fde68a}',
    '.rel-card-title{font-weight:800;font-size:14.5px;margin-bottom:4px}',
    '.rel-muted{color:#64748b;font-size:12.5px}',
    '.rel-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}',
    '.rel-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 12px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;color:#0f172a;font-size:13px;font-weight:700;text-decoration:none!important;cursor:pointer}',
    '.rel-btn.rel-primary{background:#4f46e5;border-color:#4f46e5;color:#fff}',
    '.rel-chip{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:#e2e8f0;color:#334155}',
    '.rel-chip.ok{background:#dcfce7;color:#15803d}',
    '.rel-chip.warn{background:#fef3c7;color:#b45309}',
    '.rel-chip.bad{background:#fee2e2;color:#b91c1c}',
    '.rel-chip.info{background:#dbeafe;color:#1e40af}',
    '.rel-timeline{display:flex;flex-direction:column;gap:10px}',
    '.rel-item{border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;background:#fff}',
    '.rel-item.latest{border-color:#a5b4fc;background:linear-gradient(180deg,#eef2ff 0%,#fff 65%)}',
    '.rel-item-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}',
    '.rel-item-ver{font-weight:800;font-size:13.5px;padding:1px 8px;border-radius:6px;background:#f1f5f9}',
    '.rel-item-date{margin-left:auto;font-size:12px;color:#64748b}',
    '.rel-item-title{margin:4px 0 6px;font-size:15px;font-weight:800}',
    '.rel-item-list{margin:0;padding-left:18px;font-size:13.5px;color:#334155}',
    '.rel-bump-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}',
    '.rel-bump{padding:9px;border:2px solid #e2e8f0;border-radius:10px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:3px}',
    '.rel-bump.on{border-color:#4f46e5;background:#eef2ff}',
    '.rel-bump input{display:none}',
    '.rel-input{width:100%;margin-top:4px;padding:7px 10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;font-size:13px}',
    '@media (max-width:640px){.rel-bump-grid{grid-template-columns:1fr}}'
  ].join('');

  var cachedStatus = null;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function data() {
    if (!TRV.RELEASES_DATA) TRV.RELEASES_DATA = { current_version: '1.0.0', releases: [] };
    return TRV.RELEASES_DATA;
  }

  function isStaticEnv() {
    return !!(
      window.TRV_STATIC_ONLY ||
      (location.protocol !== 'http:' && location.protocol !== 'https:') ||
      /\.github\.io$|\.pages\.dev$|\.netlify\.app$|\.vercel\.app$/i.test(location.hostname || '')
    );
  }

  function isLocal(status) {
    return !!(status && status.static === false && status.current_version) && !isStaticEnv();
  }

  function currentVersion(status) {
    return (status && status.current_version) || data().current_version || '1.0.0';
  }

  function injectCss() {
    if (document.getElementById('trvRelCss')) return;
    var st = document.createElement('style');
    st.id = 'trvRelCss';
    st.textContent = CSS;
    (document.head || document.documentElement).appendChild(st);
  }

  function updateBadgeUI(status) {
    var btn = document.getElementById('verBadgeBtn');
    if (!btn) return;
    var ver = currentVersion(status);
    var local = isLocal(status);
    var dirty = local && !!status.has_changes;
    btn.classList.toggle('has-changes', dirty);
    btn.innerHTML = '<span class="rel-badge-ver">v' + esc(ver) + '</span>' +
      (dirty ? '<i class="ver-dot" aria-hidden="true"></i>' : '');
    btn.title = local
      ? (dirty ? '目前版本 v' + ver + '（有未發布變更）' : '目前版本 v' + ver + ' · 點擊查看版本與發布中心')
      : '版本 v' + ver + ' · 點擊查看 Release Notes';
  }

  async function fetchReleaseStatus() {
    if (isStaticEnv()) return null;
    try {
      var res = await fetch('api/release_status', { cache: 'no-store' });
      if (!res.ok) return null;
      var st = await res.json();
      if (!st || !st.current_version) return null;
      cachedStatus = st;
      data().current_version = st.current_version;
      if (Array.isArray(st.releases)) data().releases = st.releases;
      updateBadgeUI(cachedStatus);
      return cachedStatus;
    } catch (e) {
      return null;
    }
  }

  function historyHtml(releases) {
    if (!releases || !releases.length) return '<div class="rel-muted">尚無版本紀錄。</div>';
    return releases.map(function (r, i) {
      var b = BUMP[r.bump] || BUMP.minor;
      var items = (r.highlights || []).map(function (h) { return '<li>' + esc(h) + '</li>'; }).join('');
      return '<article class="rel-item' + (i === 0 ? ' latest' : '') + '">' +
        '<div class="rel-item-head">' +
          '<span class="rel-item-ver">v' + esc(r.version) + '</span>' +
          (i === 0 ? '<span class="rel-chip ok">目前版本</span>' : '') +
          '<span class="rel-chip ' + b.cls + '">' + esc(b.badge) + '</span>' +
          '<span class="rel-item-date">📅 ' + esc(r.date) + (r.files_count ? ' · 涵蓋 ' + esc(r.files_count) + ' 個檔案' : '') + '</span>' +
        '</div>' +
        '<h4 class="rel-item-title">' + esc(r.title) + '</h4>' +
        (items ? '<ul class="rel-item-list">' + items + '</ul>' : '') +
      '</article>';
    }).join('');
  }

  function localPanelHtml(status) {
    var ver = currentVersion(status);
    var exp = '<section class="rel-card">' +
      '<div class="rel-card-title">📦 離線單一檔與 GitHub Pages 匯出</div>' +
      '<div class="rel-muted">可下載單一 HTML（<code>trivia/index.html</code>）或完整 ZIP 壓縮包。公開版自動隱藏管理介面。</div>' +
      '<div class="rel-actions">' +
        '<a class="rel-btn rel-primary" href="download/index.html" download="index.html">⬇️ index.html (GitHub Pages)</a>' +
        '<a class="rel-btn" href="download/single" download="trivia_academy_single.html">⬇️ 單一 HTML</a>' +
        '<a class="rel-btn" href="download/zip" download="trivia_academy_web.zip">📦 完整 ZIP</a>' +
      '</div>' +
    '</section>';
    if (status.baseline_missing) {
      return exp + '<section class="rel-card"><div class="rel-card-title">ℹ️ 尚未建立發布基準</div>' +
        '<div class="rel-muted">請執行 <code>python3 tools/release_mgr.py</code> 建立 v' + esc(ver) + ' 基準。</div></section>';
    }
    if (!status.has_changes) {
      return exp + '<section class="rel-card rel-clean">✅ 工作目錄與最新發布版 v' + esc(ver) + ' 完全同步，沒有待發布的修改。</section>';
    }
    var rec = status.recommended_bump || 'patch';
    var nv = status.next_versions || {};
    var opts = ['patch', 'minor', 'major'].map(function (b) {
      return '<label class="rel-bump' + (b === rec ? ' on' : '') + '">' +
        '<input type="radio" name="relBump" value="' + b + '"' + (b === rec ? ' checked' : '') + '>' +
        '<div><strong>v' + esc(nv[b] || '') + '</strong> ' + (b === rec ? '<span class="rel-chip ok">推薦</span>' : '') + '</div>' +
        '<div class="rel-muted">' + esc(BUMP[b].desc) + '</div>' +
      '</label>';
    }).join('');
    return exp + '<section class="rel-card rel-dirty">' +
      '<div class="rel-card-title">⚠️ 偵測到 ' + (status.changed_files || []).length + ' 個未發布檔案變更</div>' +
      '<div class="rel-muted">' + esc(status.recommendation_reason) + '</div>' +
      '<div class="rel-bump-grid">' + opts + '</div>' +
      '<div style="margin-top:10px">' +
        '<label style="display:block;font-weight:700;font-size:12.5px">新版本標題<input type="text" id="relTitleInp" class="rel-input" value="' + esc(status.suggested_title || '') + '"></label>' +
        '<label style="display:block;font-weight:700;font-size:12.5px;margin-top:8px">更新重點（每行一條）<textarea id="relHlInp" class="rel-input" rows="3">' + esc((status.suggested_highlights || []).join('\n')) + '</textarea></label>' +
        '<div class="rel-actions"><button type="button" class="rel-btn rel-primary" id="relPublishBtn">🚀 發布 v<span id="relPubVer">' + esc(nv[rec] || '') + '</span> 並重新打包</button><span id="relPubMsg" class="rel-muted"></span></div>' +
      '</div>' +
    '</section>';
  }

  function ensureModal() {
    var bd = document.getElementById('relModal');
    if (bd) return bd;
    bd = document.createElement('div');
    bd.id = 'relModal';
    bd.className = 'rel-bd';
    bd.addEventListener('click', function (e) { if (e.target === bd) closeReleaseModal(); });
    document.body.appendChild(bd);
    return bd;
  }

  function renderModal(status) {
    injectCss();
    var bd = ensureModal();
    var local = isLocal(status);
    var ver = currentVersion(status);
    var releases = (status && status.releases) || data().releases || [];
    var title = local ? '🚀 冷知識學院 · 版本紀錄與發布中心' : '📜 冷知識學院 · Release Notes';
    bd.innerHTML =
      '<div class="rel-box" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
        '<header class="rel-head">' +
          '<div><h3 class="rel-title">' + esc(title) + ' <span class="rel-ver-pill">v' + esc(ver) + '</span></h3>' +
            '<p class="rel-sub">開心學園 · 冷知識學院（十八大分類 · 轉蛋抽卡 · 真假挑戰）版本演進紀錄</p></div>' +
          '<button type="button" class="rel-btn" id="relCloseBtn" aria-label="關閉">✕ 關閉</button>' +
        '</header>' +
        '<div class="rel-body">' +
          (local ? localPanelHtml(status) : '') +
          '<h4 style="margin:12px 0 8px;font-size:15px">📜 歷史版本紀錄</h4>' +
          '<div class="rel-timeline">' + historyHtml(releases) + '</div>' +
        '</div>' +
      '</div>';
    bd.classList.add('open');
    bd.querySelector('#relCloseBtn').addEventListener('click', closeReleaseModal);
    bd.querySelectorAll('input[name="relBump"]').forEach(function (radio) {
      radio.addEventListener('change', function () {
        bd.querySelectorAll('.rel-bump').forEach(function (el) { el.classList.toggle('on', el.contains(radio)); });
        var v = bd.querySelector('#relPubVer');
        if (v && status && status.next_versions) v.textContent = status.next_versions[radio.value] || '';
      });
    });
    var pub = bd.querySelector('#relPublishBtn');
    if (pub) {
      pub.addEventListener('click', async function () {
        var checked = bd.querySelector('input[name="relBump"]:checked');
        var bump = checked ? checked.value : (status.recommended_bump || 'patch');
        var t = (bd.querySelector('#relTitleInp') || {}).value || '';
        var h = ((bd.querySelector('#relHlInp') || {}).value || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
        pub.disabled = true;
        pub.textContent = '⏳ 發布並打包中…';
        try {
          var res = await fetch('api/release_publish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bump_type: bump, title: t, highlights: h })
          });
          var out = await res.json();
          if (!res.ok || !out || !out.ok) throw new Error((out && out.error) || '發布失敗');
          cachedStatus = out.status;
          data().current_version = out.new_version;
          data().releases = out.status.releases;
          updateBadgeUI(cachedStatus);
          renderModal(cachedStatus);
        } catch (err) {
          pub.disabled = false;
          pub.textContent = '🚀 重新嘗試發布';
          var m = bd.querySelector('#relPubMsg');
          if (m) m.textContent = '錯誤：' + (err.message || err);
        }
      });
    }
  }

  async function openReleaseModal() {
    renderModal(cachedStatus);
    var fresh = await fetchReleaseStatus();
    if (fresh) renderModal(fresh);
  }

  function closeReleaseModal() {
    var bd = document.getElementById('relModal');
    if (bd) bd.classList.remove('open');
  }

  function init() {
    updateBadgeUI(cachedStatus);
    var btn = document.getElementById('verBadgeBtn');
    if (btn) btn.addEventListener('click', openReleaseModal);
    fetchReleaseStatus();
  }

  TRV.openReleaseModal = openReleaseModal;
  TRV.closeReleaseModal = closeReleaseModal;
  TRV.refreshReleaseStatus = fetchReleaseStatus;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
  <script>/* js/app.js */
/* ==========================================================================
 * 冷知識學院 — app.js
 * 啟動流程、導覽列高亮、頂部學習統計、全站搜尋視窗（/ 或 ⌘K）。
 * ========================================================================== */
(function () {
  'use strict';
  const TRV = window.TRV;
  const esc = TRV.esc;

  TRV.updateHeaderStats = function () {
    const streakEl = TRV.$('#hdrStreak');
    const progEl = TRV.$('#hdrProgress');
    const days = TRV.streak();
    if (streakEl) {
      streakEl.textContent = `🔥 ${days} 天`;
      streakEl.title = `連續學習 ${days} 天 · 累積 ${TRV.totalXP()} XP`;
    }
    if (progEl) {
      const r = TRV.rank();
      progEl.textContent = `📖 ${r.seen}/${TRV.total()}`;
      progEl.title = `已讀 ${r.seen} 則冷知識 · 稱號：${r.icon} ${r.name}`;
    }
  };

  function updateActiveNav(r) {
    let key = (r && r.name) || 'home';
    if (key === 'fact' || key === 'cat') key = 'browse';
    if (key === 'review') key = 'submit';
    TRV.$$('[data-nav]').forEach((el) => el.classList.toggle('active', el.getAttribute('data-nav') === key));
  }

  TRV.on('state', () => {
    clearTimeout(TRV._hdrTimer);
    TRV._hdrTimer = setTimeout(TRV.updateHeaderStats, 60);
  });
  TRV.on('route', (r) => {
    updateActiveNav(r);
    TRV.updateHeaderStats();
  });

  /* -------------------- 全站搜尋視窗（快捷鍵 / 或 ⌘K） -------------------- */
  let searchModal = null;

  function ensureSearchModal() {
    if (searchModal) return searchModal;
    searchModal = document.createElement('div');
    searchModal.id = 'searchModal';
    searchModal.className = 'modal-bd';
    searchModal.setAttribute('aria-hidden', 'true');
    searchModal.innerHTML =
      '<div class="modal-card search-modal-card" role="dialog" aria-modal="true" aria-label="搜尋冷知識">' +
        '<div class="search-modal-top">' +
          '<span class="search-ic" aria-hidden="true">🔍</span>' +
          `<input type="search" id="globalSearchInput" placeholder="搜尋 ${TRV.total()} 則冷知識（例：章魚、馬拉松、OK、珍珠奶茶）…" autocomplete="off">` +
          '<button type="button" class="modal-close" id="searchModalClose" aria-label="關閉">✕</button>' +
        '</div>' +
        '<div class="search-modal-body" id="globalSearchResults"></div>' +
      '</div>';
    document.body.appendChild(searchModal);
    searchModal.addEventListener('click', (e) => { if (e.target === searchModal) TRV.closeSearch(); });
    TRV.$('#searchModalClose', searchModal).addEventListener('click', TRV.closeSearch);
    const inp = TRV.$('#globalSearchInput', searchModal);
    inp.addEventListener('compositionend', () => renderSearchResults(inp.value));
    inp.addEventListener('input', (e) => { if (!e.isComposing) renderSearchResults(inp.value); });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !e.isComposing) {
        e.preventDefault();
        TRV.closeSearch();
      } else if (TRV.isEnterSend(e)) {
        e.preventDefault();
        const first = TRV.$('.s-res-item', searchModal);
        if (first) first.click();
      }
    });
    return searchModal;
  }

  function renderSearchResults(rawQ) {
    const box = TRV.$('#globalSearchResults', searchModal);
    if (!box) return;
    const q = (rawQ || '').trim();
    let html = '';
    if (!q) {
      html += '<div class="s-res-sec"><div class="s-res-title">📚 分類</div><div class="s-cat-row">' +
        TRV.cats().map((c) => `<a class="s-cat" href="#/browse/${c.id}" style="${TRV.catStyle(c)}">${c.icon} ${esc(c.name)}</a>`).join('') +
        '</div></div>';
      const picks = TRV.shuffle(TRV.facts()).slice(0, 5);
      html += '<div class="s-res-sec"><div class="s-res-title">🎲 隨便看看</div>';
      picks.forEach((f) => { html += resItem(f); });
      html += '</div>';
    } else {
      const ql = q.toLowerCase();
      const cats = TRV.cats().filter((c) => [c.id, c.name, c.en, c.desc].join(' ').toLowerCase().includes(ql));
      const facts = TRV.search(q, 40);
      if (cats.length) {
        html += '<div class="s-res-sec"><div class="s-res-title">📚 分類</div><div class="s-cat-row">' +
          cats.map((c) => `<a class="s-cat" href="#/browse/${c.id}" style="${TRV.catStyle(c)}">${c.icon} ${esc(c.name)}</a>`).join('') + '</div></div>';
      }
      html += `<div class="s-res-sec"><div class="s-res-title">💡 冷知識（${facts.length}${facts.length >= 40 ? '+' : ''}）</div>`;
      if (!facts.length) html += '<div class="muted small" style="padding:6px 8px">找不到相關冷知識，換個關鍵字試試，或到「💬 回饋」投稿！</div>';
      facts.forEach((f) => { html += resItem(f); });
      html += '</div>';
    }
    box.innerHTML = html;
    TRV.$$('a', box).forEach((a) => a.addEventListener('click', () => TRV.closeSearch()));
  }

  function resItem(f) {
    const c = TRV.cat(f.cat);
    return `<a class="s-res-item" href="#/fact/${encodeURIComponent(f.id)}">` +
      `<span class="s-res-badge" style="${TRV.catStyle(c)}">${c.icon} ${esc(c.name)}</span>` +
      `<span class="s-res-main"><strong>${esc(f.title)}</strong><span>${esc(f.fact)}</span></span></a>`;
  }

  TRV.openSearch = function (q) {
    const m = ensureSearchModal();
    m.classList.add('open');
    m.setAttribute('aria-hidden', 'false');
    const inp = TRV.$('#globalSearchInput', m);
    inp.value = q || '';
    renderSearchResults(inp.value);
    setTimeout(() => inp.focus(), 20);
  };
  TRV.closeSearch = function () {
    if (!searchModal) return;
    searchModal.classList.remove('open');
    searchModal.setAttribute('aria-hidden', 'true');
  };

  /* -------------------- 啟動序列 -------------------- */
  /** Cloudtop 本機版：頂部「🛡️ 待審 N」提示（公開版永遠隱藏）。 */
  TRV.setReviewChip = function (n) {
    const el = TRV.$('#hdrReview');
    if (!el) return;
    el.hidden = !(n > 0) || TRV.isStatic();
    el.textContent = `🛡️ 待審 ${n || 0}`;
  };
  TRV.refreshReviewChip = function () {
    if (TRV.isStatic() || !TRV.serverAvailable) return;
    fetch('api/submissions', { cache: 'no-store' })
      .then((r) => r.json())
      .then((d) => { if (d && d.ok) TRV.setReviewChip((d.stats || {}).pending || 0); })
      .catch(() => {});
  };

  function init() {
    TRV.index();
    TRV.updateHeaderStats();
    if (!TRV.isStatic()) {
      fetch('api/health', { cache: 'no-store' })
        .then((r) => r.json())
        .then((d) => {
          if (d && d.ok) {
            TRV.serverAvailable = true;
            TRV.refreshReviewChip();
            setInterval(() => { if (!document.hidden) TRV.refreshReviewChip(); }, 300000);
            if (TRV.curRoute && TRV.curRoute.name === 'submit') TRV.renderRoute();
          }
        })
        .catch(() => {});
    }
    const searchBtn = TRV.$('#searchBtn');
    if (searchBtn) searchBtn.addEventListener('click', () => TRV.openSearch());
    document.addEventListener('keydown', (e) => {
      if (e.isComposing) return;
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        TRV.openSearch();
      } else if (!TRV.isTyping(e) && e.key === '/') {
        e.preventDefault();
        TRV.openSearch();
      } else if (e.key === 'Escape') {
        TRV.closeSearch();
      }
    });
    const params = new URLSearchParams(location.search);
    TRV.renderRoute();
    if (params.get('open') === 'search') TRV.openSearch(params.get('q') || '');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
