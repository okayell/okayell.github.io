/* ✧ 動漫與二次元學院 (Anime & Subculture Academy) — 清爽動漫雜誌風 Light Theme */
:root {
  --bg: #f7f6fc;
  --bg-soft: #efecfa;
  --card: #ffffff;
  --ink: #0f172a;
  --ink-muted: #475569;
  --ink-light: #64748b;
  --border: #e4e1f2;
  --border-strong: #cfc8e8;
  --accent: #7c3aed;
  --accent-dark: #5b21b6;
  --accent-soft: #ede9fe;
  --pink: #db2777;
  --pink-soft: #fce7f3;
  --gold: #b45309;
  --gold-soft: #fef3c7;
  --green: #047857;
  --green-soft: #ecfdf5;
  --cyan: #0369a1;
  --cyan-soft: #e0f2fe;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow-sm: 0 1px 4px rgba(30, 27, 75, 0.06);
  --shadow-md: 0 8px 22px rgba(30, 27, 75, 0.09);
  --shadow-lg: 0 20px 48px rgba(15, 23, 42, 0.24);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent-dark); text-decoration: none; }
button, input, select, textarea { font-family: inherit; font-size: inherit; }
button { cursor: pointer; touch-action: manipulation; }
h1, h2, h3, h4, p { margin: 0; }

/* Header */
.ani-header {
  position: sticky;
  top: 0;
  z-index: 90;
  background: rgba(247, 246, 252, 0.96);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.ani-header-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 9px 18px 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.ani-brand-wrap { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; min-width: 0; }
.ani-brand { font-size: 19px; font-weight: 900; color: var(--ink); white-space: nowrap; }
.ani-sub-pill {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-dark);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.ani-ver-btn {
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--ink-muted);
  border-radius: 999px;
  padding: 1px 9px;
  font-size: 11.5px;
  font-weight: 700;
}
.ani-ver-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
.ani-header-right { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.ani-stat-chip {
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 999px;
  padding: 4px 11px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-muted);
  white-space: nowrap;
}
.ani-stat-chip b { color: var(--accent-dark); margin-left: 2px; }
.ani-stat-chip:hover { border-color: var(--accent); }
.ani-dl-btn { display: none; font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1px dashed var(--border-strong); color: var(--ink-muted); }
.ani-dl-btn.show { display: inline-block; }

.ani-nav-bar {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 14px;
  display: flex;
  gap: 2px;
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}
.ani-nav-bar::-webkit-scrollbar { display: none; }
.ani-tab {
  border: 0;
  background: transparent;
  padding: 8px 12px 9px;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-muted);
  border-bottom: 3px solid transparent;
  white-space: nowrap;
}
.ani-tab:hover { color: var(--ink); }
.ani-tab.active { color: var(--accent-dark); border-bottom-color: var(--accent); }
.ani-tab-badge {
  display: inline-block;
  min-width: 20px;
  padding: 0 6px;
  margin-left: 3px;
  border-radius: 999px;
  background: var(--bg-soft);
  color: var(--ink-muted);
  font-size: 11.5px;
  text-align: center;
}
.ani-tab.active .ani-tab-badge { background: var(--accent-soft); color: var(--accent-dark); }

.ani-main { max-width: 1240px; margin: 0 auto; padding: 18px 18px 64px; }

/* Common */
.ani-sec-hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 26px 0 12px; }
.ani-sec-hd:first-child { margin-top: 0; }
.ani-sec-hd h2 { font-size: 19px; font-weight: 900; }
.ani-sec-sub { font-size: 13px; color: var(--ink-light); margin-top: 2px; }
.ani-link-btn { border: 0; background: transparent; color: var(--accent-dark); font-weight: 800; font-size: 13.5px; padding: 2px 0; white-space: nowrap; }
.ani-link-btn:hover { text-decoration: underline; }
.ani-panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); }
.ani-note { font-size: 12.5px; color: var(--ink-light); }
.ani-empty { text-align: center; padding: 44px 16px; color: var(--ink-light); background: var(--card); border: 1px dashed var(--border-strong); border-radius: var(--radius); }
.ani-empty b { display: block; font-size: 16px; color: var(--ink-muted); margin-bottom: 4px; }

.ani-btn {
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--ink);
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 800;
  white-space: normal;
  min-height: 38px;
}
.ani-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
.ani-btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.ani-btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
.ani-btn-done { background: var(--green-soft); border-color: #6ee7b7; color: var(--green); }
.ani-btn-sm { padding: 5px 11px; font-size: 13px; min-height: 32px; }

.ani-input, .ani-select {
  width: 100%;
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  padding: 8px 11px;
  background: #fff;
  color: var(--ink);
  font-size: 14px;
}
.ani-input:focus, .ani-select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
textarea.ani-input { resize: vertical; }

/* Pills & Chips */
.ani-pills { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.ani-pill {
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--ink-muted);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 700;
}
.ani-pill:hover { border-color: var(--accent); color: var(--accent-dark); }
.ani-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.ani-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  background: var(--bg-soft);
  color: var(--ink-muted);
}
.ani-chip-accent { background: var(--accent-soft); color: var(--accent-dark); }
.ani-chip-pink { background: var(--pink-soft); color: #9d174d; }
.ani-chip-green { background: var(--green-soft); color: var(--green); }
.ani-chip-gold { background: var(--gold-soft); color: var(--gold); }
.ani-chip-cyan { background: var(--cyan-soft); color: var(--cyan); }

/* Hero */
.ani-hero {
  background: linear-gradient(135deg, #2e1065 0%, #5b21b6 54%, #be185d 100%);
  color: #fff;
  border-radius: 18px;
  padding: 24px 24px 20px;
  box-shadow: var(--shadow-md);
}
.ani-hero h1 { font-size: 26px; font-weight: 900; line-height: 1.25; }
.ani-hero p { margin-top: 6px; font-size: 14.5px; color: rgba(255, 255, 255, 0.9); max-width: 720px; }
.ani-hero-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.ani-hero-stat {
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 12px;
  padding: 7px 13px;
  font-size: 13px;
}
.ani-hero-stat b { font-size: 17px; margin-right: 4px; }

/* Radar */
.ani-radar-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-top: 16px;
  box-shadow: var(--shadow-sm);
}
.ani-radar-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.ani-radar-lbl { font-size: 13px; font-weight: 800; color: var(--ink-muted); min-width: 64px; }

/* Grids */
.ani-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 272px), 1fr));
  gap: 15px;
}
.ani-grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
  gap: 14px;
}
.ani-grid-3 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
  gap: 13px;
}

/* Cards */
.ani-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-sm);
  transition: transform 0.14s ease, box-shadow 0.14s ease;
  min-width: 0;
}
.ani-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.ani-poster-wrap {
  position: relative;
  height: 184px;
  overflow: hidden;
  cursor: pointer;
  background: linear-gradient(135deg, #4c1d95, #be185d);
}
.ani-poster-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ani-poster-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 22%;
  opacity: 0;
  transition: opacity 0.25s ease;
}
.ani-poster-img.loaded { opacity: 1; }
.ani-poster-grad {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.18) 0%, rgba(15, 23, 42, 0.05) 45%, rgba(15, 23, 42, 0.78) 100%);
  pointer-events: none;
}
.ani-poster-top {
  position: absolute;
  top: 8px;
  left: 8px;
  right: 8px;
  display: flex;
  justify-content: space-between;
  gap: 6px;
  pointer-events: none;
}
.ani-badge-dark {
  background: rgba(15, 23, 42, 0.76);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 999px;
}
.ani-badge-score {
  background: rgba(250, 204, 21, 0.94);
  color: #422006;
  font-size: 11.5px;
  font-weight: 900;
  padding: 2px 8px;
  border-radius: 999px;
}
.ani-poster-bot {
  position: absolute;
  bottom: 8px;
  left: 10px;
  right: 10px;
  color: #fff;
  pointer-events: none;
}
.ani-poster-title { font-size: 16px; font-weight: 900; line-height: 1.25; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5); }
.ani-poster-sub { font-size: 11.5px; color: rgba(255, 255, 255, 0.88); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ani-card-body { padding: 12px 13px 13px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
.ani-card-tagline { font-size: 13px; color: var(--ink-muted); line-height: 1.48; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ani-card-meta { display: flex; flex-wrap: wrap; gap: 5px; }
.ani-card-actions { margin-top: auto; display: flex; gap: 6px; padding-top: 6px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.ani-act-btn {
  flex: 1 1 78px;
  min-width: 0;
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--ink-muted);
  border-radius: 8px;
  padding: 6px 8px;
  font-size: 12.5px;
  font-weight: 800;
  text-align: center;
}
.ani-act-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
.ani-act-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }
.ani-act-btn.done { background: var(--green-soft); border-color: #6ee7b7; color: var(--green); }

/* Filter Bar */
.ani-filter-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 14px;
}
.ani-search-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ani-search-row .ani-input { flex: 1 1 220px; min-width: 0; }
.ani-search-row .ani-select { flex: 0 1 180px; min-width: 140px; }
.ani-result-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; font-size: 13.5px; color: var(--ink-muted); }

/* Studio & People Cards */
.ani-studio-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 15px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: var(--shadow-sm);
}
.ani-work-link {
  border: 1px solid var(--border-strong);
  background: var(--bg-soft);
  color: var(--accent-dark);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 700;
}
.ani-work-link:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Guide & Quiz */
.ani-lesson {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.ani-plain-box { background: var(--cyan-soft); border-left: 4px solid var(--cyan); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; margin: 10px 0; }
.ani-takeaway-box { background: var(--gold-soft); border-left: 4px solid var(--gold); border-radius: 8px; padding: 9px 12px; font-size: 13.5px; font-weight: 700; color: #78350f; margin: 8px 0; }
.ani-quiz-opt {
  display: block;
  width: 100%;
  text-align: left;
  border: 1px solid var(--border-strong);
  background: #fff;
  border-radius: 10px;
  padding: 10px 13px;
  margin-top: 8px;
  font-weight: 700;
  color: var(--ink);
}
.ani-quiz-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.ani-quiz-opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); }
.ani-quiz-opt.wrong { background: var(--pink-soft); border-color: var(--pink); color: #9d174d; }

/* Modal */
.ani-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(15, 23, 42, 0.56);
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 24px 12px;
  overflow-y: auto;
}
.ani-modal-backdrop.open { display: flex; }
.ani-modal {
  position: relative;
  width: min(100%, 780px);
  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  margin: auto 0;
}
.ani-modal-close {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 10;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 0;
  background: rgba(15, 23, 42, 0.62);
  color: #fff;
  font-size: 16px;
  font-weight: 900;
}
.ani-modal-hero {
  padding: 22px 54px 18px 22px;
  color: #fff;
  background: linear-gradient(135deg, #3b0764, #7c3aed);
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
}
.ani-modal-cover {
  width: 96px;
  height: 136px;
  border-radius: 10px;
  object-fit: cover;
  border: 2px solid rgba(255, 255, 255, 0.45);

  flex-shrink: 0;
}
.ani-modal-body { padding: 18px 22px 24px; display: flex; flex-direction: column; gap: 14px; }
.ani-block { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 13px 15px; }
.ani-block h4 { font-size: 14.5px; font-weight: 900; margin-bottom: 6px; color: var(--accent-dark); }
.ani-block p, .ani-block li { font-size: 13.8px; color: var(--ink); line-height: 1.65; }
.ani-block ul, .ani-block ol { margin: 4px 0 0 18px; padding: 0; }
.ani-stars { display: inline-flex; gap: 4px; }
.ani-star { border: 0; background: transparent; font-size: 22px; color: #cbd5e1; padding: 0 2px; }
.ani-star.on { color: #f59e0b; }

.ani-toast {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%) translateY(20px);
  background: #0f172a;
  color: #fff;
  padding: 9px 18px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
  z-index: 300;
  max-width: calc(100vw - 24px);
  text-align: center;
}
.ani-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 820px) {
  .ani-header { position: static; }
  .ani-header-inner { padding: 8px 12px 6px; }
  .ani-sub-pill { display: none; }
  .ani-nav-bar { flex-wrap: wrap; overflow-x: visible; padding: 4px 10px 8px; gap: 4px; }
  .ani-tab { padding: 6px 9px; font-size: 13px; border-bottom: 2px solid transparent; }
  .ani-main { padding: 14px 12px 52px; }
  .ani-hero { padding: 18px 15px; }
  .ani-hero h1 { font-size: 21px; }
  .ani-modal-hero { padding: 18px 46px 14px 16px; }
  .ani-modal-body { padding: 14px 15px 20px; }
}

</style>

  function setCookieBoth(name, val) {
    if (window.location && window.location.protocol === 'file:') return;
    try {
      document.cookie = name + '=' + val + '; path=/; max-age=31536000; SameSite=Lax';
      var hParts = String(window.location.hostname || '').split('.');
      if (hParts.length >= 4 && /^[ab][0-9a-f]{20,}$/i.test(hParts[0])) {
        document.cookie = name + '=' + val + '; domain=.' + hParts.slice(1).join('.') + '; path=/; max-age=31536000; SameSite=Lax';
      }
    } catch (e) { /* ignore */ }
  }

  function readCookieJson(name) {
    if (window.location && window.location.protocol === 'file:') return null;
    try {
      var parts = (document.cookie || '').split(';');
      for (var i = 0; i < parts.length; i++) {
        var kv = parts[i].trim();
        if (kv.indexOf(name + '=') === 0) {
          var obj = JSON.parse(decodeURIComponent(kv.slice(name.length + 1)));
          return obj && typeof obj === 'object' ? obj : null;
        }
      }
    } catch (e) { /* ignore */ }
    return null;
  }

  function readStuCookie() { return readCookieJson(STU_COOKIE); }
  function writeStuCookie(obj) {
    try { setCookieBoth(STU_COOKIE, encodeURIComponent(JSON.stringify(obj))); } catch (e) { /* ignore */ }
  }

  function todayStr() {
    var d = new Date();
    return '' + (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate());
  }

  function isPlainObj(v) { return !!(v && typeof v === 'object' && !Array.isArray(v)); }

  var ALL_FB_KEYS = [
    'okayell.campus.feedback.v1', 'okayell.campus.fbqueue.v1',

  ];

  function scanSavedFeedbackCount() {
    var total = 0;
    for (var i = 0; i < ALL_FB_KEYS.length; i++) {
      try {
        var raw = window.localStorage.getItem(ALL_FB_KEYS[i]);
        if (!raw) continue;
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) total += parsed.length;
        else if (parsed && typeof parsed === 'object' && Array.isArray(parsed.items)) total += parsed.items.length;
      } catch (e) { /* ignore */ }
    }
    return total;
  }

  function mergeDailyRecord(a, b, tDay) {
    var da = isPlainObj(a) && (a.date === tDay || a.day === tDay) ? a : null;
    var db = isPlainObj(b) && (b.date === tDay || b.day === tDay) ? b : null;
    if (!da && !db) {
      return {
        date: tDay, day: tDay, checkin: 0, visit: 0, acts: 0, visitedIds: {},
        study: 0, studySec: 0, sport: 0, eco: 0,
        claimed: {}, bonusClaimed: false, fullClaimed: false, allClearClaimed: false
      };
    }
    var srcA = da || {}, srcB = db || {};
    var claimed = Object.assign({}, isPlainObj(srcA.claimed) ? srcA.claimed : {}, isPlainObj(srcB.claimed) ? srcB.claimed : {});
    var visitedIds = Object.assign({}, isPlainObj(srcA.visitedIds) ? srcA.visitedIds : {}, isPlainObj(srcB.visitedIds) ? srcB.visitedIds : {});
    var studyVal = Math.max(+srcA.study || 0, +srcA.studySec || 0, +srcB.study || 0, +srcB.studySec || 0);
    var bonus = !!(srcA.bonusClaimed || srcA.fullClaimed || srcB.bonusClaimed || srcB.fullClaimed);
    var allClear = !!(srcA.allClearClaimed || srcB.allClearClaimed);
    return Object.assign({}, srcA, srcB, {
      date: tDay,
      day: tDay,
      checkin: Math.max(+srcA.checkin || 0, +srcB.checkin || 0),
      visit: Math.max(+srcA.visit || 0, +srcB.visit || 0, Object.keys(visitedIds).length),
      acts: Math.max(+srcA.acts || 0, +srcB.acts || 0),
      visitedIds: visitedIds,
      study: studyVal,
      studySec: studyVal,
      sport: Math.max(+srcA.sport || 0, +srcB.sport || 0),
      eco: Math.max(+srcA.eco || 0, +srcB.eco || 0),
      claimed: claimed,
      bonusClaimed: bonus,
      fullClaimed: bonus,
      allClearClaimed: allClear,
    });
  }

  function loadFunState() {
    var ls = {}, ck = readCookieJson(FUN_COOKIE) || {};
    try { ls = JSON.parse(window.localStorage.getItem(FUN_KEY) || '{}') || {}; } catch (e) { ls = {}; }
    var badges = Object.assign({}, isPlainObj(ls.ach) ? ls.ach : {}, isPlainObj(ls.badges) ? ls.badges : {});
    if (Array.isArray(ck.ach)) {
      ck.ach.forEach(function (id) { if (id && !badges[id]) badges[id] = Date.now(); });
    }
    var academyActs = Object.assign({}, isPlainObj(ck.aact) ? ck.aact : {});
    if (isPlainObj(ls.academyActs)) {
      Object.keys(ls.academyActs).forEach(function (k) {
        academyActs[k] = Math.max(+academyActs[k] || 0, +ls.academyActs[k] || 0);
      });
    }
    var academySec = Object.assign({}, isPlainObj(ck.asec) ? ck.asec : {});
    if (isPlainObj(ls.academySec)) {
      Object.keys(ls.academySec).forEach(function (k) {
        academySec[k] = Math.max(+academySec[k] || 0, +ls.academySec[k] || 0);
      });
    }
    var days = Object.assign({}, isPlainObj(ls.studyDays) ? ls.studyDays : {});
    if (Array.isArray(ck.days)) {
      ck.days.forEach(function (d) { if (d) days[d] = 1; });
    }
    var tDay = todayStr();
    days[tDay] = 1;
    var daily = mergeDailyRecord(ck.dl, ls.daily, tDay);
    return {
      raw: ls,
      badges: badges,
      academyActs: academyActs,
      academySec: academySec,
      days: days,
      studySec: Math.max(+ls.studySec || 0, +ck.sec || 0),
      dailyPts: Math.max(+ls.dailyPts || 0, +ck.dpts || 0),
      dailyFullDays: Math.max(+ls.dailyFullDays || 0, +ck.dfull || 0),
      dailyAllClearDays: +ls.dailyAllClearDays || 0,
      feedbackCount: Math.max(+ls.feedbackCount || 0, +ck.fbc || 0, scanSavedFeedbackCount()),
      fountainCoins: +ls.fountainCoins || 0,
      triviaSubmitted: !!(ls.triviaSubmitted || badges.acad_trv_sub),
      daily: daily,
    };

  function localOrigin(loc, port) {
    var p = parseInt(port, 10);
    var host = loc.hostname || '';
    var dot = host.indexOf('.');
    if (dot > 0) {
      var label = host.slice(0, dot);
      var pHex = ('0000' + p.toString(16)).slice(-4).toLowerCase();
      if (label.length === 31 && /^a[0-9a-f]{30}$/i.test(label)) {
        return loc.protocol + '//' + (label.slice(0, 9) + pHex + label.slice(13)).toLowerCase() + host.slice(dot);
      }
      if (label.length === 55 && /^b[0-9a-f]{54}$/i.test(label)) {
        return loc.protocol + '//' + (label.slice(0, 33) + pHex + label.slice(37)).toLowerCase() + host.slice(dot);
      }
    }
    return loc.protocol + '//' + host + ':' + p;
  }

      var host = loc.hostname || '';
      if (/(^|\.)github\.io$/i.test(host)) return loc.origin + '/';
      return localOrigin(loc, LOCAL_CAMPUS_PORT) + '/';
    }
    return PUBLIC_CAMPUS;
  }

    if (h && h.charAt(0) !== '#') h = '#' + (h.charAt(0) === '/' ? '' : '/') + h;
    if (!t) return campusUrl(targetId);
    var loc = window.location;
    if (loc.protocol === 'http:' || loc.protocol === 'https:') {

      if (/(^|\.)github\.io$/i.test(host)) return loc.origin + '/' + t.path + h;
      // mount：已併入開心學園 server → :8919/<path>/；其餘學院仍是各自的 port
      if (t.mount) return localOrigin(loc, LOCAL_CAMPUS_PORT) + '/' + t.path + h;
      return localOrigin(loc, t.port) + '/' + h;
    }
    return PUBLIC_CAMPUS + t.path + h;
  }

  function connectSingleAcademyMqtt(url, idx, toolId) {
    if (!window.WebSocket || isNavBot()) return;
    var existing = _navMqttClients[idx];
    if (existing && existing.ws && (existing.ws.readyState === 0 || existing.ws.readyState === 1)) return;
    if (existing && existing.pingT) { clearInterval(existing.pingT); existing.pingT = 0; }
    if (existing && existing.retryT) { clearTimeout(existing.retryT); existing.retryT = 0; }

    var entry = existing || { url: url, ws: null, ready: false, backoff: 1500, pingT: 0, retryT: 0, pktId: 1 };

    }

    ws.onopen = function () {

      var cid = 'hc_ac_' + TAB_ID.replace(/[^a-zA-Z0-9]/g, '').slice(-10) + '_' + idx + '_' + (Date.now() % 10000);
      try { ws.send(mqttConnectPkt(cid)); } catch (e) { /* ignore */ }
    };

    ws.onmessage = function (ev) {
      if (entry.ws !== ws || !ev || !ev.data) return;
      var chunk = new Uint8Array(ev.data);
      var merged = new Uint8Array(rxBuf.length + chunk.length);
      merged.set(rxBuf, 0);
      merged.set(chunk, rxBuf.length);
      rxBuf = merged;

      while (rxBuf.length >= 2) {
        var byte0 = rxBuf[0];
        var pktType = byte0 >> 4;
        var flags = byte0 & 0x0f;
        var mult = 1, remLen = 0, pos = 1, b;
        do {
          if (pos >= rxBuf.length) return;
          b = rxBuf[pos++];
          remLen += (b & 0x7f) * mult;
          mult *= 128;
        } while ((b & 0x80) !== 0 && pos < 5);

        var totalLen = pos + remLen;
        if (rxBuf.length < totalLen) return;

        var body = rxBuf.subarray(pos, totalLen);
        rxBuf = rxBuf.subarray(totalLen);

        if (pktType === 2) { // CONNACK
          entry.ready = true;
          entry.backoff = 1500;
          try {
            ws.send(mqttSubscribePkt(entry.pktId++, [MQTT_CTL_TOPIC]));
          } catch (e) { /* ignore */ }
          if (entry.pingT) clearInterval(entry.pingT);
          entry.pingT = setInterval(function () {
            if (entry.ws === ws && ws.readyState === 1 && entry.ready) {
              try { ws.send(mqttPingReqPkt()); } catch (e) { /* ignore */ }
            }
          }, 25000);
          // 連上後立即廣播一次目前在該學院的狀態
          if (!_leftSent) {
            sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
          }
        } else if (pktType === 3 && body.length >= 2) { // PUBLISH
          var tLen = (body[0] << 8) | body[1];
          var pStart = 2 + tLen;
          var qos = (flags >> 1) & 0x03;
          if (qos > 0) pStart += 2;
          if (pStart <= body.length) {
            var topicStr = mqttUtf8Decode(body.subarray(2, 2 + tLen));
            var payloadStr = mqttUtf8Decode(body.subarray(pStart));
            if (topicStr === MQTT_CTL_TOPIC && payloadStr) {
              try {
                var d = JSON.parse(payloadStr);
                if (d && (d.event === 'ping' || d.action === 'ping')) {

                    _lastPongSentMs = Date.now();
                    setTimeout(function () {

                    }, 80 + Math.floor(Math.random() * 280));
                  }
                }
              } catch (e) { /* ignore */ }
            }
          }
        }
      }
    };

    var onDisconnect = function () {
      if (entry.ws !== ws) return;
      entry.ready = false;
      entry.ws = null;
      if (entry.pingT) { clearInterval(entry.pingT); entry.pingT = 0; }
      if (entry.retryT) clearTimeout(entry.retryT);
      var wait = entry.backoff + Math.floor(Math.random() * 600);

      }, wait);
    };
    ws.onerror = onDisconnect;
    ws.onclose = onDisconnect;

    } else if (/Android/i.test(ua)) {

    } else if (/Windows NT/i.test(ua)) {

    } else if (/Macintosh|Mac OS X/i.test(ua)) {
      os = 'Mac 桌機/筆電';

    return '/api/';
  }

  function readJson(key, fb) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return fb;
      var parsed = JSON.parse(raw);
      return parsed && typeof parsed === 'object' ? parsed : fb;
    } catch (e) {
      return fb;
    }
  }

  function writeJson(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) { /* ignore */ }
  }

  function trackAct(kind) {
    if (window.CampusNav && typeof window.CampusNav.recordAction === 'function') {
      try { window.CampusNav.recordAction('anime', kind || 'study'); } catch (e) { /* ignore */ }
    }
  }

  var _catalogCache = null;
  function getCatalog() {
    if (!_catalogCache) {
      var raw = Array.isArray(window.ANI_WORKS) ? window.ANI_WORKS.slice() : [];
      var seen = {};
      _catalogCache = raw.filter(function (w) {
        if (!w || !w.id || seen[w.id]) return false;
        seen[w.id] = 1;
        return true;
      }).sort(function (a, b) {
        return (b.rating || 0) - (a.rating || 0) || (b.year || 0) - (a.year || 0);
      });
    }
    return _catalogCache;
  }

  function getSeasonalPayload() {
    var d = window.ANI_SEASONAL;
    return d && Array.isArray(d.items) ? d : { updatedAt: '', weekKey: '', seasonLabel: '當季新番', count: 0, items: [] };
  }

  function getSeasonalItems() {
    return getSeasonalPayload().items || [];
  }

  function findWork(id) {
    var list = getCatalog();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    var seasonal = getSeasonalItems();
    for (var j = 0; j < seasonal.length; j++) if (seasonal[j].id === id) return seasonal[j];
    return null;
  }

  function posterUrlOf(item) {
    if (!item) return '';
    if (item.cover) return item.cover;
    var map = window.ANI_POSTERS || {};
    return map[item.id] || '';
  }

  function fallbackSvg(item) {
    var pal = PALETTES[hashStr(item.id || item.title) % PALETTES.length];
    var ch = Array.from(String(item.title || '✧'))[0] || '✧';
    return (
      '<svg class="ani-poster-svg" viewBox="0 0 320 190" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
        '<defs><linearGradient id="ag-' + esc(item.id) + '" x1="0" y1="0" x2="1" y2="1">' +
          '<stop offset="0%" stop-color="' + pal[0] + '"/>' +
          '<stop offset="100%" stop-color="' + pal[1] + '"/>' +
        '</linearGradient></defs>' +
        '<rect width="320" height="190" fill="url(#ag-' + esc(item.id) + ')"/>' +
        '<circle cx="265" cy="40" r="76" fill="#fff" opacity="0.09"/>' +
        '<circle cx="48" cy="155" r="54" fill="#fff" opacity="0.07"/>' +
        '<text x="242" y="138" text-anchor="middle" font-size="92" font-weight="900" fill="#fff" opacity="0.14">' + esc(ch) + '</text>' +
      '</svg>'
    );
  }

  /* Passport state: watchlist = { id: ts }, progress = { id: { status:'watching'|'done', rating:0..5, note:'', ep:0, updatedAt } } */
  function getWatchlist() { return readJson(WL_KEY, {}); }
  function getProgress() { return readJson(PROG_KEY, {}); }

  function statusOf(id) {
    var prog = getProgress()[id];
    if (prog && prog.status === 'done') return 'done';
    if (prog && prog.status === 'watching') return 'watching';
    if (getWatchlist()[id]) return 'watchlist';
    return '';
  }

  function toggleWatchlist(id) {
    var wl = getWatchlist();
    if (wl[id]) {
      delete wl[id];
      writeJson(WL_KEY, wl);
      toast('已從待看清單移除');
    } else {
      wl[id] = Date.now();
      writeJson(WL_KEY, wl);
      toast('已加入待看清單 📋');
      trackAct('watchlist');
    }
    syncHeaderBadges();
  }

  function setWorkStatus(id, st) {
    var prog = getProgress();
    var cur = prog[id] || { status: '', rating: 0, note: '', ep: 0 };
    if (cur.status === st) {
      delete prog[id];
      writeJson(PROG_KEY, prog);
      toast('已取消進度標記');
    } else {
      cur.status = st;
      cur.updatedAt = Date.now();
      prog[id] = cur;
      writeJson(PROG_KEY, prog);
      if (st === 'done') {
        var wl = getWatchlist();
        if (wl[id]) { delete wl[id]; writeJson(WL_KEY, wl); }
        toast('已標記為補完 ✅');
      } else {
        toast('已標記為追番中 ▶');
      }
      trackAct('progress');
    }
    syncHeaderBadges();
  }

  function saveWorkNote(id, rating, note) {
    var prog = getProgress();
    var cur = prog[id] || { status: 'done', rating: 0, note: '', ep: 0 };
    cur.rating = rating;
    cur.note = String(note || '').slice(0, 500);
    cur.updatedAt = Date.now();
    prog[id] = cur;
    writeJson(PROG_KEY, prog);
    toast('已儲存個人評價與筆記 ✨');
    trackAct('note');
  }

  var _toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('aniToast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  function syncHeaderBadges() {
    var wl = getWatchlist();
    var prog = getProgress();
    var watching = 0, done = 0;
    Object.keys(prog).forEach(function (k) {
      if (prog[k] && prog[k].status === 'watching') watching++;
      else if (prog[k] && prog[k].status === 'done') done++;
    });
    var wlCnt = Object.keys(wl).length;
    var set = function (id, v) { var el = document.getElementById(id); if (el) el.textContent = String(v); };
    set('hdrWatchingCnt', watching);
    set('hdrWatchlistCnt', wlCnt);
    set('hdrDoneCnt', done);
    set('navSeasonalCnt', getSeasonalItems().length);
    set('navTotalCnt', getCatalog().length);
    set('navMyCnt', watching + wlCnt + done);
  }

  function mediaLabel(m) {
    for (var i = 0; i < MEDIAS.length; i++) if (MEDIAS[i].id === m) return MEDIAS[i].icon + ' ' + MEDIAS[i].label;
    return '📺 動畫';
  }

  function renderWorkCard(w, isSeasonal) {
    var st = statusOf(w.id);
    var wlOn = !!getWatchlist()[w.id];
    var pUrl = posterUrlOf(w);
    var scoreVal = isSeasonal ? (w.score ? '★ ' + w.score : '新番') : ('★ ' + Number(w.rating).toFixed(1));
    var topLeft = isSeasonal
      ? (WEEKDAYS[w.weekday || 0] + ' · ' + (w.formatLabel || 'TV'))
      : (w.year + ' · ' + (w.media === 'movie' ? '劇場版' : w.media === 'manga' ? '漫畫' : (w.episodes ? w.episodes + ' 集' : '動畫')));
    var chips = isSeasonal
      ? (w.genres || []).slice(0, 3).map(function (g) { return '<span class="ani-chip ani-chip-accent">' + esc(g) + '</span>'; }).join('')
      : (w.genres || []).slice(0, 3).map(function (g) { return '<span class="ani-chip ani-chip-accent">' + esc(GENRES[g] || g) + '</span>'; }).join('');
    var vBadge = !isSeasonal && w.ending && VERDICT_INFO[w.ending.verdict]
      ? '<span class="ani-chip ' + VERDICT_INFO[w.ending.verdict].cls + '">' + esc(VERDICT_INFO[w.ending.verdict].label) + '</span>'
      : (isSeasonal && w.statusLabel ? '<span class="ani-chip ani-chip-pink">' + esc(w.statusLabel) + '</span>' : '');
    var subText = isSeasonal ? (w.studio || '製作委員會') : ((w.studio || '') + ' · ' + (w.origTitle || ''));
    var tagline = isSeasonal ? (w.desc || '本季話題新作，點擊查看播映資訊並加入追番清單。') : (w.tagline || '');

    return (
      '<article class="ani-card">' +
        '<div class="ani-poster-wrap" data-open-work="' + esc(w.id) + '">' +
          fallbackSvg(w) +
          (pUrl ? '<img class="ani-poster-img" loading="lazy" referrerpolicy="no-referrer" alt="' + esc(w.title) + '" src="' + esc(pUrl) + '" onload="this.classList.add(\'loaded\')" onerror="this.remove()" />' : '') +
          '<div class="ani-poster-grad"></div>' +
          '<div class="ani-poster-top">' +
            '<span class="ani-badge-dark">' + esc(topLeft) + '</span>' +
            '<span class="ani-badge-score">' + esc(scoreVal) + '</span>' +
          '</div>' +
          '<div class="ani-poster-bot">' +
            '<div class="ani-poster-title">' + esc(w.title) + '</div>' +
            '<div class="ani-poster-sub">' + esc(subText) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="ani-card-body">' +
          '<div class="ani-card-tagline">' + esc(tagline) + '</div>' +
          '<div class="ani-card-meta">' + vBadge + chips + '</div>' +
          '<div class="ani-card-actions">' +
            '<button type="button" class="ani-act-btn ' + (wlOn ? 'on' : '') + '" data-toggle-wl="' + esc(w.id) + '">' + (wlOn ? '📋 已待看' : '➕ 待看') + '</button>' +
            '<button type="button" class="ani-act-btn ' + (st === 'watching' ? 'on' : '') + '" data-set-status="' + esc(w.id) + '" data-status-val="watching">' + (st === 'watching' ? '▶ 追番中' : '▶ 追番') + '</button>' +
            '<button type="button" class="ani-act-btn ' + (st === 'done' ? 'done' : '') + '" data-set-status="' + esc(w.id) + '" data-status-val="done">' + (st === 'done' ? '✅ 已補完' : '✅ 補完') + '</button>' +
          '</div>' +
        '</div>' +
      '</article>'
    );
  }

  function openModal(id) {
    var w = findWork(id);
    var bd = document.getElementById('animeModal');
    var card = document.getElementById('animeModalCard');
    if (!w || !bd || !card) return;
    trackAct('read_work');

    var isSeasonal = String(w.id).indexOf('s-') === 0;
    var pUrl = posterUrlOf(w);
    var st = statusOf(w.id);
    var wlOn = !!getWatchlist()[w.id];
    var myProg = getProgress()[w.id] || { rating: 0, note: '' };
    var ytUrl = 'https://www.youtube.com/results?search_query=' + encodeURIComponent((w.origTitle || w.title) + ' OP PV');

    var bodyHtml = '';
    if (isSeasonal) {
      bodyHtml =
        '<div class="ani-block"><h4>🗓️ 本季播映資訊</h4>' +
          '<p><b>製作公司：</b>' + esc(w.studio || '—') + '　｜　<b>格式：</b>' + esc(w.formatLabel || w.format) + '　｜　<b>狀態：</b>' + esc(w.statusLabel || w.status) + '</p>' +
          '<p><b>更新日：</b>' + esc(WEEKDAYS[w.weekday || 0]) + (w.airDate ? '（首播 ' + esc(w.airDate) + '）' : '') + (w.episodes ? '　｜　<b>預定集數：</b>' + w.episodes + ' 集' : '') + (w.nextEp ? '　｜　<b>下一集：</b>第 ' + w.nextEp + ' 集' : '') + '</p>' +
        '</div>' +
        '<div class="ani-block"><h4>📖 劇情簡介（英文官方摘要）</h4><p>' + esc(w.desc || '暫無官方簡介，可點擊下方按鈕搜尋正式預告片。') + '</p></div>';
    } else {
      var vInfo = (w.ending && VERDICT_INFO[w.ending.verdict]) || { label: '—', cls: '' };
      var hlLis = ((w.analysis && w.analysis.highlights) || []).map(function (h) { return '<li>' + esc(h) + '</li>'; }).join('');
      bodyHtml =
        '<div class="ani-block"><h4>📖 無雷劇情簡介</h4><p>' + esc(w.synopsis) + '</p>' +
          '<div class="ani-pills" style="margin-top:10px;">' +
            (w.mood || []).map(function (m) { return '<span class="ani-chip ani-chip-pink">#' + esc(m) + '</span>'; }).join('') +
          '</div>' +
        '</div>' +
        '<div class="ani-grid-2">' +
          '<div class="ani-block"><h4>🎯 入坑指南</h4>' +
            '<p><b>入戲點：</b>' + esc(w.entry && w.entry.hookBy) + '　｜　<b>節奏：</b>' + esc(PACE_LABEL[w.entry && w.entry.pace] || '穩定') + '</p>' +
            '<p style="margin-top:6px;">' + esc(w.entry && w.entry.tip) + '</p>' +
          '</div>' +
          '<div class="ani-block"><h4>🏁 收尾評價 <span class="ani-chip ' + vInfo.cls + '">' + esc(vInfo.label) + '</span></h4>' +
            '<p style="margin-top:6px;">' + esc(w.ending && w.ending.note) + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="ani-block"><h4>✨ 三大看門道亮點</h4><ul>' + hlLis + '</ul></div>' +
        '<div class="ani-grid-2">' +
          '<div class="ani-block"><h4>🎨 作畫與分鏡美學</h4><p>' + esc(w.analysis && w.analysis.sakuga) + '</p></div>' +
          '<div class="ani-block"><h4>🎵 音樂 OP／ED 與劇伴</h4><p>' + esc(w.analysis && w.analysis.music) + '</p></div>' +
        '</div>' +
        '<div class="ani-block"><h4>📚 原作與動畫改編對照</h4><p>' + esc(w.adaptNote) + '</p>' +
          '<p class="ani-note" style="margin-top:8px;"><b>原作：</b>' + esc(w.creator) + '　｜　<b>監督：</b>' + esc(w.director) + '　｜　<b>聲優／代表角色：</b>' + esc((w.cast || []).join('、')) + '</p>' +
        '</div>';
    }

    var starsHtml = [1, 2, 3, 4, 5].map(function (n) {
      return '<button type="button" class="ani-star ' + (myProg.rating >= n ? 'on' : '') + '" data-star="' + n + '" aria-label="' + n + ' 星">★</button>';
    }).join('');

    card.innerHTML =
      '<button type="button" class="ani-modal-close" id="aniModalClose" aria-label="關閉">✕</button>' +
      '<div class="ani-modal-hero">' +
        (pUrl ? '<img class="ani-modal-cover" referrerpolicy="no-referrer" alt="' + esc(w.title) + '" src="' + esc(pUrl) + '" onerror="this.style.display=\'none\'" />' : '') +
        '<div style="flex:1;min-width:200px;">' +
          '<div style="font-size:12px;opacity:0.88;margin-bottom:4px;">' + esc(isSeasonal ? ('當季新番 · ' + (w.studio || '')) : (mediaLabel(w.media) + ' · ' + w.year + ' · ' + w.studio)) + '</div>' +
          '<h2 id="animeModalTitle" style="font-size:22px;font-weight:900;">' + esc(w.title) + '</h2>' +
          '<div style="font-size:13px;opacity:0.9;margin-top:2px;">' + esc(w.origTitle || '') + (w.enTitle ? ' / ' + esc(w.enTitle) : '') + '</div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;">' +
            '<button type="button" class="ani-btn ani-btn-sm ' + (wlOn ? 'ani-btn-primary' : '') + '" data-modal-wl="' + esc(w.id) + '">' + (wlOn ? '📋 已在待看' : '➕ 加入待看') + '</button>' +
            '<button type="button" class="ani-btn ani-btn-sm ' + (st === 'watching' ? 'ani-btn-primary' : '') + '" data-modal-st="watching">' + (st === 'watching' ? '▶ 追番中' : '▶ 標記追番中') + '</button>' +
            '<button type="button" class="ani-btn ani-btn-sm ' + (st === 'done' ? 'ani-btn-done' : '') + '" data-modal-st="done">' + (st === 'done' ? '✅ 已補完' : '✅ 標記已補完') + '</button>' +
            '<a class="ani-btn ani-btn-sm" href="' + esc(ytUrl) + '" target="_blank" rel="noopener noreferrer">🎬 搜尋 OP／PV ↗</a>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="ani-modal-body">' +
        bodyHtml +
        '<div class="ani-block">' +
          '<h4>📝 我的追番評分與心得筆記</h4>' +
          '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;">' +
            '<span class="ani-note">個人星等：</span><div class="ani-stars" id="aniModalStars">' + starsHtml + '</div>' +
          '</div>' +
          '<textarea id="aniModalNote" class="ani-input" rows="2" maxlength="500" placeholder="寫下你的無雷心得、最喜歡的名場面或看到第幾集…">' + esc(myProg.note || '') + '</textarea>' +
          '<div style="margin-top:8px;display:flex;justify-content:flex-end;">' +
            '<button type="button" class="ani-btn ani-btn-primary ani-btn-sm" id="aniSaveNoteBtn">💾 儲存筆記</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    var curRating = myProg.rating || 0;
    document.getElementById('aniModalClose').onclick = closeModal;
    card.querySelector('[data-modal-wl]').onclick = function () {
      toggleWatchlist(w.id);
      openModal(w.id);
      if (ANI.refreshCurrentView) ANI.refreshCurrentView();
    };
    card.querySelectorAll('[data-modal-st]').forEach(function (b) {
      b.onclick = function () {
        setWorkStatus(w.id, b.getAttribute('data-modal-st'));
        openModal(w.id);
        if (ANI.refreshCurrentView) ANI.refreshCurrentView();
      };
    });
    card.querySelectorAll('#aniModalStars [data-star]').forEach(function (sBtn) {
      sBtn.onclick = function () {
        curRating = Number(sBtn.getAttribute('data-star')) || 0;
        card.querySelectorAll('#aniModalStars [data-star]').forEach(function (x) {
          x.classList.toggle('on', Number(x.getAttribute('data-star')) <= curRating);
        });
      };
    });
    document.getElementById('aniSaveNoteBtn').onclick = function () {
      saveWorkNote(w.id, curRating, document.getElementById('aniModalNote').value);
      if (ANI.refreshCurrentView) ANI.refreshCurrentView();
    };
    bd.classList.add('open');
  }

  function closeModal() {
    var bd = document.getElementById('animeModal');
    if (bd) bd.classList.remove('open');
  }

  var state = {
    explore: { media: 'all', decade: 'all', genre: 'all', status: 'all', studio: 'all', q: '', sort: 'rating', page: 1 },
    seasonal: { weekday: 'all', format: 'all', q: '' },
    radar: { media: 'all', genre: 'all', pace: 'all', perfectOnly: false },
    studiosTab: 'studios',
    myTab: 'watching',
    guideTab: 'lessons'
  };

  function resetExplore() {
    state.explore = { media: 'all', decade: 'all', genre: 'all', status: 'all', studio: 'all', q: '', sort: 'rating', page: 1 };
  }

  var ANI = {
    MEDIAS: MEDIAS,
    DECADES: DECADES,
    GENRES: GENRES,
    WEEKDAYS: WEEKDAYS,
    VERDICT_INFO: VERDICT_INFO,
    PACE_LABEL: PACE_LABEL,
    QUIZ_KEY: QUIZ_KEY,
    esc: esc,
    isStatic: isStatic,
    apiBase: apiBase,
    readJson: readJson,
    writeJson: writeJson,
    trackAct: trackAct,
    getCatalog: getCatalog,
    getSeasonalPayload: getSeasonalPayload,
    getSeasonalItems: getSeasonalItems,
    findWork: findWork,
    getWatchlist: getWatchlist,
    getProgress: getProgress,
    statusOf: statusOf,
    toggleWatchlist: toggleWatchlist,
    setWorkStatus: setWorkStatus,
    syncHeaderBadges: syncHeaderBadges,
    renderWorkCard: renderWorkCard,
    openModal: openModal,
    closeModal: closeModal,
    toast: toast,
    state: state,
    resetExplore: resetExplore
  };

  window.ANI = ANI;
})();

</script>
  <script>
/* 🎯 動漫與二次元學院 — 首頁入坑雷達與主題榜單 */
(function () {
  'use strict';
  var ANI = window.ANI;

  ANI.renderHomePage = function (root) {
    var catalog = ANI.getCatalog();
    var seasonal = ANI.getSeasonalPayload();
    var r = ANI.state.radar;

    var picks = catalog.filter(function (w) {
      if (ANI.statusOf(w.id) === 'done') return false;
      if (r.media !== 'all' && w.media !== r.media) return false;
      if (r.genre !== 'all' && (w.genres || []).indexOf(r.genre) === -1) return false;
      if (r.pace !== 'all' && (!w.entry || w.entry.pace !== r.pace)) return false;
      if (r.perfectOnly && (!w.ending || w.ending.verdict !== 'perfect')) return false;
      return true;
    }).slice(0, 8);

    var perfectList = catalog.filter(function (w) { return w.ending && w.ending.verdict === 'perfect'; }).slice(0, 4);
    var shortGems = catalog.filter(function (w) { return w.media !== 'manga' && w.episodes >= 10 && w.episodes <= 14; }).slice(0, 4);

    var mediaPills = [{ id: 'all', label: '全部媒介' }].concat(ANI.MEDIAS.map(function (m) { return { id: m.id, label: m.icon + ' ' + m.label }; }))
      .map(function (m) { return '<button type="button" class="ani-pill ' + (r.media === m.id ? 'active' : '') + '" data-rm="' + m.id + '">' + ANI.esc(m.label) + '</button>'; }).join('');

    var genreKeys = ['all', 'action', 'fantasy', 'thriller', 'scifi', 'slice', 'school', 'sports', 'music', 'dark', 'romcom'];
    var genrePills = genreKeys.map(function (g) {
      return '<button type="button" class="ani-pill ' + (r.genre === g ? 'active' : '') + '" data-rg="' + g + '">' + ANI.esc(g === 'all' ? '全部類型' : ANI.GENRES[g]) + '</button>';
    }).join('');

    var pacePills = [
      { id: 'all', label: '不限節奏' },
      { id: 'fast', label: '⚡ 開局高能' },
      { id: 'steady', label: '🎯 穩定推進' },
      { id: 'slow', label: '🍵 慢熱後勁' }
    ].map(function (p) {
      return '<button type="button" class="ani-pill ' + (r.pace === p.id ? 'active' : '') + '" data-rp="' + p.id + '">' + p.label + '</button>';
    }).join('');

    var decadeCards = ANI.DECADES.map(function (d) {
      var cnt = catalog.filter(function (w) { return w.decade === d.id; }).length;
      return (

(function () {

  var PAGE_SIZE = 36;

  ANI.renderExplorePage = function (root) {
    var all = ANI.getCatalog();

    var q = String(f.q || '').trim().toLowerCase();

    var studios = [];
    var stSeen = {};
    all.forEach(function (w) {
      if (w.studio && !stSeen[w.studio]) { stSeen[w.studio] = 1; studios.push(w.studio); }
    });
    studios.sort();

    var filtered = all.filter(function (w) {
      if (f.media !== 'all' && w.media !== f.media) return false;
      if (f.decade !== 'all' && w.decade !== f.decade) return false;
      if (f.genre !== 'all' && (w.genres || []).indexOf(f.genre) === -1) return false;
      if (f.studio !== 'all' && w.studio !== f.studio) return false;
      if (f.status === 'perfect' && (!w.ending || w.ending.verdict !== 'perfect')) return false;
      if (f.status === 'ended' && w.status !== 'ended' && w.status !== 'movie') return false;
      if (f.status === 'ongoing' && w.status !== 'ongoing') return false;
      if (f.status === 'unwatched' && ANI.statusOf(w.id) === 'done') return false;
      if (q) {
        var hay = [w.title, w.origTitle, w.enTitle, w.studio, w.creator, w.director, (w.cast || []).join(' '), w.tagline, (w.mood || []).join(' ')].join(' ').toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    if (f.sort === 'year-desc') filtered.sort(function (a, b) { return (b.year || 0) - (a.year || 0) || (b.rating || 0) - (a.rating || 0); });
    else if (f.sort === 'year-asc') filtered.sort(function (a, b) { return (a.year || 0) - (b.year || 0) || (b.rating || 0) - (a.rating || 0); });
    else filtered.sort(function (a, b) { return (b.rating || 0) - (a.rating || 0) || (b.year || 0) - (a.year || 0); });

    var shown = filtered.slice(0, f.page * PAGE_SIZE);

            '<option value="all" ' + (f.status === 'all' ? 'selected' : '') + '>全部狀態</option>' +
            '<option value="perfect" ' + (f.status === 'perfect' ? 'selected' : '') + '>🏆 只看神收尾</option>' +
            '<option value="ended" ' + (f.status === 'ended' ? 'selected' : '') + '>✅ 已完結／劇場版</option>' +
            '<option value="ongoing" ' + (f.status === 'ongoing' ? 'selected' : '') + '>🔄 連載／續作中</option>' +

    root.querySelectorAll('[data-ef]').forEach(function (b) {

    var more = document.getElementById('efMoreBtn');

    var list = tab === 'watchlist' ? watchlist : (tab === 'done' ? done : watching);

    var genreCounts = {};
    done.forEach(function (w) {
      (w.genres || []).forEach(function (g) {
        var lbl = ANI.GENRES[g] || g;
        genreCounts[lbl] = (genreCounts[lbl] || 0) + 1;

        '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
          '<button type="button" class="ani-btn ani-btn-sm" id="aniExportBtn">⬇️ 匯出備份</button>' +
          '<label class="ani-btn ani-btn-sm" style="display:inline-flex;align-items:center;cursor:pointer;">⬆️ 匯入備份<input type="file" id="aniImportFile" accept="application/json" style="display:none;" /></label>' +

      '<div class="ani-panel" style="margin-bottom:14px;">' +
        '<div style="display:flex;flex-wrap:wrap;gap:18px;align-items:center;">' +
          '<div><div class="ani-note">追番中</div><b style="font-size:22px;color:var(--accent-dark);">' + watching.length + '</b> 部</div>' +

        '<button type="button" class="ani-pill ' + (tab === 'watchlist' ? 'active' : '') + '" data-mtab="watchlist">📋 待看清單 (' + watchlist.length + ')</button>' +

    root.querySelectorAll('[data-mtab]').forEach(function (b) {
      b.onclick = function () { ANI.state.myTab = b.getAttribute('data-mtab'); ANI.renderMyListPage(root); };
    });

    document.getElementById('aniExportBtn').onclick = function () {
      var data = { exportedAt: new Date().toISOString(), watchlist: ANI.getWatchlist(), progress: ANI.getProgress() };
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'anime_passport_backup.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      ANI.toast('已匯出追番護照備份檔');

    document.getElementById('aniImportFile').onchange = function (ev) {
      var file = ev.target.files && ev.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var parsed = JSON.parse(String(reader.result || '{}'));
          if (parsed.watchlist && typeof parsed.watchlist === 'object') ANI.writeJson('ani.watchlist.v1', parsed.watchlist);

          ANI.renderMyListPage(root);
        } catch (e) {
          ANI.toast('備份檔格式錯誤，無法匯入');
        }
      };
      reader.readAsText(file);
    };
  };
})();

(function () {

        '</div>' +
        '<div class="ani-grid-2" id="aniGlossGrid">' +

      var qs = guide.quiz || [];
      var rightCnt = 0;
      var doneCnt = 0;
      qs.forEach(function (q, i) {
        if (qState.answers[i] != null) {
          doneCnt++;
          if (qState.answers[i] === q.ans) rightCnt++;
        }
      });
      body =
        '<div class="ani-panel" style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">' +
          '<div><b>🎯 作畫與二次元隨堂測驗</b>　已作答 <b>' + doneCnt + ' / ' + qs.length + '</b> 題，答對 <b style="color:var(--green);">' + rightCnt + '</b> 題</div>' +
          '<button type="button" class="ani-btn ani-btn-sm" id="aniQuizReset">🔄 重新測驗</button>' +
        '</div>' +
        qs.map(function (q, i) {
          var picked = qState.answers[i];
          var answered = picked != null;
          var optsHtml = q.opts.map(function (o, oi) {
            var cls = 'ani-quiz-opt';

              if (oi === q.ans) cls += ' correct';

            }
            return '<button type="button" class="' + cls + '" data-qi="' + i + '" data-oi="' + oi + '" ' + (answered ? 'disabled' : '') + '>' + String.fromCharCode(65 + oi) + '. ' + ANI.esc(o) + '</button>';
          }).join('');

              (answered ? '<div class="ani-plain-box" style="margin-top:10px;">' + (picked === q.ans ? '✅ 答對了！' : '💡 正解為 ' + String.fromCharCode(65 + q.ans) + '。') + ANI.esc(q.exp) + '</div>' : '') +
            '</div>'
          );
        }).join('');
    } else {
      body = (guide.lessons || []).map(function (l) {
        return (
          '<article class="ani-lesson">' +
            '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
              '<span class="ani-chip ani-chip-accent">第 ' + ANI.esc(l.num) + ' 堂</span>' +
              '<h3 style="font-size:17px;font-weight:900;">' + ANI.esc(l.title) + '</h3>' +
            '</div>' +
            '<p class="ani-note" style="margin-top:5px;">' + ANI.esc(l.summary) + '</p>' +
            '<div class="ani-plain-box">🧒 <b>白話比喻：</b>' + ANI.esc(l.plain) + '</div>' +
            '<ul style="margin:8px 0 8px 18px;padding:0;font-size:14px;">' +
              (l.points || []).map(function (pt) { return '<li style="margin-bottom:4px;">' + ANI.esc(pt) + '</li>'; }).join('') +
            '</ul>' +
            '<div class="ani-takeaway-box">📝 一句話記住：' + ANI.esc(l.takeaway) + '</div>' +
          '</article>'
        );
      }).join('');
    }

    root.innerHTML =
      '<div class="ani-sec-hd"><div><h2>🧩 作畫分鏡與二次元文化課</h2><div class="ani-sec-sub">從零看懂原畫中割、分鏡演出、製作委員會與二次元社群術語</div></div></div>' +
      '<div class="ani-pills" style="margin-bottom:14px;">' +
        '<button type="button" class="ani-pill ' + (tab === 'lessons' ? 'active' : '') + '" data-gtab="lessons">📖 核心賞析課 (' + (guide.lessons || []).length + ')</button>' +
        '<button type="button" class="ani-pill ' + (tab === 'glossary' ? 'active' : '') + '" data-gtab="glossary">🗂️ 二次元辭典 (' + (guide.glossary || []).length + ')</button>' +
        '<button type="button" class="ani-pill ' + (tab === 'quiz' ? 'active' : '') + '" data-gtab="quiz">🎯 隨堂測驗 (' + (guide.quiz || []).length + ')</button>' +
      '</div>' +
      body;

    root.querySelectorAll('[data-gtab]').forEach(function (b) {
      b.onclick = function () { ANI.state.guideTab = b.getAttribute('data-gtab'); ANI.renderGuidePage(root); };

    var gs = document.getElementById('aniGlossSearch');

          el.style.display = (!q || el.getAttribute('data-gloss').indexOf(q) !== -1) ? '' : 'none';
        });

        ANI.renderGuidePage(root);

    var rst = document.getElementById('aniQuizReset');
    if (rst) {
      rst.onclick = function () {
        ANI.writeJson(ANI.QUIZ_KEY, { answers: {} });
        ANI.renderGuidePage(root);
      };
    }
  };
})();

  <script>
/* ✧ 動漫與二次元學院主路由、事件委派、版本更新紀錄與意見回饋 */
(function () {
  'use strict';
  var ANI = window.ANI;
  var ROUTES = ['home', 'seasonal', 'explore', 'studios', 'my-list', 'guide', 'feedback'];

  function isEnterSend(ev) {
    return ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing && ev.keyCode !== 229;
  }

  function renderFeedbackPage(root) {
    root.innerHTML =
      '<div style="max-width:640px;margin:0 auto;">' +
        '<div class="ani-sec-hd"><div><h2>💬 意見回饋與作品許願池</h2><div class="ani-sec-sub">想看哪部動畫或漫畫的無雷導讀、資料勘誤或功能建議，都歡迎告訴我們</div></div></div>' +
        '<form id="aniFeedbackForm" class="ani-panel">' +
          '<div style="margin-bottom:12px;">' +
            '<label for="fbCategory" style="display:block;font-size:13px;font-weight:800;margin-bottom:5px;">類型</label>' +
            '<select id="fbCategory" class="ani-select">' +
              '<option value="作品許願">✧ 許願新增動畫／漫畫</option>' +
              '<option value="資料修正">📝 資料或無雷勘誤</option>' +
              '<option value="功能建議">✨ 功能與介面建議</option>' +
            '</select>' +
          '</div>' +
          '<div style="margin-bottom:12px;">' +
            '<label for="fbTitle" style="display:block;font-size:13px;font-weight:800;margin-bottom:5px;">標題</label>' +
            '<input id="fbTitle" class="ani-input" maxlength="80" placeholder="例：想看《某作品》的無雷入坑導讀" />' +
          '</div>' +
          '<div style="margin-bottom:12px;">' +
            '<label for="fbMessage" style="display:block;font-size:13px;font-weight:800;margin-bottom:5px;">內容</label>' +
            '<textarea id="fbMessage" class="ani-input" rows="5" maxlength="2000" placeholder="請描述你的建議（請勿透露劇情結局）" required></textarea>' +
          '</div>' +
          '<button type="submit" class="ani-btn ani-btn-primary" id="fbSubmitBtn">📮 送出</button>' +
        '</form>' +
      '</div>';

    var form = document.getElementById('aniFeedbackForm');
    var btn = document.getElementById('fbSubmitBtn');
    var titleInput = document.getElementById('fbTitle');
    if (titleInput) {
      titleInput.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' && !isEnterSend(ev)) ev.preventDefault();
      });
    }
    form.onsubmit = function (ev) {
      ev.preventDefault();
      var cat = document.getElementById('fbCategory').value;
      var title = document.getElementById('fbTitle').value.trim();
      var msg = document.getElementById('fbMessage').value.trim();
      if (!msg) return;
      var done = function (text) {
        ANI.toast(text);
        form.reset();
        btn.disabled = false;
        btn.textContent = '📮 送出';
      };
      btn.disabled = true;
      btn.textContent = '⏳ 傳送中…';
      if (!ANI.isStatic()) {
        fetch(ANI.apiBase() + 'feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: cat, title: title, content: msg, page: window.location.hash })
        })
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (res && res.ok) done('🎉 感謝回饋，我們收到了！');
            else { btn.disabled = false; btn.textContent = '📮 送出'; ANI.toast((res && res.error) || '送出失敗'); }
          })
          .catch(function () { btn.disabled = false; btn.textContent = '📮 送出'; ANI.toast('送出失敗，請稍後再試'); });
      } else if (window.CampusNav && typeof window.CampusNav.sendStaticFeedback === 'function') {
        window.CampusNav.sendStaticFeedback('anime', { kindLabel: cat, title: title || '意見回饋', description: msg })
          .then(function () { done('🎉 已收到你的回饋，系統將自動轉寄給站長！'); })
          .catch(function () { done('🎉 已收到你的回饋，恢復連線時將自動補寄！'); });
      } else {
        btn.disabled = false;
        btn.textContent = '📮 送出';
        ANI.toast('離線版無法送出回饋，請到線上版填寫');
      }
    };
  }

  function openReleaseModal() {
    var rel = window.ANI_RELEASES || { current_version: '1.0.0', releases: [] };
    var backdrop = document.getElementById('releaseModal');
    var card = document.getElementById('releaseModalCard');
    if (!backdrop || !card) return;
    var items = (rel.releases || []).map(function (r) {
      var lis = (r.changes || []).map(function (c) { return '<li>' + ANI.esc(c) + '</li>'; }).join('');
      return '<div class="ani-block"><h4>v' + ANI.esc(r.version) + '｜' + ANI.esc(r.title || '') + '　<span class="ani-note">' + ANI.esc(r.date || '') + '</span></h4><ul>' + lis + '</ul></div>';
    }).join('');
    card.innerHTML =
      '<button type="button" class="ani-modal-close" id="aniRelClose" aria-label="關閉">✕</button>' +
      '<div class="ani-modal-hero"><h2 id="releaseModalTitle">✧ 版本更新紀錄</h2></div>' +
      '<div class="ani-modal-body">' + items + '</div>';
    document.getElementById('aniRelClose').onclick = function () { backdrop.classList.remove('open'); };
    backdrop.classList.add('open');
  }

  function parseHash() {
    var h = String(window.location.hash || '').replace(/^#\/?/, '').split('?')[0].trim();
    var parts = h.split('/');
    if (parts[0] === 'a' && parts[1]) {
      var wid = decodeURIComponent(parts[1]);
      return { route: wid.indexOf('s-') === 0 ? 'seasonal' : 'explore', open: wid };
    }
    return { route: ROUTES.indexOf(parts[0]) !== -1 ? parts[0] : 'home', open: '' };
  }

  ANI.refreshCurrentView = function () {
    var route = parseHash().route;
    var root = document.getElementById('appRoot');
    if (!root) return;
    document.querySelectorAll('#mainNav .ani-tab').forEach(function (t) {
      t.classList.toggle('active', t.getAttribute('data-route') === route);
    });
    ANI.syncHeaderBadges();
    if (route === 'seasonal') ANI.renderSeasonalPage(root);
    else if (route === 'explore') ANI.renderExplorePage(root);
    else if (route === 'studios') ANI.renderStudiosPage(root);
    else if (route === 'my-list') ANI.renderMyListPage(root);
    else if (route === 'guide') ANI.renderGuidePage(root);
    else if (route === 'feedback') renderFeedbackPage(root);
    else ANI.renderHomePage(root);
  };

  function go(route) {
    if (parseHash().route === route && window.location.hash === '#/' + route) ANI.refreshCurrentView();
    else window.location.hash = '#/' + route;
  }

  function init() {
    var rel = window.ANI_RELEASES || { current_version: '1.0.0' };
    var vb = document.getElementById('verBadge');
    if (vb) {
      vb.textContent = 'v' + (rel.current_version || '1.0.0');
      vb.onclick = openReleaseModal;
    }
    var dl = document.getElementById('dlOfflineBtn');
    if (dl && !ANI.isStatic()) dl.classList.add('show');

    document.querySelectorAll('#mainNav .ani-tab').forEach(function (btn) {
      btn.onclick = function () { go(btn.getAttribute('data-route')); };
    });
    document.querySelectorAll('[data-hdr-tab]').forEach(function (btn) {
      btn.onclick = function () {
        ANI.state.myTab = btn.getAttribute('data-hdr-tab');
        go('my-list');
      };
    });

    document.addEventListener('click', function (ev) {
      var t = ev.target;
      if (!t || !t.closest) return;
      var wl = t.closest('[data-toggle-wl]');
      if (wl) {
        ev.preventDefault();
        ANI.toggleWatchlist(wl.getAttribute('data-toggle-wl'));
        ANI.refreshCurrentView();
        return;
      }
      var st = t.closest('[data-set-status]');
      if (st) {
        ev.preventDefault();
        ANI.setWorkStatus(st.getAttribute('data-set-status'), st.getAttribute('data-status-val'));
        ANI.refreshCurrentView();
        return;
      }
      var open = t.closest('[data-open-work]');
      if (open) {
        ev.preventDefault();
        ANI.openModal(open.getAttribute('data-open-work'));
        return;
      }
      var goEl = t.closest('[data-go-route]');
      if (goEl) {
        ev.preventDefault();
        go(goEl.getAttribute('data-go-route'));
        return;
      }
      if (t.id === 'animeModal') ANI.closeModal();
      if (t.id === 'releaseModal') t.classList.remove('open');
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Escape') return;
      ANI.closeModal();
      var rm = document.getElementById('releaseModal');
      if (rm) rm.classList.remove('open');
    });

    window.addEventListener('hashchange', function () {
      var ph = parseHash();
      window.scrollTo(0, 0);
      ANI.closeModal();
      ANI.refreshCurrentView();
      if (ph.open) ANI.openModal(ph.open);
    });

    ANI.resetExplore();
    ANI.refreshCurrentView();
    var first = parseHash();
    if (first.open) ANI.openModal(first.open);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
