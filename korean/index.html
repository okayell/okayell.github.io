<style>
:root {
  --bg: #f6f8fc;
  --surface: #ffffff;
  --surface-2: #f1f5fb;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-2: #334155;
  --muted: #64748b;
  --primary: #1d4ed8;
  --primary-hover: #1e40af;
  --primary-soft: #eff6ff;
  --accent: #e11d48;
  --accent-soft: #fff1f2;
  --green: #16a34a;
  --amber: #d97706;
  --red: #dc2626;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.05), 0 6px 20px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 12px 36px rgba(15, 23, 42, 0.14);
  --font-ko: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", "PingFang TC", -apple-system, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 84px;
}
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }

.ko-txt {
  font-family: var(--font-ko);
  letter-spacing: 0.01em;
}
ruby { ruby-align: center; }
ruby rt {
  font-size: 0.56em;
  color: var(--accent);
  font-weight: 700;
  letter-spacing: 0.01em;
  user-select: none;
}
.ro {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 13px;
  color: #475569;
  letter-spacing: 0.02em;
}
.hanja {
  display: inline-flex; align-items: center;
  padding: 1px 8px; border-radius: 999px;
  font-size: 12px; font-weight: 700;
  background: #fefce8; color: #854d0e; border: 1px solid #fde68a;
}

/* ---------- 頂部列 ---------- */
.app-header {
  position: sticky; top: 0; z-index: 40;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: saturate(180%) blur(10px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1280px; margin: 0 auto; padding: 0 18px; min-height: 64px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.brand-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; min-width: 0; }
.campus-home {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 10px; border-radius: 999px;
  background: var(--primary-soft); color: var(--primary);
  border: 1px solid #bfdbfe;
  font-size: 12.5px; font-weight: 800; text-decoration: none !important;
  white-space: nowrap; transition: transform .12s, background .15s;
}
.campus-home:hover { background: #dbeafe; transform: translateY(-1px); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none !important; flex-shrink: 0; }
.brand-logo {
  width: 38px; height: 38px; border-radius: 11px;
  background: linear-gradient(135deg, #1d4ed8 0%, #e11d48 100%);
  color: #fff; font-family: var(--font-ko); font-weight: 800; font-size: 21px;
  display: grid; place-items: center;
  box-shadow: 0 4px 12px rgba(29, 78, 216, 0.28);
}
.brand-txt { display: flex; flex-direction: column; line-height: 1.15; }
.brand-txt b { font-size: 16.5px; letter-spacing: -0.01em; white-space: nowrap; }
.brand-txt small { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.ver-badge {
  appearance: none; border: 1px solid #bfdbfe; background: var(--primary-soft); color: var(--primary);
  font: inherit; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
  cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: background 0.15s, border-color 0.15s;
}
.ver-badge:hover { background: #dbeafe; border-color: #93c5fd; }
.ver-badge:empty { display: none; }

.top-nav { display: flex; gap: 2px; flex-wrap: nowrap; flex-shrink: 1; min-width: 0; }
.nav-link {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 7px 9px; border-radius: 10px; color: var(--text-2);
  font-weight: 600; font-size: 13.8px; text-decoration: none !important;
  white-space: nowrap; flex-shrink: 0;
  transition: background 0.15s, color 0.15s;
}
.nav-link:hover { background: var(--surface-2); color: var(--text); }
.nav-link.active { background: var(--primary-soft); color: var(--primary); }
.nav-ic { font-family: var(--font-ko); font-weight: 800; }
.nav-badge {
  background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
  padding: 1px 7px; border-radius: 999px; line-height: 1.4;
}

.header-stats { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; white-space: nowrap; }
.hs-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 0 11px; height: 34px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: 13.5px; font-weight: 700; color: var(--text-2); text-decoration: none !important;
  white-space: nowrap; flex-shrink: 0; line-height: 1;
}
.hs-chip.hot { background: #fff7ed; border-color: #fed7aa; color: #c2410c; }
.hs-goal {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13.5px; font-weight: 700; color: var(--text-2); text-decoration: none !important;
  white-space: nowrap; flex-shrink: 0;
}
.ring { width: 32px; height: 32px; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: #e2e8f0; stroke-width: 3.5; }
.ring-fg { fill: none; stroke: var(--primary); stroke-width: 3.5; stroke-linecap: round; transition: stroke-dashoffset 0.4s; }
.hs-goal.done .ring-fg { stroke: var(--green); }

/* ---------- 行動底欄 ---------- */
.mobile-nav { display: none; }
@media (max-width: 1200px) {
  .brand-txt small { display: none; }
}
@media (max-width: 1060px) {
  .top-nav { display: none; }
  .mobile-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    display: grid; grid-template-columns: repeat(9, minmax(0, 1fr));
    background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    padding: 4px 2px calc(4px + env(safe-area-inset-bottom));
  }
  .mnav-link {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 6px 1px; color: var(--muted); font-size: 18px; text-decoration: none !important;
    min-width: 0;
  }
  .mnav-link small { font-size: 10.5px; font-weight: 700; white-space: nowrap; }
  .mnav-link.active { color: var(--primary); }
  .mnav-link .nav-badge { position: absolute; top: 2px; right: 12%; padding: 0 5px; font-size: 10px; }
}

/* ---------- 版面 ---------- */
.app-main { max-width: 1120px; margin: 0 auto; padding: 24px 20px 40px; outline: none; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 20px; }
.page-head h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.page-acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px 22px;
  box-shadow: var(--shadow); margin-bottom: 16px;
}
.card h2 { font-size: 18.5px; margin: 0 0 6px; }
.card h3 { font-size: 16.5px; margin: 0 0 6px; }
.card p { margin: 4px 0; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.center { text-align: center; padding: 36px 22px; }
.big-emo { font-size: 46px; line-height: 1.1; margin-bottom: 8px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }

/* ---------- 按鈕 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: inherit; font-weight: 600; font-size: 15px;
  padding: 9px 16px; border-radius: 11px;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  cursor: pointer; text-decoration: none !important;
  transition: transform 0.06s, background 0.15s, border-color 0.15s, box-shadow 0.15s;
  user-select: none;
}
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: #94a3b8; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(29, 78, 216, 0.25); }
.btn.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border); }
.btn.sm { padding: 6px 12px; font-size: 13.5px; border-radius: 9px; }
.btn.lg { padding: 12px 22px; font-size: 16px; border-radius: 13px; }
.btn.danger { color: var(--red); border-color: #fecaca; }
.btn.danger:hover:not(:disabled) { background: #fef2f2; }
.btn.is-speaking, .kc.is-speaking, .hm-cell.is-speaking {
  background: var(--primary-soft) !important; border-color: var(--primary) !important; color: var(--primary) !important;
  animation: pulse 1.1s infinite;
}
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(29, 78, 216, 0.32); } 50% { box-shadow: 0 0 0 6px rgba(29, 78, 216, 0); } }

.icon-btn {
  display: inline-grid; place-items: center; width: 34px; height: 34px;
  border-radius: 9px; border: 1px solid transparent; background: transparent;
  cursor: pointer; font-size: 16px; color: var(--text-2); flex-shrink: 0;
}
.icon-btn:hover { background: var(--surface-2); border-color: var(--border); }
.icon-btn.is-speaking { background: var(--primary-soft); color: var(--primary); }

/* ---------- 等級徽章 ---------- */
.lv {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 2px 9px; border-radius: 999px; font-weight: 800; font-size: 12px; letter-spacing: 0.03em;
  background: var(--surface-2); color: var(--text);
}
.lv-a1 { background: #dcfce7; color: #15803d; }
.lv-a2 { background: #e0f2fe; color: #0369a1; }
.lv-b1 { background: #dbeafe; color: #1d4ed8; }
.lv-b2 { background: #ede9fe; color: #6d28d9; }
.lv-c1 { background: #fce7f3; color: #be185d; }
.lv-c2 { background: #fef3c7; color: #b45309; }
.topik {
  display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px;
  font-size: 12px; font-weight: 800; background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe;
}
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: var(--surface-2); color: var(--text-2);
}
.chip.ok { background: #dcfce7; color: #15803d; }
.chip.due { background: #fef3c7; color: #b45309; }
.chip.ai { background: #f3e8ff; color: #7e22ce; }

/* ---------- 首頁 ---------- */
.hero {
  display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between;
  background: linear-gradient(135deg, #172554 0%, #1d4ed8 58%, #be123c 100%);
  color: #fff; border-radius: 20px; padding: 26px 28px; margin-bottom: 22px;
  box-shadow: 0 12px 32px rgba(29, 78, 216, 0.24);
}
.hero-greet { font-size: 14px; color: #bfdbfe; font-weight: 600; }
.hero h1 { margin: 4px 0 6px; font-size: 27px; letter-spacing: -0.02em; }
.hero p { margin: 0 0 14px; color: #e2e8f0; max-width: 560px; }
.hero-acts { display: flex; flex-wrap: wrap; gap: 10px; }
.hero .btn:not(.primary) { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.3); color: #fff; }
.hero .btn:not(.primary):hover { background: rgba(255, 255, 255, 0.24); }
.hero .btn.primary { background: #fff; border-color: #fff; color: #1e3a8a; font-weight: 700; }
.hero .btn.primary:hover { background: #eff6ff; }
.hero-kpis { display: grid; grid-template-columns: repeat(3, minmax(84px, 1fr)); gap: 10px; }
.kpi {
  background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 14px; padding: 12px 14px; text-align: center;
}
.kpi b { display: block; font-size: 22px; font-weight: 800; line-height: 1.2; }
.kpi span { font-size: 12px; color: #dbeafe; }

.sec-title { font-size: 18px; margin: 22px 0 10px; letter-spacing: -0.01em; }
.plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 12px; }
.plan-step {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; color: var(--text); text-decoration: none !important;
  box-shadow: var(--shadow); transition: transform 0.12s, border-color 0.15s;
}
.plan-step:hover { transform: translateY(-2px); border-color: var(--primary); }
.ps-ic { font-size: 28px; width: 46px; height: 46px; border-radius: 13px; background: var(--primary-soft); display: grid; place-items: center; flex-shrink: 0; }
.ps-ic.hangul-logo { font-family: var(--font-ko); font-weight: 800; color: var(--primary); font-size: 24px; }
.ps-body { flex: 1; min-width: 0; }
.ps-tag { font-size: 12px; font-weight: 700; color: var(--primary); }
.ps-body b { display: block; font-size: 15.5px; margin: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ps-body small { color: var(--muted); font-size: 13px; display: block; }
.ps-go { font-size: 20px; color: var(--muted); }

/* 每日一詞 */
.wotd { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
.wotd-tag { font-size: 12px; font-weight: 700; color: var(--primary); text-transform: uppercase; }
.wotd-word { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 4px 0; }
.wotd-word b { font-size: 25px; }
.wotd-zh { font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
.wotd-ex { font-size: 15.5px; color: var(--text); line-height: 1.9; }
.wotd-acts { display: flex; gap: 8px; }

/* 等級帶 */
.level-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; }
.lv-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 16px; color: var(--text); text-decoration: none !important;
  box-shadow: var(--shadow); transition: transform 0.12s, border-color 0.15s;
}
.lv-card:hover { transform: translateY(-2px); border-color: var(--lv); }
.lv-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 4px; flex-wrap: wrap; }
.lv-cnt { font-size: 12px; color: var(--muted); font-weight: 700; }
.lv-card b { display: block; font-size: 15.5px; }
.lv-card small { display: block; font-size: 12.5px; color: var(--muted); min-height: 34px; margin: 2px 0 8px; }
.lv-bar { height: 6px; background: #eef2f7; border-radius: 999px; overflow: hidden; }
.lv-bar i { display: block; height: 100%; background: var(--lv); border-radius: 999px; }

/* 課程卡片網格 */
.lesson-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.lcard {
  display: flex; flex-direction: column; gap: 6px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; color: var(--text); text-decoration: none !important;
  box-shadow: var(--shadow); transition: transform 0.12s, border-color 0.15s, box-shadow 0.15s;
}
.lcard:hover { transform: translateY(-2px); border-color: var(--primary); box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); }
.lcard.done { border-color: #bbf7d0; }
.lc-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lc-topic { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.lc-done { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--green); }
.lc-title { font-size: 17.5px; margin: 2px 0 0; line-height: 1.5; }
.lc-zh { font-size: 14px; color: var(--text-2); font-weight: 600; }
.lc-scene { font-size: 13.5px; color: var(--muted); margin: 0; flex: 1; }
.lc-foot { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); padding-top: 6px; border-top: 1px dashed var(--border); }

/* ---------- 課程庫篩選 ---------- */
.filter-bar { margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
.lib-levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.lib-lv {
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
  padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface);
  cursor: pointer; font: inherit; text-align: left; transition: border-color 0.15s, background 0.15s;
}
.lib-lv b { font-size: 15px; color: var(--lv, var(--text)); }
.lib-lv span { font-size: 12px; color: var(--text-2); font-weight: 600; }
.lib-lv em { font-style: normal; font-size: 11.5px; color: var(--muted); }
.lib-lv.active { border-color: var(--lv, var(--primary)); background: var(--primary-soft); }
.filter-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search-in {
  flex: 1; min-width: 200px; padding: 9px 14px; border-radius: 11px;
  border: 1px solid var(--border-strong); font: inherit; background: var(--surface);
}
.topic-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); font: inherit; font-size: 13px; color: var(--text-2); cursor: pointer;
}
.pill.active { background: var(--text); color: #fff; border-color: var(--text); }

/* ---------- 單一課程 ---------- */
.lesson-head { margin-bottom: 14px; }
.lh-crumb { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.ko-title { font-size: 26px; margin: 4px 0 2px; line-height: 1.5; }
.lh-sub { font-size: 16px; font-weight: 600; color: var(--text-2); }
.lh-scene { color: var(--muted); margin: 4px 0 0; }

.mode-tabs {
  display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.mtab {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  padding: 10px 14px; border-radius: 11px 11px 0 0; border: 1px solid transparent; border-bottom: none;
  background: transparent; font: inherit; font-weight: 700; font-size: 14.5px; color: var(--muted); cursor: pointer;
}
.mtab:hover { color: var(--text); background: var(--surface-2); }
.mtab.active { background: var(--surface); color: var(--primary); border-color: var(--border); margin-bottom: -1px; }

.ctrl-bar {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  padding: 14px 18px;
}
.ctrl-left, .ctrl-right { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.rate-ctl { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 2px; border: 1px solid var(--border); }
.seg button {
  border: 0; background: transparent; padding: 4px 9px; border-radius: 7px;
  font: inherit; font-size: 12.5px; font-weight: 700; color: var(--text-2); cursor: pointer;
}
.seg button.active { background: var(--surface); color: var(--primary); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06); }
.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; color: var(--text-2); cursor: pointer; user-select: none; }

.dialogue { display: flex; flex-direction: column; gap: 10px; }
.dline {
  display: flex; gap: 12px; align-items: flex-start;
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; box-shadow: var(--shadow); transition: border-color 0.15s, background 0.15s;
}
.dline.playing { border-color: var(--primary); background: var(--primary-soft); }
.sp-badge {
  min-width: 58px; padding: 5px 10px; border-radius: 10px; text-align: center;
  background: #dbeafe; color: #1e40af; font-family: var(--font-ko); font-weight: 700; font-size: 13px; flex-shrink: 0;
}
.dline.sp-b .sp-badge { background: #fce7f3; color: #9d174d; }
.dl-body { flex: 1; min-width: 0; }
.dl-ko { font-size: 20px; font-weight: 500; line-height: 2.05; cursor: pointer; }
.dl-ro { margin-top: 1px; }
.dl-zh { color: var(--text-2); font-size: 14.5px; margin-top: 3px; }
.dl-acts { display: flex; gap: 2px; }
.blind-mask { display: inline-block; padding: 4px 12px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-size: 14px; font-family: inherit; }

.w { border-radius: 5px; padding: 0 2px; transition: background 0.12s; cursor: pointer; }
.w:hover { background: #dbeafe; }
.w.hl { background: #fef9c3; box-shadow: inset 0 -2px 0 #facc15; font-weight: 600; }
.w.hl:hover { background: #fef08a; }

.lesson-next-cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-top: 16px; background: var(--primary-soft); border-color: #bfdbfe; }
.next-btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* 單字點查氣泡 */
.wpop-backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(15, 23, 42, 0.28); display: grid; place-items: center; padding: 16px; }
.wpop {
  background: var(--surface); border-radius: 18px; padding: 20px 22px; width: min(440px, 100%);
  box-shadow: var(--shadow-lg); border: 1px solid var(--border);
}
.wpop-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.wpop-w { font-size: 26px; }
.wpop-x { margin-left: auto; }
.wpop-ro { margin-top: 2px; }
.wpop-zh { font-size: 16.5px; font-weight: 700; margin: 8px 0 4px; }
.wpop-ex { font-size: 15px; color: var(--text-2); background: var(--surface-2); padding: 8px 12px; border-radius: 10px; line-height: 1.9; }
.wpop-acts { margin-top: 14px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* ---------- 口說跟讀 / 角色扮演 / 聽寫 / 測驗 ---------- */
.prac-prog { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; color: var(--muted); font-size: 13.5px; font-weight: 700; }
.pbar { height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; flex: 1; max-width: 260px; }
.pbar i { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width 0.25s; }
.sh-target { background: var(--surface-2); border-radius: 14px; padding: 16px 18px; margin: 12px 0; }
.sh-sp { font-size: 12.5px; font-weight: 700; color: var(--primary); }
.sh-ko { font-size: 24px; font-weight: 600; margin: 4px 0; line-height: 2; }
.sh-zh { color: var(--text-2); margin-top: 4px; }
.sh-PromptBtns, .sh-mic-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
.mic-btn { background: linear-gradient(135deg, #1d4ed8, #e11d48); border: 0; color: #fff; }
.mic-btn.recording { background: #dc2626; animation: pulse 1s infinite; }
.sh-result { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 14px; }
.score-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.score-num { font-size: 30px; font-weight: 900; padding: 4px 14px; border-radius: 12px; }
.score-num.great { background: #dcfce7; color: #15803d; }
.score-num.good { background: #fef9c3; color: #a16207; }
.score-num.try { background: #fee2e2; color: #b91c1c; }
.scored-line { font-size: 20px; line-height: 2; margin: 6px 0; display: flex; flex-wrap: wrap; gap: 6px; }
.tk { padding: 2px 7px; border-radius: 7px; font-weight: 600; }
.tk.ok { background: #dcfce7; color: #166534; }
.tk.alt { background: #dbeafe; color: #1e40af; }
.tk.near { background: #fef3c7; color: #92400e; }
.tk.miss { background: #fee2e2; color: #991b1b; text-decoration: underline wavy #ef4444; }
.sh-nav { display: flex; justify-content: space-between; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }

.sh-jumps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.sh-jump {
  min-width: 30px; height: 28px; padding: 0 8px; border-radius: 8px; border: 1.5px solid var(--border);
  background: var(--surface); font: inherit; font-size: 12.5px; font-weight: 700; color: var(--muted); cursor: pointer;
}
.sh-jump:hover { border-color: var(--primary); color: var(--primary); }
.sh-jump.ok { background: #dcfce7; border-color: #86efac; color: #15803d; }
.sh-jump.mid { background: #fef9c3; border-color: #fde047; color: #a16207; }
.sh-jump.low { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; }
.sh-jump.cur { outline: 2px solid var(--primary); outline-offset: 1px; color: var(--primary); font-weight: 800; }

.role-ctrl-card { padding: 14px 18px; }
.role-pick { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.role-seg-wrap { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.role-top-btns { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.role-subbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--border); }
.role-done-banner {
  margin-top: 12px; padding: 14px 18px; background: linear-gradient(135deg, #f0fdf4 0%, #eff6ff 100%);
  border-color: #86efac; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.role-done-left { display: flex; align-items: center; gap: 12px; }
.role-done-acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.role-stage { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
.rbub { border: 1.5px solid var(--border); border-radius: 14px; padding: 12px 16px; background: var(--surface); transition: border-color 0.15s, box-shadow 0.15s; }
.rbub.mine { border-color: #bfdbfe; background: #f8fbff; }
.rbub.cur { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 3px #dbeafe; }
.rbub.done { border-color: #bbf7d0; background: #f0fdf4; }
.rbub.recording-row { border-color: #ef4444; background: #fff5f5; box-shadow: 0 0 0 3px #fee2e2; }
.rbub-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.rbub-main { flex: 1; min-width: 0; }
.rbub-acts { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; justify-content: flex-end; flex-shrink: 0; }
.rb-mic-btn { font-size: 14px; padding: 8px 14px; border-radius: 11px; white-space: nowrap; font-weight: 700; box-shadow: 0 2px 8px rgba(29, 78, 216, 0.18); }
.rb-who-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 2px; }
.rb-who { font-size: 12.5px; font-weight: 800; color: var(--primary); }
.rbub.theirs .rb-who { color: var(--text-2); }
.rb-turn-pill { font-size: 11.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: #dbeafe; color: #1d4ed8; }
.rb-score-pill { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px; }
.rb-score-pill.great { background: #dcfce7; color: #15803d; }
.rb-score-pill.good { background: #fef9c3; color: #a16207; }
.rb-score-pill.try { background: #fee2e2; color: #b91c1c; }
.rb-ko { font-size: 19px; font-weight: 500; margin: 2px 0; line-height: 1.95; }
.rb-scored { margin: 2px 0; font-size: 18.5px; }
.rb-zh { font-size: 13.5px; color: var(--muted); }
.rb-heard { margin-top: 3px; }
.rb-live { color: #dc2626; font-weight: 600; margin-top: 3px; }
.rb-live:empty { display: none; }
@media (max-width: 680px) {
  .rbub-row { flex-direction: column; align-items: stretch; gap: 10px; }
  .rbub-acts { justify-content: flex-start; padding-top: 8px; border-top: 1px dashed var(--border); }
}

.dict-in {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--border-strong);
  font-family: var(--font-ko); font-size: 19px; margin: 10px 0; resize: vertical;
}
.dict-in:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px #dbeafe; }
.dict-hint { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; padding: 8px 12px; border-radius: 10px; margin-bottom: 6px; font-size: 18px; }

.qcard h3 { margin-bottom: 10px; line-height: 1.7; }
.qopts { display: grid; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 10px; text-align: left;
  padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface);
  font: inherit; cursor: pointer; transition: border-color 0.12s, background 0.12s;
}
.opt:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }
.opt-k { width: 26px; height: 26px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex-shrink: 0; }
.opt.sel { border-color: var(--primary); background: var(--primary-soft); }
.opt.right { border-color: var(--green); background: #f0fdf4; }
.opt.wrong { border-color: var(--red); background: #fef2f2; }
.q-exp { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; line-height: 1.8; }
.q-exp.ok { background: #f0fdf4; color: #166534; }
.q-exp.bad { background: #fef2f2; color: #991b1b; }
.quiz-submit { display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }

/* 重點單字卡 */
.vocab-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.vocab-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.vcard { border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; background: var(--surface-2); display: flex; flex-direction: column; gap: 4px; }
.vc-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.vc-top b { font-size: 20px; }
.vc-top button:last-child { margin-left: auto; }
.vc-zh { font-weight: 700; color: var(--text); }
.vc-ex { font-size: 14.5px; color: var(--text-2); flex: 1; line-height: 1.9; }
.tip-card { background: #fffbeb; border-color: #fde68a; }

/* ---------- 個人單字本 & 複習 ---------- */
.vlist { display: flex; flex-direction: column; gap: 10px; }
.vitem {
  display: flex; gap: 12px; align-items: flex-start; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 18px; box-shadow: var(--shadow);
}
.vi-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.vi-w { font-size: 21px; font-weight: 700; }
.vi-zh { font-weight: 600; color: var(--text-2); margin: 2px 0; }
.vi-ex { font-size: 14.5px; color: var(--muted); line-height: 1.85; }
.vi-acts { display: flex; gap: 6px; flex-shrink: 0; }

.flash { min-height: 280px; display: flex; flex-direction: column; justify-content: center; text-align: center; }
.fl-word { font-size: 36px; font-weight: 700; line-height: 1.6; }
.fl-front, .fl-back { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.fl-zh { font-size: 22px; font-weight: 700; color: var(--primary); }
.fl-ex { font-size: 16.5px; color: var(--text-2); max-width: 540px; line-height: 1.95; }
.fl-grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 520px; margin-top: 12px; }
.grade {
  display: flex; flex-direction: column; align-items: center; padding: 10px 6px;
  border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; font: inherit; font-weight: 700;
}
.grade small { font-weight: 500; font-size: 11.5px; color: var(--muted); }
.grade.g0 { border-color: #fecaca; color: #b91c1c; }
.grade.g1 { border-color: #fed7aa; color: #c2410c; }
.grade.g2 { border-color: #bfdbfe; color: #1d4ed8; }
.grade.g3 { border-color: #bbf7d0; color: #15803d; }
.grade:hover { transform: translateY(-1px); background: var(--surface-2); }

/* 複習中樞 & 測驗作答 */
.rv-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.rv-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; text-align: center; box-shadow: var(--shadow); }
.rv-stat b { display: block; font-size: 24px; font-weight: 800; color: var(--primary); line-height: 1.2; }
.rv-stat span { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.rv-modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; margin-top: 10px; }
.rv-mode {
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left;
  padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface-2);
  cursor: pointer; font: inherit; transition: border-color 0.15s, transform 0.1s, background 0.15s;
}
.rv-mode:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); transform: translateY(-2px); }
.rv-mode:disabled { opacity: 0.45; cursor: not-allowed; }
.rv-ic { font-size: 24px; font-family: var(--font-ko); }
.rv-mode b { font-size: 15.5px; }
.rv-mode small { font-size: 12.5px; color: var(--muted); }
.rv-setup { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 14px; }
.rv-setup select { margin-left: 6px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border-strong); font: inherit; }

.rv-tag { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 12.5px; font-weight: 700; margin-bottom: 10px; }
.rv-prompt { font-size: 24px; font-weight: 700; margin: 6px 0 12px; line-height: 1.7; }
.rv-listen-box { display: flex; align-items: center; gap: 10px; margin: 8px 0 14px; flex-wrap: wrap; }
.rv-input { display: flex; gap: 8px; margin: 8px 0; }
.rv-input .dict-in { margin: 0; flex: 1; }
.rv-fb { margin-top: 14px; padding: 14px 16px; border-radius: 12px; }
.rv-fb.ok { background: #f0fdf4; border: 1px solid #bbf7d0; }
.rv-fb.bad { background: #fef2f2; border: 1px solid #fecaca; }
.rv-fb-hd { font-weight: 800; font-size: 16px; margin-bottom: 4px; }
.rv-fb.ok .rv-fb-hd { color: #15803d; }
.rv-fb.bad .rv-fb-hd { color: #b91c1c; }
.rv-ans { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15.5px; }
.rv-ans b { font-size: 20px; }
.rv-ex { font-size: 14.5px; color: var(--text-2); margin-top: 4px; line-height: 1.85; }
.rv-next-row { display: flex; justify-content: flex-end; margin-top: 12px; }

/* ---------- 學習進度 ---------- */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.kpi-card b { display: block; font-size: 26px; font-weight: 800; color: var(--primary); }
.kpi-card span { font-size: 13px; color: var(--muted); }
.bars14 { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; align-items: end; height: 150px; padding-top: 16px; }
.bcol { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 4px; }
.bbar { width: 100%; background: #bfdbfe; border-radius: 6px 6px 2px 2px; min-height: 3px; transition: height 0.3s; }
.bbar.hit { background: var(--primary); }
.bval { font-size: 11px; color: var(--muted); font-weight: 700; }
.blbl { font-size: 11px; color: var(--muted); }
.lv-prog-row { display: grid; grid-template-columns: 168px 1fr 64px; gap: 10px; align-items: center; padding: 7px 0; }
.form-grid { display: grid; gap: 14px; margin-top: 10px; }
.form-grid label, .modal-bd label { display: flex; flex-direction: column; gap: 5px; font-weight: 600; font-size: 14px; }
.form-grid select, .form-grid input, .modal-bd input, .modal-bd select, .modal-bd textarea {
  padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border-strong); font: inherit; background: var(--surface);
}
.voice-TestRow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.data-acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.static-export-box { margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
.static-export-box code { background: #e2e8f0; padding: 1px 6px; border-radius: 5px; font-size: 12.5px; }

/* ---------- 版本資訊與更新日誌 ---------- */
.rel-modal { width: min(680px, 100%); }
.rel-modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.rel-tabs { display: inline-flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 10px; }
.rel-tab {
  appearance: none; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 700;
  color: var(--muted); padding: 5px 12px; border-radius: 8px; cursor: pointer;
}
.rel-tab.active { background: #fff; color: var(--primary); box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08); }
.rel-list { display: flex; flex-direction: column; gap: 12px; max-height: 62vh; overflow-y: auto; padding-right: 4px; }
.rel-card { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--surface-2); }
.rel-card.latest { border-color: #93c5fd; background: #f8fbff; }
.rel-card-hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.rel-ver { font-weight: 800; font-size: 15px; color: var(--primary); background: var(--primary-soft); padding: 2px 9px; border-radius: 999px; }
.rel-date { font-size: 12.5px; color: var(--muted); }
.rel-tag-latest { font-size: 11.5px; font-weight: 700; color: #15803d; background: #dcfce7; padding: 1px 8px; border-radius: 999px; }
.rel-title { font-weight: 700; font-size: 15px; margin: 2px 0 6px; }
.rel-notes { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--text-2); }
.rel-notes li { margin: 3px 0; }
.rel-stats { margin-top: 8px; font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.rel-status-box { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--surface-2); margin-bottom: 12px; }
.rel-dirty { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13.5px; }
.rel-dirty.clean { color: var(--green); }
.rel-dirty.changed { color: var(--amber); }
.rel-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
.rel-tbl th, .rel-tbl td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; }
.rel-tbl code { font-size: 12px; }

/* ---------- Modal & Toast ---------- */
.modal-backdrop { position: fixed; inset: 0; z-index: 70; background: rgba(15, 23, 42, 0.42); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 20px; width: min(560px, 100%); max-height: 90vh; overflow: auto; box-shadow: var(--shadow-lg); }
.modal-hd { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 10px; }
.modal-hd h3 { margin: 0; font-size: 19px; }
.modal-bd { padding: 6px 22px 18px; display: flex; flex-direction: column; gap: 12px; }
.modal-ft { padding: 12px 22px 18px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border); }
.ob-choices { display: grid; gap: 8px; margin-top: 4px; }
.ob-btn {
  display: flex; flex-direction: column; align-items: flex-start; padding: 12px 16px;
  border-radius: 13px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; font: inherit; text-align: left;
}
.ob-btn:hover { border-color: var(--primary); background: var(--primary-soft); }
.ob-btn b { font-size: 15.5px; }
.ob-btn span { font-size: 13px; color: var(--muted); }

.toast-root { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.toast {
  background: #0f172a; color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
  box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(8px); transition: opacity 0.2s, transform 0.2s;
}
.toast.in { opacity: 1; transform: translateY(0); }

.spin { width: 16px; height: 16px; border: 2.5px solid rgba(255, 255, 255, 0.35); border-top-color: #fff; border-radius: 50%; display: inline-block; animation: sp 0.7s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

/* ==========================================================================
   四十音專區（母音・子音・雙子音・收音・가나다拼字表・連音規則）
   ========================================================================== */
.hangul-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.ktab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface);
  font: inherit; font-weight: 700; font-size: 14px; color: var(--text-2); cursor: pointer;
}
.ktab small { font-weight: 600; color: var(--muted); font-size: 12px; }
.ktab.active { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
.ktab.active small { color: var(--primary); }

.hangul-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.hangul-side { position: sticky; top: 80px; display: flex; flex-direction: column; gap: 14px; }
.hangul-group-desc { margin-bottom: 12px; padding: 12px 16px; background: #f8fbff; border-color: #dbeafe; }

.ktable { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.kt-sec { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; background: #fbfdff; }
.kt-sec-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.kt-sec-hd b { font-size: 15px; color: var(--text); }
.kt-sec-desc { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.kt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }

.kc {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 76px; padding: 8px 6px; border-radius: 12px;
  border: 1.5px solid var(--border); background: #fff; cursor: pointer; font: inherit;
  transition: transform 0.08s, border-color 0.15s, background 0.15s, box-shadow 0.15s;
}
.kc:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(29, 78, 216, 0.1); }
.kc.sel { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 2px #bfdbfe; }
.kc b { font-size: 28px; font-weight: 700; line-height: 1.15; color: var(--text); }
.kc small { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); font-weight: 700; }
.kc em { font-style: normal; font-size: 11px; color: var(--primary); font-weight: 700; }
.kc::after {
  content: ""; position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%;
  background: transparent;
}
.kc.lv-seen::after { background: #f59e0b; }
.kc.lv-fam::after { background: #3b82f6; }
.kc.lv-mas::after { background: #16a34a; }

.kt-legend { display: flex; flex-wrap: wrap; gap: 12px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 12.5px; color: var(--muted); }
.lg-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e2e8f0; margin-right: 4px; vertical-align: middle; }
.lg-dot.seen { background: #f59e0b; } .lg-dot.fam { background: #3b82f6; } .lg-dot.mas { background: #16a34a; }

/* 가나다 19×10 子母音拼字表 */
.hmatrix-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); background: #fff; }
.hmatrix { width: 100%; border-collapse: collapse; min-width: 640px; }
.hmatrix th, .hmatrix td { border: 1px solid var(--border); padding: 4px; text-align: center; }
.hmatrix thead th { background: var(--primary-soft); color: var(--primary); font-family: var(--font-ko); font-size: 16px; padding: 7px 4px; position: sticky; top: 0; }
.hmatrix thead th small { display: block; font-size: 11px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
.hmatrix tbody th { background: #f8fafc; font-family: var(--font-ko); font-size: 16px; padding: 6px 8px; position: sticky; left: 0; z-index: 2; white-space: nowrap; }
.hmatrix tbody th small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 600; }
.hm-cell {
  width: 100%; border: 0; background: transparent; border-radius: 8px; padding: 5px 2px;
  cursor: pointer; font: inherit; display: flex; flex-direction: column; align-items: center; gap: 1px;
  transition: background 0.12s, transform 0.08s;
}
.hm-cell:hover { background: var(--primary-soft); transform: scale(1.04); }
.hm-cell b { font-family: var(--font-ko); font-size: 19px; font-weight: 700; color: var(--text); line-height: 1.15; }
.hm-cell small { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--muted); }
.hm-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px; background: var(--primary-soft); border: 1px solid #bfdbfe; margin-bottom: 10px; }
.hm-banner b { font-size: 20px; color: var(--primary); font-family: var(--font-ko); }

/* 字母詳情卡 */
.kd-top { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; }
.kd-ch {
  font-size: 62px; font-weight: 700; line-height: 1.05; min-width: 92px; padding: 8px; text-align: center;
  background: var(--primary-soft); color: var(--primary); border-radius: 18px;
}
.kd-meta { flex: 1; min-width: 0; }
.kd-ro { font-size: 21px; font-weight: 800; font-family: ui-monospace, Menlo, monospace; color: var(--text); }
.kd-pair { font-size: 13.5px; color: var(--text-2); margin: 3px 0 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kd-acts { display: flex; gap: 6px; flex-wrap: wrap; }
.kd-src { font-size: 13.5px; color: var(--text-2); background: var(--surface-2); padding: 9px 11px; border-radius: 10px; margin-bottom: 8px; line-height: 1.65; }

<script>/* /js/campus_nav.js */
/* 開心學園 · 校園導覽與跨學院成就系統（共用片段 campus_nav.js）
 *
 * 唯一來源：~/campus_map_platform/shared/campus_nav.js
 *   各工具 static/ 裡的副本請勿直接修改 —— 改這裡，再跑 python3 ~/campus_map_platform/tools/sync_campus_nav.py 同步。
 *
 * 用法（每個學院／實戰工具）：
 *   1. 在 header 品牌區最前面放 placeholder（工具 id 見 ~/campus_map_platform/registry.json）：
 *        <a class="campus-home" data-campus-home="english" href="https://okayell.github.io/">🏫 校園</a>
 *      深色 header 加 data-campus-theme="dark"。
 *   2. 用一般的 <script src="…/campus_nav.js"><\/script> 載入（各工具的 build_dist 會把它內嵌進單一 index.html）。
 *   沒有 placeholder 時，會在畫面左上角產生浮動的「🏫 校園」按鈕。
 *
 * 連結目標：
 *   - GitHub Pages（*.github.io）            → 同網域根目錄 /（= https://okayell.github.io/ 校園地圖）
 *   - Cloudtop 本機（已知工具 port，非 localhost）→ 同主機 :8919 的本機校園地圖
 *   - file:// 單一檔、localhost、其他網域        → https://okayell.github.io/

  }

  function syncNavClock(srvSec) {
    if (srvSec > 2e10) srvSec = Math.floor(srvSec / 1000);
    if (srvSec > 1700000000) {
      _clockOffsetSec = Math.floor(srvSec) - Math.floor(Date.now() / 1000);
    }
  }

  function isNavBot() {
    if (typeof navigator !== 'undefined' && (navigator.webdriver || /HeadlessChrome|PhantomJS|Playwright|Puppeteer|SlimerJS/i.test(navigator.userAgent || ''))) return true;
    if (window.location && window.location.protocol === 'file:') return true;
    return false;
  }

  function markInternalNav() {
    _internalNav = true;
    try { window.localStorage.setItem(NAV_TS_KEY, String(Date.now())); } catch (e) { /* ignore */ }
  }

  function isInternalHref(href) {
    if (!href) return false;
    try {
      var u = new URL(href, window.location.href);
      if (u.protocol !== 'http:' && u.protocol !== 'https:') return false;
      if (u.hostname === window.location.hostname) return true;
      if (/(^|\.)okayell\.github\.io$/i.test(u.hostname)) return true;
    } catch (e) { /* ignore */ }
    return false;
  }

  function touchTabLease(locId) {
    var otherAlive = 0;
    try {
      var now = Date.now();
      var map = JSON.parse(window.localStorage.getItem(TABS_KEY) || '{}') || {};
      var next = {};
      Object.keys(map).forEach(function (k) {
        var it = map[k];
        if (!it || now - (+it.ts || 0) > TAB_LEASE_MS) return;
        next[k] = it;
        if (k !== TAB_ID) otherAlive += 1;
      });
      next[TAB_ID] = { ts: now, loc: locId || '', vis: !document.hidden };
      window.localStorage.setItem(TABS_KEY, JSON.stringify(next));
    } catch (e) { /* ignore */ }
    return otherAlive;
  }

  function removeTabLease() {
    var otherAlive = 0;
    try {
      var now = Date.now();
      var map = JSON.parse(window.localStorage.getItem(TABS_KEY) || '{}') || {};
      var next = {};
      Object.keys(map).forEach(function (k) {
        if (k === TAB_ID) return;
        var it = map[k];
        if (!it || now - (+it.ts || 0) > TAB_LEASE_MS) return;
        next[k] = it;
        otherAlive += 1;
      });
      window.localStorage.setItem(TABS_KEY, JSON.stringify(next));
    } catch (e) { /* ignore */ }
    return otherAlive;
  }

  function recordVisit(toolId) {
    if (!toolId) return;
    try {
      var raw = window.localStorage.getItem(VISITS_KEY);
      var visits = raw ? JSON.parse(raw) : {};
      if (!visits || typeof visits !== 'object' || Array.isArray(visits)) visits = {};
      visits[toolId] = Date.now();
      window.localStorage.setItem(VISITS_KEY, JSON.stringify(visits));
    } catch (e) { /* 無痕模式或空間不足：略過 */ }
    sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
  }

  function sendBeaconSafe(url, bodyStr, jsonHeaders) {
    try {
      if (navigator.sendBeacon && navigator.sendBeacon(url, bodyStr)) return;
    } catch (e) { /* fallback to fetch keepalive */ }
    try {
      var opts = { method: 'POST', body: bodyStr, keepalive: true };
      if (jsonHeaders) opts.headers = { 'Content-Type': 'application/json' };
      fetch(url, opts).catch(function () {});
    } catch (e) { /* ignore */ }
  }

  function sendPresenceHeartbeat(toolId, opts) {
    opts = opts || {};
    if (!toolId || !TOOL_MAP[toolId]) return;
    if (isNavBot()) return;
    try {
      var t = TOOL_MAP[toolId];
      var lsStu = JSON.parse(window.localStorage.getItem(STU_KEY) || '{}') || {};
      var ckStu = readStuCookie() || {};
      var stu = (lsStu && lsStu.confirmed && lsStu.name) ? lsStu : (ckStu && ckStu.confirmed && ckStu.name) ? ckStu : lsStu;
      if (!stu.uid) {
        stu.uid = (ckStu && ckStu.uid) || ('stu_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7));
      }
      if (!stu.stuNo) {
        stu.stuNo = (ckStu && ckStu.stuNo) || String(1000 + Math.floor(Math.random() * 9000));
      }
      stu.renameCount = Math.max(+lsStu.renameCount || 0, +ckStu.renameCount || 0);
      stu.carId = stu.carId || (ckStu && ckStu.carId) || 'campus-bike';
      stu.carIdx = 0;
      stu.carColor = stu.carColor || '#10b981';
      stu.carName = stu.carName || '🚲 輕快校園單車';
      var carsArr = Array.isArray(lsStu.cars) && lsStu.cars.length ? lsStu.cars
        : Array.isArray(ckStu.cars) && ckStu.cars.length ? ckStu.cars
        : ['campus-bike', stu.carId || 'campus-bike'];
      stu.cars = carsArr.slice(0, 60);
      stu.buildingId = toolId;
      stu.buildingName = t.name;
      stu.buildingIcon = t.icon;
      stu.activity = '正在「' + t.name + '」進修中';
      try {
        var funSt = loadFunState();
        var mergedBadges = {};
        (Array.isArray(stu.badges) ? stu.badges : []).forEach(function (b) { if (b) mergedBadges[b] = 1; });
        (Array.isArray(ckStu.badges) ? ckStu.badges : []).forEach(function (b) { if (b) mergedBadges[b] = 1; });
        Object.keys(funSt.badges || {}).forEach(function (b) { if (b) mergedBadges[b] = 1; });
        stu.badges = Object.keys(mergedBadges).slice(0, 200);
      } catch (e) { /* ignore */ }
      var minBadgeScore = 0;
      (stu.badges || []).forEach(function (bid) {
        if (bid === 'acad_welcome') minBadgeScore += 15;
        else if (ACAD_ACH[bid]) minBadgeScore += (+ACAD_ACH[bid].pts || 0);
      });
      stu.score = Math.max(+stu.score || 0, +lsStu.score || 0, +ckStu.score || 0, minBadgeScore);

      var isLeave = !!opts.leave;
      var curState = isLeave ? 'offline' : ((!document.hidden && (Date.now() - _lastActMs < 90000)) ? 'active' : 'away');
      stu.state = curState;
      stu.ts = navNowSec();
      if (!isLeave) {
        var persisted = Object.assign({}, stu);
        delete persisted.action;
        delete persisted.event;
        window.localStorage.setItem(STU_KEY, JSON.stringify(persisted));
        writeStuCookie(persisted);
      }
      var isConfirmed = !!(stu.confirmed === true && stu.name);
      var dispName = isConfirmed ? String(stu.name).trim() : ('訪客 #' + String(stu.stuNo || stu.uid).slice(-4).toUpperCase());
      if (TEST_UID_RE.test(String(stu.uid)) || (isConfirmed && TEST_NAMES[dispName])) return;
      if (!isConfirmed) return; // 🪪 未在校園地圖取名的訪客不對外廣播（取名後才會出現在在線名單與排行榜）

      var wireMsg = Object.assign({}, stu, {
        name: dispName,
        avatar: stu.avatar || '🧑‍🎓',
        title: stu.title || (isConfirmed ? '🌱 開心學園新生' : '🌱 校園訪客'),
        confirmed: isConfirmed,
        guest: !isConfirmed,
      });
      if (isLeave) {
        wireMsg.action = 'leave';
        wireMsg.event = 'leave';
      } else if (opts.event) {
        wireMsg.event = opts.event;
      }

      if (_navBc) {
        try { _navBc.postMessage(wireMsg); } catch (e) { /* ignore */ }
      } else if (window.BroadcastChannel) {
        try {
          var tmpBc = new BroadcastChannel(BC_NAME);
          tmpBc.postMessage(wireMsg);
          tmpBc.close();
        } catch (e) { /* ignore */ }
      }

      var loc = window.location;
      if (loc.protocol !== 'http:' && loc.protocol !== 'https:') return;
      var host = loc.hostname || '';
      var isGhPages = /(^|\.)github\.io$/i.test(host);
      var bodyStr = JSON.stringify(wireMsg);
      var nowMs = Date.now();

      if (isLeave) {
        navMqttPublish(MQTT_LIVE_TOPIC, bodyStr, false);
        navMqttPublish(MQTT_PEER_PREFIX + stu.uid, bodyStr, true);
        if (!isGhPages) sendBeaconSafe(campusBase() + 'api/presence', bodyStr, true);
        sendBeaconSafe('https://ntfy.sh/' + NTFY_TOPIC, bodyStr, false);
        return;
      }

      var mqttGap = document.hidden ? 28000 : 18000;
      var mqttSent = 0;
      if (opts.forceRemote || nowMs - _lastMqttSendMs >= mqttGap) {
        _lastMqttSendMs = nowMs;
        mqttSent = navMqttPublish(MQTT_LIVE_TOPIC, bodyStr, false);
        navMqttPublish(MQTT_PEER_PREFIX + stu.uid, bodyStr, true);
      }

      if (!isGhPages && (opts.forceRemote || nowMs - _lastApiSendMs >= 14000)) {
        _lastApiSendMs = nowMs;
        fetch(campusBase() + 'api/presence', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: bodyStr,
          keepalive: true
        }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
          if (j && (j.now_sec || j.now)) syncNavClock(j.now_sec || j.now);
        }).catch(function () {});
      }

      // ntfy.sh 每日每 IP 僅 250 則配額：當 MQTT 已連線時由 MQTT 負責即時同步，僅在 MQTT 未就緒或每 180 秒低頻備援
      var ntfyGap = mqttSent > 0 ? 180000 : (document.hidden ? 60000 : 35000);
      if ((opts.forceRemote && mqttSent === 0) || nowMs - _lastNtfySendMs >= ntfyGap) {
        _lastNtfySendMs = nowMs;
        fetch('https://ntfy.sh/' + NTFY_TOPIC, { method: 'POST', body: bodyStr, keepalive: true }).catch(function () {});
      }
    } catch (e) { /* ignore */ }
  }

  function connectSingleAcademyMqtt(url, idx, toolId) {
    if (!window.WebSocket || isNavBot()) return;
    var existing = _navMqttClients[idx];
    if (existing && existing.ws && (existing.ws.readyState === 0 || existing.ws.readyState === 1)) return;
    if (existing && existing.pingT) { clearInterval(existing.pingT); existing.pingT = 0; }
    if (existing && existing.retryT) { clearTimeout(existing.retryT); existing.retryT = 0; }

    var entry = existing || { url: url, ws: null, ready: false, backoff: 1500, pingT: 0, retryT: 0, pktId: 1 };
    entry.ready = false;
    _navMqttClients[idx] = entry;

    var ws;
    try {
      ws = new WebSocket(url, 'mqtt');
      ws.binaryType = 'arraybuffer';
    } catch (e) {
      return;
    }
    entry.ws = ws;
    var rxBuf = new Uint8Array(0);

    ws.onopen = function () {
      if (entry.ws !== ws) return;
      var cid = 'hc_ac_' + TAB_ID.replace(/[^a-zA-Z0-9]/g, '').slice(-10) + '_' + idx + '_' + (Date.now() % 10000);
      try { ws.send(mqttConnectPkt(cid)); } catch (e) { /* ignore */ }
    };

    ws.onmessage = function (ev) {
      if (entry.ws !== ws || !ev || !ev.data) return;
      var chunk = new Uint8Array(ev.data);
      var merged = new Uint8Array(rxBuf.length + chunk.length);
      merged.set(rxBuf, 0);
      merged.set(chunk, rxBuf.length);
      rxBuf = merged;

      while (rxBuf.length >= 2) {
        var byte0 = rxBuf[0];
        var pktType = byte0 >> 4;
        var flags = byte0 & 0x0f;
        var mult = 1, remLen = 0, pos = 1, b;
        do {
          if (pos >= rxBuf.length) return;
          b = rxBuf[pos++];
          remLen += (b & 0x7f) * mult;
          mult *= 128;
        } while ((b & 0x80) !== 0 && pos < 5);

        var totalLen = pos + remLen;
        if (rxBuf.length < totalLen) return;

        var body = rxBuf.subarray(pos, totalLen);
        rxBuf = rxBuf.subarray(totalLen);

        if (pktType === 2) { // CONNACK
          entry.ready = true;
          entry.backoff = 1500;
          try {
            ws.send(mqttSubscribePkt(entry.pktId++, [MQTT_CTL_TOPIC]));
          } catch (e) { /* ignore */ }
          if (entry.pingT) clearInterval(entry.pingT);
          entry.pingT = setInterval(function () {
            if (entry.ws === ws && ws.readyState === 1 && entry.ready) {
              try { ws.send(mqttPingReqPkt()); } catch (e) { /* ignore */ }
            }
          }, 25000);
          // 連上後立即廣播一次目前在該學院的狀態
          if (!_leftSent) {
            sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
          }
        } else if (pktType === 3 && body.length >= 2) { // PUBLISH
          var tLen = (body[0] << 8) | body[1];
          var pStart = 2 + tLen;
          var qos = (flags >> 1) & 0x03;
          if (qos > 0) pStart += 2;
          if (pStart <= body.length) {
            var topicStr = mqttUtf8Decode(body.subarray(2, 2 + tLen));
            var payloadStr = mqttUtf8Decode(body.subarray(pStart));
            if (topicStr === MQTT_CTL_TOPIC && payloadStr) {
              try {
                var d = JSON.parse(payloadStr);
                if (d && (d.event === 'ping' || d.action === 'ping')) {
                  if (Date.now() - _lastPongSentMs >= 3500) {
                    _lastPongSentMs = Date.now();
                    setTimeout(function () {
                      if (!_leftSent) sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'pong' });
                    }, 80 + Math.floor(Math.random() * 280));
                  }
                }
              } catch (e) { /* ignore */ }
            }
          }
        }
      }
    };

    var onDisconnect = function () {
      if (entry.ws !== ws) return;
      entry.ready = false;
      entry.ws = null;
      if (entry.pingT) { clearInterval(entry.pingT); entry.pingT = 0; }
      if (entry.retryT) clearTimeout(entry.retryT);
      var wait = entry.backoff + Math.floor(Math.random() * 600);
      entry.backoff = Math.min(18000, Math.round(entry.backoff * 1.7));
      entry.retryT = setTimeout(function () {
        entry.retryT = 0;
        connectSingleAcademyMqtt(url, idx, toolId);
      }, wait);
    };
    ws.onerror = onDisconnect;
    ws.onclose = onDisconnect;
  }

  function connectAcademyMqtt(toolId) {
    if (!window.WebSocket || isNavBot()) return;
    MQTT_BROKERS.forEach(function (url, idx) {
      connectSingleAcademyMqtt(url, idx, toolId);
    });
  }

  function connectAcademyRollCall(toolId) {
    connectAcademyMqtt(toolId);
    if (!window.EventSource || isNavBot()) return;
    if (_navEs) {
      try { _navEs.close(); } catch (e) { /* ignore */ }
      _navEs = null;
    }
    try {
      var es = new EventSource('https://ntfy.sh/' + NTFY_TOPIC + '/sse');
      _navEs = es;
      es.onopen = function () { _navEsBackoff = 2000; };
      es.onmessage = function (ev) {
        try {
          var m = JSON.parse(ev.data);
          if (m && m.time) syncNavClock(+m.time);
          if (!m || m.event !== 'message' || !m.message) return;
          var d = JSON.parse(m.message);
          if (d && (d.event === 'ping' || d.action === 'ping')) {
            if (Date.now() - _lastPongSentMs >= 3500) {
              _lastPongSentMs = Date.now();
              setTimeout(function () {
                if (!_leftSent) sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'pong' });
              }, 100 + Math.floor(Math.random() * 350));
            }
          }
        } catch (e) { /* ignore */ }
      };
      es.onerror = function () {
        try { es.close(); } catch (e) { /* ignore */ }
        if (_navEs === es) _navEs = null;
        if (_navEsRetryT) clearTimeout(_navEsRetryT);
        var wait = _navEsBackoff + Math.floor(Math.random() * 800);
        _navEsBackoff = Math.min(20000, Math.floor(_navEsBackoff * 1.8));
        _navEsRetryT = setTimeout(function () {
          _navEsRetryT = 0;
          connectAcademyRollCall(toolId);
        }, wait);
      };
    } catch (e) { /* ignore */ }
  }

  function startAcademyPresenceLoop(toolId) {
    if (!toolId || !TOOL_MAP[toolId] || _presenceLoopBound || isNavBot()) return;
    _presenceLoopBound = true;
    touchTabLease(toolId);

    window.addEventListener('keydown', function (e) {
      if (!e) return;
      if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.key === 'R'))) {
        markInternalNav();
      }
    }, true);

    if (window.BroadcastChannel) {
      try {
        _navBc = new BroadcastChannel(BC_NAME);
        _navBc.onmessage = function (ev) {
          var d = ev && ev.data;
          if (!d) return;
          if (d.event === 'tab_closed' && d.tabId !== TAB_ID && !document.hidden) {
            sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
          } else if (d.event === 'ping' && Date.now() - _lastPongSentMs >= 3000) {
            _lastPongSentMs = Date.now();
            sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'pong' });
          }
        };
      } catch (e) { _navBc = null; }
    }

    var onUserAct = function () {
      var wasAway = (Date.now() - _lastActMs) >= 90000;
      _lastActMs = Date.now();
      _leftSent = false;
      if (wasAway && !document.hidden) {
        sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'active' });
      }
    };
    ['pointerdown', 'keydown', 'touchstart'].forEach(function (evName) {
      window.addEventListener(evName, onUserAct, { passive: true });
    });

    setInterval(function () {
      touchTabLease(toolId);
      sendPresenceHeartbeat(toolId, { forceRemote: false });
    }, 10000);

    document.addEventListener('visibilitychange', function () {
      touchTabLease(toolId);
      if (!document.hidden) {
        _leftSent = false;
        _lastActMs = Date.now();
        connectAcademyMqtt(toolId);
        if (!_navEs) connectAcademyRollCall(toolId);
        sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'active' });
      } else {
        sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'away' });
      }
    });
    window.addEventListener('online', function () {
      _leftSent = false;
      connectAcademyRollCall(toolId);
      sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
    });
    window.addEventListener('pageshow', function () {
      _leftSent = false;
      _internalNav = false;
      touchTabLease(toolId);
      connectAcademyRollCall(toolId);
      sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
    });

    function onUnload() {
      if (_leftSent) return;
      _leftSent = true;
      var otherTabs = removeTabLease();
      var recentNavTs = 0;
      try { recentNavTs = +window.localStorage.getItem(NAV_TS_KEY) || 0; } catch (e) { /* ignore */ }
      var isInternal = _internalNav || (Date.now() - recentNavTs < 5000);
      if (otherTabs > 0) {
        if (_navBc) {
          try { _navBc.postMessage({ event: 'tab_closed', tabId: TAB_ID }); } catch (e) { /* ignore */ }
        }
        return;
      }
      if (!isInternal) {
        sendPresenceHeartbeat(toolId, { leave: true });
      }
    }
    window.addEventListener('pagehide', onUnload);
    window.addEventListener('beforeunload', onUnload);

    connectAcademyRollCall(toolId);
  }

      '<div class="cfb-sub">系統會自動轉寄給站長；若目前網路不穩，會在恢復連線或下次開啟開心學園時自動補寄，不需要任何操作。</div>' +

  function injectCss() {

  function decorate(a, toolId) {
    a.href = campusUrl(toolId);

  function wireGoLinks(root) {
    var scope = root && root.querySelectorAll ? root : document;
    var links = scope.querySelectorAll('[data-campus-go]');
    for (var i = 0; i < links.length; i++) {
      var el = links[i];
      var tid = el.getAttribute('data-campus-go');

  function initAcademyAchievements(toolId) {
    if (!toolId || !TOOL_MAP[toolId]) return;
    var st = loadFunState();
    st.academyActs[toolId] = (st.academyActs[toolId] || 0) + 1;
    if (st.daily) st.daily.visit = (+st.daily.visit || 0) + 1;
    saveFunState(st);
    setTimeout(function () { checkAcademyProgress(st, toolId); }, 600);

    // 每 5 秒累計該學院與全校學習時數（含今日學習任務秒數，同步寫入 study 與 studySec）
    setInterval(function () {
      if (document.hidden) return;
      var cur = loadFunState();
      cur.studySec = (cur.studySec || 0) + 5;
      cur.academySec[toolId] = (cur.academySec[toolId] || 0) + 5;
      if (cur.daily) {
        var nextDailySec = Math.max(+cur.daily.study || 0, +cur.daily.studySec || 0) + 5;
        cur.daily.studySec = nextDailySec;
        cur.daily.study = nextDailySec;
      }
      saveFunState(cur);
      checkAcademyProgress(cur, toolId);
    }, 5000);

    // 在學院內每次互動點擊（練習題、播放音訊、切換篩選、送出表單）累積實作次數
    document.addEventListener('click', function (e) {

      if (toolId === 'trivia' && (t.id === 'subSubmitBtn' || /投稿/.test(t.textContent || ''))) {
        var form = t.closest ? t.closest('form') : null;
        if (form || t.type === 'submit') cur.triviaSubmitted = true;
      }
      saveFunState(cur);
      checkAcademyProgress(cur, toolId);
    }, true);
  }


  function ensureAcademyIcon(toolId) {
    var cr = toolId && ACADEMY_CRESTS[toolId];
    if (!cr) return;
    try {
      var head = document.head || document.getElementsByTagName('head')[0];
      if (head && !head.querySelector('link[rel="icon"]')) {
        var lk = document.createElement('link');
        lk.rel = 'icon';
        lk.type = 'image/svg+xml';
        lk.href = cr.url;
        head.appendChild(lk);

      var hdr = document.querySelector('header, .topbar, .top-hdr, .site-header, .app-header, .top-header');
      if (!hdr) return;
      var logoEl = hdr.querySelector('.brand-logo, .brand-icon');
      if (logoEl && !logoEl.getAttribute('data-campus-crest')) {
        logoEl.setAttribute('data-campus-crest', toolId);
        logoEl.classList.add('campus-crest-host');

        return;

        brandLink.innerHTML = '<span class="campus-brand-crest" aria-hidden="true">' + cr.svg + '</span><span>' + fbEsc(txt || TOOL_MAP[toolId].name) + '</span>';

  function ensureAcademyNameGate(toolId) {

    var forceGate = /(^|[?&])welcome=1(&|$)/.test(qs);
    if (!forceGate) {
      if (isNavBot() || /(^|[?&])(shot|nomodal|bot)=1(&|$)/.test(qs)) return;
    }
    var lsStu = {}, ckStu = readStuCookie() || {}, legacyStu = {};
    try { lsStu = JSON.parse(window.localStorage.getItem(STU_KEY) || '{}') || {}; } catch (e) { lsStu = {}; }
    try { legacyStu = JSON.parse(window.localStorage.getItem('campus_student_v1') || '{}') || {}; } catch (e2) { legacyStu = {}; }
    var candName = String((lsStu.confirmed && lsStu.name) || (ckStu.confirmed && ckStu.name) || legacyStu.name || '').trim();
    if (candName && !TEST_NAMES[candName] && !/^訪客\s*#/i.test(candName) && (lsStu.confirmed || ckStu.confirmed || legacyStu.name)) {
      if (!lsStu.confirmed || !lsStu.name) {
        var synced = Object.assign({}, ckStu, lsStu, {
          uid: lsStu.uid || ckStu.uid || legacyStu.id || ('stu_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7)),
          stuNo: lsStu.stuNo || ckStu.stuNo || String(1000 + Math.floor(Math.random() * 9000)),
          name: candName.slice(0, 16),
          avatar: lsStu.avatar || ckStu.avatar || legacyStu.avatar || '🧑‍🎓',
          title: lsStu.title || ckStu.title || '🌱 開心學園新生',
          confirmed: true,
          guest: false,
        });
        try { window.localStorage.setItem(STU_KEY, JSON.stringify(synced)); } catch (e3) { /* ignore */ }
        writeStuCookie(synced);
      }
      return;
    }
    if (document.getElementById('campusAcademyNameGate')) return;
    var tInfo = TOOL_MAP[toolId] || { name: '開心學園', icon: '🏫' };
    var avList = ['🧑‍🎓', '🦊', '🐱', '🐶', '🐼', '🐰', '🦉', '🐧', '🦄', '🐉', '🍀', '🧋'];
    var pickedAv = (lsStu && lsStu.avatar) || (ckStu && ckStu.avatar) || '🧑‍🎓';
    if (avList.indexOf(pickedAv) < 0) pickedAv = '🧑‍🎓';

    var wrap = document.createElement('div');
    wrap.id = 'campusAcademyNameGate';
    wrap.className = 'campus-name-gate-backdrop';
    wrap.setAttribute('role', 'dialog');
    wrap.setAttribute('aria-modal', 'true');
    wrap.innerHTML =
      '<div class="campus-name-gate-card">' +
        '<div class="campus-name-gate-hd"><span class="cng-ic">' + fbEsc(tInfo.icon || '🏫') + '</span>' +
          '<h3>歡迎進入「' + fbEsc(tInfo.name) + '」！請先設定學員暱稱</h3></div>' +
        '<p class="campus-name-gate-sub">設定專屬暱稱與頭像後即可開始進修，你的學習紀錄、成就點數與座駕會在全校 19 間學院與校園地圖自動同步（取名後享有 1 次免費改名機會）。</p>' +
        '<label class="campus-name-gate-lbl">1. 選擇你的學員頭像</label>' +
        '<div class="campus-name-gate-avs">' +

          }).join('') +
        '</div>' +
        '<label class="campus-name-gate-lbl" for="cngNameInput">2. 輸入你的學員暱稱（2～16 字）</label>' +
        '<input id="cngNameInput" class="campus-name-gate-inp" type="text" maxlength="16" placeholder="例如：小傑夫、Livia、阿哲…" autocomplete="off">' +
        '<div id="cngErrMsg" class="campus-name-gate-err"></div>' +
        '<button type="button" id="cngSubmitBtn" class="campus-name-gate-btn">🎓 完成入學報到，開始進修！</button>' +
      '</div>';
    document.body.appendChild(wrap);

    var inp = wrap.querySelector('#cngNameInput');
    var errEl = wrap.querySelector('#cngErrMsg');
    var subBtn = wrap.querySelector('#cngSubmitBtn');
    wrap.addEventListener('click', function (e) {

      var all = wrap.querySelectorAll('[data-cng-av]');
      for (var i = 0; i < all.length; i++) {
        all[i].classList.toggle('on', all[i] === avBtn);
      }
    });

    function submitGate() {
      var val = String((inp && inp.value) || '').trim();
      if (val.length < 2) {
        if (errEl) errEl.textContent = '⚠️ 請輸入至少 2 個字的學員暱稱喔！';
        if (inp) inp.focus();
        return;
      }
      if (TEST_NAMES[val] || /^訪客\s*#?/i.test(val)) {
        if (errEl) errEl.textContent = '⚠️ 請使用專屬暱稱，不要使用「訪客」或預設測試名稱喔！';
        if (inp) inp.focus();
        return;
      }
      var curLs = {}, curCk = readStuCookie() || {};
      try { curLs = JSON.parse(window.localStorage.getItem(STU_KEY) || '{}') || {}; } catch (e) { curLs = {}; }
      var uid = curLs.uid || curCk.uid || ('stu_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7));
      var stuNo = curLs.stuNo || curCk.stuNo || String(1000 + Math.floor(Math.random() * 9000));
      var saved = Object.assign({}, curCk, curLs, {
        uid: uid,
        stuNo: stuNo,
        name: val.slice(0, 16),
        avatar: pickedAv,
        title: curLs.title || curCk.title || '🌱 開心學園新生',
        carId: curLs.carId || curCk.carId || 'campus-bike',
        confirmed: true,
        guest: false,
        renameCount: 0,
      });
      try { window.localStorage.setItem(STU_KEY, JSON.stringify(saved)); } catch (e2) { /* ignore */ }
      writeStuCookie(saved);
      wrap.remove();
      sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
    }

    if (subBtn) subBtn.addEventListener('click', submitGate);
    if (inp) {
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
          e.preventDefault();
          submitGate();
        }
      });
      setTimeout(function () { try { inp.focus(); } catch (e) { /* ignore */ } }, 80);
    }
  }

  function init() {
    injectCss();
    var toolId = window.CAMPUS_TOOL_ID || '';
    var nodes = document.querySelectorAll('[data-campus-home]');
    if (nodes.length) {
      for (var i = 0; i < nodes.length; i++) {
        var id = nodes[i].getAttribute('data-campus-home') || toolId;
        if (!toolId) toolId = id;
        decorate(nodes[i], id);
      }
    } else if (document.body) {
      var a = document.createElement('a');
      a.className = 'campus-home floating';
      document.body.appendChild(a);
      decorate(a, toolId);
    }
    wireGoLinks(document);
    if (window.MutationObserver && document.body) {
      var mo = new MutationObserver(function () { wireGoLinks(document); });
      mo.observe(document.body, { childList: true, subtree: true });
    }
    document.addEventListener('click', function (e) {
      var cp = e.target && e.target.closest ? e.target.closest('[data-campus-fb-copy]') : null;
      if (cp) {
        e.preventDefault();
        var txt = cp.getAttribute('data-campus-fb-copy') || '';
        var em = cp.getAttribute('data-campus-fb-email') || DEFAULT_FB_EMAIL;
        fbCopyText(txt).then(function (ok) {
          var orig = cp.getAttribute('data-orig-label') || cp.textContent;
          cp.setAttribute('data-orig-label', orig);
          cp.textContent = ok ? ('✅ 已複製！可貼到信箱寄至 ' + em) : ('信箱：' + em);
          setTimeout(function () { cp.textContent = orig; }, 3800);
        });
        return;
      }
      var anyLink = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (anyLink && !e.metaKey && !e.ctrlKey && !e.shiftKey && anyLink.getAttribute('target') !== '_blank') {
        if (anyLink.classList.contains('campus-home') || anyLink.hasAttribute('data-campus-go') || isInternalHref(anyLink.getAttribute('href'))) {
          markInternalNav();
        }
      }
      var a = e.target && e.target.closest ? e.target.closest('[data-campus-go]') : null;
      if (!a) return;
      var tid = a.getAttribute('data-campus-go');
      var h = a.getAttribute('data-campus-hash') || '';
      if (tid) {
        markInternalNav();
        recordVisit(tid);
        a.href = toolUrl(tid, h);
      }
    }, true);
    ensureAcademyIcon(toolId);
    ensureAcademyNameGate(toolId);
    wrapFeedbackFetch();
    recordVisit(toolId);
    startAcademyPresenceLoop(toolId);
    initAcademyAchievements(toolId);
    setTimeout(flushFeedbackQueue, 3000);
    window.addEventListener('online', function () { flushFeedbackQueue(); });
  }

  wrapFeedbackFetch();
  window.CampusNav = {
    base: campusBase,
    url: campusUrl,
    toolUrl: toolUrl,
    wire: wireGoLinks,
    init: init,
    markInternalNav: markInternalNav,
    visitsKey: VISITS_KEY,
    getReporterInfo: getReporterInfo,
    detectDeviceInfo: detectDeviceInfo,
    deliveryLinks: deliveryLinks,
    sendStaticFeedback: sendStaticFeedback,
    flushFeedbackQueue: flushFeedbackQueue,
    fallbackHtml: fallbackHtml
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
