<script>/* /js/ko.js */
/* 韓語學院 Korean Academy — ko.js（可在瀏覽器與 Node 驗證工具中載入）
 * 韓文字母（한글 Hangul）分解合成、NFC 正規化、韓語標準發音音變推導（連音化・鼻音化・流音化・激音化・硬音化・顎音化・ㅎ弱化）、
 * 音變標記 <ruby> 渲染、文化觀光部修訂羅馬拼音（Revised Romanization）雙向轉換與詞元切分。
 *
 * 支援標記格式：
 *   一般韓文直接書寫（例：「안녕하세요. 한국어를 공부해요.」），系統自動計算每個韓文詞塊（어절）的實際發音；
 *   若發音與拼寫不同（例：한국어 → 한구거、감사합니다 → 감사함니다、같이 → 가치），自動產生 <ruby>한국어<rt>한구거</rt></ruby>。
 *   若遇特殊不規則發音（如添加 ㄴ 音：{깻잎|깬닙}、{서울역|서울력}），亦支援以 {표기|발음} 手動指定讀音。
 */
(function (root) {
  'use strict';

  const CHO = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
  const JUNG = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
  const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

  const CHO_IDX = Object.fromEntries(CHO.map((c, i) => [c, i]));
  const JUNG_IDX = Object.fromEntries(JUNG.map((c, i) => [c, i]));
  const JONG_IDX = Object.fromEntries(JONG.map((c, i) => [c, i]));

  const S_BASE = 0xAC00;
  const S_END = 0xD7A3;
  const HANGUL_SYL_RE = /[\uAC00-\uD7A3]/;
  const HANGUL_JAMO_RE = /[\u3131-\u3163\u1100-\u11FF]/;
  const HANGUL_WORD_RE = /[\uAC00-\uD7A3]+/g;
  const PUNCT_RE = /[.,!?，。！？、・「」『』（）()~〜…—:：;；"'""''·\-\s]/;
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);

  /** 強制轉為 Unicode NFC（修復 macOS / iOS NFD 分解初聲・中聲・終聲 Jamo）。 */
  function nfc(s) {
    const str = String(s == null ? '' : s);
    return str.normalize ? str.normalize('NFC') : str;
  }

  function isSyllable(ch) {
    if (!ch) return false;
    const code = ch.charCodeAt(0);
    return code >= S_BASE && code <= S_END;
  }

  function decompose(ch) {
    const code = ch.charCodeAt(0) - S_BASE;
    if (code < 0 || code > S_END - S_BASE) return null;
    const jong = code % 28;
    const jung = ((code - jong) / 28) % 21;
    const cho = Math.floor((code - jong) / 28 / 21);
    return { cho: CHO[cho], jung: JUNG[jung], jong: JONG[jong] };
  }

  function compose(cho, jung, jong) {
    const ci = CHO_IDX[cho];
    const vi = JUNG_IDX[jung];
    const fi = JONG_IDX[jong || ''];
    if (ci == null || vi == null || fi == null) return '';
    return String.fromCharCode(S_BASE + (ci * 21 + vi) * 28 + fi);
  }

  const hasHangul = (s) => HANGUL_SYL_RE.test(nfc(s)) || HANGUL_JAMO_RE.test(nfc(s));

  // ---------------------------------------------------------------------------
  // 1. 韓語標準發音音變推導（표준 발음법 核心規則）
  // ---------------------------------------------------------------------------
  // 雙收音連音拆分：[留在前音節的終聲, 移到後音節 ㅇ 初聲的子音]
  const DOUBLE_LIAISON = {
    'ㄳ': ['ㄱ', 'ㅆ'],
    'ㄵ': ['ㄴ', 'ㅈ'],
    'ㄶ': ['', 'ㄴ'], // ㅎ 脫落，ㄴ 連音（例：많아요 → 마나요、많이 → 마니）
    'ㄺ': ['ㄹ', 'ㄱ'],
    'ㄻ': ['ㄹ', 'ㅁ'],
    'ㄼ': ['ㄹ', 'ㅂ'],
    'ㄽ': ['ㄹ', 'ㅆ'],
    'ㄾ': ['ㄹ', 'ㅌ'], // 若遇 이 則先走顎音化 ㄾ+이 → ㄹ치
    'ㄿ': ['ㄹ', 'ㅍ'],
    'ㅀ': ['', 'ㄹ'], // ㅎ 脫落，ㄹ 連音（例：싫어요 → 시러요）
    'ㅄ': ['ㅂ', 'ㅆ'],
  };

  // 終聲代表音（음절의 끝소리 규칙：7 代表音 ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅇ）
  const FINAL_REP = {
    '': '',
    'ㄱ': 'ㄱ', 'ㄲ': 'ㄱ', 'ㅋ': 'ㄱ', 'ㄳ': 'ㄱ', 'ㄺ': 'ㄱ',
    'ㄴ': 'ㄴ', 'ㄵ': 'ㄴ', 'ㄶ': 'ㄴ',
    'ㄷ': 'ㄷ', 'ㅅ': 'ㄷ', 'ㅆ': 'ㄷ', 'ㅈ': 'ㄷ', 'ㅊ': 'ㄷ', 'ㅌ': 'ㄷ', 'ㅎ': 'ㄷ',
    'ㄹ': 'ㄹ', 'ㄼ': 'ㄹ', 'ㄽ': 'ㄹ', 'ㄾ': 'ㄹ', 'ㅀ': 'ㄹ',
    'ㅁ': 'ㅁ', 'ㄻ': 'ㅁ',
    'ㅂ': 'ㅂ', 'ㅍ': 'ㅂ', 'ㅄ': 'ㅂ', 'ㄿ': 'ㅂ',
    'ㅇ': 'ㅇ',
  };

  const ASPIRATE = { 'ㄱ': 'ㅋ', 'ㄷ': 'ㅌ', 'ㅂ': 'ㅍ', 'ㅈ': 'ㅊ' };
  const TENSE = { 'ㄱ': 'ㄲ', 'ㄷ': 'ㄸ', 'ㅂ': 'ㅃ', 'ㅅ': 'ㅆ', 'ㅈ': 'ㅉ' };
  const NASAL_OF_STOP = { 'ㄱ': 'ㅇ', 'ㄷ': 'ㄴ', 'ㅂ': 'ㅁ' };

  // 常見特殊發音字典（添加 ㄴ 音、밟다 等例外）
  const PRON_EXCEPTIONS = {
    '깻잎': '깬닙', '꽃잎': '꼰닙', '나뭇잎': '나문닙', '뒷일': '뒨닐', '집안일': '지반닐',
    '서울역': '서울력', '시청역': '시청녁', '강남역': '강남녁', '홍대입구역': '홍대입꾸역', '부산역': '부산녁',
    '무슨일': '무슨닐', '한여름': '한녀름', '색연필': '생년필', '영업용': '영엄뇽',
    '밟다': '밥따', '밟고': '밥꼬', '밟아요': '발바요', '밟아서': '발바서',
    '넓죽하다': '넙쭈카다', '넓둥글다': '넙뚱글다',
    '맛있다': '마싣따', '맛있어요': '마시써요', '맛있는': '마신는', '맛있게': '마싣께',
    '멋있다': '머싣따', '멋있어요': '머시써요', '멋있는': '머신는',
    '의사': '의사', '회의': '회이', '편의점': '펴니점',
  };

  /** 推導單一韓文詞塊（어절，無空白純音節）的實際發音。 */
  function pronounceWord(word) {
    const w = nfc(word);
    if (!w || w.length < 1) return w;
    if (PRON_EXCEPTIONS[w]) return PRON_EXCEPTIONS[w];
    for (const [k, v] of Object.entries(PRON_EXCEPTIONS)) {
      if (w.length > k.length && w.startsWith(k)) {
        // 如 편의점에 → 펴니점 + 에 連音 → 펴니저메：直接把前綴替換再跑一次（但先檢查連音）
        if (k === '편의점') {
          return pronounceWord('펴니점' + w.slice(k.length));
        }
      }
    }

    const syls = Array.from(w).map((ch) => decompose(ch) || { raw: ch });
    for (let i = 0; i < syls.length - 1; i++) {
      const a = syls[i];
      const b = syls[i + 1];
      if (a.raw || b.raw || !a.jong) continue;

      // 1) 구개음화（顎音化）：ㄷ/ㅌ/ㄾ + 이/히/여
      if (b.cho === 'ㅇ' && (b.jung === 'ㅣ' || b.jung === 'ㅕ')) {
        if (a.jong === 'ㄷ') { a.jong = ''; b.cho = 'ㅈ'; continue; }
        if (a.jong === 'ㅌ') { a.jong = ''; b.cho = 'ㅊ'; continue; }
        if (a.jong === 'ㄾ') { a.jong = 'ㄹ'; b.cho = 'ㅊ'; continue; }
      }
      if (b.cho === 'ㅎ' && b.jung === 'ㅣ') {
        if (a.jong === 'ㄷ' || a.jong === 'ㅌ') { a.jong = ''; b.cho = 'ㅊ'; continue; }
      }

      // 2) 연음（連音化）與 ㅎ 脫落（좋아요 → 조아요）
      if (b.cho === 'ㅇ') {
        if (a.jong === 'ㅎ') {
          a.jong = '';
          continue;
        }
        if (DOUBLE_LIAISON[a.jong]) {
          const [keep, move] = DOUBLE_LIAISON[a.jong];
          a.jong = keep;
          b.cho = move;
          continue;
        }
        if (a.jong !== 'ㅇ') {
          b.cho = a.jong === 'ㅅ' ? 'ㅅ' : a.jong;
          a.jong = '';
          continue;
        }
      }

      // 3) 격음화（激音化：與 ㅎ / ㄶ / ㅀ 相遇送氣化）
      if (b.cho === 'ㅎ') {
        if (a.jong === 'ㄶ') { a.jong = 'ㄴ'; continue; }
        if (a.jong === 'ㅀ') { a.jong = 'ㄹ'; continue; }
        if (a.jong === 'ㄺ') { a.jong = 'ㄹ'; b.cho = 'ㅋ'; continue; }
        if (a.jong === 'ㄼ') { a.jong = 'ㄹ'; b.cho = 'ㅍ'; continue; }
        if (a.jong === 'ㄵ') { a.jong = 'ㄴ'; b.cho = 'ㅊ'; continue; }
        const rep = FINAL_REP[a.jong] || a.jong;
        if (ASPIRATE[rep]) {
          a.jong = '';
          b.cho = ASPIRATE[rep];
          continue;
        }
      }
      if ((a.jong === 'ㅎ' || a.jong === 'ㄶ' || a.jong === 'ㅀ') && ASPIRATE[b.cho]) {
        a.jong = a.jong === 'ㄶ' ? 'ㄴ' : a.jong === 'ㅀ' ? 'ㄹ' : '';
        b.cho = ASPIRATE[b.cho];
        continue;
      }

      // ㄺ 在 ㄱ 前讀作 ㄹ + ㄲ（例：읽고 → 일꼬）
      if (a.jong === 'ㄺ' && b.cho === 'ㄱ') {
        a.jong = 'ㄹ';
        b.cho = 'ㄲ';
        continue;
      }
      // ㄶ / ㅀ 在 ㄴ 前 ㅎ 脫落（않는 → 안는、뚫는 → 뚤른）
      if (a.jong === 'ㄶ' && b.cho === 'ㄴ') {
        a.jong = 'ㄴ';
        continue;
      }
      if (a.jong === 'ㅀ' && b.cho === 'ㄴ') {
        a.jong = 'ㄹ';
        b.cho = 'ㄹ';
        continue;
      }
      // ㄶ / ㅀ 在 ㅅ 前 → ㄴㅆ / ㄹㅆ（많소 → 만쏘、싫소 → 실쏘）
      if ((a.jong === 'ㄶ' || a.jong === 'ㅀ') && b.cho === 'ㅅ') {
        a.jong = a.jong === 'ㄶ' ? 'ㄴ' : 'ㄹ';
        b.cho = 'ㅆ';
        continue;
      }

      // 先將前音節終聲簡化為 7 代表音
      const rep = FINAL_REP[a.jong] != null ? FINAL_REP[a.jong] : a.jong;
      a.jong = rep;

      // 4) 비음화 & 유음화（鼻音化與流音化）
      if (b.cho === 'ㄴ' || b.cho === 'ㅁ') {
        if (NASAL_OF_STOP[a.jong]) {
          a.jong = NASAL_OF_STOP[a.jong];
          continue;
        }
        if (a.jong === 'ㄹ' && b.cho === 'ㄴ') {
          b.cho = 'ㄹ';
          continue;
        }
      }
      if (b.cho === 'ㄹ') {
        if (a.jong === 'ㄴ') {
          a.jong = 'ㄹ';
          continue;
        }
        if (a.jong === 'ㅁ' || a.jong === 'ㅇ') {
          b.cho = 'ㄴ';
          continue;
        }
        if (NASAL_OF_STOP[a.jong]) {
          a.jong = NASAL_OF_STOP[a.jong];
          b.cho = 'ㄴ';
          continue;
        }
      }

      // 5) 경음화（硬音化／緊音化）：ㄱ/ㄷ/ㅂ 代表終聲後接 ㄱ/ㄷ/ㅂ/ㅅ/ㅈ
      if ((a.jong === 'ㄱ' || a.jong === 'ㄷ' || a.jong === 'ㅂ') && TENSE[b.cho]) {
        b.cho = TENSE[b.cho];
      }
    }

    // 詞尾最後一個音節的終聲代表音化（例：꽃 → 꼳、밖 → 박、있 → 읻）
    const last = syls[syls.length - 1];
    if (last && !last.raw && last.jong) {
      last.jong = FINAL_REP[last.jong] != null ? FINAL_REP[last.jong] : last.jong;
    }

    return syls.map((s) => (s.raw ? s.raw : compose(s.cho, s.jung, s.jong))).join('');
  }

  // ---------------------------------------------------------------------------
  // 2. 標記解析（支援一般韓文自動偵測音變 ＋ 手動 {표기|발음} 覆寫）
  // ---------------------------------------------------------------------------
  const MARK_RE = /\{([^{}|]+)\|([^{}]*)\}/g;

  /** 解析一段韓文為片段陣列：
   *  - {t:'ruby', b:'한국어', r:'한구거'}（發音與表層不同，或手動標記 {표기|발음}）
   *  - {t:'word', b:'안녕하세요', r:'안녕하세요'}（發音與表層相同的韓文詞塊）
   *  - {t:'sp'}（空白）
   *  - {t:'txt', s:'...'}（標點、數字、外文字母或獨立 Jamo）
   */
  function parse(input) {
    const s = nfc(input);
    const rawSegs = [];
    let last = 0;
    MARK_RE.lastIndex = 0;
    let m;
    while ((m = MARK_RE.exec(s)) !== null) {
      if (m.index > last) pushPlain(rawSegs, s.slice(last, m.index));
      rawSegs.push({ t: 'ruby', b: m[1], r: m[2] || pronounceWord(m[1]), manual: true });
      last = m.index + m[0].length;
    }
    if (last < s.length) pushPlain(rawSegs, s.slice(last));
    return { segs: rawSegs };
  }

  function pushPlain(out, chunk) {
    let pos = 0;
    HANGUL_WORD_RE.lastIndex = 0;
    let wm;
    while ((wm = HANGUL_WORD_RE.exec(chunk)) !== null) {
      if (wm.index > pos) pushNonWord(out, chunk.slice(pos, wm.index));
      const word = wm[0];
      const pron = pronounceWord(word);
      if (pron !== word) out.push({ t: 'ruby', b: word, r: pron });
      else out.push({ t: 'word', b: word, r: word });
      pos = wm.index + word.length;
    }
    if (pos < chunk.length) pushNonWord(out, chunk.slice(pos));
  }

  function pushNonWord(out, str) {
    for (const part of str.split(/(\s+)/)) {
      if (!part) continue;
      if (/^\s+$/.test(part)) out.push({ t: 'sp', s: part });
      else out.push({ t: 'txt', s: part });
    }
  }

  /** 表層韓文（保留韓文自然空格 띄어쓰기，供畫面顯示與 TTS 朗讀）。 */
  function surface(s) {
    return parse(s).segs.map((g) => {
      if (g.t === 'sp') return ' ';
      if (g.t === 'ruby' || g.t === 'word') return g.b;
      return g.s;
    }).join('').replace(/ {2,}/g, ' ');
  }

  /** 實際發音韓文（將音變後的讀音展開，供羅馬拼音轉換與口說／聽寫雙軌評分）。 */
  function reading(s) {
    return parse(s).segs.map((g) => {
      if (g.t === 'sp') return ' ';
      if (g.t === 'ruby' || g.t === 'word') return g.r;
      return g.s;
    }).join('').replace(/ {2,}/g, ' ');
  }

  /** 渲染為 HTML：只有實際音變的詞（或手動標記）會顯示上方小字讀音 <ruby>한국어<rt>한구거</rt></ruby>。 */
  function rubyHtml(s) {
    return parse(s).segs.map((g) => {
      if (g.t === 'sp') return ' ';
      if (g.t === 'ruby' && g.r && g.r !== g.b) return `<ruby>${esc(g.b)}<rt>${esc(g.r)}</rt></ruby>`;
      if (g.t === 'ruby' || g.t === 'word') return esc(g.b);
      return esc(g.s);
    }).join('');
  }

  /** 依韓文空格切出詞元（供聽寫提示用）。 */
  function tokens(s) {
    const out = [];
    let cur = null;
    for (const g of parse(s).segs) {
      if (g.t === 'sp') {
        if (cur) { out.push(cur); cur = null; }
        continue;
      }
      if (!cur) cur = { surface: '', reading: '' };
      if (g.t === 'ruby' || g.t === 'word') {
        cur.surface += g.b;
        cur.reading += g.r;
      } else {
        cur.surface += g.s;
        cur.reading += g.s;
      }
    }
    if (cur) out.push(cur);
    return out;
  }

  // ---------------------------------------------------------------------------
  // 3. 文化觀光部修訂羅馬拼音（Revised Romanization of Korean）
  // ---------------------------------------------------------------------------
  const RR_CHO = {
    'ㄱ': 'g', 'ㄲ': 'kk', 'ㄴ': 'n', 'ㄷ': 'd', 'ㄸ': 'tt', 'ㄹ': 'r',
    'ㅁ': 'm', 'ㅂ': 'b', 'ㅃ': 'pp', 'ㅅ': 's', 'ㅆ': 'ss', 'ㅇ': '',
    'ㅈ': 'j', 'ㅉ': 'jj', 'ㅊ': 'ch', 'ㅋ': 'k', 'ㅌ': 't', 'ㅍ': 'p', 'ㅎ': 'h',
  };
  const RR_JUNG = {
    'ㅏ': 'a', 'ㅐ': 'ae', 'ㅑ': 'ya', 'ㅒ': 'yae', 'ㅓ': 'eo', 'ㅔ': 'e',
    'ㅕ': 'yeo', 'ㅖ': 'ye', 'ㅗ': 'o', 'ㅘ': 'wa', 'ㅙ': 'wae', 'ㅚ': 'oe',
    'ㅛ': 'yo', 'ㅜ': 'u', 'ㅝ': 'wo', 'ㅞ': 'we', 'ㅟ': 'wi', 'ㅠ': 'yu',
    'ㅡ': 'eu', 'ㅢ': 'ui', 'ㅣ': 'i',
  };
  const RR_JONG = {
    '': '', 'ㄱ': 'k', 'ㄲ': 'k', 'ㄳ': 'k', 'ㄴ': 'n', 'ㄵ': 'n', 'ㄶ': 'n',
    'ㄷ': 't', 'ㄹ': 'l', 'ㄺ': 'k', 'ㄻ': 'm', 'ㄼ': 'l', 'ㄽ': 'l', 'ㄾ': 'l', 'ㄿ': 'p', 'ㅀ': 'l',
    'ㅁ': 'm', 'ㅂ': 'p', 'ㅄ': 'p', 'ㅅ': 't', 'ㅆ': 't', 'ㅇ': 'ng',
    'ㅈ': 't', 'ㅊ': 't', 'ㅋ': 'k', 'ㅌ': 't', 'ㅍ': 'p', 'ㅎ': 't',
  };
  const RR_JAMO = { ...RR_CHO, ...RR_JUNG, 'ㅇ': 'ng' };

  /** 把一段純韓文（建議傳入已連音處理後的讀音）轉為文化觀光部修訂羅馬拼音。 */
  function hangulToRomaji(str) {
    const arr = Array.from(nfc(str));
    let out = '';
    for (let i = 0; i < arr.length; i++) {
      const ch = arr[i];
      const d = decompose(ch);
      if (!d) {
        out += RR_JAMO[ch] != null ? RR_JAMO[ch] : ch;
        continue;
      }
      const prev = i > 0 ? decompose(arr[i - 1]) : null;
      // ㄹ + ㄹ 相連時轉寫為 ll（例：설날 → 설랄 → seollal、연락 → 열락 → yeollak）
      let c = RR_CHO[d.cho] ?? '';
      if (d.cho === 'ㄹ' && prev && prev.jong === 'ㄹ') c = 'l';
      // 前音節收音 ㅇ 後接母音開頭（ㅇ 初聲）加連字號避免與 ㄱ 混淆（例：중앙 → jung-ang）
      if (d.cho === 'ㅇ' && prev && prev.jong === 'ㅇ') out += '-';
      const v = RR_JUNG[d.jung] ?? '';
      const next = i + 1 < arr.length ? decompose(arr[i + 1]) : null;
      let f = RR_JONG[d.jong] ?? '';
      if (d.jong === 'ㄹ' && next && next.cho === 'ㄹ') f = 'l';
      out += c + v + f;
    }
    return out.replace(/([ktps])\1{2,}/g, '$1$1');
  }

  /** 將韓文句子（或標記）依實際發音轉為羅馬拼音。 */
  function romaji(s) {
    return parse(s).segs.map((g) => {
      if (g.t === 'sp') return ' ';
      if (g.t === 'ruby' || g.t === 'word') return hangulToRomaji(g.r);
      return hangulToRomaji(g.s);
    }).join('').replace(/ {2,}/g, ' ').trim();
  }

  // ---------------------------------------------------------------------------
  // 4. 羅馬拼音 → 韓文音節（讓沒有韓文輸入法的使用者也能打羅馬拼音作答聽寫與測驗）
  // ---------------------------------------------------------------------------
  const RO_VOWELS = [
    ['yae', 'ㅒ'], ['yeo', 'ㅕ'], ['wae', 'ㅙ'],
    ['ae', 'ㅐ'], ['ya', 'ㅑ'], ['eo', 'ㅓ'], ['ye', 'ㅖ'], ['wa', 'ㅘ'], ['oe', 'ㅚ'],
    ['yo', 'ㅛ'], ['wo', 'ㅝ'], ['we', 'ㅞ'], ['wi', 'ㅟ'], ['yu', 'ㅠ'], ['eu', 'ㅡ'], ['ui', 'ㅢ'],
    ['a', 'ㅏ'], ['e', 'ㅔ'], ['o', 'ㅗ'], ['u', 'ㅜ'], ['i', 'ㅣ'],
  ];
  const RO_ONSETS = [
    ['kk', 'ㄲ'], ['tt', 'ㄸ'], ['pp', 'ㅃ'], ['ss', 'ㅆ'], ['jj', 'ㅉ'], ['ch', 'ㅊ'],
    ['g', 'ㄱ'], ['k', 'ㅋ'], ['n', 'ㄴ'], ['d', 'ㄷ'], ['t', 'ㅌ'], ['r', 'ㄹ'], ['l', 'ㄹ'],
    ['m', 'ㅁ'], ['b', 'ㅂ'], ['p', 'ㅍ'], ['s', 'ㅅ'], ['j', 'ㅈ'], ['h', 'ㅎ'],
  ];
  const RO_CODAS = [
    ['ng', 'ㅇ'], ['kk', 'ㄲ'],
    ['k', 'ㄱ'], ['g', 'ㄱ'], ['n', 'ㄴ'], ['t', 'ㄷ'], ['d', 'ㄷ'],
    ['l', 'ㄹ'], ['m', 'ㅁ'], ['p', 'ㅂ'], ['b', 'ㅂ'],
  ];

  function matchPrefix(str, pos, table) {
    for (const [ro, jamo] of table) {
      if (str.startsWith(ro, pos)) return [ro.length, jamo];
    }
    return null;
  }

  function romajiWordToHangul(word) {
    const s = String(word || '').toLowerCase().replace(/-/g, '');
    let i = 0;
    let out = '';
    while (i < s.length) {
      if (!/[a-z]/.test(s[i])) { out += s[i++]; continue; }
      let cho = 'ㅇ';
      const onset = matchPrefix(s, i, RO_ONSETS);
      if (onset) {
        // 檢查後面是否有母音
        if (matchPrefix(s, i + onset[0], RO_VOWELS)) {
          cho = onset[1];
          i += onset[0];
        }
      }
      const vow = matchPrefix(s, i, RO_VOWELS);
      if (!vow) {
        out += s[i++];
        continue;
      }
      const jung = vow[1];
      i += vow[0];
      let jong = '';
      // 嘗試匹配終聲，但若該子音後面直接跟著母音，那它是下一音節的初聲！
      // 特例：ng 後面跟母音時，ng 仍是本音節終聲 ㅇ，下一音節為 ㅇ 初聲（例：annyeonghaseyo -> 안녕하세요）
      if (s.startsWith('ng', i)) {
        jong = 'ㅇ';
        i += 2;
      } else if (s.startsWith('ll', i) && matchPrefix(s, i + 2, RO_VOWELS)) {
        jong = 'ㄹ';
        i += 1; // 留一個 l 給下一音節當 ㄹ 初聲
      } else if (s.startsWith('nn', i) && matchPrefix(s, i + 2, RO_VOWELS)) {
        jong = 'ㄴ';
        i += 1;
      } else if (s.startsWith('mm', i) && matchPrefix(s, i + 2, RO_VOWELS)) {
        jong = 'ㅁ';
        i += 1;
      } else {
        const coda = matchPrefix(s, i, RO_CODAS);
        if (coda) {
          const afterCoda = i + coda[0];
          const nextIsVowel = !!matchPrefix(s, afterCoda, RO_VOWELS);
          if (!nextIsVowel) {
            jong = coda[1];
            i = afterCoda;
          }
        }
      }
      out += compose(cho, jung, jong) || '';
    }
    return out;
  }

  function romajiSentenceToHangul(str) {
    return String(str || '').split(/(\s+)/).map((p) => (/[a-z]/i.test(p) ? romajiWordToHangul(p) : p)).join('');
  }

  /** 比對用正規化：轉 NFC、去掉標點與空白、英數轉小寫。 */
  function normalize(s) {
    return nfc(s)
      .toLowerCase()
      .replace(/[.,!?，。！？、・「」『』（）()~〜…—:：;；"'""''·\-\s]+/g, '');
  }

  const api = {
    CHO,
    JUNG,
    JONG,
    PUNCT_RE,
    nfc,
    isSyllable,
    decompose,
    compose,
    hasHangul,
    pronounceWord,
    parse,
    surface,
    reading,
    rubyHtml,
    tokens,
    hangulToRomaji,
    romaji,
    romajiToHangul: romajiWordToHangul,
    romajiSentenceToHangul,
    normalize,
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  const KO = (root.KO = root.KO || {});
  KO.ko = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

    { code: 'B1', topik: 'TOPIK II 3級', name: '中級前', sub: '校園職場・看診租屋・完整敘述', color: '#2563eb', bg: '#eff6ff' },
    { code: 'B2', topik: 'TOPIK II 4級', name: '中級後', sub: '商務敬語・新聞討論・觀點比較', color: '#7c3aed', bg: '#f5f3ff' },
    { code: 'C1', topik: 'TOPIK II 5級', name: '高級', sub: '專業發表・社會議題・委婉協商', color: '#db2777', bg: '#fdf2f8' },
    { code: 'C2', topik: 'TOPIK II 6級', name: '精通', sub: '學術思辨・四字成語・母語語感', color: '#b45309', bg: '#fffbeb' },
  ];
  KO.LEVEL_MAP = Object.fromEntries(KO.LEVELS.map((l) => [l.code, l]));
  KO.topikOf = (code) => (KO.LEVEL_MAP[code] ? KO.LEVEL_MAP[code].topik : '');

  KO.TOPICS = {
    daily: ['日常生活', '☀️'],
    introductions: ['初見問候', '👋'],
    cafe: ['咖啡甜點', '☕'],
    convenience: ['超商生活', '🏪'],
    restaurant: ['餐廳點餐', '🍖'],
    food: ['韓式美食', '🍲'],
    directions: ['問路轉乘', '🗺️'],
    transport: ['交通地鐵', '🚇'],
    shopping: ['逛街網購', '🛍️'],
    school: ['校園語學堂', '🎓'],
    study: ['學習進修', '📖'],
    plans: ['週末約會', '📅'],
    hotel: ['飯店住宿', '🏨'],
    travel: ['韓國旅遊', '✈️'],
    health: ['醫療藥局', '🏥'],
    entertainment: ['韓劇K-Pop', '🎬'],
    media: ['影視媒體', '📺'],
    phone: ['電話預約', '📞'],
    seasons: ['四季賞櫻', '🌸'],
    celebrations: ['慶生聚會', '🎂'],
    home: ['首爾租屋', '🏠'],
    services: ['銀行認證', '🏦'],
    work: ['職場商務', '💼'],
    hobbies: ['運動健身', '🏃'],
    social: ['社交聊天', '💬'],
    relationships: ['人際溝通', '🤝'],
    opinions: ['觀點討論', '💡'],
    tech: ['科技AI', '💻'],
    culture: ['韓國文化', '🎎'],
    society: ['社會議題', '🌏'],
    academic: ['學術思辨', '📚'],
    nature: ['氣候環境', '🌿'],
    money: ['金融公關', '₩'],
    emotion: ['心情感受', '💛'],
    emotions: ['慢活哲學', '🧘'],
    law: ['制度法規', '⚖️'],
  };

  // --- DOM 與字串工具 ---
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  KO.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
  KO.qs = (sel, el = document) => el.querySelector(sel);
  KO.qsa = (sel, el = document) => Array.from(el.querySelectorAll(sel));

  // --- 韓文顯示輔助（連音標記 <ruby>、表層韓文、實際發音、羅馬拼音） ---
  KO.koHtml = (s, opts) => {
    const showLiaison = opts && 'liaison' in opts ? opts.liaison : KO.state.settings.showLiaison !== false;
    return showLiaison ? KO.ko.rubyHtml(s) : KO.esc(KO.ko.surface(s));
  };
  KO.surface = (s) => KO.ko.surface(s);
  KO.reading = (s) => KO.ko.reading(s);
  KO.romaji = (s) => KO.ko.romaji(s);

  KO.toast = function (msg, ms = 2400) {
    const root = document.getElementById('toastRoot');
    if (!root) return;
    const d = document.createElement('div');
    d.className = 'toast';
    d.textContent = msg;
    root.appendChild(d);
    requestAnimationFrame(() => d.classList.add('in'));
    setTimeout(() => {
      d.classList.remove('in');
      setTimeout(() => d.remove(), 240);
    }, ms);
  };

  // --- 日期（以本地時區 YYYY-MM-DD 為準） ---
  KO.todayKey = function (d = new Date()) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  };
  KO.shiftDay = function (key, delta) {
    const [y, m, d] = key.split('-').map(Number);
    return KO.todayKey(new Date(y, m - 1, d + delta));
  };

  // --- 預設學習狀態 ---
  const KEY = 'ko.state.v1';
  const DEFAULT_STATE = () => ({
    v: 1,
    updatedAt: 0,
    resetAt: 0,
    settings: {
      goalMin: 15,
      dailyNewWords: 10,
      rate: 0.95,
      voiceURI: '',
      ttsMode: 'auto', // 'auto' | 'cloud' | 'local'
      showLiaison: true, // 顯示韓文連音／音變上方小字（例：한국어 → 한구거）
      showRomaji: true,
      showZh: true,
      autoPlay: true,
      onboarded: false,
    },
    meta: { lastLessonId: 'a1-01', recLevel: 'A1' },
    lessons: {},
    vocab: {},
    hangul: {}, // ch -> { seen, correct, wrong, level(0..3), due, interval, ease, reps, updatedAt }
    words: {},  // key -> { seen: ts, level }
    days: {},
  });

  function loadLocal() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return DEFAULT_STATE();
      const s = JSON.parse(raw);
      const d = DEFAULT_STATE();
      return {
        ...d,
        ...s,
        settings: { ...d.settings, ...(s.settings || {}) },
        meta: { ...d.meta, ...(s.meta || {}) },
        lessons: s.lessons || {},
        vocab: s.vocab || {},
        hangul: s.hangul || {},
        words: s.words || {},
        days: s.days || {},
      };
    } catch {
      return DEFAULT_STATE();
    }
  }

  KO.state = loadLocal();
  KO.LESSONS = KO.LESSONS || [];
  KO.CUSTOM_LESSONS = KO.CUSTOM_LESSONS || [];
  KO.WORDS = KO.WORDS || [];

  KO.normalizeLesson = function (l) {
    if (!l || typeof l !== 'object') return l;
    if (!l.scene && l.scene_zh) l.scene = l.scene_zh;
    if (!l.quiz && Array.isArray(l.questions)) l.quiz = l.questions;
    const spMap = l.speakers || {};
    (l.lines || []).forEach((ln, idx) => {
      const spInfo = ln.s && spMap[ln.s] ? spMap[ln.s] : null;
      if (!ln.sp) ln.sp = spInfo && spInfo.name ? spInfo.name : (ln.s || (idx % 2 === 0 ? 'A' : 'B'));
      if (!ln.gender && spInfo && spInfo.gender) ln.gender = spInfo.gender;
    });
    return l;
  };

  KO.allLessons = function () {
    const map = new Map();
    for (const l of KO.LESSONS) map.set(l.id, KO.normalizeLesson(l));
    for (const l of KO.CUSTOM_LESSONS) map.set(l.id, KO.normalizeLesson(l));
    return Array.from(map.values());
  };
  KO.getLesson = (id) => KO.allLessons().find((l) => l.id === id) || null;

  // --- 全站單字索引（課程單字 ＋ 分級單字庫） ---
  KO.vocabIndex = new Map();
  KO.wordBank = [];
  KO.wordsByLevel = { A1: [], A2: [], B1: [], B2: [], C1: [], C2: [] };
  KO.wordKey = (w) => KO.ko.nfc(String(w || '').trim());

  KO.indexLessons = function () {
    KO.vocabIndex.clear();
    for (const l of KO.allLessons()) {
      for (const v of l.vocab || []) {
        const surface = KO.surface(v.w);
        const k = KO.wordKey(surface);
        if (!KO.vocabIndex.has(k)) {
          KO.vocabIndex.set(k, {
            w: surface,
            ko: v.w,
            hanja: v.hanja || '',
            pos: v.pos || '',
            zh: v.zh || '',
            ex: v.ex || '',
            ex_zh: v.ex_zh || '',
            lessonId: l.id,
            level: l.level,
            t: l.topic || 'daily',
          });
        }
      }
      for (const ln of l.lines || []) {
        if (!ln.koPlain) ln.koPlain = KO.surface(ln.ko);
        if (!ln.koRead) ln.koRead = KO.reading(ln.ko);
        if (!ln.ro) ln.ro = KO.romaji(ln.ko);
      }
    }
    KO.indexWords();
  };

  KO.indexWords = function () {
    const seen = new Set();
    KO.wordBank = [];
    KO.wordsByLevel = { A1: [], A2: [], B1: [], B2: [], C1: [], C2: [] };
    const push = (raw, lv, topic, lessonId) => {
      const surface = KO.surface(raw.w);
      const k = KO.wordKey(surface);
      if (!k || seen.has(k)) return;
      seen.add(k);
      const item = {
        key: k,
        w: surface,
        ko: raw.w,
        hanja: raw.hanja || '',
        pos: raw.pos || '',
        zh: raw.zh || '',
        ex: raw.ex || '',
        ex_zh: raw.ex_zh || '',
        level: lv || raw.level || 'A1',
        t: raw.t || topic || 'daily',
        lessonId: lessonId || raw.lessonId || '',
      };
      KO.wordBank.push(item);
      if (KO.wordsByLevel[item.level]) KO.wordsByLevel[item.level].push(item);
      if (!KO.vocabIndex.has(k)) KO.vocabIndex.set(k, item);
    };
    for (const [lv, arr] of Object.entries(KO.WORD_BANKS || {})) {
      for (const w of arr || []) push(w, lv, w.t, '');
    }
    for (const w of KO.WORDS || []) push(w, w.level, w.t, '');
    for (const l of KO.allLessons()) {
      for (const v of l.vocab || []) push(v, l.level, l.topic, l.id);
    }
  };

  // --- 持久化 + 後端非阻塞同步 ---
  let syncTimer = null;
  KO.isStatic = () => !!window.KO_STATIC_ONLY || location.protocol === 'file:' || /\.github\.io$/i.test(location.hostname);

  KO.save = function () {
    KO.state.updatedAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(KO.state)); } catch {}
    KO.renderHeaderStats && KO.renderHeaderStats();
    if (KO.isStatic()) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => {
      fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(KO.state),
      }).catch(() => {});
    }, 600);
  };

  KO.mergeState = function (remote) {
    if (!remote || typeof remote !== 'object') return;
    const a = KO.state, b = remote;
    const resetAt = Math.max(a.resetAt || 0, b.resetAt || 0);
    const newer = (b.updatedAt || 0) > (a.updatedAt || 0);
    if (newer) {
      a.settings = { ...a.settings, ...(b.settings || {}) };
      a.meta = { ...a.meta, ...(b.meta || {}) };
    }
    a.resetAt = resetAt;
    const keep = (v) => v && (v.updatedAt || v.addedAt || v.seen || 0) >= resetAt;
    for (const [k, v] of Object.entries(a.lessons)) if (!keep(v)) delete a.lessons[k];
    for (const [k, v] of Object.entries(b.lessons || {})) {
      if (!keep(v)) continue;
      const cur = a.lessons[k];
      if (!cur || (v.updatedAt || 0) > (cur.updatedAt || 0)) a.lessons[k] = v;
    }
    for (const [k, v] of Object.entries(a.vocab)) if (!keep(v)) delete a.vocab[k];
    for (const [k, v] of Object.entries(b.vocab || {})) {
      if (!keep(v)) continue;
      const cur = a.vocab[k];
      if (!cur) a.vocab[k] = v;
      else if (v.deleted && (v.updatedAt || 0) >= (cur.updatedAt || 0)) a.vocab[k] = v;
      else if (!cur.deleted && (v.updatedAt || 0) > (cur.updatedAt || 0)) a.vocab[k] = v;
    }
    for (const [k, v] of Object.entries(a.hangul || {})) if (!keep(v)) delete a.hangul[k];
    for (const [k, v] of Object.entries(b.hangul || {})) {
      if (!keep(v)) continue;
      const cur = a.hangul[k];
      if (!cur || (v.updatedAt || 0) > (cur.updatedAt || 0)) a.hangul[k] = v;
    }
    for (const [k, v] of Object.entries(a.words || {})) if (!keep(v)) delete a.words[k];
    for (const [k, v] of Object.entries(b.words || {})) {
      if (!keep(v)) continue;
      const cur = a.words[k];
      if (!cur || (v.seen || 0) > (cur.seen || 0)) a.words[k] = v;
    }
    const resetDay = resetAt ? KO.todayKey(new Date(resetAt)) : '';
    if (resetDay) {
      for (const d of Object.keys(a.days)) if (d < resetDay) delete a.days[d];
    }
    for (const [d, v] of Object.entries(b.days || {})) {
      if (resetDay && d < resetDay) continue;
      const cur = a.days[d] || { sec: 0, lines: 0, reviews: 0, lessons: 0 };
      a.days[d] = {
        sec: Math.max(cur.sec || 0, v.sec || 0),
        lines: Math.max(cur.lines || 0, v.lines || 0),
        reviews: Math.max(cur.reviews || 0, v.reviews || 0),
        lessons: Math.max(cur.lessons || 0, v.lessons || 0),
      };
    }
    try { localStorage.setItem(KEY, JSON.stringify(a)); } catch {}
  };

  KO.resetAll = function () {
    const fresh = DEFAULT_STATE();
    fresh.resetAt = Date.now();
    fresh.updatedAt = fresh.resetAt;
    fresh.settings.onboarded = true;
    KO.state = fresh;
    KO.save();
  };

  // --- 單日學習紀錄與連續天數 ---
  function dayRec(k = KO.todayKey()) {
    if (!KO.state.days[k]) KO.state.days[k] = { sec: 0, lines: 0, reviews: 0, lessons: 0 };
    return KO.state.days[k];
  }
  KO.bumpDay = function (field, inc = 1) {
    const r = dayRec();
    r[field] = (r[field] || 0) + inc;
    KO.save();
  };
  KO.todayMinutes = () => Math.floor(((KO.state.days[KO.todayKey()] || {}).sec || 0) / 60);

  KO.streak = function () {
    const days = KO.state.days;
    const active = (k) => {
      const d = days[k];
      return d && ((d.sec || 0) >= 60 || (d.lines || 0) > 0 || (d.reviews || 0) > 0 || (d.lessons || 0) > 0);
    };
    let cur = KO.todayKey();
    if (!active(cur)) cur = KO.shiftDay(cur, -1);
    let n = 0;
    while (active(cur)) {
      n++;
      cur = KO.shiftDay(cur, -1);
    }
    return n;
  };

  // 練習頁啟用時計時（閒置 45 秒自動暫停）
  let lastActive = Date.now();
  const PRACTICE = new Set(['lesson', 'review', 'vocab', 'hangul', 'words']);
  ['pointerdown', 'keydown', 'touchstart'].forEach((ev) =>
    window.addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true })
  );
  setInterval(() => {
    if (document.hidden) return;
    if (!PRACTICE.has(KO.routeName)) return;
    if (Date.now() - lastActive > 45000) return;
    const r = dayRec();
    r.sec = (r.sec || 0) + 5;
    if (r.sec % 25 === 0) KO.save();
    else KO.renderHeaderStats && KO.renderHeaderStats();
  }, 5000);

  // --- 單字本與 SM-2 間隔複習 ---
  KO.vocabKey = (w) => KO.wordKey(KO.surface(w));

  KO.addVocab = function (entry) {
    const surface = KO.surface(entry.w);
    const k = KO.vocabKey(surface);
    if (!k) return null;
    const cur = KO.state.vocab[k];
    if (cur && !cur.deleted) {
      cur.ko = entry.ko || cur.ko || surface;
      cur.hanja = entry.hanja || cur.hanja || '';
      cur.zh = entry.zh || cur.zh;
      cur.pos = entry.pos || cur.pos;
      cur.ex = entry.ex || cur.ex;
      cur.ex_zh = entry.ex_zh || cur.ex_zh || '';
      cur.updatedAt = Date.now();
      KO.save();
      return cur;
    }
    const now = Date.now();
    const item = {
      w: surface,
      ko: entry.ko || surface,
      hanja: entry.hanja || '',
      pos: entry.pos || '',
      zh: entry.zh || '',
      ex: entry.ex || '',
      ex_zh: entry.ex_zh || '',
      lessonId: entry.lessonId || '',
      level: entry.level || '',
      addedAt: now,
      updatedAt: now,
      due: KO.todayKey(),
      interval: 0,
      ease: 2.5,
      reps: 0,
      lapses: 0,
    };
    KO.state.vocab[k] = item;
    if (!KO.state.words[k]) KO.state.words[k] = { seen: now, level: item.level || 'A1' };
    KO.save();
    return item;
  };

  KO.markWordSeen = function (w, level) {
    const k = KO.wordKey(KO.surface(w));
    if (!k) return;
    if (!KO.state.words[k]) {
      KO.state.words[k] = { seen: Date.now(), level: level || 'A1' };
      KO.save();
    }
  };

  KO.removeVocab = function (w) {
    const k = KO.vocabKey(w);
    if (KO.state.vocab[k]) {
      KO.state.vocab[k] = { w: k, deleted: true, updatedAt: Date.now() };
      KO.save();
    }
  };

  KO.hasVocab = (w) => {
    const v = KO.state.vocab[KO.vocabKey(w)];
    return !!(v && !v.deleted);
  };

  KO.vocabList = () =>
    Object.values(KO.state.vocab)
      .filter((v) => v && !v.deleted)
      .sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));

  KO.dueVocab = () => {
    const today = KO.todayKey();
    return KO.vocabList().filter((v) => (v.due || '0000-00-00') <= today);
  };

  // grade: 0 忘記 / 1 吃力 / 2 記得 / 3 輕鬆
  KO.gradeVocab = function (w, grade) {
    const v = KO.state.vocab[KO.vocabKey(w)];
    if (!v || v.deleted) return;
    let { interval = 0, ease = 2.5, reps = 0, lapses = 0 } = v;
    if (grade === 0) {
      reps = 0; interval = 1; lapses += 1; ease = Math.max(1.3, ease - 0.2);
    } else if (grade === 1) {
      interval = Math.max(1, Math.round((interval || 1) * 1.2));
      ease = Math.max(1.3, ease - 0.15);
      reps += 1;
    } else if (grade === 2) {
      interval = reps === 0 ? 1 : reps === 1 ? 3 : Math.round(interval * ease);
      reps += 1;
    } else {
      interval = reps === 0 ? 3 : reps === 1 ? 6 : Math.round(interval * ease * 1.3);
      ease = Math.min(3.0, ease + 0.1);
      reps += 1;
    }
    v.interval = interval; v.ease = ease; v.reps = reps; v.lapses = lapses;
    v.due = KO.shiftDay(KO.todayKey(), interval);
    v.updatedAt = Date.now();
    KO.bumpDay('reviews', 1);
  };

  // --- 課程進度 ---
  KO.lessonProg = function (id) {
    if (!KO.state.lessons[id]) {
      KO.state.lessons[id] = { listened: [], shadowed: {}, roleBest: 0, dictBest: 0, quizBest: null, completed: false, updatedAt: 0 };
    }
    return KO.state.lessons[id];
  };
  KO.markLesson = function (id, patch) {
    const p = KO.lessonProg(id);
    Object.assign(p, patch, { updatedAt: Date.now() });
    KO.state.meta.lastLessonId = id;
    KO.save();
  };
  KO.completeLesson = function (id) {
    const p = KO.lessonProg(id);
    const first = !p.completed;
    p.completed = true;
    p.updatedAt = Date.now();
    KO.state.meta.lastLessonId = id;
    if (first) KO.bumpDay('lessons', 1);
    else KO.save();
  };

  KO.levelBadge = (lv) => `<span class="lv lv-${lv.toLowerCase()}">${lv}</span>`;
  KO.topikChip = (lv) => {
    const t = KO.topikOf(lv);
    return t ? `<span class="topik">${KO.esc(t)}</span>` : '';
  };
  KO.topicLabel = (t) => (KO.TOPICS[t] ? `${KO.TOPICS[t][1]} ${KO.TOPICS[t][0]}` : t || '');
})();

</script>
<script>/* /js/speech.js */
/* 韓語語音模組：TTS 朗讀（多鏡像自然雲端韓語語音 ＋ 本機 Web Speech ko-KR 雙引擎備援）、
 * Web Speech API 韓文口說辨識（ko-KR）、MediaRecorder 錄音重播、韓文雙軌（拼寫＋連音讀音）比對評分。
 *
 * 完整遵循 CAMPUS_CONTRACT §7 多國語言無限重複播放規範：
 *  1. 自動確保 <meta name="referrer" content="no-referrer">（防止 GitHub Pages 送 Referer 遭 404）
 *  2. 雲端多鏡像備援（blobCache → 本機 /api/tts → gtx → clients5 → tw-ob → 有道韓語 le=ko → speechSynthesis）
 *  3. 每次播放建立全新 new Audio()，結束或中斷時釋放硬體音訊管線，保證同一單字或四十音可無限次連點重播
 *  4. 所有韓文字串先經 Unicode NFC 正規化（修復 macOS / iOS NFD 初中終聲分解）
 */
(function () {
  'use strict';
  const KO = (window.KO = window.KO || {});

  function ensureNoReferrerMeta() {
    try {
      if (typeof document === 'undefined' || !document.head) return;
      let m = document.querySelector('meta[name="referrer"]');
      if (!m) {
        m = document.createElement('meta');
        m.name = 'referrer';
        document.head.appendChild(m);
      }
      if (m.content !== 'no-referrer') m.content = 'no-referrer';
    } catch {}
  }
  ensureNoReferrerMeta();

  let audioUnlocked = false;
  function unlockAudioOnce() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) {
        const ctx = new Ctx();
        if (ctx.state === 'suspended') ctx.resume().catch(() => {});
        const buf = ctx.createBuffer(1, 1, 22050);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.start(0);
        setTimeout(() => { try { ctx.close(); } catch {} }, 250);
      }
    } catch {}
  }
  if (typeof window !== 'undefined') {
    ['pointerdown', 'touchstart', 'keydown'].forEach((ev) => {
      window.addEventListener(ev, unlockAudioOnce, { once: true, passive: true });
    });
  }

  // -------------------- 1. TTS 朗讀 --------------------
  const synth = window.speechSynthesis || null;
  let voices = [];
  const KO_FEMALE = /Yuna|Sora|SunHi|Heami|Seoyeon|Narae|Google 한국의|Female/i;
  const KO_MALE = /InJoon|Minsu|Jinho|GookMin|Male/i;

  function loadVoices() {
    if (!synth) return [];
    const all = synth.getVoices() || [];
    const ko = all.filter((v) => /^ko([-_]|$)/i.test(v.lang) || /Korean|한국/i.test(v.name));
    voices = ko.sort((a, b) => rankVoice(b) - rankVoice(a));
    return voices;
  }
  function rankVoice(v) {
    let s = 0;
    if (/ko[-_]KR/i.test(v.lang)) s += 25;
    if (/Natural|Neural|Online|Premium|Enhanced|Siri/i.test(v.name)) s += 40;
    if (/Yuna|Sora|SunHi|InJoon|Google/i.test(v.name)) s += 28;
    if (!v.localService) s += 8;
    return s;
  }
  if (synth) {
    loadVoices();
    if ('onvoiceschanged' in synth) synth.onvoiceschanged = loadVoices;
  }

  function pickVoice(gender) {
    if (!voices.length) loadVoices();
    const pref = KO.state.settings.voiceURI;
    if (pref && !gender) {
      const found = voices.find((v) => v.voiceURI === pref);
      if (found) return found;
    }
    if (gender === 'F') {
      const f = voices.find((v) => KO_FEMALE.test(v.name));
      if (f) return f;
    } else if (gender === 'M') {
      const m = voices.find((v) => KO_MALE.test(v.name) && !KO_FEMALE.test(v.name));
      if (m) return m;
    }
    return voices[0] || null;
  }

  function releaseAudio(a) {
    if (!a) return;
    try { a.onended = a.onerror = a.onloadedmetadata = a.oncanplay = null; } catch {}
    try { a.pause(); } catch {}
    try { a.removeAttribute('src'); a.load(); } catch {}
  }

  let curBtn = null;
  let activeAudio = null;
  let cloudEndTimer = null;
  let cancelCurrentSpeak = null;
  let gen = 0;
  const blobCache = new Map();

  function clearActiveBtn() {
    if (curBtn) { curBtn.classList.remove('is-speaking'); curBtn = null; }
  }

  function stopOnly() {
    gen++;
    clearTimeout(cloudEndTimer);
    cloudEndTimer = null;
    if (synth) { try { synth.cancel(); } catch {} }
    if (activeAudio) {
      const a = activeAudio;
      activeAudio = null;
      releaseAudio(a);
    }
    clearActiveBtn();
    if (cancelCurrentSpeak) {
      const fn = cancelCurrentSpeak;
      cancelCurrentSpeak = null;
      fn();
    }
  }

  function splitChunks(s, maxLen = 150) {
    const clean = KO.ko.nfc(KO.surface(s)).replace(/\s+/g, ' ').trim();
    if (clean.length <= maxLen) return clean ? [clean] : [];
    const parts = clean.split(/(?<=[.!?。！？])\s*/);
    const out = [];
    let buf = '';
    for (const p of parts) {
      if (!p) continue;
      if ((buf + ' ' + p).trim().length <= maxLen) buf = (buf ? buf + ' ' : '') + p;
      else {
        if (buf) out.push(buf);
        if (p.length <= maxLen) buf = p;
        else {
          for (let i = 0; i < p.length; i += maxLen) out.push(p.slice(i, i + maxLen));
          buf = '';
        }
      }
    }
    if (buf) out.push(buf);
    return out;
  }

  function cloudCandidates(text) {
    const nfcText = KO.ko.nfc(text);
    const q = encodeURIComponent(nfcText);
    const list = [];
    const cached = blobCache.get(nfcText);
    if (cached) list.push({ url: cached, cached: true });
    if (!KO.isStatic()) {
      list.push({ url: `/api/tts?tl=ko&q=${q}`, localApi: true });
    }
    list.push({ url: `https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=ko&q=${q}` });
    list.push({ url: `https://clients5.google.com/translate_tts?ie=UTF-8&client=dict-chrome-ex&tl=ko&q=${q}` });
    list.push({ url: `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ko&q=${q}` });
    list.push({ url: `https://dict.youdao.com/dictvoice?audio=${q}&le=ko` });
    return list;
  }

  function warmBlobCache(text, url) {
    const nfcText = KO.ko.nfc(text);
    if (blobCache.has(nfcText) || blobCache.size > 140) return;
    fetch(url, { referrerPolicy: 'no-referrer', cache: 'force-cache' })
      .then((r) => (r.ok ? r.blob() : null))
      .then((b) => {
        if (b && b.size > 128 && !blobCache.has(nfcText)) {
          blobCache.set(nfcText, URL.createObjectURL(b));
        }
      })
      .catch(() => {});
  }

  function playOneUrl(cand, rate, myGen, onOk, onFail) {
    if (myGen !== gen) return;
    clearTimeout(cloudEndTimer);
    if (activeAudio) {
      releaseAudio(activeAudio);
      activeAudio = null;
    }

    const a = new Audio();
    activeAudio = a;
    let settled = false;
    let started = false;
    try { a.referrerPolicy = 'no-referrer'; } catch {}
    a.preload = 'auto';
    a.src = cand.url;
    try { a.playbackRate = Math.max(0.5, Math.min(1.6, rate)); } catch {}

    const cleanupTimers = () => {
      clearTimeout(loadTimer);
      clearTimeout(cloudEndTimer);
      cloudEndTimer = null;
    };

    const finishOk = () => {
      if (settled) return;
      settled = true;
      cleanupTimers();
      if (activeAudio === a) activeAudio = null;
      releaseAudio(a);
      if (myGen !== gen) return;
      onOk();
    };

    const failOnce = () => {
      if (settled) return;
      settled = true;
      cleanupTimers();
      if (activeAudio === a) activeAudio = null;
      releaseAudio(a);
      if (myGen !== gen) return;
      onFail();
    };

    const armEndTimer = () => {
      clearTimeout(cloudEndTimer);
      const dur = Number.isFinite(a.duration) && a.duration > 0 ? a.duration : 0;
      const waitMs = dur > 0
        ? Math.ceil((dur / Math.max(0.5, rate)) * 1000) + 1200
        : 12000;
      cloudEndTimer = setTimeout(() => {
        if (myGen === gen && started && !settled) finishOk();
      }, Math.min(35000, Math.max(2500, waitMs)));
    };

    const loadTimer = setTimeout(() => {
      if (!started) failOnce();
    }, 4500);

    a.onloadedmetadata = () => {
      if (myGen !== gen || settled) return;
      try { a.playbackRate = Math.max(0.5, Math.min(1.6, rate)); } catch {}
      if (started) armEndTimer();
    };
    a.onended = finishOk;
    a.onerror = () => {
      if (cand.cached) {
        try { URL.revokeObjectURL(cand.url); } catch {}
        for (const [k, v] of blobCache.entries()) if (v === cand.url) blobCache.delete(k);
      }
      failOnce();
    };

    const p = a.play();
    if (p && typeof p.then === 'function') {
      p.then(() => {
        if (myGen !== gen || settled) return;
        started = true;
        clearTimeout(loadTimer);
        try { a.playbackRate = Math.max(0.5, Math.min(1.6, rate)); } catch {}
        armEndTimer();
        if (cand.localApi) warmBlobCache(cand.rawText || '', cand.url);
      }).catch(() => {
        failOnce();
      });
    } else {
      started = true;
      clearTimeout(loadTimer);
      armEndTimer();
    }
  }

  function speakCloud(text, opts, myGen, onAllFail) {
    const chunks = splitChunks(text);
    if (!chunks.length) { clearActiveBtn(); opts.onEnd && opts.onEnd(); return; }
    const rate = opts.rate || KO.state.settings.rate || 0.95;
    let idx = 0;

    const nextChunk = () => {
      if (myGen !== gen) return;
      if (idx >= chunks.length) {
        clearActiveBtn();
        opts.onEnd && opts.onEnd();
        return;
      }
      const chunk = chunks[idx++];
      const cands = cloudCandidates(chunk).map((c) => ({ ...c, rawText: chunk }));
      let ci = 0;
      const tryCand = () => {
        if (myGen !== gen) return;
        if (ci >= cands.length) {
          onAllFail && onAllFail();
          return;
        }
        playOneUrl(cands[ci++], rate, myGen, nextChunk, tryCand);
      };
      tryCand();
    };
    nextChunk();
  }

  function speakSynth(clean, opts, myGen, fallbackCloudOnSilent) {
    if (!synth) {
      if (fallbackCloudOnSilent) speakCloud(clean, opts, myGen, () => { clearActiveBtn(); KO.toast('找不到可用的韓語語音引擎'); opts.onEnd && opts.onEnd(); });
      else { clearActiveBtn(); KO.toast('此瀏覽器不支援語音合成'); opts.onEnd && opts.onEnd(); }
      return false;
    }
    try { synth.cancel(); } catch {}
    try { if (synth.paused) synth.resume(); } catch {}

    const u = new SpeechSynthesisUtterance(KO.ko.nfc(clean));
    const v = pickVoice(opts.gender);
    if (v) { u.voice = v; u.lang = v.lang; }
    else u.lang = 'ko-KR';
    u.rate = opts.rate || KO.state.settings.rate || 0.95;
    u.pitch = opts.gender === 'M' ? 0.92 : 1.02;

    let started = false;
    let finished = false;
    let startWatch = null;
    let endWatch = null;

    const done = () => {
      if (finished) return;
      finished = true;
      clearTimeout(startWatch);
      clearTimeout(endWatch);
      if (myGen !== gen) return;
      clearActiveBtn();
      opts.onEnd && opts.onEnd();
    };

    u.onstart = () => {
      started = true;
      clearTimeout(startWatch);
      const estMs = Math.max(4000, Math.min(35000, clean.length * 360));
      endWatch = setTimeout(() => { if (!finished) done(); }, estMs);
    };
    u.onend = done;
    u.onerror = () => {
      clearTimeout(startWatch);
      clearTimeout(endWatch);
      if (finished || myGen !== gen) return;
      finished = true;
      if (!started && fallbackCloudOnSilent) {
        speakCloud(clean, opts, myGen, () => { clearActiveBtn(); opts.onEnd && opts.onEnd(); });
      } else {
        clearActiveBtn();
        opts.onEnd && opts.onEnd();
      }
    };

    if (fallbackCloudOnSilent) {
      startWatch = setTimeout(() => {
        if (started || finished || myGen !== gen) return;
        finished = true;
        try { synth.cancel(); } catch {}
        speakCloud(clean, opts, myGen, () => { clearActiveBtn(); opts.onEnd && opts.onEnd(); });
      }, 900);
    }

    try {
      synth.speak(u);
      try { if (synth.paused) synth.resume(); } catch {}
    } catch {
      clearTimeout(startWatch);
      if (fallbackCloudOnSilent) speakCloud(clean, opts, myGen, () => { clearActiveBtn(); opts.onEnd && opts.onEnd(); });
      else done();
    }
    return true;
  }

  function shouldPreferCloudInAuto() {
    if (KO.isStatic()) return true;
    const ua = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
    const isLinux = /Linux/i.test(ua) && !/Android/i.test(ua);
    const hasKoVoice = loadVoices().length > 0;
    if (isLinux && !hasKoVoice) return true;
    if (!synth || !hasKoVoice) return true;
    return false;
  }

  function speak(text, opts = {}) {
    ensureNoReferrerMeta();
    unlockAudioOnce();
    const raw = KO.ko.nfc(String(text || '').trim());
    const clean = KO.surface(raw).replace(/\s+/g, ' ').trim();
    if (!clean) { opts.onEnd && opts.onEnd(); return Promise.resolve({ ok: false }); }

    stopPlayUrl();
    stopOnly();
    const myGen = gen;

    if (opts.btn) { curBtn = opts.btn; curBtn.classList.add('is-speaking'); }
    const mode = opts.mode || KO.state.settings.ttsMode || 'auto';

    return new Promise((resolve) => {
      let resolved = false;
      const settle = (res, callOnEnd) => {
        if (resolved) return;
        resolved = true;
        if (cancelCurrentSpeak === onCancel) cancelCurrentSpeak = null;
        try { if (callOnEnd && opts.onEnd) opts.onEnd(); } finally { resolve(res); }
      };
      const onCancel = () => settle({ ok: false, canceled: true }, false);
      cancelCurrentSpeak = onCancel;

      const wrappedOpts = {
        ...opts,
        onEnd: () => settle({ ok: myGen === gen, canceled: myGen !== gen }, myGen === gen),
      };

      if (mode === 'cloud') {
        speakCloud(clean, wrappedOpts, myGen, () => speakSynth(clean, wrappedOpts, myGen, false));
        return;
      }
      if (mode === 'local') {
        speakSynth(clean, wrappedOpts, myGen, false);
        return;
      }
      if (shouldPreferCloudInAuto()) {
        speakCloud(clean, wrappedOpts, myGen, () => speakSynth(clean, wrappedOpts, myGen, false));
      } else {
        speakSynth(clean, wrappedOpts, myGen, true);
      }
    });
  }

  async function speakSeq(items, getOpts, shouldStop) {
    const startGen = gen;
    for (let i = 0; i < items.length; i++) {
      if (shouldStop && shouldStop()) break;
      if (gen !== startGen && i > 0) break;
      const o = getOpts ? getOpts(items[i], i) : {};
      await new Promise((res) => {
        speak(items[i], { ...o, onEnd: () => { o.onEnd && o.onEnd(); res(); } });
      });
      await new Promise((r) => setTimeout(r, 260));
    }
  }

  KO.tts = {
    supported: true,
    voices: () => loadVoices(),
    speak,
    speakSeq,
    stop: stopOnly,
  };

  // -------------------- 2. 語音辨識（Web Speech API ko-KR） --------------------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  let activeRec = null;

  function listen({ lang = 'ko-KR', onInterim, onFinal, onError, onEnd } = {}) {
    if (!SR) { onError && onError('unsupported'); return null; }
    KO.tts.stop();
    stopPlayUrl();
    if (activeRec) { try { activeRec.abort(); } catch {} activeRec = null; }
    const rec = new SR();
    activeRec = rec;
    rec.lang = lang;
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 3;
    let finalText = '';
    let settled = false;
    rec.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t;
        else interim += t;
      }
      if (interim && onInterim) onInterim(KO.ko.nfc(interim));
    };
    rec.onerror = (e) => {
      settled = true;
      onError && onError(e.error || 'error');
    };
    rec.onend = () => {
      activeRec = null;
      if (!settled) onFinal && onFinal(KO.ko.nfc(finalText.trim()));
      onEnd && onEnd();
    };
    try { rec.start(); } catch { onError && onError('busy'); }
    return { stop: () => { try { rec.stop(); } catch {} } };
  }

  KO.asr = {
    supported: !!SR,
    listen,
    stop: () => { if (activeRec) { try { activeRec.stop(); } catch {} activeRec = null; } },
  };

  // -------------------- 3. 麥克風錄音（MediaRecorder）＋ 無限重播 --------------------
  let playUrlAudio = null;
  let playUrlBtn = null;
  let cancelPlayUrl = null;

  function stopPlayUrl() {
    if (playUrlAudio) {
      const a = playUrlAudio;
      playUrlAudio = null;
      releaseAudio(a);
    }
    if (playUrlBtn) {
      playUrlBtn.classList.remove('is-speaking');
      playUrlBtn = null;
    }
    if (cancelPlayUrl) {
      const fn = cancelPlayUrl;
      cancelPlayUrl = null;
      fn();
    }
  }

  KO.rec = {
    supported: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder),
    async start() {
      stopOnly();
      stopPlayUrl();
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const chunks = [];
      const mr = new MediaRecorder(stream);
      mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      const stopped = new Promise((resolve) => {
        mr.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
          resolve(URL.createObjectURL(blob));
        };
      });
      mr.start();
      return { stop: () => { if (mr.state !== 'inactive') mr.stop(); return stopped; } };
    },
  };

  KO.playUrl = function (url, btn) {
    if (!url) return Promise.resolve({ ok: false });
    unlockAudioOnce();
    stopOnly();
    stopPlayUrl();
    return new Promise((resolve) => {
      const a = new Audio();
      playUrlAudio = a;
      if (btn) { playUrlBtn = btn; btn.classList.add('is-speaking'); }
      a.preload = 'auto';
      a.src = url;
      let finished = false;
      let endTimer = null;
      const done = (ok, canceled = false) => {
        if (finished) return;
        finished = true;
        if (endTimer) { clearTimeout(endTimer); endTimer = null; }
        if (cancelPlayUrl === onCancel) cancelPlayUrl = null;
        if (playUrlAudio === a) playUrlAudio = null;
        if (playUrlBtn === btn && btn) { btn.classList.remove('is-speaking'); playUrlBtn = null; }
        releaseAudio(a);
        resolve({ ok: !!ok, canceled: !!canceled });
      };
      const onCancel = () => done(false, true);
      cancelPlayUrl = onCancel;
      const armEnd = () => {
        if (finished) return;
        if (endTimer) clearTimeout(endTimer);
        const hasDur = a.duration && Number.isFinite(a.duration) && a.duration > 0;
        const ms = hasDur ? Math.max(180, Math.ceil((a.duration - (a.currentTime || 0)) * 1000) + 400) : 12000;
        endTimer = setTimeout(() => done(true), ms);
      };
      a.onplaying = armEnd;
      a.ondurationchange = () => { if (!a.paused) armEnd(); };
      a.onended = () => done(true);
      a.onerror = () => done(false);
      try {
        const p = a.play();
        if (p && typeof p.catch === 'function') p.catch(() => done(false));
      } catch {
        done(false);
      }
    });
  };

  // -------------------- 4. 韓文口說／聽寫雙軌比對評分 --------------------
  // 同時比對：① 韓文正字法表層（한국어를） ② 韓語音變實際讀音（한구거를）
  // 並支援在羅馬拼音模式（opts.romaji）下將羅馬拼音自動轉寫為韓文音節再比對！
  function charLCS(a, b) {
    const x = Array.from(a), y = Array.from(b);
    const m = x.length, n = y.length;
    if (!m || !n) return 0;
    const dp = Array.from({ length: m + 1 }, () => new Uint16Array(n + 1));
    for (let i = m - 1; i >= 0; i--) {
      for (let j = n - 1; j >= 0; j--) {
        dp[i][j] = x[i] === y[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    return dp[0][0];
  }

  function normWord(s) {
    return KO.ko.normalize(s);
  }

  KO.score = function (expectedRaw, heardRaw, opts) {
    const toks = KO.ko.tokens(expectedRaw);
    const wordToks = toks.map((t) => ({
      surface: t.surface,
      reading: t.reading,
      ns: normWord(t.surface),
      nr: normWord(t.reading),
    })).filter((t) => t.ns.length > 0);

    if (!wordToks.length) return { pct: 100, items: [], heard: heardRaw || '' };

    let heardStr = KO.ko.nfc(String(heardRaw || '').trim());
    if (opts && opts.romaji && /[a-z]/i.test(heardStr) && !KO.ko.hasHangul(heardStr)) {
      heardStr = KO.ko.romajiSentenceToHangul(heardStr);
    }

    const heardWords = heardStr
      .split(/\s+/)
      .map((w) => ({ raw: w, ns: normWord(w), nr: normWord(KO.ko.pronounceWord(w)) }))
      .filter((w) => w.ns.length > 0);

    // 若使用者或語音辨識沒打空白（整句黏在一起），也提供整串正規化備援比對
    const fullHeardNorm = normWord(heardStr);
    const fullHeardPron = normWord(KO.reading(heardStr));

    if (!fullHeardNorm) {
      return {
        pct: 0,
        heard: heardRaw || '',
        items: wordToks.map((t) => ({ word: t.surface, reading: t.reading, state: 'miss' })),
      };
    }

    let hCursor = 0;
    let earned = 0;
    const items = [];

    for (const wt of wordToks) {
      let bestState = 'miss';
      let bestSim = 0;
      let matchedIdx = -1;

      // 在鄰近視窗內尋找對應韓文詞塊
      for (let j = hCursor; j < Math.min(heardWords.length, hCursor + 3); j++) {
        const hw = heardWords[j];
        if (hw.ns === wt.ns) {
          bestState = 'ok'; bestSim = 1; matchedIdx = j; break;
        }
        if (hw.ns === wt.nr || hw.nr === wt.nr || hw.nr === wt.ns) {
          bestState = 'alt'; bestSim = 1; matchedIdx = j; break;
        }
        const sim1 = charLCS(wt.ns, hw.ns) / Math.max(wt.ns.length, hw.ns.length);
        const sim2 = charLCS(wt.nr, hw.nr) / Math.max(wt.nr.length, hw.nr.length);
        const sim = Math.max(sim1, sim2);
        if (sim > bestSim) { bestSim = sim; matchedIdx = j; }
      }

      if (bestState === 'miss') {
        if (bestSim >= 0.7) {
          bestState = 'near';
        } else if (fullHeardNorm.includes(wt.ns)) {
          bestState = 'ok'; bestSim = 1;
        } else if (fullHeardNorm.includes(wt.nr) || fullHeardPron.includes(wt.nr)) {
          bestState = 'alt'; bestSim = 1;
        }
      }

      if (matchedIdx >= 0 && (bestState !== 'miss')) hCursor = matchedIdx + 1;
      if (bestState === 'ok' || bestState === 'alt') earned += 1;
      else if (bestState === 'near') earned += 0.65;

      items.push({ word: wt.surface, reading: wt.reading, state: bestState });
    }

    // 結合整句字元級 LCS 分數，避免分詞差異低估正確發音
    const expFullS = wordToks.map((t) => t.ns).join('');
    const expFullR = wordToks.map((t) => t.nr).join('');
    const charSim = Math.max(
      charLCS(expFullS, fullHeardNorm) / Math.max(expFullS.length, fullHeardNorm.length),
      charLCS(expFullR, fullHeardPron) / Math.max(expFullR.length, fullHeardPron.length)
    );
    const wordPct = (earned / wordToks.length) * 100;
    const pct = Math.min(100, Math.round(Math.max(wordPct, charSim * 100)));

    return { pct, items, heard: heardRaw || '' };
  };

  KO.scoredHtml = (items) =>
    items
      .map((it) => {
        const tip =
          it.state === 'ok' ? '發音／拼寫完全正確'
          : it.state === 'alt' ? `連音讀音一致（標準拼寫：${it.word}，讀音：${it.reading}）`
          : it.state === 'near' ? '發音接近，可再聽一次尾音／收音'
          : `漏讀或需加強（讀音：${it.reading}）`;
        return `<span class="tk ${it.state} ko-txt" title="${KO.esc(tip)}">${KO.esc(it.word)}</span>`;

  { w: '퇴색하다', hanja: '退色', pos: '動詞', zh: '褪色、失色（意義變質）', ex: '지나친 상업화로 인해 지역 축제의 본래 취지가 퇴색하지 않도록 경계해야 한다.', ex_zh: '必須警惕避免地方慶典的初衷因過度商業化而變質失色。', t: 'celebrations' },
  { w: '만연하다', hanja: '蔓延', pos: '動詞', zh: '蔓延、充斥盛行（負面風氣）', ex: '결과만 좋으면 수단은 상관없다는 식의 성과주의가 사회에 만연하는 것을 막아야 한다.', ex_zh: '必須防止只要結果好便不擇手段的功利績效主義在社會上蔓延。', t: 'society' },
  { w: '팽배하다', hanja: '澎湃', pos: '動詞', zh: '瀰漫、高漲充斥（不滿／危機感）', ex: '고물가가 장기화되면서 서민 경제 전반에 위기의식이 팽배해 있다.', ex_zh: '隨著高物價長期持續，庶民經濟整體瀰漫著一股危機意識。', t: 'money' },
  { w: '대변하다', hanja: '代辯', pos: '動詞', zh: '代言、反映出（心聲／時代）', ex: '그 소설은 급변하는 산업화 시대를 살아간 평범한 소시민들의 삶을 생생히 대변한다.', ex_zh: '這部小說生動反映了生活在劇變工業化時代裡平凡小市民的人生。', t: 'culture' },
  { w: '집약되다', hanja: '集約', pos: '動詞', zh: '高度匯聚、集大成', ex: '이번에 공개된 차세대 친환경 선박에는 국내 조선업계의 첨단 기술력이 집약되어 있다.', ex_zh: '本次公開的次世代環保船舶，集結了國內造船業界的尖端技術結晶。', t: 'tech' }
);

</script>
<script>/* /api/custom_lessons.js */
(window.KO = window.KO || {}).LESSONS = window.KO.LESSONS || [];
KO.CUSTOM_LESSONS = [];
KO.CUSTOM_LESSONS.forEach(function (l) { l.custom = true; KO.LESSONS.push(l); });

<script>/* /js/hangul.js */
/* 韓語四十音學習專區（한글 40음）：
 * - 基本母音 10、複合母音 11、基本子音 14、雙子音 5、收音 받침 12
 * - 가나다 19×10 互動子母音拼字表（點任一音節即時合成發音＋顯示子音＋母音拆解）
 * - 韓語 6 大標準音變規則（連音化・鼻音化・流音化・激音化・硬音化・顎音化）
 * - 逐組引導學習（#/hangul/row/<id>）＋ 三種互動測驗（看字選音・聽音選字・打字輸入羅馬拼音）
 * - SM-2 四十音熟練度追蹤（KO.state.hangul）
 */
(function () {
  'use strict';
  const KO = (window.KO = window.KO || {});
  const { esc, qs, qsa } = KO;

  const TABS = [
    ['bvowel', '基本母音', '10 音'],
    ['cvowel', '複合母音', '11 音'],
    ['bcons', '基本子音', '14 音'],
    ['dcons', '雙子音', '5 音'],
    ['batchim', '收音 받침', '12 組'],
    ['matrix', '가나다 拼字表', '190 音節'],
    ['rules', '連音與音變', '6 規則'],
  ];

  // 建立全字母快速查詢索引
  let itemByCh = null;
  function ensureIndex() {
    if (itemByCh) return itemByCh;
    itemByCh = new Map();
    for (const r of (KO.HANGUL && KO.HANGUL.rows) || []) {
      for (const it of r.items) itemByCh.set(it.ch, { ...it, group: r.group, rowId: r.id, rowLabel: r.label });
    }
    return itemByCh;
  }

  function allItems(filter) {
    ensureIndex();
    const out = [];
    for (const r of KO.HANGUL.rows) {
      if (filter && filter !== 'all' && r.group !== filter) continue;
      for (const it of r.items) out.push({ ...it, group: r.group, rowId: r.id, rowLabel: r.label });
    }
    return out;
  }

  // --- 四十音熟練度（含簡易 SM-2） ---
  function hRec(ch) {
    if (!KO.state.hangul) KO.state.hangul = {};
    if (!KO.state.hangul[ch]) {
      KO.state.hangul[ch] = { seen: 0, correct: 0, wrong: 0, level: 0, due: '', interval: 0, ease: 2.5, reps: 0, updatedAt: 0 };
    }
    return KO.state.hangul[ch];
  }
  function touchSeen(ch) {
    const r = hRec(ch);
    r.seen = (r.seen || 0) + 1;
    if (r.level === 0) r.level = 1;
    if (!r.due) r.due = KO.todayKey();
    r.updatedAt = Date.now();
    KO.save();
  }
  function gradeHangul(ch, ok) {
    const r = hRec(ch);
    r.seen = (r.seen || 0) + 1;
    if (ok) {
      r.correct = (r.correct || 0) + 1;
      r.reps = (r.reps || 0) + 1;
      r.interval = r.reps === 1 ? 1 : r.reps === 2 ? 3 : Math.round((r.interval || 3) * (r.ease || 2.5));
      r.ease = Math.min(3.0, (r.ease || 2.5) + 0.05);
      r.level = r.reps >= 3 ? 3 : 2;
    } else {
      r.wrong = (r.wrong || 0) + 1;
      r.reps = 0;
      r.interval = 1;
      r.ease = Math.max(1.4, (r.ease || 2.5) - 0.2);
      r.level = 1;
    }
    r.due = KO.shiftDay(KO.todayKey(), r.interval);
    r.updatedAt = Date.now();
    KO.bumpDay('reviews', 1);
  }

  KO.hangulStats = function (group) {
    const items = allItems(group || 'all');
    let seen = 0, familiar = 0, mastered = 0, due = 0;
    const today = KO.todayKey();
    for (const it of items) {
      const r = (KO.state.hangul || {})[it.ch];
      if (!r || !r.level) continue;
      seen++;
      if (r.level >= 2) familiar++;
      if (r.level >= 3) mastered++;
      if (r.due && r.due <= today) due++;
    }
    return { total: items.length, seen, familiar, mastered, due, pct: items.length ? Math.round((mastered / items.length) * 100) : 0 };
  };

  KO.nextHangulRow = function () {
    for (const r of KO.HANGUL.rows) {
      const done = r.items.every((it) => ((KO.state.hangul || {})[it.ch]?.level || 0) >= 2);
      if (!done) return r;
    }
    return KO.HANGUL.rows[0];
  };

  function sayHangul(chOrItem, slow, btn) {
    ensureIndex();
    const it = typeof chOrItem === 'string' ? itemByCh.get(chOrItem) : chOrItem;
    const phrase = it ? it.say : String(chOrItem || '');
    KO.tts.speak(phrase, { rate: slow ? 0.65 : 0.9, btn });
  }

  function displaySymbol(ch) {
    return ch.endsWith(' 받침') ? ch.replace(' 받침', '') : ch;
  }

  // -------------------- 主畫面：四十音學習中樞 --------------------
  let ui = { tab: 'bvowel', sel: 'ㅏ', qGroup: 'all', qCount: 10, matrixInfo: { cho: 'ㄱ', jung: 'ㅏ', syl: '가', ro: 'ga' } };

  KO.renderHangul = function (el, sub, arg) {
    ensureIndex();
    if (sub === 'row') return renderRowStudy(el, arg || 'bv1');
    if (sub === 'quiz') return renderQuiz(el, arg || 'pick');

    const allSt = KO.hangulStats('all');
    const nextRow = KO.nextHangulRow();

    el.innerHTML = `
      <div class="page-head">
        <div>
          <h1>한 四十音專區（한글 40음）</h1>
          <p>韓文字母是世宗大王依「發音器官形狀」與「天・地・人」設計的科學表音文字！點任一格聽實際發音，右側看造字記憶法與代表詞。</p>
        </div>
        <div class="page-acts">
          <span class="chip ok">已熟記 ${allSt.mastered}/${allSt.total}（${allSt.pct}%）</span>
          ${allSt.due ? `<a class="btn sm" href="#/hangul/quiz/due">🔔 到期複習 (${allSt.due})</a>` : ''}
          <a class="btn primary sm" href="#/hangul/row/${esc(nextRow.id)}">▶ 逐組學習：${esc(nextRow.label)}</a>
        </div>
      </div>

      <div class="hangul-tabs" role="tablist">
        ${TABS.map(([k, lbl, subLbl]) => `
          <button class="ktab ${ui.tab === k ? 'active' : ''}" data-tab="${k}" role="tab">
            <b>${lbl}</b><small>${subLbl}</small>
          </button>`).join('')}
      </div>

      ${ui.tab === 'rules' ? rulesHtml() : ui.tab === 'matrix' ? matrixHtml() : `
        <div class="hangul-layout">
          <div class="hangul-main">
            ${groupTableHtml(ui.tab)}
          </div>
          <aside class="hangul-side">
            <div id="hangulDetail" class="card hangul-detail">${detailHtml(ui.sel)}</div>
            <div class="card hangul-quiz-box">
              <h3>🎯 四十音互動測驗</h3>
              <p class="muted small">答對自動升級熟練度（黃 → 藍 → 綠），答錯自動排入明日複習。</p>
              <div class="kq-opts">
                <label class="field-inline">範圍
                  <select id="kqGroup">
                    <option value="all" ${ui.qGroup === 'all' ? 'selected' : ''}>全部四十音＋收音</option>
                    <option value="bvowel" ${ui.qGroup === 'bvowel' ? 'selected' : ''}>基本母音（10）</option>
                    <option value="cvowel" ${ui.qGroup === 'cvowel' ? 'selected' : ''}>複合母音（11）</option>
                    <option value="bcons" ${ui.qGroup === 'bcons' ? 'selected' : ''}>基本子音（14）</option>
                    <option value="dcons" ${ui.qGroup === 'dcons' ? 'selected' : ''}>雙子音（5）</option>
                    <option value="batchim" ${ui.qGroup === 'batchim' ? 'selected' : ''}>收音 받침（12）</option>
                  </select>
                </label>
                <label class="field-inline">題數
                  <select id="kqCount">
                    ${[10, 15, 25].map((n) => `<option value="${n}" ${ui.qCount === n ? 'selected' : ''}>${n} 題</option>`).join('')}
                  </select>
                </label>
              </div>
              <div class="kq-types">
                <button class="kq-type" data-quiz="pick">
                  <span>👀 <b>看韓文字選讀音</b></span>
                  <small>四選一・快速建立字形與發音反射</small>
                </button>
                <button class="kq-type" data-quiz="listen">
                  <span>👂 <b>聽發音選韓文字</b></span>
                  <small>純聽力辨音（平音／激音／緊音對比）</small>
                </button>
                <button class="kq-type" data-quiz="type">
                  <span>⌨️ <b>看字輸入羅馬拼音</b></span>
                  <small>零提示主動回想・最紮實</small>
                </button>
              </div>
            </div>
          </aside>
        </div>`}
    `;

    qsa('[data-tab]', el).forEach((b) =>
      b.addEventListener('click', () => {
        ui.tab = b.dataset.tab;
        const firstRow = KO.HANGUL.rows.find((r) => r.group === ui.tab);
        if (firstRow && firstRow.items[0]) ui.sel = firstRow.items[0].ch;
        KO.renderHangul(el);
      })
    );

    qsa('.kc[data-ch]', el).forEach((cell) =>
      cell.addEventListener('click', () => {
        const ch = cell.dataset.ch;
        ui.sel = ch;
        touchSeen(ch);
        sayHangul(ch, false, cell);
        qsa('.kc.sel', el).forEach((x) => x.classList.remove('sel'));
        cell.classList.add('sel');
        const lv = hRec(ch).level;
        cell.classList.remove('lv-0', 'lv-seen', 'lv-fam', 'lv-mas');
        cell.classList.add(lvClass(lv));
        const box = qs('#hangulDetail', el);
        if (box) { box.innerHTML = detailHtml(ch); bindDetail(box); }
        if (window.matchMedia('(max-width: 960px)').matches) openMobileDetail(ch);
      })
    );

    qsa('[data-play-row]', el).forEach((b) =>
      b.addEventListener('click', () => {
        const row = KO.HANGUL.rows.find((r) => r.id === b.dataset.playRow);
        if (!row) return;
        const list = row.items;
        KO.tts.speakSeq(
          list.map((it) => it.say),
          (_, idx) => ({
            rate: 0.88,
            btn: qs(`.kc[data-ch="${CSS.escape(list[idx].ch)}"]`, el),
          })
        );
      })
    );

    // 가나다 拼字表點擊
    qsa('.hm-cell[data-syl]', el).forEach((cell) =>
      cell.addEventListener('click', () => {
        const { cho, jung, syl, ro } = cell.dataset;
        ui.matrixInfo = { cho, jung, syl, ro };
        KO.tts.speak(syl, { rate: 0.9, btn: cell });
        const banner = qs('#hmBanner', el);
        if (banner) {
          banner.innerHTML = `
            <div>
              <span class="muted small">目前拼字拆解：</span>
              <b>子音 ${esc(cho)} ＋ 母音 ${esc(jung)} ＝ ${esc(syl)}</b>
              <span class="ro">(${esc(ro)})</span>
            </div>
            <div style="display:flex;gap:6px">
              <button class="btn sm" data-hm-say="${esc(syl)}">🔊 正常發音</button>
              <button class="btn sm ghost" data-hm-slow="${esc(syl)}">🐢 慢速</button>
            </div>`;
          bindMatrixBanner(banner);
        }
      })
    );
    const hmBanner = qs('#hmBanner', el);
    if (hmBanner) bindMatrixBanner(hmBanner);

    const det = qs('#hangulDetail', el);
    if (det) bindDetail(det);

    const gSel = qs('#kqGroup', el), cSel = qs('#kqCount', el);
    if (gSel) gSel.onchange = () => { ui.qGroup = gSel.value; };
    if (cSel) cSel.onchange = () => { ui.qCount = +cSel.value; };
    qsa('[data-quiz]', el).forEach((b) =>
      b.addEventListener('click', () => { location.hash = `#/hangul/quiz/${b.dataset.quiz}`; })
    );

    // 連音規則示範點擊
    qsa('[data-rule-say]', el).forEach((b) =>
      b.addEventListener('click', () => KO.tts.speak(b.dataset.ruleSay, { rate: 0.88, btn: b }))
    );
  };

  function bindMatrixBanner(banner) {
    const s1 = qs('[data-hm-say]', banner);
    const s2 = qs('[data-hm-slow]', banner);
    if (s1) s1.onclick = () => KO.tts.speak(s1.dataset.hmSay, { rate: 0.9, btn: s1 });
    if (s2) s2.onclick = () => KO.tts.speak(s2.dataset.hmSlow, { rate: 0.65, btn: s2 });
  }

  function lvClass(lv) {
    return lv >= 3 ? 'lv-mas' : lv === 2 ? 'lv-fam' : lv === 1 ? 'lv-seen' : 'lv-0';
  }

  function groupTableHtml(group) {
    const rows = KO.HANGUL.rows.filter((r) => r.group === group);
    return `
      <div class="card ktable">
        ${rows.map((r) => `
          <div class="kt-sec">
            <div class="kt-sec-hd">
              <div>
                <b>${esc(r.title)}</b>
                <span class="chip">${esc(r.label)}</span>
              </div>
              <div style="display:flex;gap:6px">
                <button class="btn sm ghost" data-play-row="${esc(r.id)}">🔊 整組連播</button>
                <a class="btn sm" href="#/hangul/row/${esc(r.id)}">逐字帶讀 →</a>
              </div>
            </div>
            <p class="kt-sec-desc">${esc(r.desc)}</p>
            <div class="kt-grid">
              ${r.items.map((it) => {
                const lv = ((KO.state.hangul || {})[it.ch]?.level) || 0;
                const disp = displaySymbol(it.ch);
                return `
                  <button class="kc ${lvClass(lv)} ${ui.sel === it.ch ? 'sel' : ''}" data-ch="${esc(it.ch)}" title="點擊聽「${esc(it.say)}」(${esc(it.r)})">
                    <b class="ko-txt">${esc(disp)}</b>
                    <small>${esc(it.r)}</small>
                    <em>示範：${esc(it.say)}</em>
                  </button>`;
              }).join('')}
            </div>
          </div>`).join('')}
        <div class="kt-legend">
          <span><i class="lg-dot"></i>未學</span>
          <span><i class="lg-dot seen"></i>看過</span>
          <span><i class="lg-dot fam"></i>熟悉</span>
          <span><i class="lg-dot mas"></i>已熟記</span>
          <span class="muted">💡 點任一字母聽示範音節・整組連播可跟讀節奏</span>
        </div>
      </div>`;
  }

  function matrixHtml() {
    const { combineCons, combineCols } = KO.HANGUL;
    const m = ui.matrixInfo;
    return `
      <div class="card">
        <h2>🧩 가나다 子母音拼字表（19 個子音 × 10 個基本母音 ＝ 190 音節）</h2>
        <p class="muted">韓文就像積木一樣，把左側的<strong>初聲子音</strong>加上上方的<strong>基本母音</strong>就能拼出音節！點任一格立刻聽標準韓語發音。</p>
        <div id="hmBanner" class="hm-banner">
          <div>
            <span class="muted small">目前拼字拆解：</span>
            <b>子音 ${esc(m.cho)} ＋ 母音 ${esc(m.jung)} ＝ ${esc(m.syl)}</b>
            <span class="ro">(${esc(m.ro)})</span>
          </div>
          <div style="display:flex;gap:6px">
            <button class="btn sm" data-hm-say="${esc(m.syl)}">🔊 正常發音</button>
            <button class="btn sm ghost" data-hm-slow="${esc(m.syl)}">🐢 慢速</button>
          </div>
        </div>
        <div class="hmatrix-wrap">
          <table class="hmatrix">
            <thead>
              <tr>
                <th>子音 ＼ 母音</th>
                ${combineCols.map((v) => `<th>${esc(v)}<small>${esc(KO.ko.hangulToRomaji(KO.ko.compose('ㅇ', v, '')))}</small></th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${combineCons.map((c) => `
                <tr>
                  <th>${esc(c.ch)} <small>${esc(c.r)} · ${esc(c.kind)}</small></th>
                  ${combineCols.map((v) => {
                    const syl = KO.ko.compose(c.ch, v, '');
                    const ro = KO.ko.hangulToRomaji(syl);
                    return `<td>
                      <button type="button" class="hm-cell" data-cho="${esc(c.ch)}" data-jung="${esc(v)}" data-syl="${esc(syl)}" data-ro="${esc(ro)}">
                        <b>${esc(syl)}</b>
                        <small>${esc(ro)}</small>
                      </button>
                    </td>`;
                  }).join('')}
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  }

  function detailHtml(ch) {
    ensureIndex();
    const it = itemByCh.get(ch) || { ch, r: '', say: ch, name: ch };
    const info = (KO.HANGUL.info && KO.HANGUL.info[ch]) || {};
    const rec = (KO.state.hangul || {})[ch] || { level: 0, seen: 0, correct: 0 };
    const lvNames = ['未學', '看過', '熟悉', '已熟記 ✓'];
    const exSurface = info.ex ? KO.surface(info.ex) : '';
    const exPron = info.ex ? KO.reading(info.ex) : '';
    return `
      <div class="kd-top">
        <div class="kd-ch ko-txt">${esc(displaySymbol(ch))}</div>
        <div class="kd-meta">
          <div class="kd-ro">${esc(it.r)} <span class="chip">示範音：${esc(it.say)}</span></div>
          <div class="kd-pair">
            <span>字母名稱：<b class="ko-txt">${esc(it.name)}</b></span>
            <button class="btn sm ghost" data-kd-name="${esc(it.name)}" title="聽韓文字母名稱">🔊 名稱</button>
          </div>
          <div class="kd-acts">
            <button class="btn sm primary" data-kd-say="${esc(ch)}">🔊 發音 (${esc(it.say)})</button>
            <button class="btn sm" data-kd-slow="${esc(ch)}">🐢 慢速</button>
          </div>
        </div>
      </div>
      ${info.src ? `<div class="kd-src">💡 <b>造字與發音記憶：</b>${esc(info.src)}</div>` : ''}
      ${info.note ? `<div class="kd-note">🎯 <b>發音小撇步：</b>${esc(info.note)}</div>` : ''}
      ${info.ex ? `
        <div class="kd-ex">
          <div>
            <div class="kd-ex-w ko-txt">
              ${KO.koHtml(info.ex)}
              ${info.hanja ? `<span class="hanja">漢字：${esc(info.hanja)}</span>` : ''}
            </div>
            <div class="ro">${esc(KO.romaji(info.ex))}${exPron !== exSurface ? ` · 實際讀音 [${esc(exPron)}]` : ''}</div>
            <div class="small muted">${esc(info.zh || '')}</div>
          </div>
          <button class="btn sm" data-kd-ex="${esc(exSurface)}">🔊 唸單字</button>
        </div>` : ''}
      <div class="kd-foot">
        <span class="chip ${rec.level >= 3 ? 'ok' : ''}">${lvNames[rec.level || 0]}</span>
        <span class="muted small">練習 ${rec.seen || 0} 次・答對 ${rec.correct || 0} 次</span>
      </div>
    `;
  }

  function bindDetail(box) {
    const say = qs('[data-kd-say]', box);
    const slow = qs('[data-kd-slow]', box);
    const nm = qs('[data-kd-name]', box);
    const ex = qs('[data-kd-ex]', box);
    if (say) say.onclick = () => sayHangul(say.dataset.kdSay, false, say);
    if (slow) slow.onclick = () => sayHangul(slow.dataset.kdSlow, true, slow);
    if (nm) nm.onclick = () => KO.tts.speak(nm.dataset.kdName, { rate: 0.88, btn: nm });
    if (ex) ex.onclick = () => KO.tts.speak(ex.dataset.kdEx, { rate: 0.9, btn: ex });
  }

  function openMobileDetail(ch) {
    const root = document.getElementById('popoverRoot');
    root.innerHTML = `
      <div class="modal-backdrop" id="kdBg">
        <div class="modal hangul-sheet">
          <div class="modal-hd"><h3>字母發音與造字記憶</h3><button class="icon-btn" id="kdX">✕</button></div>
          <div class="modal-bd">${detailHtml(ch)}</div>
        </div>
      </div>`;
    bindDetail(root);
    qs('#kdX', root).onclick = () => { root.innerHTML = ''; };
    qs('#kdBg', root).onclick = (e) => { if (e.target.id === 'kdBg') root.innerHTML = ''; };
  }

  function rulesHtml() {
    return `
      <div class="knotes">
        ${KO.HANGUL.rules.map((n) => `
          <div class="card knote">
            <h3>${esc(n.title)}</h3>
            <p>${esc(n.desc)}</p>
            <div class="knote-ex">
              ${n.examples.map((e) => `
                <button class="kn-ex" data-rule-say="${esc(e.ko)}">
                  <span class="ko-txt">${esc(e.ko)}</span>
                  <small>實際讀音：[${esc(e.pron)}] · ${esc(KO.ko.hangulToRomaji(e.pron))}</small>
                  <em>${esc(e.zh)}</em>
                  <i>🔊</i>
                </button>`).join('')}
            </div>
          </div>`).join('')}
      </div>`;
  }

  // -------------------- 逐組引導學習（先看聽跟唸 → 立刻組內小測驗） --------------------
  function renderRowStudy(el, rowId) {
    const rows = KO.HANGUL.rows;
    const rIdx = Math.max(0, rows.findIndex((r) => r.id === rowId));
    const row = rows[rIdx] || rows[0];
    const nextRow = rows[rIdx + 1] || null;
    let step = 0;

    function drawCard() {
      const it = row.items[step];
      const info = KO.HANGUL.info[it.ch] || {};
      touchSeen(it.ch);
      el.innerHTML = `
        <div class="lesson-head">
          <div class="lh-crumb">
            <a href="#/hangul" class="btn ghost sm">← 四十音表</a>
            <span class="chip">${esc(row.title)}</span>
            <span class="muted small">第 ${step + 1} / ${row.items.length} 個</span>
          </div>
        </div>
        <div class="card krow-card">
          <div class="kr-dots">
            ${row.items.map((x, i) => `<button class="kr-dot ${i === step ? 'cur' : i < step ? 'done' : ''}" data-step="${i}">${esc(displaySymbol(x.ch))}</button>`).join('')}
          </div>
          <div class="kr-big ko-txt" id="krBig" title="點擊聽發音">${esc(displaySymbol(it.ch))}</div>
          <div class="kr-ro">${esc(it.r)} <span class="chip">示範音：${esc(it.say)}</span></div>
          <div class="kr-acts">
            <button class="btn primary" id="krSay">🔊 聽發音 (${esc(it.say)})</button>
            <button class="btn" id="krSlow">🐢 慢速</button>
            <button class="btn ghost" id="krName">🔊 字母名稱：${esc(it.name)}</button>
          </div>
          ${info.src ? `<div class="kr-src">💡 ${esc(info.src)}</div>` : ''}
          ${info.note ? `<div class="kd-note" style="max-width:560px;margin:8px auto">🎯 ${esc(info.note)}</div>` : ''}
          ${info.ex ? `
            <div class="kd-ex" style="max-width:440px;margin:10px auto">
              <div style="text-align:left">
                <div class="kd-ex-w ko-txt">${KO.koHtml(info.ex)} ${info.hanja ? `<span class="hanja">漢字：${esc(info.hanja)}</span>` : ''}</div>
                <div class="ro">${esc(KO.romaji(info.ex))}</div>
                <div class="small muted">${esc(info.zh || '')}</div>
              </div>
              <button class="btn sm" id="krEx">🔊 唸單字</button>
            </div>` : ''}
          <div class="sh-nav">
            <button class="btn" id="krPrev" ${step === 0 ? 'disabled' : ''}>← 上一個</button>
            ${step < row.items.length - 1
              ? `<button class="btn primary" id="krNext">跟著唸過了，下一個 →</button>`
              : `<button class="btn primary" id="krQuiz">開始本組小測驗（${row.items.length * 2} 題）→</button>`}
          </div>
        </div>`;

      setTimeout(() => sayHangul(it, false, qs('#krSay', el)), 80);
      qs('#krBig', el).onclick = () => sayHangul(it, false);
      qs('#krSay', el).onclick = (e) => sayHangul(it, false, e.currentTarget);
      qs('#krSlow', el).onclick = (e) => sayHangul(it, true, e.currentTarget);
      qs('#krName', el).onclick = (e) => KO.tts.speak(it.name, { rate: 0.88, btn: e.currentTarget });
      const exBtn = qs('#krEx', el);
      if (exBtn) exBtn.onclick = () => KO.tts.speak(KO.surface(info.ex), { rate: 0.9, btn: exBtn });
      qsa('[data-step]', el).forEach((b) => b.onclick = () => { step = +b.dataset.step; drawCard(); });
      const p = qs('#krPrev', el); if (p) p.onclick = () => { step--; drawCard(); };
      const n = qs('#krNext', el); if (n) n.onclick = () => { step++; drawCard(); };
      const q = qs('#krQuiz', el);
      if (q) q.onclick = () => runQuizSession(el, {
        title: `${row.label} 組小測驗`,
        pool: row.items.map((x) => ({ ...x, group: row.group, rowId: row.id })),
        distractors: allItems(row.group),
        count: row.items.length * 2,
        mode: 'mix',
        nextHref: nextRow ? `#/hangul/row/${nextRow.id}` : '#/hangul',
        nextLabel: nextRow ? `下一組：${nextRow.label} →` : '回到四十音總表',
      });
    }
    drawCard();
  }

  // -------------------- 四十音測驗（看字選音 / 聽音選字 / 打羅馬拼音 / 到期複習） --------------------
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
