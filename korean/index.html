    qs('#lvX', root).onclick = close;
    qs('#lvBg', root).onclick = (e) => { if (e.target.id === 'lvBg') close(); };
    qsa('[data-lv]', root).forEach((b) =>
      b.addEventListener('click', () => {
        const v = b.dataset.lv;
        KO.state.settings.onboarded = true;
        if (v === 'HANGUL') {
          KO.state.meta.recLevel = 'A1';
          KO.save();
          root.innerHTML = '';
          location.hash = '#/hangul/row/bv1';
          return;
        }
        KO.state.meta.recLevel = v;
        const first = KO.allLessons().find((l) => l.level === v);
        if (first) KO.state.meta.lastLessonId = first.id;
        KO.save();
        root.innerHTML = '';
        KO.renderHome(el);
      })
    );
  }
})();

</script>
<script>/* /js/library.js */
/* 課程庫：CEFR A1–C2（TOPIK 1–6級）篩選、情境主題、關鍵字搜尋、AI 即時生成新韓語對話課程 */
(function () {
  'use strict';
  const KO = (window.KO = window.KO || {});
  const { esc, qs, qsa } = KO;

  let filter = { level: 'ALL', topic: 'ALL', q: '', status: 'ALL' };

  KO.renderLibrary = function (el, queryString) {
    if (queryString) {
      const p = new URLSearchParams(queryString);
      if (p.get('level')) filter.level = p.get('level').toUpperCase();
    }
    draw(el);
  };

  function draw(el) {
    const all = KO.allLessons();
    const topics = Array.from(new Set(all.map((l) => l.topic).filter(Boolean)));
    const q = filter.q.trim().toLowerCase();

    const list = all.filter((l) => {
      if (filter.level !== 'ALL' && l.level !== filter.level) return false;
      if (filter.topic !== 'ALL' && l.topic !== filter.topic) return false;
      const done = !!KO.state.lessons[l.id]?.completed;
      if (filter.status === 'TODO' && done) return false;
      if (filter.status === 'DONE' && !done) return false;
      if (q) {
        const hay = `${KO.surface(l.title)} ${KO.reading(l.title)} ${KO.romaji(l.title)} ${l.title_zh || ''} ${l.scene || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    el.innerHTML = `
      <div class="page-head">
        <div>
          <h1>📚 韓語對話課程庫</h1>
          <p>共 ${all.length} 堂情境會話課（A1 入門 → C2 精通，完整對應 TOPIK I 1級 ～ TOPIK II 6級），每課皆附連音標示、口說跟讀、聽寫與理解測驗。</p>
        </div>
        <div class="page-acts">
          ${KO.isStatic() ? '' : '<button class="btn primary" id="btnGenLesson">✨ AI 依主題生成新課</button>'}
          <button class="btn" id="btnManualLesson">＋ 自訂教材</button>
        </div>
      </div>

      <div class="filter-bar card">
        <div class="lib-levels" role="tablist" aria-label="程度篩選">
          <button class="lib-lv ${filter.level === 'ALL' ? 'active' : ''}" data-lv="ALL">
            <b>全部</b><span>${all.length} 課</span>
          </button>
          ${KO.LEVELS.map((lv) => {
            const cnt = all.filter((l) => l.level === lv.code).length;
            return `<button class="lib-lv ${filter.level === lv.code ? 'active' : ''}" data-lv="${lv.code}" style="--lv:${lv.color}">
              <b>${lv.code} · ${esc(lv.topik)}</b><span>${esc(lv.name)}</span><em>${cnt} 課</em>
            </button>`;
          }).join('')}
        </div>

        <div class="filter-row">
          <input type="search" id="libQ" class="search-in" placeholder="搜尋韓文標題、羅馬拼音、中文情境…" value="${esc(filter.q)}">
          <div class="seg" id="statusSeg">
            ${[['ALL', '全部'], ['TODO', '未完成'], ['DONE', '已完成']].map(([k, lbl]) =>
              `<button data-st="${k}" class="${filter.status === k ? 'active' : ''}">${lbl}</button>`
            ).join('')}
          </div>
        </div>

        <div class="topic-pills">
          <button class="pill ${filter.topic === 'ALL' ? 'active' : ''}" data-tp="ALL">全部主題</button>
          ${topics.map((t) => `<button class="pill ${filter.topic === t ? 'active' : ''}" data-tp="${esc(t)}">${esc(KO.topicLabel(t))}</button>`).join('')}
        </div>
      </div>

      ${list.length ? `
        <div class="lesson-grid">
          ${list.map(lessonCard).join('')}
        </div>
      ` : `
        <div class="card center">
          <p class="muted">沒有符合篩選條件的課程。</p>
          <button class="btn" id="libReset">清除篩選條件</button>
        </div>
      `}
    `;

    qsa('[data-lv]', el).forEach((b) => b.onclick = () => { filter.level = b.dataset.lv; draw(el); });
    qsa('[data-tp]', el).forEach((b) => b.onclick = () => { filter.topic = b.dataset.tp; draw(el); });
    qsa('#statusSeg button', el).forEach((b) => b.onclick = () => { filter.status = b.dataset.st; draw(el); });
    const qIn = qs('#libQ', el);
    qIn.oninput = () => { filter.q = qIn.value; draw(el); qs('#libQ', el).focus(); qs('#libQ', el).setSelectionRange(filter.q.length, filter.q.length); };
    const rs = qs('#libReset', el);
    if (rs) rs.onclick = () => { filter = { level: 'ALL', topic: 'ALL', q: '', status: 'ALL' }; draw(el); };

    const genBtn = qs('#btnGenLesson', el);
    if (genBtn) genBtn.onclick = () => openAiModal(el);
    qs('#btnManualLesson', el).onclick = () => openManualModal(el);
  }

  function lessonCard(l) {
    const p = KO.state.lessons[l.id] || {};
    const shCnt = Object.keys(p.shadowed || {}).length;
    return `
      <a class="lcard ${p.completed ? 'done' : ''}" href="#/lesson/${esc(l.id)}">
        <div class="lc-top">
          ${KO.levelBadge(l.level)}
          ${KO.topikChip(l.level)}
          <span class="lc-topic">${esc(KO.topicLabel(l.topic))}</span>
          ${l.custom ? '<span class="chip ai">自訂</span>' : ''}
          ${p.completed ? '<span class="lc-done">✓ 完成</span>' : ''}
        </div>
        <h3 class="lc-title ko-txt">${KO.koHtml(l.title)}</h3>
        <div class="lc-zh">${esc(l.title_zh || '')}</div>
        <p class="lc-scene">${esc(l.scene || '')}</p>
        <div class="lc-foot">
          <span>💬 ${(l.lines || []).length} 句</span>
          <span>💡 ${(l.vocab || []).length} 詞</span>
          ${shCnt ? `<span>🎙️ 跟讀 ${shCnt}</span>` : ''}
          ${p.quizBest != null ? `<span>📝 ${p.quizBest}%</span>` : ''}
        </div>
      </a>`;
  }

  function openAiModal(el) {
    const root = document.getElementById('popoverRoot');
    root.innerHTML = `
      <div class="modal-backdrop" id="aiBg">
        <div class="modal" role="dialog" aria-label="AI 生成新韓語課程">
          <div class="modal-hd">
            <h3>✨ AI 量身生成韓語對話課</h3>
            <button class="icon-btn" id="aiX">✕</button>
          </div>
          <div class="modal-bd">
            <label>程度（CEFR / TOPIK）
              <select id="aiLv">
                ${KO.LEVELS.map((l) => `<option value="${l.code}" ${l.code === (filter.level !== 'ALL' ? filter.level : KO.state.meta.recLevel) ? 'selected' : ''}>${l.code} · ${esc(l.topik)} — ${esc(l.name)}</option>`).join('')}
              </select>
            </label>
            <label>想練習的情境或主題
              <input id="aiTopic" type="text" placeholder="例：在聖水洞快閃店排隊、跟韓國同事討論專案排程、看牙醫…">
            </label>
            <div id="aiMsg" class="small muted">系統會透過本機 Jetski 服務生成雙人韓語對話、單字（含漢字詞源）、核心文法與聽力測驗（約 15–35 秒）。</div>
          </div>
          <div class="modal-ft">
            <button class="btn" id="aiCancel">取消</button>
            <button class="btn primary" id="aiGo">開始生成</button>
          </div>
        </div>
      </div>`;
    const close = () => { root.innerHTML = ''; };
    qs('#aiX', root).onclick = close;
    qs('#aiCancel', root).onclick = close;
    qs('#aiGo', root).onclick = async () => {
      const topic = qs('#aiTopic', root).value.trim();
      const level = qs('#aiLv', root).value;
      if (!topic) { KO.toast('請輸入想練習的情境主題'); return; }
      const goBtn = qs('#aiGo', root);
      goBtn.disabled = true;
      goBtn.innerHTML = '<span class="spin"></span> 生成中…';
      qs('#aiMsg', root).textContent = '正在撰寫韓語對話、重點單字、文法與理解測驗，請稍候…';
      try {
        const r = await fetch('/api/ai/lesson', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ level, topic }),
        });
        const data = await r.json();
        if (!data.ok) throw new Error(data.error || '生成失敗');
        KO.CUSTOM_LESSONS.push(data.lesson);
        KO.indexLessons();
        close();
        KO.toast('新韓語課程已建立！');
        location.hash = `#/lesson/${data.lesson.id}`;
      } catch (e) {
        goBtn.disabled = false;
        goBtn.textContent = '重試生成';
        qs('#aiMsg', root).textContent = `⚠️ ${e.message}（若未啟動 Jetski，可使用「＋ 自訂教材」直接貼上對話）`;
      }
    };
  }

  function openManualModal(el) {
    const root = document.getElementById('popoverRoot');
    root.innerHTML = `
      <div class="modal-backdrop" id="mnBg">
        <div class="modal" role="dialog" aria-label="自訂韓語課程">
          <div class="modal-hd">
            <h3>＋ 新增自訂韓語對話教材</h3>
            <button class="icon-btn" id="mnX">✕</button>
          </div>
          <div class="modal-bd">
            <div style="display:grid;grid-template-columns:1fr 2fr;gap:10px">
              <label>程度
                <select id="mnLv">${KO.LEVELS.map((l) => `<option value="${l.code}">${l.code} (${esc(l.topik)})</option>`).join('')}</select>
              </label>
              <label>課程標題（韓文）
                <input id="mnTitle" type="text" placeholder="例：카페에서 주문하기">
              </label>
            </div>
            <label>中文標題（選填）
              <input id="mnZh" type="text" placeholder="例：在咖啡廳點餐">
            </label>
            <label>對話內容（每行一句，格式：<code>角色: 韓文句子 | 中文翻譯</code>，系統會自動推導韓語連音與羅馬拼音！）
              <textarea id="mnLines" rows="7" placeholder="점원: 어서 오세요. 주문하시겠어요? | 歡迎光臨，請問要點餐嗎？&#10;손님: 아이스 아메리카노 한 잔 주세요. | 請給我一杯冰美式咖啡。"></textarea>
            </label>
          </div>
          <div class="modal-ft">
            <button class="btn" id="mnCancel">取消</button>
            <button class="btn primary" id="mnSave">儲存並開始練習</button>
          </div>
        </div>
      </div>`;
    const close = () => { root.innerHTML = ''; };
    qs('#mnX', root).onclick = close;
    qs('#mnCancel', root).onclick = close;
    qs('#mnSave', root).onclick = async () => {
      const title = qs('#mnTitle', root).value.trim();
      const raw = qs('#mnLines', root).value.trim();
      const lines = raw.split(/\n+/).map((row, idx) => {
        const [left, zh = ''] = row.split('|');
        const m = left.match(/^([^:：]+)[:：]\s*(.+)$/);
        return m
          ? { sp: m[1].trim(), ko: m[2].trim(), zh: zh.trim() }
          : { sp: idx % 2 === 0 ? 'A' : 'B', ko: left.trim(), zh: zh.trim() };
      }).filter((x) => x.ko);
      if (!title || lines.length < 2) { KO.toast('請填寫標題並至少輸入兩句韓文對話'); return; }
      const lesson = {
        id: 'custom-' + Date.now().toString(36),
        custom: true,
        level: qs('#mnLv', root).value,
        topic: 'daily',
        title,
        title_zh: qs('#mnZh', root).value.trim() || title,
        scene: '自訂練習教材',
        lines,
        vocab: [],
        grammar: [],
        quiz: [],
      };
      if (!KO.isStatic()) {
        try {
          await fetch('/api/custom_lessons', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(lesson),
          });
        } catch {}
      }
      KO.CUSTOM_LESSONS.push(lesson);
      KO.indexLessons();
      close();
      location.hash = `#/lesson/${lesson.id}`;
    };
  }
})();

</script>
<script>/* /js/words.js */
/* 分級單字庫（A1–C2 / TOPIK 1–6級）＋ 每日新單字引導學習（卡片認識 → 即時小測驗 → 加入單字本） */
(function () {
  'use strict';
  const KO = (window.KO = window.KO || {});
  const { esc, qs, qsa } = KO;

  let flt = { level: 'A1', topic: 'ALL', status: 'ALL', q: '', limit: 60 };

  KO.renderWords = function (el, sub) {
    if (sub === 'today') return renderTodaySession(el);
    draw(el);
  };

  function levelCounts() {
    const out = {};
    for (const lv of KO.LEVELS) {
      const list = KO.wordsByLevel[lv.code] || [];
      let seen = 0, saved = 0;
      for (const w of list) {
        if (KO.state.words[w.key]) seen++;
        if (KO.hasVocab(w.w)) saved++;
      }
      out[lv.code] = { total: list.length, seen, saved };
    }
    return out;
  }

  function draw(el) {
    const counts = levelCounts();
    const totalAll = KO.wordBank.length;
    const savedAll = KO.vocabList().length;
    const dailyN = KO.state.settings.dailyNewWords || 10;

    const pool = flt.level === 'ALL' ? KO.wordBank : (KO.wordsByLevel[flt.level] || []);
    const topics = Array.from(new Set(pool.map((w) => w.t).filter(Boolean)));
    const q = flt.q.trim().toLowerCase();

    const filtered = pool.filter((w) => {
      if (flt.topic !== 'ALL' && w.t !== flt.topic) return false;
      const inVocab = KO.hasVocab(w.w);
      const isSeen = !!KO.state.words[w.key] || inVocab;
      if (flt.status === 'NEW' && isSeen) return false;
      if (flt.status === 'SAVED' && !inVocab) return false;
      if (q) {
        const hay = `${w.w} ${KO.reading(w.ko)} ${KO.romaji(w.ko)} ${w.hanja || ''} ${w.zh} ${w.pos}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    const shown = filtered.slice(0, flt.limit);

    el.innerHTML = `
      <div class="page-head">
        <div>
          <h1>🔤 韓語分級單字庫（A1–C2）</h1>
          <p>共收錄 <b>${totalAll}</b> 個核心韓語詞彙，標註實際連音讀音、羅馬拼音、對應繁體漢字詞源與生活例句（已加入單字本 <b>${savedAll}</b> 詞）。</p>
        </div>
        <div class="page-acts">
          <a class="btn primary" href="#/words/today">✨ 今日新單字（${dailyN} 詞）</a>
          <button class="btn" id="btnBatchAdd">＋ 將本級未收錄前 ${dailyN} 詞加入單字本</button>
        </div>
      </div>

      <div class="filter-bar card">
        <div class="lib-levels words-levels" role="tablist">
          <button class="lib-lv ${flt.level === 'ALL' ? 'active' : ''}" data-lv="ALL">
            <b>全部</b><span>${totalAll} 詞</span>
          </button>
          ${KO.LEVELS.map((lv) => {
            const c = counts[lv.code];
            const pct = c.total ? Math.round((c.seen / c.total) * 100) : 0;
            return `<button class="lib-lv ${flt.level === lv.code ? 'active' : ''}" data-lv="${lv.code}" style="--lv:${lv.color}">
              <b>${lv.code} · ${esc(lv.topik)}</b>
              <span>${c.total} 詞・已學 ${c.seen}</span>
              <i class="lv-mini"><i style="width:${pct}%"></i></i>
            </button>`;
          }).join('')}
        </div>

        <div class="filter-row">
          <input type="search" id="wQ" class="search-in" placeholder="搜尋韓文、漢字詞源、羅馬拼音或中文意思…" value="${esc(flt.q)}">
          <div class="seg" id="wStSeg">
            ${[['ALL', '全部'], ['NEW', '未學新詞'], ['SAVED', '已在單字本']].map(([k, lbl]) =>
              `<button data-st="${k}" class="${flt.status === k ? 'active' : ''}">${lbl}</button>`
            ).join('')}
          </div>
        </div>

        <div class="topic-pills">
          <button class="pill ${flt.topic === 'ALL' ? 'active' : ''}" data-tp="ALL">全部主題 (${pool.length})</button>
          ${topics.map((t) => `<button class="pill ${flt.topic === t ? 'active' : ''}" data-tp="${esc(t)}">${esc(KO.topicLabel(t))}</button>`).join('')}
        </div>
      </div>

      <div class="muted small" style="margin:0 2px 10px">符合條件共 <b>${filtered.length}</b> 詞${filtered.length > shown.length ? `（顯示前 ${shown.length} 筆）` : ''}</div>

      <div class="word-list">
        ${shown.map(wordRow).join('')}
      </div>

      ${filtered.length > shown.length ? `
        <div class="more-row">
          <button class="btn" id="wMore">載入更多（剩餘 ${filtered.length - shown.length} 詞）</button>
        </div>` : ''}
    `;

    qsa('[data-lv]', el).forEach((b) => b.onclick = () => { flt.level = b.dataset.lv; flt.topic = 'ALL'; flt.limit = 60; draw(el); });
    qsa('[data-tp]', el).forEach((b) => b.onclick = () => { flt.topic = b.dataset.tp; flt.limit = 60; draw(el); });
    qsa('#wStSeg button', el).forEach((b) => b.onclick = () => { flt.status = b.dataset.st; flt.limit = 60; draw(el); });
    const qIn = qs('#wQ', el);
    qIn.oninput = () => { flt.q = qIn.value; flt.limit = 60; draw(el); qs('#wQ', el).focus(); qs('#wQ', el).setSelectionRange(flt.q.length, flt.q.length); };
    const more = qs('#wMore', el);
    if (more) more.onclick = () => { flt.limit += 80; draw(el); };

    qs('#btnBatchAdd', el).onclick = () => {
      const target = (flt.level === 'ALL' ? KO.wordBank : (KO.wordsByLevel[flt.level] || []))
        .filter((w) => !KO.hasVocab(w.w))
        .slice(0, dailyN);
      if (!target.length) { KO.toast('此等級單字已全部在單字本中！'); return; }
      target.forEach((w) => KO.addVocab(w));
      KO.toast(`已將 ${target.length} 個單字加入單字本，可前往「複習」練習`);
      draw(el);
    };

    qsa('[data-wsay]', el).forEach((b) =>
      b.onclick = () => KO.tts.speak(b.dataset.wsay, { rate: 0.9, btn: b })
    );
    qsa('[data-wslow]', el).forEach((b) =>
      b.onclick = () => KO.tts.speak(b.dataset.wslow, { rate: 0.65, btn: b })
    );
    qsa('[data-exsay]', el).forEach((b) =>
      b.onclick = () => KO.tts.speak(b.dataset.exsay, { rate: 0.92, btn: b })
    );
    qsa('[data-wsave]', el).forEach((b) =>
      b.onclick = () => {
        const w = KO.vocabIndex.get(b.dataset.wsave);
        if (!w) return;
        if (KO.hasVocab(w.w)) {
          KO.removeVocab(w.w);
          b.textContent = '＋ 單字本';
          b.classList.add('primary');
        } else {
          KO.addVocab(w);
          b.textContent = '✓ 已收錄';
          b.classList.remove('primary');
          KO.toast(`已加入單字本：${w.w}`);
        }
      }
    );
  }

  function wordRow(w) {
    const saved = KO.hasVocab(w.w);
    const exPlain = KO.surface(w.ex || '');
    const pron = KO.reading(w.ko || w.w);
    return `
      <div class="wrow ${saved ? 'saved' : ''}">
        <div class="wr-main">
          <div class="wr-head">
            ${KO.levelBadge(w.level)}
            <b class="wr-w ko-txt">${KO.koHtml(w.ko || w.w)}</b>
            ${w.hanja ? `<span class="hanja" title="對應繁體漢字詞源">漢字：${esc(w.hanja)}</span>` : ''}
            <span class="ro">${esc(KO.romaji(w.ko || w.w))}${pron !== w.w ? ` [${esc(pron)}]` : ''}</span>
            ${w.pos ? `<span class="chip">${esc(w.pos)}</span>` : ''}
            <button class="icon-btn" data-wsay="${esc(w.w)}" title="韓語發音">🔊</button>
            <button class="icon-btn" data-wslow="${esc(w.w)}" title="慢速發音">🐢</button>
          </div>
          <div class="wr-zh">${esc(w.zh)}</div>
          ${w.ex ? `
            <div class="wr-ex">
              <button class="icon-btn" data-exsay="${esc(exPlain)}" title="播放例句">🔊</button>
              <div>
                <div class="ko-txt">${KO.koHtml(w.ex)}</div>
                ${w.ex_zh ? `<div class="small muted">${esc(w.ex_zh)}</div>` : ''}
              </div>
            </div>` : ''}
        </div>
        <div class="wr-acts">
          <button class="btn sm ${saved ? '' : 'primary'}" data-wsave="${esc(w.key)}">${saved ? '✓ 已收錄' : '＋ 單字本'}</button>
        </div>
      </div>`;
  }

  // ==================== 每日新單字引導學習 ====================
  function renderTodaySession(el) {
    const recLv = KO.state.meta.recLevel || 'A1';
    const n = KO.state.settings.dailyNewWords || 10;
    const lvOrder = [recLv, ...KO.LEVELS.map((l) => l.code).filter((c) => c !== recLv)];
    const batch = [];
    for (const lv of lvOrder) {
      for (const w of KO.wordsByLevel[lv] || []) {
        if (!KO.state.words[w.key] && !KO.hasVocab(w.w)) batch.push(w);
        if (batch.length >= n) break;
      }
      if (batch.length >= n) break;
    }
    if (!batch.length) {
      el.innerHTML = `
        <div class="card center">
          <div class="big-emo">🏆</div>
          <h2>所有分級單字都已經學過一輪了！</h2>
          <p class="muted">前往「複習」進行間隔記憶測驗，維持長期記憶。</p>
          <a class="btn primary" href="#/review">前往複習中心 →</a>
        </div>`;
      return;
    }

    let step = 0;
    let phase = 'learn';
    let qIdx = 0, right = 0;

    function drawLearn() {
      const w = batch[step];
      const pron = KO.reading(w.ko || w.w);
      el.innerHTML = `
        <div class="lesson-head">
          <div class="lh-crumb">
            <a href="#/words" class="btn ghost sm">← 單字庫</a>
            <span class="chip">✨ 今日新單字 ${step + 1} / ${batch.length}</span>
            ${KO.levelBadge(w.level)}
            ${KO.topikChip(w.level)}
          </div>
        </div>
        <div class="card flash">
          <div class="fl-back">
            <div class="fl-word ko-txt">${KO.koHtml(w.ko || w.w)}</div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center">
              ${w.hanja ? `<span class="hanja">漢字：${esc(w.hanja)}</span>` : ''}
              <span class="ro">${esc(KO.romaji(w.ko || w.w))}${pron !== w.w ? ` · 實際讀音 [${esc(pron)}]` : ''}</span>
            </div>
            ${w.pos ? `<span class="chip">${esc(w.pos)}</span>` : ''}
            <div style="display:flex;gap:8px">
              <button class="btn sm primary" id="tdSay">🔊 發音</button>
              <button class="btn sm" id="tdSlow">🐢 慢速</button>
            </div>
            <div class="fl-zh">${esc(w.zh)}</div>
            ${w.ex ? `<div class="fl-ex"><span class="ko-txt">${KO.koHtml(w.ex)}</span><br><span class="small muted">${esc(w.ex_zh || '')}</span></div>` : ''}
            ${w.ex ? `<button class="btn sm ghost" id="tdEx">🔊 播放例句</button>` : ''}
            <div class="fl-grades two">
              <button class="grade g1" id="tdAdd">＋ 加入單字本重點複習<small>排入 SM-2 間隔複習</small></button>
              <button class="grade g3" id="tdKnown">✓ 這個詞我已經會了<small>標記已學，跳過收錄</small></button>
            </div>
          </div>
        </div>`;

      setTimeout(() => KO.tts.speak(w.w, { rate: 0.9, btn: qs('#tdSay', el) }), 80);
      qs('#tdSay', el).onclick = (e) => KO.tts.speak(w.w, { rate: 0.9, btn: e.currentTarget });
      qs('#tdSlow', el).onclick = (e) => KO.tts.speak(w.w, { rate: 0.65, btn: e.currentTarget });
      const exB = qs('#tdEx', el);
      if (exB) exB.onclick = () => KO.tts.speak(KO.surface(w.ex), { rate: 0.92, btn: exB });

      const next = () => {
        if (step + 1 < batch.length) { step++; drawLearn(); }
        else { phase = 'quiz'; drawQuiz(); }
      };
      qs('#tdAdd', el).onclick = () => { KO.addVocab(w); next(); };
      qs('#tdKnown', el).onclick = () => { KO.markWordSeen(w.w, w.level); next(); };
    }

    function drawQuiz() {
      if (qIdx >= batch.length) return drawDone();
      const target = batch[qIdx];
      const others = KO.wordBank.filter((x) => x.key !== target.key && x.zh !== target.zh);
      const picks = [];
      while (picks.length < 3 && others.length) {
        const r = others[Math.floor(Math.random() * others.length)];
        if (!picks.includes(r)) picks.push(r);
      }
      const opts = [target, ...picks].sort(() => Math.random() - 0.5);
      let done = false;

      el.innerHTML = `
        <div class="lesson-head">
          <div class="lh-crumb">
            <span class="chip">🎯 現學現測 ${qIdx + 1} / ${batch.length}</span>
          </div>
        </div>
        <div class="card">
          <div class="rv-tag">剛學過的韓文單字，還記得意思嗎？</div>
          <div class="rv-prompt ko-txt">${KO.koHtml(target.ko || target.w)} ${target.hanja ? `<span class="hanja">漢字：${esc(target.hanja)}</span>` : ''} <button class="icon-btn" id="tqSay">🔊</button></div>
          <div class="qopts">
            ${opts.map((o, k) => `<button class="opt" data-k="${esc(o.key)}"><span class="opt-k">${k + 1}</span><span>${esc(o.zh)}</span></button>`).join('')}
          </div>
          <div id="tqFb"></div>
        </div>`;

      KO.tts.speak(target.w, { rate: 0.9 });
      qs('#tqSay', el).onclick = (e) => KO.tts.speak(target.w, { rate: 0.9, btn: e.currentTarget });
      qsa('.opt', el).forEach((b) =>
        b.onclick = () => {
          if (done) return;
          done = true;
          const ok = b.dataset.k === target.key;
          if (ok) right++;
          else if (!KO.hasVocab(target.w)) KO.addVocab(target);
          qsa('.opt', el).forEach((x) => {
            x.disabled = true;
            if (x.dataset.k === target.key) x.classList.add('right');
          });
          if (!ok) b.classList.add('wrong');
          KO.bumpDay('reviews', 1);
          qs('#tqFb', el).innerHTML = `
            <div class="rv-fb ${ok ? 'ok' : 'bad'}">
              <div class="rv-fb-hd">${ok ? '✓ 記住了！' : '✕ 已自動幫你收進單字本加強複習'}</div>
              <div class="rv-ans"><b class="ko-txt">${KO.koHtml(target.ko)}</b><span>— ${esc(target.zh)}</span></div>
              <div class="rv-next-row"><button class="btn primary" id="tqNext">${qIdx + 1 >= batch.length ? '完成今日新詞 →' : '下一題 →'}</button></div>
            </div>`;
          qs('#tqNext', el).focus();
          qs('#tqNext', el).onclick = () => { qIdx++; drawQuiz(); };
        }
      );
    }

    function drawDone() {
      el.innerHTML = `
        <div class="card center">
          <div class="big-emo">🌟</div>
          <h2>今日 ${batch.length} 個韓文新單字學習完成！</h2>
          <p class="muted">現學現測答對 <b>${right} / ${batch.length}</b> 題。已收錄的單字會在「複習」依記憶曲線提醒你複習。</p>
          <div class="td-list">
            ${batch.map((w) => `<span class="chip ko-txt">${esc(w.w)}・${esc(w.zh)}</span>`).join('')}
          </div>
          <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <a class="btn" href="#/words/today">再學一組 ${n} 詞</a>
            <a class="btn primary" href="#/home">回今日學習首頁</a>
          </div>
        </div>`;
    }

    if (phase === 'learn') drawLearn();
  }
})();

</script>
<script>/* /js/vocab.js */
/* 個人單字本：搜尋、排序（含 가나다 韓文字母序）、手動新增（含漢字詞源與發音）、編輯、匯入單字 */
(function () {
  'use strict';
  const KO = (window.KO = window.KO || {});
  const { esc, qs, qsa } = KO;

  let q = '';
  let tab = 'ALL'; // ALL | DUE | MASTERED
  let sort = 'NEW'; // NEW | DUE | GANADA

  KO.renderVocab = function (el) {
    const all = KO.vocabList();
    const today = KO.todayKey();
    const dueCnt = all.filter((v) => (v.due || '') <= today).length;
    const masCnt = all.filter((v) => (v.interval || 0) >= 14).length;

    let list = all.filter((v) => {
      if (tab === 'DUE' && (v.due || '') > today) return false;
      if (tab === 'MASTERED' && (v.interval || 0) < 14) return false;
      if (q.trim()) {
        const s = q.trim().toLowerCase();
        const hay = `${v.w} ${KO.reading(v.ko || v.w)} ${KO.romaji(v.ko || v.w)} ${v.hanja || ''} ${v.zh || ''}`.toLowerCase();
        if (!hay.includes(s)) return false;
      }
      return true;
    });

    if (sort === 'DUE') list = list.slice().sort((a, b) => String(a.due || '').localeCompare(String(b.due || '')));
    else if (sort === 'GANADA') list = list.slice().sort((a, b) => String(a.w || '').localeCompare(String(b.w || ''), 'ko'));

    el.innerHTML = `
      <div class="page-head">
        <div>
          <h1>⭐ 我的韓語單字本</h1>
          <p>共收錄 <b>${all.length}</b> 詞・今日待複習 <b>${dueCnt}</b> 詞・已熟記（間隔 ≥ 14 天）<b>${masCnt}</b> 詞</p>
        </div>
        <div class="page-acts">
          ${all.length ? `<a class="btn ${dueCnt ? 'primary' : ''}" href="#/review">🔁 前往複習測驗${dueCnt ? ` (${dueCnt})` : ''}</a>` : ''}
          <button class="btn primary" id="vbAdd">＋ 手動新增單字</button>
        </div>
      </div>

      <div class="filter-bar card">
        <div class="filter-row">
          <input type="search" id="vbQ" class="search-in" placeholder="搜尋韓文、漢字詞源、羅馬拼音或中文…" value="${esc(q)}">
          <div class="seg" id="vbTab">
            ${[['ALL', `全部 (${all.length})`], ['DUE', `待複習 (${dueCnt})`], ['MASTERED', `已熟記 (${masCnt})`]].map(([k, l]) =>
              `<button data-t="${k}" class="${tab === k ? 'active' : ''}">${l}</button>`
            ).join('')}
          </div>
          <div class="seg" id="vbSort">
            ${[['NEW', '最新加入'], ['DUE', '到期優先'], ['GANADA', '가나다順']].map(([k, l]) =>
              `<button data-s="${k}" class="${sort === k ? 'active' : ''}">${l}</button>`
            ).join('')}
          </div>
        </div>
      </div>

      ${list.length ? `
        <div class="vlist">
          ${list.map((v) => vocabRowHtml(v, today)).join('')}
        </div>
      ` : `
        <div class="card center">
          <div class="big-emo">📒</div>
          <h3>${all.length ? '沒有符合條件的單字' : '你的韓語單字本還是空的'}</h3>
          <p class="muted">在「單字庫」或「課程對話」點任一個韓文詞，就能一鍵收進單字本排入間隔記憶複習！</p>
          <div style="display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap">
            <a class="btn primary" href="#/words/today">✨ 學今日新單字</a>
            <a class="btn" href="#/words">逛 A1–C2 單字庫</a>
          </div>
        </div>
      `}
    `;

    const qIn = qs('#vbQ', el);
    qIn.oninput = () => { q = qIn.value; KO.renderVocab(el); qs('#vbQ', el).focus(); qs('#vbQ', el).setSelectionRange(q.length, q.length); };
    qsa('#vbTab button', el).forEach((b) => b.onclick = () => { tab = b.dataset.t; KO.renderVocab(el); });
    qsa('#vbSort button', el).forEach((b) => b.onclick = () => { sort = b.dataset.s; KO.renderVocab(el); });
    qs('#vbAdd', el).onclick = () => openEditModal(el, null);

    qsa('[data-vsay]', el).forEach((b) => b.onclick = () => KO.tts.speak(b.dataset.vsay, { rate: 0.9, btn: b }));
    qsa('[data-vedit]', el).forEach((b) => b.onclick = () => {
      const v = KO.state.vocab[b.dataset.vedit];
      if (v) openEditModal(el, v);
    });
    qsa('[data-vdel]', el).forEach((b) => b.onclick = () => {
      const w = b.dataset.vdel;
      KO.removeVocab(w);
      KO.toast(`已移除：${w}`);
      KO.renderVocab(el);
    });
  };

  function vocabRowHtml(v, today) {
    const isDue = (v.due || '') <= today;
    const koDisp = v.ko || v.w;
    const pron = KO.reading(koDisp);
    const k = KO.vocabKey(v.w);
    return `
      <div class="vitem">
        <div>
          <div class="vi-head">
            ${v.level ? KO.levelBadge(v.level) : ''}
            <span class="vi-w ko-txt">${KO.koHtml(koDisp)}</span>
            ${v.hanja ? `<span class="hanja">漢字：${esc(v.hanja)}</span>` : ''}
            <span class="ro">${esc(KO.romaji(koDisp))}${pron !== v.w ? ` [${esc(pron)}]` : ''}</span>
            ${v.pos ? `<span class="chip">${esc(v.pos)}</span>` : ''}
            <span class="chip ${isDue ? 'due' : 'ok'}">${isDue ? '今日待複習' : `下次 ${esc(v.due)}（${v.interval || 0}天）`}</span>
            <button class="icon-btn" data-vsay="${esc(v.w)}" title="發音">🔊</button>
          </div>
          <div class="vi-zh">${esc(v.zh || '')}</div>
          ${v.ex ? `<div class="vi-ex"><span class="ko-txt">${KO.koHtml(v.ex)}</span>${v.ex_zh ? ` — ${esc(v.ex_zh)}` : ''}</div>` : ''}
        </div>
        <div class="vi-acts">
          <button class="btn sm ghost" data-vedit="${esc(k)}">編輯</button>
          <button class="btn sm danger" data-vdel="${esc(v.w)}">刪除</button>
        </div>
      </div>`;
  }

  function openEditModal(el, cur) {
    const root = document.getElementById('popoverRoot');
    root.innerHTML = `
      <div class="modal-backdrop" id="veBg">
        <div class="modal" role="dialog" aria-label="單字編輯">
          <div class="modal-hd">
            <h3>${cur ? '編輯單字' : '＋ 新增韓文單字'}</h3>
            <button class="icon-btn" id="veX">✕</button>
          </div>
          <div class="modal-bd">
            <label>韓文單字（系統自動計算連音讀音與羅馬拼音；特殊讀音可用 <code>{깻잎|깬닙}</code>）
              <input id="veKo" type="text" class="ko-txt" placeholder="例：한국어 或 학교" value="${esc(cur ? cur.ko || cur.w : '')}" ${cur ? 'readonly' : ''}>
            </label>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
              <label>漢字詞源（選填）
                <input id="veHanja" type="text" placeholder="例：韓國語 / 學校" value="${esc(cur?.hanja || '')}">
              </label>
              <label>詞性（選填）
                <input id="vePos" type="text" placeholder="名詞 / 動詞 / 形容詞…" value="${esc(cur?.pos || '')}">
              </label>
              <label>程度
                <select id="veLv">
                  ${KO.LEVELS.map((l) => `<option value="${l.code}" ${(cur?.level || 'A1') === l.code ? 'selected' : ''}>${l.code}</option>`).join('')}
                </select>
              </label>
            </div>
            <label>中文解釋
              <input id="veZh" type="text" placeholder="例：韓語、學校" value="${esc(cur?.zh || '')}">
            </label>
            <label>韓文例句（選填）
              <input id="veEx" type="text" class="ko-txt" placeholder="例：매일 한국어를 공부해요." value="${esc(cur?.ex || '')}">
            </label>
            <label>例句中譯（選填）
              <input id="veExZh" type="text" placeholder="例：每天學習韓語。" value="${esc(cur?.ex_zh || '')}">
            </label>
          </div>
          <div class="modal-ft">
            <button class="btn" id="veCancel">取消</button>
            <button class="btn primary" id="veSave">儲存</button>
          </div>
        </div>
      </div>`;
    const close = () => { root.innerHTML = ''; };
    qs('#veX', root).onclick = close;
    qs('#veCancel', root).onclick = close;
    qs('#veSave', root).onclick = () => {
      const ko = qs('#veKo', root).value.trim();
      const zh = qs('#veZh', root).value.trim();
      if (!ko || !zh) { KO.toast('請填寫韓文單字與中文解釋'); return; }
      KO.addVocab({
        w: KO.surface(ko),
        ko,
        hanja: qs('#veHanja', root).value.trim(),
        pos: qs('#vePos', root).value.trim(),
        level: qs('#veLv', root).value,
        zh,
        ex: qs('#veEx', root).value.trim(),
        ex_zh: qs('#veExZh', root).value.trim(),
      });
      close();
      KO.toast('已儲存單字');
      KO.renderVocab(el);
    };
  }
})();

</script>
<script>/* /js/review.js */
/* 複習中樞：SM-2 記憶閃卡 ＋ 6 種單字測驗（韓選中／中選韓／漢字詞源對照／聽音選義／韓文或羅馬拼音拼寫／例句填空）＋ 四十音複習連結 */
(function () {
  'use strict';
  const KO = (window.KO = window.KO || {});
  const { esc, qs, qsa } = KO;

  let cfg = { source: 'vocab', count: 10 };

  KO.renderReview = function (el) {
    const vocab = KO.vocabList();
    const due = KO.dueVocab();
    const mastered = vocab.filter((v) => (v.interval || 0) >= 14);
    const hSt = KO.hangulStats ? KO.hangulStats('all') : { due: 0, mastered: 0, total: 52 };

    el.innerHTML = `
      <div class="page-head">
        <div>
          <h1>🔁 間隔複習與測驗中心</h1>
          <p>結合 SM-2 遺忘曲線與多感官韓語測驗：答對自動拉長複習間隔，答錯隔天優先重現。</p>
        </div>
      </div>

      <a class="card hangul-review-link ${hSt.due ? 'due' : ''}" href="${hSt.due ? '#/hangul/quiz/due' : '#/hangul'}">
        <span class="kr-ic">한</span>
        <span>
          <b>四十音複習（已熟記 ${hSt.mastered}/${hSt.total}）</b>
          <small>${hSt.due ? `有 ${hSt.due} 個韓文字母今天到期，點此花 2 分鐘快測 →` : '隨時抽考看字選音・聽音選字・羅馬拼音輸入 →'}</small>
        </span>
        <span>→</span>
      </a>

      <div class="rv-stats">
        <div class="rv-stat"><b>${due.length}</b><span>今日到期單字</span></div>
        <div class="rv-stat"><b>${vocab.length}</b><span>單字本總數</span></div>
        <div class="rv-stat"><b>${mastered.length}</b><span>已熟記單字</span></div>
        <div class="rv-stat"><b>${(KO.state.days[KO.todayKey()] || {}).reviews || 0}</b><span>今日已複習題數</span></div>
      </div>

      <div class="card">
        <h2>🃏 SM-2 間隔記憶閃卡</h2>
        <p class="muted">先看韓文回想讀音與意思，翻面聽發音並自評熟悉度（忘記 / 吃力 / 記得 / 輕鬆）。</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
          <button class="btn primary" id="btnFlashDue" ${!vocab.length ? 'disabled' : ''}>
            ▶ 複習到期閃卡（${due.length || Math.min(10, vocab.length)} 張）
          </button>
          ${!vocab.length ? `<a class="btn" href="#/words/today">先去學今日新單字 →</a>` : ''}
        </div>
      </div>

      <div class="card">
        <h2>🎯 六種韓語單字實力測驗</h2>
        <p class="muted">即使單字本還沒有很多詞，也可直接抽考 A1–C2 分級單字庫！</p>
        <div class="rv-modes">
          <button class="rv-mode" data-m="mc_ko2zh"><span class="rv-ic">한→中</span><b>看韓文選中文</b><small>訓練閱讀字彙反應速度</small></button>
          <button class="rv-mode" data-m="mc_zh2ko"><span class="rv-ic">中→한</span><b>看中文選韓文</b><small>強化主動表達選詞能力</small></button>
          <button class="rv-mode" data-m="hanja"><span class="rv-ic">漢↔한</span><b>漢字詞源推理挑戰</b><small>善用繁體母語優勢秒記韓語漢字詞</small></button>
          <button class="rv-mode" data-m="listen"><span class="rv-ic">👂</span><b>聽韓語發音選意思</b><small>不看字純聽連音與語音辨義</small></button>
          <button class="rv-mode" data-m="spell"><span class="rv-ic">⌨️</span><b>聽音拼寫韓文／羅馬音</b><small>支援韓文輸入或羅馬拼音作答</small></button>
          <button class="rv-mode" data-m="cloze"><span class="rv-ic">🧩</span><b>生活例句克漏字填空</b><small>在真實韓語語境中掌握用法</small></button>
        </div>

        <div class="rv-setup">
          <label>題庫來源
            <select id="rvSrc">
              <option value="vocab" ${cfg.source === 'vocab' ? 'selected' : ''}>我的單字本（不足時自動補推薦等級）</option>
              ${KO.LEVELS.map((l) => `<option value="${l.code}" ${cfg.source === l.code ? 'selected' : ''}>${l.code} · ${esc(l.topik)} 單字庫</option>`).join('')}
            </select>
          </label>
          <label>題數
            <select id="rvCnt">
              ${[10, 15, 20].map((n) => `<option value="${n}" ${cfg.count === n ? 'selected' : ''}>${n} 題</option>`).join('')}
            </select>
          </label>
        </div>
      </div>
    `;

    const fd = qs('#btnFlashDue', el);
    if (fd) fd.onclick = () => runFlashcards(el, due.length ? due : vocab.slice(0, 10));
    qs('#rvSrc', el).onchange = (e) => { cfg.source = e.target.value; };
    qs('#rvCnt', el).onchange = (e) => { cfg.count = +e.target.value; };
    qsa('.rv-mode', el).forEach((b) => b.onclick = () => runVocabQuiz(el, b.dataset.m));
  };

  // ==================== SM-2 閃卡 ====================
  function runFlashcards(el, list) {
    let idx = 0;
    let flipped = false;

    function draw() {
      if (idx >= list.length) {
        el.innerHTML = `
          <div class="card center">
            <div class="big-emo">🎉</div>
            <h2>完成 ${list.length} 張韓語閃卡複習！</h2>
            <p class="muted">系統已依你的熟悉度排好下次複習日期。</p>
            <div style="display:flex;gap:10px;justify-content:center;margin-top:14px">
              <button class="btn primary" id="flBack">回複習中心</button>
            </div>
          </div>`;
        qs('#flBack', el).onclick = () => KO.renderReview(el);
        return;
      }
      const v = list[idx];
      const koDisp = v.ko || v.w;
      const pron = KO.reading(koDisp);
      el.innerHTML = `
        <div class="lesson-head">
          <div class="lh-crumb">
            <button class="btn ghost sm" id="flExit">✕ 結束閃卡</button>
            <span class="chip">第 ${idx + 1} / ${list.length} 張</span>
          </div>
        </div>
        <div class="card flash">
          ${!flipped ? `
            <div class="fl-front">
              <div class="fl-word ko-txt">${esc(v.w)}</div>
              <p class="muted small">先在心裡唸出韓語發音（注意有無連音）並回想中文意思</p>
              <div style="display:flex;gap:8px">
                <button class="btn" id="flHintSay">🔊 聽發音提示</button>
                <button class="btn primary lg" id="flFlip">翻面看解答（空白鍵）</button>
              </div>
            </div>
          ` : `
            <div class="fl-back">
              <div class="fl-word ko-txt">${KO.koHtml(koDisp)}</div>
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center">
                ${v.hanja ? `<span class="hanja">漢字：${esc(v.hanja)}</span>` : ''}
                <span class="ro">${esc(KO.romaji(koDisp))}${pron !== v.w ? ` · [${esc(pron)}]` : ''}</span>
              </div>
              <button class="btn sm" id="flSay">🔊 再聽一次</button>
              <div class="fl-zh">${esc(v.zh)}</div>
              ${v.ex ? `<div class="fl-ex"><span class="ko-txt">${KO.koHtml(v.ex)}</span><br><span class="small muted">${esc(v.ex_zh || '')}</span></div>` : ''}
              <div class="fl-grades">
                <button class="grade g0" data-g="0">忘記<small>明天重現</small></button>
                <button class="grade g1" data-g="1">吃力<small>短間隔</small></button>
                <button class="grade g2" data-g="2">記得<small>正常推進</small></button>
                <button class="grade g3" data-g="3">輕鬆<small>大幅拉長</small></button>
              </div>
            </div>
          `}
        </div>`;

      qs('#flExit', el).onclick = () => KO.renderReview(el);
      const hs = qs('#flHintSay', el);
      if (hs) hs.onclick = (e) => KO.tts.speak(v.w, { rate: 0.9, btn: e.currentTarget });
      const flip = qs('#flFlip', el);
      if (flip) {
        flip.focus();
        flip.onclick = () => { flipped = true; KO.tts.speak(v.w, { rate: 0.9 }); draw(); };
      }
      const say = qs('#flSay', el);
      if (say) say.onclick = (e) => KO.tts.speak(v.w, { rate: 0.9, btn: e.currentTarget });
      qsa('[data-g]', el).forEach((b) =>
        b.onclick = () => {
          KO.gradeVocab(v.w, +b.dataset.g);
          idx++;
          flipped = false;
          draw();
        }
      );
    }
    draw();
  }

  // ==================== 6 種單字測驗 ====================
  function shuffle(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
  }

  function buildPool(mode) {
    let base = [];
    if (cfg.source === 'vocab') {
      base = KO.dueVocab().concat(KO.vocabList());
      if (base.length < cfg.count) {
        const rec = KO.wordsByLevel[KO.state.meta.recLevel || 'A1'] || KO.wordBank;
        base = base.concat(rec);
      }
    } else {
      base = (KO.wordsByLevel[cfg.source] || KO.wordBank).slice();
    }
    const uniq = Array.from(new Map(base.map((x) => [KO.vocabKey(x.w), x])).values());
    if (mode === 'hanja') {
      const withHanja = uniq.filter((x) => x.hanja && x.hanja.length >= 1);
      if (withHanja.length >= 6) return withHanja;
      return KO.wordBank.filter((x) => x.hanja && x.hanja.length >= 1);
    }
    if (mode === 'cloze') {
      const withEx = uniq.filter((x) => x.ex && KO.surface(x.ex).includes(x.w.replace(/다$/, '')));
      if (withEx.length >= 6) return withEx;
    }
    return uniq;
  }

  function runVocabQuiz(el, mode) {
    const pool = buildPool(mode);
    const items = shuffle(pool).slice(0, Math.min(cfg.count, pool.length));
    if (!items.length) { KO.toast('題庫沒有足夠單字'); return; }
    let idx = 0, right = 0;

    function draw() {
      if (idx >= items.length) {
        const pct = Math.round((right / items.length) * 100);
        el.innerHTML = `
          <div class="card center">
            <div class="big-emo">${pct >= 80 ? '🏆' : '💪'}</div>
            <h2>測驗完成！得分 ${pct}%（${right} / ${items.length}）</h2>
            <p class="muted">在單字本中的詞彙已同步更新 SM-2 複習進度。</p>
            <div style="display:flex;gap:10px;justify-content:center;margin-top:14px">
              <button class="btn" id="rvAgain">再測一輪</button>
              <button class="btn primary" id="rvHome">回複習中心</button>
            </div>
          </div>`;
        qs('#rvAgain', el).onclick = () => runVocabQuiz(el, mode);
        qs('#rvHome', el).onclick = () => KO.renderReview(el);
        return;
      }

      const target = items[idx];
      const distractPool = KO.wordBank.filter((x) => x.w !== target.w && x.zh !== target.zh);
      const others = shuffle(distractPool).slice(0, 3);
      const opts = shuffle([target, ...others]);
      let answered = false;

      let promptHtml = '';
      let bodyHtml = '';

      if (mode === 'mc_ko2zh') {
        promptHtml = `<div class="rv-tag">看韓文選中文</div><div class="rv-prompt ko-txt">${KO.koHtml(target.ko || target.w)} <button class="icon-btn" id="rvSay">🔊</button></div>`;
        bodyHtml = `<div class="qopts">${opts.map((o, k) => `<button class="opt" data-w="${esc(o.w)}"><span class="opt-k">${k + 1}</span><span>${esc(o.zh)}</span></button>`).join('')}</div>`;
      } else if (mode === 'mc_zh2ko') {
        promptHtml = `<div class="rv-tag">看中文選韓文</div><div class="rv-prompt">${esc(target.zh)} ${target.pos ? `<span class="chip">${esc(target.pos)}</span>` : ''}</div>`;
        bodyHtml = `<div class="qopts">${opts.map((o, k) => `<button class="opt" data-w="${esc(o.w)}"><span class="opt-k">${k + 1}</span><span class="ko-txt">${KO.koHtml(o.ko || o.w)}</span></button>`).join('')}</div>`;
      } else if (mode === 'hanja') {
        promptHtml = `<div class="rv-tag">漢↔한 漢字詞源推理</div><div class="rv-kanji">漢字詞源：「${esc(target.hanja)}」（${esc(target.zh)}）</div><p class="muted small">請選出對應的韓語漢字詞：</p>`;
        const hOthers = shuffle(KO.wordBank.filter((x) => x.hanja && x.w !== target.w)).slice(0, 3);
        const hOpts = shuffle([target, ...hOthers]);
        bodyHtml = `<div class="qopts">${hOpts.map((o, k) => `<button class="opt" data-w="${esc(o.w)}"><span class="opt-k">${k + 1}</span><span class="ko-txt">${esc(o.w)}</span></button>`).join('')}</div>`;
      } else if (mode === 'listen') {
        promptHtml = `<div class="rv-tag">👂 聽韓語發音選意思</div>
          <div class="rv-listen-box">
            <button class="btn primary lg" id="rvPlay">🔊 播放韓語單字</button>
            <button class="btn" id="rvSlow">🐢 慢速</button>
          </div>`;
        bodyHtml = `<div class="qopts">${opts.map((o, k) => `<button class="opt" data-w="${esc(o.w)}"><span class="opt-k">${k + 1}</span><span>${esc(o.zh)}</span></button>`).join('')}</div>`;
      } else if (mode === 'spell') {
        promptHtml = `<div class="rv-tag">⌨️ 聽音拼寫韓文（或輸入羅馬拼音）</div>
          <div class="rv-listen-box">
            <button class="btn primary" id="rvPlay">🔊 播放單字</button>
            <button class="btn" id="rvSlow">🐢 慢速</button>
            <span class="muted">意思提示：<b>${esc(target.zh)}</b>${target.hanja ? `（漢字：${esc(target.hanja)}）` : ''}</span>
          </div>`;
        bodyHtml = `<div class="rv-input">
          <input id="rvIn" class="dict-in ko-txt" placeholder="輸入韓文（如 ${esc(target.w.slice(0, 1))}…）或羅馬拼音按 Enter…" autocomplete="off" spellcheck="false">
          <button class="btn primary" id="rvChk">確認</button>
        </div>`;
      } else {
        const exPlain = KO.surface(target.ex || target.w);
        const stem = target.w.endsWith('다') && target.w.length >= 2 ? target.w.slice(0, -1) : target.w;
        const blanked = exPlain.includes(target.w)
          ? exPlain.replace(target.w, '（　＿＿＿　）')
          : exPlain.includes(stem)
          ? exPlain.replace(stem, '（＿＿）')
          : `（　＿＿＿　） — ${target.zh}`;
        promptHtml = `<div class="rv-tag">🧩 例句克漏字填空</div>
          <div class="rv-cloze ko-txt">${esc(blanked)}</div>
          <p class="muted small">中文句意：${esc(target.ex_zh || target.zh)}</p>`;
        bodyHtml = `<div class="qopts">${opts.map((o, k) => `<button class="opt" data-w="${esc(o.w)}"><span class="opt-k">${k + 1}</span><span class="ko-txt">${esc(o.w)} <small class="muted">（${esc(o.zh)}）</small></span></button>`).join('')}</div>`;
      }

      el.innerHTML = `
        <div class="lesson-head">
          <div class="lh-crumb">
            <button class="btn ghost sm" id="rvExit">✕ 結束測驗</button>
            <span class="chip">第 ${idx + 1} / ${items.length} 題（答對 ${right}）</span>
          </div>
        </div>
        <div class="card">
          ${promptHtml}
          ${bodyHtml}
          <div id="rvFb"></div>
        </div>`;

      qs('#rvExit', el).onclick = () => KO.renderReview(el);
      const sayBtn = qs('#rvSay', el);
      if (sayBtn) sayBtn.onclick = () => KO.tts.speak(target.w, { rate: 0.9, btn: sayBtn });
      const playBtn = qs('#rvPlay', el);
      if (playBtn) {
        setTimeout(() => KO.tts.speak(target.w, { rate: 0.9, btn: playBtn }), 80);
        playBtn.onclick = () => KO.tts.speak(target.w, { rate: 0.9, btn: playBtn });
      }
      const slowBtn = qs('#rvSlow', el);
      if (slowBtn) slowBtn.onclick = () => KO.tts.speak(target.w, { rate: 0.65, btn: slowBtn });

      const finish = (ok, btn) => {
        if (answered) return;
        answered = true;
        if (ok) right++;
        if (KO.hasVocab(target.w)) KO.gradeVocab(target.w, ok ? 2 : 0);
        else KO.bumpDay('reviews', 1);
        KO.tts.speak(target.w, { rate: 0.9 });

        qsa('.opt', el).forEach((b) => {
          b.disabled = true;
          if (b.dataset.w === target.w) b.classList.add('right');
        });
        if (btn && !ok) btn.classList.add('wrong');

        qs('#rvFb', el).innerHTML = `
          <div class="rv-fb ${ok ? 'ok' : 'bad'}">
            <div class="rv-fb-hd">${ok ? '✓ 答對了！' : '✕ 再記一下'}</div>
            <div class="rv-ans">
              <b class="ko-txt">${KO.koHtml(target.ko || target.w)}</b>
              ${target.hanja ? `<span class="hanja">漢字：${esc(target.hanja)}</span>` : ''}
              <span class="ro">${esc(KO.romaji(target.ko || target.w))}</span>
              <span>— ${esc(target.zh)}</span>
            </div>
            ${target.ex ? `<div class="rv-ex ko-txt">${KO.koHtml(target.ex)} <span class="muted">（${esc(target.ex_zh || '')}）</span></div>` : ''}
            <div class="rv-next-row">
              <button class="btn primary" id="rvNext">${idx + 1 >= items.length ? '看總成績 →' : '下一題 →'}</button>
            </div>
          </div>`;
        qs('#rvNext', el).focus();
        qs('#rvNext', el).onclick = () => { idx++; draw(); };
      };

      qsa('.opt', el).forEach((b) => b.onclick = () => finish(b.dataset.w === target.w, b));
      const inp = qs('#rvIn', el);
      if (inp) {
        inp.focus();
        const checkSpell = () => {
          const val = KO.ko.nfc(inp.value.trim());
          const normIn = KO.ko.normalize(val);
          const normSurf = KO.ko.normalize(target.w);
          const normRead = KO.ko.normalize(KO.reading(target.ko || target.w));
          const normRo = KO.ko.normalize(KO.romaji(target.ko || target.w));
          const fromRo = KO.ko.normalize(KO.ko.romajiSentenceToHangul(val));
          const ok = !!normIn && (normIn === normSurf || normIn === normRead || normIn === normRo || fromRo === normSurf || fromRo === normRead);
          finish(ok, null);
        };
        qs('#rvChk', el).onclick = checkSpell;
        inp.addEventListener('keydown', (e) => {
          if (e.isComposing || e.keyCode === 229) return;
          if (e.key === 'Enter') { e.preventDefault(); checkSpell(); }
        });
      }
    }

    draw();
  }
})();

</script>
<script>/* /js/progress.js */
/* 學習進度、四十音熟練度、韓語語音引擎設定、備份匯出匯入與離線發布說明 */
(function () {
  'use strict';
  const KO = (window.KO = window.KO || {});
  const { esc, qs, qsa } = KO;

  KO.renderProgress = function (el) {
    const lessons = KO.allLessons();
    const doneCnt = lessons.filter((l) => KO.state.lessons[l.id]?.completed).length;
    const vocabCnt = KO.vocabList().length;
    const seenWords = Object.keys(KO.state.words || {}).length;
    const hSt = KO.hangulStats ? KO.hangulStats('all') : { mastered: 0, total: 52, pct: 0 };
    const streak = KO.streak();
    const totalSec = Object.values(KO.state.days || {}).reduce((a, d) => a + (d.sec || 0), 0);
    const totalMin = Math.floor(totalSec / 60);

    const today = KO.todayKey();
    const days14 = [];
    for (let i = 13; i >= 0; i--) {
      const k = KO.shiftDay(today, -i);
      const min = Math.floor(((KO.state.days[k] || {}).sec || 0) / 60);
      days14.push({ k, lbl: k.slice(8), min });
    }
    const maxMin = Math.max(KO.state.settings.goalMin || 15, ...days14.map((d) => d.min), 5);
    const voices = KO.tts.voices();
    const st = KO.state.settings;

    el.innerHTML = `
      <div class="page-head">
        <div>
          <h1>📊 學習進度與語音設定</h1>
          <p>所有四十音、對話課與單字本紀錄皆儲存在瀏覽器本機（並與本機伺服器自動同步），亦可隨時匯出 JSON 備份。</p>
        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card"><b>${totalMin} 分鐘</b><span>累積韓語練習時間</span></div>
        <div class="kpi-card"><b>${streak} 天</b><span>目前連續學習天數</span></div>
        <div class="kpi-card"><b>${hSt.mastered} / ${hSt.total}</b><span>四十音熟記（${hSt.pct}%）</span></div>
        <div class="kpi-card"><b>${doneCnt} / ${lessons.length}</b><span>完成對話課程</span></div>
        <div class="kpi-card"><b>${vocabCnt}</b><span>單字本收錄詞數</span></div>
        <div class="kpi-card"><b>${seenWords} / ${KO.wordBank.length}</b><span>已接觸分級詞彙</span></div>
      </div>

      <div class="grid-2">
        <div class="card">
          <h2>📅 最近 14 天練習分鐘數</h2>
          <p class="muted small">深藍柱代表達成當日目標（${st.goalMin || 15} 分鐘）</p>
          <div class="bars14">
            ${days14.map((d) => {
              const h = Math.max(4, Math.round((d.min / maxMin) * 100));
              const hit = d.min >= (st.goalMin || 15);
              return `<div class="bcol"><span class="bval">${d.min || ''}</span><div class="bbar ${hit ? 'hit' : ''}" style="height:${h}%"></div><span class="blbl">${d.lbl}</span></div>`;
            }).join('')}
          </div>
        </div>

        <div class="card">
          <h2>🎓 各級課程完成度（A1–C2 / TOPIK 1–6級）</h2>
          <div style="margin-top:8px">
            ${KO.LEVELS.map((lv) => {
              const list = lessons.filter((l) => l.level === lv.code);
              const d = list.filter((l) => KO.state.lessons[l.id]?.completed).length;
              const pct = list.length ? Math.round((d / list.length) * 100) : 0;
              return `
                <div class="lv-prog-row">
                  <span>${KO.levelBadge(lv.code)} <small class="muted">${esc(lv.topik)}</small></span>
                  <div class="lv-bar"><i style="width:${pct}%;background:${lv.color}"></i></div>
                  <span class="kb-n">${d}/${list.length}</span>
                </div>`;
            }).join('')}
          </div>
        </div>
      </div>

      <div class="card">
        <h2>한 四十音各組熟練度</h2>
        <p class="muted small">綠＝已熟記・藍＝熟悉・黃＝看過（點任一組可直接前往帶讀練習）</p>
        <div style="margin-top:8px">
          ${(KO.HANGUL?.rows || []).map((r) => {
            const total = r.items.length;
            let m = 0, f = 0, s = 0;
            r.items.forEach((it) => {
              const lv = ((KO.state.hangul || {})[it.ch]?.level) || 0;
              if (lv >= 3) m++;
              else if (lv === 2) f++;
              else if (lv === 1) s++;
            });
            return `
              <a class="kbar" href="#/hangul/row/${esc(r.id)}">
                <span class="kb-lbl">${esc(r.label)} · ${esc(r.title.split('：')[0])}</span>
                <span class="kb-track">
                  <i class="m" style="width:${(m / total) * 100}%"></i>
                  <i class="f" style="width:${(f / total) * 100}%"></i>
                  <i class="s" style="width:${(s / total) * 100}%"></i>
                </span>
                <span class="kb-n">${m}/${total}</span>
              </a>`;
          }).join('')}
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <h2>🔊 韓語語音與學習偏好設定</h2>
          <div class="form-grid">
            <label>韓語發音引擎模式
              <select id="setTtsMode">
                <option value="auto" ${st.ttsMode === 'auto' ? 'selected' : ''}>自動最佳（雲端自然韓語＋本機雙重備援，推薦）</option>
                <option value="cloud" ${st.ttsMode === 'cloud' ? 'selected' : ''}>優先雲端自然韓語女聲（無本機語音也能清晰發音）</option>
                <option value="local" ${st.ttsMode === 'local' ? 'selected' : ''}>僅使用系統內建語音（完全離線）</option>
              </select>
            </label>
            <label>系統韓語語音（ko-KR，供本機模式選用）
              <select id="setVoice">
                <option value="">系統自動挑選最佳韓語語音（偵測到 ${voices.length} 組）</option>
                ${voices.map((v) => `<option value="${esc(v.voiceURI)}" ${st.voiceURI === v.voiceURI ? 'selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}
              </select>
            </label>
            <div class="voice-TestRow">
              <button class="btn sm primary" id="testFemale">🔊 試聽韓語女聲</button>
              <button class="btn sm" id="testMale">🔊 試聽韓語男聲</button>
            </div>
            <label>每日學習目標（分鐘）
              <select id="setGoal">
                ${[10, 15, 20, 30, 45].map((m) => `<option value="${m}" ${(st.goalMin || 15) === m ? 'selected' : ''}>每天 ${m} 分鐘</option>`).join('')}
              </select>
            </label>
            <label>每次「今日新單字」數量
              <select id="setDailyW">
                ${[5, 10, 15, 20].map((n) => `<option value="${n}" ${(st.dailyNewWords || 10) === n ? 'selected' : ''}>每次 ${n} 個新單字</option>`).join('')}
              </select>
            </label>
          </div>
        </div>

        <div class="card">
          <h2>💾 學習紀錄備份與離線匯出</h2>
          <p class="muted small">換電腦或清快取前，可匯出 JSON 備份檔；在任何裝置匯入即可完整還原四十音、課程與單字本進度。</p>
          <div class="data-acts">
            <button class="btn primary" id="btnExport">⬇ 匯出學習紀錄 JSON</button>
            <label class="btn" style="cursor:pointer">
              ⬆ 匯入備份 JSON
              <input type="file" id="inImport" accept="application/json,.json" hidden>
            </label>
            <button class="btn danger" id="btnReset">清除重設紀錄</button>
          </div>
          ${!KO.isStatic() ? `
            <div class="static-export-box">
              <b>📦 離線單檔與 GitHub Pages 靜態包</b>
              <p class="small muted">可下載免伺服器獨立 HTML 檔，或網站壓縮包放到 GitHub Pages 的 <code>korean/</code> 子資料夾。</p>
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
                <a class="btn sm" href="/download/single">下載單一 HTML（Korean_Academy.html）</a>
                <a class="btn sm" href="/download/zip">下載網站包 ZIP（korean/）</a>
              </div>
            </div>` : ''}
        </div>
      </div>
    `;

    qs('#setTtsMode', el).onchange = (e) => { st.ttsMode = e.target.value; KO.save(); KO.toast('已更新韓語語音模式'); };
    qs('#setVoice', el).onchange = (e) => { st.voiceURI = e.target.value; KO.save(); };
    qs('#setGoal', el).onchange = (e) => { st.goalMin = +e.target.value; KO.save(); KO.renderProgress(el); };
    qs('#setDailyW', el).onchange = (e) => { st.dailyNewWords = +e.target.value; KO.save(); KO.toast('已更新每日新字數量'); };

    qs('#testFemale', el).onclick = (e) =>
      KO.tts.speak('안녕하세요! 오늘도 즐겁게 한국어를 연습해 볼까요?', { gender: 'F', btn: e.currentTarget });
    qs('#testMale', el).onclick = (e) =>
      KO.tts.speak('반갑습니다! 천천히 따라 읽으면서 발음을 익혀 보세요.', { gender: 'M', btn: e.currentTarget });

    qs('#btnExport', el).onclick = () => {
      const blob = new Blob([JSON.stringify(KO.state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `korean-academy-backup-${KO.todayKey()}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    };

    qs('#inImport', el).onchange = async (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      try {
        const data = JSON.parse(await f.text());
        KO.mergeState(data);
        KO.save();
        KO.toast('已成功匯入並合併韓語學習紀錄！');
        KO.renderProgress(el);
      } catch {
        KO.toast('檔案格式錯誤，請選擇有效的備份 JSON');
      }
    };

    qs('#btnReset', el).onclick = () => {
      if (!confirm('確定要清除所有韓語四十音、課程與單字本進度嗎？建議先匯出 JSON 備份。')) return;
      KO.resetAll();
      KO.toast('已重設所有學習紀錄');
      KO.renderProgress(el);
    };
  };
})();

</script>
<script>/* /js/feedback.js */
/* 意見回饋頁（極簡三欄：類型・主旨・詳細說明）：
 * - 本機伺服器模式：POST /api/feedback 自動寄信至 okayell@hotmail.com 並寫入本機紀錄
 * - GitHub Pages / 單一 HTML 靜態模式：儲存於 localStorage 並開啟 mailto: 草稿
 */
(function () {
  'use strict';
  const KO = (window.KO = window.KO || {});
  const { esc, qs } = KO;

  const RECIPIENT = 'okayell@hotmail.com';
  const TOOL = '韓語學院';
  const LS_KEY = 'ko.feedback.v1';

  function loadLocal() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { return []; }
  }
  function saveLocal(list) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(list.slice(0, 100))); } catch {}
  }
  function mergeItems(a, b) {
    const map = new Map();
    [...a, ...b].forEach((x) => { if (x && x.id) map.set(x.id, x); });
    return Array.from(map.values()).sort((x, y) => String(y.created_at || '').localeCompare(String(x.created_at || '')));
  }
  function buildMailto(it) {
    const subj = `[${TOOL} 意見回饋][${it.kind}] ${it.title}`;
    const body = `類型：${it.kind}\n主旨：${it.title}\n時間：${it.created_at}\n\n${it.desc}\n`;
    return `mailto:${RECIPIENT}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
  }

  function renderList(box, items) {
    if (!items.length) {
      box.innerHTML = `<div class="fb-empty muted small">尚無意見回饋紀錄 — 歡迎成為第一位提供建議的使用者！</div>`;
      return;
    }
    box.innerHTML = items.map((it) => `
      <div class="fb-item">
        <div class="fb-item-hd">
          <span class="fb-kind">${esc(it.kind || '建議')}</span>
          <span class="muted small">${esc(it.created_at || '')}</span>
        </div>
        <div class="fb-title">${esc(it.title || '')}</div>
        ${it.desc ? `<div class="fb-desc">${esc(it.desc)}</div>` : ''}
      </div>
    `).join('');
  }

  KO.renderFeedback = async function (el) {
    el.innerHTML = `
      <div class="card fb-head">
        <h1>💬 意見回饋・問題回報與教材建議</h1>
        <p class="muted">想新增特定韓國旅遊／職場對話主題、補充單字或回報發音問題？歡迎直接填寫下方表單告訴我們。</p>
      </div>
      <div class="fb-grid">
        <form class="card fb-form" id="fbForm">
          <div>
            <label class="fb-lbl" for="fbKind">回饋類型</label>
            <select class="fb-input" id="fbKind">
              <option value="課程與單字建議">📚 課程與單字建議（希望新增的韓語主題）</option>
              <option value="功能改善建議">✨ 功能改善建議</option>
              <option value="發音與連音回報">🔊 發音、連音或內容勘誤</option>
              <option value="問題與錯誤回報">🐞 操作問題回報</option>
            </select>
          </div>
          <div>
            <label class="fb-lbl" for="fbTitle">主旨 <span style="color:var(--red)">*</span></label>
            <input class="fb-input" id="fbTitle" type="text" maxlength="120" required placeholder="一句話簡述您的建議或遇到的問題…">
          </div>
          <div>
            <label class="fb-lbl" for="fbDesc">詳細說明 <span class="muted small">（選填）</span></label>
            <textarea class="fb-input" id="fbDesc" placeholder="歡迎補充情境細節、例句或畫面操作步驟…"></textarea>
          </div>
          <div id="fbBanner" hidden></div>
          <div class="fb-actions">
            <span class="muted small">📩 回饋會自動寄送通知給維護者</span>
            <button type="submit" class="btn primary" id="fbSubmit">📨 送出回饋</button>
          </div>
        </form>

        <div class="card">
          <h2 style="margin:0;font-size:17px">📋 已提交的回饋紀錄</h2>
          <div class="fb-list" id="fbList"><div class="fb-empty muted small">載入中…</div></div>
        </div>
      </div>
    `;

    const listEl = qs('#fbList', el);
    let items = loadLocal();
    if (!KO.isStatic()) {
      try {
        const r = await fetch('/api/feedback');
        const d = await r.json();
        if (d && Array.isArray(d.items)) items = mergeItems(d.items, items);
      } catch {}
    }
    renderList(listEl, items);

    qs('#fbForm', el).addEventListener('submit', async (e) => {
      e.preventDefault();
      const kind = qs('#fbKind', el).value;
      const title = qs('#fbTitle', el).value.trim();
      const desc = qs('#fbDesc', el).value.trim();
      if (!title) { KO.toast('請填寫主旨'); return; }

      const btn = qs('#fbSubmit', el);
      const banner = qs('#fbBanner', el);
      btn.disabled = true;
      btn.textContent = '傳送中…';

      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const localItem = {
        id: 'fb-' + Date.now().toString(36),
        kind, title, desc,
        created_at: `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`,
      };

      let sentViaServer = false;
      let emailed = false;
      let mailtoUrl = buildMailto(localItem);

      if (!KO.isStatic()) {
        try {
          const r = await fetch('/api/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ kind, title, desc }),
          });
          const d = await r.json();
          if (d && d.ok) {
            sentViaServer = true;
            emailed = !!d.emailed;
            if (d.mailto) mailtoUrl = d.mailto;
            if (d.item) Object.assign(localItem, d.item);
          }
        } catch {}
      }

      // 靜態網頁（或本機伺服器沒寄出）→ 開心學園共用直接寄出（ntfy 中轉 → FormSubmit → 本機佇列自動補寄），不讓使用者挑管道。
      let staticRes = null;
      if (!(sentViaServer && emailed) && window.CampusNav && typeof window.CampusNav.sendStaticFeedback === 'function') {
        try {
          staticRes = await window.CampusNav.sendStaticFeedback({ tool: TOOL, kindLabel: kind, title, description: desc, createdAt: localItem.created_at });
        } catch { staticRes = null; }
      }

      const nextLocal = mergeItems([localItem], loadLocal());
      saveLocal(nextLocal);
      items = mergeItems([localItem], items);
      renderList(listEl, items);

      qs('#fbTitle', el).value = '';
      qs('#fbDesc', el).value = '';
      btn.disabled = false;
      btn.textContent = '📨 送出回饋';

      banner.hidden = false;
      if (sentViaServer && emailed) {
        banner.className = 'fb-banner ok';
        banner.innerHTML = `✅ 已收到您的回饋並自動寄信通知維護者，非常感謝！`;
      } else if (staticRes) {
        banner.className = 'fb-banner ok';
        banner.innerHTML = staticRes.sent
          ? `✅ 已收到您的回饋並自動寄給維護者，非常感謝！`
          : '✅ 已收到您的回饋！目前網路不穩，恢復連線或下次開啟開心學園時會自動寄給維護者，不需要任何操作。';
      } else if (sentViaServer) {
        banner.className = 'fb-banner ok';
        banner.innerHTML = `✅ 已儲存於本機回饋紀錄！若需同步寄出郵件，可點此 <a href="${esc(mailtoUrl)}">開啟郵件草稿寄送</a>。`;
      } else {
        banner.className = 'fb-banner warn';
        banner.innerHTML = `📌 已記錄於此瀏覽器！因目前為靜態離線頁面，已為您準備好郵件草稿：<a href="${esc(mailtoUrl)}">點此透過信箱寄給維護者</a>。`;
      }
      KO.toast('感謝您的意見回饋！');
    });
  };
})();

</script>

<script>/* /js/releases.js */
/* 版本徽章、更新日誌（Release Notes）與靜態離線包匯出視窗 */
(function () {
  'use strict';
  const KO = (window.KO = window.KO || {});
  const { esc, qs, qsa } = KO;

  function data() {
    return KO.RELEASES_DATA || { current: '1.0.0', releases: [] };
  }

  KO.initVersionBadge = function () {
    const btn = document.getElementById('verBadgeBtn');
    if (!btn) return;
    const d = data();
    btn.textContent = `v${d.current || '1.0.0'}`;
    btn.onclick = () => KO.openReleaseModal('notes');
  };

  KO.openReleaseModal = async function (tab = 'notes') {
    const root = document.getElementById('popoverRoot');
    const isStatic = KO.isStatic();
    let status = null;
    if (!isStatic) {
      try {
        const r = await fetch('/api/releases');
        const j = await r.json();
        if (j && j.ok) status = j;
      } catch {}
    }
    const d = status || data();
    const curVer = d.current || '1.0.0';
    const releases = d.releases || [];
    const diff = status?.diff || null;

    function draw() {
      root.innerHTML = `
        <div class="modal-backdrop" id="relBg">
          <div class="modal rel-modal" role="dialog" aria-label="版本資訊與更新日誌">
            <div class="modal-hd rel-modal-head">
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                <h3>🏷️ 韓語學院 v${esc(curVer)}</h3>
                ${!isStatic ? `
                  <div class="rel-tabs">
                    <button class="rel-tab ${tab === 'notes' ? 'active' : ''}" data-rtab="notes">更新日誌 (${releases.length})</button>
                    <button class="rel-tab ${tab === 'manage' ? 'active' : ''}" data-rtab="manage">匯出與發布管理</button>
                  </div>` : ''}
              </div>
              <button class="icon-btn" id="relX">✕</button>
            </div>
            <div class="modal-bd">
              ${tab === 'notes' || isStatic ? renderNotes(releases) : renderManage(curVer, diff)}
            </div>
          </div>
        </div>`;

      const close = () => { root.innerHTML = ''; };
      qs('#relX', root).onclick = close;
      qs('#relBg', root).onclick = (e) => { if (e.target.id === 'relBg') close(); };
      qsa('[data-rtab]', root).forEach((b) => b.onclick = () => { tab = b.dataset.rtab; draw(); });

      const pubForm = qs('#relPubForm', root);
      if (pubForm) {
        pubForm.onsubmit = async (e) => {
          e.preventDefault();
          const version = qs('#rfVer', root).value.trim();
          const title = qs('#rfTitle', root).value.trim();
          const notes = qs('#rfNotes', root).value.split(/\n+/).map((s) => s.trim()).filter(Boolean);
          const sb = qs('#rfSubmit', root);
          sb.disabled = true;
          sb.textContent = '發布與打包中…';
          try {
            const r = await fetch('/api/releases/publish', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ version, title, notes }),
            });
            const res = await r.json();
            if (!res.ok) throw new Error(res.error || '發布失敗');
            KO.RELEASES_DATA = { current: res.entry.version, releases: [res.entry, ...releases.filter((x) => x.version !== res.entry.version)] };
            KO.initVersionBadge();
            KO.toast(`已發布 v${res.entry.version} 並更新離線包！`);
            KO.openReleaseModal('notes');
          } catch (err) {
            sb.disabled = false;
            sb.textContent = '🚀 發布新版本並重建離線包';
            KO.toast(err.message || '發布失敗');
          }
        };
      }
    }

    draw();
  };

  function renderNotes(releases) {
    if (!releases.length) return `<p class="muted">尚無版本紀錄。</p>`;
    return `
      <div class="rel-list">
        ${releases.map((r, i) => `
          <div class="rel-card ${i === 0 ? 'latest' : ''}">
            <div class="rel-card-hd">
              <span class="rel-ver">v${esc(r.version)}</span>
              <span class="rel-date">${esc(r.released_at || '')}</span>
              ${i === 0 ? '<span class="rel-tag-latest">目前版本</span>' : ''}
            </div>
            <div class="rel-title">${esc(r.title || '')}</div>
            <ul class="rel-notes">
              ${(r.notes || []).map((n) => `<li>${esc(n)}</li>`).join('')}
            </ul>
            ${r.stats ? `<div class="rel-stats"><span>📄 追蹤檔案 ${r.stats.total_files || 0} 個</span><span>📦 程式碼 ${r.stats.total_lines || 0} 行</span></div>` : ''}
          </div>`).join('')}
      </div>`;
  }

  function renderManage(curVer, diff) {
    const parts = curVer.split('.').map((n) => parseInt(n, 10) || 0);
    const nextPatch = `${parts[0] || 1}.${parts[1] || 0}.${(parts[2] || 0) + 1}`;
    const changes = diff?.changes || [];
    return `
      <div class="rel-status-box export">
        <b>📦 下載最新靜態網站包／單一離線檔</b>
        <p class="small muted">點擊下方按鈕會即時重新打包最新四十音、課程與單字庫：</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
          <a class="btn sm primary" href="/download/zip">⬇ 下載 Korean_Academy_Web_Package.zip</a>
          <a class="btn sm" href="/download/single">⬇ 下載單一檔 Korean_Academy.html</a>
        </div>
      </div>

      <div class="rel-status-box">
        <div class="rel-dirty ${changes.length ? 'changed' : 'clean'}">
          ${changes.length
            ? `⚡ 距離 v${esc(curVer)} 有 ${changes.length} 個檔案變更（<span class="add">+${diff.added_lines || 0}</span> / <span class="del">-${diff.removed_lines || 0}</span> 行）`
            : `✓ 目前工作區與 v${esc(curVer)} 完全一致`}
        </div>
        ${changes.length ? `
          <table class="rel-tbl">
            <thead><tr><th>狀態</th><th>檔案</th><th>行數增減</th></tr></thead>
            <tbody>
              ${changes.slice(0, 12).map((c) => `
                <tr>
                  <td class="nowrap">${esc(c.status)}</td>
                  <td><code>${esc(c.path)}</code></td>
                  <td class="nowrap"><span class="add">+${c.added}</span> / <span class="del">-${c.removed}</span></td>
                </tr>`).join('')}
            </tbody>
          </table>` : ''}
      </div>

      <form class="rel-form" id="relPubForm">
        <b>🏷️ 登記並發布新版本</b>
        <div style="display:grid;grid-template-columns:140px 1fr;gap:10px">
          <label>新版本號<input id="rfVer" class="rf-input" value="${esc(nextPatch)}" required></label>
          <label>版本標題<input id="rfTitle" class="rf-input" placeholder="例：新增 TOPIK 主題課程與音變練習" required></label>
        </div>
        <label>更新重點（每行一條）
          <textarea id="rfNotes" class="rf-input" rows="3" placeholder="新增內容說明…"></textarea>
        </label>
        <div style="display:flex;justify-content:flex-end;margin-top:10px">
          <button type="submit" class="btn primary" id="rfSubmit">🚀 發布新版本並重建離線包</button>
        </div>
      </form>`;
  }
})();

</script>

      { t: '마음이 약해진 나무꾼은 그만 날개옷을 꺼내 주고 말았다.', r: 'maeumi yakaejin namukkuneun geuman nalgaeoseul kkeonae jugo maratda.', zh: '心軟的樵夫一時不察，把羽衣拿了出來。' },
      { t: '선녀는 날개옷을 입자마자 두 아이를 안고 하늘로 날아올랐다.', r: 'seonnyeoneun nalgaeoseul ipjamaja du aireul ango haneullo naraollatda.', zh: '仙女一穿上羽衣，就抱著兩個孩子飛上了天。' },
      { t: '"여보, 미안해요. 고향이 너무 그리웠어요."', r: '"yeobo, mianhaeyo. gohyang-i neomu geuriwosseoyo."', zh: '「老公，對不起。我實在太想念故鄉了。」', g: 'F' },
      { t: '나무꾼이 소리쳐 불렀지만 가족은 구름 속으로 사라졌다.', r: 'namukkuni sorichyeo bulleotjiman gajogeun gureum sogeuro sarajyeotda.', zh: '樵夫大聲呼喊，家人卻消失在雲層之中。' },
      { t: '그제야 그는 사슴이 왜 셋이라고 했는지 깨달았다.', r: 'geujeya geuneun saseumi wae sesirago haenneunji kkaedaratda.', zh: '直到這時，他才明白鹿為什麼說要三個孩子。' },
      { t: '두 팔로는 아이 셋을 한꺼번에 안고 날아갈 수 없기 때문이었다.', r: 'du palloneun ai seseul hankkeobeone ango naragal su eopgi ttaemunieotda.', zh: '因為只有兩隻手臂，無法一次抱著三個孩子飛走。' },
      { t: '나무꾼이 날마다 연못가에서 울고 있자 사슴이 다시 나타났다.', r: 'namukkuni nalmada yeonmotgaeseo ulgo itja saseumi dasi natanatda.', zh: '樵夫天天在池邊哭泣，那隻鹿又出現了。', p: 1 },
      { t: '"이제 선녀들은 두레박으로 연못물을 길어 갑니다."', r: '"ije seonnyeodeureun durebageuro yeonmonmureul gireo gamnida."', zh: '「現在仙女們改用吊桶從天上汲取池水。」', g: 'M' },
      { t: '"그 두레박을 타면 하늘나라에 갈 수 있을 거예요."', r: '"geu durebageul tamyeon haneullarae gal su isseul geoyeyo."', zh: '「只要坐上那個吊桶，就能到天庭去。」', g: 'M' },
      { t: '나무꾼은 사슴의 도움으로 두레박을 타고 하늘나라에 올라갔다.', r: 'namukkuneun saseume doumeuro durebageul tago haneullarae ollagatda.', zh: '樵夫在鹿的幫助下，乘著吊桶上了天庭。' },
      { t: '하늘나라에서 그는 그리운 아내와 아이들을 다시 만났다.', r: 'haneullaraeseo geuneun geuriun anaewa aideureul dasi mannatda.', zh: '在天庭，他與朝思暮想的妻兒重逢了。' },
      { t: '옥황상제는 그의 정성에 감동하여 함께 살도록 허락해 주었다.', r: 'okwangsangjeneun geue jeongseong-e gamdonghayeo hamkke saldorok heorakae jueotda.', zh: '玉皇大帝被他的誠心感動，允許他們一家團聚。' },
      { t: '하늘나라의 생활은 꿈처럼 평화롭고 행복했다.', r: 'haneullarae saenghwareun kkumcheoreom pyeonghwaropgo haengbokaetda.', zh: '天庭的生活像夢一般平靜又幸福。' },
      { t: '하지만 지상에 홀로 남은 어머니가 걱정되어 마음이 편치 않았다.', r: 'hajiman jisang-e hollo nameun eomeoniga geokjeongdoeeo maeumi pyeonchi anatda.', zh: '但他擔心獨自留在人間的母親，心裡始終不安。' },
      { t: '"어머니 얼굴만 뵙고 꼭 돌아올게요."', r: '"eomeoni eolgulman boepgo kkok doraolgeyo."', zh: '「我只是去看看娘，一定會回來的。」', g: 'M' },
      { t: '선녀는 하늘을 나는 말 한 마리를 내주며 신신당부했다.', r: 'seonnyeoneun haneureul naneun mal han marireul naejumyeo sinsindangbuhaetda.', zh: '仙女給了他一匹會飛的馬，再三叮囑。' },
      { t: '"절대로 말에서 내려 땅을 밟으시면 안 돼요."', r: '"jeoldaero mareseo naeryeo ttang-eul balbeusimyeon an dwaeyo."', zh: '「千萬不能下馬踩到地面喔。」', g: 'F' },
      { t: '집에 도착하자 어머니는 맨발로 뛰어나와 아들을 반기셨다.', r: 'jibe dochakaja eomeonineun maenballo ttwieonawa adeureul bangisyeotda.', zh: '一到家，母親就光著腳跑出來迎接兒子。', p: 1 },
      { t: '"배고프지? 네가 좋아하는 호박죽을 쑤어 놓았단다."', r: '"baegopeuji? nega joahaneun hobakjugeul ssueo noatdanda."', zh: '「餓了吧？我煮了你最愛吃的南瓜粥。」', g: 'F' },
      { t: '어머니는 말 위에 앉은 아들에게 뜨거운 죽 그릇을 건네셨다.', r: 'eomeonineun mal wie anjeun adeurege tteugeoun juk geureuseul geonnesyeotda.', zh: '母親把一碗熱騰騰的粥遞給坐在馬上的兒子。' },
      { t: '그런데 그만 뜨거운 죽이 말 등에 쏟아지고 말았다.', r: 'geureonde geuman tteugeoun jugi mal deung-e ssodajigo maratda.', zh: '沒想到滾燙的粥一不小心灑在了馬背上。' },
      { t: '깜짝 놀란 말이 몸을 흔드는 바람에 나무꾼은 땅에 떨어졌다.', r: 'kkamjjak nollan mari momeul heundeuneun barame namukkuneun ttang-e tteoreojyeotda.', zh: '受驚的馬猛力甩動身體，樵夫因此摔到了地上。' },
      { t: '말은 크게 울더니 혼자서 하늘로 날아가 버렸다.', r: 'mareun keuge uldeoni honjaseo haneullo naraga beoryeotda.', zh: '馬長嘶一聲，獨自飛回了天上。' },
      { t: '그 후 나무꾼은 매일 하늘을 바라보며 가족을 그리워했다고 한다.', r: 'geu hu namukkuneun maeil haneureul barabomyeo gajogeul geuriwohaetdago handa.', zh: '據說從此以後，樵夫每天望著天空思念家人。' },
      { t: '사람들은 하늘을 보며 우는 수탉이 그 나무꾼이라고 말한다.', r: 'saramdeureun haneureul bomyeo uneun sutalgi geu namukkunirago malhanda.', zh: '人們說，那仰天啼叫的公雞，就是那位樵夫。' },
