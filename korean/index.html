  function renderQuiz(el, kind) {
    let pool;
    let title;
    if (kind === 'due') {
      const today = KO.todayKey();
      pool = allItems('all').filter((it) => {
        const r = (KO.state.hangul || {})[it.ch];
        return r && r.due && r.due <= today;
      });
      if (!pool.length) pool = allItems('all').slice(0, 10);
      title = '到期四十音複習';
    } else {
      pool = allItems(ui.qGroup || 'all');
      title = kind === 'listen' ? '聽發音選韓文字' : kind === 'type' ? '看韓文字輸入羅馬拼音' : '看韓文字選讀音';
    }
    runQuizSession(el, {
      title,
      pool,
      distractors: allItems(ui.qGroup === 'all' ? 'all' : ui.qGroup),
      count: Math.min(ui.qCount || 10, Math.max(pool.length, 6)),
      mode: kind === 'due' ? 'mix' : kind,
      nextHref: '#/hangul',
      nextLabel: '回到四十音專區',
    });
  }

  function acceptRomaji(input, item) {
    const v = String(input || '').trim().toLowerCase().replace(/^-/, '');
    if (!v) return false;
    const rawParts = item.r.toLowerCase().split('/').map((x) => x.replace(/[()無聲\s-]/g, '')).filter(Boolean);
    const alts = new Set(rawParts);
    // 常見可接受輸入同義寫法
    if (item.ch === 'ㅇ') { alts.add('ng'); alts.add('o'); alts.add('a'); }
    if (alts.has('eo')) alts.add('o');
    if (alts.has('eu')) alts.add('u');
    if (alts.has('ae')) alts.add('e');
    if (alts.has('oe')) alts.add('we');
    if (alts.has('g')) alts.add('k');
    if (alts.has('d')) alts.add('t');
    if (alts.has('b')) alts.add('p');
    if (alts.has('r')) alts.add('l');
    alts.add(KO.ko.hangulToRomaji(item.say).toLowerCase());
    return alts.has(v);
  }

  function runQuizSession(el, cfg) {
    const seq = [];
    while (seq.length < cfg.count) seq.push(...shuffle(cfg.pool));
    seq.length = cfg.count;
    let idx = 0, right = 0;
    const wrongList = [];

    function draw() {
      if (idx >= seq.length) return drawDone();
      const target = seq[idx];
      const qMode = cfg.mode === 'mix' ? (idx % 2 === 0 ? 'pick' : 'listen') : cfg.mode;
      const others = shuffle(cfg.distractors.filter((x) => x.ch !== target.ch && x.r !== target.r)).slice(0, 3);
      const opts = shuffle([target, ...others]);
      let answered = false;

      el.innerHTML = `
        <div class="lesson-head">
          <div class="lh-crumb">
            <a href="#/hangul" class="btn ghost sm">✕ 結束測驗</a>
            <span class="chip">${esc(cfg.title)}</span>
          </div>
        </div>
        <div class="card kq-card">
          <div class="prac-prog">
            <span>第 <b>${idx + 1}</b> / ${seq.length} 題（答對 ${right}）</span>
            <div class="pbar"><i style="width:${Math.round((idx / seq.length) * 100)}%"></i></div>
          </div>

          ${qMode === 'listen' ? `
            <div class="kq-listen">
              <button class="btn primary lg" id="kqPlay">🔊 播放發音</button>
              <button class="btn" id="kqSlow">🐢 慢速</button>
            </div>
            <p class="muted small">請選出剛才聽到的韓文字母／音節：</p>
          ` : `
            <div class="kq-big ko-txt">${esc(displaySymbol(target.ch))}</div>
            <p class="muted small">${qMode === 'type' ? '請輸入羅馬拼音（如 a / eo / g / kk / ng）按 Enter：' : '請選擇正確的讀音（與示範音節）：'}</p>
          `}

          ${qMode === 'type' ? `
            <div class="rv-input">
              <input type="text" id="kqIn" class="dict-in" placeholder="輸入羅馬拼音…" autocomplete="off" autocapitalize="off" spellcheck="false">
              <button class="btn primary" id="kqChk">確認</button>
            </div>
          ` : `
            <div class="qopts kq-optgrid">
              ${opts.map((o, k) => `
                <button class="opt" data-ch="${esc(o.ch)}">
                  <span class="opt-k">${k + 1}</span>
                  ${qMode === 'listen'
                    ? `<span class="kq-ch ko-txt">${esc(displaySymbol(o.ch))}</span>`
                    : `<span class="kq-ro">${esc(o.r)} <small class="muted">(${esc(o.say)})</small></span>`}
                </button>`).join('')}
            </div>
          `}
          <div id="kqFb"></div>
        </div>`;

      if (qMode === 'listen') {
        setTimeout(() => sayHangul(target, false, qs('#kqPlay', el)), 90);
        qs('#kqPlay', el).onclick = (e) => sayHangul(target, false, e.currentTarget);
        qs('#kqSlow', el).onclick = (e) => sayHangul(target, true, e.currentTarget);
      }

      const finish = (ok, chosenBtn) => {
        if (answered) return;
        answered = true;
        gradeHangul(target.ch, ok);
        if (ok) right++;
        else wrongList.push(target);
        sayHangul(target, false);

        qsa('.opt', el).forEach((b) => {
          b.disabled = true;
          if (b.dataset.ch === target.ch) b.classList.add('right');
        });
        if (chosenBtn && !ok) chosenBtn.classList.add('wrong');

        const info = KO.HANGUL.info[target.ch] || {};
        qs('#kqFb', el).innerHTML = `
          <div class="rv-fb ${ok ? 'ok' : 'bad'}">
            <div class="rv-fb-hd">${ok ? '✓ 答對了！' : '✕ 再記一下'}</div>
            <div class="rv-ans">
              <b class="ko-txt kq-ans-ch">${esc(displaySymbol(target.ch))}</b>
              <span class="ro">${esc(target.r)}（示範音：${esc(target.say)}・名稱：${esc(target.name)}）</span>
              ${info.ex ? `<span class="muted">例：<span class="ko-txt">${KO.koHtml(info.ex)}</span>（${esc(info.zh)}）</span>` : ''}
            </div>
            <div class="rv-next-row">
              <button class="btn primary" id="kqNext">${idx + 1 >= seq.length ? '看成績 →' : '下一題 →'}</button>
            </div>
          </div>`;
        qs('#kqNext', el).focus();
        qs('#kqNext', el).onclick = () => { idx++; draw(); };
      };

      qsa('.opt', el).forEach((b) =>
        b.addEventListener('click', () => finish(b.dataset.ch === target.ch, b))
      );

      const inp = qs('#kqIn', el);
      if (inp) {
        inp.focus();
        const submit = () => finish(acceptRomaji(inp.value, target), null);
        qs('#kqChk', el).onclick = submit;
        inp.addEventListener('keydown', (e) => {
          if (e.isComposing || e.keyCode === 229) return;
          if (e.key === 'Enter') { e.preventDefault(); submit(); }
        });
      }
    }

    function drawDone() {
      const pct = Math.round((right / seq.length) * 100);
      el.innerHTML = `
        <div class="card center">
          <div class="big-emo">${pct >= 85 ? '🎉' : pct >= 60 ? '💪' : '🌱'}</div>
          <h2>${esc(cfg.title)}完成！得分 ${pct}%（${right} / ${seq.length}）</h2>
          ${wrongList.length ? `
            <p class="muted">以下字母已排入明日複習，點一下再聽一次：</p>
            <div class="kq-wrong">
              ${Array.from(new Map(wrongList.map((w) => [w.ch, w])).values()).map((w) => `
                <button class="kq-w" data-say="${esc(w.ch)}"><b class="ko-txt">${esc(displaySymbol(w.ch))}</b><small>${esc(w.r)} (${esc(w.say)})</small></button>`).join('')}
            </div>` : '<p class="muted">全部一次答對！熟練度已更新。</p>'}
          <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <button class="btn" id="kqAgain">再測一輪</button>
            <a class="btn primary" href="${esc(cfg.nextHref)}">${esc(cfg.nextLabel)}</a>
          </div>
        </div>`;
      qsa('[data-say]', el).forEach((b) => b.onclick = () => sayHangul(b.dataset.say, false, b));
      qs('#kqAgain', el).onclick = () => runQuizSession(el, cfg);
    }

    draw();
  }

  KO.hangulApi = { allItems, gradeHangul, sayHangul };
})();

</script>
<script>/* /js/lesson.js */
/* 單一課程檢視：模式分頁、對話聆聽（連音標記／羅馬拼音／中譯／盲聽／逐詞點查）、單字・文法・文化提醒 */
(function () {
  'use strict';
  const KO = (window.KO = window.KO || {});
  const { esc, qs, qsa } = KO;

  const MODES = [
    ['read', '🎧', '對話聆聽'],
    ['shadow', '🎙️', '口說跟讀'],
    ['role', '🎭', '角色扮演'],
    ['dict', '✍️', '聽寫練習'],
    ['quiz', '📝', '理解測驗'],
    ['words', '💡', '單字・文法'],
  ];

  let cur = null;

  function guessGender(sp, idx) {
    if (/店員|櫃檯|藥師|醫師|房仲|客服|男|민준|준호|성민|현우|지훈|재현|태양|동현/.test(sp)) {
      if (/女|수진|지은|유나|서연|민지|하은/.test(sp)) return 'F';
      if (/민준|준호|성민|현우|지훈|재현|태양|동현|男/.test(sp)) return 'M';
    }
    if (/수진|지은|유나|서연|민지|하은|소영|예진|지원/.test(sp)) return 'F';
    return idx % 2 === 0 ? 'F' : 'M';
  }
  KO.speakerGender = guessGender;

  function koreanStems(w) {
    const s = KO.surface(w).trim();
    const out = new Set([s]);
    if (s.endsWith('하다') && s.length > 2) {
      const noun = s.slice(0, -2);
      out.add(noun);
      out.add(noun + '해');
      out.add(noun + '했');
      out.add(noun + '할');
      out.add(noun + '한');
    }
    if (s.endsWith('다') && s.length >= 2) {
      const st = s.slice(0, -1);
      out.add(st);
      if (st.endsWith('리') && st.length >= 2) out.add(st.slice(0, -1) + '려');
      if (st.endsWith('르') && st.length >= 2) out.add(st.slice(0, -2) + '러');
      const last = KO.ko.decompose(st[st.length - 1]);
      if (last) {
        const pfx = st.slice(0, -1);
        if (last.jong === 'ㅂ') {
          out.add(pfx + KO.ko.compose(last.cho, last.jung, '') + '워');
          out.add(pfx + KO.ko.compose(last.cho, last.jung, '') + '운');
        }
        if (last.jong === 'ㄷ') out.add(pfx + KO.ko.compose(last.cho, last.jung, 'ㄹ'));
        if (last.jong === 'ㄹ') out.add(pfx + KO.ko.compose(last.cho, last.jung, ''));
        if (!last.jong && last.jung === 'ㅡ') {
          out.add(pfx + KO.ko.compose(last.cho, 'ㅓ', ''));
          out.add(pfx + KO.ko.compose(last.cho, 'ㅏ', ''));
        }
        if (!last.jong && last.jung === 'ㅣ') out.add(pfx + KO.ko.compose(last.cho, 'ㅕ', ''));
        if (!last.jong && last.jung === 'ㅜ') out.add(pfx + KO.ko.compose(last.cho, 'ㅝ', ''));
        if (!last.jong && last.jung === 'ㅗ') out.add(pfx + KO.ko.compose(last.cho, 'ㅘ', ''));
      }
    }
    return Array.from(out).filter((x) => x.length >= 1);
  }

  function buildVocabMatcher(lesson) {
    const entries = [];
    for (const v of lesson.vocab || []) {
      const stems = new Set(koreanStems(v.w));
      if (v.m) stems.add(KO.surface(v.m).trim());
      entries.push({ v, stems: Array.from(stems).sort((a, b) => b.length - a.length) });
    }
    return function findVocab(wordSurface) {
      for (const e of entries) {
        for (const st of e.stems) {
          if (wordSurface === st) return e.v;
          if (st.length >= 2 && wordSurface.startsWith(st)) return e.v;
        }
      }
      return null;
    };
  }

  const RAIL_KEY = 'ko.railCollapsed';
  const railState = { level: '', q: '' };

  function isRailCollapsed() {
    try { return localStorage.getItem(RAIL_KEY) === '1'; } catch (e) { return false; }
  }
  function setRailCollapsed(v) {
    try { localStorage.setItem(RAIL_KEY, v ? '1' : '0'); } catch (e) { /* quota */ }
  }
  function nfc(s) {
    return String(s == null ? '' : s).normalize('NFC');
  }
  function filterRailLessons(all) {
    const q = nfc(railState.q.trim()).toLowerCase();
    return all.filter((x) => {
      if (railState.level && x.level !== railState.level) return false;
      if (q) {
        const hay = nfc(`${KO.surface(x.title)} ${KO.reading(x.title)} ${KO.romaji(x.title)} ${x.title_zh || ''} ${x.scene || ''} ${KO.topicLabel(x.topic)}`).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }
  function railMarksHtml(id) {
    const p = KO.lessonProg(id);
    return `${p.fav ? '<span class="ri-fav" title="已收藏">★</span>' : ''}${p.completed ? '<span class="ri-done" title="已完成">✓</span>' : ''}`;
  }
  KO.refreshRailMarks = function (id) {
    const row = qs(`.rail-item[data-id="${CSS.escape ? CSS.escape(id) : id}"]`);
    if (!row) return;
    const mk = row.querySelector('.ri-marks');
    if (mk) mk.innerHTML = railMarksHtml(id);
  };
  if (KO.completeLesson && !KO.completeLesson._railWrapped) {
    const origComplete = KO.completeLesson;
    const wrapped = function (id) {
      const r = origComplete.apply(this, arguments);
      KO.refreshRailMarks(id);
      return r;
    };
    wrapped._railWrapped = true;
    KO.completeLesson = wrapped;
  }
  function railShellHtml(lesson, all) {
    const idxAll = Math.max(0, all.findIndex((x) => x.id === lesson.id));
    return `<div class="rail-backdrop" id="railBackdrop"></div>
      <aside class="lesson-rail card" id="lessonRail" aria-label="課程列表">
        <div class="rail-hd">
          <b>📚 課程列表 <small id="railCount">${all.length}</small></b>
          <button type="button" class="icon-btn sm rail-hide-btn" id="railHideBtn" title="收合側邊列表">◀</button>
          <button type="button" class="icon-btn sm rail-close-mob" id="railCloseMob" aria-label="關閉列表">✕</button>
        </div>
        <div class="rail-lvs" id="railLvs" role="tablist" aria-label="程度篩選">
          <button type="button" class="rail-lv ${railState.level ? '' : 'active'}" data-lv="">全部</button>
          ${KO.LEVELS.map((lv) => `<button type="button" class="rail-lv ${railState.level === lv.code ? 'active' : ''}" data-lv="${esc(lv.code)}" title="${esc(lv.topik || '')}">${esc(lv.code)}</button>`).join('')}
        </div>
        <div class="rail-search-wrap">
          <input type="search" class="rail-search" id="railSearch" placeholder="搜尋韓文、羅馬拼音或中文…" value="${esc(railState.q)}" autocomplete="off">
        </div>
        <div class="rail-list" id="railList" role="navigation" aria-label="切換課程"></div>
        <div class="rail-ft" id="railFt" data-idx-all="${idxAll}"></div>
      </aside>`;
  }
  function mountRail(shell, lesson, all) {
    const listEl = qs('#railList', shell);
    const ftEl = qs('#railFt', shell);
    const cntEl = qs('#railCount', shell);
    const searchEl = qs('#railSearch', shell);
    const lvsEl = qs('#railLvs', shell);

    function renderItems(scrollActive) {
      const list = filterRailLessons(all);
      cntEl.textContent = railState.level || railState.q.trim() ? `${list.length}/${all.length}` : `${all.length}`;
      listEl.innerHTML = list.length ? list.map((x) => {
        const koSurface = nfc(KO.surface(x.title));
        return `<a class="rail-item ${x.id === lesson.id ? 'active' : ''}" href="#/lesson/${encodeURIComponent(x.id)}" data-id="${esc(x.id)}">
          <div class="ri-top">${KO.levelBadge(x.level)}<span class="ri-topic">${esc(KO.topicLabel(x.topic))}</span><span class="ri-marks">${railMarksHtml(x.id)}</span></div>
          <div class="ri-title" lang="ko">${esc(koSurface)}</div>
          <div class="ri-zh">${esc(x.title_zh || '')}</div>
        </a>`;
      }).join('') : '<div class="rail-empty">找不到符合條件的課程</div>';

      const navPool = list.some((x) => x.id === lesson.id) ? list : all;
      const pos = navPool.findIndex((x) => x.id === lesson.id);
      const prev = pos > 0 ? navPool[pos - 1] : null;
      const next = pos >= 0 && pos < navPool.length - 1 ? navPool[pos + 1] : null;
      ftEl.innerHTML = `
        ${prev ? `<a href="#/lesson/${encodeURIComponent(prev.id)}" title="${esc(prev.title_zh || nfc(KO.surface(prev.title)))}">‹ 上一課</a>` : '<span class="rail-nav-dis">‹ 上一課</span>'}
        <span>${pos >= 0 ? `${pos + 1} / ${navPool.length}` : `${navPool.length} 課`}</span>
        ${next ? `<a href="#/lesson/${encodeURIComponent(next.id)}" title="${esc(next.title_zh || nfc(KO.surface(next.title)))}">下一課 ›</a>` : '<span class="rail-nav-dis">下一課 ›</span>'}
      `;
      if (scrollActive) {
        requestAnimationFrame(() => {
          const act = listEl.querySelector('.rail-item.active');
          if (act) listEl.scrollTop = Math.max(0, act.offsetTop - listEl.clientHeight / 2 + act.offsetHeight / 2);
        });
      }
    }

    if (railState.level && !railState.q.trim() && !filterRailLessons(all).some((x) => x.id === lesson.id)) {
      railState.level = '';
      qsa('.rail-lv', lvsEl).forEach((b) => b.classList.toggle('active', !b.dataset.lv));
    }
    renderItems(true);

    lvsEl.onclick = (e) => {
      const b = e.target.closest('.rail-lv');
      if (!b) return;
      railState.level = b.dataset.lv || '';
      qsa('.rail-lv', lvsEl).forEach((x) => x.classList.toggle('active', x === b));
      renderItems(true);
    };
    searchEl.addEventListener('input', () => {
      railState.q = searchEl.value;
      renderItems(false);
    });
    searchEl.addEventListener('keydown', (e) => {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === 'Enter') {
        const first = filterRailLessons(all)[0];
        if (first) { e.preventDefault(); location.hash = `#/lesson/${encodeURIComponent(first.id)}`; }
      } else if (e.key === 'Escape') {
        if (searchEl.value) { searchEl.value = ''; railState.q = ''; renderItems(true); }
        else shell.classList.remove('rail-mob-open');
      }
    });

    const closeMob = () => shell.classList.remove('rail-mob-open');
    qs('#railBackdrop', shell).onclick = closeMob;
    qs('#railCloseMob', shell).onclick = closeMob;
    listEl.addEventListener('click', (e) => { if (e.target.closest('.rail-item')) closeMob(); });
    qs('#railHideBtn', shell).onclick = () => { setRailCollapsed(true); shell.classList.add('rail-collapsed'); };
    const expBtn = qs('#railExpandBtn', shell);
    if (expBtn) expBtn.onclick = () => { setRailCollapsed(false); shell.classList.remove('rail-collapsed'); renderItems(true); };
    const mobBtn = qs('#railOpenMob', shell);
    if (mobBtn) mobBtn.onclick = () => { shell.classList.add('rail-mob-open'); renderItems(true); };
  }

  KO.renderLesson = function (el, id, mode = 'read', startIdx = 0) {
    if (cur) { cur.stopFlag = true; cur.loopOne = false; cur.playingAll = false; }
    const lesson = KO.getLesson(id);
    if (!lesson) {
      el.innerHTML = `<div class="card center"><h2>找不到課程「${esc(id)}」</h2><p class="muted">可能已被刪除或尚未建立。</p><a class="btn primary" href="#/library">回課程庫</a></div>`;
      return;
    }
    if (!MODES.some((m) => m[0] === mode)) mode = 'read';
    KO.state.meta.lastLessonId = lesson.id;
    KO.save();

    const all = KO.allLessons();
    const idxAll = Math.max(0, all.findIndex((x) => x.id === lesson.id));
    const spOrder = [];
    lesson.lines.forEach((ln) => { if (!spOrder.includes(ln.sp)) spOrder.push(ln.sp); });
    const genders = Object.fromEntries(spOrder.map((s, i) => {
      const explicit = lesson.lines.find((ln) => ln.sp === s && ln.gender);
      return [s, explicit ? explicit.gender : guessGender(s, i)];
    }));
    const safeStart = Math.max(0, Math.min(lesson.lines.length - 1, parseInt(startIdx, 10) || 0));

    cur = { id: lesson.id, lesson, mode, startIdx: safeStart, blind: false, hlVocab: true, loopOne: false, playingAll: false, stopFlag: false, genders, findVocab: buildVocabMatcher(lesson) };
    const prog = KO.lessonProg(lesson.id);

    el.innerHTML = `
      <div class="lesson-shell ${isRailCollapsed() ? 'rail-collapsed' : ''}" id="lessonShell">
        ${railShellHtml(lesson, all)}
        <div class="lesson-main" data-lesson="${esc(lesson.id)}">
          <div class="lesson-head card">
            <div class="lh-crumb">
              <button type="button" class="btn xs rail-expand-btn" id="railExpandBtn" title="展開側邊課程列表">📚 課程列表 (${all.length})</button>
              <button type="button" class="btn xs rail-open-mob" id="railOpenMob">📚 切換課程 (${idxAll + 1}/${all.length})</button>
              <a href="#/library" class="btn ghost sm">← 課程庫</a>
              ${KO.levelBadge(lesson.level)}
              ${KO.topikChip(lesson.level)}
              <span class="chip">${esc(KO.topicLabel(lesson.topic))}</span>
              ${lesson.custom ? '<span class="chip ai">✨ 自訂／AI 課程</span>' : ''}
              ${prog.completed ? '<span class="chip ok">✓ 已完成</span>' : ''}
              <button type="button" class="btn sm ghost lh-fav-btn" id="koFavBtn">${prog.fav ? '★ 已收藏' : '☆ 收藏'}</button>
            </div>
            <h1 class="ko-txt ko-title">${KO.koHtml(lesson.title)}</h1>
            <div class="lh-sub">${esc(lesson.title_zh || '')}</div>
            <p class="lh-scene">${esc(lesson.scene || '')}</p>
          </div>
          <div class="mode-tabs" role="tablist">
            ${MODES.map(([k, ic, label]) => `
              <button class="mtab ${k === mode ? 'active' : ''}" data-mode="${k}" role="tab" aria-selected="${k === mode}">
                <span>${ic}</span><span>${label}</span>
              </button>`).join('')}
          </div>
          <div id="lessonBody"></div>
        </div>
      </div>
    `;

    mountRail(qs('#lessonShell', el), lesson, all);
    const favBtn = qs('#koFavBtn', el);
    if (favBtn) {
      favBtn.onclick = () => {
        const nextFav = !KO.lessonProg(lesson.id).fav;
        KO.markLesson(lesson.id, { fav: nextFav });
        favBtn.textContent = nextFav ? '★ 已收藏' : '☆ 收藏';
        KO.refreshRailMarks(lesson.id);
        KO.toast(nextFav ? '★ 已加入收藏' : '已取消收藏');
      };
    }

    qsa('.mtab', el).forEach((b) =>
      b.addEventListener('click', () => {
        cur.stopFlag = true;
        KO.tts.stop();
        KO.asr.stop();
        location.hash = `#/lesson/${lesson.id}/${b.dataset.mode}`;
      })
    );

    const body = qs('#lessonBody', el);
    if (mode === 'read') renderRead(body);
    else if (mode === 'words') renderWords(body);
    else KO.renderPractice(body, cur, mode);
  };

  // -------------------- 模式 1：對話聆聽 --------------------
  function renderRead(body) {
    const { lesson } = cur;
    const rate = KO.state.settings.rate || 0.95;
    const showLi = KO.state.settings.showLiaison !== false;
    const showRo = KO.state.settings.showRomaji !== false;
    const showZh = KO.state.settings.showZh !== false;

    body.innerHTML = `
      <div class="ctrl-bar card">
        <div class="ctrl-left">
          <button class="btn primary" id="btnPlayAll">▶ 播放全部</button>
          <button class="btn" id="btnStop" disabled>⏹ 停止</button>
          <div class="rate-ctl" role="group" aria-label="語速">
            <span>語速</span>
            <div class="seg" id="rateSeg">
              ${[0.6, 0.75, 0.9, 1.0, 1.15].map((r) => `<button data-r="${r}" class="${Math.abs(rate - r) < 0.04 ? 'active' : ''}">${r}×</button>`).join('')}
            </div>
          </div>
        </div>
        <div class="ctrl-right">
          <label class="chk"><input type="checkbox" id="chkBlind" ${cur.blind ? 'checked' : ''}><span>🙈 盲聽（隱藏韓文）</span></label>
          <label class="chk"><input type="checkbox" id="chkLi" ${showLi ? 'checked' : ''}><span>連音標示</span></label>
          <label class="chk"><input type="checkbox" id="chkRo" ${showRo ? 'checked' : ''}><span>羅馬拼音</span></label>
          <label class="chk"><input type="checkbox" id="chkZh" ${showZh ? 'checked' : ''}><span>中文翻譯</span></label>
          <label class="chk"><input type="checkbox" id="chkHl" ${cur.hlVocab ? 'checked' : ''}><span>標示重點單字</span></label>
          <label class="chk"><input type="checkbox" id="chkLoop" ${cur.loopOne ? 'checked' : ''}><span>🔁 單句重複</span></label>
        </div>
      </div>

      <div class="dialogue" id="dlgList">
        ${lesson.lines.map((ln, i) => lineHtml(ln, i, showLi, showRo, showZh)).join('')}
      </div>

      <div class="lesson-next-cta card">
        <div>
          <b>聽熟連音與語調了嗎？</b>
          <span class="muted">下一步用韓語跟讀或角色扮演開口練說！點對話中任一個韓文詞都能查意思、看漢字詞源並加入單字本。</span>
        </div>
        <div class="next-btns">
          <a class="btn" href="#/lesson/${lesson.id}/words">💡 看重點單字・文法</a>
          <a class="btn primary" href="#/lesson/${lesson.id}/shadow">🎙️ 進入跟讀練習 →</a>
        </div>
      </div>
    `;

    bindReadEvents(body);
  }

  function renderInteractiveKorean(raw, lineIdx, showLi) {
    const segs = KO.ko.parse(raw).segs;
    return segs.map((g) => {
      if (g.t === 'sp') return ' ';
      if (g.t === 'txt') return esc(g.s);
      const matched = cur.findVocab ? cur.findVocab(g.b) : null;
      const cls = cur.hlVocab && matched ? 'w hl' : 'w';
      const keyAttr = matched ? ` data-vkey="${esc(KO.surface(matched.w))}"` : '';
      const inner = showLi && g.r && g.r !== g.b
        ? `<ruby>${esc(g.b)}<rt>${esc(g.r)}</rt></ruby>`
        : esc(g.b);
      return `<span class="${cls}" data-w="${esc(g.b)}" data-i="${lineIdx}"${keyAttr}>${inner}</span>`;
    }).join('');
  }

  function lineHtml(ln, i, showLi, showRo, showZh) {
    const g = cur.genders[ln.sp] || 'F';
    const koContent = cur.blind
      ? `<span class="blind-mask">🙈 點此顯示韓文，或點左側 ▶ 盲聽辨音</span>`
      : renderInteractiveKorean(ln.ko, i, showLi);
    return `
      <div class="dline ${g === 'M' ? 'sp-b' : 'sp-a'}" data-idx="${i}">
        <div class="dline-left">
          <span class="sp-badge">${esc(ln.sp)}</span>
        </div>
        <div class="dl-body">
          <div class="dl-ko ko-txt" data-reveal="${i}">${koContent}</div>
          ${showRo && !cur.blind ? `<div class="dl-ro ro">${esc(KO.romaji(ln.ko))}</div>` : ''}
          ${showZh ? `<div class="dl-zh">${esc(ln.zh)}</div>` : ''}
        </div>
        <div class="dl-acts">
          <button class="icon-btn" data-say="${i}" title="播放此句">🔊</button>
          <button class="icon-btn" data-slow="${i}" title="慢速播放 (0.65×)">🐢</button>
          <button class="icon-btn" data-shadow="${i}" title="開口跟讀此句">🎙️</button>
        </div>
      </div>`;
  }

  function bindReadEvents(body) {
    const { lesson } = cur;
    const playBtn = qs('#btnPlayAll', body);
    const stopBtn = qs('#btnStop', body);

    const setRowActive = (idx) => {
      qsa('.dline', body).forEach((el, k) => el.classList.toggle('playing', k === idx));
      if (idx >= 0) {
        const row = qs(`.dline[data-idx="${idx}"]`, body);
        if (row) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    };

    const recordListen = (idx) => {
      const p = KO.lessonProg(lesson.id);
      if (!p.listened.includes(idx)) p.listened.push(idx);
      KO.bumpDay('lines', 1);
      if (p.listened.length >= lesson.lines.length) KO.completeLesson(lesson.id);
      else KO.markLesson(lesson.id, { listened: p.listened });
    };

    const speakOne = (idx, rateOverride, btn) => {
      cur.stopFlag = true;
      const ln = lesson.lines[idx];
      setRowActive(idx);
      const go = () => {
        KO.tts.speak(ln.ko, {
          gender: cur.genders[ln.sp],
          rate: rateOverride || KO.state.settings.rate,
          btn,
          onEnd: () => {
            recordListen(idx);
            if (cur.loopOne && !rateOverride && cur.mode === 'read') {
              cur.stopFlag = false;
              setTimeout(() => { if (!cur.stopFlag && cur.loopOne) go(); }, 450);
            } else {
              setRowActive(-1);
            }
          },
        });
      };
      cur.stopFlag = false;
      go();
    };

    playBtn.addEventListener('click', async () => {
      if (cur.playingAll) return;
      cur.playingAll = true;
      cur.stopFlag = false;
      playBtn.disabled = true;
      stopBtn.disabled = false;
      await KO.tts.speakSeq(
        lesson.lines.map((l) => l.ko),
        (_, idx) => {
          setRowActive(idx);
          recordListen(idx);
          return { gender: cur.genders[lesson.lines[idx].sp], rate: KO.state.settings.rate };
        },
        () => cur.stopFlag || cur.mode !== 'read'
      );
      cur.playingAll = false;
      setRowActive(-1);
      playBtn.disabled = false;
      stopBtn.disabled = true;
    });

    stopBtn.addEventListener('click', () => {
      cur.stopFlag = true;
      cur.loopOne = false;
      const lp = qs('#chkLoop', body);
      if (lp) lp.checked = false;
      KO.tts.stop();
      setRowActive(-1);
      playBtn.disabled = false;
      stopBtn.disabled = true;
    });

    qsa('#rateSeg button', body).forEach((b) =>
      b.addEventListener('click', () => {
        KO.state.settings.rate = parseFloat(b.dataset.r);
        KO.save();
        qsa('#rateSeg button', body).forEach((x) => x.classList.toggle('active', x === b));
      })
    );

    const rerenderLines = () => {
      const showLi = KO.state.settings.showLiaison !== false;
      const showRo = KO.state.settings.showRomaji !== false;
      const showZh = KO.state.settings.showZh !== false;
      qs('#dlgList', body).innerHTML = lesson.lines.map((ln, i) => lineHtml(ln, i, showLi, showRo, showZh)).join('');
      bindLineClicks(body, speakOne);
    };

    qs('#chkBlind', body).addEventListener('change', (e) => { cur.blind = e.target.checked; rerenderLines(); });
    qs('#chkLi', body).addEventListener('change', (e) => { KO.state.settings.showLiaison = e.target.checked; KO.save(); rerenderLines(); });
    qs('#chkRo', body).addEventListener('change', (e) => { KO.state.settings.showRomaji = e.target.checked; KO.save(); rerenderLines(); });
    qs('#chkZh', body).addEventListener('change', (e) => { KO.state.settings.showZh = e.target.checked; KO.save(); rerenderLines(); });
    qs('#chkHl', body).addEventListener('change', (e) => { cur.hlVocab = e.target.checked; rerenderLines(); });
    qs('#chkLoop', body).addEventListener('change', (e) => { cur.loopOne = e.target.checked; if (!cur.loopOne) cur.stopFlag = true; });

    bindLineClicks(body, speakOne);
  }

  function bindLineClicks(body, speakOne) {
    const { lesson } = cur;
    qsa('[data-say]', body).forEach((b) => b.addEventListener('click', () => speakOne(+b.dataset.say, null, b)));
    qsa('[data-slow]', body).forEach((b) => b.addEventListener('click', () => speakOne(+b.dataset.slow, 0.65, b)));
    qsa('[data-shadow]', body).forEach((b) =>
      b.addEventListener('click', () => {
        KO.tts.stop();
        location.hash = `#/lesson/${lesson.id}/shadow/${b.dataset.shadow}`;
      })
    );
    qsa('[data-reveal]', body).forEach((d) =>
      d.addEventListener('click', (e) => {
        const wEl = e.target.closest('.w');
        if (wEl) {
          e.stopPropagation();
          const vkey = wEl.dataset.vkey;
          openWordPop(vkey || wEl.dataset.w, +wEl.dataset.i);
          return;
        }
        if (d.querySelector('.blind-mask')) {
          const i = +d.dataset.reveal;
          d.innerHTML = renderInteractiveKorean(lesson.lines[i].ko, i, KO.state.settings.showLiaison !== false);
        }
      })
    );
  }

  // -------------------- 單字點查氣泡視窗 --------------------
  function openWordPop(word, lineIdx) {
    const { lesson } = cur;
    const clean = KO.surface(word).trim();
    const ln = lesson.lines[lineIdx] || lesson.lines[0];
    const fromLesson = (lesson.vocab || []).find((v) => KO.surface(v.w) === clean) || (cur.findVocab && cur.findVocab(clean));
    const fromIndex = KO.vocabIndex.get(KO.wordKey(clean));
    const info = fromLesson
      ? {
          w: KO.surface(fromLesson.w),
          ko: fromLesson.w,
          hanja: fromLesson.hanja || '',
          pos: fromLesson.pos || '',
          zh: fromLesson.zh || '',
          ex: fromLesson.ex || ln.ko,
          ex_zh: fromLesson.ex_zh || ln.zh || '',
        }
      : fromIndex
      ? { ...fromIndex }
      : { w: clean, ko: clean, hanja: '', pos: '', zh: '', ex: ln ? ln.ko : clean, ex_zh: ln ? ln.zh : '' };

    const pron = KO.reading(info.ko || info.w);
    const saved = KO.hasVocab(info.w);
    const root = document.getElementById('popoverRoot');
    root.innerHTML = `
      <div class="wpop-backdrop" id="wpopBg">
        <div class="wpop" role="dialog" aria-label="單字詳情">
          <div class="wpop-head">
            <b class="wpop-w ko-txt">${KO.koHtml(info.ko || info.w)}</b>
            ${info.hanja ? `<span class="hanja" title="對應繁體漢字詞源">漢字：${esc(info.hanja)}</span>` : ''}
            ${info.pos ? `<span class="chip">${esc(info.pos)}</span>` : ''}
            <button class="icon-btn" id="wpopSay" title="韓語發音">🔊</button>
            <button class="icon-btn" id="wpopSlow" title="慢速發音">🐢</button>
            <button class="icon-btn wpop-x" id="wpopClose" title="關閉">✕</button>
          </div>
          <div class="ro wpop-ro">${esc(KO.romaji(info.ko || info.w))}${pron !== info.w ? ` · 實際讀音 [${esc(pron)}]` : ''}</div>
          ${info.zh
            ? `<div class="wpop-zh">${esc(info.zh)}</div>`
            : `<label class="small muted">此詞塊不在本課重點詞表，可自行輸入中文意思加入單字本：
                 <input type="text" id="wpopCustomZh" placeholder="輸入中文解釋（選填）" class="search-in" style="margin-top:6px;width:100%">
               </label>`}
          ${info.ex ? `<div class="wpop-ex"><span class="ko-txt">${KO.koHtml(info.ex)}</span>${info.ex_zh ? `<div class="small muted">${esc(info.ex_zh)}</div>` : ''}</div>` : ''}
          <div class="wpop-acts">
            <button class="btn ${saved ? '' : 'primary'}" id="wpopAdd">
              ${saved ? '✓ 已在單字本（點此移除）' : '＋ 加入我的單字本'}
            </button>
          </div>
        </div>
      </div>`;

    KO.tts.speak(info.w, { rate: 0.92 });
    qs('#wpopSay', root).onclick = (e) => KO.tts.speak(info.w, { rate: 0.92, btn: e.currentTarget });
    qs('#wpopSlow', root).onclick = (e) => KO.tts.speak(info.w, { rate: 0.65, btn: e.currentTarget });
    const close = () => { root.innerHTML = ''; };
    qs('#wpopClose', root).onclick = close;
    qs('#wpopBg', root).onclick = (e) => { if (e.target.id === 'wpopBg') close(); };
    qs('#wpopAdd', root).onclick = () => {
      if (KO.hasVocab(info.w)) {
        KO.removeVocab(info.w);
        KO.toast(`已從單字本移除「${info.w}」`);
      } else {
        const customZh = qs('#wpopCustomZh', root)?.value.trim() || '';
        KO.addVocab({ ...info, zh: info.zh || customZh || '（待補中文）', lessonId: lesson.id, level: lesson.level });
        KO.toast(`已加入單字本：${info.w}`);
      }
      close();
    };
  }
  KO.openWordPop = openWordPop;

  // -------------------- 模式 6：重點單字・文法・韓國文化小提醒 --------------------
  function renderWords(body) {
    const { lesson } = cur;
    const grammar = lesson.grammar || [];
    body.innerHTML = `
      <div class="card">
        <div class="vocab-head">
          <div>
            <h2>本課重點單字（${(lesson.vocab || []).length}）</h2>
            <p class="muted">點擊 🔊 聽標準發音與連音，漢字詞標示對應繁體漢字，一鍵收入個人單字本排入 SM-2 間隔複習。</p>
          </div>
          <button class="btn primary" id="btnAddAll">＋ 全部加入單字本</button>
        </div>
        <div class="vocab-cards">
          ${(lesson.vocab || []).map((v, i) => {
            const surface = KO.surface(v.w);
            const pron = KO.reading(v.w);
            const saved = KO.hasVocab(surface);
            return `
              <div class="vcard">
                <div class="vc-top">
                  <b class="ko-txt">${KO.koHtml(v.w)}</b>
                  ${v.hanja ? `<span class="hanja" title="對應繁體漢字詞源">漢字：${esc(v.hanja)}</span>` : ''}
                  ${v.pos ? `<span class="chip">${esc(v.pos)}</span>` : ''}
                  <button class="icon-btn" data-vsay="${i}" title="發音">🔊</button>
                </div>
                <div class="ro">${esc(KO.romaji(v.w))}${pron !== surface ? ` · [${esc(pron)}]` : ''}</div>
                <div class="vc-zh">${esc(v.zh)}</div>
                <div class="vc-ex ko-txt">${KO.koHtml(v.ex || '')}</div>
                ${v.ex_zh ? `<div class="small muted">${esc(v.ex_zh)}</div>` : ''}
                <button class="btn sm ${saved ? '' : 'primary'}" data-vadd="${i}">
                  ${saved ? '✓ 已收錄' : '＋ 加入單字本'}
                </button>
              </div>`;
          }).join('')}
        </div>
      </div>

      ${grammar.length ? `
        <div class="card">
          <h2>📐 本課核心文法與句型（${grammar.length}）</h2>
          <div class="gram-list">
            ${grammar.map((g, gi) => {
              const pt = g.pt || g.p || '';
              const explain = g.exp || g.explain || '';
              const exList = Array.isArray(g.ex)
                ? g.ex
                : (g.ex ? [{ ko: g.ex, zh: g.ex_zh || '' }] : []);
              return `
                <div class="gram">
                  <div class="gram-hd">
                    <span class="gram-n">${gi + 1}</span>
                    <b class="ko-txt gram-pt">${KO.koHtml(pt)}</b>
                  </div>
                  ${g.zh ? `<div class="gram-zh">${esc(g.zh)}</div>` : ''}
                  <p class="gram-exp">${esc(explain)}</p>
                  <div class="gram-exs">
                    ${exList.map((x) => `
                      <div class="gram-ex">
                        <button class="icon-btn" data-gsay="${esc(KO.surface(x.ko || ''))}" title="播放例句">🔊</button>
                        <div>
                          <div class="ko-txt">${KO.koHtml(x.ko || '')}</div>
                          <div class="ro">${esc(KO.romaji(x.ko || ''))}</div>
                          <div class="small muted">${esc(x.zh || '')}</div>
                        </div>
                      </div>`).join('')}
                  </div>
                </div>`;
            }).join('')}
          </div>
        </div>` : ''}

      ${lesson.tip ? `
        <div class="card tip-card">
          <h3>🎎 韓國文化・敬語與發音小提醒</h3>
          <p>${esc(lesson.tip)}</p>
        </div>` : ''}
    `;

    qsa('[data-vsay]', body).forEach((b) =>
      b.addEventListener('click', () => {
        const v = lesson.vocab[+b.dataset.vsay];
        KO.tts.speak(KO.surface(v.w), { rate: 0.9, btn: b });
      })
    );
    qsa('[data-gsay]', body).forEach((b) =>
      b.addEventListener('click', () => KO.tts.speak(b.dataset.gsay, { rate: 0.9, btn: b }))
    );
    qsa('[data-vadd]', body).forEach((b) =>
      b.addEventListener('click', () => {
        const v = lesson.vocab[+b.dataset.vadd];
        const surface = KO.surface(v.w);
        if (KO.hasVocab(surface)) {
          KO.removeVocab(surface);
          b.textContent = '＋ 加入單字本';
          b.classList.add('primary');
        } else {
          KO.addVocab({ ...v, w: surface, ko: v.w, lessonId: lesson.id, level: lesson.level });
          b.textContent = '✓ 已收錄';
          b.classList.remove('primary');
          KO.toast(`已加入：${surface}`);
        }
      })
    );
    qs('#btnAddAll', body).addEventListener('click', () => {
      let n = 0;
      for (const v of lesson.vocab || []) {
        const surface = KO.surface(v.w);
        if (!KO.hasVocab(surface)) {
          KO.addVocab({ ...v, w: surface, ko: v.w, lessonId: lesson.id, level: lesson.level });
          n++;
        }
      }
      KO.toast(n ? `已新增 ${n} 個韓文單字到單字本` : '本課單字都已在單字本中');
      renderWords(body);
    });
  }
})();

</script>
<script>/* /js/practice.js */
/* 課程練習模式：口說跟讀（Shadowing）、角色扮演（Role-play）、韓文／羅馬拼音聽寫（Dictation）、理解測驗（Quiz） */
(function () {
  'use strict';
  const KO = (window.KO = window.KO || {});
  const { esc, qs, qsa } = KO;

  KO.renderPractice = function (body, ctx, mode) {
    if (mode === 'shadow') renderShadow(body, ctx);
    else if (mode === 'role') renderRole(body, ctx);
    else if (mode === 'dict') renderDict(body, ctx);
    else if (mode === 'quiz') renderQuiz(body, ctx);
  };

  // ==================== 模式 2：口說跟讀 ====================
  function renderShadow(body, ctx) {
    const { lesson, genders } = ctx;
    const prog = KO.lessonProg(lesson.id);
    let idx = Math.max(0, Math.min(lesson.lines.length - 1, ctx.startIdx || 0));
    let recUrl = null;
    let listening = false;
    let recHandle = null;
    let asrHandle = null;

    function draw() {
      const ln = lesson.lines[idx];
      const shadowedMap = prog.shadowed || {};
      const best = shadowedMap[idx] || 0;
      body.innerHTML = `
        <div class="card shadow-card">
          <div class="prac-prog">
            <span>第 <b>${idx + 1}</b> / ${lesson.lines.length} 句 ${best ? `・最高 <b>${best}%</b>` : ''}</span>
            <div class="pbar"><i style="width:${Math.round(((idx + 1) / lesson.lines.length) * 100)}%"></i></div>
          </div>
          <div class="sh-jumps" role="navigation" aria-label="快速切換句子">
            ${lesson.lines.map((_, k) => {
              const s = shadowedMap[k];
              const tier = s == null ? '' : s >= 80 ? 'ok' : s >= 55 ? 'mid' : 'low';
              return `<button type="button" class="sh-jump ${k === idx ? 'cur' : ''} ${tier}" data-j="${k}" title="跳到第 ${k + 1} 句">${k + 1}</button>`;
            }).join('')}
          </div>

          <div class="sh-target">
            <span class="sh-sp">${esc(ln.sp)}</span>
            <div class="sh-ko ko-txt">${KO.koHtml(ln.ko)}</div>
            <div class="ro">${esc(KO.romaji(ln.ko))}</div>
            <div class="sh-zh">${esc(ln.zh)}</div>
          </div>

          <div class="sh-PromptBtns">
            <button class="btn" id="shListen">🔊 先聽示範</button>
            <button class="btn" id="shSlow">🐢 慢速 0.65×</button>
            ${recUrl ? `<button class="btn" id="shPlayMine">▶️ 聽自己的錄音</button>` : ''}
          </div>

          <div class="sh-mic-row">
            ${KO.asr.supported ? `
              <button class="btn primary lg mic-btn" id="shMic">
                🎙️ 按一下開始唸韓文（唸完自動評分）
              </button>` : `
              <div class="warn-box">
                此瀏覽器不支援即時韓語語音辨識（建議使用 Chrome 或 Edge）。您仍可使用下方錄音自我對照，或直接輸入剛才唸出的韓文檢查：
                <div style="display:flex;gap:8px;margin-top:8px">
                  <input id="shManual" class="search-in ko-txt" style="flex:1" placeholder="輸入韓文或羅馬拼音自我檢測…">
                  <button class="btn primary" id="shManualBtn">比對</button>
                </div>
              </div>`}
            ${!KO.asr.supported && KO.rec.supported ? `<button class="btn" id="shRecOnly">⏺ 僅錄音重播</button>` : ''}
          </div>

          <div id="shLive" class="sh-live muted"></div>
          <div id="shResult"></div>

          <div class="sh-nav">
            <button class="btn" id="shPrev" ${idx === 0 ? 'disabled' : ''}>← 上一句</button>
            <button class="btn primary" id="shNext">${idx === lesson.lines.length - 1 ? '完成跟讀 → 角色扮演' : '下一句 →'}</button>
          </div>
        </div>
      `;

      qs('#shListen', body).onclick = (e) =>
        KO.tts.speak(ln.ko, { gender: genders[ln.sp], btn: e.currentTarget });
      qs('#shSlow', body).onclick = (e) =>
        KO.tts.speak(ln.ko, { gender: genders[ln.sp], rate: 0.65, btn: e.currentTarget });
      if (recUrl && qs('#shPlayMine', body)) {
        qs('#shPlayMine', body).onclick = (e) => KO.playUrl(recUrl, e.currentTarget);
      }

      const showResult = (heard) => {
        const useRomaji = /[a-z]/i.test(heard) && !KO.ko.hasHangul(heard);
        const res = KO.score(ln.ko, heard, { romaji: useRomaji });
        const [msg, tier] = KO.scoreLabel(res.pct);
        const shadowed = { ...(prog.shadowed || {}) };
        shadowed[idx] = Math.max(shadowed[idx] || 0, res.pct);
        prog.shadowed = shadowed;
        KO.bumpDay('lines', 1);
        KO.markLesson(lesson.id, { shadowed });
        if (Object.keys(shadowed).length >= Math.ceil(lesson.lines.length * 0.6)) KO.completeLesson(lesson.id);

        const missed = KO.missedOf(res.items);
        qs('#shResult', body).innerHTML = `
          <div class="sh-result">
            <div class="score-head">
              <div class="score-num ${tier}">${res.pct}%</div>
              <div>
                <b>${msg}</b>
                <div class="small muted">辨識結果：<span class="ko-txt">${esc(res.heard || '（未偵測到語音）')}</span></div>
              </div>
            </div>
            <div class="scored-line">${KO.scoredHtml(res.items)}</div>
            <div class="small muted">綠＝完全正確・藍＝連音發音一致・黃＝接近・紅底線＝漏讀（點下方詞可單獨慢速練發音）</div>
            ${missed.length ? `<div class="missed-row" style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${missed.map((w) => `<button class="btn sm" data-mw="${esc(w)}">🔊 <span class="ko-txt">${esc(w)}</span></button>`).join('')}</div>` : ''}
          </div>`;
        qsa('[data-mw]', body).forEach((b) =>
          b.addEventListener('click', () => KO.tts.speak(b.dataset.mw, { rate: 0.75, btn: b }))
        );
      };

      const micBtn = qs('#shMic', body);
      if (micBtn) {
        micBtn.onclick = async () => {
          if (listening) {
            listening = false;
            asrHandle && asrHandle.stop();
            return;
          }
          listening = true;
          micBtn.classList.add('recording');
          micBtn.textContent = '⏹ 正在聆聽韓語… 唸完請點一下結束';
          qs('#shLive', body).textContent = '請開始用韓語朗讀上方句子…';
          if (KO.rec.supported) {
            try { recHandle = await KO.rec.start(); } catch { recHandle = null; }
          }
          asrHandle = KO.asr.listen({
            lang: 'ko-KR',
            onInterim: (t) => { qs('#shLive', body).textContent = `即時辨識：${t}`; },
            onFinal: async (t) => {
              listening = false;
              micBtn.classList.remove('recording');
              micBtn.textContent = '🎙️ 再唸一次';
              qs('#shLive', body).textContent = '';
              if (recHandle) {
                try {
                  if (recUrl) URL.revokeObjectURL(recUrl);
                  recUrl = await recHandle.stop();
                } catch {}
                recHandle = null;
              }
              showResult(t);
              if (recUrl && !qs('#shPlayMine', body)) {
                const pb = document.createElement('button');
                pb.className = 'btn';
                pb.id = 'shPlayMine';
                pb.textContent = '▶️ 聽自己的錄音';
                pb.onclick = (e) => KO.playUrl(recUrl, e.currentTarget);
                qs('.sh-PromptBtns', body).appendChild(pb);
              }
            },
            onError: async (err) => {
              listening = false;
              micBtn.classList.remove('recording');
              micBtn.textContent = '🎙️ 按一下開始唸韓文';
              if (recHandle) { try { await recHandle.stop(); } catch {} recHandle = null; }
              const tip = err === 'not-allowed' ? '麥克風權限被拒，請在瀏覽器網址列允許麥克風存取' : err === 'no-speech' ? '沒有偵測到聲音，請靠近麥克風再試一次' : `語音辨識中斷（${err}）`;
              qs('#shLive', body).textContent = tip;
            },
          });
        };
      }

      const manBtn = qs('#shManualBtn', body);
      if (manBtn) manBtn.onclick = () => showResult(qs('#shManual', body).value);

      const recOnly = qs('#shRecOnly', body);
      if (recOnly) {
        let h = null;
        recOnly.onclick = async () => {
          if (!h) {
            try {
              h = await KO.rec.start();
              recOnly.textContent = '⏹ 停止錄音';
            } catch { KO.toast('無法啟用麥克風'); }
          } else {
            recUrl = await h.stop();
            h = null;
            draw();
          }
        };
      }

      qsa('[data-j]', body).forEach((b) =>
        b.addEventListener('click', () => {
          KO.tts.stop();
          KO.asr.stop();
          idx = +b.dataset.j;
          draw();
        })
      );
      qs('#shPrev', body).onclick = () => { KO.tts.stop(); KO.asr.stop(); idx--; draw(); };
      qs('#shNext', body).onclick = () => {
        KO.tts.stop(); KO.asr.stop();
        if (idx < lesson.lines.length - 1) { idx++; draw(); }
        else location.hash = `#/lesson/${lesson.id}/role`;
      };
    }

    draw();
  }

  // ==================== 模式 3：角色扮演（每句右側直接開口說韓語＋可選從頭自動對話） ====================
  function renderRole(body, ctx) {
    const { lesson, genders } = ctx;
    const speakers = [];
    lesson.lines.forEach((l) => { if (!speakers.includes(l.sp)) speakers.push(l.sp); });
    let myRole = speakers[1] || speakers[0];
    let hidePrompt = false;
    let autoRunning = false;
    let autoStep = -1;
    let recIdx = -1;
    let activeAsr = null;
    let activeRec = null;
    let scores = {};
    let scoredItems = {};
    let heardText = {};
    let revealed = {};
    let recUrls = {};
    let finishedBanner = false;

    function stopActiveMedia() {
      KO.tts.stop();
      if (activeAsr) {
        const h = activeAsr;
        activeAsr = null;
        try { h.stop(); } catch {}
      } else {
        KO.asr.stop();
      }
      if (activeRec) {
        const r = activeRec;
        activeRec = null;
        try { r.stop(); } catch {}
      }
      recIdx = -1;
    }

    function updateProgressIfReady(forceFinish) {
      const myIndices = lesson.lines.map((l, i) => (l.sp === myRole ? i : -1)).filter((i) => i >= 0);
      const doneVals = myIndices.map((i) => scores[i]).filter((v) => v != null);
      if (!doneVals.length && !forceFinish) return null;
      const avg = doneVals.length ? Math.round(doneVals.reduce((a, b) => a + b, 0) / doneVals.length) : 100;
      if (doneVals.length >= myIndices.length || forceFinish) {
        const p = KO.lessonProg(lesson.id);
        KO.markLesson(lesson.id, { roleBest: Math.max(p.roleBest || 0, avg) });
        KO.completeLesson(lesson.id);
        finishedBanner = true;
      }
      return avg;
    }

    function draw() {
      if (!document.body.contains(body)) {
        autoRunning = false;
        stopActiveMedia();
        return;
      }
      const p = KO.lessonProg(lesson.id);
      const myIndices = lesson.lines.map((l, i) => (l.sp === myRole ? i : -1)).filter((i) => i >= 0);
      const doneVals = myIndices.map((i) => scores[i]).filter((v) => v != null);
      const avg = doneVals.length ? Math.round(doneVals.reduce((a, b) => a + b, 0) / doneVals.length) : null;

      body.innerHTML = `
        <div class="card role-ctrl-card">
          <div class="role-pick">
            <div class="role-seg-wrap">
              <b>扮演角色：</b>
              <div class="seg" id="roleSeg">
                ${speakers.map((s) => {
                  const cnt = lesson.lines.filter((l) => l.sp === s).length;
                  return `<button type="button" data-s="${esc(s)}" class="${s === myRole ? 'active' : ''}">${esc(s)}（${cnt}句）</button>`;
                }).join('')}
              </div>
            </div>
            <label class="chk"><input type="checkbox" id="roleHide" ${hidePrompt ? 'checked' : ''}><span>遮住我的韓文台詞（只看中文提示說韓語）</span></label>
            <div class="role-top-btns">
              <button type="button" class="btn ${autoRunning ? '' : 'primary'}" id="roleAuto">
                ${autoRunning ? '⏹ 停止自動對話' : '▶ 從頭自動對話'}
              </button>
              <button type="button" class="btn" id="roleSwapTop" title="交換扮演另一個角色">🔄 換角色</button>
            </div>
          </div>
          <div class="role-subbar small muted">
            <span>💡 直接點任一句右側「<b>🎙️ 按一下開始說韓語</b>」即可開口練習，不必往下拉；也可點「從頭自動對話」讓電腦依序接話。</span>
            <span>已練 <b>${doneVals.length}</b> / ${myIndices.length} 句${avg != null ? ` · 本輪平均 <b>${avg}%</b>` : ''}${p.roleBest ? ` · 最佳 <b>${p.roleBest}%</b>` : ''}</span>
          </div>
        </div>

        ${finishedBanner ? `
          <div class="card role-done-banner" id="roleDoneBanner">
            <div class="role-done-left">
              <span class="big-emo" style="font-size:34px">🎭</span>
              <div>
                <b>角色扮演完成！平均流暢度 ${avg != null ? avg : 100}%</b>
                <div class="small muted">隨時可重唸任一句刷新分數，或換另一個角色再練一輪。</div>
              </div>
            </div>
            <div class="role-done-acts">
              <button type="button" class="btn" id="roleReplay">↻ 重練一輪</button>
              <button type="button" class="btn" id="roleSwapBanner">🔄 交換角色</button>
              <a class="btn primary" href="#/lesson/${lesson.id}/dict">✍️ 進入聽寫練習 →</a>
            </div>
          </div>
        ` : ''}

        <div class="role-stage" id="roleStage">
          ${lesson.lines.map((ln, i) => {
            const mine = ln.sp === myRole;
            const active = autoRunning && i === autoStep;
            const isRec = recIdx === i;
            const sc = scores[i];
            const done = sc != null || (autoRunning && i < autoStep);
            const masked = mine && hidePrompt && sc == null && !revealed[i];
            const tier = sc == null ? '' : sc >= 80 ? 'great' : sc >= 55 ? 'good' : 'try';
            return `
              <div class="rbub ${mine ? 'mine' : 'theirs'} ${active ? 'cur' : ''} ${done ? 'done' : ''} ${isRec ? 'recording-row' : ''}" data-ri="${i}">
                <div class="rbub-row">
                  <div class="rbub-main">
                    <div class="rb-who-row">
                      <span class="rb-who">${esc(ln.sp)} ${mine ? '（你）' : '（對方）'}</span>
                      ${active ? `<span class="rb-turn-pill">${mine ? '👉 輪到你了' : '🔊 對方說話中…'}</span>` : ''}
                      ${sc != null ? `<span class="rb-score-pill ${tier}">口說契合度 ${sc}%</span>` : ''}
                    </div>
                    <div class="rb-ko ko-txt">
                      ${scoredItems[i]
                        ? `<div class="scored-line rb-scored">${KO.scoredHtml(scoredItems[i])}</div>`
                        : masked
                        ? `<span class="rb-mask-txt muted">🙈 已遮住韓文台詞，請看下方中文意思直接說韓語！</span> <button type="button" class="btn sm ghost" data-rpeek="${i}">👁 看韓文提示</button>`
                        : KO.koHtml(ln.ko)}
                    </div>
                    ${masked ? '' : `<div class="ro">${esc(KO.romaji(ln.ko))}</div>`}
                    <div class="rb-zh">${esc(ln.zh)}</div>
                    ${heardText[i] ? `<div class="small muted rb-heard">🎧 辨識：<span class="ko-txt">${esc(heardText[i])}</span></div>` : ''}
                    <div class="rb-live small" data-rlive="${i}">${isRec ? '🎙️ 正在聆聽韓語… 說完請點右側「⏹ 說完點此」' : ''}</div>
                  </div>
                  <div class="rbub-acts">
                    ${mine ? `
                      ${KO.asr.supported ? `
                        <button type="button" class="btn primary mic-btn rb-mic-btn ${isRec ? 'recording' : ''}" data-rmic="${i}">
                          ${isRec ? '⏹ 說完點此' : sc != null ? '🎙️ 再說一次' : '🎙️ 按一下開始說韓語'}
                        </button>
                      ` : `
                        ${KO.rec.supported ? `<button type="button" class="btn sm ${isRec ? 'recording mic-btn' : ''}" data-rrec="${i}">${isRec ? '⏹ 停止錄音' : '⏺ 錄音'}</button>` : ''}
                        <button type="button" class="btn primary sm" data-rdone="${i}">${sc != null ? '✓ 已唸過' : '✓ 我唸過了'}</button>
                      `}
                      <button type="button" class="btn sm" data-rhint="${i}" title="聽標準韓語示範">🔊 聽示範</button>
                      <button type="button" class="icon-btn" data-rslow="${i}" title="慢速播放 (0.65×)">🐢</button>
                      ${recUrls[i] ? `<button type="button" class="btn sm" data-rmine="${i}" title="聽自己的錄音">▶️ 聽錄音</button>` : ''}
                      ${active ? `<button type="button" class="btn sm" data-rpass="${i}">下一句 →</button>` : ''}
                    ` : `
                      <button type="button" class="btn sm" data-rhint="${i}" title="播放對方台詞">🔊 播放</button>
                      <button type="button" class="icon-btn" data-rslow="${i}" title="慢速播放 (0.65×)">🐢</button>
                      ${active ? `<button type="button" class="btn sm" data-rskip="${i}">跳過 →</button>` : ''}
                    `}
                  </div>
                </div>
              </div>`;
          }).join('')}
        </div>
      `;

      bindRoleEvents();
    }

    function resetSession(newRole) {
      autoRunning = false;
      autoStep = -1;
      stopActiveMedia();
      if (newRole) myRole = newRole;
      scores = {};
      scoredItems = {};
      heardText = {};
      revealed = {};
      finishedBanner = false;
    }

    function advanceAuto(nextStep) {
      if (!autoRunning || !document.body.contains(body)) return;
      autoStep = nextStep;
      if (autoStep >= lesson.lines.length) {
        autoRunning = false;
        autoStep = -1;
        updateProgressIfReady(true);
        draw();
        const banner = qs('#roleDoneBanner', body);
        if (banner) banner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        return;
      }
      draw();
      const row = qs(`.rbub[data-ri="${autoStep}"]`, body);
      if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const ln = lesson.lines[autoStep];
      if (ln.sp !== myRole) {
        const curStep = autoStep;
        KO.tts.speak(ln.ko, {
          gender: genders[ln.sp],
          onEnd: () => {
            if (autoRunning && autoStep === curStep) advanceAuto(curStep + 1);
          },
        });
      }
    }

    async function toggleMicForLine(i) {
      if (recIdx === i && activeAsr) {
        activeAsr.stop();
        return;
      }
      stopActiveMedia();
      recIdx = i;
      draw();
      const ln = lesson.lines[i];
      if (KO.rec.supported) {
        try { activeRec = await KO.rec.start(); } catch { activeRec = null; }
      }
      const mySessionIdx = i;
      activeAsr = KO.asr.listen({
        lang: 'ko-KR',
        onInterim: (t) => {
          const liveEl = qs(`[data-rlive="${mySessionIdx}"]`, body);
          if (liveEl) liveEl.textContent = `🎙️ 即時辨識：${t}`;
        },
        onFinal: async (t) => {
          activeAsr = null;
          recIdx = -1;
          if (activeRec) {
            try {
              if (recUrls[mySessionIdx]) URL.revokeObjectURL(recUrls[mySessionIdx]);
              recUrls[mySessionIdx] = await activeRec.stop();
            } catch {}
            activeRec = null;
          }
          const res = KO.score(ln.ko, t);
          scores[mySessionIdx] = res.pct;
          scoredItems[mySessionIdx] = res.items;
          heardText[mySessionIdx] = res.heard || t || '（未偵測到語音）';
          revealed[mySessionIdx] = true;
          KO.bumpDay('lines', 1);
          updateProgressIfReady(false);
          draw();
          if (autoRunning && autoStep === mySessionIdx) {
            setTimeout(() => {
              if (autoRunning && autoStep === mySessionIdx) advanceAuto(mySessionIdx + 1);
            }, 700);
          }
        },
        onError: async (err) => {
          activeAsr = null;
          recIdx = -1;
          if (activeRec) {
            try { await activeRec.stop(); } catch {}
            activeRec = null;
          }
          draw();
          const liveEl = qs(`[data-rlive="${mySessionIdx}"]`, body);
          const tip = err === 'not-allowed'
            ? '⚠️ 麥克風權限被拒，請在瀏覽器網址列允許麥克風存取'
            : err === 'no-speech'
            ? '⚠️ 沒有偵測到聲音，請靠近麥克風再試一次'
            : `⚠️ 語音辨識中斷（${err}），請再按一次`;
          if (liveEl) liveEl.textContent = tip;
        },
      });
    }

    function bindRoleEvents() {
      qsa('#roleSeg button', body).forEach((b) =>
        b.addEventListener('click', () => {
          resetSession(b.dataset.s);
          draw();
        })
      );
      qs('#roleHide', body).onchange = (e) => {
        hidePrompt = e.target.checked;
        draw();
      };
      qs('#roleAuto', body).onclick = () => {
        if (autoRunning) {
          autoRunning = false;
          autoStep = -1;
          stopActiveMedia();
          draw();
        } else {
          stopActiveMedia();
          finishedBanner = false;
          autoRunning = true;
          advanceAuto(0);
        }
      };
      const swapRole = () => {
        const next = speakers.find((s) => s !== myRole) || speakers[0];
        resetSession(next);
        draw();
      };
      qs('#roleSwapTop', body).onclick = swapRole;
      const swapB = qs('#roleSwapBanner', body);
      if (swapB) swapB.onclick = swapRole;
      const repB = qs('#roleReplay', body);
      if (repB) {
        repB.onclick = () => {
          resetSession(myRole);
          autoRunning = true;
          advanceAuto(0);
        };
      }

      qsa('[data-rpeek]', body).forEach((b) =>
        b.addEventListener('click', () => {
          revealed[+b.dataset.rpeek] = true;
          draw();
        })
      );
      qsa('[data-rhint]', body).forEach((b) =>
        b.addEventListener('click', () => {
          const i = +b.dataset.rhint;
          const ln = lesson.lines[i];
          KO.tts.speak(ln.ko, { gender: genders[ln.sp], btn: b });
        })
      );
      qsa('[data-rslow]', body).forEach((b) =>
        b.addEventListener('click', () => {
          const i = +b.dataset.rslow;
          const ln = lesson.lines[i];
          KO.tts.speak(ln.ko, { gender: genders[ln.sp], rate: 0.65, btn: b });
        })
      );
      qsa('[data-rmine]', body).forEach((b) =>
        b.addEventListener('click', () => {
          const url = recUrls[+b.dataset.rmine];
          if (url) KO.playUrl(url, b);
        })
      );
      qsa('[data-rmic]', body).forEach((b) =>
        b.addEventListener('click', () => toggleMicForLine(+b.dataset.rmic))
      );
      qsa('[data-rdone]', body).forEach((b) =>
        b.addEventListener('click', () => {
          const i = +b.dataset.rdone;
          scores[i] = scores[i] ?? 85;
          revealed[i] = true;
          KO.bumpDay('lines', 1);
          updateProgressIfReady(false);
          if (autoRunning && autoStep === i) advanceAuto(i + 1);
          else draw();
        })
      );
      qsa('[data-rrec]', body).forEach((b) =>
        b.addEventListener('click', async () => {
          const i = +b.dataset.rrec;
          if (recIdx === i && activeRec) {
            try {
              if (recUrls[i]) URL.revokeObjectURL(recUrls[i]);
              recUrls[i] = await activeRec.stop();
            } catch {}
            activeRec = null;
            recIdx = -1;
            draw();
            return;
          }
          stopActiveMedia();
          try {
            activeRec = await KO.rec.start();
            recIdx = i;
            draw();
          } catch {
            KO.toast('無法啟用麥克風');
          }
        })
      );
      qsa('[data-rpass]', body).forEach((b) =>
        b.addEventListener('click', () => {
          const i = +b.dataset.rpass;
          stopActiveMedia();
          scores[i] = scores[i] ?? 80;
          revealed[i] = true;
          KO.bumpDay('lines', 1);
          updateProgressIfReady(false);
          advanceAuto(i + 1);
        })
      );
      qsa('[data-rskip]', body).forEach((b) =>
        b.addEventListener('click', () => {
          const i = +b.dataset.rskip;
          KO.tts.stop();
          advanceAuto(i + 1);
        })
      );
    }

    draw();
  }

  // ==================== 模式 4：聽寫練習（韓文與羅馬拼音皆可） ====================
  function renderDict(body, ctx) {
    const { lesson, genders } = ctx;
    let idx = 0;
    let hintLv = 0;
    let useRomaji = false;
    const results = {};

    function draw() {
      const ln = lesson.lines[idx];
      const toks = KO.ko.tokens(ln.ko).filter((t) => !KO.ko.PUNCT_RE.test(t.surface));
      const hint = hintLv === 0 ? '' : toks
        .map((t, k) => {
          const w = useRomaji ? KO.ko.hangulToRomaji(t.reading) : t.surface;
          if (hintLv >= 2 && k % 2 === 0) return w;
          const first = Array.from(w)[0] || '';
          return first + '＿'.repeat(Math.max(1, Array.from(w).length - 1));
        })
        .join(' ');

      body.innerHTML = `
        <div class="card">
          <div class="prac-prog">
            <span>聽寫第 <b>${idx + 1}</b> / ${lesson.lines.length} 句</span>
            <label class="chk">
              <input type="checkbox" id="dRoMode" ${useRomaji ? 'checked' : ''}>
              <span>無韓文輸入法：改用羅馬拼音作答</span>
            </label>
          </div>
          <div class="dict-audio" style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn primary" id="dPlay">🔊 播放句子</button>
            <button class="btn" id="dSlow">🐢 慢速播放</button>
            <button class="btn ghost" id="dHint">💡 提示（首字 / 半句）</button>
          </div>
          <p class="muted small">中文意思提示：${esc(ln.zh)}</p>
          ${hint ? `<div class="dict-hint ko-txt">${esc(hint)}</div>` : ''}
          <textarea id="dInput" class="dict-in" rows="2" placeholder="${useRomaji ? '聽音輸入羅馬拼音，例如：annyeonghaseyo（按 Enter 送出）' : '輸入聽到的韓文句子（按 Enter 送出檢查）…'}"></textarea>
          <div class="dict-acts" style="display:flex;gap:8px">
            <button class="btn primary" id="dCheck">✓ 檢查答案</button>
            <button class="btn ghost" id="dShow">直接看解答</button>
          </div>
          <div id="dFeedback"></div>
          <div class="sh-nav">
            <button class="btn" id="dPrev" ${idx === 0 ? 'disabled' : ''}>← 上一句</button>
            <button class="btn primary" id="dNext">${idx === lesson.lines.length - 1 ? '完成聽寫 → 理解測驗' : '下一句 →'}</button>
          </div>
        </div>
      `;

      const play = (rate, btn) => KO.tts.speak(ln.ko, { gender: genders[ln.sp], rate, btn });
      setTimeout(() => play(null, qs('#dPlay', body)), 80);

      qs('#dRoMode', body).onchange = (e) => { useRomaji = e.target.checked; draw(); };
      qs('#dPlay', body).onclick = (e) => play(null, e.currentTarget);
      qs('#dSlow', body).onclick = (e) => play(0.65, e.currentTarget);
      qs('#dHint', body).onclick = () => { hintLv = Math.min(2, hintLv + 1); draw(); };

      const check = (revealOnly) => {
        const val = revealOnly ? ln.koPlain : qs('#dInput', body).value;
        const autoRo = useRomaji || (/[a-z]/i.test(val) && !KO.ko.hasHangul(val));
        const res = KO.score(ln.ko, val, { romaji: autoRo });
        if (!revealOnly) {
          results[idx] = Math.max(results[idx] || 0, res.pct);
          const vals = Object.values(results);
          const avg = Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
          const p = KO.lessonProg(lesson.id);
          KO.markLesson(lesson.id, { dictBest: Math.max(p.dictBest || 0, avg) });
          KO.bumpDay('lines', 1);
        }
        qs('#dFeedback', body).innerHTML = `
          <div class="sh-result">
            ${revealOnly ? '' : `<div class="score-head"><div class="score-num ${res.pct >= 85 ? 'great' : res.pct >= 60 ? 'good' : 'try'}">${res.pct}%</div><b>${res.pct >= 90 ? '拼寫與聽辨完全正確！' : '對照下方標準韓文與連音讀音：'}</b></div>`}
            <div class="scored-line">${KO.scoredHtml(res.items)}</div>
            <div class="small ko-txt">標準韓文：<b>${KO.koHtml(ln.ko)}</b></div>
            <div class="ro">實際讀音：[${esc(KO.reading(ln.ko))}] · ${esc(KO.romaji(ln.ko))}</div>
          </div>`;
      };

      qs('#dCheck', body).onclick = () => check(false);
      qs('#dShow', body).onclick = () => check(true);
      qs('#dInput', body).addEventListener('keydown', (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); check(false); }
      });
      qs('#dPrev', body).onclick = () => { KO.tts.stop(); idx--; hintLv = 0; draw(); };
      qs('#dNext', body).onclick = () => {
        KO.tts.stop();
        if (idx < lesson.lines.length - 1) { idx++; hintLv = 0; draw(); }
        else location.hash = `#/lesson/${lesson.id}/quiz`;
      };
      qs('#dInput', body).focus();
    }

    draw();
  }

  // ==================== 模式 5：理解測驗 ====================
  function renderQuiz(body, ctx) {
    const { lesson } = ctx;
    const qsList = lesson.quiz || [];
    if (!qsList.length) {
      body.innerHTML = `<div class="card center"><p class="muted">本課尚無測驗題目。</p></div>`;
      return;
    }
    const picked = new Array(qsList.length).fill(-1);
    let submitted = false;
    let showHintZh = false;

    function draw() {
      let correct = 0;
      qsList.forEach((q, i) => { if (picked[i] === q.ans) correct++; });
      const pct = Math.round((correct / qsList.length) * 100);

      body.innerHTML = `
        <div class="ctrl-bar card" style="margin-bottom:12px">
          <div>
            <b>📝 對話理解測驗（共 ${qsList.length} 題）</b>
            <span class="muted small">點題目旁 🔊 可先用聽的作答</span>
          </div>
          <label class="chk"><input type="checkbox" id="qZhChk" ${showHintZh ? 'checked' : ''}><span>顯示題目與選項中文輔助</span></label>
        </div>
        <div class="quiz-wrap">
          ${qsList.map((q, qi) => `
            <div class="card qcard">
              <div style="display:flex;align-items:flex-start;gap:8px">
                <button class="icon-btn" data-qsay="${qi}" title="朗讀題目">🔊</button>
                <div style="flex:1">
                  <div class="q-num muted small">問題 ${qi + 1} / ${qsList.length}</div>
                  <h3 class="ko-txt q-q">${KO.koHtml(q.q)}</h3>
                  ${(showHintZh || submitted) && q.q_zh ? `<div class="small muted">${esc(q.q_zh)}</div>` : ''}
                </div>
              </div>
              <div class="qopts" style="margin-top:10px">
                ${q.opts.map((op, oi) => {
                  let cls = 'opt';
                  if (picked[qi] === oi) cls += ' sel';
                  if (submitted) {
                    if (oi === q.ans) cls += ' right';
                    else if (picked[qi] === oi) cls += ' wrong';
                  }
                  const ozh = (q.opts_zh || [])[oi];
                  return `<button class="${cls}" data-q="${qi}" data-o="${oi}" ${submitted ? 'disabled' : ''}>
                    <span class="opt-k">${String.fromCharCode(65 + oi)}</span>
                    <span style="flex:1">
                      <span class="ko-txt">${KO.koHtml(op)}</span>
                      ${(showHintZh || submitted) && ozh ? `<small class="opt-zh">${esc(ozh)}</small>` : ''}
                    </span>
                  </button>`;
                }).join('')}
              </div>
              ${submitted ? `<div class="q-exp ${picked[qi] === q.ans ? 'ok' : 'bad'}">
                <b>${picked[qi] === q.ans ? '✓ 答對！' : `✕ 正解為 ${String.fromCharCode(65 + q.ans)}`}</b>
                <div>${esc(q.exp || '')}</div>
              </div>` : ''}
            </div>
          `).join('')}

          <div class="card quiz-submit">
            ${submitted ? `
              <div class="score-head">
                <div class="score-num ${pct >= 80 ? 'great' : pct >= 50 ? 'good' : 'try'}">${correct} / ${qsList.length}</div>
                <div>
                  <b>得分 ${pct}% — ${pct === 100 ? '滿分通過！完全聽懂了' : pct >= 75 ? '理解度很棒！' : '建議回對話再聽一次細節'}</b>
                  <div class="small muted">本課已標記為完成，記得把生詞收進單字本排入間隔複習。</div>
                </div>
              </div>
              <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
                <button class="btn" id="qRetry">↻ 重做一次</button>
                <a class="btn" href="#/lesson/${lesson.id}/words">💡 收錄本課單字・文法</a>
                <a class="btn primary" href="#/library">📚 挑下一課 →</a>
              </div>
            ` : `
              <button class="btn primary lg" id="qSubmit" ${picked.includes(-1) ? 'disabled' : ''}>
                送出答案（已作答 ${picked.filter((x) => x >= 0).length} / ${qsList.length}）
              </button>
            `}
          </div>
        </div>
      `;

      qs('#qZhChk', body).onchange = (e) => { showHintZh = e.target.checked; draw(); };
      qsa('[data-qsay]', body).forEach((b) =>
        b.onclick = () => KO.tts.speak(KO.surface(qsList[+b.dataset.qsay].q), { rate: 0.92, btn: b })
      );
      qsa('.opt', body).forEach((b) =>
        b.addEventListener('click', () => { picked[+b.dataset.q] = +b.dataset.o; draw(); })
      );
      const sub = qs('#qSubmit', body);
      if (sub) {
        sub.onclick = () => {
          submitted = true;
          let c = 0;
          qsList.forEach((q, i) => { if (picked[i] === q.ans) c++; });
          const scorePct = Math.round((c / qsList.length) * 100);
          const p = KO.lessonProg(lesson.id);
          KO.markLesson(lesson.id, { quizBest: Math.max(p.quizBest ?? 0, scorePct) });
          KO.completeLesson(lesson.id);
          draw();
        };
      }
      const rt = qs('#qRetry', body);
      if (rt) rt.onclick = () => { picked.fill(-1); submitted = false; draw(); };
    }

    draw();
  }
})();

</script>
<script>/* /js/home.js */
/* 首頁：今日學習計畫（四十音 → 對話課程 → 單字複習）、連續天數、每日一詞、A1–C2（TOPIK 1–6級）等級總覽與新手引導 */
(function () {
  'use strict';
  const KO = (window.KO = window.KO || {});
  const { esc, qs, qsa } = KO;

  function pickWordOfDay() {
    const all = KO.wordBank.length ? KO.wordBank : Array.from(KO.vocabIndex.values());
    if (!all.length) return null;
    const seed = KO.todayKey().split('-').reduce((a, b) => a * 31 + Number(b), 7);
    return all[seed % all.length];
  }

  KO.renderHome = function (el) {
    const lessons = KO.allLessons();
    const min = KO.todayMinutes();
    const goal = KO.state.settings.goalMin || 15;
    const due = KO.dueVocab().length;
    const streak = KO.streak();
    const completedCnt = lessons.filter((l) => KO.state.lessons[l.id]?.completed).length;
    const hSt = KO.hangulStats ? KO.hangulStats('all') : { mastered: 0, total: 52, pct: 0, due: 0 };
    const nextRow = KO.nextHangulRow ? KO.nextHangulRow() : { id: 'bv1', label: 'ㅏ–ㅗ' };

    const last = KO.getLesson(KO.state.meta.lastLessonId) || lessons[0];
    const recLv = KO.state.meta.recLevel || 'A1';
    const nextInLevel =
      lessons.find((l) => l.level === recLv && !KO.state.lessons[l.id]?.completed) ||
      lessons.find((l) => !KO.state.lessons[l.id]?.completed) ||
      last;

    const wotd = pickWordOfDay();
    const remain = Math.max(0, goal - min);

    const hr = new Date().getHours();
    const greet = hr < 11 ? '안녕하세요・早安' : hr < 18 ? '안녕하세요・午安' : '안녕하세요・晚安';

    el.innerHTML = `
      <section class="hero">
        <div class="hero-main">
          <div class="hero-greet">${greet}！${streak > 0 ? `已連續學習 <b>${streak}</b> 天 🔥` : '今天開始累積你的第一天韓語紀錄 🌱'}</div>
          <h1>${remain === 0 ? '🎉 今日學習目標已達成！' : `距離今日目標還差 ${remain} 分鐘`}</h1>
          <p>從世宗大王科學設計的「한글 四十音」出發，一路銜接 TOPIK 1–6 級（CEFR A1–C2）生活會話、自動連音標示與韓語口說跟讀。</p>
          <div class="hero-acts">
            ${hSt.pct < 40 ? `<a class="btn primary lg" href="#/hangul">한 先學四十音（已熟記 ${hSt.pct}%）</a>` : ''}
            ${last ? `<a class="btn ${hSt.pct < 40 ? '' : 'primary'} lg" href="#/lesson/${esc(last.id)}">▶ 繼續：<span class="ko-txt">${esc(KO.surface(last.title))}</span></a>` : ''}
            ${due > 0 ? `<a class="btn lg" href="#/review">🔔 複習到期單字 (${due})</a>` : `<a class="btn lg" href="#/words/today">✨ 學今日新單字</a>`}
          </div>
        </div>
        <div class="hero-kpis">
          <div class="kpi"><b>${min}<small>/${goal}分</small></b><span>今日學習</span></div>
          <div class="kpi"><b>${hSt.pct}%</b><span>四十音熟記</span></div>
          <div class="kpi"><b>${completedCnt}<small>/${lessons.length}</small></b><span>完成課程</span></div>
        </div>
      </section>

      <section class="today-plan">
        <h2 class="sec-title">📋 今日三步驟建議（約 15 分鐘）</h2>
        <div class="plan-grid">
          <a class="plan-step" href="${hSt.pct >= 90 ? '#/hangul/quiz/pick' : `#/hangul/row/${esc(nextRow.id)}`}">
            <span class="ps-ic hangul-logo">한</span>
            <div class="ps-body">
              <div class="ps-tag">步驟 1 · 3 分鐘</div>
              <b>${hSt.pct >= 90 ? '四十音快問快答暖身' : `四十音逐組學：${esc(nextRow.label)}`}</b>
              <small>已熟記 ${hSt.mastered}/${hSt.total} 音${hSt.due ? `・${hSt.due} 個到期` : ''}</small>
            </div>
            <span class="ps-go">→</span>
          </a>
          <a class="plan-step" href="#/lesson/${esc(nextInLevel.id)}">
            <span class="ps-ic">🎧</span>
            <div class="ps-body">
              <div class="ps-tag">步驟 2 · 8 分鐘（${esc(nextInLevel.level)} · ${esc(KO.topikOf(nextInLevel.level))}）</div>
              <b class="ko-txt">${esc(KO.surface(nextInLevel.title))}</b>
              <small>${esc(nextInLevel.title_zh)} — 聽連音＋口說跟讀</small>
            </div>
            <span class="ps-go">→</span>
          </a>
          <a class="plan-step" href="${due > 0 ? '#/review' : '#/words/today'}">
            <span class="ps-ic">🔤</span>
            <div class="ps-body">
              <div class="ps-tag">步驟 3 · 4 分鐘</div>
              <b>${due > 0 ? `複習 ${due} 個到期韓文單字` : `學習今日 ${KO.state.settings.dailyNewWords || 10} 個新單字`}</b>
              <small>單字庫共收錄 ${KO.wordBank.length} 個 A1–C2 高頻詞彙</small>
            </div>
            <span class="ps-go">→</span>
          </a>
        </div>
      </section>

      ${wotd ? `
      <section class="card wotd">
        <div class="wotd-left">
          <span class="wotd-tag">✨ 每日一詞・오늘의 단어</span>
          <div class="wotd-word">
            <b class="ko-txt">${KO.koHtml(wotd.ko || wotd.w)}</b>
            ${wotd.hanja ? `<span class="hanja">漢字：${esc(wotd.hanja)}</span>` : ''}
            ${wotd.pos ? `<span class="chip">${esc(wotd.pos)}</span>` : ''}
            ${KO.levelBadge(wotd.level || 'A1')}
            <button class="icon-btn" id="wotdSay" title="發音">🔊</button>
          </div>
          <div class="ro">${esc(KO.romaji(wotd.ko || wotd.w))}</div>
          <div class="wotd-zh">${esc(wotd.zh)}</div>
          <div class="wotd-ex ko-txt">${KO.koHtml(wotd.ex || '')}</div>
          ${wotd.ex_zh ? `<div class="small muted">${esc(wotd.ex_zh)}</div>` : ''}
        </div>
        <div class="wotd-acts">
          <button class="btn ${KO.hasVocab(wotd.w) ? '' : 'primary'}" id="wotdAdd">
            ${KO.hasVocab(wotd.w) ? '✓ 已收錄於單字本' : '＋ 加入單字本'}
          </button>
          <a class="btn ghost" href="#/words">逛完整單字庫 →</a>
        </div>
      </section>` : ''}

      <section>
        <div class="page-head" style="margin-top:8px">
          <div>
            <h2 class="sec-title" style="margin:0">🧭 依程度挑選課程（CEFR A1–C2 ↔ TOPIK 1–6級）</h2>
            <p class="muted small">目前推薦程度：<b>${recLv}（${esc(KO.topikOf(recLv))}）</b>　<button class="link-btn" id="btnPickLv" style="border:0;background:none;color:var(--primary);font-weight:700;cursor:pointer">重新設定程度</button></p>
          </div>
          <a class="btn ghost" href="#/library">瀏覽全部 ${lessons.length} 課 →</a>
        </div>
        <div class="level-strip">
          ${KO.LEVELS.map((lv) => {
            const list = lessons.filter((l) => l.level === lv.code);
            const done = list.filter((l) => KO.state.lessons[l.id]?.completed).length;
            const pct = list.length ? Math.round((done / list.length) * 100) : 0;
            const wCnt = (KO.wordsByLevel[lv.code] || []).length;
            return `
              <a class="lv-card" href="#/library?level=${lv.code}" style="--lv:${lv.color};--lvbg:${lv.bg}">
                <div class="lv-top">
                  <span class="lv lv-${lv.code.toLowerCase()}">${lv.code}</span>
                  <span class="topik">${esc(lv.topik)}</span>
                  <span class="lv-cnt">${done}/${list.length} 課</span>
                </div>
                <b>${esc(lv.name)}</b>
                <small>${esc(lv.sub)}（單字 ${wCnt}）</small>
                <div class="lv-bar"><i style="width:${pct}%"></i></div>
              </a>`;
          }).join('')}
        </div>
      </section>
    `;

    if (wotd) {
      qs('#wotdSay', el).onclick = (e) => KO.tts.speak(wotd.w, { rate: 0.9, btn: e.currentTarget });
      qs('#wotdAdd', el).onclick = (e) => {
        if (!KO.hasVocab(wotd.w)) {
          KO.addVocab(wotd);
          e.currentTarget.textContent = '✓ 已收錄於單字本';
          e.currentTarget.classList.remove('primary');
          KO.toast(`已加入單字本：${wotd.w}`);
        }
      };
    }

    qs('#btnPickLv', el).onclick = () => openLevelModal(el);
    if (!KO.state.settings.onboarded) openLevelModal(el, true);
  };

  function openLevelModal(el, firstTime) {
    const root = document.getElementById('popoverRoot');
    root.innerHTML = `
      <div class="modal-backdrop" id="lvBg">
        <div class="modal" role="dialog" aria-label="選擇起始程度">
          <div class="modal-hd">
            <h3>${firstTime ? '👋 환영합니다！歡迎來到韓語學院，選個起點吧' : '調整推薦程度'}</h3>
            <button class="icon-btn" id="lvX">✕</button>
          </div>
          <div class="modal-bd">
            <p class="muted" style="margin-top:0">隨時都能自由切換所有四十音、A1–C2 對話課程與單字庫，這裡只決定首頁優先推薦給你的內容：</p>
            <div class="ob-choices">
              <button class="ob-btn" data-lv="HANGUL">
                <b>🔰 完全零基礎 — 從「四十音（한글）」開始</b>
                <span>還不認識母音 ㅏ·ㅓ·ㅗ·ㅜ 與子音 ㄱ·ㄴ·ㄷ，先用發音器官象形法輕鬆學會拼字！</span>
              </button>
              ${KO.LEVELS.map((l) => `
                <button class="ob-btn" data-lv="${l.code}">
                  <b>${l.code} · ${esc(l.topik)}（${esc(l.name)}）</b>
                  <span>${esc(l.sub)}</span>
                </button>`).join('')}
            </div>
          </div>
        </div>
      </div>`;
    const close = () => {
      KO.state.settings.onboarded = true;
      KO.save();
      root.innerHTML = '';
    };
