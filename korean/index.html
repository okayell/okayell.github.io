  {
    id: 'ko-s14',
    level: 'B2',
    icon: '🥬',
    title: '김장하는 날',
    zh: '醃泡菜的日子',
    tag: '溫馨',
    summary: '忙碌的上班族回鄉下和奶奶、鄰居一起醃過冬泡菜，在辛苦與歡笑中體會到泡菜裡滿滿的人情味，也學會與人分享。',
    lines: [
      { t: '십일월 말, 할머니 댁에서는 해마다 김장을 한다.', r: 'sibirwol mal, halmeoni daegeseoneun haemada gimjang-eul handa.', zh: '每年十一月底，奶奶家都會醃過冬泡菜。', p: 1 },
      { t: '올해는 회사 일로 바빴던 나도 오랜만에 시골에 내려갔다.', r: 'ollaeneun hoesa illo bappatdeon nado oraenmane sigore naeryeogatda.', zh: '今年一直忙於工作的我，也久違地回了鄉下。' },
      { t: '금요일 밤 퇴근하자마자 고속버스를 타고 네 시간을 달렸다.', r: 'geumyoil bam toegeunhajamaja gosokbeoseureul tago ne siganeul dallyeotda.', zh: '星期五晚上一下班，我就搭上客運坐了四個小時。' },
      { t: '창밖으로 보이는 들판은 벌써 추수가 끝나 텅 비어 있었다.', r: 'changbakkeuro boineun deulpaneun beolsseo chusuga kkeunna teong bieo isseotda.', zh: '窗外的田野早已收割完畢，空蕩蕩的。' },
      { t: '터미널에는 할머니가 두꺼운 목도리를 두르고 기다리고 계셨다.', r: 'teomineoreneun halmeoniga dukkeoun mokdorireul dureugo gidarigo gyesyeotda.', zh: '奶奶圍著厚厚的圍巾，在客運站等著我。' },
      { t: '"아이고, 우리 강아지 얼굴이 왜 이렇게 핼쑥해졌어?"', r: '"aigo, uri gang-aji eolguri wae ireoke haelssukaejyeosseo?"', zh: '「哎呀，我的寶貝怎麼瘦成這樣？」', g: 'F' },
      { t: '"요즘 일이 좀 많았어요. 그래도 할머니 보니까 힘이 나요."', r: '"yojeum iri jom manasseoyo. geuraedo halmeoni bonikka himi nayo."', zh: '「最近工作比較多。不過看到奶奶就有精神了。」', g: 'F' },
      { t: '할머니는 내 손을 꼭 잡고 집에 가는 내내 놓지 않으셨다.', r: 'halmeonineun nae soneul kkok japgo jibe ganeun naenae nochi aneusyeotda.', zh: '回家的一路上，奶奶緊緊握著我的手不放。' },
      { t: '다음 날 아침, 마당에 나가 보고 깜짝 놀랐다.', r: 'daeum nal achim, madang-e naga bogo kkamjjak nollatda.', zh: '隔天早上，我走到院子一看，嚇了一大跳。', p: 1 },
      { t: '마당에는 소금에 절여 둔 배추가 산더미처럼 쌓여 있었다.', r: 'madang-eneun sogeume jeoryeo dun baechuga sandeomicheoreom ssayeo isseotda.', zh: '院子裡堆著像小山一樣、用鹽醃好的白菜。' },
      { t: '할머니는 전날 밤새 배추를 절이고 새벽에 물기를 빼 두셨다고 했다.', r: 'halmeonineun jeonnal bamsae baechureul jeorigo saebyeoge mulgireul ppae dusyeotdago haetda.', zh: '奶奶說她前一晚整夜醃白菜，清晨又把水瀝乾了。' },
      { t: '"할머니, 이걸 혼자 다 하셨어요? 허리 아프시잖아요."', r: '"halmeoni, igeol honja da hasyeosseoyo? heori apeusijanayo."', zh: '「奶奶，這些全都是您一個人弄的？您的腰不是不好嗎？」', g: 'F' },
      { t: '"평생 해 온 일인데 뭘. 올해는 백 포기밖에 안 돼."', r: '"pyeongsaeng hae on irinde mwol. ollaeneun baek pogibakke an dwae."', zh: '「做了一輩子了，這算什麼。今年才一百顆而已。」', g: 'F' },
      { t: '백 포기가 \'밖에\'라니, 나는 웃음이 나오면서도 걱정이 되었다.', r: 'baek pogiga \'bakke\'rani, naneun useumi naomyeonseodo geokjeong-i doeeotda.', zh: '一百顆竟然叫「而已」，我忍不住笑了，卻也擔心起來。' },
      { t: '부엌에서는 엄마가 무를 채 썰고 쪽파를 다듬고 계셨다.', r: 'bueokeseoneun eommaga mureul chae sseolgo jjokpareul dadeumgo gyesyeotda.', zh: '廚房裡，媽媽正在把白蘿蔔切絲、挑揀細蔥。' },
      { t: '할머니는 고춧가루, 마늘, 젓갈을 넣어 빨간 양념을 만드셨다.', r: 'halmeonineun gochutgaru, maneul, jeotgareul neoeo ppalgan yangnyeomeul mandeusyeotda.', zh: '奶奶加入辣椒粉、大蒜和魚露，調出紅通通的醬料。' },
      { t: '큰 대야 안에서 양념이 섞이자 매콤하고 짭짤한 냄새가 퍼졌다.', r: 'keun daeya aneseo yangnyeomi seokkija maekomhago jjapjjalhan naemsaega peojyeotda.', zh: '醬料在大盆裡一拌開，又辣又鹹的香味就散了開來。' },
      { t: '할머니는 양념을 손가락으로 찍어 맛보시더니 만족스럽게 웃으셨다.', r: 'halmeonineun yangnyeomeul songarageuro jjigeo matbosideoni manjokseureopge useusyeotda.', zh: '奶奶用手指沾了點醬料嚐嚐，滿意地笑了。' },
      { t: '드디어 나도 고무장갑을 끼고 배추 앞에 앉았다.', r: 'deudieo nado gomujanggabeul kkigo baechu ape anjatda.', zh: '終於，我也戴上橡膠手套，坐到了白菜前面。', p: 1 },
      { t: '"양념은 배춧잎 사이사이에 골고루 발라야 맛있어."', r: '"yangnyeomeun baechunnip saisaie golgoru ballaya masisseo."', zh: '「醬料要均勻抹進每片白菜葉之間才好吃。」', g: 'F' },
      { t: '"너무 많이 넣으면 짜고, 적게 넣으면 싱거워진단다."', r: '"neomu mani neoeumyeon jjago, jeokge neoeumyeon sing-geowojindanda."', zh: '「放太多會太鹹，放太少又會太淡。」', g: 'F' },
      { t: '처음에는 서툴렀지만 금세 손이 빨라졌다.', r: 'cheoeumeneun seotulleotjiman geumse soni ppallajyeotda.', zh: '一開始笨手笨腳，但很快就上手了。' },
      { t: '고무장갑을 꼈는데도 손끝이 매워서 눈물이 날 지경이었다.', r: 'gomujanggabeul kkyeonneundedo sonkkeuchi maewoseo nunmuri nal jigyeong-ieotda.', zh: '明明戴著橡膠手套，指尖還是辣到快流眼淚。' },
      { t: '쪼그려 앉아 있으니 한 시간도 안 돼 허리와 다리가 저려 왔다.', r: 'jjogeuryeo anja isseuni han sigando an dwae heoriwa dariga jeoryeo watda.', zh: '蹲坐不到一個小時，腰和腿就開始發麻了。' },
      { t: '사무실 의자에만 앉아 있던 몸이 비명을 지르는 것 같았다.', r: 'samusil uijaeman anja itdeon momi bimyeong-eul jireuneun geot gatatda.', zh: '整天坐在辦公椅上的身體，好像在發出哀號。' },
      { t: '그때 대문 쪽에서 반가운 목소리가 들려왔다.', r: 'geuttae daemun jjogeseo bangaun moksoriga deullyeowatda.', zh: '就在這時，大門那邊傳來了熟悉親切的聲音。' },
      { t: '"형님, 올해도 김장하시죠? 우리가 거들러 왔어요!"', r: '"hyeongnim, ollaedo gimjanghasijyo? uriga geodeulleo wasseoyo!"', zh: '「大姊，今年也要醃泡菜吧？我們來幫忙了！」', g: 'F' },

      { t: '마을 소식과 웃음소리가 마당을 가득 채웠다.', r: 'maeul sosikgwa useumsoriga madang-eul gadeuk chaewotda.', zh: '村裡的大小消息和笑聲充滿了整個院子。' },
      { t: '"서울 생활은 할 만해? 밥은 잘 챙겨 먹고?"', r: '"seoul saenghwareun hal manhae? babeun jal chaenggyeo meokgo?"', zh: '「首爾的生活還過得去吧？有好好吃飯嗎？」', g: 'F' },
      { t: '아주머니의 물음에 나는 대답 대신 어색하게 웃기만 했다.', r: 'ajumeonie mureume naneun daedap daesin eosaekage utgiman haetda.', zh: '面對阿姨的問題，我沒有回答，只是尷尬地笑了笑。' },
      { t: '사실 요즘은 편의점 도시락으로 끼니를 때우는 날이 대부분이었다.', r: 'sasil yojeumeun pyeonuijeom dosirageuro kkinireul ttaeuneun nari daebubunieotda.', zh: '其實最近大部分的日子，我都是靠便利商店便當隨便解決一餐。' },
      { t: '오후가 되자 갑자기 하늘이 흐려지더니 찬바람이 불기 시작했다.', r: 'ohuga doeja gapjagi haneuri heuryeojideoni chanbarami bulgi sijakaetda.', zh: '到了下午，天空突然轉陰，開始颳起冷風。' },
      { t: '"비 오기 전에 서둘러야겠다. 남은 배추를 다 마루로 옮기자!"', r: '"bi ogi jeone seodulleoyagetda. nameun baechureul da maruro omgija!"', zh: '「得趁下雨前快一點。把剩下的白菜都搬到簷廊上吧！」', g: 'F' },
      { t: '모두 힘을 합쳐 대야와 배추를 처마 밑으로 옮겼다.', r: 'modu himeul hapchyeo daeyawa baechureul cheoma miteuro omgyeotda.', zh: '大家齊心協力，把大盆和白菜搬到屋簷下。' },
      { t: '마지막 대야를 옮기자마자 굵은 빗방울이 떨어지기 시작했다.', r: 'majimak daeyareul omgijamaja gulgeun bitbang-uri tteoreojigi sijakaetda.', zh: '最後一個盆子才剛搬好，斗大的雨滴就落了下來。' },
      { t: '우리는 마루에 둘러앉아 빗소리를 들으며 남은 일을 마저 끝냈다.', r: 'urineun marue dulleoanja bitsorireul deureumyeo nameun ireul majeo kkeunnaetda.', zh: '我們圍坐在簷廊上，聽著雨聲把剩下的工作做完。' },
      { t: '빨갛게 버무린 김치는 차곡차곡 김치통에 담겼다.', r: 'ppalgake beomurin gimchineun chagokchagok gimchitong-e damgyeotda.', zh: '拌得紅通通的泡菜，被整整齊齊地裝進泡菜桶裡。' },
      { t: '일을 마치자 할머니는 갓 삶은 수육을 내오셨다.', r: 'ireul machija halmeonineun gat salmeun suyugeul naeosyeotda.', zh: '忙完之後，奶奶端出了剛煮好的白切肉。', p: 1 },
      { t: '김이 모락모락 나는 고기 옆에 새우젓과 굴이 곁들여져 있었다.', r: 'gimi morangmorak naneun gogi yeope saeujeotgwa guri gyeotdeuryeojyeo isseotda.', zh: '冒著熱氣的肉旁邊，還配上了蝦醬和生蠔。' },
      { t: '따끈한 수육을 막 담근 김치에 싸 먹으니 피로가 싹 풀렸다.', r: 'ttakkeunhan suyugeul mak damgeun gimchie ssa meogeuni piroga ssak pullyeotda.', zh: '用剛醃好的泡菜包著熱騰騰的白切肉吃，疲勞一掃而空。' },
      { t: '"역시 할머니 김치가 세상에서 제일 맛있어요!"', r: '"yeoksi halmeoni gimchiga sesang-eseo jeil masisseoyo!"', zh: '「果然奶奶的泡菜是全世界最好吃的！」', g: 'F' },
      { t: '아주머니들도 막걸리 한 잔씩을 나누며 서로의 수고를 칭찬했다.', r: 'ajumeonideuldo makgeolli han janssigeul nanumyeo seoroe sugoreul chingchanhaetda.', zh: '阿姨們也各喝一杯米酒，互相稱讚彼此的辛勞。' },
      { t: '할머니는 김치통 몇 개를 따로 챙겨 아주머니들 손에 들려 보내셨다.', r: 'halmeonineun gimchitong myeot gaereul ttaro chaenggyeo ajumeonideul sone deullyeo bonaesyeotda.', zh: '奶奶另外準備了幾桶泡菜，讓阿姨們帶回家。' },
      { t: '"할머니, 우리 먹을 것도 부족한데 왜 다 나눠 주세요?"', r: '"halmeoni, uri meogeul geotdo bujokande wae da nanwo juseyo?"', zh: '「奶奶，我們自己吃的都不太夠了，為什麼還全都分出去？」', g: 'F' },
      { t: '"이렇게 다 같이 나눠 먹으려고 김장하는 거란다."', r: '"ireoke da gachi nanwo meogeuryeogo gimjanghaneun georanda."', zh: '「醃泡菜就是為了像這樣大家一起分著吃啊。」', g: 'F' },
      { t: '"다음 주엔 저 집 김장에 내가 가서 도와줄 거야."', r: '"daeum juen jeo jip gimjang-e naega gaseo dowajul geoya."', zh: '「下個禮拜換那家醃泡菜，我會過去幫忙。」', g: 'F' },
      { t: '그제야 나는 백 포기나 담근 이유를 알 것 같았다.', r: 'geujeya naneun baek pogina damgeun iyureul al geot gatatda.', zh: '直到這時，我才好像明白為什麼要醃上一百顆。' },
      { t: '김장은 단순히 김치를 만드는 일이 아니라 정을 나누는 일이었다.', r: 'gimjang-eun dansunhi gimchireul mandeuneun iri anira jeong-eul nanuneun irieotda.', zh: '醃泡菜不只是做泡菜，更是分享人情的事。' },
      { t: '그날 밤, 할머니는 내 허리에 따뜻한 찜질팩을 올려 주셨다.', r: 'geunal bam, halmeonineun nae heorie ttatteutan jjimjilpaegeul ollyeo jusyeotda.', zh: '那天晚上，奶奶在我的腰上放了個溫熱的熱敷袋。', p: 1 },
      { t: '"일 너무 무리하지 말고, 힘들면 언제든 내려와."', r: '"il neomu murihaji malgo, himdeulmyeon eonjedeun naeryeowa."', zh: '「工作別太勉強自己，累了隨時回來。」', g: 'F' },
      { t: '그 말에 괜히 코끝이 찡해져서 이불을 머리끝까지 뒤집어썼다.', r: 'geu mare gwaenhi kokkeuchi jjinghaejyeoseo ibureul meorikkeutkkaji dwijibeosseotda.', zh: '聽到這句話，我鼻頭莫名一酸，把棉被拉起來蓋住了頭。' },
      { t: '다음 날 아침, 할머니는 김치통을 엄마 차 트렁크에 하나하나 실어 주셨다.', r: 'daeum nal achim, halmeonineun gimchitong-eul eomma cha teureongkeue hanahana sireo jusyeotda.', zh: '隔天早上，奶奶把泡菜桶一桶一桶搬上媽媽的後車廂。' },
      { t: '서울로 돌아오는 차 안에는 김치통 세 개가 실려 있었다.', r: 'seoullo doraoneun cha aneneun gimchitong se gaega sillyeo isseotda.', zh: '回首爾的車上，載著三大桶泡菜。' },
      { t: '백미러 속에서 손을 흔드는 할머니의 모습이 점점 작아졌다.', r: 'baengmireo sogeseo soneul heundeuneun halmeonie moseubi jeomjeom jagajyeotda.', zh: '後照鏡裡揮著手的奶奶，身影越來越小。' },
      { t: '나는 집에 도착하자마자 김치 한 통을 옆집 할머니께 갖다 드렸다.', r: 'naneun jibe dochakajamaja gimchi han tong-eul yeopjip halmeonikke gatda deuryeotda.', zh: '一回到家，我就把一桶泡菜送給隔壁的老奶奶。' },
      { t: '이 년 동안 인사만 하던 이웃이 처음으로 활짝 웃어 주셨다.', r: 'i nyeon dong-an insaman hadeon iusi cheoeumeuro hwaljjak useo jusyeotda.', zh: '兩年來只會點頭打招呼的鄰居，第一次對我露出燦爛的笑容。' },
      { t: '할머니가 말한 정이 무엇인지 조금은 알 것 같았다.', r: 'halmeoniga malhan jeong-i mueosinji jogeumeun al geot gatatda.', zh: '我好像稍微懂了奶奶說的「人情」是什麼。' },
      { t: '겨울 내내 그 김치를 먹을 때마다 할머니의 손맛이 떠오를 것 같다.', r: 'gyeoul naenae geu gimchireul meogeul ttaemada halmeonie sonmasi tteooreul geot gatda.', zh: '整個冬天，每次吃那些泡菜，大概都會想起奶奶的好手藝。' },
      { t: '내년 김장에는 휴가를 내서 하루 일찍 내려가야겠다고 다짐했다.', r: 'naenyeon gimjang-eneun hyugareul naeseo haru iljjik naeryeogayagetdago dajimhaetda.', zh: '我暗自下定決心，明年醃泡菜時要請假提早一天回去。' },

  {

    lines: [
      { t: '서윤은 광고 회사에서 일하는 입사 오 년 차 직장인이었다.', r: 'seoyuneun gwanggo hoesaeseo ilhaneun ipsa o nyeon cha jikjang-inieotda.', zh: '瑞允是在廣告公司工作、進公司第五年的上班族。', p: 1 },
      { t: '그녀의 하루는 늘 밤 열한 시가 넘어서야 끝났다.', r: 'geunyeoe haruneun neul bam yeolhan siga neomeoseoya kkeunnatda.', zh: '她的一天總要過了晚上十一點才結束。' },
      { t: '휴대폰에는 읽지 못한 메시지와 부재중 전화가 쌓여 갔다.', r: 'hyudaeponeneun ikji motan mesijiwa bujaejung jeonhwaga ssayeo gatda.', zh: '手機裡未讀訊息和未接來電越積越多。' },
      { t: '가장 친한 친구 지민의 생일도 벌써 두 번이나 놓쳤다.', r: 'gajang chinhan chingu jimine saengildo beolsseo du beonina nochyeotda.', zh: '連最要好的朋友智敏的生日，她都已經錯過兩次了。' },

      { t: '그날도 서윤은 텅 빈 사무실에서 혼잣말을 하며 노트북을 덮었다.', r: 'geunaldo seoyuneun teong bin samusireseo honjanmareul hamyeo noteubugeul deopeotda.', zh: '那天，瑞允也是在空無一人的辦公室裡自言自語，闔上了筆電。' },
      { t: '밖에는 차가운 가을비가 내리고 있었다.', r: 'bakkeneun chagaun gaeulbiga naerigo isseotda.', zh: '外頭正下著冰冷的秋雨。' },

      { t: '비 오는 밤, 서윤은 골목 끝에서 처음 보는 가게를 발견했다.', r: 'bi oneun bam, seoyuneun golmok kkeuteseo cheoeum boneun gagereul balgyeonhaetda.', zh: '下雨的夜晚，瑞允在巷子盡頭發現一間從沒見過的店。', p: 1 },

      { t: '매일 지나다니던 길인데 이런 가게가 있었는지 전혀 몰랐다.', r: 'maeil jinadanideon girinde ireon gagega isseonneunji jeonhyeo mollatda.', zh: '明明是每天經過的路，她卻完全不知道有這樣一間店。' },

      { t: '"어서 오세요. 한 시간에 만 원입니다."', r: '"eoseo oseyo. han sigane man wonimnida."', zh: '「歡迎光臨，一小時一萬韓元。」', g: 'M' },
      { t: '"정말 시간을 살 수 있다는 말씀이세요?"', r: '"jeongmal siganeul sal su itdaneun malsseumiseyo?"', zh: '「您是說，真的可以買到時間嗎？」', g: 'F' },
      { t: '"물론이지요. 다만 한번 산 시간은 되돌릴 수 없습니다."', r: '"mullonijiyo. daman hanbeon san siganeun doedollil su eopseumnida."', zh: '「當然。只是時間一旦買了，就無法退回。」', g: 'M' },
      { t: '매일 야근에 시달리던 서윤은 망설임 없이 열 시간을 샀다.', r: 'maeil yageune sidallideon seoyuneun mangseorim eopsi yeol siganeul satda.', zh: '天天被加班折磨的瑞允，毫不猶豫地買了十小時。' },

      { t: '다른 사람들의 시계는 그대로인데 그녀에게만 시간이 천천히 흘렀다.', r: 'dareun saramdeure sigyeneun geudaeroinde geunyeoegeman sigani cheoncheonhi heulleotda.', zh: '別人的時鐘照常走，只有她的時間流得特別慢。' },

      { t: '그녀는 시간이 모자랄 때마다 가게에 들러 시간을 더 샀다.', r: 'geunyeoneun sigani mojaral ttaemada gagee deulleo siganeul deo satda.', zh: '每當時間不夠用，她就跑去那間店買更多時間。' },

      { t: '거울 속의 얼굴은 낯선 사람처럼 창백하고 퀭했다.', r: 'geoul sogui eolgureun natseon saramcheoreom changbaekago kwenghaetda.', zh: '鏡子裡的臉像陌生人一樣，蒼白又憔悴。' },
      { t: '어느 날 지민에게서 짧은 메시지가 왔다.', r: 'eoneu nal jiminegeseo jjalbeun mesijiga watda.', zh: '有一天，智敏傳來一則簡短的訊息。' },

      { t: '서윤은 답장을 쓰다가 지우기를 몇 번이나 반복했다.', r: 'seoyuneun dapjang-eul sseudaga jiugireul myeot beonina banbokaetda.', zh: '瑞允回覆寫了又刪，反覆了好幾次。' },
      { t: '그날 밤, 회의 도중 그녀는 눈앞이 캄캄해지며 쓰러질 뻔했다.', r: 'geunal bam, hoeui dojung geunyeoneun nunapi kamkamhaejimyeo sseureojil ppeonhaetda.', zh: '那天晚上開會到一半，她眼前一黑，差點昏倒。' },

      { t: '빗속을 뛰어가는 내내 심장이 쿵쾅거렸다.', r: 'bitsogeul ttwieoganeun naenae simjang-i kungkwanggeoryeotda.', zh: '在雨中奔跑的一路上，她的心臟怦怦狂跳。' },
      { t: '"시간을 환불받을 수 있을까요?"', r: '"siganeul hwanbulbadeul su isseulkkayo?"', zh: '「時間可以退款嗎？」', g: 'F' },
      { t: '"시간이 많아졌는데도 저는 하나도 행복하지 않아요."', r: '"sigani manajyeonneundedo jeoneun hanado haengbokaji anayo."', zh: '「時間明明變多了，我卻一點都不快樂。」', g: 'F' },

      <div class="sl ${P.zh ? '' : 'no-zh'} ${P.rd ? '' : 'no-rd'} ${P.blind ? 'blind' : ''}" id="slRoot">
        <div class="sl-crumbs">
          <button type="button" class="slr-expand-btn" id="slrExpandBtn" title="展開側邊故事列表">📖 故事列表 (${all.length})</button>
          <button type="button" class="slr-open-mob" id="slrOpenMob">📖 切換故事 (${idx + 1}/${all.length})</button>
          <a href="#/stories">📖 故事</a><span>›</span><span>${esc(s.zh || s.title)}</span>
        </div>
        <section class="sl-card">
          <div class="sl-head"><div class="sl-sc-ic">${esc(s.icon || '📖')}</div>
            <div><h1 lang="${LANG}">${esc(nfc(s.title))}</h1><div class="sl-zh">${esc(s.zh || '')}</div>
              <div class="sl-meta"><span class="sl-lv" style="background:${L.soft};color:${L.color}">${s.level} ${esc(L.name)}</span>${s.tag ? `<span class="sl-tag">${esc(s.tag)}</span>` : ''}<span>🗣️ ${s.lines.length} 句</span>${S.done[s.id] ? '<span class="sl-tag" style="background:#dcfce7;color:#166534">✅ 已聽完</span>' : ''}</div></div></div>
          ${s.summary ? `<p class="sl-sum">${esc(s.summary)}</p>` : ''}
        </section>
        <section class="sl-card sl-bar" id="slBar">
          <button class="sl-btn pri" id="slPlay">▶ 播放全文</button>
          <div class="sl-seg" id="slRate">${rates.map(([r, t]) => `<button data-rate="${r}" class="${P.rate === r ? 'on' : ''}">${t}</button>`).join('')}</div>
          <label class="sl-tg"><input type="checkbox" data-pref="zh" ${P.zh ? 'checked' : ''}>中文</label>
          ${hasR ? `<label class="sl-tg"><input type="checkbox" data-pref="rd" ${P.rd ? 'checked' : ''}>${esc(LANG_META.reading)}</label>` : ''}
          <label class="sl-tg"><input type="checkbox" data-pref="blind" ${P.blind ? 'checked' : ''}>${esc(LANG_META.blind)}</label>
          <label class="sl-tg"><input type="checkbox" data-pref="loop" ${P.loop ? 'checked' : ''}>🔁 循環</label>
          <div class="sl-prog"><i id="slProg"></i></div>
        </section>
        <section class="sl-card" style="padding:6px">
          <ol class="sl-lines" id="slLines">${s.lines.map((ln, i) => `<li class="sl-line${ln.p && i ? ' sl-pstart' : ''}" data-i="${i}">
            <button class="sl-play" data-i="${i}" aria-label="播放第 ${i + 1} 句">▶</button>
            <div class="sl-txt"><div class="sl-t" lang="${LANG}">${ln.g ? `<span class="sl-who ${ln.g === 'M' ? 'm' : ''}">${ln.g === 'M' ? '♂' : '♀'}</span>` : ''}${esc(nfc(ln.t))}</div>
              ${ln.r && ln.r !== ln.t ? `<div class="sl-r">${esc(ln.r)}</div>` : ''}<div class="sl-z">${esc(ln.zh || '')}</div></div></li>`).join('')}</ol>
        </section>
        ${(s.vocab || []).length ? `<section class="sl-card"><h2 class="sl-h2">🔤 重點單字（點一下聽發音）</h2><div class="sl-vocab">
          ${s.vocab.map((v, i) => `<button class="sl-vw" data-v="${i}"><b lang="${LANG}">${esc(nfc(v.w))}</b>${v.r ? ` <span class="sl-r" style="display:inline">${esc(v.r)}</span>` : ''}<small>${esc(v.zh || '')}</small></button>`).join('')}</div></section>` : ''}
        ${(s.quiz || []).length ? `<section class="sl-card" id="slQuiz"><h2 class="sl-h2">🧩 聽懂了嗎？小測驗</h2>
          ${s.quiz.map((q, qi) => `<div class="sl-q" data-q="${qi}"><p>${qi + 1}. ${esc(q.q)}</p><div class="sl-opts">${q.opts.map((o, oi) => `<button class="sl-opt" data-q="${qi}" data-o="${oi}">${esc(o)}</button>`).join('')}</div></div>`).join('')}
          <div class="sl-z" id="slQuizRes"></div></section>` : ''}
        <nav class="sl-nav">
          ${prev ? `<a class="sl-card" href="#/stories/${encodeURIComponent(prev.id)}"><small class="sl-zh">‹ 上一篇</small><div><b>${esc(prev.icon || '')} ${esc(prev.zh || prev.title)}</b></div></a>` : '<span></span>'}
          ${next ? `<a class="sl-card next" href="#/stories/${encodeURIComponent(next.id)}"><small class="sl-zh">下一篇 ›</small><div><b>${esc(next.icon || '')} ${esc(next.zh || next.title)}</b></div></a>` : '<span></span>'}
        </nav>
      </div>
    </div>`;

    const shell = main.querySelector('#slShell');
    const root = main.querySelector('#slRoot');
    const playBtn = root.querySelector('#slPlay');
    const prog = root.querySelector('#slProg');
    const rows = Array.from(root.querySelectorAll('.sl-line'));

    // 讓播放列與側邊列表吸頂時避開學院自己的固定頁首
    const hd = document.querySelector('.site-header, .app-header, header');
    if (hd) {
      const pos = getComputedStyle(hd).position;
      if (pos === 'sticky' || pos === 'fixed') shell.style.setProperty('--sl-top', `${hd.offsetHeight + 8}px`);
    }

    // 掛載側邊故事切換清單
    const listEl = shell.querySelector('#slrList');
    const ftEl = shell.querySelector('#slrFt');
    const cntEl = shell.querySelector('#slrCount');
    const searchEl = shell.querySelector('#slrSearch');
    const lvsEl = shell.querySelector('#slrLvs');
    function renderRailItems(scrollActive) {
      const list = filterRailStories(all);
      cntEl.textContent = railState.level || railState.q.trim() ? `${list.length}/${all.length}` : `${all.length}`;
      listEl.innerHTML = list.length ? list.map((x) => {
        const xl = lv(x.level);
        return `<a class="slr-item ${x.id === s.id ? 'on' : ''}" href="#/stories/${encodeURIComponent(x.id)}" data-id="${esc(x.id)}">
          <span class="slr-ic">${esc(x.icon || '📖')}</span>
          <div class="slr-body">
            <div class="slr-top"><span class="sl-lv" style="background:${xl.soft};color:${xl.color}">${esc(x.level)}</span>${x.tag ? `<span>${esc(x.tag)}</span>` : ''}${S.done[x.id] ? '<span class="slr-done">✓</span>' : ''}</div>
            <div class="slr-t" lang="${LANG}">${esc(nfc(x.title))}</div>
            <div class="slr-z">${esc(x.zh || '')}</div>
          </div>
        </a>`;
      }).join('') : '<div class="sl-empty" style="padding:18px 6px;font-size:13px">找不到符合條件的故事</div>';
      const navPool = list.some((x) => x.id === s.id) ? list : all;
      const pos = navPool.indexOf(s);
      const pv = pos > 0 ? navPool[pos - 1] : null;
      const nx = pos >= 0 && pos < navPool.length - 1 ? navPool[pos + 1] : null;
      ftEl.innerHTML = `
        ${pv ? `<a href="#/stories/${encodeURIComponent(pv.id)}">‹ 上一篇</a>` : '<span class="dis">‹ 上一篇</span>'}
        <span>${pos >= 0 ? `${pos + 1} / ${navPool.length}` : `${navPool.length} 篇`}</span>
        ${nx ? `<a href="#/stories/${encodeURIComponent(nx.id)}">下一篇 ›</a>` : '<span class="dis">下一篇 ›</span>'}
      `;
      if (scrollActive) {
        requestAnimationFrame(() => {
          const act = listEl.querySelector('.slr-item.on');
          if (act) listEl.scrollTop = Math.max(0, act.offsetTop - listEl.clientHeight / 2 + act.offsetHeight / 2);
        });
      }
    }
    if (railState.level && !railState.q.trim() && !filterRailStories(all).some((x) => x.id === s.id)) {
      railState.level = '';
      lvsEl.querySelectorAll('.slr-lv').forEach((b) => b.classList.toggle('on', !b.dataset.lv));
    }
    renderRailItems(true);
    lvsEl.onclick = (e) => {
      const b = e.target.closest('.slr-lv');
      if (!b) return;
      railState.level = b.dataset.lv || '';
      lvsEl.querySelectorAll('.slr-lv').forEach((x) => x.classList.toggle('on', x === b));
      renderRailItems(true);
    };
    searchEl.addEventListener('input', () => { railState.q = searchEl.value; renderRailItems(false); });
    searchEl.addEventListener('keydown', (e) => {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === 'Enter') {
        const first = filterRailStories(all)[0];
        if (first) { e.preventDefault(); location.hash = `#/stories/${encodeURIComponent(first.id)}`; }
      } else if (e.key === 'Escape') {
        if (searchEl.value) { searchEl.value = ''; railState.q = ''; renderRailItems(true); }
        else shell.classList.remove('rail-mob-open');
      }
    });
    const closeMob = () => shell.classList.remove('rail-mob-open');
    shell.querySelector('#slrBackdrop').onclick = closeMob;
    shell.querySelector('#slrCloseMob').onclick = closeMob;
    listEl.addEventListener('click', (e) => { if (e.target.closest('.slr-item')) closeMob(); });
    shell.querySelector('#slrHideBtn').onclick = () => { setRailCollapsed(true); shell.classList.add('rail-collapsed'); };
    shell.querySelector('#slrExpandBtn').onclick = () => { setRailCollapsed(false); shell.classList.remove('rail-collapsed'); renderRailItems(true); };
    shell.querySelector('#slrOpenMob').onclick = () => { shell.classList.add('rail-mob-open'); renderRailItems(true); };

    function setCur(i) {
      rows.forEach((r, k) => r.classList.toggle('cur', k === i));
      if (i < 0) return;
      prog.style.width = `${Math.round(((i + 1) / rows.length) * 100)}%`;
      const r = rows[i];
      const bar = root.querySelector('#slBar');
      const top = bar.getBoundingClientRect().bottom + 8;
      const rr = r.getBoundingClientRect();
      if (rr.top < top || rr.bottom > window.innerHeight - 80) {
        window.scrollBy({ top: rr.top - (top + window.innerHeight) / 2 + rr.height / 2, behavior: reduceMotion ? 'auto' : 'smooth' });
      }
    }
    function setPlaying(on) {
      playingAll = on;
      playBtn.classList.toggle('is-on', on);
      playBtn.textContent = on ? '⏹ 停止' : '▶ 播放全文';
    }
    function stopAll() {
      session++;
      stopTts();
      setPlaying(false);
    }
    async function playFrom(start) {
      const my = ++session;
      setPlaying(true);
      S.plays[s.id] = (S.plays[s.id] || 0) + 1;
      save();
      do {
        for (let i = start; i < s.lines.length; i++) {
          if (my !== session) return;
          setCur(i);
          const ln = s.lines[i];
          const res = await speak(ln.t, { g: ln.g, rate: P.rate });
          if (my !== session || (res && res.canceled)) return;
          await sleep(P.rate < 1 ? 520 : 380);
        }
        if (my !== session) return;
        if (markDone(s.id)) { refreshStoryRailDone(s.id); toast(`🎉 聽完「${s.zh || s.title}」了！`); }
        start = 0;
        if (P.loop) await sleep(900);
      } while (P.loop && my === session);
      if (my === session) { setPlaying(false); setCur(-1); }
    }
    async function playOne(i) {
      const my = ++session;
      setPlaying(false);
      setCur(i);
      rows[i].classList.add('peek');
      const ln = s.lines[i];
      await speak(ln.t, { g: ln.g, rate: P.rate });
      rows[i].classList.remove('peek');
      if (my === session) rows[i].classList.remove('cur');
    }

    playBtn.onclick = () => { if (playingAll) stopAll(); else { const c = rows.findIndex((r) => r.classList.contains('cur')); playFrom(c > 0 ? c : 0); } };
    root.querySelector('#slLines').addEventListener('click', (e) => {
      const row = e.target.closest('.sl-line');
      if (!row) return;
      const i = +row.dataset.i;
      if (playingAll && !e.target.closest('.sl-play')) { playFrom(i); return; }
      playOne(i);
    });
    root.querySelector('#slRate').onclick = (e) => {
      const b = e.target.closest('[data-rate]');
      if (!b) return;
      P.rate = +b.dataset.rate;
      save();
      root.querySelectorAll('#slRate button').forEach((x) => x.classList.toggle('on', x === b));
    };
    root.querySelectorAll('[data-pref]').forEach((cb) => {
      cb.onchange = () => {
        const k = cb.dataset.pref;
        P[k] = cb.checked;
        save();
        root.classList.toggle('no-zh', !P.zh);
        root.classList.toggle('no-rd', !P.rd);
        root.classList.toggle('blind', !!P.blind);
      };
    });
    const vbox = root.querySelector('.sl-vocab');
    if (vbox) vbox.onclick = (e) => {
      const b = e.target.closest('[data-v]');
      if (!b) return;
      session++;
      setPlaying(false);
      speak(s.vocab[+b.dataset.v].w, { rate: Math.min(P.rate, 0.9), btn: b });
    };
    const quiz = root.querySelector('#slQuiz');
    if (quiz) {
      let answered = 0, right = 0;
      quiz.onclick = (e) => {
        const b = e.target.closest('.sl-opt');
        if (!b || b.disabled) return;
        const qi = +b.dataset.q, oi = +b.dataset.o;
        const q = s.quiz[qi];
        const btns = quiz.querySelectorAll(`.sl-opt[data-q="${qi}"]`);
        btns.forEach((x) => { x.disabled = true; if (+x.dataset.o === q.a) x.classList.add('ok'); });
        if (oi !== q.a) b.classList.add('bad'); else right++;
        answered++;
        if (answered === s.quiz.length) {
          const res = quiz.querySelector('#slQuizRes');
          res.textContent = right === answered ? `🎉 全對！${right} / ${answered}` : `答對 ${right} / ${answered} 題，再聽一次故事試試看！`;
          if (right === answered && markDone(s.id)) { refreshStoryRailDone(s.id); toast(`✅ 「${s.zh || s.title}」已聽完`); }
        }
      };
    }
    const onKey = (e) => {
      if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
      if (e.code === 'Space' && !e.target.closest('button')) { e.preventDefault(); playBtn.click(); }
    };
    document.addEventListener('keydown', onKey);
    const cleanup = () => { session++; playingAll = false; document.removeEventListener('keydown', onKey); };
    if (onCleanup) onCleanup(cleanup);
    else window.addEventListener('hashchange', cleanup, { once: true });
  }

  // ---------------------------------------------------------------- 掛上各學院路由
  function render(main, id, level, onCleanup) {
    if (id) renderStory(main, id, onCleanup);
    else renderList(main, level || '');
  }
  if (typeof A.route === 'function') {
    A.route('stories', (main, params, query) => render(main, params && params[0], query && query.level, A.onCleanup));
  }
  // 韓語學院使用 app.js 內的 if/else 路由
  A.renderStories = (main, id, queryString) => {
    const q = new URLSearchParams(queryString || '');
    render(main, id, q.get('level'), null);
  };
  A.storyLab = { stories, done: () => Object.assign({}, S.done) };
})();

</script>
<script>/* /js/app.js */
/* 應用程式啟動、導覽列、Hash 路由與後端狀態同步 */
(function () {
  'use strict';
  const KO = (window.KO = window.KO || {});

  const NAV = [
    ['home', '🏠', '今日學習'],
    ['hangul', '한', '四十音'],
    ['library', '📚', '課程庫'],
    ['stories', '📖', '故事'],
    ['words', '🔤', '單字庫'],
    ['vocab', '⭐', '單字本'],
    ['review', '🔁', '複習'],
    ['progress', '📊', '進度'],
    ['feedback', '💬', '回饋'],
  ];

  function renderNav(active) {
    const due = KO.dueVocab().length;
    const hDue = KO.hangulStats ? KO.hangulStats('all').due : 0;
    const totalDue = due + hDue;
    const top = document.getElementById('topNav');
    const mob = document.getElementById('mobileNav');
    top.innerHTML = NAV.map(([k, ic, label]) => {
      const badge = k === 'review' && totalDue > 0 ? `<span class="nav-badge">${totalDue}</span>` : '';
      return `<a href="#/${k}" class="nav-link ${active === k ? 'active' : ''}"><span class="nav-ic">${ic}</span><span class="nav-t">${label}</span>${badge}</a>`;
    }).join('');
    mob.innerHTML = NAV.map(([k, ic, label]) => {
      const badge = k === 'review' && totalDue > 0 ? `<span class="nav-badge">${totalDue}</span>` : '';
      return `<a href="#/${k}" class="mnav-link ${active === k ? 'active' : ''}"><span class="nav-ic">${ic}</span><small>${label}</small>${badge}</a>`;
    }).join('');
  }

  KO.renderHeaderStats = function () {
    const el = document.getElementById('headerStats');
    if (!el) return;
    const min = KO.todayMinutes();
    const goal = KO.state.settings.goalMin || 15;
    const pct = Math.min(100, Math.round((min / goal) * 100));
    const streak = KO.streak();
    const r = 13, c = +(2 * Math.PI * r).toFixed(1);
    const off = +(c * (1 - pct / 100)).toFixed(1);
    el.innerHTML = `
      <div class="header-right">
        <a href="#/progress" class="hs-chip ${streak > 0 ? 'hot' : ''}" title="連續學習天數">
          🔥 <span>${streak} 天</span>
        </a>
        <a href="#/progress" class="hs-goal ${pct >= 100 ? 'done' : ''}" title="今日目標 ${min} / ${goal} 分鐘">
          <svg width="32" height="32" viewBox="0 0 32 32" class="ring">
            <circle cx="16" cy="16" r="${r}" class="ring-bg"/>
            <circle cx="16" cy="16" r="${r}" class="ring-fg" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
          </svg>
          <span>${min}/${goal}分</span>
        </a>
      </div>`;
  };

  function route() {
    KO.tts && KO.tts.stop();
    KO.asr && KO.asr.stop();
    const raw = (location.hash || '#/home').replace(/^#\/?/, '');
    const [pathPart, query] = raw.split('?');
    const segs = pathPart.split('/').filter(Boolean);
    const name = segs[0] || 'home';
    KO.routeName = name;

    const main = document.getElementById('app');
    main.className = 'app-main page-' + name;
    renderNav(name === 'lesson' ? 'library' : name);
    KO.renderHeaderStats();

    if (name === 'home') KO.renderHome(main);
    else if (name === 'hangul') KO.renderHangul(main, segs[1], segs[2]);
    else if (name === 'library') KO.renderLibrary(main, query);
    else if (name === 'stories' && KO.renderStories) KO.renderStories(main, segs[1], query);
    else if (name === 'words') KO.renderWords(main, segs[1]);
    else if (name === 'lesson') KO.renderLesson(main, segs[1], segs[2] || 'read', segs[3]);
    else if (name === 'vocab') KO.renderVocab(main);
    else if (name === 'review') KO.renderReview(main);
    else if (name === 'progress') KO.renderProgress(main);
    else if (name === 'feedback') KO.renderFeedback(main);
    else KO.renderHome(main);

    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  async function boot() {
    KO.indexLessons();
    if (KO.initVersionBadge) KO.initVersionBadge();
    window.addEventListener('hashchange', route);
    route();
    if (!KO.isStatic()) {
      try {
        const r = await fetch('/api/state');
        if (r.ok) {
          const remote = await r.json();
          KO.mergeState(remote);
          renderNav(KO.routeName === 'lesson' ? 'library' : KO.routeName);
          KO.renderHeaderStats();
          if (KO.routeName === 'home') KO.renderHome(document.getElementById('app'));
        }
      } catch {}
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
