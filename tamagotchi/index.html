  <style>
/* 🥚 塔麻可吉博物館 — 淺色、乾淨、資訊密度高（蛋殼粉＋LCD 綠） */
:root {
  --bg: #fffaf5;
  --card: #ffffff;
  --ink: #2b2230;
  --muted: #6b6270;
  --line: #f1dfe7;
  --pink: #db2777;
  --pink-soft: #fdf2f8;
  --amber: #b45309;
  --lcd: #c8e6a0;
  --lcd-ink: #2f4a12;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(80, 30, 60, .06), 0 4px 14px rgba(80, 30, 60, .05);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.65 -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  overflow-x: hidden;
}
a { color: var(--pink); text-decoration: none; }
a:hover { text-decoration: underline; }
img, svg { max-width: 100%; }
code { background: #f6eef2; padding: 1px 5px; border-radius: 5px; font-size: .92em; }
h1, h2, h3 { line-height: 1.3; margin: 0 0 8px; }
h3 { font-size: 16px; }
p { margin: 0 0 8px; }

/* ---------------- Header ---------------- */
.top-header { position: sticky; top: 0; z-index: 50; background: rgba(255, 250, 245, .96); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.header-inner { max-width: 1240px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.brand-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
.campus-home { flex: none; }
.brand-link { display: flex; align-items: center; gap: 8px; color: var(--ink); min-width: 0; }
.brand-link:hover { text-decoration: none; }
.brand-icon { font-size: 26px; }
.brand-titles { display: flex; flex-direction: column; min-width: 0; }
.brand-name { font-weight: 800; font-size: 17px; white-space: nowrap; }
.brand-tagline { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.ver-pill { border: 1px solid #f5c2d8; background: var(--pink-soft); color: var(--pink); border-radius: 999px; font-size: 12px; font-weight: 700; padding: 2px 9px; cursor: pointer; position: relative; flex: none; }
.unreleased-dot { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; border-radius: 50%; background: #f97316; }
.header-actions { display: flex; align-items: center; gap: 10px; }
.global-search-box { position: relative; display: flex; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 0 10px; }
.global-search-box input { border: 0; outline: 0; background: transparent; padding: 7px 6px; width: 230px; font-size: 13.5px; color: var(--ink); }
.search-dropdown { position: absolute; top: 40px; right: 0; width: 360px; max-width: 90vw; max-height: 60vh; overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 4px; }
.search-item { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 8px; color: var(--ink); }
.search-item:hover { background: var(--pink-soft); text-decoration: none; }
.si-t { font-weight: 700; font-size: 13.5px; }
.si-s { font-size: 12px; color: var(--muted); }
.si-tag { font-size: 11px; color: var(--pink); white-space: nowrap; }
.si-empty { padding: 10px; font-size: 13px; color: var(--muted); }
.progress-pill { display: flex; gap: 6px; align-items: center; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 11px; font-size: 13px; color: var(--ink); white-space: nowrap; }
.main-nav { border-top: 1px solid #f7e9ef; }
.nav-inner { max-width: 1240px; margin: 0 auto; padding: 4px 12px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.nav-inner::-webkit-scrollbar { display: none; }
.nav-tab { white-space: nowrap; padding: 6px 11px; border-radius: 999px; color: var(--muted); font-size: 13.5px; font-weight: 600; }
.nav-tab:hover { background: var(--pink-soft); text-decoration: none; }
.nav-tab.active { background: var(--pink); color: #fff; }

/* ---------------- Layout ---------------- */
.main-container { max-width: 1240px; margin: 0 auto; padding: 18px 16px 40px; outline: none; min-height: 60vh; }
.loading-state { padding: 60px; text-align: center; color: var(--muted); }
.page-hd { margin: 4px 0 16px; }
.page-hd h1 { font-size: 26px; }
.page-hd p { color: var(--muted); max-width: 860px; }
.sec-title { font-size: 19px; margin: 22px 0 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 12px; min-width: 0; }
.grid { display: grid; gap: 12px; }
.grid > .card { margin-bottom: 0; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.muted { color: var(--muted); font-size: 13.5px; }
.note { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
.empty { text-align: center; color: var(--muted); }
.chip { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--pink-soft); color: var(--pink); border: 1px solid #f9d0e2; margin: 0 4px 4px 0; white-space: nowrap; }
.chip.tech { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
.chip.tag-經典 { background: #fef3c7; color: #92400e; border-color: #fde68a; }
.chip.tag-絕版 { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
.chip.tag-限定 { background: #ede9fe; color: #6d28d9; border-color: #ddd6fe; }
.chip.tag-復刻 { background: #e0f2fe; color: #0369a1; border-color: #bae6fd; }
.chip.tag-現行 { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
.chip-btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; }
.chip-btn:hover { border-color: #f5a3c7; }
.chip-btn.on { background: var(--pink); color: #fff; border-color: var(--pink); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 8px 14px; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: #f5a3c7; text-decoration: none; }
.btn.primary { background: var(--pink); border-color: var(--pink); color: #fff; }
.btn.soft { background: #fef3c7; border-color: #fde68a; color: #92400e; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.form-input, .form-select, .form-textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; font: inherit; font-size: 14px; background: #fff; color: var(--ink); }
.form-textarea { resize: vertical; }
.pbar { height: 10px; background: #f6e8ef; border-radius: 999px; overflow: hidden; margin: 6px 0 8px; }
.pbar i { display: block; height: 100%; background: linear-gradient(90deg, #f472b6, #fb923c); border-radius: 999px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { background: #fdf6f9; font-size: 13px; }
.px-svg { display: block; image-rendering: pixelated; }
.cta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: #fffbeb; border-color: #fde68a; margin-top: 14px; }

/* ---------------- Home ---------------- */
.hero { display: flex; gap: 22px; align-items: center; background: linear-gradient(135deg, #fdf2f8, #fff7ed); border: 1px solid var(--line); border-radius: 20px; padding: 22px 26px; margin-bottom: 14px; }
.hero-art { flex: none; padding: 10px; background: #fff; border-radius: 50% 50% 46% 46%; box-shadow: var(--shadow); }
.hero-txt h1 { font-size: 30px; margin: 4px 0 8px; }
.hero-txt p { color: #4b3f4f; max-width: 720px; }
.kicker { font-size: 12.5px; font-weight: 700; color: var(--amber); }
.home-row { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 12px; }
.home-row .card { margin-bottom: 0; }
.trivia-card { background: #fffbeb; border-color: #fde68a; }
.nav-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.nav-card { display: flex; flex-direction: column; gap: 3px; color: var(--ink); position: relative; transition: transform .12s; }
.nav-card:hover { transform: translateY(-2px); text-decoration: none; border-color: #f5a3c7; }
.nav-card small, .quiz-mode small { color: var(--muted); font-size: 12.5px; }
.nc-ic { font-size: 26px; }
.seen-tag { position: absolute; top: 10px; right: 10px; font-size: 11px; color: #15803d; font-style: normal; font-weight: 700; }

/* ---------------- Photos ---------------- */
.ph { margin: 0 0 12px; }
.ph-box { width: 100%; background: #f6eef2; border-radius: 12px; overflow: hidden; }
.ph-box img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ph figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
.ph figcaption a { color: var(--muted); text-decoration: underline; }
.photo-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 12px; }
.photo-row .ph { margin: 0; }
.photo-row .ph-box { aspect-ratio: 4 / 3 !important; }
.mc-photo .ph-box { aspect-ratio: 16 / 10 !important; background: #fff; }
.mc-photo .ph-box img { object-fit: contain; }
.grid.two.top { align-items: start; }
.credit-tbl td { font-size: 13px; }
.credit-tbl img { width: 84px; height: 60px; object-fit: cover; border-radius: 8px; }
.demo-tag { display: inline-block; font-size: 10.5px; color: #92400e; background: #fef3c7; border-radius: 6px; padding: 0 5px; margin-top: 2px; }

/* ---------------- History / timeline ---------------- */
.people { display: flex; flex-wrap: wrap; gap: 18px; }
.person { display: flex; gap: 10px; align-items: center; }
.person small { display: block; color: var(--muted); font-size: 12px; }
.avatar { font-size: 26px; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 6px; position: relative; }
.timeline::before { content: ''; position: absolute; left: 25px; top: 0; bottom: 0; width: 3px; background: #f9d0e2; border-radius: 3px; }
.tl-item { display: flex; gap: 12px; position: relative; margin-bottom: 4px; }
.tl-dot { flex: none; width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 3px solid #f9a8d4; display: flex; align-items: center; justify-content: center; font-size: 18px; z-index: 1; }
.tl-body { flex: 1; }
.tl-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--amber); }

/* ---------------- Models ---------------- */
.filters { display: grid; grid-template-columns: 1fr 160px 160px; gap: 8px; align-items: center; }
.filters .chips { grid-column: 1 / -1; margin: 0; }
.model-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.model-card p { font-size: 14px; }
.mc-top { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
.mc-art { flex: none; width: 76px; display: flex; flex-direction: column; align-items: center; }
.mc-photo { width: 100%; margin-bottom: 8px; }
.mc-ttl { min-width: 0; }
.mc-ttl h3 { margin: 0; overflow-wrap: anywhere; }
.mc-ttl small { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.mc-meta { font-size: 12.5px; color: var(--amber); }
.mc-tags { margin-bottom: 6px; }
dl { margin: 0; font-size: 13px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }

/* ---------------- Characters ---------------- */
.evo-wrap { overflow-x: auto; padding-bottom: 6px; }
.evo-svg { display: block; max-width: none; }
.evo-stage { font-size: 12.5px; font-weight: 800; fill: var(--amber); }
.evo-edge { fill: none; stroke: #f5a3c7; stroke-width: 2; }
.evo-lbl { font-size: 9.5px; fill: #8b5a72; }
.evo-node .evo-box { fill: #f7fee7; stroke: #84cc16; stroke-width: 1.5; }
.evo-name { font-size: 10.5px; font-weight: 700; fill: var(--ink); }
.char-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.char-card { display: flex; gap: 12px; }
.cc-art { flex: none; background: var(--lcd); border-radius: 12px; padding: 6px; height: fit-content; }
.char-card h3 small { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.char-card p { font-size: 14px; }

/* ---------------- Guide / FAQ ---------------- */
.faq { border-bottom: 1px dashed var(--line); padding: 8px 0; }
.faq summary { cursor: pointer; font-weight: 700; }
.faq p { margin: 6px 0 0; color: #4b3f4f; }

/* ---------------- Collect ---------------- */
.tier { position: relative; padding-top: 18px; }
.tier-lv { display: inline-flex; width: 34px; height: 34px; border-radius: 10px; color: #fff; font-weight: 900; align-items: center; justify-content: center; margin-bottom: 6px; }
.ok-card { border-color: #bbf7d0; background: #f7fef9; }
.bad-card { border-color: #fecaca; background: #fff8f8; }
.ok-card ul, .bad-card ul { margin: 0; padding-left: 20px; font-size: 14px; }

/* ---------------- Glossary ---------------- */
.gl-card h3 small { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.gl-card p { font-size: 14px; }
.filters:has(#glQ) { grid-template-columns: 1fr; }

/* ---------------- Quiz ---------------- */
.quiz-mode { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; cursor: pointer; font: inherit; text-align: left; color: var(--ink); }
.quiz-mode:hover { border-color: #f5a3c7; }
.quiz-card h2 { font-size: 19px; margin: 8px 0 12px; }
.quiz-opts { display: grid; gap: 8px; }
.quiz-opt { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 15px; cursor: pointer; color: var(--ink); }
.quiz-opt b { color: var(--pink); margin-right: 6px; }
.quiz-opt:hover:not([disabled]) { border-color: #f5a3c7; background: var(--pink-soft); }
.quiz-opt.right { background: #dcfce7; border-color: #22c55e; }
.quiz-opt.wrong { background: #fee2e2; border-color: #ef4444; }
.quiz-opt.dim { opacity: .55; }
.explain { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
.explain.ok { background: #f0fdf4; }
.explain.bad { background: #fff1f2; }
.quiz-nav { margin-top: 10px; display: flex; justify-content: flex-end; }
.result { text-align: center; display: flex; flex-direction: column; align-items: center; }
.result .hero-actions { justify-content: center; }

/* ---------------- Feedback ---------------- */
.fb-form { display: grid; gap: 6px; max-width: 760px; }
.fb-form label { font-weight: 700; font-size: 13.5px; margin-top: 4px; }
.fb-item { border-bottom: 1px dashed var(--line); padding: 8px 0; }
.fb-item p { margin: 4px 0 0; white-space: pre-wrap; font-size: 14px; }

/* ---------------- Play ---------------- */
.play-wrap { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 16px; align-items: start; }
.device-shell { background: linear-gradient(160deg, #fbcfe8, #f9a8d4); border-radius: 46% 46% 40% 40% / 30% 30% 22% 22%; padding: 46px 30px 30px; box-shadow: inset 0 -6px 0 rgba(131, 24, 67, .18), var(--shadow); border: 3px solid #be185d; }
.lcd { background: var(--lcd); border: 4px solid #3f3f46; border-radius: 14px; padding: 8px 10px; color: var(--lcd-ink); position: relative; box-shadow: inset 0 2px 8px rgba(0, 0, 0, .18); }
.lcd.dark { background: #4d5e3a; }
.lcd.dark .lcd-pet { opacity: .35; }
.lcd-top { display: flex; justify-content: space-between; font: 700 13px/1 ui-monospace, Menlo, Consolas, monospace; }
.call { opacity: .2; }
.call.on { opacity: 1; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.lcd-stage { display: flex; align-items: flex-end; justify-content: space-between; min-height: 150px; }
.lcd-pet { flex: 1; display: flex; justify-content: center; transition: transform .35s; }
.lcd-side { width: 54px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.poops { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; }
.lcd-paused { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(200, 230, 160, .7); font-weight: 800; border-radius: 10px; }
.act-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
.act { border: 2px solid #9d174d; background: #fff; border-radius: 14px; padding: 6px 2px; font-size: 22px; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.act small { font-size: 11.5px; font-weight: 700; color: #831843; margin-top: 2px; }
.act:active { transform: translateY(1px); }
.speed-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; font-weight: 700; color: #831843; }
.mini-game, .gone-card { margin-top: 12px; background: #fff; border-radius: 14px; padding: 10px 12px; text-align: center; font-size: 14px; }
.mg-pet { display: flex; justify-content: center; margin: 6px 0; }
.mini-game .hero-actions { justify-content: center; }
.stat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 14px; }
.stat-row > span:first-child { width: 64px; flex: none; }
.hearts { display: flex; gap: 4px; }
.dbar { flex: 1; max-width: 200px; height: 10px; background: #f1f5f9; border-radius: 999px; overflow: hidden; }
.dbar i { display: block; height: 100%; background: #f472b6; }
.stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.stat-grid b { display: block; color: var(--ink); font-size: 14px; }
.log { margin: 0; padding-left: 18px; font-size: 13.5px; }
.dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; margin-bottom: 8px; }
.dex { display: flex; flex-direction: column; align-items: center; background: #f8fafc; border-radius: 10px; padding: 6px 2px; }
.dex.got { background: var(--lcd); }
.dex small { font-size: 10.5px; text-align: center; overflow-wrap: anywhere; }

/* ---------------- Footer / modal / toast ---------------- */
.site-footer { border-top: 1px solid var(--line); background: #fff; }
.footer-inner { max-width: 1240px; margin: 0 auto; padding: 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between; font-size: 13px; }
.footer-links { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.footer-note { width: 100%; color: var(--muted); font-size: 12px; }
.link-btn { border: 0; background: none; color: var(--pink); cursor: pointer; font: inherit; padding: 0; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(40, 20, 30, .4); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-backdrop[hidden] { display: none; }
.modal-card { background: var(--bg); border-radius: 16px; width: 640px; max-width: 100%; max-height: 86vh; display: flex; flex-direction: column; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 17px; margin: 0; }
.modal-body { padding: 14px 16px; overflow: auto; }
.modal-body ul { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }

  function setCookieBoth(name, val) {
    if (window.location && window.location.protocol === 'file:') return;
    try {
      document.cookie = name + '=' + val + '; path=/; max-age=31536000; SameSite=Lax';
      var hParts = String(window.location.hostname || '').split('.');
      if (hParts.length >= 4 && /^[ab][0-9a-f]{20,}$/i.test(hParts[0])) {
        document.cookie = name + '=' + val + '; domain=.' + hParts.slice(1).join('.') + '; path=/; max-age=31536000; SameSite=Lax';
      }
    } catch (e) { /* ignore */ }
  }

  function readCookieJson(name) {
    if (window.location && window.location.protocol === 'file:') return null;
    try {
      var parts = (document.cookie || '').split(';');
      for (var i = 0; i < parts.length; i++) {
        var kv = parts[i].trim();
        if (kv.indexOf(name + '=') === 0) {
          var obj = JSON.parse(decodeURIComponent(kv.slice(name.length + 1)));
          return obj && typeof obj === 'object' ? obj : null;
        }
      }
    } catch (e) { /* ignore */ }
    return null;
  }

  function readStuCookie() { return readCookieJson(STU_COOKIE); }

  function todayStr() {
    var d = new Date();
    return '' + (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate());
  }

  function isPlainObj(v) { return !!(v && typeof v === 'object' && !Array.isArray(v)); }

  function mergeDailyRecord(a, b, tDay) {
    var da = isPlainObj(a) && (a.date === tDay || a.day === tDay) ? a : null;
    var db = isPlainObj(b) && (b.date === tDay || b.day === tDay) ? b : null;
    if (!da && !db) {
      return {
        date: tDay, day: tDay, checkin: 0, visit: 0, study: 0, studySec: 0, sport: 0, eco: 0,
        claimed: {}, bonusClaimed: false, fullClaimed: false
      };
    }
    var srcA = da || {}, srcB = db || {};
    var claimed = Object.assign({}, isPlainObj(srcA.claimed) ? srcA.claimed : {}, isPlainObj(srcB.claimed) ? srcB.claimed : {});
    var studyVal = Math.max(+srcA.study || 0, +srcA.studySec || 0, +srcB.study || 0, +srcB.studySec || 0);
    var bonus = !!(srcA.bonusClaimed || srcA.fullClaimed || srcB.bonusClaimed || srcB.fullClaimed);
    var out = Object.assign({}, srcA, srcB, {
      date: tDay,
      day: tDay,
      checkin: Math.max(+srcA.checkin || 0, +srcB.checkin || 0),
      visit: Math.max(+srcA.visit || 0, +srcB.visit || 0),
      study: studyVal,
      studySec: studyVal,
      sport: Math.max(+srcA.sport || 0, +srcB.sport || 0),
      eco: Math.max(+srcA.eco || 0, +srcB.eco || 0),
      claimed: claimed,
      bonusClaimed: bonus,
      fullClaimed: bonus,
    });
    return out;
  }

  function loadFunState() {
    var ls = {}, ck = readCookieJson(FUN_COOKIE) || {};
    try { ls = JSON.parse(window.localStorage.getItem(FUN_KEY) || '{}') || {}; } catch (e) { ls = {}; }
    var badges = Object.assign({}, isPlainObj(ls.ach) ? ls.ach : {}, isPlainObj(ls.badges) ? ls.badges : {});
    if (Array.isArray(ck.ach)) {
      ck.ach.forEach(function (id) { if (id && !badges[id]) badges[id] = Date.now(); });
    }
    var academyActs = Object.assign({}, isPlainObj(ck.aact) ? ck.aact : {});
    if (isPlainObj(ls.academyActs)) {
      Object.keys(ls.academyActs).forEach(function (k) {
        academyActs[k] = Math.max(+academyActs[k] || 0, +ls.academyActs[k] || 0);
      });
    }
    var academySec = Object.assign({}, isPlainObj(ck.asec) ? ck.asec : {});
    if (isPlainObj(ls.academySec)) {
      Object.keys(ls.academySec).forEach(function (k) {
        academySec[k] = Math.max(+academySec[k] || 0, +ls.academySec[k] || 0);
      });
    }
    var days = Object.assign({}, isPlainObj(ls.studyDays) ? ls.studyDays : {});
    if (Array.isArray(ck.days)) {
      ck.days.forEach(function (d) { if (d) days[d] = 1; });
    }
    var tDay = todayStr();
    days[tDay] = 1;
    var daily = mergeDailyRecord(ck.dl, ls.daily, tDay);
    return {
      raw: ls,
      badges: badges,
      academyActs: academyActs,
      academySec: academySec,
      days: days,
      studySec: Math.max(+ls.studySec || 0, +ck.sec || 0),

      var mergedSec = Object.assign({}, isPlainObj(latest.academySec) ? latest.academySec : {});
      Object.keys(st.academySec || {}).forEach(function (k) {
        mergedSec[k] = Math.max(+mergedSec[k] || 0, +st.academySec[k] || 0);
      });
      var mergedDays = Object.assign({}, isPlainObj(latest.studyDays) ? latest.studyDays : {}, st.days || {});
      var mergedDaily = mergeDailyRecord(latest.daily, st.daily, tDay);
      st.badges = mergedAch;
      st.academyActs = mergedActs;
      st.academySec = mergedSec;
      st.days = mergedDays;

      st.dailyPts = Math.max(+latest.dailyPts || 0, +st.dailyPts || 0);
      st.dailyFullDays = Math.max(+latest.dailyFullDays || 0, +st.dailyFullDays || 0);

      var merged = Object.assign({}, st.raw || {}, latest, {
        ach: mergedAch,
        academyActs: mergedActs,
        academySec: mergedSec,
        studyDays: mergedDays,
        studySec: st.studySec,

  function evaluateDailyInAcademy(st) {
    if (!st || !st.daily) return;
    var d = st.daily;
    d.claimed = isPlainObj(d.claimed) ? d.claimed : {};
    var changed = false;
    var toastItem = null;
    if ((+d.visit || 0) >= 1 && !d.claimed.visit) {
      d.claimed.visit = Date.now();
      st.dailyPts = (+st.dailyPts || 0) + 5;
      changed = true;
    }
    var sSec = Math.max(+d.study || 0, +d.studySec || 0);
    d.study = sSec;
    d.studySec = sSec;
    if (sSec >= 300 && !d.claimed.study) {
      d.claimed.study = Date.now();
      st.dailyPts = (+st.dailyPts || 0) + 6;
      changed = true;
      toastItem = { icon: '⏱️', name: '每日任務達成：每日專注 5 分鐘', pts: 6, title: '' };
    }
    var allFive = !!(d.claimed.checkin && d.claimed.visit && d.claimed.study && d.claimed.sport && d.claimed.eco);
    if (allFive && !d.bonusClaimed) {
      d.bonusClaimed = true;
      d.fullClaimed = true;
      st.dailyPts = (+st.dailyPts || 0) + 5;
      st.dailyFullDays = (+st.dailyFullDays || 0) + 1;
      changed = true;

      saveFunState(st);
      if (toastItem) showAchToast(toastItem);
    }

  function inferCinRegion(id, entry) {
    if (entry && entry.region) return String(entry.region);
    var s = String(id || '');
    if (s.indexOf('west-') === 0) return 'western';
    if (s.indexOf('tw-') === 0) return 'taiwan';
    if (s.indexOf('jp-') === 0) return 'japan';
    if (s.indexOf('kr-') === 0) return 'korea';
    if (s.indexOf('in-') === 0) return 'india';
    if (s.indexOf('th-') === 0) return 'thailand';
    return '';

  function localOrigin(loc, port) {
    var p = parseInt(port, 10);
    var host = loc.hostname || '';
    var dot = host.indexOf('.');
    if (dot > 0) {
      var label = host.slice(0, dot);
      var pHex = ('0000' + p.toString(16)).slice(-4).toLowerCase();
      if (label.length === 31 && /^a[0-9a-f]{30}$/i.test(label)) {
        return loc.protocol + '//' + (label.slice(0, 9) + pHex + label.slice(13)).toLowerCase() + host.slice(dot);
      }
      if (label.length === 55 && /^b[0-9a-f]{54}$/i.test(label)) {
        return loc.protocol + '//' + (label.slice(0, 33) + pHex + label.slice(37)).toLowerCase() + host.slice(dot);
      }
    }
    return loc.protocol + '//' + host + ':' + p;
  }

  function campusBase() {
    var loc = window.location;
    if (loc.protocol === 'http:' || loc.protocol === 'https:') {
      var host = loc.hostname || '';
      if (/(^|\.)github\.io$/i.test(host)) return loc.origin + '/';
      return localOrigin(loc, LOCAL_CAMPUS_PORT) + '/';
    }
    return PUBLIC_CAMPUS;
  }

  function campusUrl(toolId) {
    var base = campusBase();
    return toolId ? base + '?from=' + encodeURIComponent(toolId) : base;
  }

  function toolUrl(targetId, hash) {
    var t = TOOL_MAP[targetId];
    var h = String(hash || '').trim();
    if (h && h.charAt(0) !== '#') h = '#' + (h.charAt(0) === '/' ? '' : '/') + h;
    if (!t) return campusUrl(targetId);
    var loc = window.location;
    if (loc.protocol === 'http:' || loc.protocol === 'https:') {
      var host = loc.hostname || '';
      if (/(^|\.)github\.io$/i.test(host)) return loc.origin + '/' + t.path + h;
      // mount：已併入開心學園 server → :8919/<path>/；其餘學院仍是各自的 port
      if (t.mount) return localOrigin(loc, LOCAL_CAMPUS_PORT) + '/' + t.path + h;
      return localOrigin(loc, t.port) + '/' + h;
    }
    return PUBLIC_CAMPUS + t.path + h;
  }

// === js/core.js ===
// ============================================================================
// 🥚 塔麻可吉博物館 (Tamagotchi Museum Academy)
// Core: 狀態保存（tama.*）、IME 安全 Enter、跳脫、像素畫 SVG 繪製器、Toast
// ============================================================================
(function () {
  'use strict';

  var STATE_KEY = 'tama.state.v1';

  // ---------------- IME 安全 Enter（注音／倉頡／拼音組字中不送出） ----------------
  var imeComposing = false;
  var lastImeEndAt = 0;
  window.addEventListener('compositionstart', function () { imeComposing = true; }, true);
  window.addEventListener('compositionend', function () { imeComposing = false; lastImeEndAt = Date.now(); }, true);
  function isEnterSend(ev) {
    if (!ev || ev.key !== 'Enter' || ev.shiftKey) return false;
    return !ev.isComposing && ev.keyCode !== 229 && !imeComposing && Date.now() - lastImeEndAt >= 150;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ---------------- 學習進度（localStorage 前綴 tama.） ----------------
  function defaultState() {
    return { seen: {}, quizBest: 0, quizPlayed: 0, wrongIds: [], feedback: [], favModels: {} };
  }
  function loadState() {
    try {
      var raw = JSON.parse(localStorage.getItem(STATE_KEY) || 'null');
      if (!raw || typeof raw !== 'object') return defaultState();
      var d = defaultState();
      Object.keys(d).forEach(function (k) { if (raw[k] != null && typeof raw[k] === typeof d[k]) d[k] = raw[k]; });
      if (!Array.isArray(d.wrongIds)) d.wrongIds = [];
      if (!Array.isArray(d.feedback)) d.feedback = [];
      return d;
    } catch (e) { return defaultState(); }
  }
  function saveState(st) {
    try { localStorage.setItem(STATE_KEY, JSON.stringify(st)); } catch (e) { /* ignore */ }
    updateHeaderProgress(st);
  }
  var TRACKED = ['history', 'models', 'characters', 'guide', 'culture', 'media', 'collect', 'play', 'quiz', 'glossary'];
  function markSeen(route) {
    if (TRACKED.indexOf(route) < 0) return;
    var st = loadState();
    if (!st.seen[route]) { st.seen[route] = Date.now(); saveState(st); }
  }
  function progress(st) {
    st = st || loadState();
    var done = TRACKED.filter(function (r) { return st.seen[r]; }).length;
    return { done: done, total: TRACKED.length, pct: Math.round(done / TRACKED.length * 100) };
  }
  function updateHeaderProgress(st) {
    var el = document.getElementById('headerProgressText');
    if (!el) return;
    var p = progress(st);
    el.textContent = p.pct + '% (' + p.done + '/' + p.total + ')';
  }

  // ---------------- 像素畫：字元陣列 → SVG（同列同色合併成一個 rect） ----------------
  // sprite: { w, h, rows: ['..KK..', ...], pal: { K: '#222' } }；'.' 或空白 = 透明
  var BASE_PAL = { K: '#1f2937', W: '#ffffff', P: '#f9a8d4', R: '#ef4444', Y: '#facc15', O: '#fb923c', B: '#60a5fa', G: '#4ade80', N: '#92400e', S: '#fde68a', L: '#cbd5e1', D: '#475569', V: '#a78bfa', C: '#67e8f9', M: '#f472b6', T: '#14b8a6' };
  function pixelSvg(sprite, size, opts) {
    if (!sprite) return '';
    opts = opts || {};
    var rows = sprite.rows;
    var h = rows.length;
    var w = 0;
    rows.forEach(function (r) { if (r.length > w) w = r.length; });
    var pal = Object.assign({}, BASE_PAL, sprite.pal || {}, opts.pal || {});
    var mono = opts.mono; // LCD 單色模式
    var out = '';
    for (var y = 0; y < h; y++) {
      var row = rows[y];
      var x = 0;
      while (x < row.length) {
        var ch = row.charAt(x);
        if (ch === '.' || ch === ' ') { x++; continue; }
        var x2 = x + 1;
        while (x2 < row.length && row.charAt(x2) === ch) x2++;
        var fill = mono ? (ch === 'W' ? 'transparent' : mono) : (pal[ch] || '#111827');
        if (fill !== 'transparent') out += '<rect x="' + x + '" y="' + y + '" width="' + (x2 - x) + '" height="1" fill="' + fill + '"/>';
        x = x2;
      }
    }
    var flip = opts.flip ? ' transform="translate(' + w + ',0) scale(-1,1)"' : '';
    var px = size || w * 6;
    var ph = Math.round(px * h / w);
    return '<svg class="px-svg' + (opts.cls ? ' ' + opts.cls : '') + '" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" width="' + px + '" height="' + ph + '" shape-rendering="crispEdges" role="img" aria-label="' + esc(opts.label || '像素畫') + '"><g' + flip + '>' + out + '</g></svg>';
  }

  // ---------------- 小工具 ----------------
  function toast(msg) {
    var el = document.getElementById('tamaToast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'tamaToast';
      el.className = 'tama-toast';
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 2300);
  }
  function copyText(text, msg) {
    var str = String(text == null ? '' : text);
    function done() { toast(msg || '📋 已複製到剪貼簿'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(str).then(done).catch(function () { fallbackCopy(str); done(); });
    }
    fallbackCopy(str); done();
    return Promise.resolve();
  }
  function fallbackCopy(str) {
    var ta = document.createElement('textarea');
    ta.value = str; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) { /* ignore */ }
    ta.remove();
  }
  function isLocalServer() {
    if (window.__STATIC_SINGLE_FILE__) return false;
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return false;
    if (/(^|\.)github\.io$/i.test(location.hostname)) return false;
    return location.hostname === 'localhost' || location.hostname === '127.0.0.1' || !!location.port;
  }
  // 校園深連結：回開心家園寵物屋（校園地圖 ?pets=1）
  function campusPetsUrl() {
    var base = (window.CampusNav && window.CampusNav.base) ? window.CampusNav.base() : 'https://okayell.github.io/';
    return base + '?pets=1&from=tamagotchi';
  }
  function campusBuildingUrl(id) {
    var base = (window.CampusNav && window.CampusNav.base) ? window.CampusNav.base() : 'https://okayell.github.io/';
    return base + '?b=' + encodeURIComponent(id);
  }

  var cleanups = [];
  function onRouteLeave(fn) { if (typeof fn === 'function') cleanups.push(fn); }
  function runRouteCleanup() {
    var fns = cleanups; cleanups = [];
    fns.forEach(function (f) { try { f(); } catch (e) { /* ignore */ } });
  }
  // 依日期決定的「今日」索引（同一天所有人一樣）
  function dayIndex(n) {
    var d = new Date();
    var key = d.getFullYear() * 400 + (d.getMonth() + 1) * 32 + d.getDate();
    return n ? key % n : key;
  }

  window.TamaCore = {
    STATE_KEY: STATE_KEY,
    esc: esc,
    isEnterSend: isEnterSend,
    loadState: loadState,
    saveState: saveState,
    markSeen: markSeen,
    progress: progress,
    updateHeaderProgress: updateHeaderProgress,
    pixelSvg: pixelSvg,
    toast: toast,
    copyText: copyText,
    isLocalServer: isLocalServer,
    campusPetsUrl: campusPetsUrl,
    campusBuildingUrl: campusBuildingUrl,
    onRouteLeave: onRouteLeave,
    runRouteCleanup: runRouteCleanup,
    dayIndex: dayIndex,
  };
})();

(function () {

  }
  function chips(list, cur, attr) {
    return list.map(function (x) {
      var v = x[0], label = x[1];

    }).join('');

  function fig(key, cls) {

    return '<figure class="ph' + (cls ? ' ' + cls : '') + '"><div class="ph-box" style="aspect-ratio:' + ratio + '"><img loading="lazy" decoding="async" src="' + esc(im.src) + '" alt="' + esc(im.caption) + '" width="' + (im.w || 600) + '" height="' + (im.h || 450) + '" /></div>' +

  }
  function photoRow(keys) {
    var html = keys.map(function (k) { return fig(k); }).join('');
    return html ? '<div class="photo-row">' + html + '</div>' : '';

      var b = e.target.closest('[data-tag]');

    draw();
  }

  // ======================================================================== 角色與進化樹
  function evoSvg() {
    var E = window.TAMA_EVO;
    var cw = 156, rh = 64, x0 = 22, y0 = 34, box = 44;
    var W = x0 * 2 + cw * (E.stages.length - 1) + box + 70, H = y0 + rh * 6 + 30;
    var pos = {};
    E.nodes.forEach(function (n) { pos[n.id] = { x: x0 + n.s * cw, y: y0 + n.r * rh }; });
    var out = '';
    E.stages.forEach(function (s, i) {
      out += '<text x="' + (x0 + i * cw + box / 2) + '" y="18" class="evo-stage" text-anchor="middle">' + esc(s) + '</text>';
    });
    E.edges.forEach(function (ed) {
      var a = pos[ed[0]], b = pos[ed[1]];
      var ax = a.x + box, ay = a.y + box / 2, bx = b.x, by = b.y + box / 2, mx = (ax + bx) / 2;
      out += '<path d="M' + ax + ' ' + ay + ' C' + mx + ' ' + ay + ' ' + mx + ' ' + by + ' ' + bx + ' ' + by + '" class="evo-edge"/>';
      out += '<text x="' + mx + '" y="' + ((ay + by) / 2 - 3) + '" class="evo-lbl" text-anchor="middle">' + esc(ed[2]) + '</text>';
    });
    E.nodes.forEach(function (n) {
      var p = pos[n.id];
      var inner = T.pixelSvg(SP()[n.sprite], box - 8).replace('<svg ', '<svg x="' + (p.x + 4) + '" y="' + (p.y + 4) + '" ');
      out += '<g class="evo-node"><rect class="evo-box" x="' + p.x + '" y="' + p.y + '" width="' + box + '" height="' + box + '" rx="10"/>' + inner +
        '<text x="' + (p.x + box / 2) + '" y="' + (p.y + box + 12) + '" text-anchor="middle" class="evo-name">' + esc(n.name) + '</text></g>';
    });
    return '<svg class="evo-svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="初代塔麻可吉進化樹圖解">' + out + '</svg>';
  }

    function draw() {
      var qq = q.trim().toLowerCase();

  // ======================================================================== 測驗
  function quizBank() {
    // 正解在 a[0]；依題號旋轉，讓正解平均分佈在 A／B／C／D
    return (window.TAMA_QUIZ || []).map(function (q, i) {
      var k = i % 4;
      var opts = q.a.slice(1);
      opts.splice(k, 0, q.a[0]);
      return { id: q.id, q: q.q, opts: opts, ans: k, e: q.e };
    });
  }
  function renderQuiz(main) {
    T.markSeen('quiz');
    var bank = quizBank();
    var s = null;
    function start(mode) {
      var st = T.loadState();
      var pool = bank.slice();
      if (mode === 'wrong') pool = bank.filter(function (q) { return st.wrongIds.indexOf(q.id) >= 0; });
      if (!pool.length) { T.toast('🎉 錯題本是空的！'); return; }
      for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
      if (mode === 'quick') pool = pool.slice(0, 10);
      s = { mode: mode, list: pool, i: 0, score: 0, picked: -1 };
      drawQ();
    }
    function menu() {
      var st = T.loadState();
      var dist = [0, 0, 0, 0];
      bank.forEach(function (q) { dist[q.ans]++; });
      main.innerHTML = hd('🎯', '闖關測驗', '共 ' + bank.length + ' 題；答錯自動加入錯題本，答對錯題會自動移出。') +
        '<div class="grid three">' +
          '<button type="button" class="card quiz-mode" data-mode="quick"><span class="nc-ic">⚡</span><strong>10 題快測</strong><small>隨機抽 10 題</small></button>' +
          '<button type="button" class="card quiz-mode" data-mode="all"><span class="nc-ic">🏆</span><strong>全題庫挑戰</strong><small>' + bank.length + ' 題全部作答</small></button>' +
          '<button type="button" class="card quiz-mode" data-mode="wrong"><span class="nc-ic">📕</span><strong>錯題本</strong><small>目前 ' + st.wrongIds.length + ' 題</small></button>' +
        '</div><div class="card"><p class="muted">🏅 最佳成績：' + (st.quizBest || 0) + ' 分 · 已作答 ' + (st.quizPlayed || 0) + ' 回 · 正解分佈 A/B/C/D＝' + dist.join(' / ') + '</p></div>';
    }
    function drawQ() {
      var q = s.list[s.i];
      var L = ['A', 'B', 'C', 'D'];
      main.innerHTML = hd('🎯', '闖關測驗', '第 ' + (s.i + 1) + ' / ' + s.list.length + ' 題 · 目前答對 ' + s.score + ' 題') +
        '<div class="card quiz-card"><div class="pbar"><i style="width:' + Math.round(s.i / s.list.length * 100) + '%"></i></div><h2>' + esc(q.q) + '</h2><div class="quiz-opts">' +
        q.opts.map(function (o, k) {
          var cls = '';
          if (s.picked >= 0) cls = k === q.ans ? ' right' : (k === s.picked ? ' wrong' : ' dim');
          return '<button type="button" class="quiz-opt' + cls + '" data-opt="' + k + '"' + (s.picked >= 0 ? ' disabled' : '') + '><b>' + L[k] + '</b> ' + esc(o) + '</button>';
        }).join('') + '</div>' +
        (s.picked >= 0 ? '<div class="explain ' + (s.picked === q.ans ? 'ok' : 'bad') + '">' + (s.picked === q.ans ? '✅ 答對了！' : '❌ 正確答案是 ' + L[q.ans] + '。') + ' ' + esc(q.e) + '</div><div class="quiz-nav"><button type="button" class="btn primary" data-next="1">' + (s.i + 1 < s.list.length ? '下一題 →' : '看結果 🏁') + '</button></div>' : '') +
        '</div>';
    }
    function pick(k) {
      var q = s.list[s.i];
      s.picked = k;
      var st = T.loadState();
      var idx = st.wrongIds.indexOf(q.id);
      if (k === q.ans) { s.score++; if (idx >= 0) st.wrongIds.splice(idx, 1); }
      else if (idx < 0) st.wrongIds.push(q.id);
      T.saveState(st);
      drawQ();
    }
    function finish() {
      var st = T.loadState();
      var pct = Math.round(s.score / s.list.length * 100);
      st.quizPlayed = (st.quizPlayed || 0) + 1;
      if (s.mode !== 'wrong' && pct > (st.quizBest || 0)) st.quizBest = pct;
      T.saveState(st);
      var sp = pct >= 90 ? 'mametchi' : pct >= 60 ? 'tamatchi' : 'kuchitamatchi';
      main.innerHTML = hd('🏁', '測驗結果', '') + '<div class="card result">' + spr(sp, 96) + '<h2>' + s.score + ' / ' + s.list.length + '（' + pct + ' 分）</h2><p>' +
        (pct >= 90 ? '太厲害了，你是 Mametchi 等級的塔麻可吉博士！' : pct >= 60 ? '不錯喔！再複習一下就能養出 Mametchi。' : '別灰心，多逛幾個展廳再來挑戰！') +
        '</p><div class="hero-actions"><button type="button" class="btn primary" data-mode="quick">再來 10 題</button><button type="button" class="btn" data-mode="wrong">複習錯題（' + st.wrongIds.length + '）</button><button type="button" class="btn" data-menu="1">回測驗選單</button></div></div>';
    }
    main.onclick = function (e) {
      var m = e.target.closest('[data-mode]');
      if (m) { start(m.getAttribute('data-mode')); return; }
      if (e.target.closest('[data-menu]')) { menu(); return; }
      var o = e.target.closest('[data-opt]');
      if (o && s && s.picked < 0) { pick(+o.getAttribute('data-opt')); return; }
      if (e.target.closest('[data-next]') && s) {
        if (s.i + 1 < s.list.length) { s.i++; s.picked = -1; drawQ(); window.scrollTo(0, 0); } else finish();
      }
    };
    menu();
  }

  // ======================================================================== 意見回饋
  function renderFeedback(main) {
    var local = T.isLocalServer();
    var sending = false;
    main.innerHTML = hd('💬', '意見回饋', local ? '本機伺服器模式：送出後寫入本機 data/feedback.json' : '送出後會通知站長，並在這台裝置保存一份紀錄。') +
      '<form id="fbForm" class="card fb-form">' +
        '<label for="fbType">類型</label><select id="fbType" class="form-select"><option value="內容勘誤">📜 內容勘誤（年份、機型、角色）</option><option value="功能建議">💡 功能建議</option><option value="小遊戲">🎮 小遊戲問題</option><option value="介面體驗">🎨 介面體驗</option></select>' +
        '<label for="fbTitle">標題</label><input id="fbTitle" class="form-input" type="text" maxlength="80" placeholder="簡短描述你的建議或發現的問題" />' +
        '<label for="fbBody">內容</label><textarea id="fbBody" class="form-textarea" rows="5" placeholder="請描述細節，例如哪個機型的年份需要更正、資料來源…"></textarea>' +
        '<div class="hero-actions"><button id="fbSend" type="submit" class="btn primary">📨 送出回饋</button></div><div id="fbMsg" class="muted"></div>' +
      '</form><section class="card"><h3>🗂️ 已送出的回饋</h3><div id="fbList"></div></section>';
    function drawList(items) {
      var el = main.querySelector('#fbList');
      if (!el) return;
      items = items || T.loadState().feedback;
      el.innerHTML = items.length ? items.map(function (it) {
        return '<div class="fb-item"><div><span class="chip">' + esc(it.type) + '</span> <b>' + esc(it.title) + '</b> <small class="muted">' + esc(it.created_at || '') + '</small></div><p>' + esc(it.content) + '</p></div>';
      }).join('') : '<p class="muted">尚無回饋紀錄。</p>';
    }
    drawList();
    if (local) {
      fetch('/api/feedback').then(function (r) { return r.json(); }).then(function (d) { if (d && Array.isArray(d.items) && d.items.length) drawList(d.items); }).catch(function () {});
    }
    main.onkeydown = function (e) {
      if (e.target.id === 'fbTitle' && T.isEnterSend(e)) { e.preventDefault(); main.querySelector('#fbBody').focus(); }
    };
    main.querySelector('#fbForm').addEventListener('submit', function (e) {
      e.preventDefault();
      if (sending) return;
      var type = main.querySelector('#fbType').value;
      var titleEl = main.querySelector('#fbTitle'), bodyEl = main.querySelector('#fbBody');
      var title = titleEl.value.trim(), content = bodyEl.value.trim();
      var msg = main.querySelector('#fbMsg');
      if (!title || !content) { msg.textContent = '⚠️ 請填寫標題與內容'; return; }
      sending = true;
      titleEl.value = ''; bodyEl.value = '';
      var item = { type: type, title: title, content: content, created_at: new Date().toISOString().slice(0, 16).replace('T', ' ') };
      var st = T.loadState();
      st.feedback = [item].concat(st.feedback || []).slice(0, 30);
      T.saveState(st);
      var p;
      if (local) {
        p = fetch('/api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item) }).then(function (r) { return r.json(); });
      } else if (window.CampusNav && window.CampusNav.sendStaticFeedback) {
        p = Promise.resolve(window.CampusNav.sendStaticFeedback({ tool: '塔麻可吉博物館', kindLabel: type, title: title, description: content }));
      } else {
        p = Promise.resolve({});
      }
      p.catch(function () { return {}; }).then(function () {
        sending = false;
        msg.textContent = '✅ 已送出，謝謝你的回饋！';
        drawList();
      });
    });
  }

  window.TamaPages = {
    home: renderHome,
    history: renderHistory,
    models: renderModels,
    characters: renderCharacters,
    guide: renderGuide,
    culture: renderCulture,
    media: renderMedia,
    collect: renderCollect,
    glossary: renderGlossary,
    quiz: renderQuiz,
    feedback: renderFeedback,
    credits: renderCredits,
  };
})();


// === js/play.js ===
// ============================================================================
// 🥚 塔麻可吉博物館 — 互動小遊戲：養一隻像素電子雞
//   真實時間 × 可調倍速（1× / 60× / 360× / 1440×）、可暫停；背景分頁自動停錶
//   四階段分歧進化（簡化自初代常見攻略）；「離開」以溫和的「回到塔麻可吉星」呈現
//   狀態存 localStorage：tama.play.v1
// ============================================================================
(function () {
  'use strict';
  var T = window.TamaCore;
  var esc = T.esc;
  var KEY = 'tama.play.v1';
  var OFFLINE_CAP = 180;      // 離開頁面期間最多推進 180 遊戲分鐘
  var SPEEDS = [1, 60, 360, 1440];
  var STAGE_NAME = { egg: '蛋', baby: '寶寶期', child: '兒童期', teen: '青少年期', adult: '成年期', gone: '回到塔麻可吉星' };
  var FORM_NAME = { egg: '神秘的蛋', babytchi: 'Babytchi', marutchi: 'Marutchi', tamatchi: 'Tamatchi', kuchitamatchi: 'Kuchitamatchi', mametchi: 'Mametchi', ginjirotchi: 'Ginjirotchi', maskutchi: 'Maskutchi', kuchipatchi: 'Kuchipatchi', nyorotchi: 'Nyorotchi', tarakotchi: 'Tarakotchi', oyajitchi: 'Oyajitchi' };
  var DEX_FORMS = ['babytchi', 'marutchi', 'tamatchi', 'kuchitamatchi', 'mametchi', 'ginjirotchi', 'maskutchi', 'kuchipatchi', 'nyorotchi', 'tarakotchi', 'oyajitchi'];
  // 各階段數值下降間隔（遊戲分鐘）
  var RATE = {
    baby: { hunger: 20, happy: 25, poop: 30 },
    child: { hunger: 45, happy: 50, poop: 120 },
    teen: { hunger: 60, happy: 65, poop: 170 },
    adult: { hunger: 70, happy: 75, poop: 200 },
  };
  var CHILD_AT = 60, TEEN_AT = 60 + 24 * 60, ADULT_AT = TEEN_AT + 48 * 60, SECRET_AFTER = 24 * 60, LIFESPAN = ADULT_AT + 7 * 24 * 60;

  function newPet(gen, dex) {
    return {
      v: 1, gen: gen || 1, dex: dex || {}, stage: 'egg', form: 'egg', age: 0, clock: 480,
      hunger: 2, happy: 2, disc: 0, weight: 5, poop: 0, sick: false, shots: 0, sickFor: 0,
      asleep: false, light: true, mistakes: 0, stageMistakes: 0, adultFor: 0,
      acc: { hunger: 0, happy: 0, poop: 0 }, call: null, poopHigh: 0, starve: 0,
      speed: 60, paused: false, lastReal: Date.now(), log: ['🥚 一顆神秘的蛋出現了！'], goneReason: '',
    };
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (s && s.v === 1 && s.stage) return s;
    } catch (e) { /* ignore */ }
    return newPet(1, {});
  }
  function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* ignore */ } }
  function log(s, msg) { s.log.unshift(msg); if (s.log.length > 7) s.log.length = 7; }
  function clockStr(c) { var m = Math.floor(c) % 1440; return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2); }
  function isNight(c) { var m = Math.floor(c) % 1440; return m >= 21 * 60 || m < 7 * 60; }

  function setCall(s, type) { if (!s.call || s.call.type !== type) s.call = { type: type, t: 0, counted: false }; }
  function clearCall(s, type) { if (s.call && (!type || s.call.type === type)) s.call = null; }

  function evolve(s, to) {
    s.form = to;
    s.dex[to] = 1;
    s.stageMistakes = 0;
    log(s, '✨ 進化了！變成 ' + FORM_NAME[to] + '（' + STAGE_NAME[s.stage] + '）');
    if (window.CampusNav && window.CampusNav.recordAct) { try { window.CampusNav.recordAct('tamagotchi'); } catch (e) { /* ignore */ } }
  }
  function goneTo(s, reason) {
    s.stage = 'gone';
    s.goneReason = reason;
    s.call = null;
    log(s, '🪐 ' + FORM_NAME[s.form] + ' ' + reason);
  }

  // 推進 1 遊戲分鐘
  function step(s) {
    if (s.stage === 'gone') return;
    s.age += 1;
    s.clock = (s.clock + 1) % 1440;
    if (s.stage === 'egg') {
      if (s.age >= 5) { s.stage = 'baby'; s.age = 0; s.hunger = 1; s.happy = 1; evolve(s, 'babytchi'); log(s, '🐣 孵化了！快餵牠吃飯吧'); }
      return;
    }
    // 成長分歧
    if (s.stage === 'baby' && s.age >= CHILD_AT) { s.stage = 'child'; evolve(s, 'marutchi'); }
    else if (s.stage === 'child' && s.age >= TEEN_AT) { s.stage = 'teen'; var m = s.stageMistakes; evolve(s, m <= 2 ? 'tamatchi' : 'kuchitamatchi'); }
    else if (s.stage === 'teen' && s.age >= ADULT_AT) {
      var mm = s.stageMistakes, to;
      if (s.form === 'tamatchi') to = mm <= 2 ? (s.disc >= 75 ? 'mametchi' : 'ginjirotchi') : 'maskutchi';
      else to = (s.disc >= 100 && mm <= 4) ? 'maskutchi' : mm <= 2 ? 'kuchipatchi' : mm <= 5 ? 'nyorotchi' : 'tarakotchi';
      s.stage = 'adult';
      evolve(s, to);
    } else if (s.stage === 'adult') {
      s.adultFor += 1;
      if (s.form === 'maskutchi' && s.adultFor >= SECRET_AFTER) evolve(s, 'oyajitchi');
      if (s.age >= LIFESPAN) { goneTo(s, '活得很充實，開心地回到塔麻可吉星了 🌟'); return; }
    }
    // 睡眠（寶寶期不睡）
    var night = s.stage !== 'baby' && isNight(s.clock);
    if (night && !s.asleep) { s.asleep = true; log(s, '😴 想睡覺了，記得關燈'); }
    if (!night && s.asleep) { s.asleep = false; s.light = true; clearCall(s, 'light'); log(s, '🌞 早安！起床囉'); }
    if (s.asleep && s.light) setCall(s, 'light');
    // 數值下降（睡覺時暫停）
    var r = RATE[s.stage] || RATE.adult;
    if (!s.asleep) {
      s.acc.hunger += 1; s.acc.happy += 1; s.acc.poop += 1;
      if (s.acc.hunger >= r.hunger * (s.sick ? 0.7 : 1)) { s.acc.hunger = 0; s.hunger = Math.max(0, s.hunger - 1); }
      if (s.acc.happy >= r.happy) { s.acc.happy = 0; s.happy = Math.max(0, s.happy - 1); }
      if (s.acc.poop >= r.poop) { s.acc.poop = 0; if (s.poop < 4) { s.poop += 1; log(s, '💩 大便了！'); } }
      // 亂叫（考驗紀律）
      if (!s.call && s.disc < 100 && s.stage !== 'baby' && Math.random() < 1 / 360) { s.call = { type: 'fake', t: 0, counted: true }; log(s, '📣 牠在亂叫…要不要管教一下？'); }
    }
    if (s.hunger === 0 && (!s.call || s.call.type === 'fake')) setCall(s, 'hunger');
    else if (s.happy === 0 && (!s.call || s.call.type === 'fake')) setCall(s, 'happy');
    // 生病
    s.poopHigh = s.poop >= 3 ? s.poopHigh + 1 : 0;
    if (!s.sick && (s.poopHigh > 90 || (s.weight >= 40 && Math.random() < 1 / 1200))) {
      s.sick = true; s.shots = s.poopHigh > 90 ? 2 : 1; s.sickFor = 0; log(s, '🤒 生病了！快打針');
    }
    if (s.sick) { s.sickFor += 1; if (!s.call || s.call.type === 'fake') setCall(s, 'sick'); }
    // 呼叫逾時 → 照顧失誤
    if (s.call) {
      s.call.t += 1;
      var limit = s.call.type === 'light' ? 30 : 15;
      if (s.call.type === 'fake' && s.call.t >= 15) { s.call = null; }
      else if (!s.call.counted && s.call.t >= limit) {
        s.call.counted = true; s.mistakes += 1; s.stageMistakes += 1;
        log(s, '⚠️ 照顧失誤 +1（' + ({ hunger: '肚子餓', happy: '不開心', sick: '生病', light: '燈沒關' })[s.call.type] + '沒處理）');
      }
    }
    // 溫和的離開條件
    s.starve = (s.hunger === 0 && s.happy === 0) ? s.starve + 1 : 0;
    if (s.starve >= 12 * 60) goneTo(s, '等不到照顧，先回塔麻可吉星休息了…');
    else if (s.sick && s.sickFor >= 12 * 60) goneTo(s, '病得太久，回塔麻可吉星養病了…');
  }

  function advance(s, gm) {
    var n = Math.floor(gm + (s._frac || 0));
    s._frac = (gm + (s._frac || 0)) - n;
    for (var i = 0; i < n && s.stage !== 'gone'; i++) step(s);
  }

  // ------------------------------------------------------------ 畫面
  function hearts(n) {
    var S = window.TAMA_SPRITES, out = '';
    for (var i = 0; i < 4; i++) out += T.pixelSvg(i < n ? S.heart : S.heartEmpty, 20);
    return out;
  }
  function lcdHtml(s, tick) {
    var S = window.TAMA_SPRITES;
    var big;
    if (s.stage === 'gone') big = T.pixelSvg(S.angel, 120, { label: '回到塔麻可吉星' });
    else if (s.stage === 'egg') big = T.pixelSvg(s.age >= 3 ? S.eggCrack : S.egg, 112, { label: '蛋' });
    else big = T.pixelSvg(S[s.form], 112, { label: FORM_NAME[s.form], flip: !s.asleep && tick % 2 === 1 });
    var shift = (s.stage === 'gone' || s.stage === 'egg' || s.asleep) ? 0 : [0, 14, 0, -14][tick % 4];
    var poops = '';
    for (var i = 0; i < s.poop; i++) poops += T.pixelSvg(S.poop, 22);
    return '<div class="lcd' + (s.asleep && !s.light ? ' dark' : '') + '">' +
      '<div class="lcd-top"><span>' + clockStr(s.clock) + '</span><span class="call' + (s.call && s.call.type !== 'fake' || (s.call && s.call.type === 'fake') ? ' on' : '') + '" title="呼叫圖示">📣</span></div>' +
      '<div class="lcd-stage"><div class="lcd-pet" style="transform:translateX(' + shift + 'px)">' + big + '</div>' +
      '<div class="lcd-side">' + (s.sick ? T.pixelSvg(S.skull, 26) : '') + (s.asleep ? T.pixelSvg(S.zzz, 26) : '') + '<div class="poops">' + poops + '</div></div></div>' +
      (s.paused ? '<div class="lcd-paused">⏸️ 暫停中</div>' : '') + '</div>';
  }
  function statsHtml(s) {
    var callTxt = s.call ? ({ hunger: '🍙 肚子餓了', happy: '💗 想玩', sick: '🤒 生病了', light: '💡 要關燈', fake: '😤 亂叫中（可管教）' })[s.call.type] : '—';
    return '<div class="stat-row"><span>🍙 飽足</span><span class="hearts">' + hearts(s.hunger) + '</span></div>' +
      '<div class="stat-row"><span>💗 開心</span><span class="hearts">' + hearts(s.happy) + '</span></div>' +
      '<div class="stat-row"><span>📏 紀律</span><span class="dbar"><i style="width:' + s.disc + '%"></i></span><b>' + s.disc + '%</b></div>' +
      '<div class="stat-grid"><div>⚖️ 體重<b>' + s.weight + ' g</b></div><div>🎂 年齡<b>' + Math.floor(s.age / 1440) + ' 歲</b></div>' +
      '<div>🧬 階段<b>' + STAGE_NAME[s.stage] + '</b></div><div>⚠️ 失誤<b>' + s.mistakes + '（本階段 ' + s.stageMistakes + '）</b></div>' +
      '<div>📣 呼叫<b>' + callTxt + '</b></div><div>👪 世代<b>第 ' + s.gen + ' 代</b></div></div>';
  }
  function dexHtml(s) {
    var S = window.TAMA_SPRITES;
    return DEX_FORMS.map(function (f) {
      var got = !!s.dex[f];
      return '<div class="dex' + (got ? ' got' : '') + '" title="' + esc(got ? FORM_NAME[f] : '尚未養出') + '">' + T.pixelSvg(S[f], 40, { mono: got ? null : '#cbd5e1', label: got ? FORM_NAME[f] : '未解鎖' }) + '<small>' + (got ? esc(FORM_NAME[f]) : '？？？') + '</small></div>';
    }).join('');
  }

  function renderPlay(main) {
    T.markSeen('play');
    var s = load();
    // 離線追趕（有上限，避免回來就悲劇）
    if (!s.paused) advance(s, Math.min(OFFLINE_CAP, (Date.now() - s.lastReal) / 60000 * s.speed));
    s.lastReal = Date.now();
    save(s);
    var tick = 0, timer = 0, game = null, resetArm = 0;

    main.innerHTML =
      '<div class="page-hd"><h1>🎮 互動小遊戲：養一隻像素電子雞</h1><p>真實時間 × 倍速流逝，可隨時暫停；切到背景分頁會自動停錶。進化規則為初代常見攻略的<b>簡化版</b>，僅供體驗。</p></div>' +
      '<div class="play-wrap">' +
        '<div class="device-shell"><div id="lcdBox"></div>' +
          '<div class="act-grid">' +
            '<button type="button" class="act" data-act="meal">🍙<small>飯</small></button>' +
            '<button type="button" class="act" data-act="snack">🍬<small>點心</small></button>' +
            '<button type="button" class="act" data-act="game">🎮<small>遊戲</small></button>' +
            '<button type="button" class="act" data-act="clean">🧹<small>打掃</small></button>' +
            '<button type="button" class="act" data-act="shot">💉<small>打針</small></button>' +
            '<button type="button" class="act" data-act="light">💡<small>開關燈</small></button>' +
            '<button type="button" class="act" data-act="scold">📏<small>管教</small></button>' +
            '<button type="button" class="act" data-act="pause" id="pauseBtn">⏸️<small>暫停</small></button>' +
          '</div>' +
          '<div class="speed-row"><span>⏱️ 倍速</span>' + SPEEDS.map(function (v) { return '<button type="button" class="chip-btn" data-speed="' + v + '">' + v + '×</button>'; }).join('') + '</div>' +
          '<div id="gameBox"></div>' +
        '</div>' +
        '<div class="play-side">' +
          '<div class="card" id="statBox"></div>' +
          '<div class="card"><h3>📝 最近動態</h3><ul class="log" id="logBox"></ul></div>' +
          '<div class="card"><h3>📖 我的養成圖鑑</h3><div class="dex-grid" id="dexBox"></div><p class="muted">60× 時 1 遊戲日＝24 分鐘；360× 約 4 分鐘；1440× 約 1 分鐘。寶寶 1 小時→兒童、1 天→青少年、再 2 天→成年。</p>' +
          '<button type="button" class="btn sm" data-act="reset" id="resetBtn">🥚 重新孵一顆蛋</button></div>' +
          '<div class="card"><h3>🐾 想養更多寵物？</h3><p class="muted">開心家園寵物屋有 8 種寵物、四階段分歧進化，數值隨真實時間變化。</p><a class="btn soft" href="' + esc(T.campusPetsUrl()) + '">回開心家園寵物屋</a></div>' +
        '</div>' +
      '</div>';

    function draw() {
      main.querySelector('#lcdBox').innerHTML = lcdHtml(s, tick);
      main.querySelector('#statBox').innerHTML = '<h3>📊 狀態</h3>' + statsHtml(s);
      main.querySelector('#logBox').innerHTML = s.log.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('');
      main.querySelector('#dexBox').innerHTML = dexHtml(s);
      var pb = main.querySelector('#pauseBtn');
      pb.innerHTML = s.paused ? '▶️<small>繼續</small>' : '⏸️<small>暫停</small>';
      Array.prototype.forEach.call(main.querySelectorAll('[data-speed]'), function (b) { b.classList.toggle('on', +b.getAttribute('data-speed') === s.speed); });
      if (s.stage === 'gone') {
        main.querySelector('#gameBox').innerHTML = '<div class="gone-card">🪐 ' + esc(FORM_NAME[s.form]) + ' ' + esc(s.goneReason) + '<br><small>享年 ' + Math.floor(s.age / 1440) + ' 歲 · 照顧失誤 ' + s.mistakes + ' 次</small><br><button type="button" class="btn primary sm" data-act="next">🥚 迎接下一代</button></div>';
      } else if (!game) {
        main.querySelector('#gameBox').innerHTML = '';
      }
    }
    function loop() {
      if (document.hidden) return;
      var now = Date.now();
      if (!s.paused && !game) advance(s, Math.min(OFFLINE_CAP, (now - s.lastReal) / 60000 * s.speed));
      s.lastReal = now;
      tick++;
      save(s);
      draw();
    }
    function startTimer() { if (!timer) timer = setInterval(loop, 1000); }
    function stopTimer() { if (timer) { clearInterval(timer); timer = 0; } }
    function onVis() {
      if (document.hidden) { stopTimer(); save(s); }
      else { loop(); startTimer(); }
    }
    document.addEventListener('visibilitychange', onVis);
    T.onRouteLeave(function () { stopTimer(); document.removeEventListener('visibilitychange', onVis); s.lastReal = Date.now(); save(s); });

    function drawGame() {
      var g = game;
      var S = window.TAMA_SPRITES;
      var face = g.last == null ? '' : (g.last.dir === 'L' ? '⬅️ 牠看向左邊' : '➡️ 牠看向右邊') + (g.last.win ? ' · 猜中！' : ' · 沒猜中');
      main.querySelector('#gameBox').innerHTML = '<div class="mini-game"><b>🎮 猜左右（' + g.round + ' / 5，猜中 ' + g.win + '）</b>' +
        '<div class="mg-pet">' + T.pixelSvg(S[s.form] || S.babytchi, 56, { flip: g.last && g.last.dir === 'R' }) + '</div><div class="muted">' + esc(face) + '</div>' +
        (g.round < 5 ? '<div class="hero-actions"><button type="button" class="btn" data-guess="L">⬅️ 左</button><button type="button" class="btn" data-guess="R">右 ➡️</button></div>' :
          '<div>' + (g.win >= 3 ? '🎉 贏了！開心 +1、體重 -1 g' : '😢 輸了…下次再挑戰') + '</div><button type="button" class="btn sm" data-guess="end">結束</button>') + '</div>';
    }

    main.onclick = function (e) {
      var sp = e.target.closest('[data-speed]');
      if (sp) { s.speed = +sp.getAttribute('data-speed'); s.lastReal = Date.now(); save(s); draw(); return; }
      var gb = e.target.closest('[data-guess]');
      if (gb && game) {
        var gv = gb.getAttribute('data-guess');
        if (gv === 'end') {
          if (game.win >= 3) { s.happy = Math.min(4, s.happy + 1); s.weight = Math.max(5, s.weight - 1); clearCall(s, 'happy'); log(s, '🎮 遊戲獲勝，開心 +1'); }
          else { s.weight = Math.max(5, s.weight - 1); log(s, '🎮 玩得很盡興（體重 -1 g）'); }
          game = null; s.lastReal = Date.now(); save(s); draw(); return;
        }
        var dir = Math.random() < 0.5 ? 'L' : 'R';
        game.round++;
        var win = dir === gv;
        if (win) game.win++;
        game.last = { dir: dir, win: win };
        drawGame();
        return;
      }
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var act = b.getAttribute('data-act');
      if (act === 'pause') { s.paused = !s.paused; s.lastReal = Date.now(); log(s, s.paused ? '⏸️ 暫停時間' : '▶️ 時間繼續流動'); save(s); draw(); return; }
      if (act === 'reset') {
        if (resetArm && Date.now() - resetArm < 4000) { s = newPet(s.gen, s.dex); resetArm = 0; save(s); draw(); T.toast('🥚 新的蛋出現了！'); }
        else { resetArm = Date.now(); T.toast('再按一次「重新孵一顆蛋」確認（目前的寵物會離開）'); }
        return;
      }
      if (act === 'next') { s = newPet(s.gen + 1, s.dex); save(s); draw(); return; }
      if (s.stage === 'gone') { T.toast('牠已經回到塔麻可吉星了，迎接下一代吧！'); return; }
      if (s.stage === 'egg') { T.toast('🥚 還是一顆蛋，耐心等牠孵化…'); return; }
      if (s.asleep && act !== 'light' && act !== 'clean' && act !== 'shot') { T.toast('😴 牠在睡覺，明天早上再說吧'); return; }
      if (act === 'meal') {
        if (s.hunger >= 4) { T.toast('🙅 吃不下了！'); return; }
        s.hunger++; s.weight++; clearCall(s, 'hunger'); log(s, '🍙 吃飯了（飽足 +1）');
      } else if (act === 'snack') {
        s.happy = Math.min(4, s.happy + 1); s.weight += 2; clearCall(s, 'happy'); log(s, '🍬 吃點心（開心 +1、體重 +2 g）');
      } else if (act === 'game') {
        game = { round: 0, win: 0, last: null }; drawGame(); return;
      } else if (act === 'clean') {
        if (!s.poop) { T.toast('✨ 已經很乾淨了'); return; }
        s.poop = 0; s.poopHigh = 0; log(s, '🧹 打掃乾淨了');
      } else if (act === 'shot') {
        if (!s.sick) { T.toast('💪 牠很健康，不用打針'); return; }
        s.shots--; if (s.shots <= 0) { s.sick = false; s.sickFor = 0; clearCall(s, 'sick'); log(s, '💉 打針完成，病好了！'); } else log(s, '💉 打了一針，還要再一針');
      } else if (act === 'light') {
        s.light = !s.light; if (!s.light) clearCall(s, 'light'); log(s, s.light ? '💡 開燈' : '🌙 關燈');
      } else if (act === 'scold') {
        if (s.call && s.call.type === 'fake') { s.disc = Math.min(100, s.disc + 25); s.call = null; log(s, '📏 管教成功（紀律 +25%）'); }
        else { T.toast('🤔 牠沒做錯事，不用管教喔'); return; }
      }
      save(s); draw();
    };
    draw();
    startTimer();
  }

  window.TamaPages = window.TamaPages || {};
  window.TamaPlay = { render: renderPlay };
})();


// === js/app.js ===
// ============================================================================
// 🥚 塔麻可吉博物館 — Hash Router、全站搜尋（/）、Release Notes 視窗
// ============================================================================
(function () {
  'use strict';
  var T = window.TamaCore;
  var esc = T.esc;

  var ROUTES = ['home', 'history', 'models', 'characters', 'guide', 'culture', 'media', 'collect', 'play', 'quiz', 'glossary', 'feedback', 'credits'];
  var NAV_ALIAS = { credits: 'collect' };

  function parseRoute() {
    var raw = (location.hash || '#/home').replace(/^#\/?/, '');
    var parts = raw.split('/');
    var route = parts.shift() || 'home';
    var param = '';
    try { param = decodeURIComponent(parts.join('/')); } catch (e) { param = parts.join('/'); }
    if (ROUTES.indexOf(route) < 0) route = 'home';
    return { route: route, param: param };
  }

  var navEls = null;
  function syncNav(route) {
    var eff = NAV_ALIAS[route] || route;
    if (!navEls) navEls = document.querySelectorAll('[data-nav]');
    Array.prototype.forEach.call(navEls, function (el) {
      var on = el.getAttribute('data-nav') === eff;
      el.classList.toggle('active', on);
      if (on && el.scrollIntoView && el.closest('.nav-inner')) {
        var box = el.closest('.nav-inner');
        if (el.offsetLeft < box.scrollLeft || el.offsetLeft + el.offsetWidth > box.scrollLeft + box.clientWidth) box.scrollLeft = el.offsetLeft - 12;
      }
    });
  }

  function render() {
    var main = document.getElementById('appMain');
    if (!main) return;
    var r = parseRoute();
    T.runRouteCleanup();
    main.onclick = null; main.oninput = null; main.onchange = null; main.onkeydown = null;
    syncNav(r.route);
    var pages = window.TamaPages || {};
    try {
      if (r.route === 'play' && window.TamaPlay) window.TamaPlay.render(main, r.param);
      else (pages[r.route] || pages.home)(main, r.param);
    } catch (err) {
      main.innerHTML = '<div class="card empty">😵 頁面載入失敗：' + esc(err && err.message) + '</div>';
      if (window.console) console.error(err);
    }
    T.updateHeaderProgress();
    window.scrollTo(0, 0);
  }

  // ------------------------------------------------------------ 全站搜尋
  function initSearch() {
    var input = document.getElementById('globalSearchInput');
    var dd = document.getElementById('globalSearchDropdown');
    if (!input || !dd) return;
    var idx = null;
    function build() {
      if (idx) return idx;
      idx = [];
      (window.TAMA_HISTORY || []).forEach(function (h) { idx.push({ t: h.icon + ' ' + h.title, s: h.d, tag: '📜 歷史', href: '#/history', b: (h.title + h.body + h.d).toLowerCase() }); });
      (window.TAMA_MODELS || []).forEach(function (m) { idx.push({ t: m.name, s: m.date + ' · ' + m.region, tag: '🗂️ 機型', href: '#/models', b: (m.name + m.en + m.feat + m.chars).toLowerCase() }); });
      (window.TAMA_CHARS || []).forEach(function (c) { idx.push({ t: c.name + '（' + c.jp + '）', s: c.group, tag: '🧬 角色', href: '#/characters', b: (c.name + c.jp + c.desc).toLowerCase() }); });
      (window.TAMA_GLOSSARY || []).forEach(function (g) { idx.push({ t: g.t + '（' + g.en + '）', s: g.d.slice(0, 40), tag: '📖 百科', href: '#/glossary/' + encodeURIComponent(g.t), b: (g.t + g.en + g.d).toLowerCase() }); });
      (window.TAMA_MEDIA || []).forEach(function (m) { idx.push({ t: m.title, s: m.y + ' · ' + m.cat, tag: '📺 媒體', href: '#/media', b: (m.title + m.body).toLowerCase() }); });
      return idx;
    }
    var raf = 0;
    function run() {
      raf = 0;
      var q = input.value.trim().toLowerCase();
      if (!q) { dd.hidden = true; return; }
      var hits = build().filter(function (x) { return x.b.indexOf(q) >= 0 || x.t.toLowerCase().indexOf(q) >= 0; }).slice(0, 12);
      dd.innerHTML = hits.length ? hits.map(function (h) {
        return '<a class="search-item" href="' + esc(h.href) + '"><div><div class="si-t">' + esc(h.t) + '</div><div class="si-s">' + esc(h.s) + '</div></div><span class="si-tag">' + esc(h.tag) + '</span></a>';
      }).join('') : '<div class="si-empty">找不到「' + esc(input.value) + '」相關內容</div>';
      dd.hidden = false;
    }
    input.addEventListener('input', function () { if (!raf) raf = requestAnimationFrame(run); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { dd.hidden = true; input.blur(); return; }
      if (T.isEnterSend(e)) {
        e.preventDefault();
        if (raf) { cancelAnimationFrame(raf); run(); }
        var first = dd.querySelector('a.search-item');
        if (first) { dd.hidden = true; location.hash = first.getAttribute('href'); }
      }
    });
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.global-search-box') || e.target.closest('a.search-item')) dd.hidden = true;
    });
    document.addEventListener('keydown', function (e) {
      var tag = (document.activeElement && document.activeElement.tagName) || '';
      if (e.key === '/' && ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(tag) < 0) { e.preventDefault(); input.focus(); }
    });
  }

  // ------------------------------------------------------------ Release Notes
  function initRelease() {
    var rel = window.TAMA_RELEASES || { current_version: '1.0.0', releases: [] };
    var ver = document.getElementById('verText');
    if (ver) ver.textContent = 'v' + rel.current_version;
    var modal = document.getElementById('releaseModal');
    var body = document.getElementById('releaseModalBody');
    function open() {
      var local = T.isLocalServer();
      var head = local
        ? '<div class="card"><strong>🖥️ 本機版發布中心</strong><p class="muted">在終端機執行 <code>python3 tools/release_mgr.py status</code> 檢視是否有未發布的修改；發布由你決定。</p><div class="hero-actions"><a class="btn sm" href="/download/single" download="tamagotchi_academy_single.html">⬇️ 下載 index.html（離線單檔）</a></div></div>'
        : '<div class="card"><strong>📄 學習進度保存說明</strong><p class="muted">學習進度、測驗紀錄與電子雞狀態都存在這台裝置的瀏覽器（localStorage，前綴 tama.）。</p></div>';
      body.innerHTML = head + (rel.releases || []).map(function (r) {
        return '<div class="card"><div class="rel-hd"><strong>v' + esc(r.version) + ' — ' + esc(r.title) + '</strong><span class="chip">' + esc(r.date || '') + '</span></div><ul>' + (r.changes || []).map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>';
      }).join('');
      modal.hidden = false;
    }
    ['versionBadgeBtn', 'footerReleaseBtn'].forEach(function (id) { var b = document.getElementById(id); if (b) b.addEventListener('click', open); });
    var close = document.getElementById('closeReleaseModalBtn');
    if (close) close.addEventListener('click', function () { modal.hidden = true; });
    if (modal) modal.addEventListener('click', function (e) { if (e.target === modal) modal.hidden = true; });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modal && !modal.hidden) modal.hidden = true; });
    if (T.isLocalServer()) {
      fetch('/api/release_status').then(function (r) { return r.json(); }).then(function (d) {
        var dot = document.getElementById('unreleasedDot');
        if (dot && d && d.has_unreleased_changes) dot.hidden = false;
      }).catch(function () {});
    }
  }

  window.addEventListener('hashchange', render);
  function boot() { initSearch(); initRelease(); render(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

  </script>
