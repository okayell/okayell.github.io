      '<div class="cry-kpi"><div class="k">美元兌新台幣</div><div class="v">' + (d.twdRate ? Number(d.twdRate).toFixed(2) : '—') + '</div><div class="s cry-muted">1 USDT 約等於這個金額</div></div>' +
      '</div>';
  }

  // ---------- 首頁 ----------
  function tickerCard(id) {
    var c = P.get(id);
    if (!c) return '';
    var meta = CRY.coinMap[id];
    return '<a class="cry-tick" href="#/' + (meta ? 'coin/' + encodeURIComponent(id) : 'market') + '">' +
      '<div class="cry-tick-top">' + CRY.coinAvatar(c.sym, c.img, 30) + '<div><b>' + esc(meta ? meta.name : c.name) + '</b><span>' + esc(c.sym) + '</span></div></div>' +
      '<div class="cry-tick-price">' + P.price(c.p) + '</div>' +
      '<div class="cry-tick-foot">' + CRY.pctHtml(c.c24h) + P.sparkSvg(c.spark, 84, 26) + '</div></a>';
  }

  function todayStory() {
    var H = CRY.HISTORY;
    if (!H.length) return null;
    var now = new Date(), md = ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2);
    var same = H.filter(function (h) { return String(h.date).slice(5) === md; });
    if (same.length) return { h: same[0], label: '📅 歷史上的今天' };
    var day = Math.floor(Date.now() / 86400000);
    return { h: H[day % H.length], label: '📜 今日故事' };
  }

  function renderHome(root) {
    var doneAll = CRY.progress.countDone(), total = CRY.LESSONS.length;
    var next = CRY.LESSONS.filter(function (l) { return !CRY.progress.isDone(l.id); })[0];
    var ids = ['bitcoin', 'ethereum', 'tether', 'binancecoin', 'solana', 'ripple'];
    CRY.watch.list().forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); });
    var story = todayStory();
    var tracks = CRY.TRACKS.map(function (t) {
      var ls = CRY.lessonsOf(t.id), dn = CRY.progress.countDone(t.id), pct = ls.length ? Math.round(dn * 100 / ls.length) : 0;
      return '<a class="cry-track" href="#/learn/' + t.id + '"><div class="cry-track-ic">' + t.icon + '</div><div class="cry-track-body"><b>' + esc(t.name) + '</b>' +
        '<p>' + esc(t.desc) + '</p><div class="cry-bar"><i style="width:' + pct + '%"></i></div><span class="cry-muted">' + dn + ' / ' + ls.length + ' 堂</span></div></a>';
    }).join('');
    root.innerHTML =
      '<section class="cry-hero">' +
        '<div><h1>從零看懂區塊鏈與虛擬貨幣</h1>' +
        '<p>' + total + ' 堂白話課程、' + CRY.COINS.length + ' 個幣種圖鑑、' + CRY.HISTORY.length + ' 則幣圈歷史故事、' + CRY.GLOSSARY.length + ' 個名詞，加上定時更新的即時幣價。先懂原理與風險，再看價格。</p>' +
        '<div class="cry-hero-actions">' +
          (next ? '<a class="cry-btn primary" href="#/lesson/' + next.id + '">' + (doneAll ? '▶ 繼續學習：' : '▶ 從第一堂開始：') + esc(next.title) + '</a>' : '<a class="cry-btn primary" href="#/quiz">🎓 全部課程完成，來挑戰總測驗</a>') +
          '<a class="cry-btn" href="#/market">📈 看即時幣價</a></div></div>' +
        '<div class="cry-hero-prog"><div class="cry-ring" style="--p:' + (total ? Math.round(doneAll * 100 / total) : 0) + '"><b>' + (total ? Math.round(doneAll * 100 / total) : 0) + '%</b></div><span>已完成 ' + doneAll + ' / ' + total + ' 堂</span></div>' +
      '</section>' +
      statusBar() +
      '<section><div class="cry-ticks" data-live="ticks">' + ids.map(tickerCard).join('') + '</div></section>' +
      '<section data-live="kpis">' + globalCards() + '</section>' +
      '<section><h2 class="cry-h2">🧭 學習路線</h2><div class="cry-tracks">' + tracks + '</div></section>' +
      (story ? '<section><h2 class="cry-h2">' + story.label + '</h2><a class="cry-story-card" href="#/history/' + encodeURIComponent(story.h.id) + '">' +
        '<span class="cry-date">' + esc(story.h.date) + '</span><b>' + esc(story.h.title) + '</b><p>' + esc(story.h.summary) + '</p><span class="cry-link">讀完整故事 →</span></a></section>' : '') +
      '<section class="cry-quick">' +
        '<a href="#/coins"><b>🪙 幣種圖鑑</b><span>每個幣是什麼、怎麼運作、有什麼風險</span></a>' +
        '<a href="#/history"><b>📜 幣圈歷史</b><span>從密碼龐克、披薩日到現貨 ETF</span></a>' +
        '<a href="#/glossary"><b>📖 名詞辭典</b><span>看不懂的術語，一查就懂</span></a>' +
        '<a href="#/learn/wallet"><b>🛡️ 防詐必修</b><span>助記詞、授權、常見詐騙手法</span></a>' +
      '</section>' + CRY.disclaimer();
    root._live = function () {
      var t = CRY.$('[data-live="ticks"]', root); if (t) t.innerHTML = ids.map(tickerCard).join('');
      var k = CRY.$('[data-live="kpis"]', root); if (k) k.innerHTML = globalCards();
      var s = CRY.$('[data-live="status"]', root); if (s) s.textContent = P.statusText();
    };
  }

  // ---------- 即時幣價 ----------
  var view = { q: '', filter: 'all', sort: 'rank', dir: 1, limit: 50, chartId: 'bitcoin', days: 365 };
  var COLS = [
    { k: 'rank', t: '#', cls: 'num narrow' }, { k: 'name', t: '幣種', cls: '' }, { k: 'p', t: '價格', cls: 'num' },
    { k: 'c1h', t: '1 小時', cls: 'num hide-s' }, { k: 'c24h', t: '24 小時', cls: 'num' }, { k: 'c7d', t: '7 天', cls: 'num hide-s' },
    { k: 'c30d', t: '30 天', cls: 'num hide-m' }, { k: 'mc', t: '市值', cls: 'num hide-s' }, { k: 'vol', t: '24 小時成交量', cls: 'num hide-m' },
    { k: 'spark', t: '7 日走勢', cls: 'num hide-s nosort' }
  ];

  function rows() {
    var q = view.q.trim().toLowerCase();
    var list = P.coins().filter(function (c) {
      var meta = CRY.coinMap[c.id];
      if (view.filter === 'guide' && !meta) return false;
      if (view.filter === 'watch' && !CRY.watch.has(c.id)) return false;
      if (view.filter === 'up' && !(c.c24h > 0)) return false;
      if (view.filter === 'down' && !(c.c24h < 0)) return false;
      if (!q) return true;
      return String(c.sym).toLowerCase().indexOf(q) >= 0 || String(c.name).toLowerCase().indexOf(q) >= 0 || (meta && String(meta.name).indexOf(view.q.trim()) >= 0);
    });
    var k = view.sort, dir = view.dir;
    list.sort(function (a, b) {
      var x = k === 'name' ? String(a.sym) : a[k], y = k === 'name' ? String(b.sym) : b[k];
      if (x == null && y == null) return 0;
      if (x == null) return 1;
      if (y == null) return -1;
      return (x < y ? -1 : x > y ? 1 : 0) * dir;
    });
    return list;
  }

  function tableHtml() {
    var list = rows();
    var head = COLS.map(function (c) {
      var on = view.sort === c.k;
      return '<th class="' + c.cls + (on ? ' sorted' : '') + '"' + (c.cls.indexOf('nosort') < 0 ? ' data-sort="' + c.k + '"' : '') + '>' + c.t + (on ? (view.dir > 0 ? ' ▲' : ' ▼') : '') + '</th>';
    }).join('');
    var body = list.slice(0, view.limit).map(function (c) {
      var meta = CRY.coinMap[c.id], w = CRY.watch.has(c.id);
      return '<tr data-coin="' + esc(c.id) + '">' +
        '<td class="num narrow"><button type="button" class="cry-star' + (w ? ' on' : '') + '" data-star="' + esc(c.id) + '" aria-label="加入自選" title="加入自選">' + (w ? '★' : '☆') + '</button>' + (c.rank || '—') + '</td>' +
        '<td><div class="cry-coin-cell">' + CRY.coinAvatar(c.sym, c.img, 26) + '<div><b>' + esc(meta ? meta.name : c.name) + '</b><span>' + esc(c.sym) + (meta ? '・<em>圖鑑</em>' : '') + '</span></div></div></td>' +
        '<td class="num strong">' + P.price(c.p) + '</td>' +
        '<td class="num hide-s">' + CRY.pctHtml(c.c1h) + '</td><td class="num">' + CRY.pctHtml(c.c24h) + '</td><td class="num hide-s">' + CRY.pctHtml(c.c7d) + '</td><td class="num hide-m">' + CRY.pctHtml(c.c30d) + '</td>' +
        '<td class="num hide-s">' + P.big(c.mc) + '</td><td class="num hide-m">' + P.big(c.vol) + '</td>' +
        '<td class="num hide-s">' + P.sparkSvg(c.spark, 96, 28) + '</td></tr>';
    }).join('');
    var more = list.length > view.limit ? '<div class="cry-more"><button type="button" class="cry-btn" data-more>顯示更多（還有 ' + (list.length - view.limit) + ' 個）</button></div>' : '';
    return '<div class="cry-table-wrap"><table class="cry-table"><thead><tr>' + head + '</tr></thead><tbody>' +
      (body || '<tr><td colspan="10" class="cry-empty">找不到符合的幣種。</td></tr>') + '</tbody></table></div>' + more +
      '<p class="cry-muted cry-count">共 ' + list.length + ' 個幣種（依市值收錄前 ' + P.coins().length + ' 名）</p>';
  }

  function chartHtml() {
    var ids = Object.keys((P.data && P.data.charts) || {}).filter(function (id) { return P.hasYearChart(id) && P.get(id); });
    if (!ids.length) return '';
    if (ids.indexOf(view.chartId) < 0) view.chartId = ids[0];
    var c = P.get(view.chartId), meta = CRY.coinMap[view.chartId];
    var pts = P.seriesOf(view.chartId, view.days);
    var chg = pts.length > 1 ? (pts[pts.length - 1].v / pts[0].v - 1) * 100 : null;
    return '<div class="cry-card cry-chart-card"><div class="cry-chart-head">' +
      '<div class="cry-chart-title">' + CRY.coinAvatar(c.sym, c.img, 30) + '<div><b>' + esc(meta ? meta.name : c.name) + ' ' + esc(c.sym) + '</b><span>' + P.price(c.p) + '　區間 ' + CRY.pctHtml(chg) + '</span></div></div>' +
      '<div class="cry-chart-ctl"><span class="cry-seg">' + ids.map(function (id) { var x = P.get(id); return '<button type="button" class="' + (id === view.chartId ? 'on' : '') + '" data-chart="' + esc(id) + '">' + esc(x.sym) + '</button>'; }).join('') + '</span>' +
      '<span class="cry-seg">' + [[30, '30 天'], [90, '90 天'], [180, '半年'], [365, '一年']].map(function (d) { return '<button type="button" class="' + (d[0] === view.days ? 'on' : '') + '" data-days="' + d[0] + '">' + d[1] + '</button>'; }).join('') + '</span></div></div>' +
      P.lineChartSvg(pts, { id: 'M' }) + '</div>';
  }

  function converterHtml() {
    var opts = P.coins().slice(0, 60).map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.sym) + '　' + esc((CRY.coinMap[c.id] || c).name) + '</option>'; }).join('');
    return '<div class="cry-card cry-conv"><b>🔁 換算機</b><input type="number" id="convAmt" value="1" min="0" step="any" inputmode="decimal" aria-label="數量">' +
      '<select id="convCoin" aria-label="幣種">' + opts + '</select><span class="cry-conv-eq">=</span><output id="convOut"></output></div>';
  }
  function updateConv(root) {
    var amt = parseFloat((CRY.$('#convAmt', root) || {}).value), sel = CRY.$('#convCoin', root), out = CRY.$('#convOut', root);
    if (!sel || !out) return;
    var c = P.get(sel.value);
    if (!c || isNaN(amt)) { out.textContent = '—'; return; }
    out.innerHTML = '<b>' + CRY.fmtPrice(amt * c.p, 'usd') + '</b> 美元　≈　<b>' + CRY.fmtPrice(amt * c.p * P.rate(), 'twd') + '</b> 新台幣';
  }

  function quickCoinModal(id) {
    var c = P.get(id);
    if (!c) return;
    function row(k, v) { return '<div class="cry-fact"><span>' + k + '</span><b>' + v + '</b></div>'; }
    CRY.openModal('<div class="cry-modal-head">' + CRY.coinAvatar(c.sym, c.img, 40) + '<div><h3>' + esc(c.name) + ' <small>' + esc(c.sym) + '</small></h3><div class="cry-big-price">' + P.price(c.p) + ' ' + CRY.pctHtml(c.c24h) + '</div></div></div>' +
      '<div class="cry-facts">' + row('市值排名', '#' + (c.rank || '—')) + row('市值', P.big(c.mc)) + row('24 小時成交量', P.big(c.vol)) + row('24 小時高／低', P.price(c.hi) + '／' + P.price(c.lo)) +
      row('7 天漲跌', CRY.pctHtml(c.c7d)) + row('30 天漲跌', CRY.pctHtml(c.c30d)) + row('歷史最高價', P.price(c.ath) + (c.athDate ? '（' + esc(c.athDate) + '）' : '')) + row('距離最高價', CRY.pctHtml(c.athChg)) +
      row('流通量', CRY.fmtQty(c.circ)) + row('供給上限', c.max ? CRY.fmtQty(c.max) : '無上限或未公布') + '</div>' +
      '<div class="cry-modal-chart">' + P.lineChartSvg(P.seriesOf(id, 7), { id: 'Q', h: 180, maxW: 636 }) + '<p class="cry-muted">近 7 天走勢</p></div>' +
      '<p class="cry-muted">這個幣還沒有收錄在幣種圖鑑。排名靠前不代表安全，請先弄懂它是什麼再做任何決定。</p>');
  }

  function renderMarket(root) {
    var filters = [['all', '全部'], ['guide', '📘 圖鑑收錄'], ['watch', '★ 我的自選'], ['up', '上漲'], ['down', '下跌']];
    root.innerHTML = '<h1 class="cry-h1">📈 即時幣價</h1>' +
      statusBar('<button type="button" class="cry-btn ghost" data-colormode title="切換漲跌顏色">' + (CRY.store.get('color_mode.v1', 'green_up') === 'green_up' ? '🟢 綠漲紅跌' : '🔴 紅漲綠跌') + '</button>') +
      '<section data-live="kpis">' + globalCards() + '</section>' +
      '<section data-live="chart">' + chartHtml() + '</section>' +
      '<section>' + converterHtml() + '</section>' +
      '<section><div class="cry-toolbar"><input type="search" id="mktSearch" class="cry-input" placeholder="搜尋幣種名稱或代號，例如 BTC、以太坊" value="' + esc(view.q) + '" aria-label="搜尋幣種">' +
        '<div class="cry-chips">' + filters.map(function (f) { return '<button type="button" class="cry-chip' + (view.filter === f[0] ? ' on' : '') + '" data-filter="' + f[0] + '">' + f[1] + '</button>'; }).join('') + '</div></div>' +
        '<div data-live="table">' + tableHtml() + '</div></section>' + CRY.disclaimer();
    updateConv(root);
    function redrawTable() { var t = CRY.$('[data-live="table"]', root); if (t) t.innerHTML = tableHtml(); }
    function redrawChart() { var t = CRY.$('[data-live="chart"]', root); if (t) t.innerHTML = chartHtml(); }
    root._live = function () {
      var k = CRY.$('[data-live="kpis"]', root); if (k) k.innerHTML = globalCards();
      var s = CRY.$('[data-live="status"]', root); if (s) s.textContent = P.statusText();
      redrawChart(); redrawTable(); updateConv(root);
    };
    var search = CRY.$('#mktSearch', root);
    search.addEventListener('input', function () { view.q = search.value; view.limit = 50; redrawTable(); });
    root.addEventListener('input', function (e) { if (e.target.id === 'convAmt') updateConv(root); });
    root.addEventListener('change', function (e) { if (e.target.id === 'convCoin') updateConv(root); });
    root.addEventListener('click', function (e) {
      var t = e.target.closest('[data-filter],[data-sort],[data-more],[data-star],[data-chart],[data-days],[data-colormode],tr[data-coin]');
      if (!t || !root.contains(t)) return;
      if (t.hasAttribute('data-star')) {
        var on = CRY.watch.toggle(t.getAttribute('data-star'));
        CRY.toast(on ? '★ 已加入自選' : '已從自選移除');
        redrawTable();
      } else if (t.hasAttribute('data-filter')) {
        view.filter = t.getAttribute('data-filter'); view.limit = 50;
        CRY.$$('[data-filter]', root).forEach(function (b) { b.classList.toggle('on', b === t); });
        redrawTable();
      } else if (t.hasAttribute('data-sort')) {
        var k = t.getAttribute('data-sort');
        if (view.sort === k) view.dir = -view.dir; else { view.sort = k; view.dir = (k === 'rank' || k === 'name') ? 1 : -1; }
        redrawTable();
      } else if (t.hasAttribute('data-more')) { view.limit += 100; redrawTable(); }
      else if (t.hasAttribute('data-chart')) { view.chartId = t.getAttribute('data-chart'); redrawChart(); }
      else if (t.hasAttribute('data-days')) { view.days = parseInt(t.getAttribute('data-days'), 10); redrawChart(); }
      else if (t.hasAttribute('data-colormode')) {
        var m = CRY.store.get('color_mode.v1', 'green_up') === 'green_up' ? 'red_up' : 'green_up';
        CRY.store.set('color_mode.v1', m); CRY.applyColorMode();
        t.textContent = m === 'green_up' ? '🟢 綠漲紅跌' : '🔴 紅漲綠跌';
      } else if (t.hasAttribute('data-coin')) {
        var id = t.getAttribute('data-coin');
        if (CRY.coinMap[id]) CRY.go('coin/' + encodeURIComponent(id)); else quickCoinModal(id);
      }
    });
  }

  CRY.applyColorMode = function () {
    document.documentElement.setAttribute('data-cry-color', CRY.store.get('color_mode.v1', 'green_up'));
  };

  CRY.route('home', renderHome);
  CRY.route('market', renderMarket);
})();

</script>
  <script>
/* 區塊鏈學院 — 課程（學習路線／單元列表／課文＋隨堂測驗）與總測驗 */
(function () {
  'use strict';
  var CRY = window.CRY, esc = CRY.esc;
  var LEVEL = { 1: '入門', 2: '進階', 3: '深入' };

  function renderLearn(root, args) {
    var only = args[0] && CRY.trackOf(args[0]) ? args[0] : null;
    var tracks = CRY.TRACKS.filter(function (t) { return !only || t.id === only; });
    var html = '<h1 class="cry-h1">⛓️ 區塊鏈課程</h1>' +
      '<div class="cry-chips cry-chips-scroll"><a class="cry-chip' + (!only ? ' on' : '') + '" href="#/learn">全部路線</a>' +
      CRY.TRACKS.map(function (t) { return '<a class="cry-chip' + (only === t.id ? ' on' : '') + '" href="#/learn/' + t.id + '">' + t.icon + ' ' + esc(t.name) + '</a>'; }).join('') + '</div>';
    html += tracks.map(function (t) {
      var ls = CRY.lessonsOf(t.id), dn = CRY.progress.countDone(t.id);
      return '<section class="cry-track-sec"><div class="cry-track-head"><h2>' + t.icon + ' ' + esc(t.name) + '</h2><span class="cry-muted">' + dn + ' / ' + ls.length + ' 堂完成</span></div>' +
        '<p class="cry-muted">' + esc(t.desc) + '</p><div class="cry-lessons">' +
        (ls.map(function (l, i) {
          var done = CRY.progress.isDone(l.id), q = CRY.progress.quizOf(l.id);
          return '<a class="cry-lesson-row' + (done ? ' done' : '') + '" href="#/lesson/' + l.id + '"><span class="cry-lesson-no">' + (done ? '✓' : (i + 1)) + '</span>' +
            '<span class="cry-lesson-main"><b>' + esc(l.title) + '</b><span>' + esc(l.summary) + '</span></span>' +
            '<span class="cry-lesson-meta"><i class="lv' + l.level + '">' + LEVEL[l.level] + '</i><span>' + l.minutes + ' 分鐘</span>' + (q != null ? '<span>測驗 ' + q + '/3</span>' : '') + '</span></a>';
        }).join('') || '<div class="cry-empty">這條路線的課程準備中。</div>') + '</div></section>';
    }).join('');
    root.innerHTML = html;
  }

  function tableHtml(t) {
    return '<div class="cry-table-wrap"><table class="cry-table cry-doc-table"><thead><tr>' + t.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      t.rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  }

  function quizHtml(qs, prefix) {
    return qs.map(function (q, i) {
      return '<div class="cry-q" data-q="' + i + '"><p class="cry-q-title"><span>' + (prefix || 'Q') + (i + 1) + '</span>' + esc(q.q) + '</p><div class="cry-q-opts">' +
        q.opts.map(function (o, k) { return '<button type="button" class="cry-opt" data-opt="' + k + '">' + esc(o) + '</button>'; }).join('') +
        '</div><p class="cry-q-why" hidden></p></div>';
    }).join('');
  }
  // 綁定作答：每題只能答一次；全部答完呼叫 onDone(答對題數)
  function bindQuiz(box, qs, onDone) {
    var answered = 0, right = 0;
    box.addEventListener('click', function (e) {
      var b = e.target.closest('.cry-opt');
      if (!b) return;
      var qel = b.closest('.cry-q');
      if (!qel || qel.classList.contains('answered')) return;
      var q = qs[parseInt(qel.getAttribute('data-q'), 10)], pick = parseInt(b.getAttribute('data-opt'), 10);
      qel.classList.add('answered');
      CRY.$$('.cry-opt', qel).forEach(function (o, k) { o.disabled = true; if (k === q.a) o.classList.add('right'); });
      var ok = pick === q.a;
      if (!ok) b.classList.add('wrong'); else right++;
      var why = CRY.$('.cry-q-why', qel);
      why.hidden = false;
      why.textContent = (ok ? '✅ 答對了！' : '❌ 正確答案是「' + q.opts[q.a] + '」。') + q.why;
      answered++;
      if (answered === qs.length && onDone) onDone(right);
    });
  }

  function renderLesson(root, args) {
    var l = CRY.byId(CRY.LESSONS, args[0]);
    if (!l) { root.innerHTML = '<div class="cry-empty">找不到這堂課。<a href="#/learn">回課程列表</a></div>'; return; }
    var t = CRY.trackOf(l.track), ls = CRY.lessonsOf(l.track), idx = ls.indexOf(l);
    var all = CRY.LESSONS, gi = all.indexOf(l), prev = all[gi - 1], next = all[gi + 1];
    var done = CRY.progress.isDone(l.id);
    var terms = (l.terms || []).filter(function (x) { return CRY.glossMap[x]; });
    root.innerHTML =
      '<nav class="cry-crumb"><a href="#/learn">課程</a> › <a href="#/learn/' + t.id + '">' + t.icon + ' ' + esc(t.name) + '</a> › 第 ' + (idx + 1) + ' 堂</nav>' +
      '<article class="cry-article">' +
        '<header><h1>' + esc(l.title) + '</h1><p class="cry-lead">' + esc(l.summary) + '</p>' +
        '<div class="cry-lesson-meta"><i class="lv' + l.level + '">' + LEVEL[l.level] + '</i><span>約 ' + l.minutes + ' 分鐘</span><span>' + t.icon + ' ' + esc(t.name) + ' ' + (idx + 1) + ' / ' + ls.length + '</span></div></header>' +
        '<div class="cry-plain">' + esc(l.plain) + '</div>' +
        l.sections.map(function (s) {
          return '<section><h2>' + esc(s.h) + '</h2>' + CRY.paras(s.p) +
            (s.list ? '<ul>' + s.list.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + (s.table ? tableHtml(s.table) : '') + '</section>';
        }).join('') +
        '<div class="cry-takeaway">' + esc(l.takeaway) + '</div>' +
        (terms.length ? '<div class="cry-terms"><b>📖 本課名詞</b>' + terms.map(function (x) { return '<button type="button" class="cry-chip" data-term="' + esc(x) + '">' + esc(x) + '</button>'; }).join('') + '</div>' : '') +
        '<section class="cry-quiz"><h2>📝 隨堂測驗</h2><div id="lessonQuiz">' + quizHtml(l.quiz) + '</div><p class="cry-quiz-result" id="lessonQuizResult" hidden></p></section>' +
        '<div class="cry-lesson-foot">' +
          (prev ? '<a class="cry-btn" href="#/lesson/' + prev.id + '">← ' + esc(prev.title) + '</a>' : '<span></span>') +
          '<button type="button" class="cry-btn ' + (done ? 'done' : 'primary') + '" id="doneBtn">' + (done ? '✓ 已完成（點此取消）' : '✓ 標記為已完成') + '</button>' +
          (next ? '<a class="cry-btn" href="#/lesson/' + next.id + '">' + esc(next.title) + ' →</a>' : '<a class="cry-btn" href="#/quiz">🎓 挑戰總測驗 →</a>') +
        '</div></article>';
    bindQuiz(CRY.$('#lessonQuiz', root), l.quiz, function (right) {
      CRY.progress.setQuiz(l.id, right);
      var r = CRY.$('#lessonQuizResult', root);
      r.hidden = false;
      r.textContent = right === l.quiz.length ? '🎉 全部答對！這堂課已自動標記為完成。' : '答對 ' + right + ' / ' + l.quiz.length + ' 題。回頭再看一次課文，重新整理頁面可以再作答一次。';
      if (right === l.quiz.length && !CRY.progress.isDone(l.id)) { CRY.progress.setDone(l.id, true); syncDone(); }
    });
    function syncDone() {
      var b = CRY.$('#doneBtn', root), d = CRY.progress.isDone(l.id);
      b.className = 'cry-btn ' + (d ? 'done' : 'primary');
      b.textContent = d ? '✓ 已完成（點此取消）' : '✓ 標記為已完成';
    }
    CRY.$('#doneBtn', root).addEventListener('click', function () {
      CRY.progress.setDone(l.id, !CRY.progress.isDone(l.id));
      syncDone();
      if (CRY.progress.isDone(l.id)) CRY.toast('✓ 已完成：' + l.title);
    });
    root.addEventListener('click', function (e) {
      var b = e.target.closest('[data-term]');
      if (b) CRY.showTerm(b.getAttribute('data-term'));
    });
  }

  CRY.showTerm = function (term) {
    var g = CRY.glossMap[term];
    if (!g) return;
    var cat = CRY.byId(CRY.GLOSS_CATS, g.cat);
    CRY.openModal('<div class="cry-term-modal"><span class="cry-tag">' + esc(cat ? cat.name : '') + '</span><h3>' + esc(g.term) + ' <small>' + esc(g.en) + '</small></h3><p>' + esc(g.def) + '</p>' +
      (g.eg ? '<p class="cry-eg">💡 ' + esc(g.eg) + '</p>' : '') + '<a class="cry-link" href="#/glossary" data-close-modal>打開名詞辭典 →</a></div>');
  };

  // ---------- 總測驗 ----------
  var quizState = { track: 'all' };
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function renderQuiz(root) {
    var best = CRY.store.get('quiz_best.v1', {});
    var chips = '<button type="button" class="cry-chip' + (quizState.track === 'all' ? ' on' : '') + '" data-qtrack="all">綜合</button>' +
      CRY.TRACKS.map(function (t) { return '<button type="button" class="cry-chip' + (quizState.track === t.id ? ' on' : '') + '" data-qtrack="' + t.id + '">' + t.icon + ' ' + esc(t.name) + '</button>'; }).join('');
    var pool = [];
    CRY.LESSONS.forEach(function (l) { if (quizState.track === 'all' || l.track === quizState.track) l.quiz.forEach(function (q) { pool.push({ q: q, l: l }); }); });
    var picked = shuffle(pool.slice()).slice(0, 10);
    var qs = picked.map(function (x) { return x.q; });
    var b = best[quizState.track];
    root.innerHTML = '<h1 class="cry-h1">📝 總測驗</h1><p class="cry-muted">從題庫（共 ' + pool.length + ' 題）隨機抽 ' + qs.length + ' 題，答完立刻看解析。' + (b != null ? '這個範圍的最佳成績：' + b + ' 分。' : '') + '</p>' +
      '<div class="cry-chips cry-chips-scroll">' + chips + '</div>' +
      (qs.length ? '<div class="cry-quiz cry-card" id="bigQuiz">' + quizHtml(qs) + '</div><div class="cry-quiz-result" id="bigQuizResult" hidden></div>' : '<div class="cry-empty">題庫準備中。</div>');
    root.addEventListener('click', function (e) {
      var c = e.target.closest('[data-qtrack]');
      if (c) { quizState.track = c.getAttribute('data-qtrack'); CRY.rerender(); return; }
      if (e.target.closest('[data-requiz]')) CRY.rerender();
    });
    if (!qs.length) return;
    bindQuiz(CRY.$('#bigQuiz', root), qs, function (right) {
      var score = Math.round(right * 100 / qs.length);
      var all = CRY.store.get('quiz_best.v1', {});
      all[quizState.track] = Math.max(score, all[quizState.track] || 0);
      CRY.store.set('quiz_best.v1', all);
      var wrongLessons = [];
      CRY.$$('.cry-q', root).forEach(function (el, i) { if (CRY.$('.cry-opt.wrong', el)) { var l = picked[i].l; if (wrongLessons.indexOf(l) < 0) wrongLessons.push(l); } });
      var r = CRY.$('#bigQuizResult', root);
      r.hidden = false;
      r.innerHTML = '<b>' + score + ' 分</b>（答對 ' + right + ' / ' + qs.length + ' 題）' + (score === 100 ? ' 🎉 滿分！' : '') +
        (wrongLessons.length ? '<div class="cry-review">建議複習：' + wrongLessons.map(function (l) { return '<a class="cry-chip" href="#/lesson/' + l.id + '">' + esc(l.title) + '</a>'; }).join('') + '</div>' : '') +
        '<button type="button" class="cry-btn primary" data-requiz>🔁 再抽一份</button>';
      r.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  CRY.route('learn', renderLearn);
  CRY.route('lesson', renderLesson);
  CRY.route('quiz', renderQuiz);
})();

  }

  // ---------- 名詞辭典 ----------
  var glossView = { cat: 'all', q: '' };
  function glossList() {
    var q = glossView.q.trim().toLowerCase();
    var list = CRY.GLOSSARY.filter(function (g) {
      if (glossView.cat !== 'all' && g.cat !== glossView.cat) return false;
      if (!q) return true;
      return g.term.toLowerCase().indexOf(q) >= 0 || String(g.en).toLowerCase().indexOf(q) >= 0 || g.def.toLowerCase().indexOf(q) >= 0;
    });
    if (!list.length) return '<div class="cry-empty">找不到這個名詞。</div>';
    return list.map(function (g) {
      var cat = CRY.byId(CRY.GLOSS_CATS, g.cat);
      return '<div class="cry-gloss"><div class="cry-gloss-head"><b>' + esc(g.term) + '</b><span>' + esc(g.en) + '</span><i class="cry-tag">' + esc(cat ? cat.name : '') + '</i></div><p>' + esc(g.def) + '</p>' +
        (g.eg ? '<p class="cry-eg">💡 ' + esc(g.eg) + '</p>' : '') + '</div>';
    }).join('');
  }
  function renderGlossary(root) {
    var chips = '<button type="button" class="cry-chip' + (glossView.cat === 'all' ? ' on' : '') + '" data-gcat="all">全部（' + CRY.GLOSSARY.length + '）</button>' +
      CRY.GLOSS_CATS.map(function (c) {
        var n = CRY.GLOSSARY.filter(function (g) { return g.cat === c.id; }).length;
        return n ? '<button type="button" class="cry-chip' + (glossView.cat === c.id ? ' on' : '') + '" data-gcat="' + c.id + '">' + esc(c.name) + '（' + n + '）</button>' : '';
      }).join('');
    root.innerHTML = '<h1 class="cry-h1">📖 名詞辭典</h1>' +
      '<div class="cry-toolbar"><input type="search" id="glossSearch" class="cry-input" placeholder="搜尋名詞，例如 助記詞、Gas、無常損失" value="' + esc(glossView.q) + '" aria-label="搜尋名詞"><div class="cry-chips cry-chips-scroll">' + chips + '</div></div>' +
      '<div class="cry-gloss-grid" id="glossBody">' + glossList() + '</div>';
    var search = CRY.$('#glossSearch', root);
    search.addEventListener('input', function () { glossView.q = search.value; CRY.$('#glossBody', root).innerHTML = glossList(); });
    root.addEventListener('click', function (e) {
      var b = e.target.closest('[data-gcat]');
      if (!b) return;
      glossView.cat = b.getAttribute('data-gcat');
      CRY.$$('[data-gcat]', root).forEach(function (x) { x.classList.toggle('on', x === b); });
      CRY.$('#glossBody', root).innerHTML = glossList();
    });
  }

  // ---------- 意見回饋 ----------
  function renderFeedback(root) {
    root.innerHTML = '<h1 class="cry-h1">💬 意見回饋</h1><p class="cry-muted">內容有錯、想看哪個幣或哪段歷史、功能建議，都歡迎告訴我們。</p>' +
      '<form id="cryFeedbackForm" class="cry-card cry-form">' +
        '<label>類型<select id="fbType" class="cry-input"><option>內容勘誤</option><option>想看的主題</option><option>功能建議</option><option>問題回報</option></select></label>' +
        '<label>標題<input id="fbTitle" class="cry-input" maxlength="80" required placeholder="一句話說明"></label>' +
        '<label>內容<textarea id="fbContent" class="cry-input" rows="5" maxlength="2000" required placeholder="請描述細節，例如哪一堂課、哪一段文字"></textarea></label>' +
        '<button type="submit" class="cry-btn primary" id="fbSubmit">📮 送出</button></form>';
    var form = CRY.$('#cryFeedbackForm', root);
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var type = CRY.$('#fbType', root).value, title = CRY.$('#fbTitle', root).value.trim(), content = CRY.$('#fbContent', root).value.trim();
      if (!title || !content) return;
      var btn = CRY.$('#fbSubmit', root);
      function done(msg) { CRY.toast(msg); form.reset(); btn.disabled = false; btn.textContent = '📮 送出'; }
      btn.disabled = true; btn.textContent = '⏳ 傳送中…';
      if (!CRY.isStatic()) {
        fetch(CRY.apiBase() + 'feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: type, title: title, content: content, page: window.location.hash }) })
          .then(function (r) { return r.json(); })
          .then(function (j) { done(j && j.ok ? '🎉 感謝回饋，我們收到了！' : '送出失敗，請稍後再試。'); })
          .catch(function () { btn.disabled = false; btn.textContent = '📮 送出'; CRY.toast('送出失敗，請稍後再試。'); });
      } else if (window.CampusNav && typeof window.CampusNav.sendStaticFeedback === 'function') {
        window.CampusNav.sendStaticFeedback('crypto', { kindLabel: type, title: title, description: content })
          .then(function () { done('🎉 已收到你的回饋，系統將自動轉寄給站長！'); })
          .catch(function () { done('🎉 已收到你的回饋，恢復連線時將自動補寄！'); });
      } else if (window.CampusNav && typeof window.CampusNav.openFeedback === 'function') {
        window.CampusNav.openFeedback('crypto', '[' + type + '] ' + title + '\n' + content);
        done('🎉 已收到你的回饋！');
      } else {
        done('這個離線版本無法傳送，請到線上版的意見回饋頁送出。');
      }
    });
  }

  CRY.route('coins', renderCoins);
  CRY.route('coin', renderCoin);
  CRY.route('history', renderHistory);
  CRY.route('glossary', renderGlossary);
  CRY.route('feedback', renderFeedback);
})();

</script>
  <script>
/* 區塊鏈學院 — 啟動、路由切換、標題列行情、版本紀錄 */
(function () {
  'use strict';
  var CRY = window.CRY, P = CRY.Prices, esc = CRY.esc;
  var NAV = { home: 'home', market: 'market', learn: 'learn', lesson: 'learn', quiz: 'quiz', coins: 'coins', coin: 'coins', history: 'history', glossary: 'glossary', feedback: 'feedback' };
  var current = null;

  function render() {
    var r = CRY.parseHash();
    var fn = CRY.routes[r.name];
    if (!fn) { r = { name: 'home', args: [] }; fn = CRY.routes.home; }
    var main = document.getElementById('appRoot');
    // 每次換頁都換一個全新的容器，上一頁綁的事件會跟著舊節點一起被回收
    var page = document.createElement('div');
    page.className = 'cry-page cry-page-' + r.name;
    main.innerHTML = '';
    main.appendChild(page);
    current = page;
    try { fn(page, r.args); }
    catch (e) {
      page.innerHTML = '<div class="cry-empty">這一頁載入時發生錯誤，請重新整理。<a href="#/home">回首頁</a></div>';
      if (window.console) console.error(e);
    }
    CRY.$$('#mainNav [data-route]').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-route') === NAV[r.name]); });
    var active = CRY.$('#mainNav .active');
    if (active && active.scrollIntoView) { try { active.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) { /* 舊瀏覽器 */ } }
    CRY.closeModal();
    if (r.name !== 'history' || !r.args[0]) window.scrollTo(0, 0);
    document.title = '區塊鏈學院｜' + (active ? active.textContent.replace(/\s*\d+\/\d+\s*$/, '').trim() : '開心學園');
  }
  CRY.rerender = render;

  function headerTicker() {
    var el = document.getElementById('hdrTicker');
    if (!el) return;
    el.innerHTML = ['bitcoin', 'ethereum'].map(function (id) {
      var c = P.get(id);
      return c ? '<a href="#/coin/' + id + '"><b>' + esc(c.sym) + '</b> ' + P.price(c.p) + ' ' + CRY.pctHtml(c.c24h) + '</a>' : '';
    }).join('');
  }

  function openReleaseModal() {
    var rel = window.CRY_RELEASES || { current_version: '1.0.0', releases: [] };
    var items = (rel.releases || []).map(function (r) {
      return '<div class="cry-rel-item"><h4>v' + esc(r.version) + '　' + esc(r.title || '') + '<span>' + esc(r.date || '') + '</span></h4><ul>' +
        (r.changes || []).map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    CRY.openModal('<h3>📦 版本更新紀錄</h3>' + (items || '<p class="cry-muted">尚無紀錄。</p>') +
      (CRY.isStatic() ? '' : '<p class="cry-muted">本機版可在校園的發布中心檢視差異與發布；<a href="download/single">⬇️ 下載單一檔 index.html</a></p>'));
  }

  function boot() {
    CRY.initContent();
    CRY.applyColorMode();
    CRY.syncNavCounts();
    var badge = document.getElementById('verBadge');
    if (badge) badge.textContent = 'v' + ((window.CRY_RELEASES || {}).current_version || '1.0.0');

    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-route],[data-cur],[data-refresh],[data-close-modal],#verBadge');
      if (!t) {
        if (e.target.id === 'cryModal') CRY.closeModal();
        return;
      }
      if (t.id === 'verBadge') { openReleaseModal(); return; }
      if (t.hasAttribute('data-close-modal')) { CRY.closeModal(); return; }
      if (t.hasAttribute('data-route')) { CRY.go(t.getAttribute('data-route')); return; }
      if (t.hasAttribute('data-cur')) { P.setCur(t.getAttribute('data-cur')); render(); return; }
      if (t.hasAttribute('data-refresh')) {
        t.disabled = true; t.textContent = '⏳ 更新中…';
        P.refreshNow().then(function (ok) {
          CRY.toast(ok ? '✅ 行情已更新' : '暫時連不上報價來源，顯示的是最近一次快照');
          t.disabled = false; t.textContent = '🔄 立即更新';
        });
      }
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') CRY.closeModal(); });
    window.addEventListener('hashchange', render);

    P.on(function () {
      headerTicker();
      if (current && typeof current._live === 'function') current._live();
    });
    P.init().then(function () { P.startAuto(); });
    headerTicker();
    render();
    CRY.reportProgress();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
