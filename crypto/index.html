  <style>
/* 區塊鏈學院 — 淺色、乾淨、資訊密度高；所有 class 以 cry- 開頭 */
:root {
  --bg: #f6f7f9; --card: #ffffff; --ink: #0f172a; --ink2: #334155; --muted: #64748b; --line: #e2e8f0; --line2: #eef2f6;
  --brand: #d97706; --brand-ink: #92400e; --brand-soft: #fef3c7; --navy: #0f172a; --blue: #2563eb;
  --up: #16a34a; --down: #dc2626; --flat: #64748b; --radius: 12px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 4px 14px rgba(15, 23, 42, .05);
}
html[data-cry-color="red_up"] { --up: #dc2626; --down: #16a34a; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink); line-height: 1.65; font-size: 15px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
small { font-weight: 500; color: var(--muted); font-size: .62em; }

/* ---------- Header ---------- */
.cry-header { position: sticky; top: 0; z-index: 40; background: var(--navy); color: #fff; box-shadow: 0 2px 10px rgba(2, 6, 23, .25); }
.cry-header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 20px 6px; max-width: 1240px; margin: 0 auto; }
.cry-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.cry-logo { display: flex; align-items: center; gap: 7px; color: #fff; font-size: 18px; white-space: nowrap; }
.cry-logo:hover { text-decoration: none; }
.cry-logo b { letter-spacing: .5px; }
.cry-ver { background: rgba(245, 158, 11, .18); color: #fcd34d; border: 1px solid rgba(245, 158, 11, .4); border-radius: 999px; font-size: 11.5px; padding: 1px 9px; cursor: pointer; }
.cry-hdr-ticker { display: flex; gap: 16px; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cry-hdr-ticker a { color: #e2e8f0; }
.cry-hdr-ticker a:hover { text-decoration: none; color: #fff; }
.cry-hdr-ticker b { color: #fcd34d; margin-right: 3px; }
.cry-nav { display: flex; gap: 2px; padding: 0 14px; max-width: 1240px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
.cry-nav::-webkit-scrollbar { display: none; }
.cry-tab { background: none; border: 0; border-bottom: 3px solid transparent; color: #cbd5e1; padding: 8px 12px 7px; cursor: pointer; white-space: nowrap; font-size: 14px; }
.cry-tab:hover { color: #fff; }
.cry-tab.active { color: #fff; border-bottom-color: #f59e0b; font-weight: 700; }
.cry-tab-badge { background: rgba(255, 255, 255, .14); border-radius: 999px; padding: 0 7px; font-size: 11.5px; margin-left: 2px; }

/* ---------- Layout ---------- */
.cry-main { max-width: 1240px; margin: 0 auto; padding: 18px 20px 56px; }
.cry-page > section, .cry-page > .cry-status, .cry-page > .cry-toolbar, .cry-page > .cry-chips, .cry-page > article { margin-top: 16px; }
.cry-h1 { font-size: 24px; margin-bottom: 4px; }
.cry-h2 { font-size: 18px; margin-bottom: 10px; }
.cry-muted { color: var(--muted); font-size: 13px; }
.cry-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.cry-empty { color: var(--muted); padding: 28px 12px; text-align: center; }
.cry-link { color: var(--blue); font-weight: 600; font-size: 13.5px; }
.cry-tag { display: inline-block; background: var(--line2); color: var(--ink2); border-radius: 999px; padding: 1px 9px; font-size: 12px; font-style: normal; white-space: nowrap; }
.cry-date { font-variant-numeric: tabular-nums; color: var(--brand-ink); background: var(--brand-soft); border-radius: 6px; padding: 1px 7px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.cry-disclaimer { margin-top: 26px; font-size: 12.5px; color: var(--muted); background: #fff; border: 1px dashed #cbd5e1; border-radius: 10px; padding: 9px 12px; }

.cry-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: #fff; border: 1px solid #cbd5e1; border-radius: 9px; padding: 6px 13px; cursor: pointer; font-size: 14px; color: var(--ink); line-height: 1.4; text-align: center; }
.cry-btn:hover { background: #f8fafc; text-decoration: none; border-color: #94a3b8; }
.cry-btn:disabled { opacity: .6; cursor: default; }
.cry-btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 700; }
.cry-btn.primary:hover { background: #b45309; }
.cry-btn.ghost { border-color: transparent; background: transparent; color: var(--ink2); }
.cry-btn.done { background: #ecfdf5; border-color: #6ee7b7; color: #047857; font-weight: 700; }
.cry-seg { display: inline-flex; border: 1px solid #cbd5e1; border-radius: 9px; overflow: hidden; background: #fff; }
.cry-seg button { border: 0; background: none; padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--ink2); border-left: 1px solid var(--line); white-space: nowrap; }
.cry-seg button:first-child { border-left: 0; }
.cry-seg button.on { background: var(--navy); color: #fff; font-weight: 700; }
.cry-input { border: 1px solid #cbd5e1; border-radius: 9px; padding: 7px 11px; background: #fff; width: 100%; font-size: 14px; }
.cry-input:focus, .cry-btn:focus-visible, .cry-chip:focus-visible, .cry-opt:focus-visible { outline: 2px solid #f59e0b; outline-offset: 1px; }
.cry-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.cry-chip { border: 1px solid #cbd5e1; background: #fff; border-radius: 999px; padding: 3px 12px; font-size: 13px; cursor: pointer; color: var(--ink2); white-space: nowrap; }
.cry-chip:hover { text-decoration: none; border-color: #94a3b8; }
.cry-chip.on { background: var(--navy); color: #fff; border-color: var(--navy); font-weight: 700; }
.cry-toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.cry-toolbar .cry-input { max-width: 330px; }

/* ---------- 漲跌與走勢 ---------- */
.cry-pct { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.cry-pct.up { color: var(--up); } .cry-pct.down { color: var(--down); } .cry-pct.flat { color: var(--flat); }
.cry-spark { vertical-align: middle; }
.cry-spark.up polyline { stroke: var(--up); } .cry-spark.down polyline { stroke: var(--down); } .cry-spark.neutral polyline { stroke: #64748b; }
.cry-spark-none { color: #cbd5e1; }
.cry-chart { width: 100%; height: auto; display: block; }
.cry-chart .cry-grid { stroke: var(--line2); stroke-width: 1; }
.cry-chart .cry-axis { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.cry-chart.up .cry-line { stroke: var(--up); } .cry-chart.down .cry-line { stroke: var(--down); }
.cry-chart.up .cry-dot { fill: var(--up); } .cry-chart.down .cry-dot { fill: var(--down); }
.cry-chart.up .cry-g0 { stop-color: var(--up); stop-opacity: .22; } .cry-chart.down .cry-g0 { stop-color: var(--down); stop-opacity: .22; }
.cry-chart .cry-g1 { stop-color: #fff; stop-opacity: 0; }
.cry-ava { position: relative; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 800; flex: none; overflow: hidden; line-height: 1; }
.cry-ava img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #fff; opacity: 0; transition: opacity .15s; }

/* ---------- 行情狀態列與 KPI ---------- */
.cry-status { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: 13px; }
.cry-status-txt { font-weight: 600; }
.cry-status-src { color: var(--muted); font-size: 12.5px; }
.cry-status-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cry-status .cry-btn { padding: 4px 10px; font-size: 13px; }
.cry-kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.cry-kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; box-shadow: var(--shadow); min-width: 0; }
.cry-kpi .k { color: var(--muted); font-size: 12.5px; }
.cry-kpi .v { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.35; white-space: nowrap; }
.cry-kpi .v small { font-size: 13px; font-weight: 700; color: inherit; }
.cry-kpi .s { font-size: 12.5px; color: var(--ink2); display: flex; align-items: center; gap: 6px; }

/* ---------- 首頁 ---------- */
.cry-hero { display: flex; gap: 20px; align-items: center; justify-content: space-between; background: linear-gradient(120deg, #0f172a 0%, #1e293b 55%, #78350f 130%); color: #fff; border-radius: 16px; padding: 22px 26px; }
.cry-hero h1 { font-size: 26px; }
.cry-hero p { color: #cbd5e1; margin-top: 6px; max-width: 720px; }
.cry-hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.cry-hero .cry-btn:not(.primary) { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .3); color: #fff; }
.cry-hero-prog { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; color: #e2e8f0; flex: none; }
.cry-ring { --p: 0; width: 92px; height: 92px; border-radius: 50%; background: conic-gradient(#f59e0b calc(var(--p) * 1%), rgba(255, 255, 255, .16) 0); display: grid; place-items: center; }
.cry-ring b { width: 70px; height: 70px; border-radius: 50%; background: #1e293b; display: grid; place-items: center; font-size: 19px; }
.cry-ticks { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 12px; }
.cry-tick { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 13px; color: var(--ink); box-shadow: var(--shadow); min-width: 0; }
.cry-tick:hover { text-decoration: none; border-color: #f59e0b; }
.cry-tick-top { display: flex; align-items: center; gap: 9px; }
.cry-tick-top div { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.cry-tick-top span { color: var(--muted); font-size: 12px; }
.cry-tick-price { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 5px; white-space: nowrap; }
.cry-tick-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.cry-tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.cry-track { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px; color: var(--ink); box-shadow: var(--shadow); }
.cry-track:hover { text-decoration: none; border-color: #f59e0b; }
.cry-track-ic { width: 42px; height: 42px; border-radius: 11px; background: var(--brand-soft); display: grid; place-items: center; font-size: 21px; flex: none; }
.cry-track-body { min-width: 0; flex: 1; }
.cry-track-body p { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 2px 0 7px; }
.cry-bar { height: 6px; background: var(--line2); border-radius: 99px; overflow: hidden; margin-bottom: 3px; }
.cry-bar i { display: block; height: 100%; background: #f59e0b; border-radius: 99px; }
.cry-story-card { display: block; background: var(--card); border: 1px solid var(--line); border-left: 4px solid #f59e0b; border-radius: var(--radius); padding: 13px 16px; color: var(--ink); box-shadow: var(--shadow); }
.cry-story-card:hover { text-decoration: none; }
.cry-story-card b { font-size: 17px; margin-left: 8px; }
.cry-story-card p { color: var(--ink2); margin: 4px 0; }
.cry-quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.cry-quick a { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; color: var(--ink); display: flex; flex-direction: column; box-shadow: var(--shadow); }
.cry-quick a:hover { text-decoration: none; border-color: #f59e0b; }
.cry-quick span { color: var(--muted); font-size: 13px; }

/* ---------- 行情表 ---------- */
.cry-chart-card { padding: 14px 16px 8px; }
.cry-chart-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.cry-chart-title { display: flex; align-items: center; gap: 10px; }
.cry-chart-title div { display: flex; flex-direction: column; line-height: 1.3; }
.cry-chart-title span { font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.cry-chart-ctl { display: flex; gap: 8px; flex-wrap: wrap; }
.cry-conv { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; }
.cry-conv input, .cry-conv select { border: 1px solid #cbd5e1; border-radius: 8px; padding: 5px 9px; background: #fff; }
.cry-conv input { width: 120px; }
.cry-conv select { max-width: 220px; }
.cry-conv output { font-variant-numeric: tabular-nums; }
.cry-conv-eq { color: var(--muted); font-weight: 700; }
.cry-table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.cry-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.cry-table th { text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: #f8fafc; user-select: none; }
.cry-table th[data-sort] { cursor: pointer; }
.cry-table th.sorted { color: var(--ink); }
.cry-table td { padding: 7px 10px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
.cry-table tbody tr:last-child td { border-bottom: 0; }
.cry-table tr[data-coin] { cursor: pointer; }
.cry-table tr[data-coin]:hover td { background: #fffbeb; }
.cry-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cry-table .narrow { width: 64px; color: var(--muted); }
.cry-table .strong { font-weight: 700; }
.cry-star { background: none; border: 0; cursor: pointer; color: #cbd5e1; font-size: 15px; padding: 0 4px 0 0; }
.cry-star.on { color: #f59e0b; }
.cry-coin-cell { display: flex; align-items: center; gap: 9px; min-width: 150px; }
.cry-coin-cell div { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.cry-coin-cell span { color: var(--muted); font-size: 12px; }
.cry-coin-cell em { font-style: normal; color: var(--brand-ink); }
.cry-more { text-align: center; margin-top: 12px; }
.cry-count { margin-top: 8px; text-align: right; }
.cry-doc-table th, .cry-doc-table td { white-space: normal; }
.cry-doc-table td:first-child { font-weight: 600; }

/* ---------- Modal / Toast ---------- */
.cry-modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, .55); display: none; align-items: center; justify-content: center; z-index: 90; padding: 16px; }
.cry-modal-backdrop.open { display: flex; }
.cry-modal { position: relative; background: #fff; border-radius: 16px; padding: 20px 22px; width: min(680px, 100%); max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(2, 6, 23, .35); }
.cry-modal h3 { font-size: 19px; margin-bottom: 8px; padding-right: 30px; }
.cry-modal-close { position: absolute; top: 12px; right: 12px; border: 0; background: var(--line2); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
.cry-modal-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.cry-modal-chart { margin: 10px 0 6px; }
.cry-term-modal p { margin: 8px 0; }
.cry-rel-item { border-top: 1px solid var(--line); padding: 10px 0; }
.cry-rel-item h4 { font-size: 14.5px; display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.cry-rel-item h4 span { color: var(--muted); font-weight: 500; font-size: 12.5px; }
.cry-rel-item ul { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }
.cry-toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); background: var(--navy); color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 100; max-width: 92vw; text-align: center; }
.cry-toast.show { opacity: 1; transform: translate(-50%, 0); }
.cry-big-price { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.cry-big-price .cry-pct { font-size: 15px; margin-left: 6px; }
.cry-facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.cry-fact { background: #f8fafc; border: 1px solid var(--line2); border-radius: 9px; padding: 7px 10px; display: flex; flex-direction: column; min-width: 0; }
.cry-fact span { color: var(--muted); font-size: 12px; }
.cry-fact b { font-variant-numeric: tabular-nums; font-size: 14px; overflow-wrap: anywhere; }

/* ---------- 課程 ---------- */
.cry-chips-scroll { margin: 10px 0 4px; }
.cry-track-sec { margin-top: 22px; }
.cry-track-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.cry-track-head h2 { font-size: 19px; }
.cry-lessons { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-top: 8px; overflow: hidden; box-shadow: var(--shadow); }
.cry-lesson-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; color: var(--ink); border-bottom: 1px solid var(--line2); }
.cry-lesson-row:last-child { border-bottom: 0; }
.cry-lesson-row:hover { background: #fffbeb; text-decoration: none; }
.cry-lesson-no { width: 28px; height: 28px; border-radius: 50%; background: var(--line2); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; color: var(--ink2); }
.cry-lesson-row.done .cry-lesson-no { background: #10b981; color: #fff; }
.cry-lesson-main { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.4; }
.cry-lesson-main span { color: var(--muted); font-size: 13px; }
.cry-lesson-meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12.5px; white-space: nowrap; flex-wrap: wrap; }
.cry-lesson-meta i { font-style: normal; border-radius: 999px; padding: 0 8px; font-weight: 700; }
.cry-lesson-meta i.lv1 { background: #dcfce7; color: #166534; } .cry-lesson-meta i.lv2 { background: #dbeafe; color: #1e40af; } .cry-lesson-meta i.lv3 { background: #fae8ff; color: #86198f; }
.cry-crumb { font-size: 13px; color: var(--muted); }
.cry-article { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 26px; box-shadow: var(--shadow); max-width: 860px; margin-left: auto; margin-right: auto; }
.cry-page-lesson .cry-crumb { max-width: 860px; margin: 0 auto; }
.cry-article header h1 { font-size: 25px; line-height: 1.35; }
.cry-lead { color: var(--ink2); font-size: 15.5px; margin: 6px 0 8px; }
.cry-article section { margin-top: 20px; }
.cry-article h2 { font-size: 18px; margin-bottom: 6px; padding-left: 10px; border-left: 4px solid #f59e0b; line-height: 1.4; }
.cry-article p { margin: 8px 0; font-size: 15.5px; line-height: 1.8; color: #1e293b; }
.cry-article ul { margin: 8px 0; padding-left: 22px; }
.cry-article li { margin: 4px 0; line-height: 1.7; }
.cry-article .cry-table-wrap { margin: 10px 0; box-shadow: none; }
.cry-plain { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 11px; padding: 11px 14px; margin-top: 14px; color: #1e3a8a; line-height: 1.75; }
.cry-takeaway { background: var(--brand-soft); border: 1px solid #fcd34d; border-radius: 11px; padding: 11px 14px; margin-top: 18px; color: #78350f; font-weight: 600; line-height: 1.7; }
.cry-terms { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-top: 14px; font-size: 13.5px; }
.cry-eg { color: var(--ink2); font-size: 14px; }
.cry-quiz .cry-q { border-top: 1px solid var(--line2); padding: 12px 0; }

  function setCookieBoth(name, val) {
    if (window.location && window.location.protocol === 'file:') return;
    try {
      document.cookie = name + '=' + val + '; path=/; max-age=31536000; SameSite=Lax';
      var hParts = String(window.location.hostname || '').split('.');
      if (hParts.length >= 4 && /^[ab][0-9a-f]{20,}$/i.test(hParts[0])) {
        document.cookie = name + '=' + val + '; domain=.' + hParts.slice(1).join('.') + '; path=/; max-age=31536000; SameSite=Lax';
      }
    } catch (e) { /* ignore */ }
  }

  function readCookieJson(name) {
    if (window.location && window.location.protocol === 'file:') return null;
    try {
      var parts = (document.cookie || '').split(';');
      for (var i = 0; i < parts.length; i++) {
        var kv = parts[i].trim();
        if (kv.indexOf(name + '=') === 0) {
          var obj = JSON.parse(decodeURIComponent(kv.slice(name.length + 1)));
          return obj && typeof obj === 'object' ? obj : null;
        }
      }
    } catch (e) { /* ignore */ }
    return null;
  }

  function writeStuCookie(obj) {

  function scanSavedFeedbackCount() {
    var total = 0;
    for (var i = 0; i < ALL_FB_KEYS.length; i++) {
      try {
        var raw = window.localStorage.getItem(ALL_FB_KEYS[i]);
        if (!raw) continue;
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) total += parsed.length;
        else if (parsed && typeof parsed === 'object' && Array.isArray(parsed.items)) total += parsed.items.length;
      } catch (e) { /* ignore */ }
    }
    return total;
  }

  function mergeDailyRecord(a, b, tDay) {
    var da = isPlainObj(a) && (a.date === tDay || a.day === tDay) ? a : null;
    var db = isPlainObj(b) && (b.date === tDay || b.day === tDay) ? b : null;
    if (!da && !db) {
      return {
        date: tDay, day: tDay, checkin: 0, visit: 0, acts: 0, visitedIds: {},
        study: 0, studySec: 0, sport: 0, eco: 0,
        claimed: {}, bonusClaimed: false, fullClaimed: false, allClearClaimed: false
      };
    }
    var srcA = da || {}, srcB = db || {};
    var claimed = Object.assign({}, isPlainObj(srcA.claimed) ? srcA.claimed : {}, isPlainObj(srcB.claimed) ? srcB.claimed : {});
    var visitedIds = Object.assign({}, isPlainObj(srcA.visitedIds) ? srcA.visitedIds : {}, isPlainObj(srcB.visitedIds) ? srcB.visitedIds : {});
    var studyVal = Math.max(+srcA.study || 0, +srcA.studySec || 0, +srcB.study || 0, +srcB.studySec || 0);
    var bonus = !!(srcA.bonusClaimed || srcA.fullClaimed || srcB.bonusClaimed || srcB.fullClaimed);
    var allClear = !!(srcA.allClearClaimed || srcB.allClearClaimed);
    return Object.assign({}, srcA, srcB, {
      date: tDay,
      day: tDay,
      checkin: Math.max(+srcA.checkin || 0, +srcB.checkin || 0),
      visit: Math.max(+srcA.visit || 0, +srcB.visit || 0, Object.keys(visitedIds).length),
      acts: Math.max(+srcA.acts || 0, +srcB.acts || 0),
      visitedIds: visitedIds,
      study: studyVal,
      studySec: studyVal,
      sport: Math.max(+srcA.sport || 0, +srcB.sport || 0),
      eco: Math.max(+srcA.eco || 0, +srcB.eco || 0),
      claimed: claimed,
      bonusClaimed: bonus,
      fullClaimed: bonus,
      allClearClaimed: allClear,
    });
  }

  function loadFunState() {
    var ls = {}, ck = readCookieJson(FUN_COOKIE) || {};
    try { ls = JSON.parse(window.localStorage.getItem(FUN_KEY) || '{}') || {}; } catch (e) { ls = {}; }
    var badges = Object.assign({}, isPlainObj(ls.ach) ? ls.ach : {}, isPlainObj(ls.badges) ? ls.badges : {});
    if (Array.isArray(ck.ach)) {
      ck.ach.forEach(function (id) { if (id && !badges[id]) badges[id] = Date.now(); });
    }
    var academyActs = Object.assign({}, isPlainObj(ck.aact) ? ck.aact : {});
    if (isPlainObj(ls.academyActs)) {
      Object.keys(ls.academyActs).forEach(function (k) {
        academyActs[k] = Math.max(+academyActs[k] || 0, +ls.academyActs[k] || 0);
      });
    }
    var academySec = Object.assign({}, isPlainObj(ck.asec) ? ck.asec : {});
    if (isPlainObj(ls.academySec)) {
      Object.keys(ls.academySec).forEach(function (k) {
        academySec[k] = Math.max(+academySec[k] || 0, +ls.academySec[k] || 0);
      });
    }
    var days = Object.assign({}, isPlainObj(ls.studyDays) ? ls.studyDays : {});
    if (Array.isArray(ck.days)) {
      ck.days.forEach(function (d) { if (d) days[d] = 1; });
    }
    var tDay = todayStr();
    days[tDay] = 1;
    var daily = mergeDailyRecord(ck.dl, ls.daily, tDay);
    return {
      raw: ls,
      badges: badges,
      academyActs: academyActs,
      academySec: academySec,
      days: days,
      studySec: Math.max(+ls.studySec || 0, +ck.sec || 0),
      dailyPts: Math.max(+ls.dailyPts || 0, +ck.dpts || 0),
      dailyFullDays: Math.max(+ls.dailyFullDays || 0, +ck.dfull || 0),
      dailyAllClearDays: +ls.dailyAllClearDays || 0,
      feedbackCount: Math.max(+ls.feedbackCount || 0, +ck.fbc || 0, scanSavedFeedbackCount()),

      triviaSubmitted: !!(ls.triviaSubmitted || badges.acad_trv_sub),
      daily: daily,
    };
  }

  function saveFunState(st) {

    try {
      var latest = {};
      try { latest = JSON.parse(window.localStorage.getItem(FUN_KEY) || '{}') || {}; } catch (e0) { latest = {}; }
      var mergedAch = Object.assign({}, isPlainObj(latest.ach) ? latest.ach : {}, st.badges || {});

        mergedActs[k] = Math.max(+mergedActs[k] || 0, +st.academyActs[k] || 0);
      });
      var mergedSec = Object.assign({}, isPlainObj(latest.academySec) ? latest.academySec : {});
      Object.keys(st.academySec || {}).forEach(function (k) {
        mergedSec[k] = Math.max(+mergedSec[k] || 0, +st.academySec[k] || 0);
      });
      var mergedDays = Object.assign({}, isPlainObj(latest.studyDays) ? latest.studyDays : {}, st.days || {});
      var mergedDaily = mergeDailyRecord(latest.daily, st.daily, tDay);
      st.badges = mergedAch;
      st.academyActs = mergedActs;
      st.academySec = mergedSec;
      st.days = mergedDays;
      st.daily = mergedDaily;
      st.studySec = Math.max(+latest.studySec || 0, +st.studySec || 0);
      st.dailyPts = Math.max(+latest.dailyPts || 0, +st.dailyPts || 0);
      st.dailyFullDays = Math.max(+latest.dailyFullDays || 0, +st.dailyFullDays || 0);
      st.dailyAllClearDays = Math.max(+latest.dailyAllClearDays || 0, +st.dailyAllClearDays || 0);
      st.feedbackCount = Math.max(+latest.feedbackCount || 0, +st.feedbackCount || 0);

      var merged = Object.assign({}, st.raw || {}, latest, {
        ach: mergedAch,
        academyActs: mergedActs,
        academySec: mergedSec,
        studyDays: mergedDays,
        studySec: st.studySec,
        dailyPts: st.dailyPts,
        dailyFullDays: st.dailyFullDays,
        dailyAllClearDays: st.dailyAllClearDays,
        feedbackCount: st.feedbackCount,
        triviaSubmitted: !!(latest.triviaSubmitted || st.triviaSubmitted),
        daily: mergedDaily,
      });
      window.localStorage.setItem(FUN_KEY, JSON.stringify(merged));
    } catch (e) { /* ignore */ }
    try {
      var prevCk = readCookieJson(FUN_COOKIE) || {};
      var dayKeys = Object.keys(st.days || {}).sort().slice(-30);
      var min = Object.assign({}, prevCk, {
        ach: Object.keys(st.badges || {}),
        sec: +st.studySec || 0,
        asec: st.academySec || {},
        aact: st.academyActs || {},
        days: dayKeys,
        dpts: +st.dailyPts || 0,
        dfull: +st.dailyFullDays || 0,
        fbc: +st.feedbackCount || 0,
        dl: st.daily || null,
      });
      var enc = encodeURIComponent(JSON.stringify(min));
      if (enc.length > 3500) {
        delete min.pkmn;
        delete min.cars;
        enc = encodeURIComponent(JSON.stringify(min));
      }
      if (enc.length > 3700) {
        min.ach = (min.ach || []).slice(-80);
        delete min.asec;
        delete min.aact;
        enc = encodeURIComponent(JSON.stringify(min));
      }
      if (enc.length <= 3900) {
        setCookieBoth(FUN_COOKIE, enc);
      }
    } catch (e) { /* ignore */ }
  }

  function evaluateDailyInAcademy(st) {
    if (!st) return;
    var tDay = todayStr();
    st.daily = mergeDailyRecord(null, st.daily, tDay);
    var d = st.daily;
    d.claimed = isPlainObj(d.claimed) ? d.claimed : {};
    d.visitedIds = isPlainObj(d.visitedIds) ? d.visitedIds : {};
    var sSec = Math.max(+d.study || 0, +d.studySec || 0);
    d.study = sSec;
    d.studySec = sSec;
    var vCnt = Math.max(+d.visit || 0, Object.keys(d.visitedIds).length);
    d.visit = vCnt;
    var aCnt = Math.max(+d.acts || 0, 0);

    var changed = false;
    var toastItem = null;
    NAV_DAILY_SPECS.forEach(function (sp) {
      var val = 0;
      if (sp.id === 'study' || sp.id === 'study15' || sp.id === 'study30' || sp.id === 'study45') val = sSec;
      else if (sp.id === 'visit' || sp.id === 'visit3' || sp.id === 'visit5') val = vCnt;
      else if (sp.id === 'acts10' || sp.id === 'acts30') val = aCnt;
      else val = +d[sp.id] || 0;
      if (val >= sp.goal && !d.claimed[sp.id]) {
        d.claimed[sp.id] = Date.now();
        st.dailyPts = (+st.dailyPts || 0) + sp.pts;
        changed = true;
        if (sp.id !== 'visit') {
          toastItem = { icon: sp.icon, name: '每日任務達成：' + sp.name, pts: sp.pts, title: '' };
        }
      }
    });
    var doneCnt = NAV_DAILY_SPECS.filter(function (sp) { return !!d.claimed[sp.id]; }).length;
    if (doneCnt >= 5 && !d.bonusClaimed) {
      d.bonusClaimed = true;
      d.fullClaimed = true;
      st.dailyPts = (+st.dailyPts || 0) + 10;
      st.dailyFullDays = (+st.dailyFullDays || 0) + 1;
      changed = true;
      toastItem = { icon: '🎁', name: '今日達成 5 項每日任務達標獎！', pts: 10, title: '' };
    }
    if (doneCnt >= NAV_DAILY_SPECS.length && !d.allClearClaimed) {
      d.allClearClaimed = true;
      st.dailyPts = (+st.dailyPts || 0) + 20;
      st.dailyAllClearDays = (+st.dailyAllClearDays || 0) + 1;
      changed = true;
      toastItem = { icon: '🏆', name: '今日 12 項每日任務全制霸大賞！', pts: 20, title: '' };
    }
    if (changed) {
      saveFunState(st);
      if (toastItem) showAchToast(toastItem);
    }
  }

      if ((opts.forceRemote && mqttSent === 0) || nowMs - _lastNtfySendMs >= ntfyGap) {
        _lastNtfySendMs = nowMs;
        fetch('https://ntfy.sh/' + NTFY_TOPIC, { method: 'POST', body: bodyStr, keepalive: true }).catch(function () {});
      }
    } catch (e) { /* ignore */ }
  }

  function connectSingleAcademyMqtt(url, idx, toolId) {
    if (!window.WebSocket || isNavBot()) return;
    var existing = _navMqttClients[idx];
    if (existing && existing.ws && (existing.ws.readyState === 0 || existing.ws.readyState === 1)) return;
    if (existing && existing.pingT) { clearInterval(existing.pingT); existing.pingT = 0; }
    if (existing && existing.retryT) { clearTimeout(existing.retryT); existing.retryT = 0; }

    var entry = existing || { url: url, ws: null, ready: false, backoff: 1500, pingT: 0, retryT: 0, pktId: 1 };
    entry.ready = false;
    _navMqttClients[idx] = entry;

    var ws;
    try {
      ws = new WebSocket(url, 'mqtt');
      ws.binaryType = 'arraybuffer';
    } catch (e) {
      return;
    }
    entry.ws = ws;
    var rxBuf = new Uint8Array(0);

    ws.onopen = function () {
      if (entry.ws !== ws) return;
      var cid = 'hc_ac_' + TAB_ID.replace(/[^a-zA-Z0-9]/g, '').slice(-10) + '_' + idx + '_' + (Date.now() % 10000);
      try { ws.send(mqttConnectPkt(cid)); } catch (e) { /* ignore */ }
    };

    ws.onmessage = function (ev) {
      if (entry.ws !== ws || !ev || !ev.data) return;
      var chunk = new Uint8Array(ev.data);
      var merged = new Uint8Array(rxBuf.length + chunk.length);
      merged.set(rxBuf, 0);
      merged.set(chunk, rxBuf.length);
      rxBuf = merged;

      while (rxBuf.length >= 2) {
        var byte0 = rxBuf[0];
        var pktType = byte0 >> 4;
        var flags = byte0 & 0x0f;
        var mult = 1, remLen = 0, pos = 1, b;
        do {
          if (pos >= rxBuf.length) return;
          b = rxBuf[pos++];
          remLen += (b & 0x7f) * mult;
          mult *= 128;
        } while ((b & 0x80) !== 0 && pos < 5);

        var totalLen = pos + remLen;
        if (rxBuf.length < totalLen) return;

        var body = rxBuf.subarray(pos, totalLen);
        rxBuf = rxBuf.subarray(totalLen);

        if (pktType === 2) { // CONNACK
          entry.ready = true;
          entry.backoff = 1500;
          try {
            ws.send(mqttSubscribePkt(entry.pktId++, [MQTT_CTL_TOPIC]));
          } catch (e) { /* ignore */ }
          if (entry.pingT) clearInterval(entry.pingT);
          entry.pingT = setInterval(function () {
            if (entry.ws === ws && ws.readyState === 1 && entry.ready) {
              try { ws.send(mqttPingReqPkt()); } catch (e) { /* ignore */ }
            }
          }, 25000);
          // 連上後立即廣播一次目前在該學院的狀態
          if (!_leftSent) {
            sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
          }
        } else if (pktType === 3 && body.length >= 2) { // PUBLISH
          var tLen = (body[0] << 8) | body[1];
          var pStart = 2 + tLen;
          var qos = (flags >> 1) & 0x03;
          if (qos > 0) pStart += 2;
          if (pStart <= body.length) {
            var topicStr = mqttUtf8Decode(body.subarray(2, 2 + tLen));
            var payloadStr = mqttUtf8Decode(body.subarray(pStart));
            if (topicStr === MQTT_CTL_TOPIC && payloadStr) {
              try {
                var d = JSON.parse(payloadStr);
                if (d && (d.event === 'ping' || d.action === 'ping')) {
                  if (Date.now() - _lastPongSentMs >= 3500) {
                    _lastPongSentMs = Date.now();
                    setTimeout(function () {
                      if (!_leftSent) sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'pong' });
                    }, 80 + Math.floor(Math.random() * 280));
                  }
                }
              } catch (e) { /* ignore */ }
            }
          }
        }
      }
    };

    var onDisconnect = function () {
      if (entry.ws !== ws) return;
      entry.ready = false;
      entry.ws = null;
      if (entry.pingT) { clearInterval(entry.pingT); entry.pingT = 0; }
      if (entry.retryT) clearTimeout(entry.retryT);
      var wait = entry.backoff + Math.floor(Math.random() * 600);
      entry.backoff = Math.min(18000, Math.round(entry.backoff * 1.7));
      entry.retryT = setTimeout(function () {
        entry.retryT = 0;
        connectSingleAcademyMqtt(url, idx, toolId);
      }, wait);
    };
    ws.onerror = onDisconnect;
    ws.onclose = onDisconnect;
  }

  function connectAcademyMqtt(toolId) {
    if (!window.WebSocket || isNavBot()) return;
    MQTT_BROKERS.forEach(function (url, idx) {
      connectSingleAcademyMqtt(url, idx, toolId);
    });

  function connectAcademyRollCall(toolId) {
    connectAcademyMqtt(toolId);
    if (!window.EventSource || isNavBot()) return;
    if (_navEs) {
      try { _navEs.close(); } catch (e) { /* ignore */ }
      _navEs = null;
    }
    try {
      var es = new EventSource('https://ntfy.sh/' + NTFY_TOPIC + '/sse');
      _navEs = es;
      es.onopen = function () { _navEsBackoff = 2000; };
      es.onmessage = function (ev) {
        try {
          var m = JSON.parse(ev.data);
          if (m && m.time) syncNavClock(+m.time);
          if (!m || m.event !== 'message' || !m.message) return;
          var d = JSON.parse(m.message);
          if (d && (d.event === 'ping' || d.action === 'ping')) {
            if (Date.now() - _lastPongSentMs >= 3500) {
              _lastPongSentMs = Date.now();

      es.onerror = function () {
        try { es.close(); } catch (e) { /* ignore */ }
        if (_navEs === es) _navEs = null;
        if (_navEsRetryT) clearTimeout(_navEsRetryT);
        var wait = _navEsBackoff + Math.floor(Math.random() * 800);
        _navEsBackoff = Math.min(20000, Math.floor(_navEsBackoff * 1.8));
        _navEsRetryT = setTimeout(function () {

        }, wait);

    } catch (e) { /* ignore */ }
  }

  function startAcademyPresenceLoop(toolId) {
    if (!toolId || !TOOL_MAP[toolId] || _presenceLoopBound || isNavBot()) return;
    _presenceLoopBound = true;
    touchTabLease(toolId);

    window.addEventListener('keydown', function (e) {
      if (!e) return;
      if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.key === 'R'))) {
        markInternalNav();
      }
    }, true);

    if (window.BroadcastChannel) {
      try {
        _navBc = new BroadcastChannel(BC_NAME);
        _navBc.onmessage = function (ev) {
          var d = ev && ev.data;
          if (!d) return;
          if (d.event === 'tab_closed' && d.tabId !== TAB_ID && !document.hidden) {
            sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
          } else if (d.event === 'ping' && Date.now() - _lastPongSentMs >= 3000) {
            _lastPongSentMs = Date.now();
            sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'pong' });
          }
        };
      } catch (e) { _navBc = null; }
    }

    var onUserAct = function () {
      var wasAway = (Date.now() - _lastActMs) >= 90000;
      _lastActMs = Date.now();
      _leftSent = false;
      if (wasAway && !document.hidden) {
        sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'active' });
      }
    };
    ['pointerdown', 'keydown', 'touchstart', 'touchmove', 'wheel'].forEach(function (evName) {
      window.addEventListener(evName, onUserAct, { passive: true });
    });

    setInterval(function () {
      touchTabLease(toolId);
      sendPresenceHeartbeat(toolId, { forceRemote: false });
    }, 10000);

    document.addEventListener('visibilitychange', function () {
      touchTabLease(toolId);
      if (!document.hidden) {
        _leftSent = false;
        _lastActMs = Date.now();
        connectAcademyMqtt(toolId);
        if (!_navEs) connectAcademyRollCall(toolId);
        sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'active' });
      } else {
        sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'away' });
      }
    });
    window.addEventListener('online', function () {
      _leftSent = false;
      connectAcademyRollCall(toolId);
      sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
    });
    window.addEventListener('pageshow', function () {
      _leftSent = false;
      _internalNav = false;
      touchTabLease(toolId);
      connectAcademyRollCall(toolId);
      sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
    });

    function onUnload() {
      if (_leftSent) return;
      _leftSent = true;
      var otherTabs = removeTabLease();
      var recentNavTs = 0;
      try { recentNavTs = +window.localStorage.getItem(NAV_TS_KEY) || 0; } catch (e) { /* ignore */ }
      var isInternal = _internalNav || (Date.now() - recentNavTs < 5000);
      if (otherTabs > 0) {
        if (_navBc) {
          try { _navBc.postMessage({ event: 'tab_closed', tabId: TAB_ID }); } catch (e) { /* ignore */ }
        }
        return;
      }
      if (!isInternal) {
        sendPresenceHeartbeat(toolId, { leave: true });
      }
    }
    window.addEventListener('pagehide', onUnload);
    window.addEventListener('beforeunload', onUnload);

    connectAcademyRollCall(toolId);
  }

  /** ntfy.sh keeps messages ≤ 4096 bytes inline; clip long descriptions instead of turning them into attachments. */
  function utf8Clip(text, maxBytes) {

    '像在酒吧先開一張帳單，離開時才一次刷卡結清。');
  G('UTXO', 'Unspent Transaction Output', 'tech',
    '「未花費的交易輸出」，比特幣的記帳方式：帳本不記餘額，而是記錄一張張還沒花掉的「鈔票」，付款時拿整張出去再找零。',
    '有一張 1 枚的 UTXO 要付 0.3 枚，就會產生 0.7 枚找零給自己。');
  G('區塊鏈三難困境', 'Blockchain Trilemma', 'tech',
    '一般認為區塊鏈很難同時把「去中心化、安全、高效能」三件事都做到最好，通常得有所取捨。各種新公鏈與 Layer 2 都是在嘗試不同的平衡點。',
    '像找房子：便宜、寬敞、地點好，很難三樣全拿。');
  G('區塊鏈瀏覽器', 'Block Explorer', 'tech',
    '查詢鏈上資料的網站，輸入地址或交易雜湊，就能看到餘額、轉帳紀錄與確認狀態，不必註冊。',
    '像物流查詢頁面，以太坊常用 Etherscan。');

  // ── coin 貨幣與代幣 ──
  G('加密貨幣', 'Cryptocurrency', 'coin',
    '用密碼學與區塊鏈來記帳、發行的數位資產，不靠銀行或政府背書。台灣法規與媒體也常稱為「虛擬貨幣」或「虛擬資產」。價格波動通常很大。');
  G('比特幣', 'Bitcoin (BTC)', 'coin',
    '第一個去中心化的加密貨幣，由化名中本聰的人設計，2009 年 1 月上線。總量上限 2,100 萬枚，常被比喻為「數位黃金」，但價格波動遠大於黃金。');
  G('聰', 'Satoshi (sat)', 'coin',
    '比特幣的最小單位，1 聰等於一億分之一枚比特幣，名稱取自創辦人中本聰。所以不用買一整枚，也能持有一小部分。',
    '就像新台幣的「元」之於「一億元」。');
  G('以太幣', 'Ether (ETH)', 'coin',
    '以太坊區塊鏈的原生幣，用來支付 Gas 手續費，也是驗證者質押的保證金。嚴格來說「以太坊」是平台、「以太幣」是上面的貨幣。',
    '像遊樂園（以太坊）裡玩每項設施都要用的代幣。');
  G('Gwei', 'Gwei', 'coin',
    '以太幣的小單位，1 Gwei 等於十億分之一枚以太幣，主要用來標示 Gas 單價。更小的最小單位叫 wei，1 以太幣等於 10 的 18 次方 wei。');
  G('原生幣', 'Native Coin', 'coin',
    '一條區塊鏈自己內建的貨幣，用來付手續費與獎勵維護者，例如比特幣鏈的 BTC、以太坊的 ETH、Solana 的 SOL。',
    '像各國自己發行的法定貨幣。');
  G('代幣', 'Token', 'coin',
    '不是自己蓋一條鏈，而是用智慧合約在現有區塊鏈上發行的資產。發行門檻很低，任何人幾分鐘就能做出一種，所以品質落差極大。',
    '像在別人的百貨公司裡發行的禮券或集點卡。');
  G('ERC-20', 'ERC-20', 'coin',
    '以太坊上最通用的代幣規格，2015 年提出。只要照這套規格寫，錢包與交易所就能用同一種方式支援，USDT、USDC、UNI 等都有 ERC-20 版本。',
    '像統一規格的插頭，任何插座都插得上。');
  G('NFT', 'Non-Fungible Token', 'coin',
    '非同質化代幣：每一枚都有獨立編號、彼此不能直接互換，可用來代表圖片、門票、遊戲道具等的鏈上持有紀錄。持有 NFT 不等於擁有作品的著作權。',
    '像有流水號的演唱會門票，每張座位都不同。');
  G('山寨幣', 'Altcoin', 'coin',
    '比特幣以外所有加密貨幣的統稱，英文 Altcoin 是「替代幣」的意思。這是中性的幣圈用語，不等於仿冒品，但其中許多風險遠高於比特幣。');
  G('穩定幣', 'Stablecoin', 'coin',
    '價格設計成緊貼某種法幣（多半是美元）的加密貨幣，方便在鏈上當「現金」使用。常見作法是發行商存放等值的美元資產作儲備。',
    '例如 USDT、USDC。「穩定」是目標而非保證，仍有脫鉤與發行商風險。');
  G('脫鉤', 'Depeg', 'coin',
    '穩定幣或錨定資產的價格，偏離原本應該對應的價值（例如 1 美元）。可能是短暫的市場恐慌，也可能是儲備出問題的警訊。',
    '2022 年 5 月，靠程式機制而非十足儲備維持價格的 TerraUSD（UST）嚴重脫鉤，連同 LUNA 一起崩盤。');
  G('法幣', 'Fiat Currency', 'coin',
    '由政府發行、靠國家信用與法律支撐的貨幣，例如新台幣、美元、日圓。幣圈常說的「出入金」，指的就是法幣與加密貨幣之間的兌換。');
  G('迷因幣', 'Meme Coin', 'coin',
    '源自網路梗圖或玩笑的加密貨幣，多半沒有實際用途，價格主要靠社群熱度與名人話題推動，暴漲暴跌都極快，多數人最後是賠錢收場。',
    '狗狗幣（DOGE）2013 年就是以玩笑性質誕生的。');
  G('平台幣', 'Exchange Token', 'coin',
    '由交易所發行的代幣，常見用途是折抵手續費或參加平台活動。它的價值與該交易所的營運狀況高度綁在一起。',
    '2022 年 11 月 FTX 倒閉時，其平台幣 FTT 幾天內暴跌逾九成。');
  G('治理代幣', 'Governance Token', 'coin',
    '持有者可以對某個協議的規則與資金運用提案、投票的代幣。通常持有愈多票數愈多，所以實際上大戶的影響力往往遠大於散戶。',
    '像管委會的投票權，只是按「持分」而不是按「戶」計算。');
  G('隱私幣', 'Privacy Coin', 'coin',
    '用密碼學把交易的金額、付款方或收款方隱藏起來的加密貨幣，例如門羅幣（XMR）、Zcash（ZEC）。因為洗錢防制的顧慮，部分交易所已不提供交易。');
  G('包裝代幣', 'Wrapped Token', 'coin',
    '把某條鏈上的資產鎖起來，再到另一條鏈發行等值的「替身」代幣，讓它能在別的鏈使用。風險在於保管方或合約一旦出事，替身可能失去價值。',
    '例如 WBTC 讓比特幣能在以太坊上使用，像寄物櫃的號碼牌。');
  G('代幣經濟學', 'Tokenomics', 'coin',
    '一種代幣的「經濟設計說明書」：總量多少、怎麼發行、分給誰、何時解鎖、有什麼用途、會不會銷毀。是評估代幣前一定要讀的基本功課。');
  G('最大供給量', 'Max Supply', 'coin',
    '依照程式規則，一種幣最多能存在的總數。有上限代表具稀缺性，但不代表一定有價值；也有不少幣沒有設定上限。',
    '比特幣上限 2,100 萬枚；以太幣與狗狗幣則沒有固定上限。');
  G('流通供給量', 'Circulating Supply', 'coin',
    '目前已經發行、而且可以在市場上自由買賣的數量，不含還在鎖倉或尚未發行的部分。市值就是用它乘以幣價算出來的。');
  G('鑄造', 'Mint', 'coin',
    '透過智慧合約產生新的代幣或 NFT 的動作。該留意的是：誰有權鑄造、有沒有數量上限，若團隊能無限增發，持有者的份額就會被稀釋。',
    '像印鈔廠開機印出新鈔。');
  G('銷毀', 'Burn', 'coin',
    '把代幣送到沒有人能動用的地址，等於永久從流通中移除，藉此減少供給量。供給減少不代表價格必然上升，還得看需求。',
    '以太坊自 2021 年 8 月起，每筆交易的基本費都會被銷毀。');
  G('鎖倉與解鎖', 'Vesting / Token Unlock', 'coin',
    '團隊與早期投資人拿到的代幣通常不能立刻賣，要依時間表分批釋出。解鎖日前後市場上可賣的量會增加，可能帶來賣壓。',
    '像員工認股要做滿幾年才能分批領。');
  G('空投', 'Airdrop', 'coin',
    '專案免費把代幣發到使用者錢包，常用來回饋早期使用者或宣傳。要小心假空投：要求連結錢包、授權或輸入助記詞的，多半是詐騙陷阱。',
    '2020 年 9 月 Uniswap 向每個早期使用地址空投了 400 枚 UNI。');
})();

</script>
  <script>
(function () {
  'use strict';
  var CRY = (window.CRY = window.CRY || {});
  CRY.GLOSSARY = CRY.GLOSSARY || [];

  // ── DeFi ──
  CRY.GLOSSARY.push({ term: 'DeFi', en: 'Decentralized Finance', cat: 'defi', def: '去中心化金融。把存款、借錢、換匯這些銀行業務，改由鏈上的智慧合約自動執行，像一台不打烊、沒有行員的金融自動販賣機。少了中間人，但程式出錯或被駭時也沒有客服能幫你追回。' });
  CRY.GLOSSARY.push({ term: 'DEX', en: 'Decentralized Exchange', cat: 'defi', def: '簡稱 DEX。不用註冊帳號，直接用自己的錢包和智慧合約換幣，資產全程由自己保管；相對地，操作失誤也得自己負責。', eg: '例：Uniswap、PancakeSwap。' });
  CRY.GLOSSARY.push({ term: 'AMM', en: 'Automated Market Maker', cat: 'defi', def: '自動造市商。不靠買賣雙方掛單撮合，而是用數學公式依池子裡兩種幣的比例自動報價，像一台會自己調整匯率的換幣機。' });
  CRY.GLOSSARY.push({ term: '資金池', en: 'Liquidity Pool', cat: 'defi', def: '大家把兩種幣成對存進智慧合約形成的「公共換幣水池」。想換幣的人直接跟池子換，池子越深，大額交易的價格越不容易被推動。' });
  CRY.GLOSSARY.push({ term: '流動性提供者', en: 'Liquidity Provider (LP)', cat: 'defi', def: '把幣存進流動性池的人，簡稱 LP。好比出資讓換匯櫃檯有錢可換，可分到交易手續費，但要承擔無常損失與合約風險。' });
  CRY.GLOSSARY.push({ term: '無常損失', en: 'Impermanent Loss', cat: 'defi', def: '把幣放進流動性池後，若兩種幣的相對價格變動，領回時的總價值會比「單純放著不動」少，差額就是無常損失。價格偏離越多，損失越大，手續費收入不一定補得回來。' });
  CRY.GLOSSARY.push({ term: '滑價', en: 'Slippage', cat: 'defi', def: '又稱滑點。下單時預期的價格與實際成交價格的落差。池子太淺或單子太大時特別明顯，就像在小攤一次買光水果，越買越貴。', eg: '錢包裡的「滑價容忍度」設太高，容易被三明治攻擊。' });
  CRY.GLOSSARY.push({ term: '借貸協議', en: 'Lending Protocol', cat: 'defi', def: '鏈上的自動當鋪。存幣的人賺利息，借幣的人先押上抵押品才能借，利率由程式依供需即時調整。', eg: '例：Aave、Compound。' });
  CRY.GLOSSARY.push({ term: '超額抵押', en: 'Over-collateralization', cat: 'defi', def: '借出的金額必須低於抵押品價值。因為鏈上不查信用、也不認識你，只能靠多押一點來保護出借人，例如押價值 150 元的幣只能借 100 元。' });
  CRY.GLOSSARY.push({ term: '清算', en: 'Liquidation', cat: 'defi', def: '抵押品價格下跌到不足以擔保借款時，協議會自動把抵押品折價賣掉還債，借款人還要付一筆罰金。就像當鋪在典當品跌價時直接變賣。' });
  CRY.GLOSSARY.push({ term: '閃電貸', en: 'Flash Loan', cat: 'defi', def: '不需抵押、但必須在同一筆交易內借出並還清的貸款；還不出來，整筆交易就當作沒發生。常用於套利，也常被駭客拿來放大攻擊資金。' });
  CRY.GLOSSARY.push({ term: '流動性挖礦', en: 'Yield Farming', cat: 'defi', def: '把幣存進 DeFi 協議提供流動性，換取手續費與協議額外發放的代幣獎勵。報酬看似很高，但獎勵代幣可能大跌，還有無常損失與合約被駭的風險。' });
  CRY.GLOSSARY.push({ term: 'APY', en: 'Annual Percentage Yield', cat: 'defi', def: '把報酬換算成一年的比率。APR 不含複利，APY 含利滾利。數字會隨時變動，不是保證；高得不合理的年化，通常代表高風險甚至是騙局。' });
  CRY.GLOSSARY.push({ term: 'TVL', en: 'Total Value Locked', cat: 'defi', def: '總鎖倉價值。使用者存放在某個 DeFi 協議或某條鏈上的資產總值，常用來衡量規模與人氣，類似銀行的「存款總額」，但會隨幣價起伏。' });
  CRY.GLOSSARY.push({ term: '預言機', en: 'Oracle', cat: 'defi', def: '區塊鏈自己看不到外面的世界，預言機負責把幣價、天氣、比賽結果等鏈外資料送上鏈，像是替智慧合約跑腿報消息的人。報錯價格可能引發錯誤清算。', eg: '例：Chainlink。' });
  CRY.GLOSSARY.push({ term: '跨鏈橋', en: 'Cross-chain Bridge', cat: 'defi', def: '把資產從一條鏈搬到另一條鏈的工具。常見做法是在原鏈鎖住資產、在目標鏈發出等值憑證。橋上鎖了大量資金，歷來是駭客最愛下手的目標之一。' });
  CRY.GLOSSARY.push({ term: '流動性質押', en: 'Liquid Staking', cat: 'defi', def: '質押時拿到一張可自由轉讓的「質押收據代幣」，原本被鎖住的資產因此還能拿去交易或使用。收據代幣的價格有可能與原資產脫鉤。', eg: '例：Lido 的 stETH。' });
  CRY.GLOSSARY.push({ term: '再質押', en: 'Restaking', cat: 'defi', def: '把已經質押的資產再拿去替其他服務做擔保，多賺一份獎勵。一份資產背多份責任，出事時被罰沒的風險也跟著疊加。', eg: '例：EigenLayer。' });
  CRY.GLOSSARY.push({ term: 'RWA', en: 'Real World Assets', cat: 'defi', def: '現實世界資產代幣化。把公債、房地產、黃金等實體資產的權利做成鏈上代幣，方便分割與轉讓；但仍需仰賴發行機構誠實保管與法律保障。' });
  CRY.GLOSSARY.push({ term: 'MEV', en: 'Maximal Extractable Value', cat: 'defi', def: '最大可提取價值。負責排序交易的人（或機器人）靠著插隊、調換交易順序額外賺到的錢，好比排隊結帳時有人付小費給店員先結。' });

  // ── 交易與市場 ──
  CRY.GLOSSARY.push({ term: '中心化交易所', en: 'CEX', cat: 'trade', def: '由公司經營的交易平台，需註冊並通過身分驗證。操作像網路銀行一樣方便，但幣是交給平台保管，平台倒閉或被駭時可能領不出來。', eg: '2022 年 11 月 FTX 破產，大量客戶資產遭凍結。' });
  CRY.GLOSSARY.push({ term: '現貨', en: 'Spot', cat: 'trade', def: '一手交錢、一手交幣的買賣，買到的就是真正的幣，可以提領到自己的錢包。沒有槓桿，最多虧掉投入的本金。' });
  CRY.GLOSSARY.push({ term: '合約交易', en: 'Futures / Derivatives', cat: 'trade', def: '不實際持有幣，而是對未來價格漲跌下注的契約交易，通常會搭配槓桿。賺賠都被放大，新手虧光本金的情況相當常見。' });
  CRY.GLOSSARY.push({ term: '永續合約', en: 'Perpetual Contract', cat: 'trade', def: '沒有到期日的合約，可以一直持有。靠「資金費率」讓合約價格貼近現貨價，是加密貨幣市場交易量最大的衍生性商品之一。' });
  CRY.GLOSSARY.push({ term: '資金費率', en: 'Funding Rate', cat: 'trade', def: '永續合約多空雙方每隔一段時間互相支付的費用。合約價高於現貨時，做多的人付錢給做空的人，反之亦然，藉此把價格拉回現貨附近。' });
  CRY.GLOSSARY.push({ term: '槓桿', en: 'Leverage', cat: 'trade', def: '向平台借錢放大部位。10 倍槓桿代表用 1 元操作 10 元，價格對你有利時賺 10 倍，反向只要約 10% 就可能把本金賠光。' });
  CRY.GLOSSARY.push({ term: '保證金', en: 'Margin', cat: 'trade', def: '開槓桿部位時押在平台的本金，像租車的押金。虧損會先從保證金扣，低於門檻時平台會要求補錢，否則強制平倉。' });
  CRY.GLOSSARY.push({ term: '強制平倉', en: 'Forced Liquidation', cat: 'trade', def: '俗稱爆倉。槓桿交易虧損到保證金不夠時，平台強制把部位賣掉，押的本金幾乎歸零。槓桿越高，離強制平倉的價格越近。' });
  CRY.GLOSSARY.push({ term: '做多', en: 'Long', cat: 'trade', def: '看好價格上漲而買進，漲了獲利、跌了虧損。現貨買幣就是最單純的做多。' });
  CRY.GLOSSARY.push({ term: '做空', en: 'Short', cat: 'trade', def: '看壞價格而先借幣賣出、日後低價買回還清，賺取中間價差。價格若不跌反漲，理論上虧損沒有上限，風險比做多更高。' });
  CRY.GLOSSARY.push({ term: '市價單', en: 'Market Order', cat: 'trade', def: '不指定價格、以當下市場最好的價格立刻成交。優點是快，缺點是行情劇烈或流動性差時，成交價可能比預期差很多。' });
  CRY.GLOSSARY.push({ term: '限價單', en: 'Limit Order', cat: 'trade', def: '自己指定價格掛單，到價才成交。像跟老闆說「降到 100 元我才買」，價格有保障，但不保證買得到。' });
  CRY.GLOSSARY.push({ term: '停損', en: 'Stop Loss', cat: 'trade', def: '事先設好一個價格，跌到就自動賣出，把虧損控制在可承受範圍。好比進賭場前先決定「最多輸多少就離開」。' });
  CRY.GLOSSARY.push({ term: '掛單簿', en: 'Order Book', cat: 'trade', def: '交易所裡所有還沒成交的買單與賣單清單，依價格排列。買賣雙方報價越密集、數量越多，代表這個市場越容易成交。' });
  CRY.GLOSSARY.push({ term: '交易對', en: 'Trading Pair', cat: 'trade', def: '兩種資產互換的組合，寫成 BTC/USDT 表示用 USDT 買賣比特幣，就像外匯的「美元兌新臺幣」。' });
  CRY.GLOSSARY.push({ term: '市值', en: 'Market Cap', cat: 'trade', def: '幣價乘以流通中的數量，用來比較各幣種的規模。單價便宜不代表「便宜」，要看市值才知道整體估值高低。', eg: '單價 1 元、發行 1 兆枚的幣，市值比單價 1 萬元、發行 100 萬枚的幣大得多。' });
  CRY.GLOSSARY.push({ term: 'FDV', en: 'Fully Diluted Valuation', cat: 'trade', def: '完全稀釋估值。假設所有代幣（含尚未解鎖的）都已流通，用現價算出的總價值。若遠高於市值，代表未來還有大量代幣會解鎖，可能帶來賣壓。' });
  CRY.GLOSSARY.push({ term: '流動性', en: 'Liquidity', cat: 'trade', def: '資產能多快、多容易以合理價格買賣的程度。流動性好像熱鬧的傳統市場，隨時有人接手；流動性差的幣，想賣時可能找不到買家。' });
  CRY.GLOSSARY.push({ term: 'K線', en: 'Candlestick Chart', cat: 'trade', def: '用一根根「蠟燭」呈現一段時間內開盤、收盤、最高、最低四個價格的圖表。它記錄的是過去，無法保證預測未來走勢。' });
  CRY.GLOSSARY.push({ term: '牛市', en: 'Bull Market', cat: 'trade', def: '市場長時間整體上漲、氣氛樂觀的時期，取自公牛用角往上頂。此時最容易因過度樂觀而追高、開高槓桿。' });
  CRY.GLOSSARY.push({ term: '熊市', en: 'Bear Market', cat: 'trade', def: '市場長時間整體下跌、氣氛悲觀的時期，取自熊用掌往下拍。加密貨幣在熊市中從高點下跌超過七成並不罕見。' });
  CRY.GLOSSARY.push({ term: '定期定額', en: 'DCA', cat: 'trade', def: '每隔固定時間投入固定金額，不猜高低點，藉此分散買進成本。可以降低擇時壓力，但標的若長期下跌，一樣會虧損。' });
  CRY.GLOSSARY.push({ term: '部位控管', en: 'Position Sizing', cat: 'trade', def: '決定每一筆投資最多投入多少資金的紀律，像出門只帶固定金額的零用錢。單一標的不押太重，判斷錯誤時才不會傷到根本。' });
  CRY.GLOSSARY.push({ term: '場外交易', en: 'OTC', cat: 'trade', def: '不透過交易所公開掛單，由買賣雙方私下議價成交，常見於大額交易。對象若不是合規業者，容易遇到詐騙或收到來源有問題的資金。' });
  CRY.GLOSSARY.push({ term: '恐懼貪婪指數', en: 'Fear & Greed Index', cat: 'trade', def: '把波動、成交量、社群熱度等資料綜合成 0 到 100 的分數，數字越低代表市場越恐懼、越高越貪婪。只是情緒溫度計，不能預測漲跌。' });
  CRY.GLOSSARY.push({ term: '現貨 ETF', en: 'Spot ETF', cat: 'trade', def: '在證券交易所掛牌、由發行商實際買進並保管加密貨幣的基金，用證券戶就能間接投資。美國於 2024 年 1 月核准首批比特幣現貨 ETF。價格仍隨幣價波動，並須支付管理費。' });
  CRY.GLOSSARY.push({ term: '複委託', en: 'Sub-brokerage', cat: 'trade', def: '透過台灣的券商下單買賣海外掛牌的股票或 ETF。部分投資人可用這個管道買海外的加密貨幣 ETF，資格與限制依主管機關規定，另有手續費與匯率成本。' });

  // ── 資安 ──
  CRY.GLOSSARY.push({ term: '冷錢包', en: 'Cold Wallet', cat: 'sec', def: '私鑰存放在不連網環境的錢包，像放在家裡的保險箱。駭客難以遠端偷走，適合長期存放；但裝置或助記詞遺失、毀損，資產一樣拿不回來。' });
  CRY.GLOSSARY.push({ term: '熱錢包', en: 'Hot Wallet', cat: 'sec', def: '裝在手機或瀏覽器、隨時連網的錢包，像隨身帶的皮夾。使用方便，但較容易被惡意程式或釣魚網站盯上，建議只放日常小額。', eg: '例：MetaMask。' });
  CRY.GLOSSARY.push({ term: '硬體錢包', en: 'Hardware Wallet', cat: 'sec', def: '專門用來保管私鑰的實體小裝置，是最常見的冷錢包。簽署交易時私鑰不會離開裝置。務必向官方管道購買，避免買到被動過手腳的機器。', eg: '例：Ledger、Trezor。' });
  CRY.GLOSSARY.push({ term: '自我託管', en: 'Self-custody', cat: 'sec', def: '自己保管私鑰，不把幣交給交易所。圈內名言是「不是你的私鑰，就不是你的幣」。自由度最高，但弄丟或外洩都沒有人能幫你救回。' });
  CRY.GLOSSARY.push({ term: '託管', en: 'Custody', cat: 'sec', def: '把資產交給別人代為保管，例如把幣放在交易所。方便、忘記密碼還能找客服，但保管方若倒閉、被駭或挪用，你的資產就可能受損。' });
  CRY.GLOSSARY.push({ term: '授權', en: 'Token Approval', cat: 'sec', def: '允許某個智慧合約動用你錢包裡特定代幣的許可，像把提款卡副卡交給店家。若授權「無限額度」給惡意合約，對方可以直接把該代幣轉光。' });
  CRY.GLOSSARY.push({ term: '撤銷授權', en: 'Revoke', cat: 'sec', def: '把先前給智慧合約的代幣動用許可取消，等於把副卡收回來。定期檢查並撤銷不再使用的授權，是基本的錢包衛生習慣。' });
  CRY.GLOSSARY.push({ term: '釣魚', en: 'Phishing', cat: 'sec', def: '歹徒假冒官方網站、客服或空投活動，誘騙你輸入助記詞或簽下惡意交易。記住：任何人、任何網站向你要助記詞，就是詐騙。' });
  CRY.GLOSSARY.push({ term: '位址投毒', en: 'Address Poisoning', cat: 'sec', def: '歹徒用頭尾幾碼和你常用位址很像的假位址，轉一筆極小額給你，等你日後從交易紀錄複製到假位址而轉錯。轉帳前要完整核對整串位址。' });
  CRY.GLOSSARY.push({ term: '小額測試', en: 'Test Transaction', cat: 'sec', def: '大額轉帳前，先轉一筆很小的金額，確認對方真的收到再轉剩下的。多花一點手續費，換來避免轉錯位址或選錯鏈的保險。' });
  CRY.GLOSSARY.push({ term: '捲款跑路', en: 'Rug Pull', cat: 'sec', def: '專案團隊吸引大家投入資金後，突然抽走流動性池的錢或拋售代幣後消失，幣價瞬間歸零。英文原意是「把你腳下的地毯抽走」。' });
  CRY.GLOSSARY.push({ term: '貔貅盤', en: 'Honeypot', cat: 'sec', def: '合約被動過手腳、只能買不能賣的騙局代幣。因傳說中貔貅只進不出而得名。圖表看起來一路上漲，其實是因為沒有人賣得掉。' });
  CRY.GLOSSARY.push({ term: '龐氏騙局', en: 'Ponzi Scheme', cat: 'sec', def: '拿後面加入者的錢，當成「獲利」發給前面的人，本身並沒有真正的收入來源。一旦新資金跟不上就會崩盤。標榜固定高報酬、拉人頭有獎金是典型警訊。' });
  CRY.GLOSSARY.push({ term: '殺豬盤', en: 'Pig-butchering Scam', cat: 'sec', def: '詐騙集團先在交友軟體或社群上長期培養感情與信任，再引導受害者到假投資平台入金，最後連本帶利領不出來。' });
  CRY.GLOSSARY.push({ term: '兩步驟驗證', en: '2FA', cat: 'sec', def: '又稱雙重驗證。登入時除了密碼，還要再輸入一組一次性驗證碼，等於多上一道鎖。建議使用驗證器 App 或實體金鑰；簡訊驗證碼可能因門號被冒辦而遭攔截。' });
  CRY.GLOSSARY.push({ term: '三明治攻擊', en: 'Sandwich Attack', cat: 'sec', def: '機器人發現你的大額換幣單後，搶在你前面買進墊高價格，等你成交後立刻賣出，把你夾在中間賺價差。把滑價容忍度設低可減少損失。' });
  CRY.GLOSSARY.push({ term: '女巫攻擊', en: 'Sybil Attack', cat: 'sec', def: '一個人假造大量身分或錢包，假裝成很多人，藉此灌票、影響網路或多領空投，像一人申請幾百個帳號重複領贈品。' });
  CRY.GLOSSARY.push({ term: '審計', en: 'Smart Contract Audit', cat: 'sec', def: '請第三方資安公司檢查智慧合約程式碼有沒有漏洞，類似建築物的結構安全檢查。有審計比沒有好，但不代表絕對安全，審計過的協議也曾被駭。' });
  CRY.GLOSSARY.push({ term: '儲備證明', en: 'Proof of Reserves', cat: 'sec', def: '交易所公開鏈上錢包與密碼學證明，讓外界核對它是否真的持有足額的客戶資產。2022 年 FTX 倒閉後開始普及，但通常看不到平台的全部負債。' });

  // ── 幣圈文化用語 ──
  CRY.GLOSSARY.push({ term: 'HODL', en: 'Hold On for Dear Life', cat: 'culture', def: '長期持有、不論漲跌都不賣的意思。源自 2013 年比特幣論壇上一位網友把 hold 打錯成 hodl 的貼文，後來才被附會成「死命抱住」的縮寫。' });
  CRY.GLOSSARY.push({ term: 'FOMO', en: 'Fear of Missing Out', cat: 'culture', def: '錯失恐懼。看到別人賺錢、怕自己沒跟上而衝動買進的心態。價格漲最兇、大家最興奮的時候，往往也是追高風險最大的時候。' });
  CRY.GLOSSARY.push({ term: 'FUD', en: 'Fear, Uncertainty, Doubt', cat: 'culture', def: '恐懼、不確定、懷疑。指讓市場恐慌的負面消息或謠言，有時是真風險，有時是刻意散布。重點是回頭查證來源，而不是跟著情緒走。' });
  CRY.GLOSSARY.push({ term: 'DYOR', en: 'Do Your Own Research', cat: 'culture', def: '自己做功課。提醒大家不要只聽別人說，要自己查證團隊、代幣分配與風險。不過它也常被喊單的人拿來當免責聲明。' });
  CRY.GLOSSARY.push({ term: '韭菜', en: 'Retail Bag Holder', cat: 'culture', def: '指經驗不足、容易追高殺低而賠錢的散戶。因為韭菜割了還會再長，比喻一批批新手不斷進場被「收割」。被割就叫「割韭菜」。' });
  CRY.GLOSSARY.push({ term: '巨鯨', en: 'Whale', cat: 'culture', def: '持有大量加密貨幣的個人或機構。就像鯨魚一翻身就掀起大浪，他們的大額買賣足以影響價格，鏈上動向常被市場追蹤。' });
  CRY.GLOSSARY.push({ term: '鑽石手', en: 'Diamond Hands', cat: 'culture', def: '形容不管價格怎麼暴跌都堅持不賣的人，手像鑽石一樣硬。反義詞是一跌就賣的「紙手」。但死抱一個基本面出問題的幣，同樣可能血本無歸。' });
  CRY.GLOSSARY.push({ term: '抄底', en: 'Buy the Dip', cat: 'culture', def: '趁價格大跌時買進，期待之後反彈。問題是沒有人知道底在哪裡，圈內常自嘲「抄底抄在半山腰」。' });
  CRY.GLOSSARY.push({ term: '追高殺低', en: 'Buy High, Sell Low', cat: 'culture', def: '看到大漲才急著買進、看到大跌又恐慌賣出，結果買在高點、賣在低點。這是被情緒牽著走的典型虧損模式。' });
  CRY.GLOSSARY.push({ term: 'All in', en: 'All In (Show Hand)', cat: 'culture', def: '幣圈用語，俗稱「梭哈」，指把全部資金一次押在單一標的上，源自撲克牌的「全押」。這是風險極高的賭博式做法，一次判斷錯誤就可能賠光所有本金。' });
  CRY.GLOSSARY.push({ term: '擼毛', en: 'Airdrop Farming', cat: 'culture', def: '為了領空投而刻意大量使用新專案的行為，取「薅羊毛」之意。要付出手續費與時間，最後不一定領得到，也容易誤觸釣魚網站。' });
  CRY.GLOSSARY.push({ term: '喊單', en: 'Shilling', cat: 'culture', def: '網紅或社群裡的人公開鼓吹大家買某個幣。喊的人可能早已買好、甚至收了專案的錢，等你進場他就出場。看到喊單，先問對方有什麼利益。' });
  CRY.GLOSSARY.push({ term: '敘事', en: 'Narrative', cat: 'culture', def: '市場上一段時間內大家熱烈談論的題材或故事，例如某類新技術或新應用。敘事能帶動資金與話題，但熱度退去時，價格也常跟著回落。' });

  // ── 法規 ──
  CRY.GLOSSARY.push({ term: '實名驗證', en: 'KYC', cat: 'reg', def: '認識你的客戶。交易所開戶時要求上傳證件、自拍來確認身分，和去銀行開戶要帶雙證件是同樣道理，目的是防止人頭帳戶與犯罪。' });
  CRY.GLOSSARY.push({ term: '洗錢防制', en: 'AML', cat: 'reg', def: '洗錢防制。防止犯罪所得被「洗」成看似合法資金的一整套規定，包含身分驗證、監控可疑交易並向主管機關申報。' });
  CRY.GLOSSARY.push({ term: 'VASP', en: 'Virtual Asset Service Provider', cat: 'reg', def: '虛擬資產服務提供者。交易所、代買代賣的幣商、保管業者等的法規統稱。在台灣必須依法向金管會完成洗錢防制登記才能營業。' });
  CRY.GLOSSARY.push({ term: 'FATF', en: 'Financial Action Task Force', cat: 'reg', def: '防制洗錢金融行動工作組織。1989 年成立的跨國組織，負責訂定全球洗錢防制標準並評鑑各國，各國的加密貨幣洗錢防制規定多以它的建議為藍本。' });
  CRY.GLOSSARY.push({ term: '轉帳規則', en: 'Travel Rule', cat: 'reg', def: 'FATF 在 2019 年要求適用於虛擬資產的規定：業者之間轉帳時，匯款人與收款人的身分資料要跟著交易一起傳遞，像匯款單上必須填寫雙方姓名。' });
  CRY.GLOSSARY.push({ term: 'MiCA', en: 'Markets in Crypto-Assets', cat: 'reg', def: '歐盟的加密資產市場規範，是全球第一部大型經濟體的完整加密貨幣法規。穩定幣相關規定自 2024 年 6 月底適用，服務商規定自 2024 年 12 月底適用。' });
  CRY.GLOSSARY.push({ term: 'GENIUS法案', en: 'GENIUS Act', cat: 'reg', def: '美國於 2025 年 7 月簽署生效的聯邦穩定幣法律，要求支付型穩定幣發行商持有一比一的高流動性準備資產，並定期公開揭露。' });
  CRY.GLOSSARY.push({ term: '虛擬資產服務法', en: 'Taiwan Virtual Assets Service Act', cat: 'reg', def: '台灣管理虛擬資產業者的專法，立法院於 2026 年三讀通過。業者將由洗錢防制登記制改為須取得金管會許可，並納入穩定幣發行管理；施行日期由行政院另定。' });
  CRY.GLOSSARY.push({ term: '豪威測試', en: 'Howey Test', cat: 'reg', def: '美國用來判斷一項商品算不算「證券」的標準，源自 1946 年最高法院判例：投入資金、參與共同事業、期待靠他人努力獲利。代幣若符合，就要受證券法規範。' });
  CRY.GLOSSARY.push({ term: '資產分離保管', en: 'Asset Segregation', cat: 'reg', def: '規定業者必須把客戶的資產和公司自己的錢分開存放，不得挪用。就像房仲代收的訂金不能拿去付公司房租，業者出事時客戶資產才有保障。' });
  CRY.GLOSSARY.push({ term: '保管機構', en: 'Custodian', cat: 'reg', def: '專門替客戶保管資產的受監管機構，像銀行保管箱的角色。ETF 發行商與大型機構多半把加密貨幣交給這類業者存放，仍須留意其資安與財務狀況。' });
})();

</script>
  <script>
(function () {
  'use strict';
  var CRY = (window.CRY = window.CRY || {});
  CRY.GLOSSARY = CRY.GLOSSARY || [];

  // ── 基礎與密碼學 ──
  CRY.GLOSSARY.push({ term: '不可竄改', en: 'Immutability', cat: 'tech', def: '資料一旦寫進區塊鏈並經過足夠確認，就幾乎無法偷偷修改。因為每個區塊都記著前一塊的雜湊值，改動任何一筆，後面整串都會對不上，其他節點也不會接受。' });
  CRY.GLOSSARY.push({ term: '雜湊值', en: 'Hash Value', cat: 'tech', def: '把任意資料丟進雜湊函數後得到的一串固定長度代號，像資料的指紋。內容只要有一點不同，指紋就完全不同，而且無法從指紋反推原本的內容。' });
  CRY.GLOSSARY.push({ term: 'SHA-256', en: 'Secure Hash Algorithm 256-bit', cat: 'tech', def: '比特幣採用的雜湊演算法。不論輸入多長，輸出都是固定 256 位元的結果，常寫成 64 個十六進位字元。挖礦與區塊之間的串接都靠它。' });
  CRY.GLOSSARY.push({ term: '雪崩效應', en: 'Avalanche Effect', cat: 'tech', def: '雜湊函數的特性：輸入只改動一個字，輸出就變得面目全非，看不出任何相似之處。因此只要比對雜湊值，就能發現資料有沒有被動過手腳。' });
  CRY.GLOSSARY.push({ term: 'Merkle 樹', en: 'Merkle Tree', cat: 'tech', def: '把區塊內所有交易兩兩雜湊、一層層往上合併的樹狀結構，像賽程表一路比到冠軍。只要提供少數幾個雜湊值，就能證明某筆交易確實在區塊裡。' });
  CRY.GLOSSARY.push({ term: 'Merkle 根', en: 'Merkle Root', cat: 'tech', def: 'Merkle 樹最頂端的那一個雜湊值，等於整個區塊所有交易的總指紋，寫在區塊標頭裡。任何一筆交易被改動，Merkle 根就會跟著改變。' });
  CRY.GLOSSARY.push({ term: '非對稱式密碼學', en: 'Asymmetric Cryptography', cat: 'tech', def: '使用一對金鑰的密碼技術：私鑰自己保管、用來簽章，公鑰可以公開、讓別人驗證。好比只有你有印章，但人人都能核對印鑑，這是錢包運作的基礎。' });
  CRY.GLOSSARY.push({ term: '簽署', en: 'Signing', cat: 'tech', def: '用私鑰替一筆交易或訊息產生數位簽章的動作，等於親手蓋章表示「我同意」。錢包跳出簽署視窗時，務必先看清楚內容再按確認。' });
  CRY.GLOSSARY.push({ term: '位址', en: 'Address', cat: 'tech', def: '收款用的一串英數字，由公鑰推算而來，像銀行帳號，可以公開給別人，與「地址」同義。不同的鏈格式不同，轉帳前要逐字核對。', eg: '例：比特幣位址常以 bc1 開頭，以太坊位址以 0x 開頭。' });
  CRY.GLOSSARY.push({ term: '備份', en: 'Backup', cat: 'sec', def: '把助記詞或私鑰另外保存一份，以防手機遺失或裝置損壞。建議抄在紙上或刻在金屬板、分開存放，不要截圖、拍照，也不要存在雲端或通訊軟體裡。' });
  CRY.GLOSSARY.push({ term: 'P2P 網路', en: 'Peer-to-Peer Network', cat: 'tech', def: '點對點網路。沒有中央伺服器，每台電腦（節點）直接彼此連線、互相轉傳交易與區塊，像同學之間互傳紙條。少數節點離線，整個網路仍能運作。' });
  CRY.GLOSSARY.push({ term: '白皮書', en: 'White Paper', cat: 'culture', def: '專案團隊說明構想、技術設計與代幣分配的公開文件。它是了解專案的起點，但內容由團隊自己撰寫，寫得漂亮不代表做得到，仍要自行查證。', eg: '例：中本聰在 2008 年 10 月發表比特幣白皮書。' });
  CRY.GLOSSARY.push({ term: '中本聰', en: 'Satoshi Nakamoto', cat: 'culture', def: '比特幣發明者使用的化名。2008 年 10 月發表白皮書，2009 年 1 月挖出創世區塊，之後逐漸淡出社群。真實身分至今不明，可能是一個人，也可能是一組人。' });
  CRY.GLOSSARY.push({ term: '確認', en: 'Confirmation', cat: 'tech', def: '交易被打包進區塊，就算得到一次確認；之後每多接上一個新區塊，確認數就加一。確認越多，交易被推翻的機率越低，所以大額款項通常會多等幾個確認。' });
  CRY.GLOSSARY.push({ term: '手續費', en: 'Transaction Fee', cat: 'tech', def: '在鏈上送出交易時付給礦工或驗證者的費用，用來補償打包成本，也能避免有人亂塞垃圾交易。網路越壅塞費用越高。交易所另外收取的買賣與提領費用也叫手續費。' });
  CRY.GLOSSARY.push({ term: '私有鏈', en: 'Private Blockchain', cat: 'tech', def: '由單一機構掌控、只有獲准者才能讀寫的區塊鏈，像公司內部的共用帳本。速度快、好管理，但也因此少了公有鏈人人可驗證的開放性。' });
  CRY.GLOSSARY.push({ term: '聯盟鏈', en: 'Consortium Blockchain', cat: 'tech', def: '由多家機構共同維護的區塊鏈，只有成員可以記帳，身分彼此已知。常用於銀行同業對帳或供應鏈追蹤，開放程度介於公有鏈與私有鏈之間。' });

  // ── 比特幣 ──
  CRY.GLOSSARY.push({ term: '最大供給', en: 'Max Supply', cat: 'coin', def: '規則寫定、一枚幣最多能存在的數量上限，與「最大供給量」同義。有些幣沒有上限，可以持續增發，評估時要一併留意。', eg: '例：比特幣的最大供給是 2,100 萬枚。' });
  CRY.GLOSSARY.push({ term: '貨幣政策', en: 'Monetary Policy', cat: 'coin', def: '決定貨幣發多少、怎麼發的規則。法幣由中央銀行視經濟情況調整；比特幣則把發行時程寫進程式，約每四年減半一次，不由任何機構臨時決定。' });
  CRY.GLOSSARY.push({ term: '通膨', en: 'Inflation', cat: 'coin', def: '通貨膨脹的簡稱，指貨幣變多、同樣的錢能買到的東西變少。套用在代幣上，則是指新幣持續增發，讓原有持有人手上的占比被稀釋。' });
  CRY.GLOSSARY.push({ term: '數位黃金', en: 'Digital Gold', cat: 'culture', def: '形容比特幣的常見說法：總量有限、不由單一國家控制，因此被部分人拿來當成類似黃金的保值工具。但它的價格波動遠大於黃金，這個比喻尚有爭議。' });
  CRY.GLOSSARY.push({ term: '帳戶模型', en: 'Account Model', cat: 'tech', def: '以太坊等鏈採用的記帳方式：每個位址直接記錄一個餘額，轉帳就是一邊扣、一邊加，像銀行存摺。與比特幣一張張「零錢」的 UTXO 模型不同。' });
  CRY.GLOSSARY.push({ term: '找零', en: 'Change Output', cat: 'tech', def: '比特幣的 UTXO 像一張張鈔票，花用時必須整張用掉。付款後多出來的部分，會由錢包自動送回自己的位址，就像拿千元鈔買東西，店員找你零錢。' });
  CRY.GLOSSARY.push({ term: 'ASIC', en: 'Application-Specific Integrated Circuit', cat: 'tech', def: '特殊應用積體電路。只為單一種運算設計的晶片，用在挖礦時，效率遠高於一般電腦或顯示卡，是目前比特幣挖礦的主流設備，俗稱礦機。' });
  CRY.GLOSSARY.push({ term: '礦池', en: 'Mining Pool', cat: 'tech', def: '許多礦工把算力集合起來一起挖礦、再依貢獻分配獎勵的組織，像同事合資買彩券，中獎機會更穩定。少數大礦池算力過度集中，則是去中心化的隱憂。' });
  CRY.GLOSSARY.push({ term: '難度調整', en: 'Difficulty Adjustment', cat: 'tech', def: '網路自動調整挖礦難易度的機制。比特幣每 2,016 個區塊（約兩週）檢查一次：算力變多就調難、變少就調易，讓平均出塊時間維持在約 10 分鐘。' });
  CRY.GLOSSARY.push({ term: '隔離見證', en: 'Segregated Witness (SegWit)', cat: 'tech', def: '比特幣在 2017 年啟用的升級。把簽章（見證）資料和交易主體分開計算，讓區塊能容納更多交易，也修正了交易延展性問題，為閃電網路鋪路。' });
  CRY.GLOSSARY.push({ term: 'Taproot', en: 'Taproot', cat: 'tech', def: '比特幣在 2021 年 11 月啟用的升級，引進 Schnorr 簽章。它讓多人共管等複雜交易在鏈上看起來和普通轉帳幾乎一樣，更省空間，也更有隱私。', eg: '例：以 bc1p 開頭的位址就是 Taproot 格式。' });
  CRY.GLOSSARY.push({ term: 'Schnorr 簽章', en: 'Schnorr Signature', cat: 'tech', def: '隨 Taproot 升級引進比特幣的一種數位簽章。特色是能把多把金鑰的簽章合併成一個，多人共管的交易因此更省空間，外人也較難看出背後有幾個人。' });
  CRY.GLOSSARY.push({ term: 'RBF', en: 'Replace-By-Fee', cat: 'tech', def: '手續費替換。交易還沒被打包前，用一筆手續費更高的新交易取代原本那筆，藉此加快確認。也因此，尚未確認的交易不能當作已經收到款項。' });
  CRY.GLOSSARY.push({ term: '第二層', en: 'Layer 2', cat: 'tech', def: '蓋在主鏈之上的擴容方案，與 Layer 2 同義。把大量交易移到上層處理，只把結果交回主鏈，像高速公路上方加蓋的高架道路，藉此加快速度、降低費用。', eg: '例：比特幣的閃電網路、以太坊的各種 Rollup。' });
  CRY.GLOSSARY.push({ term: '支付通道', en: 'Payment Channel', cat: 'tech', def: '閃電網路的基本單位。兩人先在鏈上鎖一筆錢「開通道」，之後彼此的付款只在鏈下更新餘額，像在店裡記帳，最後關閉通道時才把結果一次寫回鏈上。' });
  CRY.GLOSSARY.push({ term: '路由', en: 'Routing', cat: 'tech', def: '在閃電網路中，付款經由幾個彼此相連的中間節點接力送到對方手上，不必和每個人都直接開通道，像搭飛機轉機。中間節點可以收取少量費用。' });

  // ── 以太坊 ──
  CRY.GLOSSARY.push({ term: '以太坊', en: 'Ethereum', cat: 'tech', def: '由 Vitalik Buterin 等人提出、2015 年 7 月上線的區塊鏈。除了轉帳，還能執行智慧合約，像一台全世界共用的電腦。原生幣是以太幣，用來支付手續費。' });
  CRY.GLOSSARY.push({ term: '外部帳戶', en: 'Externally Owned Account (EOA)', cat: 'tech', def: '由私鑰控制的以太坊帳戶，簡稱 EOA，也就是一般人用錢包建立的帳戶。它可以主動發起交易，但私鑰或助記詞遺失，就沒有人能幫忙救回。' });
  CRY.GLOSSARY.push({ term: '合約帳戶', en: 'Contract Account', cat: 'tech', def: '由智慧合約程式碼控制的以太坊帳戶，沒有私鑰。它不會自己主動發起交易，而是被呼叫時，依照寫好的規則自動執行。' });
  CRY.GLOSSARY.push({ term: 'nonce', en: 'Nonce', cat: 'tech', def: '只使用一次的數字。在以太坊，它是帳戶的交易序號，確保交易依序處理、不被重複執行；在比特幣挖礦，它是礦工不斷更換、用來試出合格雜湊值的那個數字。' });
  CRY.GLOSSARY.push({ term: '交易序號', en: 'Transaction Nonce', cat: 'tech', def: '以太坊帳戶每送出一筆交易就加一的流水號，也就是 nonce。網路依序號逐筆處理，同一個序號只會成立一次，藉此防止同一筆交易被重複執行。', eg: '例：序號 5 的交易卡住時，序號 6 之後的交易也會跟著排隊。' });
  CRY.GLOSSARY.push({ term: 'EIP-1559', en: 'Ethereum Improvement Proposal 1559', cat: 'tech', def: '以太坊在 2021 年 8 月倫敦升級啟用的手續費改革。把費用拆成隨壅塞程度自動調整、並且會被銷毀的「基本費」，以及給驗證者的「小費」，讓費用更容易預估。' });
  CRY.GLOSSARY.push({ term: '基本費', en: 'Base Fee', cat: 'tech', def: 'EIP-1559 規定每筆以太坊交易至少要付的單位費用。由協定依上一個區塊的壅塞程度自動調高或調低，而且收到後直接銷毀，不會進到驗證者口袋。' });
  CRY.GLOSSARY.push({ term: 'The Merge', en: 'The Merge', cat: 'tech', def: '合併升級。2022 年 9 月，以太坊把共識機制從工作量證明換成權益證明，不再需要礦工挖礦，改由質押以太幣的驗證者出塊，耗電量因此大幅下降。' });
  CRY.GLOSSARY.push({ term: '可擴展性', en: 'Scalability', cat: 'tech', def: '區塊鏈在使用者變多時，還能維持速度快、手續費低的能力，也常稱為「擴容」。提高可擴展性的做法，包括加大區塊、分片，以及把交易移到第二層處理。' });
  CRY.GLOSSARY.push({ term: '三難困境', en: 'Trilemma', cat: 'tech', def: '指區塊鏈很難同時把去中心化、安全、可擴展性三件事都做到最好，通常得犧牲其中一項，與「區塊鏈三難困境」同義。觀察一條鏈時，可以問它選擇犧牲了哪一邊。' });
  CRY.GLOSSARY.push({ term: '區塊鏈三難', en: 'Blockchain Trilemma', cat: 'tech', def: '「區塊鏈三難困境」的簡稱：去中心化、安全、可擴展性三者難以兼得。就像找房子想要便宜、寬敞又在市中心，通常只能滿足其中兩項。' });
  CRY.GLOSSARY.push({ term: '不可能三角', en: 'Impossible Triangle', cat: 'tech', def: '業界對區塊鏈三難困境的另一種說法：去中心化、安全、效能三個角很難同時顧到。各條鏈依自己的定位做出不同取捨，沒有絕對的好壞。' });
})();

</script>
  <script>
(function () {
  'use strict';
  var CRY = (window.CRY = window.CRY || {});
  CRY.GLOSSARY = CRY.GLOSSARY || [];

  // ── 以太坊擴容與標準 ──
  CRY.GLOSSARY.push({ term: 'ZK Rollup', en: 'Zero-Knowledge Rollup', cat: 'tech', def: 'Rollup 的一種路線。在第二層處理大量交易後，向主網提交一份零知識證明，用數學證明這批交易都算對了，主網驗證通過就定案，不必等待挑戰期。', eg: '例：zkSync、Starknet、Linea。' });
  CRY.GLOSSARY.push({ term: '排序器', en: 'Sequencer', cat: 'tech', def: 'Layer 2 上負責接收交易、決定先後順序並打包交回主網的角色。目前多數由單一團隊營運，一旦當機，交易可能暫時停擺，是使用 Layer 2 要留意的集中化風險。' });
  CRY.GLOSSARY.push({ term: 'Blob', en: 'Binary Large Object', cat: 'tech', def: 'EIP-4844 新增的一種資料空間，專門給 Layer 2 存放交易資料。它獨立計費，而且只保留一段時間就會被節點清除，因此比寫進一般交易欄位便宜許多。' });
  CRY.GLOSSARY.push({ term: 'EIP-4844', en: 'Proto-Danksharding', cat: 'tech', def: '以太坊在 2024 年 3 月 Dencun 升級啟用的提案，又稱 Proto-Danksharding。它引進 Blob 資料空間，讓 Layer 2 把資料交回主網的成本大幅下降。' });
  CRY.GLOSSARY.push({ term: '帳戶抽象', en: 'Account Abstraction', cat: 'tech', def: '讓錢包像智慧合約一樣可以自訂規則的技術方向，例如用其他代幣付手續費、設定每日限額、遺失時由親友協助復原，目標是讓錢包用起來更接近一般應用程式。' });
  CRY.GLOSSARY.push({ term: 'ERC-4337', en: 'ERC-4337', cat: 'tech', def: '2023 年 3 月上線的帳戶抽象標準。不必修改以太坊底層，就能讓智慧合約錢包運作：使用者送出「操作請求」，由專門的打包者代為送上鏈。' });
  CRY.GLOSSARY.push({ term: 'EIP-7702', en: 'EIP-7702', cat: 'tech', def: '2025 年 5 月隨 Pectra 升級啟用的提案。讓既有的一般錢包也能把操作委派給一段合約程式碼，藉此獲得批次交易、代付手續費等功能；委派對象若有惡意，資產也可能被轉走。' });
  CRY.GLOSSARY.push({ term: '同質化代幣', en: 'Fungible Token', cat: 'coin', def: '每一枚都相同、可以互相替換的代幣，就像兩張百元鈔價值一樣、換來換去沒有差別。以太坊上最常見的標準是 ERC-20，與每個都獨一無二的 NFT 相對。' });
  CRY.GLOSSARY.push({ term: 'ERC-721', en: 'ERC-721', cat: 'coin', def: '以太坊上最常見的 NFT 標準。每個代幣都有獨一無二的編號，彼此不能互換，適合用來代表收藏品、門票或憑證這類「每個都不一樣」的東西。' });
  CRY.GLOSSARY.push({ term: 'ERC-1155', en: 'ERC-1155', cat: 'coin', def: '以太坊的多重代幣標準。同一份合約可以同時管理多種代幣，同質化與非同質化都行，還能一次批次轉移，常用在遊戲道具，比逐一發行更省手續費。' });
  CRY.GLOSSARY.push({ term: 'DAO', en: 'Decentralized Autonomous Organization', cat: 'defi', def: '去中心化自治組織。規則寫在智慧合約裡，重大決定由治理代幣的持有人投票，像一間沒有董事長的線上合作社。實務上投票權常集中在少數大戶手中。' });

  // ── 共識機制 ──
  CRY.GLOSSARY.push({ term: '拜占庭將軍問題', en: 'Byzantine Generals Problem', cat: 'tech', def: '1982 年提出的經典難題：幾位將軍只能靠信差聯絡，其中可能有叛徒傳假消息，要怎麼讓忠誠的將軍達成一致行動？區塊鏈的共識機制就是在解這個問題。' });
  CRY.GLOSSARY.push({ term: '拜占庭容錯', en: 'Byzantine Fault Tolerance (BFT)', cat: 'tech', def: '系統在部分成員故障甚至故意說謊的情況下，仍能達成正確共識的能力，簡稱 BFT。典型的設計可以容忍不到三分之一的節點作惡。' });
  CRY.GLOSSARY.push({ term: '質押', en: 'Staking', cat: 'tech', def: '在權益證明的鏈上，把幣鎖進網路當作押金，換取參與驗證並領取獎勵的資格。風險包括幣價下跌、解除質押要等待，以及驗證者違規時押金被罰沒。' });
  CRY.GLOSSARY.push({ term: '罰沒', en: 'Slashing', cat: 'tech', def: '權益證明的懲罰機制。驗證者若做出惡意行為，例如在同一位置簽出兩個互相矛盾的區塊，會被沒收部分押金並強制退出，讓作惡的代價高於好處。' });
  CRY.GLOSSARY.push({ term: '委託權益證明', en: 'Delegated Proof of Stake (DPoS)', cat: 'tech', def: '簡稱 DPoS。持幣人用手上的幣投票，選出少數代表輪流出塊，像選民代表開會。優點是速度快，代價是出塊權集中在少數節點手上。', eg: '例：EOS 由 21 個出塊節點輪流記帳。' });
  CRY.GLOSSARY.push({ term: '歷史證明', en: 'Proof of History (PoH)', cat: 'tech', def: 'Solana 採用的設計，簡稱 PoH。它像一個密碼學時鐘，用連續不斷的雜湊運算證明事件發生的先後順序，再搭配權益證明的投票來定案，本身不算獨立的共識機制。' });
  CRY.GLOSSARY.push({ term: '區塊重組', en: 'Chain Reorganization (Reorg)', cat: 'tech', def: '節點發現另一條更長（累積工作量更多）的鏈時，改用新鏈、捨棄原本最末幾個區塊的情況。被捨棄區塊裡的交易可能失效，這也是大額交易要多等幾個確認的原因。' });
  CRY.GLOSSARY.push({ term: '能耗', en: 'Energy Consumption', cat: 'tech', def: '指區塊鏈運作消耗的電力。工作量證明靠大量運算競爭記帳權，耗電可觀，是比特幣常被批評之處；權益證明不需要挖礦，耗電低得多。電力來源與實際影響尚有爭議。' });

  // ── DeFi 與代幣 ──
  CRY.GLOSSARY.push({ term: '去中心化交易所', en: 'Decentralized Exchange (DEX)', cat: 'defi', def: '簡稱 DEX。不必註冊帳號，直接用自己的錢包透過智慧合約換幣，資產全程由自己保管。沒有客服，換錯幣或遇到假代幣都得自行承擔。' });
  CRY.GLOSSARY.push({ term: 'LP 代幣', en: 'LP Token', cat: 'defi', def: '把幣存進資金池後拿到的憑證代幣，代表你在池子裡占的份額，像寄物櫃的號碼牌。之後憑它領回本金與分到的手續費，弄丟或被盜就等於失去這份資產。' });
  CRY.GLOSSARY.push({ term: '健康係數', en: 'Health Factor', cat: 'defi', def: '借貸協議用來表示部位安全程度的數字，大致是抵押品價值（打折後）除以借款價值。數字越高越安全，越接近 1 越危險，低於 1 就可能被清算。' });
  CRY.GLOSSARY.push({ term: '準備金', en: 'Reserves', cat: 'defi', def: '穩定幣發行商為了讓使用者隨時能換回法幣而持有的資產，常見的有現金與美國短期公債。準備金的品質與透明度，直接決定穩定幣能不能守住一比一的價格。' });
  CRY.GLOSSARY.push({ term: '十足準備', en: 'Full Reserve Backing', cat: 'reg', def: '發行多少穩定幣，就必須持有等值的高流動性資產作為準備，例如現金或短期公債，不能只準備一部分。這是各國穩定幣立法的共同核心要求。' });
  CRY.GLOSSARY.push({ term: '凍結', en: 'Freeze', cat: 'sec', def: '讓資產暫時無法動用。交易所可依執法機關要求凍結帳戶；USDT、USDC 等穩定幣的發行商也能把特定位址列入黑名單。自己保管的比特幣，則沒有人能代為凍結。' });
  CRY.GLOSSARY.push({ term: '代幣化', en: 'Tokenization', cat: 'defi', def: '把現實世界的資產或權利，例如國庫券、基金份額、不動產，做成區塊鏈上的代幣，方便分割與移轉。代幣背後是否真有資產、法律上能否主張權利，是評估重點。' });
  CRY.GLOSSARY.push({ term: '混幣器', en: 'Mixer', cat: 'sec', def: '把許多人的幣倒進同一個池子攪拌後再各自領回的服務，用來切斷資金來源與去向的關聯。它能保護隱私，但也常被駭客用來洗錢，在多國受到嚴格監管。', eg: '例：Tornado Cash 在 2022 年曾遭美國財政部制裁。' });
  CRY.GLOSSARY.push({ term: 'GameFi', en: 'Game Finance', cat: 'culture', def: '遊戲加上金融，指把代幣與 NFT 放進遊戲、號稱「邊玩邊賺」的模式。獎勵多半來自新玩家投入的資金，一旦新玩家變少，代幣價格與收益可能快速下滑。', eg: '例：2021 年爆紅、之後大幅降溫的 Axie Infinity。' });
  CRY.GLOSSARY.push({ term: '元宇宙', en: 'Metaverse', cat: 'culture', def: '泛指可以社交、遊戲、交易的線上虛擬世界。2021 年前後成為熱門題材，部分專案把虛擬土地做成 NFT 販售，熱潮退去後價格大幅回落，是題材炒作的典型案例。' });

  // ── 市場與鏈上資料 ──
  CRY.GLOSSARY.push({ term: '流通量', en: 'Circulating Supply', cat: 'trade', def: '目前已經發行、而且能在市場上自由買賣的代幣數量，與「流通供給量」同義。市值就是用單價乘以流通量算出來的，尚未解鎖的代幣不計入。' });
  CRY.GLOSSARY.push({ term: '解鎖', en: 'Token Unlock', cat: 'coin', def: '原本被鎖住、不能賣的代幣（多屬團隊與早期投資人），依預定時程開放轉移。解鎖會讓市場上可賣的數量增加，可能帶來賣壓，買進前應先查解鎖時程。' });
  CRY.GLOSSARY.push({ term: '鏈上數據', en: 'On-chain Data', cat: 'trade', def: '直接從區塊鏈公開紀錄整理出來的資料，例如活躍位址數、交易筆數、交易所的流入與流出量。任何人都能查證，但只能當作參考，無法用來準確預測價格。' });
  CRY.GLOSSARY.push({ term: '活躍位址', en: 'Active Addresses', cat: 'trade', def: '一段時間內有收款或付款紀錄的位址數量，用來觀察網路的使用熱度。要注意一個人可以擁有很多位址，交易所也會代替大量使用者收發，所以不等於真實人數。' });
  CRY.GLOSSARY.push({ term: '投機', en: 'Speculation', cat: 'trade', def: '主要著眼於短期價格漲跌而買賣，而不是看重資產本身的用途或長期價值。加密市場的投機氣氛濃厚，價格容易暴漲暴跌，投入前要先想好自己能承受多少損失。' });

  // ── 轉帳與資安 ──
  CRY.GLOSSARY.push({ term: '鏈別', en: 'Network', cat: 'sec', def: '指轉帳要走哪一條區塊鏈網路。同一種幣可能同時存在多條鏈上，出金與收款兩邊選的網路必須完全相同，選錯了資產可能無法入帳，甚至難以找回。', eg: '例：USDT 在以太坊、波場等多條鏈上都有發行。' });
  CRY.GLOSSARY.push({ term: 'Memo', en: 'Memo / Tag', cat: 'sec', def: '轉帳時附帶的備註碼，有些幣稱為 Tag。交易所常讓許多使用者共用同一個收款位址，再靠這組號碼分辨是誰的錢，漏填或填錯就可能無法自動入帳。', eg: '例：轉入 XRP、XLM 到交易所時，通常要填 Tag 或 Memo。' });
  CRY.GLOSSARY.push({ term: '假客服', en: 'Fake Customer Support', cat: 'sec', def: '詐騙者冒充交易所或錢包的客服人員。常見情境是你在社群公開求助後，對方主動私訊，接著索取助記詞或要你連到假網站。真正的客服不會主動私訊，也不會要助記詞。' });
  CRY.GLOSSARY.push({ term: '二次詐騙', en: 'Recovery Scam', cat: 'sec', def: '針對已經被騙的人再騙一次。對方自稱律師、駭客或追款公司，聲稱先付費就能把幣追回來，其實是另一場詐騙。沒有人能保證追回鏈上資產。' });
  CRY.GLOSSARY.push({ term: '人頭帳戶', en: 'Mule Account', cat: 'sec', def: '被詐騙集團拿來收款與洗錢的他人帳戶，包含銀行帳戶與交易所帳號，多半是用報酬或求職名義騙來、租來的。在台灣，無正當理由把帳戶交給他人使用，可能要負法律責任。' });
  CRY.GLOSSARY.push({ term: '警示帳戶', en: 'Alert Account (Taiwan)', cat: 'reg', def: '台灣的制度：檢警等機關因偵辦詐欺等案件，通報金融機構列管的帳戶。被列管後帳戶的交易功能會暫停，本人名下其他帳戶的使用也可能受到限制。' });

  // ── 法規 ──
  CRY.GLOSSARY.push({ term: 'CBDC', en: 'Central Bank Digital Currency', cat: 'reg', def: '央行數位貨幣。由中央銀行發行的數位形式法幣，價值與現金相同、由國家背書，和民間發行的穩定幣或比特幣不同。各國進度不一，隱私保護是常見的爭議。' });
  CRY.GLOSSARY.push({ term: 'SEC', en: 'U.S. Securities and Exchange Commission', cat: 'reg', def: '美國證券交易委員會，中文常稱證管會，負責監管證券市場。代幣若被認定為證券就歸它管，否則可能歸商品期貨交易委員會（CFTC），兩者的權責劃分是美國立法的焦點。' });
  CRY.GLOSSARY.push({ term: '牌照', en: 'License', cat: 'reg', def: '主管機關核發給業者的營業執照。拿到牌照代表業者通過資本、資安、洗錢防制等審查並持續受監督，但不等於保證不會出事，也不代表平台上的幣沒有風險。', eg: '例：香港要求虛擬資產交易平台向證監會申領牌照。' });
  CRY.GLOSSARY.push({ term: '許可制', en: 'Licensing Regime', cat: 'reg', def: '業者必須先向主管機關申請、通過審查並取得許可才能營業的管理方式，比只需完成登記的登記制嚴格。台灣對虛擬資產業者的管理，正從洗錢防制登記走向專法許可制。', eg: '另一個用法「許可制區塊鏈」，是指須獲准才能加入的聯盟鏈與私有鏈。' });
  CRY.GLOSSARY.push({ term: '財產交易所得', en: 'Income from Property Transactions', cat: 'reg', def: '台灣所得稅的一個類別，指出售財產賺到的差價。一般的理解是，個人買賣加密貨幣的獲利屬於這一類，應併入綜合所得稅申報；實際認定仍以稅捐機關的解釋為準。' });
})();

  <script>
/* 區塊鏈學院 core — 命名空間 CRY、共用工具、路由、進度保存（localStorage 前綴 cry.） */
(function () {
  'use strict';
  var CRY = (window.CRY = window.CRY || {});
  CRY.LESSONS = CRY.LESSONS || [];
  CRY.COINS = CRY.COINS || [];
  CRY.HISTORY = CRY.HISTORY || [];
  CRY.GLOSSARY = CRY.GLOSSARY || [];

  CRY.TRACKS = [
    { id: 'basics', icon: '⛓️', name: '區塊鏈基礎', desc: '帳本、雜湊、公私鑰與節點，從零看懂區塊鏈在做什麼。' },
    { id: 'consensus', icon: '⚒️', name: '共識機制與挖礦', desc: 'PoW、PoS、減半與分叉：一群陌生人如何對同一本帳達成共識。' },
    { id: 'bitcoin', icon: '₿', name: '比特幣深入', desc: 'UTXO、手續費、閃電網路與現貨 ETF，數位黃金的完整樣貌。' },
    { id: 'ethereum', icon: '◆', name: '以太坊與智慧合約', desc: 'EVM、Gas、代幣標準與 Layer 2，會跑程式的區塊鏈。' },
    { id: 'defi', icon: '🏦', name: 'DeFi 去中心化金融', desc: '穩定幣、AMM、借貸與清算，沒有銀行的金融怎麼運作。' },
    { id: 'wallet', icon: '🛡️', name: '錢包與資安防詐', desc: '助記詞、冷熱錢包、授權與常見詐騙手法，先學會保護自己。' },
    { id: 'market', icon: '📊', name: '市場觀念與風險', desc: '市值、代幣經濟、槓桿與週期，看懂數字背後的風險。' },
    { id: 'frontier', icon: '🌐', name: '應用、趨勢與監管', desc: 'NFT、DAO、RWA、零知識證明與各國法規的最新發展。' }
  ];
  CRY.COIN_CATS = [
    { id: 'store', name: '價值儲存', icon: '🪙' }, { id: 'platform', name: '智慧合約平台', icon: '🧱' },
    { id: 'stable', name: '穩定幣', icon: '💵' }, { id: 'payment', name: '支付與轉帳', icon: '💸' },
    { id: 'defi', name: 'DeFi 協議', icon: '🏦' }, { id: 'l2', name: 'Layer 2／擴容', icon: '🚀' },
    { id: 'infra', name: '基礎設施', icon: '🛠️' }, { id: 'meme', name: '迷因幣', icon: '🐶' },
    { id: 'privacy', name: '隱私幣', icon: '🕶️' }, { id: 'exchange', name: '交易所平台幣', icon: '🏛️' }
  ];
  CRY.ERAS = [
    { id: 'pre', name: '密碼龐克與前身', years: '2008 以前' }, { id: 'genesis', name: '比特幣誕生', years: '2008–2012' },
    { id: 'early', name: '野蠻生長', years: '2013–2016' }, { id: 'ico', name: 'ICO 狂潮與寒冬', years: '2017–2019' },
    { id: 'defi', name: 'DeFi 之夏與 NFT 熱', years: '2020–2021' }, { id: 'crash', name: '連環爆與監管', years: '2022–2023' },
    { id: 'inst', name: 'ETF 與機構時代', years: '2024–至今' }
  ];
  CRY.GLOSS_CATS = [
    { id: 'tech', name: '技術原理' }, { id: 'coin', name: '貨幣與代幣' }, { id: 'defi', name: 'DeFi' }, { id: 'trade', name: '交易與市場' },
    { id: 'sec', name: '資安' }, { id: 'culture', name: '幣圈用語' }, { id: 'reg', name: '法規' }
  ];

  // ---------- 基本工具 ----------
  CRY.esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  CRY.$ = function (sel, root) { return (root || document).querySelector(sel); };
  CRY.$$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  CRY.byId = function (list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; };
  CRY.find = function (list, key, val) { for (var i = 0; i < list.length; i++) if (list[i][key] === val) return list[i]; return null; };

  CRY.store = {
    get: function (key, dflt) {
      try { var v = window.localStorage.getItem('cry.' + key); return v == null ? dflt : JSON.parse(v); } catch (e) { return dflt; }
    },
    set: function (key, val) { try { window.localStorage.setItem('cry.' + key, JSON.stringify(val)); } catch (e) { /* 私密模式 */ } }
  };

  CRY.isStatic = function () {
    if (window.CRY_STATIC_ONLY || window.CAMPUS_STATIC_ONLY) return true;
    var loc = window.location || {};
    if (String(loc.protocol || '').indexOf('http') !== 0) return true;
    return /\.github\.io$/i.test(String(loc.hostname || ''));
  };
  CRY.apiBase = function () {
    var ms = document.querySelector && document.querySelector('script[data-campus-mount]');
    if (ms) { var mnt = ms.getAttribute('data-campus-mount'); if (mnt) return '/' + mnt + '/api/'; }
    return 'api/';
  };

  var toastTimer = null;
  CRY.toast = function (msg) {
    var el = document.getElementById('cryToast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);
  };

  CRY.openModal = function (html) {
    var bd = document.getElementById('cryModal');
    var card = document.getElementById('cryModalCard');
    if (!bd || !card) return;
    card.innerHTML = '<button type="button" class="cry-modal-close" data-close-modal aria-label="關閉">✕</button>' + html;
    bd.classList.add('open');
    card.scrollTop = 0;
  };
  CRY.closeModal = function () { var bd = document.getElementById('cryModal'); if (bd) bd.classList.remove('open'); };

  // ---------- 數字格式 ----------
  function trimZeros(s) { return s.indexOf('.') >= 0 ? s.replace(/0+$/, '').replace(/\.$/, '') : s; }
  function group(n, digits) {
    return Number(n).toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }
  // 價格：大數兩位小數、小數依量級保留有效位數（PEPE、SHIB 這類極小價格不會變成 0）
  CRY.fmtPrice = function (v, cur) {
    if (v == null || isNaN(v)) return '—';
    var pre = cur === 'twd' ? 'NT$' : '$';
    var a = Math.abs(v), s;
    if (a >= 1000) s = group(v, cur === 'twd' ? 0 : 2);
    else if (a >= 1) s = group(v, 2);
    else if (a >= 0.01) s = trimZeros(v.toFixed(4));
    else if (a === 0) s = '0';
    else { var d = Math.min(12, Math.ceil(-Math.log(a) / Math.LN10) + 3); s = trimZeros(v.toFixed(d)); }
    return pre + s;
  };
  // 大數字用中文量級（兆／億／萬）
  CRY.fmtBig = function (v, cur) {
    if (v == null || isNaN(v)) return '—';
    var pre = cur === 'twd' ? 'NT$' : cur === 'none' ? '' : '$';
    var a = Math.abs(v);
    function m(x, d) { return Number(x.toFixed(d)).toLocaleString('en-US', { maximumFractionDigits: d }); }
    if (a >= 1e12) return pre + m(v / 1e12, 2) + ' 兆';
    if (a >= 1e8) return pre + m(v / 1e8, a >= 1e10 ? 0 : 1) + ' 億';
    if (a >= 1e4) return pre + m(v / 1e4, a >= 1e6 ? 0 : 1) + ' 萬';
    return pre + group(v, 0);
  };
  // 數量（枚）：2,011 萬枚、1.2 億枚
  CRY.fmtQty = function (v) { return v == null || isNaN(v) || !v ? '—' : CRY.fmtBig(v, 'none') + '枚'; };
  CRY.fmtPct = function (v) {
    if (v == null || isNaN(v)) return '—';
    return (v > 0 ? '+' : '') + v.toFixed(2) + '%';
  };
