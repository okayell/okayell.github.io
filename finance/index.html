  }
  function button(parent, label, onClick, cls) {
    const b = node(`<button type="button" class="btn sm ${cls || ''}">${label}</button>`);
    b.addEventListener('click', onClick);
    parent.appendChild(b);
    return b;
  }
  function toggle(parent, label, value, onChange) {
    const el = node(`<label class="w-tg"><input type="checkbox" ${value ? 'checked' : ''}><span>${esc(label)}</span></label>`);
    const inp = FIN.$('input', el);
    inp.addEventListener('change', () => onChange(inp.checked));
    parent.appendChild(el);
    return { get: () => inp.checked };
  }
  /** 計算機輸入欄：{ key, label, value, step, min, max, suffix } → 回傳讀值函式。 */
  function fields(parent, defs, onChange) {
    const wrap = node('<div class="w-fields"></div>');
    const inputs = {};
    defs.forEach((d) => {
      const f = node(`<label class="w-f"><span>${esc(d.label)}</span><div class="w-f-in">
        <input type="number" inputmode="decimal" value="${d.value}" step="${d.step || 'any'}" ${d.min != null ? `min="${d.min}"` : ''} ${d.max != null ? `max="${d.max}"` : ''}>
        ${d.suffix ? `<em>${esc(d.suffix)}</em>` : ''}</div></label>`);
      const inp = FIN.$('input', f);
      inp.addEventListener('input', () => onChange());
      inp.addEventListener('keydown', (e) => { if (FIN.isEnterSend(e)) { e.preventDefault(); inp.blur(); } });
      inputs[d.key] = inp;
      wrap.appendChild(f);
    });
    parent.appendChild(wrap);
    return {
      val: () => {
        const o = {};
        defs.forEach((d) => { const v = parseFloat(inputs[d.key].value); o[d.key] = isFinite(v) ? v : 0; });
        return o;
      },
      set: (vals) => { Object.entries(vals).forEach(([k, v]) => { if (inputs[k]) inputs[k].value = v; }); },
    };
  }
  function stat(label, value, cls, sub) {
    return `<div class="w-stat ${cls || ''}"><small>${esc(label)}</small><b>${value}</b>${sub ? `<em>${sub}</em>` : ''}</div>`;
  }

  /** 依容器寬度畫圖，縮放視窗時重畫。render(width) 回傳 { html, after(svgEl) }。 */
  function responsive(host, render) {
    let lastW = 0;
    const draw = () => {
      const w = Math.round(host.getBoundingClientRect().width || host.parentElement.getBoundingClientRect().width || 680);
      const width = FIN.clamp(w, 280, 980);
      lastW = width;
      const out = render(width);
      host.innerHTML = out.html;
      if (out.after) out.after(host);
    };
    draw();
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(FIN.debounce(() => {
        const w = Math.round(host.getBoundingClientRect().width);
        if (w && Math.abs(FIN.clamp(w, 280, 980) - lastW) > 24) draw();
      }, 160));
      ro.observe(host);
      FIN.onCleanup(() => ro.disconnect());
    }
    return { redraw: draw };
  }

  // ---------------------------------------------------------------------------
  // K 線圖引擎
  // ---------------------------------------------------------------------------
  function niceRange(vals, padRatio) {
    let lo = Infinity; let hi = -Infinity;
    vals.forEach((v) => { if (v != null && isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); } });
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    if (hi === lo) { hi += 1; lo -= 1; }
    const pad = (hi - lo) * (padRatio == null ? 0.07 : padRatio);
    return [lo - pad, hi + pad];
  }
  function pathOf(vals, xf, yf) {
    let d = ''; let pen = false;
    vals.forEach((v, i) => {
      if (v == null || !isFinite(v)) { pen = false; return; }
      d += `${pen ? 'L' : 'M'}${xf(i).toFixed(1)},${yf(v).toFixed(1)}`;
      pen = true;
    });
    return d;
  }
  function axisTicks(lo, hi, n) {
    const raw = (hi - lo) / n;
    const mag = 10 ** Math.floor(Math.log10(raw));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) || raw;
    const out = [];
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) out.push(+v.toFixed(6));
    return out;
  }
  /**
   * cfg：{ width, bars, mainH, overlays:[{data,color,label,width,dash}], band:{up,lo,color},
   *   markers:[{i, dir:'up'|'down', label, color}], hlines:[{y,color,label,dash}],
   *   panels:[{ h, kind:'volume'|'lines'|'hist', series:[{data,color,label}], hist:[], refs:[{y,label,color}], range:[lo,hi], title }],
   *   priceDp, noCandles, line:{data,color} }
   */
  function chart(cfg) {
    const width = cfg.width;
    const bars = cfg.bars;
    const n = bars.length;
    const padL = 6; const padR = width < 420 ? 44 : 54; const padT = 8; const gap = 10; const padB = 20;
    const mainH = cfg.mainH || (width < 520 ? 190 : 240);
    const panels = cfg.panels || [];
    const totalH = padT + mainH + panels.reduce((s, p) => s + gap + (p.h || 70), 0) + padB;
    const plotW = width - padL - padR;
    const slot = plotW / n;
    const x = (i) => padL + slot * (i + 0.5);
    const priceVals = [];
    if (!cfg.noCandles) bars.forEach((b) => { priceVals.push(b.h, b.l); });
    (cfg.overlays || []).forEach((o) => o.data.forEach((v) => priceVals.push(v)));
    if (cfg.band) { cfg.band.up.forEach((v) => priceVals.push(v)); cfg.band.lo.forEach((v) => priceVals.push(v)); }
    (cfg.hlines || []).forEach((h) => priceVals.push(h.y));
    if (cfg.line) cfg.line.data.forEach((v) => priceVals.push(v));
    const [plo, phi] = niceRange(priceVals);
    const y = (v) => padT + (phi - v) / (phi - plo) * mainH;
    const dp = cfg.priceDp != null ? cfg.priceDp : (phi < 50 ? 2 : phi < 500 ? 1 : 0);
    let s = `<svg class="w-svg" viewBox="0 0 ${width} ${totalH}" width="${width}" height="${totalH}" role="img" aria-label="${esc(cfg.aria || 'K 線示意圖')}">`;
    // 主圖格線
    axisTicks(plo, phi, 4).forEach((t) => {
      s += `<line x1="${padL}" x2="${width - padR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="${C.grid}"/>`;
      s += `<text x="${width - padR + 4}" y="${(y(t) + 3.5).toFixed(1)}" class="w-ax">${fmt(t, dp)}</text>`;
    });
    const step = Math.max(1, Math.round(n / (width < 520 ? 4 : 7)));
    for (let i = 0; i < n; i += step) {
      s += `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${padT}" y2="${totalH - padB}" stroke="${C.grid}" stroke-dasharray="2 3"/>`;
      if (bars[i].d) s += `<text x="${x(i).toFixed(1)}" y="${totalH - 6}" class="w-ax" text-anchor="middle">${esc(bars[i].d)}</text>`;
    }
    if (cfg.band) {
      const up = cfg.band.up; const lo = cfg.band.lo;
      let poly = '';
      const idx = up.map((v, i) => (v == null ? -1 : i)).filter((i) => i >= 0);
      if (idx.length) {
        poly = idx.map((i) => `${x(i).toFixed(1)},${y(up[i]).toFixed(1)}`).join(' ') + ' ' +
          idx.slice().reverse().map((i) => `${x(i).toFixed(1)},${y(lo[i]).toFixed(1)}`).join(' ');
        s += `<polygon points="${poly}" fill="${cfg.band.color || C.band}" fill-opacity=".08" stroke="none"/>`;
        s += `<path d="${pathOf(up, x, y)}" fill="none" stroke="${cfg.band.color || C.band}" stroke-width="1.2"/>`;
        s += `<path d="${pathOf(lo, x, y)}" fill="none" stroke="${cfg.band.color || C.band}" stroke-width="1.2"/>`;
      }
    }
    (cfg.hlines || []).forEach((h) => {
      s += `<line x1="${padL}" x2="${width - padR}" y1="${y(h.y).toFixed(1)}" y2="${y(h.y).toFixed(1)}" stroke="${h.color || '#0f172a'}" stroke-width="1.3" stroke-dasharray="${h.dash || '5 4'}"/>`;
      if (h.label) s += `<text x="${padL + 4}" y="${(y(h.y) - 4).toFixed(1)}" class="w-lbl" fill="${h.color || '#0f172a'}">${esc(h.label)}</text>`;
    });
    // K 棒
    if (!cfg.noCandles) {
      const bw = Math.max(1.2, Math.min(14, slot * 0.64));
      bars.forEach((b, i) => {
        const col = candleColor(b);
        const top = y(Math.max(b.o, b.c)); const bot = y(Math.min(b.o, b.c));
        s += `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${y(b.h).toFixed(1)}" y2="${y(b.l).toFixed(1)}" stroke="${col}" stroke-width="1"/>`;
        s += `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, bot - top).toFixed(1)}" fill="${col}"${b.hl ? ' stroke="#0f172a" stroke-width="1.6"' : ''}/>`;
      });
    }
    if (cfg.line) s += `<path d="${pathOf(cfg.line.data, x, y)}" fill="none" stroke="${cfg.line.color || '#0f172a'}" stroke-width="2"/>`;
    (cfg.overlays || []).forEach((o) => {
      s += `<path d="${pathOf(o.data, x, y)}" fill="none" stroke="${o.color}" stroke-width="${o.width || 1.6}"${o.dash ? ` stroke-dasharray="${o.dash}"` : ''}/>`;
    });
    (cfg.markers || []).forEach((m) => {
      const b = bars[m.i];
      if (!b) return;
      const col = m.color || (m.dir === 'up' ? C.up : C.down);
      const yy = m.y != null ? y(m.y) : (m.dir === 'up' ? y(b.l) + 12 : y(b.h) - 12);
      const tri = m.dir === 'up'
        ? `${x(m.i)},${yy - 6} ${x(m.i) - 5},${yy + 3} ${x(m.i) + 5},${yy + 3}`
        : `${x(m.i)},${yy + 6} ${x(m.i) - 5},${yy - 3} ${x(m.i) + 5},${yy - 3}`;
      s += `<polygon points="${tri}" fill="${col}"/>`;
      if (m.label) s += `<text x="${x(m.i).toFixed(1)}" y="${(m.dir === 'up' ? yy + 15 : yy - 9).toFixed(1)}" class="w-lbl" text-anchor="middle" fill="${col}">${esc(m.label)}</text>`;
    });
    // 副圖
    let top = padT + mainH;
    const panelGeo = [];
    panels.forEach((p) => {
      top += gap;
      const h = p.h || 70;
      const vals = [];
      if (p.kind === 'volume') bars.forEach((b) => vals.push(b.v, 0));
      (p.series || []).forEach((se) => se.data.forEach((v) => vals.push(v)));
      (p.hist || []).forEach((v) => vals.push(v, 0));
      (p.refs || []).forEach((r) => vals.push(r.y));
      const [lo, hi] = p.range || niceRange(vals, 0.08);
      const py = (v) => top + (hi - v) / (hi - lo) * h;
      s += `<rect x="${padL}" y="${top}" width="${plotW}" height="${h}" fill="#fbfcfe" stroke="${C.grid}"/>`;
      (p.refs || []).forEach((r) => {
        s += `<line x1="${padL}" x2="${width - padR}" y1="${py(r.y).toFixed(1)}" y2="${py(r.y).toFixed(1)}" stroke="${r.color || C.axis}" stroke-dasharray="4 3"/>`;
        s += `<text x="${width - padR + 4}" y="${(py(r.y) + 3.5).toFixed(1)}" class="w-ax">${esc(r.label != null ? r.label : fmt(r.y, 0))}</text>`;
      });
      if (p.kind === 'volume') {
        const bw = Math.max(1.2, Math.min(14, slot * 0.64));
        bars.forEach((b, i) => {
          const yy = py(b.v);
          s += `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0.5, py(0) - yy).toFixed(1)}" fill="${candleColor(b)}" fill-opacity=".55"/>`;
        });
        s += `<text x="${width - padR + 4}" y="${top + 10}" class="w-ax">${fmt(hi / 1000, 0)}k</text>`;
      }
      if (p.hist) {
        const bw = Math.max(1, Math.min(10, slot * 0.55));
        p.hist.forEach((v, i) => {
          if (v == null) return;
          const y0 = py(0); const y1 = py(v);
          s += `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0.5, Math.abs(y1 - y0)).toFixed(1)}" fill="${v >= 0 ? C.up : C.down}" fill-opacity=".6"/>`;
        });
      }
      (p.series || []).forEach((se) => {
        s += `<path d="${pathOf(se.data, x, py)}" fill="none" stroke="${se.color}" stroke-width="${se.width || 1.5}"${se.dash ? ` stroke-dasharray="${se.dash}"` : ''}/>`;
      });
      (p.markers || []).forEach((m) => {
        const v = m.y;
        if (v == null) return;
        s += `<circle cx="${x(m.i).toFixed(1)}" cy="${py(v).toFixed(1)}" r="3.6" fill="${m.dir === 'up' ? C.up : C.down}" stroke="#fff" stroke-width="1"/>`;
      });
      if (p.title) s += `<text x="${padL + 5}" y="${top + 12}" class="w-pt">${esc(p.title)}</text>`;
      panelGeo.push({ top, h });
      top += h;
    });
    s += `<line class="w-cross" x1="0" x2="0" y1="${padT}" y2="${totalH - padB}" stroke="#0f172a" stroke-opacity=".35" stroke-dasharray="3 3" visibility="hidden"/>`;
    s += `<rect class="w-hit" x="${padL}" y="${padT}" width="${plotW}" height="${totalH - padT - padB}" fill="transparent"/>`;
    s += '</svg>';
    return { svg: s, geo: { padL, padR, slot, width, n, x, y, totalH, panelGeo } };
  }
  /** 十字線 + 讀數：滑鼠／手指移動時顯示該根資料，離開時回到最後一根。 */
  function hover(host, geo, readout) {
    const svg = FIN.$('svg', host);
    const ro = FIN.$('.w-readout', host);
    const cross = FIN.$('.w-cross', host);
    if (!svg || !ro) return;
    const show = (i) => { ro.innerHTML = readout(i); };
    show(geo.n - 1);
    const move = (e) => {
      const r = svg.getBoundingClientRect();
      const sx = (e.clientX - r.left) / r.width * geo.width;
      const i = FIN.clamp(Math.floor((sx - geo.padL) / geo.slot), 0, geo.n - 1);
      cross.setAttribute('x1', geo.x(i)); cross.setAttribute('x2', geo.x(i));
      cross.setAttribute('visibility', 'visible');
      show(i);
    };
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerdown', move);
    svg.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); show(geo.n - 1); });
  }
  function ohlcText(b) {
    const ch = b.c - b.prev;

      <span class="${cls}">${sign(ch)}（${pctTxt(ch / b.prev)}）</span> 量 <b>${fmt(b.v, 0)}</b> 張`;
  }

  W.seedOf = (el, fallback) => {

  /** 產生暖身 + 顯示用的 K 線（指標需要前置資料）。 */

      const Wd = Math.min(width, 640); const H = width < 520 ? 200 : 240; const pad = 26;
      const X = (v) => pad + v * (Wd - pad * 2); const Y = (v) => H - pad - v * (H - pad * 2);
      let svg = `<svg viewBox="0 0 ${Wd} ${H}" class="w-svg" role="img" aria-label="${esc(p.t)}">`;
      svg += `<rect x="0" y="0" width="${Wd}" height="${H}" fill="#fbfcfe" rx="10"/>`;
      const line = (a) => `<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(a[2])}" y2="${Y(a[3])}" stroke="#0f172a" stroke-width="1.6" stroke-dasharray="6 4"/>`;
      svg += line(p.neck);
      if (p.neck2) svg += line(p.neck2);
      svg += `<path d="${p.pts.map((q, i) => `${i ? 'L' : 'M'}${X(q[0]).toFixed(1)},${Y(q[1]).toFixed(1)}`).join('')}" fill="none" stroke="${p.dir > 0 ? C.up : C.down}" stroke-width="3" stroke-linejoin="round"/>`;
      p.labels.forEach(([lx, ly, t]) => { svg += `<text x="${X(lx)}" y="${Y(ly) + (ly > 0.5 ? -10 : 18)}" text-anchor="middle" class="w-lbl">${esc(t)}</text>`; });
      svg += `<text x="${X(p.neck[2]) + 4}" y="${Y(p.neck[3]) - 6}" class="w-lbl">頸線</text>`;
      svg += '</svg>';
      return { html: `<div class="w-pat2">${svg}<div class="w-explain"><b>${esc(p.t)}</b>：${esc(p.d)}</div></div>` };
    });
  });

  function indicatorWidget(el, o) {
    const ui = shell(el, { icon: o.icon, title: o.title, hint: o.hint });
    const st = Object.assign({ trend: el.dataset.trend || o.trend || 'range', seed: W.seedOf(el, o.seed), marks: true }, o.state);
    seg(ui.ctrl, { label: '行情', options: [['up', '上升'], ['range', '盤整'], ['down', '下跌']], value: st.trend, onChange: (v) => { st.trend = v; r.redraw(); } });
    o.controls(ui.ctrl, st, () => r.redraw());
    button(ui.ctrl, '🎲 重新產生', () => { st.seed = (st.seed * 7 + 13) % 9973; r.redraw(); });
    const r = responsive(ui.body, (width) => {
      const n = nBars(width);
      const S = series(st.seed, st.trend, n, 60, st.trend === 'range' ? { vol: 0.02 } : { shape: st.trend === 'up' ? [{ at: 0, drift: -0.003 }, { at: 0.4, drift: 0.006 }] : [{ at: 0, drift: 0.003 }, { at: 0.4, drift: -0.006 }] });
      const spec = o.build(S, st);
      const { svg, geo } = chart(Object.assign({ width, bars: S.view }, spec.chart));
      return {
        html: `<div class="w-readout"></div>${svg}${spec.legend ? legend(spec.legend) : ''}${spec.note ? `<p class="w-note">${spec.note}</p>` : ''}`,
        after: (h) => hover(h, geo, (i) => `${ohlcText(S.view[i])}<br>${spec.read(i)}`),
      };
    });
  }
  W.register('kd-chart', (el) => indicatorWidget(el, {
    icon: '🎚️', title: 'KD 指標（隨機指標）', hint: 'RSV 看收盤在最近 n 日高低區間的位置；K、D 以 1/3 平滑', seed: 61, state: { n: 9 },
    controls: (ctrl, st, redraw) => {
      slider(ctrl, { label: 'RSV 天數', min: 5, max: 14, value: st.n, fmt: (v) => `${v} 日`, onInput: (v) => { st.n = v; redraw(); } });
    },
    build: (S, st) => {
      const kd = M.kd(S.all, st.n, 3, 3);
      const K = sliceView(kd.K, S.warm); const D = sliceView(kd.D, S.warm); const R = sliceView(kd.RSV, S.warm);
      const cr = M.crosses(K, D);
      const last = K.length - 1;
      const zone = K[last] >= 80 ? '高檔區（≥ 80）：強勢但留意過熱，強勢股可能「高檔鈍化」' : K[last] <= 20 ? '低檔區（≤ 20）：弱勢但可能超賣，弱勢股可能「低檔鈍化」' : '中間區域';
      return {
        chart: { panels: [{ kind: 'lines', h: 92, range: [0, 100], title: `KD(${st.n},3,3)`, refs: [{ y: 80, label: '80', color: '#be123c' }, { y: 20, label: '20', color: '#15803d' }],
          series: [{ data: K, color: C.k, width: 1.7 }, { data: D, color: C.d, width: 1.7 }],
          markers: cr.map((c) => ({ i: c.i, y: K[c.i], dir: c.dir })) }] },
        legend: [[C.k, 'K 值'], [C.d, 'D 值'], [C.up, '● 黃金交叉'], [C.down, '● 死亡交叉']],
        note: `最後一根 K = <b>${fmt(K[last], 1)}</b>、D = <b>${fmt(D[last], 1)}</b>，位於${zone}。期間交叉 ${cr.length} 次。`,
        read: (i) => `<span style="color:${C.k}">K ${fmt(K[i], 1)}</span>　<span style="color:${C.d}">D ${fmt(D[i], 1)}</span>　RSV ${fmt(R[i], 1)}`,
      };
    },
  }));
  W.register('rsi-chart', (el) => indicatorWidget(el, {
    icon: '💪', title: 'RSI 相對強弱指標', hint: 'RSI = 100 − 100 ÷（1 + 平均漲幅 ÷ 平均跌幅），Wilder 平滑', seed: 72, state: { n: 14, hi: 70 },
    controls: (ctrl, st, redraw) => {
      seg(ctrl, { label: '天數', options: [['6', '6'], ['12', '12'], ['14', '14']], value: String(st.n), onChange: (v) => { st.n = +v; redraw(); } });
      seg(ctrl, { label: '超買／超賣線', options: [['70', '70／30'], ['80', '80／20']], value: String(st.hi), onChange: (v) => { st.hi = +v; redraw(); } });
    },
    build: (S, st) => {
      const R = sliceView(M.rsi(M.closes(S.all), st.n), S.warm);
      const last = R.length - 1;
      const lo = 100 - st.hi;
      const over = R.filter((v) => v != null && v >= st.hi).length; const under = R.filter((v) => v != null && v <= lo).length;
      return {
        chart: { panels: [{ kind: 'lines', h: 88, range: [0, 100], title: `RSI(${st.n})`, refs: [{ y: st.hi, label: String(st.hi), color: '#be123c' }, { y: 50, label: '50' }, { y: lo, label: String(lo), color: '#15803d' }],
          series: [{ data: R, color: C.rsi, width: 1.8 }] }] },
        note: `最後一根 RSI(${st.n}) = <b>${fmt(R[last], 1)}</b>；期間有 ${over} 天 ≥ ${st.hi}（超買）、${under} 天 ≤ ${lo}（超賣）。天數越短越敏感、訊號越多。`,
        read: (i) => `<span style="color:${C.rsi}">RSI(${st.n}) ${fmt(R[i], 1)}</span>`,
      };
    },
  }));
  W.register('macd-chart', (el) => indicatorWidget(el, {
    icon: '🌊', title: 'MACD 指標', hint: 'DIF = 快線 EMA − 慢線 EMA；MACD = DIF 的 EMA；OSC 柱狀體 = DIF − MACD', seed: 83, trend: 'up', state: { f: 12, s: 26, g: 9 },
    controls: (ctrl, st, redraw) => {
      slider(ctrl, { label: '快線', min: 5, max: 20, value: st.f, onInput: (v) => { st.f = v; redraw(); } });
      slider(ctrl, { label: '慢線', min: 15, max: 40, value: st.s, onInput: (v) => { st.s = v; redraw(); } });
      slider(ctrl, { label: '訊號', min: 5, max: 15, value: st.g, onInput: (v) => { st.g = v; redraw(); } });
    },
    build: (S, st) => {
      const f = Math.min(st.f, st.s - 1);
      const mc = M.macd(M.closes(S.all), f, st.s, st.g);
      const dif = sliceView(mc.dif, S.warm); const sig = sliceView(mc.macd, S.warm); const osc = sliceView(mc.osc, S.warm);
      const cr = M.crosses(dif, sig);
      const last = dif.length - 1;
      return {
        chart: { panels: [{ kind: 'lines', h: 96, title: `MACD(${f},${st.s},${st.g})`, refs: [{ y: 0, label: '0' }], hist: osc,
          series: [{ data: dif, color: C.dif, width: 1.7 }, { data: sig, color: C.sig, width: 1.7 }],
          markers: cr.map((c) => ({ i: c.i, y: dif[c.i], dir: c.dir })) }] },
        legend: [[C.dif, 'DIF'], [C.sig, 'MACD（訊號線）'], [C.up, 'OSC > 0'], [C.down, 'OSC < 0']],
        note: `最後一根 DIF ${fmt(dif[last], 2)}、MACD ${fmt(sig[last], 2)}、OSC <b class="${osc[last] >= 0 ? 'up' : 'down'}">${fmt(osc[last], 2)}</b>。DIF 在 0 軸之上代表短期均價高於長期均價（偏多）。`,
        read: (i) => `<span style="color:${C.dif}">DIF ${fmt(dif[i], 2)}</span>　<span style="color:${C.sig}">MACD ${fmt(sig[i], 2)}</span>　OSC ${fmt(osc[i], 2)}`,
      };
    },
  }));
  W.register('bollinger-chart', (el) => indicatorWidget(el, {
    icon: '🎈', title: '布林通道', hint: '中軌 = n 日均線；上下軌 = 中軌 ± k 個標準差；下方副圖是通道寬度', seed: 94, state: { n: 20, k: 2 },
    controls: (ctrl, st, redraw) => {
      slider(ctrl, { label: '天數', min: 10, max: 30, value: st.n, fmt: (v) => `${v} 日`, onInput: (v) => { st.n = v; redraw(); } });
      slider(ctrl, { label: '標準差', min: 1, max: 3, step: 0.5, value: st.k, fmt: (v) => `±${v}σ`, onInput: (v) => { st.k = v; redraw(); } });
    },
    build: (S, st) => {
      const bb = M.boll(M.closes(S.all), st.n, st.k);
      const mid = sliceView(bb.mid, S.warm); const up = sliceView(bb.up, S.warm); const lo = sliceView(bb.lo, S.warm); const wd = sliceView(bb.width, S.warm).map((v) => (v == null ? null : v * 100));
      const bars = S.view;
      const outs = bars.filter((b, i) => b.c > up[i] || b.c < lo[i]).length;
      const markers = [];
      bars.forEach((b, i) => { if (b.c > up[i]) markers.push({ i, dir: 'down', color: '#be123c' }); else if (b.c < lo[i]) markers.push({ i, dir: 'up', color: '#15803d' }); });
      const last = bars.length - 1;
      const minW = Math.min(...wd.filter((v) => v != null));
      return {
        chart: { band: { up, lo, color: C.band }, overlays: [{ data: mid, color: C.band, dash: '4 3' }], markers,
          panels: [{ kind: 'lines', h: 62, title: '通道寬度 %', series: [{ data: wd, color: C.band, width: 1.6 }] }] },
        legend: [[C.band, `上／下軌 ±${st.k}σ`], ['#be123c', '▼ 收在上軌外'], ['#15803d', '▲ 收在下軌外']],
        note: `收盤落在通道外 ${outs} 天（±2σ 理論上約 5% 的時間）。目前寬度 ${fmt(wd[last], 1)}%（期間最窄 ${fmt(minW, 1)}%）——寬度縮到很窄（壓縮）後，常接著出現大波動。`,
        read: (i) => `上軌 ${fmt(up[i])}　中軌 ${fmt(mid[i])}　下軌 ${fmt(lo[i])}　寬度 ${fmt(wd[i], 1)}%`,
      };
    },
  }));

  W.register('indicator-dashboard', (el) => {
    const ui = shell(el, { icon: '🧩', title: '多指標儀表板', hint: '同一段行情同時看均線、量、KD、RSI、MACD；移動滑鼠看每天的訊號總表' });
    const st = { trend: el.dataset.trend || 'up', seed: W.seedOf(el, 105) };
    seg(ui.ctrl, { label: '行情', options: [['up', '上升'], ['range', '盤整'], ['down', '下跌']], value: st.trend, onChange: (v) => { st.trend = v; r.redraw(); } });
    button(ui.ctrl, '🎲 重新產生', () => { st.seed = (st.seed * 7 + 13) % 9973; r.redraw(); });
    const table = node('<div class="w-sig"></div>');
    const r = responsive(ui.body, (width) => {
      const n = width < 520 ? 60 : 90;
      const S = series(st.seed, st.trend, n, 80, st.trend === 'range' ? { vol: 0.02 } : { shape: st.trend === 'up' ? [{ at: 0, drift: -0.003 }, { at: 0.35, drift: 0.006 }] : [{ at: 0, drift: 0.003 }, { at: 0.35, drift: -0.006 }] });
      const cl = M.closes(S.all);
      const m5 = sliceView(M.sma(cl, 5), S.warm); const m20 = sliceView(M.sma(cl, 20), S.warm); const m60 = sliceView(M.sma(cl, 60), S.warm);
      const kd = M.kd(S.all, 9); const K = sliceView(kd.K, S.warm); const D = sliceView(kd.D, S.warm);
      const R = sliceView(M.rsi(cl, 14), S.warm);
      const mc = M.macd(cl); const dif = sliceView(mc.dif, S.warm); const sig = sliceView(mc.macd, S.warm); const osc = sliceView(mc.osc, S.warm);
      const bars = S.view;
      const vma = M.sma(bars.map((b) => b.v), 5);
      const small = width < 520;
      const { svg, geo } = chart({
        width, bars, mainH: small ? 150 : 180,
        overlays: [{ data: m5, color: C.ma1 }, { data: m20, color: C.ma2 }, { data: m60, color: C.ma3, width: 2 }],
        panels: [
          { kind: 'volume', h: 44, title: '量' },
          { kind: 'lines', h: 56, range: [0, 100], title: 'KD', refs: [{ y: 80, label: '80' }, { y: 20, label: '20' }], series: [{ data: K, color: C.k }, { data: D, color: C.d }] },
          { kind: 'lines', h: 50, range: [0, 100], title: 'RSI14', refs: [{ y: 70, label: '70' }, { y: 30, label: '30' }], series: [{ data: R, color: C.rsi }] },
          { kind: 'lines', h: 60, title: 'MACD', refs: [{ y: 0, label: '0' }], hist: osc, series: [{ data: dif, color: C.dif }, { data: sig, color: C.sig }] },
        ],
      });
      const signals = (i) => {
        const b = bars[i];
        const rows = [
          ['均線', m5[i] > m20[i] && m20[i] > m60[i] && b.c > m5[i] ? 1 : m5[i] < m20[i] && m20[i] < m60[i] && b.c < m5[i] ? -1 : 0, b.c > m20[i] ? '站上月線' : '跌破月線'],
          ['成交量', b.c > b.prev && b.v > vma[i] ? 1 : b.c < b.prev && b.v > vma[i] ? -1 : 0, `量 ${fmt(b.v / (vma[i] || b.v), 1)} 倍 5 日均量`],
          ['KD', K[i] > D[i] ? 1 : -1, `K ${fmt(K[i], 0)} ${K[i] > D[i] ? '>' : '<'} D ${fmt(D[i], 0)}${K[i] >= 80 ? '（高檔）' : K[i] <= 20 ? '（低檔）' : ''}`],
          ['RSI', R[i] >= 50 ? 1 : -1, `RSI ${fmt(R[i], 0)}${R[i] >= 70 ? '（超買區）' : R[i] <= 30 ? '（超賣區）' : ''}`],
          ['MACD', osc[i] > 0 ? 1 : -1, `OSC ${osc[i] > 0 ? '翻紅' : '翻綠'}、DIF ${dif[i] > 0 ? '在 0 軸上' : '在 0 軸下'}`],
        ];
        const score = rows.reduce((s, x) => s + x[1], 0);
        const verdict = score >= 3 ? '<b class="up">多方訊號較多</b>' : score <= -3 ? '<b class="down">空方訊號較多</b>' : '<b>訊號分歧，觀望或等確認</b>';
        return `<table class="tbl w-sig-t"><thead><tr><th>指標</th><th>訊號</th><th>說明</th></tr></thead><tbody>${rows.map(([t, v, d]) =>
          `<tr><td>${t}</td><td>${v > 0 ? '<span class="chip up">偏多</span>' : v < 0 ? '<span class="chip down">偏空</span>' : '<span class="chip">中性</span>'}</td><td>${esc(d)}</td></tr>`).join('')}</tbody></table>
          <p class="w-note">${esc(bars[i].d)} 綜合：${verdict}（偏多 ${rows.filter((x) => x[1] > 0).length}／偏空 ${rows.filter((x) => x[1] < 0).length}）。指標多半由價格計算而來，彼此高度相關，「全部偏多」也不代表一定會漲。</p>`;
      };
      return {
        html: `<div class="w-readout"></div>${svg}${legend([[C.ma1, 'MA5'], [C.ma2, 'MA20'], [C.ma3, 'MA60'], [C.k, 'K'], [C.d, 'D'], [C.rsi, 'RSI'], [C.dif, 'DIF'], [C.sig, 'MACD']])}`,
        after: (h) => {
          h.appendChild(table);
          hover(h, geo, (i) => { table.innerHTML = signals(i); return ohlcText(bars[i]); });
        },
      };
    });
  });

  W.register('risk-calc', (el) => {
    const ui = shell(el, { icon: '🛡️', title: '停損停利與部位計算', hint: '先決定「最多願意賠多少」，再反推可以買幾股', note: '手續費上限 0.1425%（買賣各一次，可輸入折扣）；證交稅賣出時課：股票 0.3%、現股當沖 0.15%（至 2027 年底）、ETF 0.1%。未計最低手續費。' });
    let kind = 'stock';
    seg(ui.ctrl, { label: '交易類型', options: [['stock', '現股'], ['daytrade', '現股當沖'], ['etf', 'ETF']], value: kind, onChange: (v) => { kind = v; calc(); } });
    const F = fields(ui.ctrl, [
      { key: 'cap', label: '投資本金', value: 1000000, step: 10000, suffix: '元' },
      { key: 'risk', label: '單筆最大風險', value: 2, step: 0.5, suffix: '% 本金' },
      { key: 'entry', label: '進場價', value: 100, step: 0.5, suffix: '元' },
      { key: 'stop', label: '停損價', value: 93, step: 0.5, suffix: '元' },
      { key: 'target', label: '目標價', value: 114, step: 0.5, suffix: '元' },
      { key: 'disc', label: '手續費折扣', value: 6, step: 0.5, suffix: '折' },
    ], () => calc());
    const out = node('<div class="w-out"></div>');
    ui.body.appendChild(out);
    function calc() {
      const v = F.val();
      const tax = kind === 'daytrade' ? 0.0015 : kind === 'etf' ? 0.001 : 0.003;
      const fee = 0.001425 * FIN.clamp(v.disc, 0, 10) / 10;
      const perRisk = v.entry - v.stop;
      if (!(v.entry > 0) || !(perRisk > 0)) { out.innerHTML = '<p class="w-warn">停損價必須低於進場價（此計算以做多為例）。</p>'; return; }
      const maxLoss = v.cap * v.risk / 100;
      const costPerShare = v.entry * fee + v.stop * (fee + tax);
      let shares = Math.floor(maxLoss / (perRisk + costPerShare));
      shares = Math.min(shares, Math.floor(v.cap / (v.entry * (1 + fee))));
      const lots = Math.floor(shares / 1000); const odd = shares % 1000;
      const invest = shares * v.entry;
      const lossAtStop = shares * perRisk + shares * costPerShare;
      const gainAtTarget = shares * (v.target - v.entry) - shares * (v.entry * fee + v.target * (fee + tax));
      const rr = (v.target - v.entry) / perRisk;
      const winNeed = rr > 0 ? 1 / (1 + rr) : null;
      const breakeven = (v.entry * (1 + fee)) / (1 - fee - tax);
      out.innerHTML = `<div class="w-stats">
          ${stat('建議股數', `${fmt(shares, 0)} 股`, '', `${lots} 張${odd ? ` ＋ ${odd} 股零股` : ''}`)}
          ${stat('投入金額', `${fmt(invest, 0)} 元`, '', `占本金 ${pctTxt(invest / v.cap, 1)}`)}
          ${stat('打到停損約虧', `<span class="down">−${fmt(lossAtStop, 0)}</span> 元`, '', `含交易成本，占本金 ${pctTxt(lossAtStop / v.cap, 2)}`)}
          ${stat('達到目標約賺', `<span class="${gainAtTarget >= 0 ? 'up' : 'down'}">${sign(gainAtTarget, 0)}</span> 元`, '', '已扣手續費與證交稅')}
          ${stat('風險報酬比', rr > 0 ? `1 : ${fmt(rr, 2)}` : '—', rr >= 2 ? 'good' : rr < 1 ? 'bad' : '', winNeed != null ? `勝率要 > ${pctTxt(winNeed, 0)} 才划算` : '')}
          ${stat('損益兩平價', `${fmt(breakeven, 2)} 元`, '', `要漲 ${pctTxt(breakeven / v.entry - 1, 2)} 才打平成本`)}
        </div>`;
    }
    calc();
  });

  W.helpers = { shell, node, slider, seg, button, toggle, fields, stat, responsive, chart, hover, legend, series, sliceView, ohlcText, pctTxt, sign, candleColor, niceRange, pathOf, axisTicks };
})();

</script>
  <script>/* js/widgets_fa.js */
/* 財經學院 — widgets_fa.js
 * 基本面學院的互動元件：財報三表關係圖、月營收、三率、EPS、杜邦、本益比河流圖、PB、殖利率與除權息、現金流、
 * 財務安全、估值實驗室。另提供共用的長條圖引擎 W.helpers.barChart（籌碼面／消息面元件也會用）。
 */
(function () {
  'use strict';
  const FIN = window.FIN;
  const M = FIN.math;
  const W = FIN.widgets;
  const H = W.helpers;
  const C = W.colors;
  const esc = (s) => FIN.esc(s);
  const fmt = (v, dp) => FIN.fmtNum(v, dp);
  const { shell, node, seg, slider, button, fields, stat, responsive, pctTxt, sign, niceRange, axisTicks, pathOf } = H;

  /**
   * 長條圖（可分組／堆疊，可加右軸折線）。cfg：{ width, height, labels, groups:[{name,color,data}], stacked,
   *   lines:[{name,color,data,axis:'left'|'right',dash}], yFmt, y2Fmt, refs:[{y,label}], hlIdx }
   */
  function barChart(cfg) {
    const width = cfg.width;
    const n = cfg.labels.length;

          <div class="w-chain-i"><small>稅後淨利率</small><b>${pctTxt(nm, 1)}</b><em>淨利 ÷ 營收</em></div><span>×</span>
          <div class="w-chain-i"><small>總資產週轉率</small><b>${fmt(at, 2)} 次</b><em>營收 ÷ 總資產</em></div><span>×</span>
          <div class="w-chain-i"><small>權益乘數</small><b>${fmt(em, 2)} 倍</b><em>總資產 ÷ 權益</em></div><span>=</span>
          <div class="w-chain-i good"><small>ROE</small><b>${pctTxt(roe, 1)}</b><em>淨利 ÷ 權益</em></div></div>
        <div class="w-stats">${stat('ROA', pctTxt(roa, 1), '', '淨利 ÷ 總資產')}${stat('負債比', pctTxt(v.asset ? 1 - v.eq / v.asset : 0, 1), '', '1 − 權益 ÷ 資產')}${stat('ROE 主要來源', driver)}</div>
        <p class="w-note">ROE 高可能來自「很會賺」、「很會轉」或「借很多錢」。同樣 15% 的 ROE，靠高槓桿撐起來的風險比較大，要和 ROA、負債比一起看。</p>`;
    }
    calc();
  });

  W.register('pe-band', (el) => {
    const ui = shell(el, { icon: '🌈', title: '本益比與本益比河流圖', hint: '用近四季 EPS × 不同倍數畫出「河道」，看股價落在歷史的便宜還是昂貴區' });
    const st = { g: 12, seed: W.seedOf(el, 17), mult: [10, 13, 16, 19, 22] };
    const F = fields(ui.ctrl, [{ key: 'price', label: '目前股價', value: 480, suffix: '元' }, { key: 'eps', label: '近四季 EPS', value: 30, suffix: '元' }], () => r.redraw());
    slider(ui.ctrl, { label: 'EPS 年成長', min: -10, max: 30, value: st.g, fmt: (v) => `${v}%`, onInput: (v) => { st.g = v; r.redraw(); } });
    button(ui.ctrl, '🎲 重新產生', () => { st.seed = (st.seed * 7 + 13) % 9973; r.redraw(); });
    const r = responsive(ui.body, (width) => {
      const v = F.val();
      const nM = 36;
      const rand = M.rng(st.seed);
      const eps = []; const price = []; const labels = [];
      for (let i = 0; i < nM; i++) {
        const back = (nM - 1 - i) / 12;
        eps.push(v.eps / (1 + st.g / 100) ** back);
        const t = 2023 * 12 + 10 + i; labels.push(`${String(Math.floor(t / 12)).slice(2)}/${(t % 12) + 1}`);
      }
      let pe = 13 + rand() * 4;
      for (let i = 0; i < nM; i++) { pe = FIN.clamp(pe + M.gauss(rand) * 0.9 + (15.5 - pe) * 0.08, 9, 24); price.push(eps[i] * pe); }
      price[nM - 1] = v.price;
      const bands = st.mult.map((m, j) => ({ data: eps.map((e) => e * m), color: ['#16a34a', '#65a30d', '#ca8a04', '#ea580c', '#dc2626'][j], name: `${m} 倍` }));
      const bars = price.map((p, i) => ({ o: p, h: p, l: p, c: p, d: labels[i], prev: price[i - 1] || p, v: 0 }));
      const { svg, geo } = H.chart({ width, bars, noCandles: true, line: { data: price, color: '#0f172a' }, overlays: bands.map((b) => ({ data: b.data, color: b.color, width: 1.3, dash: '5 3' })), mainH: width < 520 ? 200 : 240, aria: '本益比河流圖' });
      const curPE = v.eps > 0 ? v.price / v.eps : null;
      const pos = curPE == null ? '虧損時本益比不適用' : curPE < st.mult[1] ? '落在<b class="down">偏低河道</b>（相對歷史便宜）' : curPE > st.mult[3] ? '落在<b class="up">偏高河道</b>（相對歷史昂貴）' : '落在<b>中間河道</b>';
      return {
        html: `<div class="w-readout"></div>${svg}${H.legend(bands.map((b) => [b.color, b.name]).concat([['#0f172a', '股價']]))}
          <div class="w-stats">${stat('本益比', curPE ? `${fmt(curPE, 1)} 倍` : '—', '', '股價 ÷ 近四季 EPS')}${stat('回本年數（概念）', curPE ? `約 ${fmt(curPE, 0)} 年` : '—', '', '假設獲利不變')}${stat('盈餘殖利率', curPE ? pctTxt(1 / curPE, 1) : '—', '', 'EPS ÷ 股價')}</div>
          <p class="w-note">目前 ${pos}。河流圖用的是「過去的倍數」，產業前景改變時，合理本益比也會跟著改變。</p>`,
        after: (h) => H.hover(h, geo, (i) => `${labels[i]}　股價 <b>${fmt(price[i], 0)}</b>　EPS ${fmt(eps[i], 2)}　本益比 <b>${fmt(price[i] / eps[i], 1)}</b> 倍`),
      };
    });
  });

  W.register('pb-calc', (el) => {
    const ui = shell(el, { icon: '📘', title: '股價淨值比（PB）', hint: 'PB = 股價 ÷ 每股淨值；也可用「ROE ÷ 要求報酬率」估算合理 PB', note: '「合理 PB ≈ ROE ÷ 要求報酬率」是假設 ROE 長期穩定的簡化估算，僅供觀念理解。' });
    const F = fields(ui.ctrl, [
      { key: 'price', label: '股價', value: 60, suffix: '元' }, { key: 'equity', label: '股東權益', value: 4800, suffix: '億' },
      { key: 'cap', label: '股本', value: 1300, suffix: '億元' }, { key: 'roe', label: 'ROE', value: 11, suffix: '%' }, { key: 'req', label: '要求報酬率', value: 8, suffix: '%' },
    ], () => calc());
    const out = node('<div class="w-out"></div>');
    ui.body.appendChild(out);
    function calc() {
      const v = F.val();
      const bvps = v.cap ? v.equity / (v.cap / 10) : 0;
      const pb = bvps ? v.price / bvps : 0;
      const fair = v.req ? v.roe / v.req : 0;
      out.innerHTML = `<div class="w-stats">${stat('每股淨值', `${fmt(bvps, 2)} 元`, '', '股東權益 ÷ 股數')}${stat('股價淨值比', `${fmt(pb, 2)} 倍`, pb < 1 ? 'good' : '', pb < 1 ? '股價低於每股淨值' : '股價高於每股淨值')}${stat('合理 PB（估）', `${fmt(fair, 2)} 倍`, '', 'ROE ÷ 要求報酬率')}${stat('對應價格', `${fmt(fair * bvps, 1)} 元`, '', '合理 PB × 每股淨值')}</div>
        <p class="w-note">${pb < fair ? '目前 PB 低於用 ROE 估的合理 PB：市場可能低估，也可能預期 ROE 會下滑（景氣循環股常見）。' : '目前 PB 高於估算值：市場預期 ROE 會更好，或價格已偏貴。'} PB 特別適合資產為主、獲利波動大的金融股與景氣循環股。</p>`;
    }
    calc();
  });

  W.register('dividend-calc', (el) => {
    const ui = shell(el, { icon: '💰', title: '殖利率與除權息參考價', hint: '輸入股利，算殖利率、除權息參考價，以及是否「填權息」', note: '參考價公式依證交所：（前一日收盤價 − 現金股利）÷（1 + 無償配股率）；無償配股率 = 股票股利（元）÷ 面額 10 元。未計稅負與二代健保補充保費。' });
    const F = fields(ui.ctrl, [
      { key: 'prev', label: '除權息前一日收盤', value: 100, suffix: '元' }, { key: 'cash', label: '現金股利', value: 4, step: 0.1, suffix: '元/股' },
      { key: 'stock', label: '股票股利', value: 0.5, step: 0.1, suffix: '元/股' }, { key: 'lots', label: '持有張數', value: 1, step: 1, suffix: '張' },
      { key: 'after', label: '除權息後某日股價', value: 99, step: 0.5, suffix: '元' },
    ], () => calc());
    const out = node('<div class="w-out"></div>');
    ui.body.appendChild(out);
    function calc() {
      const v = F.val();
      const ratio = v.stock / 10;
      const ref = (v.prev - v.cash) / (1 + ratio);
      const shares = v.lots * 1000;
      const cashIn = shares * v.cash; const newShares = Math.floor(shares * ratio);
      const yieldCash = v.prev ? v.cash / v.prev : 0;
      const filled = v.after >= v.prev;
      const valueAfter = (shares + newShares) * v.after + cashIn;
      out.innerHTML = `<div class="w-stats">${stat('現金殖利率', pctTxt(yieldCash, 2), '', '現金股利 ÷ 股價')}${stat('無償配股率', pctTxt(ratio, 1), '', `每張配 ${fmt(1000 * ratio, 0)} 股`)}${stat('除權息參考價', `${fmt(ref, 2)} 元`, 'good')}${stat('領到現金', `${fmt(cashIn, 0)} 元`, '', `＋ 配股 ${fmt(newShares, 0)} 股`)}</div>
        <p class="w-note">除權息後股價 ${fmt(v.after, 2)} 元：${filled ? '<b class="up">已填權息</b>（回到除權息前的價位，股利是真的賺到）' : v.after >= ref ? '<b>部分填息</b>（高於參考價、低於除權息前價位）' : '<b class="down">貼權息</b>（跌破參考價，領了股利但股價虧更多）'}。
        除權息前持股市值 ${fmt(shares * v.prev, 0)} 元 → 除權息後（股票 + 現金）${fmt(valueAfter, 0)} 元。除權息本身不會讓你變有錢，填息才會。</p>`;
    }
    calc();
  });

  const CF = {
    healthy: { t: '健康成長', d: '營業現金流穩定大於資本支出，自由現金流為正，有餘力配息與還債。', ocf: [120, 135, 150, 165, 180], capex: [-60, -65, -70, -75, -80], fin: [-50, -55, -60, -70, -75] },
    growth: { t: '擴張期', d: '營業現金流為正但大舉擴產，自由現金流暫時為負，靠借款或增資補資金。要看擴產能否帶來未來營收。', ocf: [80, 95, 110, 130, 150], capex: [-90, -140, -180, -170, -120], fin: [20, 50, 70, 40, -10] },
    burning: { t: '燒錢中', d: '本業還在流出現金，只能一直靠增資、借錢續命。新創或轉型期常見，風險最高。', ocf: [-30, -40, -35, -20, -25], capex: [-20, -30, -25, -15, -10], fin: [60, 70, 55, 40, 30] },
    borrow: { t: '借錢配息', d: '帳上有獲利，但自由現金流長期不足以支付股利，配息靠借款撐起來，不可能長久。', ocf: [60, 50, 55, 45, 40], capex: [-50, -55, -50, -50, -45], fin: [-10, 5, 0, 10, 8] },
  };
  W.register('cashflow-chart', (el) => {
    const ui = shell(el, { icon: '💵', title: '現金流情境：賺的錢有沒有收進來', hint: '自由現金流 = 營業活動現金流 − 資本支出；切換四種公司體質', note: '示意數字（億元）。融資活動：正數 = 借錢或增資進來，負數 = 還債或發股利出去。' });
    let cur = CF[el.dataset.scenario] ? el.dataset.scenario : 'healthy';
    seg(ui.ctrl, { options: Object.entries(CF).map(([k, v]) => [k, v.t]), value: cur, onChange: (v) => { cur = v; r.redraw(); } });
    const r = responsive(ui.body, (width) => {
      const c = CF[cur];
      const fcf = c.ocf.map((v, i) => v + c.capex[i]);
      const labels = ['第 1 年', '第 2 年', '第 3 年', '第 4 年', '第 5 年'];
      const { svg, geo } = barChart({
        width, labels, groups: [{ name: '營業', color: '#0d9488', data: c.ocf }, { name: '資本支出', color: '#94a3b8', data: c.capex }, { name: '融資', color: '#7c3aed', data: c.fin }],
        lines: [{ name: '自由現金流', color: '#e11d48', data: fcf }], yFmt: (t) => fmt(t, 0), aria: '現金流示意圖', labelW: 50,
      });
      const sum = fcf.reduce((a, b) => a + b, 0);
      return {
        html: `<div class="w-readout"></div>${svg}${H.legend([['#0d9488', '營業活動現金流'], ['#94a3b8', '資本支出'], ['#7c3aed', '融資活動現金流'], ['#e11d48', '自由現金流']])}
          <div class="w-explain"><b>${esc(c.t)}</b>：${esc(c.d)} 五年自由現金流合計 <b class="${sum >= 0 ? 'up' : 'down'}">${sign(sum, 0)}</b> 億。</div>`,
        after: (h) => H.barHover(h, geo, (i) => `${labels[i]}　營業 ${fmt(c.ocf[i], 0)}　資本支出 ${fmt(c.capex[i], 0)}　自由現金流 <b class="${fcf[i] >= 0 ? 'up' : 'down'}">${fmt(fcf[i], 0)}</b>　融資 ${fmt(c.fin[i], 0)}`),
      };
    });
  });

  W.register('debt-calc', (el) => {
    const ui = shell(el, { icon: '🚦', title: '財務安全紅綠燈', hint: '負債比率、流動比率、速動比率、利息保障倍數', note: '燈號門檻是一般經驗值，不同產業差異很大（銀行、壽險本來就是高負債行業），只能當作找問題的起點。' });
    const F = fields(ui.ctrl, [
      { key: 'ta', label: '總資產', value: 1000, suffix: '億' }, { key: 'tl', label: '總負債', value: 520, suffix: '億' },
      { key: 'ca', label: '流動資產', value: 420, suffix: '億' }, { key: 'inv', label: '存貨', value: 150, suffix: '億' },
      { key: 'pre', label: '預付款項', value: 20, suffix: '億' }, { key: 'cl', label: '流動負債', value: 300, suffix: '億' },
      { key: 'ebit', label: '稅前息前利益', value: 90, suffix: '億' }, { key: 'int', label: '利息費用', value: 12, suffix: '億' },
    ], () => calc());
    const out = node('<div class="w-out"></div>');
    ui.body.appendChild(out);
    const light = (lvl) => ({ g: '🟢', y: '🟡', r: '🔴' }[lvl]);
    function calc() {
      const v = F.val();
      const dr = v.ta ? v.tl / v.ta : 0; const cr = v.cl ? v.ca / v.cl : 0; const qr = v.cl ? (v.ca - v.inv - v.pre) / v.cl : 0; const ic = v.int ? v.ebit / v.int : Infinity;
      const rows = [
        ['負債比率', pctTxt(dr, 1), '總負債 ÷ 總資產', dr < 0.5 ? 'g' : dr < 0.7 ? 'y' : 'r', '< 50% 綠、50–70% 黃、> 70% 紅'],
        ['流動比率', pctTxt(cr, 0), '流動資產 ÷ 流動負債', cr >= 2 ? 'g' : cr >= 1 ? 'y' : 'r', '≥ 200% 綠、100–200% 黃、< 100% 紅'],
        ['速動比率', pctTxt(qr, 0), '（流動資產 − 存貨 − 預付款項）÷ 流動負債', qr >= 1 ? 'g' : qr >= 0.5 ? 'y' : 'r', '≥ 100% 綠、50–100% 黃、< 50% 紅'],
        ['利息保障倍數', isFinite(ic) ? `${fmt(ic, 1)} 倍` : '無利息', '稅前息前利益 ÷ 利息費用', ic >= 10 ? 'g' : ic >= 3 ? 'y' : 'r', '≥ 10 倍綠、3–10 倍黃、< 3 倍紅'],
      ];
      const reds = rows.filter((x) => x[3] === 'r').length;
      out.innerHTML = `<table class="tbl"><thead><tr><th>指標</th><th>數值</th><th>公式</th><th>燈號</th></tr></thead><tbody>${rows.map((x) =>
        `<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td><small>${esc(x[2])}</small></td><td title="${esc(x[4])}">${light(x[3])}</td></tr>`).join('')}</tbody></table>
        <p class="w-note">${reds ? `有 ${reds} 個紅燈：短期償債或利息負擔可能吃緊，記得追蹤現金流與借款到期。` : '沒有紅燈，財務結構相對穩健。'}</p>`;
    }
    calc();
  });

  W.register('valuation-lab', (el) => {
    const ui = shell(el, { icon: '🧪', title: '估值實驗室：三種方法算便宜價與昂貴價', hint: '本益比法、股價淨值比法、殖利率法各給一個區間；越多方法重疊，結論越有參考性', note: '倍數與殖利率區間請用該公司自己的歷史數據與同業比較；這只是計算工具，不構成投資建議。' });
    const F = fields(ui.ctrl, [
      { key: 'price', label: '目前股價', value: 520, suffix: '元' }, { key: 'eps', label: '近四季 EPS', value: 32, suffix: '元' },
      { key: 'pe1', label: '本益比 低／中／高', value: 13, suffix: '倍' }, { key: 'pe2', label: ' ', value: 16, suffix: '倍' }, { key: 'pe3', label: ' ', value: 20, suffix: '倍' },
      { key: 'bvps', label: '每股淨值', value: 150, suffix: '元' }, { key: 'pb1', label: 'PB 低／中／高', value: 2.5, suffix: '倍' }, { key: 'pb2', label: ' ', value: 3.3, suffix: '倍' }, { key: 'pb3', label: ' ', value: 4.2, suffix: '倍' },
      { key: 'div', label: '每年現金股利', value: 16, suffix: '元' }, { key: 'y1', label: '殖利率 高／中／低', value: 4.5, suffix: '%' }, { key: 'y2', label: ' ', value: 3.5, suffix: '%' }, { key: 'y3', label: ' ', value: 2.5, suffix: '%' },
    ], () => r.redraw());
    const r = responsive(ui.body, (width) => {
      const v = F.val();
      const rows = [
        ['本益比法', [v.eps * v.pe1, v.eps * v.pe2, v.eps * v.pe3], 'EPS × 倍數'],
        ['淨值比法', [v.bvps * v.pb1, v.bvps * v.pb2, v.bvps * v.pb3], '每股淨值 × 倍數'],
        ['殖利率法', [v.y1 ? v.div / (v.y1 / 100) : 0, v.y2 ? v.div / (v.y2 / 100) : 0, v.y3 ? v.div / (v.y3 / 100) : 0], '股利 ÷ 殖利率'],
      ];
      const all = rows.flatMap((x) => x[1]).concat([v.price]);
      const lo = Math.min(...all) * 0.9; const hi = Math.max(...all) * 1.08;
      const Wd = width; const rowH = 46; const padL = width < 520 ? 70 : 90; const padR = 16; const Hh = rows.length * rowH + 34;
      const X = (p) => padL + (p - lo) / (hi - lo) * (Wd - padL - padR);
      let svg = `<svg class="w-svg" viewBox="0 0 ${Wd} ${Hh}" width="${Wd}" height="${Hh}" role="img" aria-label="估值區間">`;
      rows.forEach(([t, [a, b, c]], i) => {
        const y = 14 + i * rowH;
        svg += `<text x="6" y="${y + 18}" class="w-lbl">${t}</text>`;
        svg += `<rect x="${X(a)}" y="${y + 6}" width="${Math.max(2, X(b) - X(a))}" height="18" fill="#16a34a" fill-opacity=".25"/>`;
        svg += `<rect x="${X(b)}" y="${y + 6}" width="${Math.max(2, X(c) - X(b))}" height="18" fill="#dc2626" fill-opacity=".22"/>`;
        [[a, '便宜'], [b, '合理'], [c, '昂貴']].forEach(([p, l]) => { svg += `<text x="${X(p)}" y="${y + 38}" class="w-ax" text-anchor="middle">${l} ${fmt(p, 0)}</text>`; });
      });
      svg += `<line x1="${X(v.price)}" x2="${X(v.price)}" y1="6" y2="${Hh - 8}" stroke="#0f172a" stroke-width="2"/><text x="${X(v.price) + 4}" y="12" class="w-lbl">目前 ${fmt(v.price, 0)}</text>`;
      svg += '</svg>';
      const fairs = rows.map((x) => x[1][1]);
      const avg = fairs.reduce((a, b) => a + b, 0) / fairs.length;
      return { html: `${svg}<div class="w-stats">${stat('三法合理價平均', `${fmt(avg, 0)} 元`)}${stat('目前股價 vs 合理價', pctTxt(v.price / avg - 1, 1), v.price < avg ? 'good' : '')}${stat('最保守便宜價', `${fmt(Math.min(...rows.map((x) => x[1][0])), 0)} 元`)}</div>` };
    });
  });
})();

</script>
  <script>/* js/widgets_market.js */
/* 財經學院 — widgets_market.js
 * 籌碼面與消息面的互動元件：三大法人買賣超、融資融券、信用交易試算、券商分點、當沖、集保股權分散、籌碼儀表板、
 * 台股行事曆、總經數據速查、利率與估值、美股台股連動、匯率與資金流、情緒溫度計、假消息檢核表。
 */
(function () {
  'use strict';
  const FIN = window.FIN;
  const M = FIN.math;
  const W = FIN.widgets;
  const H = W.helpers;
  const C = W.colors;
  const esc = (s) => FIN.esc(s);
  const fmt = (v, dp) => FIN.fmtNum(v, dp);
  const { shell, node, seg, slider, button, fields, stat, responsive, pctTxt, sign, toggle } = H;

  // ---------------------------------------------------------------------------
  // 籌碼面
  // ---------------------------------------------------------------------------
  function priceFrom(rand, n, start, drift) {
    const p = [start];
    for (let i = 1; i < n; i++) p.push(M.roundTick(p[i - 1] * (1 + drift[i] + M.gauss(rand) * 0.011)));
    return p;
  }
  function dayLabels(n) { return M.tradingDates(n); }

  W.register('inst-flow', (el) => {
    const focus = ['all', 'foreign', 'trust', 'dealer'].includes(el.dataset.focus) ? el.dataset.focus : 'all';
    const ui = shell(el, { icon: '🏦', title: '三大法人買賣超（20 個交易日）', hint: '柱狀 = 每日買賣超張數（正 = 買超、負 = 賣超），黑線 = 股價；可切換看累計' });
    const st = { who: focus, cum: false, seed: W.seedOf(el, 9) };
    seg(ui.ctrl, { options: [['all', '三大法人'], ['foreign', '外資'], ['trust', '投信'], ['dealer', '自營商']], value: st.who, onChange: (v) => { st.who = v; r.redraw(); } });
    toggle(ui.ctrl, '顯示累計買賣超', st.cum, (v) => { st.cum = v; r.redraw(); });
    button(ui.ctrl, '🎲 重新產生', () => { st.seed = (st.seed * 7 + 13) % 9973; r.redraw(); });
    const r = responsive(ui.body, (width) => {
      const n = 20;
      const rand = M.rng(st.seed);
      const fo = []; const tr = []; const de = []; const deH = [];
      for (let i = 0; i < n; i++) {
        const phase = i / n;
        fo.push(Math.round((st.who === 'foreign' ? (phase < 0.3 ? -1800 : 2600) : 900 * Math.sin(phase * 6 + st.seed)) + M.gauss(rand) * 1400));
        tr.push(Math.round((st.who === 'trust' ? 650 + rand() * 500 : 120 * Math.cos(phase * 5)) + M.gauss(rand) * (st.who === 'trust' ? 150 : 260)));
        const self = Math.round(M.gauss(rand) * 420);
        const hedge = Math.round(M.gauss(rand) * 360 + (st.who === 'dealer' ? 250 * Math.sin(phase * 9) : 0));
        de.push(self + hedge); deH.push(hedge);
      }
      const tot = fo.map((v, i) => v + tr[i] + de[i]);
      const drift = tot.map((v) => v / 120000);
      const price = priceFrom(rand, n, 168 + (st.seed % 5) * 20, drift);
      const labels = dayLabels(n);
      const cum = (a) => a.reduce((acc, v, i) => { acc.push((acc[i - 1] || 0) + v); return acc; }, []);
      const pick = { all: null, foreign: fo, trust: tr, dealer: de }[st.who];
      const groups = st.who === 'all'
        ? [{ name: '外資', color: C.foreign, data: st.cum ? cum(fo) : fo }, { name: '投信', color: C.trust, data: st.cum ? cum(tr) : tr }, { name: '自營商', color: C.dealer, data: st.cum ? cum(de) : de }]
        : [{ name: '', data: st.cum ? cum(pick) : pick, colorOf: (v) => (v >= 0 ? C.up : C.down) }];
      const { svg, geo } = H.barChart({ width, labels, groups, stacked: st.who === 'all' && !st.cum, lines: [{ name: '股價', color: '#0f172a', data: price, axis: 'right' }], yFmt: (t) => fmt(t, 0), y2Fmt: (t) => fmt(t, 0), aria: '三大法人買賣超示意圖', labelW: 44 });
      const streak = (a) => { let k = 0; for (let i = a.length - 1; i >= 0 && a[i] > 0; i--) k++; if (k) return `連買 ${k} 日`; for (let i = a.length - 1; i >= 0 && a[i] < 0; i--) k++; return k ? `連賣 ${k} 日` : '—'; };
      const sum = (a) => a.reduce((x, y) => x + y, 0);
      return {
        html: `<div class="w-readout"></div>${svg}${H.legend(st.who === 'all' ? [[C.foreign, '外資'], [C.trust, '投信'], [C.dealer, '自營商'], ['#0f172a', '股價（右軸）']] : [[C.up, '買超'], [C.down, '賣超'], ['#0f172a', '股價（右軸）']])}
          <div class="w-stats">${stat('外資 20 日', `${sign(sum(fo), 0)} 張`, '', streak(fo))}${stat('投信 20 日', `${sign(sum(tr), 0)} 張`, '', streak(tr))}${stat('自營商 20 日', `${sign(sum(de), 0)} 張`, '', `其中避險 ${sign(sum(deH), 0)} 張`)}${stat('三大法人合計', `${sign(sum(tot), 0)} 張`)}</div>`,
        after: (h) => H.barHover(h, geo, (i) => `${labels[i]}　外資 <b class="${fo[i] >= 0 ? 'up' : 'down'}">${sign(fo[i], 0)}</b>　投信 <b class="${tr[i] >= 0 ? 'up' : 'down'}">${sign(tr[i], 0)}</b>　自營商 <b class="${de[i] >= 0 ? 'up' : 'down'}">${sign(de[i], 0)}</b>（避險 ${sign(deH[i], 0)}）張　股價 ${fmt(price[i], 1)}`),
      };
    });
  });

  const MC = {
    chase: { t: '散戶追價', d: '股價上漲時融資餘額同步大增：買盤多來自借錢的散戶，籌碼變得凌亂，一旦回檔容易引發融資斷頭賣壓。' },
    squeeze: { t: '軋空行情', d: '股價上漲、融券餘額卻不減反增，券資比衝高：空方被套，若遇到強制回補日或股價續強，空單被迫買回，推升股價（軋空）。' },
    calm: { t: '籌碼安定', d: '股價溫和上漲、融資沒有暴增：上漲主要由現股或法人推動，信用交易籌碼相對乾淨。' },
  };
  W.register('margin-chart', (el) => {
    const ui = shell(el, { icon: '💳', title: '融資融券餘額與券資比（30 個交易日）', hint: '藍柱 = 融資餘額、粉柱 = 融券餘額（張）；紅線 = 券資比（右軸 %）', note: '券資比 = 融券餘額 ÷ 融資餘額 × 100%。示意資料。' });
    let cur = MC[el.dataset.scenario] ? el.dataset.scenario : 'chase';
    seg(ui.ctrl, { options: Object.entries(MC).map(([k, v]) => [k, v.t]), value: cur, onChange: (v) => { cur = v; r.redraw(); } });
    const r = responsive(ui.body, (width) => {
      const n = 30;
      const rand = M.rng(31 + Object.keys(MC).indexOf(cur));
      const margin = []; const short = []; const price = [];
      let mg = 12000; let sh = cur === 'squeeze' ? 2600 : 900; let p = 80;
      for (let i = 0; i < n; i++) {
        const ph = i / n;
        if (cur === 'chase') { mg *= 1 + 0.02 + rand() * 0.012; sh *= 1 + M.gauss(rand) * 0.03; p *= 1 + 0.008 + M.gauss(rand) * 0.012; if (ph > 0.8) { p *= 0.975; mg *= 0.985; } }
        if (cur === 'squeeze') { mg *= 1 + M.gauss(rand) * 0.01; sh *= ph < 0.75 ? 1 + 0.035 + rand() * 0.02 : 0.86; p *= 1 + (ph < 0.75 ? 0.006 : 0.035) + M.gauss(rand) * 0.01; }
        if (cur === 'calm') { mg *= 1 + M.gauss(rand) * 0.006; sh *= 1 + M.gauss(rand) * 0.02; p *= 1 + 0.004 + M.gauss(rand) * 0.01; }
        margin.push(Math.round(mg)); short.push(Math.round(sh)); price.push(M.roundTick(p));
      }
      const ratio = short.map((s, i) => s / margin[i] * 100);
      const labels = dayLabels(n);
      const { svg, geo } = H.barChart({ width, labels, groups: [{ name: '融資', color: '#3b82f6', data: margin, opacity: 0.55 }, { name: '融券', color: '#db2777', data: short, opacity: 0.7 }],
        lines: [{ name: '券資比', color: '#e11d48', data: ratio, axis: 'right' }], yFmt: (t) => fmt(t, 0), y2Fmt: (t) => `${fmt(t, 0)}%`, aria: '融資融券示意圖', labelW: 44 });
      const last = n - 1;
      return {
        html: `<div class="w-readout"></div>${svg}<div class="w-stats">${stat('融資 30 日變化', pctTxt(margin[last] / margin[0] - 1, 1))}${stat('融券 30 日變化', pctTxt(short[last] / short[0] - 1, 1))}${stat('最新券資比', `${fmt(ratio[last], 1)}%`, ratio[last] > 30 ? 'bad' : '')}${stat('股價 30 日', pctTxt(price[last] / price[0] - 1, 1))}</div>
          <div class="w-explain"><b>${esc(MC[cur].t)}</b>：${esc(MC[cur].d)}</div>`,
        after: (h) => H.barHover(h, geo, (i) => `${labels[i]}　融資 <b>${fmt(margin[i], 0)}</b> 張　融券 <b>${fmt(short[i], 0)}</b> 張　券資比 <b>${fmt(ratio[i], 1)}%</b>　股價 ${fmt(price[i], 1)}`),
      };
    });
  });

  W.register('margin-calc', (el) => {
    const ui = shell(el, { icon: '🧯', title: '融資融券試算：維持率與追繳價', hint: '以單一個股示意：融資 6 成（自備 4 成）、融券保證金 9 成、維持率低於 130% 會被追繳', note: '實務上券商以「整戶擔保維持率」合併計算所有信用部位，且會依處置、注意股等狀況調整成數；手續費、利息、借券費未計入。' });
    let mode = 'long';
    seg(ui.ctrl, { options: [['long', '融資買進（看多）'], ['short', '融券賣出（看空）']], value: mode, onChange: (v) => { mode = v; calc(); } });
    const F = fields(ui.ctrl, [
      { key: 'price', label: '成交價', value: 100, step: 0.5, suffix: '元' }, { key: 'lots', label: '張數', value: 2, step: 1, suffix: '張' },
      { key: 'now', label: '目前股價', value: 85, step: 0.5, suffix: '元' },
    ], () => calc());
    const out = node('<div class="w-out"></div>');
    ui.body.appendChild(out);
    function calc() {
      const v = F.val();
      const shares = v.lots * 1000; const amt = v.price * shares;
      if (!(amt > 0)) { out.innerHTML = ''; return; }
      if (mode === 'long') {
        const loan = amt * 0.6; const own = amt - loan;
        const ratio = v.now * shares / loan;
        const callPx = loan * 1.3 / shares;
        const pl = (v.now - v.price) * shares;
        out.innerHTML = `<div class="w-stats">${stat('成交金額', `${fmt(amt, 0)} 元`)}${stat('自備款（4 成）', `${fmt(own, 0)} 元`)}${stat('融資金額（6 成）', `${fmt(loan, 0)} 元`)}
          ${stat('目前維持率', `${fmt(ratio * 100, 1)}%`, ratio < 1.3 ? 'bad' : ratio < 1.45 ? 'warn' : 'good', '股票市值 ÷ 融資金額')}
          ${stat('追繳價（130%）', `${fmt(callPx, 2)} 元`, '', `比成交價 ${pctTxt(callPx / v.price - 1, 1)}`)}${stat('帳面損益', `<span class="${pl >= 0 ? 'up' : 'down'}">${sign(pl, 0)}</span> 元`, '', `本金報酬 ${pctTxt(pl / own, 1)}`)}</div>
          <p class="w-note">剛買進時維持率 = 1 ÷ 0.6 ≈ 166.7%；股價跌約 22% 就會低於 130% 被追繳。槓桿讓自備款的報酬放大約 2.5 倍——虧損也一樣。${ratio < 1.3 ? '<b class="down">⚠️ 已低於 130%：須在 2 個營業日內補繳，否則可能被斷頭。</b>' : ''}</p>`;
      } else {
        const margin = amt * 0.9; const collateral = amt;
        const ratio = (margin + collateral) / (v.now * shares);
        const callPx = (margin + collateral) / 1.3 / shares;
        const pl = (v.price - v.now) * shares;
        out.innerHTML = `<div class="w-stats">${stat('賣出價款（擔保品）', `${fmt(collateral, 0)} 元`)}${stat('融券保證金（9 成）', `${fmt(margin, 0)} 元`)}
          ${stat('目前維持率', `${fmt(ratio * 100, 1)}%`, ratio < 1.3 ? 'bad' : ratio < 1.45 ? 'warn' : 'good', '（保證金 + 擔保價款）÷ 股票市值')}
          ${stat('追繳價（130%）', `${fmt(callPx, 2)} 元`, '', `比成交價 ${pctTxt(callPx / v.price - 1, 1)}`)}${stat('帳面損益', `<span class="${pl >= 0 ? 'up' : 'down'}">${sign(pl, 0)}</span> 元`, '', `保證金報酬 ${pctTxt(pl / margin, 1)}`)}</div>
          <p class="w-note">融券是借股票來賣、看跌才賺；股價上漲約 46% 會跌破 130%。放空的虧損理論上沒有上限，還可能遇到股東會、除權息前的強制回補。</p>`;
      }
    }
    calc();
  });

  W.register('broker-table', (el) => {
    const ui = shell(el, { icon: '🕵️', title: '券商分點買賣超（示意）', hint: '看「誰在買、誰在賣」與籌碼集中度；分點名稱為虛構', note: '集中度 =（前 15 大買超分點合計 − 前 15 大賣超分點合計）÷ 區間成交量。實際分點資料可在證交所／櫃買中心的買賣日報表查詢。' });
    const st = { days: '5', seed: W.seedOf(el, 41) };
    seg(ui.ctrl, { label: '區間', options: [['1', '1 日'], ['5', '5 日'], ['20', '20 日']], value: st.days, onChange: (v) => { st.days = v; draw(); } });
    button(ui.ctrl, '🎲 重新產生', () => { st.seed = (st.seed * 7 + 13) % 9973; draw(); });
    const box = node('<div></div>');
    ui.body.appendChild(box);
    const CITIES = ['台北', '新竹', '台中', '台南', '高雄', '板橋', '桃園', '內湖', '信義', '敦南', '松山', '中壢', '彰化', '嘉義', '鳳山', '新莊', '士林', '大安'];
    function draw() {
      const rand = M.rng(st.seed + +st.days);
      const d = +st.days;
      const vol = Math.round(30000 * d * (0.8 + rand() * 0.4));
      const mk = (k, signDir) => Array.from({ length: 15 }, (_, i) => ({
        name: `${'甲乙丙丁戊己庚辛壬癸'[Math.floor(rand() * 10)]}證券－${CITIES[Math.floor(rand() * CITIES.length)]}`,
        v: Math.round(signDir * (vol * 0.06 * Math.exp(-i * 0.28) * (0.7 + rand() * 0.6))),
        avg: 0, k,
      }));
      const buys = mk('b', 1); const sells = mk('s', -1);
      if (d === 1) { buys[0].tag = '常見隔日沖'; }
      const sb = buys.reduce((a, x) => a + x.v, 0); const ss = sells.reduce((a, x) => a + x.v, 0);
      const conc = (sb + ss) / vol;
      const row = (x) => `<tr><td>${esc(x.name)}${x.tag ? ` <span class="chip warn">${esc(x.tag)}</span>` : ''}</td><td class="num ${x.v >= 0 ? 'up' : 'down'}">${sign(x.v, 0)}</td></tr>`;
      box.innerHTML = `<div class="w-two"><table class="tbl"><thead><tr><th>買超前 15 分點</th><th class="num">張</th></tr></thead><tbody>${buys.map(row).join('')}</tbody></table>
        <table class="tbl"><thead><tr><th>賣超前 15 分點</th><th class="num">張</th></tr></thead><tbody>${sells.map(row).join('')}</tbody></table></div>
        <div class="w-stats">${stat('區間成交量', `${fmt(vol, 0)} 張`)}${stat('前 15 大買超合計', `${fmt(sb, 0)} 張`)}${stat('前 15 大賣超合計', `${fmt(ss, 0)} 張`)}${stat(`${d} 日集中度`, pctTxt(conc, 1), conc > 0.1 ? 'good' : conc < 0 ? 'bad' : '')}</div>
        <p class="w-note">集中度為正、且主要買超分點連續多日買進，代表籌碼往少數人集中；若是只買一天、隔天就賣（隔日沖），參考價值就低。</p>`;
    }
    draw();
  });

  W.register('daytrade-calc', (el) => {
    const ui = shell(el, { icon: '⚡', title: '當沖比與當沖成本', hint: '當沖比 = 當沖成交股數 ÷ 總成交股數；再算一趟當沖要付多少成本', note: '現股當沖賣出證交稅減半為 0.15%（適用至 2027-12-31）；手續費上限 0.1425%，買賣各收一次。熱度分級為一般經驗值。' });
    const F = fields(ui.ctrl, [
      { key: 'vol', label: '當日總成交量', value: 50000, step: 1000, suffix: '張' }, { key: 'dt', label: '當沖成交量', value: 21000, step: 500, suffix: '張' },
      { key: 'buy', label: '買進價', value: 100, step: 0.5, suffix: '元' }, { key: 'sell', label: '賣出價', value: 101, step: 0.5, suffix: '元' },
      { key: 'lots', label: '張數', value: 5, step: 1, suffix: '張' }, { key: 'disc', label: '手續費折扣', value: 6, step: 0.5, suffix: '折' },
    ], () => calc());
    const out = node('<div class="w-out"></div>');
    ui.body.appendChild(out);
    function calc() {
      const v = F.val();
      const ratio = v.vol ? v.dt / v.vol : 0;
      const fee = 0.001425 * FIN.clamp(v.disc, 0, 10) / 10;
      const sh = v.lots * 1000;
      const cost = sh * v.buy * fee + sh * v.sell * (fee + 0.0015);
      const pl = (v.sell - v.buy) * sh - cost;
      const be = (v.buy * (1 + fee)) / (1 - fee - 0.0015);
      const heat = ratio >= 0.4 ? ['bad', '過熱：短線資金主導，股價波動與追高風險大'] : ratio >= 0.25 ? ['warn', '偏熱：當沖客明顯，留意尾盤回補造成的震盪'] : ['good', '一般'];
      out.innerHTML = `<div class="w-stats">${stat('當沖比', pctTxt(ratio, 1), heat[0], heat[1])}${stat('一趟交易成本', `${fmt(cost, 0)} 元`, '', `手續費 ×2 ＋ 證交稅 0.15%`)}
        ${stat('淨損益', `<span class="${pl >= 0 ? 'up' : 'down'}">${sign(pl, 0)}</span> 元`, '', `價差 ${sign((v.sell - v.buy) * sh, 0)} 元`)}${stat('損益兩平賣價', `${fmt(be, 2)} 元`, '', `要漲 ${pctTxt(be / v.buy - 1, 2)}`)}</div>`;
    }
    calc();
  });

  W.register('holder-dist', (el) => {
    const ui = shell(el, { icon: '👥', title: '集保股權分散：大戶 vs 散戶', hint: '左：15 個持股級距的分布；右：千張大戶持股比例與散戶人數的 12 週變化', note: '集保結算所每週公布；級距依持股股數劃分，第 15 級 = 1,000 張（1,000,001 股）以上。示意資料。' });
    let sc = 'concentrate'; let view = 'shares';

    seg(ui.ctrl, { label: '看', options: [['shares', '持股比例'], ['people', '人數比例']], value: view, onChange: (v) => { view = v; r.redraw(); } });
    const LV = ['1-999股', '1-5張', '5-10', '10-15', '15-20', '20-30', '30-40', '40-50', '50-100', '100-200', '200-400', '400-600', '600-800', '800-1000', '1000張+'];
    const r = responsive(ui.body, (width) => {
      const people = [38, 42, 8.5, 3.2, 1.8, 1.9, 1.0, 0.6, 1.2, 0.7, 0.45, 0.2, 0.1, 0.07, 0.28];
      const sharesBase = [0.6, 6.5, 4.2, 2.6, 1.9, 2.8, 2.1, 1.6, 4.6, 4.4, 4.9, 3.2, 2.3, 1.8, 56.5];
      const tilt = sc === 'concentrate' ? 1 : -1;
      const weeks = 12;
      const big = []; const retail = []; const wl = [];
      for (let w = 0; w < weeks; w++) { big.push(56.5 + tilt * w * 0.35); retail.push(Math.round(41000 - tilt * w * 900)); wl.push(`W${w + 1}`); }
      const shares = sharesBase.map((v, i) => (i === 14 ? big[weeks - 1] : v * (100 - big[weeks - 1]) / (100 - 56.5)));
      const data = view === 'shares' ? shares : people;
      const half = width < 640 ? width : Math.floor(width / 2) - 8;
      const a = H.barChart({ width: half, height: 170, labels: LV.map((l, i) => String(i + 1)), groups: [{ data, colorOf: (v, i) => (i >= 11 ? '#7c3aed' : i <= 1 ? '#94a3b8' : '#a78bfa') }], yFmt: (t) => `${fmt(t, 0)}%`, labelW: 18, aria: '持股級距分布' });
      const b = H.barChart({ width: half, height: 170, labels: wl, groups: [{ data: retail.map((x) => x / 1000), color: '#cbd5e1', opacity: 0.9 }], lines: [{ name: '千張大戶 %', color: '#7c3aed', data: big, axis: 'right' }], yFmt: (t) => `${fmt(t, 0)}k`, y2Fmt: (t) => `${fmt(t, 1)}%`, labelW: 30, aria: '大戶與散戶趨勢' });

        html: `<div class="w-center">${svg}</div><div class="w-stats">${stat('相關係數', fmt(corr, 2))}${stat('同方向的天數', pctTxt(same, 0))}${stat('迴歸斜率（beta）', fmt(beta, 2), '', `費半 +1% → 台股平均 ${sign(beta, 2)}%`)}</div>
          <p class="w-note">台股收盤（13:30）後美股才開盤，所以美股的漲跌常在隔天早上反映到台股。相關性高也只是「傾向」：就算相關係數 0.6，仍有不少天走勢相反。</p>`,
      };
    });
  });

  W.register('fx-flow', (el) => {
    const ui = shell(el, { icon: '💱', title: '新台幣匯率與外資買賣超', hint: '柱 = 外資買賣超（億元）、線 = 美元兌新台幣（數字變小 = 新台幣升值）', note: '示意資料。實際匯率也受出口商結匯、央行調節、美元強弱與壽險避險等因素影響。' });
    const st = { k: 0.7, seed: W.seedOf(el, 88) };
    slider(ui.ctrl, { label: '資金流對匯率的影響', min: 0, max: 1, step: 0.1, value: st.k, fmt: (v) => v.toFixed(1), onInput: (v) => { st.k = v; r.redraw(); } });
    button(ui.ctrl, '🎲 重新產生', () => { st.seed = (st.seed * 7 + 13) % 9973; r.redraw(); });
    const r = responsive(ui.body, (width) => {
      const rand = M.rng(st.seed);
      const n = 40;
      const flow = []; const fx = [];
      let rate = 32.0;
      for (let i = 0; i < n; i++) {
        const f = Math.round((Math.sin(i / 6 + st.seed) * 120 + M.gauss(rand) * 90));
        flow.push(f);
        rate = rate - st.k * f * 0.00045 + M.gauss(rand) * 0.03 * (1 - st.k * 0.6) + (32 - rate) * 0.02;
        fx.push(+rate.toFixed(3));
      }
      const labels = M.tradingDates(n);
      const { svg, geo } = H.barChart({ width, labels, groups: [{ data: flow, colorOf: (v) => (v >= 0 ? C.up : C.down) }], lines: [{ name: 'USD/TWD', color: '#0f172a', data: fx, axis: 'right' }], yFmt: (t) => fmt(t, 0), y2Fmt: (t) => fmt(t, 2), labelW: 44, aria: '匯率與外資示意圖' });
      const sum = flow.reduce((a, b) => a + b, 0);
      const dfx = fx[n - 1] - fx[0];
      const ch = flow.slice(1).map((f, i) => [f, fx[i + 1] - fx[i]]);
      const corr = M.corr(ch.map((x) => x[0]), ch.map((x) => x[1]));
      return {
        html: `<div class="w-readout"></div>${svg}<div class="w-stats">${stat('外資累計', `${sign(sum, 0)} 億元`)}${stat('匯率變化', `${fmt(fx[0], 2)} → ${fmt(fx[n - 1], 2)}`, '', dfx < 0 ? '新台幣升值' : '新台幣貶值')}${stat('買超 vs 匯率變動相關', fmt(corr, 2), '', '負值 = 外資買、台幣升')}</div>
          <p class="w-note">外資匯入買台股要先把美元換成新台幣 → 推升新台幣；大舉賣超匯出則相反。所以「台幣升值 + 外資買超」常同時出現，但因果可能互為表裡。</p>`,
        after: (h) => H.barHover(h, geo, (i) => `${labels[i]}　外資 <b class="${flow[i] >= 0 ? 'up' : 'down'}">${sign(flow[i], 0)}</b> 億元　USD/TWD <b>${fmt(fx[i], 3)}</b>`),
      };
    });
  });

  W.register('sentiment-gauge', (el) => {
    const ui = shell(el, { icon: '🌡️', title: '市場情緒溫度計', hint: '拉動各項指標，看市場是恐懼還是貪婪', note: '分數換算為教學示意（非任何官方指數）。極端情緒常是反向參考：別人恐懼時要冷靜，別人貪婪時要謹慎。' });
    const st = { vix: 18, mr: 165, sr: 8, vol: 1.2, nh: 40 };
    const ctl = node('<div class="w-sliders"></div>');
    ui.ctrl.appendChild(ctl);
    slider(ctl, { label: 'VIX 恐慌指數', min: 10, max: 60, value: st.vix, onInput: (v) => { st.vix = v; calc(); } });
    slider(ctl, { label: '大盤融資維持率', min: 130, max: 200, value: st.mr, fmt: (v) => `${v}%`, onInput: (v) => { st.mr = v; calc(); } });
    slider(ctl, { label: '市場券資比', min: 0, max: 30, value: st.sr, fmt: (v) => `${v}%`, onInput: (v) => { st.sr = v; calc(); } });
    slider(ctl, { label: '成交量 ÷ 20 日均量', min: 0.5, max: 2.5, step: 0.1, value: st.vol, fmt: (v) => `${v.toFixed(1)} 倍`, onInput: (v) => { st.vol = v; calc(); } });
    slider(ctl, { label: '創新高 − 創新低家數', min: -200, max: 200, step: 10, value: st.nh, fmt: (v) => sign(v, 0), onInput: (v) => { st.nh = v; calc(); } });
    const out = node('<div class="w-out"></div>');
    ui.body.appendChild(out);
    function calc() {
      const parts = [
        ['VIX', FIN.clamp((40 - st.vix) / 30, 0, 1)],
        ['融資維持率', FIN.clamp((st.mr - 140) / 50, 0, 1)],
        ['券資比', FIN.clamp(1 - st.sr / 25, 0, 1)],
        ['成交量', FIN.clamp((st.vol - 0.6) / 1.4, 0, 1)],
        ['新高新低', FIN.clamp((st.nh + 150) / 300, 0, 1)],
      ];
      const score = Math.round(parts.reduce((a, x) => a + x[1], 0) / parts.length * 100);
      const lab = score >= 80 ? ['極度貪婪', '#dc2626'] : score >= 60 ? ['貪婪', '#f97316'] : score >= 40 ? ['中性', '#64748b'] : score >= 20 ? ['恐懼', '#0ea5e9'] : ['極度恐懼', '#1d4ed8'];
      const ang = Math.PI * (1 - score / 100);
      const cx = 130; const cy = 120; const R = 100;
      let svg = '<svg viewBox="0 0 260 140" class="w-svg w-gauge" role="img" aria-label="情緒溫度計">';
      const cols = ['#1d4ed8', '#0ea5e9', '#94a3b8', '#f97316', '#dc2626'];
      for (let i = 0; i < 5; i++) {
        const a0 = Math.PI * (1 - i / 5); const a1 = Math.PI * (1 - (i + 1) / 5);
        svg += `<path d="M${cx + R * Math.cos(a0)},${cy - R * Math.sin(a0)} A${R},${R} 0 0 1 ${cx + R * Math.cos(a1)},${cy - R * Math.sin(a1)}" stroke="${cols[i]}" stroke-width="18" fill="none"/>`;
      }
      svg += `<line x1="${cx}" y1="${cy}" x2="${cx + (R - 14) * Math.cos(ang)}" y2="${cy - (R - 14) * Math.sin(ang)}" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="7" fill="#0f172a"/>`;
      svg += `<text x="${cx}" y="${cy + 18}" text-anchor="middle" class="w-gauge-n" fill="${lab[1]}">${score}</text></svg>`;
      out.innerHTML = `<div class="w-gauge-wrap">${svg}<div><h4 style="color:${lab[1]}">${lab[0]}</h4>
        <ul class="w-mini">${parts.map(([t, v]) => `<li>${t}<span class="w-bar"><i style="width:${Math.round(v * 100)}%"></i></span></li>`).join('')}</ul></div></div>
        <p class="w-note">VIX 高、融資維持率低（接近 130% 斷頭線）、新低家數多 → 恐懼；量能過熱、融資維持率高、新高家數多 → 貪婪。</p>`;
    }
    calc();
  });

  const RUMOR = [
    ['來源不明，只是「聽說」「內部人士透露」', 2], ['保證獲利、穩賺不賠、飆股明牌', 3], ['要你加入 LINE 群組、付費會員或下載不明 App', 3],
    ['只有截圖，沒有原始連結或公告', 2], ['製造急迫感：「今天不買就來不及」', 2], ['冒用名人、券商或投顧名義', 3],
    ['內容和公開資訊觀測站的公告對不起來', 3], ['標題聳動、內容卻很少具體數字', 1], ['要求匯款到個人帳戶或代操', 3], ['自稱有內線消息', 3],
  ];
  W.register('rumor-check', (el) => {
    const ui = shell(el, { icon: '🧯', title: '假消息檢核表', hint: '收到「明牌」或驚人消息時，逐項勾選可疑特徵', note: '涉及詐騙請撥 165 反詐騙諮詢專線；公司重大訊息一律以公開資訊觀測站為準。' });
    const box = node('<div class="w-rumor"></div>');
    box.innerHTML = `<div class="w-checks">${RUMOR.map(([t], i) => `<label><input type="checkbox" data-i="${i}"><span>${esc(t)}</span></label>`).join('')}</div><div class="w-out"></div>`;
    ui.body.appendChild(box);
    const out = FIN.$('.w-out', box);
    function calc() {
      const score = FIN.$$('input', box).reduce((a, inp) => a + (inp.checked ? RUMOR[+inp.dataset.i][1] : 0), 0);
      const lvl = score >= 6 ? ['bad', '高風險：極可能是詐騙或炒作，不要轉傳、不要下單'] : score >= 3 ? ['warn', '可疑：先查證再說'] : ['good', '暫無明顯紅旗，仍建議查證來源'];
      out.innerHTML = `<div class="w-stats">${stat('風險分數', `${score} 分`, lvl[0], lvl[1])}</div>
        <ol class="steps"><li><b>查原始公告</b>到公開資訊觀測站搜尋公司代號，看有沒有對應的重大訊息。</li><li><b>查官方來源</b>證交所、櫃買中心公告與公司官網投資人關係專區。</li><li><b>看主流媒體</b>是否有多家媒體獨立報導，而不是互相轉貼同一張截圖。</li><li><b>想一想動機</b>散布消息的人能不能從你買進或賣出中獲利？</li></ol>`;
    }
    box.addEventListener('change', calc);
    calc();
  });

  /** 把頁面中所有尚未初始化的元件換成互動圖表。 */
  FIN.hydrateWidgets = (root) => {
    FIN.$$('.widget[data-widget]', root || document).forEach((el) => {
      if (el.dataset.ready) return;
      el.dataset.ready = '1';
      const fn = W.registry[el.dataset.widget];
      if (!fn) { el.innerHTML = `<div class="w-missing">互動元件「${esc(el.dataset.widget)}」尚未提供</div>`; return; }
      try { fn(el); } catch (e) {
        console.error(e);
        el.innerHTML = '<div class="w-missing">互動圖表載入失敗，請重新整理頁面</div>';
      }
    });
  };
})();

</script>
  <script>/* js/content/ta.js */
/* 技術分析學院 — 課程內容（格式見 CONTENT_GUIDE.md） */
window.FIN = window.FIN || {};
FIN.LESSONS = FIN.LESSONS || [];
FIN.LESSONS.push({
  id: 'ta-candle-basics',
  track: 'ta',
  stage: 'basic',
  order: 1,
  title: 'K 線基礎：一根蠟燭看懂一天的多空',
  icon: '🕯️',
  minutes: 8,
  tldr: '一根 K 線記錄開、高、低、收四個價格；台股紅 K 是收盤高於開盤、綠 K 是收盤低於開盤，美股配色相反。',
  plain: '把一天的股價想成一場拔河：開盤是比賽開始時繩子的位置，收盤是結束時的位置，最高和最低是過程中被拉到最遠的地方。K 線就是把這四個位置畫成一根「蠟燭」：中間粗的是實體，上下的細線是影線。看顏色就知道這一天開盤到收盤是誰占上風。',
  keyPoints: [
    'K 線由開盤價、最高價、最低價、收盤價四個價格畫成',
    '實體看開盤到收盤，影線看盤中曾經到過的最高與最低',
    '台股紅 K：收盤高於開盤；綠 K（黑 K）：收盤低於開盤；美股配色相反',
    '顏色比的是當天收盤與開盤，漲跌比的是前一個交易日收盤，兩者常常不同',
    '日 K、週 K、月 K 只是時間單位不同，畫法完全一樣',
  ],
  html: `
<h3>一根 K 線藏了哪四個價格</h3>
<p>K 線（Candlestick，也叫 K 棒、蠟燭線）源自日本江戶時代的米市交易，用一根圖形濃縮一段時間的價格變化。不論是一天、一週還是一個月，都只需要四個數字：</p>
<table class="tbl"><thead><tr><th>價格</th><th>英文</th><th>白話意思</th></tr></thead><tbody>
<tr><td>開盤價</td><td>Open</td><td>這段時間的第一個成交價，拔河開始時繩子的位置</td></tr>
<tr><td>最高價</td><td>High</td><td>過程中買方曾經推到的最高點</td></tr>
<tr><td>最低價</td><td>Low</td><td>過程中賣方曾經壓到的最低點</td></tr>
<tr><td>收盤價</td><td>Close</td><td>最後的成交價，也是大家最看重的「結算價」</td></tr>
</tbody></table>
<p>開盤價和收盤價圍成的長方形叫<strong>實體</strong>；從實體往上畫到最高價的細線是<strong>上影線</strong>，往下畫到最低價的細線是<strong>下影線</strong>。</p>
<div class="formula">實體長度 = 收盤價與開盤價的差距<br>上影線長度 = 最高價 − 實體上緣（開盤、收盤較高的那個）<br>下影線長度 = 實體下緣（開盤、收盤較低的那個）− 最低價</div>
<p>下方示意圖可以拉動開、高、低、收四個滑桿，即時看到一根 K 棒的實體、上影線、下影線與顏色怎麼變。試著把收盤拉到開盤之上，再拉到開盤之下。</p>
<div class="widget" data-widget="candle-anatomy"></div>

<h3>紅 K、綠 K，和「漲跌」不是同一件事</h3>
<ul>
<li><strong>紅 K（陽線）</strong>：收盤價高於開盤價，從開盤到收盤是買方占上風。</li>
<li><strong>綠 K（陰線，也叫黑 K）</strong>：收盤價低於開盤價，從開盤到收盤是賣方占上風。</li>
<li><strong>十字線</strong>：收盤價幾乎等於開盤價，多空打成平手（下一課詳談）。</li>
</ul>
<p>台股看盤軟體普遍採用「紅漲綠跌」。美股與多數國際軟體剛好相反，習慣用綠色表示收高、紅色表示收低，跨市場看盤前要先確認配色。</p>
<div class="callout key"><b>重點</b>K 棒顏色比的是「今天收盤 vs. 今天開盤」；漲跌比的是「今天收盤 vs. 前一個交易日收盤」。報價上的紅綠數字屬於後者，兩套邏輯常常不一致。</div>
<table class="tbl"><thead><tr><th>情境（示意）</th><th>昨收</th><th>開盤</th><th>收盤</th><th>K 棒顏色</th><th>當日漲跌</th></tr></thead><tbody>
<tr><td>跳空開低、盤中拉回</td><td>100</td><td>95</td><td>98</td><td>紅 K</td><td>−2 元（−2%）</td></tr>
<tr><td>跳空開高、盤中回落</td><td>100</td><td>106</td><td>103</td><td>綠 K</td><td>＋3 元（＋3%）</td></tr>
</tbody></table>
<p>所以看到紅 K 別急著說「今天漲了」，先看漲跌幅；反過來，一根綠 K 也可能出現在上漲的日子。</p>

<h3>實體與影線：讀出盤中的拉鋸</h3>
<p>實體愈長，代表從開盤到收盤一路往同一個方向走，力道愈集中；實體很短，代表多空拉鋸、誰也沒占到便宜。影線則記錄「曾經到過、卻沒守住」的價位。</p>
<div class="compare"><div><h4>⬆️ 長上影線</h4><p>盤中一度衝高，但高檔賣壓湧出、把價格壓回。出現在漲多後的高檔時，常被視為上方有壓力。</p></div><div><h4>⬇️ 長下影線</h4><p>盤中一度殺低，但低檔有買盤承接、把價格拉回。出現在跌深後的低檔時，常被視為下方有人承接。</p></div></div>
<p>兩種常見的特殊長相：</p>
<ul>
<li><strong>光頭光腳</strong>：沒有上下影線，開盤就是當天最低（或最高）、收盤就是當天最高（或最低），代表單邊力道很強。</li>
<li><strong>一字線</strong>：開、高、低、收四價相同，整天只有一個成交價。台股上市櫃股票每日漲跌幅限制為 10%，一開盤就鎖住漲停或跌停、整天沒打開時，就會出現這種沒有實體也沒有影線的 K 棒。</li>
</ul>

<h3>日 K、週 K、月 K：同一套畫法，換個時間尺度</h3>
<p>一根 K 棒代表多長的時間，就叫什麼 K；當沖族常看的 5 分 K 也是同樣道理。以週 K 為例：</p>
<ol class="steps">
<li><b>開盤價</b>取這一週第一個交易日的開盤價。</li>
<li><b>收盤價</b>取這一週最後一個交易日的收盤價。</li>
<li><b>最高價、最低價</b>取這一週所有交易日中的最高點與最低點。</li>
</ol>
<p>示意：某股週一開 100 元、週五收 104 元，這週最高 108 元、最低 97 元，週 K 就是實體 4 元、上影線 4 元、下影線 3 元的紅 K。即使週間有幾天收綠 K，整週合起來仍可能是紅 K。日 K 適合看短線節奏，週 K、月 K 能濾掉每天的雜訊，看出比較大的方向。</p>
<p>下方是 80 根示意日 K：用滑桿調整趨勢與波動、按按鈕重新產生一段行情，滑鼠移到任一根 K 棒上可以看到它的開高低收（OHLC）。</p>
<div class="widget" data-widget="candle-chart" data-seed="2330"></div>

<h3>台股實例：一字線背後的恐慌</h3>
<div class="case"><div class="case-title">台股實例：2025 年 4 月 7 日，台積電跌 10% 卻只畫出「一條線」</div>
<p>美國宣布對等關稅後，台股在 2025 年 4 月 7 日重挫：加權指數收 19,232.35 點、下跌 2,065.87 點（約 −9.7%），是史上最大單日跌點，上市櫃有超過 1,700 家公司跌停。</p>
<p><span class="stk" data-code="2330">台積電</span>當天開盤就跌停（較前一交易日的 942 元少 94 元），全天一價鎖到收盤，開、高、低、收都是 848 元。畫成日 K 就是一根<strong>一字線</strong>：沒有實體、沒有影線，看起來很「平靜」，其實是想賣的人大排長龍、根本賣不掉。</p>
<p>三個交易日後的 4 月 10 日，美國宣布對等關稅暫緩 90 天，加權指數大漲 1,608.27 點、收 19,000.03 點（約 ＋9.25%），<span class="stk" data-code="2330">台積電</span>、<span class="stk" data-code="2317">鴻海</span>、<span class="stk" data-code="2454">聯發科</span>等權值股都亮燈漲停。</p>
<p>學到的事：<strong>K 棒的長短不等於漲跌幅的大小</strong>。一字線、跳空這類 K 棒，一定要搭配漲跌幅、成交量與前後幾根 K 棒一起解讀。</p>

<h3>開盤價、收盤價從哪裡來</h3>

<p>十字線還有兩種變形：下影線很長、幾乎沒有上影線的叫<strong>蜻蜓十字</strong>（T 字線）；上影線很長、幾乎沒有下影線的叫<strong>墓碑十字</strong>（倒 T 字線）。它們本質上都是「猶豫」，要看出現在哪裡才有意義。</p>

<div class="widget" data-widget="candle-patterns"></div>

<h3>影線很長的小實體：錘子、吊人、流星、倒錘子</h3>
<h4>長下影線家族：錘子線與吊人線</h4>
<p>這兩種 K 棒長得一模一樣，判斷條件是：</p>
<ol class="steps">
<li><b>小實體在上端</b>紅 K 或綠 K 都可以，實體擠在整根 K 棒的上方。</li>
<li><b>下影線夠長</b>下影線長度至少是實體的 2 倍，愈長愈明顯。</li>
<li><b>上影線很短</b>幾乎沒有上影線，代表收盤離當天最高價不遠。</li>
</ol>
<p>差別只在<strong>位置</strong>：出現在一段跌勢的末端叫<strong>錘子線</strong>，代表盤中殺低時有買盤進場承接，賣壓可能開始衰竭；出現在一段漲勢的高檔叫<strong>吊人線</strong>，代表盤中曾湧出大量賣壓，雖然收盤被拉回，仍是追價力道轉弱的警訊。</p>
<p>示意計算：某股開 50.0 元、最高 50.4 元、最低 47.6 元、收 50.2 元。實體 0.2 元，下影線 50.0 − 47.6 = 2.4 元（實體的 12 倍），上影線 0.2 元，符合錘子線的長相。</p>

<h4>長上影線家族：流星線與倒錘子</h4>
<p>把錘子線上下顛倒，就是這一家：小實體在下端、上影線至少是實體 2 倍、下影線很短。</p>
<div class="compare"><div><h4>🌠 流星線（高檔）</h4><p>漲了一段後，盤中一度衝高，卻被賣壓一路打回開盤價附近。代表上方賣壓沉重，是常見的頭部警訊。</p></div><div><h4>🔧 倒錘子（低檔）</h4><p>跌了一段後，買方試著反攻、把價格推高，但沒守住。代表空方力道開始鬆動，可信度比錘子線低，更需要後續確認。</p></div></div>

<h3>兩根 K 的組合：吞噬與母子</h3>
<p><strong>吞噬型態</strong>是兩根顏色相反的 K 棒，後一根的實體完全包住前一根的實體：</p>
<ul>
<li><strong>多頭吞噬</strong>：出現在低檔，先一根綠 K，接著一根更長的紅 K 把它整個吞掉，代表買方一天就把前一天的跌幅全部收復。</li>
<li><strong>空頭吞噬</strong>：出現在高檔，先一根紅 K，接著一根更長的綠 K 把它吞掉，代表賣方全面反撲。</li>
</ul>
<table class="tbl"><thead><tr><th>示意</th><th>開盤</th><th>收盤</th><th>實體範圍</th></tr></thead><tbody>
<tr><td>第 1 天（綠 K）</td><td>102</td><td>98</td><td>98～102</td></tr>
<tr><td>第 2 天（紅 K）</td><td>97</td><td>104</td><td>97～104，完全包住第 1 天</td></tr>
</tbody></table>
<p>反過來，後一根的小實體完全落在前一根大實體裡面，叫<strong>母子線</strong>，代表原本的氣勢突然縮手，是猶豫訊號。</p>
<div class="callout pro"><b>進階補充</b>三根 K 棒的組合也很常見：低檔「長黑 → 小實體或十字 → 長紅」叫晨星，高檔「長紅 → 小實體或十字 → 長黑」叫夜星，邏輯都是「趨勢、猶豫、反向表態」。</div>

<h3>台股特有：漲跌停讓型態變形</h3>
<p>台股上市櫃股票每日漲跌幅限制為 10%，因此會看到幾種和漲跌停有關的長相：</p>
<ul>
<li><strong>一字線</strong>：開盤就鎖住漲停或跌停、整天沒打開，四價相同。它不是十字線的猶豫，而是單邊大排長龍，想買（或想賣）的人遠多於對手。</li>
<li><strong>漲停打開</strong>：盤中曾鎖漲停，後來被賣單打開、收在漲停價之下，就會留下上影線。若出現在連續大漲之後，和流星線一樣是追價力道轉弱的警訊。</li>
<li><strong>跌停打開</strong>：盤中曾鎖跌停，後來買盤進場、收在跌停價之上，就會留下下影線，帶有和錘子線類似的承接意味。</li>
</ul>
<p>另外，台股開盤常受前一晚國際股市影響而<strong>跳空</strong>，開盤價離前一天收盤很遠。這時當天 K 棒的實體可能很小，實際上卻已經漲跌好幾 %，判讀型態時記得同時看漲跌幅。</p>

<h3>台股實例：錘子線的確認與失效</h3>
<div class="case"><div class="case-title">台股實例：台積電回測千元關卡的錘子線（示意）</div>
<p>示意情境：<span class="stk" data-code="2330">台積電</span>連續回檔 5 個交易日，跌到 1,000 元整數關卡附近。第 6 天開 1,005 元、盤中殺到 965 元、尾盤拉回收 1,010 元，最高 1,015 元。</p>
<ul>
<li>實體 5 元、下影線 1,005 − 965 = 40 元（實體的 8 倍）、上影線 5 元 → 長相是錘子線。</li>
<li><b>確認</b>：之後收紅 K 並站上 1,015 元（錘子線最高價），代表承接的買盤延續。</li>
<li><b>失效</b>：之後收盤跌破 965 元（錘子線最低價），代表低檔承接失敗，這根錘子線就不再有參考價值。</li>
</ul>
<p>同樣的 K 棒如果出現在從 800 元一路漲到 1,000 元之後，就要當成吊人線來提防。注意價格跨過 1,000 元時，升降單位會從 1 元變成 5 元，所以示意數字在千元以上都是 5 的倍數。</p>
</div>

<h3>用型態之前的三個檢查</h3>
<ol class="steps">
<li><b>位置</b>是否出現在一段明確趨勢的末端，或重要支撐、壓力附近？盤整區中間的型態參考價值低。</li>
<li><b>確認</b>後續 K 棒有沒有往型態暗示的方向走？有沒有站上（或跌破）型態的最高、最低價？</li>
<li><b>成交量</b>反轉當天或確認當天有沒有放量？量能配合，代表有更多人認同這個方向。</li>
</ol>
<div class="callout warn"><b>注意</b>單根 K 線只描述一天的劇情，無法單獨決定進出場。型態的最高價、最低價很適合拿來規劃「錯了要在哪裡認錯」，詳見<a href="#/lesson/ta-risk-management">停損停利那一課</a>。</div>

  icon: '🧭',

  html: `
<h3>均線怎麼算：會移動的平均</h3>
<p>移動平均線（Moving Average，MA）是把最近 N 個交易日的收盤價加總後平均，每天往前「移動」一格：加入最新一天、剔除最舊一天，連起來就成了一條線。</p>
<div class="formula">N 日均線 = 最近 N 個交易日收盤價合計 ÷ N</div>
<table class="tbl"><thead><tr><th>示意</th><th>第 1 天</th><th>第 2 天</th><th>第 3 天</th><th>第 4 天</th><th>第 5 天</th><th>第 6 天</th></tr></thead><tbody>
<tr><td>收盤價</td><td>100</td><td>102</td><td>101</td><td>104</td><td>103</td><td>106</td></tr>
</tbody></table>
<ul>
<li>第 5 天的 5 日均線 =（100 + 102 + 101 + 104 + 103）÷ 5 = 510 ÷ 5 = <strong>102</strong> 元。</li>
<li>第 6 天加入 106、剔除第 1 天的 100：（102 + 101 + 104 + 103 + 106）÷ 5 = 516 ÷ 5 = <strong>103.2</strong> 元，均線上揚。</li>
</ul>
<p>那個即將被剔除的舊價格叫<strong>扣抵值</strong>，例如月線的扣抵值大約就是 20 個交易日前的收盤價。今天收盤高於扣抵值，均線就會往上；低於扣抵值，均線就會往下。看扣抵值，可以提前推估均線接下來會上彎還是下彎：如果未來幾天要被剔除的都是高價，就算股價持平，均線也會往下走。</p>
<div class="callout pro"><b>進階補充</b>上面這種每天權重相同的叫簡單移動平均（SMA）。指數移動平均（EMA）給近期價格較大的權重、反應較快，MACD 就是用 EMA 計算的，詳見<a href="#/lesson/ta-macd">MACD 那一課</a>。</div>

<h3>台股常用的均線週期</h3>
<p>台股一週有 5 個交易日，所以均線的俗稱和日曆時間對應：</p>
<table class="tbl"><thead><tr><th>天數</th><th>俗稱</th><th>常見用途</th></tr></thead><tbody>

<tr><td>10 日</td><td>雙週線</td><td>短線輔助</td></tr>
<tr><td>20 日</td><td>月線</td><td>波段操作常用的強弱分界</td></tr>
<tr><td>60 日</td><td>季線</td><td>中期趨勢，常被視為多空分水嶺</td></tr>
<tr><td>120 日</td><td>半年線</td><td>中長期趨勢</td></tr>
<tr><td>240 日</td><td>年線</td><td>長期趨勢，一年左右的平均成本</td></tr>
</tbody></table>
<p>注意：這裡的「週線」指 5 日均線，和上一課的「週 K 線」不是同一個東西，看盤時要分清楚。</p>

<h3>三個重點：方向、位置、排列</h3>
<ol class="steps">
<li><b>方向</b>均線上揚代表平均成本墊高，趨勢偏多；下彎代表平均成本下降，趨勢偏空；走平代表盤整。</li>
<li><b>位置</b>股價在上揚均線之上時，回檔到均線附近常有買盤（支撐）；股價在下彎均線之下時，反彈到均線附近常遇解套賣壓（壓力）。</li>

</ol>
<p>短天期均線由下往上穿越長天期均線，叫<strong>黃金交叉</strong>；由上往下跌破，叫<strong>死亡交叉</strong>。下方示意圖預設畫出 5 日週線、20 日月線、60 日季線，滑桿可以調整天數，圖上會標出黃金交叉與死亡交叉，試著比較趨勢段與盤整段的交叉次數。</p>
<div class="widget" data-widget="ma-chart"></div>

<h3>葛蘭碧八大法則：均線的經典用法</h3>
<p>美國技術分析師葛蘭碧（Joseph Granville）把「股價與均線的相對位置」加上「均線方向」整理成四個偏多、四個偏空的情境，核心精神是<strong>順勢為主</strong>：</p>
<table class="tbl"><thead><tr><th>偏多情境</th><th>偏空情境</th></tr></thead><tbody>

<tr><td>均線上揚，股價回檔不破均線又轉強</td><td>均線下彎，股價反彈碰到均線又轉弱</td></tr>
<tr><td>均線上揚，股價短暫跌破後很快站回</td><td>均線下彎，股價短暫突破後很快跌回</td></tr>
<tr><td>股價急跌、離均線太遠，容易出現跌深反彈</td><td>股價急漲、離均線太遠，容易出現漲多拉回</td></tr>
</tbody></table>
<p>最後一列屬於逆勢判斷，風險較高。也有人用美股長期資料回測，結論是這套法則「看不出漲跌，但看得出大跌風險」，所以比較適合拿來辨識趨勢轉弱，而不是預測明天漲跌。</p>
<p>「離均線太遠」可以用<strong>乖離率</strong>量化：</p>
<div class="formula">乖離率 =（收盤價 − 均線）÷ 均線 × 100%</div>
<p>示意：收盤 1,100 元、20 日線 1,000 元，月線乖離率 =（1,100 − 1,000）÷ 1,000 × 100% = ＋10%，叫正乖離；收盤低於均線就是負乖離。多大才算「太大」沒有固定標準：股性活潑的股票乖離常比大型權值股大，均線天數越長，乖離的門檻也越大。強勢行情中正乖離可以維持很久，只看乖離率就逆勢操作很容易受傷。</p>

<h3>台股實例：用三條均線看趨勢</h3>
<div class="case"><div class="case-title">台股實例：台積電的多頭排列與回測月線（示意）</div>
<p>示意情境：<span class="stk" data-code="2330">台積電</span>股價 1,050 元，5 日線 1,040 元、20 日線 1,000 元、60 日線 950 元，三線都往上，屬於多頭排列。</p>

<li>如果後來連續幾天收在 60 日線之下，而且 60 日線開始走平、下彎，就代表中期趨勢可能轉弱，原本的多頭排列被破壞。</li>

</ul>
<p>證交所網站的「個股日收盤價及月平均價」可以查到每天收盤價與當月平均價，適合自己動手驗算均線的概念。</p>

  html: `
<h3>支撐和壓力從哪裡來</h3>
<p>支撐（Support）與壓力（Resistance）不是魔法，而是一群人的<strong>成本記憶</strong>：</p>

<li><b>找明顯轉折</b>在日 K 上找出最近幾個月最明顯的高點與低點，太小的波動先忽略。</li>
<li><b>數碰觸次數</b>同一個價格帶被測試越多次、每次都守住，參考價值越高。</li>
<li><b>畫成區間</b>每個人掛單的價位不同，把支撐壓力畫成一個價格帶（例如 98～102 元），比畫一條精準的線實用。</li>
</ol>
<p>整數關卡在台股還有一個制度上的巧合：股價升降單位在 10、50、100、500、1,000 元分段改變，例如 500 元到未滿 1,000 元每檔跳 1 元，1,000 元以上每檔跳 5 元。價格一跨過關卡，每一檔的金額就變大。</p>
<p>下方示意圖會自動找出前高、前低畫成支撐壓力線；拉動敏感度滑桿可以決定要抓多明顯的轉折，圖上也會標示突破與跌破的位置。</p>
<div class="widget" data-widget="sr-chart"></div>

<h3>趨勢線：會傾斜的支撐壓力</h3>
<p>支撐壓力不一定是水平的。在一段漲勢中，把兩個以上<strong>逐步墊高的低點</strong>連起來，就是<strong>上升趨勢線</strong>，回檔碰到時常有支撐；在一段跌勢中，把兩個以上<strong>逐步下移的高點</strong>連起來，就是<strong>下降趨勢線</strong>，反彈碰到時常遇壓力。</p>
<p>俗話說「兩點定線、三點確認」：第三次碰觸趨勢線又反彈，代表這條線被市場認同。趨勢線被收盤價有效跌破（或突破），常是趨勢可能轉變的早期訊號。</p>
<div class="callout tip"><b>實戰小技巧</b>趨勢線畫得太陡，很快就會被跌破；畫得太平，又失去意義。優先使用明顯的轉折低點，並用週 K 檢查大方向是否一致。</div>

<h3>突破、跌破與角色互換</h3>
<p>盤中價格穿過壓力線、收盤又縮回來，常被稱為「假突破」。多數人採用以下條件判斷<strong>有效突破</strong>：</p>
<ul>
<li><strong>收盤確認</strong>：以收盤價站上（或跌破）支撐壓力區，而不只是盤中影線碰到。</li>
<li><strong>量能配合</strong>：突破當天成交量明顯放大，代表有足夠的買盤消化上方賣壓。</li>
<li><strong>時間確認</strong>：突破後幾天內沒有馬上跌回區間。</li>
</ul>
<div class="compare"><div><h4>⬆️ 突破後：壓力變支撐</h4><p>原本在壓力區套牢的人已經解套，沒買到的人等著回檔再買，股價回測原壓力區時常有承接。</p></div><div><h4>⬇️ 跌破後：支撐變壓力</h4><p>在支撐區買進的人全部套牢，股價反彈回原支撐區時，「回本就賣」的解套賣壓會湧出。</p></div></div>

<h4>跳空缺口：為什麼空白區也是支撐與壓力</h4>
<p>當今天的開盤價直接跳過昨天一整天的價格範圍（例如向上跳空：今天最低價還高於昨天最高價），K 線圖上就會留下一段完全沒有人成交的空白，叫做<strong>跳空缺口（Gap）</strong>。常見的跳空缺口分為四類：</p>
<ul>
<li><strong>普通缺口</strong>：發生在盤整區間內，沒有特別的趨勢意義，通常幾天內就會被價格回頭填滿（俗稱「補缺口」）。</li>
<li><strong>突破缺口</strong>：股價盤整很久後，伴隨大成交量直接跳空越過重要壓力區。這種缺口代表多方力道極強，缺口下緣往往會成為後續強力的支撐帶。</li>
<li><strong>逃逸缺口（中繼缺口）</strong>：出現在明顯趨勢的中途，代表行情加速前進，缺口位置同樣常扮演支撐或壓力。</li>
<li><strong>竭盡缺口</strong>：出現在大漲或大跌了很長一段後的末端，最後一波追價（或殺盤）力道耗盡，缺口一旦在幾天內被迅速回補，常是趨勢反轉的訊號。</li>
</ul>
<div class="callout pro"><b>進階補充</b>看台股缺口時，一定要區分「除權息缺口」與「交易缺口」。台股每年夏天除權息旺季，股價會因為配發現金股利或股票股利而在開盤時下調（除權息參考價），圖表上看起來像往下跳空，但那只是把股利從股價扣掉的制度調整，不能直接當成空頭跌破的訊號（詳見<a href="#/lesson/fa-dividend">殖利率與除權息那一課</a>）。</div>

<h3>台股實例：千元關卡與區間突破</h3>

<p>示意情境：<span class="stk" data-code="2317">鴻海</span>在 180～200 元之間來回 3 個月，200 元三度碰到就拉回（壓力），180 元兩度跌到就反彈（支撐）。</p>

<li>若幾天內又跌回 195 元以下 → 這次突破就是假突破。</li>

</div>

<h3>支撐壓力的限制</h3>

<p>實務看盤時，建議同時搭配<strong>不同時間週期</strong>交叉確認：先打開週 K 找出過去一兩年最關鍵的大支撐與大壓力，再切回日 K 觀察近期的小區間。如果日 K 的前波低點剛好也落在週 K 的長期上升趨勢線或季線附近，這種「多重支撐重疊」的位置，市場關注度通常比單一短線低點高得多。</p>
