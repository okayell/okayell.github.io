/* ==========================================================================
 * 財經學院 (Finance Academy) — Complete Stylesheet
 * Light-first academic palette · Taiwan Red-Up / Green-Down convention
 * Responsive 320px – 1440px+ with zero horizontal scroll
 * ========================================================================== */

:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-alt: #f1f5f9;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-sub: #334155;
  --muted: #64748b;
  --primary: #1e40af;
  --primary-hover: #1d4ed8;
  --primary-soft: #eff6ff;
  --up: #e11d48;
  --up-soft: #ffe4e6;
  --down: #16a34a;
  --down-soft: #dcfce7;
  --warn: #d97706;
  --warn-soft: #fef3c7;
  --ta: #2563eb;
  --fa: #0d9488;
  --chip: #7c3aed;
  --news: #ea580c;
  --tc: #1e40af;
  --ts: #dbeafe;
  --ti: #1e3a8a;
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
  --shadow: 0 6px 20px rgba(15, 23, 42, 0.07);
  --shadow-lg: 0 14px 36px rgba(15, 23, 42, 0.16);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a {
  color: var(--primary);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

/* -------------------- Utility Classes -------------------- */
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); font-weight: 700; }
.down, .good { color: var(--down); font-weight: 700; }
.warn { color: var(--warn); font-weight: 700; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }

/* -------------------- Reading Progress Bar -------------------- */
.read-prog {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  z-index: 95;
  pointer-events: none;
}
.read-prog > i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--tc, var(--primary));
  transition: width 0.08s linear;
}

/* -------------------- Sticky Site Header -------------------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 80;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}

.header-inner {
  max-width: 1380px;
  margin: 0 auto;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  min-width: 0;
}

.brand-wrap > .campus-home {
  margin-right: 2px;
}

.brand-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 800;
  font-size: 15.5px;
  color: var(--text);
  text-decoration: none !important;
  white-space: nowrap;
}
.brand-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 27px;
  height: 27px;
  border-radius: 7px;
  background: linear-gradient(135deg, #1e40af, #0d9488);
  color: #fff;
  font-size: 14px;
  flex-shrink: 0;
}
.brand-sub {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--surface-alt);
}

.ver-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 23px;
  padding: 0 7px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface-alt);
  color: var(--text-sub);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}
.ver-badge:hover {
  background: #e2e8f0;
}
.ver-badge .ver-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #f59e0b;
  display: inline-block;
}

/* Primary Nav Links */
.main-nav {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
  min-width: 0;
}
.main-nav::-webkit-scrollbar {
  display: none;
}

.nav-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 8px;
  border-radius: 8px;
  color: var(--text-sub);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none !important;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s;
}
.nav-link:hover {
  background: var(--surface-alt);
  color: var(--text);
}
.nav-link.active {
  background: var(--primary-soft);
  color: var(--primary);
  font-weight: 700;
}
.nav-link[data-nav="ta"].active { background: #dbeafe; color: var(--ta); }
.nav-link[data-nav="fa"].active { background: #ccfbf1; color: var(--fa); }
.nav-link[data-nav="chip"].active { background: #ede9fe; color: var(--chip); }
.nav-link[data-nav="news"].active { background: #ffedd5; color: var(--news); }

.header-right {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}

.hdr-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 28px;
  padding: 0 8px;
  border-radius: 999px;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-sub);
  white-space: nowrap;
  text-decoration: none !important;
}
.hdr-chip.streak {
  background: #fff7ed;
  border-color: #fed7aa;
  color: #c2410c;
}

.hdr-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 29px;
  padding: 0 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-sub);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.hdr-btn:hover {
  background: var(--surface-alt);
}
.hdr-btn kbd {
  font-family: var(--mono);
  font-size: 10px;
  padding: 1px 4px;
  border-radius: 4px;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  color: var(--muted);
}

/* Responsive Header Breakpoints (zero overflow 320px–1440px) */
@media (max-width: 1360px) {
  .brand-sub { display: none; }
  .hdr-chip.prog { display: none; }
  .hdr-btn .btn-txt-long { display: none; }
  .nav-link { padding: 5px 6px; font-size: 12.5px; }
}
@media (max-width: 1180px) {
  .nav-link .nav-ic { display: none; }
  .hdr-btn kbd { display: none; }
}
@media (max-width: 980px) {
  .main-nav { display: none; }
}
@media (max-width: 520px) {
  .header-inner { padding: 6px 8px; gap: 4px; }
  .hdr-chip.streak { padding: 0 6px; font-size: 11px; }
  .hdr-btn { padding: 0 6px; height: 27px; }
  .hdr-btn .btn-txt { display: none; }
  .brand-link { font-size: 14px; gap: 4px; }
  .brand-logo { width: 23px; height: 23px; font-size: 12.5px; }
}
@media (max-width: 365px) {
  .header-inner { padding: 6px 6px; gap: 3px; }
  .hdr-chip.streak { display: none; }
  .ver-badge { padding: 0 5px; font-size: 10px; }
}

/* -------------------- Mobile Bottom Navigation -------------------- */
.mobile-nav {
  display: none;
}
@media (max-width: 980px) {
  .mobile-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 78;
    display: flex;
    align-items: center;
    justify-content: space-around;
    background: rgba(255, 255, 255, 0.98);
    border-top: 1px solid var(--border);
    padding: 4px 2px calc(4px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -2px 10px rgba(15, 23, 42, 0.05);
  }
  .m-nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    padding: 4px 5px;
    border-radius: 8px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none !important;
    min-width: 0;
  }
  .m-nav-item .m-ic {
    font-size: 15px;
    line-height: 1.1;
  }
  .m-nav-item.active {
    color: var(--primary);
    background: var(--primary-soft);
  }
  body {
    padding-bottom: 62px;
  }
}

/* -------------------- Main Content Container -------------------- */
.app-main {
  max-width: 1240px;
  margin: 0 auto;
  padding: 20px 18px 44px;
  min-height: calc(100vh - 140px);
}
@media (max-width: 640px) {
  .app-main {
    padding: 14px 12px 32px;
  }
}

/* -------------------- Buttons, Chips & Cards -------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 9px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none !important;
  transition: background 0.15s, transform 0.1s;
}
.btn:hover:not(:disabled) {
  background: var(--surface-alt);
}
.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
.btn.primary, .btn-primary {
  background: var(--tc, var(--primary));
  border-color: var(--tc, var(--primary));
  color: #fff;
}
.btn.primary:hover:not(:disabled), .btn-primary:hover:not(:disabled) {
  filter: brightness(0.94);
  color: #fff;
}
.btn.lg {
  padding: 10px 18px;
  font-size: 14.5px;
}
.btn.sm, .btn-sm {
  padding: 5px 10px;
  font-size: 12.5px;
  border-radius: 7px;
}
.btn.block {
  width: 100%;
}
.btn.danger {
  color: var(--up);
  border-color: #fecdd3;
  background: #fff1f2;
}
.btn.ghost {
  background: transparent;
}

.icon-btn {
  border: none;
  background: var(--surface-alt);
  width: 28px;
  height: 28px;
  border-radius: 7px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.link-btn {
  border: none;
  background: none;
  color: var(--tc, var(--primary));
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  padding: 0;
  text-decoration: none;
}
.link-btn:hover {
  text-decoration: underline;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--s, var(--surface-alt));
  color: var(--c, var(--text-sub));
  font-size: 12px;
  font-weight: 700;
  text-decoration: none !important;
  white-space: nowrap;
}
.chip.ok { background: var(--down-soft); color: #15803d; }
.chip.info { background: #dbeafe; color: #1e40af; }
.chip.ghost { background: var(--surface-alt); color: var(--muted); }
.chip.tc { background: var(--ts, #dbeafe); color: var(--tc, #1e40af); }
.chip.imp { background: #fef3c7; color: #b45309; }
.chip.link:hover { filter: brightness(0.95); }

.chip-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-sub);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.chip-btn small {
  background: var(--surface-alt);
  padding: 0 6px;
  border-radius: 999px;
  font-size: 11px;
}
.chip-btn.on {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.chip-btn.on small {
  background: rgba(255, 255, 255, 0.22);
  color: #fff;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
}
.card.empty {
  text-align: center;
  padding: 36px 20px;
}

.bar {
  height: 7px;
  border-radius: 999px;
  background: var(--surface-alt);
  overflow: hidden;
  flex: 1;
}
.bar > i {
  display: block;
  height: 100%;
  background: var(--tc, var(--primary));
  border-radius: 999px;
}

/* -------------------- HQ Home (#/home) -------------------- */
.hq {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 20px;
  align-items: center;
  background: linear-gradient(135deg, #ffffff 0%, #eff6ff 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
@media (max-width: 960px) {
  .hq {
    grid-template-columns: 1fr;
    padding: 18px;
  }
  .hq-art { display: none; }
}
.eyebrow {
  font-size: 12.5px;
  font-weight: 800;
  color: var(--primary);
  margin-bottom: 4px;
}
.hq-txt h1 {
  margin: 0 0 8px;
  font-size: 25px;
  line-height: 1.3;
}
.hq-txt h1 span {
  color: var(--primary);
}
.hq-lead {
  margin: 0 0 14px;
  color: var(--text-sub);
  font-size: 14px;
}
.hq-cta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.hq-stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  min-width: 210px;
}
.hq-stats > div {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
}
.hq-stats b {
  font-size: 19px;
  font-weight: 800;
}
.hq-stats b small {
  font-size: 12px;
  color: var(--muted);
}
.hq-stats span {
  font-size: 11.5px;
  color: var(--muted);
}

.inline-disc {
  background: #fffbeb;
  border: 1px solid #fde68a;
  color: #92400e;
  border-radius: 10px;
  padding: 9px 14px;
  font-size: 12.5px;
  margin-bottom: 18px;
  line-height: 1.6;
}
.inline-disc .link-btn {
  margin-left: 8px;
}

.welcome {
  position: relative;
  background: #f0fdf4;
  border-color: #bbf7d0;
}
.welcome .icon-btn {
  position: absolute;
  top: 12px;
  right: 12px;
}
.welcome h3 {
  margin: 0 0 8px;
  font-size: 16px;
}

.sec-t {
  margin: 18px 0 12px;
  font-size: 19px;
}

.track-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin-bottom: 18px;
}
@media (max-width: 760px) {
  .track-grid {
    grid-template-columns: 1fr;
  }
}
.track-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: 4px solid var(--tc, var(--primary));
  border-radius: var(--radius);
  padding: 16px 18px;
  color: var(--text);
  text-decoration: none !important;
  box-shadow: var(--shadow-sm);
  transition: transform 0.14s, box-shadow 0.14s;
}
.track-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.tc-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.tc-en {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--tc, var(--muted));
  background: var(--ts, var(--surface-alt));
  padding: 2px 8px;
  border-radius: 999px;
}
.track-card h3 {
  margin: 0;
  font-size: 18px;
}
.tc-motto {
  margin: 0;
  font-size: 13.5px;
  color: var(--text-sub);
}
.tc-stages {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
}
.tc-stages > span {
  background: var(--surface-alt);
  padding: 2px 8px;
  border-radius: 6px;
}
.tc-prog {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}
.tc-go {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--tc, var(--primary));
}

.home-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
@media (max-width: 960px) {
  .home-grid {
    grid-template-columns: 1fr;
  }
}
.home-grid .card {
  margin-bottom: 0;
}
.home-grid h3 {
  margin: 0 0 10px;
  font-size: 16px;
}
.next-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.next-list li {
  display: flex;
  align-items: center;
  gap: 8px;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--tc, var(--primary));
  flex-shrink: 0;
}
.next-list a, .next-list span {
  display: flex;
  flex-direction: column;
  text-decoration: none !important;
  min-width: 0;
}
.next-list small {
  font-size: 11px;
  color: var(--muted);
}
.next-list b {
  font-size: 13.5px;
  color: var(--text);
}
.tod b {
  font-size: 16px;
  margin-right: 6px;
}
.tod small {
  color: var(--muted);
}
.tod p {
  margin: 6px 0 10px;
  font-size: 13.5px;
  color: var(--text-sub);
}
.arena-links {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

/* -------------------- Track Page (#/track/*) -------------------- */
.crumbs {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 10px;
}
.track-hero {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 18px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 5px solid var(--tc, var(--primary));
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  margin-bottom: 14px;
}
@media (max-width: 820px) {
  .track-hero {
    grid-template-columns: 1fr;
  }
  .th-art { display: none; }
}
.th-txt h1 {
  margin: 0 0 4px;
  font-size: 23px;
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.th-txt h1 small {
  font-size: 13px;
  color: var(--muted);
  font-weight: 600;
}
.th-motto {
  margin: 0 0 4px;
  font-weight: 700;
  color: var(--tc, var(--primary));
}
.th-desc {
  margin: 0 0 12px;
  font-size: 13.5px;
  color: var(--text-sub);
}
.th-cta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.th-ring {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-align: center;
}
.th-ring b {
  font-size: 16px;
  display: block;
}
.th-ring span {
  font-size: 11.5px;
  color: var(--muted);
}

.track-switch {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 18px;
}
.track-switch a {
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-sub);
  font-size: 13px;
  font-weight: 700;
  text-decoration: none !important;
}
.track-switch a.on {
  background: var(--tc, var(--primary));
  border-color: var(--tc, var(--primary));
  color: #fff;
}

.stage {
  margin-bottom: 22px;
}
.stage > h2 {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 0 0 10px;
  font-size: 17px;
}
.stage > h2 small {
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
}
.st-n {
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
}
.lesson-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.lesson-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 12px 14px;
  color: var(--text);
  text-decoration: none !important;
  transition: border-color 0.14s, box-shadow 0.14s;
}
.lesson-row:hover {
  border-color: var(--tc, var(--primary));
  box-shadow: var(--shadow-sm);
}
.lesson-row.done {
  border-left: 4px solid var(--down);
}
.lr-n {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: var(--surface-alt);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;
  color: var(--muted);
  flex-shrink: 0;
}
.lr-ic {
  font-size: 20px;
  flex-shrink: 0;
}
.lr-main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}
.lr-main b {
  font-size: 15px;
}
.lr-main small {
  font-size: 12.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lr-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  font-size: 12px;
}
@media (max-width: 680px) {
  .lesson-row {
    flex-wrap: wrap;
  }
  .lr-main small {
    white-space: normal;
  }
  .lr-meta {
    width: 100%;
    justify-content: flex-end;
  }
}

.track-bottom {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 16px;
}
@media (max-width: 760px) {
  .track-bottom {
    grid-template-columns: 1fr;
  }
}

/* -------------------- Lesson Page (#/lesson/*) -------------------- */
.lesson-hd {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 5px solid var(--tc, var(--primary));
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 18px;
}
.lh-ic {
  font-size: 32px;
  line-height: 1;
}
.lh-txt h1 {
  margin: 0 0 8px;
  font-size: 22px;
  line-height: 1.35;
}
.lh-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.lesson-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 230px;
  gap: 20px;
  align-items: start;
}
@media (max-width: 980px) {
  .lesson-grid {
    grid-template-columns: 1fr;
  }
  .toc {
    display: none;
  }
}

.lesson-main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.tldr-box, .plain-box, .kp-box, .lesson-body, .lsec {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
}
.tldr-box {
  background: linear-gradient(135deg, var(--ts, #eff6ff) 0%, #ffffff 90%);
  border-color: var(--tc, #93c5fd);
}
.tb-l {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 800;
  color: var(--tc, var(--primary));
  text-transform: uppercase;
  margin-bottom: 4px;
}
.tldr-box p {
  margin: 0;
  font-size: 15.5px;
  font-weight: 700;
}
.plain-box b, .kp-box b {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  color: var(--tc, var(--primary));
}
.plain-box p {
  margin: 0;
}
.kp-box ul {
  margin: 0;
  padding-left: 20px;
}
.kp-box li {
  margin-bottom: 4px;
}

.lesson-body {
  padding: 20px 22px;
  overflow-x: hidden;
}
@media (max-width: 640px) {
  .lesson-body {
    padding: 15px 14px;
  }
}
.lesson-body h3 {
  margin: 22px 0 8px;
  padding-bottom: 5px;
  border-bottom: 2px solid var(--surface-alt);
  font-size: 18px;
}
.lesson-body h3:first-child {
  margin-top: 0;
}
.lesson-body h4 {
  margin: 16px 0 6px;
  font-size: 15.5px;
}
.lesson-body p {
  margin: 0 0 11px;
}
.lesson-body ul, .lesson-body ol {
  margin: 0 0 12px;
  padding-left: 22px;
}
.lesson-body li {
  margin-bottom: 5px;
}

.tbl {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0 14px;
  font-size: 13.5px;
  display: block;
  overflow-x: auto;
}
.tbl th, .tbl td {
  border: 1px solid var(--border);
  padding: 7px 10px;
  text-align: left;
}
.tbl th {
  background: var(--surface-alt);
  font-weight: 700;
}

.formula {
  background: #f8fafc;
  border-left: 4px solid var(--tc, var(--primary));
  border-radius: 8px;
  padding: 10px 14px;
  margin: 12px 0;
  font-family: var(--mono);
  font-size: 13px;
  overflow-x: auto;
}

.callout {
  background: #f0f9ff;
  border: 1px solid #bae6fd;
  border-radius: 10px;
  padding: 11px 14px;
  margin: 12px 0;
  font-size: 14px;
}
.callout b {
  display: inline-block;
  margin-right: 6px;
  color: #0369a1;
}
.callout.warn {
  background: #fffbeb;
  border-color: #fde68a;
}
.callout.warn b { color: #b45309; }
.callout.tip {
  background: #f0fdf4;
  border-color: #bbf7d0;
}
.callout.tip b { color: #15803d; }

.compare {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 12px 0;
}
@media (max-width: 640px) {
  .compare {
    grid-template-columns: 1fr;
  }
}
.compare > div {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
}
.compare h4 {
  margin: 0 0 6px !important;
}

.steps {
  margin: 10px 0 14px;
  padding-left: 22px;
}
.steps li {
  margin-bottom: 6px;
}
.steps li b {
  margin-right: 6px;
}

.case {
  background: #faf5ff;
  border: 1px solid #e9d5ff;
  border-radius: 10px;
  padding: 13px 16px;
  margin: 14px 0;
}
.case-title {
  font-weight: 800;
  color: #6b21a8;
  margin-bottom: 6px;
}

a.stk, span.stk {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 7px;
  border-radius: 6px;
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  color: #1d4ed8;
  font-size: 12.5px;
  font-weight: 700;
  text-decoration: none !important;
  white-space: nowrap;
}
.stk-c {
  font-family: var(--mono);
  font-size: 11.5px;
  opacity: 0.85;
}

a.term {
  color: #0f766e;
  border-bottom: 1px dashed #14b8a6;
  text-decoration: none !important;
  font-weight: 600;
}
a.term:hover {
  background: #f0fdfa;
}

.lsec > h3 {
  margin: 0 0 12px;
  font-size: 17px;
}
.pf-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.pf {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.pf-m {
  font-weight: 700;
  color: #b91c1c;
}
.pf-m span, .pf-f span {
  display: inline-block;
  font-size: 11.5px;
  padding: 1px 6px;
  border-radius: 5px;
  margin-right: 6px;
}
.pf-m span { background: #fee2e2; }
.pf-f span { background: #dcfce7; color: #15803d; font-weight: 700; }

.pb {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
}
.pb p { margin: 4px 0 0; }

.lq {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.lq-item {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
}
.lq-q {
  margin: 0 0 10px;
  font-weight: 700;
}
.lq-n {
  display: inline-block;
  background: var(--tc, var(--primary));
  color: #fff;
  font-size: 11.5px;
  padding: 1px 7px;
  border-radius: 6px;
  margin-right: 7px;
}
.lq-opts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
@media (max-width: 640px) {
  .lq-opts {
    grid-template-columns: 1fr;
  }
}
.lq-opt {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  text-align: left;
  padding: 9px 11px;
  border-radius: 8px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  cursor: pointer;
  font-size: 13.5px;
}
.lq-opt:hover:not(:disabled) {
  border-color: var(--tc, var(--primary));
  background: var(--primary-soft);
}
.lq-opt.right {
  background: #dcfce7;
  border-color: #16a34a;
  color: #14532d;
  font-weight: 700;
}
.lq-opt.wrong {
  background: #fee2e2;
  border-color: #e11d48;
  color: #881337;
}
.lq-l {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: var(--surface-alt);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;
  flex-shrink: 0;
}
.lq-exp {
  margin-top: 10px;
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 13px;
  background: var(--surface);
  border: 1px solid var(--border);
}
.lq-exp.ok { border-left: 4px solid var(--down); }
.lq-exp.bad { border-left: 4px solid var(--up); }

.lq-result {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px;
  border-radius: 12px;
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
}
.lq-result.fail {
  background: #fffbeb;
  border-color: #fde68a;
}
.lqr-score {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.lqr-score b {
  position: absolute;
  font-size: 18px;
  font-weight: 800;
}
.lqr-score.big b {
  font-size: 24px;
}

.sources ol {
  margin: 0;
  padding-left: 20px;
  font-size: 13px;
}
.disc-line {
  font-size: 12px;
  color: var(--muted);
  margin: 0;
}
.prevnext {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 600px) {
  .prevnext {
    grid-template-columns: 1fr;
  }
}
.pn {
  display: flex;
  flex-direction: column;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  text-decoration: none !important;
}
.pn.next {
  text-align: right;
}
.pn small {
  font-size: 11.5px;
  color: var(--muted);
}

.toc-in {
  position: sticky;
  top: 72px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
}
.toc-in > b {
  display: block;
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 8px;
}
.toc-in ol {
  list-style: none;
  margin: 0 0 12px;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.toc-in a {
  display: block;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 12.5px;
  color: var(--text-sub);
  text-decoration: none !important;
}
.toc-in a.on, .toc-in a:hover {
  background: var(--ts, var(--primary-soft));
  color: var(--tc, var(--primary));
  font-weight: 700;
}

/* -------------------- Interactive Widgets (.w-card) -------------------- */
.widget {
  margin: 16px 0;
}
.w-card {
  background: #f8fafc;
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
}
.w-hd {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.w-ic {
  font-size: 18px;
}
.w-tt {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
}
.w-tt b {
  font-size: 14.5px;
}
.w-tt small {
  font-size: 12px;
  color: var(--muted);
}
.w-badge {
  font-size: 11px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 999px;
  background: #dbeafe;
  color: #1e40af;
}
.w-ctrl {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.w-ctrl:empty {
  display: none;
}
.w-sl {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px 9px;
  font-size: 12.5px;
}
.w-sl-v {
  font-weight: 700;
  font-family: var(--mono);
  min-width: 28px;
  text-align: right;
}
.w-seg {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 3px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 3px;
}
.w-seg-l {
  font-size: 12px;
  color: var(--muted);
  padding: 0 6px;
}
.w-seg button {
  border: none;
  background: transparent;
  padding: 4px 9px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.w-seg button.on {
  background: var(--primary);
  color: #fff;
}
.w-tg {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  cursor: pointer;
}
.w-fields {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 8px;
  width: 100%;
}
.w-f {
  display: flex;
  flex-direction: column;
  gap: 3px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 9px;
  font-size: 12px;
}
.w-f-in {
  display: flex;
  align-items: center;
  gap: 4px;
}
.w-f-in input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 6px;
  font-weight: 700;
}
.w-body {
  min-width: 0;
}
.w-svg {
  width: 100%;
  height: auto;
  display: block;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 8px;
}
.w-stats, .w-readout {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 8px 0;
}
.w-stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12.5px;
  display: flex;
  flex-direction: column;
}
.w-stat small {
  font-size: 11px;
  color: var(--muted);
}
.w-stat b {
  font-size: 14px;
}
.w-explain, .w-note, .w-out {
  margin-top: 8px;
  padding: 8px 11px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
}
.w-foot {
  margin-top: 8px;
  font-size: 11.5px;
  color: var(--muted);
}
.w-anat, .w-pat, .w-two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  align-items: center;
}
@media (max-width: 680px) {
  .w-anat, .w-pat, .w-two {
    grid-template-columns: 1fr;
  }
}
.w-sm-cols {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
@media (max-width: 680px) {
  .w-sm-cols {
    grid-template-columns: 1fr;
  }
}
.w-sm-col {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px;
}
.w-sm-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 5px 8px;
  margin-top: 4px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface-alt);
  font-size: 12.5px;
  cursor: pointer;
}
.w-sm-item.on {
  background: var(--primary-soft);
  border-color: var(--primary);
  font-weight: 700;
}
.w-cal-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
}
.w-cal-m {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px;
  font-size: 12px;
}
.w-scroll {
  overflow-x: auto;
}

/* -------------------- Glossary (#/glossary) & Term Popover -------------------- */
.page-hd {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 14px;
}
.page-hd h1 {
  margin: 0 0 4px;
  font-size: 24px;
}
.page-hd p {
  margin: 0;
}

.g-tools {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.g-search {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--border-strong);
  border-radius: 9px;
  padding: 7px 12px;
  background: var(--surface);
}
.g-search input {
  flex: 1;
  border: none;
  outline: none;
  font-size: 14.5px;
  background: transparent;
}
.g-imp {
  margin-left: auto;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
.g-count {
  margin-bottom: 8px;
  font-size: 12.5px;
}
.g-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.g-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 4px solid var(--c, var(--primary));
  border-radius: 10px;
  overflow: hidden;
}
.g-hd {
  width: 100%;
  border: none;
  background: transparent;
  padding: 12px 15px;
  text-align: left;
  cursor: pointer;
  display: grid;
  grid-template-columns: auto auto 1fr;
  align-items: center;
  gap: 8px 12px;
}
@media (max-width: 680px) {
  .g-hd {
    grid-template-columns: 1fr;
  }
}
.g-t b {
  font-size: 15.5px;
  margin-right: 6px;
}
.g-t small {
  color: var(--muted);
  font-size: 12px;
}
.g-meta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.g-seen {
  color: var(--down);
  font-weight: 800;
}
.g-short {
  color: var(--text-sub);
  font-size: 13.5px;
}
.g-bd {
  display: none;
  padding: 0 15px 14px;
  border-top: 1px solid var(--surface-alt);
  font-size: 13.5px;
}

  <script>/* js/campus_nav.js */
/* 開心學園 · 校園導覽按鈕（共用片段 campus_nav.js）
 *
 * 唯一來源：~/campus_map_platform/shared/campus_nav.js
 *   各工具 static/ 裡的副本請勿直接修改 —— 改這裡，再跑 python3 ~/campus_map_platform/tools/sync_campus_nav.py 同步。
 *
 * 用法（每個學院／實戰工具）：
 *   1. 在 header 品牌區最前面放 placeholder（工具 id 見 ~/campus_map_platform/registry.json）：
 *        <a class="campus-home" data-campus-home="english" href="https://okayell.github.io/">🏫 校園</a>
 *      深色 header 加 data-campus-theme="dark"。
 *   2. 用一般的 <script src="…/campus_nav.js"><\/script> 載入（各工具的 build_dist 會把它內嵌進單一 index.html）。
 *   沒有 placeholder 時，會在畫面左上角產生浮動的「🏫 校園」按鈕。
 *
 * 連結目標：
 *   - GitHub Pages（*.github.io）            → 同網域根目錄 /（= https://okayell.github.io/ 校園地圖）
 *   - Cloudtop 本機（已知工具 port，非 localhost）→ 同主機 :8919 的本機校園地圖
 *   - file:// 單一檔、localhost、其他網域        → https://okayell.github.io/
 *   連結會帶 ?from=<工具 id>，校園地圖會標示「你剛剛在這裡」；同網域時另在 localStorage 記錄最近造訪。
 */
(function () {
  'use strict';
  if (window.CampusNav) return;

  var PUBLIC_CAMPUS = 'https://okayell.github.io/';
  var LOCAL_CAMPUS_PORT = '8919';
  // Cloudtop 上各工具的 Autobahn proxy 與 Python backend port（registry.json 的 local_port / backend_port）。
  var LOCAL_PORTS = ['8919', '8918', '8911', '8910', '8923', '8922', '8925', '8924', '8899', '8898',
    '8905', '8904', '8913', '8912', '8915', '8914', '8917', '8916'];
  var TOOL_MAP = {
    english: { port: '8911', path: 'english-speak-listen/' },
    japanese: { port: '8923', path: 'japanese/' },
    finance: { port: '8925', path: 'finance/' },
    stock: { port: '8905', path: 'tw-stock-insight/' },
    poker: { port: '8899', path: 'poker-gto/' },
    nba: { port: '8913', path: 'nba-betting-iq/' },
    epl: { port: '8917', path: 'epl-odds-iq/' },
    f1: { port: '8915', path: 'f1-odds-iq/' }
  };
  var VISITS_KEY = 'okayell.campus.visits.v1';

  function campusBase() {
    var loc = window.location;
    if (loc.protocol === 'http:' || loc.protocol === 'https:') {
      var host = loc.hostname || '';
      if (/(^|\.)github\.io$/i.test(host)) return loc.origin + '/';
      return loc.protocol + '//' + host + ':' + LOCAL_CAMPUS_PORT + '/';
    }
    return PUBLIC_CAMPUS;
  }

  function campusUrl(toolId) {
    var base = campusBase();
    return toolId ? base + '?from=' + encodeURIComponent(toolId) : base;
  }

  function toolUrl(targetId, hash) {
    var t = TOOL_MAP[targetId];
    var h = String(hash || '').trim();
    if (h && h.charAt(0) !== '#') h = '#' + (h.charAt(0) === '/' ? '' : '/') + h;
    if (!t) return campusUrl(targetId);
    var loc = window.location;
    if (loc.protocol === 'http:' || loc.protocol === 'https:') {
      var host = loc.hostname || '';
      if (/(^|\.)github\.io$/i.test(host)) return loc.origin + '/' + t.path + h;
      return loc.protocol + '//' + host + ':' + t.port + '/' + h;
    }
    return PUBLIC_CAMPUS + t.path + h;
  }

  function recordVisit(toolId) {
    if (!toolId) return;
    try {
      var raw = window.localStorage.getItem(VISITS_KEY);
      var visits = raw ? JSON.parse(raw) : {};
      if (!visits || typeof visits !== 'object' || Array.isArray(visits)) visits = {};
      visits[toolId] = Date.now();
      window.localStorage.setItem(VISITS_KEY, JSON.stringify(visits));
    } catch (e) { /* 無痕模式或空間不足：略過 */ }
  }

  var CSS = [
    '.campus-home{display:inline-flex;align-items:center;gap:5px;flex:none;box-sizing:border-box;height:30px;',

    'color:#3730a3;font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",',
    '"Microsoft JhengHei",sans-serif;letter-spacing:0;text-decoration:none!important;white-space:nowrap;',
    'cursor:pointer;vertical-align:middle;transition:background .15s,box-shadow .15s,transform .15s}',
    '.campus-home:hover{background:#e0e7ff;box-shadow:0 2px 8px rgba(55,48,163,.18);transform:translateY(-1px)}',
    '.campus-home:focus-visible{outline:2px solid #6366f1;outline-offset:2px}',
    '.campus-home .ch-ic{font-size:15px;line-height:1}',
    '.campus-home.campus-sibling{background:#fffbeb;border-color:#fcd34d;color:#92400e;margin-right:10px}',
    '.campus-home.campus-sibling:hover{background:#fef3c7;box-shadow:0 2px 8px rgba(180,83,9,.16)}',
    '.campus-home[data-campus-theme="dark"]{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.30);color:#f8fafc}',
    '.campus-home[data-campus-theme="dark"]:hover{background:rgba(255,255,255,.18)}',
    '.campus-home.floating{position:fixed;left:12px;top:12px;z-index:2147483000;margin:0;',
    'box-shadow:0 4px 14px rgba(15,23,42,.18)}',
    '.campus-acad-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 12px;margin:8px 0 12px;',
    'border-radius:12px;background:linear-gradient(90deg,#fffbeb,#fef3c7);border:1px solid #fcd34d;font-size:13px;color:#78350f}',
    '.campus-acad-bar b{font-weight:800;color:#92400e;display:inline-flex;align-items:center;gap:4px}',
    '.campus-acad-pill{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:999px;',
    'background:#fff;border:1px solid #f59e0b;color:#92400e;font-size:12.5px;font-weight:700;text-decoration:none!important;',
    'white-space:nowrap;transition:background .15s,transform .15s}',
    '.campus-acad-pill:hover{background:#fef3c7;transform:translateY(-1px)}',
    '@media (max-width:640px){.campus-home{padding:0 8px;margin-right:5px}.campus-home:not(.campus-sibling) .ch-txt{display:none}}',
    '@media print{.campus-home,.campus-acad-bar{display:none!important}}',
  ].join('');

  function injectCss() {
    if (document.getElementById('campusNavCss')) return;
    var st = document.createElement('style');
    st.id = 'campusNavCss';
    st.textContent = CSS;
    (document.head || document.documentElement).appendChild(st);
  }

  function decorate(a, toolId) {
    a.href = campusUrl(toolId);
    a.classList.add('campus-home');
    a.removeAttribute('target');
    a.setAttribute('title', '回到開心學園 · 校園地圖');
    a.setAttribute('aria-label', '回到開心學園校園地圖');
    a.innerHTML = '<span class="ch-ic" aria-hidden="true">🏫</span><span class="ch-txt">校園</span>';
  }

  function wireGoLinks(root) {
    var scope = root && root.querySelectorAll ? root : document;
    var links = scope.querySelectorAll('[data-campus-go]');
    for (var i = 0; i < links.length; i++) {
      var el = links[i];
      var tid = el.getAttribute('data-campus-go');
      var h = el.getAttribute('data-campus-hash') || '';
      if (tid) {
        el.href = toolUrl(tid, h);
        el.removeAttribute('target');
      }
    }
  }

  function init() {
    injectCss();
    var toolId = window.CAMPUS_TOOL_ID || '';
    var nodes = document.querySelectorAll('[data-campus-home]');
    if (nodes.length) {
      for (var i = 0; i < nodes.length; i++) {
        var id = nodes[i].getAttribute('data-campus-home') || toolId;
        if (!toolId) toolId = id;
        decorate(nodes[i], id);
      }
    } else if (document.body) {
      var a = document.createElement('a');
      a.className = 'campus-home floating';
      document.body.appendChild(a);
      decorate(a, toolId);
    }
    wireGoLinks(document);
    if (window.MutationObserver && document.body) {
      var mo = new MutationObserver(function () { wireGoLinks(document); });
      mo.observe(document.body, { childList: true, subtree: true });
    }
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('[data-campus-go]') : null;
      if (!a) return;
      var tid = a.getAttribute('data-campus-go');
      var h = a.getAttribute('data-campus-hash') || '';
      if (tid) {
        recordVisit(tid);
        a.href = toolUrl(tid, h);
      }
    }, true);
    recordVisit(toolId);
  }

  window.CampusNav = { base: campusBase, url: campusUrl, toolUrl: toolUrl, wire: wireGoLinks, init: init, visitsKey: VISITS_KEY };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

  <script>/* js/core.js */
/* 財經學院 — core.js
 * 共用核心：命名空間、DOM 工具、事件、提示／彈窗、學習狀態（localStorage `fin.state.v1`）、
 * XP／連續天數、課程索引、實戰區深連結、路由（#/page/param?query）。
 */
(function () {
  'use strict';
  const FIN = (window.FIN = window.FIN || {});
  FIN.LESSONS = FIN.LESSONS || [];
  FIN.GLOSSARY = FIN.GLOSSARY || [];

  // ---------------------------------------------------------------------------
  // 1. DOM / 格式工具
  // ---------------------------------------------------------------------------
  FIN.$ = (sel, root) => (root || document).querySelector(sel);
  FIN.$$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  FIN.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
  FIN.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  FIN.pad = (n) => String(n).padStart(2, '0');
  FIN.shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  FIN.debounce = (fn, ms) => {
    let t = null;
    return function (...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), ms); };
  };
  FIN.dayKey = (d) => `${d.getFullYear()}-${FIN.pad(d.getMonth() + 1)}-${FIN.pad(d.getDate())}`;
  FIN.todayKey = () => FIN.dayKey(new Date());
  FIN.fmtDate = (ts) => {
    if (!ts) return '—';
    const d = new Date(ts);
    return `${d.getFullYear()}/${FIN.pad(d.getMonth() + 1)}/${FIN.pad(d.getDate())}`;
  };
  FIN.fmtNum = (v, dp) => {
    if (v == null || !isFinite(v)) return '—';
    const d = dp == null ? (Math.abs(v) >= 100 ? 0 : 2) : dp;
    return Number(v).toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d });
  };
  FIN.pct = (v, dp) => (v == null || !isFinite(v) ? '—' : `${FIN.fmtNum(v * 100, dp == null ? 1 : dp)}%`);
  /** 中文 IME 選字時的 Enter 不算送出（注音／倉頡）。 */
  let imeComposing = false;
  let imeEndAt = 0;
  document.addEventListener('compositionstart', () => { imeComposing = true; }, true);
  document.addEventListener('compositionend', () => { imeComposing = false; imeEndAt = Date.now(); }, true);
  FIN.isEnterSend = (ev) => ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing && ev.keyCode !== 229 &&
    !imeComposing && Date.now() - imeEndAt >= 150;
  FIN.copy = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e2) { /* ignore */ }
      ta.remove();
    }
    FIN.toast('📋 已複製', 'ok');
  };

  // ---------------------------------------------------------------------------
  // 2. 事件匯流排
  // ---------------------------------------------------------------------------
  const listeners = {};
  FIN.on = (evt, fn) => { (listeners[evt] = listeners[evt] || []).push(fn); };
  FIN.emit = (evt, data) => (listeners[evt] || []).forEach((fn) => { try { fn(data); } catch (e) { console.error(e); } });

  // ---------------------------------------------------------------------------
  // 3. 提示 / 彈窗
  // ---------------------------------------------------------------------------
  FIN.toast = (msg, kind) => {
    let box = FIN.$('#toastBox');
    if (!box) {
      box = document.createElement('div');
      box.id = 'toastBox';
      box.setAttribute('role', 'status');
      document.body.appendChild(box);
    }
    const el = document.createElement('div');
    el.className = `toast ${kind || ''}`;
    el.textContent = msg;
    box.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, kind === 'bad' ? 4200 : 2600);
  };

  FIN.modal = ({ title, body, actions, wide, onClose, cls }) => {
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    wrap.innerHTML = `<div class="modal ${wide ? 'wide' : ''} ${cls || ''}" role="dialog" aria-modal="true" aria-label="${FIN.esc(String(title || '').replace(/<[^>]+>/g, ''))}">
      <div class="modal-hd"><h3>${title || ''}</h3><button type="button" class="icon-btn" data-close aria-label="關閉">✕</button></div>
      <div class="modal-bd"></div><div class="modal-ft"></div></div>`;
    const bd = FIN.$('.modal-bd', wrap);
    if (typeof body === 'string') bd.innerHTML = body;
    else if (body) bd.appendChild(body);
    const ft = FIN.$('.modal-ft', wrap);
    (actions || []).forEach((a) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = `btn ${a.primary ? 'primary' : ''} ${a.danger ? 'danger' : ''}`;
      b.textContent = a.label;
      b.onclick = async () => { const keep = a.onClick ? await a.onClick(api) : false; if (keep !== true) api.close(); };
      ft.appendChild(b);
    });
    if (!(actions || []).length) ft.remove();
    const onKey = (e) => { if (e.key === 'Escape' && !e.isComposing) api.close(); };
    const api = {
      el: wrap,
      body: bd,
      close() {
        document.removeEventListener('keydown', onKey);
        wrap.classList.remove('show');
        setTimeout(() => wrap.remove(), 180);
        if (onClose) onClose();
      },
    };
    wrap.addEventListener('mousedown', (e) => { if (e.target === wrap) api.close(); });
    FIN.$('[data-close]', wrap).onclick = () => api.close();
    document.addEventListener('keydown', onKey);
    document.body.appendChild(wrap);
    requestAnimationFrame(() => wrap.classList.add('show'));
    return api;
  };

  FIN.confirm = (msg, okLabel) => new Promise((resolve) => {
    let done = false;
    FIN.modal({
      title: '請確認',
      body: `<p class="confirm-msg">${msg}</p>`,
      actions: [
        { label: '取消', onClick: () => { done = true; resolve(false); } },
        { label: okLabel || '確定', primary: true, danger: true, onClick: () => { done = true; resolve(true); } },
      ],
      onClose: () => { if (!done) resolve(false); },
    });
  });

  // ---------------------------------------------------------------------------
  // 4. 課程與術語索引
  // ---------------------------------------------------------------------------
  const STAGE_ORDER = { basic: 0, advanced: 1, practice: 2 };
  let LESSON_MAP = null;
  let TERM_MAP = null;
  FIN.index = () => {
    LESSON_MAP = new Map();
    const trackIdx = {};
    (FIN.TRACKS || []).forEach((t, i) => { trackIdx[t.id] = i; });
    const valid = FIN.LESSONS.filter((L) => L && L.id && FIN.track(L.track));
    valid.sort((a, b) => (trackIdx[a.track] - trackIdx[b.track]) || (STAGE_ORDER[a.stage] - STAGE_ORDER[b.stage]) ||
      ((a.order || 0) - (b.order || 0)));
    valid.forEach((L) => { if (!LESSON_MAP.has(L.id)) LESSON_MAP.set(L.id, L); });
    TERM_MAP = new Map();
    FIN.GLOSSARY.forEach((g) => { if (g && g.id && !TERM_MAP.has(g.id)) TERM_MAP.set(g.id, g); });
  };
  FIN.lessons = (trackId) => {
    if (!LESSON_MAP) FIN.index();
    const all = Array.from(LESSON_MAP.values());
    return trackId ? all.filter((L) => L.track === trackId) : all;
  };
  FIN.lesson = (id) => { if (!LESSON_MAP) FIN.index(); return LESSON_MAP.get(id) || null; };
  FIN.terms = () => { if (!TERM_MAP) FIN.index(); return Array.from(TERM_MAP.values()); };
  FIN.term = (id) => { if (!TERM_MAP) FIN.index(); return TERM_MAP.get(id) || null; };
  /** 分院內上一課／下一課（跨階段；最後一課的下一課 = 下一個分院的第一課）。 */
  FIN.neighbors = (id) => {
    const all = FIN.lessons();
    const i = all.findIndex((L) => L.id === id);
    return { prev: i > 0 ? all[i - 1] : null, next: i >= 0 && i < all.length - 1 ? all[i + 1] : null };
  };

  // ---------------------------------------------------------------------------
  // 5. 學習狀態（localStorage；key 一律 fin.* 前綴，避免與同網域其他工具衝突）
  // ---------------------------------------------------------------------------
  const KEY = 'fin.state.v1';
  function defaults() {
    return {
      v: 1,
      lessons: {},
      days: {},
      quiz: { answered: 0, correct: 0, wrong: {}, history: [] },
      terms: {},
      meta: { created: Date.now(), last: null, welcomeDismissed: false },
    };
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const st = JSON.parse(raw);
        const d = defaults();
        return {
          ...d, ...st,
          quiz: { ...d.quiz, ...(st.quiz || {}) },
          meta: { ...d.meta, ...(st.meta || {}) },
        };
      }
    } catch (e) { /* 損毀 → 重新開始 */ }
    return defaults();
  }
  FIN.state = load();
  FIN.save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(FIN.state)); } catch (e) { /* 無痕或空間不足 */ }
    FIN.emit('state');
  };
  FIN.resetState = () => {
    FIN.state = defaults();
    FIN.save();
  };
  FIN.prog = (id) => FIN.state.lessons[id] || {};
  FIN.isDone = (id) => !!(FIN.state.lessons[id] && FIN.state.lessons[id].done);
  FIN.isRead = (id) => !!(FIN.state.lessons[id] && (FIN.state.lessons[id].read || FIN.state.lessons[id].done));

  FIN.day = (k) => {
    k = k || FIN.todayKey();
    if (!FIN.state.days[k]) FIN.state.days[k] = { xp: 0, act: {} };
    const d = FIN.state.days[k];
    d.act = d.act || {};
    return d;
  };
  FIN.addXP = (n, act, count) => {
    const d = FIN.day();
    d.xp = (d.xp || 0) + (n || 0);
    if (act) d.act[act] = (d.act[act] || 0) + (count == null ? 1 : count);
    FIN.save();
    FIN.emit('xp', n);
  };
  const dayActive = (k) => !!FIN.state.days[k] && (FIN.state.days[k].xp || 0) > 0;
  FIN.streak = () => {
    const d = new Date();
    if (!dayActive(FIN.dayKey(d))) d.setDate(d.getDate() - 1);
    let n = 0;
    while (dayActive(FIN.dayKey(d)) && n < 3650) { n++; d.setDate(d.getDate() - 1); }
    return n;
  };
  FIN.totalXP = () => Object.values(FIN.state.days).reduce((a, d) => a + (d.xp || 0), 0);

  FIN.markRead = (id) => {
    const p = FIN.state.lessons[id] || {};
    FIN.state.meta.last = { lesson: id, at: Date.now() };
    if (!p.read) {
      p.read = Date.now();
      FIN.state.lessons[id] = p;
      FIN.addXP(5, 'read');
    } else {
      FIN.state.lessons[id] = p;
      FIN.save();
    }
  };
  FIN.touchLesson = (id) => {
    FIN.state.meta.last = { lesson: id, at: Date.now() };
    FIN.save();
  };
  /** 隨堂測驗成績（0–100）。≥ 60 分即完成本課。回傳是否「這次」才完成。 */
  FIN.recordLessonQuiz = (id, score) => {
    const p = FIN.state.lessons[id] || {};
    p.last = score;
    p.best = Math.max(p.best || 0, score);
    p.tries = (p.tries || 0) + 1;
    if (!p.read) p.read = Date.now();
    let newlyDone = false;
    if (!p.done && score >= 60) { p.done = Date.now(); newlyDone = true; }
    FIN.state.lessons[id] = p;
    FIN.state.meta.last = { lesson: id, at: Date.now() };
    FIN.addXP(newlyDone ? 20 : 0, newlyDone ? 'done' : null);
    return newlyDone;
  };
  /** 記錄一題作答（課程題或術語題）。qid：`<lessonId>#<i>` 或 `term:<id>`。 */
  FIN.recordAnswer = (qid, ok) => {
    const q = FIN.state.quiz;
    q.answered = (q.answered || 0) + 1;
    if (ok) {
      q.correct = (q.correct || 0) + 1;
      if (q.wrong[qid]) {
        q.wrong[qid].streak = (q.wrong[qid].streak || 0) + 1;
        if (q.wrong[qid].streak >= 2) delete q.wrong[qid];
      }
    } else {
      q.wrong[qid] = { n: ((q.wrong[qid] || {}).n || 0) + 1, at: Date.now(), streak: 0 };
    }
    FIN.addXP(ok ? 2 : 0, ok ? 'correct' : 'quiz');
  };
  FIN.viewTerm = (id) => {
    if (FIN.state.terms[id]) return;
    FIN.state.terms[id] = Date.now();
    FIN.addXP(1, 'term');
  };
  FIN.trackProgress = (trackId) => {
    const ls = FIN.lessons(trackId);
    const done = ls.filter((L) => FIN.isDone(L.id)).length;
    const read = ls.filter((L) => FIN.isRead(L.id)).length;
    return { total: ls.length, done, read, pct: ls.length ? done / ls.length : 0 };
  };
  /** 推薦下一課：最近讀的那課若未完成就繼續，否則該分院第一個未完成的課。 */
  FIN.nextLesson = (trackId) => {
    const last = FIN.state.meta.last && FIN.lesson(FIN.state.meta.last.lesson);
    if (!trackId && last && !FIN.isDone(last.id)) return last;
    const pool = trackId ? FIN.lessons(trackId) : (last ? FIN.lessons(last.track).concat(FIN.lessons()) : FIN.lessons());
    return pool.find((L) => !FIN.isDone(L.id)) || null;
  };

  // ---------------------------------------------------------------------------
  // 6. 執行環境與實戰區深連結
  // ---------------------------------------------------------------------------
  FIN.isStatic = () => !!(window.FIN_STATIC_ONLY || (location.protocol !== 'http:' && location.protocol !== 'https:') ||
    /\.github\.io$|\.pages\.dev$|\.netlify\.app$|\.vercel\.app$/i.test(location.hostname || ''));
  const LOCAL_PORTS = ['8924', '8925'];
  /** 在 Cloudtop 本機執行時一律連到同主機的台股智慧選股 (:8905)；GitHub / file 版連公開網址。 */
  FIN.practiceUrl = (route) => {
    const r = String(route || '#/');
    const hash = r.startsWith('#') ? r : `#${r}`;
    const loc = window.location;
    const host = loc.hostname || '';
    if ((loc.protocol === 'http:' || loc.protocol === 'https:') && !/(^|\.)github\.io$/i.test(host)) {
      return `${loc.protocol}//${host}:${FIN.PRACTICE.localPort}/${hash}`;
    }
    return FIN.PRACTICE.publicUrl + hash;
  };

  // ---------------------------------------------------------------------------
  // 7. 路由（#/page/param?query）
  // ---------------------------------------------------------------------------
  FIN.routes = {};
  FIN.route = (name, fn) => { FIN.routes[name] = fn; };
  const cleanups = [];
  FIN.onCleanup = (fn) => cleanups.push(fn);
  FIN.parseHash = () => {
    const raw = location.hash.replace(/^#\/?/, '');
    const hi = raw.indexOf('#');
    const h = hi >= 0 ? raw.slice(0, hi) : raw;
    const anchor = hi >= 0 ? raw.slice(hi + 1) : '';
    const qi = h.indexOf('?');
    const p = qi >= 0 ? h.slice(0, qi) : h;
    const qs = qi >= 0 ? h.slice(qi + 1) : '';
    const parts = p.split('/').filter(Boolean).map((x) => { try { return decodeURIComponent(x); } catch (e) { return x; } });
    return { name: parts[0] || 'home', params: parts.slice(1), query: Object.fromEntries(new URLSearchParams(qs)), anchor };
  };
  FIN.go = (hash) => {
    if (location.hash === hash) FIN.renderRoute();
    else location.hash = hash;
  };
  FIN.runCleanups = () => {
    while (cleanups.length) {
      const fn = cleanups.pop();
      try { fn(); } catch (e) { console.error(e); }
    }
  };
  FIN.renderRoute = () => {
    FIN.runCleanups();
    const r = FIN.parseHash();
    const main = FIN.$('#appMain');
    const fn = FIN.routes[r.name] || FIN.routes.home;
    const prev = FIN.curRoute;
    FIN.curRoute = r;
    main.innerHTML = '';
    main.className = `app-main page-${FIN.routes[r.name] ? r.name : 'home'}`;
    main.removeAttribute('style');
    try {
      fn(main, r.params, r.query);
    } catch (e) {
      console.error(e);
      main.innerHTML = `<div class="card empty"><h3>這個頁面出了點問題</h3><p class="muted">${FIN.esc(e.message)}</p>
        <a class="btn primary" href="#/home">回學院本部</a></div>`;
    }
    FIN.emit('route', r);
    const samePage = prev && prev.name === r.name && prev.params.join('/') === r.params.join('/');
    if (!samePage) window.scrollTo({ top: 0, behavior: 'auto' });
  };
  window.addEventListener('hashchange', FIN.renderRoute);
})();

  <script>/* js/indicators.js */
/* 財經學院 — indicators.js
 * 示意行情產生器與技術指標（純函式，無 DOM）：
 *   - 可重現亂數（mulberry32）、台股升降單位與 ±10% 漲跌幅限制
 *   - genOHLC：產生日 K（開高低收量 + 交易日日期）
 *   - SMA / EMA / KD(9,3,3) / RSI(Wilder) / MACD(12,26,9：DIF、MACD、OSC) / 布林通道 / 交叉 / 轉折點
 */
(function () {
  'use strict';
  const FIN = (window.FIN = window.FIN || {});
  const M = (FIN.math = {});

  /** mulberry32：同一個 seed 每次都產生同一串亂數（示意圖可重現）。 */
  M.rng = (seed) => {
    let a = (seed >>> 0) || 1;
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  M.gauss = (rand) => {
    let u = 0; let v = 0;
    while (u === 0) u = rand();
    while (v === 0) v = rand();
    return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
  };

  /** 台股升降單位（股票）：<10 0.01、<50 0.05、<100 0.1、<500 0.5、<1000 1、≥1000 5。 */
  M.tick = (p) => (p < 10 ? 0.01 : p < 50 ? 0.05 : p < 100 ? 0.1 : p < 500 ? 0.5 : p < 1000 ? 1 : 5);
  M.roundTick = (p, mode) => {
    const t = M.tick(p);
    const x = p / t;
    const n = mode === 'down' ? Math.floor(x + 1e-9) : mode === 'up' ? Math.ceil(x - 1e-9) : Math.round(x);
    return +(n * t).toFixed(2);
  };
  /** 漲停價／跌停價：前一日收盤 ±10%，再依升降單位取到可成交價（漲停向下、跌停向上取）。 */
  M.limitUp = (prev) => M.roundTick(prev * 1.1, 'down');
  M.limitDown = (prev) => M.roundTick(prev * 0.9, 'up');

  /** 交易日日期（跳過週六日），回傳 'MM/DD'。 */
  M.tradingDates = (n, end) => {
    const out = [];
    const d = end ? new Date(end) : new Date(2026, 8, 30);
    while (out.length < n) {
      const wd = d.getDay();
      if (wd !== 0 && wd !== 6) out.push(`${FIN.pad ? FIN.pad(d.getMonth() + 1) : d.getMonth() + 1}/${FIN.pad ? FIN.pad(d.getDate()) : d.getDate()}`);
      d.setDate(d.getDate() - 1);
    }
    return out.reverse();
  };

  /**
   * 產生示意日 K。opts：n（根數）、seed、trend（up|down|range|custom）、vol（日波動，預設 0.018）、
   * start（起始價）、drift（每日漂移，覆蓋 trend）、shape（[{at:0..1, drift}] 分段漂移）、volBase（基準量，張）。
   */
  M.genOHLC = (opts) => {
    const o = Object.assign({ n: 80, seed: 7, trend: 'up', vol: 0.018, start: 100, volBase: 12000 }, opts || {});
    const rand = M.rng(o.seed);
    const driftOf = (i) => {
      if (o.shape && o.shape.length) {
        const x = i / Math.max(1, o.n - 1);
        let d = o.shape[0].drift;
        for (const seg of o.shape) if (x >= seg.at) d = seg.drift;
        return d;
      }
      if (o.drift != null) return o.drift;
      return o.trend === 'up' ? 0.0045 : o.trend === 'down' ? -0.0045 : 0;
    };
    const bars = [];
    let prev = M.roundTick(o.start);
    let anchor = prev;
    for (let i = 0; i < o.n; i++) {
      let drift = driftOf(i);
      if (o.trend === 'range' && !o.shape && o.drift == null) drift = (anchor - prev) / prev * 0.12; // 均值回歸
      const gap = M.gauss(rand) * o.vol * 0.35;
      let open = prev * (1 + gap);
      let close = open * (1 + drift + M.gauss(rand) * o.vol);
      const up = M.limitUp(prev);
      const dn = M.limitDown(prev);
      open = FIN.clamp ? FIN.clamp(open, dn, up) : Math.max(dn, Math.min(up, open));
      close = Math.max(dn, Math.min(up, close));
      const hiExt = Math.abs(M.gauss(rand)) * o.vol * 0.55;
      const loExt = Math.abs(M.gauss(rand)) * o.vol * 0.55;
      let high = Math.max(open, close) * (1 + hiExt);
      let low = Math.min(open, close) * (1 - loExt);
      high = Math.min(high, up);
      low = Math.max(low, dn);
      const bar = {
        o: M.roundTick(open), c: M.roundTick(close), h: M.roundTick(high, 'up'), l: M.roundTick(low, 'down'),
      };
      bar.h = Math.min(Math.max(bar.h, bar.o, bar.c), M.roundTick(up, 'down'));
      bar.l = Math.max(Math.min(bar.l, bar.o, bar.c), M.roundTick(dn, 'up'));
      const move = Math.abs(bar.c - prev) / prev;
      bar.v = Math.round(o.volBase * (0.6 + rand() * 0.5 + move * 18) * (bar.c >= bar.o ? 1.05 : 0.95));
      bar.prev = prev;
      bars.push(bar);
      prev = bar.c;
    }
    const dates = M.tradingDates(o.n);
    bars.forEach((b, i) => { b.d = dates[i]; b.i = i; });
    return bars;
  };

  M.closes = (bars) => bars.map((b) => b.c);
  M.sma = (arr, n) => {
    const out = new Array(arr.length).fill(null);
    let s = 0;
    for (let i = 0; i < arr.length; i++) {
      s += arr[i];
      if (i >= n) s -= arr[i - n];
      if (i >= n - 1) out[i] = s / n;
    }
    return out;
  };
  /** EMA：α = 2 ÷ (n + 1)，以前 n 筆的平均當起點。 */
  M.ema = (arr, n) => {
    const out = new Array(arr.length).fill(null);
    const k = 2 / (n + 1);
    let prev = null;
    let start = arr.findIndex((v) => v != null);
    if (start < 0) return out;
    for (let i = start; i < arr.length; i++) {
      const v = arr[i];
      if (v == null) continue;
      if (prev == null) {
        if (i - start + 1 < n) continue;
        let s = 0;
        for (let j = i - n + 1; j <= i; j++) s += arr[j];
        prev = s / n;
      } else {
        prev = v * k + prev * (1 - k);
      }
      out[i] = prev;
    }
    return out;
  };
  M.stdev = (arr, n) => {
    const out = new Array(arr.length).fill(null);
    for (let i = n - 1; i < arr.length; i++) {
      let s = 0;
      for (let j = i - n + 1; j <= i; j++) s += arr[j];
      const mean = s / n;
      let v = 0;
      for (let j = i - n + 1; j <= i; j++) v += (arr[j] - mean) ** 2;
      out[i] = Math.sqrt(v / n);
    }
    return out;
  };
  /**
   * KD（台灣慣用 9,3,3）：RSV =（C − 9 日最低）÷（9 日最高 − 9 日最低）× 100；
   * K = 前 K × 2/3 + RSV × 1/3；D = 前 D × 2/3 + K × 1/3；起始 K = D = 50。
   */
  M.kd = (bars, n, kSmooth, dSmooth) => {
    n = n || 9;
    const ka = 1 / (kSmooth || 3);
    const da = 1 / (dSmooth || 3);
    const K = new Array(bars.length).fill(null);
    const D = new Array(bars.length).fill(null);
    const RSV = new Array(bars.length).fill(null);
    let k = 50; let d = 50;
    for (let i = 0; i < bars.length; i++) {
      if (i < n - 1) continue;
      let hi = -Infinity; let lo = Infinity;
      for (let j = i - n + 1; j <= i; j++) { hi = Math.max(hi, bars[j].h); lo = Math.min(lo, bars[j].l); }
      const rsv = hi === lo ? 50 : (bars[i].c - lo) / (hi - lo) * 100;
      k = k * (1 - ka) + rsv * ka;
      d = d * (1 - da) + k * da;
      RSV[i] = rsv; K[i] = k; D[i] = d;
    }
    return { K, D, RSV };
  };
  /** RSI（Wilder 平滑）：RS = 平均漲幅 ÷ 平均跌幅；RSI = 100 − 100 ÷ (1 + RS)。 */
  M.rsi = (closes, n) => {
    n = n || 14;
    const out = new Array(closes.length).fill(null);
    if (closes.length <= n) return out;
    let g = 0; let l = 0;
    for (let i = 1; i <= n; i++) {
      const ch = closes[i] - closes[i - 1];
      if (ch > 0) g += ch; else l -= ch;
    }
    g /= n; l /= n;
    out[n] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    for (let i = n + 1; i < closes.length; i++) {
      const ch = closes[i] - closes[i - 1];
      g = (g * (n - 1) + Math.max(ch, 0)) / n;
      l = (l * (n - 1) + Math.max(-ch, 0)) / n;
      out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    }
    return out;
  };
  /** MACD：DIF = EMA(快) − EMA(慢)；MACD（訊號線）= DIF 的 EMA(訊號)；OSC = DIF − MACD。 */
  M.macd = (closes, fast, slow, sig) => {
    fast = fast || 12; slow = slow || 26; sig = sig || 9;
    const ef = M.ema(closes, fast);
    const es = M.ema(closes, slow);
    const dif = closes.map((_, i) => (ef[i] == null || es[i] == null ? null : ef[i] - es[i]));
    const macd = M.ema(dif, sig);
    const osc = dif.map((v, i) => (v == null || macd[i] == null ? null : v - macd[i]));
    return { dif, macd, osc };
  };
  /** 布林通道：中軌 = n 日均線；上下軌 = 中軌 ± k × n 日標準差。 */
  M.boll = (closes, n, k) => {
    n = n || 20; k = k == null ? 2 : k;
    const mid = M.sma(closes, n);
    const sd = M.stdev(closes, n);
    const up = mid.map((m, i) => (m == null ? null : m + k * sd[i]));
    const lo = mid.map((m, i) => (m == null ? null : m - k * sd[i]));
    const width = mid.map((m, i) => (m == null ? null : (up[i] - lo[i]) / m));
    return { mid, up, lo, width };
  };
  /** a 由下往上穿越 b → {i, dir:'up'}；由上往下 → {i, dir:'down'}。 */
  M.crosses = (a, b) => {
    const out = [];
    for (let i = 1; i < a.length; i++) {
      if ([a[i], b[i], a[i - 1], b[i - 1]].some((v) => v == null)) continue;
      if (a[i - 1] <= b[i - 1] && a[i] > b[i]) out.push({ i, dir: 'up' });
      else if (a[i - 1] >= b[i - 1] && a[i] < b[i]) out.push({ i, dir: 'down' });
    }
    return out;
  };
  /** 轉折高低點：左右各 k 根內的最高（swing high）或最低（swing low）。 */
  M.pivots = (bars, k) => {
    k = k || 4;
    const highs = []; const lows = [];
    for (let i = k; i < bars.length - k; i++) {
      let isH = true; let isL = true;
      for (let j = i - k; j <= i + k; j++) {
        if (j === i) continue;
        if (bars[j].h >= bars[i].h) isH = false;
        if (bars[j].l <= bars[i].l) isL = false;
      }
      if (isH) highs.push({ i, p: bars[i].h });
      if (isL) lows.push({ i, p: bars[i].l });
    }
    return { highs, lows };
  };
  /** 把相近的價位合併成支撐壓力區（相差 < tol 視為同一條）。 */
  M.levels = (points, tol) => {
    const sorted = points.slice().sort((a, b) => a.p - b.p);
    const out = [];
    for (const pt of sorted) {
      const last = out[out.length - 1];
      if (last && Math.abs(pt.p - last.p) / last.p < tol) {
        last.touches++;
        last.p = (last.p * (last.touches - 1) + pt.p) / last.touches;
        last.last = Math.max(last.last, pt.i);
      } else out.push({ p: pt.p, touches: 1, last: pt.i });
    }
    return out;
  };
  /** 皮爾森相關係數。 */
  M.corr = (a, b) => {
    const n = Math.min(a.length, b.length);
    let sa = 0; let sb = 0;
    for (let i = 0; i < n; i++) { sa += a[i]; sb += b[i]; }
    const ma = sa / n; const mb = sb / n;
    let cov = 0; let va = 0; let vb = 0;
    for (let i = 0; i < n; i++) { cov += (a[i] - ma) * (b[i] - mb); va += (a[i] - ma) ** 2; vb += (b[i] - mb) ** 2; }
    return cov / Math.sqrt(va * vb || 1);
  };
})();

  <script>/* js/widgets.js */
/* 財經學院 — widgets.js
 * 課程內的互動元件：<div class="widget" data-widget="名稱"></div> → FIN.hydrateWidgets(root)。
 * 純 SVG／HTML（無外部套件）。圖表寬度依容器量測，視窗縮放時重畫，手機上文字不會縮成一團。
 * 台股慣例：紅漲綠跌、±10% 漲跌幅、升降單位；KD(9,3,3)、RSI 14、MACD(12,26,9)、布林 20/±2σ。
 */
(function () {
  'use strict';
  const FIN = (window.FIN = window.FIN || {});
  const M = FIN.math;
  const esc = (s) => FIN.esc(s);
  const W = (FIN.widgets = FIN.widgets || { registry: {} });

  const C = {

    ma1: '#f59e0b', ma2: '#8b5cf6', ma3: '#0ea5e9', k: '#2563eb', d: '#f97316', rsi: '#7c3aed',
    dif: '#2563eb', sig: '#f97316', band: '#0d9488', foreign: '#2563eb', trust: '#db2777', dealer: '#f59e0b',
  };
  W.colors = C;
  const fmt = (v, dp) => FIN.fmtNum(v, dp);
  const sign = (v, dp) => (v > 0 ? '+' : '') + fmt(v, dp);
  const pctTxt = (v, dp) => (v == null || !isFinite(v) ? '—' : `${v > 0 ? '+' : ''}${fmt(v * 100, dp == null ? 2 : dp)}%`);
  const candleColor = (b) => (b.c > b.o ? C.up : b.c < b.o ? C.down : C.flat);

  // ---------------------------------------------------------------------------
  // 外框與控制項
  // ---------------------------------------------------------------------------
  function shell(el, o) {
    el.classList.add('w-card');
    el.innerHTML = `<div class="w-hd"><span class="w-ic" aria-hidden="true">${o.icon || '🧪'}</span>
      <div class="w-tt"><b>${esc(o.title)}</b>${o.hint ? `<small>${esc(o.hint)}</small>` : ''}</div>
      <span class="w-badge">互動</span></div>
      <div class="w-ctrl"></div><div class="w-body"></div>
      <div class="w-foot">${o.note === false ? '' : esc(o.note || '圖表為程式產生的示意資料，不是真實行情。')}</div>`;
    const foot = FIN.$('.w-foot', el);
    if (!foot.textContent.trim()) foot.remove();
    return { ctrl: FIN.$('.w-ctrl', el), body: FIN.$('.w-body', el) };
  }
  function node(html) {
    const t = document.createElement('div');
    t.innerHTML = html.trim();
    return t.firstElementChild;
  }
  function slider(parent, o) {
    const id = 'w' + Math.random().toString(36).slice(2, 9);
    const el = node(`<label class="w-sl" for="${id}"><span class="w-sl-l">${esc(o.label)}</span>
      <input id="${id}" type="range" min="${o.min}" max="${o.max}" step="${o.step || 1}" value="${o.value}">
      <output class="w-sl-v"></output></label>`);
    const inp = FIN.$('input', el);
    const out = FIN.$('output', el);

    show();
    inp.addEventListener('input', () => { show(); if (o.onInput) o.onInput(+inp.value); });

  }
  function seg(parent, o) {

      ${o.options.map(([v, t]) => `<button type="button" data-v="${esc(v)}" class="${String(v) === String(o.value) ? 'on' : ''}">${t}</button>`).join('')}</div>`);
