  <script>/* js/terms.js */
/* 財經學院 — terms.js
 * 術語百科：#/glossary（搜尋、分類、展開說明）＋ 課程內文「第一次出現自動連結」與提示框（popover）。
 */
(function () {
  'use strict';
  const FIN = window.FIN;
  const esc = FIN.esc;

  // ---------------------------------------------------------------------------
  // 1. 自動連結
  // ---------------------------------------------------------------------------
  let MATCHER = null;
  const ASCII = /^[\x20-\x7e]+$/;
  const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function buildMatcher() {
    const keys = [];
    FIN.terms().forEach((g) => {
      [g.term].concat(Array.isArray(g.aka) ? g.aka : []).forEach((k) => {
        const key = String(k || '').trim();
        if (key.length < 2 && !/^[A-Za-z]$/.test(key)) return;
        keys.push({ key, id: g.id, ascii: ASCII.test(key) });
      });
    });
    if (!keys.length) return null;
    keys.sort((a, b) => b.key.replace(/\s+/g, '').length - a.key.replace(/\s+/g, '').length);
    const byNorm = new Map();
    keys.forEach((k) => { const n = k.key.replace(/\s+/g, '').toLowerCase(); if (!byNorm.has(n)) byNorm.set(n, k); });
    const src = keys.map((k) => reEsc(k.key).replace(/\\?\s+/g, '\\s?').replace(/([\u3400-\u9fff])(?=[A-Za-z0-9])|([A-Za-z0-9])(?=[\u3400-\u9fff])/g, '$1$2\\s?'));
    return { re: new RegExp(src.join('|'), 'gi'), byNorm };
  }
  const SKIP = 'a,button,h3,h4,th,.widget,.w-card,.formula,.stk,.case-title,code,svg,.term,.no-link,input,textarea,select,label';
  /** 在 root 內把術語第一次出現的位置換成可點的連結。seen：已連結過的術語 id（跨區塊共用）。 */
  FIN.linkTerms = (root, seen, cap) => {
    if (!root) return 0;
    if (!MATCHER) MATCHER = buildMatcher();
    if (!MATCHER) return 0;
    seen = seen || new Set();
    cap = cap || 30;
    let count = 0;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => (!n.nodeValue.trim() || (n.parentElement && n.parentElement.closest(SKIP)) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const tn of nodes) {
      if (seen.size >= cap) break;
      const text = tn.nodeValue;
      MATCHER.re.lastIndex = 0;
      let m;
      const parts = [];
      let last = 0;
      while ((m = MATCHER.re.exec(text))) {
        const hit = MATCHER.byNorm.get(m[0].replace(/\s+/g, '').toLowerCase());
        if (!hit || seen.has(hit.id)) continue;
        if (hit.ascii) {
          const pre = text[m.index - 1] || ''; const post = text[m.index + m[0].length] || '';
          if (/[A-Za-z0-9]/.test(pre) || /[A-Za-z0-9]/.test(post)) continue;
        }
        seen.add(hit.id);
        parts.push([last, m.index, m[0], hit.id]);
        last = m.index + m[0].length;
        count++;
        if (seen.size >= cap) break;
      }
      if (!parts.length) continue;
      const frag = document.createDocumentFragment();
      let pos = 0;
      parts.forEach(([, at, word, id]) => {
        if (at > pos) frag.appendChild(document.createTextNode(text.slice(pos, at)));
        const a = document.createElement('a');
        a.className = 'term';
        a.href = `#/glossary/${id}`;
        a.dataset.term = id;
        a.textContent = word;
        frag.appendChild(a);
        pos = at + word.length;
      });
      if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
      tn.parentNode.replaceChild(frag, tn);
    }
    return count;
  };
  FIN.on('content', () => { MATCHER = null; });

  // ---------------------------------------------------------------------------
  // 2. 提示框
  // ---------------------------------------------------------------------------
  let pop = null;
  let hoverTimer = null;
  function closePop() { if (pop) { pop.remove(); pop = null; } }
  function openPop(a) {
    const g = FIN.term(a.dataset.term);
    if (!g) return;
    closePop();
    const cat = FIN.glossCat(g.cat);
    pop = document.createElement('div');
    pop.className = 'term-pop';
    pop.setAttribute('role', 'dialog');
    pop.innerHTML = `<div class="tp-hd"><b>${esc(g.term)}</b><span class="chip" style="--c:${cat.color};--s:${cat.soft}">${cat.icon} ${esc(cat.name)}</span></div>
      <div class="tp-en">${esc(g.en)}</div><p>${esc(g.short)}</p>${g.formula ? `<div class="tp-f">${esc(g.formula)}</div>` : ''}
      <a class="tp-more" href="#/glossary/${esc(g.id)}">📖 看完整說明 →</a>`;
    document.body.appendChild(pop);
    const r = a.getBoundingClientRect();
    const pw = Math.min(320, window.innerWidth - 16);
    pop.style.width = `${pw}px`;
    let left = r.left + window.scrollX + r.width / 2 - pw / 2;
    left = FIN.clamp(left, window.scrollX + 8, window.scrollX + window.innerWidth - pw - 8);
    const below = r.bottom + 8 + pop.offsetHeight < window.innerHeight;
    pop.style.left = `${left}px`;
    pop.style.top = `${(below ? r.bottom + 8 : r.top - pop.offsetHeight - 8) + window.scrollY}px`;
    FIN.viewTerm(g.id);
  }
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a.term');
    if (a) {
      if (pop && pop.dataset.for === a.dataset.term) return; // 第二次點：照常前往百科
      e.preventDefault();
      openPop(a);
      if (pop) pop.dataset.for = a.dataset.term;
      return;
    }
    if (pop && !e.target.closest('.term-pop')) closePop();
  });
  document.addEventListener('mouseover', (e) => {
    const a = e.target.closest && e.target.closest('a.term');
    if (!a || !window.matchMedia('(hover: hover)').matches) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(() => { openPop(a); if (pop) pop.dataset.for = a.dataset.term; }, 280);
  });
  document.addEventListener('mouseout', (e) => { if (e.target.closest && e.target.closest('a.term')) clearTimeout(hoverTimer); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePop(); });
  FIN.on('route', closePop);
  window.addEventListener('scroll', FIN.debounce(() => { if (pop && !pop.matches(':hover')) closePop(); }, 120), { passive: true });

  // ---------------------------------------------------------------------------
  // 3. 百科頁
  // ---------------------------------------------------------------------------
  function score(g, q) {
    if (!q) return 1;
    const t = g.term.toLowerCase(); const aka = (g.aka || []).map((x) => String(x).toLowerCase());
    if (t === q || aka.includes(q)) return 100;
    if (t.startsWith(q) || aka.some((x) => x.startsWith(q))) return 80;
    if (t.includes(q) || aka.some((x) => x.includes(q)) || String(g.en || '').toLowerCase().includes(q)) return 60;
    if (String(g.short || '').toLowerCase().includes(q)) return 30;
    if (String(g.def || '').replace(/<[^>]+>/g, '').toLowerCase().includes(q)) return 15;
    return 0;
  }
  function card(g, open) {
    const cat = FIN.glossCat(g.cat);
    const L = g.lesson && FIN.lesson(g.lesson);
    const rel = (g.rel || []).map((id) => FIN.term(id)).filter(Boolean);
    return `<article class="g-card ${open ? 'open' : ''}" id="term-${esc(g.id)}" data-id="${esc(g.id)}" style="--c:${cat.color};--s:${cat.soft}">
      <button type="button" class="g-hd" aria-expanded="${open ? 'true' : 'false'}">
        <span class="g-t"><b>${esc(g.term)}</b><small>${esc(g.en)}</small></span>
        <span class="g-meta"><span class="chip">${cat.icon} ${esc(cat.name)}</span>${g.imp === 3 ? '<span class="chip imp">必學</span>' : ''}${FIN.state.terms[g.id] ? '<span class="g-seen" title="看過">✓</span>' : ''}</span>
        <span class="g-short">${esc(g.short)}</span></button>
      <div class="g-bd">
        <div class="g-def">${g.def}</div>
        ${g.formula ? `<div class="formula">${esc(g.formula)}</div>` : ''}
        ${g.ex ? `<div class="g-ex"><b>台股例子</b>${g.ex}</div>` : ''}
        ${(g.aka || []).length ? `<div class="g-aka">也叫：${(g.aka || []).map((a) => `<span>${esc(a)}</span>`).join('')}</div>` : ''}
        <div class="g-links">${rel.map((r) => `<a class="chip link" href="#/glossary/${esc(r.id)}">${esc(r.term)}</a>`).join('')}
          ${L ? `<a class="btn sm" href="#/lesson/${esc(L.id)}">${esc(L.icon)} 上課：${esc(L.title)}</a>` : ''}</div>
      </div></article>`;
  }

  FIN.route('glossary', (main, params, query) => {
    const all = FIN.terms();
    const focus = params[0] && FIN.term(params[0]) ? params[0] : '';
    const st = { q: focus ? '' : (query.q || ''), cat: focus ? 'all' : (query.cat || 'all'), imp: false };
    const counts = {};
    all.forEach((g) => { counts[g.cat] = (counts[g.cat] || 0) + 1; });
    main.innerHTML = `<section class="page-hd"><div><h1>📖 術語百科</h1><p class="muted">${all.length} 個台股常用術語：交易制度、技術分析、基本面、籌碼面、消息面。課程裡的藍色虛線字點一下就能查。</p></div></section>
      <div class="card g-tools">
        <div class="g-search"><span aria-hidden="true">🔍</span><input type="search" id="gq" placeholder="搜尋術語、英文或縮寫（例如：本益比、KD、ETF）" value="${esc(st.q)}" autocomplete="off" aria-label="搜尋術語"></div>
        <div class="chips g-cats">${[['all', '全部', all.length]].concat(FIN.GLOSS_CATS.map((c) => [c.id, `${c.icon} ${c.name}`, counts[c.id] || 0])).map(([id, t, n]) =>
          `<button type="button" class="chip-btn ${st.cat === id ? 'on' : ''}" data-cat="${id}">${t}<small>${n}</small></button>`).join('')}
          <label class="g-imp"><input type="checkbox" id="gimp"> 只看必學</label></div>
      </div>
      <div class="g-count muted" id="gcount"></div>
      <div class="g-list" id="glist"></div>`;
    const list = FIN.$('#glist', main);
    const input = FIN.$('#gq', main);
    let composing = false;
    function render() {
      const q = st.q.trim().toLowerCase();
      let rows = all.filter((g) => (st.cat === 'all' || g.cat === st.cat) && (!st.imp || g.imp === 3));
      rows = rows.map((g) => [g, score(g, q)]).filter((x) => x[1] > 0);
      if (q) rows.sort((a, b) => b[1] - a[1]);
      FIN.$('#gcount', main).textContent = all.length ? `顯示 ${rows.length} / ${all.length} 個術語` : '';
      list.innerHTML = rows.length ? rows.map(([g]) => card(g, g.id === focus)).join('')
        : `<div class="card empty"><h3>${all.length ? '找不到符合的術語' : '術語百科準備中'}</h3><p class="muted">${all.length ? '換個關鍵字，或切換到「全部」分類試試。' : '內容即將上線。'}</p></div>`;
      FIN.$$('.g-def, .g-ex', list).forEach((el) => FIN.linkTerms(el, new Set([el.closest('.g-card').dataset.id]), 6));
    }
    render();
    input.addEventListener('compositionstart', () => { composing = true; });
    input.addEventListener('compositionend', () => { composing = false; st.q = input.value; render(); });
    input.addEventListener('input', (e) => { if (composing || e.isComposing) return; st.q = input.value; render(); });
    input.addEventListener('keydown', (e) => {
      if (!FIN.isEnterSend(e)) return;
      e.preventDefault();
      const first = FIN.$('.g-card', list);
      if (first) { first.classList.add('open'); first.scrollIntoView({ block: 'center' }); FIN.viewTerm(first.dataset.id); }
    });
    FIN.$('.g-cats', main).addEventListener('click', (e) => {
      const b = e.target.closest('[data-cat]');
      if (!b) return;
      st.cat = b.dataset.cat;
      FIN.$$('[data-cat]', main).forEach((x) => x.classList.toggle('on', x === b));
      render();
    });
    FIN.$('#gimp', main).addEventListener('change', (e) => { st.imp = e.target.checked; render(); });
    list.addEventListener('click', (e) => {
      const hd = e.target.closest('.g-hd');
      if (!hd) return;
      const c = hd.closest('.g-card');
      c.classList.toggle('open');
      hd.setAttribute('aria-expanded', c.classList.contains('open') ? 'true' : 'false');
      if (c.classList.contains('open')) FIN.viewTerm(c.dataset.id);
    });
    if (focus) {
      FIN.viewTerm(focus);
      requestAnimationFrame(() => {
        const el = FIN.$(`#term-${CSS.escape(focus)}`, main);
        if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); }
      });
    } else if (!('ontouchstart' in window)) {
      input.focus({ preventScroll: true });
    }
  });

  /** 今日一詞：依日期挑一個必學術語（每天固定）。 */
  FIN.termOfDay = () => {
    const pool = FIN.terms().filter((g) => g.imp >= 2);
    if (!pool.length) return null;
    const d = new Date();
    const k = d.getFullYear() * 400 + d.getMonth() * 31 + d.getDate();
    return pool[k % pool.length];
  };
})();

</script>
  <script>/* js/pages.js */
/* 財經學院 — pages.js
 * 學院本部 #/home、分院 #/track/<id>、學習進度 #/progress，以及建築插圖與免責聲明共用元件。
 */
(function () {
  'use strict';
  const FIN = window.FIN;
  const esc = FIN.esc;

  // ---------------------------------------------------------------------------
  // 建築插圖（與校園地圖的 art key 對應）
  // ---------------------------------------------------------------------------
  FIN.buildingSvg = (art, color, size) => {
    const c = color || '#b45309';
    const s = size || 72;
    const base = `<svg viewBox="0 0 80 80" width="${s}" height="${s}" aria-hidden="true" class="bld">`;
    const ground = '<rect x="6" y="70" width="68" height="4" rx="2" fill="#cbd5e1"/>';
    switch (art) {
      case 'classical-hall':
        return `${base}${ground}<path d="M10 28 L40 12 L70 28 Z" fill="${c}"/><rect x="12" y="28" width="56" height="5" fill="${c}" opacity=".85"/>
          ${[17, 29, 41, 53].map((x) => `<rect x="${x}" y="34" width="7" height="30" rx="1.5" fill="#fff" stroke="${c}" stroke-width="2"/>`).join('')}
          <rect x="10" y="64" width="60" height="6" fill="${c}"/><circle cx="40" cy="22" r="3" fill="#fde68a"/></svg>`;
      case 'chart-tower':
        return `${base}${ground}<rect x="24" y="16" width="32" height="54" rx="3" fill="#fff" stroke="${c}" stroke-width="2.5"/>
          <polyline points="28,58 35,48 41,52 49,34 53,26" fill="none" stroke="#e11d48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="30" y="60" width="4" height="8" fill="${c}"/><rect x="38" y="56" width="4" height="12" fill="${c}"/><rect x="46" y="52" width="4" height="16" fill="${c}"/>
          <path d="M22 16 L40 6 L58 16 Z" fill="${c}"/></svg>`;
      case 'ledger-hall':
        return `${base}${ground}<rect x="12" y="30" width="56" height="40" rx="2" fill="#fff" stroke="${c}" stroke-width="2.5"/><path d="M8 30 L40 14 L72 30 Z" fill="${c}"/>
          <rect x="26" y="38" width="28" height="22" rx="2" fill="${c}" opacity=".12" stroke="${c}" stroke-width="2"/>
          <line x1="40" y1="38" x2="40" y2="60" stroke="${c}" stroke-width="2"/>${[43, 48, 53].map((y) => `<line x1="29" x2="37" y1="${y}" y2="${y}" stroke="${c}" stroke-width="1.6"/><line x1="43" x2="51" y1="${y}" y2="${y}" stroke="${c}" stroke-width="1.6"/>`).join('')}
          <rect x="34" y="62" width="12" height="8" fill="${c}"/></svg>`;
      case 'vault':
        return `${base}${ground}<rect x="10" y="22" width="60" height="48" rx="4" fill="#fff" stroke="${c}" stroke-width="2.5"/><rect x="10" y="16" width="60" height="8" rx="2" fill="${c}"/>
          <circle cx="40" cy="46" r="17" fill="${c}" opacity=".12" stroke="${c}" stroke-width="2.5"/><circle cx="40" cy="46" r="5" fill="${c}"/>
          ${[0, 60, 120, 180, 240, 300].map((a) => `<line x1="40" y1="46" x2="${(40 + 14 * Math.cos(a * Math.PI / 180)).toFixed(1)}" y2="${(46 + 14 * Math.sin(a * Math.PI / 180)).toFixed(1)}" stroke="${c}" stroke-width="2"/>`).join('')}
          <text x="40" y="20" text-anchor="middle" font-size="6" fill="#fff" font-weight="700">$</text></svg>`;
      case 'broadcast':
        return `${base}${ground}<rect x="18" y="44" width="44" height="26" rx="2" fill="#fff" stroke="${c}" stroke-width="2.5"/>
          <path d="M40 44 L33 12 M40 44 L47 12 M35 22 L45 22 M34 32 L46 32" stroke="${c}" stroke-width="2.5" fill="none"/><circle cx="40" cy="10" r="3.5" fill="#e11d48"/>
          <path d="M28 8 Q24 14 28 20 M52 8 Q56 14 52 20 M22 4 Q15 14 22 24 M58 4 Q65 14 58 24" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round"/>
          <rect x="24" y="50" width="32" height="10" rx="2" fill="${c}" opacity=".15"/><rect x="34" y="62" width="12" height="8" fill="${c}"/></svg>`;
      default:
        return `${base}${ground}<rect x="16" y="26" width="48" height="44" rx="3" fill="#fff" stroke="${c}" stroke-width="2.5"/><path d="M12 26 L40 10 L68 26 Z" fill="${c}"/></svg>`;
    }
  };
  FIN.ring = (pct, size, stroke, color) => {
    const r = (size - stroke) / 2;
    const cfr = 2 * Math.PI * r;
    return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="${stroke}"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="${(cfr * FIN.clamp(pct, 0, 1)).toFixed(1)} ${cfr.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>`;
  };
  FIN.trackStyle = (t) => `--tc:${t.color};--ts:${t.soft};--ti:${t.ink}`;
  FIN.discStrip = () => `<div class="inline-disc">⚖️ 本站內容僅供<b>教育與學習</b>參考，不構成任何投資建議；圖表為示意資料。投資有風險，請自行判斷並承擔盈虧。
    <button type="button" class="link-btn" data-disclaimer>查看完整免責聲明 →</button></div>`;

  function stageCounts(trackId) {
    const ls = FIN.lessons(trackId);
    return FIN.STAGES.map((s) => [s, ls.filter((L) => L.stage === s.id).length]);
  }
  function statusChip(L) {
    const p = FIN.prog(L.id);
    if (p.done) return `<span class="chip ok">✅ ${p.best != null ? `${p.best} 分` : '完成'}</span>`;
    if (p.read) return '<span class="chip info">📖 已讀</span>';
    return '<span class="chip ghost">未開始</span>';
  }
  const widgetCount = (L) => (String(L.html || '').match(/data-widget=/g) || []).length;

  // ---------------------------------------------------------------------------
  // 學院本部
  // ---------------------------------------------------------------------------
  FIN.route('home', (main) => {
    const all = FIN.lessons();
    const done = all.filter((L) => FIN.isDone(L.id)).length;
    const next = FIN.nextLesson();
    const q = FIN.state.quiz;
    const acc = q.answered ? q.correct / q.answered : null;
    const streak = FIN.streak();
    const fresh = !FIN.state.meta.last && !q.answered;
    const nWidgets = all.reduce((n, L) => n + widgetCount(L), 0);
    const tod = FIN.termOfDay();
    main.innerHTML = `
      <section class="hq">
        <div class="hq-art">${FIN.buildingSvg('classical-hall', '#b45309', 132)}</div>
        <div class="hq-txt">
          <div class="eyebrow">🏛️ 財經學院 · 學院本部</div>
          <h1>台股投資四大分析，<span>一次系統化學會</span></h1>
          <p class="hq-lead">技術分析、基本面、籌碼面、消息面四大分院，${all.length || 46} 堂圖解課程${nWidgets ? `、${nWidgets} 個可以動手玩的互動圖表` : ''}、${FIN.terms().length || 150} 個術語。每課都附台股實例，學完直接到「台股智慧選股」實戰驗證。</p>
          <div class="hq-cta">${next ? `<a class="btn primary lg" href="#/lesson/${esc(next.id)}">▶ ${fresh ? '從第一課開始' : '繼續學習'}：${esc(next.title)}</a>` : (all.length ? '<span class="chip ok lg">🎓 全部課程都完成了！</span>' : '')}
            <a class="btn lg" href="#/quiz">🎯 綜合測驗</a></div>
        </div>
        <div class="hq-stats">
          <div><b>${done}<small>/${all.length}</small></b><span>完成課程</span></div>
          <div><b>${streak}<small> 天</small></b><span>連續學習</span></div>
          <div><b>${acc == null ? '—' : Math.round(acc * 100) + '<small>%</small>'}</b><span>測驗正確率</span></div>
          <div><b>${FIN.totalXP()}</b><span>累積 XP</span></div>
        </div>
      </section>
      ${FIN.discStrip()}
      ${fresh && !FIN.state.meta.welcomeDismissed ? `<section class="card welcome"><button type="button" class="icon-btn" data-dismiss aria-label="關閉">✕</button>
        <h3>👋 第一次來？建議這樣學</h3>
        <ol class="steps"><li><b>先看 K 線</b>從技術分析學院的「K 線基礎」開始，學會看懂一根 K 棒。</li>
          <li><b>再看財報</b>基本面學院的「財報三表」「月營收」，知道公司賺不賺錢。</li>
          <li><b>追蹤資金</b>籌碼面學院的「三大法人」，看懂誰在買、誰在賣。</li>
          <li><b>每課做測驗</b>隨堂測驗 60 分以上就算完成，錯的題目會進錯題本。</li></ol></section>` : ''}
      <h2 class="sec-t">🏫 四大分院</h2>
      <div class="track-grid">${FIN.TRACKS.map((t) => {
        const pr = FIN.trackProgress(t.id);
        return `<a class="track-card" href="#/track/${t.id}" style="${FIN.trackStyle(t)}">
          <div class="tc-top">${FIN.buildingSvg(t.art, t.color, 58)}<span class="tc-en">${esc(t.en)}</span></div>
          <h3>${t.icon} ${esc(t.name)}</h3><p class="tc-motto">${esc(t.motto)}</p>
          <div class="tc-stages">${stageCounts(t.id).map(([s, n]) => `<span>${s.icon} ${s.name} ${n}</span>`).join('')}</div>
          <div class="tc-prog"><div class="bar"><i style="width:${(pr.pct * 100).toFixed(0)}%"></i></div><span>${pr.done}/${pr.total} 完成</span></div>
          <span class="tc-go">進入分院 →</span></a>`;
      }).join('')}</div>
      <div class="home-grid">
        <section class="card next-card"><h3>📌 各分院下一課</h3><ul class="next-list">${FIN.TRACKS.map((t) => {
          const L = FIN.nextLesson(t.id);
          return `<li style="${FIN.trackStyle(t)}"><span class="dot"></span>${L ? `<a href="#/lesson/${esc(L.id)}"><small>${esc(t.short)}</small><b>${esc(L.icon)} ${esc(L.title)}</b></a>` : `<span><small>${esc(t.short)}</small><b>🎓 本分院已全部完成</b></span>`}</li>`;
        }).join('')}</ul></section>
        <section class="card tod-card"><h3>💡 今日一詞</h3>${tod ? `<div class="tod"><b>${esc(tod.term)}</b><small>${esc(tod.en)}</small><p>${esc(tod.short)}</p>
          <a class="btn sm" href="#/glossary/${esc(tod.id)}">看完整說明 →</a></div>` : '<p class="muted">術語百科準備中。</p>'}</section>
        <section class="card arena-card"><h3>🏟️ 學以致用：到實戰區</h3><p class="muted small">學完的觀念，到「台股智慧選股」用真實資料驗證：</p>
          <div class="arena-links">${[['#/', '🎯 今日推薦'], ['#/morning', '🌅 盤前戰情'], ['#/screener', '🔎 選股器'], ['#/stock/2330', '🧠 個股分析']].map(([r, t]) =>
            `<a class="btn sm" href="${esc(FIN.practiceUrl(r))}" target="_blank" rel="noopener">${t}</a>`).join('')}</div></section>
      </div>`;
    const dis = FIN.$('[data-dismiss]', main);
    if (dis) dis.onclick = () => { FIN.state.meta.welcomeDismissed = true; FIN.save(); dis.closest('.welcome').remove(); };
  });

  // ---------------------------------------------------------------------------
  // 分院
  // ---------------------------------------------------------------------------
  FIN.route('track', (main, params) => {
    const t = FIN.track(params[0]);
    if (!t) { FIN.go('#/home'); return; }
    const ls = FIN.lessons(t.id);
    const pr = FIN.trackProgress(t.id);
    const next = FIN.nextLesson(t.id);
    const terms = FIN.terms().filter((g) => g.cat === t.id && g.imp === 3).slice(0, 18);
    main.setAttribute('style', FIN.trackStyle(t));
    main.innerHTML = `
      <section class="track-hero">
        <div class="th-art">${FIN.buildingSvg(t.art, t.color, 120)}</div>
        <div class="th-txt">
          <nav class="crumbs"><a href="#/home">🏛️ 學院本部</a><span>›</span><b>${esc(t.name)}</b></nav>
          <h1>${t.icon} ${esc(t.name)}<small>${esc(t.en)}</small></h1>
          <p class="th-motto">${esc(t.motto)}</p><p class="th-desc">${esc(t.desc)}</p>
          <div class="th-cta">${next ? `<a class="btn primary" href="#/lesson/${esc(next.id)}">▶ ${pr.read ? '繼續' : '開始'}：${esc(next.title)}</a>` : ''}
            <a class="btn" href="#/quiz?track=${t.id}">🎯 分院測驗</a><a class="btn" href="#/glossary?cat=${t.id}">📖 分院術語</a></div>
        </div>
        <div class="th-ring">${FIN.ring(pr.pct, 104, 10, t.color)}<div><b>${Math.round(pr.pct * 100)}%</b><span>${pr.done}/${pr.total} 課完成</span></div></div>
      </section>
      <nav class="track-switch" aria-label="切換分院">${FIN.TRACKS.map((x) => `<a href="#/track/${x.id}" class="${x.id === t.id ? 'on' : ''}" style="${FIN.trackStyle(x)}">${x.icon} ${esc(x.short)}</a>`).join('')}</nav>
      ${ls.length ? `<div class="roadmap">${FIN.STAGES.map((s) => {
        const sl = ls.filter((L) => L.stage === s.id);
        if (!sl.length) return '';
        const sd = sl.filter((L) => FIN.isDone(L.id)).length;
        return `<section class="stage"><h2><span class="st-ic">${s.icon}</span>${s.name}<small>${esc(s.desc)}</small><span class="st-n">${sd}/${sl.length}</span></h2>
          <ol class="lesson-list">${sl.map((L) => {
            const wc = widgetCount(L);
            const p = FIN.prog(L.id);
            return `<li><a class="lesson-row ${p.done ? 'done' : p.read ? 'read' : ''}" href="#/lesson/${esc(L.id)}">
              <span class="lr-n">${L.order || ''}</span><span class="lr-ic">${esc(L.icon)}</span>
              <span class="lr-main"><b>${esc(L.title)}</b><small>${esc(L.tldr)}</small></span>
              <span class="lr-meta"><span class="muted">⏱ ${L.minutes} 分</span>${wc ? `<span class="chip tc">🧪 互動 ${wc}</span>` : ''}${statusChip(L)}</span></a></li>`;
          }).join('')}</ol></section>`;
      }).join('')}</div>` : '<section class="card empty"><h3>課程準備中</h3><p class="muted">這個分院的課程即將上線。</p></section>'}
      <div class="track-bottom">
        <section class="card track-practice"><h3>🏟️ 到實戰區練習</h3><p>${esc(t.practice.label)}</p>
          <a class="btn primary" href="${esc(FIN.practiceUrl(t.practice.route))}" target="_blank" rel="noopener">打開台股智慧選股 →</a></section>
        ${terms.length ? `<section class="card track-terms"><h3>📖 本分院必學術語</h3><div class="chips">${terms.map((g) => `<a class="chip link" href="#/glossary/${esc(g.id)}">${esc(g.term)}</a>`).join('')}</div>
          <a class="link-btn" href="#/glossary?cat=${t.id}">看全部 ${FIN.terms().filter((g) => g.cat === t.id).length} 個 →</a></section>` : ''}
      </div>
      ${FIN.discStrip()}`;
  });

  // ---------------------------------------------------------------------------
  // 學習進度
  // ---------------------------------------------------------------------------
  function heatmap() {
    const weeks = 16;
    const end = new Date();
    const start = new Date(end);
    start.setDate(start.getDate() - (weeks * 7 - 1) - start.getDay());
    let cells = '';
    const d = new Date(start);
    for (let w = 0; w < weeks + 1; w++) {
      let col = '';
      for (let i = 0; i < 7; i++) {
        const k = FIN.dayKey(d);
        const xp = (FIN.state.days[k] || {}).xp || 0;
        const lvl = d > end ? -1 : xp === 0 ? 0 : xp < 15 ? 1 : xp < 40 ? 2 : xp < 80 ? 3 : 4;
        col += `<i class="hm l${lvl}" title="${k}：${xp} XP"></i>`;
        d.setDate(d.getDate() + 1);
      }
      cells += `<div class="hm-col">${col}</div>`;
    }
    return `<div class="heatmap">${cells}</div><div class="hm-legend muted small">少 <i class="hm l0"></i><i class="hm l1"></i><i class="hm l2"></i><i class="hm l3"></i><i class="hm l4"></i> 多</div>`;
  }
  FIN.route('progress', (main) => {
    const all = FIN.lessons();
    const done = all.filter((L) => FIN.isDone(L.id));
    const q = FIN.state.quiz;
    const wrongN = Object.keys(q.wrong || {}).length;
    const termsSeen = Object.keys(FIN.state.terms).length;
    main.innerHTML = `<section class="page-hd"><div><h1>📈 學習進度</h1><p class="muted">進度只存在這個瀏覽器（localStorage，key 前綴 <code>fin.</code>），換瀏覽器或清除資料會重新開始；可以用下方「匯出」備份。</p></div></section>
      <div class="stat-grid">
        <div class="card stat"><small>完成課程</small><b>${done.length}<em>/${all.length}</em></b></div>
        <div class="card stat"><small>連續學習</small><b>${FIN.streak()}<em> 天</em></b></div>
        <div class="card stat"><small>累積 XP</small><b>${FIN.totalXP()}</b></div>
        <div class="card stat"><small>測驗正確率</small><b>${q.answered ? Math.round(q.correct / q.answered * 100) : '—'}<em>${q.answered ? `%（${q.answered} 題）` : ''}</em></b></div>
        <div class="card stat"><small>看過的術語</small><b>${termsSeen}<em>/${FIN.terms().length}</em></b></div>
        <a class="card stat link" href="#/quiz?mode=wrong"><small>錯題本</small><b>${wrongN}<em> 題</em></b></a>
      </div>
      <section class="card"><h3>🔥 學習日曆（近 16 週）</h3>${heatmap()}</section>
      <section class="card"><h3>🏫 各分院進度</h3><div class="tp-list">${FIN.TRACKS.map((t) => {
        const pr = FIN.trackProgress(t.id);
        return `<div class="tp-row" style="${FIN.trackStyle(t)}"><a href="#/track/${t.id}"><b>${t.icon} ${esc(t.name)}</b></a>
          <div class="tp-stages">${FIN.STAGES.map((s) => {
            const sl = FIN.lessons(t.id).filter((L) => L.stage === s.id);
            const sd = sl.filter((L) => FIN.isDone(L.id)).length;
            return `<div class="tp-st"><small>${s.icon} ${s.name} ${sd}/${sl.length}</small><div class="bar"><i style="width:${sl.length ? (sd / sl.length * 100).toFixed(0) : 0}%"></i></div></div>`;
          }).join('')}</div><span class="tp-pct">${Math.round(pr.pct * 100)}%</span></div>`;
      }).join('')}</div></section>
      ${done.length ? `<section class="card"><h3>✅ 已完成的課程</h3><div class="done-list">${done.map((L) => {
        const t = FIN.track(L.track);
        return `<a href="#/lesson/${esc(L.id)}" style="${FIN.trackStyle(t)}"><span class="dot"></span>${esc(L.icon)} ${esc(L.title)}<span class="chip ok">${FIN.prog(L.id).best} 分</span></a>`;
      }).join('')}</div></section>` : ''}
      <section class="card data-card"><h3>💾 資料備份</h3><div class="row wrap">
        <button type="button" class="btn" id="expBtn">⬇️ 匯出進度（JSON）</button>
        <label class="btn">⬆️ 匯入進度<input type="file" id="impFile" accept="application/json" hidden></label>
        <button type="button" class="btn danger ghost" id="resetBtn">🗑️ 重設全部進度</button></div></section>`;
    FIN.$('#expBtn', main).onclick = () => {
      const blob = new Blob([JSON.stringify(FIN.state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `finance_academy_progress_${FIN.todayKey()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    };
    FIN.$('#impFile', main).onchange = (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const st = JSON.parse(rd.result);
          if (!st || st.v !== 1 || typeof st.lessons !== 'object') throw new Error('格式不符');
          FIN.state = Object.assign(FIN.state, st);
          FIN.save();
          FIN.toast('✅ 已匯入進度', 'ok');
          FIN.renderRoute();
        } catch (err) { FIN.toast(`匯入失敗：${err.message}`, 'bad'); }
      };
      rd.readAsText(f);
    };
    FIN.$('#resetBtn', main).onclick = async () => {
      if (await FIN.confirm('確定要清除所有課程進度、測驗紀錄與連續天數嗎？此動作無法復原。', '清除')) {
        FIN.resetState();
        FIN.toast('已重設進度', 'ok');
        FIN.renderRoute();
      }
    };
  });
})();

</script>
  <script>/* js/lesson.js */
/* 財經學院 — lesson.js
 * 課程頁 #/lesson/<id>：一句話重點、白話說明、本課重點、內文（自動術語連結 + 互動元件）、常見誤區、
 * 到實戰區練習、隨堂測驗（≥ 60 分完成本課）、參考來源、上一課／下一課、側邊目錄與閱讀進度條。
 */
(function () {
  'use strict';
  const FIN = window.FIN;
  const esc = FIN.esc;
  const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };

  function quizHtml(L) {
    return `<div class="lq" id="lq">${(L.quiz || []).map((q, i) => {
      const order = FIN.shuffle([0, 1, 2, 3]);
      return `<div class="lq-item" data-i="${i}" data-ans="${order.indexOf(q.ans)}">
        <p class="lq-q"><span class="lq-n">Q${i + 1}</span>${esc(q.q)}</p>
        <div class="lq-opts">${order.map((k, j) => `<button type="button" class="lq-opt" data-j="${j}"><span class="lq-l">${'ABCD'[j]}</span>${esc(q.opts[k])}</button>`).join('')}</div>
        <div class="lq-exp" hidden></div></div>`;
    }).join('')}<div class="lq-result" hidden></div></div>`;
  }

  function bindQuiz(main, L) {
    const box = FIN.$('#lq', main);
    if (!box) return;
    let answered = 0; let correct = 0;
    const total = (L.quiz || []).length;
    box.addEventListener('click', (e) => {
      const btn = e.target.closest('.lq-opt');
      if (!btn) {
        if (e.target.closest('[data-retry]')) {
          FIN.$('#sec-quiz .lq-wrap', main).innerHTML = quizHtml(L);
          bindQuiz(main, L);
          FIN.$('#sec-quiz', main).scrollIntoView({ block: 'start' });
        }
        return;
      }
      const item = btn.closest('.lq-item');
      if (item.classList.contains('answered')) return;
      item.classList.add('answered');
      const i = +item.dataset.i; const ans = +item.dataset.ans; const j = +btn.dataset.j;
      const ok = j === ans;
      answered++; if (ok) correct++;
      FIN.$$('.lq-opt', item).forEach((b) => {
        b.disabled = true;
        if (+b.dataset.j === ans) b.classList.add('right');
      });
      if (!ok) btn.classList.add('wrong');
      const exp = FIN.$('.lq-exp', item);
      exp.hidden = false;
      exp.className = `lq-exp ${ok ? 'ok' : 'bad'}`;
      exp.innerHTML = `<b>${ok ? '✅ 答對了！' : `❌ 正確答案是 ${'ABCD'[ans]}`}</b> ${esc(L.quiz[i].exp)}`;
      FIN.recordAnswer(`${L.id}#${i}`, ok);
      if (answered === total) {
        const score = Math.round(correct / total * 100);
        const newly = FIN.recordLessonQuiz(L.id, score);
        const nb = FIN.neighbors(L.id);
        const res = FIN.$('.lq-result', box);
        res.hidden = false;
        res.className = `lq-result ${score >= 60 ? 'pass' : 'fail'}`;
        res.innerHTML = `<div class="lqr-score">${FIN.ring(score / 100, 72, 8, score >= 60 ? '#16a34a' : '#f59e0b')}<b>${score}</b></div>
          <div><h4>${score >= 60 ? (newly ? '🎉 完成本課！+20 XP' : '👏 通過！') : '再複習一下就能過關'}</h4>
          <p class="muted">答對 ${correct} / ${total} 題${score >= 60 ? '' : '，60 分以上就算完成本課'}。答錯的題目會收進錯題本。</p>
          <div class="row wrap"><button type="button" class="btn" data-retry>🔁 重做一次</button>${nb.next ? `<a class="btn primary" href="#/lesson/${esc(nb.next.id)}">下一課：${esc(nb.next.title)} →</a>` : '<a class="btn primary" href="#/quiz">🎯 去做綜合測驗 →</a>'}</div></div>`;
        if (newly) FIN.toast('🎉 完成本課！+20 XP', 'ok');
        const st = FIN.$('.lh-status', main);
        if (st) st.innerHTML = `<span class="chip ok">✅ ${FIN.prog(L.id).best} 分</span>`;
      }
    });
  }

  FIN.route('lesson', (main, params) => {
    const L = FIN.lesson(params[0]);
    if (!L) {
      main.innerHTML = `<div class="card empty"><h3>找不到這一課</h3><p class="muted">課程可能還在準備中。</p><a class="btn primary" href="#/home">回學院本部</a></div>`;
      return;
    }
    const t = FIN.track(L.track);
    const s = FIN.stage(L.stage);
    const nb = FIN.neighbors(L.id);
    const p = FIN.prog(L.id);
    const wc = (String(L.html || '').match(/data-widget=/g) || []).length;
    const terms = (L.terms || []).map((id) => FIN.term(id)).filter(Boolean);
    const related = (L.related || []).map((id) => FIN.lesson(id)).filter(Boolean);
    const pr = L.practice || {};
    FIN.touchLesson(L.id);
    main.setAttribute('style', FIN.trackStyle(t));
    main.innerHTML = `<div class="read-prog" aria-hidden="true"><i></i></div>
      <nav class="crumbs"><a href="#/home">🏛️ 學院本部</a><span>›</span><a href="#/track/${t.id}">${t.icon} ${esc(t.name)}</a><span>›</span><b>${s.icon} ${s.name} · 第 ${L.order || ''} 課</b></nav>
      <header class="lesson-hd"><div class="lh-ic">${esc(L.icon)}</div><div class="lh-txt"><h1>${esc(L.title)}</h1>
        <div class="lh-meta"><span class="chip tc">${t.icon} ${esc(t.short)} · ${s.name}</span><span class="chip">⏱ ${L.minutes} 分鐘</span>${wc ? `<span class="chip">🧪 ${wc} 個互動圖表</span>` : ''}<span class="lh-status">${p.done ? `<span class="chip ok">✅ ${p.best} 分</span>` : p.read ? '<span class="chip info">📖 已讀</span>' : ''}</span></div></div></header>
      <div class="lesson-grid">
        <article class="lesson-main">
          <div class="tldr-box"><span class="tb-l">一句話重點</span><p>${esc(L.tldr)}</p></div>
          <div class="plain-box"><b>🐣 白話說明</b><p>${esc(L.plain)}</p></div>
          <div class="kp-box"><b>✅ 本課重點</b><ul>${(L.keyPoints || []).map((k) => `<li>${esc(k)}</li>`).join('')}</ul></div>
          <div class="lesson-body">${L.html}</div>
          <section class="lsec pitfalls" id="sec-pitfalls"><h3>⚠️ 常見誤區</h3><div class="pf-list">${(L.pitfalls || []).map((x) =>
            `<div class="pf"><div class="pf-m"><span>❌ 誤區</span>${esc(x.myth)}</div><div class="pf-f"><span>✅ 正解</span>${esc(x.fact)}</div></div>`).join('')}</div></section>
          <section class="lsec practice-box" id="sec-practice"><h3>🏟️ 到實戰區練習</h3>
            <div class="pb"><div><b>${esc(pr.label || '')}</b><p class="muted">${esc(pr.tip || '')}</p></div>
            <a class="btn primary" href="${esc(FIN.practiceUrl(pr.route))}" target="_blank" rel="noopener">打開台股智慧選股 →</a></div></section>
          <section class="lsec" id="sec-quiz"><h3>📝 隨堂測驗 <small class="muted">${(L.quiz || []).length} 題 · 60 分以上完成本課</small></h3><div class="lq-wrap">${quizHtml(L)}</div></section>
          ${terms.length || related.length ? `<section class="lsec" id="sec-more"><h3>🔗 延伸</h3>
            ${terms.length ? `<div class="chips"><span class="muted small">本課術語：</span>${terms.map((g) => `<a class="chip link" href="#/glossary/${esc(g.id)}">${esc(g.term)}</a>`).join('')}</div>` : ''}
            ${related.length ? `<div class="chips"><span class="muted small">延伸閱讀：</span>${related.map((r) => `<a class="chip link" href="#/lesson/${esc(r.id)}">${esc(r.icon)} ${esc(r.title)}</a>`).join('')}</div>` : ''}</section>` : ''}
          <section class="lsec sources" id="sec-sources"><h3>📚 參考來源</h3><ol>${(L.sources || []).map((x) =>
            `<li><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a> <small class="muted">${esc(hostOf(x.url))}</small></li>`).join('')}</ol></section>
          <p class="disc-line">⚖️ 教育用途，不構成投資建議。互動圖表與示意數字不代表真實行情，實際交易規則以主管機關與交易所公告為準。</p>
          <nav class="prevnext">${nb.prev ? `<a class="pn prev" href="#/lesson/${esc(nb.prev.id)}"><small>← 上一課</small><b>${esc(nb.prev.icon)} ${esc(nb.prev.title)}</b></a>` : '<span></span>'}
            ${nb.next ? `<a class="pn next" href="#/lesson/${esc(nb.next.id)}"><small>下一課 →</small><b>${esc(nb.next.icon)} ${esc(nb.next.title)}</b></a>` : `<a class="pn next" href="#/track/${t.id}"><small>回到分院 →</small><b>${t.icon} ${esc(t.name)}</b></a>`}</nav>
        </article>
        <aside class="toc" aria-label="本課目錄"><div class="toc-in"><b>本課目錄</b><ol id="tocList"></ol>
          <a class="btn sm block" href="#/track/${t.id}">${t.icon} 回分院</a></div></aside>
      </div>`;

    const body = FIN.$('.lesson-body', main);
    // 術語自動連結：白話說明 + 內文（第一次出現）
    const seen = new Set();
    FIN.linkTerms(FIN.$('.plain-box p', main), seen, 30);
    FIN.linkTerms(body, seen, 30);
    FIN.$$('.stk', body).forEach((sp) => {
      const code = sp.dataset.code;
      if (!code) return;
      const a = document.createElement('a');
      a.className = 'stk';
      a.href = FIN.practiceUrl(`#/stock/${code}`);
      a.target = '_blank';
      a.rel = 'noopener';
      a.title = `在台股智慧選股打開 ${code}`;
      a.innerHTML = `<span class="stk-c">${esc(code)}</span>${esc(sp.textContent)}`;
      sp.replaceWith(a);
    });
    FIN.hydrateWidgets(body);
    // 目錄
    const heads = FIN.$$('h3', body);
    heads.forEach((h, i) => { h.id = `s-${i + 1}`; });
    const fixed = [['sec-pitfalls', '⚠️ 常見誤區'], ['sec-practice', '🏟️ 實戰練習'], ['sec-quiz', '📝 隨堂測驗'], ['sec-sources', '📚 參考來源']];
    const items = heads.map((h) => [h.id, h.textContent]).concat(fixed);
    FIN.$('#tocList', main).innerHTML = items.map(([id, tx]) => `<li><a href="#" data-to="${id}">${esc(tx)}</a></li>`).join('');
    FIN.$('#tocList', main).addEventListener('click', (e) => {
      const a = e.target.closest('[data-to]');
      if (!a) return;
      e.preventDefault();
      const el = document.getElementById(a.dataset.to);
      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 76, behavior: 'smooth' });
    });
    if ('IntersectionObserver' in window) {
      const links = new Map(FIN.$$('#tocList a', main).map((a) => [a.dataset.to, a]));
      const io = new IntersectionObserver((ents) => {
        ents.forEach((en) => {
          if (!en.isIntersecting) return;
          links.forEach((a) => a.classList.remove('on'));
          const a = links.get(en.target.id);
          if (a) a.classList.add('on');
          if (en.target.id === 'sec-pitfalls' || en.target.id === 'sec-quiz') FIN.markRead(L.id);
        });
      }, { rootMargin: '-80px 0px -60% 0px' });
      items.forEach(([id]) => { const el = document.getElementById(id); if (el) io.observe(el); });
      FIN.onCleanup(() => io.disconnect());
    }
    const readTimer = setTimeout(() => FIN.markRead(L.id), 60000);
    FIN.onCleanup(() => clearTimeout(readTimer));
    // 閱讀進度條
    const bar = FIN.$('.read-prog i', main);
    const art = FIN.$('.lesson-main', main);
    const onScroll = () => {
      const r = art.getBoundingClientRect();
      const pct = FIN.clamp((window.innerHeight - r.top) / (r.height || 1), 0, 1);
      bar.style.width = `${(pct * 100).toFixed(1)}%`;
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    FIN.onCleanup(() => window.removeEventListener('scroll', onScroll));
    onScroll();
    bindQuiz(main, L);
  });
})();

</script>
  <script>/* js/quiz.js */
/* 財經學院 — quiz.js
 * 綜合測驗 #/quiz（?track=<id>、?mode=wrong）：課程題 + 由術語百科自動產生的術語題，
 * 錯題本（答對兩次才移出）、成績與各分院正確率。
 */
(function () {
  'use strict';
  const FIN = window.FIN;
  const esc = FIN.esc;
  const strip = (h) => String(h || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();

  /** 所有題目：{ qid, track, q, opts, ans, exp, lesson?, term? } */
  function bank() {
    const out = [];
    FIN.lessons().forEach((L) => (L.quiz || []).forEach((q, i) => {
      out.push({ qid: `${L.id}#${i}`, track: L.track, q: q.q, opts: q.opts, ans: q.ans, exp: q.exp, lesson: L });
    }));
    const terms = FIN.terms();
    terms.forEach((g) => {
      const pool = terms.filter((x) => x.id !== g.id && x.cat === g.cat && x.short !== g.short);
      const others = (pool.length >= 3 ? pool : terms.filter((x) => x.id !== g.id)).slice();
      if (others.length < 3) return;
      // 依 id 決定題型（同一術語每次題型固定，錯題本才對得上）
      const reverse = g.id.length % 2 === 1;
      const pick = FIN.shuffle(others).slice(0, 3);
      const track = g.cat === 'basic' ? 'basic' : g.cat;
      if (reverse) {
        out.push({ qid: `term:${g.id}`, track, term: g, q: `哪一個術語的意思是：「${g.short}」`, opts: [g.term].concat(pick.map((x) => x.term)), ans: 0,
          exp: `${g.term}（${g.en}）：${strip(g.def).slice(0, 140)}${strip(g.def).length > 140 ? '…' : ''}` });
      } else {
        out.push({ qid: `term:${g.id}`, track, term: g, q: `「${g.term}」是什麼意思？`, opts: [g.short].concat(pick.map((x) => x.short)), ans: 0,
          exp: `${g.term}（${g.en}）：${strip(g.def).slice(0, 140)}${strip(g.def).length > 140 ? '…' : ''}${g.formula ? `　公式：${g.formula}` : ''}` });
      }
    });
    return out;
  }
  const trackName = (id) => (id === 'basic' ? '市場基礎' : (FIN.track(id) || {}).short || id);

  let session = null;

  FIN.route('quiz', (main, params, query) => {
    if (session && session.active && query.s === session.key) { renderQuestion(main); return; }
    session = null;
    const all = bank();
    const wrongIds = new Set(Object.keys(FIN.state.quiz.wrong || {}));
    const st = {
      scope: query.mode === 'wrong' ? 'wrong' : (FIN.track(query.track) ? query.track : 'all'),
      n: 10, kinds: { lesson: true, term: true },
    };
    const countFor = (scope) => all.filter((q) => (scope === 'all' || (scope === 'wrong' ? wrongIds.has(q.qid) : q.track === scope))).length;
    const q = FIN.state.quiz;
    main.innerHTML = `<section class="page-hd"><div><h1>🎯 綜合測驗</h1><p class="muted">從 ${all.length} 題（課程題 + 術語題）隨機出題；答錯的題目會進錯題本，連續答對 2 次才會移出。</p></div>
        <div class="qz-mini"><span>已作答 <b>${q.answered}</b></span><span>正確率 <b>${q.answered ? Math.round(q.correct / q.answered * 100) + '%' : '—'}</b></span><span>錯題 <b>${wrongIds.size}</b></span></div></section>
      <section class="card qz-setup">
        <h3>1. 範圍</h3><div class="chips" id="qzScope">${[['all', '🏛️ 全部']].concat(FIN.TRACKS.map((t) => [t.id, `${t.icon} ${t.short}`])).concat([['wrong', '📕 錯題本']]).map(([id, tx]) =>
          `<button type="button" class="chip-btn ${st.scope === id ? 'on' : ''}" data-scope="${id}" ${countFor(id) ? '' : 'disabled'}>${tx}<small>${countFor(id)}</small></button>`).join('')}</div>
        <h3>2. 題數</h3><div class="chips" id="qzN">${[5, 10, 20].map((n) => `<button type="button" class="chip-btn ${st.n === n ? 'on' : ''}" data-n="${n}">${n} 題</button>`).join('')}</div>
        <h3>3. 題型</h3><div class="chips"><label class="chk"><input type="checkbox" data-k="lesson" checked> 課程題</label><label class="chk"><input type="checkbox" data-k="term" checked> 術語題</label></div>
        <div class="row"><button type="button" class="btn primary lg" id="qzStart">開始測驗 →</button><span class="muted small" id="qzAvail"></span></div>
      </section>`;
    const avail = () => all.filter((x) => (st.scope === 'all' || (st.scope === 'wrong' ? wrongIds.has(x.qid) : x.track === st.scope)) &&
      ((x.lesson && st.kinds.lesson) || (x.term && st.kinds.term)));
    const upd = () => { const n = avail().length; FIN.$('#qzAvail', main).textContent = `符合條件 ${n} 題`; FIN.$('#qzStart', main).disabled = !n; };
    FIN.$('#qzScope', main).addEventListener('click', (e) => {
      const b = e.target.closest('[data-scope]'); if (!b || b.disabled) return;
      st.scope = b.dataset.scope; FIN.$$('[data-scope]', main).forEach((x) => x.classList.toggle('on', x === b)); upd();
    });
    FIN.$('#qzN', main).addEventListener('click', (e) => {
      const b = e.target.closest('[data-n]'); if (!b) return;
      st.n = +b.dataset.n; FIN.$$('[data-n]', main).forEach((x) => x.classList.toggle('on', x === b));
    });
    FIN.$$('[data-k]', main).forEach((c) => c.addEventListener('change', () => { st.kinds[c.dataset.k] = c.checked; upd(); }));
    FIN.$('#qzStart', main).addEventListener('click', () => {
      const pool = avail();
      const items = FIN.shuffle(pool).slice(0, st.n).map((x) => {
        const order = FIN.shuffle([0, 1, 2, 3]);
        return Object.assign({}, x, { order, ansPos: order.indexOf(x.ans) });
      });
      session = { key: Date.now().toString(36), active: true, items, i: 0, results: [], scope: st.scope };
      location.hash = `#/quiz?s=${session.key}`;
    });
    upd();
  });

  function renderQuestion(main) {
    const s = session;
    if (s.i >= s.items.length) { renderResult(main); return; }
    const it = s.items[s.i];
    const tColor = it.track === 'basic' ? FIN.glossCat('basic') : FIN.track(it.track);
    main.innerHTML = `<div class="qz-run">
      <div class="qz-top"><a class="link-btn" href="#/quiz">✕ 結束</a><div class="bar"><i style="width:${(s.i / s.items.length * 100).toFixed(0)}%"></i></div><span>${s.i + 1} / ${s.items.length}</span></div>
      <section class="card qz-card">
        <div class="qz-tags"><span class="chip" style="--c:${tColor.color};--s:${tColor.soft}">${tColor.icon || ''} ${esc(trackName(it.track))}</span>${it.lesson ? `<span class="chip ghost">${esc(it.lesson.title)}</span>` : '<span class="chip ghost">術語題</span>'}</div>
        <p class="qz-q">${esc(it.q)}</p>
        <div class="lq-opts qz-opts">${it.order.map((k, j) => `<button type="button" class="lq-opt" data-j="${j}"><span class="lq-l">${j + 1}</span>${esc(it.opts[k])}</button>`).join('')}</div>
        <div class="lq-exp" hidden></div>
        <div class="row qz-next" hidden><button type="button" class="btn primary" id="qzNext">${s.i + 1 < s.items.length ? '下一題 →' : '看成績 →'}</button>
          ${it.lesson ? `<a class="link-btn" href="#/lesson/${esc(it.lesson.id)}">回到課程複習</a>` : it.term ? `<a class="link-btn" href="#/glossary/${esc(it.term.id)}">查看術語</a>` : ''}<span class="muted small">鍵盤：1–4 作答、Enter 下一題</span></div>
      </section></div>`;
    const card = FIN.$('.qz-card', main);
    const answer = (j) => {
      if (card.classList.contains('answered')) return;
      card.classList.add('answered');
      const ok = j === it.ansPos;
      FIN.$$('.lq-opt', card).forEach((b) => { b.disabled = true; if (+b.dataset.j === it.ansPos) b.classList.add('right'); });
      if (!ok) FIN.$(`.lq-opt[data-j="${j}"]`, card).classList.add('wrong');
      const exp = FIN.$('.lq-exp', card);
      exp.hidden = false;
      exp.className = `lq-exp ${ok ? 'ok' : 'bad'}`;
      exp.innerHTML = `<b>${ok ? '✅ 答對了！' : `❌ 正確答案是 ${it.ansPos + 1}`}</b> ${esc(it.exp)}`;
      FIN.recordAnswer(it.qid, ok);
      s.results.push({ it, ok });
      FIN.$('.qz-next', card).hidden = false;
      FIN.$('#qzNext', card).focus({ preventScroll: true });
    };
    card.addEventListener('click', (e) => { const b = e.target.closest('.lq-opt'); if (b) answer(+b.dataset.j); });
    FIN.$('#qzNext', card).addEventListener('click', () => { s.i++; renderQuestion(main); window.scrollTo({ top: 0 }); });
    const onKey = (e) => {
      if (e.target.closest('input,textarea')) return;
      if (/^[1-4]$/.test(e.key)) answer(+e.key - 1);
      else if (e.key === 'Enter' && card.classList.contains('answered')) { e.preventDefault(); s.i++; renderQuestion(main); }
    };
    document.addEventListener('keydown', onKey);
    FIN.onCleanup(() => document.removeEventListener('keydown', onKey));
    const prevCleanup = renderQuestion._cleanup;
    if (prevCleanup) prevCleanup();
    renderQuestion._cleanup = () => document.removeEventListener('keydown', onKey);
  }

  function renderResult(main) {
    const s = session;
    s.active = false;
    if (renderQuestion._cleanup) { renderQuestion._cleanup(); renderQuestion._cleanup = null; }
    const n = s.results.length;
    const c = s.results.filter((r) => r.ok).length;
    const score = n ? Math.round(c / n * 100) : 0;
    const by = {};
    s.results.forEach((r) => { const k = r.it.track; by[k] = by[k] || [0, 0]; by[k][1]++; if (r.ok) by[k][0]++; });
    const wrong = s.results.filter((r) => !r.ok);
    const hist = FIN.state.quiz.history || [];
    hist.unshift({ at: Date.now(), n, c, scope: s.scope });
    FIN.state.quiz.history = hist.slice(0, 30);
    FIN.save();
    main.innerHTML = `<section class="card qz-result">
      <div class="qzr-top"><div class="lqr-score big">${FIN.ring(score / 100, 110, 11, score >= 80 ? '#16a34a' : score >= 60 ? '#2563eb' : '#f59e0b')}<b>${score}</b></div>
        <div><h2>${score >= 80 ? '🏆 太強了！' : score >= 60 ? '👍 不錯喔！' : '💪 再接再厲'}</h2><p class="muted">答對 ${c} / ${n} 題。${wrong.length ? `答錯的 ${wrong.length} 題已收進錯題本。` : '全部答對！'}</p>
        <div class="row wrap"><a class="btn primary" href="#/quiz">🔁 再來一輪</a>${Object.keys(FIN.state.quiz.wrong || {}).length ? '<a class="btn" href="#/quiz?mode=wrong">📕 錯題重練</a>' : ''}<a class="btn" href="#/home">🏛️ 回學院本部</a></div></div></div>
      <h3>各分院表現</h3><div class="qzr-by">${Object.entries(by).map(([k, [a, b]]) => `<div><small>${esc(trackName(k))}</small><div class="bar"><i style="width:${(a / b * 100).toFixed(0)}%"></i></div><span>${a}/${b}</span></div>`).join('')}</div>
      ${wrong.length ? `<h3>答錯的題目</h3><ol class="qzr-wrong">${wrong.map((r) => `<li><p>${esc(r.it.q)}</p><p class="muted small">✅ ${esc(r.it.opts[r.it.ans])}</p>
        ${r.it.lesson ? `<a class="link-btn" href="#/lesson/${esc(r.it.lesson.id)}">回到「${esc(r.it.lesson.title)}」</a>` : r.it.term ? `<a class="link-btn" href="#/glossary/${esc(r.it.term.id)}">查看「${esc(r.it.term.term)}」</a>` : ''}</li>`).join('')}</ol>` : ''}

  <script>/* js/feedback.js */
/* 財經學院 — feedback.js
 * 💬 意見回饋 #/feedback（三欄：類型／標題／內容）。Cloudtop 版 → POST /api/feedback（寄信 + 存檔）；
 * GitHub Pages／離線版 → FormSubmit AJAX，失敗時提供 mailto 一鍵寄信。本機紀錄存在 localStorage `fin.feedback.v1`。
 */
(function () {
  'use strict';
  const FIN = window.FIN;
  const esc = FIN.esc;
  const TARGET = 'okayell@hotmail.com';
  const LS_KEY = 'fin.feedback.v1';
  const KINDS = [
    { id: 'feature', label: '✨ 功能許願' }, { id: 'bug', label: '🐞 問題回報' },
    { id: 'ux', label: '📚 課程與內容建議' }, { id: 'other', label: '💬 其他' },
  ];
  let items = null;
  let kind = 'feature';
  let sending = false;
  const loadLocal = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { return []; } };
  const saveLocal = (arr) => { try { localStorage.setItem(LS_KEY, JSON.stringify((arr || []).slice(0, 50))); } catch (e) { /* ignore */ } };
  const mailto = (kl, title, desc) => `mailto:${TARGET}?subject=${encodeURIComponent(`[財經學院 意見回饋] ${kl} — ${title}`)}&body=${encodeURIComponent(`工具名稱：財經學院\n回饋類型：${kl}\n標題：${title}\n\n內容描述：\n${desc}\n`)}`;

  async function sendStatic(item) {
    try {
      const resp = await fetch(`https://formsubmit.co/ajax/${TARGET}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ _subject: `[財經學院 意見回饋] ${item.kind_label} — ${item.title}`, _template: 'table', _captcha: 'false',
          工具名稱: '財經學院', 回饋類型: item.kind_label, 標題: item.title, 內容描述: item.description, 送出時間: item.created_at }),
      });
      const data = await resp.json().catch(() => ({}));
      return resp.ok && (data.success === true || data.success === 'true');
    } catch (e) { return false; }
  }

  FIN.route('feedback', (main) => {
    const local = !!(FIN.serverAvailable && !FIN.isStatic());
    if (items === null) {
      items = loadLocal();
      if (local) {
        fetch('api/feedback', { cache: 'no-store' }).then((r) => r.json()).then((res) => {
          if (res && Array.isArray(res.items)) { items = res.items; if (FIN.curRoute && FIN.curRoute.name === 'feedback') FIN.renderRoute(); }
        }).catch(() => {});
      }
    }
    main.innerHTML = `<section class="page-hd"><div><h1>💬 意見回饋</h1><p class="muted">想許願新課程、發現內容錯誤或遇到 Bug？歡迎留言，送出後會寄信通知站長。</p></div></section>
      <div class="fb-grid">
        <form class="card fb-form" id="fbForm">
          <label class="fb-l">1. 回饋類型</label>
          <div class="chips" id="fbKinds">${KINDS.map((k) => `<button type="button" class="chip-btn ${kind === k.id ? 'on' : ''}" data-k="${k.id}">${k.label}</button>`).join('')}</div>
          <label class="fb-l" for="fbTitle">2. 標題</label>
          <input id="fbTitle" class="inp" required maxlength="150" placeholder="一句話說明（例如：希望增加 ETF 分院）">
          <label class="fb-l" for="fbDesc">3. 內容描述</label>
          <textarea id="fbDesc" class="inp" required rows="7" maxlength="4000" placeholder="詳細描述你的建議；回報錯誤請附上是哪一課、哪一段。"></textarea>
          <div id="fbBanner" class="fb-banner" hidden></div>
          <div class="row between"><span class="muted small">📩 寄至站長信箱</span><button type="submit" class="btn primary" id="fbSubmit">📨 送出回饋</button></div>
        </form>
        <section class="card fb-hist"><h3>🗂️ 已送出的回饋（${items.length}）</h3><div class="fb-items">${items.map((it) =>
          `<div class="fb-item"><div class="row between"><span class="chip info">${esc(it.kind_label || it.kind)}</span><small class="muted">${esc(it.created_at || '')}</small></div>
            <b>${esc(it.title)}</b><p>${esc(it.description)}</p></div>`).join('') || '<p class="muted center">目前還沒有紀錄，歡迎留下第一則建議！</p>'}</div></section>
      </div>`;
    FIN.$('#fbKinds', main).addEventListener('click', (e) => {
      const b = e.target.closest('[data-k]'); if (!b) return;
      kind = b.dataset.k; FIN.$$('[data-k]', main).forEach((x) => x.classList.toggle('on', x === b));
    });
    FIN.$('#fbTitle', main).addEventListener('keydown', (e) => { if (e.key === 'Enter' && !FIN.isEnterSend(e)) e.preventDefault(); });
    FIN.$('#fbForm', main).addEventListener('submit', async (e) => {
      e.preventDefault();
      if (sending) return;
      const title = FIN.$('#fbTitle', main).value.trim();
      const desc = FIN.$('#fbDesc', main).value.trim();
      if (!title || !desc) { FIN.toast('請填寫標題與內容描述', 'bad'); return; }
      sending = true;
      const btn = FIN.$('#fbSubmit', main);
      btn.disabled = true; btn.textContent = '⏳ 寄送中…';
      const k = KINDS.find((x) => x.id === kind) || KINDS[0];
      const banner = (cls, html) => { const b = FIN.$('#fbBanner'); if (b) { b.hidden = false; b.className = `fb-banner ${cls}`; b.innerHTML = html; } };
      try {
        if (local) {
          const r = await fetch('api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind, title, description: desc }) });
          const res = await r.json();
          if (!res.ok) throw new Error(res.error || '送出失敗');
          items = res.items || [res.item].concat(items);
          saveLocal(items);
          FIN.renderRoute();
          banner('ok', '✅ 已收到並寄出通知信，感謝你的建議！');
        } else {
          const item = { id: `FB-${Date.now().toString(36).toUpperCase()}`, kind, kind_label: k.label, title, description: desc,
            created_at: new Date().toISOString().slice(0, 19).replace('T', ' ') };
          const sent = await sendStatic(item);
          items = [item].concat(items);
          saveLocal(items);
          FIN.renderRoute();
          banner('ok', sent ? '✅ 感謝回饋！已寄送給站長。' : `✅ 已記錄在這個瀏覽器。也可以 <a href="${esc(mailto(k.label, title, desc))}">📩 一鍵開啟郵件寄給站長</a>。`);
        }
      } catch (err) {
        banner('warn', `⚠️ 暫時無法送出（${esc(err.message)}），請改用 <a href="${esc(mailto(k.label, title, desc))}">📩 直接寄信</a>。`);
      } finally {
        sending = false;
        const b2 = FIN.$('#fbSubmit');
        if (b2) { b2.disabled = false; b2.textContent = '📨 送出回饋'; }
      }
    });
  });
})();

</script>

        bd.querySelectorAll('.rel-bump').forEach(function (el) { el.classList.toggle('on', el.contains(radio)); });
        var v = bd.querySelector('#relPubVer');
        if (v && status && status.next_versions) v.textContent = status.next_versions[radio.value] || '';
      });
    });
    var pub = bd.querySelector('#relPublishBtn');
    if (pub) {
      pub.addEventListener('click', async function () {
        var checked = bd.querySelector('input[name="relBump"]:checked');
        var bump = checked ? checked.value : (status.recommended_bump || 'patch');
        var t = (bd.querySelector('#relTitleInp') || {}).value || '';
        var h = ((bd.querySelector('#relHlInp') || {}).value || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
        pub.disabled = true;
        pub.textContent = '⏳ 發布並打包中…';
        try {
          var res = await fetch('api/release_publish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bump_type: bump, title: t, highlights: h })
          });
          var out = await res.json();
          if (!res.ok || !out || !out.ok) throw new Error((out && out.error) || '發布失敗');
          cachedStatus = out.status;
          data().current_version = out.new_version;
          data().releases = out.status.releases;
          updateBadgeUI(cachedStatus);
          renderModal(cachedStatus);
        } catch (err) {
          pub.disabled = false;
          pub.textContent = '🚀 重新嘗試發布';
          var m = bd.querySelector('#relPubMsg');
          if (m) m.textContent = '錯誤：' + (err.message || err);
        }
      });
    }
  }

  async function openReleaseModal() {
    renderModal(cachedStatus);
    var fresh = await fetchReleaseStatus();
    if (fresh) renderModal(fresh);
  }

  function closeReleaseModal() {
    var bd = document.getElementById('relModal');
    if (bd) bd.classList.remove('open');
  }

  function init() {
    updateBadgeUI(cachedStatus);
    var btn = document.getElementById('verBadgeBtn');
    if (btn) btn.addEventListener('click', openReleaseModal);
    fetchReleaseStatus();
  }

  FIN.openReleaseModal = openReleaseModal;
  FIN.closeReleaseModal = closeReleaseModal;
  FIN.refreshReleaseStatus = fetchReleaseStatus;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
  <script>/* js/app.js */
/* ==========================================================================
 * 財經學院 — Application Bootstrap, Nav Sync, Global Search & Disclaimer Modal
 * ========================================================================== */
(function () {
  'use strict';
  const FIN = (window.FIN = window.FIN || {});
  const esc = FIN.esc;

  FIN.updateHeaderStats = function () {
    const streakEl = FIN.$('#hdrStreak');
    const progEl = FIN.$('#hdrProgress');
    const days = FIN.streak ? FIN.streak() : 0;
    const xp = FIN.totalXP ? FIN.totalXP() : 0;
    if (streakEl) {
      streakEl.textContent = `🔥 ${days} 天`;
      streakEl.title = `連續學習 ${days} 天 · 累積 ${xp} XP`;
    }
    if (progEl && FIN.lessons) {
      const all = FIN.lessons();
      const done = all.filter((L) => FIN.isDone(L.id)).length;
      const pct = all.length ? Math.round((done / all.length) * 100) : 0;
      progEl.textContent = `${done}/${all.length} 課 (${pct}%)`;
      progEl.title = `全院總進度：已完成 ${done} / ${all.length} 堂課`;
    }
  };

  function updateActiveNav(r) {
    let key = (r && r.name) || 'home';
    if (key === 'track' && r.params && r.params[0]) {
      key = r.params[0];
    } else if (key === 'lesson' && r.params && r.params[0]) {
      const L = FIN.lesson(r.params[0]);
      key = L ? L.track : 'home';
    }
    FIN.$$('[data-nav]').forEach((el) => {
      el.classList.toggle('active', el.getAttribute('data-nav') === key);
    });
  }

  FIN.on('state', FIN.updateHeaderStats);
  FIN.on('route', (r) => {
    updateActiveNav(r);
    FIN.updateHeaderStats();
  });

  /* -------------------- Global Search Modal (/ or ⌘K) -------------------- */
  let searchModal = null;

  function ensureSearchModal() {
    if (searchModal) return searchModal;
    searchModal = document.createElement('div');
    searchModal.id = 'searchModal';
    searchModal.className = 'modal-bd';
    searchModal.setAttribute('aria-hidden', 'true');
    searchModal.innerHTML =
      '<div class="modal-card search-modal-card" role="dialog" aria-modal="true" aria-label="全站搜尋">' +
        '<div class="search-modal-top">' +
          '<span class="search-ic">🔍</span>' +
          '<input type="search" id="globalSearchInput" placeholder="搜尋 46 堂課程或 150+ 台股術語（例：KD、本益比、融資、法說會）…" autocomplete="off">' +
          '<button type="button" class="modal-close" id="searchModalClose" aria-label="關閉">✕</button>' +
        '</div>' +
        '<div class="search-modal-body" id="globalSearchResults"></div>' +
      '</div>';
    document.body.appendChild(searchModal);

    searchModal.addEventListener('click', (e) => {
      if (e.target === searchModal) FIN.closeSearch();
    });
    FIN.$('#searchModalClose', searchModal).addEventListener('click', FIN.closeSearch);

    const inp = FIN.$('#globalSearchInput', searchModal);
    inp.addEventListener('input', (e) => {
      if (e.isComposing) return;
      renderSearchResults(inp.value);
    });
    inp.addEventListener('compositionend', () => {
      renderSearchResults(inp.value);
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        FIN.closeSearch();
      } else if (FIN.isEnterSend(e)) {
        const first = FIN.$('.s-res-item', searchModal);
        if (first) first.click();
      }
    });
    return searchModal;
  }

  function renderSearchResults(rawQ) {
    const box = FIN.$('#globalSearchResults', searchModal);
    if (!box) return;
    const q = (rawQ || '').trim().toLowerCase();
    const lessons = FIN.lessons().filter((l) => {
      if (!q) return true;
      const hay = [l.id, l.title, l.tldr, l.plain].join(' ').toLowerCase();
      return hay.includes(q);
    }).slice(0, q ? 12 : 6);

    const terms = FIN.terms().filter((g) => {
      if (!q) return true;
      const hay = [g.id, g.term, g.en, (g.aka || []).join(' '), g.short, g.def].join(' ').toLowerCase();
      return hay.includes(q);
    }).slice(0, q ? 12 : 6);

    let html = `<div class="s-res-sec"><div class="s-res-title">📚 課程單元 (${lessons.length})</div>`;
    if (!lessons.length) {
      html += '<div class="s-res-empty">沒有符合的課程</div>';
    } else {
      lessons.forEach((l) => {
        const t = FIN.track(l.track) || {};
        html += `<a class="s-res-item" href="#/lesson/${esc(l.id)}">` +
          `<span class="s-res-badge" style="background:${t.soft || '#eef2ff'};color:${t.color || '#2563eb'}">${esc(t.short || l.track)} ${l.order || ''}</span>` +
          `<div class="s-res-main"><strong>${esc(l.icon || '')} ${esc(l.title)}</strong><span>${esc(l.tldr || '')}</span></div>` +
        '</a>';
      });
    }
    html += '</div>';

    html += `<div class="s-res-sec"><div class="s-res-title">📖 術語百科 (${terms.length})</div>`;
    if (!terms.length) {
      html += '<div class="s-res-empty">沒有符合的術語</div>';
    } else {
      terms.forEach((g) => {
        const cat = FIN.glossCat(g.cat) || {};
        html += `<a class="s-res-item" href="#/glossary/${encodeURIComponent(g.id)}">` +
          `<span class="s-res-badge" style="background:${cat.soft || '#fef3c7'};color:${cat.color || '#b45309'}">${esc(cat.name || '術語')}</span>` +
          `<div class="s-res-main"><strong>${esc(g.term)} <small class="muted">${esc(g.en || '')}</small></strong><span>${esc(g.short || '')}</span></div>` +
        '</a>';
      });
    }
    html += '</div>';
    box.innerHTML = html;

    FIN.$$('.s-res-item', box).forEach((a) => {
      a.addEventListener('click', () => {
        FIN.closeSearch();
      });
    });
  }

  FIN.openSearch = function () {
    const m = ensureSearchModal();
    m.classList.add('open');
    m.setAttribute('aria-hidden', 'false');
    const inp = FIN.$('#globalSearchInput', m);
    if (inp) {
      inp.value = '';
      renderSearchResults('');
      setTimeout(() => { inp.focus(); }, 20);
    }
  };

  FIN.closeSearch = function () {
    if (!searchModal) return;
    searchModal.classList.remove('open');
    searchModal.setAttribute('aria-hidden', 'true');
  };

  /* -------------------- 3-Layer Disclaimer Modal -------------------- */
  let discModal = null;

  function ensureDisclaimerModal() {
    if (discModal) return discModal;
    discModal = document.createElement('div');
    discModal.id = 'disclaimerModal';
    discModal.className = 'modal-bd';
    discModal.setAttribute('aria-hidden', 'true');
    discModal.innerHTML =
      '<div class="modal-card disc-modal-card" role="dialog" aria-modal="true" aria-label="教學用途與免責聲明">' +
        '<div class="disc-modal-head">' +
          '<h3>⚖️ 財經學院 · 三層免責聲明（教育用途）</h3>' +
          '<button type="button" class="modal-close" id="discModalClose" aria-label="關閉">✕</button>' +
        '</div>' +
        '<div class="disc-modal-body">' +
          '<div class="disc-layer">' +
            '<div class="disc-layer-num">第一層 · 教育與學術性質（非投資建議）</div>' +
            '<p>「財經學院」全站課程（技術分析、基本面、籌碼面、消息面）、術語百科與綜合測驗僅供<strong>財經知識普及與研究方法教學</strong>之用。本站不具備證券投資顧問身分，所有內容均不構成任何有價證券、ETF 或衍生性金融商品之買賣邀約、推薦、暗示或獲利保證。</p>' +
          '</div>' +
          '<div class="disc-layer">' +
            '<div class="disc-layer-num">第二層 · 模擬圖表與歷史案例聲明</div>' +
            '<p>課堂內嵌之互動圖表（K 線、均線、KD、RSI、MACD、布林通道、財報三表、本益比河流圖、法人買賣超、融資維持率等）採用<strong>確定性數學模型（Deterministic OHLC）與歷史公開規則</strong>產生，旨在協助學員理解指標公式與臨界條件。文中所舉台股代號（如 2330 台積電、2317 鴻海、0050 等）僅為制度與產業教學範例，不代表當前或未來之真實報價與投資評價。</p>' +
          '</div>' +
          '<div class="disc-layer">' +
            '<div class="disc-layer-num">第三層 · 公開資訊核實與風險自負</div>' +
            '<p>台股交易制度（如 ±10% 漲跌幅、T+2 交割、信用交易維持率 130%、處置股撮合、除權息與財報申報期限）均以<strong>臺灣證券交易所（TWSE）、櫃買中心（TPEx）、公開資訊觀測站（MOPS）與金管會證期局</strong>最新正式公告為準。投資一定有風險，過去績效不代表未來表現，讀者在做出任何財務決策前應獨立查證並自負盈虧。</p>' +
          '</div>' +
        '</div>' +
        '<div class="disc-modal-foot">' +
          '<button type="button" class="btn primary" id="discModalAccept">我已瞭解（僅作學習用途）</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(discModal);

    discModal.addEventListener('click', (e) => {
      if (e.target === discModal) FIN.closeDisclaimer();
    });
    FIN.$('#discModalClose', discModal).addEventListener('click', FIN.closeDisclaimer);
    FIN.$('#discModalAccept', discModal).addEventListener('click', FIN.closeDisclaimer);
    return discModal;
  }

  FIN.openDisclaimer = function () {
    const m = ensureDisclaimerModal();
    m.classList.add('open');
    m.setAttribute('aria-hidden', 'false');
  };

  FIN.closeDisclaimer = function () {
    if (!discModal) return;
    discModal.classList.remove('open');
    discModal.setAttribute('aria-hidden', 'true');
  };

  /* -------------------- Boot Sequence -------------------- */
  function init() {
    FIN.index();
    FIN.updateHeaderStats();

    if (!FIN.isStatic()) {
      fetch('api/health', { cache: 'no-store' })
        .then((r) => r.json())
        .then((d) => { if (d && d.ok) FIN.serverAvailable = true; })
        .catch(() => {});
    }

    const searchBtn = FIN.$('#searchBtn');
    if (searchBtn) searchBtn.addEventListener('click', FIN.openSearch);

    const discBtn = FIN.$('#disclaimerBtn');
    if (discBtn) discBtn.addEventListener('click', FIN.openDisclaimer);

    const footDisc = FIN.$('#footerDisclaimerBtn');
    if (footDisc) footDisc.addEventListener('click', FIN.openDisclaimer);

    const footPrac = FIN.$('#footerPracticeLink');
    if (footPrac && FIN.practiceUrl) footPrac.href = FIN.practiceUrl('#/');

    document.addEventListener('click', (e) => {
      if (e.target.closest && e.target.closest('[data-disclaimer]')) {
        e.preventDefault();
        FIN.openDisclaimer();
      }
    });

    document.addEventListener('keydown', (e) => {
      const tag = (e.target && e.target.tagName) || '';
      const isInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable);
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        FIN.openSearch();
      } else if (!isInput && e.key === '/') {
        e.preventDefault();
        FIN.openSearch();
      } else if (e.key === 'Escape') {
        FIN.closeSearch();
        FIN.closeDisclaimer();
      }
    });

    FIN.renderRoute();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
