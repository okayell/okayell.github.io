<h3>爆量與天量：高檔與低檔天差地遠</h3>
<p>當某一天的成交量突然放大到平時的 3～5 倍以上，甚至創下幾個月來的新高量（俗稱「天量」），代表市場情緒到了極端，多空在這一天大量換手：</p>
<ol class="steps">
<li><b>高檔爆量收黑或留長上影線</b>股價已經連漲一大段、媒體全面報導利多時爆出巨量，當天卻開高走低收長黑 K 或留長上影線。這代表早盤追進去的散戶全數套在當天高點，而低檔布局的大戶趁機把股票倒給追價買盤，俗稱「高檔爆量出貨」。</li>
<li><b>突破盤整區的帶量長紅</b>股價橫盤整理好幾週、成交量一直很清淡，某天突然放量（例如 5 日均量的 2 倍以上）收長紅站上區間頂部，這是籌碼消化前波解套賣壓的「攻擊量」。</li>
<li><b>跌深後的低檔爆量止跌</b>連續重挫後某天爆出大量，卻沒有再破底，反而收長下影線或紅 K，代表恐慌賣壓與融資斷頭單被大資金接走，有機會形成短期底部。</li>
</ol>
<div class="callout key"><b>重點</b>爆量那一天的<strong>最高價與最低價</strong>非常關鍵：如果後續幾天股價都能守在「爆量 K 棒的最低價」之上，代表當天接手的人沒虧錢，偏多看待；一旦收盤跌破爆量 K 棒最低價，代表當天衝進去的買盤全部套牢，這包巨量就會變成上方的沉重壓力。</div>

<h4>均量線（MV）與量能潮：看出資金是在進場還是退潮</h4>
<p>就像把收盤價平均後會得到價格均線，把每天的成交張數取平均，也會得到<strong>均量線（Moving Volume，簡稱 MV）</strong>。台股看盤軟體預設最常畫出兩條均量線：</p>
<ul>
<li><strong>5 日均量（MV5）</strong>：最近一週（5 個交易日）的平均成交量，反映短線人氣熱不熱。</li>
<li><strong>20 日均量（MV20）</strong>：最近一個月（20 個交易日）的平均成交量，反映中期資金水位的基準線。</li>
</ul>
<p>當 5 日均量由下往上穿越 20 日均量（均量黃金交叉），而且每日量柱持續站在 20 日均量之上，稱為「溫和擴量」或「量能潮推升」，是波段多頭最穩健的燃料；反之，如果股價還在緩步創高，但 5 日均量卻已經跌破 20 日均量且一路往下滑，就代表市場追價資金正在退潮，隨時要提防漲勢熄火。</p>

<h3>台股特殊情況：漲跌停鎖死時的「無量」陷阱</h3>
<p>前面四種量價關係有一個台股專屬的例外，就是<strong>漲停鎖死與跌停鎖死</strong>：</p>
<ul>
<li><strong>無量漲停</strong>：重大利多公布時，一開盤買單高掛幾萬張，但沒人願意賣，整天成交量極小。這不是「價漲量縮沒人追」，而是「想買卻買不到」。</li>
<li><strong>無量跌停</strong>：重大利空時，一開盤賣單排隊十幾萬張，但買盤全部縮手，成交量反而急凍。這不是「價跌量縮賣壓輕」，而是流動性凍結、「想賣卻賣不掉」。</li>
</ul>

<h3>新手最大魔王：高檔鈍化與低檔鈍化</h3>
<p>很多新手學完「KD 大於 80 超買要賣、小於 20 超賣要買」，一進台股實戰就吃大虧——因為在強烈趨勢裡，KD 會發生<strong>指標鈍化（Saturation）</strong>：</p>
<div class="compare"><div><h4>🔥 高檔鈍化（強者恆強）</h4><p>當個股進入主升段、幾乎天天創 9 日新高時，RSV 天天接近 100，K 值就會<strong>連續 3 個交易日以上維持在 80 以上</strong>。這代表多方氣勢極強，若在第一天站上 80 就急著賣出甚至放空，往往會錯過後面最大的一段漲幅（或被軋空）。</p></div><div><h4>🧊 低檔鈍化（弱者恆弱）</h4><p>當個股遭遇重大利空、沿著 5 日線一路破底時，K 值會<strong>連續 3 個交易日以上貼在 20 以下</strong>。這時看到「低於 20 很便宜」就去接刀，往往接到半山腰，後面還有好幾根跌停。</p></div></div>
<div class="callout key"><b>重點</b>怎麼分辨「該獲利了結的超買」與「高檔鈍化」？先看<strong>均線排列與位置</strong>：如果股價在區間箱型裡來回，KD 到 80 死亡交叉很準；如果股價剛帶量突破盤整區、5 日與 20 日均線正陡峭上揚，KD 衝上 80 反而是強勢表態，通常要等 K 值跌破 D 值且跌回 80 以下，才視為鈍化結束。</div>

<h3>進階利器：KD 背離（頂背離與底背離）</h3>
<p>當股價走出新高或新低，KD 指標卻沒有跟著創高或創低，叫做<strong>背離（Divergence）</strong>，是動能悄悄改變的早期線索：</p>
<ul>
<li><strong>頂背離（高檔背離，偏空警訊）</strong>：股價創下波段新高（一峰比一峰高），但對應的 KD 高點卻比前一波低（一峰比一峰低），隨後出現死亡交叉。代表雖然價格勉強創高，但收盤價在 9 日區間裡的相對強度已經不如前一波。</li>
<li><strong>底背離（低檔背離，偏多線索）</strong>：股價再創波段新低（一底比一底低），但對應的 KD 低點卻比前一次高（一底比一底高），隨後出現黃金交叉。代表下殺力道正在減弱，若搭配長下影線或放量紅 K，常是跌深反彈的起點。</li>
</ul>

<p><strong>情境一（強勢股高檔鈍化，示意）</strong>：<span class="stk" data-code="2330">台積電</span>帶量突破 900 元盤整區後沿著 5 日線一路上攻，K 值在 920 元時就站上 82，接著連續 8 個交易日 K 值都維持在 80～92 之間，股價一路漲到 1,000 元以上（如 2024 年 7 月突破千元波段）。如果在 920 元看到「K ＞ 80 超買」就賣光，就會錯過整段主升段；直到後來 K 值跌破 D 值且掉回 80 以下，短線才真正進入整理。</p>
<p><strong>情境二（箱型區間低檔黃金交叉，示意）</strong>：<span class="stk" data-code="2454">聯發科</span>在 1,100～1,250 元的箱型區間內橫盤整理，60 日季線走平。當股價回測 1,110 元支撐帶時，9 日 KD 落到 18 附近；隔天收紅 K 站上 1,140 元，K 值從 18 跳升到 29、由下往上穿越 D 值（22）形成<strong>低檔黃金交叉</strong>。這種「重要支撐帶 ＋ 低檔金叉」的組合，參考價值就比半空中的交叉高得多。</p>
</div>

<h3>KD 實戰使用守則</h3>
<ol class="steps">
<li><b>先用均線分盤勢</b>月線、季線走平的箱型整理盤，以 KD 80／20 高低檔交叉為主；均線多頭排列的趨勢盤，只找回檔後的低檔黃金交叉（順勢做多），不因高檔超買而逆勢放空。</li>
<li><b>看交叉發生的位置</b>發生在 20 以下（或剛站回 20）的黃金交叉、以及 80 以上（或剛跌破 80）的死亡交叉，訊號比 40～60 中間區域的糾結交叉乾淨得多。</li>
<li><b>搭配 K 線型態與支撐壓力</b>低檔金叉若剛好出現在前波低點支撐或錘子線之後，勝率才會提升；一旦收盤跌破該波低點，就要果斷執行停損。</li>
</ol>

<h3>KD 與其他指標的綜合搭配</h3>
<p>KD 屬於非常靈敏的動能指標，如果只看 KD 單一指標操作，在盤整區間常常會被兩三天的假跌破或假突破騙出場（俗稱被「雙巴」）。因此在台股實務操作上，老手們通常會把 KD 當作「找買賣點」的輔助工具，但在進場之前，會先用<b>均線（MA）</b>或<b>MACD</b>來判斷大方向的趨勢。</p>

<p>在技術分析中，<b>RSI（Relative Strength Index，相對強弱指標）</b>是歷史最悠久、也最被廣泛使用的動能指標之一。它是由美國技術分析大師 J. Welles Wilder Jr. 在 1978 年提出，用來評估過去一段時間內市場買方與賣方的力量對比。RSI 的計算基礎非常直觀，就是將這段時間內所有「上漲的點數總和」除以「上漲與下跌點數的絕對值總和」，最後得出一個介於 0 到 100 之間的數值。這個數值可以幫助投資人快速判斷當前股價到底是「漲過頭了（超買）」還是「跌過深了（超賣）」。</p>

<h3>RSI 的參數設定與具體涵義</h3>
<p>這套指標最核心的參數就是「天數（週期）」。在原創者 Wilder 的定義中，RSI 的標準參數是 <b>14 天</b>（也就是抓最近 14 根日 K 棒來計算）。雖然在台股的看盤軟體中，常常會為了迎合喜好短線交易的投資人，而同時預設顯示 6 日與 12 日的 RSI，讓短線客能更快看到波動。但實際上，天數越短，指標就越敏感，產生的「騙線雜訊」也越多。對於一般波段操作與尋找真正有意義的趨勢轉折點而言，<b>RSI 14 Wilder</b> 依然是實戰中最穩健的標準參數。</p>

<h3>MACD 的三大元件與 12/26/9 參數設定</h3>
<p>要學會看 MACD，首先要了解它的組成。台股看盤軟體中最主流的 MACD 參數預設值是 <b>12、26、9</b>，其圖表通常由三個關鍵部分組成（台灣軟體習慣以 DIF、MACD、OSC 來稱呼這三者）：</p>

<h3>型態學的靈魂與生命線：頸線（Neckline）</h3>
<p>在真正開始學習判斷型態之前，投資人一定要先認識最重要的防線——「頸線」。頸線是多空雙方最後、也是最關鍵的防線，一個型態到底能不能正式成立，關鍵就在於這條頸線有沒有被帶量突破或狠狠跌破。如果價格始終沒有越過頸線，那麼任何在圖表上長得很像 W 或 M 的形狀，都只能算是投資人自己一廂情願的猜測，毫無實質意義。</p>

<li><b>M 頭的頸線：</b>將頂部連接兩個山頭（兩個波段高點）中間那個「回檔低點」畫出一條水平的支撐線。一旦跌破，整個頭部就會正式成型。</li>

<h3>指標分類的藝術與化繁為簡</h3>
<p>要真正做好技術指標的綜合應用，首先必須深刻理解各種指標的本質，並將它們分為兩大類。你絕對不能拿兩個同類型的指標在畫面上互相打架，而是應該學會「跨類別」來互相搭配，彌補彼此的盲點：</p>

<h3>為什麼必須冷酷無情地執行停損？</h3>
<p>許多剛進股市的新手，最容易犯的致命錯誤就是捨不得停損。他們心裡總是想著：「只要我不賣，帳面上的虧損就不算真的賠錢，公司還在營運，總有一天股價會漲回來的。」但台股歷史上，從百元俱樂部的輝煌高價，一路跌到變成壁紙下市的股票比比皆是。在數學上，有一個非常殘酷且無法反駁的真相：</p>
<ul>
<li>如果你虧損了 <b>10%</b>，你接下來需要賺 <b>11.1%</b> 才能回本。</li>
<li>如果你虧損了 <b>20%</b>，你接下來需要賺 <b>25%</b> 才能回本。</li>
<li>如果你虧損了 <b>50%</b>（資產腰斬），你接下來需要賺 <b>100%</b>（資產翻倍）才能勉強回本！</li>
</ul>
<p>在股市中，要挑到一檔能讓你獲利 10% 的股票或許不難，但要挑到一檔能讓你獲利 100% 的飆股卻是難如登天。及早果斷地停損，是為了保留你的資金子彈，讓你有能力在下一次遇到高勝率的好機會時，把失去的錢輕鬆賺回來。</p>

<h3>實戰應用：專業級的 2% 資金控管法</h3>
<div class="widget" data-widget="risk-calc"></div>

    <div class="case">
<b>台股實例：如何計算進場部位與停損點</b><br>
假設你目前投入股市的總本金是 100 萬元，你給自己設定的鐵血紀律是：「不管多麼看好一檔股票，每一筆交易，我最多只能賠掉總本金的 2%（也就是 2 萬元）。」<br>
今天你看到一檔現價 100 元的股票剛剛帶量突破了 W 底的頸線，你決定買進試單。依照技術分析，你將停損點設在跌破前波低點支撐的 90 元。<br>
這代表你每買進一張（花費 10 萬元），如果真的不幸跌到停損點被洗出場，你會賠掉 1 萬元。<br>
因為你規定自己的單筆最大虧損額度是 2 萬元，所以經過簡單計算，這筆交易你<b>最多就只能買 2 張</b>。<br>
透過這種方式，就算這筆交易徹底失敗、看錯方向，你也只會損失總本金的 2%，完全不會傷筋動骨，晚上睡覺依然安穩。這，就是專業操盤手每天都在做的資金控管。
</div>

<h3>常見的停損與停利實戰策略</h3>
<p>在建立部位後，退場機制的設定與進場一樣重要，常見的做法分為以下三種：</p>
<ol class="steps">
<li><b>固定比例或金額停損法：</b>在進場前就白紙黑字設定好，只要帳面虧損達到 7%、10%，或者虧損金額達到預設的兩萬元，就無條件以市價砍倉出場。這是最機械化、不帶感情，也最容易執行的防呆機制。</li>
<li><b>技術面破線停損法：</b>原則很簡單：「以你進場的理由，作為你出場的理由」。例如你是因為「突破月線」而買進，那只要「跌破月線且連續三天站不回」就必須停損；因為「W 底突破」買進，只要跌破頸線就得無情走人。</li>
<li><b>移動停利（向上推進法）：</b>當當前股價如你預期般出現大漲，千萬不要急著賺個 5% 就落袋為安。你可以把防守線「跟著股價往上移」。例如股價從 100 漲到了 130，你可以把停利點設在上揚的 10 日均線。只要股價不跌破 10 日線，你就一路死抱到底，直到它真的轉弱跌破為止，這樣才能吃到完整的波段大利潤。</li>
</ol>
<p>此外，現代多數台股券商 App 都有提供強大的「條件單」或「智慧單」功能。強烈建議在買進成交的當下，就立刻打開 App 設定好觸發停損的價格，讓雲端系統在價格到達時幫你自動砍倉，這能完美克服人類天性中那種「再等一下下」、「捨不得按賣出」的致命弱點。</p>

<h3>技術分析的本質與交易心理學</h3>
<p>在我們深入學習了這項技術指標之後，投資人必須重新思考「技術分析」在真實市場中的定位。許多初學者往往將技術分析視為預測未來的魔法水晶球，認為只要指標發出了某種訊號，未來的股價就必定會按照劇本精準演出。然而，金融市場是由無數個具有貪婪與恐懼情緒的人類所組成的複雜系統，任何單一指標都無法保證百分之百的勝率。</p>
<p>技術分析真正的本質，其實是「統計學」與「機率」的應用。我們透過觀察過去的歷史數據與價格軌跡，找出那些在機率上勝率較高、期望值較為正向的進出場點位。換句話說，我們不是在預測未來，而是在尋找有利的交易機會。當你了解了這一點，你就不會因為一次的假突破或假跌破而對技術分析徹底絕望，更不會因為一次的成功而自滿地重押單一股票。</p>
<p>在台股的實戰操作中，除了熟練運用指標之外，更重要的是建立強大的交易心理素質。面對每天盤中跳動的報價，投資人極易受到市場情緒的影響而做出非理性的決策。當你手中的持股出現了明確的停損訊號時，你是否能夠毫無懸念地按下賣出鍵？當大趨勢依然強勁、指標顯示仍有上漲空間時，你是否能夠克服想要落袋為安的短視心態，讓獲利持續奔跑？這些心理層面的修煉，往往比單純背誦指標參數來得更加重要與艱難。只有將嚴格的資金控管、冷靜的停損停利紀律，以及對指標局限性的深刻認知結合在一起，你才能在這場零和遊戲中成為長期穩定獲利的贏家。請永遠記住：市場永遠是對的，我們能控制的只有自己的風險承受度與交易紀律。</p>

<h3>損益表：一段期間賺多少</h3>
<p>損益表由上往下讀，像一層一層扣掉成本與費用的階梯：</p>
<ol class="steps">
<li><b>營業收入</b>賣產品或服務收到的金額，也就是「營收」。</li>
<li><b>營業毛利</b>營收扣掉營業成本（原料、直接人工、工廠折舊）。</li>
<li><b>營業利益</b>毛利再扣掉營業費用（推銷、管理、研發），代表本業賺多少。</li>
<li><b>稅前淨利</b>營業利益加減業外損益（利息、匯兌、轉投資、處分資產）。</li>
<li><b>稅後淨利</b>扣掉所得稅後的最終獲利；其中「歸屬於母公司業主」的部分拿來算 <a href="#/lesson/fa-eps">EPS</a>。</li>
</ol>
<div class="formula">稅後淨利 = 營收 − 營業成本 − 營業費用 ± 業外損益 − 所得稅</div>

<p>翻成損益表的語言：每 100 元營收，最後約有 40.5 元變成稅後純益（1 兆 1,733 億 ÷ 2 兆 8,943 億 ≈ 40.5%）。這個比例就是下一堂<a href="#/lesson/fa-margins">三率</a>課裡的稅後淨利率。</p>
</div>

<h3>資產負債表：某一天的身家</h3>
<p>資產負債表的一邊列出公司擁有的東西（資產），另一邊說明買這些東西的錢從哪裡來：向別人借的叫負債，股東自己的叫股東權益（又稱淨值）。兩邊永遠相等。</p>
<div class="formula">資產 = 負債 + 股東權益</div>
<ul>
<li><b>流動資產</b>一年內可以變現：現金、應收帳款、存貨。</li>
<li><b>非流動資產</b>長期使用：不動產、廠房及設備，以及長期投資。</li>
<li><b>負債</b>一年內要還的流動負債（應付帳款、短期借款），以及長期借款、公司債。</li>
<li><b>股東權益</b>股本、資本公積、保留盈餘（歷年賺了但還沒分掉的錢）。</li>
</ul>
<p>股東權益除以流通在外股數就是每股淨值，是<a href="#/lesson/fa-pb">股價淨值比</a>的基礎；負債占資產多少，則在<a href="#/lesson/fa-debt-safety">負債與財務安全</a>那一課細談。</p>

<h3>三個成長率怎麼算</h3>
<div class="formula">月增率（MoM）=（本月營收 − 上月營收）÷ 上月營收 × 100%</div>
<div class="formula">年增率（YoY）=（本月營收 − 去年同月營收）÷ 去年同月營收 × 100%</div>
<div class="formula">累計年增率 =（今年累計營收 − 去年同期累計營收）÷ 去年同期累計營收 × 100%</div>

<h3>淡旺季與春節：月增率最容易誤判</h3>

  title: '三率：毛利率、營業利益率、稅後淨利率',
  icon: '📐',

  tldr: '毛利率看產品賺不賺、營業利益率看本業效率、稅後淨利率看最後留下多少；三率一起看，才分得出本業實力和業外運氣。',
  plain: '開一家麵店，一碗賣 100 元，麵和湯料 40 元，毛利 60 元（毛利率 60%）；再扣掉房租、薪水、廣告 45 元，本業賺 15 元（營業利益率 15%）；另外賣掉舊設備賺 5 元、繳稅 4 元，最後留下 16 元（稅後淨利率 16%）。三率就是每一關各留下多少。',

  html: `
<h3>從營收到淨利的三道關卡</h3>
<p>損益表像一個漏斗：營收從最上面倒進去，每經過一道關卡就被扣掉一部分。三率問的是「每 100 元營收，過了第幾關還剩多少」。</p>
<table class="tbl"><thead><tr><th>示意（億元）</th><th>金額</th><th>占營收</th><th>對應比率</th></tr></thead><tbody>

<tr><td>＝ 營業利益</td><td>30</td><td>15%</td><td>營業利益率</td></tr>
<tr><td>± 業外損益</td><td>+6</td><td>3%</td><td>—</td></tr>
<tr><td>＝ 稅前淨利</td><td>36</td><td>18%</td><td>稅前淨利率</td></tr>
<tr><td>− 所得稅（假設稅率 20%）</td><td>7.2</td><td>3.6%</td><td>—</td></tr>
<tr><td>＝ 稅後淨利</td><td>28.8</td><td>14.4%</td><td>稅後淨利率</td></tr>
</tbody></table>
<div class="callout key"><b>重點</b>三率的分母都是<b>營業收入</b>。毛利率一定高於營業利益率；但稅後淨利率不一定最低，業外收益很大時，它可能反過來高於營業利益率。</div>

<h3>三個公式，各看一件事</h3>
<div class="formula">毛利率 = 營業毛利 ÷ 營業收入 × 100%</div>
<p><b>看產品本身賺不賺錢。</b>毛利率高，代表產品有定價能力（技術領先、品牌、專利），或成本控制得好。原物料漲價、殺價競爭、產能利用率下降，都會讓毛利率下滑。</p>
<div class="formula">營業利益率 = 營業利益 ÷ 營業收入 × 100%</div>
<p><b>看本業的整體效率。</b>它把推銷、管理、研發費用都扣掉了。毛利率很高、營業利益率卻很低，通常是研發或行銷花費很大；對科技業來說研發是競爭力來源，要看花下去的錢有沒有換來成長。</p>
<div class="formula">稅後淨利率 = 稅後淨利 ÷ 營業收入 × 100%</div>
<p><b>看最後真正留下多少。</b>它包含業外損益（利息、匯兌、轉投資、處分資產）和所得稅。金管會規定年報財務分析裡的「純益率」= 稅後損益 ÷ 銷貨淨額，和稅後淨利率是同一個概念。</p>
<div class="callout tip"><b>實戰小技巧</b>營業利益率 = 毛利率 − 營業費用率（營業費用 ÷ 營收）。上表的示意公司毛利率 40%、費用率 25%，營業利益率就是 15%。財報會把營業費用拆成推銷、管理、研發三項，哪一項占營收的比例突然變大，就是要追問的地方。</div>
<p>有些網站還會列出<b>稅前淨利率</b>（稅前淨利 ÷ 營收），它介於營業利益率與稅後淨利率之間，可以排除所得稅率變動的干擾；稅前淨利率減掉營業利益率，大約就是業外損益占營收的比例。財報金額多以新台幣仟元表示，算比率時只要分子分母單位一致即可。</p>

<h3>動手算：三率計算機</h3>
<p>在下方互動元件輸入營收、營業成本、營業費用、業外損益與所得稅，觀察三率怎麼變，以及瀑布圖裡每一關扣掉多少：</p>
<div class="widget" data-widget="three-rates"></div>
<ul>
<li><b>試試看 1：降成本</b>只把營業成本調低，三個比率會一起上升。</li>
<li><b>試試看 2：營運槓桿</b>用上表的示意數字，營收和營業成本都增加 20%、營業費用不變：毛利率仍是 40%，營業利益率卻從 15% 升到 19.2%。費用固定的公司，營收一成長，本業獲利會放大得更快。</li>
<li><b>試試看 3：業外收益</b>加入一筆大額業外收益：只有稅前與稅後淨利率跳升，營業利益率完全不動。</li>
</ul>

<h3>台股實例：聯發科的三率</h3>
<div class="case"><div class="case-title">台股實例：聯發科 2024 與 2025 年三率比較</div>
<p><span class="stk" data-code="2454">聯發科</span> 2024 年營收約 5,305.9 億元（年增 22.4%）、稅後淨利約 1,071.4 億元，每股盈餘 66.92 元（來源：旺得富 2025-02-07 法說會報導）。依富邦證券的財務比率年表，兩年三率如下：</p>

<tr><td>2024</td><td>+22.41%</td><td>49.64%</td><td>19.30%</td><td>22.53%</td><td>20.19%</td><td>66.92 元</td></tr>
<tr><td>2025</td><td>+12.32%</td><td>47.50%</td><td>17.36%</td><td>20.96%</td><td>17.81%</td><td>66.16 元</td></tr>
</tbody></table>
<p>兩個觀察：第一，稅前淨利率比營業利益率高出約 3 個百分點，因為業外收支約占營收 3%（2024 年為 3.22%），這部分不是本業賺的。第二，2025 年營收仍成長約 12%，但三率同步下滑，EPS 反而比 2024 年少一點：營收成長不等於獲利成長。</p>
<p>想知道三率為什麼下滑，下一步是翻財報附註與法說會簡報，看是產品組合、售價、匯率還是研發費用造成的，而不是只看結果。</p>
</div>

<h3>判讀重點：和誰比、看多久</h3>
<ul>
<li><b>跟同業比</b>產業結構決定三率高低：IC 設計、軟體常有高毛利；電子組裝代工、通路商毛利率偏低，靠規模與周轉賺錢。跨產業比三率沒有意義。</li>
<li><b>跟自己過去比</b>至少看連續 4～8 季，並和去年同期比，避開淡旺季。台股常說的「三率三升」，是指三率同時比前期（上一季或去年同期）提升，常代表產品組合變好或規模效益出現。</li>

<li><b>留意匯率</b>外銷比重高的公司，新台幣大幅升值或貶值時，毛利率與業外匯兌損益都可能受影響。</li>
</ul>
<div class="compare"><div><h4>✅ 健康訊號</h4><p>毛利率穩定或上升、營業利益率跟著擴張、淨利主要來自本業。</p></div><div><h4>⚠️ 警訊</h4><p>營收成長但毛利率連續下滑、靠業外撐住淨利、費用率持續攀升。</p></div></div>

`,

<h3>EPS 是什麼：每一股分到多少獲利</h3>
<p>每股盈餘（EPS）回答一個問題：「公司這段期間賺的錢，平均分到每一股是多少？」它是台股最常被引用的獲利數字，也是<a href="#/lesson/fa-pe">本益比</a>的分母。</p>
<div class="formula">EPS = 歸屬於母公司業主的稅後淨利 ÷ 加權平均流通在外普通股股數</div>
<ul>
<li><b>分子只算「母公司業主」的部分</b>集團旗下子公司若有其他股東（非控制權益），那一份獲利不屬於母公司股東，要先排除；有特別股時，特別股股利也要先扣掉。</li>
<li><b>分母用「加權平均」股數</b>一年當中可能現金增資或買回庫藏股，所以要依每批股份實際流通的天數加權，而不是直接用期末股數；庫藏股不算流通在外。</li>
<li><b>基本 EPS 與稀釋 EPS</b>稀釋 EPS 假設可轉換公司債、員工認股權等潛在普通股都轉成股票，數字通常比較低，代表較保守的情況。</li>
</ul>

<h3>股本、面額與股數：「÷ 10」的由來與例外</h3>
<p>台股多數公司的股票面額是 10 元，所以有個方便的換算：</p>
<div class="formula">股數 = 股本 ÷ 面額（面額 10 元時：股數 = 股本 ÷ 10）</div>
<p>示意：股本 80 億元、面額 10 元的公司有 8 億股；若當年歸屬母公司業主的稅後淨利 20 億元，EPS = 20 億 ÷ 8 億股 = 2.5 元。</p>
<div class="callout warn"><b>注意：彈性面額</b>金管會在 2013 年 12 月修正股務處理準則，取消面額一律 10 元的限制。面額不是 10 元的公司，股票簡稱後面會加上「*」，面額可能是 5 元、2.5 元、1 元，甚至無面額（櫃買中心網站列有名單）。這些公司不能用「股本 ÷ 10」，要用實際發行股數計算。</div>
<table class="tbl"><thead><tr><th>示意：同一家公司</th><th>面額 10 元</th><th>面額 1 元</th></tr></thead><tbody>
<tr><td>股本</td><td>10 億元</td><td>10 億元</td></tr>
<tr><td>股數</td><td>1 億股</td><td>10 億股</td></tr>
<tr><td>稅後淨利</td><td>10 億元</td><td>10 億元</td></tr>
<tr><td>EPS</td><td>10 元</td><td>1 元</td></tr>
</tbody></table>
<p>公司真正賺的錢一樣多，只是切成更多片。所以 EPS 的「金額」不能直接跨公司比高低，比較時要看成長率、<a href="#/lesson/fa-roe-roa">ROE</a> 或本益比。</p>

<h3>加權平均股數：股數變動時怎麼算</h3>
<p>示意：某公司年初有 2 億股，4 月 1 日現金增資發行 4,000 萬股，全年歸屬母公司業主的稅後淨利 4.6 億元。新股只流通了 9 個月，所以只算 9/12 的權重：</p>
<div class="formula">加權平均股數 = 2 億 × 12/12 + 0.4 億 × 9/12 = 2.3 億股；EPS = 4.6 億 ÷ 2.3 億股 = 2 元</div>
<p>若直接用期末的 2.4 億股，EPS 會被低估成約 1.92 元。另外，發放股票股利或股票分割時，所有比較期間的股數都要追溯調整，前後年度的 EPS 才比得起來。</p>
<p>示意：某公司原有 1 億股，發放股票股利每股 2 元（面額 10 元，等於每 1,000 股配 200 股），股數變成 1.2 億股。若獲利同樣是 12 億元，EPS 會從 12 元變成 10 元；這不是公司變差，而是同一塊披薩切成更多片。財報也會用新股數重算去年的 EPS，讓兩年比得起來。</p>

<h3>動手算：EPS 計算機與近四季 EPS</h3>
<p>下方互動元件可以輸入稅後淨利與股本（面額 10 元時股數 = 股本 ÷ 10），也能把四季 EPS 加總：</p>
<div class="widget" data-widget="eps-calc"></div>
<p>判斷股價貴不貴時，最常用的是<b>近四季 EPS 合計</b>（又稱滾動 EPS）：把最近四個單季 EPS 相加，等於最近 12 個月的獲利。台股沒有單獨的第四季財報，第四季單季 EPS 約等於全年 EPS 減前三季累計。</p>
<div class="case"><div class="case-title">台股實例：台積電 2024 年的四季 EPS</div>
<p><span class="stk" data-code="2330">台積電</span> 2024 年單季 EPS 依序為 8.70、9.56、12.54、14.45 元，四季合計 45.25 元，與全年 EPS 相同（來源：玩股網財報資料、太報法說會報導）。</p>
<p>反推一次：全年稅後純益約 1 兆 1,733 億元；台積電股本約 2,593 億元、面額 10 元，約 259.3 億股；1 兆 1,733 億 ÷ 259.3 億股 ≈ 45.25 元（正式計算用加權平均股數，但台積電股數幾乎沒變，所以非常接近）。表中也看得出 EPS 逐季成長，第四季約是第一季的 1.7 倍。</p>
</div>

<h3>同一家公司，EPS 有四種常見版本</h3>
<table class="tbl"><thead><tr><th>版本</th><th>意思</th><th>常見用途</th></tr></thead><tbody>
<tr><td>單季 EPS</td><td>某一季（三個月）的 EPS</td><td>看季度成長與淡旺季</td></tr>
<tr><td>累計 EPS</td><td>今年第一季到最新一季的合計</td><td>和去年同期累計比較</td></tr>
<tr><td>近四季 EPS</td><td>最近四個單季相加，又稱滾動 EPS</td><td>計算本益比</td></tr>
<tr><td>全年 EPS</td><td>年度財報上的 EPS</td><td>討論股利分配、和歷年比較</td></tr>
</tbody></table>
<p>新聞說「EPS 創新高」時，先確認是哪一種：第三季財報公布時，「前三季累計 EPS」和「第三季單季 EPS」常同時出現，數字差很多。</p>

<h3>怎麼解讀 EPS：四個檢查點</h3>
<ol class="steps">
<li><b>看趨勢</b>和去年同期比、看近四季合計是否持續墊高，比單看一個數字有意義。</li>
<li><b>看品質</b>EPS 成長來自營業利益，還是處分資產、匯兌利益等業外？後者通常無法持續，可以回頭看<a href="#/lesson/fa-margins">三率</a>。</li>
<li><b>看股數</b>現金增資、員工酬勞以股票發放、股票股利都會增加股數、稀釋 EPS；買回庫藏股並註銷則會減少股數、推高 EPS。</li>
<li><b>搭配股價</b>EPS 3 元的股票不一定比 EPS 10 元的便宜，要算本益比；公司虧損時 EPS 為負，本益比就失去意義。</li>
</ol>
<p>EPS 也是股利的源頭：<b>盈餘分配率 = 每股股利 ÷ EPS</b>（只看現金時用每股現金股利）。示意：EPS 5 元、每股配發現金股利 3 元，盈餘分配率 60%。分配率長期超過 100%，代表公司發的比賺的多，要留意能否持續，細節在<a href="#/lesson/fa-dividend">殖利率與除權息</a>那一課。</p>
<div class="callout pro"><b>進階補充</b>財報同時列出基本與稀釋 EPS。兩者差距大，代表流通在外的可轉換公司債或員工認股權較多，未來轉換成股票時，原股東的每股獲利會被稀釋。閱讀財報時，建議養成同時對照基本與稀釋 EPS 的習慣，才不會低估潛在的股本膨脹影響。</div>

<p>示意：甲公司每股淨值 20 元、EPS 4 元；乙公司每股淨值 100 元、EPS 也是 4 元。兩家 EPS 一樣，但甲公司用 20 元本金就賺 4 元（效率 20%），乙公司卻要動用 100 元本金才賺 4 元（效率 4%）。這個「幫股東本金賺錢的效率」，就是<b>股東權益報酬率（ROE, Return on Equity）</b>。</p>

<div class="formula">ROE = 稅後淨利率 × 總資產週轉率 × 權益乘數</div>

<tr><td>總資產週轉率</td><td>營業收入 ÷ 平均總資產</td><td>營運效率：1 元資產一年能做多少生意（次）</td><td>翻桌率、存貨與應收帳款管理</td></tr>

<p>注意前兩項相乘（稅後淨利率 × 總資產週轉率）剛好等於「稅後淨利 ÷ 總資產」，也就是簡化版 <b>ROA</b>。因此杜邦公式也可以寫成：<b>ROE = ROA × 權益乘數</b>。</p>
<p>為什麼「權益乘數」可以直接換算成負債比率？因為「總資產 = 負債 + 股東權益」，所以「股東權益 ÷ 總資產 = 1 − 負債比率」，倒過來就是「權益乘數 = 1 ÷（1 − 負債比率）」。下表幫你快速對照：</p>
<table class="tbl"><thead><tr><th>負債比率（負債 ÷ 總資產）</th><th>股東權益占比</th><th>權益乘數（總資產 ÷ 股東權益）</th><th>常見產業型態</th></tr></thead><tbody>
<tr><td>20%</td><td>80%</td><td>1.25 倍</td><td>現金充沛的 IC 設計、軟體或無負債公司</td></tr>

<h3>動手算：杜邦分析計算機</h3>
<p>調整下方互動元件的稅後淨利率、總資產週轉率與權益乘數，觀察三種完全不同的商業模式如何算出相似的 ROE：</p>
<div class="widget" data-widget="dupont-calc"></div>
<ul>
<li><b>茅台／精品型（高淨利率）</b>淨利率 30% × 週轉率 0.5 次 × 權益乘數 1.33 倍 ≈ ROE 20%。靠技術門檻或品牌定價力賺錢。</li>
<li><b>量販通路／代工型（高週轉率）</b>淨利率 4% × 週轉率 2.5 次 × 權益乘數 2.0 倍 = ROE 20%。毛利雖薄，但貨賣得極快、翻桌率高。</li>
<li><b>高槓桿型（高權益乘數）</b>淨利率 8% × 週轉率 0.25 次 × 權益乘數 10 倍 = ROE 20%。ROA 其實只有 2%，全靠 90% 負債比把 ROE 放大 10 倍。</li>
</ul>

<h3>台股實例：中華電的穩健 vs. 金控的高槓桿</h3>

<p>再對照金控龍頭<span class="stk" data-code="2881">富邦金</span>：2024 年底每股淨值 62.3 元、全年稅後 ROE 高達 <b>16.93%</b>，但同期的稅後息前 <b>ROA 只有 1.30%</b>（來源：富邦證券財務比率表）。為什麼 ROE 是 ROA 的 13 倍？因為銀行與壽險業吸收大眾存款與保費來放款投資，存款與保單準備金在會計上都列為「負債」，權益乘數動輒 10～15 倍以上。看金融股時，絕不能只看 ROE 高就以為沒有風險，一定要同時檢查 ROA、逾放比與資本適足率。</p>
</div>

  html: `
    <h3>股價淨值比的計算與概念</h3>
    <p>股價淨值比（Price-to-Book Ratio，縮寫為 P/B 或 PB）是衡量股價相對於公司資產價值的指標。它的公式如下：</p>
    <p><code>股價淨值比 = 股價 ÷ 每股淨值</code></p>
    <p>所謂的「每股淨值」，代表在會計帳面上，每一股股票背後真正對應到的股東權益價值（資產減去負債後剩餘的部分）。如果一檔股票的 P/B 為 1.5 倍，代表投資人願意花 1.5 元去買公司帳面上價值 1 元的資產。這個比率越低，代表股價相對於公司資產越便宜。</p>

    <h3>現金股利與股票股利</h3>

    \n<p>對於長期存股族而言，除了關注當下的殖利率，更應該重視「股息成長」的潛力。一家真正優秀的公司，不僅每年都能穩定配發股息，還能隨著本業獲利的成長，逐年提高發放的股息金額。這種被稱為「股息成長股」的標的，雖然一開始的殖利率可能只有 3% 或 4%，看起來不如那些動輒 8%、10% 的高股息 ETF 或景氣循環股，但隨著時間的推移，投資人的「成本殖利率」（以當初買進成本計算的殖利率）會越來越高，甚至可能達到雙位數。此外，股息成長股通常伴隨著股價的長期上漲，讓投資人不僅賺到利息，還能賺到豐厚的資本利得（價差）。反觀許多為了迎合市場口味而勉強配發高額股利的公司，往往是挖東牆補西牆，拿公司的老本（資本公積）來發放，這種打腫臉充胖子的行為，不僅削弱了公司的長期競爭力，也讓投資人落入「賺了股息、賠了價差」的陷阱。因此，挑選定存股時，請務必檢視公司過去 5 到 10 年的配息紀錄，確認其獲利與配息是否呈現穩健向上的趨勢。</p>\n    <div class="widget" data-widget="dividend-calc"></div>

  track: 'fa',

  order: 10,
  title: '負債與財務安全：別讓公司倒在景氣寒冬前',
  icon: '🛡️',
  minutes: 8,
  tldr: '負債比率、流動比率、速動比率與利息保障倍數，是檢視公司財務是否健康的四大防護罩，避免遇上黑字倒閉的悲劇。',
  plain: '公司做生意難免要借錢，但借太多、或者借來的錢還不出來，就會倒閉。我們可以用「負債比率」看整體借了多少，用「流動/速動比率」看短期能不能還清，用「利息保障倍數」看賺的錢夠不夠付利息。財務安全指標就像體檢報告，能幫我們避開隨時可能破產的地雷股。一家公司如果空有獲利卻沒有現金還款，就會發生黑字倒閉。',
  keyPoints: [

    '利息保障倍數 = (稅前淨利 + 利息費用) ÷ 利息費用。低於 1 倍代表連利息都付不出來，是非常嚴重的警訊。'

  html: `
    <h3>四大財務安全防護罩</h3>
    <p>企業經營面臨景氣波動時，財務結構是否穩健，決定了公司能不能撐過寒冬。在多頭市場大家看獲利，但在空頭市場大家看的是誰能活下來。我們通常用以下四個核心指標來檢視：</p>
    
    <ol>
      <li><strong>負債佔資產比率</strong><br>
        <code>負債比率 = 負債總額 ÷ 資產總額 × 100%</code><br>
        這個指標告訴我們，公司的資產有多少比例是借來的。一般製造業通常在 40% ~ 60% 之間是合理範圍。如果過高（例如超過 70%），一旦景氣反轉，龐大的還款壓力可能會壓垮公司。</li>
      <li><strong>流動比率</strong><br>
        <code>流動比率 = 流動資產 ÷ 流動負債 × 100%</code><br>
        流動負債代表一年內要還的債；流動資產代表一年內能變現的資產。這個比率最好大於 200%（2 倍），表示公司手上有充裕的資源可以應付短期債務，不會因為一點資金缺口就跳票。</li>
      <li><strong>速動比率（酸性測驗比率）</strong><br>
        <code>速動比率 = (流動資產 − 存貨 − 預付款項) ÷ 流動負債 × 100%</code><br>
        存貨有時候賣不出去，預付款項不能變現。把這兩項扣除後，剩下的現金、應收帳款等才是最「快速」能還錢的資產。速動比率最好大於 100%，確保公司隨時能度過短期資金缺口。</li>
      <li><strong>利息保障倍數</strong><br>
        <code>利息保障倍數 = (稅前淨利 + 利息費用) ÷ 利息費用</code><br>

    </div>

    <h3>企業如何改善財務安全？</h3>\n    <p>企業可以透過發行新股籌資（現金增資）來增加自有資本，或是發行可轉換公司債等方式來優化財務結構。將短期借款轉換為長期借款也是常見的手法，這可以立刻提升流動比率與速動比率，減輕短期還款壓力。投資人應關注公司是否有積極改善體質的動作，而非只是發放高額股利卻債台高築。</p>\n    <h3>注意特殊產業的財務特性</h3>
    <p>財務比率不能死背硬記，必須考量產業特性。如果拿同一個標準去套用所有公司，會鬧出大笑話。例如：</p>
    <p>金融保險業（銀行、壽險）因為其營業模式就是吸收大眾存款，在財報上存款算作「負債」，因此金融股的負債比率通常高達 90% 以上。這是正常現象，而且金融業完全不適用一般的流動、速動比率標準。</p>
    <p>另外，營建業因為有很多興建中的房屋卡在存貨，速動比率通常偏低，必須搭配建案完工交屋的狀況一起看。而大型連鎖超商（如統一超 2912）收客戶現金，付廠商卻是三個月後的支票，流動比率常常低於 100%，這反而是它對供應商議價能力極強的表現。</p>
    
    \n<p>在深入分析財務安全指標時，我們還必須考量「負債的品質」。同樣是借錢，跟銀行借的高利息短期貸款，與發行低利息甚至零利息的可轉換公司債，對公司財務壓力的影響截然不同。此外，公司如果是為了擴充產能、購買最新設備以迎接即將到來的大筆訂單而增加負債，這種被稱為「良性負債」，因為未來的現金流足以覆蓋這些借款。反之，如果公司是因為本業持續虧損，為了發放員工薪水或應付日常開銷而不得不借錢，這就是「惡性負債」。投資人可以透過交叉比對「現金流量表」中的營業現金流與籌資現金流，來判斷公司的負債是屬於哪一種。若營業現金流長期為正且持續增長，偶爾的舉債只是為了加速擴張，這類公司的財務風險相對較低。相反地，若營業現金流長期為負，全靠籌資現金流（不斷借錢或向股東伸手要錢）來續命，這種公司的財務防護罩早已破洞百出，隨時可能面臨資金斷鏈的危機，投資人應敬而遠之。</p>\n    <div class="widget" data-widget="debt-calc"></div>
\n<p>巴菲特曾經說過，他喜歡那種「連笨蛋都能經營」的企業，因為這代表這家公司的護城河實在太寬、太深了，即使管理階層偶爾犯錯，也不會動搖公司的根本。這也是為什麼價值投資者願意花費大量時間去研究產業結構與競爭格局的原因。在尋找護城河的過程中，我們不僅要看公司「現在」有多賺錢，更要問「為什麼別人不能像它一樣賺錢？」。這是一個非常難以回答，但卻價值連城的問題。有時候，護城河可能隱藏在非常不起眼的細節中。例如，一家市佔率極高的清潔服務公司，雖然沒有高科技專利，但因為它已經與各大商辦大樓簽訂了長期合約，且服務品質穩定，競爭對手很難說服大樓管委會為了省一點點錢而更換廠商，這就形成了一種微型但穩固的轉換成本。投資人如果能培養出這種敏銳的商業洞察力，就能在茫茫股海中，發掘出那些尚未被市場完全認可、但實際上已經建立起堅固護城河的隱形冠軍，從而享受長期且穩健的投資回報。另外，對於台灣散戶投資人來說，理解台灣特有的產業生態聚落也是發掘護城河的關鍵。台灣在半導體、自行車、精密機械等領域擁有很多「隱形冠軍」，這些企業雖然不一定有強大的終端消費品牌（無形資產），但他們在供應鏈中卡位極深。透過幾十年的技術積累與上下游高度整合，這些公司往往擁有極強的「成本優勢」與「轉換成本」。當國際大廠要尋找替代供應商時，會發現根本找不到能同時提供如此高品質、高彈性且具備價格競爭力的廠商。因此，在評估台股時，不要只看財報上的數字，更要深入了解該公司在供應鏈中的獨特地位，這往往是台股企業最堅實的護城河所在。</p>\n  `,

    <p><code>PEG = 本益比 (P/E) ÷ 預估 EPS 成長率 (G)</code></p>

  id: 'fa-cashflow',
  track: 'fa',

  title: '現金流：賺到的錢有沒有真的進口袋',
  icon: '💵',
  minutes: 12,
  tldr: '獲利不等於現金：看懂營業、投資、籌資三種現金流，再算自由現金流，就能檢查盈餘品質。',
  plain: '損益表像「成績單」，告訴你公司賺了多少；現金流量表像「存摺」，記錄錢實際進出多少。成績單漂亮、存摺卻愈來愈薄，可能是貨款收不回來、庫存堆太多，或擴廠花太兇。學會看現金流，就能分辨獲利是真金白銀，還是只停在帳面上。',
  keyPoints: [
    '現金流量表把現金進出分成營業、投資、籌資（俗稱融資）三種活動。',
    '營業現金流長期為正、且接近或高於稅後淨利，代表盈餘品質較好。',
    '自由現金流 = 營業現金流 − 資本支出，是公司能自由運用的錢。',
    '投資現金流為負多半是在擴廠，要搭配營收與獲利成長一起判斷。',
    '單季現金流波動大，用 3–5 年合計數字比較，才不會被單一年度誤導。',
  ],
  html: `<h3>獲利不等於現金：早餐店的帳本</h3>
<p>想像你開一家早餐店，這個月帳本記著「營收 30 萬、淨賺 6 萬」。可是附近公司行號是月結，有 8 萬元下個月才付；你又買了一台 5 萬元的新煎台。月底打開抽屜，現金反而比月初少了 7 萬。帳面賺錢、口袋缺錢，這就是損益表和現金流量表的差別。</p>
<p>損益表採<strong>應計基礎</strong>：貨交出去、開了發票就認列營收，不管錢收到沒有。現金流量表只記<strong>現金實際進出</strong>。公司帳上有獲利，卻因週轉不靈倒閉，俗稱「黑字倒閉」，現金流量表通常能提早透露警訊。三張報表的關係可以先複習<a href="#/lesson/fa-statements">財報三表</a>。</p>
<div class="callout key"><b>重點</b>損益表回答「賺了多少」，現金流量表回答「錢到底在哪裡」。兩張一起看，才知道獲利的品質。</div>
<div class="compare"><div><h4>✅ 健康</h4><ul><li>營業現金流多年為正</li><li>營業現金流接近或高於稅後淨利</li><li>自由現金流足以支付現金股利</li></ul></div><div><h4>⚠️ 警訊</h4><ul><li>淨利年年成長，營業現金流卻停滯或為負</li><li>應收帳款、存貨成長遠快於營收</li><li>長期靠借款或增資來發股利</li></ul></div></div>
<h3>現金流量表的三種活動</h3>
<p>依國際會計準則第 7 號（IAS 7），現金流量表把一段期間的現金進出分成三類。台灣財報的正式名稱是「籌資活動」，財經網站常寫成「融資活動」，指的是同一件事。</p>
<table class="tbl"><thead><tr><th>活動</th><th>常見流入</th><th>常見流出</th><th>白話意思</th></tr></thead><tbody>
<tr><td>營業活動</td><td>銷貨收現</td><td>付貨款、薪資、所得稅</td><td>本業自己造血的能力</td></tr>
<tr><td>投資活動</td><td>處分設備、出售投資</td><td>買廠房設備（資本支出）、收購公司</td><td>為未來成長花的錢</td></tr>
<tr><td>籌資活動（融資）</td><td>借款、發行公司債、現金增資</td><td>還款、發放現金股利、買回庫藏股</td><td>和債權人、股東之間的資金往來</td></tr>
</tbody></table>
<p>台股財報多用<strong>間接法</strong>編製營業活動現金流：從稅前淨利出發，加回折舊、攤銷這類「有費用、沒付現」的科目，再調整營運資金。應收帳款或存貨增加，代表現金被卡住，要扣掉；應付帳款增加，代表晚一點才付錢給供應商，現金暫時留在公司，要加回。</p>
<table class="tbl"><thead><tr><th>間接法步驟（示意，單位：億元）</th><th>金額</th></tr></thead><tbody>
<tr><td>稅前淨利</td><td>100</td></tr>
<tr><td>＋ 折舊與攤銷（有費用、沒付現）</td><td>+30</td></tr>
<tr><td>− 應收帳款增加（客戶還沒付錢）</td><td>−25</td></tr>
<tr><td>− 存貨增加（現金變成倉庫裡的貨）</td><td>−15</td></tr>
<tr><td>＋ 應付帳款增加（晚點才付給供應商）</td><td>+10</td></tr>
<tr><td>− 支付所得稅</td><td>−20</td></tr>
<tr><td><strong>營業活動淨現金流入</strong></td><td><strong>80</strong></td></tr>
</tbody></table>
<div class="callout pro"><b>進階補充</b>IAS 7 允許支付的利息列在營業或籌資活動，支付的股利也可列在籌資或營業活動，只要各期一致即可。比較兩家公司前，先看附註的分類方式，避免拿蘋果比橘子。</div>
<h3>自由現金流與盈餘品質</h3>
<p>營業現金流是本業賺進的現金，但公司還得花錢維修、汰換、擴充設備。扣掉這筆資本支出後剩下的，才是能拿來發股利、還債、買回庫藏股或併購的「自由」現金。</p>
<div class="formula">自由現金流 = 營業活動淨現金流入 − 資本支出（取得不動產、廠房及設備）</div>
<p>舉例（示意）：營業現金流 80 億、資本支出 50 億，自由現金流 = 80 − 50 = 30 億。若公司一年發 40 億現金股利，不夠的 10 億就得動用存款或借錢；偶爾一年沒關係，年年如此就要小心。</p>
<p>有些網站用「營業現金流 + 投資現金流」簡化計算，會把買賣金融資產也算進去，數字和上式不同。比較公司時，記得用同一種算法。</p>
<div class="formula">盈餘含金量 = 營業活動淨現金流入 ÷ 稅後淨利 × 100%</div>
<p>這個比率長期在 100% 附近或以上，代表帳上獲利大多收成了現金；若連續幾年明顯低於 100%，就要回頭查應收帳款與存貨是不是愈堆愈多。擴張期或景氣轉折時，單一年度偏低不一定是壞事，看 3–5 年合計更準。</p>
<table class="tbl"><thead><tr><th>淨利高、現金少的常見原因</th><th>要查的地方</th></tr></thead><tbody>
<tr><td>客戶付款變慢，應收帳款暴增</td><td>應收帳款成長率是否遠高於營收成長率</td></tr>
<tr><td>產品賣不動，存貨愈堆愈多</td><td>存貨金額與存貨週轉天數</td></tr>
<tr><td>獲利來自一次性的處分利益</td><td>損益表的業外收入；處分資產收到的錢列在投資活動，不算營業現金流</td></tr>

<h3>四種現金流組合：公司走到哪個階段</h3>
<p>把三種現金流的正負號放在一起看，就能大致判斷公司的體質與階段。下方互動元件用示意數字畫出現金流情境圖，請觀察營業、投資、籌資三根柱子與自由現金流怎麼變化。</p>
<div class="widget" data-widget="cashflow-chart" data-scenario="healthy"></div>
<p>看圖三個重點：營業柱夠不夠高、投資柱有沒有把營業柱整個吃掉、籌資柱是正（向外拿錢）還是負（還錢、發股利）。再對照下表的四種典型組合：</p>
<table class="tbl"><thead><tr><th>情境</th><th>營業</th><th>投資</th><th>籌資</th><th>常見解讀</th></tr></thead><tbody>
<tr><td>健康成熟</td><td>＋（大）</td><td>−（適中）</td><td>−（發股利、還債）</td><td>本業現金足以支付投資與股利</td></tr>
<tr><td>成長擴張</td><td>＋</td><td>−（很大）</td><td>＋（借款、增資）</td><td>擴廠期，自由現金流可能暫時為負</td></tr>
<tr><td>燒錢</td><td>−</td><td>−</td><td>＋</td><td>本業還不能自給，靠外部資金撐</td></tr>
<tr><td>靠借錢撐場</td><td>小或為負</td><td>−</td><td>＋（舉債，甚至借錢發股利）</td><td>缺口靠借款補，利息負擔愈來愈重</td></tr>
</tbody></table>
<div class="callout tip"><b>實戰小技巧</b>情境要配合產業看：半導體、面板等重資產產業擴產時，投資現金流常大幅為負；通路、軟體業資本支出小，自由現金流通常比較接近營業現金流。</div>

<p>以下為<strong>示意數字</strong>，不是鴻海實際財報：</p>
<table class="tbl"><thead><tr><th>科目（示意）</th><th>A 年</th><th>B 年</th></tr></thead><tbody>
<tr><td>稅後淨利</td><td>1,400 億</td><td>1,500 億</td></tr>

<p>B 年淨利創高，但大量備料讓營業現金流縮水，又碰上擴產，自由現金流轉負。這時要追問：存貨是為了已經接到的訂單嗎？應收帳款收得回來嗎？把兩年合計來看，營業現金流 2,700 億、淨利 2,900 億，含金量約 93%，整體仍算正常。</p>
<p>看這類公司時，可以這樣做：</p>
<ul><li>用全年、甚至 3 年合計的營業現金流對比淨利，不要只看一季。</li><li>存貨增加時，對照月營收是否同步成長（見<a href="#/lesson/fa-monthly-revenue">月營收</a>一課）。</li><li>代工業毛利率低，營運資金管理的好壞會直接反映在現金流上。</li></ul>

FIN.LESSONS.push({
  id: "chip-foreign",
  track: "chip",
  stage: "basic",
  order: 2,
  title: "外資：掌握台股的超級巨獸",
  icon: "🌍",
  minutes: 8,
  tldr: "外資資金龐大，專挑大型權值股。他們看好就會連續買進，形成波段趨勢，是台股最重要的風向球。",
  plain: "外資就像是外國來的超級大富翁，他們買股票喜歡挑最大、最穩的公司（像台積電）。他們一旦決定買，就會每天買、連續買好幾週，把股價一路推上去。",
  keyPoints: ["外資資金規模最大，主導台股大盤指數漲跌。", "偏好流動性佳、市值大的權值股。", "操作週期長，容易形成明顯的「連續買超」或「連續賣超」趨勢。", "不要盲目相信外資報告的目標價，要看實際買賣超動作。"],
  html: `
    <h3>外資：掌握台股的超級巨獸</h3>
    <p>在三大法人中，<strong><span class="glossary-term" data-term-id="foreign-investors">外資</span></strong>（包含陸資）的資金規模最大，是台股市場中最具影響力的力量。外資泛指台灣以外的國際投資機構，例如摩根士丹利（Morgan Stanley）、高盛（Goldman Sachs）、美林（Merrill Lynch）等知名的外商投資銀行，或是全球性的大型共同基金與退休基金。</p>
    <p>由於外資的資金部位極其龐大，他們在進行投資決策時，必須考慮到資金進出的便利性與安全性。因此，外資最偏好的投資標的，通常是市值龐大、流動性極佳、且基本面穩健的大型權值股。例如：2330 台積電、2454 聯發科、2317 鴻海、以及各大金控公司（如 2881 富邦金、2882 國泰金）。這些股票的成交量夠大，才能容納外資動輒數億甚至數十億的買賣，而不會因為自己的一次下單就導致股價大幅波動。</p>
    
    <div class="widget" data-widget="inst-flow" data-focus="foreign"></div>

    <h3>外資的操作特性：趨勢一旦形成便不易改變</h3>
    <p>外資的決策過程通常非常嚴謹，會經過詳細的全球總體經濟分析、產業前景評估，以及個別公司的財務模型推演。一旦外資研究團隊看好某個產業或某家公司，並決定開始建立部位，這個買進的過程可能會持續好幾週，甚至好幾個月。這就是為什麼我們常在新聞上聽到「外資連續買超 15 天」或是「外資連買一個月」。</p>
    <p>相反地，如果外資看壞後市，或者為了因應國際股市的波動（例如美股大跌、聯準會升息）而必須將資金抽回母國，他們也會出現連續且大量的賣超。因此，跟隨外資的趨勢，是籌碼面分析中最基本也最有效的方法之一。「順著外資做，勝率通常不會太低。」我們可以在盤後追蹤外資的買賣超數據，來判斷一檔股票目前是否受到外資青睞。</p>

    <h3>外資報告與目標價的解讀方式</h3>
    <p>外資券商經常會針對個別公司發布研究報告，並給予「買進（Buy）」、「中立（Neutral）」或「賣出（Sell）」的評等，同時附上預估的「目標價」。這些報告在市場上具有極高的影響力，常常一發布就能帶動股價當天的漲跌。新聞媒體也非常喜歡報導「外資上看 XXX 元」來吸引散戶的點閱率與目光。</p>
    <p>然而，投資人必須注意，外資的報告有時會出現「口嫌體正直」的現象。也就是說，外資可能在報告中調高某檔股票的目標價，但在實際的盤後籌碼數據中，卻發現他們正在逢高賣出。這可能是因為不同外資機構的看法分歧（例如 A 外資寫報告看好，但 B 外資覺得太貴而倒貨），也可能是外資刻意釋放消息來掩護出貨。因此，比起外資「說了什麼」，我們更應該關注他們「實際做了什麼」（看盤後公布的買賣超數據）。如果報告說很好，但外資卻連續三天都在賣，請務必提高警覺。</p>

    <h3>外資動向如何影響台股大盤？</h3>
    <p>因為外資買賣的幾乎都是佔台股加權指數權重極高的大型股，所以外資的整體買賣超金額，與台股大盤指數的漲跌有著高度的正相關。當外資大舉匯入資金（買超台股）時，台股大盤通常會一路上漲；反之，如果國際局勢不穩，外資大舉匯出（賣超台股），大盤就很難有好的表現。觀察外資在期貨市場的未平倉多空單部位，也能提早預判外資對台股後市的看法。</p>

    <div class="case">
      <p><strong>台股實例（外資連續買超帶動波段上漲）</strong>：<br>
      假設 2330 台積電在經歷了一段時間的修正後，股價來到 500 元（示意數字）。此時，由於半導體產業前景轉佳，外資開始悄悄進場。在接下來的一個月裡，外資有 20 個交易日呈現買超，累計買超高達 10 萬張。<br>
      在這股龐大買盤的推動下，台積電的股價一路從 500 元推升至 600 元。這種「外資連續買超 ➔ 股價波段上漲」的模式，在台股大型權值股中非常常見。投資人若能在外資剛開始連續買超的初期就跟著進場，往往能獲取豐厚的波段利潤。</p>
    </div>

    <h3>新手常見陷阱</h3>
    <div class="pitfall">
      <p><strong>盲目相信外資目標價：</strong>很多新手看到外資喊出天價目標價就立刻衝進去買，卻沒發現外資自己正在趁利多消息出貨。記住：目標價只是參考，實際的買賣超數據才是真相。</p>
    </div>
    <div class="pitfall">
      <p><strong>以為外資買了一定馬上漲：</strong>外資建立部位的時間很長，他們有足夠的資金可以慢慢買、越跌越買。散戶資金有限，如果跟著外資在下跌趨勢中不斷攤平，很可能會在股價真正反彈前就把資金耗盡。</p>
    </div>
`,
  pitfalls: [{"myth": "外資喊出天價目標價就趕快買", "fact": "外資有時會「出報告拉高股價，實際卻在倒貨」，必須對照他們實際的盤後買賣超動作。"}, {"myth": "外資今天買，明天一定漲", "fact": "外資建立部位的時間很長，他們可以慢慢買、越跌越買，散戶如果資金不夠容易在反彈前就被洗出場。"}],
  practice: {"route": "#/stock/2330?tab=inst", "label": "查看台積電的外資買賣超狀況", "tip": "觀察台積電近期的外資動向，是呈現連續買超還是連續賣超？股價走勢是否與之相符？"},
  quiz: [{"q": "外資在台股市場中，最偏好投資下列哪一種類型的股票？", "opts": ["股本小、容易操作的飆股", "市值龐大、流動性佳的大型權值股", "連年虧損但有轉機題材的股票", "即將下市的危機入市股"], "ans": 1, "exp": "因為外資資金部位極大，需要足夠的流動性才能進出，所以他們最偏好台積電、聯發科等市值大、流動性佳的大型權值股。"}, {"q": "關於外資的操作特性，下列何者正確？", "opts": ["喜歡今天買、明天賣，做極短線當沖", "資金少，對大盤指數影響不大", "一旦決定方向，常會出現連續數週的買超或賣超", "只看技術面操作，完全不看基本面"], "ans": 2, "exp": "外資決策嚴謹且資金龐大，建立或出清部位需要較長時間，因此常形成「連續買超」或「連續賣超」的波段趨勢。"}, {"q": "當外資券商發布報告，大幅調高某檔股票的目標價時，投資人最明智的作法是？", "opts": ["立刻借錢重壓買進", "無視報告，直接放空", "觀察盤後籌碼，確認外資是否「真的」有在買進", "認為股價一定會漲到目標價，死抱不放"], "ans": 2, "exp": "外資報告有時會出現「口嫌體正直」（出利多報告卻在逢高賣出）的現象，因此必須對照盤後的實際買賣超數據，才能確認外資的真實動向。"}],
  sources: [{"title": "外資及陸資投資持股統計 - 臺灣證券交易所", "url": "https://www.twse.com.tw/zh/trading/foreign/mi-qfiis.html"}, {"title": "外國人投資台股說明 - 臺灣證券交易所", "url": "https://www.twse.com.tw/downloads/zh/investor/foreignInvest/foreignZH.pdf"}],
});

FIN.LESSONS.push({
  id: "chip-trust",
  track: "chip",
  stage: "basic",
  order: 3,
  title: "投信：發掘中小型飆股的推手",
  icon: "🎯",
  minutes: 8,
  tldr: "投信是國內的共同基金，偏好有爆發力的中小型股。每逢季底常有「作帳行情」，是尋找飆股的好指標。",
  plain: "投信就像是國內的尋寶團，他們為了拿到好成績，會努力尋找會賺錢的中小型公司。每到季底打分數時，他們還會特別用力買，把股價拉高（作帳）。",
  keyPoints: ["投信是國內發行共同基金的機構，由專業團隊操盤。", "偏好股本適中、具成長爆發力的中小型股。", "每逢季底（3、6、9、12月）與年底，常有拉抬績效的「作帳行情」。", "受限於法規，基金持有單一個股不得超過淨值 10%，持股比例過高容易反轉「結帳」。"],
  html: `
    <h3>投信：台股的中小型飆股製造機</h3>
    <p><strong><span class="glossary-term" data-term-id="investment-trust">投信</span></strong>全名是「證券投資信託公司」，簡單來說，就是國內發行共同基金與 ETF 的機構。我們一般投資人去銀行或網路上申購的台股基金，就是交由這些投信公司的「操盤團隊」來代為操作。由於近年來 ETF（指數股票型基金）在台灣大受歡迎，投信在台股市場的話語權也跟著水漲船高。</p>
    <p>雖然投信的總資金規模不如外資龐大，但他們在台股市場中的影響力絕對不容小覷，尤其是在<strong>中小型股</strong>的領域。為什麼呢？因為大型權值股（如台積電）的股本太大，投信買再多也推不動；為了讓基金績效打敗大盤，投信的操盤手必須努力尋找那些有爆發成長潛力、且股本適中的中小型公司。只要幾家投信同時看好一檔中小型股，集中的買盤很容易就能將股價推升一大段。</p>

    <div class="widget" data-widget="inst-flow" data-focus="trust"></div>

    <h3>投信的操作特性與法規限制</h3>
    <p>投信的操作風格通常介於外資（長線）與自營商（短線）之間，屬於<strong>中波段操作</strong>。當他們看好一檔股票時，可能會連續買超幾天到幾週，帶動股價展開一波凌厲的漲勢。許多台股著名的「飆股」，背後都有投信連續買超的身影。因此，「跟著投信買中小型股」是許多籌碼面投資人愛用的高勝率策略。</p>
    <p>然而，投信在操作上有嚴格的法規限制。最重要的一條是：<strong>一檔基金持有單一股票的金額，不得超過該基金淨資產價值的 10%</strong>。這意味著，當投信對某一檔股票的持股比例越來越高時，他們能再加碼的空間就越來越小；一旦整體投信對該檔股票的持股比例達到 15% 甚至 20% 的高水位（也就是所謂的「投信高持股」），或者股價已經大幅反映了基本面利多，操盤團隊可能就會開始獲利了結（結帳），這時股價就容易面臨巨大的修正壓力。投資人一定要特別避開這類高持股比例的個股，以免成為最後一隻老鼠。</p>

    <h3>什麼是「投信作帳行情」？</h3>
    <p>投信的操盤團隊有極大的績效排名壓力。每逢<strong>季底（3、6、9、12 月底）</strong>與<strong>年底</strong>，各家投信為了讓自己的基金績效報表好看一點，常常會集中火力，拉抬自己手中持股比例較高的股票，這就是台股著名的<strong>「作帳行情」</strong>。這種作帳力道在季底的前半個月最為明顯，是短線操作的絕佳時機。</p>
    <p>相反地，如果某一檔股票表現不如預期，或者操盤手判斷後市不佳，他們也可能會在季底前毫不留情地將其賣出，以免拖累績效，這被稱為<strong>「結帳行情」</strong>。因此，在每季季底前，投資人可以特別關注投信連續買超（可能作帳）或連續賣超（可能結帳）的標的，這往往是市場資金的風向球。</p>

    <div class="case">
      <p><strong>台股實例（投信連續買超推升股價）</strong>：<br>
      假設某一檔中小型電子股，股本不大，近期接到國際大廠的新訂單。某家投信的團隊拜訪公司後，確認業績將大幅成長，於是開始進場。在前幾天，股價還在 50 元（示意數字）附近盤整，但盤後資料顯示投信每天買超 500 張。<br>
      隨著投信連續買超一週，市場投資人也發現了這個籌碼訊號，紛紛跟進，股價迅速拉升到 70 元。這種「投信點火 ➔ 散戶抬轎」的模式，是中小型飆股常見的劇本。投資人若能在投信剛開始買超的前幾天就發現並跟進，往往能享受一段不錯的漲幅。</p>
    </div>

    <h3>新手常見陷阱</h3>
    <div class="pitfall">
      <p><strong>看到投信大買就追高，結果買在最高點：</strong>如果投信已經連續買超了很長一段時間，且股價已經大漲，這時才追進去，很可能會剛好遇到投信準備「結帳」下車，慘遭套牢。最好的介入時機是投信「剛開始」由賣轉買，或是連續買超的前幾天。</p>
    </div>
    <div class="pitfall">
      <p><strong>忽略投信的「持股比例」上限：</strong>當投信整體對某一檔股票的持股比例過高（例如超過 15% 甚至 20%），通常意味著能再買的資金有限了，後續推升股價的力道會減弱，隨時可能反轉向下。這時應該提高警覺，而不是盲目追高。</p>
    </div>
`,
  pitfalls: [{"myth": "投信買越多越好，永遠都可以跟單", "fact": "當投信持股比例過高時，代表後續能再買的資金有限，一旦開始「結帳」賣出，股價跌勢會非常猛烈。"}, {"myth": "投信季底一定會拉抬所有持股", "fact": "如果績效不佳的股票，操盤手反而會在季底前毫不留情地殺出（結帳），以免拖累排名。"}],
  practice: {"route": "#/screener?p=inst", "label": "使用選股工具尋找投信買超股", "tip": "試著篩選出近期「投信連續買超」的股票，看看有沒有剛開始發動的中小型股。"},
  quiz: [{"q": "下列哪一種股票，通常是「投信」最偏好用來拉抬績效的標的？", "opts": ["股本龐大、股價波動極小的金融股", "有成長爆發力、股本適中的中小型電子股", "即將破產下市的全額交割股", "已經連跌十支停板的弱勢股"], "ans": 1, "exp": "因為大型權值股推不動，為了追求打敗大盤的績效，投信操盤手最喜歡發掘具備成長爆發力的中小型股。"}, {"q": "什麼是台股常聽到的「投信作帳行情」？", "opts": ["投信公司做假帳欺騙投資人", "投信為了季底或年底的績效排名，集中資金拉抬手中持股", "投信把虧損的股票賣給散戶", "外資與投信聯手打壓股價"], "ans": 1, "exp": "操盤手有績效排名壓力，因此常在每季季底或年底，拉抬自己持股比例較高的股票，讓基金的帳面績效更好看，這稱為「作帳行情」。"}, {"q": "關於投信的法規限制與操作實務，下列何者正確？", "opts": ["投信可以把基金 100% 的資金全部重壓買同一檔股票", "當投信對某檔股票的持股比例極高時，代表未來還會無限制大買", "單一基金持有單一股票金額，依法不得超過基金淨值的 10%", "投信完全不受法規限制，想買多少就買多少"], "ans": 2, "exp": "為了分散風險，法規規定一檔基金持有單一股票的金額，不得超過該基金淨資產價值的 10%。這也意味著當投信持股比例過高時，隨時可能面臨「結帳」賣壓。"}],

FIN.LESSONS.push({
  id: "chip-dealer",
  track: "chip",
  stage: "basic",
  order: 4,
  title: "自營商：別輕易跟單的短線客",
  icon: "⚡",
  minutes: 7,
  tldr: "自營商是券商拿自己的錢操作，風格極度短線。買賣超數據分為「自行買賣」與「避險」，避險部位不具備方向性參考價值。",
  plain: "自營商就像是賭場裡的高手，拿老闆的錢在裡面快進快出，今天買明天賣。他們手續費超低、動作超快，我們一般人很難跟得上他們的腳步，跟著買很容易變最後一隻老鼠。",
  keyPoints: ["自營商是證券商自有資金投資，操作風格極短線。", "買賣超數據包含「自行買賣」與發行權證的「避險部位」。", "避險買盤是被動產生，不代表看好，且通常隔天就會賣出。", "散戶沒有手續費與速度優勢，不建議盲目跟單自營商。"],
  html: `
    <h3>自營商：極短線的市場快閃族</h3>
    <p>在三大法人中，<strong><span class="glossary-term" data-term-id="dealers">自營商</span></strong>的角色最為特別。他們是國內證券商內部的投資部門，拿著券商老闆的「自有資金」在股市裡殺進殺出。因為用的是公司的錢，自營商的操盤手承受著極大的「絕對報酬」壓力（也就是無論大盤好壞，都必須想辦法賺錢），這造就了他們極度短線、追求高周轉率的操作風格。</p>
    <p>如果說外資看的是「長線趨勢」，投信看的是「中線成長」，那麼自營商看的就是「極短線的利多利空」。自營商非常擅長利用市場的消息面、技術面破切、甚至是籌碼的短線失衡來進行套利。他們常常是「今天大買、明天就大賣」（俗稱隔日沖），或者是賺個 1%~2% 就跑，跑得比誰都快。由於他們進出頻繁且不按牌理出牌，許多老手會說自營商是市場裡的「快閃族」。</p>

    <div class="widget" data-widget="inst-flow" data-focus="dealer"></div>

    <h3>避險部位 vs. 自行買賣</h3>
    <p>在每天盤後公布的自營商買賣超數據中，其實包含了兩個完全不同的部分。現在各大看盤軟體與證交所網站都會將這兩個部分分開列示，新手一定要懂得區分，否則很容易做出錯誤的判斷：</p>
    <ol>
      <li><strong>自行買賣：</strong>這是自營商操盤手真正根據市場判斷，主動去買賣股票的部位。雖然操作週期也是偏向短線，但這部分多少代表了證券商專業團隊對該檔股票短線走勢的看法。如果自行買賣出現連續買超，還是有一定的參考價值。</li>
      <li><strong>避險部位：</strong>這是自營商為了發行「權證」（一種衍生性金融商品）而被迫進行的買賣。當散戶大量買進某一檔股票的「認購權證」（看漲）時，發行權證的自營商為了規避散戶看對方向的風險，必須在現貨市場買進相對應數量的股票來「避險」。反之，當散戶賣出權證時，自營商就會把避險的股票賣掉。</li>
    </ol>
    <p><strong>特別注意：避險部位的買賣，完全是跟著散戶買賣權證的動作而「被動」發生的，完全不代表自營商看好或看壞這檔股票！</strong></p>

    <h3>為什麼不建議散戶跟單自營商？</h3>
    <p>很多新手看到盤後數據「自營商大買 XXX」，隔天就興沖沖地跟著買進，結果往往被套牢在最高點。為什麼呢？</p>
    <p>首先，如果那筆買超是「避險部位」，那只代表昨天有很多散戶去買了那檔股票的權證。而權證是一種極短線的高槓桿商品，那些買權證的散戶通常隔天就會獲利了結（賣出權證）。一旦散戶賣出權證，自營商就會跟著在現貨市場把昨天買來避險的股票倒出來，造成巨大的倒貨賣壓與股價下跌。</p>
    <p>其次，就算是「自行買賣」，自營商的手腳極快，他們昨天買的，今天開盤可能就已經賣光了。等你看到昨天的盤後數據，今天才要進場時，剛好成為自營商倒貨的對象（俗稱被「割韭菜」）。自營商的操作策略往往基於量化模型及極短線技術分析，加上交易成本優勢，使得散戶在反應速度和成本上皆處於劣勢，盲目跟風風險極高。</p>

    <div class="case">
      <p><strong>台股實例（自營商避險買盤的陷阱）</strong>：<br>
      假設 2454 聯發科（示意數字）今天傳出接到急單的好消息，股價大漲。許多散戶立刻去買進聯發科的認購權證。<br>
      為了避險，發行權證的自營商今天被迫在現貨市場大買聯發科 2,000 張。盤後數據公布，散戶看到「自營商大買 2000 張」，以為法人強烈看好，決定隔天一早進場跟單。<br>
      結果隔天開盤，昨天買權證的散戶立刻獲利了結賣出權證；自營商為了解除避險，也立刻在現貨市場倒出 2,000 張股票。於是聯發科股價開高走低，今天才跟單進場的散戶全部套牢。</p>
    </div>

    <h3>新手常見陷阱</h3>
    <div class="pitfall">
      <p><strong>把「避險買超」當成看好訊號：</strong>自營商的避險買超是被動的，通常隔天就會轉為賣壓。在查看數據時，務必將「自行買賣」與「避險部位」分開來看，不要混為一談。</p>
    </div>
    <div class="pitfall">
      <p><strong>企圖跟著自營商做短線：</strong>自營商享有極低的手續費與交易稅優勢，且擁有最快、最穩定的看盤與下單系統。散戶跟他們拚短線速度，就像騎腳踏車跟高鐵賽跑，勝算極低。</p>
    </div>
    <h3>深入探討：如何正確看待自營商動向</h3>
    <p>雖然我們不建議散戶跟單自營商，但自營商的買賣超數據依然有其觀察價值。投資人可以將其視為短線籌碼的「壓力或支撐」測試。舉例來說，當自營商避險部位大舉倒貨，而股價卻依然能逆勢抗跌時，這往往意味著下檔有更強大的主力或長線法人正在吸收籌碼；反之，若自營商自行買賣連續多日站在買方，且買盤力道強勁，則可能暗示短線具有技術面反彈的契機，但介入仍應謹慎，設立嚴格的停損點。</p>

    <p>實務觀察上，投資人在每日下午三點半證交所公布三大法人買賣超明細時，務必養成同時比對「自營商（自行買賣）」與「自營商（避險）」兩個欄位的好習慣。若某檔個股當日自營商買超張數高達數千張，但其中九成以上皆來自避險部位，代表市場上有大量權證大戶正在短線搶進認購權證，隔日早盤往往會伴隨權證隔日沖大戶的獲利了結賣壓，進而引發自營商同步調節現貨避險部位。唯有當「自行買賣」連續多日站在買方、且與投信或外資方向一致時，才具備波段籌碼共振的參考意義。</p>
  `,
  pitfalls: [{"myth": "自營商大買，隔天跟著買就對了", "fact": "自營商動作極快，昨天買的今天可能開盤就賣了；若是避險買盤，隔天賣出的機率更高。"}, {"myth": "自營商避險買進代表他們非常看好", "fact": "避險買盤是因為散戶買了權證才被迫買進股票的，完全是被動產生，不代表券商主動看好該股票。"}],
  practice: {"route": "#/stock/2454?tab=inst", "label": "查看聯發科的自營商買賣明細", "tip": "觀察自營商的買賣超數據，試著區分有多少是「自行買賣」，多少是「避險」。"},
  quiz: [{"q": "下列關於「自營商」的敘述，何者最正確？", "opts": ["是外國退休基金的代稱", "拿一般投資人買基金的錢來投資", "是證券商拿自有資金進行投資的部門", "操作風格以長期投資（存股）為主"], "ans": 2, "exp": "自營商是國內證券商內部的投資部門，拿公司的自有資金進行投資，背負絕對報酬的壓力，操作風格極度短線。"}, {"q": "自營商的買賣超數據中，包含了「自行買賣」與「避險部位」。請問「避險部位」的產生原因主要是什麼？", "opts": ["為了防止股市崩盤而大量放空", "為了發行「權證」商品，因應散戶買賣權證而被迫進行的相對應避險動作", "為了領取上市公司的現金股利", "為了配合外資與投信的操作"], "ans": 1, "exp": "當散戶買進認購權證時，發行該權證的自營商為了規避風險，必須在現貨市場買進對應的股票來「避險」。這是被動發生的，不代表自營商主動看好該股票。"}, {"q": "如果某檔股票今天出現大量的「自營商避險買超」，隔天通常容易發生什麼情況？", "opts": ["外資一定會跟著大買", "股價保證會連續漲停板", "當散戶獲利了結權證時，自營商會在現貨市場將避險股票賣出，造成賣壓", "公司馬上會發布重大利多消息"], "ans": 2, "exp": "權證是短線商品，散戶隔天賣出權證時，自營商就會同步在現貨市場倒出昨天買來避險的股票，形成短線賣壓。"}],
  sources: [{"title": "台股主力獵手 — 自營商買超代表什麼？", "url": "https://twstock.app/learn/what-is-dealer-buying"}, {"title": "三大法人買賣金額統計表 - 臺灣證券交易所", "url": "https://www.twse.com.tw/zh/trading/foreign/bfi82u.html"}],

FIN.LESSONS.push({
  id: "chip-margin",
  track: "chip",
  stage: "advanced",
  order: 5,
  title: "信用交易：融資與融券",
  icon: "💳",
  minutes: 8,
  tldr: "融資是向券商借錢買股，融券是借股票來賣。要注意 130% 整戶擔保維持率，以免被斷頭。",
  plain: "「信用交易」就像是用信用卡預借現金來買股票。融資是借錢買進，融券是借股票來賣出。槓桿能讓你用小錢做大生意，但也可能讓你連本帶利全賠光。",
  keyPoints: ["融資成數最高 6 成，投資人需準備 4 成自備款。", "融券保證金成數為 9 成，預期下跌時可借股票來賣。", "融資與融券期限皆為 6 個月，可展延 2 次，最長 18 個月。", "整戶擔保維持率低於 130% 時券商會發出追繳令。", "收到追繳令需在 2 個營業日內補繳，否則會被強制平倉（斷頭）。"],
  html: `
    <h3>什麼是信用交易？</h3>
    <p>「信用交易」就像是使用信用卡的預借現金，或者是跟銀行貸款買房子。在股市中，投資人如果覺得自己手邊的資金不夠，但又非常看好（或看壞）某檔股票，可以透過券商提供的信用額度，向證券商「借錢買股票」或「借股票來賣」。這種交易模式可以放大投資本金的槓桿，雖然能成倍放大獲利，但虧損的風險也會隨之倍增，是屬於進階的投資技巧。</p>
    <p>在台股市場，最常見的信用交易分為兩種：<strong><span class="glossary-term" data-term-id="margin-buying">融資</span></strong>與<strong><span class="glossary-term" data-term-id="short-selling">融券</span></strong>。只有上市櫃且符合一定條件的股票，才能進行融資融券交易（通常稱為「可信用交易」的股票）。並不是所有的股票都可以融資融券。</p>

    <h3>融資：借錢買股票，放大獲利與虧損</h3>
    <p><strong>融資 (Margin Buying)</strong> 是指投資人預期未來股價會上漲，但手頭資金不足，因此向券商借錢來買股票。在台股，上市櫃股票的融資成數最高通常為 <strong>6 成（60%）</strong>，也就是說，投資人只需準備 <strong>4 成（40%）</strong> 的自備款。剩下的 6 成由券商借給你，當然，你必須為借來的錢支付利息給券商。</p>
    <p>融資的期限通常為 6 個月，如果到期前尚未賣出，可以向券商申請展延 2 次（每次 6 個月），所以一筆融資最長可以持有 18 個月。如果 18 個月到了還是沒賣出，券商就會強制幫你賣掉。</p>
    
    <div class="case">
      <p><strong>台股實例（融資買進與槓桿效應）</strong>：<br>
      假設阿財看好一檔股價 100 元的股票（示意數字），想買進 10 張，總價需要 100 萬元。<br>
      如果用現股（全額）買進，阿財需要準備 100 萬元。<br>
      如果用<strong>融資</strong>買進：<br>
      - 阿財只需準備自備款 4 成：100 萬 × 40% = <strong>40 萬元</strong>。<br>
      - 剩下的 6 成由券商借給他：100 萬 × 60% = <strong>60 萬元</strong>。<br>
      阿財只用了 40 萬就操作了價值 100 萬的股票，這就是 2.5 倍的槓桿。如果股價上漲 10% 變成 110 萬，阿財賺了 10 萬，相對於他的本金 40 萬，報酬率高達 25%！但如果股價下跌 10%，他的本金也會瞬間縮水 25%。這就是水能載舟，亦能覆舟的道理。</p>
    </div>

    <h3>融券：借股票來賣，看壞後市的做法</h3>
    <p><strong>融券 (Short Selling)</strong> 則是相反。當投資人預期未來股價會下跌，但自己手中並沒有這檔股票，可以先向券商「借股票來賣出」（在高點賣出換成現金），等到股價真的跌下去了，再從市場上「買回股票還給券商」，賺取中間的價差。</p>
    <p>為了防止投資人跑路或還不出股票，融券必須繳交一筆保證金。根據 2025 年的最新規定，目前台股的融券保證金成數為 <strong>9 成（90%）</strong>。也就是說，如果你要放空價值 100 萬的股票，你必須先放 90 萬在券商那邊當作押金。融券的期限同樣是 6 個月，可展延 2 次，最長 18 個月。</p>
    <p>※ <strong>平盤下放空規則</strong>：通常情況下，投資人可以在平盤（昨天的收盤價）以下融券賣出股票。但是，如果該檔股票前一個營業日的收盤價是「跌停板」，為了避免加重跌勢，隔天就不允許在平盤以下進行融券賣出了。這點在操作弱勢股時必須特別注意。</p>

    <div class="widget" data-widget="margin-chart"></div>

    <h3>擔保維持率與可怕的「斷頭」危機</h3>
    <p>既然是借錢或借券，券商為了保護自己的債權（怕你賠光還不出錢），會每天計算你的帳戶是否安全，這個安全指標就叫做<strong>「整戶擔保維持率」</strong>。目前台股規定，維持率必須保持在 <strong>130%</strong> 以上，否則就會面臨被強制賣出股票的命運。</p>
    <ul>
      <li><strong>融資維持率公式</strong>：(股票現值 ÷ 融資借款金額) × 100%</li>
      <li><strong>融券維持率公式</strong>：[(融券賣出價款 + 融券保證金) ÷ 股票現值] × 100%</li>
    </ul>
    <p>以融資為例，當你買的股票股價不斷下跌，導致「股票現值」縮水，維持率就會跟著下降。當整戶擔保維持率跌破 130% 時，券商就會發出<strong><span class="glossary-term" data-term-id="margin-call">追繳令</span> (Margin Call)</strong>，要求你在期限內補錢進去，把維持率拉回安全水位。如果遲遲不補，事情就會變得很嚴重。</p>
    <p>收到追繳令後，投資人必須在發出通知後的 <strong>2 個營業日</strong>內補足差額。如果到了第 3 個營業日的開盤前你還是沒補錢，券商為了自保，就會在第 3 天開盤時，不計代價地用市價把你的股票全部強制賣出（或強制買回），這在股市中俗稱為<strong>「斷頭」</strong>。一旦被斷頭，不僅股票沒了，如果賣出後的錢還不夠還給券商，你還必須拿自己的錢出來倒貼，這就是信用交易最可怕的地方。</p>
    <p>因此，如果你決定要使用信用交易，一定要嚴格控管風險，並且隨時留意自己帳戶的維持率狀況，絕對不能存有僥倖心理。</p>

    <div class="widget" data-widget="margin-calc"></div>

    <h3>新手常見陷阱</h3>
    <div class="pitfall">
      <p><strong>只看槓桿獲利，忽略虧損也會放大：</strong>許多新手以為融資可以「用小錢賺大錢」，卻忽略了當股價下跌時，虧損也是 2.5 倍放大的。如果跌幅夠深，甚至可能把本金全部賠光，還倒欠券商一屁股債。</p>
    </div>
    <div class="pitfall">
      <p><strong>沒注意維持率與追繳時限：</strong>有些投資人收到追繳令後心存僥倖，以為股價明天就會反彈，結果遲遲不補錢。一旦時間到了（2 個營業日）被券商強制「斷頭」平倉，就算隔天股價真的大漲，也已經跟你無關了，損失已經立刻實現。</p>
    </div>
`,
  pitfalls: [{"myth": "融資可以用小錢賺大錢，穩賺不賠", "fact": "槓桿是雙面刃，獲利放大 2.5 倍的同時，虧損也是放大 2.5 倍，如果遇到連續大跌可能會把本金賠光。"}, {"myth": "收到追繳令不管它也沒關係", "fact": "收到追繳令必須在 2 個營業日內補足保證金，否則第 3 個營業日開盤就會被券商無情地強制賣出股票（斷頭）。"}],
  practice: {"route": "#/stock/2603", "label": "前往長榮查看融資融券餘額", "tip": "觀察長榮的融資餘額與融券餘額變化，並試著計算如果現在用融資買進，維持率是多少。"},
  quiz: [{"q": "小明想用「融資」買進總價 100 萬元的上市股票（融資成數 6 成），請問他自己最少需要準備多少自備款？", "opts": ["40 萬元", "60 萬元", "10 萬元", "100 萬元"], "ans": 0, "exp": "台股融資成數最高為 6 成（借款 60%），因此投資人只需準備剩下的 4 成（40%）自備款。100 萬 × 40% = 40 萬元。"}, {"q": "在台股，當投資人的「整戶擔保維持率」低於多少時，券商就會發出追繳通知？", "opts": ["130%", "120%", "140%", "166%"], "ans": 0, "exp": "目前的規定是，當整戶擔保維持率低於 130% 時，券商為了保護自己的債權，就會發出追繳通知（追繳令）。"}, {"q": "投資人收到券商的追繳通知後，必須在幾個營業日內補足差額，以免被強制平倉（俗稱斷頭）？", "opts": ["2 個營業日", "1 個營業日", "3 個營業日", "5 個營業日"], "ans": 0, "exp": "法規規定，投資人必須在發出追繳通知後的 2 個營業日內補足保證金，否則第 3 個營業日開盤就會被券商強制平倉（斷頭）。"}, {"q": "關於台股融資融券的期限，下列敘述何者正確？", "opts": ["期限 6 個月，可展延 2 次，最長 18 個月", "期限 3 個月，可展延 1 次，最長 6 個月", "期限 1 年，不可展延", "沒有期限限制，只要一直付利息就可以無限期放著"], "ans": 0, "exp": "融資與融券的期限通常為 6 個月，到期前如果條件符合，可向券商申請展延，最多展延 2 次（每次 6 個月），合計最長期限為 18 個月。"}],
  sources: [{"title": "信用交易基本認識 - 臺灣證券交易所", "url": "https://www.twse.com.tw/zh/products/trading/margin/knowledge.html"}, {"title": "修正「證券商辦理有價證券買賣融資融券業務操作辦法」 - 金管會證期局", "url": "https://www.sfb.gov.tw/ch/home.jsp?id=95&parentpath=0,4&mcustomize=lawnew_view.jsp&dataserno=202505260001"}],

FIN.LESSONS.push({
  id: "chip-short-squeeze",
  track: "chip",
  stage: "advanced",
  order: 6,
  title: "券資比與軋空：空軍的噩夢",
  icon: "🚀",
  minutes: 7,
  tldr: "當融券餘額過高（券資比高），若股價不跌反漲或遇到強制回補日，空單被迫買回會推升股價，形成「軋空」。",
  plain: "當很多人借股票來賣（看跌），但股價卻一直漲，這些人會因為害怕賠光或規定時間到了，被迫用很貴的價格把股票買回來。大家搶著買，股價就一飛沖天，這就叫軋空。",
  keyPoints: ["券資比 = (融券餘額 ÷ 融資餘額) × 100%。", "券資比高代表市場上放空的力量大，但也是潛在的軋空燃料。", "當股價上漲導致空單維持率不足被斷頭，被迫買回的買盤會推升股價。", "每年「股東會前」與「除權息前」，融券必須強制回補，是軋空的好發期。"],
  html: `
    <h3>什麼是券資比？</h3>
    <p>在前一堂課我們學過，融資是看好後市「借錢買股」，融券則是看壞後市「借股票來賣」。那麼，當我們把這兩個數據放在一起比較時，就可以得出一個非常重要的籌碼指標：<strong><span class="glossary-term" data-term-id="margin-short-ratio">券資比</span></strong>。</p>
    <p><strong>券資比 = (融券餘額 ÷ 融資餘額) × 100%</strong></p>
    <p>券資比代表著「在這檔股票的信用交易中，放空的力量相對於做多的力量有多大」。一般來說，當券資比低於 20% 時，屬於正常水準；但如果券資比一路攀升，突破 30% 甚至 50%，就代表市場上有非常多的人不看好這檔股票，正在大量放空。</p>

    <h3>軋空行情：空軍的噩夢</h3>
    <p>當一檔股票的券資比很高，照理說應該會大跌，但如果這家公司突然發布了重大利多（例如接到大單、財報大幅優於預期），或者市場主力刻意進場點火拉抬，股價反而不跌反漲，這時候好戲就上場了。</p>
    <p>前面提過，融券放空是有「維持率」壓力的。當股價大漲，融券放空的人帳面開始虧損，一旦整戶擔保維持率跌破 130%，券商就會發出追繳令。如果放空的人補不出錢來，券商就會在市場上「強制買回」股票來平倉。這些被迫買回的「買盤」，會進一步推升股價，導致更高位置的融券也被追繳、被迫買回，形成股價越漲越買、越買越漲的惡性循環。這種因為空單被迫停損買回而推升股價的現象，就稱為<strong>「軋空」</strong>。</p>

    <div class="widget" data-widget="margin-chart" data-scenario="squeeze"></div>

    <h3>融券強制回補日：每年兩次的「必軋」時機</h3>
    <p>在台股，融券還有一個致命的弱點：<strong>強制回補</strong>。無論你的維持率有多高，每檔股票一年至少有兩次，所有融券都必須在規定的最後期限前「強制買回」：</p>
    <ol>
      <li><strong>股東常會前：</strong>為了確認誰有資格參加股東會，公司會停止股票過戶，融券必須在停止過戶日的前 6 個營業日強制回補。</li>
      <li><strong>除權息前：</strong>為了確認誰有資格領取股利，融券也必須在停止過戶日的前 6 個營業日強制回補。</li>
    </ol>
    <p>如果一檔股票券資比很高，且「融券最後回補日」即將到來，主力往往會趁機大舉拉抬股價，逼迫那些時間一到就必須無條件買回的空單「買在最高點」，這就是台股每年都會上演的「股東會軋空」與「除權息軋空」大戲。</p>

    <div class="case">
      <p><strong>台股實例（強制回補引發的軋空）</strong>：<br>
      假設 2603 長榮（示意數字）因為產業景氣出現雜音，許多散戶進場融券放空，導致券資比高達 40%。<br>
      然而，長榮即將在一個月後召開股東會，公布了高額的配息計畫，股價不跌反漲。隨著「融券最後回補日」一天天逼近，市場主力刻意進場點火拉抬股價。<br>
      那些放空的散戶眼看期限將至，不論股價多高都必須含淚買回股票還給券商。這些急需買回的買盤，在最後回補日前一週，將長榮的股價推向了歷史新高。這就是標準的強制回補軋空行情。</p>
    </div>

    <h3>新手常見陷阱</h3>
    <div class="pitfall">
      <p><strong>以為券資比高就一定會軋空：</strong>軋空的前提是「股價要能漲上去」逼空單停損。如果基本面真的很差，股價一路往下跌，那高券資比只代表空軍大獲全勝，並不會發生軋空。</p>
    </div>
    <div class="pitfall">
      <p><strong>在強制回補日前幾天才想跟單買進：</strong>軋空行情通常在最後回補日的前兩到三週最為猛烈；等到最後回補日當天，空單早就買回完畢，主力反而會趁機逢高出貨，這時才追買很容易買在最高點。</p>
    </div>
    <h3>深入探討：軋空行情的操作與風險</h3>
    <p>參與軋空行情的投資人必須具備高度的風險意識。軋空行情雖然爆發力驚人，但往往來得快、去得也快。一旦空單被迫買回的動能耗盡（例如最後回補日已經度過，或是空軍已經全數斷頭出場），股價便容易失去推升力道，甚至出現「軋空完畢後的崩跌」。因此，在操作這類股票時，務必嚴格設定停利與停損點，不要因為短線利潤豐厚而失去戒心。觀察券資比時，也要留意是否有「假外資」或「特定主力」刻意利用高券資比誘多，一旦行情不如預期，應果斷離場。</p>

    <p>此外，台股每年有兩次強制「融券回補」的高峰期：第一次是每年三月至四月的「股東常會融券最後回補日」，第二次則是年中至第三季的「除權息融券最後回補日」。根據台灣證券交易所與櫃買中心的規定，為了確定股東名冊，所有融券放空的投資人都必須在最後回補日前強制買回股票還券。若一檔股票在強制回補日前夕，券資比依然維持在 40% 以上的高檔，且股價維持在所有均線之上，空單往往會因為時間壓力而被迫不計價買回，形成每年春季與除權息旺季特有的「強制回補軋空行情」。</p>
  `,
  pitfalls: [{"myth": "券資比很高就一定會發生軋空行情", "fact": "軋空的前提是「股價要漲得上去」。如果公司基本面很爛股價一直跌，高券資比只代表空軍賺翻了，根本不會軋空。"}, {"myth": "強制回補日當天買進等著賺軋空", "fact": "軋空行情通常在最後回補日的前幾週就發動並結束了，到了最後一天空單早就回補完畢，主力反而會趁機出貨。"}],
  practice: {"route": "#/screener", "label": "篩選高券資比的潛在軋空股", "tip": "試著用選股條件找出「券資比大於 30%」且近期股價轉強的股票。"},
  quiz: [{"q": "什麼是「券資比」？", "opts": ["外資買超與投信買超的比例", "融券餘額除以融資餘額的百分比", "自營商避險部位的總和", "公司發放現金股利的殖利率"], "ans": 1, "exp": "券資比的公式是 (融券餘額 ÷ 融資餘額) × 100%，用來衡量該檔股票信用交易中，放空力道相對於做多力道的大小。"}, {"q": "在台股，融券遇到下列哪兩種情況時，必須在規定期限前「強制回補」（強制買回）？", "opts": ["公司發布法說會、以及發布月營收前", "股價連續三根跌停板、以及外資大賣時", "每年召開股東常會前、以及除權息前", "董事長出國、以及農曆過年前"], "ans": 2, "exp": "為了確認誰有資格參加股東會與領取股利，公司會停止過戶。因此在股東會與除權息的停止過戶日前 6 個營業日，融券必須強制回補。"}, {"q": "當一檔股票券資比很高，且發布重大利多股價大漲時，最容易引發什麼行情？", "opts": ["殺融資的斷頭行情", "投信作帳行情", "空單被迫停損買回而推升股價的「軋空行情」", "外資連續賣超的結帳行情"], "ans": 2, "exp": "股價大漲會導致融券空單帳面虧損、維持率不足。當空單被追繳而被迫買回平倉時，這些買盤會進一步推升股價，形成越漲越買的「軋空行情」。"}],
  sources: [{"title": "什麼是券資比？軋空行情怎麼看？", "url": "https://www.cmoney.tw/learn/course/michelle/topic/729"}, {"title": "融資融券業務操作辦法（強制回補規定）", "url": "https://twse-regulation.twse.com.tw/TW/law/DOC01_print.aspx?FLCODE=FL007121&FLNO=55"}],
});

FIN.LESSONS.push({
  id: "chip-sbl",
  track: "chip",
  stage: "advanced",
  order: 7,
  title: "借券賣出：外資的專屬空軍",
  icon: "🪂",
  minutes: 8,
  tldr: "借券主要是法人在用的工具。要判斷法人是否放空打壓股價，必須看「借券賣出餘額」是否大增。",
  plain: "融券是散戶用來放空的工具，而借券則是外資等大戶的專屬空軍。當你發現外資不只把股票賣掉，還跑去借別人的股票來賣，那代表他們真的非常看壞這家公司。",
  keyPoints: ["借券主要參與對象為法人機構（外資、投信等）。", "借券不等於放空，必須看「借券賣出餘額」才是真正賣到市場上的空單。", "法規限制每日借券賣出委託量不得超過 30 日均量的 30%。", "借券沒有參與股東會或除權息的強制回補壓力，不會發生典型的除權息軋空。"],
  html: `
    <h3>借券與融券有什麼不同？</h3>
    <p>前面我們介紹了「融券」，那是提供給一般散戶在看壞後市時，向券商借股票來賣的工具。但在台股市場中，還有一種機構法人（如外資、投信）專用的放空工具，叫做<strong><span class="glossary-term" data-term-id="securities-borrowing-and-lending">借券</span> (Securities Borrowing and Lending, SBL)</strong>。</p>
    <p>雖然都是借股票，但它們有幾個很大的差異：</p>
    <ol>
      <li><strong>參與對象：</strong>融券主要是一般投資人（散戶）；借券則是法人（外資、投信、自營商、大股東）為大宗。</li>
      <li><strong>借券用途：</strong>融券借來就是為了賣出放空；但法人的借券除了可以用來「借券賣出」在市場上放空之外，還可以拿來做為權證避險、ETF 實物申購、或是借給別人賺利息。因此，單看「借券餘額」增加，不代表法人看空，我們必須看<strong>「借券賣出餘額」</strong>，這才是真正被賣到市場上放空的籌碼。</li>
      <li><strong>強制回補：</strong>融券遇到股東會或除權息時，必須在最後期限前強制買回；但借券的規定較為彈性，法人可以透過給付權益補償（例如直接把股利付給借出股票的人），而不需要強制買回。因此，借券賣出的空單，是沒有「強制回補軋空」壓力的。</li>
    </ol>

    <h3>平盤以下放空的限制與現況</h3>
    <p>在台股，為了防止惡意做空導致股市崩盤，主管機關對於融券與借券賣出，都有所謂的「平盤以下放空限制」。</p>
    <p>過去曾有規定平盤以下全面禁止放空，但後來逐步放寬。根據目前的規定：<strong>通常情況下，投資人可以在平盤（昨收價）以下進行融券賣出或借券賣出。</strong></p>
    <p><strong>唯一的例外是：</strong>如果該檔股票前一個營業日的收盤價是「跌停板」，隔天就不允許在平盤（昨收價）以下進行融券與借券賣出。這項機制是為了避免弱勢股遭到空頭無情追殺而引發系統性風險。</p>

    <h3>借券賣出委託與餘額限制</h3>
    <p>主管機關金管會證期局，對於法人的「借券賣出」數量也設有總量管制的紅線，以維持市場穩定（以下為 2025 年最新規定，過去的暫時性限縮措施已於 2025 年 5 月 26 日廢止，恢復常態標準）：</p>
    <ul>
      <li><strong>每日委託量限制：</strong>每日盤中借券賣出委託數量，不得超過該種有價證券前 30 個營業日日平均成交數量的 <strong>30%</strong>。</li>
      <li><strong>餘額限制：</strong>借券賣出餘額不得超過該種有價證券上市（櫃）股份總額的 <strong>10%</strong>；且與融券餘額合併計算，不得超過 <strong>25%</strong>。</li>
    </ul>

    <div class="widget" data-widget="margin-chart"></div>

    <div class="case">
      <p><strong>台股實例（外資借券賣出打壓股價）</strong>：<br>
      假設 2330 台積電（示意數字）近期面臨半導體庫存調整的利空。外資不僅在現貨市場連續賣超，盤後籌碼數據更顯示，台積電的「借券賣出餘額」從 2 萬張一路攀升到 5 萬張。<br>
      這代表外資不僅把手上的持股賣掉，還特地去借了 3 萬張股票來市場上放空。這種「現貨賣超 ＋ 借券賣出餘額大增」的雙重賣壓，是籌碼面非常強烈的看空訊號，通常會導致股價陷入較長時間的弱勢盤整或下跌。</p>
    </div>

    <h3>新手常見陷阱</h3>
    <div class="pitfall">
      <p><strong>搞混「借券餘額」與「借券賣出餘額」：</strong>很多新手看到新聞說「某某股票借券餘額大增」，就嚇得趕快賣股。其實只要這些借來的股票沒有被「賣出」，就不會對股價造成實質壓力。真正要看的是「借券賣出餘額」。</p>
    </div>
    <div class="pitfall">
      <p><strong>期待借券空單會被強制回補軋空：</strong>法人的借券是不需要參與股東會或除權息強制回補的。所以如果一檔股票的空單主要是「借券賣出」（外資空單），不要傻傻地期待除權息前會上演軋空行情。</p>
    </div>
`,
  pitfalls: [{"myth": "看到新聞說「借券餘額大增」就趕快賣掉股票", "fact": "借出來的股票不一定會賣到市場上，可能是為了還券或做實物申購。真正對股價有壓力的是「借券賣出餘額」。"}, {"myth": "借券賣出跟融券一樣，除權息前都會被強制回補軋空", "fact": "借券可以透過權益補償機制處理股利，不需要在除權息或股東會前強制買回，因此不會有這類型的強制軋空。"}],
  practice: {"route": "#/stock/2330?tab=inst", "label": "查看台積電的借券賣出餘額", "tip": "觀察台積電近期的「借券賣出餘額」變化，當這個數值增加時，股價通常表現如何？"},
  quiz: [{"q": "關於「融券」與「借券」的差異，下列何者正確？", "opts": ["兩者都是只有散戶才能使用的工具", "借券遇到股東會前必須強制回補，融券則不用", "融券主要是一般投資人放空用；借券主要是法人機構在使用", "兩者的每日委託賣出量完全沒有任何限制"], "ans": 2, "exp": "融券是提供給一般投資人的信用交易工具；而借券（SBL）的參與門檻較高，主要參與者為外資、投信等法人機構。"}, {"q": "投資人想判斷外資是否利用借券制度在市場上放空打壓股價，應該觀察下列哪一個指標？", "opts": ["借券餘額", "借券賣出餘額", "融券餘額", "當沖比"], "ans": 1, "exp": "借券餘額只代表借出來的總量，可能用於其他用途。必須要看「借券賣出餘額」，這才是真正被賣到市場上產生賣壓的籌碼。"}, {"q": "根據台股最新的平盤以下放空規定，通常情況下，什麼時候「不允許」在平盤（昨收價）以下進行借券賣出？", "opts": ["大盤指數下跌超過 100 點時", "該檔股票前一個營業日收盤價為「跌停板」時", "外資連續賣超三天時", "任何時候都不允許在平盤下放空"], "ans": 1, "exp": "通常情況下允許平盤下放空，但為了避免弱勢股遭惡意追殺，若該股票前一個營業日收盤為跌停板，隔天即禁止平盤下融券與借券賣出。"}],
  sources: [{"title": "借券賣出餘額 - 臺灣證券交易所", "url": "https://www.twse.com.tw/zh/trading/margin/twt93u.html"}, {"title": "金管會廢止暫時性借券賣出限縮措施", "url": "https://www.sfb.gov.tw/ch/home.jsp?id=88&parentpath=0&mcustomize=lawnews_view.jsp&dataserno=202505260003"}],

FIN.LESSONS.push({
  id: "chip-broker",

  title: "主力分點：跟著地緣券商抓飆股",
  icon: "📍",
  minutes: 7,
  tldr: "台股每天會公布所有證券分點的買賣明細。透過追蹤地緣券商或特定大戶分點，能提早發現內部人吃貨的跡象。",
  plain: "台灣股市超級透明，盤後連「哪一家證券公司的哪家分行」買了幾張股票都查得到。如果某家公司附近的分行突然拼命買自家的股票，很可能就是老闆或員工知道有好消息了！",
  keyPoints: ["台股每天盤後會公布各家「券商分點」對每一檔股票的買賣張數。", "地緣券商（位於公司總部或工廠附近的分點）的異常買盤，常暗示內部人提前佈局。", "特定知名分點（如某些「隔日沖」大戶）會造成股價隔天開高走低。", "勿過度迷信單一分點，主力可能會在 A 分點買、轉到 B 分點賣以隱藏蹤跡。"],
  html: `
    <h3>什麼是券商分點（主力分點）？</h3>
    <p>我們在前面學過三大法人的買賣超，那是針對「機構種類」的統計。但台股還有一個非常獨特且透明的數據，叫做<strong>「券商分點進出明細」</strong>。這就像是把整個市場放在顯微鏡下觀察，你可以清楚看到，今天是「哪一家證券公司的哪一個營業據點」在買賣這檔股票。</p>
    <p>例如：你可能在盤後數據中看到「凱基-台北」、「元大-館前」、「富邦-建國」這些名稱，這就是券商分點。台灣證交所與櫃買中心每天盤後都會公布每一檔股票，在全台灣所有券商分點的買進與賣出張數。這個制度在全世界的股市中是非常少見的，也造就了台股獨特的「主力籌碼學」。</p>

    <div class="widget" data-widget="broker-table"></div>

    <h3>為什麼要追蹤券商分點？</h3>
    <p>有些資金龐大的市場主力（中實戶、大老闆、甚至公司派內部人），他們並不是外資或投信，所以他們的買賣不會顯示在三大法人的數據中。但只要他們下單，就一定會透過某個券商分點，凡走過必留下痕跡。</p>
    <p>透過追蹤券商分點，我們可以發現幾個有趣的主力行為模式：</p>

      <li><strong>特定主力分點：</strong>市場上有些知名的大戶，習慣固定在特定的幾個分點下單。當你發現這些常勝軍分點開始偷偷吃貨某檔股票時，跟著他們的腳步，勝率往往不低。</li>
      <li><strong>隔日沖大軍：</strong>有些特定的券商分點（例如最著名的「凱基-台北」、「富邦-建國」等，這只是舉例），他們的操作手法非常犀利。他們會專門鎖定盤中即將漲停的強勢股，用龐大的資金將股價鎖死在漲停板，吸引散戶目光。然後在隔天開盤時，趁著散戶追高買進，毫不留情地把昨天買的股票全部倒出來獲利了結。這就是台股赫赫有名的「隔日沖」。</li>
    </ol>

    <div class="case">
      <p><strong>台股實例（地緣券商提前佈局）</strong>：<br>
      假設某家上市生技公司（總部在台北市南港區），平時成交量只有幾百張，股價不溫不火（示意情境）。<br>

      兩週後，該公司突然宣布新藥解盲成功，股價連續拉出三根漲停板。這時你就會明白，那些地緣券商的買盤，很可能就是提前掌握消息的內部人或大戶。</p>
    </div>

    <h3>新手常見陷阱</h3>
    <div class="pitfall">

    </div>
    <div class="pitfall">
      <p><strong>過度迷信單一分點，忽略主力可以「多個帳戶」操作：</strong>現在的主力非常聰明，他們知道散戶都在盯著分點看。所以他們可能會在 A 分點買進，然後把股票匯撥到 B 分點賣出，故意製造籌碼的假象。因此，分點數據只能作為輔助參考，還是要搭配基本面與技術面綜合判斷。</p>

    <p>在進一步追蹤主力分點時，進階投資人還會特別留意兩種類型的特殊分點：第一種是「地緣券商分點」，也就是距離上市櫃公司總部或工廠所在地非常近的券商分點，若在公司尚未發布重大利多前，該地緣分點突然出現異常且連續的低檔買超，往往值得高度關注；第二種則是「隔日沖主力分點」（例如市場熟知的虎尾、嘉義、部分大型券商總公司分點等），這類分點習慣在個股強勢漲停鎖死時大舉敲進數千張，並在隔天開高時全數倒出，認識這些分點的慣性有助於避開隔日早盤的追高風險。</p>
  `,

  practice: {"route": "#/stock/2317", "label": "查看鴻海的券商分點進出", "tip": "打開分點明細，看看今天買超與賣超第一名是哪些券商分點？"},
  quiz: [{"q": "什麼是「地緣券商」買盤？", "opts": ["外資在海外下單的買盤", "政府四大基金護盤的買盤", "位於上市櫃公司總部或工廠附近的券商分點，出現異常的買進，可能代表內部人提前佈局", "專門做當沖交易的券商分點"], "ans": 2, "exp": "地緣券商指的是地理位置靠近公司所在地的分點。當這些分點出現連續異常買盤時，常被認為是熟悉公司營運的內部人或大股東在提前吃貨。"}, {"q": "如果你發現今天買超第一名的券商分點，是市場上赫赫有名的「隔日沖」大戶，明天開盤你應該注意什麼？", "opts": ["大戶加持，明天一開盤就市價掛買", "他們明天開盤很可能就會大量賣出股票獲利了結，容易造成股價開高走低，不宜盲目追高", "代表外資即將連續買超一個月", "公司明天一定會發布重大利空新聞"], "ans": 1, "exp": "隔日沖主力的操作手法是今天大買鎖漲停，明天開盤就倒貨獲利了結。因此看到隔日沖主力進場，隔天早盤應避免追高，以免被倒貨。"}, {"q": "關於追蹤主力分點的策略，下列觀念何者最正確？", "opts": ["只要找到主力分點，就可以把房子抵押全部重壓", "主力永遠只在同一個分點進出，絕對不會匯撥股票", "分點資料非常透明，但主力也可能利用 A 分點買、B 分點賣來製造假象，需搭配其他指標綜合判斷", "台股根本查不到券商分點的資料，這都是老手編出來的"], "ans": 2, "exp": "雖然分點資料透明，但主力也會進化，利用匯撥或多帳戶操作來隱藏蹤跡。因此分點籌碼只能作為輔助，不可過度迷信單一指標。"}],

      { title: '臺灣證券交易所 — 三大法人買賣超金額統計表', url: 'https://www.twse.com.tw/zh/trading/foreign/bfi82u.html' },{"title": "券商分點進出明細 - 臺灣證券交易所", "url": "https://www.twse.com.tw/zh/trading/historical/bs8i.html"}, {"title": "主力分點是什麼？地緣券商怎麼看？", "url": "https://twstock.app/learn/what-is-dealer-buying"}],

  keyPoints: ["當沖（當日沖銷）是指同一天內買進並賣出同一檔股票，賺取價差。", "當沖比 = (當日當沖成交股數 ÷ 總成交股數) × 100%。", "當沖證交稅減半優惠（0.15%）實施至 2027 年 12 月 31 日。", "當沖比過高的股票盤中震盪劇烈，且容易觸發處置股（關緊閉）機制。"],
  html: `
    <h3>什麼是現股當沖？</h3>
    <p>在台股原本的交割制度下，你今天買的股票，最快要明天才能賣出。但為了解決流動性問題，主管機關開放了「<strong><span class="glossary-term" data-term-id="day-trading">現股當沖</span></strong>」（當日沖銷）。</p>
    <p>當沖的意思是：你在同一天內，針對同一檔股票，進行了「買進並賣出」或是「賣出並買回」的動作。因為在今天收盤前你就已經把部位平倉（歸零）了，所以你不需要準備購買整張股票的龐大交割款，只需要支付買賣之間的「價差」以及手續費和交易稅即可。</p>
    <p>為了鼓勵當沖交易活絡市場，台灣政府祭出了<strong>現股當沖證交稅減半</strong>的優惠政策（原本賣出股票要繳 0.3% 證交稅，當沖只要 0.15%）。這項減稅優惠目前已經延長，將一路實施至 <strong>2027 年 12 月 31 日</strong>。</p>

    <h3>什麼是當沖比？</h3>

    <p>當沖比反映了一檔股票當天有多少成交量是由「不想抱股過夜」的短線客所貢獻的。在台股，熱門強勢股的當沖比常常高達 40%、50%，甚至 70% 以上。</p>
    <p>適度的當沖比（例如 20%~40%）可以提供股票良好的流動性，讓想買賣的人都能順利成交。但如果當沖比過高（例如超過 60% 甚至 70%），就代表市場籌碼極度不穩定，股價的波動會非常劇烈，容易出現暴漲暴跌的「洗盤」現象。</p>

    <div class="widget" data-widget="daytrade-calc"></div>

    <h3>當沖比過高的處置規定（2026 年新制）</h3>
    <p>為了避免個股因為當沖過度熱絡而導致股價失控，證交所設有「處置股票」（俗稱關緊閉）的機制。如果一檔股票的當沖比連續多日過高，或者週轉率過大，就會被列為「注意股」，嚴重者會被列為「處置股」。</p>
    <p>請注意，台股處置股票的規定將於 <strong>2026 年 8 月 10 日</strong>起實施新制：</p>
    <ol>
      <li><strong>處置期間縮短：</strong>無論是初次或再次被處置，期間皆統一縮短為 <strong>5 個營業日</strong>（若觸發條件包含當沖占比過高，則為 <strong>7 個營業日</strong>）。舊制則是長達 10 甚至 12 個營業日。</li>
      <li><strong>撮合時間縮短：</strong>一般普通交易的處置股，將改為大約<strong>每 2 分鐘</strong>人工撮合一次（舊制為 5 分鐘或 20 分鐘一次），這將稍微改善處置期間的流動性。</li>
    </ol>
    <p>雖然期間縮短，但「預收款券」（買進要先付全額現金，賣出要先圈存股票）的規定依然不變，被處置的股票由於失去了當沖客的資金動能，股價往往會陷入量縮盤整。</p>

    <div class="case">
      <p><strong>台股實例（高當沖比帶來的劇烈震盪）</strong>：<br>
      假設某一檔搭上 AI 題材的熱門散熱股（示意情境），股價連日大漲，吸引了全台灣的當沖客進場，當沖比飆高到 75%。<br>
      今天早盤，主力稍微點火，散戶當沖客見狀立刻瘋狂湧入買進，將股價推升至 +8%。但到了中午 12 點，大盤稍有回檔，那些早上買進的當沖客因為「不想抱股過夜」且「不想付全額交割款」，開始恐慌性地將股票市價賣出。<br>
      這股龐大的「當沖平倉賣壓」在短短 20 分鐘內爆發，導致股價從 +8% 瞬間跳水翻黑變成 -2%。這就是高當沖比股票常見的「盤中雲霄飛車」，心臟不夠大顆的新手千萬不要輕易嘗試。</p>
    </div>

    <h3>新手常見陷阱</h3>
    <div class="pitfall">
      <p><strong>以為無本當沖很好賺：</strong>當沖雖然不用準備全額交割款，但絕不是「無本生意」。每次交易都要支付手續費與 0.15% 的證交稅。如果頻繁進出卻沒有賺到足夠的價差，光是交易成本就會把你的本金侵蝕殆盡，而且只要當沖虧損，隔天依然要把虧損的差額補進戶頭，否則就是違約交割。</p>
    </div>
    <div class="pitfall">
      <p><strong>買在高當沖比的處置前夕：</strong>如果一檔股票當沖比極高，且已經連續大漲，很可能會被列入處置股（關緊閉）。一旦關緊閉，當沖客無法進場，買盤動能瞬間消失，股價很容易出現回檔修正。</p>
    </div>
`,

  plain: "股市就像拔河，大戶力氣大，散戶力氣小。每個週末公布的「集保戶數」就像是一張體檢表，告訴你這家公司的股票是被大戶默默收走了，還是被散戶傻傻接盤了。",
  keyPoints: ["集保結算所「每週」會公布一次各檔股票的股權分散表。", "持股級距分為 15 級，第 15 級（1,000 張以上）俗稱千張大戶。", "「千張大戶持股比例上升 + 總股東人數下降」代表籌碼集中（大戶吃貨）。", "「千張大戶持股比例下降 + 總股東人數上升」代表籌碼渙散（大戶倒貨）。"],
  html: `
    <h3>什麼是集保股權分散表？</h3>
    <p>我們常聽老手說：「籌碼在散戶手上，再好的利多都不會漲；籌碼在大戶手上，再壞的利空也跌不下去。」但是，我們怎麼知道籌碼到底是在大戶還是散戶手上呢？</p>
    <p>這時候就要看一個終極武器：<strong><span class="glossary-term" data-term-id="holder-distribution">集保股權分散表</span></strong>。台灣集中保管結算所（TDCC）<strong>每週</strong>都會公布一次所有上市櫃公司的股權分散數據。這份表會把持有該檔股票的股東，依照「持有股數」分成 <strong>15 個級距</strong>。從持有不到 1 張（零股）的超級小散戶，一路排到持有 1,000 張以上的超級大戶，清清楚楚地攤在陽光下。</p>
    <p>這就像是每週進行一次「全身體檢」，讓你看透這家公司的股票，到底是被大戶集中收走了，還是流落到了散戶手中。</p>

    <div class="widget" data-widget="holder-dist"></div>

    <h3>千張大戶 vs. 小散戶</h3>
    <p>在分析股權分散表時，我們通常會關注光譜的兩端：</p>
    <ol>
      <li><strong>千張大戶（第 15 級）：</strong>指的是持有該公司股票超過 1,000 張的人。這些人通常是公司的大老闆、董監事、或者是資金雄厚的市場主力。他們最了解公司的內部營運狀況。如果「千張大戶持股比例」連續幾週上升，代表大戶正在默默吃貨，這是非常強烈的看多籌碼訊號。</li>
      <li><strong>散戶（通常指持股 1~50 張以下）：</strong>散戶通常是市場上消息最不靈通、資金最薄弱的一群。如果「散戶持股人數」連續幾週暴增，但「大戶持股比例」卻下降，這代表大戶正在趁著利多消息，把手上的股票倒給不知情的散戶。這種籌碼結構極度渙散，股價後續非常容易下跌。</li>
    </ol>

    <h3>羊群效應與籌碼集中度</h3>
    <p>籌碼面分析的核心邏輯就是：<strong>「跟著大戶走，遠離散戶群」</strong>。</p>
    <p>當一檔股票在低檔盤整時，如果我們發現集保股權分散表中，總股東人數在減少（散戶受不了洗盤停損出場），但千張大戶的持股比例卻在緩步上升（大戶趁低偷偷收貨）。這種現象稱為<strong>「籌碼集中」</strong>，就像彈簧被慢慢壓縮，一旦爆發，股價上漲的力道會非常強勁。</p>

    <div class="case">
      <p><strong>台股實例（大戶吃貨、散戶退場的黃金交叉）</strong>：<br>
      假設 2308 台達電（示意數字）因為大盤回檔，股價從 300 元跌到了 250 元，盤整了兩個月。<br>
      在這兩個月期間，你每週去查它的「集保股權分散表」，發現總股東人數從 10 萬人慢慢減少到了 8 萬人（2 萬名散戶認賠殺出）；但是，千張大戶的持股比例卻從 60% 一路上升到了 65%。<br>
      這就是標準的「籌碼由散戶流向大戶」。隨後，當台達電發布財報創歷史新高的好消息時，股價輕鬆突破 300 元前高。因為浮額（不穩定的散戶籌碼）已經被清洗乾淨，大戶拉抬股價根本沒有阻力。</p>
    </div>

    <h3>新手常見陷阱</h3>
    <div class="pitfall">
      <p><strong>只看股東人數創新高就覺得很熱門：</strong>很多新手看到新聞報導「某 ETF 股東人數突破百萬大關」就覺得是好事。在籌碼分析中，股東人數爆增通常意味著籌碼極度凌亂（大家都來湊熱鬧），這反而是股價可能面臨高檔反轉的危險訊號，絕對不能當成買進理由。</p>
    </div>
    <div class="pitfall">

    </div>
    <h3>深入探討：如何利用集保數據尋找波段黑馬</h3>
    <p>除了觀察千張大戶與散戶的消長之外，投資人還可以特別留意「中實戶」（例如持有 400 張至 1,000 張的級距）的動向。在某些中小型飆股發動前，千張大戶的比例可能變動不大，但 400~1000 張的中實戶比例卻出現異常的連續上升。這往往暗示著市場上有敏銳的游資或特定主力正在吃貨。此外，如果一檔股票的「總股東人數」已經連續數個月下降，創下近年來的新低，這表示籌碼已經沉澱到極致，這時候只要稍微有一點利多消息點火，股價就很容易拉出一段可觀的漲幅。因此，將集保數據視為波段選股的濾網，是非常實用的策略。</p>

    <p>綜合運用集保股權分散表時，建議將「400 張以上大戶持股比例」、「1,000 張以上大戶持股比例」以及「總股東人數（特別是 10 張以下散戶人數）」三條曲線放在同一個時間軸觀察。最理想的波段起漲籌碼結構，是在股價經歷數週橫盤整理期間，總股東人數持續創下近期新低，而 400 張與 1,000 張大戶比例卻逆勢創下近期新高，形成明顯的「大戶與散戶開口發散」型態；一旦後續配合月營收創高或法人買盤進駐帶量突破頸線，往往就是籌碼沉澱完畢、波段行情正式啟動的關鍵訊號。</p>

  id: 'news-announcements',
  track: 'news',
  stage: 'basic',
  order: 1,
  title: '重大訊息：先看公開資訊觀測站',
  icon: '📢',
  minutes: 9,
  tldr: '公司的大事必須先在公開資訊觀測站公告；新聞是轉述，觀測站的重大訊息才是原文。',
  plain: '公開資訊觀測站就像上市櫃公司的「官方公布欄」：董事會決議、配息、併購、澄清媒體報導，都要在規定時限內貼上去，而且所有人同時看得到。新聞與社群只是轉述，看到消息先問一句「觀測站有公告嗎？」，就能避開一大半的誤會。',
  keyPoints: [
    '重大訊息要輸入公開資訊觀測站（MOPS），全市場同時看得到，是第一手資訊',
    '一般重訊最晚在事實發生日起「次一營業日開盤前 2 小時」，也就是 07:00 前公告',
    '媒體報導影響股價時要立即澄清，最遲在發現或證交所通知後 2 小時內',
    '營業日 17:00 前要公開併購、停工等大事，公司須先申請「訊息面暫停交易」',
    '讀重訊依序看：主旨與條款 → 事實發生日 → 數字與比重 → 影響與後續',
  ],
  html: `<h3>公開資訊觀測站：上市櫃公司的官方公布欄</h3>
<p>公開資訊觀測站（Market Observation Post System，簡稱 MOPS）是證交所建置的資訊申報平台。上市、上櫃公司要把財報、月營收、股東會資料，以及各種「重大訊息」輸入這裡，所有投資人在同一時間都看得到。</p>
<p>可以把它想成學校的公布欄：班導（公司）要宣布的事，一定先貼在公布欄；同學在走廊聽到的消息（媒體轉述、網路傳言）可能對、也可能走樣。<strong>判斷消息的第一步，就是回到觀測站找原文。</strong></p>
<table class="tbl"><thead><tr><th>資訊來源</th><th>性質</th><th>怎麼用</th></tr></thead><tbody>
<tr><td>觀測站重大訊息</td><td>公司依規定申報的原文</td><td>第一手資訊，內容不實公司要負責</td></tr>
<tr><td>財經媒體報導</td><td>記者整理、轉述、分析</td><td>速度快，但標題可能加入推測或誇大</td></tr>
<tr><td>法人報告、社群貼文</td><td>第三方觀點或傳言</td><td>只能當線索，務必回頭查證</td></tr>
</tbody></table>

<h3>哪些事情算「重大訊息」？</h3>
<p>證交所訂有「對有價證券上市公司重大訊息之查證暨公開處理程序」，上櫃公司則適用櫃買中心的對應規定，列出數十款應公告的情事。法規沒有用單一金額或比率來定義「重大」，公司要依產業、規模判斷事件是否足以影響股東權益或股價。常見類型：</p>
<table class="tbl"><thead><tr><th>類型</th><th>例子</th><th>投資人該看什麼</th></tr></thead><tbody>
<tr><td>董事會決議</td><td>通過財報、配發股利、資本預算、召開股東會</td><td>金額和過去相比有沒有變化</td></tr>
<tr><td>交易與合約</td><td>併購、取得或處分資產、簽訂重要合約</td><td>金額占營收、股本或淨值的比重</td></tr>
<tr><td>人事異動</td><td>董事長、總經理、財務主管更換</td><td>是否突然、有沒有交代原因</td></tr>
<tr><td>突發事件</td><td>停工、火災、重大訴訟、退票</td><td>對營運與財務的影響金額</td></tr>
<tr><td>澄清說明</td><td>回應媒體報導</td><td>公司是承認、否認，還是不評論</td></tr>
</tbody></table>
<div class="callout key"><b>重點</b>重大訊息應以事實陳述、中性用語撰寫。證交所的問答集明確表示，公司不可以用重大訊息宣傳經營理念或「年度營收目標」這類預測性說法。看到「可望、挑戰、目標」等字眼，多半出自媒體或法人的預估，而不是公司的正式公告。</div>

<h3>公告時限：07:00 與「2 小時」規則</h3>
<p>重大訊息的價值在於「大家同時知道」，所以規則圍繞兩件事：<strong>要快</strong>，而且<strong>盡量不要在盤中突襲</strong>。</p>
<table class="tbl"><thead><tr><th>情況</th><th>最晚何時要輸入觀測站</th></tr></thead><tbody>
<tr><td>一般重大訊息（例如董事會決議）</td><td>事實發生日起，次一營業日交易時間開始 2 小時前；台股 09:00 開盤，也就是<strong>早上 07:00 前</strong></td></tr>
<tr><td>公司在那之前已先發新聞稿</td><td>發新聞稿時<strong>同時</strong>輸入</td></tr>
<tr><td>回應媒體報導（足以影響股價或與事實不符）</td><td><strong>立即</strong>輸入澄清，最遲在發現後或證交所通知後 2 小時內</td></tr>
<tr><td>營業日 17:00 後或例假日才接到證交所詢問</td><td>最遲在次一營業日開盤前 2 小時</td></tr>
</tbody></table>
<p>不是回應媒體的重訊（例如董事會的重大決策），證交所建議在盤後或盤前發布，避免盤中有人先看到、有人晚看到，造成資訊不對稱。</p>
<div class="callout pro"><b>進階補充</b>證交所自 2016 年 1 月 15 日起實施「訊息面暫停交易機制」：公司預計在營業日下午 5 點前公開，或由董事會決議嚴重減產停工、聲請破產重整、合併收購、新產品進入量產等重大事項時，要在前一營業日主動申請暫停交易。暫停以 1 個營業日為原則、最多 3 個營業日，而且台股沒有「盤中暫停」。看到暫停交易公告，代表重大消息即將揭曉，先別急著猜方向。</div>

<h3>台股實例：讀一則台積電的董事會重訊</h3>

<h3>聽法說會的重點清單</h3>
<p>財報反映的是過去，法說會最有價值的是「指引」：公司對下一季營收、毛利率、營業利益率給出的預估區間，以及全年資本支出等規劃。</p>
<ol class="steps">
<li><b>先記下指引區間</b>寫下營收、毛利率、營業利益率的上下緣與中位數，以及背後的匯率假設。</li>
<li><b>和上一季指引、市場預估比較</b>是上修、持平還是下修？比市場共識高還是低？</li>
<li><b>看資本支出與產能計畫</b>資本支出擴大通常代表公司看好需求，但也會增加折舊、壓縮短期毛利率。</li>
<li><b>聽 Q&amp;A 的語氣與焦點</b>分析師反覆追問的題目（庫存、價格、競爭、海外設廠成本）就是市場的擔憂所在。</li>

<h3>月營收新聞的三個數字</h3>
<p>每月 10 日前後，新聞標題常寫「月增 X%、年增 Y%」。10 日是「最晚」期限，公司可以更早公布，所以月初就會陸續看到各家營收。這兩個數字的意思不同：</p>
<div class="formula">月增率 =（本月營收 − 上月營收）÷ 上月營收 × 100%</div>
<div class="formula">年增率 =（本月營收 − 去年同月營收）÷ 去年同月營收 × 100%</div>
<p>示意：某公司本月營收 120 億元、上月 100 億元、去年同月 96 億元，則月增率 =（120 − 100）÷ 100 = 20%，年增率 =（120 − 96）÷ 96 = 25%。</p>
<ul>
<li><strong>月增率</strong>容易受工作天數、春節、出貨時點等季節因素影響，單看一個月容易誤判。</li>
<li><strong>年增率</strong>拿去年同月比較，比較能排除季節性，是判斷成長的主要依據。</li>
<li><strong>累計年增率</strong>把今年 1 月到本月加總後和去年同期比較，看的是全年趨勢。</li>
</ul>
<p>例如台積電 2024 年 12 月營收只比 11 月多 0.8%，年增率卻高達 57.8%，月增率小，不代表成長停滯。</p>

<h3>什麼是點陣圖？鷹派與鴿派又是什麼？</h3>
<p>每年 <strong>3、6、9、12 月</strong>這四次 FOMC 會議，會同時公布「經濟預測摘要（SEP）」，裡面最受矚目的就是<strong>點陣圖（Dot Plot）</strong>：每位與會官員（最多 19 人，不限當年度有投票權的 12 人）用一個點，標出自己認為今年底、明年底、後年底與長期適合的利率水準。</p>
<ul>
<li><strong>看中位數的移動</strong>：市場會拿這次點陣圖的中位數和上一季比，看官員預估今年還要升幾次、或降幾次息，也會一併關注「長期（Longer run）」的中性利率有沒有被上調。</li>
<li><strong>點陣圖不是承諾</strong>：它只是官員在當下數據下的個人預估，之後通膨或就業變了，點的位置也會跟著改；而且每個點沒有標名字，市場重點是看全體官員的分布與中位數，而不是猜哪一個點是誰畫的。</li>
</ul>
<div class="compare"><div><h4>🦅 鷹派（Hawkish）</h4><p>比較擔心通膨，傾向升息、維持高利率更久，或縮減資產負債表（收回市場資金）。對高估值成長股壓力較大。</p></div><div><h4>🕊️ 鴿派（Dovish）</h4><p>比較擔心經濟放緩與失業，傾向降息或維持寬鬆環境。資金成本下降，對股市估值較友善。</p></div></div>

<h3>利率怎麼影響股票估值？拉拉看滑桿</h3>
<p>股票的價值來自未來的獲利，但「未來的錢」要折算回今天值多少，用的折現率就和利率有關。用戈登成長模型（Gordon Growth Model）可以把合理本益比簡化成一個很好記的關係式：</p>
<div class="formula">合理本益比 ≈ 1 ÷（要求報酬率 − 長期成長率）</div>
<p>其中「要求報酬率 = 無風險利率 + 股票風險溢酬」。當央行升息，無風險利率上升，投資人要求的報酬率跟著提高，分母變大，合理本益比就會往下掉。</p>
<p><strong>示意驗算</strong>：假設某公司的長期成長率是 4%。當要求報酬率為 9% 時，合理本益比 ≈ 1 ÷（0.09 − 0.04）= 1 ÷ 0.05 = <strong>20 倍</strong>；如果央行連續升息，讓要求報酬率升到 10%，合理本益比就變成 1 ÷（0.10 − 0.04）≈ <strong>16.7 倍</strong>。就算公司今年 EPS 一毛都沒少，光是合理倍數從 20 倍縮到 16.7 倍，股價就會面臨修正壓力。下方互動模擬器可以拉動利率與成長率，親自看看合理本益比怎麼變：</p>

<p>這也解釋了為什麼<strong>高本益比的科技成長股</strong>對利率特別敏感：它們的價值有一大部分寄託在好幾年後的高成長，分母微幅上升，折算回今天的價值就會少掉一大截。台股加權指數以半導體與電子股占大宗，自然十分在意美國利率與美債殖利率的走向。</p>

<h3>台灣央行的角色：利率、存準率與選擇性信用管制</h3>
<p>台灣央行每季（3、6、9、12 月）召開理監事聯席會議，除了調整<strong>重貼現率</strong>，還有兩項常一起動用的工具：</p>
<ol class="steps">
<li><b>重貼現率</b>銀行向央行融通的指標利率，會連動影響房貸利率、企業借款利率與定存利率。</li>
<li><b>存款準備率</b>規定銀行收到存款後要提存多少比例在央行、不能放貸出去；調高存準率會直接收緊市場上的可用資金。</li>
<li><b>選擇性信用管制</b>針對特定不動產貸款限制成數或寬限期，用來穩定房市與金融體系。</li>
</ol>
<div class="callout pro"><b>進階補充</b>利率變動對不同產業的影響並不一樣：科技成長股怕高利率壓縮估值；背負大量借款的公司怕利息支出增加；銀行業在升息初期可能受惠於存放款利差擴大，但若利率高到讓債券價格大跌或景氣轉差，金融股同樣會受影響。</div>
<p>台灣央行在每年 3、6、9、12 月的理監事聯席會議後，除了宣布利率是否調整，也會發布對國內經濟成長率（GDP）與消費者物價指數（CPI）年增率的最新預測，並由總裁主持記者會說明決策理由。讀央行新聞稿時，把「國內通膨是否高於 2%」、「出口與投資動能」、「房市信用集中度」這三條線索抓出來，就能看懂央行接下來的態度。</p>

<p>每次 FOMC 會議結束（台灣時間夏令凌晨 2 點、冬令凌晨 3 點），市場在短短一個小時內會經歷三波資訊：</p>

<p>常見的劇本是：02:00 剛公布時市場先往一個方向衝，02:30 主席開口回答記者提問後又反轉。一般投資人不必熬夜搶那幾分鐘的波動，隔天早上把「利率結果、點陣圖中位數變化、主席的核心說法」三件事看懂，再搭配美股收盤與 10 年期美債殖利率的方向判斷即可。</p>
<p>除了調整利率，聯準會還會透過資產負債表影響市場資金：買進公債與抵押貸款證券、把錢放進市場叫做<strong>量化寬鬆（QE）</strong>；到期不續買、讓資產負債表縮小、把錢收回叫做<strong>量化緊縮（QT）</strong>。看央行政策時，利率是「資金的價格」，資產負債表則是「資金的數量」，兩者一起看才完整。</p>

<h3>費半與台股的連動：拉動相關係數看看</h3>
<p>費城半導體指數（SOX）的成分股涵蓋輝達（NVIDIA）、超微（AMD）、博通（Broadcom）、艾司摩爾（ASML）、應用材料，以及台積電 ADR（TSM）。這些公司不是台廠的大客戶，就是上游設備商或同業，因此費半的漲跌幾乎就是全球半導體景氣的即時投票。</p>
<p>下方示意圖呈現費半日報酬（橫軸）與台股日報酬（縱軸）的散布關係。試著拉動相關係數滑桿觀察：相關係數越高，點越集中在斜線附近，代表費半大漲時台股跟著收紅的機率越高；但即使高度正相關，圖上仍有不少偏離斜線的點，代表<strong>高度連動不等於 100% 同步</strong>。</p>

<div class="callout key"><b>重點</b>看美股時別只看道瓊漲跌幾點。有時道瓊因為金融、傳產股上漲而收紅，但費半與那斯達克卻下跌 2%——這種夜晚，隔天以半導體為主的台股往往跟隨費半走弱，而不是跟著道瓊上漲。</div>

<h3>什麼是 ADR？台積電 ADR 折溢價怎麼算？</h3>
<p><strong>美國存託憑證（American Depositary Receipt，簡稱 ADR）</strong>是外國企業把自家股票交給存託銀行保管，在美國交易所發行的憑證，讓美國投資人能直接用美元買賣。台灣多家大型企業都有發行 ADR，但<strong>每一單位 ADR 代表幾股台灣普通股（換股比例）各公司不同</strong>：</p>
<table class="tbl"><thead><tr><th>公司</th><th>台股代號</th><th>美股 ADR 代號</th><th>換股比例</th></tr></thead><tbody>
<tr><td>台積電</td><td>2330</td><td>TSM</td><td>1 單位 ADR = 5 股普通股</td></tr>
<tr><td>聯電</td><td>2303</td><td>UMC</td><td>1 單位 ADR = 5 股普通股</td></tr>
<tr><td>日月光投控</td><td>3711</td><td>ASX</td><td>1 單位 ADR = 2 股普通股</td></tr>
<tr><td>中華電</td><td>2412</td><td>CHT</td><td>1 單位 ADR = 10 股普通股</td></tr>
</tbody></table>
<p>因為 1 單位台積電 ADR 代表 5 股 2330，不能直接拿美元股價乘匯率，必須<strong>先除以 5、再乘上美元兌新台幣匯率</strong>，才能和台股現貨價格比較：</p>
<div class="formula">台積電 ADR 折合台股每股價格 =（TSM 收盤價 ÷ 5）× 美元兌新台幣匯率</div>
<div class="formula">ADR 溢價率 =（ADR 折合台股價 − 2330 收盤價）÷ 2330 收盤價 × 100%</div>
<p><strong>示意驗算</strong>：假設昨晚 TSM 收在 180 美元，美元兌新台幣匯率為 32.0，前一天台股<span class="stk" data-code="2330">台積電</span>收在 1,000 元。先算折合台股價：（180 ÷ 5）× 32.0 = 36 × 32.0 = <strong>1,152 元</strong>；再算溢價率：（1,152 − 1,000）÷ 1,000 = <strong>+15.2%</strong>（溢價 15.2%）。若算出來小於 0%，則稱為「折價」。</p>
<div class="callout warn"><b>注意</b>新手常以為「ADR 溢價 15%，代表隔天 2330 一定會補漲 15%」。其實台灣普通股不能隨意轉換成 ADR 去美國賣（發行新 ADR 受法規與額度限制），套利管道並不完全暢通，所以台積電 ADR 長期都維持一定程度的溢價。實戰上要看的是<strong>「昨晚 ADR 本身的漲跌幅」</strong>以及<strong>「溢價率比前幾天明顯擴大還是縮小」</strong>，而不是把溢價率當成隔天漲幅。</div>

<h3>外資動向與匯率的緊密連動</h3>

<table class="tbl"><thead><tr><th>情境</th><th>資金動向</th><th>對新台幣的影響</th><th>對台股的影響</th></tr></thead><tbody>
<tr><td>外資大舉匯入</td><td>外資把手上的美元換成新台幣，新台幣需求大增</td><td><strong>新台幣升值</strong></td><td>資金湧入台股，通常帶動指數上漲</td></tr>

</tbody></table>

  <p>回顧 2022 年，美國聯準會（Fed）為了對抗嚴峻的高通膨，展開了激進的升息循環。這導致美國與台灣的利差大幅擴大，國際美元指數狂飆。外資為了因應全球風險與追求更高無風險報酬，在台股大舉獲利了結，並將資金淨匯出。</p>
  <p>這股龐大的美元超額需求與新台幣賣壓，使得新台幣兌美元匯率在 2022 年全年重貶高達 <strong>9.83%</strong>（年底封關收在 30.708 元），創下自 1997 年亞洲金融風暴（25年來）以來最大的年度貶幅（資料來源：自由時報 2022年終匯市回顧）。</p>

</div>

<h3>匯率變動對台股企業獲利的影響</h3>

<ul>
  <li><strong>新台幣貶值（有利出口商）：</strong> 台灣許多科技廠（如半導體代工、電子組裝）是典型的出口導向企業。他們的產品主要以外幣（多為美元）計價。當新台幣貶值時，他們收到的同等美元營收，在換算回新台幣時會變多，這不僅會推升營收數字，還能在財報上認列豐厚的「匯兌收益」。這也是為什麼在貶值期間，外銷概念股的財報往往有亮眼表現。</li>
  <li><strong>新台幣升值（有利內需與進口商）：</strong> 相對地，以國內市場為主，或是需要大量從國外進口原物料的企業（如營建業、食品業、部分航空與航運業），在升值期間會受惠。因為他們可以用較少的新台幣買到一樣多的國外物資，降低了進口成本；同時，若企業背負龐大的美元計價債務，升值也會減輕他們的還債負擔。</li>
</ul>

<div class="callout key"><b>重點</b>
判斷一家公司受匯率影響的程度，除了看它是出口還是進口導向，還要觀察公司是否有進行「匯率避險」（如購買遠期外匯合約）。經營穩健的大型企業通常會將多數外幣曝險進行避險，以降低匯率波動對本業獲利的干擾。</div>

  ],
  html: `<h3>股市中的理智與情感</h3>
<p>傳奇投資人華倫·巴菲特（Warren Buffett）曾留下一句名言：「在別人貪婪時恐懼，在別人恐懼時貪婪。」這句話深刻點出了股票市場的本質：市場並不總是理性的，股票價格常常因為群眾的過度樂觀（貪婪）或過度悲觀（恐懼）而嚴重偏離其應有的內在價值。</p>
<p>問題是，「情緒」這種看不見摸不著的東西，該如何具體衡量？如果單憑感覺，我們很容易陷入跟群眾一樣的盲點。在現代金融市場中，有幾個最知名的量化指標，專門用來將市場情緒「數據化」，幫助投資人保持客觀。</p>

<h3>1. VIX 恐慌指數（波動率指數）</h3>
<p>VIX 是由芝加哥選擇權交易所（CBOE）推出，用來衡量美國 S&P 500 指數「未來 30 天預期波動程度」的指標。簡單來說，它反映了市場對未來的不安程度。為了貼近本土市場，台灣期貨交易所（TAIFEX）也有編製對應的<strong>「台指選擇權波動率指數（Taiwan VIX，或簡稱 VIXTWN）」</strong>，運作原理完全相同，但專門反映台股的情緒。</p>
<ul>
  <li><strong>與股市反向連動：</strong> 當股市大跌、崩盤時，投資人會陷入恐慌，瘋狂搶買選擇權賣權（Put Option）來為手中的持股避險。這會推升權利金價格，導致 VIX 瞬間飆升。相對地，當股市緩步上漲或盤整時，避險需求低落，VIX 通常會在低檔徘徊。因此，它被財經媒體俗稱為「恐慌指數」。</li>

<table class="tbl"><thead><tr><th>VIX 數值區間</th><th>市場情緒解讀</th><th>投資行動參考</th></tr></thead><tbody>
<tr><td><strong>低於 20</strong></td><td>平穩 / 樂觀（自滿）</td><td>市場無風無雨，波動率低。但若長期處於極低水準，須提防投資人過度自滿所帶來的突發風險。</td></tr>
<tr><td><strong>20 - 30</strong></td><td>警戒 / 不確定性升高</td><td>市場出現雜音（如通膨數據超預期、地緣政治摩擦），投資人開始感到擔憂，股市波動加劇。</td></tr>
<tr><td><strong>高於 30</strong></td><td>極度恐慌 / 崩盤危機</td><td>發生重大黑天鵝事件或股災。此時伴隨不理性的拋售潮，雖然可怕，但往往也是尋找長線底部的黃金機會。</td></tr>
</tbody></table>

<h3>2. 恐懼與貪婪指數（Fear & Greed Index）</h3>
<div class="widget" data-widget="sentiment-gauge"></div>

    <div class="case">
  <h4>CNN 的全球情緒量表</h4>
  <p>除了 VIX，CNN Business 推出了一個更為直觀、廣受散戶歡迎的指標：<strong>恐懼與貪婪指數（Fear & Greed Index）</strong>。它的數值介於 <strong>0 到 100</strong> 之間，並非只看單一數據，而是綜合考量了 7 大市場維度（包含市場動能、股價強弱、選擇權買賣權比例、避險需求、垃圾債利差、以及 VIX 波動率等），算是一個全方位的情緒儀表板。</p>
  <ul>
    <li><strong>0 - 25（極度恐懼 Extreme Fear）：</strong> 市場全面恐慌，股票遭到恐慌性超賣，通常蘊含著絕佳的反彈與長線佈局契機。</li>
    <li><strong>45 - 55（中立 Neutral）：</strong> 市場處於觀望，情緒平穩，沒有明顯的偏好。</li>

  </ul>
</div>

<h3>3. Put/Call Ratio（買賣權未平倉比率）</h3>
<p>在台股期貨與選擇權市場中，還有一個專屬的情緒指標：<strong>Put/Call Ratio（P/C Ratio）</strong>。它是將市場上所有「賣權（Put，看空或避險）」的未平倉量，除以「買權（Call，看多）」的未平倉量。由於選擇權市場的大戶通常扮演莊家（賣方），當 P/C Ratio 大於 100% 時，代表莊家賣出較多的 Put（代表他們認為跌不下去，偏多看待）；當小於 100% 時，則代表市場情緒偏空。</p>

<div class="callout key"><b>實戰重點</b>

<h3>散布不實資料與操縱股價：網路發文的陷阱</h3>

<h3>如何防範假消息與投資陷阱？</h3>
<p>面對市場上滿天飛的群組明牌與小道消息，投資人最好的自保之道是：</p>

    ex: '某投顧老師在通訊軟體群組內散布未經證實的假利多，並聯合主力拉抬股價倒貨給跟單會員，遭檢調以操縱股價罪起訴。',
    rel: ['fake-news', 'fsc', 'insider-trading', 'main-force'],

  {

    def: '在資訊爆炸時代，許多主力會利用論壇或免費群組發布「獨家內幕」或「未經證實的接獲大單謠言」（假利多），引誘散戶追高。面對這類新聞，投資人的第一防線應是直接去<b>公開資訊觀測站</b>查看公司是否發布澄清重大訊息，並交叉比對公司實際的月營收與財報，切忌聽信謠言就盲目下單。',
    ex: '網路瘋傳某光電廠接獲國際大廠十億元訂單，隔日公司立刻在觀測站發布重訊澄清該假消息純屬媒體臆測。',
    rel: ['material-info', 'market-manipulation', 'mops', 'insider-trading'],
    lesson: 'news-rumors-insider',
  },
  {

    ex: '美國商務部突襲宣布擴大對中國 AI 晶片出口管制，地緣政治風險升溫導致台股相關半導體供應鏈全面跌停。',
    rel: ['tariff', 'supply-chain', 'hot-money', 'sox'],
    lesson: 'news-policy-geo',
  },
  {
    id: 'tariff',
    term: '關稅',
    en: 'Tariff',
    aka: ['進口關稅', '貿易壁壘', '反傾銷稅'],
    cat: 'news',
    imp: 2,
    short: '一國政府對進口商品徵收的額外稅賦，會直接侵蝕跨國出口商的毛利率並引發通膨。',
    def: '各國保護本土產業最常用的武器。當美國對中國或其他國家產品加徵 25% 關稅時，台商夾在中間常首當其衝。關稅壁壘迫使台灣電子組裝廠與供應鏈將產線從中國大規模遷往東南亞或墨西哥（供應鏈重組）；另一方面，高額關稅也會轉嫁給終端消費者，推升全球 CPI 通膨數據。',
    ex: '由於美國考慮對部分電子產品加徵進口關稅，引發外資擔憂台廠毛利率受損，紛紛下調相關代工廠的目標價。',
