<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta name="description" content="流行音樂學院：1970s–2020s 華語／西洋／J-Pop／K-Pop 百大傳奇專輯導聆、八大流派演進、海內外演唱會場館視野與音樂祭攻略、零素材 Web Audio 和弦與節奏實驗室。" />
  <title>♫ 流行音樂學院 Pop Music Academy — 百大傳奇專輯 × 流派實驗室 × 演唱會攻略</title>
  <style>
/* ♫ 流行音樂學院 (Pop Music Academy) — 黑膠唱片×現場舞台 Light Theme */
:root {
  --bg: #fcf8fa;
  --bg-soft: #f7eef3;
  --card: #ffffff;
  --ink: #0f172a;
  --ink-muted: #475569;
  --ink-light: #64748b;
  --border: #eedbe5;
  --border-strong: #dfbccc;
  --accent: #db2777;
  --accent-dark: #9d174d;
  --accent-soft: #fce7f3;
  --indigo: #4f46e5;
  --indigo-soft: #eef2ff;
  --gold: #b45309;
  --gold-soft: #fef3c7;
  --green: #047857;
  --green-soft: #ecfdf5;
  --cyan: #0369a1;
  --cyan-soft: #e0f2fe;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow-sm: 0 1px 4px rgba(157, 23, 77, 0.06);
  --shadow-md: 0 8px 22px rgba(157, 23, 77, 0.1);
  --shadow-lg: 0 20px 48px rgba(15, 23, 42, 0.24);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent-dark); text-decoration: none; }
button, input, select, textarea { font-family: inherit; font-size: inherit; }
button { cursor: pointer; touch-action: manipulation; }
h1, h2, h3, h4, p { margin: 0; }

/* Header */
.pop-header {
  position: sticky;
  top: 0;
  z-index: 90;
  background: rgba(252, 248, 250, 0.96);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.pop-header-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 9px 18px 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.pop-brand-wrap { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; min-width: 0; }
.pop-brand { font-size: 19px; font-weight: 900; color: var(--ink); white-space: nowrap; }
.pop-sub-pill {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-dark);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.pop-ver-btn {
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--ink-muted);
  border-radius: 999px;
  padding: 1px 9px;
  font-size: 11.5px;
  font-weight: 700;
}
.pop-ver-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
.pop-header-right { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.pop-stat-chip {
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 999px;
  padding: 4px 11px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-muted);
  white-space: nowrap;
}
.pop-stat-chip b { color: var(--accent-dark); margin-left: 2px; }
.pop-stat-chip:hover { border-color: var(--accent); }
.pop-dl-btn { display: none; font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1px dashed var(--border-strong); color: var(--ink-muted); }
.pop-dl-btn.show { display: inline-block; }

.pop-nav-bar {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 14px;
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
}
.pop-nav-bar::-webkit-scrollbar { display: none; }
.pop-tab {
  border: 0;
  background: transparent;
  padding: 8px 11px 9px;
  font-size: 13.8px;
  font-weight: 700;
  color: var(--ink-muted);
  border-bottom: 3px solid transparent;
  white-space: nowrap;
}
.pop-tab:hover { color: var(--ink); }
.pop-tab.active { color: var(--accent-dark); border-bottom-color: var(--accent); }
.pop-tab-badge {
  display: inline-block;
  min-width: 20px;
  padding: 0 6px;
  margin-left: 3px;
  border-radius: 999px;
  background: var(--bg-soft);
  color: var(--ink-muted);
  font-size: 11.5px;
  text-align: center;
}
.pop-tab.active .pop-tab-badge { background: var(--accent-soft); color: var(--accent-dark); }

.pop-main { max-width: 1240px; margin: 0 auto; padding: 18px 18px 64px; }

/* Common */
.pop-sec-hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 26px 0 12px; }
.pop-sec-hd:first-child { margin-top: 0; }
.pop-sec-hd h2 { font-size: 19px; font-weight: 900; }
.pop-sec-sub { font-size: 13px; color: var(--ink-light); margin-top: 2px; }
.pop-link-btn { border: 0; background: transparent; color: var(--accent-dark); font-weight: 800; font-size: 13.5px; padding: 2px 0; white-space: nowrap; }
.pop-link-btn:hover { text-decoration: underline; }
.pop-panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); }
.pop-note { font-size: 12.5px; color: var(--ink-light); }
.pop-empty { text-align: center; padding: 44px 16px; color: var(--ink-light); background: var(--card); border: 1px dashed var(--border-strong); border-radius: var(--radius); }
.pop-empty b { display: block; font-size: 16px; color: var(--ink-muted); margin-bottom: 4px; }

.pop-btn {
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--ink);
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 800;
  white-space: normal;
  min-height: 38px;
}
.pop-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
.pop-btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.pop-btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
.pop-btn-done { background: var(--green-soft); border-color: #6ee7b7; color: var(--green); }
.pop-btn-sm { padding: 5px 11px; font-size: 13px; min-height: 32px; }

.pop-input, .pop-select {
  width: 100%;
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  padding: 8px 11px;
  background: #fff;
  color: var(--ink);
  font-size: 14px;
}
.pop-input:focus, .pop-select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
textarea.pop-input { resize: vertical; }

.pop-pills { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.pop-pill {
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--ink-muted);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 700;
}
.pop-pill:hover { border-color: var(--accent); color: var(--accent-dark); }
.pop-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.pop-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  background: var(--bg-soft);
  color: var(--ink-muted);
}
.pop-chip-accent { background: var(--accent-soft); color: var(--accent-dark); }
.pop-chip-indigo { background: var(--indigo-soft); color: var(--indigo); }
.pop-chip-green { background: var(--green-soft); color: var(--green); }
.pop-chip-gold { background: var(--gold-soft); color: var(--gold); }
.pop-chip-cyan { background: var(--cyan-soft); color: var(--cyan); }

/* Hero */
.pop-hero {
  background: linear-gradient(135deg, #500724 0%, #9d174d 48%, #4338ca 100%);
  color: #fff;
  border-radius: 18px;
  padding: 24px 24px 20px;
  box-shadow: var(--shadow-md);
}
.pop-hero h1 { font-size: 26px; font-weight: 900; line-height: 1.25; }
.pop-hero p { margin-top: 6px; font-size: 14.5px; color: rgba(255, 255, 255, 0.9); max-width: 740px; }
.pop-hero-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.pop-hero-stat {
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 12px;
  padding: 7px 13px;
  font-size: 13px;
}
.pop-hero-stat b { font-size: 17px; margin-right: 4px; }

/* Radar */
.pop-radar-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-top: 16px;
  box-shadow: var(--shadow-sm);
}
.pop-radar-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.pop-radar-lbl { font-size: 13px; font-weight: 800; color: var(--ink-muted); min-width: 58px; }

/* Grids */
.pop-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 268px), 1fr));
  gap: 15px;
}
.pop-grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
  gap: 14px;
}
.pop-grid-3 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
  gap: 13px;
}

/* Album Cards */
.pop-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-sm);
  transition: transform 0.14s ease, box-shadow 0.14s ease;
  min-width: 0;
}
.pop-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.pop-cover-wrap {
  position: relative;
  height: 196px;
  overflow: hidden;
  cursor: pointer;
  background: linear-gradient(135deg, #831843, #4338ca);
}
.pop-cover-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pop-cover-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.25s ease;
}
.pop-cover-img.loaded { opacity: 1; }
.pop-cover-grad {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.18) 0%, rgba(15, 23, 42, 0.05) 45%, rgba(15, 23, 42, 0.82) 100%);
  pointer-events: none;
}
.pop-cover-top {
  position: absolute;
  top: 8px;
  left: 8px;
  right: 8px;
  display: flex;
  justify-content: space-between;
  gap: 6px;
  pointer-events: none;
}
.pop-badge-dark { background: rgba(15, 23, 42, 0.78); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
.pop-badge-score { background: rgba(250, 204, 21, 0.95); color: #422006; font-size: 11.5px; font-weight: 900; padding: 2px 8px; border-radius: 999px; }
.pop-cover-bot { position: absolute; bottom: 8px; left: 10px; right: 10px; color: #fff; pointer-events: none; }
.pop-cover-title { font-size: 16px; font-weight: 900; line-height: 1.25; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55); }
.pop-cover-sub { font-size: 12px; color: rgba(255, 255, 255, 0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pop-card-body { padding: 12px 13px 13px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
.pop-card-tagline { font-size: 13px; color: var(--ink-muted); line-height: 1.48; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pop-card-meta { display: flex; flex-wrap: wrap; gap: 5px; }
.pop-card-actions { margin-top: auto; display: flex; gap: 6px; padding-top: 6px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.pop-act-btn {
  flex: 1 1 82px;
  min-width: 0;
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--ink-muted);
  border-radius: 8px;
  padding: 6px 8px;
  font-size: 12.5px;
  font-weight: 800;
  text-align: center;
}
.pop-act-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
.pop-act-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }
.pop-act-btn.done { background: var(--green-soft); border-color: #6ee7b7; color: var(--green); }

/* Filter Bar */
.pop-filter-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 14px;
}
.pop-search-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pop-search-row .pop-input { flex: 1 1 220px; min-width: 0; }
.pop-search-row .pop-select { flex: 0 1 180px; min-width: 140px; }
.pop-result-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; font-size: 13.5px; color: var(--ink-muted); }

/* Audio Lab */
.pop-chord-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin: 14px 0;
}
.pop-chord-pad {
  border: 2px solid var(--border-strong);
  background: #fff;
  border-radius: 14px;
  padding: 14px 8px;
  text-align: center;
  transition: transform 0.1s ease, border-color 0.12s ease, background 0.12s ease;
}
.pop-chord-pad:hover { border-color: var(--accent); }
.pop-chord-pad.playing {
  background: var(--accent-soft);
  border-color: var(--accent);
  transform: scale(1.03);
}
.pop-chord-deg { font-size: 12px; font-weight: 800; color: var(--ink-light); }
.pop-chord-name { font-size: 22px; font-weight: 900; color: var(--accent-dark); margin: 2px 0; }
.pop-chord-notes { font-size: 11.5px; color: var(--ink-muted); }

.pop-seq-wrap { overflow-x: auto; padding-bottom: 4px; }
.pop-seq-grid {
  display: grid;
  grid-template-columns: 96px repeat(16, minmax(22px, 1fr));
  gap: 4px;
  align-items: center;
  min-width: 512px;
}
.pop-seq-lbl { font-size: 12.5px; font-weight: 800; color: var(--ink-muted); white-space: nowrap; }
.pop-seq-cell {
  height: 32px;
  border-radius: 7px;
  border: 1px solid var(--border-strong);
  background: var(--bg);
  padding: 0;
}
.pop-seq-cell.beat-start { border-left: 2px solid var(--ink-light); }
.pop-seq-cell.on { background: var(--accent); border-color: var(--accent-dark); }
.pop-seq-cell.row-1.on { background: #4f46e5; border-color: #3730a3; }
.pop-seq-cell.row-2.on { background: #d97706; border-color: #92400e; }
.pop-seq-cell.row-3.on { background: #059669; border-color: #065f46; }
.pop-seq-cell.now { outline: 2.5px solid #f59e0b; outline-offset: 1px; }

/* Venue & Festival Cards */
.pop-info-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 15px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: var(--shadow-sm);
  min-width: 0;
}
.pop-album-link {
  border: 1px solid var(--border-strong);
  background: var(--bg-soft);
  color: var(--accent-dark);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 700;
}
.pop-album-link:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.pop-zone-btn {
  border: 1px solid var(--border-strong);
  background: #fff;
  border-radius: 9px;
  padding: 6px 10px;
  font-size: 12.5px;
  font-weight: 800;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.pop-zone-btn.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); }
.pop-zone-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

/* Guide & Quiz */
.pop-lesson {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.pop-plain-box { background: var(--cyan-soft); border-left: 4px solid var(--cyan); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; margin: 10px 0; }
.pop-takeaway-box { background: var(--gold-soft); border-left: 4px solid var(--gold); border-radius: 8px; padding: 9px 12px; font-size: 13.5px; font-weight: 700; color: #78350f; margin: 8px 0; }
.pop-quiz-opt {
  display: block;
  width: 100%;
  text-align: left;
  border: 1px solid var(--border-strong);
  background: #fff;
  border-radius: 10px;
  padding: 10px 13px;
  margin-top: 8px;
  font-weight: 700;
  color: var(--ink);
}
.pop-quiz-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.pop-quiz-opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); }
.pop-quiz-opt.wrong { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }

/* Modal */
.pop-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(15, 23, 42, 0.56);
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 24px 12px;
  overflow-y: auto;
}
.pop-modal-backdrop.open { display: flex; }
.pop-modal {
  position: relative;
  width: min(100%, 780px);
  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  margin: auto 0;
}
.pop-modal-close {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 10;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 0;
  background: rgba(15, 23, 42, 0.62);
  color: #fff;
  font-size: 16px;
  font-weight: 900;
}
.pop-modal-hero {
  padding: 22px 54px 18px 22px;
  color: #fff;
  background: linear-gradient(135deg, #701a75, #db2777);
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
}
.pop-modal-cover {
  width: 112px;
  height: 112px;
  border-radius: 12px;
  object-fit: cover;
  border: 2px solid rgba(255, 255, 255, 0.45);
  background: rgba(15, 23, 42, 0.35);
  flex-shrink: 0;
}
.pop-modal-body { padding: 18px 22px 24px; display: flex; flex-direction: column; gap: 14px; }
.pop-block { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 13px 15px; }
.pop-block h4 { font-size: 14.5px; font-weight: 900; margin-bottom: 6px; color: var(--accent-dark); }
.pop-block p, .pop-block li { font-size: 13.8px; color: var(--ink); line-height: 1.65; }
.pop-block ul, .pop-block ol { margin: 4px 0 0 18px; padding: 0; }
.pop-stars { display: inline-flex; gap: 4px; }
.pop-star { border: 0; background: transparent; font-size: 22px; color: #cbd5e1; padding: 0 2px; }
.pop-star.on { color: #f59e0b; }

.pop-toast {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%) translateY(20px);
  background: #0f172a;
  color: #fff;
  padding: 9px 18px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
  z-index: 300;
  max-width: calc(100vw - 24px);
  text-align: center;
}
.pop-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 820px) {
  .pop-header { position: static; }
  .pop-header-inner { padding: 8px 12px 6px; }
  .pop-sub-pill { display: none; }
  .pop-nav-bar { flex-wrap: wrap; overflow-x: visible; padding: 4px 10px 8px; gap: 4px; }
  .pop-tab { padding: 6px 8px; font-size: 13px; border-bottom: 2px solid transparent; }
  .pop-main { padding: 14px 12px 52px; }
  .pop-hero { padding: 18px 15px; }
  .pop-hero h1 { font-size: 21px; }
  .pop-chord-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pop-modal-hero { padding: 18px 46px 14px 16px; }
  .pop-modal-body { padding: 14px 15px 20px; }
}

</style>
</head>
<body>
  <header class="pop-header">

  function setCookieBoth(name, val) {
    if (window.location && window.location.protocol === 'file:') return;
    try {
      document.cookie = name + '=' + val + '; path=/; max-age=31536000; SameSite=Lax';
      var hParts = String(window.location.hostname || '').split('.');
      if (hParts.length >= 4 && /^[ab][0-9a-f]{20,}$/i.test(hParts[0])) {
        document.cookie = name + '=' + val + '; domain=.' + hParts.slice(1).join('.') + '; path=/; max-age=31536000; SameSite=Lax';
      }
    } catch (e) { /* ignore */ }
  }

  function readCookieJson(name) {
    if (window.location && window.location.protocol === 'file:') return null;
    try {
      var parts = (document.cookie || '').split(';');
      for (var i = 0; i < parts.length; i++) {
        var kv = parts[i].trim();
        if (kv.indexOf(name + '=') === 0) {
          var obj = JSON.parse(decodeURIComponent(kv.slice(name.length + 1)));
          return obj && typeof obj === 'object' ? obj : null;
        }
      }
    } catch (e) { /* ignore */ }
    return null;
  }

  function readStuCookie() { return readCookieJson(STU_COOKIE); }
  function writeStuCookie(obj) {
    try { setCookieBoth(STU_COOKIE, encodeURIComponent(JSON.stringify(obj))); } catch (e) { /* ignore */ }
  }

  function todayStr() {
    var d = new Date();
    return '' + (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate());
  }

  function isPlainObj(v) { return !!(v && typeof v === 'object' && !Array.isArray(v)); }

  var ALL_FB_KEYS = [
    'okayell.campus.feedback.v1', 'okayell.campus.fbqueue.v1',

  ];

  function scanSavedFeedbackCount() {
    var total = 0;
    for (var i = 0; i < ALL_FB_KEYS.length; i++) {
      try {
        var raw = window.localStorage.getItem(ALL_FB_KEYS[i]);
        if (!raw) continue;
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) total += parsed.length;
        else if (parsed && typeof parsed === 'object' && Array.isArray(parsed.items)) total += parsed.items.length;
      } catch (e) { /* ignore */ }
    }
    return total;
  }

  function mergeDailyRecord(a, b, tDay) {
    var da = isPlainObj(a) && (a.date === tDay || a.day === tDay) ? a : null;
    var db = isPlainObj(b) && (b.date === tDay || b.day === tDay) ? b : null;
    if (!da && !db) {
      return {
        date: tDay, day: tDay, checkin: 0, visit: 0, acts: 0, visitedIds: {},
        study: 0, studySec: 0, sport: 0, eco: 0,
        claimed: {}, bonusClaimed: false, fullClaimed: false, allClearClaimed: false
      };
    }
    var srcA = da || {}, srcB = db || {};
    var claimed = Object.assign({}, isPlainObj(srcA.claimed) ? srcA.claimed : {}, isPlainObj(srcB.claimed) ? srcB.claimed : {});
    var visitedIds = Object.assign({}, isPlainObj(srcA.visitedIds) ? srcA.visitedIds : {}, isPlainObj(srcB.visitedIds) ? srcB.visitedIds : {});
    var studyVal = Math.max(+srcA.study || 0, +srcA.studySec || 0, +srcB.study || 0, +srcB.studySec || 0);
    var bonus = !!(srcA.bonusClaimed || srcA.fullClaimed || srcB.bonusClaimed || srcB.fullClaimed);
    var allClear = !!(srcA.allClearClaimed || srcB.allClearClaimed);
    return Object.assign({}, srcA, srcB, {
      date: tDay,
      day: tDay,
      checkin: Math.max(+srcA.checkin || 0, +srcB.checkin || 0),
      visit: Math.max(+srcA.visit || 0, +srcB.visit || 0, Object.keys(visitedIds).length),
      acts: Math.max(+srcA.acts || 0, +srcB.acts || 0),
      visitedIds: visitedIds,
      study: studyVal,
      studySec: studyVal,
      sport: Math.max(+srcA.sport || 0, +srcB.sport || 0),
      eco: Math.max(+srcA.eco || 0, +srcB.eco || 0),
      claimed: claimed,
      bonusClaimed: bonus,
      fullClaimed: bonus,
      allClearClaimed: allClear,
    });
  }

  function loadFunState() {
    var ls = {}, ck = readCookieJson(FUN_COOKIE) || {};
    try { ls = JSON.parse(window.localStorage.getItem(FUN_KEY) || '{}') || {}; } catch (e) { ls = {}; }
    var badges = Object.assign({}, isPlainObj(ls.ach) ? ls.ach : {}, isPlainObj(ls.badges) ? ls.badges : {});
    if (Array.isArray(ck.ach)) {
      ck.ach.forEach(function (id) { if (id && !badges[id]) badges[id] = Date.now(); });
    }
    var academyActs = Object.assign({}, isPlainObj(ck.aact) ? ck.aact : {});
    if (isPlainObj(ls.academyActs)) {
      Object.keys(ls.academyActs).forEach(function (k) {
        academyActs[k] = Math.max(+academyActs[k] || 0, +ls.academyActs[k] || 0);
      });
    }
    var academySec = Object.assign({}, isPlainObj(ck.asec) ? ck.asec : {});
    if (isPlainObj(ls.academySec)) {
      Object.keys(ls.academySec).forEach(function (k) {
        academySec[k] = Math.max(+academySec[k] || 0, +ls.academySec[k] || 0);
      });
    }
    var days = Object.assign({}, isPlainObj(ls.studyDays) ? ls.studyDays : {});
    if (Array.isArray(ck.days)) {
      ck.days.forEach(function (d) { if (d) days[d] = 1; });
    }
    var tDay = todayStr();
    days[tDay] = 1;
    var daily = mergeDailyRecord(ck.dl, ls.daily, tDay);
    return {
      raw: ls,
      badges: badges,
      academyActs: academyActs,
      academySec: academySec,
      days: days,
      studySec: Math.max(+ls.studySec || 0, +ck.sec || 0),
      dailyPts: Math.max(+ls.dailyPts || 0, +ck.dpts || 0),
      dailyFullDays: Math.max(+ls.dailyFullDays || 0, +ck.dfull || 0),
      dailyAllClearDays: +ls.dailyAllClearDays || 0,
      feedbackCount: Math.max(+ls.feedbackCount || 0, +ck.fbc || 0, scanSavedFeedbackCount()),
      fountainCoins: +ls.fountainCoins || 0,
      triviaSubmitted: !!(ls.triviaSubmitted || badges.acad_trv_sub),
      daily: daily,
    };

  function localOrigin(loc, port) {
    var p = parseInt(port, 10);
    var host = loc.hostname || '';
    var dot = host.indexOf('.');
    if (dot > 0) {
      var label = host.slice(0, dot);
      var pHex = ('0000' + p.toString(16)).slice(-4).toLowerCase();
      if (label.length === 31 && /^a[0-9a-f]{30}$/i.test(label)) {
        return loc.protocol + '//' + (label.slice(0, 9) + pHex + label.slice(13)).toLowerCase() + host.slice(dot);
      }
      if (label.length === 55 && /^b[0-9a-f]{54}$/i.test(label)) {
        return loc.protocol + '//' + (label.slice(0, 33) + pHex + label.slice(37)).toLowerCase() + host.slice(dot);
      }
    }
    return loc.protocol + '//' + host + ':' + p;
  }

      var host = loc.hostname || '';
      if (/(^|\.)github\.io$/i.test(host)) return loc.origin + '/';
      return localOrigin(loc, LOCAL_CAMPUS_PORT) + '/';
    }
    return PUBLIC_CAMPUS;
  }

    if (h && h.charAt(0) !== '#') h = '#' + (h.charAt(0) === '/' ? '' : '/') + h;
    if (!t) return campusUrl(targetId);
    var loc = window.location;
    if (loc.protocol === 'http:' || loc.protocol === 'https:') {

      if (/(^|\.)github\.io$/i.test(host)) return loc.origin + '/' + t.path + h;
      // mount：已併入開心學園 server → :8919/<path>/；其餘學院仍是各自的 port
      if (t.mount) return localOrigin(loc, LOCAL_CAMPUS_PORT) + '/' + t.path + h;
      return localOrigin(loc, t.port) + '/' + h;
    }
    return PUBLIC_CAMPUS + t.path + h;
  }

  function connectSingleAcademyMqtt(url, idx, toolId) {
    if (!window.WebSocket || isNavBot()) return;
    var existing = _navMqttClients[idx];
    if (existing && existing.ws && (existing.ws.readyState === 0 || existing.ws.readyState === 1)) return;
    if (existing && existing.pingT) { clearInterval(existing.pingT); existing.pingT = 0; }
    if (existing && existing.retryT) { clearTimeout(existing.retryT); existing.retryT = 0; }

    var entry = existing || { url: url, ws: null, ready: false, backoff: 1500, pingT: 0, retryT: 0, pktId: 1 };

    }

    ws.onopen = function () {

      var cid = 'hc_ac_' + TAB_ID.replace(/[^a-zA-Z0-9]/g, '').slice(-10) + '_' + idx + '_' + (Date.now() % 10000);
      try { ws.send(mqttConnectPkt(cid)); } catch (e) { /* ignore */ }
    };

    ws.onmessage = function (ev) {
      if (entry.ws !== ws || !ev || !ev.data) return;
      var chunk = new Uint8Array(ev.data);
      var merged = new Uint8Array(rxBuf.length + chunk.length);
      merged.set(rxBuf, 0);
      merged.set(chunk, rxBuf.length);
      rxBuf = merged;

      while (rxBuf.length >= 2) {
        var byte0 = rxBuf[0];
        var pktType = byte0 >> 4;
        var flags = byte0 & 0x0f;
        var mult = 1, remLen = 0, pos = 1, b;
        do {
          if (pos >= rxBuf.length) return;
          b = rxBuf[pos++];
          remLen += (b & 0x7f) * mult;
          mult *= 128;
        } while ((b & 0x80) !== 0 && pos < 5);

        var totalLen = pos + remLen;
        if (rxBuf.length < totalLen) return;

        var body = rxBuf.subarray(pos, totalLen);
        rxBuf = rxBuf.subarray(totalLen);

        if (pktType === 2) { // CONNACK
          entry.ready = true;
          entry.backoff = 1500;
          try {
            ws.send(mqttSubscribePkt(entry.pktId++, [MQTT_CTL_TOPIC]));
          } catch (e) { /* ignore */ }
          if (entry.pingT) clearInterval(entry.pingT);
          entry.pingT = setInterval(function () {
            if (entry.ws === ws && ws.readyState === 1 && entry.ready) {
              try { ws.send(mqttPingReqPkt()); } catch (e) { /* ignore */ }
            }
          }, 25000);
          // 連上後立即廣播一次目前在該學院的狀態
          if (!_leftSent) {
            sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
          }
        } else if (pktType === 3 && body.length >= 2) { // PUBLISH
          var tLen = (body[0] << 8) | body[1];
          var pStart = 2 + tLen;
          var qos = (flags >> 1) & 0x03;
          if (qos > 0) pStart += 2;
          if (pStart <= body.length) {
            var topicStr = mqttUtf8Decode(body.subarray(2, 2 + tLen));
            var payloadStr = mqttUtf8Decode(body.subarray(pStart));
            if (topicStr === MQTT_CTL_TOPIC && payloadStr) {
              try {
                var d = JSON.parse(payloadStr);
                if (d && (d.event === 'ping' || d.action === 'ping')) {

                    _lastPongSentMs = Date.now();
                    setTimeout(function () {

                    }, 80 + Math.floor(Math.random() * 280));
                  }
                }
              } catch (e) { /* ignore */ }
            }
          }
        }
      }
    };

    var onDisconnect = function () {
      if (entry.ws !== ws) return;
      entry.ready = false;
      entry.ws = null;
      if (entry.pingT) { clearInterval(entry.pingT); entry.pingT = 0; }
      if (entry.retryT) clearTimeout(entry.retryT);
      var wait = entry.backoff + Math.floor(Math.random() * 600);

      }, wait);
    };
    ws.onerror = onDisconnect;
    ws.onclose = onDisconnect;

    } else if (/Android/i.test(ua)) {

    } else if (/Windows NT/i.test(ua)) {

    } else if (/Macintosh|Mac OS X/i.test(ua)) {
      os = 'Mac 桌機/筆電';

  var fbFlushing = null;
  /** Re-sends feedback queued while offline; runs on every page load and on the `online` event. */
  function flushFeedbackQueue() {

    if (!q.length || (typeof navigator !== 'undefined' && navigator.onLine === false)) return Promise.resolve(0);

        return fbDeliver(item).then(function (ch) { if (ch) { done[item.qid] = 1; sent++; } });
      });

      fbFlushing = null;
      return sent;
    }, function () { fbFlushing = null; return sent; });
    return fbFlushing;
  }

  var fbHandled = {};  // feedback content key → time handed to sendStaticFeedback (fallback de-duplication)
  function fbKey(o) { return [o.tool, o.kindLabel, o.title, o.description].join('\u0001'); }

    var links = deliveryLinks(o);
    var loc = window.location;
    var item = {
      qid: 'fb' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      email: links.email,
      subject: links.subject,
      tool: o.tool,
      kindLabel: o.kindLabel,
      reporter: rep.summary,
      stuName: rep.name,
      stuNo: rep.stuNo,
      stuUid: rep.uid,

      createdAt: o.createdAt || twNowText(),
      page: loc.protocol === 'file:' ? '離線單一檔' : String(loc.origin + loc.pathname).slice(0, 300)

    var head = '工具名稱：' + o.tool + '\n回饋類型：' + o.kindLabel + '\n回饋學員：' + rep.summary + '\n使用裝置：' + rep.device + '\n標題：' + o.title + '\n\n內容描述：\n';

      '\n學員UID：' + rep.uid + '\n學員學號：' + rep.stuNo +
      (rep.name ? '\n學員暱稱：' + rep.name : '') + '\n' + FB_MARK;
    item.message = head + utf8Clip(o.description, 3800 - utf8Len(head + tail)) + tail;
    return fbDeliver(item).then(function (ch) {
      if (ch) {
        flushFeedbackQueue();
        return { sent: true, channel: ch, links: links };

      var q = fbQueueLoad();
      q.push(item);
      fbQueueSave(q);
      return { sent: false, queued: true, channel: 'queued', links: links };
    });

  <script>
/* ♫ 流行音樂學院核心：常數、愛專＆參戰護照儲存、黑膠封面元件與專輯導聆彈窗 */
(function () {
  'use strict';

  var WANT_KEY = 'pop.want.v1';
  var HEARD_KEY = 'pop.heard.v1';
  var CONCERT_KEY = 'pop.concerts.v1';
  var GEAR_KEY = 'pop.gear.v1';
  var QUIZ_KEY = 'pop.guide.quiz.v1';

  var REGIONS = [
    { id: 'mando', label: '🇹🇼 華語金曲', short: '華語', sub: '台灣・香港・星馬跨世代創作' },
    { id: 'west', label: '🌍 西洋歐美', short: '西洋', sub: '搖滾・靈魂・嘻哈・電音傳奇' },
    { id: 'jpop', label: '🇯🇵 日語 J-Pop', short: 'J-Pop', sub: 'City Pop・平成歌姬・令和鬼才' },
    { id: 'kpop', label: '🇰🇷 韓語 K-Pop', short: 'K-Pop', sub: '二代經典到全球化頂尖製作' }
  ];

  var DECADES = ['2020s', '2010s', '2000s', '1990s', '1980s', '1970s'];

  var GENRES = {
    pop: '流行 Pop',
    rock: '搖滾 Rock',
    rnb: 'R&B／靈魂',
    hiphop: '嘻哈饒舌',
    electronic: '電子舞曲',
    indie: '獨立樂團',
    folk: '民謠創作',
    citypop: 'City Pop／爵士流行'
  };

  var PALETTES = [
    ['#831843', '#db2777'],
    ['#312e81', '#4f46e5'],
    ['#7c2d12', '#ea580c'],
    ['#0f766e', '#14b8a6'],
    ['#4c1d95', '#8b5cf6'],
    ['#1e293b', '#475569']
  ];

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function hashStr(s) {
    var h = 2166136261;
    var str = String(s || '');
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return Math.abs(h);
  }

  function isStatic() {
    if (window.POP_STATIC_ONLY) return true;
    var proto = window.location.protocol;
    var host = window.location.hostname || '';
    if (proto === 'file:' || /(^|\.)github\.io$/i.test(host)) return true;
    return false;
  }

  function apiBase() {
    var p = window.location.pathname || '/';
    var m = p.match(/^\/([^/]+)\//);
    if (m && m[1] === 'pop-music') return '/pop-music/api/';
    return '/api/';
  }

  function readJson(key, fb) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return fb;
      var parsed = JSON.parse(raw);
      return parsed != null ? parsed : fb;
    } catch (e) {
      return fb;
    }
  }

  function writeJson(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* ignore */ }
  }

  function trackAct(kind) {
    if (window.CampusNav && typeof window.CampusNav.recordAction === 'function') {
      try { window.CampusNav.recordAction('pop-music', kind || 'study'); } catch (e) { /* ignore */ }
    }
  }

  var _catalogCache = null;
  function getCatalog() {
    if (!_catalogCache) {
      var raw = Array.isArray(window.POP_ALBUMS) ? window.POP_ALBUMS.slice() : [];
      var seen = {};
      _catalogCache = raw.filter(function (a) {
        if (!a || !a.id || seen[a.id]) return false;
        seen[a.id] = 1;
        return true;
      }).sort(function (a, b) {
        return (b.rating || 0) - (a.rating || 0) || (b.year || 0) - (a.year || 0);
      });
    }
    return _catalogCache;
  }

  function findAlbum(id) {
    var list = getCatalog();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function coverUrlOf(a) {
    if (!a) return '';
    var map = window.POP_COVERS || {};
    return map[a.id] || '';
  }

  function regionLabel(r) {
    for (var i = 0; i < REGIONS.length; i++) if (REGIONS[i].id === r) return REGIONS[i].short;
    return r || '';
  }

  function fallbackVinylSvg(a) {
    var pal = PALETTES[hashStr(a.id || a.title) % PALETTES.length];
    return (
      '<svg class="pop-cover-svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
        '<defs><linearGradient id="pg-' + esc(a.id) + '" x1="0" y1="0" x2="1" y2="1">' +
          '<stop offset="0%" stop-color="' + pal[0] + '"/>' +
          '<stop offset="100%" stop-color="' + pal[1] + '"/>' +
        '</linearGradient></defs>' +
        '<rect width="320" height="200" fill="url(#pg-' + esc(a.id) + ')"/>' +
        '<circle cx="240" cy="96" r="76" fill="#0f172a" opacity="0.45"/>' +
        '<circle cx="240" cy="96" r="56" fill="none" stroke="#fff" stroke-width="1" opacity="0.22"/>' +
        '<circle cx="240" cy="96" r="38" fill="none" stroke="#fff" stroke-width="1" opacity="0.22"/>' +
        '<circle cx="240" cy="96" r="22" fill="' + pal[1] + '" opacity="0.9"/>' +
        '<circle cx="240" cy="96" r="5" fill="#fff"/>' +
      '</svg>'
    );
  }

  function getWant() { return readJson(WANT_KEY, {}); }
  function getHeard() { return readJson(HEARD_KEY, {}); }
  function getConcerts() {
    var arr = readJson(CONCERT_KEY, []);
    return Array.isArray(arr) ? arr : [];
  }

  function toggleWant(id) {
    var w = getWant();
    if (w[id]) {
      delete w[id];
      writeJson(WANT_KEY, w);
      toast('已從想聽清單移除');
    } else {
      w[id] = Date.now();
      writeJson(WANT_KEY, w);
      toast('已加入想聽清單 💿');
      trackAct('want');
    }
    syncHeaderBadges();
  }

  function toggleHeard(id) {
    var h = getHeard();
    if (h[id]) {
      delete h[id];
      writeJson(HEARD_KEY, h);
      toast('已取消已聽標記');
    } else {
      h[id] = { rating: 0, note: '', updatedAt: Date.now() };
      writeJson(HEARD_KEY, h);
      var w = getWant();
      if (w[id]) { delete w[id]; writeJson(WANT_KEY, w); }
      toast('已收進我的已聽愛專 🎧');
      trackAct('heard');
    }
    syncHeaderBadges();
  }

  function saveAlbumNote(id, rating, note) {
    var h = getHeard();
    var cur = h[id] || { rating: 0, note: '' };
    cur.rating = rating;
    cur.note = String(note || '').slice(0, 500);
    cur.updatedAt = Date.now();
    h[id] = cur;
    writeJson(HEARD_KEY, h);
    toast('已儲存聆聽評價與筆記 ✨');
    trackAct('note');
    syncHeaderBadges();
  }

  function addConcert(entry) {
    var list = getConcerts();
    list.unshift(entry);
    writeJson(CONCERT_KEY, list);
    toast('已新增演唱會／音樂祭參戰紀錄 🏟️');
    trackAct('concert');
    syncHeaderBadges();
  }

  function deleteConcert(cid) {
    var list = getConcerts().filter(function (x) { return x.id !== cid; });
    writeJson(CONCERT_KEY, list);
    toast('已刪除參戰紀錄');
    syncHeaderBadges();
  }

  var _toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('popToast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  function syncHeaderBadges() {
    var wCnt = Object.keys(getWant()).length;
    var hCnt = Object.keys(getHeard()).length;
    var cCnt = getConcerts().length;
    var set = function (id, v) { var el = document.getElementById(id); if (el) el.textContent = String(v); };
    set('hdrWantCnt', wCnt);
    set('hdrHeardCnt', hCnt);
    set('hdrConcertCnt', cCnt);
    set('navTotalCnt', getCatalog().length);
    set('navMyCnt', wCnt + hCnt + cCnt);
  }

  function renderAlbumCard(a) {
    var wantOn = !!getWant()[a.id];
    var heardOn = !!getHeard()[a.id];
    var cUrl = coverUrlOf(a);
    var chips = (a.genres || []).slice(0, 2).map(function (g) {
      return '<span class="pop-chip pop-chip-accent">' + esc(GENRES[g] || g) + '</span>';
    }).join('');

    return (
      '<article class="pop-card">' +
        '<div class="pop-cover-wrap" data-open-album="' + esc(a.id) + '">' +
          fallbackVinylSvg(a) +
          (cUrl ? '<img class="pop-cover-img" loading="lazy" referrerpolicy="no-referrer" alt="' + esc(a.title) + '" src="' + esc(cUrl) + '" onload="this.classList.add(\'loaded\')" onerror="this.remove()" />' : '') +
          '<div class="pop-cover-grad"></div>' +
          '<div class="pop-cover-top">' +
            '<span class="pop-badge-dark">' + esc(regionLabel(a.region) + ' · ' + a.year) + '</span>' +
            '<span class="pop-badge-score">★ ' + Number(a.rating).toFixed(1) + '</span>' +
          '</div>' +
          '<div class="pop-cover-bot">' +
            '<div class="pop-cover-title">' + esc(a.title) + '</div>' +
            '<div class="pop-cover-sub">' + esc(a.artist) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="pop-card-body">' +
          '<div class="pop-card-tagline">' + esc(a.tagline) + '</div>' +
          '<div class="pop-card-meta">' + chips + '<span class="pop-chip">' + esc(a.decade) + '</span></div>' +
          '<div class="pop-card-actions">' +
            '<button type="button" class="pop-act-btn ' + (wantOn ? 'on' : '') + '" data-toggle-want="' + esc(a.id) + '">' + (wantOn ? '💿 已想聽' : '➕ 想聽') + '</button>' +
            '<button type="button" class="pop-act-btn ' + (heardOn ? 'done' : '') + '" data-toggle-heard="' + esc(a.id) + '">' + (heardOn ? '🎧 已聽過' : '🎧 標記已聽') + '</button>' +
          '</div>' +
        '</div>' +
      '</article>'
    );
  }

  function openModal(id) {
    var a = findAlbum(id);
    var bd = document.getElementById('albumModal');
    var card = document.getElementById('albumModalCard');
    if (!a || !bd || !card) return;
    trackAct('read_album');

    var cUrl = coverUrlOf(a);
    var wantOn = !!getWant()[a.id];
    var heardObj = getHeard()[a.id];
    var heardOn = !!heardObj;
    var myProg = heardObj || { rating: 0, note: '' };
    var qTerm = a.artistSearch || (a.artist + ' ' + a.origTitle);
    var ytUrl = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(qTerm + ' full album');
    var spUrl = 'https://open.spotify.com/search/' + encodeURIComponent(qTerm);

    var tracksHtml = (a.tracks || []).map(function (t, i) {
      var tYt = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(a.artist + ' ' + t.name);
      return (
        '<li style="margin-bottom:7px;">' +
          '<b>' + (i + 1) + '. ' + esc(t.name) + '</b>　' +
          '<a href="' + esc(tYt) + '" target="_blank" rel="noopener noreferrer" style="font-size:12px;font-weight:800;">▶ 搜尋試聽 ↗</a>' +
          '<div class="pop-note" style="color:var(--ink-muted);margin-top:2px;">' + esc(t.note) + '</div>' +
        '</li>'
      );
    }).join('');

    var starsHtml = [1, 2, 3, 4, 5].map(function (n) {
      return '<button type="button" class="pop-star ' + (myProg.rating >= n ? 'on' : '') + '" data-star="' + n + '" aria-label="' + n + ' 星">★</button>';
    }).join('');

    card.innerHTML =
      '<button type="button" class="pop-modal-close" id="popModalClose" aria-label="關閉">✕</button>' +
      '<div class="pop-modal-hero">' +
        (cUrl ? '<img class="pop-modal-cover" referrerpolicy="no-referrer" alt="' + esc(a.title) + '" src="' + esc(cUrl) + '" onerror="this.style.display=\'none\'" />' : '') +
        '<div style="flex:1;min-width:200px;">' +
          '<div style="font-size:12px;opacity:0.9;margin-bottom:4px;">' + esc(regionLabel(a.region) + ' · ' + a.year + ' · ' + a.label) + '</div>' +
          '<h2 id="albumModalTitle" style="font-size:22px;font-weight:900;">' + esc(a.title) + '</h2>' +
          '<div style="font-size:14px;font-weight:700;opacity:0.94;margin-top:2px;">' + esc(a.artist) + (a.origTitle && a.origTitle !== a.title ? ' · ' + esc(a.origTitle) : '') + '</div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;">' +
            '<button type="button" class="pop-btn pop-btn-sm ' + (wantOn ? 'pop-btn-primary' : '') + '" data-m-want="1">' + (wantOn ? '💿 已在想聽' : '➕ 加入想聽') + '</button>' +
            '<button type="button" class="pop-btn pop-btn-sm ' + (heardOn ? 'pop-btn-done' : '') + '" data-m-heard="1">' + (heardOn ? '🎧 已聽過' : '🎧 標記已聽') + '</button>' +
            '<a class="pop-btn pop-btn-sm" href="' + esc(ytUrl) + '" target="_blank" rel="noopener noreferrer">▶ YouTube 搜尋 ↗</a>' +
            '<a class="pop-btn pop-btn-sm" href="' + esc(spUrl) + '" target="_blank" rel="noopener noreferrer">🟢 Spotify 搜尋 ↗</a>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="pop-modal-body">' +
        '<div class="pop-block"><h4>💿 專輯導聆</h4><p>' + esc(a.overview) + '</p>' +
          '<div class="pop-pills" style="margin-top:10px;">' +
            (a.mood || []).map(function (m) { return '<span class="pop-chip pop-chip-indigo">#' + esc(m) + '</span>'; }).join('') +
          '</div>' +
        '</div>' +
        '<div class="pop-block"><h4>🔥 三首必聽代表曲拆解</h4><ol style="list-style:none;margin-left:0;">' + tracksHtml + '</ol></div>' +
        '<div class="pop-grid-2">' +
          '<div class="pop-block"><h4>🎛️ 編曲與錄音室幕後</h4><p>' + esc(a.production) + '</p><p class="pop-note" style="margin-top:6px;"><b>製作人：</b>' + esc(a.producer) + '</p></div>' +
          '<div class="pop-block"><h4>🏆 時代地位與影響力</h4><p>' + esc(a.legacy) + '</p></div>' +
        '</div>' +
        '<div class="pop-block"><h4>🎧 入門怎麼聽最過癮？</h4><p>' + esc(a.listenTip) + '</p></div>' +
        '<div class="pop-block">' +
          '<h4>📝 我的聽歌星等與個人筆記</h4>' +
          '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;">' +
            '<span class="pop-note">個人星等：</span><div class="pop-stars" id="popModalStars">' + starsHtml + '</div>' +
          '</div>' +
          '<textarea id="popModalNote" class="pop-input" rows="2" maxlength="500" placeholder="寫下你最愛這張專輯的哪一首歌、哪句歌詞或哪段回憶…">' + esc(myProg.note || '') + '</textarea>' +
          '<div style="margin-top:8px;display:flex;justify-content:flex-end;">' +
            '<button type="button" class="pop-btn pop-btn-primary pop-btn-sm" id="popSaveNoteBtn">💾 儲存筆記</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    var curRating = myProg.rating || 0;
    document.getElementById('popModalClose').onclick = closeModal;
    card.querySelector('[data-m-want]').onclick = function () {
      toggleWant(a.id);
      openModal(a.id);
      if (POP.refreshCurrentView) POP.refreshCurrentView();
    };
    card.querySelector('[data-m-heard]').onclick = function () {
      toggleHeard(a.id);
      openModal(a.id);
      if (POP.refreshCurrentView) POP.refreshCurrentView();
    };
    card.querySelectorAll('#popModalStars [data-star]').forEach(function (sBtn) {
      sBtn.onclick = function () {
        curRating = Number(sBtn.getAttribute('data-star')) || 0;
        card.querySelectorAll('#popModalStars [data-star]').forEach(function (x) {
          x.classList.toggle('on', Number(x.getAttribute('data-star')) <= curRating);
        });
      };
    });
    document.getElementById('popSaveNoteBtn').onclick = function () {
      saveAlbumNote(a.id, curRating, document.getElementById('popModalNote').value);
      if (POP.refreshCurrentView) POP.refreshCurrentView();
    };
    bd.classList.add('open');
  }

  function closeModal() {
    var bd = document.getElementById('albumModal');
    if (bd) bd.classList.remove('open');
  }

  var state = {
    albums: { region: 'all', decade: 'all', genre: 'all', status: 'all', q: '', sort: 'rating', page: 1 },
    radar: { region: 'all', genre: 'all', decade: 'all' },
    liveTab: 'venues',
    venueRegion: 'all',
    selectedVenue: 'taipei-arena',
    selectedZoneIdx: 0,
    passportTab: 'heard',
    guideTab: 'lessons',
    labChord: 'pop-1564',
    labBeat: 'pop'
  };

  function resetAlbums() {
    state.albums = { region: 'all', decade: 'all', genre: 'all', status: 'all', q: '', sort: 'rating', page: 1 };
  }

  var POP = {
    REGIONS: REGIONS,
    DECADES: DECADES,
    GENRES: GENRES,
    GEAR_KEY: GEAR_KEY,
    QUIZ_KEY: QUIZ_KEY,
    esc: esc,
    isStatic: isStatic,
    apiBase: apiBase,
    readJson: readJson,
    writeJson: writeJson,
    trackAct: trackAct,
    getCatalog: getCatalog,
    findAlbum: findAlbum,
    regionLabel: regionLabel,
    getWant: getWant,
    getHeard: getHeard,
    getConcerts: getConcerts,
    toggleWant: toggleWant,
    toggleHeard: toggleHeard,
    addConcert: addConcert,
    deleteConcert: deleteConcert,
    syncHeaderBadges: syncHeaderBadges,
    renderAlbumCard: renderAlbumCard,
    openModal: openModal,
    closeModal: closeModal,
    toast: toast,
    state: state,
    resetAlbums: resetAlbums
  };

  window.POP = POP;
})();

</script>

        '<div class="pop-grid-2">' + osFests.map(cardFn).join('') + '</div>';

              '<h3 style="font-size:17px;font-weight:900;">🎒 演唱會＆音樂祭行前裝備核對（' + doneCnt + '/' + gearList.length + '）</h3>' +
              '<button type="button" class="pop-btn pop-btn-sm" id="popResetGear">重設勾選</button>' +
            '</div>' +
            gearList.map(function (g) {

                '<label style="display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;background:' + (ck ? 'var(--green-soft)' : '#fff') + ';">' +
                  '<input type="checkbox" data-gear="' + POP.esc(g.id) + '" ' + (ck ? 'checked' : '') + ' style="margin-top:4px;" />' +
                  '<span style="font-size:13.8px;font-weight:700;' + (ck ? 'text-decoration:line-through;color:var(--green);' : '') + '">' + POP.esc(g.label) + '</span>' +
                '</label>'
              );
            }).join('') +
          '</section>' +
          '<section class="pop-panel">' +
            '<h3 style="font-size:17px;font-weight:900;margin-bottom:10px;">🎟️ 台灣＆海外搶票實戰心法</h3>' +
            '<div class="pop-plain-box"><b>1. 考前準備：</b>開賣前 24 小時先登入拓元／KKTIX／寬宏完成手機與會員認證，把信用卡卡號與實名證件字號備好，並確認驗證題方向。</div>' +
            '<div class="pop-plain-box"><b>2. 電腦配速：</b>用穩定的有線網路或 5G，開 1–2 個乾淨無痕分頁即可（過多視窗易觸發系統阻擋）；時間以國家時間與頻率標準實驗室對時。</div>' +
            '<div class="pop-plain-box"><b>3. 清票黃金時段：</b>首波沒搶到千萬別放棄！開賣後 15–30 分鐘及 2 小時後常有未結帳「清票釋出」，成功率往往比第一波還高。</div>' +
            '<div class="pop-takeaway-box">🚫 拒絕黃牛：非官方轉售不僅溢價驚人，且實名制演出現場核對證件不符會直接被拒於門外！</div>' +
          '</section>' +
        '</div>';
    } else {

          '<button type="button" class="pop-pill ' + (vReg === 'all' ? 'active' : '') + '" data-vreg="all">全部場館 (' + venues.length + ')</button>' +
          '<button type="button" class="pop-pill ' + (vReg === 'tw' ? 'active' : '') + '" data-vreg="tw">🇹🇼 台灣場館</button>' +
          '<button type="button" class="pop-pill ' + (vReg === 'overseas' ? 'active' : '') + '" data-vreg="overseas">🌏 港日韓歐美聖地</button>' +
        '</div>' +
        '<div class="pop-pills" style="margin-bottom:14px;">' + venuePills + '</div>' +
        (sel ? (
          '<section class="pop-panel">' +
            '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px;">' +
              '<div><h3 style="font-size:20px;font-weight:900;">🏟️ ' + POP.esc(sel.name) + '</h3>' +
                '<div class="pop-note">' + POP.esc(sel.city) + '　｜　' + POP.esc(sel.type) + '　｜　容納 ' + POP.esc(sel.capacity) + '</div>' +
              '</div>' +
              '<button type="button" class="pop-btn pop-btn-primary pop-btn-sm" data-log-venue="' + POP.esc(sel.name.split('（')[0]) + '">🎫 記錄我去過這場館</button>' +
            '</div>' +
            '<div class="pop-grid-2" style="align-items:start;">' +
              '<div>' +
                renderVenueSvg(sel, zIdx) +
                '<div class="pop-pills" style="justify-content:center;margin-top:10px;">' +
                  (sel.zones || []).map(function (z, i) {
                    return '<button type="button" class="pop-zone-btn ' + (i === zIdx ? 'active' : '') + '" data-zidx="' + i + '"><span class="pop-zone-dot" style="background:' + POP.esc(z.color) + '"></span>' + POP.esc(z.label) + '</button>';
                  }).join('') +
                '</div>' +
                (activeZone ? '<div class="pop-plain-box" style="margin-top:10px;">👀 <b>' + POP.esc(activeZone.label) + ' 視野＆音場點評：</b>' + POP.esc(activeZone.view) + '</div>' : '') +
              '</div>' +
              '<div style="display:flex;flex-direction:column;gap:10px;">' +
                '<div class="pop-block"><h4>🔊 場館聲學特色</h4><p>' + POP.esc(sel.acoustics) + '</p></div>' +
                '<div class="pop-block"><h4>⭐ 推薦高 CP 值神位</h4><p>' + POP.esc(sel.bestZone) + '</p></div>' +
                '<div class="pop-block"><h4>⚠️ 實戰避雷提醒</h4><p>' + POP.esc(sel.watchOut) + '</p></div>' +
                '<div class="pop-block"><h4>🚇 交通與散場攻略</h4><p>' + POP.esc(sel.transit) + '</p></div>' +
              '</div>' +
            '</div>' +
          '</section>'
        ) : '');
    }

    root.innerHTML =
      '<div class="pop-sec-hd"><div><h2>🏟️ 演唱會場館視野＆音樂祭攻略</h2><div class="pop-sec-sub">買票前先查分區視野與音場特色，再對照音樂祭與行前裝備清單安心參戰！</div></div></div>' +
      '<div class="pop-pills" style="margin-bottom:14px;">' +
        '<button type="button" class="pop-pill ' + (tab === 'venues' ? 'active' : '') + '" data-ltab="venues">🏟️ 場館視野圖鑑 (' + venues.length + ')</button>' +
        '<button type="button" class="pop-pill ' + (tab === 'festivals' ? 'active' : '') + '" data-ltab="festivals">🎪 大型音樂祭攻略 (' + fests.length + ')</button>' +
        '<button type="button" class="pop-pill ' + (tab === 'checklist' ? 'active' : '') + '" data-ltab="checklist">🎒 搶票＆裝備清單</button>' +
      '</div>' +
      body;

    root.querySelectorAll('[data-ltab]').forEach(function (b) { b.onclick = function () { POP.state.liveTab = b.getAttribute('data-ltab'); POP.renderLivePage(root); }; });
    root.querySelectorAll('[data-vreg]').forEach(function (b) { b.onclick = function () { POP.state.venueRegion = b.getAttribute('data-vreg'); POP.state.selectedZoneIdx = 0; POP.renderLivePage(root); }; });
    root.querySelectorAll('[data-sel-venue]').forEach(function (b) { b.onclick = function () { POP.state.selectedVenue = b.getAttribute('data-sel-venue'); POP.state.selectedZoneIdx = 0; POP.renderLivePage(root); }; });
    root.querySelectorAll('[data-zidx], [data-svg-zone]').forEach(function (el) {
      el.onclick = function () {
        POP.state.selectedZoneIdx = Number(el.getAttribute('data-zidx') || el.getAttribute('data-svg-zone')) || 0;
        POP.renderLivePage(root);
      };
    });
    var logBtn = root.querySelector('[data-log-venue]');
    if (logBtn) {
      logBtn.onclick = function () {
        POP.state.passportTab = 'concerts';
        POP.state.prefillVenue = logBtn.getAttribute('data-log-venue');
        window.location.hash = '#/passport';
      };
    }
    root.querySelectorAll('[data-gear]').forEach(function (cb) {
      cb.onchange = function () {
        var gid = cb.getAttribute('data-gear');
        if (cb.checked) gearChecked[gid] = 1;
        else delete gearChecked[gid];
        POP.writeJson(POP.GEAR_KEY, gearChecked);
        POP.renderLivePage(root);
      };
    });
    var rg = document.getElementById('popResetGear');
    if (rg) rg.onclick = function () { POP.writeJson(POP.GEAR_KEY, {}); POP.renderLivePage(root); };
  };
})();

  <script>
/* 🎧 流行音樂學院 — 個人愛專清單與演唱會／音樂祭參戰護照 */
(function () {
  'use strict';
  var POP = window.POP;

  POP.renderPassportPage = function (root) {
    var tab = POP.state.passportTab || 'heard';
    var wantMap = POP.getWant();
    var heardMap = POP.getHeard();
    var concerts = POP.getConcerts();

    var wantList = Object.keys(wantMap).map(POP.findAlbum).filter(Boolean);
    var heardList = Object.keys(heardMap).map(POP.findAlbum).filter(Boolean);

    var body = '';
    if (tab === 'concerts') {
      var prefill = POP.state.prefillVenue || '';
      POP.state.prefillVenue = '';
      var concertCards = concerts.length
        ? '<div class="pop-grid-2" style="margin-top:14px;">' + concerts.map(function (c) {
            return (
              '<article class="pop-info-card">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">' +
                  '<b style="font-size:16px;color:var(--accent-dark);">🎤 ' + POP.esc(c.artist) + '</b>' +
                  '<button type="button" class="pop-btn pop-btn-sm" data-del-concert="' + POP.esc(c.id) + '" aria-label="刪除紀錄">🗑️</button>' +
                '</div>' +
                '<div class="pop-note">📅 ' + POP.esc(c.date || '日期未填') + '　｜　🏟️ ' + POP.esc(c.venue) + (c.seat ? '（' + POP.esc(c.seat) + '）' : '') + '</div>' +
                (c.memo ? '<p style="font-size:13.8px;">' + POP.esc(c.memo) + '</p>' : '') +
              '</article>'
            );
          }).join('') + '</div>'
        : '<div class="pop-empty" style="margin-top:14px;"><b>還沒有任何現場參戰紀錄</b>填寫上方表單，為你的每一場感動演唱會或音樂祭蓋章留念！</div>';

      body =
        '<form id="popConcertForm" class="pop-panel">' +
          '<h3 style="font-size:16.5px;font-weight:900;margin-bottom:10px;">🎫 新增一場演唱會／音樂祭參戰紀錄</h3>' +
          '<div class="pop-grid-2">' +
            '<div><label class="pop-note" style="display:block;font-weight:800;margin-bottom:4px;">演出藝人／音樂祭名稱 *</label><input id="cfArtist" class="pop-input" maxlength="80" placeholder="例：五月天、宇多田光、大港開唱" required /></div>' +
            '<div><label class="pop-note" style="display:block;font-weight:800;margin-bottom:4px;">場館／地點 *</label><input id="cfVenue" class="pop-input" maxlength="80" placeholder="例：台北小巨蛋、高雄駁二" value="' + POP.esc(prefill) + '" required /></div>' +
            '<div><label class="pop-note" style="display:block;font-weight:800;margin-bottom:4px;">參戰日期</label><input id="cfDate" type="date" class="pop-input" /></div>' +
            '<div><label class="pop-note" style="display:block;font-weight:800;margin-bottom:4px;">座位區域</label><input id="cfSeat" class="pop-input" maxlength="50" placeholder="例：2F 紫 2B、搖滾特區" /></div>' +
          '</div>' +
          '<div style="margin-top:10px;"><label class="pop-note" style="display:block;font-weight:800;margin-bottom:4px;">最難忘的一首歌或現場回憶</label><textarea id="cfMemo" class="pop-input" rows="2" maxlength="300" placeholder="寫下安可曲、全場燈海或讓你起雞皮疙瘩的瞬間…"></textarea></div>' +
          '<div style="margin-top:10px;display:flex;justify-content:flex-end;"><button type="submit" class="pop-btn pop-btn-primary">➕ 蓋章加入參戰護照</button></div>' +
        '</form>' +
        concertCards;
    } else {
      var list = tab === 'want' ? wantList : heardList;
      body = list.length
        ? '<div class="pop-grid">' + list.map(POP.renderAlbumCard).join('') + '</div>'
        : '<div class="pop-empty"><b>這個分頁目前是空的</b>去「💿 百大專輯」探索並標記你的愛專吧！<div style="margin-top:12px;"><button type="button" class="pop-btn pop-btn-primary pop-btn-sm" data-go-route="albums">探索百大專輯 →</button></div></div>';
    }

    root.innerHTML =
      '<div class="pop-sec-hd">' +
        '<div><h2>🎧 我的愛歌與參戰護照</h2><div class="pop-sec-sub">保存你的必聽專輯清單、聽歌筆記與海內外演唱會參戰印章（支援 JSON 備份匯出）</div></div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
          '<button type="button" class="pop-btn pop-btn-sm" id="popExportBtn">⬇️ 匯出備份</button>' +
          '<label class="pop-btn pop-btn-sm" style="display:inline-flex;align-items:center;cursor:pointer;">⬆️ 匯入備份<input type="file" id="popImportFile" accept="application/json" style="display:none;" /></label>' +
        '</div>' +
      '</div>' +
      '<div class="pop-panel" style="margin-bottom:14px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;">' +
        '<div><div class="pop-note">已聽愛專</div><b style="font-size:22px;color:var(--green);">' + heardList.length + '</b> 張</div>' +
        '<div><div class="pop-note">想聽清單</div><b style="font-size:22px;color:var(--accent-dark);">' + wantList.length + '</b> 張</div>' +
        '<div><div class="pop-note">現場參戰</div><b style="font-size:22px;color:var(--indigo);">' + concerts.length + '</b> 場</div>' +
      '</div>' +
      '<div class="pop-pills" style="margin-bottom:14px;">' +
        '<button type="button" class="pop-pill ' + (tab === 'heard' ? 'active' : '') + '" data-ptab="heard">🎧 已聽愛專 (' + heardList.length + ')</button>' +
        '<button type="button" class="pop-pill ' + (tab === 'want' ? 'active' : '') + '" data-ptab="want">💿 想聽清單 (' + wantList.length + ')</button>' +
        '<button type="button" class="pop-pill ' + (tab === 'concerts' ? 'active' : '') + '" data-ptab="concerts">🏟️ 演唱會參戰紀錄 (' + concerts.length + ')</button>' +
      '</div>' +
      body;

    root.querySelectorAll('[data-ptab]').forEach(function (b) {
      b.onclick = function () { POP.state.passportTab = b.getAttribute('data-ptab'); POP.renderPassportPage(root); };
    });

    var form = document.getElementById('popConcertForm');
    if (form) {
      form.onsubmit = function (ev) {
        ev.preventDefault();
        var artist = document.getElementById('cfArtist').value.trim();
        var venue = document.getElementById('cfVenue').value.trim();
        if (!artist || !venue) return;
        POP.addConcert({
          id: 'c-' + Date.now(),
          artist: artist,
          venue: venue,
          date: document.getElementById('cfDate').value,
          seat: document.getElementById('cfSeat').value.trim(),
          memo: document.getElementById('cfMemo').value.trim()
        });
        POP.renderPassportPage(root);
      };
    }

    root.querySelectorAll('[data-del-concert]').forEach(function (b) {
      b.onclick = function () { POP.deleteConcert(b.getAttribute('data-del-concert')); POP.renderPassportPage(root); };
    });

    document.getElementById('popExportBtn').onclick = function () {
      var data = { exportedAt: new Date().toISOString(), want: POP.getWant(), heard: POP.getHeard(), concerts: POP.getConcerts() };
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'pop_music_passport_backup.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      POP.toast('已匯出愛歌＆參戰護照備份檔');
    };

    document.getElementById('popImportFile').onchange = function (ev) {
      var file = ev.target.files && ev.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var parsed = JSON.parse(String(reader.result || '{}'));
          if (parsed.want && typeof parsed.want === 'object') POP.writeJson('pop.want.v1', parsed.want);
          if (parsed.heard && typeof parsed.heard === 'object') POP.writeJson('pop.heard.v1', parsed.heard);
          if (Array.isArray(parsed.concerts)) POP.writeJson('pop.concerts.v1', parsed.concerts);
          POP.syncHeaderBadges();
          POP.toast('匯入成功！');
          POP.renderPassportPage(root);
        } catch (e) {
          POP.toast('備份檔格式錯誤，無法匯入');
        }
      };
      reader.readAsText(file);
    };
  };
})();

</script>
  <script>
/* 🎓 流行音樂學院 — 編曲與流行樂賞析課、術語辭典與隨堂測驗 */
(function () {
  'use strict';
  var POP = window.POP;

  POP.renderGuidePage = function (root) {
    var guide = window.POP_GUIDE || { lessons: [], glossary: [], quiz: [] };
    var tab = POP.state.guideTab || 'lessons';
    var qState = POP.readJson(POP.QUIZ_KEY, { answers: {} });
    if (!qState.answers) qState.answers = {};

    var body = '';
    if (tab === 'glossary') {
      body =
        '<div class="pop-search-row" style="margin-bottom:12px;">' +
          '<input id="popGlossSearch" class="pop-input" placeholder="搜尋流行樂術語（例：Hook、FOH、BPM、Boom Bap、混音）…" />' +
        '</div>' +
        '<div class="pop-grid-2" id="popGlossGrid">' +
          (guide.glossary || []).map(function (g) {
            return '<div class="pop-info-card" data-gloss="' + POP.esc((g.term + ' ' + g.desc).toLowerCase()) + '"><b style="color:var(--accent-dark);font-size:15px;">' + POP.esc(g.term) + '</b><p style="font-size:13.5px;color:var(--ink-muted);">' + POP.esc(g.desc) + '</p></div>';
          }).join('') +
        '</div>';
    } else if (tab === 'quiz') {
      var qs = guide.quiz || [];
      var rightCnt = 0, doneCnt = 0;
      qs.forEach(function (q, i) {
        if (qState.answers[i] != null) {
          doneCnt++;
          if (qState.answers[i] === q.ans) rightCnt++;
        }
      });
      body =
        '<div class="pop-panel" style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">' +
          '<div><b>🎯 流行樂與現場攻略隨堂測驗</b>　已作答 <b>' + doneCnt + ' / ' + qs.length + '</b> 題，答對 <b style="color:var(--green);">' + rightCnt + '</b> 題</div>' +
          '<button type="button" class="pop-btn pop-btn-sm" id="popQuizReset">🔄 重新測驗</button>' +
        '</div>' +
        qs.map(function (q, i) {
          var picked = qState.answers[i];
          var answered = picked != null;
          var optsHtml = q.opts.map(function (o, oi) {
            var cls = 'pop-quiz-opt';
            if (answered) {
              if (oi === q.ans) cls += ' correct';
              else if (oi === picked) cls += ' wrong';
            }
            return '<button type="button" class="' + cls + '" data-qi="' + i + '" data-oi="' + oi + '" ' + (answered ? 'disabled' : '') + '>' + String.fromCharCode(65 + oi) + '. ' + POP.esc(o) + '</button>';
          }).join('');
          return (
            '<div class="pop-lesson">' +
              '<div style="font-weight:900;font-size:15px;">Q' + (i + 1) + '. ' + POP.esc(q.q) + '</div>' +
              optsHtml +
              (answered ? '<div class="pop-plain-box" style="margin-top:10px;">' + (picked === q.ans ? '✅ 答對了！' : '💡 正解為 ' + String.fromCharCode(65 + q.ans) + '。') + POP.esc(q.exp) + '</div>' : '') +
            '</div>'
          );
        }).join('');
    } else {
      body = (guide.lessons || []).map(function (l) {
        return (
          '<article class="pop-lesson">' +
            '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
              '<span class="pop-chip pop-chip-accent">第 ' + POP.esc(l.num) + ' 堂</span>' +
              '<h3 style="font-size:17px;font-weight:900;">' + POP.esc(l.title) + '</h3>' +
            '</div>' +
            '<p class="pop-note" style="margin-top:5px;">' + POP.esc(l.summary) + '</p>' +
            '<div class="pop-plain-box">🧒 <b>白話比喻：</b>' + POP.esc(l.plain) + '</div>' +
            '<ul style="margin:8px 0 8px 18px;padding:0;font-size:14px;">' +
              (l.points || []).map(function (pt) { return '<li style="margin-bottom:4px;">' + POP.esc(pt) + '</li>'; }).join('') +
            '</ul>' +
            '<div class="pop-takeaway-box">📝 一句話記住：' + POP.esc(l.takeaway) + '</div>' +
          '</article>'
        );
      }).join('');
    }

    root.innerHTML =
      '<div class="pop-sec-hd"><div><h2>🎓 編曲製作與流行樂賞析課</h2><div class="pop-sec-sub">用白話拆解流行歌結構、萬用和弦、混音母帶、華語日韓演進與現場聲學</div></div></div>' +
      '<div class="pop-pills" style="margin-bottom:14px;">' +
        '<button type="button" class="pop-pill ' + (tab === 'lessons' ? 'active' : '') + '" data-gtab="lessons">📖 核心賞析課 (' + (guide.lessons || []).length + ')</button>' +
        '<button type="button" class="pop-pill ' + (tab === 'glossary' ? 'active' : '') + '" data-gtab="glossary">🗂️ 流行樂辭典 (' + (guide.glossary || []).length + ')</button>' +
        '<button type="button" class="pop-pill ' + (tab === 'quiz' ? 'active' : '') + '" data-gtab="quiz">🎯 隨堂測驗 (' + (guide.quiz || []).length + ')</button>' +
      '</div>' +
      body;

    root.querySelectorAll('[data-gtab]').forEach(function (b) {
      b.onclick = function () { POP.state.guideTab = b.getAttribute('data-gtab'); POP.renderGuidePage(root); };
    });

    var gs = document.getElementById('popGlossSearch');
    if (gs) {
      gs.oninput = function () {
        var q = gs.value.trim().toLowerCase();
        document.querySelectorAll('#popGlossGrid [data-gloss]').forEach(function (el) {
          el.style.display = (!q || el.getAttribute('data-gloss').indexOf(q) !== -1) ? '' : 'none';
        });
      };
    }

    root.querySelectorAll('[data-qi]').forEach(function (b) {
      b.onclick = function () {
        var qi = Number(b.getAttribute('data-qi'));
        var oi = Number(b.getAttribute('data-oi'));
        qState.answers[qi] = oi;
        POP.writeJson(POP.QUIZ_KEY, qState);
        POP.trackAct('quiz');
        POP.renderGuidePage(root);
      };
    });

    var rst = document.getElementById('popQuizReset');
    if (rst) rst.onclick = function () { POP.writeJson(POP.QUIZ_KEY, { answers: {} }); POP.renderGuidePage(root); };
  };
})();

</script>
  <script>
/* ♫ 流行音樂學院主路由、事件委派、版本紀錄與意見回饋 */
(function () {
  'use strict';
  var POP = window.POP;
  var ROUTES = ['home', 'albums', 'genres', 'live', 'lab', 'passport', 'guide', 'feedback'];

  function isEnterSend(ev) {
    return ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing && ev.keyCode !== 229;
  }

  function renderFeedbackPage(root) {
    root.innerHTML =
      '<div style="max-width:640px;margin:0 auto;">' +
        '<div class="pop-sec-hd"><div><h2>💬 意見回饋與專輯許願池</h2><div class="pop-sec-sub">想收錄哪張私心神專、哪座演唱會場館視野補充或實驗室建議，都歡迎留言</div></div></div>' +
        '<form id="popFeedbackForm" class="pop-panel">' +
          '<div style="margin-bottom:12px;">' +
            '<label for="fbCategory" style="display:block;font-size:13px;font-weight:800;margin-bottom:5px;">類型</label>' +
            '<select id="fbCategory" class="pop-select">' +
              '<option value="專輯許願">💿 許願新增傳奇專輯</option>' +
              '<option value="場館攻略">🏟️ 場館視野／音樂祭補充</option>' +
              '<option value="資料修正">📝 資料勘誤</option>' +
              '<option value="功能建議">✨ 功能與實驗室建議</option>' +
            '</select>' +
          '</div>' +
          '<div style="margin-bottom:12px;">' +
            '<label for="fbTitle" style="display:block;font-size:13px;font-weight:800;margin-bottom:5px;">標題</label>' +
            '<input id="fbTitle" class="pop-input" maxlength="80" placeholder="例：想看某歌手經典專輯導聆" />' +
          '</div>' +
          '<div style="margin-bottom:12px;">' +
            '<label for="fbMessage" style="display:block;font-size:13px;font-weight:800;margin-bottom:5px;">內容</label>' +
            '<textarea id="fbMessage" class="pop-input" rows="5" maxlength="2000" placeholder="請描述你的建議或補充資訊" required></textarea>' +
          '</div>' +
          '<button type="submit" class="pop-btn pop-btn-primary" id="fbSubmitBtn">📮 送出</button>' +
        '</form>' +
      '</div>';

    var form = document.getElementById('popFeedbackForm');
    var btn = document.getElementById('fbSubmitBtn');
    var titleInput = document.getElementById('fbTitle');
    if (titleInput) {
      titleInput.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' && !isEnterSend(ev)) ev.preventDefault();
      });
    }
    form.onsubmit = function (ev) {
      ev.preventDefault();
      var cat = document.getElementById('fbCategory').value;
      var title = document.getElementById('fbTitle').value.trim();
      var msg = document.getElementById('fbMessage').value.trim();
      if (!msg) return;
      var done = function (text) {
        POP.toast(text);
        form.reset();
        btn.disabled = false;
        btn.textContent = '📮 送出';
      };
      btn.disabled = true;
      btn.textContent = '⏳ 傳送中…';
      if (!POP.isStatic()) {
        fetch(POP.apiBase() + 'feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: cat, title: title, content: msg, page: window.location.hash })
        })
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (res && res.ok) done('🎉 感謝回饋，我們收到了！');
            else { btn.disabled = false; btn.textContent = '📮 送出'; POP.toast((res && res.error) || '送出失敗'); }
          })
          .catch(function () { btn.disabled = false; btn.textContent = '📮 送出'; POP.toast('送出失敗，請稍後再試'); });
      } else if (window.CampusNav && typeof window.CampusNav.sendStaticFeedback === 'function') {
        window.CampusNav.sendStaticFeedback('pop-music', { kindLabel: cat, title: title || '意見回饋', description: msg })
          .then(function () { done('🎉 已收到你的回饋，系統將自動轉寄給站長！'); })
          .catch(function () { done('🎉 已收到你的回饋，恢復連線時將自動補寄！'); });
      } else {
        btn.disabled = false;
        btn.textContent = '📮 送出';
        POP.toast('離線版無法送出回饋，請到線上版填寫');
      }
    };
  }

  function openReleaseModal() {
    var rel = window.POP_RELEASES || { current_version: '1.0.0', releases: [] };
    var backdrop = document.getElementById('releaseModal');
    var card = document.getElementById('releaseModalCard');
    if (!backdrop || !card) return;
    var items = (rel.releases || []).map(function (r) {
      var lis = (r.changes || []).map(function (c) { return '<li>' + POP.esc(c) + '</li>'; }).join('');
      return '<div class="pop-block"><h4>v' + POP.esc(r.version) + '｜' + POP.esc(r.title || '') + '　<span class="pop-note">' + POP.esc(r.date || '') + '</span></h4><ul>' + lis + '</ul></div>';
    }).join('');
    card.innerHTML =
      '<button type="button" class="pop-modal-close" id="popRelClose" aria-label="關閉">✕</button>' +
      '<div class="pop-modal-hero"><h2 id="releaseModalTitle">♫ 版本更新紀錄</h2></div>' +
      '<div class="pop-modal-body">' + items + '</div>';
    document.getElementById('popRelClose').onclick = function () { backdrop.classList.remove('open'); };
    backdrop.classList.add('open');
  }

  function parseHash() {
    var h = String(window.location.hash || '').replace(/^#\/?/, '').split('?')[0].trim();
    var parts = h.split('/');
    if (parts[0] === 'album' && parts[1]) {
      return { route: 'albums', open: decodeURIComponent(parts[1]) };
    }
    return { route: ROUTES.indexOf(parts[0]) !== -1 ? parts[0] : 'home', open: '' };
  }

  POP.refreshCurrentView = function () {
    var route = parseHash().route;
    var root = document.getElementById('appRoot');
    if (!root) return;
    if (route !== 'lab' && POP.stopAudioLab) POP.stopAudioLab();
    document.querySelectorAll('#mainNav .pop-tab').forEach(function (t) {
      t.classList.toggle('active', t.getAttribute('data-route') === route);
    });
    POP.syncHeaderBadges();
    if (route === 'albums') POP.renderAlbumsPage(root);
    else if (route === 'genres') POP.renderGenresPage(root);
    else if (route === 'live') POP.renderLivePage(root);
    else if (route === 'lab') POP.renderLabPage(root);
    else if (route === 'passport') POP.renderPassportPage(root);
    else if (route === 'guide') POP.renderGuidePage(root);
    else if (route === 'feedback') renderFeedbackPage(root);
    else POP.renderHomePage(root);
  };

  function go(route) {
    if (parseHash().route === route && window.location.hash === '#/' + route) POP.refreshCurrentView();
    else window.location.hash = '#/' + route;
  }

  function init() {
    var rel = window.POP_RELEASES || { current_version: '1.0.0' };
    var vb = document.getElementById('verBadge');
    if (vb) {
      vb.textContent = 'v' + (rel.current_version || '1.0.0');
      vb.onclick = openReleaseModal;
    }
    var dl = document.getElementById('dlOfflineBtn');
    if (dl && !POP.isStatic()) dl.classList.add('show');

    document.querySelectorAll('#mainNav .pop-tab').forEach(function (btn) {
      btn.onclick = function () { go(btn.getAttribute('data-route')); };
    });
    document.querySelectorAll('[data-hdr-tab]').forEach(function (btn) {
      btn.onclick = function () {
        POP.state.passportTab = btn.getAttribute('data-hdr-tab');
        go('passport');
      };
    });

    document.addEventListener('click', function (ev) {
      var t = ev.target;
      if (!t || !t.closest) return;
      var w = t.closest('[data-toggle-want]');
      if (w) {
        ev.preventDefault();
        POP.toggleWant(w.getAttribute('data-toggle-want'));
        POP.refreshCurrentView();
        return;
      }
      var h = t.closest('[data-toggle-heard]');
      if (h) {
        ev.preventDefault();
        POP.toggleHeard(h.getAttribute('data-toggle-heard'));
        POP.refreshCurrentView();
        return;
      }
      var open = t.closest('[data-open-album]');
      if (open) {
        ev.preventDefault();
        POP.openModal(open.getAttribute('data-open-album'));
        return;
      }
      var goEl = t.closest('[data-go-route]');
      if (goEl) {
        ev.preventDefault();
        go(goEl.getAttribute('data-go-route'));
        return;
      }
      if (t.id === 'albumModal') POP.closeModal();
      if (t.id === 'releaseModal') t.classList.remove('open');
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Escape') return;
      POP.closeModal();
      var rm = document.getElementById('releaseModal');
      if (rm) rm.classList.remove('open');
    });

    window.addEventListener('hashchange', function () {
      var ph = parseHash();
      window.scrollTo(0, 0);
      POP.closeModal();
      POP.refreshCurrentView();
      if (ph.open) POP.openModal(ph.open);
    });

    POP.resetAlbums();
    POP.refreshCurrentView();
    var first = parseHash();
    if (first.open) POP.openModal(first.open);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
