  function drawStats() {
    var box = document.getElementById('onStats');
    if (box) box.innerHTML = App.statsCardHtml({ unfinished: S.unfinished });
  }

  /** 只讀一次某個路徑（用 watch 模擬；離開頁面時會一併取消）。 */
  function readOnce(path, cb) {
    var done = false;
    var off = null;
    function finish() {
      if (off) { off(); off = null; }
    }
    off = S.backend.watch(path, function (val, err) {
      if (done) return;
      done = true;
      if (off) finish(); else setTimeout(finish, 0); // 有快取時可能在 watch 回傳前就先呼叫
      cb(val, err);
    });
    if (done) finish();
    S.stops.push(function () { done = true; finish(); });
  }

  /**
   * 補記：之前有入座、但離開時還沒分出勝負的對局（例如中途關掉網頁，之後對手宣告獲勝或超時），
   * 進大廳時逐一查房間的最後結果；還在進行的列在戰績卡片上方，方便回去接著下。
   */
  function sweepPending() {
    var st = App.statsLoad();
    var before = Object.keys(st.pending).length;
    var rids = Stats.pendingList(st, Date.now());
    if (rids.length !== before) App.statsSave(st);
    var token = S.token;
    rids.forEach(function (rid) {
      readOnce(gPath(rid), function (val, err) {
        if (token !== S.token || err) return;
        var role = val ? Core.sideOfUid(val, S.uid) : null;
        if (val && role && val.status === 'playing') {
          S.unfinished.push({ rid: rid, name: val[Core.other(role)].name });
        } else if (val && role && val.status === 'over') {
          recordFinished(rid, val, role);
        } else {
          // 房間不見了，或這個瀏覽器的連線身分已經換過：不再追蹤。
          var cur = App.statsLoad();
          if (Stats.dropPending(cur, rid)) App.statsSave(cur);
        }
        drawStats();
      });
    });
  }

  // ------------------------------------------------------------------ 清除舊房間
  // 伺服器沒有排程可以定期清資料，所以由棋手這一端負責：記下自己坐過的房間，
  // 之後每次進大廳抽查幾間，過期的（規則見 Core.purgeReason）就把對局、在線狀態與大廳項目刪掉。
  var SWEEP_PER_VISIT = 10;            // 每次進大廳最多檢查幾間
  var SWEEP_RECHECK_MS = 12 * 3600000; // 同一間房間隔多久再檢查
  var SWEEP_MAX = 400;                 // 本機最多記幾間

  /** 記下我入座過的房間（建立、加入時呼叫）。 */
  function rememberRoom(rid) {
    var p = prefs();
    if (!p.rooms || typeof p.rooms !== 'object') p.rooms = {};
    if (p.rooms[rid] !== undefined) return;
    p.rooms[rid] = 0; // 0 = 還沒檢查過
    var ids = Object.keys(p.rooms);
    if (ids.length > SWEEP_MAX) ids.slice(0, ids.length - SWEEP_MAX).forEach(function (k) { delete p.rooms[k]; });
    App.save(KEY, p);
  }

  function forgetRoom(rid) {
    var p = prefs();
    if (p.rooms && p.rooms[rid] !== undefined) { delete p.rooms[rid]; App.save(KEY, p); }
  }

  /** 把一間過期的房間從伺服器刪掉。只有坐在這間房間的棋手有權限刪除對局。 */
  function purgeRoom(rid, g) {
    var b = S.backend;
    var quiet = function () {};
    if (g.host === S.uid) b.remove(lobbyPath(rid)).catch(quiet);
    // 在線狀態一筆一筆刪：自己的一定刪得掉，對手的要等對局刪除後才有權限，所以排在後面。
    return b.remove(gPath(rid)).then(function () {
      readOnce(pPath(rid), function (val) {
        Object.keys(val || {}).forEach(function (uid) { b.remove(pPath(rid) + '/' + uid).catch(quiet); });
      });
      return true;
    }, function () { return false; });
  }

  function sweepOldRooms() {
    var p = prefs();
    var st = App.statsLoad();
    // 改版前坐過的房間沒有另外記錄：從戰績裡已經記過與還在追蹤的房號補進來。
    var known = (p.rooms && typeof p.rooms === 'object') ? p.rooms : (p.rooms = {});
    var added = false;
    st.rids.concat(Object.keys(st.pending)).forEach(function (rid) {
      if (known[rid] === undefined && !(p.swept && p.swept[rid])) { known[rid] = 0; added = true; }
    });
    if (added) App.save(KEY, p);
    var nowLocal = Date.now();
    var todo = Object.keys(known).filter(function (rid) {
      return Core.normalizeId(rid) === rid && nowLocal - known[rid] > SWEEP_RECHECK_MS;
    }).sort(function (a, c) { return known[a] - known[c]; }).slice(0, SWEEP_PER_VISIT);
    var token = S.token;
    var purged = 0;
    function done(rid, gone) {
      var cur = prefs();
      if (!cur.rooms) cur.rooms = {};
      if (gone) {
        delete cur.rooms[rid];
        // 記下已經處理過的房號，才不會又從戰績裡補回來重查。
        if (!cur.swept || typeof cur.swept !== 'object') cur.swept = {};
        cur.swept[rid] = 1;
        var ks = Object.keys(cur.swept);
        if (ks.length > 800) ks.slice(0, ks.length - 800).forEach(function (k) { delete cur.swept[k]; });
      } else {
        cur.rooms[rid] = Date.now();
      }
      App.save(KEY, cur);
    }
    todo.forEach(function (rid) {
      readOnce(gPath(rid), function (val, err) {
        if (token !== S.token || err) return;
        if (!val) { done(rid, true); return; }             // 已經被對手或自己清掉了
        if (!Core.sideOfUid(val, S.uid)) { done(rid, true); return; } // 連線身分換過，沒有權限刪
        if (!Core.purgeReason(val, S.backend.now())) { done(rid, false); return; }
        // 還沒記進戰績的結果先補記，再刪除。
        if (val.status === 'over') recordFinished(rid, val, Core.sideOfUid(val, S.uid));
        purgeRoom(rid, val).then(function (ok) {
          done(rid, ok);
          if (!ok) return;
          purged++;
          var cur = App.statsLoad();
          if (Stats.dropPending(cur, rid)) App.statsSave(cur);
          var msg = document.getElementById('onPurgeMsg');
          if (msg) msg.textContent = '這次已自動清除 ' + purged + ' 間過期的舊房間。';
        });
      });
    });
  }

  function createRoom(opts) {
    var rid = Core.randomId();
    var g = Core.createRoom({
      uid: S.uid, name: myName(), side: opts.side, tc: opts.tc, pub: opts.pub, ts: S.backend.ts(),
    });
    return S.backend.set(gPath(rid), g).then(function () { rememberRoom(rid); return rid; });
  }

  // ------------------------------------------------------------------ 房間
  function enterRoom(rid) {
    S.rid = rid;
    message('<p class="muted">正在進入房間 ' + esc(rid) + '…</p>');
    var token = S.token;
    S.stops.push(S.backend.watch(gPath(rid), function (val, err) {
      if (token !== S.token) return;
      if (err) {
        message('<h2>無法進入房間</h2><p class="muted">' + esc(errText(err)) + '</p><p><a class="link-btn" href="#/online">← 回大廳</a></p>');
        return;
      }
      if (!val) {
        if (S.g) App.toast('房間已經關閉');
        message('<h2>找不到房間 ' + esc(rid) + '</h2><p class="muted">房號可能打錯了，或房間已經被關閉。</p><p><a class="link-btn" href="#/online">← 回大廳</a></p>');
        S.g = null;
        return;
      }
      onRoom(val);
    }));
    S.stops.push(S.backend.watch(pPath(rid), function (val) {
      if (token !== S.token) return;
      S.pres = val || {};
      refreshRoom();
    }));
    S.timer = setInterval(tick, 250);
  }

  function startPresence() {
    if (S.presStop) S.presStop();
    var role = S.role;
    var name = role === 'watch' ? myName() : S.g[role].name;
    var ts = S.backend.ts();
    S.presStop = S.backend.presence(
      pPath(S.rid) + '/' + S.uid,
      function () { return { name: name, role: role, on: true }; },
      role === 'watch' ? null : { name: name, role: role, on: false, off: ts }
    );
  }

  function syncLobby() {
    var g = S.g;
    if (!g.pub || g.host !== S.uid) return;
    if (g.status === 'over') {
      if (S.lobbyStop) { S.lobbyStop(); S.lobbyStop = null; }
      return;
    }
    var entry = {
      host: S.uid, st: g.status, white: g.white ? g.white.name : '', black: g.black ? g.black.name : '',
      tc: g.tc, at: S.backend.ts(),
    };
    var key = entry.st + '|' + entry.white + '|' + entry.black;
    S.lobbyEntry = entry;
    if (!S.lobbyStop) {
      S.lobbyStop = S.backend.presence(lobbyPath(S.rid), function () { return S.lobbyEntry; }, null);
    } else if (key !== S.lobbyKey) {
      S.backend.set(lobbyPath(S.rid), entry).catch(function () {});
    }
    S.lobbyKey = key;
  }

  /**
   * 對局結束：存進「我的棋譜」並記進和這位對手的戰績。同一個房間只記一次（回傳是否有記）。
   * 一步都沒走就結束的對局不存棋譜也不列入戰績。
   */
  function recordFinished(rid, g, role) {
    var st = App.statsLoad();
    if (Stats.hasRoom(st, rid)) return false;
    var opp = g[Core.other(role)];
    var r = Stats.resultFor(g.result, role);
    var gm = Core.gameOf(g);
    if (!opp || !r || !gm || !gm.history.length) {
      if (Stats.dropPending(st, rid)) App.statsSave(st);
      return false;
    }
    var loser = g.result.w === 'white' ? E.BLACK : E.WHITE;
    if (g.result.why === 'resign') gm.resign(loser);
    else if (g.result.why === 'agreed') gm.agreeDraw();
    var title = '線上：' + g.white.name + '（白） vs ' + g.black.name + '（黑）';
    if (g.result.why === 'timeout' || g.result.why === 'abandon') title += ' ' + Core.resultText(g.result);
    // 最後一步（或開局）的伺服器時間最接近對局結束的時間；補記舊對局時不會被記成現在。
    var at = g.clock && g.clock.at > 1e12 ? g.clock.at : Date.now();
    App.upsertSaved('on-' + rid, title, gm, at);
    Stats.recordOnline(st, { rid: rid, uid: opp.uid, name: opp.name, r: r, side: role, why: g.result.why, n: g.n, at: at });
    App.statsSave(st);
    return true;
  }

  /** 入座的對局先登記起來，之後就算沒看到結局也能在大廳補記。 */
  function trackRoom(val) {
    if (S.tracked || val.status !== 'playing') return;
    S.tracked = true;
    rememberRoom(S.rid);
    var st = App.statsLoad();
    if (Stats.addPending(st, S.rid, Date.now())) App.statsSave(st);
  }

  function onRoom(val) {
    var game = Core.gameOf(val);
    if (!game) {
      if (!S.warned) App.toast('收到不合規則的對局資料，已忽略');
      S.warned = true;
      return;
    }
    var prev = S.g;
    S.g = val;
    S.game = game;
    var role = Core.sideOfUid(val, S.uid) || 'watch';
    var player = role !== 'watch';

    if (!prev || role !== S.role) {
      var first = !prev;
      S.role = role;
      S.flip = role === 'black';
      buildRoom();
      startPresence();
      if (first && !player && val.status === 'waiting') {
        // 打開邀請連結 = 入座。
        S.backend.tx(gPath(S.rid), function (cur) {
          return Core.join(cur, { uid: S.uid, name: myName(), ts: S.backend.ts() });
        }).then(function (r) {
          if (!r.committed) App.toast('位子已經有人了，改為觀戰');
        }, function (err) { App.toast('入座失敗：' + errText(err)); });
      } else if (!first && player) {
        App.toast('已入座，你執' + (role === 'white' ? '白（先走）' : '黑（後走）'));
      }
      // 回到一間已經結束的房間（例如離線期間對手宣告獲勝）：把還沒記過的結果補記起來。
      if (first && player && val.status === 'over') recordFinished(S.rid, val, role);
    }
    if (player) trackRoom(val);
    if (prev) {
      S.animate = val.n === prev.n + 1;
      if (val.n !== prev.n) S.sel = -1;
      if (prev.status === 'waiting' && val.status === 'playing' && prev.host === S.uid) App.toast('對手已加入，對局開始');
      if (player && val.status === 'playing') {
        var mine = prev.offer && prev.offer.by === role;
        if (mine && !val.offer && val.n === prev.n && !S.cancelling) {
          App.toast('對方拒絕了你的' + (prev.offer.kind === 'undo' ? '悔棋' : '和棋') + '請求');
        } else if (prev.offer && prev.offer.kind === 'undo' && val.n < prev.n) {
          App.toast('悔棋成立');
        } else if (val.offer && val.offer.by !== role && !prev.offer) {
          App.toast('對方請求' + (val.offer.kind === 'undo' ? '悔棋' : '和棋'));
        }
      }
      S.cancelling = false;
      if (prev.status !== 'over' && val.status === 'over') {
        App.toast(Core.resultText(val.result));
        if (player) {
          recordFinished(S.rid, val, role);
          App.campusAct();
        }
      }
    }
    syncLobby();
    refreshRoom();
  }

  function inviteLink() { return location.href.split('#')[0] + '#/online/' + S.rid; }

  function buildRoom() {
    App.main.innerHTML =
      '<div class="ch-stage">' +
        '<div class="ch-board-col">' +
          '<div class="on-bar" id="onTop"></div>' +
          '<div class="ch-board-wrap" id="onBoard"></div>' +
          '<div class="on-bar" id="onBottom"></div>' +
        '</div>' +
        '<aside class="ch-side">' +
          '<section class="card">' +
            '<div class="card-head"><h2>房間 ' + esc(S.rid) + '</h2><span class="tag-pill" id="onRole"></span></div>' +
            '<div id="onStatus"></div><div id="onOffer"></div><div id="onAway"></div>' +
          '</section>' +
          '<section class="card"><div class="btn-grid" id="onActions"></div></section>' +
          '<section class="card">' +
            '<div class="card-head"><h2>棋譜</h2><span class="muted" id="onWatch"></span></div>' +
            '<div class="mv-scroll" id="onMoves"></div>' +
          '</section>' +
          '<div class="pz-nav"><a class="btn" href="#/online">← 大廳</a></div>' +
        '</aside>' +
      '</div>';
    S.board = window.CHBoard.create(document.getElementById('onBoard'), { onSquare: onSquare });
    S.animate = false;
    S.awayHtml = '';
  }

  function presenceOf(side) {
    var seat = S.g[side];
    if (!seat) return null;
    var p = S.pres[seat.uid];
    return { online: !!(p && p.on), off: p && !p.on ? p.off : 0, known: !!p };
  }

  function barHtml(side) {
    var g = S.g;
    var seat = g[side];
    var p = presenceOf(side);
    var turn = g.status === 'playing' && Core.turnOf(g) === side;
    var name = seat ? esc(seat.name) + (seat.uid === S.uid ? '（你）' : '') : '等待對手加入…';
    return '<span class="on-dot ' + (side === 'white' ? 'is-white' : 'is-black') + '"></span>' +
      '<span class="on-who' + (turn ? ' is-turn' : '') + '">' + name + '</span>' +
      (seat ? '<span class="on-conn ' + (p.online ? 'is-on' : 'is-off') + '">' + (p.online ? '在線' : '離線') + '</span>' : '') +
      (g.tc.base ? '<span class="on-clock' + (turn ? ' is-run' : '') + '" id="onClock-' + side + '"></span>' : '');
  }

  function refreshRoom() {
    var g = S.g;
    if (!g || !S.board || !document.getElementById('onStatus')) return;
    var game = S.game;
    var role = S.role;
    var player = role !== 'watch';
    var turn = Core.turnOf(g);
    S.board.render({
      board: game.pos.board, flipped: S.flip, faceToFace: false, selected: S.sel, targets: App.targetsOf(game, S.sel),
      last: game.lastMove(), check: App.checkSquare(game.pos), animate: S.animate, hint: -1,
    });
    S.animate = false;

    document.getElementById('onTop').innerHTML = barHtml(S.flip ? 'white' : 'black');
    document.getElementById('onBottom').innerHTML = barHtml(S.flip ? 'black' : 'white');
    document.getElementById('onRole').textContent = player ? '你執' + (role === 'white' ? '白' : '黑') : '觀戰中';

    var html;
    if (g.status === 'waiting') {
      html = '<div class="status-turn"><span class="turn-dot"></span>等待對手加入</div>' +
        '<p class="muted">把邀請連結傳給朋友，對方打開就會入座：</p>' +
        '<div class="on-invite"><input type="text" readonly id="onLink" value="' + esc(inviteLink()) + '" />' +
        '<button type="button" class="btn btn-primary" data-oact="copy">複製</button></div>';
    } else if (g.status === 'over') {
      var verdict = '';
      if (player && g.result.w !== 'draw') verdict = g.result.w === role ? '・你贏了！' : '・你輸了';
      html = '<div class="status-result">' + esc(Core.resultText(g.result) + verdict) + '</div>' +
        '<p class="muted">共 ' + g.n + ' 步。' + (player && g.n ? '這一局已存入「我的棋譜」並列入戰績。' : '') + '</p>' +
        (g.next ? '<p><a class="btn btn-primary on-next" href="#/online/' + esc(g.next) + '">再戰的新房間已開好，點此進入 →</a></p>' : '');
    } else {
      var label = player ? (turn === role ? '輪到你走' : '等待對手走棋') : '輪到' + sideLabel(turn) + '走';
      html = '<div class="status-turn ' + (turn === 'white' ? 'is-white' : 'is-black') + '"><span class="turn-dot"></span>' + label +
        (game.inCheck() ? '<span class="badge-check">將軍！</span>' : '') + '</div>' +
        '<p class="muted">第 ' + (Math.floor(g.n / 2) + 1) + ' 回合・' + esc(tcLabel(g.tc)) + '</p>';
    }
    var rival = player ? g[Core.other(role)] : null;
    if (rival) {
      var h2h = App.statsLoad().opp[rival.uid];
      html += '<p class="muted on-h2h">和 ' + esc(rival.name) + ' 的對戰紀錄：' +
        (h2h ? esc(Stats.wldText(h2h)) : '第一次交手') + '</p>';
    }
    document.getElementById('onStatus').innerHTML = html;

    var offer = '';
    if (g.offer && g.status === 'playing') {
      var what = g.offer.kind === 'undo' ? '悔棋' : '和棋';
      if (player && g.offer.by === role) {
        offer = '<div class="on-offer">已送出' + what + '請求，等待對方回覆。' +
          '<button type="button" class="link-btn" data-oact="cancel-offer">取消請求</button></div>';
      } else if (player) {
        offer = '<div class="on-offer is-ask"><strong>對方請求' + what + '</strong>' +
          '<span class="on-offer-btns"><button type="button" class="btn btn-primary" data-oact="accept">同意</button>' +
          '<button type="button" class="btn" data-oact="decline">拒絕</button></span></div>';
      } else {
        offer = '<div class="on-offer">' + sideLabel(g.offer.by) + '請求' + what + '，等待對方回覆。</div>';
      }
    }
    document.getElementById('onOffer').innerHTML = offer;

    var btn = function (act, text, dis, cls) {
      return '<button type="button" class="btn' + (cls || '') + '" data-oact="' + act + '"' + (dis ? ' disabled' : '') + '>' + text + '</button>';
    };
    var acts = '';
    if (player && g.status === 'playing') {
      var canUndo = !g.offer && g.n >= (turn === role ? 2 : 1);
      acts += btn('undo', '↩️ 請求悔棋', !canUndo) + btn('draw', '🤝 提和', !!g.offer) + btn('resign', '🏳️ 認輸', false, ' btn-danger');
    } else if (player && g.status === 'waiting') {
      acts += btn('cancel-room', '✖️ 關閉房間', false, ' btn-danger');
    } else if (player && g.status === 'over' && !g.next) {
      acts += btn('rematch', '🔁 再來一局（換邊）', false, ' btn-primary');
    }
    acts += btn('flip', '🔃 翻轉棋盤') + (g.status !== 'waiting' ? btn('copy', '🔗 複製房間連結') : '');
    document.getElementById('onActions').innerHTML = acts;

    var box = document.getElementById('onMoves');
    box.innerHTML = App.moveListHtml(game, g.n, false);
    box.scrollTop = box.scrollHeight;
    var watchers = Object.keys(S.pres).filter(function (u) { return S.pres[u] && S.pres[u].role === 'watch'; }).length;
    document.getElementById('onWatch').textContent = watchers ? '👀 ' + watchers + ' 人觀戰' : '';
    tick();
  }

  /** 每 250 毫秒更新時鐘與離線提示；時間用完時由棋手這一端送出超時判定。 */
  function tick() {
    var g = S.g;
    if (!g || !S.backend || !document.getElementById('onStatus')) return;
    var now = S.backend.now();
    var player = S.role !== 'watch';
    if (g.tc.base) {
      ['white', 'black'].forEach(function (side) {
        var el = document.getElementById('onClock-' + side);
        if (!el) return;
        var ms = Core.remaining(g, side, now);
        var text = Core.formatClock(ms);
        if (el.textContent !== text) el.textContent = text;
        el.classList.toggle('is-low', ms < 30000);
      });
      var turn = Core.turnOf(g);
      if (player && g.status === 'playing' && S.flagN !== g.n && Core.remaining(g, turn, now) <= 0) {
        S.flagN = g.n;
        S.backend.tx(gPath(S.rid), function (cur) { return Core.flag(cur, { uid: S.uid, now: S.backend.now() }); })
          .catch(function () {});
      }
    }
    var away = '';
    if (player && g.status === 'playing') {
      var p = presenceOf(Core.other(S.role));
      if (p && p.known && !p.online && p.off) {
        var gone = Math.max(0, now - p.off);
        away = gone >= Core.ABANDON_MS
          ? '<div class="on-offer is-ask"><strong>對手已離線超過 1 分鐘</strong><span class="on-offer-btns">' +
            '<button type="button" class="btn btn-primary" data-oact="claim">宣告獲勝</button></span></div>'
          : '<div class="on-offer">對手離線中，' + Math.ceil((Core.ABANDON_MS - gone) / 1000) + ' 秒後可以宣告獲勝。</div>';
      }
    }
    if (away !== S.awayHtml) {
      S.awayHtml = away;
      document.getElementById('onAway').innerHTML = away;
    }
  }

  function roomTx(fn, failText) {
    return S.backend.tx(gPath(S.rid), fn).then(function (r) {
      if (!r.committed && failText) App.toast(failText);
      return r;
    }, function (err) {
      App.toast('連線有問題：' + errText(err));
      return { committed: false };
    });
  }

  function onSquare(sq) {
    var g = S.g;
    if (!g || S.busy || S.role === 'watch' || g.status !== 'playing' || Core.turnOf(g) !== S.role) return;
    var game = S.game;
    var n = g.n;
    var moved = App.tryMove(game, S.sel, sq, function (m) {
      // 升變選單開著的時候局面可能已經變了（對手悔棋成立、對局結束）：那就不送出。
      if (!S.g || S.g.n !== n || S.g.status !== 'playing' || S.busy) return;
      S.sel = -1;
      S.busy = true;
      refreshRoom();
      roomTx(function (cur) {
        return Core.move(cur, { uid: S.uid, move: E.moveToStr(m), now: S.backend.now(), ts: S.backend.ts() });
      }, '這一步沒有送出，請再走一次').then(function () { S.busy = false; });
    });
    if (moved) return;
    var p = game.pos.board[sq];
    var mine = p && E.sideOf(p) === (S.role === 'white' ? E.WHITE : E.BLACK);
    S.sel = mine && S.sel !== sq ? sq : -1;
    refreshRoom();
  }

  function copyLink() {
    var text = inviteLink();
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).catch(fallback);
    else fallback();
    App.toast('已複製連結');
  }

  function onAction(act) {
    var g = S.g;
    var uid = S.uid;
    if (act === 'retry') { window.CHOnline.render(S.lastParts || []); return; }
    if (act === 'create' || act === 'join') {
      var nameEl = document.getElementById('onName');
      if (nameEl) saveName(nameEl.value);
      if (act === 'join') {
        var rid = Core.normalizeId(document.getElementById('onCode').value);
        if (!rid) { App.toast('房號是 6 碼的英文與數字'); return; }
        location.hash = '#/online/' + rid;
        return;
      }
      var side = document.getElementById('onSide').value;
      if (side === 'rand') side = Math.random() < 0.5 ? 'white' : 'black';
      var tc = Core.TIME_CONTROLS[+document.getElementById('onTc').value] || Core.TIME_CONTROLS[0];
      createRoom({ side: side, tc: tc, pub: document.getElementById('onPublic').checked }).then(function (newRid) {
        location.hash = '#/online/' + newRid;
      }, function (err) { App.toast('建立房間失敗：' + errText(err)); });
      return;
    }
    if (!g) return;
    if (act === 'copy') copyLink();
    else if (act === 'flip') { S.flip = !S.flip; refreshRoom(); }
    else if (act === 'undo' || act === 'draw') {
      roomTx(function (cur) { return Core.offer(cur, { uid: uid, kind: act }); }, '現在不能送出請求');
    } else if (act === 'cancel-offer') {
      S.cancelling = true;
      roomTx(function (cur) { return Core.cancelOffer(cur, { uid: uid }); });
    } else if (act === 'accept' || act === 'decline') {
      roomTx(function (cur) { return Core.answer(cur, { uid: uid, ok: act === 'accept', ts: S.backend.ts() }); });
    } else if (act === 'resign') {
      if (!window.confirm('確定要認輸嗎？')) return;
      roomTx(function (cur) { return Core.resign(cur, { uid: uid }); });
    } else if (act === 'claim') {
      var p = presenceOf(Core.other(S.role));
      if (!p || p.online || !p.off || S.backend.now() - p.off < Core.ABANDON_MS) { App.toast('對手已經回來了'); return; }
      roomTx(function (cur) { return Core.claim(cur, { uid: uid }); });
    } else if (act === 'cancel-room') {
      if (g.status !== 'waiting' || g.host !== uid) return;
      var closing = S.rid;
      S.backend.remove(gPath(closing)).then(function () { forgetRoom(closing); location.hash = '#/online'; }, function (err) {
        App.toast('關閉失敗：' + errText(err));
      });
    } else if (act === 'rematch') {
      if (g.status !== 'over' || g.next || S.role === 'watch') return;
      var oldRid = S.rid;
      createRoom({ side: Core.other(S.role), tc: g.tc, pub: false }).then(function (newRid) {
        return S.backend.tx(gPath(oldRid), function (cur) { return Core.setNext(cur, { uid: uid, rid: newRid }); })
          .then(function (r) {
            // 對手搶先開了新房間：改進對手那一間。
            location.hash = '#/online/' + (r.committed || !r.val || !r.val.next ? newRid : r.val.next);
          });
      }).catch(function (err) { App.toast('開新房間失敗：' + errText(err)); });
    }
  }

  // ------------------------------------------------------------------ 對外介面
  function init() {
    App = window.CHApp;
    App.main.addEventListener('click', function (ev) {
      var t = ev.target.closest('[data-oact]');
      if (!t || t.disabled) return;
      onAction(t.getAttribute('data-oact'));
    });
    App.main.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !ev.isComposing && ev.target.id === 'onCode') onAction('join');
    });
    App.main.addEventListener('change', function (ev) {
      if (ev.target.id === 'onName') { saveName(ev.target.value); ev.target.value = myName(); }
    });
    App.main.addEventListener('focusin', function (ev) {
      if (ev.target.id === 'onLink') ev.target.select();
    });
  }

  window.CHOnline = {
    handles: function (view) { return view === 'online'; },
    render: function (parts) {
      if (!App) init();
      stop();
      S.lastParts = parts;
      if (!window.CH_FIREBASE && !window.CH_ONLINE_BACKEND) {
        message('<h2>線上對弈尚未開放</h2><p class="muted">這個版本沒有設定連線資訊。</p>');
        return;
      }
      message('<p class="muted">連線中…</p>');
      var token = S.token;
      ensureBackend().then(function () {
        if (token !== S.token) return;
        var rid = parts[0] ? Core.normalizeId(parts[0]) : '';
        if (parts[0] && !rid) App.toast('房號格式不對，已回到大廳');
        if (rid) enterRoom(rid);
        else renderLobby();
      }, function (err) {
        if (token !== S.token) return;
        message('<h2>無法連線</h2><p class="muted">' + esc(errText(err)) + '</p>' +
          '<p><button type="button" class="btn btn-primary" data-oact="retry">重試</button></p>');
      });
      window.scrollTo(0, 0);
    },
    stop: stop,
  };
})();


// === js/app.js ===
// ============================================================================
// ♟️ 西洋棋學院 — 頁面與互動（對弈、棋譜回放、走法速查）
// 純前端：對局、棋譜與戰績都存在瀏覽器 localStorage（key 一律 ch. 前綴）。
// ============================================================================

(function () {
  'use strict';
  var E = window.CHEngine;
  var NT = window.CHNotation;
  var Stats = window.CHStats;
  var main = document.getElementById('appMain');

  var KEY_PLAY = 'ch.play.v1';
  var KEY_GAMES = 'ch.games.v1';
  var KEY_PREFS = 'ch.prefs.v1';
  var MAX_SAVED = 60;

  // ------------------------------------------------------------------ 工具
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function load(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (_) { return fallback; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (_) {}
  }
  function nowStr(at) {
    var d = at ? new Date(at) : new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function sideName(side) { return NT.sideName(side); }
  function campusAct() {
    try {
      if (window.CampusNav && typeof window.CampusNav.recordAct === 'function') window.CampusNav.recordAct('chess');
    } catch (_) {}
  }
  var toastTimer = 0;
  function toast(msg) {
    var t = document.getElementById('chToast');
    if (!t) return;
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2200);
  }
  function copyText(text, done) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).catch(fallback);
    } else {
      fallback();
    }
    toast(done || '已複製棋譜');
  }

  var prefs = load(KEY_PREFS, {}) || {};
  function savePrefs() { save(KEY_PREFS, { flipped: !!prefs.flipped, face: !!prefs.face }); }

  // ------------------------------------------------------------------ 兵升變選單
  var promoCb = null;
  /** 兵走到底線時讓玩家選要升變成什麼；moves 是同一個起點、終點的四個走法。選好後呼叫 cb(走法)。 */
  function pickPromotion(side, moves, cb) {
    var modal = document.getElementById('promoModal');
    var row = document.getElementById('promoRow');
    promoCb = cb;
    row.innerHTML = [E.Q, E.R, E.B, E.N].map(function (t) {
      var m = -1;
      moves.forEach(function (x) { if (E.promoOf(x) === t) m = x; });
      return '<button type="button" class="promo-btn" data-promo="' + m + '">' +
        window.CHBoard.pieceSvg(side | t, 46) + NT.TYPE_NAMES[t] + '</button>';
    }).join('');
    modal.hidden = false;
  }
  function closePromotion() {
    document.getElementById('promoModal').hidden = true;
    promoCb = null;
  }
  function initPromotion() {
    var modal = document.getElementById('promoModal');
    modal.addEventListener('click', function (ev) {
      var t = ev.target.closest('[data-promo]');
      if (!t) {
        if (ev.target === modal) closePromotion(); // 點背景 = 取消，棋子留在原位
        return;
      }
      var cb = promoCb;
      var m = +t.getAttribute('data-promo');
      closePromotion();
      if (cb && m >= 0) cb(m);
    });
    window.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !modal.hidden) closePromotion(); });
  }
  /**
   * 棋盤點選的共用邏輯：已選起點 sel、這次點了 sq。
   * 是合法走法就呼叫 onMove(走法)（升變會先跳選單）並回傳 true；否則回傳 false，由呼叫端決定要不要改選別的棋子。
   */
  function tryMove(game, sel, sq, onMove) {
    if (sel < 0) return false;
    var moves = game.movesBetween(sel, sq);
    if (!moves.length) return false;
    if (moves.length === 1) onMove(moves[0]);
    else pickPromotion(game.turn(), moves, onMove);
    return true;
  }
  function targetsOf(game, sel) {
    if (sel < 0) return [];
    var seen = {};
    return game.legalMovesFrom(sel).map(function (m) { return E.toOf(m); }).filter(function (t) {
      if (seen[t]) return false;
      seen[t] = true;
      return true;
    });
  }

  // ------------------------------------------------------------------ 我的棋譜
  function savedGames() {
    var list = load(KEY_GAMES, []);
    return Array.isArray(list) ? list : [];
  }
  function gameSnapshot(game) {
    return {
      fen: game.startFen,
      moves: game.moveStrings(),
      resigned: game.resigned,
      draw: game.drawAgreed,
    };
  }
  function restoreGame(snap) {
    var g = E.Game.fromMoves(snap.fen || E.START_FEN, snap.moves || []);
    if (snap.resigned === E.WHITE || snap.resigned === E.BLACK) g.resign(snap.resigned);
    if (snap.draw) g.agreeDraw();
    return g;
  }
  /** 新增或更新一筆棋譜，回傳 id。at：對局時間（毫秒），省略時用現在。 */
  function upsertSaved(id, title, game, at) {
    var list = savedGames();
    var rec = gameSnapshot(game);
    rec.id = id || 'g' + Date.now().toString(36);
    rec.title = title;
    rec.date = nowStr(at);
    rec.result = NT.resultText(game.result());
    list = list.filter(function (x) { return x.id !== rec.id; });
    list.unshift(rec);
    save(KEY_GAMES, list.slice(0, MAX_SAVED));
    return rec.id;
  }

  // ------------------------------------------------------------------ 我的戰績
  // 每次都重新讀取再寫回，避免同時開兩個分頁時互相蓋掉。
  function statsLoad() { return Stats.normalize(load(Stats.KEY, null)); }
  function statsSave(st) { save(Stats.KEY, st); }
  function statsCardHtml(extra) {
    var levels = {};
    Stats.AI_LEVELS.forEach(function (lv) { levels[lv] = window.CHAI.LEVELS[lv].name; });
    var saved = {};
    savedGames().forEach(function (g) { saved[g.id] = true; });
    return Stats.cardHtml(statsLoad(), esc, {
      levels: levels, saved: saved,
      whyText: window.CHOnlineCore ? window.CHOnlineCore.whyText : null,
      unfinished: extra && extra.unfinished,
    });
  }

  // ------------------------------------------------------------------ 共用版面
  function moveListHtml(game, activeIdx, clickable) {
    var moves = game.sanList();
    var start = E.parseFen(game.startFen);
    var firstBlack = start.turn === E.BLACK;
    var rows = [];
    var i = 0;
    var n = start.full;
    function cell(idx) {
      if (idx < 0) return '<span class="mv mv-empty">…</span>';
      if (idx >= moves.length) return '<span class="mv mv-empty"></span>';
      var cls = 'mv' + (idx + 1 === activeIdx ? ' is-active' : '') + (idx % 2 === (firstBlack ? 1 : 0) ? ' mv-white' : ' mv-black');
      return clickable
        ? '<button type="button" class="' + cls + '" data-goto="' + (idx + 1) + '">' + esc(moves[idx]) + '</button>'
        : '<span class="' + cls + '">' + esc(moves[idx]) + '</span>';
    }
    if (firstBlack && moves.length) {
      rows.push('<li><span class="mv-no">' + n + '.</span>' + cell(-1) + cell(0) + '</li>');
      n++; i = 1;
    }
    for (; i < moves.length; i += 2) {
      rows.push('<li><span class="mv-no">' + n + '.</span>' + cell(i) + cell(i + 1) + '</li>');
      n++;
    }
    if (!rows.length) return '<p class="muted mv-none">還沒有走任何一步。</p>';
    return '<ol class="mv-list">' + rows.join('') + '</ol>';
  }

  var PIECE_POINTS = [0, 0, 9, 5, 3, 3, 1];
  function capturedHtml(game) {
    var byWhite = [], byBlack = [];
    game.history.forEach(function (h) {
      if (!h.cap) return;
      (E.sideOf(h.cap) === E.BLACK ? byWhite : byBlack).push(h.cap);
    });
    // 子力差直接數盤面（升變也算進去）。
    var diff = 0;
    for (var sq = 0; sq < 64; sq++) {
      var p = game.pos.board[sq];
      if (p) diff += (E.sideOf(p) === E.WHITE ? 1 : -1) * PIECE_POINTS[E.typeOf(p)];
    }
    function row(label, arr, lead) {
      arr.sort(function (a, b) { return E.typeOf(a) - E.typeOf(b); });
      var chips = arr.map(function (p) { return window.CHBoard.pieceSvg(p, 22); }).join('');
      return '<div class="cap-row"><span class="cap-label">' + label + '</span>' + (chips || '<span class="muted">—</span>') +
        (lead > 0 ? '<span class="cap-diff">+' + lead + '</span>' : '') + '</div>';
    }
    return row('白方吃子', byWhite, diff) + row('黑方吃子', byBlack, -diff);
  }

  function checkSquare(pos) {
    return E.inCheck(pos, pos.turn) ? E.findKing(pos, pos.turn) : -1;
  }

  // ------------------------------------------------------------------ 對弈
  // ai：0 = 同機雙人，1–4 = AI 難度；human：玩家執白或執黑（AI 模式才有意義）。
  var play = {
    game: null, selected: -1, board: null, savedId: null, animate: true,
    ai: 0, human: E.WHITE, thinking: false, hinting: false, hint: -1,
    counted: null, // 這一局已經記進戰績的 { lv, r }；下完後悔棋再下完會改寫，不會重複計算
  };
  var aiClient = window.CHAI.createClient();
  var AI_MIN_DELAY = 350; // AI 太快回應會像瞬移，至少停一下

  function aiName() { return play.ai ? window.CHAI.LEVELS[play.ai].name : ''; }
  function humanTurn() { return !play.ai || play.game.turn() === play.human; }
  function defaultTitle() {
    if (play.savedTitle) return play.savedTitle;
    return (play.ai ? '對 AI（' + aiName() + '）' + (play.human === E.WHITE ? '執白' : '執黑') : '同機對弈') + ' ' + nowStr();
  }
  function stopThinking() {
    aiClient.cancel();
    play.thinking = false;
    play.hinting = false;
    play.hint = -1;
  }

  function loadPlay() {
    var snap = load(KEY_PLAY, null);
    play.savedId = null;
    try {
      play.game = snap ? restoreGame(snap) : new E.Game();
      if (snap && snap.savedId) play.savedId = snap.savedId;
      if (snap && snap.ai >= 1 && snap.ai <= 4) play.ai = snap.ai;
      if (snap && snap.human === E.BLACK) play.human = E.BLACK;
      play.counted = snap && snap.counted && typeof snap.counted === 'object' ? snap.counted : null;
    } catch (_) {
      play.game = new E.Game();
    }
    play.selected = -1;
  }
  function persistPlay() {
    var snap = gameSnapshot(play.game);
    snap.savedId = play.savedId;
    snap.ai = play.ai;
    snap.human = play.human;
    snap.counted = play.counted;
    save(KEY_PLAY, snap);
  }

  function renderPlay() {
    if (!play.game) loadPlay();
    main.innerHTML =
      '<div class="ch-stage">' +
        '<div class="ch-board-col"><div class="ch-board-wrap" id="playBoard"></div></div>' +
        '<aside class="ch-side">' +
          '<section class="card" id="playStatus"></section>' +
          '<section class="card opp-card">' +
            '<label>對手<select id="oppSel">' +
              '<option value="0">👥 同機雙人</option>' +
              [1, 2, 3, 4].map(function (lv) {
                return '<option value="' + lv + '">🤖 AI ' + window.CHAI.LEVELS[lv].name + '</option>';
              }).join('') +
            '</select></label>' +
            '<label id="sideWrap">我方<select id="sideSel">' +
              '<option value="0">執白（先走）</option><option value="8">執黑（後走）</option>' +
            '</select></label>' +
            '<p class="muted opp-stat" id="aiStat" hidden></p>' +
          '</section>' +
          '<section class="card">' +
            '<div class="btn-grid">' +
              '<button type="button" class="btn" data-act="undo">↩️ 悔棋</button>' +
              '<button type="button" class="btn" data-act="hint" title="請 AI 建議這一步怎麼走">💡 提示</button>' +
              '<button type="button" class="btn" data-act="new">🔄 新對局</button>' +
              '<button type="button" class="btn" data-act="flip">🔃 翻轉棋盤</button>' +
              '<button type="button" class="btn" data-act="face" title="畫面上方那一側的棋子倒過來顯示，適合把手機或平板平放、兩人面對面下棋">👥 對坐模式</button>' +
              '<button type="button" class="btn" data-act="draw">🤝 議和</button>' +
              '<button type="button" class="btn btn-danger" data-act="resign">🏳️ 認輸</button>' +
            '</div>' +
          '</section>' +
          '<section class="card">' +
            '<div class="card-head"><h2>棋譜</h2>' +
              '<div class="card-tools">' +
                '<button type="button" class="link-btn" data-act="save">💾 存入我的棋譜</button>' +
                '<button type="button" class="link-btn" data-act="copy">📋 複製 PGN</button>' +
              '</div>' +
            '</div>' +
            '<div class="mv-scroll" id="playMoves"></div>' +
            '<div id="playCaptured" class="cap-box"></div>' +
          '</section>' +
        '</aside>' +
      '</div>';
    play.board = window.CHBoard.create(document.getElementById('playBoard'), { onSquare: onPlaySquare });
    play.animate = false;
    document.getElementById('oppSel').value = String(play.ai);
    document.getElementById('sideSel').value = String(play.human);
    refreshPlay();
    maybeAiMove();
  }

  function refreshPlay() {
    if (!document.getElementById('playStatus')) return; // 已經離開對弈頁
    var g = play.game;
    var res = g.result();
    play.board.render({
      board: g.pos.board, flipped: !!prefs.flipped, faceToFace: !!prefs.face,
      selected: play.selected, targets: targetsOf(g, play.selected), last: g.lastMove(),
      check: checkSquare(g.pos), animate: play.animate, hint: play.hint,
    });
    play.animate = true;

    var status = document.getElementById('playStatus');
    var side = g.turn();
    var html;
    if (res) {
      var verdict = '';
      if (play.ai && res.winner !== null) verdict = res.winner === play.human ? ' · 你贏了！' : ' · AI 獲勝';
      html = '<div class="status-result">' + esc(NT.resultText(res) + verdict) + '</div>' +
        '<p class="muted">共 ' + g.history.length + ' 步。可以按「悔棋」回到上一步，或開始新對局。</p>';
    } else {
      html = '<div class="status-turn ' + (side === E.WHITE ? 'is-white' : 'is-black') + '">' +
        '<span class="turn-dot"></span>' +
        (play.ai ? (humanTurn() ? '輪到你走（' + sideName(side) + '）' : 'AI 思考中…') : '輪到' + sideName(side) + '走') +
        (g.inCheck() ? '<span class="badge-check">將軍！</span>' : '') + '</div>' +
        '<p class="muted">第 ' + g.pos.full + ' 回合 · ' +
        (play.hinting ? '正在計算提示…' : (play.ai ? '對手：AI ' + aiName() : '同機雙人對弈') + '：點棋子，再點要走到的格子。') + '</p>';
    }
    status.innerHTML = html;

    document.getElementById('playMoves').innerHTML = moveListHtml(g, g.history.length, false);
    var sc = document.getElementById('playMoves');
    sc.scrollTop = sc.scrollHeight;
    document.getElementById('playCaptured').innerHTML = capturedHtml(g);

    var q = function (act) { return main.querySelector('[data-act="' + act + '"]'); };
    q('undo').disabled = !g.history.length && !res;
    q('draw').disabled = !!res || !g.history.length || !!play.ai;
    q('resign').disabled = !!res;
    q('hint').disabled = !!res || play.thinking || play.hinting || !humanTurn();
    document.getElementById('sideWrap').hidden = !play.ai;
    var statEl = document.getElementById('aiStat');
    statEl.hidden = !play.ai;
    if (play.ai) statEl.textContent = '對 AI ' + aiName() + '的戰績：' + Stats.wldText(statsLoad().ai[play.ai]);
    q('save').disabled = !g.history.length;
    q('copy').disabled = !g.history.length;
    q('face').classList.toggle('is-on', !!prefs.face);
    q('flip').classList.toggle('is-on', !!prefs.flipped);
  }

  function afterPlayChange() {
    var g = play.game;
    var res = g.result();
    // 對局結束時自動存進我的棋譜（同一局只存一筆）。
    if (res && g.history.length) {
      play.savedId = upsertSaved(play.savedId, defaultTitle(), g);
      if (play.ai) {
        // 對 AI 的勝負記進戰績；同機雙人兩邊都是自己人，不列入。
        var st = statsLoad();
        play.counted = Stats.recordAi(st, {
          lv: play.ai, r: res.winner === null ? 'd' : (res.winner === play.human ? 'w' : 'l'), prev: play.counted,
        });
        statsSave(st);
      }
      toast(NT.resultText(res) + '，已存入我的棋譜');
    }
    persistPlay();
    refreshPlay();
    maybeAiMove();
  }

  /** 輪到 AI 時請 Worker 選步；回來時若局面已經變了（悔棋、開新局）就丟棄。 */
  function maybeAiMove() {
    var g = play.game;
    if (!play.ai || play.thinking || g.result() || g.turn() === play.human) return;
    play.thinking = true;
    play.hint = -1;
    refreshPlay();
    var started = Date.now();
    var plies = g.history.length;
    aiClient.request({ fen: g.startFen, moves: g.moveStrings(), level: play.ai }, function (r) {
      setTimeout(function () {
        if (!play.thinking || play.game !== g || g.history.length !== plies) return;
        play.thinking = false;
        if (r.move < 0 || !g.play(r.move)) {
          toast('AI 沒有走出合法的一步，請按悔棋或開新對局');
          refreshPlay();
          return;
        }
        afterPlayChange();
      }, Math.max(0, AI_MIN_DELAY - (Date.now() - started)));
    });
  }

  function requestHint() {
    var g = play.game;
    if (g.result() || play.thinking || play.hinting || !humanTurn()) return;
    play.hinting = true;
    play.selected = -1;
    play.animate = false;
    refreshPlay();
    var plies = g.history.length;
    aiClient.request({ fen: g.startFen, moves: g.moveStrings(), level: 3, hint: true }, function (r) {
      if (!play.hinting || play.game !== g || g.history.length !== plies) return;
      play.hinting = false;
      play.animate = false;
      if (r.move >= 0) {
        play.hint = r.move;
        toast('建議走：' + E.moveToSan(g.pos, r.move));
      }
      refreshPlay();
    });
  }

  function onPlaySquare(sq) {
    var g = play.game;
    if (g.result() || !humanTurn()) return;
    var p = g.pos.board[sq];
    var moved = tryMove(g, play.selected, sq, function (m) {
      stopThinking(); // 取消還在算的提示
      g.play(m);
      play.selected = -1;
      // 校園成就以「開局」與「下完一局」計次，不是每走一步都算。
      if (g.history.length === 1 || g.result()) campusAct();
      afterPlayChange();
    });
    if (moved) return;
    if (p && E.sideOf(p) === g.turn()) {
      play.selected = play.selected === sq ? -1 : sq;
    } else {
      play.selected = -1;
    }
    play.animate = false;
    refreshPlay();
  }

  function startGame(game, title) {
    stopThinking();
    play.game = game;
    play.selected = -1;
    play.savedId = null;
    play.counted = null;
    play.savedTitle = title || '';
    play.animate = false;
    persistPlay();
  }

  function onPlayAction(act) {
    var g = play.game;
    if (act === 'undo') {
      stopThinking();
      if (!g.undo()) return;
      // 對 AI 時一次退兩步，回到玩家自己上一次走棋之前。
      if (play.ai && !g.result() && g.turn() !== play.human && g.history.length) g.undo();
      play.selected = -1;
      play.animate = false;
      persistPlay();
      refreshPlay();
      maybeAiMove();
    } else if (act === 'hint') {
      requestHint();
    } else if (act === 'new') {
      if (g.history.length && !g.result() && !window.confirm('目前的對局還沒結束，確定要開始新對局嗎？')) return;
      startGame(new E.Game());
      refreshPlay();
      maybeAiMove();
    } else if (act === 'flip') {
      prefs.flipped = !prefs.flipped;
      savePrefs();
      play.animate = false;
      refreshPlay();
    } else if (act === 'face') {
      prefs.face = !prefs.face;
      savePrefs();
      play.animate = false;
      refreshPlay();
    } else if (act === 'draw') {
      if (!window.confirm('雙方都同意和棋嗎？')) return;
      g.agreeDraw();
      afterPlayChange();
    } else if (act === 'resign') {
      var loser = play.ai ? play.human : g.turn();
      if (!window.confirm((play.ai ? '' : sideName(loser)) + '確定要認輸嗎？')) return;
      stopThinking();
      g.resign(loser);
      afterPlayChange();
    } else if (act === 'save') {
      play.savedId = upsertSaved(play.savedId, defaultTitle(), g);
      persistPlay();
      toast('已存入我的棋譜');
    } else if (act === 'copy') {
      copyText(NT.exportText(g, ''));
    }
  }

  // ------------------------------------------------------------------ 棋譜回放
  var replay = { rec: null, game: null, idx: 0, board: null, timer: 0, speed: 1200, animate: false };

  function findRecord(id) {
    var i;
    if (id && id.indexOf('my-') === 0) {
      var list = savedGames();
      for (i = 0; i < list.length; i++) {
        if ('my-' + list[i].id === id) {
          return { id: id, title: list[i].title, tag: '我的棋譜', desc: list[i].date + (list[i].result ? ' · ' + list[i].result : ''), snap: list[i] };
        }
      }
      return null;
    }
    if (id && id.indexOf('puzzle-') === 0) {
      // 戰術題的解答：用題庫裡附的主變著法回放。
      var pzs = window.CH_PUZZLES || [];
      for (i = 0; i < pzs.length; i++) {
        if ('puzzle-' + pzs[i].id === id) {
          return {
            id: id, title: pzs[i].name + '・解答', tag: '題目解答', back: '#/puzzle/' + pzs[i].id,
            desc: window.CHStudy.goalText(pzs[i]) + '。對方走的是引擎算出最頑強的應法。',
            snap: { fen: pzs[i].fen, moves: pzs[i].line }, fromStart: true, flip: pzs[i].side === 'b',
          };
        }
      }
      return null;
    }
    var recs = window.CH_RECORDS || [];
    for (i = 0; i < recs.length; i++) if (recs[i].id === id) return recs[i];
    return null;
  }

  function recordGame(rec) {
    if (rec.snap) return restoreGame(rec.snap);
    return NT.gameFromSan(rec.fen || E.START_FEN, rec.moves);
  }

  function stopAuto() {
    if (replay.timer) { clearInterval(replay.timer); replay.timer = 0; }
  }

  function replayListHtml(activeId) {
    var recs = window.CH_RECORDS || [];
    var mine = savedGames();
    function item(id, title, sub, del) {
      return '<li class="rec-item' + (id === activeId ? ' is-active' : '') + '">' +
        '<a href="#/replay/' + esc(id) + '"><strong>' + esc(title) + '</strong><small>' + esc(sub) + '</small></a>' +
        (del ? '<button type="button" class="icon-btn" data-del="' + esc(del) + '" title="刪除這筆棋譜" aria-label="刪除">🗑</button>' : '') +
        '</li>';
    }
    function group(title, tag) {
      var list = recs.filter(function (r) { return r.tag === tag; });
      if (!list.length) return '';
      return '<section class="card">' +
        '<div class="card-head"><h2>' + title + '</h2><span class="count-pill">' + list.length + '</span></div>' +
        '<ul class="rec-list">' + list.map(function (r) {
          return item(r.id, r.title, r.moves.split(/\s+/).length + ' 步');
        }).join('') + '</ul></section>';
    }
    return '<section class="card">' +
        '<div class="card-head"><h2>我的棋譜</h2><span class="count-pill">' + mine.length + '</span></div>' +
        (mine.length
          ? '<ul class="rec-list">' + mine.map(function (g) {
            return item('my-' + g.id, g.title, g.date + ' · ' + (g.moves || []).length + ' 步' + (g.result ? ' · ' + g.result : ''), g.id);
          }).join('') + '</ul>'
          : '<p class="muted">下完的對局會自動存到這裡；也可以在下方貼上 PGN 棋譜匯入。</p>') +
        '<details class="import-box"><summary>📥 匯入棋譜（PGN）</summary>' +
          '<textarea id="importText" rows="5" placeholder="貼上 PGN 或記譜文字，例如：&#10;1. e4 e5 2. Nf3 Nc6 3. Bb5 a6"></textarea>' +
          '<div class="import-actions"><button type="button" class="btn btn-primary" data-ract="import">匯入</button>' +
          '<span class="muted" id="importMsg"></span></div>' +
        '</details>' +
      '</section>' +
      statsCardHtml() +
      group('經典短局', '經典短局') + group('開局示範', '開局示範');
  }

  function renderReplay(id) {
    stopAuto();
    var recs = window.CH_RECORDS || [];
    var rec = id ? findRecord(id) : null;
    if (!rec) {
      var mine = savedGames();
      rec = mine.length && !id ? findRecord('my-' + mine[0].id) : recs[0];
      if (id && !rec) rec = recs[0];
    }
    replay.rec = rec;
    try {
      replay.game = recordGame(rec);
    } catch (_) {
      replay.game = new E.Game();
    }
    replay.idx = rec.snap && !rec.fromStart ? replay.game.history.length : 0;
    replay.animate = false;
    replay.flip = rec.flip === undefined ? !!prefs.flipped : !!rec.flip;

    main.innerHTML =
      '<div class="ch-stage">' +
        '<div class="ch-board-col">' +
          '<div class="ch-board-wrap" id="replayBoard"></div>' +
          '<div class="rp-controls">' +
            '<button type="button" class="btn" data-ract="first" title="回到開局" aria-label="回到開局">⏮</button>' +
            '<button type="button" class="btn" data-ract="prev" title="上一步（←）" aria-label="上一步">◀</button>' +
            '<button type="button" class="btn btn-primary" data-ract="auto" id="rpAuto">▶ 自動播放</button>' +
            '<button type="button" class="btn" data-ract="next" title="下一步（→）" aria-label="下一步">▶</button>' +
            '<button type="button" class="btn" data-ract="last" title="跳到最後" aria-label="跳到最後">⏭</button>' +
          '</div>' +
          '<input type="range" id="rpSlider" class="rp-slider" min="0" max="' + replay.game.history.length + '" step="1" aria-label="步數" />' +
        '</div>' +
        '<aside class="ch-side">' +
          '<section class="card">' +
            '<div class="card-head"><h2>' + esc(rec.title) + '</h2><span class="tag-pill">' + esc(rec.tag || '棋譜') + '</span></div>' +
            '<p class="rec-desc">' + esc(rec.desc || '') + '</p>' +
            (rec.back ? '<p><a class="link-btn" href="' + esc(rec.back) + '">← 回到這一題</a></p>' : '') +
            '<div class="rp-pos" id="rpPos"></div>' +
            '<div class="mv-scroll" id="rpMoves"></div>' +
            '<div class="card-tools rp-tools">' +
              '<button type="button" class="link-btn" data-ract="continue">♟️ 從這個局面接著下</button>' +
              '<button type="button" class="link-btn" data-ract="flip">🔃 翻轉</button>' +
              '<button type="button" class="link-btn" data-ract="copy">📋 複製 PGN</button>' +
            '</div>' +
          '</section>' +
          '<div id="rpLists">' + replayListHtml(rec.id) + '</div>' +
        '</aside>' +
      '</div>';
    replay.board = window.CHBoard.create(document.getElementById('replayBoard'), {});
    refreshReplay();
  }

  function replayPos() {
    var g = replay.game;
    return E.parseFen(replay.idx === 0 ? g.startFen : g.history[replay.idx - 1].fen);
  }

  function refreshReplay() {
    var g = replay.game;
    var pos = replayPos();
    replay.board.render({
      board: pos.board, flipped: replay.flip, faceToFace: false, selected: -1, targets: [],
      last: replay.idx > 0 ? g.history[replay.idx - 1].move : -1,
      check: checkSquare(pos), animate: replay.animate, hint: -1,
    });
    replay.animate = false;
    var total = g.history.length;
    var label = '第 ' + replay.idx + ' / ' + total + ' 步';
    if (replay.idx === total && g.result()) label += ' · ' + NT.resultText(g.result());
    else if (replay.idx < total || !g.result()) label += ' · 輪到' + sideName(pos.turn);
    document.getElementById('rpPos').textContent = label;
    var box = document.getElementById('rpMoves');
    box.innerHTML = moveListHtml(g, replay.idx, true);
    var active = box.querySelector('.is-active');
    if (active) {
      var top = active.offsetTop - box.offsetTop;
      if (top < box.scrollTop || top > box.scrollTop + box.clientHeight - 36) box.scrollTop = Math.max(0, top - box.clientHeight / 2);
    } else {
      box.scrollTop = 0;
    }
    document.getElementById('rpSlider').value = replay.idx;
    document.getElementById('rpAuto').textContent = replay.timer ? '⏸ 暫停' : '▶ 自動播放';
  }

  function replayGoto(idx) {
    var total = replay.game.history.length;
    idx = Math.max(0, Math.min(total, idx));
    replay.animate = idx === replay.idx + 1;
    replay.idx = idx;
    if (idx >= total) stopAuto();
    refreshReplay();
  }

  function onReplayAction(act) {
    var g = replay.game;
    if (act === 'first') { stopAuto(); replayGoto(0); }
    else if (act === 'prev') { stopAuto(); replayGoto(replay.idx - 1); }
    else if (act === 'next') { stopAuto(); replayGoto(replay.idx + 1); }
    else if (act === 'last') { stopAuto(); replayGoto(g.history.length); }
    else if (act === 'auto') {
      if (replay.timer) { stopAuto(); refreshReplay(); return; }
      if (replay.idx >= g.history.length) replay.idx = 0;
      replay.timer = setInterval(function () { replayGoto(replay.idx + 1); }, replay.speed);
      replayGoto(replay.idx + 1);
      campusAct();
    } else if (act === 'flip') {
      replay.flip = !replay.flip;
      if (replay.rec.flip === undefined) { prefs.flipped = replay.flip; savePrefs(); }
      refreshReplay();
    } else if (act === 'copy') {
      copyText(NT.exportText(g, replay.rec.title));
    } else if (act === 'continue') {
      if (!play.game) loadPlay();
      if (play.game.history.length && !play.game.result() &&
          !window.confirm('「對弈」頁還有一局沒下完，要改從這個局面接著下嗎？')) return;
      var ng = E.Game.fromMoves(g.startFen, g.moveStrings().slice(0, replay.idx));
      startGame(ng, replay.rec.title + '（接續對弈）');
      location.hash = '#/play';
    } else if (act === 'import') {
      var ta = document.getElementById('importText');
      var msg = document.getElementById('importMsg');
      var r = NT.importText(ta.value);
      if (!r.game || !r.game.history.length) {
        msg.textContent = r.error || '沒有讀到任何走法。';
        return;
      }
      var id = upsertSaved(null, r.title || '匯入棋譜 ' + nowStr(), r.game);
      if (r.error) toast(r.error);
      else toast('已匯入 ' + r.game.history.length + ' 步');
      if (location.hash === '#/replay/my-' + id) renderReplay('my-' + id);
      else location.hash = '#/replay/my-' + id;
    }
  }

  // ------------------------------------------------------------------ 走法速查
  var GUIDE = [
    { name: '國王 King（K）', fen: '4k3/8/8/8/3K4/8/8/8 w - - 0 1', sq: ['d4'],
      text: '直、橫、斜都能走，但一次只能走一格。國王不能走到會被對方吃掉的格子；被將軍時必須立刻化解。國王價值無限：被將死就輸了。' },
    { name: '皇后 Queen（Q）', fen: '4k3/8/8/8/3Q4/8/8/4K3 w - - 0 1', sq: ['d4'],
      text: '直、橫、斜都能走，格數不限，但不能越過其他棋子。皇后是最強的棋子，大約值 9 個兵。' },
    { name: '城堡 Rook（R）', fen: '4k3/8/8/8/3R4/8/8/4K3 w - - 0 1', sq: ['d4'],
      text: '直走或橫走，格數不限，不能越過其他棋子。大約值 5 個兵；還能和國王一起「王車易位」。' },
    { name: '主教 Bishop（B）', fen: '4k3/8/8/8/3B4/8/8/4K3 w - - 0 1', sq: ['d4'],
      text: '只能斜走，格數不限，所以一輩子都待在同一種顏色的格子上。大約值 3 個兵。' },
    { name: '騎士 Knight（N）', fen: '4k3/8/8/2ppp3/3N4/2PPP3/8/4K3 w - - 0 1', sq: ['d4'],
      text: '走「日」字（L 形）：先直或橫走兩格，再轉彎走一格。騎士是唯一可以跳過其他棋子的棋子——示範中它被團團圍住，照樣跳得出去。大約值 3 個兵。' },
    { name: '兵 Pawn', fen: '4k3/8/8/3p1p2/4P3/8/1P6/4K3 w - - 0 1', sq: ['b2', 'e4'],
      text: '只能往前走一格，不能後退；還在起始位置時可以選擇一次走兩格。吃子的方向不一樣：只能吃斜前方一格的棋子。示範中左邊的兵可以走一格或兩格，右邊的兵可以前進，也可以吃掉斜前方的黑兵。' },
  ];
  var SPECIAL = [
    { name: '王車易位（O-O、O-O-O）', fen: 'r3k2r/pppq1ppp/2n5/8/8/2N5/PPPQ1PPP/R3K2R w KQkq - 0 1', sq: ['e1'],
      text: '國王往城堡的方向走兩格，城堡跳過國王站到它旁邊，一步同時動兩個棋子。條件：國王和那個城堡都還沒動過、兩者之間沒有棋子、國王目前沒被將軍，而且國王經過與到達的格子都沒被攻擊。往近的一邊叫短易位（O-O），遠的一邊叫長易位（O-O-O）。' },
    { name: '吃過路兵（en passant）', fen: '4k3/8/8/3pP3/8/8/8/4K3 w - d6 0 1', sq: ['e5'],
      text: '對方的兵從起始位置一次走兩格，剛好停在你的兵旁邊時，你可以在「下一步」把它當成只走一格來吃：你的兵斜走到它後面那一格，被吃的兵從棋盤上拿掉。這個權利只有緊接著的那一步有效。示範中黑兵剛從 d7 走到 d5，白兵可以吃到 d6。' },
    { name: '兵升變', fen: '4k3/1P6/8/8/8/8/8/4K3 w - - 0 1', sq: ['b7'],
      text: '兵走到對方底線時，必須立刻變成皇后、城堡、主教或騎士（不能變國王，也不能維持兵）。通常變皇后；偶爾為了避免逼和或製造騎士捉雙，會變成別的棋子，叫做「低升變」。' },
  ];

  function guideCards(list, prefix) {
    return list.map(function (g, i) {
      return '<section class="card guide-card"><div class="guide-board" id="' + prefix + i + '"></div>' +
        '<div><h2>' + esc(g.name) + '</h2><p>' + esc(g.text) + '</p></div></section>';
    }).join('');
  }
  function drawGuides(list, prefix) {
    list.forEach(function (g, i) {
      var pos = E.parseFen(g.fen);
      var targets = [];
      g.sq.forEach(function (s) {
        E.legalMovesFrom(pos, E.strToSq(s)).forEach(function (m) {
          if (targets.indexOf(E.toOf(m)) < 0) targets.push(E.toOf(m));
        });
      });
      window.CHBoard.create(document.getElementById(prefix + i), {}).render({
        board: pos.board, flipped: false, faceToFace: false,
        selected: g.sq.length === 1 ? E.strToSq(g.sq[0]) : -1, targets: targets, last: -1, check: -1, hint: -1,
      });
    });
  }

  function renderRules() {
    main.innerHTML =
      '<div class="rules-wrap">' +
        '<section class="card rules-intro">' +
          '<h1>走法速查</h1>' +
          '<p>白方先走，雙方輪流各走一步。把對方的國王逼到「被將軍又無路可逃」就獲勝，叫做將死。下面每個棋盤上的圓點是該棋子可以走到的格子，紅圈是可以吃掉的棋子。棋盤的直行叫 a–h 線、橫排叫第 1–8 排，每一格用「線＋排」稱呼，例如 e4。</p>' +
        '</section>' +
        '<div class="guide-grid">' + guideCards(GUIDE, 'guide') + '</div>' +
        '<section class="card rules-intro"><h1>三個特殊規則</h1>' +
          '<p>西洋棋有三種特別的走法，初學時最容易忽略，實戰卻很常用。</p></section>' +
        '<div class="guide-grid">' + guideCards(SPECIAL, 'special') + '</div>' +
        '<section class="card">' +
          '<h2>勝負怎麼算</h2>' +
          '<ul class="plain-list">' +
            '<li><strong>將死（checkmate）</strong>：國王被將軍，而且沒有任何走法可以解除，判負。</li>' +
            '<li><strong>逼和（stalemate）</strong>：沒有被將軍，但輪到自己時沒有任何合法走法，算<strong>和棋</strong>。這是落後一方最重要的救命手段。</li>' +
            '<li><strong>三次重複局面</strong>：同一個局面（同一方輪走）出現三次，和棋。一直將軍、對方躲不掉的「長將」就是靠這條規則求和。</li>' +
            '<li><strong>五十步規則</strong>：連續五十回合沒有吃子、也沒有走兵，和棋。</li>' +
            '<li><strong>子力不足</strong>：雙方剩下的棋子都不可能將死對方（例如只剩兩個國王，或國王加一個主教或騎士對單獨的國王），和棋。</li>' +
            '<li><strong>認輸、議和、超時</strong>：隨時可以認輸；雙方同意可以和棋；線上對弈有計時的話，時間用完判負。</li>' +
          '</ul>' +
          '<p class="muted">以上規則都由本院自動判定。線上對弈、對 AI 與同機雙人採用同一套正式規則。</p>' +
        '</section>' +
        '<section class="card">' +
          '<h2>記譜怎麼看</h2>' +
          '<ul class="plain-list">' +
            '<li>棋子用英文字母代表：<strong>K</strong> 國王、<strong>Q</strong> 皇后、<strong>R</strong> 城堡、<strong>B</strong> 主教、<strong>N</strong> 騎士；兵不寫字母。</li>' +
            '<li><strong>Nf3</strong>：騎士走到 f3。<strong>e4</strong>：兵走到 e4。<strong>Bxc6</strong>：主教吃掉 c6 的棋子（x 表示吃子）。<strong>exd5</strong>：e 線的兵吃掉 d5。</li>' +
            '<li><strong>O-O</strong> 短易位、<strong>O-O-O</strong> 長易位；<strong>e8=Q</strong> 兵升變為皇后。</li>' +
            '<li><strong>+</strong> 將軍、<strong>#</strong> 將死。兩個相同的棋子都能走到同一格時，會多寫起點的線或排，例如 <strong>Nbd7</strong>。</li>' +
          '</ul>' +
        '</section>' +
      '</div>';
    drawGuides(GUIDE, 'guide');
    drawGuides(SPECIAL, 'special');
  }

  // ------------------------------------------------------------------ 路由
  function route() {
    stopAuto();
    closePromotion();
    // 離開對弈頁時停止 AI 思考；回來時 renderPlay 會再請 AI 接手。
    stopThinking();
    if (window.CHStudy) window.CHStudy.stop();
    if (window.CHOnline) window.CHOnline.stop();
    var parts = (location.hash || '#/play').replace(/^#\/?/, '').split('/');
    var view = parts[0] || 'play';
    if (view === 'replay') renderReplay(parts[1] ? decodeURIComponent(parts[1]) : '');
    else if (view === 'rules') renderRules();
    else if (window.CHStudy && window.CHStudy.handles(view)) window.CHStudy.render(view, parts.slice(1).map(decodeURIComponent));
    else if (window.CHOnline && window.CHOnline.handles(view)) window.CHOnline.render(parts.slice(1).map(decodeURIComponent));
    else { view = 'play'; renderPlay(); }
    document.querySelectorAll('[data-nav]').forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('data-nav') === view);
    });
    document.body.setAttribute('data-view', view);
  }

  main.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act],[data-ract],[data-goto],[data-del],[data-stats-reset]');
    if (!t || t.disabled) return;
    if (t.hasAttribute('data-stats-reset')) {
      if (!window.confirm('確定要清除所有戰績嗎？棋譜不會被刪除，但勝負紀錄清掉後無法復原。')) return;
      statsSave(Stats.reset(statsLoad()));
      play.counted = null;
      if (play.game) persistPlay();
      toast('已清除戰績');
      route();
    } else if (t.hasAttribute('data-act')) onPlayAction(t.getAttribute('data-act'));
    else if (t.hasAttribute('data-ract')) onReplayAction(t.getAttribute('data-ract'));
    else if (t.hasAttribute('data-goto')) { stopAuto(); replayGoto(+t.getAttribute('data-goto')); }
    else if (t.hasAttribute('data-del')) {
      var id = t.getAttribute('data-del');
      if (!window.confirm('確定要刪除這筆棋譜嗎？')) return;
      save(KEY_GAMES, savedGames().filter(function (g) { return g.id !== id; }));
      if (replay.rec && replay.rec.id === 'my-' + id) {
        if (location.hash === '#/replay') renderReplay(''); else location.hash = '#/replay';
      } else {
        document.getElementById('rpLists').innerHTML = replayListHtml(replay.rec ? replay.rec.id : '');
      }
    }
  });
  main.addEventListener('change', function (ev) {
    var id = ev.target.id;
    if (id !== 'oppSel' && id !== 'sideSel') return;
    stopThinking();
    if (id === 'oppSel') {
      play.ai = +ev.target.value;
    } else {
      play.human = +ev.target.value === E.BLACK ? E.BLACK : E.WHITE;
      prefs.flipped = play.human === E.BLACK; // 自己的棋子放在畫面下方
      savePrefs();
    }
    play.selected = -1;
    play.animate = false;
    persistPlay();
    refreshPlay();
    maybeAiMove();
  });
  main.addEventListener('input', function (ev) {
    if (ev.target.id === 'rpSlider') { stopAuto(); replayGoto(+ev.target.value); }
  });
  window.addEventListener('keydown', function (ev) {
    if (document.body.getAttribute('data-view') !== 'replay') return;
    var tag = ev.target && ev.target.tagName;
    if (tag === 'TEXTAREA' || tag === 'INPUT') return;
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); onReplayAction('prev'); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); onReplayAction('next'); }
  });

  // ------------------------------------------------------------------ 版本紀錄
  function initReleaseModal() {
    var btn = document.getElementById('versionBadgeBtn');
    var modal = document.getElementById('releaseModal');
    var body = document.getElementById('releaseModalBody');
    var data = window.CHESS_RELEASES || { current_version: '1.0.0', releases: [] };
    document.getElementById('verText').textContent = 'v' + data.current_version;
    function close() { modal.hidden = true; }
    btn.addEventListener('click', function () {
      body.innerHTML = (data.releases || []).map(function (r) {
        return '<div class="rel-item"><div class="rel-head"><span class="rel-ver">v' + esc(r.version) + '</span>' +
          '<span class="rel-date">' + esc(r.date) + '</span></div><h3>' + esc(r.title) + '</h3><ul>' +
          (r.changes || []).map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>';
      }).join('') || '<p class="muted">尚無版本紀錄。</p>';
      modal.hidden = false;
    });
    document.getElementById('closeReleaseModalBtn').addEventListener('click', close);
    modal.addEventListener('click', function (ev) { if (ev.target === modal) close(); });
    window.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !modal.hidden) close(); });
  }

  // 給 study.js（戰術題庫與課程）與 online.js（線上對弈）共用的工具。
  window.CHApp = {
    main: main, esc: esc, load: load, save: save, toast: toast, prefs: prefs, copyText: copyText,
    campusAct: campusAct, moveListHtml: moveListHtml, checkSquare: checkSquare, sideName: sideName,
    tryMove: tryMove, targetsOf: targetsOf,
    upsertSaved: upsertSaved, statsLoad: statsLoad, statsSave: statsSave, statsCardHtml: statsCardHtml,
  };

  function init() {
    initReleaseModal();
    initPromotion();
    window.addEventListener('hashchange', route);
    route();
    if (window.CampusNav && typeof window.CampusNav.wire === 'function') window.CampusNav.wire();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

  </script>
