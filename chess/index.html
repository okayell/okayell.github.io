<html lang="zh-Hant"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>♟️ 西洋棋學院 · 線上對弈、AI 對弈、戰術題庫與逆轉技巧課程</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%237c3aed'/%3E%3Cstop offset='100%25' stop-color='%234c1d95'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url%28%23g%29'/%3E%3Ccircle cx='32' cy='19' r='8.5' fill='%23fff'/%3E%3Cpath d='M26 26 C19 34 17 42 17 47 L47 47 C47 42 45 34 38 26 Z' fill='%23fff'/%3E%3Crect x='13' y='46' width='38' height='8' rx='3' fill='%23fff'/%3E%3C/svg%3E" /><link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%237c3aed'/%3E%3Cstop offset='100%25' stop-color='%234c1d95'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url%28%23g%29'/%3E%3Ccircle cx='32' cy='19' r='8.5' fill='%23fff'/%3E%3Cpath d='M26 26 C19 34 17 42 17 47 L47 47 C47 42 45 34 38 26 Z' fill='%23fff'/%3E%3Crect x='13' y='46' width='38' height='8' rx='3' fill='%23fff'/%3E%3C/svg%3E" /><meta name="description" content="西洋棋學院（Chess Academy）：免安裝的西洋棋棋盤，內建完整規則引擎（王車易位、吃過路兵、升變），支援免註冊的線上對弈（計時、悔棋請求、觀戰）、四種難度的 AI 對弈與提示、戰術與逆轉題庫、戰術與逆轉技巧課程、同機雙人對弈、代數記譜、PGN 棋譜回放與匯入，以及六種棋子的走法速查。" /><style>
/* ♟️ 西洋棋學院 — 淺色、乾淨、以棋盤為主角的版面 */
:root {
  --bg: #f8f6f1;
  --card: #ffffff;
  --line: #e7e2d8;
  --text: #1f2937;
  --muted: #6b7280;
  --accent: #6d28d9;
  --accent-soft: #ede9fe;
  --red: #b91c1c;
  --white-side: #ffffff;
  --black: #111827;
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
.muted { color: var(--muted); font-size: 13px; }

/* ---------- 標題列 ---------- */
.top-header {
  position: sticky; top: 0; z-index: 30;
  background: rgba(255, 255, 255, .96);
  border-bottom: 1px solid var(--line);
}
.header-inner {
  max-width: 1120px; margin: 0 auto; padding: 8px 16px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.brand-link { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--text); }
.brand-icon { font-size: 22px; line-height: 1; }
.brand-name { font-size: 18px; font-weight: 700; letter-spacing: .04em; }
.ver-pill {
  border: 1px solid var(--line); background: #fff; border-radius: 999px;
  padding: 1px 9px; font-size: 12px; color: var(--muted); cursor: pointer;
}
.ver-pill:hover { border-color: var(--accent); color: var(--accent); }
.main-nav { display: flex; gap: 4px; margin-left: auto; }
.nav-tab {
  padding: 6px 12px; border-radius: 999px; text-decoration: none;
  color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap;
}
.nav-tab:hover { background: #f3f0e8; color: var(--text); }
.nav-tab.active { background: var(--accent-soft); color: var(--accent); }

.main-container { max-width: 1120px; margin: 0 auto; padding: 16px; outline: none; }
.loading-state { padding: 60px 0; text-align: center; color: var(--muted); }

/* ---------- 對弈／回放共用版面 ---------- */
.ch-stage { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.ch-board-col { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
.ch-board-wrap {
  /* 棋盤是正方形；高度不超過視窗，手機則佔滿寬度。 */
  width: min(100%, calc(100vh - 96px), 640px);
}
body[data-view='replay'] .ch-board-wrap { width: min(100%, calc(100vh - 176px), 640px); }
.ch-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px;
}
.card h2 { font-size: 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.card-tools { display: flex; gap: 12px; flex-wrap: wrap; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; font-weight: 600; }
.link-btn:hover { text-decoration: underline; }
.link-btn:disabled { color: #c4c0b6; cursor: default; text-decoration: none; }
.icon-btn { border: 0; background: none; cursor: pointer; padding: 4px 6px; border-radius: 8px; color: var(--muted); }
.icon-btn:hover { background: #f3f0e8; color: var(--text); }
.count-pill, .tag-pill {
  font-size: 12px; padding: 1px 9px; border-radius: 999px; white-space: nowrap;
  background: #f3f0e8; color: var(--muted);
}
.tag-pill { background: var(--accent-soft); color: var(--accent); }

.btn {
  border: 1px solid var(--line); background: #fff; border-radius: 10px;
  padding: 8px 10px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; border-color: var(--line); }
.btn.is-on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #5b21b6; }
.btn-danger:hover { border-color: var(--red); color: var(--red); }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-grid .btn:last-child:nth-child(odd) { grid-column: 1 / -1; }
.opp-card { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opp-card label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.opp-card select {
  font: inherit; font-size: 14px; font-weight: 600; color: var(--text); padding: 7px 8px;
  border: 1px solid var(--line); border-radius: 10px; background: #fff; width: 100%;
}

.status-turn { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; }
.turn-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--black); flex: none; }
.turn-dot { box-shadow: inset 0 0 0 2px var(--black); }
.status-turn.is-white .turn-dot { background: var(--white-side); }
.badge-check {
  margin-left: auto; background: var(--red); color: #fff; border-radius: 999px;
  padding: 1px 10px; font-size: 13px;
}
.status-result { font-size: 20px; font-weight: 800; color: var(--accent); }
#playStatus .muted { margin-top: 4px; }

/* ---------- 棋譜列表 ---------- */
.mv-scroll { max-height: 236px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; background: #fcfbf8; }
.mv-list { list-style: none; margin: 0; padding: 4px 0; }
.mv-list li { display: grid; grid-template-columns: 38px 1fr 1fr; align-items: center; padding: 1px 8px; }
.mv-list li:nth-child(even) { background: #f6f3ec; }
.mv-no { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.mv { border: 0; background: none; text-align: left; padding: 3px 6px; border-radius: 6px; font-size: 15px; font-variant-numeric: tabular-nums; }
.mv-white, .mv-black { color: var(--black); }
button.mv { cursor: pointer; }
button.mv:hover { background: #ece7db; }
.mv.is-active { background: var(--accent-soft); font-weight: 700; box-shadow: inset 0 0 0 1px #8b5cf6; }
.mv-none { padding: 14px; text-align: center; }
.cap-box { margin-top: 10px; display: grid; gap: 4px; }
.cap-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-height: 26px; }
.cap-label { font-size: 12px; color: var(--muted); margin-right: 4px; }
.cap-row .ch-pc-icon { margin-right: -4px; }
.cap-diff { font-size: 12px; color: var(--muted); margin-left: 8px; font-weight: 700; }

/* ---------- 回放 ---------- */
.rp-controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.rp-controls .btn { min-width: 46px; }
.rp-slider { width: min(100%, 520px); accent-color: var(--accent); }
.rp-pos { font-size: 13px; color: var(--muted); margin: 8px 0 6px; }
.rec-desc { font-size: 14px; color: #4b5563; }
.rp-tools { margin-top: 10px; }
.rec-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.rec-item { display: flex; align-items: center; border-radius: 10px; }
.rec-item a { flex: 1; min-width: 0; display: grid; padding: 6px 10px; text-decoration: none; color: var(--text); border-radius: 10px; }
.rec-item a:hover { background: #f6f3ec; }
.rec-item.is-active a { background: var(--accent-soft); }
.rec-item strong { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec-item small { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.import-box { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
.import-box summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); }
.import-box textarea {
  width: 100%; margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
  font: inherit; font-size: 14px; resize: vertical; background: #fcfbf8;
}
.import-actions { display: flex; align-items: center; gap: 10px; margin-top: 6px; }

/* ---------- 走法速查 ---------- */
.rules-wrap { display: grid; gap: 14px; }
.rules-intro h1 { font-size: 20px; margin-bottom: 4px; }
.guide-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; }
.guide-card { display: grid; grid-template-columns: 190px 1fr; gap: 14px; align-items: start; }
.guide-card h2 { margin-bottom: 4px; }
.guide-card p { font-size: 14px; color: #4b5563; }
.plain-list { margin: 8px 0; padding-left: 20px; display: grid; gap: 4px; }

/* ---------- 棋盤 SVG ---------- */
.ch-board { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; touch-action: manipulation; cursor: pointer; }
.guide-board .ch-board, #replayBoard .ch-board, .demo-board .ch-board { cursor: default; }
.ch-bd-frame { fill: #4b3a2a; }
.ch-sq-light { fill: #f0e3cd; }
.ch-sq-dark { fill: #b48a63; }
.ch-bd-labels text { font-size: 15px; fill: #eadbc3; text-anchor: middle; dominant-baseline: central; font-weight: 700; }
.ch-pc.is-sliding { transition: transform .18s ease-out; }
.ch-pc-fill { stroke-width: 2.4; stroke-linejoin: round; }
.ch-pc-line { fill: none; stroke-width: 2.2; stroke-linecap: round; }
.ch-pc.is-white .ch-pc-fill { fill: #fffdf7; stroke: #1f2937; }
.ch-pc.is-white .ch-pc-line { stroke: #1f2937; }
.ch-pc.is-white .ch-pc-dot { fill: #1f2937; }
.ch-pc.is-black .ch-pc-fill { fill: #2b2f38; stroke: #0b0f19; }
.ch-pc.is-black .ch-pc-line { stroke: #e5e7eb; }
.ch-pc.is-black .ch-pc-dot { fill: #e5e7eb; }
.ch-pc-icon { display: inline-block; vertical-align: middle; flex: none; }
.ch-mk-last { fill: rgba(250, 204, 21, .45); }
.ch-mk-selected { fill: rgba(124, 58, 237, .42); }
.ch-mk-check { fill: rgba(220, 38, 38, .55); }
.ch-mk-target { fill: rgba(22, 101, 52, .55); pointer-events: none; }
.ch-mk-capture { fill: none; stroke: rgba(220, 38, 38, .85); stroke-width: 5; pointer-events: none; }
.ch-mk-hint { fill: none; stroke: #2563eb; stroke-width: 5; pointer-events: none; }
.ch-mk-hint.is-to { fill: rgba(37, 99, 235, .25); }
.ch-mk-hint-line { stroke: #2563eb; stroke-width: 9; stroke-linecap: round; opacity: .55; pointer-events: none; }

/* ---------- 升變選單 ---------- */
.promo-card { background: #fff; border-radius: var(--radius); padding: 16px 18px; width: min(380px, 100%); }
.promo-card h2 { font-size: 17px; margin-bottom: 4px; }
.promo-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.promo-btn {
  display: grid; justify-items: center; gap: 2px; padding: 8px 4px; border: 1px solid var(--line); border-radius: 12px;
  background: #faf8f3; cursor: pointer; font-size: 13px; font-weight: 600;
}
.promo-btn:hover { border-color: var(--accent); background: var(--accent-soft); }

/* ---------- 視窗與提示 ---------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 60; background: rgba(17, 24, 39, .45);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal-card { background: #fff; border-radius: var(--radius); width: min(620px, 100%); max-height: 84vh; display: flex; flex-direction: column; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 17px; }
.modal-body { padding: 14px 16px; overflow-y: auto; }
.rel-item + .rel-item { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.rel-head { display: flex; gap: 10px; align-items: baseline; }
.rel-ver { font-weight: 800; color: var(--accent); }
.rel-date { color: var(--muted); font-size: 12px; }
.rel-item h3 { font-size: 15px; margin: 2px 0 4px; }
.rel-item ul { margin: 0; padding-left: 20px; font-size: 14px; }
.ch-toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 70;
  background: rgba(17, 24, 39, .92); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 14px;
  max-width: calc(100vw - 32px); text-align: center;
}

/* ---------- 殘局題庫與課程 ---------- */
.study-wrap { display: grid; gap: 14px; }
.study-wrap h1 { font-size: 20px; margin-bottom: 4px; }
.pz-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.pz-score { display: grid; justify-items: end; flex: none; }
.pz-score-main { font-size: 26px; font-weight: 800; color: var(--accent); line-height: 1.2; white-space: nowrap; }
.pz-score-main small { font-size: 14px; color: var(--muted); font-weight: 600; }
.pz-filters { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg-btn {
  border: 0; border-right: 1px solid var(--line); background: #fff; padding: 6px 14px; cursor: pointer;
  font-weight: 600; font-size: 14px; display: grid; justify-items: center; line-height: 1.25;
}
.seg-btn:last-child { border-right: 0; }
.seg-btn small { font-size: 11px; color: var(--muted); font-weight: 500; }
.seg-btn.is-on { background: var(--accent-soft); color: var(--accent); }
.pz-select { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.pz-select select { font: inherit; font-size: 14px; color: var(--text); padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.pz-check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
.pz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pz-card {
  display: grid; gap: 2px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px;
  text-decoration: none; color: var(--text); background: #fcfbf8;
}
.pz-card:hover { border-color: var(--accent); background: #fff; }
.pz-card.is-done { background: #f3faf3; border-color: #cfe8cf; }
.pz-card-top { display: flex; justify-content: space-between; align-items: center; min-height: 20px; }
.pz-n { font-size: 12px; color: var(--accent); font-weight: 700; }
.pz-card strong { font-size: 15px; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pz-card small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pz-status { margin-top: 10px; }
.pz-status .muted { margin-top: 4px; }
.status-result.is-fail { color: var(--red); }
.pz-rule { margin-top: 10px; }
.pz-nav { display: flex; justify-content: space-between; gap: 10px; }
.pz-nav .btn { text-decoration: none; color: var(--text); text-align: center; white-space: normal; }
.pz-nav .btn-primary { color: #fff; }

.ls-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 8px; margin-top: 10px; }
.ls-card {
  display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid var(--line);
  border-radius: 10px; text-decoration: none; color: var(--text); background: #fcfbf8;
}
.ls-card:hover { border-color: var(--accent); background: #fff; }
.ls-card.is-done { background: #f3faf3; border-color: #cfe8cf; }
.ls-no {
  flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
}
.ls-text { display: grid; min-width: 0; flex: 1; }
.ls-text strong { font-size: 15px; }
.ls-text small { font-size: 12px; color: var(--muted); }
.ls-st { color: #16a34a; font-weight: 800; flex: none; width: 14px; }
.lesson { max-width: 860px; margin: 0 auto; }
.crumb { font-size: 13px; color: var(--muted); }
.crumb a { color: var(--accent); text-decoration: none; }
.ls-summary { color: var(--accent); font-weight: 600; margin-bottom: 8px; }
.ls-p { margin-top: 8px; color: #374151; }
.demo-card { display: grid; grid-template-columns: minmax(0, 340px) 1fr; gap: 18px; align-items: start; }
.demo-side h2 { margin-bottom: 2px; }
.demo-controls { justify-content: flex-start; margin-top: 12px; }
.demo-info { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.demo-mv { padding: 2px 8px; border-radius: 6px; background: #f6f3ec; font-size: 15px; }
.demo-no { color: var(--muted); font-size: 12px; margin-right: -2px; }
.demo-end.is-draw { background: #6b7280; }
.demo-end.is-win { background: #15803d; }
.demo-mv.is-active { background: var(--accent-soft); box-shadow: inset 0 0 0 1px #8b5cf6; font-weight: 700; }
.demo-end { font-size: 13px; color: #fff; background: var(--red); border-radius: 999px; padding: 1px 10px; }
.ls-links { display: flex; flex-wrap: wrap; gap: 8px; }
.ls-links .btn { text-decoration: none; color: var(--text); white-space: normal; }
.ls-links .btn-primary { color: #fff; }
.term-list { margin: 10px 0 0; display: grid; gap: 0; }
.term-list > div { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.term-list dt { font-weight: 700; color: var(--accent); }
.term-list dd { margin: 0; color: #374151; }
.demo-board .ch-board { cursor: default; }

/* ---------- 線上對弈 ---------- */
body[data-view='online'] .ch-board-wrap { width: min(100%, calc(100vh - 190px), 640px); }
.on-name { display: grid; gap: 3px; font-size: 12px; color: var(--muted); flex: none; }
.on-name input, .on-form input[type='text'], .on-form select, .on-invite input {
  font: inherit; font-size: 15px; color: var(--text); padding: 7px 10px; border: 1px solid var(--line);
  border-radius: 10px; background: #fff; min-width: 0;
}
.on-name input { width: 150px; font-weight: 600; }
.on-two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.on-two h2 { margin-bottom: 10px; }
.on-form { display: grid; gap: 10px; }
.on-form > label:not(.pz-check) { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
#onCode { text-transform: uppercase; letter-spacing: .2em; font-weight: 700; }
.on-room-row { gap: 8px; }
.on-room-row .btn { text-decoration: none; color: var(--text); flex: none; }
.on-room-row .btn-primary { color: #fff; }
.on-bar {
  width: min(100%, 640px); display: flex; align-items: center; gap: 8px; padding: 6px 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; min-height: 42px;
}
.on-dot { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--black); box-shadow: inset 0 0 0 2px var(--black); }
.on-dot.is-white { background: var(--white-side); }
.on-who { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.on-who.is-turn { color: var(--accent); }
.on-conn { font-size: 12px; padding: 0 8px; border-radius: 999px; flex: none; }
.on-conn.is-on { background: #dcfce7; color: #166534; }
.on-conn.is-off { background: #fee2e2; color: #991b1b; }
.on-clock {
  margin-left: auto; font: 700 20px/1.2 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums; padding: 2px 10px; border-radius: 8px; background: #f3f0e8; color: var(--muted);
}
.on-clock.is-run { background: #1f2937; color: #fff; }
.on-clock.is-run.is-low { background: var(--red); }
.on-invite { display: flex; gap: 8px; margin-top: 6px; }
.on-invite input { flex: 1; font-size: 13px; }
.on-offer {
  margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: #f6f3ec; font-size: 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
}
.on-offer.is-ask { background: var(--accent-soft); box-shadow: inset 0 0 0 1px #8b5cf6; }
.on-offer-btns { display: inline-flex; gap: 6px; }
.on-next { text-decoration: none; display: inline-block; margin-top: 8px; white-space: normal; }
#onStatus .muted { margin-top: 4px; }

.on-privacy summary { cursor: pointer; font-weight: 700; font-size: 15px; }
.on-privacy .plain-list { font-size: 14px; color: #374151; margin-bottom: 4px; }
.on-privacy[open] summary { margin-bottom: 6px; }

/* ---------- 我的戰績 ---------- */
#rpLists { display: grid; gap: 12px; }
.opp-stat { grid-column: 1 / -1; }
.st-title { font-size: 14px; margin: 12px 0 6px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.st-title small { font-weight: 400; font-size: 12.5px; color: var(--muted); }
.st-card .card-head + .st-title { margin-top: 0; }
.st-unfinished { display: grid; gap: 4px; margin-bottom: 10px; padding: 8px 10px; border-radius: 10px; background: var(--accent-soft); }
.st-unfinished .link-btn { text-decoration: none; text-align: left; }
.st-opps { display: grid; gap: 4px; }
.st-opp { border: 1px solid var(--line); border-radius: 10px; }
.st-opp summary, .st-ai li {
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; padding: 6px 10px; font-size: 14px;
}
.st-opp summary { cursor: pointer; }
.st-opp summary strong, .st-ai strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-wld { font-variant-numeric: tabular-nums; }
.st-opp summary small, .st-ai small { color: var(--muted); font-size: 12px; margin-left: auto; }
.st-games, .st-ai { list-style: none; margin: 0; padding: 0; }
.st-games { border-top: 1px dashed var(--line); padding: 4px 10px 6px; display: grid; gap: 2px; }
.st-games li { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.st-meta { flex: 1; min-width: 0; color: var(--muted); }
.st-games .link-btn { text-decoration: none; flex: none; }
.st-r { flex: none; width: 22px; text-align: center; border-radius: 6px; font-size: 12px; font-weight: 700; background: #f3f0e8; color: var(--muted); }
.st-r.is-w { background: #dcfce7; color: #166534; }
.st-r.is-l { background: #fee2e2; color: #991b1b; }
.st-ai { display: grid; gap: 2px; }
.st-ai li { border-radius: 10px; background: #faf8f3; }
.st-note { margin-top: 10px; }

@media (max-width: 880px) {

  .main-nav { margin-left: 0; width: 100%; }

  .on-two { grid-template-columns: minmax(0, 1fr); }

  .btn-grid { grid-template-columns: repeat(3, 1fr); }
  .btn-grid .btn:last-child:nth-child(odd) { grid-column: auto; }

  .guide-card { grid-template-columns: 150px 1fr; }
}

/* ---------- 題庫：主題與逆轉 ---------- */
.pz-goal { font-size: 12px; font-weight: 700; padding: 0 8px; border-radius: 999px; background: #f3f0e8; color: var(--muted); white-space: nowrap; }

.pz-card small { display: flex; gap: 4px; flex-wrap: wrap; white-space: normal; }
.pz-wrong { color: var(--red); font-weight: 700; }
.home-hero { display: grid; gap: 10px; }
.home-cta { display: flex; flex-wrap: wrap; gap: 8px; }
.home-cta .btn { text-decoration: none; color: var(--text); }

.ls-list { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 4px; color: #374151; }
.ls-tip { margin-top: 10px; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); color: #4c1d95; font-size: 14px; }

        return loc.protocol + '//' + (label.slice(0, 33) + pHex + label.slice(37)).toLowerCase() + host.slice(dot);

    return loc.protocol + '//' + host + ':' + p;

  function touchTabLease(locId) {

  function sendBeaconSafe(url, bodyStr, jsonHeaders) {

  function sendPresenceHeartbeat(toolId, opts) {
    opts = opts || {};

      if (!stu.uid) {

      var carsArr = Array.isArray(lsStu.cars) && lsStu.cars.length ? lsStu.cars
        : Array.isArray(ckStu.cars) && ckStu.cars.length ? ckStu.cars

      stu.cars = carsArr.slice(0, 60);
      stu.buildingId = toolId;
      stu.buildingName = t.name;
      stu.buildingIcon = t.icon;
      stu.activity = '正在「' + t.name + '」進修中';
      try {
        var funSt = loadFunState();
        var mergedBadges = {};
        (Array.isArray(stu.badges) ? stu.badges : []).forEach(function (b) { if (b) mergedBadges[b] = 1; });
        (Array.isArray(ckStu.badges) ? ckStu.badges : []).forEach(function (b) { if (b) mergedBadges[b] = 1; });
        Object.keys(funSt.badges || {}).forEach(function (b) { if (b) mergedBadges[b] = 1; });
        stu.badges = Object.keys(mergedBadges).slice(0, 200);
      } catch (e) { /* ignore */ }
      var minBadgeScore = 0;
      (stu.badges || []).forEach(function (bid) {
        if (bid === 'acad_welcome') minBadgeScore += 15;
        else if (ACAD_ACH[bid]) minBadgeScore += (+ACAD_ACH[bid].pts || 0);
      });
      stu.score = Math.max(+stu.score || 0, +lsStu.score || 0, +ckStu.score || 0, minBadgeScore);

      var isLeave = !!opts.leave;
      var idleSec = Math.max(0, Math.floor((Date.now() - _lastActMs) / 1000));
      var actSec = Math.max(0, navNowSec() - idleSec);
      var prevActSec = Math.max(+lsStu.activeTs || 0, +ckStu.activeTs || 0);
      if (prevActSec > actSec && prevActSec <= navNowSec()) actSec = prevActSec;
      var curState = isLeave ? 'offline' : (((!document.hidden && idleSec < 90) || _anyOtherTabActive) ? 'active' : 'away');
      stu.state = curState;
      stu.ts = navNowSec();
      stu.activeTs = actSec;
      if (!isLeave) {
        var persisted = Object.assign({}, stu);

        delete persisted.event;

        writeStuCookie(persisted);

      var isConfirmed = !!(stu.confirmed === true && stu.name);
      var dispName = isConfirmed ? String(stu.name).trim() : ('訪客 #' + String(stu.stuNo || stu.uid).slice(-4).toUpperCase());
      if (TEST_UID_RE.test(String(stu.uid)) || (isConfirmed && TEST_NAMES[dispName])) return;
      if (!isConfirmed) return; // 🪪 未在校園地圖取名的訪客不對外廣播（取名後才會出現在在線名單與排行榜）

      var wireMsg = Object.assign({}, stu, {
        name: dispName,
        avatar: stu.avatar || '🧑‍🎓',
        title: stu.title || (isConfirmed ? '🌱 開心學園新生' : '🌱 校園訪客'),

      if (_navBc) {

      } else if (window.BroadcastChannel) {
        try {
          var tmpBc = new BroadcastChannel(BC_NAME);

          tmpBc.close();

      }

      var loc = window.location;
      if (loc.protocol !== 'http:' && loc.protocol !== 'https:') return;
      var host = loc.hostname || '';
      var isGhPages = /(^|\.)github\.io$/i.test(host);
      var bodyStr = JSON.stringify(wireMsg);
      var nowMs = Date.now();

      if (isLeave) {
        navMqttPublish(MQTT_LIVE_TOPIC, bodyStr, false);
        navMqttPublish(MQTT_PEER_PREFIX + stu.uid, bodyStr, true);
        if (!isGhPages) sendBeaconSafe(campusBase() + 'api/presence', bodyStr, true);
        sendBeaconSafe('https://ntfy.sh/' + NTFY_TOPIC, bodyStr, false);
        return;
      }

      var mqttGap = document.hidden ? 28000 : 18000;
      var mqttSent = 0;
      if (opts.forceRemote || nowMs - _lastMqttSendMs >= mqttGap) {
        _lastMqttSendMs = nowMs;
        mqttSent = navMqttPublish(MQTT_LIVE_TOPIC, bodyStr, false);
        navMqttPublish(MQTT_PEER_PREFIX + stu.uid, bodyStr, true);
      }

      if (!isGhPages && (opts.forceRemote || nowMs - _lastApiSendMs >= 14000)) {

        }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
          if (j && (j.now_sec || j.now)) syncNavClock(j.now_sec || j.now);

      }

  function connectSingleAcademyMqtt(url, idx, toolId) {
    if (!window.WebSocket || isNavBot()) return;
    var existing = _navMqttClients[idx];
    if (existing && existing.ws && (existing.ws.readyState === 0 || existing.ws.readyState === 1)) return;
    if (existing && existing.pingT) { clearInterval(existing.pingT); existing.pingT = 0; }
    if (existing && existing.retryT) { clearTimeout(existing.retryT); existing.retryT = 0; }

    var entry = existing || { url: url, ws: null, ready: false, backoff: 1500, pingT: 0, retryT: 0, pktId: 1 };
    entry.ready = false;
    _navMqttClients[idx] = entry;

    var ws;
    try {
      ws = new WebSocket(url, 'mqtt');
      ws.binaryType = 'arraybuffer';
    } catch (e) {
      return;
    }
    entry.ws = ws;
    var rxBuf = new Uint8Array(0);

    ws.onopen = function () {
      if (entry.ws !== ws) return;
      var cid = 'hc_ac_' + TAB_ID.replace(/[^a-zA-Z0-9]/g, '').slice(-10) + '_' + idx + '_' + (Date.now() % 10000);
      try { ws.send(mqttConnectPkt(cid)); } catch (e) { /* ignore */ }
    };

    ws.onmessage = function (ev) {
      if (entry.ws !== ws || !ev || !ev.data) return;
      var chunk = new Uint8Array(ev.data);
      var merged = new Uint8Array(rxBuf.length + chunk.length);
      merged.set(rxBuf, 0);
      merged.set(chunk, rxBuf.length);
      rxBuf = merged;

      while (rxBuf.length >= 2) {
        var byte0 = rxBuf[0];
        var pktType = byte0 >> 4;
        var flags = byte0 & 0x0f;
        var mult = 1, remLen = 0, pos = 1, b;
        do {
          if (pos >= rxBuf.length) return;
          b = rxBuf[pos++];
          remLen += (b & 0x7f) * mult;
          mult *= 128;
        } while ((b & 0x80) !== 0 && pos < 5);

        var totalLen = pos + remLen;
        if (rxBuf.length < totalLen) return;

        var body = rxBuf.subarray(pos, totalLen);
        rxBuf = rxBuf.subarray(totalLen);

        if (pktType === 2) { // CONNACK
          entry.ready = true;
          entry.backoff = 1500;
          try {
            ws.send(mqttSubscribePkt(entry.pktId++, [MQTT_CTL_TOPIC]));
          } catch (e) { /* ignore */ }
          if (entry.pingT) clearInterval(entry.pingT);
          entry.pingT = setInterval(function () {
            if (entry.ws === ws && ws.readyState === 1 && entry.ready) {
              try { ws.send(mqttPingReqPkt()); } catch (e) { /* ignore */ }
            }
          }, 25000);
          // 連上後立即廣播一次目前在該學院的狀態
          if (!_leftSent) {
            sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
          }
        } else if (pktType === 3 && body.length >= 2) { // PUBLISH
          var tLen = (body[0] << 8) | body[1];
          var pStart = 2 + tLen;
          var qos = (flags >> 1) & 0x03;
          if (qos > 0) pStart += 2;
          if (pStart <= body.length) {
            var topicStr = mqttUtf8Decode(body.subarray(2, 2 + tLen));
            var payloadStr = mqttUtf8Decode(body.subarray(pStart));
            if (topicStr === MQTT_CTL_TOPIC && payloadStr) {
              try {
                var d = JSON.parse(payloadStr);
                if (d && (d.event === 'ping' || d.action === 'ping')) {
                  if (Date.now() - _lastPongSentMs >= 3500) {
                    _lastPongSentMs = Date.now();
                    setTimeout(function () {
                      if (!_leftSent) sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'pong' });
                    }, 80 + Math.floor(Math.random() * 280));
                  }
                }
              } catch (e) { /* ignore */ }
            }
          }
        }
      }
    };

    var onDisconnect = function () {
      if (entry.ws !== ws) return;
      entry.ready = false;
      entry.ws = null;
      if (entry.pingT) { clearInterval(entry.pingT); entry.pingT = 0; }
      if (entry.retryT) clearTimeout(entry.retryT);
      var wait = entry.backoff + Math.floor(Math.random() * 600);
      entry.backoff = Math.min(18000, Math.round(entry.backoff * 1.7));
      entry.retryT = setTimeout(function () {
        entry.retryT = 0;
        connectSingleAcademyMqtt(url, idx, toolId);
      }, wait);
    };
    ws.onerror = onDisconnect;
    ws.onclose = onDisconnect;
  }

  function connectAcademyMqtt(toolId) {
    if (!window.WebSocket || isNavBot()) return;
    MQTT_BROKERS.forEach(function (url, idx) {

  function connectAcademyRollCall(toolId) {
    connectAcademyMqtt(toolId);

          var d = JSON.parse(m.message);
          if (d && (d.event === 'ping' || d.action === 'ping')) {

          }

      };
      es.onerror = function () {

        if (_navEs === es) _navEs = null;
        if (_navEsRetryT) clearTimeout(_navEsRetryT);

        _navEsBackoff = Math.min(20000, Math.floor(_navEsBackoff * 1.8));
        _navEsRetryT = setTimeout(function () {
          _navEsRetryT = 0;

        }, wait);
      };
    } catch (e) { /* ignore */ }
  }

  function startAcademyPresenceLoop(toolId) {
    if (!toolId || !TOOL_MAP[toolId] || _presenceLoopBound || isNavBot()) return;
    _presenceLoopBound = true;
    touchTabLease(toolId);

    window.addEventListener('keydown', function (e) {

      if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.key === 'R'))) {
        markInternalNav();
      }
    }, true);

    if (window.BroadcastChannel) {
      try {
        _navBc = new BroadcastChannel(BC_NAME);
        _navBc.onmessage = function (ev) {
          var d = ev && ev.data;
          if (!d) return;
          if (d.event === 'tab_closed' && d.tabId !== TAB_ID && !document.hidden) {
            sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
          } else if (d.event === 'ping' && Date.now() - _lastPongSentMs >= 3000) {
            _lastPongSentMs = Date.now();
            sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'pong' });
          }
        };
      } catch (e) { _navBc = null; }
    }

    var onUserAct = function () {
      var wasAway = (Date.now() - _lastActMs) >= 90000;
      _lastActMs = Date.now();
      _leftSent = false;
      if (wasAway && !document.hidden) {
        sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'active' });
      }
    };
    ['pointerdown', 'keydown', 'touchstart', 'touchmove', 'wheel'].forEach(function (evName) {
      window.addEventListener(evName, onUserAct, { passive: true });
    });

    setInterval(function () {
      touchTabLease(toolId);
      sendPresenceHeartbeat(toolId, { forceRemote: false });
    }, 10000);

    document.addEventListener('visibilitychange', function () {
      touchTabLease(toolId);
      if (!document.hidden) {
        _leftSent = false;
        _lastActMs = Date.now();
        connectAcademyMqtt(toolId);
        if (!_navEs) connectAcademyRollCall(toolId);
        sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'active' });
      } else {
        sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'away' });
      }
    });
    window.addEventListener('online', function () {
      _leftSent = false;
      connectAcademyRollCall(toolId);
      sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
    });
    window.addEventListener('pageshow', function () {
      _leftSent = false;
      _internalNav = false;
      touchTabLease(toolId);
      connectAcademyRollCall(toolId);
      sendPresenceHeartbeat(toolId, { forceRemote: true, event: 'join' });
    });

    function onUnload() {
      if (_leftSent) return;
      _leftSent = true;
      var otherTabs = removeTabLease();
      var recentNavTs = 0;
      try { recentNavTs = +window.localStorage.getItem(NAV_TS_KEY) || 0; } catch (e) { /* ignore */ }
      var isInternal = _internalNav || (Date.now() - recentNavTs < 5000);
      if (otherTabs > 0) {
        if (_navBc) {
          try { _navBc.postMessage({ event: 'tab_closed', tabId: TAB_ID }); } catch (e) { /* ignore */ }
        }
        return;
      }
      if (!isInternal) {
        sendPresenceHeartbeat(toolId, { leave: true });
      }
    }
    window.addEventListener('pagehide', onUnload);
    window.addEventListener('beforeunload', onUnload);

    connectAcademyRollCall(toolId);
  }

  function detectDeviceInfo() {
    var ua = (typeof navigator !== 'undefined' && navigator.userAgent) ? String(navigator.userAgent) : '';

    var os = '未知系統';
    var m;
    if (/iPhone/i.test(ua)) {
      m = ua.match(/OS (\d+[._]\d+)/);
      os = 'iPhone' + (m ? ' (iOS ' + m[1].replace('_', '.') + ')' : '');
    } else if (/iPad/i.test(ua) || (/Macintosh/i.test(ua) && touch > 1)) {
      m = ua.match(/OS (\d+[._]\d+)/);
      os = 'iPad' + (m ? ' (iPadOS ' + m[1].replace('_', '.') + ')' : '');
    } else if (/Android/i.test(ua)) {
      m = ua.match(/Android (\d+(?:\.\d+)?)/i);
      os = 'Android' + (m ? ' ' + m[1] : '') + (/Mobile/i.test(ua) ? ' 手機' : ' 平板');
    } else if (/Windows NT/i.test(ua)) {
      os = 'Windows 桌機/筆電';
    } else if (/Macintosh|Mac OS X/i.test(ua)) {
      os = 'Mac 桌機/筆電';
    } else if (/CrOS/i.test(ua)) {
      os = 'Chromebook';
    } else if (/Linux/i.test(ua)) {
      os = 'Linux 桌機';
    }
    var br = '';
    if (/Line\//i.test(ua)) br = 'LINE 內建瀏覽器';
    else if (/Instagram/i.test(ua)) br = 'IG 內建瀏覽器';
    else if (/FBAN|FBAV/i.test(ua)) br = 'FB 內建瀏覽器';
    else if (/EdgA?\//i.test(ua)) br = 'Edge';
    else if (/CriOS\//i.test(ua) || (/Chrome\//i.test(ua) && !/Edg/i.test(ua))) br = 'Chrome';
    else if (/FxiOS\//i.test(ua) || /Firefox\//i.test(ua)) br = 'Firefox';
    else if (/Safari\//i.test(ua)) br = 'Safari';
    var vp = (typeof window !== 'undefined' && window.innerWidth && window.innerHeight)
      ? (window.innerWidth + '×' + window.innerHeight)
      : '';
    return [os, br, vp].filter(Boolean).join(' · ');
  }

  function fetchWithTimeout(url, init, ms) {

  /** ntfy.sh keeps messages ≤ 4096 bytes inline; clip long descriptions instead of turning them into attachments. */
  function utf8Clip(text, maxBytes) {
    var s = String(text || '');
    if (typeof TextEncoder === 'undefined') return s.length > maxBytes / 3 ? s.slice(0, Math.floor(maxBytes / 3)) + '…（內容過長已截斷）' : s;
    var enc = new TextEncoder();
    if (enc.encode(s).length <= maxBytes) return s;
    var lo = 0, hi = s.length;
    while (lo < hi) {

      if (enc.encode(s.slice(0, mid)).length <= maxBytes - 48) lo = mid; else hi = mid - 1;
    }
    return s.slice(0, lo) + '…（內容過長已截斷）';
  }

  function fbViaNtfy(item) {

  /** Resolves to the channel that accepted the item ('relay' | 'ntfy' | 'formsubmit'), or '' if none did. */

  var fbFlushing = null;

    var done = {}, sent = 0;

      });
    }, Promise.resolve()).then(function () {
      fbQueueSave(fbQueueLoad().filter(function (x) { return !done[x.qid]; }));
      fbFlushing = null;
      return sent;
    }, function () { fbFlushing = null; return sent; });
    return fbFlushing;

  var fbHandled = {};  // feedback content key → time handed to sendStaticFeedback (fallback de-duplication)

  function sendStaticFeedback(opts, extra) {

    var rep = getReporterInfo();
    o._rep = rep;
    fbHandled[fbKey(o)] = Date.now();
    var links = deliveryLinks(o);
    var loc = window.location;
    var item = {
      qid: 'fb' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      email: links.email,
      subject: links.subject,
      tool: o.tool,
      kindLabel: o.kindLabel,
      reporter: rep.summary,
      stuName: rep.name,
      stuNo: rep.stuNo,
      stuUid: rep.uid,
      stuTitle: rep.title,
      device: rep.device,
      title: o.title,
      description: o.description,
      createdAt: o.createdAt || twNowText(),
      page: loc.protocol === 'file:' ? '離線單一檔' : String(loc.origin + loc.pathname).slice(0, 300)
    };

    var head = '工具名稱：' + o.tool + '\n回饋類型：' + o.kindLabel + '\n回饋學員：' + rep.summary + '\n使用裝置：' + rep.device + '\n標題：' + o.title + '\n\n內容描述：\n';
    var tail = '\n送出時間：' + item.createdAt + '\n來源頁面：' + item.page +

  /**

  }

  // ------------------------------------------------------------------ Zobrist
  var Z1 = new Int32Array(16 * 64);
  var Z2 = new Int32Array(16 * 64);

  var ZE1 = new Int32Array(8), ZE2 = new Int32Array(8);

    for (i = 0; i < 16; i++) { ZC1[i] = next(); ZC2[i] = next(); }
    for (i = 0; i < 8; i++) { ZE1[i] = next(); ZE2[i] = next(); }

  })();

  var TT_BITS = 18;
  var TT_SIZE = 1 << TT_BITS;
  var TT_MASK = TT_SIZE - 1;

  // ------------------------------------------------------------------ 搜尋
  function Searcher(pos, opts) {

    this.useNull = !(opts && opts.noNull);
    this.k1 = 0;
    this.k2 = 0;
    this.rep1 = []; // 對局歷程＋搜尋路徑上的局面雜湊，用來偵測重複
    this.rep2 = [];
    this.ttLock = new Int32Array(TT_SIZE);
    this.ttMove = new Int32Array(TT_SIZE);
    this.ttScore = new Int16Array(TT_SIZE);
    this.ttDepth = new Int8Array(TT_SIZE);
    this.ttFlag = new Int8Array(TT_SIZE); // 1 精確、2 下界、3 上界
    this.killers = new Int32Array(MAX_PLY * 2 + 4);
    this.history = new Int32Array(4096);
    this.nodes = 0;
    this.deadline = Infinity;
    this.stop = false;
    this.setKey();
  }

  /** 由目前局面重新計算雜湊（含輪走方、易位權利與過路兵）。 */
  Searcher.prototype.setKey = function () {
    var pos = this.pos, b = pos.board;
    var k1 = ZC1[pos.castle], k2 = ZC2[pos.castle];
    for (var sq = 0; sq < 64; sq++) {
      var p = b[sq];
      if (p) { k1 ^= Z1[p * 64 + sq]; k2 ^= Z2[p * 64 + sq]; }
    }
    if (pos.turn === E.BLACK) { k1 ^= SIDE1; k2 ^= SIDE2; }
    if (pos.ep >= 0) { k1 ^= ZE1[pos.ep & 7]; k2 ^= ZE2[pos.ep & 7]; }
    this.k1 = k1;
    this.k2 = k2;
  };

  Searcher.prototype.make = function (m) {
    this.rep1.push(this.k1);
    this.rep2.push(this.k2);
    return E.makeMove(this.pos, m);
  };

  Searcher.prototype.unmake = function (m, u) {
    E.undoMove(this.pos, m, u);
    this.k1 = this.rep1.pop();
    this.k2 = this.rep2.pop();
  };

  Searcher.prototype.repeated = function () {
    var a = this.rep1, c = this.rep2, k1 = this.k1, k2 = this.k2;
    // 同一方輪走的局面才可能相同，所以每次往回跳兩步；最多回溯到上一次吃子或動兵。
    var stop = a.length - this.pos.half;
    if (stop < 0) stop = 0;
    for (var i = a.length - 2; i >= stop; i -= 2) {
      if (a[i] === k1 && c[i] === k2) return true;

    return false;
  };

  Searcher.prototype.ordered = function (moves, ttMove, ply) {
    var b = this.pos.board;
    var k1 = this.killers[ply * 2], k2 = this.killers[ply * 2 + 1];
    var scored = new Array(moves.length);
    for (var i = 0; i < moves.length; i++) {
      var m = moves[i];
      var body = m % 10000;
      var cap = b[body % 100];
      var promo = (m / 10000) | 0;
      var s;
      if (m === ttMove) s = 1e7;
      else if (cap || promo) s = 1e6 + (cap ? ORDER_VAL[cap & 7] * 100 - ORDER_VAL[b[(body / 100) | 0] & 7] : 0) + ORDER_VAL[promo] * 100;

    }

  Searcher.prototype.quiesce = function (alpha, beta, ply) {

    var stand = evaluate(pos);
    if (stand >= beta || ply >= MAX_PLY) return stand;
    if (stand > alpha) alpha = stand;
    var side = pos.turn;
    var caps = E.genPseudo(pos, side, [], true);
    if (!caps.length) return alpha;
    this.ordered(caps, 0, MAX_PLY);
    for (var i = 0; i < caps.length; i++) {
      var m = caps[i];

      this.unmake(m, u);
      if (score >= beta) return score;
      if (score > alpha) alpha = score;

  Searcher.prototype.search = function (depth, alpha, beta, ply, noNull) {

    if (this.stop) return 0;

    if (ply >= MAX_PLY) return evaluate(pos);
    var side = pos.turn;
    var checked = E.inCheck(pos, side);

    if (depth <= 0) return this.quiesce(alpha, beta, ply);

    var k1 = this.k1, k2 = this.k2;

        if (tf === 3 && ts <= alpha) return ts;

    if (this.useNull && !noNull && !checked && depth >= 3 && ply > 0 && beta < MATE_BOUND && beta > -MATE_BOUND) {
      var b = pos.board, big = false;
      for (var q = 0; q < 64; q++) {

      }
      if (big && evaluate(pos) >= beta) {
        var ep = pos.ep;
        this.rep1.push(k1); this.rep2.push(k2);

        var ns = -this.search(depth - 3, -beta, -beta + 1, ply + 1, true);

        if (this.stop) return 0;
        if (ns >= beta && ns < MATE_BOUND) return beta;

    var moves = this.ordered(E.genPseudo(pos, side, [], false), ttMove, ply);
    var best = -INF, bestMove = 0, legal = 0, alpha0 = alpha;
    for (var i = 0; i < moves.length; i++) {
      var m = moves[i];
      var u = this.make(m);
      if (E.inCheck(pos, side)) { this.unmake(m, u); continue; }
      legal++;
      var score = -this.search(depth - 1, -beta, -alpha, ply + 1, false);
      this.unmake(m, u);
      if (this.stop) return 0;
      if (score > best) { best = score; bestMove = m; }
      if (score > alpha) alpha = score;
      if (alpha >= beta) {
        if (!u.cap && m < 10000) {
          if (this.killers[ply * 2] !== m) {
            this.killers[ply * 2 + 1] = this.killers[ply * 2];
            this.killers[ply * 2] = m;
          }
          var h = ((m / 100) | 0) * 64 + m % 100;
          this.history[h] += depth * depth;
          if (this.history[h] > 700000) for (var j = 0; j < 4096; j++) this.history[j] >>= 1;
        }

      }
    }

    if (!legal) return checked ? -MATE + ply : 0;
    // 接近殺棋的分數與步數有關，不存進置換表。
    if (best > -MATE_BOUND && best < MATE_BOUND) {
      this.ttLock[idx] = k2;
      this.ttMove[idx] = bestMove;
      this.ttScore[idx] = best;

  };

  /** 建立搜尋器，並把對局歷程放進重複偵測（AI 才不會在優勢局面來回兜圈子，也看得懂長將和棋）。 */
  function searcherFor(game, opts) {
    var s = new Searcher(E.clonePos(game.pos), opts);
    var replay = new Searcher(E.parseFen(game.startFen), opts);
    for (var i = 0; i < game.history.length; i++) {
      replay.setKey();
      replay.make(game.history[i].move);
    }
    s.rep1 = replay.rep1.slice();
    s.rep2 = replay.rep2.slice();
    return s;
  }

  // ------------------------------------------------------------------ 選步
  // 第一步的常見走法；初級以上從這裡隨機挑，開局才不會每盤都一樣。
  var FIRST_MOVES = ['e2e4', 'e2e4', 'd2d4', 'd2d4', 'g1f3', 'c2c4'];

  /**
   * 替 game 目前輪走的一方選一步。
   * cfg 見 LEVELS；rng 可注入亂數函式（測試用）。回傳 { move, score, depth, nodes }，
   * 沒有合法走法時 move = -1。score 是選步這一方的角度。
   */
  function think(game, cfg, rng) {
    rng = rng || Math.random;
    var me = game.turn();
    if (game.result()) return { move: -1, score: 0, depth: 0, nodes: 0 };
    var legal = E.legalMoves(game.pos);
    if (!legal.length) return { move: -1, score: 0, depth: 0, nodes: 0 };

    // 能直接將死就走。
    var i;
    for (i = 0; i < legal.length; i++) {
      game.play(legal[i]);
      var res = game.result();
      game.undo();
      if (res && res.winner === me) return { move: legal[i], score: MATE, depth: 1, nodes: legal.length };

    if (legal.length === 1) return { move: legal[0], score: 0, depth: 0, nodes: 1 };
    if (!cfg.randomProb && cfg.margin && !game.history.length && game.startFen === E.START_FEN) {
      return { move: E.strToMove(FIRST_MOVES[(rng() * FIRST_MOVES.length) | 0]), score: 0, depth: 0, nodes: 0 };
    }
    if (cfg.randomProb && rng() < cfg.randomProb) {
      return { move: legal[(rng() * legal.length) | 0], score: 0, depth: 0, nodes: 0 };

    var s = searcherFor(game, cfg);
    var start = Date.now();
    s.deadline = start + cfg.timeMs;
    var margin = cfg.bookPlies && game.history.length >= cfg.bookPlies ? 0 : cfg.margin;
    var order = legal.slice();
    var done = null; // 最後一個完整搜完的深度結果

    for (var d = 1; d <= cfg.depth; d++) {
      var scores = {};
      var best = -INF;
      for (i = 0; i < order.length; i++) {
        var m = order[i];

        if (sc > best) best = sc;
      }
      if (s.stop) break;
      done = { depth: d, scores: scores, best: best };
      order.sort(function (a, b) { return scores[b] - scores[a]; });

    var cands = [];
    for (i = 0; i < order.length; i++) {

    }

  }

  /**
   * 題庫與測試用的精確分析：固定深度、不限時間、不用空著裁剪。
   * 回傳 { best: 最佳走法, score, unique: 其他走法是否都比最佳差 margin 以上, second: 次佳走法 }。
   * 最佳是殺棋時，unique 的意思是「其他走法都沒有強制將死」。

  function analyze(game, depth, margin) {
    var legal = E.legalMoves(game.pos);
    if (!legal.length) return { best: -1, score: 0, unique: false, second: -1 };

        s.unmake(order[i], u);
        scores[order[i]] = sc;
        if (sc > alpha) alpha = sc;
      }
      // 第一個走法之後都是「下界視窗」的結果：只保證最佳那一步的分數精確，排序夠用。
      order.sort(function (a, b) { return scores[b] - scores[a]; });

      bestMove = order[0];

    var unique = true, second = -1;
    var T = best > MATE_BOUND ? MATE_BOUND : best - margin; // 其他走法的分數必須低於 T
    for (i = 0; i < order.length && unique; i++) {
      if (order[i] === bestMove) continue;
      s.setKey();
      var u2 = s.make(order[i]);
      var r = -s.search(depth - 1, -T, -T + 1, 1, false);
      s.unmake(order[i], u2);
      if (r >= T) { unique = false; second = order[i]; }
    }
    return { best: bestMove, score: best, unique: unique, second: second, nodes: s.nodes };
  }

  function thinkFromMoves(fen, moves, level, hint) {
    var game = E.Game.fromMoves(fen, moves || []);
    return think(game, hint ? HINT : (LEVELS[level] || LEVELS[2]));
  }

  function handle(req) {
    return thinkFromMoves(req.fen, req.moves, req.level, req.hint);
  }

  return {
    LEVELS: LEVELS, HINT: HINT, MATE: MATE, MATE_BOUND: MATE_BOUND, VAL: VAL,
    evaluate: evaluate, material: material, think: think, analyze: analyze,

});
