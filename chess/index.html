// === js/board.js ===
// ============================================================================
// ♟️ 西洋棋學院 — SVG 棋盤元件
//
// CHBoard.create(host, { onSquare }) 回傳 { render(state), destroy() }。
// state：{ board(Int8Array 64), flipped, faceToFace, selected, targets[], last(走法或 -1),
//          check(格子或 -1), hint(走法或 -1), animate }
// 棋盤格只在翻轉時重畫；棋子與標記每次 render 重畫，走子時用 CSS transition 滑動。
// 棋子是本院自己畫的向量圖（不依賴字型，各種裝置看起來都一樣）。
// ============================================================================

(function () {
  'use strict';
  var E = window.CHEngine;

  var S = 80;  // 一格的邊長
  var M = 26;  // 邊距（放座標）
  var W = S * 8 + M * 2;
  var NS = 'http://www.w3.org/2000/svg';
  var FILES = 'abcdefgh';

  var BASE = '<rect x="-22" y="20" width="44" height="9" rx="3" class="ch-pc-fill"/>';
  // 每種棋子的圖形（座標以格子中心為原點，範圍約 ±32）。ch-pc-fill 是實心部分，ch-pc-line 是細節線條。
  var SHAPES = {};
  SHAPES[E.P] =
    '<path d="M-7,-5 C-15,4 -18,13 -18,20 L18,20 C18,13 15,4 7,-5 Z" class="ch-pc-fill"/>' +
    '<circle cx="0" cy="-13" r="10" class="ch-pc-fill"/>' + BASE;
  SHAPES[E.R] =
    '<path d="M-13,-13 L-15,20 L15,20 L13,-13 Z" class="ch-pc-fill"/>' +
    '<path d="M-19,-28 h9 v6 h5.5 v-6 h9 v6 h5.5 v-6 h9 v16 h-38 Z" class="ch-pc-fill"/>' +
    '<path d="M-13,-12 H13" class="ch-pc-line"/>' + BASE;
  SHAPES[E.N] =
    '<path d="M-11,20 C-11,9 0,6 -3,-3 L-12,4 C-17,8 -24,3 -21,-4 L-9,-21 L-9,-31 L-1,-24 C15,-22 22,-5 19,20 Z" class="ch-pc-fill"/>' +
    '<circle cx="-8.5" cy="-12.5" r="2" class="ch-pc-dot"/>' +
    '<path d="M3,-21 C10,-15 13,-6 13,6" class="ch-pc-line"/>' + BASE;
  SHAPES[E.B] =
    '<path d="M-8,8 C-10,15 -16,17 -18,20 L18,20 C16,17 10,15 8,8 Z" class="ch-pc-fill"/>' +
    '<rect x="-12" y="3" width="24" height="6" rx="2.5" class="ch-pc-fill"/>' +
    '<path d="M0,-25 C-15,-13 -14,-2 -8,3 L8,3 C14,-2 15,-13 0,-25 Z" class="ch-pc-fill"/>' +
    '<circle cx="0" cy="-28.5" r="4" class="ch-pc-fill"/>' +
    '<path d="M4,-16 L-3,-7" class="ch-pc-line"/>' + BASE;
  SHAPES[E.Q] =
    '<path d="M-15,8 C-13,14 -17,17 -19,20 L19,20 C17,17 13,14 15,8 Z" class="ch-pc-fill"/>' +
    '<path d="M-23,-14 L-15,8 L15,8 L23,-14 L13,-2 L11,-20 L5,-3 L0,-23 L-5,-3 L-11,-20 L-13,-2 Z" class="ch-pc-fill"/>' +
    '<circle cx="-23" cy="-16" r="3.4" class="ch-pc-fill"/><circle cx="-11" cy="-22.5" r="3.4" class="ch-pc-fill"/>' +
    '<circle cx="0" cy="-25.5" r="3.4" class="ch-pc-fill"/><circle cx="11" cy="-22.5" r="3.4" class="ch-pc-fill"/>' +
    '<circle cx="23" cy="-16" r="3.4" class="ch-pc-fill"/>' +
    '<path d="M-15,8 H15" class="ch-pc-line"/>' + BASE;
  SHAPES[E.K] =
    '<path d="M-3,-33 h6 v5 h5 v6 h-5 v8 h-6 v-8 h-5 v-6 h5 Z" class="ch-pc-fill"/>' +
    '<path d="M-17,7 C-27,-5 -16,-18 -3,-11 L0,-14 L3,-11 C16,-18 27,-5 17,7 Z" class="ch-pc-fill"/>' +
    '<path d="M-17,7 L17,7 C16,13 17,17 19,20 L-19,20 C-17,17 -16,13 -17,7 Z" class="ch-pc-fill"/>' +
    '<path d="M-17,7 H17" class="ch-pc-line"/>' + BASE;

  function el(name, attrs, text) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  /** 獨立的小棋子圖示（吃子列表、升變選單用），回傳 HTML 字串。 */
  function pieceSvg(p, size) {
    size = size || 24;
    return '<svg class="ch-pc-icon ch-pc ' + (E.sideOf(p) === E.WHITE ? 'is-white' : 'is-black') +
      '" viewBox="-36 -38 72 72" width="' + size + '" height="' + size + '" aria-hidden="true">' +
      SHAPES[E.typeOf(p)] + '</svg>';
  }

  function create(host, opts) {
    opts = opts || {};
    var svg = el('svg', {
      viewBox: '0 0 ' + W + ' ' + W, class: 'ch-board', role: 'img', 'aria-label': '西洋棋棋盤',
    });
    svg.appendChild(el('rect', { x: 2, y: 2, width: W - 4, height: W - 4, rx: 12, class: 'ch-bd-frame' }));
    var squares = el('g', {});
    svg.appendChild(squares);
    var labels = el('g', { class: 'ch-bd-labels' });
    svg.appendChild(labels);
    var markLayer = el('g', {});
    svg.appendChild(markLayer);
    var pieceLayer = el('g', {});
    svg.appendChild(pieceLayer);
    var topLayer = el('g', {});
    svg.appendChild(topLayer);
    host.innerHTML = '';
    host.appendChild(svg);

    var state = null;
    var lastFlip = null;
    var prevBoard = null;

    /** 格子左上角的畫面座標。 */
    function corner(sq) {
      var r = E.rowOf(sq), c = E.colOf(sq);
      if (state && state.flipped) { r = 7 - r; c = 7 - c; }
      return [M + c * S, M + r * S];
    }
    function center(sq) {
      var p = corner(sq);
      return [p[0] + S / 2, p[1] + S / 2];
    }

    function drawStatic() {
      squares.innerHTML = '';
      labels.innerHTML = '';
      var flipped = state.flipped;
      for (var r = 0; r < 8; r++) {
        for (var c = 0; c < 8; c++) {
          squares.appendChild(el('rect', {
            x: M + c * S, y: M + r * S, width: S, height: S, class: (r + c) % 2 ? 'ch-sq-dark' : 'ch-sq-light',
          }));
        }
      }
      for (var i = 0; i < 8; i++) {
        var file = FILES[flipped ? 7 - i : i];
        var rank = String(flipped ? i + 1 : 8 - i);
        labels.appendChild(el('text', { x: M + i * S + S / 2, y: W - M / 2 + 1 }, file));
        labels.appendChild(el('text', { x: M + i * S + S / 2, y: M / 2 + 1 }, file));
        labels.appendChild(el('text', { x: M / 2, y: M + i * S + S / 2 + 1 }, rank));
        labels.appendChild(el('text', { x: W - M / 2, y: M + i * S + S / 2 + 1 }, rank));
      }
    }

    function pieceNode(p, sq, rotate) {
      var pt = center(sq);
      var g = el('g', { class: 'ch-pc ' + (E.sideOf(p) === E.WHITE ? 'is-white' : 'is-black'), 'data-sq': sq });
      g.style.transform = 'translate(' + pt[0] + 'px,' + pt[1] + 'px)';
      var inner = el('g', { transform: (rotate ? 'rotate(180) ' : '') + 'translate(0,2)' });
      inner.innerHTML = SHAPES[E.typeOf(p)];
      g.appendChild(inner);
      return g;
    }

    function squareMark(sq, cls) {
      var p = corner(sq);
      markLayer.appendChild(el('rect', { x: p[0], y: p[1], width: S, height: S, class: cls }));
    }

    function render(next) {
      state = next;
      if (lastFlip !== state.flipped) { drawStatic(); lastFlip = state.flipped; prevBoard = null; }
      markLayer.innerHTML = '';
      pieceLayer.innerHTML = '';
      topLayer.innerHTML = '';
      var b = state.board;
      var pt;

      if (state.last >= 0) {
        squareMark(E.fromOf(state.last), 'ch-mk-last');
        squareMark(E.toOf(state.last), 'ch-mk-last');
      }
      if (state.selected >= 0) squareMark(state.selected, 'ch-mk-selected');
      if (state.check >= 0) {
        pt = center(state.check);
        markLayer.appendChild(el('circle', { cx: pt[0], cy: pt[1], r: S / 2 - 3, class: 'ch-mk-check' }));
      }

      // 走子動畫：找出剛移動的棋子，先放在原位，下一個影格再移到新位置。
      var slide = null;
      if (prevBoard && state.last >= 0 && state.animate !== false) {
        var from = E.fromOf(state.last), to = E.toOf(state.last);
        if (prevBoard[from] && !b[from] && b[to] && E.sideOf(prevBoard[from]) === E.sideOf(b[to])) slide = { from: from, to: to };
      }
      for (var sq = 0; sq < 64; sq++) {
        if (!b[sq]) continue;
        var side = E.sideOf(b[sq]);
        // 對坐模式：畫面上方那一側的棋子倒過來，讓坐在對面的人看得懂。
        var topSide = state.flipped ? E.WHITE : E.BLACK;
        var node = pieceNode(b[sq], sq, !!state.faceToFace && side === topSide);
        if (slide && slide.to === sq) {
          var o = center(slide.from);
          var dst = node.style.transform;
          node.style.transform = 'translate(' + o[0] + 'px,' + o[1] + 'px)';
          pieceLayer.appendChild(node);
          (function (n, t) {
            // 強制 reflow 後再設定終點，transition 才會生效。
            n.getBoundingClientRect();
            n.classList.add('is-sliding');
            n.style.transform = t;
          })(node, dst);
        } else {
          pieceLayer.appendChild(node);
        }
      }

      (state.targets || []).forEach(function (tsq) {
        pt = center(tsq);
        topLayer.appendChild(el('circle', b[tsq]
          ? { cx: pt[0], cy: pt[1], r: S / 2 - 5, class: 'ch-mk-capture' }
          : { cx: pt[0], cy: pt[1], r: 11, class: 'ch-mk-target' }));
      });
      if (state.hint >= 0) {
        var hf = center(E.fromOf(state.hint)), ht = center(E.toOf(state.hint));
        topLayer.appendChild(el('line', { x1: hf[0], y1: hf[1], x2: ht[0], y2: ht[1], class: 'ch-mk-hint-line' }));
        topLayer.appendChild(el('circle', { cx: hf[0], cy: hf[1], r: S / 2 - 6, class: 'ch-mk-hint' }));
        topLayer.appendChild(el('circle', { cx: ht[0], cy: ht[1], r: S / 2 - 6, class: 'ch-mk-hint is-to' }));
      } else if (state.hintFrom >= 0) {
        // 題庫的第一段提示：只圈出該動哪一個棋子。
        var hs = center(state.hintFrom);
        topLayer.appendChild(el('circle', { cx: hs[0], cy: hs[1], r: S / 2 - 6, class: 'ch-mk-hint' }));
      }
      prevBoard = new Int8Array(b);
    }

    function onClick(ev) {
      if (!state || !opts.onSquare) return;
      var rect = svg.getBoundingClientRect();
      if (!rect.width) return;
      var x = (ev.clientX - rect.left) * W / rect.width;
      var y = (ev.clientY - rect.top) * W / rect.height;
      var c = Math.floor((x - M) / S), r = Math.floor((y - M) / S);
      if (r < 0 || r > 7 || c < 0 || c > 7) return;
      if (state.flipped) { r = 7 - r; c = 7 - c; }
      opts.onSquare(r * 8 + c);
    }
    svg.addEventListener('click', onClick);

    return {
      render: render,
      destroy: function () { svg.removeEventListener('click', onClick); host.innerHTML = ''; },
    };
  }

  window.CHBoard = { create: create, pieceSvg: pieceSvg, W: W, H: W };
})();


// === js/study.js ===
// ============================================================================
// ♟️ 西洋棋學院 — 戰術題庫（#/puzzle）與課程（#/learn）
//
// 做題規則：照著唯一解一步一步走，對方的應著由題目自動走出來。
//   走錯不會真的走下去，棋子會留在原位，可以再想。
//   ⭐ 完美：一次都沒走錯，也沒用提示、沒看過解答。
//   ✅ 過關：其他方式解完。
//   殺棋題只要走出將死就算對（不一定要和解答同一步）。
// 進度存在 localStorage（ch.puzzle.v1、ch.learn.v1）。
// ============================================================================

(function () {
  'use strict';
  var E = window.CHEngine;
  var NT = window.CHNotation;
  var App = null; // window.CHApp，app.js 載入後才有
  var KEY_PUZZLE = 'ch.puzzle.v1';
  var KEY_LEARN = 'ch.learn.v1';
  var LEVEL_NAMES = { 1: '入門', 2: '進階', 3: '挑戰' };
  var LEVEL_DESC = { 1: '一步解', 2: '兩步解', 3: '三步以上' };
  var COMEBACK = '逆轉';

  function puzzles() { return window.CH_PUZZLES || []; }
  function units() { return window.CH_UNITS || []; }
  function esc(s) { return App.esc(s); }

  /** 題目的目標說明，例如「白先，2 步將死」。 */
  function goalText(p) {
    var who = p.side === 'b' ? '黑' : '白';
    if (p.goal === 'mate') return who + '先，' + p.n + ' 步將死';
    if (p.goal === 'draw') return who + '先和：' + ((p.tags || []).indexOf('逼和') >= 0 ? '棄子逼和' : '長將求和');
    return who + '先勝：用戰術贏得子力';
  }
  function goalShort(p) {
    if (p.goal === 'mate') return p.n + ' 步殺';
    if (p.goal === 'draw') return '求和';
    return '得子';
  }

  // ------------------------------------------------------------------ 進度
  // progress[id] = { s: 0 未過關 | 1 過關 | 2 完美, seen: 看過解答 }
  function progress() {
    var p = App.load(KEY_PUZZLE, {});
    return p && typeof p === 'object' ? p : {};
  }
  function setProgress(id, patch) {
    var all = progress();
    var cur = all[id] || { s: 0 };
    if (patch.s && patch.s > (cur.s || 0)) cur.s = patch.s;
    if (patch.seen) cur.seen = true;
    all[id] = cur;
    App.save(KEY_PUZZLE, all);
  }
  function statusIcon(st) {
    if (!st) return '';
    if (st.s === 2) return '⭐';
    if (st.s === 1) return '✅';
    return st.seen ? '👀' : '';
  }

  // ------------------------------------------------------------------ 題庫列表
  var listFilter = { level: 0, tag: '', kind: '' }; // kind：'' 全部、'tactic' 一般戰術、'comeback' 逆轉

  function isComeback(p) { return (p.tags || []).indexOf(COMEBACK) >= 0; }
  function allTags() {
    var count = {};
    puzzles().forEach(function (p) {
      (p.tags || []).forEach(function (t) { count[t] = (count[t] || 0) + 1; });
    });
    return Object.keys(count).sort(function (a, b) { return count[b] - count[a]; }).map(function (t) {
      return { tag: t, n: count[t] };
    });
  }
  function tagPills(p) {
    return (p.tags || []).slice(0, 3).map(function (t) {
      return '<span class="pz-tag' + (t === COMEBACK ? ' is-comeback' : '') + '">' + esc(t) + '</span>';
    }).join('');
  }

  function renderPuzzleList(tag) {
    if (tag !== undefined) listFilter.tag = tag;
    var prog = progress();
    var all = puzzles();
    var stars = 0, passed = 0;
    all.forEach(function (p) {
      var st = prog[p.id];
      if (st && st.s === 2) stars++;
      if (st && st.s >= 1) passed++;
    });
    var shown = all.filter(function (p) {
      if (listFilter.level && p.level !== listFilter.level) return false;
      if (listFilter.tag && (p.tags || []).indexOf(listFilter.tag) < 0) return false;
      if (listFilter.kind === 'comeback' && !isComeback(p)) return false;
      if (listFilter.kind === 'tactic' && isComeback(p)) return false;
      return true;
    });
    var comebackCount = all.filter(isComeback).length;
    function seg(act, v, label, on) {
      return '<button type="button" class="seg-btn' + (on ? ' is-on' : '') + '" data-sact="' + act + '" data-v="' + v + '">' + label + '</button>';
    }

    var html = '<div class="study-wrap">' +
      '<section class="card pz-head">' +
        '<div><h1>戰術題庫</h1>' +
        '<p class="muted">共 ' + all.length + ' 題：' + (all.length - comebackCount) + ' 題一般戰術（將殺、捉雙、牽制、串擊、閃擊…），' + comebackCount +
          ' 題「逆轉」——子力落後時靠戰術反擊，或用逼和、長將搶回半分。每一題都由引擎確認只有一個解。</p></div>' +
        '<div class="pz-score"><span class="pz-score-main">⭐ ' + stars + '<small> / ' + all.length + '</small></span>' +
        '<span class="muted">✅ 過關 ' + passed + ' 題</span></div>' +
      '</section>' +
      '<section class="card pz-filters">' +
        '<div class="seg" role="group" aria-label="類型">' +
          seg('kind', '', '全部', !listFilter.kind) + seg('kind', 'tactic', '⚔️ 戰術', listFilter.kind === 'tactic') +
          seg('kind', 'comeback', '🔄 逆轉', listFilter.kind === 'comeback') +
        '</div>' +
        '<div class="seg" role="group" aria-label="難度">' +
          [0, 1, 2, 3].map(function (lv) {
            return seg('level', lv, lv ? LEVEL_NAMES[lv] + '<small>' + LEVEL_DESC[lv] + '</small>' : '全部', listFilter.level === lv);
          }).join('') +
        '</div>' +
        '<label class="pz-select">主題<select id="pzTag"><option value="">全部</option>' +
          allTags().map(function (t) {
            return '<option value="' + esc(t.tag) + '"' + (t.tag === listFilter.tag ? ' selected' : '') + '>' + esc(t.tag) + '（' + t.n + '）</option>';
          }).join('') + '</select></label>' +
      '</section>';

    if (!shown.length) {
      html += '<section class="card"><p class="muted">沒有符合條件的題目，請調整上方的篩選。</p></section>';
    }
    [1, 2, 3].forEach(function (lv) {
      var group = shown.filter(function (p) { return p.level === lv; });
      if (!group.length) return;
      html += '<section class="card"><div class="card-head"><h2>' + LEVEL_NAMES[lv] + '・' + LEVEL_DESC[lv] + '</h2>' +
        '<span class="count-pill">' + group.length + ' 題</span></div><div class="pz-grid">' +
        group.map(function (p) {
          var st = prog[p.id];
          return '<a class="pz-card' + (st && st.s ? ' is-done' : '') + '" href="#/puzzle/' + esc(p.id) + '">' +
            '<span class="pz-card-top"><span class="pz-n">' + (p.side === 'b' ? '黑先' : '白先') + '・' + goalShort(p) + '</span><span class="pz-st">' + statusIcon(st) + '</span></span>' +
            '<strong>' + esc(p.name) + '</strong>' +
            '<small>' + tagPills(p) + '</small></a>';
        }).join('') + '</div></section>';
    });
    html += '<p class="muted pz-credit">題目全部由本院的引擎從自我對弈與隨機殘局中挑選、驗證，沒有使用外部題庫。想先學觀念，可以到「📚 課程」看戰術與逆轉技巧的圖解。</p>';
    html += '</div>';
    App.main.innerHTML = html;
  }

  // ------------------------------------------------------------------ 做題
  var pz = null; // 目前這一題的狀態
  var replyTimer = 0;

  function stopPuzzle() {
    if (replyTimer) { clearTimeout(replyTimer); replyTimer = 0; }
    if (pz) pz.busy = false;
  }

  function findPuzzle(id) {
    var all = puzzles();
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return { p: all[i], idx: i };
    return null;
  }

  function newAttempt(p, idx) {
    pz = {
      p: p, idx: idx, game: new E.Game(p.fen), step: 0, selected: -1, board: pz && pz.p === p ? pz.board : null,
      busy: false, hint: -1, hintFrom: -1, aided: false, wrong: 0, wrongText: '', done: false, animate: false,
    };
  }

  function renderPuzzle(id) {
    var found = findPuzzle(id);
    if (!found) { renderPuzzleList(); return; }
    stopPuzzle();
    pz = null;
    newAttempt(found.p, found.idx);
    var p = found.p;
    App.main.innerHTML =
      '<div class="ch-stage">' +
        '<div class="ch-board-col"><div class="ch-board-wrap" id="pzBoard"></div></div>' +
        '<aside class="ch-side">' +
          '<section class="card">' +
            '<div class="card-head"><h2>' + esc(p.name) + '</h2><span class="pz-goal is-' + p.goal + '">' + goalShort(p) + '</span></div>' +
            '<p><strong>' + esc(goalText(p)) + '</strong></p>' +
            '<p class="muted">' + LEVEL_NAMES[p.level] + '・<span class="pz-tags" style="display:inline-flex">' + tagPills(p) + '</span></p>' +
            '<div id="pzStatus" class="pz-status"></div>' +
          '</section>' +
          '<section class="card">' +
            '<div class="btn-grid">' +
              '<button type="button" class="btn" data-sact="pz-hint">💡 提示</button>' +
              '<button type="button" class="btn" data-sact="pz-retry">🔁 重來</button>' +
              '<button type="button" class="btn" data-sact="pz-solution">📜 看解答</button>' +
            '</div>' +
            '<p class="muted pz-rule">照著最好的走法一步一步走，對方會自動應著。走錯時棋子會留在原位，可以再想；一次都沒走錯、沒用提示、沒看過解答才能拿到 ⭐。解完後可以到解答頁「從這個局面接著下」，和 AI 把這盤下完。</p>' +
          '</section>' +
          '<section class="card">' +
            '<div class="card-head"><h2>著法</h2></div>' +
            '<div class="mv-scroll" id="pzMoves"></div>' +
          '</section>' +
          '<div class="pz-nav">' +
            '<a class="btn" href="#/puzzle">← 題庫</a>' +
            (found.idx + 1 < puzzles().length
              ? '<a class="btn btn-primary" href="#/puzzle/' + esc(puzzles()[found.idx + 1].id) + '">下一題 →</a>' : '') +
          '</div>' +
        '</aside>' +
      '</div>';
    pz.board = window.CHBoard.create(document.getElementById('pzBoard'), { onSquare: onPuzzleSquare });
    refreshPuzzle();
  }

  function mySide() { return pz.p.side === 'b' ? E.BLACK : E.WHITE; }

  function refreshPuzzle() {
    if (!pz || !document.getElementById('pzStatus')) return;
    var g = pz.game;
    pz.board.render({
      board: g.pos.board, flipped: pz.p.side === 'b', faceToFace: false, selected: pz.selected,
      targets: App.targetsOf(g, pz.selected), last: g.lastMove(), check: App.checkSquare(g.pos),
      animate: pz.animate, hint: pz.hint, hintFrom: pz.hintFrom,
    });
    pz.animate = true;

    var st = progress()[pz.p.id] || {};
    var html;
    var total = Math.ceil(pz.p.line.length / 2);
    if (pz.done) {
      var perfect = !pz.wrong && !pz.aided && !pz.seenAtStart;
      var res = g.result();
      html = '<div class="status-result">' + (perfect ? '⭐ 完美！' : '✅ 過關') + '</div>' +
        '<p class="muted">' + (res ? esc(NT.resultText(res)) + '。' : (pz.p.goal === 'draw' ? '局面重複，對方躲不掉將軍，和棋。' : '戰術得手，子力已經到手。')) +
        (perfect ? '' : (pz.wrong ? '走錯過 ' + pz.wrong + ' 次，' : '') + '用過提示、看過解答或走錯就拿不到 ⭐，可以按「重來」再挑戰一次。') + '</p>';
    } else if (pz.busy) {
      html = '<div class="status-turn ' + (mySide() === E.WHITE ? 'is-black' : 'is-white') + '"><span class="turn-dot"></span>對方應著中…</div>';
    } else {
      html = '<div class="status-turn ' + (mySide() === E.WHITE ? 'is-white' : 'is-black') + '"><span class="turn-dot"></span>輪到你走（' + App.sideName(mySide()) + '）' +
        (g.inCheck() ? '<span class="badge-check">將軍！</span>' : '') + '</div>' +
        '<p class="muted">第 ' + (Math.floor(pz.step / 2) + 1) + ' / ' + total + ' 步' +
        (st.s === 2 ? '・這題已拿過 ⭐' : st.seen ? '・已看過解答，最多 ✅' : '') + '</p>' +
        (pz.wrongText ? '<p class="pz-wrong">✗ ' + esc(pz.wrongText) + '</p>' : '');
    }
    document.getElementById('pzStatus').innerHTML = html;
    var box = document.getElementById('pzMoves');
    box.innerHTML = App.moveListHtml(g, g.history.length, false);
    box.scrollTop = box.scrollHeight;
    var q = function (a) { return App.main.querySelector('[data-sact="' + a + '"]'); };
    q('pz-hint').disabled = pz.done || pz.busy;
    q('pz-retry').disabled = !g.history.length && !pz.wrong;
  }

  function finishPuzzle() {
    pz.done = true;
    pz.busy = false;
    var perfect = !pz.wrong && !pz.aided && !pz.seenAtStart;
    setProgress(pz.p.id, { s: perfect ? 2 : 1 });
    App.campusAct();
  }

  /** 我方走對一步之後：題目走完就結束，否則自動走出對方的應著。 */
  function advance() {
    var line = pz.p.line;
    pz.hint = -1;
    pz.hintFrom = -1;
    pz.wrongText = '';
    if (pz.step >= line.length || pz.game.result()) { finishPuzzle(); refreshPuzzle(); return; }
    var mine = pz;
    pz.busy = true;
    refreshPuzzle();
    replyTimer = setTimeout(function () {
      replyTimer = 0;
      if (pz !== mine || !mine.busy) return;
      mine.busy = false;
      mine.game.play(E.strToMove(line[mine.step]));
      mine.step++;
      if (mine.step >= line.length || mine.game.result()) finishPuzzle();
      refreshPuzzle();
    }, 450);
  }

  function onPuzzleMove(m) {
    var g = pz.game;
    var want = E.strToMove(pz.p.line[pz.step]);
    pz.selected = -1;
    if (m !== want) {
      // 殺棋題：只要這一步直接將死就算對。
      var san = E.moveToSan(g.pos, m);
      var mates = san.charAt(san.length - 1) === '#';
      if (!(mates && pz.p.goal !== 'draw')) {
        pz.wrong++;
        pz.wrongText = san + ' 不是最好的一步，再想想看。';
        pz.animate = false;
        refreshPuzzle();
        return;
      }
      g.play(m);
      pz.step = pz.p.line.length;
      advance();
      return;
    }
    g.play(m);
    pz.step++;
    advance();
  }

  function onPuzzleSquare(sq) {
    var g = pz.game;
    if (pz.done || pz.busy || g.turn() !== mySide()) return;
    if (App.tryMove(g, pz.selected, sq, onPuzzleMove)) return;
    var p = g.pos.board[sq];
    pz.selected = p && E.sideOf(p) === mySide() && pz.selected !== sq ? sq : -1;
    pz.animate = false;
    refreshPuzzle();
  }

  function onPuzzleAction(act) {
    if (act === 'pz-retry') {
      stopPuzzle();
      var seen = !!(progress()[pz.p.id] || {}).seen;
      newAttempt(pz.p, pz.idx);
      pz.seenAtStart = seen;
      refreshPuzzle();
    } else if (act === 'pz-hint') {
      if (pz.done || pz.busy) return;
      var want = E.strToMove(pz.p.line[pz.step]);
      pz.aided = true;
      pz.selected = -1;
      pz.animate = false;
      if (pz.hintFrom < 0 && pz.hint < 0) {
        // 第一次提示只圈出該動哪個棋子；再按一次才顯示整步棋。
        pz.hintFrom = E.fromOf(want);
        App.toast('提示：動這個' + NT.pieceName(pz.game.pos.board[pz.hintFrom]) + '。再按一次顯示整步棋');
      } else {
        pz.hintFrom = -1;
        pz.hint = want;
        App.toast('這一步是 ' + E.moveToSan(pz.game.pos, want));
      }
      refreshPuzzle();
    } else if (act === 'pz-solution') {
      setProgress(pz.p.id, { seen: true });
      location.hash = '#/replay/puzzle-' + pz.p.id;
    }
  }

  // ------------------------------------------------------------------ 課程
  function learned() {
    var d = App.load(KEY_LEARN, {});
    return d && typeof d === 'object' ? d : {};
  }

  function flatLessons() {
    var out = [];
    units().forEach(function (u) { u.lessons.forEach(function (l) { out.push({ unit: u, lesson: l }); }); });
    return out;
  }

  function renderLearnHome() {
    var done = learned();
    var all = flatLessons();
    var doneCount = all.filter(function (x) { return done[x.lesson.id]; }).length;
    App.main.innerHTML = '<div class="study-wrap">' +
      '<section class="card pz-head"><div><h1>西洋棋課程</h1>' +
      '<p class="muted">' + units().length + ' 個單元、' + all.length + ' 堂課，主打「戰術」與「逆轉技巧」。示範棋盤都能一步一步看，學完可以直接到戰術題庫練習同一個主題。</p></div>' +
      '<div class="pz-score"><span class="pz-score-main">' + doneCount + '<small> / ' + all.length + '</small></span><span class="muted">已讀</span></div></section>' +
      units().map(function (u) {
        return '<section class="card"><div class="card-head"><h2>' + u.icon + ' ' + esc(u.title) + '</h2>' +
          '<span class="count-pill">' + u.lessons.length + ' 堂</span></div>' +
          '<p class="rec-desc">' + esc(u.intro) + '</p><div class="ls-grid">' +
          u.lessons.map(function (l, i) {
            return '<a class="ls-card' + (done[l.id] ? ' is-done' : '') + '" href="#/learn/' + esc(l.id) + '">' +
              '<span class="ls-no">' + (i + 1) + '</span><span class="ls-text"><strong>' + esc(l.title) + '</strong>' +
              '<small>' + esc(l.summary) + '</small></span><span class="ls-st">' + (done[l.id] ? '✓' : '') + '</span></a>';
          }).join('') + '</div></section>';
      }).join('') + '</div>';
  }

  var demos = []; // 目前課程頁上的示範棋盤 { d, game, idx, board }

  function demoPos(dm) {
    return E.parseFen(dm.idx === 0 ? dm.game.startFen : dm.game.history[dm.idx - 1].fen);
  }

  function refreshDemo(i, animate) {
    var dm = demos[i];
    var pos = demoPos(dm);
    var d = dm.d;
    var sel = -1, dots = [];
    if (dm.idx === 0 && d.from) {
      // 靜態示範：標出某個棋子與它能走到（或題目指定）的格子。
      sel = E.strToSq(d.from);
      dots = d.dots ? d.dots.map(E.strToSq) : E.legalMovesFrom(pos, sel).map(function (m) { return E.toOf(m); });
    }
    dm.board.render({
      board: pos.board, flipped: !!d.flip, faceToFace: false, selected: sel, targets: dots,
      last: dm.idx > 0 ? dm.game.history[dm.idx - 1].move : -1, check: App.checkSquare(pos), animate: !!animate, hint: -1,
    });
    var total = dm.game.history.length;
    var info = document.getElementById('demoInfo' + i);
    if (!info || !total) return;
    var names = dm.game.sanList();
    var start = E.parseFen(dm.game.startFen);
    var blackFirst = start.turn === E.BLACK;
    var no = start.full;
    var html = '';
    names.forEach(function (n, k) {
      var white = (k % 2 === 0) !== blackFirst;
      if (white) html += '<span class="demo-no">' + no + '.</span>';
      else if (k === 0) html += '<span class="demo-no">' + no + '…</span>';
      html += '<span class="demo-mv' + (k + 1 === dm.idx ? ' is-active' : '') + '">' + esc(n) + '</span>';
      if (!white) no++;
    });
    if (dm.idx === total) {
      var res = dm.game.result();
      if (res && res.reason === 'checkmate') html += '<span class="demo-end">將死</span>';
      else if (res && res.reason === 'stalemate') html += '<span class="demo-end is-draw">逼和</span>';
      else if (res && res.reason === 'repetition') html += '<span class="demo-end is-draw">三次重複・和棋</span>';
      else if (d.end) html += '<span class="demo-end is-win">' + esc(d.end) + '</span>';
    }
    info.innerHTML = html;
  }

  function renderLesson(id) {
    var all = flatLessons();
    var at = -1;
    for (var i = 0; i < all.length; i++) if (all[i].lesson.id === id) at = i;
    if (at < 0) { renderLearnHome(); return; }
    var l = all[at].lesson, u = all[at].unit;
    var done = learned();
    if (!done[l.id]) { done[l.id] = 1; App.save(KEY_LEARN, done); App.campusAct(); }

    var related = l.tag ? puzzles().filter(function (p) { return (p.tags || []).indexOf(l.tag) >= 0; }).length : 0;
    var recs = window.CH_RECORDS || [];
    var html = '<div class="study-wrap lesson">' +
      '<p class="crumb"><a href="#/learn">課程</a> › ' + u.icon + ' ' + esc(u.title) + '</p>' +
      '<section class="card"><h1>' + esc(l.title) + '</h1><p class="ls-summary">' + esc(l.summary) + '</p>' +
      (l.body || []).map(function (p) { return '<p class="ls-p">' + esc(p) + '</p>'; }).join('') +
      ((l.points || []).length
        ? '<ul class="ls-list">' + l.points.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' : '') +
      (l.tip ? '<p class="ls-tip">💡 ' + esc(l.tip) + '</p>' : '') +
      ((l.terms || []).length
        ? '<dl class="term-list">' + l.terms.map(function (t) {
          return '<div><dt>' + esc(t[0]) + '</dt><dd>' + esc(t[1]) + '</dd></div>';
        }).join('') + '</dl>' : '') +
      '</section>';

    (l.demos || []).forEach(function (d, k) {
      html += '<section class="card demo-card"><div class="demo-board" id="demoBoard' + k + '"></div>' +
        '<div class="demo-side"><h2>' + esc(d.title || '示範') + '</h2>' +
        '<p class="ls-p">' + esc(d.caption || '') + '</p>' +
        (d.moves
          ? '<div class="rp-controls demo-controls">' +
            '<button type="button" class="btn" data-sact="demo-first" data-v="' + k + '" aria-label="回到開始">⏮</button>' +
            '<button type="button" class="btn" data-sact="demo-prev" data-v="' + k + '" aria-label="上一步">◀</button>' +
            '<button type="button" class="btn btn-primary" data-sact="demo-next" data-v="' + k + '">下一步 ▶</button></div>' +
            '<div class="demo-info" id="demoInfo' + k + '"></div>'
          : '') +
        '</div></section>';
    });

    var links = '';
    if (related) {
      links += '<a class="btn btn-primary" href="#/puzzle/tag/' + encodeURIComponent(l.tag) + '">🧩 練習「' + esc(l.tag) + '」的題目（' + related + ' 題）</a>';
    }
    (l.records || []).forEach(function (rid) {
      for (var r = 0; r < recs.length; r++) {
        if (recs[r].id === rid) links += '<a class="btn" href="#/replay/' + esc(rid) + '">📜 看示範棋譜：' + esc(recs[r].title) + '</a>';
      }
    });
    if (l.play) links += '<a class="btn" href="#/play">♟️ 找 AI 下一盤試試</a>';
    if (links) html += '<section class="card ls-links">' + links + '</section>';

    html += '<div class="pz-nav">' +
      (at > 0 ? '<a class="btn" href="#/learn/' + esc(all[at - 1].lesson.id) + '">← ' + esc(all[at - 1].lesson.title) + '</a>' : '<span></span>') +
      (at + 1 < all.length ? '<a class="btn btn-primary" href="#/learn/' + esc(all[at + 1].lesson.id) + '">' + esc(all[at + 1].lesson.title) + ' →</a>' : '') +
      '</div></div>';
    App.main.innerHTML = html;

    demos = (l.demos || []).map(function (d, k) {
      var game = d.moves ? NT.gameFromSan(d.fen, d.moves) : new E.Game(d.fen);
      return { d: d, game: game, idx: 0, board: window.CHBoard.create(document.getElementById('demoBoard' + k), {}) };
    });
    demos.forEach(function (dm, k) { refreshDemo(k, false); });
  }

  function onDemoAction(act, k) {
    var dm = demos[k];
    if (!dm) return;
    var before = dm.idx;
    if (act === 'demo-first') dm.idx = 0;
    else if (act === 'demo-prev') dm.idx = Math.max(0, dm.idx - 1);
    else if (act === 'demo-next') dm.idx = dm.idx >= dm.game.history.length ? 0 : dm.idx + 1;
    refreshDemo(k, dm.idx === before + 1);
  }

  // ------------------------------------------------------------------ 對外介面
  function init() {
    App = window.CHApp;
    App.main.addEventListener('click', function (ev) {
      var t = ev.target.closest('[data-sact]');
      if (!t || t.disabled) return;
      var act = t.getAttribute('data-sact');
      if (act === 'level') { listFilter.level = +t.getAttribute('data-v'); renderPuzzleList(); }
      else if (act === 'kind') { listFilter.kind = t.getAttribute('data-v'); renderPuzzleList(); }
      else if (act.indexOf('pz-') === 0) { if (pz) onPuzzleAction(act); }
      else if (act.indexOf('demo-') === 0) onDemoAction(act, +t.getAttribute('data-v'));
    });
    App.main.addEventListener('change', function (ev) {
      if (ev.target.id === 'pzTag') {
        listFilter.tag = ev.target.value;

  function drawLobby() {

      var e = S.lobby[rid] || {};

    }).sort(function (a, b) { return (a.e.st === 'waiting' ? 0 : 1) - (b.e.st === 'waiting' ? 0 : 1) || b.e.at - a.e.at; });
