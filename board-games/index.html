      var content = document.getElementById('fbContent').value.trim();
      var out = document.getElementById('fbResult');
      if (!title || !content) { out.innerHTML = '<div class="notice warn">請填寫標題與內容。</div>'; return; }
      var btn = document.getElementById('fbSubmit');
      btn.disabled = true;
      out.innerHTML = '<div class="notice">送出中…</div>';
      var desc = content + '\n\n（棋類：' + m.name + '）';
      function done(html) {
        btn.disabled = false;
        out.innerHTML = html;
      }
      function viaStatic() {
        if (!window.CampusNav || typeof window.CampusNav.sendStaticFeedback !== 'function') {
          return Promise.resolve(done('<div class="notice err">目前無法送出，請稍後再試。</div>'));
        }
        return window.CampusNav.sendStaticFeedback({ tool: '經典棋藝學院', kindLabel: type, title: title, description: desc }).then(function (r) {
          if (r && r.sent) { form.reset(); done('<div class="notice ok">✅ 已送出，感謝你的回饋！</div>'); }
          else if (r && r.queued) { form.reset(); done('<div class="notice ok">📮 已暫存，恢復連線後會自動補送。</div>'); }
          else done('<div class="notice err">送出失敗，請稍後再試。</div>');
        }, function () { done('<div class="notice err">送出失敗，請稍後再試。</div>'); });
      }
      if (isLocalHost()) {
        fetch('api/feedback', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: type, title: title, content: desc }),
        }).then(function (r) { return r.json(); }).then(function (d) {
          if (d && d.ok) {
            form.reset();
            if (window.CampusNav && typeof window.CampusNav.recordFeedback === 'function') { try { window.CampusNav.recordFeedback(); } catch (_) {} }
            done('<div class="notice ok">✅ 已收到（編號 ' + esc(d.item && d.item.id) + '），感謝你的回饋！</div>');
          } else { viaStatic(); }
        }).catch(viaStatic);
      } else {
        viaStatic();
      }
    });
  }

  // ------------------------------------------------------------------ 版本紀錄
  function initReleaseModal() {
    var btn = document.getElementById('versionBadgeBtn');
    var modal = document.getElementById('releaseModal');
    var body = document.getElementById('releaseModalBody');
    var data = window.BG_RELEASES || { current_version: '1.0.0', releases: [] };
    var vt = document.getElementById('verText');
    if (vt) vt.textContent = 'v' + (data.current_version || '1.0.0');
    function close() { modal.hidden = true; }
    btn.addEventListener('click', function () {
      var html = (data.releases || []).map(function (r) {
        return '<div class="rel-item"><div class="rel-head"><span class="rel-ver">v' + esc(r.version) + '</span>' +
          '<span class="rel-date">' + esc(r.date) + '</span></div><h3>' + esc(r.title) + '</h3><ul>' +
          (r.changes || []).map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>';
      }).join('') || '<p class="muted">尚無版本紀錄。</p>';
      if (isLocalHost()) {
        html += '<div class="rel-item"><h3>⬇️ 下載</h3><div class="btn-row">' +
          '<a class="btn sm" href="download/single" download>單一 HTML 檔</a>' +
          '<a class="btn sm" href="download/zip" download>網站 ZIP</a></div></div>';
      }
      body.innerHTML = html;
      modal.hidden = false;
    });
    document.getElementById('closeReleaseModalBtn').addEventListener('click', close);
    modal.addEventListener('click', function (ev) { if (ev.target === modal) close(); });
    window.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !modal.hidden) close(); });
  }

  // ------------------------------------------------------------------ 事件
  main.addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-pa]') : null;
    if (!el || !main.contains(el)) return;
    var act = el.getAttribute('data-pa');
    if (el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type !== 'button')) return;
    if (act === 'rankplay') {
      var p = prefs();
      p.setup[S.game].mode = 'rated';
      savePrefs(p);
      S.pendingNew = true;
      navigate(hashFor('play', '', S.game));
      return;
    }
    if (act.indexOf('rp') === 0) { onReplayAction(act, el); return; }
    if (S.view === 'play') onPlayAction(act, el);
  });
  main.addEventListener('change', function (ev) {
    var el = ev.target;
    var act = el && el.getAttribute ? el.getAttribute('data-pa') : null;
    if (!act || S.view !== 'play') return;
    if (act === 'renju') onSetting('renju', el.checked);
    else if (act === 'blast') onSetting('blast', el.checked);
    else if (act === 'openplay') onSetting('openplay', el.checked);
    else if (act === 'seat') onSetting('seat', el.value, +el.getAttribute('data-side'));
  });
  main.addEventListener('input', function (ev) {
    if (ev.target && ev.target.id === 'rpSlider') { stopAuto(); replayGoto(+ev.target.value); }
  });
  window.addEventListener('keydown', function (ev) {
    if (S.view !== 'replay' || !S.rp) return;
    var tag = ev.target && ev.target.tagName;
    if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT') return;
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); stopAuto(); replayGoto(S.rp.ply - 1); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); stopAuto(); replayGoto(S.rp.ply + 1); }
  });

  // 給 study.js（題庫與課程）與 online.js（線上對弈）共用的工具。
  window.BGApp = {
    main: main,
    getGame: function () { return S.game; },
    setGame: setGame,
    load: load, save: save, loadStats: loadStats, saveStats: saveStats,
    esc: esc, toast: toast, copyText: copyText, campusAct: campusAct,
    tryMove: tryMove, targetsOf: targetsOf, boardDecor: boardDecor, moveTexts: moveTexts,
    upsertSavedGame: upsertSavedGame, navigate: navigate, hashFor: hashFor,
    refreshRankPill: refreshRankPill, meta: meta, sideName: sideName, nowStr: nowStr, isLocalHost: isLocalHost,
  };

  function init() {
    var r = parseHash();
    var qs = /[?&]g=([a-z]+)/.exec(location.search || '');
    var pg = prefs().game;
    S.game = normId(r.g && isGameId(r.g) ? r.g : qs && isGameId(qs[1]) ? qs[1] : pg && isGameId(pg) ? pg : 'gomoku');
    initReleaseModal();
    var sw = document.getElementById('gameSwitcher');
    if (sw) {
      sw.addEventListener('click', function (ev) {
        var b = ev.target.closest ? ev.target.closest('[data-game]') : null;
        if (b) setGame(b.getAttribute('data-game'));
      });
    }
    window.addEventListener('hashchange', route);
    route();
    if (window.CampusNav && typeof window.CampusNav.wire === 'function') {
      try { window.CampusNav.wire(); } catch (_) {}
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

  </script>
</body>
</html>
