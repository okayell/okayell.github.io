// ============================================================================
// 🎲 經典棋藝學院 — 題庫（#/puzzle）與互動課程（#/learn）（window.BGStudy）
// 依目前棋類（五子棋／跳棋／西瓜棋）篩選題目與課程；五子棋一點落子，跳棋與西瓜棋先選子再選落點。
// 進度：bg.puzzle.v1（{ 題號: { s: 'perfect'|'pass', at } }）、bg.learn.v1（{ done: {}, quiz: {} }）。
// ============================================================================

(function () {
  'use strict';
  var KEY_PUZZLE = 'bg.puzzle.v1';
  var KEY_LEARN = 'bg.learn.v1';
  var GAMES = ['gomoku', 'checkers', 'watermelon', 'luzhanqi'];
  var LEVELS = { 1: '入門', 2: '進階', 3: '挑戰' };
  var REPLY_MS = 280;

  var F = { level: 0 };
  var P = null; // 目前題目狀態
  var L = null; // 目前課程狀態

  function App() { return window.BGApp; }
  function esc(s) { return App().esc(s); }
  function eng(g) { return window.BGEngines.get(g); }
  function normId(g) { return window.BGEngines.normalizeId(g); }
  function meta(g) { return App().meta(g); }
  function hashFor(view, param, g) { return App().hashFor(view, param, g); }
  function lower(s) { return String(s == null ? '' : s).trim().toLowerCase(); }
  function puzzles() { return Array.isArray(window.BG_PUZZLES) ? window.BG_PUZZLES.filter(Boolean) : []; }
  function units() { return Array.isArray(window.BG_UNITS) ? window.BG_UNITS.filter(Boolean) : []; }
  function ofGame(arr, g) { return arr.filter(function (x) { return normId(x.game) === g; }); }
  function newGame(g, setup) {
    var E = eng(g);
    try { return new E.Game(setup || E.START_SETUP); } catch (_) { return new E.Game(E.START_SETUP); }
  }
  function moveText(g, game, mv) {
    try { return window.BGNotation.moveText(g, game, mv); } catch (_) { return eng(g).moveToStr(mv); }
  }
  function markToSq(g, m) {
    if (typeof m === 'number') return m;
    var s = String(m == null ? '' : m).trim();
    if (/^\d+$/.test(s)) return +s;
    var E = eng(g);
    if (E && Array.isArray(E.COORDS)) {
      var ci = E.COORDS.indexOf(s.toUpperCase());
      if (ci >= 0) return ci;
    }
    var mv = E.strToMove(s);
    return mv >= 0 ? E.toOf(mv) : -1;
  }
  function loadPuzzleProg() {
    var p = App().load(KEY_PUZZLE, {});
    return p && typeof p === 'object' && !Array.isArray(p) ? p : {};
  }
  function loadLearnProg() {
    var p = App().load(KEY_LEARN, null);
    if (!p || typeof p !== 'object') p = {};
    if (!p.done || typeof p.done !== 'object') p.done = {};
    if (!p.quiz || typeof p.quiz !== 'object') p.quiz = {};
    return p;
  }
  function stepFlip(g, side) { return g !== 'gomoku' && side === 2; }

  function countsHtml(view, g, list, progFn) {
    return '<div class="game-counts">' + GAMES.map(function (gg) {
      var items = ofGame(list, gg);
      var done = items.filter(progFn).length;
      var m = meta(gg);
      return '<a class="' + (gg === g ? 'active' : '') + '" href="' + hashFor(view, '', gg) + '"><span class="pill">' + esc(m.icon + ' ' + m.name) + ' ' + done + '／' + items.length + '</span></a>';
    }).join('') + '</div>';
  }

  // ------------------------------------------------------------------ 題庫
  function stopTimers() {
    if (P && P.timer) clearTimeout(P.timer);
    if (L && L.timer) clearTimeout(L.timer);
    P = null;
    L = null;
  }
  function mountPuzzle(host, gameKind, param) {
    stopTimers();
    var g = normId(gameKind);
    var all = puzzles();
    var list = ofGame(all, g);
    var prog = loadPuzzleProg();
    var shown = list.filter(function (p) { return !F.level || +p.level === F.level; });
    var cur = list.filter(function (p) { return p.id === param; })[0] ||
      shown.filter(function (p) { return !prog[p.id]; })[0] || shown[0] || list[0] || null;
    var m = meta(g);
    var solved = list.filter(function (p) { return prog[p.id]; }).length;
    var perfect = list.filter(function (p) { return prog[p.id] && prog[p.id].s === 'perfect'; }).length;

    var html = '<div class="study-root" data-kind="puzzle">' +
      '<div class="page-head"><h1>🧩 ' + esc(m.name) + '題庫</h1><span class="muted">已過關 ' + solved + '／' + list.length + '・⭐ 完美 ' + perfect + '</span>' +
      countsHtml('puzzle', g, all, function (p) { return !!prog[p.id]; }) + '</div>' +
      '<div class="study-layout"><div class="card"><div class="seg" style="margin-bottom:8px">' +
      [[0, '全部'], [1, '入門'], [2, '進階'], [3, '挑戰']].map(function (x) {
        return '<button type="button" data-sa="lvl" data-v="' + x[0] + '" class="' + (F.level === x[0] ? 'active' : '') + '">' + x[1] + '</button>';
      }).join('') + '</div><div class="item-list">' +
      (shown.map(function (p, i) {
        var pr = prog[p.id];
        return '<a class="item' + (cur && cur.id === p.id ? ' active' : '') + '" href="' + hashFor('puzzle', p.id, g) + '" data-pid="' + esc(p.id) + '">' +
          '<span class="ix">' + esc(String(p.id).replace(/^[a-z]+-p/, '#')) + '</span><span class="tt">' + esc(p.title) + '</span>' +
          '<span class="st">' + (pr ? (pr.s === 'perfect' ? '⭐' : '✅') : '<span class="muted small">' + esc(LEVELS[p.level] || '') + '</span>') + '</span></a>';
      }).join('') || '<p class="muted">這個難度還沒有題目。</p>') + '</div></div>';
    if (!cur) {
      html += '<div class="card empty">題庫尚未載入。</div></div></div>';
      host.innerHTML = html;
      bindRoot(host);
      return;
    }
    html += '<div class="stage"><div class="board-col"><div class="board-wrap" id="pzBoard"></div></div><div class="side-col">' +
      '<div class="card game"><div class="card-head"><h2>' + esc(cur.title) + '</h2><span class="pill game">' + esc(LEVELS[cur.level] || '') + '</span></div>' +
      '<div class="turn-line" style="font-size:15px">' + window.BGBoard.pieceBadgeHtml(g, cur.side || 1, 22) + '<span>' + esc(App().sideName(g, cur.side || 1)) + '走</span></div>' +
      '<p style="margin-top:6px"><b>🎯 目標：</b>' + esc(cur.goal || '找出最佳著手') + '</p>' +
      (Array.isArray(cur.tags) && cur.tags.length ? '<div class="btn-row" style="margin-top:6px">' + cur.tags.map(function (t) { return '<span class="tag-pill">' + esc(t) + '</span>'; }).join('') + '</div>' : '') +
      '<p class="feedback-line" id="pzMsg" style="margin-top:8px"></p>' +
      '<div class="btn-row"><button type="button" class="btn sm" data-sa="pzhint">💡 提示</button><button type="button" class="btn sm" data-sa="pzreset">🔄 重來</button>' +
      '<button type="button" class="btn sm primary" data-sa="pznext">⏭ 下一題</button></div>' +
      '<div id="pzExplain" style="margin-top:8px"></div></div>' +
      '<div class="card"><div class="card-head"><h2>📊 本題紀錄</h2></div><p id="pzRec" class="muted"></p></div>' +
      '</div></div></div></div>';
    host.innerHTML = html;
    bindRoot(host);
    var boardEl = document.getElementById('pzBoard');
    P = { g: g, pz: cur, list: shown.length ? shown : list, board: null, game: null, step: 0, mistakes: 0, hinted: false, solved: false, sel: -1, busy: false, hint: -1, timer: 0, token: {} };
    P.board = window.BGBoard.create(boardEl, { gameKind: g, onSquare: onPuzzleSquare });
    resetPuzzle();
  }
  function puzzleRecText() {
    var pr = loadPuzzleProg()[P.pz.id];
    if (!pr) return '尚未過關。';
    return (pr.s === 'perfect' ? '⭐ 完美' : '✅ 過關') + '・' + App().nowStr(pr.at);
  }
  function resetPuzzle() {
    if (!P) return;
    if (P.timer) { clearTimeout(P.timer); P.timer = 0; }
    P.token = {};
    P.game = newGame(P.g, P.pz.setup);
    P.step = 0;
    P.mistakes = 0;
    P.hinted = false;
    P.solved = false;
    P.sel = -1;
    P.busy = false;
    P.hint = -1;
    msg('輪到你：' + (P.pz.goal || '找出最佳著手'), '');
    var ex = document.getElementById('pzExplain');
    if (ex) ex.innerHTML = '';
    var rec = document.getElementById('pzRec');
    if (rec) rec.textContent = puzzleRecText();
    drawPuzzle();
  }
  function msg(text, cls) {
    var el = document.getElementById(L && L.active ? 'lnMsg' : 'pzMsg');
    if (!el) return;
    el.textContent = text;
    el.className = 'feedback-line' + (cls ? ' ' + cls : '');
  }
  function drawPuzzle() {
    if (!P || !P.board) return;
    var dec = App().boardDecor(P.game);
    P.board.render({
      game: P.game, flipped: stepFlip(P.g, P.pz.side), selected: P.sel, targets: App().targetsOf(P.game, P.sel),
      lastMove: dec.lastMove, hopPath: dec.hopPath, railPath: dec.railPath, winLine: dec.winLine, captured: dec.captured,
      forbidden: null, hintMove: P.hint, marks: null,
    });
  }
  function onPuzzleSquare(sq) {
    if (!P || P.solved || P.busy) return;
    if (P.game.turn() !== (P.pz.side || 1)) return;
    var moved = false;
    P.sel = App().tryMove(P.game, P.sel, sq, function (mv) { moved = true; onPuzzleMove(mv); });
    if (!moved) drawPuzzle();
  }
  function onPuzzleMove(mv) {
    var E = eng(P.g);
    var sol = Array.isArray(P.pz.solution) ? P.pz.solution : [];
    var acc = (Array.isArray(P.pz.accept) ? P.pz.accept : []).map(lower);
    var str = lower(E.moveToStr(mv));
    var i = P.step;
    var isLast = i >= sol.length - 1;
    var ok = str === lower(sol[i]) || ((isLast || !sol.length) && acc.indexOf(str) >= 0);
    var trial = P.game.clone();
    trial.play(mv);
    var tr = trial.result();
    var winNow = !!(tr && tr.winner === (P.pz.side || 1));
    if (!ok && winNow) ok = true;
    P.sel = -1;
    P.hint = -1;
    if (!ok) {
      P.mistakes++;
      P.busy = true;
      P.game.play(mv);
      drawPuzzle();
      msg('❌ ' + moveText(P.g, trial, mv) + ' 不是最佳解，再想想看。' + (P.mistakes >= 2 && P.pz.hint ? '提示：' + P.pz.hint : ''), 'bad');
      var tk = P.token;
      P.timer = setTimeout(function () {
        P.timer = 0;
        if (!P || P.token !== tk) return;
        P.game.undo();
        P.busy = false;
        drawPuzzle();
      }, 650);
      return;
    }
    var before = P.game.clone();
    P.game.play(mv);
    P.step++;
    if (winNow || P.step >= sol.length || P.game.result()) { solvePuzzle(); return; }
    msg('👍 ' + moveText(P.g, before, mv) + '，對手回應中…', 'ok');
    drawPuzzle();
    P.busy = true;
    var token = P.token;
    P.timer = setTimeout(function () {
      P.timer = 0;
      if (!P || P.token !== token) return;
      var reply = E.strToMove(String(sol[P.step]));
      var legal = reply >= 0 && P.game.legalMoves().indexOf(reply) >= 0;
      if (legal) {
        var b2 = P.game.clone();
        P.game.play(reply);
        P.step++;
        msg('對手走 ' + moveText(P.g, b2, reply) + '，輪到你繼續。', '');
      }
      P.busy = false;
      if (!legal || P.step >= sol.length) { solvePuzzle(); return; }
      drawPuzzle();
    }, REPLY_MS);
  }
  function solvePuzzle() {
    P.solved = true;
    P.busy = false;
    var grade = P.mistakes === 0 && !P.hinted ? 'perfect' : 'pass';
    var prog = loadPuzzleProg();
    var old = prog[P.pz.id];
    if (!old || (old.s !== 'perfect' && grade === 'perfect')) prog[P.pz.id] = { s: grade, at: Date.now() };
    App().save(KEY_PUZZLE, prog);
    App().campusAct();
    msg(grade === 'perfect' ? '⭐ 完美！一次就找到正解。' : '✅ 過關！' + (P.mistakes ? '（嘗試 ' + (P.mistakes + 1) + ' 次）' : ''), 'ok');
    var ex = document.getElementById('pzExplain');
    if (ex && P.pz.explain) ex.innerHTML = '<div class="notice ok">📝 ' + esc(P.pz.explain) + '</div>';
    var rec = document.getElementById('pzRec');
    if (rec) rec.textContent = puzzleRecText();
    var item = document.querySelector('.item[data-pid="' + String(P.pz.id).replace(/"/g, '') + '"] .st');
    if (item) item.textContent = prog[P.pz.id].s === 'perfect' ? '⭐' : '✅';
    drawPuzzle();
  }
  function nextPuzzle() {
    if (!P) return;
    var list = P.list;
    var prog = loadPuzzleProg();
    var idx = list.indexOf(P.pz);
    var next = null;
    for (var k = 1; k <= list.length; k++) {
      var c = list[(idx + k) % list.length];
      if (!prog[c.id]) { next = c; break; }
    }
    if (!next) next = list[(idx + 1) % list.length];
    if (next) App().navigate(hashFor('puzzle', next.id, P.g));
  }

  // ------------------------------------------------------------------ 課程
  function mountLearn(host, gameKind, param) {
    stopTimers();
    var g = normId(gameKind);
    var all = units();
    var list = ofGame(all, g);
    var prog = loadLearnProg();
    var m = meta(g);
    var cur = list.filter(function (u) { return u.id === param; })[0] || null;
    var done = list.filter(function (u) { return prog.done[u.id]; }).length;
    var head = '<div class="page-head"><h1>📘 ' + esc(m.name) + '課程</h1><span class="muted">完成 ' + done + '／' + list.length + ' 課</span>' +
      countsHtml('learn', g, all, function (u) { return !!prog.done[u.id]; }) + '</div>';
    if (!cur) {
      host.innerHTML = '<div class="study-root" data-kind="learn">' + head + '<div class="grid-cards">' + (list.map(function (u, i) {
        var d = prog.done[u.id];
        return '<a class="card' + (d ? '' : ' accent') + '" style="text-decoration:none;color:inherit" href="' + hashFor('learn', u.id, g) + '">' +
          '<div class="card-head"><h2>第 ' + (i + 1) + ' 課・' + esc(u.title) + '</h2>' + (d ? '<span class="pill ok">✅ 已完成</span>' : '<span class="pill">' + esc(u.unit || '') + '</span>') + '</div>' +
          '<p class="muted">' + esc(u.summary || '') + '</p><p class="small" style="margin-top:6px">' + ((u.steps || []).length) + ' 個圖解步驟' + (u.quiz ? '＋隨堂小測驗' : '') + '</p></a>';
      }).join('') || '<div class="card empty">課程尚未載入。</div>') + '</div></div>';
      bindRoot(host);
      return;
    }
    var idx = list.indexOf(cur);
    var nextU = list[idx + 1] || null;
    host.innerHTML = '<div class="study-root" data-kind="learn">' + head +
      '<div class="stage"><div class="board-col"><div class="board-wrap" id="lnBoard"></div></div><div class="side-col">' +
      '<div class="card game"><div class="card-head"><h2>' + esc(cur.title) + '</h2><span class="pill game">' + esc(cur.unit || ('第 ' + (idx + 1) + ' 課')) + '</span></div>' +
      '<p class="muted">' + esc(cur.summary || '') + '</p>' +
      (cur.plain ? '<div class="plain-box" style="margin-top:8px">🧒 <b>白話比喻：</b>' + esc(cur.plain) + '</div>' : '') + '</div>' +
      '<div class="card"><div class="card-head"><h2 id="lnStepTitle">步驟</h2><span class="pill" id="lnStepNo"></span></div>' +
      '<div id="lnStepBody" class="step-text"></div><p class="feedback-line" id="lnMsg"></p>' +
      '<div class="btn-row" style="margin-top:8px"><button type="button" class="btn sm" data-sa="lnprev">◀ 上一步</button>' +
      '<button type="button" class="btn sm primary" data-sa="lnnext">下一步 ▶</button>' +
      '<button type="button" class="btn sm" data-sa="lnquizreset" id="lnQuizReset" hidden>🔄 重來</button></div></div>' +
      (cur.takeaway ? '<div class="takeaway-box">📝 一句話記住：' + esc(cur.takeaway) + '</div>' : '') +
      '<div class="btn-row"><a class="btn sm" href="' + hashFor('learn', '', g) + '">📚 課程列表</a>' +
      (nextU ? '<a class="btn sm" href="' + hashFor('learn', nextU.id, g) + '">下一課 ⏭</a>' : '') + '</div>' +
      '</div></div></div>';
    bindRoot(host);
    L = { g: g, unit: cur, i: 0, board: null, quiz: false, game: null, sel: -1, busy: false, solved: false, active: true, token: {}, timer: 0, next: nextU };
    L.board = window.BGBoard.create(document.getElementById('lnBoard'), { gameKind: g, onSquare: onLearnSquare });
    showStep(0);
  }
  function stepsOf(u) { return Array.isArray(u.steps) ? u.steps : []; }
  function showStep(i) {
    if (!L) return;
    var u = L.unit;
    var steps = stepsOf(u);
    var total = steps.length + 1;
    i = Math.max(0, Math.min(total - 1, i));
    L.i = i;
    if (L.timer) { clearTimeout(L.timer); L.timer = 0; }
    L.token = {};
    L.sel = -1;
    L.busy = false;
    var reset = document.getElementById('lnQuizReset');
    document.getElementById('lnStepNo').textContent = (i + 1) + '／' + total;
    var prev = document.querySelector('[data-sa="lnprev"]');
    var next = document.querySelector('[data-sa="lnnext"]');
    if (prev) prev.disabled = i === 0;
    if (i < steps.length) {
      L.quiz = false;
      if (reset) reset.hidden = true;
      if (next) { next.disabled = false; next.textContent = i === steps.length - 1 ? (u.quiz ? '隨堂測驗 ▶' : '完成本課 ✅') : '下一步 ▶'; }
      var st = steps[i] || {};
      var game = newGame(L.g, st.setup);
      if (st.move) {
        var mv = eng(L.g).strToMove(String(st.move));
        if (mv >= 0 && game.legalMoves().indexOf(mv) >= 0) game.play(mv);
      }
      L.game = game;
      document.getElementById('lnStepTitle').textContent = '📖 圖解步驟';
      document.getElementById('lnStepBody').textContent = st.text || '';
      msg('', '');
      var marks = (Array.isArray(st.marks) ? st.marks : []).map(function (x) { return markToSq(L.g, x); }).filter(function (x) { return x >= 0; });
      drawLearn(marks);
      return;
    }
    // 測驗（或沒有測驗時的完成頁）
    L.quiz = true;
    var q = u.quiz;
    if (next) { next.disabled = !!q && !loadLearnProg().done[u.id]; next.textContent = L.next ? '下一課 ⏭' : '回課程列表'; }
    document.getElementById('lnStepTitle').textContent = q ? '✏️ 隨堂小測驗' : '🎓 本課完成';
    if (!q) {
      L.game = newGame(L.g, (stepsOf(u)[steps.length - 1] || {}).setup);
      document.getElementById('lnStepBody').textContent = '恭喜看完本課所有步驟！';
      completeLesson(false);
      drawLearn([]);
      return;
    }
    if (reset) reset.hidden = false;
    L.solved = false;
    L.game = newGame(L.g, q.setup);
    document.getElementById('lnStepBody').textContent = q.prompt || '請在棋盤上走出正確的一手。';
    msg(loadLearnProg().quiz[u.id] ? '你已經答對過這題，可以再練一次。' : '直接在棋盤上作答。', '');
    drawLearn([]);
  }
  function drawLearn(marks) {
    if (!L || !L.board) return;
    var dec = App().boardDecor(L.game);
    L.board.render({
      game: L.game, flipped: false, selected: L.sel, targets: L.quiz ? App().targetsOf(L.game, L.sel) : [],
      lastMove: dec.lastMove, hopPath: dec.hopPath, railPath: dec.railPath, winLine: dec.winLine, captured: dec.captured,
      forbidden: null, hintMove: -1, marks: marks || L.marks || null,
    });
    L.marks = marks || null;
  }
  function onLearnSquare(sq) {
    if (!L || !L.quiz || !L.unit.quiz || L.solved || L.busy) return;
    var moved = false;
    L.sel = App().tryMove(L.game, L.sel, sq, function (mv) { moved = true; onQuizMove(mv); });
    if (!moved) drawLearn(null);
  }
  function onQuizMove(mv) {
    var q = L.unit.quiz;
    var E = eng(L.g);
    var str = lower(E.moveToStr(mv));
    var acc = (Array.isArray(q.accept) ? q.accept : [q.accept]).map(lower);
    var side = L.game.turn();
    var before = L.game.clone();
    L.game.play(mv);
    L.sel = -1;
    var res = L.game.result();
    var ok = acc.indexOf(str) >= 0 || !!(res && res.winner === side);
    drawLearn(null);
    if (ok) {
      L.solved = true;
      msg('🎉 ' + (q.doneText || '答對了！'), 'ok');
      completeLesson(true);
      var next = document.querySelector('[data-sa="lnnext"]');
      if (next) next.disabled = false;
      return;
    }
    msg('❌ ' + moveText(L.g, before, mv) + ' 不對喔。' + (q.wrongHint || '再想想看！'), 'bad');
    L.busy = true;
    var tk = L.token;
    L.timer = setTimeout(function () {
      L.timer = 0;
      if (!L || L.token !== tk) return;
      L.game.undo();
      L.busy = false;
      drawLearn(null);
    }, 700);
  }
  function completeLesson(quiz) {
    var prog = loadLearnProg();
    var id = L.unit.id;
    var first = !prog.done[id];
    if (first) prog.done[id] = Date.now();
    if (quiz && !prog.quiz[id]) prog.quiz[id] = Date.now();
    App().save(KEY_LEARN, prog);
    if (first) {
      App().campusAct();
      App().toast('📘 完成課程：' + L.unit.title);
    }
  }

  // ------------------------------------------------------------------ 事件
  function bindRoot(host) {
    var root = host.querySelector('.study-root');

          if (s.val() !== true) return;
          // 先寫入再登記斷線動作：大廳規則只允許房主刪除「已經存在」的項目。
          ref.set(onVal()).then(function () {
            var od = ref.onDisconnect();
            return offVal === null ? od.remove() : od.set(offVal);
          }).catch(function () {});
        });
        return function () {
          conn.off('value', h);
          ref.onDisconnect().cancel();
          return (offVal === null ? ref.remove() : ref.set(offVal)).catch(function () {});
        };
      },
    };
  }

  // ------------------------------------------------------------------ 狀態
  var S = {
    token: 0, backendP: null, backend: null, uid: '', host: null, gameKind: 'gomoku',
    rid: '', g: null, game: null, role: null, board: null, sel: -1, busy: false,
    pres: {}, stops: [], timer: 0, presStop: null, lobbyStop: null, lobbyEntry: null, lobbyKey: '',
    flagN: -1, warned: false, lobby: {}, filter: '', tracked: false, unfinished: [], cancelling: false,
  };

  function myName() {
    var p = App().load(KEY_NAME, null);
    if (!p || typeof p !== 'object') p = {};
    if (!p.name) {
      p.name = '棋友' + (100 + ((Math.random() * 900) | 0));
      App().save(KEY_NAME, p);
    }
    return Core.cleanName(p.name);
  }
  function saveName(name) { App().save(KEY_NAME, { name: Core.cleanName(name) }); }

  function errText(err) {
    var code = String((err && (err.code || err.message)) || err || '');
    if (code.toUpperCase().indexOf('PERMISSION_DENIED') >= 0 || /permission/i.test(code)) {
      return '資料庫拒絕存取（PERMISSION_DENIED）：請站長於 Firebase Console 更新包含 bg 節點之 database.rules.json。';
    }
    if (/auth/i.test(code) && /disabled|not-allowed|operation/i.test(code)) return '匿名登入尚未啟用，請站長於 Firebase Console 開啟匿名登入。';
    return code || '連線失敗，請稍後再試';
  }
  function ensureBackend() {
    if (!S.backendP) {
      if (!window.BG_ONLINE_BACKEND && !window.BG_FIREBASE) return Promise.reject(new Error('尚未設定線上對弈後端'));
      var b = window.BG_ONLINE_BACKEND || firebaseBackend(window.BG_FIREBASE);
      S.backendP = b.init().then(function (uid) {
        S.backend = b;
        S.uid = uid;
        return b;
      });
      S.backendP.catch(function () { S.backendP = null; });
    }
    return S.backendP;
  }
  function stop() {
    S.token++;
    S.stops.forEach(function (f) { try { f(); } catch (_) {} });
    S.stops = [];
    if (S.timer) { clearInterval(S.timer); S.timer = 0; }
    if (S.presStop) { try { S.presStop(); } catch (_) {} S.presStop = null; }
    if (S.lobbyStop) { try { S.lobbyStop(); } catch (_) {} S.lobbyStop = null; }
    if (S.board) { try { S.board.destroy(); } catch (_) {} S.board = null; }
    S.lobbyKey = '';
    S.rid = '';
    S.g = null;
    S.game = null;
    S.role = null;
    S.busy = false;
    S.sel = -1;
    S.pres = {};
    S.flagN = -1;
    S.warned = false;
    S.tracked = false;
    S.unfinished = [];
    S.draftCode = '';
  }
  function body() { return S.host ? S.host.querySelector('#onBody') : null; }
  function message(html) {
    var b = body();
    if (b) b.innerHTML = '<div class="card">' + html + '</div>';
  }

  // ------------------------------------------------------------------ 掛載
  function mount(host, gameKind, roomParam) {
    unmount();
    S.host = host;
    S.gameKind = normG(gameKind);
    if (!S.filter) S.filter = S.gameKind;
    host.innerHTML = '<div class="online-root"><div id="onBody"><div class="card"><p class="muted">正在連線線上對弈…</p></div></div></div>';
    var root = host.querySelector('.online-root');
    root.addEventListener('click', onClick);
    var rid = roomParam ? Core.normalizeId(roomParam) : '';
    var token = S.token;
    ensureBackend().then(function () {
      if (token !== S.token) return;
      if (rid) enterRoom(rid);
      else showLobby();
    }, function (err) {
      if (token !== S.token) return;
      message('<h2>🌐 無法連線</h2><p class="notice err" style="margin-top:8px">' + esc(errText(err)) + '</p>' +
        '<p class="muted" style="margin-top:8px">其他功能（AI 對弈、題庫、課程）都可以離線使用。</p>' +
        '<div class="btn-row" style="margin-top:8px"><button type="button" class="btn sm" data-oa="retry">🔄 重試</button></div>');
    });
  }
  function unmount() {
    stop();
    S.host = null;
  }

  // ------------------------------------------------------------------ 大廳
  function showLobby() {
    var g = S.gameKind;
    var def = g === 'gomoku' ? 'gomoku|standard' : g + '|standard';
    var html = '<div class="page-head"><h1>🌐 線上對弈</h1><span class="muted">免註冊！建立房間後，把 6 碼房號或邀請連結分享給朋友即可開下。</span></div>' +
      '<div class="grid-cards"><div class="card accent"><div class="card-head"><h2>🆕 建立房間</h2></div><div class="form-grid">' +
      '<label class="field">暱稱<input type="text" id="onName" maxlength="16" value="' + esc(myName()) + '"></label>' +
      '<label class="field">棋類<select id="onKind">' + KINDS.map(function (k) {
        return '<option value="' + k.k + '"' + (k.k === def ? ' selected' : '') + '>' + esc(k.label) + '</option>';
      }).join('') + '</select></label>' +
      '<div class="form-row"><label class="field">執子<select id="onSide"><option value="first">先手</option><option value="second">後手</option><option value="random">🎲 隨機</option></select></label>' +
      '<label class="field">計時<select id="onTc">' + (Core.TIME_CONTROLS || [{ base: 0, inc: 0, label: '不計時' }]).map(function (t, i) {
        return '<option value="' + i + '">' + esc(t.label) + '</option>';
      }).join('') + '</select></label></div>' +
      '<label class="check"><input type="checkbox" id="onPub" checked> 公開到大廳，讓其他棋友加入</label>' +
      '<div class="btn-row"><button type="button" class="btn primary" data-oa="create">建立房間</button></div></div></div>' +
      '<div class="card"><div class="card-head"><h2>🔑 輸入房號</h2></div><div class="form-row">' +
      '<label class="field">6 碼房號<input type="text" id="onCode" maxlength="8" placeholder="例如 AB12CD" autocapitalize="characters"></label>' +
      '<button type="button" class="btn primary" data-oa="join" style="flex:0 0 auto">加入</button></div>' +
      '<div id="onPending" style="margin-top:10px"></div></div>' +
      '<div class="card" style="grid-column:1/-1"><div class="card-head"><h2>🏠 公開房間</h2><div class="seg">' +
      [['all', '全部']].concat(GAMES.map(function (x) { return [x, meta(x).icon + ' ' + meta(x).name]; })).map(function (x) {
        return '<button type="button" data-oa="filter" data-v="' + x[0] + '" class="' + (S.filter === x[0] ? 'active' : '') + '">' + esc(x[1]) + '</button>';
      }).join('') + '</div></div><div class="lobby-list" id="onLobby"><p class="muted">讀取中…</p></div></div></div>';
    var b = body();
    if (!b) return;
    b.innerHTML = html;
    var token = S.token;
    S.stops.push(S.backend.watch(ROOT + '/lobby', function (val, err) {
      if (token !== S.token) return;
      if (err) {
        var el = document.getElementById('onLobby');
        if (el) el.innerHTML = '<p class="notice err">' + esc(errText(err)) + '</p>';
        return;
      }
      S.lobby = val || {};
      renderLobbyList();
    }));
    checkPending();
  }
  function tcLabel(tc) {
    if (!tc || !tc.base) return '不計時';
    var hit = (Core.TIME_CONTROLS || []).filter(function (t) { return t.base === tc.base && t.inc === tc.inc; })[0];
    return hit ? hit.label : Math.round(tc.base / 60) + ' 分＋' + (tc.inc || 0) + ' 秒';
  }
  function kindLabel(g, rule) {
    var hit = KINDS.filter(function (k) { return k.g === normG(g) && k.rule === (rule || 'standard'); })[0];
    return hit ? hit.label : meta(normG(g)).icon + ' ' + meta(normG(g)).name;
  }
  function renderLobbyList() {
    var el = document.getElementById('onLobby');
    if (!el) return;
    var now = S.backend.now();
    var rows = Object.keys(S.lobby).map(function (rid) { return { rid: rid, e: S.lobby[rid] }; }).filter(function (x) {
      var e = x.e;
      if (!e || typeof e !== 'object' || Core.normalizeId(x.rid) !== x.rid) return false;
      if (typeof e.created === 'number' && now - e.created > LOBBY_MAX_AGE) return false;
      return S.filter === 'all' || normG(e.gameKind) === S.filter;
    }).sort(function (a, b) {
      var wa = a.e.status === 'waiting' ? 0 : 1, wb = b.e.status === 'waiting' ? 0 : 1;
      return wa - wb || (b.e.created || 0) - (a.e.created || 0);
    });
    el.innerHTML = rows.map(function (x) {
      var e = x.e;
      var waiting = e.status === 'waiting';
      var who = waiting
        ? Core.cleanName(e.first || e.second) + ' 等待對手（缺' + (e.first ? '後手' : '先手') + '）'
        : Core.cleanName(e.first) + ' vs ' + Core.cleanName(e.second);
      return '<div class="lobby-row"><div class="lr-main"><b>' + esc(kindLabel(e.gameKind, e.rule)) + '</b>・<span class="muted">' + esc(tcLabel(e.tc)) + '</span><br>' + esc(who) + '</div>' +
        '<span class="pill' + (waiting ? ' ok' : '') + '">' + (waiting ? '等待中' : '對局中') + '</span>' +
        '<button type="button" class="btn sm' + (waiting ? ' primary' : '') + '" data-oa="enter" data-rid="' + esc(x.rid) + '" data-g="' + esc(normG(e.gameKind)) + '">' + (waiting ? '加入' : '觀戰') + '</button></div>';
    }).join('') || '<p class="muted">目前沒有公開房間，建立一間邀請朋友吧！</p>';
  }

  /** 大廳補記：之前入座、但沒看到結局就離開的房間，結果補記進戰績。 */
  function checkPending() {
    var token = S.token;
    S.unfinished = [];
    GAMES.forEach(function (gid) {
      var st = App().loadStats(gid);
      var rids = [];
      try { rids = Stats.pendingList(st, Date.now()) || []; } catch (_) { rids = []; }
      rids.forEach(function (rid) {
        var stopFn = null;
        var done = false;
        stopFn = S.backend.watch(gPath(rid), function (val) {
          if (done || token !== S.token) return;
          done = true;
          setTimeout(function () { if (stopFn) stopFn(); }, 0);
          var role = val ? Core.sideOfUid(val, S.uid) : null;
          if (val && role && val.status === 'over') {
            if (recordFinished(rid, val, role)) App().toast('已補記房間 ' + rid + ' 的對局結果');
          } else if (val && role && val.status === 'playing') {
            var opp = val[other(role)];
            S.unfinished.push({ rid: rid, g: normG(val.gameKind), name: opp ? opp.name : '' });
            renderPending();
          } else {
            var cur = App().loadStats(gid);
            if (Stats.dropPending(cur, rid)) App().saveStats(gid, cur);
          }
        });
        S.stops.push(stopFn);
      });
    });
  }
  function renderPending() {
    var el = document.getElementById('onPending');
    if (!el) return;
    el.innerHTML = S.unfinished.length ? '<div class="notice warn"><b>⏳ 未完成的對局</b>' + S.unfinished.map(function (u) {
      return '<div class="btn-row" style="margin-top:4px"><span>' + esc(meta(u.g).icon) + ' 房號 ' + esc(u.rid) + (u.name ? '（對手 ' + esc(u.name) + '）' : '') + '</span>' +
        '<button type="button" class="btn sm" data-oa="enter" data-rid="' + esc(u.rid) + '" data-g="' + esc(u.g) + '">回到房間</button></div>';
    }).join('') + '</div>' : '';
  }

  function createRoom(opts) {
    var rid = Core.randomId();
    var g = Core.createRoom({
      uid: S.uid, name: myName(), gameKind: opts.gameKind, rule: opts.rule, side: opts.side,
      tc: opts.tc, pub: opts.pub, deploy: normG(opts.gameKind) === 'luzhanqi', ts: S.backend.ts(),
    });
    return S.backend.set(gPath(rid), g).then(function () { return rid; });
  }

  // ------------------------------------------------------------------ 房間
  function enterRoom(rid) {
    S.rid = rid;
    message('<p class="muted">正在進入房間 ' + esc(rid) + '…</p>');
    var token = S.token;
    S.stops.push(S.backend.watch(gPath(rid), function (val, err) {
      if (token !== S.token) return;
      if (err) {
        message('<h2>無法進入房間</h2><p class="notice err" style="margin-top:8px">' + esc(errText(err)) + '</p><p style="margin-top:8px"><a class="link-btn" href="' + lobbyHash() + '">← 回大廳</a></p>');
        return;
      }
      if (!val) {
        if (S.g) App().toast('房間已經關閉');
        S.g = null;
        message('<h2>找不到房間 ' + esc(rid) + '</h2><p class="muted">房號可能打錯了，或房間已經關閉。</p><p style="margin-top:8px"><a class="link-btn" href="' + lobbyHash() + '">← 回大廳</a></p>');
        return;
      }
      onRoom(val);
    }));
    S.stops.push(S.backend.watch(pPath(rid), function (val) {
      if (token !== S.token) return;
      S.pres = val || {};
      refreshRoom();
    }));
    S.timer = setInterval(tick, 250);
  }
  function lobbyHash() { return App().hashFor('online', '', S.gameKind); }

  function startPresence() {
    if (S.presStop) S.presStop();
    var role = S.role;
    var name = role === 'watch' ? myName() : (S.g[role] && S.g[role].name) || myName();
    var ts = S.backend.ts();
    S.presStop = S.backend.presence(
      pPath(S.rid) + '/' + S.uid,
      function () { return { name: name, role: role, on: true }; },
      role === 'watch' ? null : { name: name, role: role, on: false, off: ts }
    );
  }
  function syncLobby() {
    var g = S.g;
    if (!g || !g.pub || g.host !== S.uid) return;
    if (g.status === 'over') {
      if (S.lobbyStop) { S.lobbyStop(); S.lobbyStop = null; }
      return;
    }
    var entry = {
      host: S.uid, gameKind: g.gameKind, rule: g.rule || 'standard',
      first: g.first ? g.first.name : '', second: g.second ? g.second.name : '',
      tc: g.tc || { base: 0, inc: 0 }, status: g.status, created: typeof g.created === 'number' ? g.created : S.backend.ts(),
    };
    var key = entry.status + '|' + entry.first + '|' + entry.second;
    S.lobbyEntry = entry;
    if (!S.lobbyStop) S.lobbyStop = S.backend.presence(lobbyPath(S.rid), function () { return S.lobbyEntry; }, null);
    else if (key !== S.lobbyKey) S.backend.set(lobbyPath(S.rid), entry).catch(function () {});
    S.lobbyKey = key;
  }

  function resultLine(g) {
    var r = g.result;
    if (!r) return '對局進行中';
    var gm = S.game;
    var why = WHY[r.why] || r.why || '';
    if (r.w === 'draw') return '和局' + (why ? '（' + why + '）' : '');
    var winner = sideLabel(g.gameKind, r.w);
    if (gm && gm.result() && ['resign', 'timeout', 'flag', 'abandon'].indexOf(r.why) < 0) {
      try { return window.BGNotation.resultText(normG(g.gameKind), gm.result()); } catch (_) {}
    }
    return winner + '勝' + (why ? '（' + (r.why === 'resign' || r.why === 'timeout' || r.why === 'flag' || r.why === 'abandon' ? '對手' : '') + why + '）' : '');
  }

  /** 對局結束：存進「我的棋譜」並記進線上戰績。同一個房間只記一次（回傳是否有記）。 */
  function recordFinished(rid, g, role) {
    var gid = normG(g.gameKind);
    var st = App().loadStats(gid);
    if (Array.isArray(st.rids) && st.rids.indexOf(rid) >= 0) return false;
    var opp = g[other(role)];
    var r = Stats.resultFor(g.result, role);
    var gm = Core.gameOf(g);
    if (!opp || !r || !gm || !gm.plyCount()) {
      if (Stats.dropPending(st, rid)) App().saveStats(gid, st);
      return false;
    }
    try {
      if (g.result.why === 'resign' && g.result.w !== 'draw') gm.resign(sideNum(other(g.result.w)));
      else if (g.result.w === 'draw' && !gm.result()) gm.agreeDraw();
    } catch (_) {}
    var m = meta(gid);
    var title = '線上：' + (g.first ? g.first.name : '?') + '（' + m.side1 + '） vs ' + (g.second ? g.second.name : '?') + '（' + m.side2 + '）';
    var at = g.clock && g.clock.at > 1e12 ? g.clock.at : Date.now();
    App().upsertSavedGame('on-' + rid, title, gid, gm, at);
    Stats.recordOnline(st, { rid: rid, uid: opp.uid, name: opp.name, r: r, side: role, why: g.result.why, n: g.n, at: at });
    Stats.dropPending(st, rid);
    App().saveStats(gid, st);
    return true;
  }
  function trackRoom(val) {
    if (S.tracked || val.status !== 'playing') return;
    S.tracked = true;
    var gid = normG(val.gameKind);
    var st = App().loadStats(gid);
    if (Stats.addPending(st, S.rid, Date.now())) App().saveStats(gid, st);
  }

  function onRoom(val) {
    var kind = normG(val.gameKind);
    if (kind !== S.gameKind || (App().getGame() !== kind)) {
      // 房間的棋類與目前不同：切換網址中的 ?g= 後重新進入。
      App().navigate(App().hashFor('online', S.rid, kind));
      return;
    }
    var game = Core.gameOf(val);
    if (!game) {
      if (!S.warned) App().toast('收到不合規則的對局資料，已忽略');
      S.warned = true;
      return;
    }
    var prev = S.g;
    S.g = val;
    S.game = game;
    var role = Core.sideOfUid(val, S.uid) || 'watch';
    var player = role !== 'watch';
    if (!prev || role !== S.role) {
      var first = !prev;
      S.role = role;
      buildRoom();
      startPresence();
      if (first && !player && val.status === 'waiting') {
        // 打開邀請連結 = 入座。
        S.backend.tx(gPath(S.rid), function (cur) {
          var r = Core.join(cur, { uid: S.uid, name: myName(), ts: S.backend.ts() });
          return r == null ? undefined : r;
        }).then(function (r) {
          if (!r.committed) App().toast('位子已經有人了，改為觀戰');
        }, function (err) { App().toast('入座失敗：' + errText(err)); });
      } else if (!first && player) {
        App().toast('已入座，你執' + sideLabel(kind, role) + (role === 'first' ? '（先走）' : '（後走）'));
      }
      if (first && player && val.status === 'over') recordFinished(S.rid, val, role);
    }
    if (player) trackRoom(val);
    if (prev) {
      if (val.n !== prev.n) S.sel = -1;
      if (prev.status === 'waiting' && val.status === 'playing' && prev.host === S.uid) App().toast('對手已加入，對局開始！');
      if (player && val.status === 'playing') {
        var mine = prev.offer && prev.offer.by === role;
        if (mine && !val.offer && val.n === prev.n && !S.cancelling) App().toast('對方拒絕了你的' + (prev.offer.kind === 'undo' ? '悔棋' : '和棋') + '請求');
        else if (prev.offer && prev.offer.kind === 'undo' && val.n < prev.n) App().toast('悔棋成立');
        else if (val.offer && val.offer.by !== role && !prev.offer) App().toast('對方請求' + (val.offer.kind === 'undo' ? '悔棋' : '和棋'));
      }
      S.cancelling = false;
      if (prev.status !== 'over' && val.status === 'over') {
        App().toast(resultLine(val));
        if (player) {
          recordFinished(S.rid, val, role);
          App().campusAct();
        }
      }
    }
    syncLobby();
    refreshRoom();
  }

  function buildRoom() {
    var g = S.g;
    var kind = normG(g.gameKind);
    var m = meta(kind);
    var b = body();
    if (!b) return;
    if (S.board) { try { S.board.destroy(); } catch (_) {} S.board = null; }
    b.innerHTML = '<div class="page-head"><h1>🌐 ' + esc(kindLabel(kind, g.rule)) + '</h1>' +
      '<span class="room-code" title="房號">' + esc(S.rid) + '</span>' +
      '<span class="btn-row"><button type="button" class="btn sm" data-oa="copycode">📋 複製房號</button><button type="button" class="btn sm" data-oa="copylink">🔗 複製邀請連結</button>' +
      '<a class="btn sm ghost" href="' + lobbyHash() + '">← 大廳</a></span></div>' +
      '<div class="stage"><div class="board-col"><div id="onTop" style="width:100%"></div><div class="board-wrap" id="onBoard"></div><div id="onBottom" style="width:100%"></div></div>' +
      '<div class="side-col"><div class="card status-card" id="onStatus"></div><div class="card" id="onActions"></div>' +
      '<div class="card"><div class="card-head"><h2>📝 棋譜</h2><span class="muted small">' + esc(tcLabel(g.tc)) + '・' + esc(m.name) + '</span></div><ol class="move-list" id="onMoves"></ol></div></div></div>';
    S.board = window.BGBoard.create(document.getElementById('onBoard'), { gameKind: kind, onSquare: onSquare });
  }
  function presenceOf(side) {
    var hit = null;
    Object.keys(S.pres || {}).forEach(function (uid) {
      var p = S.pres[uid];
      if (p && p.role === side && (!S.g[side] || S.g[side].uid === uid)) hit = { online: !!p.on, off: p.off || 0 };
    });
    return hit;
  }
  function fmtClock(ms) {
    if (Core.formatClock) { try { return Core.formatClock(ms); } catch (_) {} }
    var s = Math.max(0, Math.ceil(ms / 1000));
    var mm = Math.floor(s / 60), ss = s % 60;
    return mm + ':' + (ss < 10 ? '0' : '') + ss;
  }
  function playerCardHtml(side) {
    var g = S.g;
    var kind = normG(g.gameKind);
    var p = g[side];
    var turn = g.status === 'playing' && Core.turnOf(g) === side;
    var pr = presenceOf(side);
    var timed = g.tc && g.tc.base > 0;
    var me = S.role === side;
    return '<div class="player-card' + (turn ? ' turn' : '') + '">' + window.BGBoard.pieceBadgeHtml(kind, sideNum(side), 26) +
      '<div class="pn">' + (p ? esc(p.name) + (me ? '（你）' : '') : '<span class="muted">等待加入…</span>') +
      '<small>' + esc(sideLabel(kind, side)) + (side === 'first' ? '・先手' : '・後手') + '</small></div>' +
      (p ? '<span class="dot' + (pr && pr.online ? ' on' : '') + '" title="' + (pr && pr.online ? '在線' : '離線') + '"></span>' : '') +
      (timed ? '<span class="clock" id="onClock_' + side + '">--:--</span>' : '') + '</div>';
  }
  function refreshRoom() {
    var g = S.g;
    if (!g || !S.board || !S.game) return;
    var kind = normG(g.gameKind);
    var role = S.role;
    var player = role !== 'watch';
    var bottom = role === 'second' ? 'second' : 'first';
    var top = other(bottom);
    var topEl = document.getElementById('onTop'), botEl = document.getElementById('onBottom');
    if (topEl) topEl.innerHTML = playerCardHtml(top);
    if (botEl) botEl.innerHTML = playerCardHtml(bottom);
    var dec = App().boardDecor(S.game);
    var deploying = Core.isDeploying ? Core.isDeploying(g) : false;
    var myReady = role === 'first' ? !!g.ready1 : role === 'second' ? !!g.ready2 : false;
    var canEditDeploy = kind === 'luzhanqi' && player && g.deployPhase && !myReady && g.n === 0 && g.status !== 'over';
    var mySideNum = role === 'second' ? 2 : 1;
    var displayGame = S.game;
    if (canEditDeploy) {
      var LZ = eng('luzhanqi');
      if (!S.draftCode || !LZ.isValidFormationCode(S.draftCode)) {
        S.draftCode = (role === 'second' ? g.fmt2 : g.fmt1) || LZ.FORMATIONS[0].code;
      }
      displayGame = S.game.clone();
      displayGame.setFormation(mySideNum, S.draftCode);
    }
    var myTurn = player && g.status === 'playing' && !deploying && Core.turnOf(g) === role;
    var forb = null;
    if (kind === 'gomoku' && myTurn && S.game.isRenju && S.game.turn() === 1 && typeof S.game.forbiddenSquares === 'function') {
      try { forb = S.game.forbiddenSquares(); } catch (_) {}
    }
    var targets = [];
    if (canEditDeploy && S.sel >= 0) targets = displayGame.swapSetupTargets(mySideNum, S.sel);
    else if (myTurn) targets = App().targetsOf(S.game, S.sel);
    var viewerSide = g.status === 'over' ? 'both' : (role === 'first' ? 1 : role === 'second' ? 2 : 0);
    S.board.render({
      game: displayGame, flipped: role === 'second' && kind !== 'gomoku', selected: S.sel, targets: targets,
      swapMode: canEditDeploy, viewerSide: viewerSide,
      lastMove: dec.lastMove, hopPath: dec.hopPath, railPath: dec.railPath, winLine: dec.winLine, captured: dec.captured,
      forbidden: forb, hintMove: -1, marks: null,
    });
    // 狀態
    var st = document.getElementById('onStatus');
    if (st) {
      var html;
      if (g.status === 'waiting') {
        html = '<div class="card-head"><h2>⏳ 等待對手</h2></div><p>把房號 <b class="room-code" style="font-size:18px">' + esc(S.rid) + '</b> 或邀請連結傳給朋友，對方打開就會自動入座。</p>' +
          (canEditDeploy ? '<p class="muted small" style="margin-top:6px">等待期間可先在下方排好你的暗棋陣型！</p>' : '');
      } else if (deploying) {
        var oppReady = role === 'first' ? !!g.ready2 : !!g.ready1;
        html = '<div class="card-head"><h2>🎖️ 戰前佈陣階段</h2><span class="pill warn">' + (myReady ? '等待對手佈陣' : '請部署陣型') + '</span></div>' +
          '<p class="small">' + (myReady ? '✅ 你已鎖定陣型，對手' + (oppReady ? '也已完成！' : '正在佈陣中…') : '對手看不到你的棋面。點選己方兩枚棋子可互換位置，排好後按下方「完成佈陣・準備開戰」。') + '</p>';
      } else if (g.status === 'playing') {
        var t = Core.turnOf(g);
        html = '<div class="card-head"><h2>' + (player ? '♟️ 對局中' : '👀 觀戰中') + '</h2><span class="pill">第 ' + ((g.n || 0) + 1) + ' 手</span></div>' +
          '<div class="turn-line">' + window.BGBoard.pieceBadgeHtml(kind, sideNum(t), 24) + '<span>輪到 ' + esc(sideLabel(kind, t)) + (myTurn ? '（你）' : '') + '</span></div>';
      } else {
        var rr = player ? Stats.resultFor(g.result, role) : null;
        html = '<div class="card-head"><h2>🏁 對局結束</h2></div><div class="result-banner">' + esc(resultLine(g)) +
          (rr === 'w' ? '｜你贏了 🎉' : rr === 'l' ? '｜這盤輸了' : rr === 'd' ? '｜和局' : '') + '</div>';
      }
      st.innerHTML = html + '<div id="onAway"></div>';
    }
    // 操作
    var act = document.getElementById('onActions');
    if (act) {
      var a = '<div class="card-head"><h2>🎛️ 操作</h2></div>';
      if (canEditDeploy) {
        var LZ2 = eng('luzhanqi');
        a += '<div class="btn-row">' + LZ2.FORMATIONS.map(function (f) {
          return '<button type="button" class="btn sm" data-oa="lzfmt" data-code="' + f.code + '">' + esc(f.name) + '</button>';
        }).join('') + '<button type="button" class="btn sm" data-oa="lzrand">🎲 隨機佈陣</button></div>' +
          '<p class="muted small" style="margin-top:6px">規則：軍旗須放大本營、地雷限後兩排、炸彈禁放第一排。點兩枚己子即可對調。</p>' +
          '<div class="btn-row" style="margin-top:8px"><button type="button" class="btn primary" data-oa="lzready">⚔️ 完成佈陣・準備開戰</button></div>';
      } else if (player && deploying && myReady) {
        a += '<p class="notice ok">✅ 陣型已就緒，待對手確認後立即開戰。</p>';
      } else if (player && g.status === 'playing') {
        if (g.offer) {
          var kindTxt = g.offer.kind === 'undo' ? '悔棋' : '和棋';
          a += g.offer.by === role
            ? '<div class="offer-box">已送出' + kindTxt + '請求，等待對方回應…</div><div class="btn-row" style="margin-top:6px"><button type="button" class="btn sm" data-oa="cancel">取消請求</button></div>'
            : '<div class="offer-box">對方請求' + kindTxt + '</div><div class="btn-row" style="margin-top:6px"><button type="button" class="btn sm green" data-oa="answer" data-v="1">同意</button><button type="button" class="btn sm" data-oa="answer" data-v="0">拒絕</button></div>';
        }
        a += '<div class="btn-row" style="margin-top:8px"><button type="button" class="btn sm" data-oa="offer" data-v="undo"' + (g.offer || !g.n ? ' disabled' : '') + '>↩️ 請求悔棋</button>' +
          '<button type="button" class="btn sm" data-oa="offer" data-v="draw"' + (g.offer ? ' disabled' : '') + '>🤝 求和</button>' +
          '<button type="button" class="btn sm" data-oa="resign">🏳️ 認輸</button></div>';
      } else if (player && g.status === 'over') {
        a += '<div class="btn-row"><button type="button" class="btn sm primary" data-oa="again">🔁 再來一局（交換先後）</button>' +
          (g.next ? '<button type="button" class="btn sm green" data-oa="enter" data-rid="' + esc(g.next) + '" data-g="' + esc(kind) + '">➡️ 前往新房間</button>' : '') +
          '<a class="btn sm" href="' + App().hashFor('replay', 'on-' + S.rid, kind) + '">📜 查看棋譜</a></div>';
      } else if (player && g.status === 'waiting') {
        a += '<p class="muted">對手加入後就能開始。可以先複製邀請連結分享。</p>';
      } else {
        a += '<p class="muted">你正在觀戰，棋盤會即時同步。</p>' + (g.next ? '<div class="btn-row" style="margin-top:6px"><button type="button" class="btn sm" data-oa="enter" data-rid="' + esc(g.next) + '" data-g="' + esc(kind) + '">➡️ 觀看下一局</button></div>' : '');
      }
      act.innerHTML = a;
    }
    var ol = document.getElementById('onMoves');
    if (ol) {
      var texts = App().moveTexts(kind, S.game.startSetup, S.game.moveStrings());
      ol.innerHTML = texts.map(function (t, i) { return '<li' + (i === texts.length - 1 ? ' class="cur"' : '') + '>' + esc(t) + '</li>'; }).join('') || '<li class="muted">尚未走子</li>';
    }
    tick();
  }

  function tick() {
    var g = S.g;
    if (!g || !S.backend) return;
    var now = S.backend.now();
    var player = S.role && S.role !== 'watch';
    if (g.tc && g.tc.base > 0) {
      ['first', 'second'].forEach(function (side) {
        var el = document.getElementById('onClock_' + side);
        if (!el) return;
        var ms = Core.remaining(g, side, now);
        if (ms == null) { el.textContent = '--:--'; return; }
        el.textContent = fmtClock(ms);
        var running = g.status === 'playing' && Core.turnOf(g) === side;
        el.className = 'clock' + (running ? (ms < 20000 ? ' low' : ' run') : '');
      });
      var turn = Core.turnOf(g);
      if (player && g.status === 'playing' && S.flagN !== g.n) {
        var left = Core.remaining(g, turn, now);
        if (left != null && left <= 0) {
          S.flagN = g.n;
          roomTx(function (cur) { return Core.claimTimeout(cur, { uid: S.uid, now: S.backend.now() }); });
        }
      }
    }
    var away = document.getElementById('onAway');
    if (away) {
      var html = '';
      if (player && g.status === 'playing') {
        var p = presenceOf(other(S.role));
        if (p && !p.online && p.off) {
          var gone = now - p.off;
          html = gone >= abandonMs()
            ? '<div class="offer-box" style="margin-top:8px">對手離線已久，可以宣告獲勝。<div class="btn-row" style="margin-top:6px"><button type="button" class="btn sm primary" data-oa="claim">🏆 宣告獲勝</button></div></div>'
            : '<div class="offer-box" style="margin-top:8px">對手離線中，' + Math.ceil((abandonMs() - gone) / 1000) + ' 秒後可以宣告獲勝。</div>';
        }
      }
      if (away.getAttribute('data-h') !== html) { away.innerHTML = html; away.setAttribute('data-h', html); }
    }
  }

  function roomTx(fn, failMsg) {
    if (!S.backend || !S.rid) return Promise.resolve(null);
    return S.backend.tx(gPath(S.rid), function (cur) {
      var r = fn(cur);
      return r == null ? undefined : r;
    }).then(function (r) {
      if (r && !r.committed && failMsg) App().toast(failMsg);
      return r;
    }, function (err) {
      App().toast(errText(err));
      return null;
    });
  }

  function onSquare(sq) {
    var g = S.g;
    if (!g || S.busy || !S.role || S.role === 'watch') return;
    var kind = normG(g.gameKind);
    var myReady = S.role === 'first' ? !!g.ready1 : !!g.ready2;
    if (kind === 'luzhanqi' && g.deployPhase && !myReady && g.n === 0 && g.status !== 'over') {
      var LZ = eng('luzhanqi');
      var mySideNum = S.role === 'second' ? 2 : 1;
      var tmp = S.game.clone();
      if (S.draftCode && LZ.isValidFormationCode(S.draftCode)) tmp.setFormation(mySideNum, S.draftCode);
      if (S.sel >= 0 && S.sel !== sq && tmp.canSwapSetup(mySideNum, S.sel, sq)) {
        tmp.swapSetup(mySideNum, S.sel, sq);
        S.draftCode = tmp.formationOf(mySideNum);
        S.sel = -1;
      } else if (S.sel === sq) {
        S.sel = -1;
      } else if (tmp.board[sq] === mySideNum) {
        S.sel = sq;
      } else {
        S.sel = -1;
      }
      refreshRoom();
      return;
    }
    var deploying = Core.isDeploying ? Core.isDeploying(g) : false;
    if (g.status !== 'playing' || deploying || Core.turnOf(g) !== S.role) return;
    var moved = false;
    S.sel = App().tryMove(S.game, S.sel, sq, function (mv) { moved = true; sendMove(mv); });
    if (!moved) refreshRoom();
  }
  function sendMove(mv) {
    var kind = normG(S.g.gameKind);
    var str = eng(kind).moveToStr(mv);
    S.busy = true;
    S.sel = -1;
    // 先在本機畫出來，伺服器確認後會以最新狀態覆蓋。
    var preview = S.game.clone();
    if (preview.play(mv)) {
      var keep = S.game;
      S.game = preview;
      refreshRoom();
      S.game = keep;
    }
    roomTx(function (cur) {
      return Core.move(cur, { uid: S.uid, move: str, now: S.backend.now(), ts: S.backend.ts() });
    }, '這步沒有送出（可能已經不是你的回合）').then(function () {
      S.busy = false;
      refreshRoom();
    });
  }

  // ------------------------------------------------------------------ 事件
  function onClick(ev) {
    var el = ev.target.closest ? ev.target.closest('[data-oa]') : null;
    if (!el || el.disabled) return;
    var act = el.getAttribute('data-oa');
    var uid = S.uid;
    if (act === 'retry') { App().navigate(location.hash); return; }
    if (act === 'filter') {
      S.filter = el.getAttribute('data-v') || 'all';
      var seg = el.parentNode;
      Array.prototype.forEach.call(seg.children, function (b) { b.classList.toggle('active', b === el); });
      renderLobbyList();
      return;
    }
    if (act === 'create') {
      var nm = document.getElementById('onName').value;
      if (Core.cleanName(nm)) saveName(nm);
      var kind = KINDS.filter(function (k) { return k.k === document.getElementById('onKind').value; })[0] || KINDS[0];
      var side = document.getElementById('onSide').value;
      if (side === 'random') side = Math.random() < 0.5 ? 'first' : 'second';
      var tc = (Core.TIME_CONTROLS || [])[+document.getElementById('onTc').value] || { base: 0, inc: 0 };
      var pub = document.getElementById('onPub').checked;
      el.disabled = true;
      createRoom({ gameKind: kind.g, rule: kind.rule, side: side, tc: { base: tc.base, inc: tc.inc }, pub: pub }).then(function (rid) {
        App().navigate(App().hashFor('online', rid, kind.g));
      }, function (err) {
        el.disabled = false;
        App().toast('建立失敗：' + errText(err));
      });
      return;
    }
    if (act === 'join') {
      var nm2 = document.getElementById('onName');
      if (nm2 && Core.cleanName(nm2.value)) saveName(nm2.value);
      var rid = Core.normalizeId(document.getElementById('onCode').value);
      if (!rid) { App().toast('請輸入正確的 6 碼房號'); return; }
      App().navigate(App().hashFor('online', rid, S.gameKind));
      return;
    }
    if (act === 'enter') {
      App().navigate(App().hashFor('online', el.getAttribute('data-rid'), el.getAttribute('data-g') || S.gameKind));
      return;
    }
    if (!S.g) return;
    var origin = location.protocol === 'file:' ? '' : location.origin;
    if (act === 'copycode') { App().copyText(S.rid, '已複製房號 ' + S.rid); return; }
    if (act === 'copylink') {
      var link = origin + location.pathname + App().hashFor('online', S.rid, normG(S.g.gameKind));
      App().copyText(link, '已複製邀請連結');
      return;
    }
    if (act === 'lzfmt') {
      S.draftCode = el.getAttribute('data-code') || '';
      S.sel = -1;
      refreshRoom();
      return;
    }
    if (act === 'lzrand') {
      S.draftCode = eng('luzhanqi').randomFormationCode();
      S.sel = -1;
      refreshRoom();
      return;
    }
    if (act === 'lzready') {
      var LZ3 = eng('luzhanqi');
      var code = (S.draftCode && LZ3.isValidFormationCode(S.draftCode))
        ? S.draftCode
        : ((S.role === 'second' ? S.g.fmt2 : S.g.fmt1) || LZ3.FORMATIONS[0].code);
      S.sel = -1;
      roomTx(function (cur) {
        return Core.setFormation(cur, { uid: uid, code: code, ready: true, ts: S.backend.ts() });
      }, '佈陣送出失敗，請重試');
      return;
    }
    if (act === 'offer') {
      roomTx(function (cur) { return Core.offer(cur, { uid: uid, kind: el.getAttribute('data-v') }); }, '現在不能送出請求');
    } else if (act === 'cancel') {
      S.cancelling = true;
      roomTx(function (cur) {
        if (Core.cancelOffer) return Core.cancelOffer(cur, { uid: uid });
        if (!cur.offer || cur.offer.by !== Core.sideOfUid(cur, uid)) return undefined;
        var c = JSON.parse(JSON.stringify(cur));
        c.offer = null;
        return c;
      });
    } else if (act === 'answer') {
      roomTx(function (cur) { return Core.answer(cur, { uid: uid, ok: el.getAttribute('data-v') === '1', ts: S.backend.ts() }); });
    } else if (act === 'resign') {
      if (!window.confirm('確定要認輸嗎？')) return;
      roomTx(function (cur) { return Core.resign(cur, { uid: uid }); });
    } else if (act === 'claim') {
      var p = presenceOf(other(S.role));
      if (!p || p.online || !p.off) { App().toast('對手已經回來了'); return; }
      roomTx(function (cur) { return Core.claimAbandon(cur, { uid: uid, oppSeenAt: p.off, now: S.backend.now() }); }, '還不能宣告獲勝');
    } else if (act === 'again') {
      var g = S.g;
      var oldRid = S.rid;
      el.disabled = true;
      createRoom({ gameKind: normG(g.gameKind), rule: g.rule || 'standard', side: other(S.role), tc: g.tc || { base: 0, inc: 0 }, pub: false }).then(function (newRid) {
        var setNext = Core.setNext
          ? S.backend.tx(gPath(oldRid), function (cur) { var r = Core.setNext(cur, { uid: uid, rid: newRid }); return r == null ? undefined : r; }).catch(function () {})
          : Promise.resolve();
        return setNext.then(function () { App().navigate(App().hashFor('online', newRid, normG(g.gameKind))); });
      }, function (err) {
        el.disabled = false;
        App().toast('建立失敗：' + errText(err));
      });
    }
  }

  window.BGOnline = { mount: mount, unmount: unmount, _errText: errText };
})();


// === js/app.js ===
// ============================================================================
// 🎲 經典棋藝學院 — 頁面路由與互動（對弈、段位、棋譜、走法、回饋）
// 純前端：對局、棋譜與戰績都存在瀏覽器 localStorage（key 一律 bg. 前綴）。
// 路由：#/play、#/online、#/puzzle、#/learn、#/rank、#/replay、#/rules、#/feedback，
//       棋類以 ?g=gomoku|checkers|watermelon 同步（例：#/play?g=checkers）。
// ============================================================================

(function () {
  'use strict';
  var EN = window.BGEngines;
  var NT = window.BGNotation;
  var Stats = window.BGStats;
  var Rank = window.BGRank;
  var Ai = window.BGAi;
  var main = document.getElementById('appMain');

  var KEY_PREFS = 'bg.prefs.v1';
  var KEY_PLAY = 'bg.play.v1';
  var KEY_GAMES = 'bg.games.v1';
  var MAX_SAVED = 60;
  var GAMES = ['gomoku', 'checkers', 'watermelon', 'luzhanqi'];
  var VIEWS = ['play', 'online', 'puzzle', 'learn', 'rank', 'replay', 'rules', 'feedback'];
  var META_FALLBACK = {
    gomoku: { id: 'gomoku', short: 'gm', name: '五子棋', icon: '⚫', side1: '黑方', side2: '白方', rankWord: '段位', matchWord: '段位賽' },
    checkers: { id: 'checkers', short: 'cc', name: '跳棋', icon: '🌟', side1: '紅方', side2: '藍方', rankWord: '等級', matchWord: '等級賽' },
    watermelon: { id: 'watermelon', short: 'wm', name: '西瓜棋', icon: '🍉', side1: '青瓜方', side2: '紅瓤方', rankWord: '等級', matchWord: '等級賽' },
    luzhanqi: { id: 'luzhanqi', short: 'lz', name: '陸軍棋', icon: '🎖️', side1: '紅軍', side2: '藍軍', rankWord: '等級', matchWord: '等級賽' },
  };

  // ------------------------------------------------------------------ 工具
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function load(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (_) { return fallback; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (_) {}
  }
  function normId(g) {
    if (EN && typeof EN.normalizeId === 'function') return EN.normalizeId(g);
    if (g === 'cc' || g === 'checkers') return 'checkers';
    if (g === 'wm' || g === 'watermelon') return 'watermelon';
    if (g === 'lz' || g === 'luzhanqi') return 'luzhanqi';
    return 'gomoku';
  }
  function isGameId(g) { return GAMES.indexOf(g) >= 0 || g === 'gm' || g === 'cc' || g === 'wm' || g === 'lz'; }
  function meta(g) { return (EN && EN.META && EN.META[g]) || META_FALLBACK[g]; }
  function eng(g) { return EN.get(g); }
  function rankOf(g) { return Rank.forGame(g); }
  function nowStr(at) {
    var d = at ? new Date(at) : new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function sideName(g, side) {

  // ------------------------------------------------------------------ 路由狀態

  // ------------------------------------------------------------------ 對弈：狀態

  function randomAiFormationCode() {

  function setupFor(g, cfg, mode, human) {

  /** 段位賽離場保護：已下滿 FORFEIT_PLIES 手時離開要確認，確認後判認輸。回傳是否可以離開。 */

  // ------------------------------------------------------------------ 對弈：畫面
  function renderPlay() {

  function effFlip() {

  function refreshPlay() {

    var deploy = isLzDeploy(P);
    var veiled = lzNeedsCurtain(P, game);
    var humanTurn = !res && !deploy && !veiled && !isAiTurn(P, game);
    var forb = null;
    if (g === 'gomoku' && game.isRenju && !res && game.turn() === 1 && humanTurn && typeof game.forbiddenSquares === 'function') {
      try { forb = game.forbiddenSquares(); } catch (_) { forb = null; }
    }
    var targets = [];
    if (deploy && !veiled && S.sel >= 0) targets = game.swapSetupTargets(lzDeploySide(P), S.sel);
    else if (humanTurn) targets = targetsOf(game, S.sel);
    S.board.render({
      game: game, flipped: effFlip(), selected: veiled ? -1 : S.sel, targets: targets,
      swapMode: deploy, viewerSide: lzViewerSide(P, game),
      lastMove: dec.lastMove, hopPath: dec.hopPath, railPath: dec.railPath, winLine: dec.winLine, captured: dec.captured,

    });
    var cEl = document.getElementById('playCurtain');
    if (cEl) {

        var actText = P.phase === 'curtain_deploy2' ? '👁️ 我是' + nextLabel + '・開始佈陣' : '👁️ 輪到' + nextLabel + '・揭開己方棋面';
        cEl.innerHTML = '<div class="curtain-banner"><span>🙈 暗棋交棒遮罩中：請將螢幕交給「' + esc(nextLabel) + '」</span>' +
          '<button type="button" class="btn sm primary" data-pa="lzreveal">' + esc(actText) + '</button></div>';

    if (tip) {
      tip.textContent = g === 'gomoku' ? '點交叉點落子；先在橫、直、斜任一方向連成五子者獲勝。'
        : g === 'checkers' ? '先點自己的彈珠，再點亮起的目標孔；可一步走鄰孔，或連續跳過棋子。'
          : g === 'luzhanqi' ? (veiled
            ? '暗棋交棒遮罩中：請將螢幕交給下一位指揮官，點上方按鈕揭開己方棋面。'
            : deploy
              ? '戰前佈陣：點選己方兩枚棋子即可對調位置（軍旗須放大本營、地雷限後兩排、炸彈禁放第一排），排好後按右側「完成佈陣・開戰」。'
              : '先點己方棋子再點目標格；工兵可在鐵路上轉彎飛車並挖除地雷，司令陣亡會亮出該方軍旗位置。')
            : '先點自己的棋子，再點相鄰空點；把對方棋子圍到沒有空點（無氣）即可提走。';
    }
    var side = document.getElementById('playSide');
    if (side) side.innerHTML = statusCardHtml(P, game, res, humanTurn) + setupCardHtml(P, game) + movesCardHtml(P, game);
  }

  function modeLabel(P) {
    var m = meta(S.game);
    return P.mode === 'rated' ? '🏅 ' + m.matchWord : P.mode === 'local' ? '👥 同機對弈' : '☕ 自由練習';
  }

        '<button type="button" class="btn sm ghost" data-pa="flip">🔄 翻轉</button></div>';
      return html + '</div>';
    }
    if (veiled) {
      html += '<p class="muted small" style="margin-top:8px">為防止同機對弈誤看對手底牌，棋面已暫時蓋牌；請由接手方點棋盤上方按鈕揭開。</p>' +
        '<div class="btn-row" style="margin-top:8px"><button type="button" class="btn sm" data-pa="new">🆕 新局</button></div>';

      '<button type="button" class="btn sm" data-pa="hint"' + (canHint ? '' : ' disabled') + '>💡 提示</button>' +
      '<button type="button" class="btn sm" data-pa="resign"' + (res || game.plyCount() === 0 ? ' disabled' : '') + '>🏳️ 認輸</button>' +
      '<button type="button" class="btn sm ghost" data-pa="flip">🔄 翻轉</button></div>';
    if (rated) {
      var R = rankOf(g);
      var st = loadStats(g);
      html += '<p class="muted small" style="margin-top:8px">' + esc(meta(g).matchWord) + '：採標準暗棋規則，不能悔棋與提示；下滿 ' + forfeitPlies(g) + ' 手後離開視同認輸。目前 ' +
        esc(titleNameOf(R, st.rank)) + '（' + st.rank.r + ' 分）。</p>';
    }
    return html + '</div>';
  }
  function verdictText(P, res) {
    if (P.mode === 'local') return '';
    var r = resForHuman(P, res);
    var t = r === 'w' ? '｜你贏了 🎉' : r === 'l' ? '｜這盤輸了，再接再厲' : r === 'd' ? '｜和局' : '';
    if (P.mode === 'rated' && typeof P.delta === 'number') t += '（棋力分 ' + (P.delta >= 0 ? '+' : '') + P.delta + '）';
    return esc(t);
  }

  function setupCardHtml(P, game) {
    var g = S.game;
    var p = prefs();
    var cfg = p.setup[g];
    var m = meta(g);
    var html = '<div class="card"><div class="card-head"><h2>⚙️ 對局設定</h2><span class="muted small">設定會在下一局套用</span></div>';
    html += '<div class="seg">' + [['rated', '🏅 ' + m.matchWord], ['free', '☕ 自由練習'], ['local', '👥 同機對弈']].map(function (x) {

    }).join('') + '</div>';

      var st = loadStats(g);
      var R = rankOf(g);
      var lvs = [];

      html += '<h3>🤖 AI 對手（10 階）</h3><div class="lv-list">' + lvs.map(function (L) {

          (rec.w + rec.l + rec.d ? '<span class="rec">' + rec.w + ' 勝 ' + rec.l + ' 負 ' + rec.d + ' 和</span>' : '') + '</button>';
      }).join('') + '</div>';
      if (!multi) {
        html += '<h3>🎯 執子</h3><div class="seg">' + [['first', '先手（' + m.side1 + '）'], ['second', '後手（' + m.side2 + '）'], ['random', '🎲 隨機']].map(function (x) {
          return '<button type="button" data-pa="side" data-v="' + x[0] + '" class="' + (cfg.side === x[0] ? 'active' : '') + '">' + esc(x[1]) + '</button>';
        }).join('') + '</div>';
      }

    if (g === 'gomoku' && cfg.mode !== 'rated') {
      html += '<p style="margin-top:9px"><label class="check"><input type="checkbox" data-pa="renju"' + (cfg.renju ? ' checked' : '') + '> 黑方禁手（三三、四四、長連禁手）</label></p>';
    }
    if (g === 'luzhanqi' && cfg.mode !== 'rated') {
      html += '<p style="margin-top:9px"><label class="check"><input type="checkbox" data-pa="blast"' + (cfg.blast ? ' checked' : '') + '> 爆雷規則（任何棋子撞地雷皆同歸於盡；預設為鐵雷留存）</label></p>';
      html += '<p style="margin-top:6px"><label class="check"><input type="checkbox" data-pa="openplay"' + (cfg.openPlay ? ' checked' : '') + '> 雙明棋模式（公開雙方棋面；同機對弈免交棒遮罩）</label></p>';
    }
    if (g === 'checkers' && cfg.mode !== 'rated') {
      html += '<h3>👥 人數</h3><div class="seg">' + [['2p', '2人'], ['3p', '3人'], ['4p', '4人'], ['6p', '6人']].map(function (x) {
        return '<button type="button" data-pa="players" data-v="' + x[0] + '" class="' + (cfg.players === x[0] ? 'active' : '') + '">' + x[1] + '</button>';
      }).join('') + '</div>';
      if (multi && cfg.mode === 'free') {
        var n = playerCount(cfg.players);
        html += '<div class="seat-grid" style="margin-top:8px">';
        for (var s = 1; s <= n; s++) {
          var v = cfg.seats[s] === 'h' || cfg.seats[s] === 'ai' ? cfg.seats[s] : (s === 1 ? 'h' : 'ai');
          html += '<div class="seat">' + badge(g, s, 20) + '<span>' + esc(sideName(g, s)) + '</span><select data-pa="seat" data-side="' + s + '">' +
            '<option value="h"' + (v === 'h' ? ' selected' : '') + '>玩家</option><option value="ai"' + (v === 'ai' ? ' selected' : '') + '>AI</option></select></div>';
        }

    html += '<div class="btn-row" style="margin-top:10px"><button type="button" class="btn primary" data-pa="new">▶️ 以此設定開新局</button>' +
      '<a class="btn" href="' + hashFor('rank', '', g) + '">🏅 我的' + esc(m.rankWord) + '</a></div>';

  function movesCardHtml(P, game) {
    var reveal = !!(P && P.openPlay) || !!game.result();
    var texts = moveTexts(S.game, P.setup, game.moveStrings(), { reveal: reveal });
    var list = texts.length
      ? '<ol class="move-list">' + texts.map(function (t, i) { return '<li' + (i === texts.length - 1 ? ' class="cur"' : '') + '>' + esc(t) + '</li>'; }).join('') + '</ol>'
      : '<p class="muted">還沒有走子。</p>';
    return '<div class="card"><div class="card-head"><h2>📝 棋譜</h2><span class="btn-row"><button type="button" class="link-btn" data-pa="copy"' + (texts.length ? '' : ' disabled') + '>複製</button>' +
      '<a class="link-btn" href="' + hashFor('replay', '', S.game) + '">我的棋譜</a></span></div>' + list + '</div>';
  }

  function isFresh(P, game) {
    var n = game.plyCount();
    if (n === 0 || game.result()) return true;
    return n === 1 && P.mode !== 'local' && !P.seats && P.human === 2;
  }
  function onSetting(kind, val, side) {
    var p = prefs();
    var cfg = p.setup[S.game];
    if (kind === 'mode') cfg.mode = val;
    else if (kind === 'lv') cfg.lv = Math.max(1, Math.min(10, +val || 1));
    else if (kind === 'side') cfg.side = val;
    else if (kind === 'renju') cfg.renju = !!val;
    else if (kind === 'blast') cfg.blast = !!val;
    else if (kind === 'openplay') cfg.openPlay = !!val;
    else if (kind === 'players') cfg.players = val;
    else if (kind === 'seat') cfg.seats[side] = val;
    savePrefs(p);
    if (isFresh(S.play, S.pgame) && !(S.play.mode === 'rated' && !S.pgame.result() && S.pgame.plyCount() >= forfeitPlies(S.game))) startNew(true);
    else refreshPlay();
  }
  function startNew(quiet) {
    if (S.play && S.play.mode === 'rated' && !S.play.over && !S.pgame.result() && S.pgame.plyCount() > 0 && !leaveRated()) return;
    if (S.aiTimer) { clearTimeout(S.aiTimer); S.aiTimer = 0; }
    S.play = newPlayState(S.game);
    S.pgame = new (eng(S.game).Game)(S.play.setup);
    S.sel = -1;
    S.hint = -1;
    savePlay();
    refreshPlay();
    if (!quiet) toast('新局開始：' + modeLabel(S.play));
    maybeAi();
  }
  function onPlaySquare(sq) {
    var P = S.play, game = S.pgame;
    if (!game || game.result() || S.aiTimer || lzNeedsCurtain(P, game)) return;
    if (isLzDeploy(P)) {
      var dSide = lzDeploySide(P);
      if (S.sel >= 0 && S.sel !== sq && game.canSwapSetup(dSide, S.sel, sq)) {
        game.swapSetup(dSide, S.sel, sq);
        P.setup = game.startSetup;
        S.sel = -1;
        savePlay();
      } else if (S.sel === sq) {
        S.sel = -1;
      } else if (game.board[sq] === dSide) {
        S.sel = sq;
      } else {
        S.sel = -1;
      }
      refreshPlay();
      return;
    }
    if (isAiTurn(P, game)) return;
    var prev = S.sel;
    var moved = false;
    S.sel = tryMove(game, S.sel, sq, function (mv) { moved = true; playMove(mv); });
    if (!moved && (S.sel !== prev || S.sel < 0)) refreshPlay();
  }
  function playMove(mv) {
    var P = S.play, game = S.pgame;
    if (!game.play(mv)) return;
    S.sel = -1;
    S.hint = -1;
    if (S.game === 'luzhanqi' && P && P.mode === 'local' && !P.openPlay && !game.result()) {
      P.curtainOpen = false;
    }
    savePlay();
    if (game.result()) finishGame();
    refreshPlay();
    maybeAi();
  }
  function maybeAi() {
    if (S.aiTimer || !S.play || !S.pgame || !isAiTurn(S.play, S.pgame)) return;
    var token = S.pgame;
    S.aiTimer = setTimeout(function () {
      S.aiTimer = 0;
      if (S.view !== 'play' || S.pgame !== token || !isAiTurn(S.play, S.pgame)) return;
      var mv = -1;
      try { mv = Ai.chooseMove(S.pgame, S.play.lv, Math.random); } catch (err) { if (window.console) console.error(err); }
      if (mv >= 0) playMove(mv);
      else refreshPlay();
    }, 280);
  }
  function onPlayAction(act, el) {
    var P = S.play, game = S.pgame;
    if (act === 'new') { startNew(false); return; }
    if (act === 'mode' || act === 'lv' || act === 'side' || act === 'players') { onSetting(act, el.getAttribute('data-v')); return; }
    if (act === 'lzfmt' && isLzDeploy(P)) {
      var code = el.getAttribute('data-code') || '';
      var ds = lzDeploySide(P);
      if (ds === 2) code = eng('luzhanqi').mirrorHorizontalCode(code);
      if (game.setFormation(ds, code)) {
        P.setup = game.startSetup;
        S.sel = -1;
        savePlay();
        refreshPlay();
      }
      return;
    }
    if (act === 'lzrand' && isLzDeploy(P)) {
      var rCode = eng('luzhanqi').randomFormationCode();
      if (game.setFormation(lzDeploySide(P), rCode)) {
        P.setup = game.startSetup;
        S.sel = -1;
        savePlay();
        refreshPlay();
      }
      return;
    }
    if (act === 'lzstart' && isLzDeploy(P)) {
      S.sel = -1;
      if (P.mode === 'local' && P.phase === 'deploy1') {
        P.phase = P.openPlay ? 'deploy2' : 'curtain_deploy2';
      } else {
        P.phase = 'play';
        P.curtainOpen = P.mode !== 'local' || !!P.openPlay;
      }
      P.setup = game.startSetup;
      savePlay();
      refreshPlay();
      if (P.phase === 'play') {
        toast('⚔️ 佈陣完成，戰鬥開始！');
        maybeAi();
      }
      return;
    }
    if (act === 'lzreveal' && P) {
      if (P.phase === 'curtain_deploy2') P.phase = 'deploy2';
      else P.curtainOpen = true;
      S.sel = -1;
      savePlay();
      refreshPlay();
      return;
    }
    if (act === 'flip') {
      var p = prefs();
      p.flip[S.game] = !p.flip[S.game];
      S.flip = p.flip[S.game];
      savePrefs(p);
      refreshPlay();
      return;
    }
    if (act === 'copy') { copyText(game.moveStrings().join(' '), '已複製棋譜'); return; }
    if (act === 'undo') {
      if (P.mode === 'rated' || game.result() || !game.plyCount()) return;
      if (S.aiTimer) { clearTimeout(S.aiTimer); S.aiTimer = 0; }
      if (P.mode === 'local') {
        game.undo();
        if (S.game === 'luzhanqi' && !P.openPlay) P.curtainOpen = false;
      } else {
        do { game.undo(); } while (game.plyCount() > 0 && isAiTurn(P, game));
      }
      S.sel = -1;
      S.hint = -1;
      savePlay();
      refreshPlay();
      maybeAi();
      return;
    }
    if (act === 'hint') {
      if (P.mode === 'rated' || game.result()) return;
      var mv = -1;
      try { mv = Ai.hintMove(game); } catch (_) {}
      if (mv < 0) { toast('目前沒有可走的棋'); return; }
      S.hint = mv;
      var t;
      try { t = NT.moveText(S.game, game, mv); } catch (_) { t = eng(S.game).moveToStr(mv); }
      toast('💡 建議：' + t);
      refreshPlay();
      return;
    }
    if (act === 'resign') {
      if (game.result() || !game.plyCount()) return;
      var m = meta(S.game);
      if (!window.confirm(P.mode === 'rated' ? '確定要認輸嗎？這盤會計入' + m.rankWord + '。' : '確定要認輸嗎？')) return;
      if (S.aiTimer) { clearTimeout(S.aiTimer); S.aiTimer = 0; }
      var hs = humanSides(P, game);
      var who = P.mode === 'local' ? game.turn() : (hs.indexOf(game.turn()) >= 0 ? game.turn() : hs[0] || P.human);
      try { game.resign(who); } catch (_) {}
      finishGame();
      refreshPlay();
    }
  }

  // ------------------------------------------------------------------ 段位／等級
  function renderRank() {
    var g = S.game;
    var R = rankOf(g);
    var st = loadStats(g);
    var rk = st.rank;
    var m = meta(g);
    var top = rk.n && rk.top >= 0 ? rk.top : -1;
    var prov = rk.n && isProvisional(R, rk);
    var html = '<div class="page-head"><h1>' + esc(m.icon + ' ' + m.name + m.rankWord) + '</h1><span class="muted">與 AI 下' + esc(m.matchWord) + '累積棋力分（Elo），晉升' + esc(m.rankWord) + '並同步到開心學園稱號。</span></div>';
    html += '<div class="grid-cards">';
    html += '<div class="card accent game"><div class="rank-hero"><div>' + '<div class="muted">目前' + esc(m.rankWord) + '</div><div class="rank-big">' + esc(titleNameOf(R, rk)) + '</div>' +
      (prov ? '<span class="pill warn">定級中（' + rk.n + '／' + (R.PROV_GAMES || 5) + ' 局）</span>' : rk.n ? '<span class="pill ok">已定級</span>' : '<span class="pill">尚未下過' + esc(m.matchWord) + '</span>') +
      '</div><div><div class="muted">棋力分</div><div class="rating-num">' + rk.r + '</div><div class="muted small">最高 ' + (rk.peak || rk.r) + '・共 ' + rk.n + ' 局</div></div></div>';

  function replayGoto(ply) {

    for (var i = 0; i < ply; i++) { if (!game.play(rp.mvs[i])) break; }
    var dec = boardDecor(game);
    S.board.render({ game: game, flipped: false, viewerSide: 'both', selected: -1, targets: [], lastMove: dec.lastMove, hopPath: dec.hopPath, railPath: dec.railPath, winLine: dec.winLine, captured: dec.captured });
