  <title>📺 串流與影集學院 Streaming &amp; Series Academy — 開心學園無雷選片與分季導讀館</title>
  <style>
/* 📺 串流與影集學院 (Streaming & Series Academy) — 清爽串流雜誌風 Light Theme */
:root {
  --bg: #f6f9fc;
  --bg-soft: #eef4fa;
  --card: #ffffff;
  --ink: #0f172a;
  --ink-muted: #475569;
  --ink-light: #64748b;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --accent: #0284c7;
  --accent-dark: #0369a1;
  --accent-soft: #e0f2fe;
  --gold: #b45309;
  --gold-soft: #fef3c7;
  --green: #047857;
  --green-soft: #ecfdf5;
  --red: #be123c;
  --red-soft: #fff1f2;
  --violet: #6d28d9;
  --violet-soft: #f5f3ff;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow-sm: 0 1px 4px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 8px 22px rgba(15, 23, 42, 0.09);
  --shadow-lg: 0 20px 48px rgba(15, 23, 42, 0.22);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
button, input, select, textarea { font-family: inherit; font-size: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }

/* Header */
.ser-header {
  position: sticky;
  top: 0;
  z-index: 90;
  background: rgba(246, 249, 252, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.ser-header-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 9px 18px 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.ser-brand-wrap { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; min-width: 0; }
.ser-brand { font-size: 19px; font-weight: 900; color: var(--ink); white-space: nowrap; }
.ser-sub-pill {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-dark);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.ser-ver-btn {
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--ink-muted);
  border-radius: 999px;
  padding: 1px 9px;
  font-size: 11.5px;
  font-weight: 700;
}
.ser-ver-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
.ser-header-right { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.ser-stat-chip {
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 999px;
  padding: 4px 11px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-muted);
  white-space: nowrap;
}
.ser-stat-chip b { color: var(--accent-dark); margin-left: 2px; }
.ser-stat-chip:hover { border-color: var(--accent); }
.ser-dl-btn { display: none; font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1px dashed var(--border-strong); color: var(--ink-muted); }
.ser-dl-btn.show { display: inline-block; }

.ser-nav-bar {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 14px;
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
}
.ser-nav-bar::-webkit-scrollbar { display: none; }
.ser-tab {
  border: 0;
  background: transparent;
  padding: 8px 12px 9px;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-muted);
  border-bottom: 3px solid transparent;
  white-space: nowrap;
}
.ser-tab:hover { color: var(--ink); }
.ser-tab.active { color: var(--accent-dark); border-bottom-color: var(--accent); }
.ser-tab-badge {
  display: inline-block;
  min-width: 20px;
  padding: 0 6px;
  margin-left: 3px;
  border-radius: 999px;
  background: var(--bg-soft);
  color: var(--ink-muted);
  font-size: 11.5px;
  text-align: center;
}
.ser-tab.active .ser-tab-badge { background: var(--accent-soft); color: var(--accent-dark); }

.ser-main { max-width: 1240px; margin: 0 auto; padding: 18px 18px 64px; }

/* Common blocks */
.ser-sec-hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 26px 0 12px; }
.ser-sec-hd:first-child { margin-top: 0; }
.ser-sec-hd h2 { font-size: 19px; font-weight: 900; }
.ser-sec-sub { font-size: 13px; color: var(--ink-light); margin-top: 2px; }
.ser-link-btn { border: 0; background: transparent; color: var(--accent-dark); font-weight: 800; font-size: 13.5px; padding: 2px 0; white-space: nowrap; }
.ser-link-btn:hover { text-decoration: underline; }
.ser-panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); }
.ser-note { font-size: 12.5px; color: var(--ink-light); }
.ser-empty { text-align: center; padding: 44px 16px; color: var(--ink-light); background: var(--card); border: 1px dashed var(--border-strong); border-radius: var(--radius); }
.ser-empty b { display: block; font-size: 16px; color: var(--ink-muted); margin-bottom: 4px; }

.ser-btn {
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--ink);
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 800;
}
.ser-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
.ser-btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.ser-btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
.ser-btn-done { background: var(--green-soft); border-color: #6ee7b7; color: var(--green); }
.ser-btn-sm { padding: 5px 11px; font-size: 13px; }

.ser-input, .ser-select {
  width: 100%;
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  padding: 8px 11px;
  background: #fff;
  color: var(--ink);
  font-size: 14px;
}
.ser-input:focus, .ser-select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
textarea.ser-input { resize: vertical; }

.ser-chip {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--bg-soft);
  color: var(--ink-muted);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.ser-chip.genre { background: var(--accent-soft); color: var(--accent-dark); }
.ser-chip.ok { background: var(--green-soft); color: var(--green); }
.ser-chip.warn { background: var(--gold-soft); color: var(--gold); }
.ser-chip.bad { background: var(--red-soft); color: var(--red); }
.ser-chip.live { background: var(--violet-soft); color: var(--violet); }

/* Filter pills */
.ser-filter { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow-sm); }
.ser-filter-row { display: flex; gap: 6px; align-items: flex-start; padding: 4px 0; }
.ser-filter-lbl { flex: 0 0 62px; font-size: 12.5px; font-weight: 800; color: var(--ink-light); padding-top: 4px; }
.ser-pills { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.ser-pill {
  border: 1px solid var(--border);
  background: #fff;
  color: var(--ink-muted);
  border-radius: 999px;
  padding: 3px 11px;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}
.ser-pill:hover { border-color: var(--accent); color: var(--accent-dark); }
.ser-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.ser-pill.is-zero { opacity: 0.42; }
.ser-search-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.ser-search-row .ser-input { flex: 1 1 240px; }
.ser-search-row .ser-select { flex: 0 0 170px; width: auto; }
.ser-result-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 14px 0 10px; font-size: 13.5px; color: var(--ink-muted); flex-wrap: wrap; }

/* Cards */
.ser-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(288px, 1fr)); gap: 14px; }
.ser-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  transition: box-shadow 0.15s, transform 0.15s;
}
.ser-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.ser-card.is-done { border-color: #a7f3d0; }
.ser-poster { position: relative; cursor: pointer; aspect-ratio: 360 / 150; background: #0f172a; }
.ser-poster svg { display: block; width: 100%; height: 100%; }
.ser-poster-badges { position: absolute; left: 8px; top: 8px; display: flex; gap: 5px; flex-wrap: wrap; }
.ser-badge {
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 800;
  background: rgba(255, 255, 255, 0.93);
  color: var(--ink);
  white-space: nowrap;
}
.ser-badge.score { background: #fef3c7; color: #92400e; }
.ser-badge-mine { position: absolute; right: 8px; bottom: 8px; padding: 1px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 800; color: #fff; background: rgba(2, 132, 199, 0.95); }
.ser-badge-mine.done { background: rgba(4, 120, 87, 0.95); }
.ser-badge-mine.watching { background: rgba(109, 40, 217, 0.95); }
.ser-card-body { padding: 11px 13px 12px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
.ser-card-title { font-size: 16.5px; font-weight: 900; line-height: 1.3; cursor: pointer; }
.ser-card-title:hover { color: var(--accent-dark); }
.ser-card-orig { font-size: 12.5px; color: var(--ink-light); }
.ser-card-meta { display: flex; flex-wrap: wrap; gap: 5px; }
.ser-card-tagline { font-size: 13.5px; font-weight: 700; color: var(--accent-dark); }
.ser-card-syn { font-size: 13px; color: var(--ink-muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ser-card-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.ser-mini-bars { display: flex; align-items: flex-end; gap: 3px; height: 30px; }
.ser-mini-bar { flex: 1 1 0; max-width: 26px; border-radius: 3px 3px 0 0; background: var(--accent); min-height: 3px; }
.ser-mini-bar.low { background: #f59e0b; }
.ser-mini-bar.bad { background: #e11d48; }
.ser-mini-cap { font-size: 11.5px; color: var(--ink-light); display: flex; justify-content: space-between; gap: 8px; }
.ser-card-actions { display: flex; gap: 6px; }
.ser-act-btn {
  flex: 1 1 0;
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--ink-muted);
  border-radius: 9px;
  padding: 6px 4px;
  font-size: 12.5px;
  font-weight: 800;
  white-space: nowrap;
}
.ser-act-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
.ser-act-btn.on { background: var(--accent-soft); border-color: #7dd3fc; color: var(--accent-dark); }
.ser-act-btn.done { background: var(--green-soft); border-color: #6ee7b7; color: var(--green); }
.ser-act-btn.detail { flex: 0 0 62px; }
.ser-more-bar { text-align: center; margin-top: 18px; }

/* Hero / home */
.ser-hero {
  border-radius: 18px;
  padding: 24px 24px 20px;
  color: #fff;
  background: linear-gradient(135deg, #0c4a6e 0%, #0284c7 55%, #38bdf8 100%);
  box-shadow: var(--shadow-md);
}
.ser-hero h1 { font-size: 26px; font-weight: 900; line-height: 1.3; }
.ser-hero p { margin-top: 6px; font-size: 14.5px; opacity: 0.94; max-width: 760px; }
.ser-hero-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.ser-hero-stat { background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 12px; padding: 7px 14px; min-width: 96px; }
.ser-hero-stat b { display: block; font-size: 21px; font-weight: 900; line-height: 1.2; }
.ser-hero-stat span { font-size: 12px; opacity: 0.92; }
.ser-hero-cta { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 16px; }
.ser-hero-cta .ser-btn { border-color: rgba(255, 255, 255, 0.6); background: rgba(255, 255, 255, 0.14); color: #fff; }
.ser-hero-cta .ser-btn:hover { background: rgba(255, 255, 255, 0.26); color: #fff; }
.ser-hero-cta .ser-btn-primary { background: #fff; color: var(--accent-dark); border-color: #fff; }
.ser-hero-cta .ser-btn-primary:hover { background: #f0f9ff; color: var(--accent-dark); }

.ser-picker { margin-top: 16px; }
.ser-picker-result { margin-top: 14px; }
.ser-region-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.ser-region-tile { text-align: left; border: 1px solid var(--border); background: var(--card); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow-sm); }
.ser-region-tile:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
.ser-region-tile b { display: block; font-size: 15.5px; font-weight: 900; color: var(--ink); }
.ser-region-tile span { display: block; font-size: 12.5px; color: var(--ink-light); margin-top: 2px; }
.ser-region-tile em { font-style: normal; font-size: 12.5px; font-weight: 800; color: var(--accent-dark); }

/* Radar */
.ser-subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.ser-radar-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; }
.ser-radar-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow-sm); cursor: pointer; }
.ser-radar-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
.ser-radar-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.ser-radar-hd b { font-size: 15.5px; font-weight: 900; }
.ser-radar-hd span { font-size: 12px; color: var(--ink-light); white-space: nowrap; }
.ser-bars { display: flex; align-items: flex-end; gap: 5px; height: 84px; margin: 10px 0 2px; padding-top: 16px; }
.ser-bar-col { flex: 1 1 0; max-width: 46px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
.ser-bar-val { font-size: 11px; font-weight: 800; color: var(--ink-muted); line-height: 1.2; }
.ser-bar { width: 100%; border-radius: 4px 4px 0 0; background: var(--accent); min-height: 4px; }
.ser-bar.low { background: #f59e0b; }
.ser-bar.bad { background: #e11d48; }
.ser-bar.best { background: #047857; }
.ser-bar-lbls { display: flex; gap: 5px; }
.ser-bar-lbls span { flex: 1 1 0; max-width: 46px; text-align: center; font-size: 10.5px; color: var(--ink-light); white-space: nowrap; overflow: hidden; }
.ser-radar-foot { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; align-items: center; }
.ser-radar-txt { font-size: 12.5px; color: var(--ink-muted); margin-top: 6px; }

.ser-verdict-sec { margin-bottom: 14px; }
.ser-verdict-hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.ser-verdict-hd b { font-size: 16px; font-weight: 900; }
.ser-verdict-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }

.ser-verdict-item:hover { border-color: var(--accent); }
.ser-verdict-item b { display: block; font-size: 14px; font-weight: 800; color: var(--ink); }
.ser-verdict-item span { display: block; font-size: 12.5px; color: var(--ink-muted); }

/* Platforms */

.ser-plat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow-sm); border-top: 4px solid var(--accent); }

.ser-plat-hd b { font-size: 17px; font-weight: 900; }
.ser-plat-desc { font-size: 12.5px; color: var(--ink-light); margin: 2px 0 8px; }
.ser-plat-nets { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.ser-plat-top { list-style: none; margin: 0 0 10px; padding: 0; }

.ser-plat-top li:hover { color: var(--accent-dark); }
.ser-plat-top li span { color: var(--ink-light); font-size: 12.5px; white-space: nowrap; }

/* My list */

.ser-stat-box span { font-size: 12.5px; color: var(--ink-light); }
.ser-pass-list { display: flex; flex-direction: column; gap: 10px; }

.ser-pass-title { font-size: 16px; font-weight: 900; cursor: pointer; }
.ser-pass-title:hover { color: var(--accent-dark); }
.ser-pass-meta { font-size: 12.5px; color: var(--ink-light); }
.ser-progress { height: 8px; border-radius: 999px; background: var(--bg-soft); overflow: hidden; margin: 9px 0; }

.ser-quiz-opt.right { background: var(--green-soft); border-color: #34d399; color: var(--green); font-weight: 800; }
.ser-quiz-opt.wrong { background: var(--red-soft); border-color: #fda4af; color: var(--red); }
.ser-quiz-exp { font-size: 13px; color: var(--ink-muted); background: var(--bg-soft); border-radius: 9px; padding: 7px 10px; margin-top: 4px; }

/* Modal */
.ser-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(15, 23, 42, 0.55);
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 26px 14px;
  overflow-y: auto;
}
.ser-modal-backdrop.open { display: flex; }
.ser-modal { position: relative; width: 100%; max-width: 880px; background: var(--bg); border-radius: 18px; box-shadow: var(--shadow-lg); overflow: hidden; }
.ser-modal-close {
  position: absolute;
  right: 12px;
  top: 12px;
  z-index: 2;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 0;
  background: rgba(15, 23, 42, 0.55);
  color: #fff;
  font-size: 15px;
  font-weight: 900;

.ser-modal-hero { padding: 20px 22px 16px; color: #fff; }
.ser-modal-hero h2 { font-size: 25px; font-weight: 900; line-height: 1.25; padding-right: 40px; }
.ser-modal-orig { font-size: 13.5px; opacity: 0.92; margin-top: 2px; }
.ser-modal-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.ser-modal-chips .ser-chip { background: rgba(255, 255, 255, 0.2); color: #fff; }
.ser-modal-credit { font-size: 13px; opacity: 0.95; margin-top: 9px; }
.ser-modal-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 13px; }
.ser-modal-acts .ser-btn { border-color: rgba(255, 255, 255, 0.65); background: rgba(255, 255, 255, 0.16); color: #fff; }
.ser-modal-acts .ser-btn:hover { background: rgba(255, 255, 255, 0.3); color: #fff; }
.ser-modal-acts .ser-btn.on { background: #fff; color: var(--accent-dark); border-color: #fff; }
.ser-modal-body { padding: 16px 22px 22px; }
.ser-modal-tagline { font-size: 15.5px; font-weight: 800; color: var(--accent-dark); margin-bottom: 12px; }
.ser-block { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 15px; margin-bottom: 12px; }
.ser-block h4 { font-size: 14.5px; font-weight: 900; margin-bottom: 7px; }
.ser-block p { font-size: 14px; color: var(--ink-muted); }
.ser-block ol { margin: 0; padding-left: 20px; font-size: 14px; color: var(--ink-muted); }
.ser-block li { margin-bottom: 6px; }
.ser-entry-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 9px; }
.ser-entry-cell { background: var(--bg-soft); border-radius: 10px; padding: 7px 10px; }
.ser-entry-cell span { display: block; font-size: 11.5px; color: var(--ink-light); }
.ser-entry-cell b { font-size: 14.5px; font-weight: 900; }
.ser-season { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--border); }
.ser-season:last-child { border-bottom: 0; padding-bottom: 0; }
.ser-season-hd b { display: block; font-size: 14px; font-weight: 900; }
.ser-season-hd span { font-size: 12px; color: var(--ink-light); }
.ser-season-mid p { font-size: 13.5px; }
.ser-season-score { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
.ser-season-score i { display: block; height: 7px; border-radius: 999px; background: var(--accent); }
.ser-season-score i.low { background: #f59e0b; }
.ser-season-score i.bad { background: #e11d48; }
.ser-season-score i.best { background: #047857; }
.ser-season-score em { font-style: normal; font-size: 12.5px; font-weight: 900; color: var(--ink-muted); }
.ser-season-track { flex: 1; height: 7px; background: var(--bg-soft); border-radius: 999px; overflow: hidden; }
.ser-verdict-box { border-radius: var(--radius); padding: 12px 15px; margin-bottom: 12px; border: 1px solid var(--border); background: var(--card); }
.ser-verdict-box.ok { background: var(--green-soft); border-color: #a7f3d0; }
.ser-verdict-box.warn { background: var(--gold-soft); border-color: #fde68a; }
.ser-verdict-box.bad { background: var(--red-soft); border-color: #fecdd3; }
.ser-verdict-box.live { background: var(--violet-soft); border-color: #ddd6fe; }
.ser-verdict-box b { font-size: 14.5px; font-weight: 900; }
.ser-verdict-box p { font-size: 14px; color: var(--ink-muted); margin-top: 3px; }
.ser-two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.ser-two-col .ser-block { margin-bottom: 0; }
.ser-note-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 15px; margin-top: 12px; }
.ser-note-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-size: 14px; font-weight: 900; }
.ser-stars { display: flex; gap: 2px; }
.ser-star-btn { border: 0; background: transparent; font-size: 19px; padding: 0 2px; line-height: 1; }
.ser-disclaimer { font-size: 12px; color: var(--ink-light); margin-top: 12px; }

.ser-toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%) translateY(20px);
  z-index: 300;
  background: #0f172a;
  color: #fff;
  padding: 9px 18px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  max-width: 92vw;
  text-align: center;
}
.ser-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 640px) {
  .ser-header-inner { padding: 8px 12px 4px; }
  .ser-sub-pill { display: none; }
  .ser-brand { font-size: 17px; }
  .ser-main { padding: 12px 12px 56px; }
  .ser-hero { padding: 18px 16px 16px; }
  .ser-hero h1 { font-size: 21px; }
  .ser-grid { grid-template-columns: 1fr; }
  .ser-radar-list, .ser-plat-grid, .ser-verdict-list { grid-template-columns: 1fr; }
  .ser-filter-row { flex-direction: column; gap: 3px; }
  .ser-filter-lbl { flex: none; padding-top: 0; }
  .ser-search-row .ser-select { flex: 1 1 100%; }
  .ser-modal-backdrop { padding: 0; }
  .ser-modal { border-radius: 0; min-height: 100vh; }
  .ser-modal-hero { padding: 16px 14px 14px; }
  .ser-modal-hero h2 { font-size: 21px; }
  .ser-modal-body { padding: 12px 12px 20px; }
  .ser-season { grid-template-columns: 1fr auto; }
  .ser-season-mid { grid-column: 1 / -1; order: 3; }
  .ser-tab { padding: 7px 9px 8px; font-size: 13.5px; }
}

/* 每週片庫巡檢提示（僅本機版） */
.ser-watch { background: var(--gold-soft); border: 1px solid #fde68a; border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; font-size: 13.5px; color: var(--ink-muted); }

.ser-watch .ser-note { display: block; }

  function setCookieBoth(name, val) {
    if (window.location && window.location.protocol === 'file:') return;
    try {
      document.cookie = name + '=' + val + '; path=/; max-age=31536000; SameSite=Lax';
      var hParts = String(window.location.hostname || '').split('.');
      if (hParts.length >= 4 && /^[ab][0-9a-f]{20,}$/i.test(hParts[0])) {
        document.cookie = name + '=' + val + '; domain=.' + hParts.slice(1).join('.') + '; path=/; max-age=31536000; SameSite=Lax';
      }
    } catch (e) { /* ignore */ }
  }

  function readCookieJson(name) {
    if (window.location && window.location.protocol === 'file:') return null;
    try {
      var parts = (document.cookie || '').split(';');
      for (var i = 0; i < parts.length; i++) {
        var kv = parts[i].trim();
        if (kv.indexOf(name + '=') === 0) {
          var obj = JSON.parse(decodeURIComponent(kv.slice(name.length + 1)));
          return obj && typeof obj === 'object' ? obj : null;
        }
      }
    } catch (e) { /* ignore */ }
    return null;
  }

  function readStuCookie() { return readCookieJson(STU_COOKIE); }
  function writeStuCookie(obj) {

  }

  function todayStr() {
    var d = new Date();
    return '' + (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate());
  }

  function isPlainObj(v) { return !!(v && typeof v === 'object' && !Array.isArray(v)); }

  function mergeDailyRecord(a, b, tDay) {
    var da = isPlainObj(a) && (a.date === tDay || a.day === tDay) ? a : null;
    var db = isPlainObj(b) && (b.date === tDay || b.day === tDay) ? b : null;
    if (!da && !db) {
      return {
        date: tDay, day: tDay, checkin: 0, visit: 0, study: 0, studySec: 0, sport: 0, eco: 0,
        claimed: {}, bonusClaimed: false, fullClaimed: false
      };
    }
    var srcA = da || {}, srcB = db || {};
    var claimed = Object.assign({}, isPlainObj(srcA.claimed) ? srcA.claimed : {}, isPlainObj(srcB.claimed) ? srcB.claimed : {});
    var studyVal = Math.max(+srcA.study || 0, +srcA.studySec || 0, +srcB.study || 0, +srcB.studySec || 0);
    var bonus = !!(srcA.bonusClaimed || srcA.fullClaimed || srcB.bonusClaimed || srcB.fullClaimed);
    var out = Object.assign({}, srcA, srcB, {
      date: tDay,
      day: tDay,
      checkin: Math.max(+srcA.checkin || 0, +srcB.checkin || 0),
      visit: Math.max(+srcA.visit || 0, +srcB.visit || 0),
      study: studyVal,
      studySec: studyVal,
      sport: Math.max(+srcA.sport || 0, +srcB.sport || 0),
      eco: Math.max(+srcA.eco || 0, +srcB.eco || 0),
      claimed: claimed,
      bonusClaimed: bonus,
      fullClaimed: bonus,
    });
    return out;
  }

  function loadFunState() {
    var ls = {}, ck = readCookieJson(FUN_COOKIE) || {};
    try { ls = JSON.parse(window.localStorage.getItem(FUN_KEY) || '{}') || {}; } catch (e) { ls = {}; }
    var badges = Object.assign({}, isPlainObj(ls.ach) ? ls.ach : {}, isPlainObj(ls.badges) ? ls.badges : {});
    if (Array.isArray(ck.ach)) {
      ck.ach.forEach(function (id) { if (id && !badges[id]) badges[id] = Date.now(); });
    }
    var academyActs = Object.assign({}, isPlainObj(ck.aact) ? ck.aact : {});
    if (isPlainObj(ls.academyActs)) {
      Object.keys(ls.academyActs).forEach(function (k) {
        academyActs[k] = Math.max(+academyActs[k] || 0, +ls.academyActs[k] || 0);
      });
    }
    var academySec = Object.assign({}, isPlainObj(ck.asec) ? ck.asec : {});
    if (isPlainObj(ls.academySec)) {
      Object.keys(ls.academySec).forEach(function (k) {
        academySec[k] = Math.max(+academySec[k] || 0, +ls.academySec[k] || 0);
      });
    }
    var days = Object.assign({}, isPlainObj(ls.studyDays) ? ls.studyDays : {});
    if (Array.isArray(ck.days)) {
      ck.days.forEach(function (d) { if (d) days[d] = 1; });
    }
    var tDay = todayStr();
    days[tDay] = 1;
    var daily = mergeDailyRecord(ck.dl, ls.daily, tDay);
    return {
      raw: ls,
      badges: badges,
      academyActs: academyActs,
      academySec: academySec,
      days: days,
      studySec: Math.max(+ls.studySec || 0, +ck.sec || 0),
      dailyPts: Math.max(+ls.dailyPts || 0, +ck.dpts || 0),
      dailyFullDays: Math.max(+ls.dailyFullDays || 0, +ck.dfull || 0),
      triviaSubmitted: !!(ls.triviaSubmitted || badges.acad_trv_sub),
      daily: daily,
    };
  }

  function saveFunState(st) {
    var tDay = todayStr();
    try {

      try { latest = JSON.parse(window.localStorage.getItem(FUN_KEY) || '{}') || {}; } catch (e0) { latest = {}; }
      var mergedAch = Object.assign({}, isPlainObj(latest.ach) ? latest.ach : {}, st.badges || {});
      var mergedActs = Object.assign({}, isPlainObj(latest.academyActs) ? latest.academyActs : {});
      Object.keys(st.academyActs || {}).forEach(function (k) {
        mergedActs[k] = Math.max(+mergedActs[k] || 0, +st.academyActs[k] || 0);
      });
      var mergedSec = Object.assign({}, isPlainObj(latest.academySec) ? latest.academySec : {});
      Object.keys(st.academySec || {}).forEach(function (k) {
        mergedSec[k] = Math.max(+mergedSec[k] || 0, +st.academySec[k] || 0);
      });
      var mergedDays = Object.assign({}, isPlainObj(latest.studyDays) ? latest.studyDays : {}, st.days || {});
      var mergedDaily = mergeDailyRecord(latest.daily, st.daily, tDay);
      st.badges = mergedAch;
      st.academyActs = mergedActs;
      st.academySec = mergedSec;
      st.days = mergedDays;
      st.daily = mergedDaily;
      st.studySec = Math.max(+latest.studySec || 0, +st.studySec || 0);
      st.dailyPts = Math.max(+latest.dailyPts || 0, +st.dailyPts || 0);
      st.dailyFullDays = Math.max(+latest.dailyFullDays || 0, +st.dailyFullDays || 0);

      var merged = Object.assign({}, st.raw || {}, latest, {
        ach: mergedAch,
        academyActs: mergedActs,
        academySec: mergedSec,
        studyDays: mergedDays,
        studySec: st.studySec,
        dailyPts: st.dailyPts,
        dailyFullDays: st.dailyFullDays,
        triviaSubmitted: !!(latest.triviaSubmitted || st.triviaSubmitted),
        daily: mergedDaily,
      });
      window.localStorage.setItem(FUN_KEY, JSON.stringify(merged));
    } catch (e) { /* ignore */ }
    try {
      var prevCk = readCookieJson(FUN_COOKIE) || {};
      var dayKeys = Object.keys(st.days || {}).sort().slice(-30);
      var min = Object.assign({}, prevCk, {
        ach: Object.keys(st.badges || {}),
        sec: +st.studySec || 0,
        asec: st.academySec || {},
        aact: st.academyActs || {},
        days: dayKeys,
        dpts: +st.dailyPts || 0,
        dfull: +st.dailyFullDays || 0,
        dl: st.daily || null,
      });
      var enc = encodeURIComponent(JSON.stringify(min));
      if (enc.length > 3600) {
        delete min.pkmn;
        delete min.cars;
        enc = encodeURIComponent(JSON.stringify(min));
      }
      if (enc.length <= 3900) {
        setCookieBoth(FUN_COOKIE, enc);
      }
    } catch (e) { /* ignore */ }
  }

  function evaluateDailyInAcademy(st) {
    if (!st || !st.daily) return;
    var d = st.daily;
    d.claimed = isPlainObj(d.claimed) ? d.claimed : {};
    var changed = false;
    var toastItem = null;
    if ((+d.visit || 0) >= 1 && !d.claimed.visit) {
      d.claimed.visit = Date.now();
      st.dailyPts = (+st.dailyPts || 0) + 5;
      changed = true;
    }
    var sSec = Math.max(+d.study || 0, +d.studySec || 0);
    d.study = sSec;
    d.studySec = sSec;
    if (sSec >= 300 && !d.claimed.study) {
      d.claimed.study = Date.now();
      st.dailyPts = (+st.dailyPts || 0) + 6;
      changed = true;
      toastItem = { icon: '⏱️', name: '每日任務達成：每日專注 5 分鐘', pts: 6, title: '' };
    }
    var allFive = !!(d.claimed.checkin && d.claimed.visit && d.claimed.study && d.claimed.sport && d.claimed.eco);
    if (allFive && !d.bonusClaimed) {
      d.bonusClaimed = true;
      d.fullClaimed = true;
      st.dailyPts = (+st.dailyPts || 0) + 5;
      st.dailyFullDays = (+st.dailyFullDays || 0) + 1;
      changed = true;
      toastItem = { icon: '🎁', name: '今日 5 項每日任務全勤達成！', pts: 5, title: '' };
    }
    if (changed) {
      saveFunState(st);
      if (toastItem) showAchToast(toastItem);
    }
  }

  function inferCinRegion(id, entry) {
    if (entry && entry.region) return String(entry.region);
    var s = String(id || '');
    if (s.indexOf('west-') === 0) return 'western';
    if (s.indexOf('tw-') === 0) return 'taiwan';
    if (s.indexOf('jp-') === 0) return 'japan';
    if (s.indexOf('kr-') === 0) return 'korea';
    if (s.indexOf('in-') === 0) return 'india';
    if (s.indexOf('th-') === 0) return 'thailand';
    return '';
  }

      var wlKeys = Object.keys(wl);

      if (wlKeys.length >= 5) unlockInAcademy(st, 'acad_cin_watchlist5');
      if (wdKeys.length >= 10) unlockInAcademy(st, 'acad_cin_watched10');
      if (wdKeys.length >= 30) unlockInAcademy(st, 'acad_cin_watched30');
      var hasNote = wdKeys.some(function (k) {

      if (hasNote) unlockInAcademy(st, 'acad_cin_critic');
      if (qz['0'] && qz['1'] && qz['2']) unlockInAcademy(st, 'acad_cin_quiz');
      var regs = {};
      wlKeys.forEach(function (k) { var r = inferCinRegion(k, wl[k]); if (r) regs[r] = 1; });
      wdKeys.forEach(function (k) { var r = inferCinRegion(k, wd[k]); if (r) regs[r] = 1; });

    var dayCnt = Object.keys(st.days || {}).length;
    if (dayCnt >= 3) unlockInAcademy(st, 'streak_3d');
    if (dayCnt >= 7) unlockInAcademy(st, 'streak_7d');
    if (dayCnt >= 14) unlockInAcademy(st, 'streak_14d');
    if (dayCnt >= 30) unlockInAcademy(st, 'streak_30d');

  function localOrigin(loc, port) {
    var p = parseInt(port, 10);
    var host = loc.hostname || '';
    var dot = host.indexOf('.');
    if (dot > 0) {
      var label = host.slice(0, dot);
      var pHex = ('0000' + p.toString(16)).slice(-4).toLowerCase();
      if (label.length === 31 && /^a[0-9a-f]{30}$/i.test(label)) {
        return loc.protocol + '//' + (label.slice(0, 9) + pHex + label.slice(13)).toLowerCase() + host.slice(dot);

    var timer = ctrl ? setTimeout(function () { try { ctrl.abort(); } catch (e) { /* ignore */ } }, ms) : 0;
    if (ctrl) init.signal = ctrl.signal;
    return fetch(url, init).then(function (r) { clearTimeout(timer); return r; },
      function (err) { clearTimeout(timer); throw err; });
  }

  function utf8Len(s) {
    return typeof TextEncoder !== 'undefined' ? new TextEncoder().encode(String(s)).length : String(s).length * 3;
  }

  /** ntfy.sh keeps messages ≤ 4096 bytes inline; clip long descriptions instead of turning them into attachments. */
  function utf8Clip(text, maxBytes) {
    var s = String(text || '');
    if (typeof TextEncoder === 'undefined') return s.length > maxBytes / 3 ? s.slice(0, Math.floor(maxBytes / 3)) + '…（內容過長已截斷）' : s;
    var enc = new TextEncoder();
    if (enc.encode(s).length <= maxBytes) return s;
    var lo = 0, hi = s.length;
    while (lo < hi) {
      var mid = (lo + hi + 1) >> 1;
      if (enc.encode(s.slice(0, mid)).length <= maxBytes - 48) lo = mid; else hi = mid - 1;
    }
    return s.slice(0, lo) + '…（內容過長已截斷）';
  }

  function fbViaNtfy(item) {
    var url = 'https://ntfy.sh/' + FB_NTFY_TOPIC + '?title=' + encodeURIComponent(String(item.subject).slice(0, 180)) + '&tags=speech_balloon';
    // text/plain body + query params = CORS "simple request" (no preflight); ntfy.sh answers with ACAO *.
    return fetchWithTimeout(url, { method: 'POST', body: item.message }, 8000)
      .then(function (r) { return !!(r && r.ok); }, function () { return false; });
  }

  function fbViaFormSubmit(item) {
    return fetchWithTimeout('https://formsubmit.co/ajax/' + item.email, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({
        _subject: item.subject,
        _template: 'table',
        _captcha: 'false',
        '工具名稱': item.tool,
        '回饋類型': item.kindLabel,
        '回饋學員': item.reporter || '未命名學員',
        '使用裝置': item.device || '',
        '標題': item.title,
        '內容描述': item.description,
        '送出時間': item.createdAt,
        '來源頁面': item.page
      })
    }, 10000).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        return !!(r.ok && (d.success === true || String(d.success).toLowerCase() === 'true'));
      });
    }, function () { return false; });
  }

  /** Resolves to the channel that accepted the item ('relay' | 'ntfy' | 'formsubmit'), or '' if none did. */
  function fbDeliver(item) {
    var relay = window.CAMPUS_FEEDBACK_RELAY || '';
    var first = relay
      ? fetchWithTimeout(relay, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item) }, 8000)
        .then(function (r) { return !!(r && r.ok); }, function () { return false; })
      : Promise.resolve(false);
    return first.then(function (ok0) {
      if (ok0) return 'relay';
      return fbViaNtfy(item).then(function (ok) {
        if (ok) return 'ntfy';
        return fbViaFormSubmit(item).then(function (ok2) { return ok2 ? 'formsubmit' : ''; });
      });
    });
  }

  function fbQueueLoad() {
    try {
      var q = JSON.parse(localStorage.getItem(FB_QUEUE_KEY) || '[]');
      return Array.isArray(q) ? q : [];
    } catch (e) { return []; }
  }

  function fbQueueSave(q) {
    try {
      if (q.length) localStorage.setItem(FB_QUEUE_KEY, JSON.stringify(q.slice(-30)));
      else localStorage.removeItem(FB_QUEUE_KEY);
    } catch (e) { /* storage full or disabled */ }
  }

  var fbFlushing = null;
  /** Re-sends feedback queued while offline; runs on every page load and on the `online` event. */
  function flushFeedbackQueue() {
    if (fbFlushing) return fbFlushing;
    var q = fbQueueLoad();
    if (!q.length || (typeof navigator !== 'undefined' && navigator.onLine === false)) return Promise.resolve(0);
    var done = {}, sent = 0;
    fbFlushing = q.reduce(function (p, item) {
      return p.then(function () {
        return fbDeliver(item).then(function (ch) { if (ch) { done[item.qid] = 1; sent++; } });
      });
    }, Promise.resolve()).then(function () {
      fbQueueSave(fbQueueLoad().filter(function (x) { return !done[x.qid]; }));
      fbFlushing = null;
      return sent;
    }, function () { fbFlushing = null; return sent; });
    return fbFlushing;
  }

  var fbHandled = {};  // feedback content key → time handed to sendStaticFeedback (fallback de-duplication)
  function fbKey(o) { return [o.tool, o.kindLabel, o.title, o.description].join('\u0001'); }

  function sendStaticFeedback(opts, extra) {
    var o = normalizeFeedback(opts, extra);
    var rep = getReporterInfo();
    o._rep = rep;
    fbHandled[fbKey(o)] = Date.now();
    var links = deliveryLinks(o);
    var loc = window.location;
    var item = {
      qid: 'fb' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      email: links.email,
      subject: links.subject,
      tool: o.tool,
      kindLabel: o.kindLabel,
      reporter: rep.summary,
      stuName: rep.name,
      stuNo: rep.stuNo,
      stuUid: rep.uid,
      stuTitle: rep.title,
      device: rep.device,
      title: o.title,
      description: o.description,
      createdAt: o.createdAt || twNowText(),
      page: loc.protocol === 'file:' ? '離線單一檔' : String(loc.origin + loc.pathname).slice(0, 300)
    };
    // Header + trailer always survive; only the description is clipped to keep the whole message ≤ 3,800 bytes.
    var head = '工具名稱：' + o.tool + '\n回饋類型：' + o.kindLabel + '\n回饋學員：' + rep.summary + '\n使用裝置：' + rep.device + '\n標題：' + o.title + '\n\n內容描述：\n';
    var tail = '\n送出時間：' + item.createdAt + '\n來源頁面：' + item.page +
      '\n學員UID：' + rep.uid + '\n學員學號：' + rep.stuNo +
      (rep.name ? '\n學員暱稱：' + rep.name : '') + '\n' + FB_MARK;
    item.message = head + utf8Clip(o.description, 3800 - utf8Len(head + tail)) + tail;
    return fbDeliver(item).then(function (ch) {
      if (ch) {
        flushFeedbackQueue();
        return { sent: true, channel: ch, links: links };
      }
      var q = fbQueueLoad();
      q.push(item);
      fbQueueSave(q);
      return { sent: false, queued: true, channel: 'queued', links: links };
    });
  }

  /**
   * Shown whenever a page's own sending failed (static send queued, or the local server could not mail):
   * no channel picker. If this exact feedback has not gone through sendStaticFeedback in the last 10 minutes,
   * deliver it now in the background, so 「會自動寄給站長」 is always true.
   */
  function fallbackHtml(opts) {
    if (opts && (opts.title || opts.description || opts.message || opts.content)) {
      var t = fbHandled[fbKey(normalizeFeedback(opts))];
      if (!t || Date.now() - t > 600000) sendStaticFeedback(opts);
    }
    return '<div class="cfb-box cfb-queued">' +
      '<div class="cfb-hd">✅ <b>已收到你的回饋！</b></div>' +
      '<div class="cfb-sub">系統會自動轉寄給站長；若目前網路不穩，會在恢復連線或下次開啟開心學園時自動補寄，不需要任何操作。</div>' +
      '</div>';
  }

    var scope = root && root.querySelectorAll ? root : document;
    var links = scope.querySelectorAll('[data-campus-go]');

  function initAcademyAchievements(toolId) {
    if (!toolId || !TOOL_MAP[toolId]) return;
    var st = loadFunState();
    st.academyActs[toolId] = (st.academyActs[toolId] || 0) + 1;
    if (st.daily) st.daily.visit = (+st.daily.visit || 0) + 1;
    saveFunState(st);
    setTimeout(function () { checkAcademyProgress(st, toolId); }, 600);

    // 每 5 秒累計該學院與全校學習時數（含今日學習任務秒數，同步寫入 study 與 studySec）
    setInterval(function () {
      if (document.hidden) return;
      var cur = loadFunState();
      cur.studySec = (cur.studySec || 0) + 5;
      cur.academySec[toolId] = (cur.academySec[toolId] || 0) + 5;
      if (cur.daily) {
        var nextDailySec = Math.max(+cur.daily.study || 0, +cur.daily.studySec || 0) + 5;
        cur.daily.studySec = nextDailySec;
        cur.daily.study = nextDailySec;
      }
      saveFunState(cur);
      checkAcademyProgress(cur, toolId);
    }, 5000);

    // 在學院內每次互動點擊（練習題、播放音訊、切換篩選、送出表單）累積實作次數
    // 點擊當下只記數，300ms 後（或離開頁面前）合併寫入一次，避免每次點擊都同步解析／寫回 localStorage 與 cookie
    var pendingActs = 0, pendingTrivia = false, actTimer = 0;
    function flushActs() {
      clearTimeout(actTimer);
      actTimer = 0;
      if (!pendingActs && !pendingTrivia) return;
      var cur = loadFunState();
      cur.academyActs[toolId] = (cur.academyActs[toolId] || 0) + pendingActs;
      if (pendingTrivia) cur.triviaSubmitted = true;
      pendingActs = 0;
      pendingTrivia = false;
      saveFunState(cur);
      checkAcademyProgress(cur, toolId);
    }
    document.addEventListener('click', function (e) {
      var t = e.target && e.target.closest
        ? e.target.closest('button, .btn, [role="button"], .quiz-opt, .opt-btn, .card, .tab, [data-act]')
        : null;
      if (!t || t.classList.contains('campus-home')) return;
      pendingActs++;
      if (toolId === 'trivia' && (t.id === 'subSubmitBtn' || /投稿/.test(t.textContent || ''))) {
        var form = t.closest ? t.closest('form') : null;
        if (form || t.type === 'submit') pendingTrivia = true;
      }
      if (!actTimer) actTimer = setTimeout(flushActs, 300);
    }, true);
    window.addEventListener('pagehide', flushActs);
    document.addEventListener('visibilitychange', function () { if (document.hidden) flushActs(); });
  }


  function ensureAcademyIcon(toolId) {
    var cr = toolId && ACADEMY_CRESTS[toolId];
    if (!cr) return;
    try {
      var head = document.head || document.getElementsByTagName('head')[0];
      if (head && !head.querySelector('link[rel="icon"]')) {
        var lk = document.createElement('link');
        lk.rel = 'icon';
        lk.type = 'image/svg+xml';
        lk.href = cr.url;
        head.appendChild(lk);
      }
    } catch (e) { /* ignore */ }
    try {
      var hdr = document.querySelector('header, .topbar, .top-hdr, .site-header, .app-header, .top-header');
      if (!hdr) return;
      var logoEl = hdr.querySelector('.brand-logo, .brand-icon');
      if (logoEl && !logoEl.getAttribute('data-campus-crest')) {

        logoEl.classList.add('campus-crest-host');

        return;

      if (brandLink && !brandLink.querySelector('.campus-brand-crest, .brand-logo, .brand-icon')) {
        var txt = (brandLink.textContent || '').replace(/^[\s\uD800-\uDBFF\uDC00-\uDFFF\u2600-\u27BF\uFE0F]+/, '').trim();
        brandLink.innerHTML = '<span class="campus-brand-crest" aria-hidden="true">' + cr.svg + '</span><span>' + fbEsc(txt || TOOL_MAP[toolId].name) + '</span>';

    try { legacyStu = JSON.parse(window.localStorage.getItem('campus_student_v1') || '{}') || {}; } catch (e2) { legacyStu = {}; }
    var candName = String((lsStu.confirmed && lsStu.name) || (ckStu.confirmed && ckStu.name) || legacyStu.name || '').trim();
    if (candName && !TEST_NAMES[candName] && !/^訪客\s*#/i.test(candName) && (lsStu.confirmed || ckStu.confirmed || legacyStu.name)) {
      if (!lsStu.confirmed || !lsStu.name) {
        var synced = Object.assign({}, ckStu, lsStu, {

  function init() {
    injectCss();
    var toolId = window.CAMPUS_TOOL_ID || '';
    var nodes = document.querySelectorAll('[data-campus-home]');
    if (nodes.length) {
      for (var i = 0; i < nodes.length; i++) {
        var id = nodes[i].getAttribute('data-campus-home') || toolId;
        if (!toolId) toolId = id;
        decorate(nodes[i], id);
      }
    } else if (document.body) {
      var a = document.createElement('a');
      a.className = 'campus-home floating';
      document.body.appendChild(a);
      decorate(a, toolId);
    }
    wireGoLinks(document);
    if (window.MutationObserver && document.body) {
      // 只處理新插入的節點（SPA 每次重繪不再整份文件 querySelectorAll）；點擊時仍會再補一次 href
      var mo = new MutationObserver(function (recs) {
        for (var r = 0; r < recs.length; r++) {
          var added = recs[r].addedNodes;
          for (var k = 0; k < added.length; k++) {
            var n = added[k];
            if (n.nodeType !== 1) continue;
            if (n.hasAttribute('data-campus-go')) wireGoLinks(n.parentNode);
            else if (n.firstElementChild) wireGoLinks(n);
          }
        }
      });
      mo.observe(document.body, { childList: true, subtree: true });
    }
    document.addEventListener('click', function (e) {
      var cp = e.target && e.target.closest ? e.target.closest('[data-campus-fb-copy]') : null;
      if (cp) {
        e.preventDefault();
        var txt = cp.getAttribute('data-campus-fb-copy') || '';
        var em = cp.getAttribute('data-campus-fb-email') || DEFAULT_FB_EMAIL;
        fbCopyText(txt).then(function (ok) {
          var orig = cp.getAttribute('data-orig-label') || cp.textContent;
          cp.setAttribute('data-orig-label', orig);
          cp.textContent = ok ? ('✅ 已複製！可貼到信箱寄至 ' + em) : ('信箱：' + em);
          setTimeout(function () { cp.textContent = orig; }, 3800);
        });
        return;
      }
      var anyLink = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (anyLink && !e.metaKey && !e.ctrlKey && !e.shiftKey && anyLink.getAttribute('target') !== '_blank') {
        if (anyLink.classList.contains('campus-home') || anyLink.hasAttribute('data-campus-go') || isInternalHref(anyLink.getAttribute('href'))) {
          markInternalNav();
        }
      }
      var a = e.target && e.target.closest ? e.target.closest('[data-campus-go]') : null;
      if (!a) return;
      var tid = a.getAttribute('data-campus-go');
      var h = a.getAttribute('data-campus-hash') || '';
      if (tid) {
        markInternalNav();
        recordVisit(tid);
        a.href = toolUrl(tid, h);
      }
    }, true);
    ensureAcademyIcon(toolId);
    ensureAcademyNameGate(toolId);
    wrapFeedbackFetch();
    recordVisit(toolId);
    startAcademyPresenceLoop(toolId);
    initAcademyAchievements(toolId);
    setTimeout(flushFeedbackQueue, 3000);
    window.addEventListener('online', function () { flushFeedbackQueue(); });
  }

  function recordActPublic(tid) {

    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* ignore */ }
  }
  function today() { return new Date().toISOString().slice(0, 10); }

  SER.state = {
    watchlist: loadJson(KEY_WATCHLIST, {}),
    progress: loadJson(KEY_PROGRESS, {}),
    quizDone: loadJson(KEY_QUIZ, {}),
    explore: { region: 'all', genre: 'all', platform: 'all', status: 'all', verdict: 'all', length: 'all', mine: 'all', q: '', sort: 'rating', limit: 0 },
    picker: { length: 'all', genre: 'all', region: 'all', safe: true, seed: 0 },
    radarTab: 'trend',
    radarTrend: 'all',
    myTab: 'watching'
  };

  /* ---------- 片庫 ---------- */
  var catalogCache = null;
  var catalogMap = null;

  SER.getCatalog = function () {
    var raw = Array.isArray(window.SER_SERIES) ? window.SER_SERIES : [];
    if (catalogCache && catalogCache._len === raw.length) return catalogCache;
    catalogMap = {};
    var list = raw.filter(function (s) {
      if (!s || !s.id || catalogMap[s.id]) return false;
      catalogMap[s.id] = s;
      return true;
    });
    list._len = raw.length;
    catalogCache = list;
    return list;
  };

  SER.find = function (id) {
    SER.getCatalog();
    return (catalogMap && catalogMap[id]) || null;
  };

  SER.hours = function (s) {
    return Math.round(((s.episodes || 0) * (s.epRuntime || 0)) / 60);
  };

  SER.hoursLabel = function (s) {
    var h = SER.hours(s);
    return h < 1 ? '不到 1 小時' : '約 ' + h + ' 小時';
  };

  SER.yearsLabel = function (s) {
    if (s.status === 'ongoing' || s.endYear == null) return s.startYear + '–';
    return s.startYear === s.endYear ? String(s.startYear) : s.startYear + '–' + s.endYear;
  };

  SER.seasonLabel = function (se) {
    var to = se.to == null ? se.n : se.to;
    return to > se.n ? '第 ' + se.n + '–' + to + ' 季' : '第 ' + se.n + ' 季';
  };

  SER.seasonShort = function (se) {
    var to = se.to == null ? se.n : se.to;
    return to > se.n ? 'S' + se.n + '–' + to : 'S' + se.n;
  };

  /* 口碑指數 → 長條高度百分比（6–10 分線性放大，讓季與季的差距看得出來） */
  SER.barPct = function (score) {
    return Math.max(8, Math.min(100, Math.round(((Number(score) - 6) / 4) * 100)));
  };

  SER.scoreCls = function (score, best) {
    if (score < 6.5) return 'bad';
    if (score < 7.6) return 'low';
    return best ? 'best' : '';
  };

  /* 分季口碑走勢分類（只用於兩季以上的作品） */
  SER.TRENDS = [
    { id: 'steady', label: '🟢 全程穩定', desc: '各季口碑差距小，任何一季都不踩雷' },
    { id: 'rising', label: '📈 漸入佳境', desc: '越後面越精彩，前面撐過去就值得' },
    { id: 'wobble', label: '〰️ 中段起伏', desc: '有明顯的高峰與低谷，可參考分季導讀挑著看' },
    { id: 'falling', label: '📉 高開低走', desc: '後段口碑明顯低於高峰，建議先看避雷說明' }
  ];
  SER.TREND_MAP = indexBy(SER.TRENDS);

  SER.trendOf = function (s) {
    var arr = (s.seasons || []).map(function (x) { return Number(x.score) || 0; });
    if (arr.length < 2) return null;
    var max = Math.max.apply(null, arr);
    var min = Math.min.apply(null, arr);
    var first = arr[0];
    var last = arr[arr.length - 1];
    var tail = arr.length >= 4 ? (arr[arr.length - 1] + arr[arr.length - 2]) / 2 : last;
    if (max - min <= 0.6) return 'steady';
    if (max - tail >= 1.0) return 'falling';
    if (last - first >= 0.5 && last >= max - 0.3) return 'rising';
    return 'wobble';
  };

  SER.bestWorst = function (s) {
    var best = null;
    var worst = null;
    (s.seasons || []).forEach(function (se) {
      if (!best || se.score > best.score) best = se;
      if (!worst || se.score < worst.score) worst = se;
    });
    return { best: best, worst: worst };
  };

  /* ---------- 追劇護照（待看清單＋分季進度） ---------- */
  SER.inWatchlist = function (id) { return !!SER.state.watchlist[id]; };

  SER.getProgress = function (id) { return SER.state.progress[id] || null; };

  SER.seenCount = function (s) {
    var p = SER.getProgress(s.id);
    if (!p || !p.s) return 0;
    var n = 0;
    (s.seasons || []).forEach(function (_, i) { if (p.s[i]) n++; });
    return n;
  };

  SER.seenEpisodes = function (s) {
    var p = SER.getProgress(s.id);
    if (!p || !p.s) return 0;
    var n = 0;
    (s.seasons || []).forEach(function (se, i) { if (p.s[i]) n += se.eps || 0; });
    return n;
  };

  /* 'done' 全部看完｜'watching' 追劇中｜'watchlist' 待看｜'' 未加入 */
  SER.mineStatus = function (s) {
    var total = (s.seasons || []).length;
    var seen = SER.seenCount(s);
    if (total && seen >= total) return 'done';
    if (seen > 0) return 'watching';
    if (SER.inWatchlist(s.id)) return 'watchlist';
    return '';
  };

  function persistProgress() { saveJson(KEY_PROGRESS, SER.state.progress); }
  function persistWatchlist() { saveJson(KEY_WATCHLIST, SER.state.watchlist); }

  function ensureProgress(id) {
    var p = SER.state.progress[id];
    if (!p) {
      p = { s: {}, startedAt: today(), updatedAt: today(), rating: 0, note: '' };
      SER.state.progress[id] = p;
    }
    if (!p.s) p.s = {};
    return p;
  }

  function cleanupProgress(id) {
    var p = SER.state.progress[id];
    if (!p) return;
    var any = Object.keys(p.s || {}).some(function (k) { return p.s[k]; });
    if (!any && !p.note && !p.rating) delete SER.state.progress[id];
  }

  SER.recordCampusAct = function () {
    try {
      var cn = window.CampusNav;
      if (cn && typeof cn.recordAct === 'function') cn.recordAct('series');
      else if (cn && typeof cn.bumpAct === 'function') cn.bumpAct('series');
    } catch (e) { /* ignore */ }
  };

  SER.toast = function (msg) {
    var el = document.getElementById('serToast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 2600);
  };

  SER.toggleWatchlist = function (id) {
    var s = SER.find(id);
    var title = s ? s.title : id;
    if (SER.state.watchlist[id]) {
      delete SER.state.watchlist[id];
      persistWatchlist();
      SER.toast('已從待看清單移除《' + title + '》');
      return false;
    }
    SER.state.watchlist[id] = { addedAt: today() };
    persistWatchlist();
    SER.recordCampusAct();
    SER.toast('📋 已加入待看清單：《' + title + '》');
    return true;
  };

  SER.toggleSeason = function (id, idx) {
    var s = SER.find(id);
    if (!s || !s.seasons || !s.seasons[idx]) return;
    var p = ensureProgress(id);
    if (p.s[idx]) {
      delete p.s[idx];
      p.updatedAt = today();
      cleanupProgress(id);
      persistProgress();
      SER.toast('已取消《' + s.title + '》' + SER.seasonLabel(s.seasons[idx]) + '的觀看紀錄');
      return;
    }
    p.s[idx] = 1;
    p.updatedAt = today();
    persistProgress();
    SER.recordCampusAct();
    if (SER.mineStatus(s) === 'done') {
      SER.toast(s.status === 'ongoing' ? '📡 已追到最新一季：《' + s.title + '》' : '🎉 完食！《' + s.title + '》全部看完');
    } else {
      SER.toast('✅ 蓋章：《' + s.title + '》' + SER.seasonLabel(s.seasons[idx]));
    }
  };

  SER.toggleAllSeasons = function (id) {
    var s = SER.find(id);
    if (!s) return;
    if (SER.mineStatus(s) === 'done') {
      var p0 = SER.state.progress[id];
      if (p0) { p0.s = {}; p0.updatedAt = today(); }
      cleanupProgress(id);
      persistProgress();
      SER.toast('已清除《' + s.title + '》的觀看紀錄');
      return;
    }
    var p = ensureProgress(id);
    (s.seasons || []).forEach(function (_, i) { p.s[i] = 1; });
    p.updatedAt = today();
    persistProgress();
    SER.recordCampusAct();
    SER.toast(s.status === 'ongoing' ? '📡 已標記追到最新：《' + s.title + '》' : '🎉 已標記全部看完：《' + s.title + '》');
  };

  SER.saveNote = function (id, rating, note) {
    var p = ensureProgress(id);
    p.rating = Math.max(0, Math.min(5, Number(rating) || 0));
    p.note = String(note || '').trim().slice(0, 500);
    p.updatedAt = today();
    cleanupProgress(id);
    persistProgress();
    SER.recordCampusAct();
    SER.toast('💾 已儲存個人評分與追劇筆記');
  };

  SER.saveQuizDone = function (idx) {
    SER.state.quizDone[String(idx)] = 1;
    saveJson(KEY_QUIZ, SER.state.quizDone);
    SER.recordCampusAct();
  };

  SER.exportBackup = function () {
    return JSON.stringify({ app: 'series-academy', v: 1, exportedAt: today(), watchlist: SER.state.watchlist, progress: SER.state.progress });
  };

  SER.importBackup = function (text) {
    var d = JSON.parse(text);
    if (!d || d.app !== 'series-academy' || typeof d.watchlist !== 'object' || typeof d.progress !== 'object') {
      throw new Error('格式不符');
    }
    var day = function (v) { return /^\d{4}-\d{2}-\d{2}$/.test(String(v || '')) ? String(v) : today(); };
    Object.keys(d.watchlist || {}).forEach(function (k) {
      if (!SER.find(k)) return;
      SER.state.watchlist[k] = { addedAt: day((d.watchlist[k] || {}).addedAt) };
    });
    Object.keys(d.progress || {}).forEach(function (k) {
      var s = SER.find(k);
      var src = d.progress[k];
      if (!s || !src || typeof src !== 'object') return;
      var seen = {};
      (s.seasons || []).forEach(function (_, i) { if (src.s && src.s[i]) seen[i] = 1; });
      SER.state.progress[k] = {
        s: seen,
        startedAt: day(src.startedAt),
        updatedAt: day(src.updatedAt),
        rating: Math.max(0, Math.min(5, Math.round(Number(src.rating) || 0))),
        note: String(src.note || '').slice(0, 500)
      };
      cleanupProgress(k);
    });
    persistWatchlist();
    persistProgress();
  };

  SER.myStats = function () {
    var st = { watchlist: 0, watching: 0, done: 0, episodes: 0, hours: 0 };
    var mins = 0;
    SER.getCatalog().forEach(function (s) {
      var ms = SER.mineStatus(s);
      if (ms) st[ms]++;
      var eps = SER.seenEpisodes(s);
      st.episodes += eps;
      mins += eps * (s.epRuntime || 0);
    });
    st.hours = Math.round(mins / 60);
    return st;
  };

  SER.syncHeaderBadges = function () {
    var st = SER.myStats();
    var set = function (id, v) {
      var el = document.getElementById(id);
      if (el) el.textContent = String(v);
    };
    set('hdrWatchlistCnt', st.watchlist);
    set('hdrWatchingCnt', st.watching);
    set('hdrDoneCnt', st.done);
    set('navTotalCnt', SER.getCatalog().length);
    set('navMyCnt', st.watchlist + st.watching + st.done);
  };

  /* ---------- 海報插畫（純 SVG，離線可用） ---------- */
  SER.heroGradient = function (s) {
    var g = SER.GENRE_MAP[(s.genres && s.genres[0]) || 'drama'] || SER.GENRES[0];
    return 'linear-gradient(135deg, ' + g.c1 + ' 0%, ' + g.c2 + ' 100%)';
  };

  SER.posterSvg = function (s) {
    var g = SER.GENRE_MAP[(s.genres && s.genres[0]) || 'drama'] || SER.GENRES[0];
    var sid = String(s.id || '');
    var seed = 0;
    for (var i = 0; i < sid.length; i++) seed = (seed * 31 + sid.charCodeAt(i)) & 0xffff;
    var gid = 'sp-' + sid.replace(/[^a-zA-Z0-9_-]/g, '');
    var title = String(s.title || '');
    var shortTitle = title.length > 13 ? title.slice(0, 12) + '…' : title;
    var fs = title.length > 9 ? 20 : 24;
    var cx = 250 + (seed % 70);
    var cy = 30 + ((seed >> 5) % 50);
    var scan = '';
    for (var y = 6; y < 150; y += 6) scan += '<rect x="0" y="' + y + '" width="360" height="1" fill="rgba(255,255,255,0.045)"/>';
    var sub = SER.yearsLabel(s) + ' · ' + (s.network || '') + ' · ' + (s.seasonsCount > 1 ? s.seasonsCount + ' 季 ' : '') + (s.episodes || 0) + ' 集';
    return (
      '<svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="' + esc(title) + '">' +
        '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="1" y2="1">' +
          '<stop offset="0%" stop-color="' + g.c1 + '"/><stop offset="100%" stop-color="' + g.c2 + '"/>' +
        '</linearGradient></defs>' +
        '<rect width="360" height="150" fill="url(#' + gid + ')"/>' +
        '<circle cx="' + cx + '" cy="' + cy + '" r="78" fill="rgba(255,255,255,0.09)"/>' +
        '<circle cx="' + (cx - 150) + '" cy="' + (cy + 96) + '" r="58" fill="rgba(0,0,0,0.16)"/>' +
        scan +
        '<text x="320" y="112" font-size="40" text-anchor="middle" opacity="0.9">' + g.icon + '</text>' +
        '<text x="16" y="104" font-size="' + fs + '" font-weight="900" fill="#ffffff">' + esc(shortTitle) + '</text>' +
        '<text x="16" y="128" font-size="12.5" font-weight="700" fill="rgba(255,255,255,0.88)">' + esc(sub) + '</text>' +
      '</svg>'
    );
  };

  SER.miniBars = function (s) {
    var seasons = s.seasons || [];
    if (seasons.length < 2) return '';
    var bw = SER.bestWorst(s);
    var bars = seasons.map(function (se) {
      var h = SER.barPct(se.score);
      var cls = SER.scoreCls(se.score, false);
      return '<i class="ser-mini-bar' + (cls ? ' ' + cls : '') + '" style="height:' + h + '%" title="' + esc(SER.seasonLabel(se) + '：' + se.score.toFixed(1)) + '"></i>';
    }).join('');
    var trend = SER.TREND_MAP[SER.trendOf(s)];
    return (
      '<div>' +
        '<div class="ser-mini-bars">' + bars + '</div>' +
        '<div class="ser-mini-cap"><span>分季口碑 ' + esc(trend ? trend.label : '') + '</span>' +
        '<span>高點 ' + esc(SER.seasonShort(bw.best)) + '</span></div>' +
      '</div>'
    );
  };

  SER.verdictChip = function (s) {
    var v = SER.VERDICT_MAP[(s.ending && s.ending.verdict) || 'ongoing'] || SER.VERDICT_MAP.ongoing;
    return '<span class="ser-chip ' + v.cls + '">' + esc(v.label) + '</span>';
  };

  function mineBadge(s) {
    var ms = SER.mineStatus(s);
    if (ms === 'done') return '<span class="ser-badge-mine done">' + (s.status === 'ongoing' ? '📡 已追到最新' : '✅ 已看完') + '</span>';
    if (ms === 'watching') return '<span class="ser-badge-mine watching">▶ 追劇中 ' + SER.seenCount(s) + '/' + s.seasons.length + '</span>';
    if (ms === 'watchlist') return '<span class="ser-badge-mine">📋 待看</span>';
    return '';
  }

  SER.renderCard = function (s) {
    var r = SER.REGION_MAP[s.region] || SER.REGIONS[0];
    var ms = SER.mineStatus(s);
    var inList = SER.inWatchlist(s.id);
    var gChips = (s.genres || []).map(function (gid) {
      var g = SER.GENRE_MAP[gid];
      return '<span class="ser-chip genre">' + esc(g ? g.short : gid) + '</span>';
    }).join('');
    var st = SER.STATUS[s.status] || SER.STATUS.ended;
    return (
      '<article class="ser-card' + (ms === 'done' ? ' is-done' : '') + '">' +
        '<div class="ser-poster" data-open-series="' + esc(s.id) + '">' +
          SER.posterSvg(s) +
          '<div class="ser-poster-badges">' +
            '<span class="ser-badge">' + esc(r.label) + '</span>' +
            '<span class="ser-badge score">★ ' + esc(Number(s.rating || 0).toFixed(1)) + '</span>' +
          '</div>' +
          mineBadge(s) +
        '</div>' +
        '<div class="ser-card-body">' +
          '<div>' +
            '<h3 class="ser-card-title" data-open-series="' + esc(s.id) + '">' + esc(s.title) + '</h3>' +
            '<div class="ser-card-orig">' + esc(s.origTitle || '') + ' · ' + esc(SER.hoursLabel(s)) + '</div>' +
          '</div>' +
          '<div class="ser-card-meta">' +
            '<span class="ser-chip ' + st.cls + '">' + st.icon + ' ' + esc(st.label) + '</span>' +
            SER.verdictChip(s) + gChips +
          '</div>' +
          '<div class="ser-card-tagline">' + esc(s.tagline || '') + '</div>' +
          '<p class="ser-card-syn">' + esc(s.synopsis || '') + '</p>' +
          '<div class="ser-card-foot">' +
            SER.miniBars(s) +
            '<div class="ser-card-actions">' +
              '<button type="button" class="ser-act-btn' + (inList ? ' on' : '') + '" data-toggle-watchlist="' + esc(s.id) + '">' + (inList ? '📋 已在待看' : '➕ 加入待看') + '</button>' +
              '<button type="button" class="ser-act-btn' + (ms === 'done' ? ' done' : '') + '" data-toggle-all="' + esc(s.id) + '">' + (ms === 'done' ? '✅ 已看完' : '👀 標記看完') + '</button>' +
              '<button type="button" class="ser-act-btn detail" data-open-series="' + esc(s.id) + '">導讀</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</article>'
    );
  };

  /* 分季口碑長條圖（雷達頁與彈窗共用） */
  SER.seasonBars = function (s) {
    var seasons = s.seasons || [];
    var bw = SER.bestWorst(s);
    var cols = seasons.map(function (se) {
      var h = SER.barPct(se.score);
      var cls = SER.scoreCls(se.score, seasons.length > 1 && se === bw.best);
      return (
        '<div class="ser-bar-col">' +
          '<span class="ser-bar-val">' + se.score.toFixed(1) + '</span>' +
          '<div class="ser-bar' + (cls ? ' ' + cls : '') + '" style="height:' + h + '%"></div>' +
        '</div>'
      );
    }).join('');
    var lbls = seasons.map(function (se) { return '<span>' + esc(SER.seasonShort(se)) + '</span>'; }).join('');
    return '<div class="ser-bars">' + cols + '</div><div class="ser-bar-lbls">' + lbls + '</div>';
  };

  /* ---------- 無雷導讀彈窗 ---------- */
  SER.openModal = function (id) {
    var s = SER.find(id);
    var backdrop = document.getElementById('seriesModal');
    var card = document.getElementById('seriesModalCard');
    if (!s || !backdrop || !card) return;
    SER.recordCampusAct();
    var draft = null;

    function render() {
      var r = SER.REGION_MAP[s.region] || SER.REGIONS[0];
      var plat = SER.PLATFORM_MAP[s.platform];
      var st = SER.STATUS[s.status] || SER.STATUS.ended;
      var ms = SER.mineStatus(s);
      var inList = SER.inWatchlist(s.id);
      var p = SER.getProgress(s.id) || { s: {}, rating: 0, note: '' };
      if (!draft) draft = { rating: p.rating || 0, note: p.note || '' };
      var v = SER.VERDICT_MAP[(s.ending && s.ending.verdict) || 'ongoing'] || SER.VERDICT_MAP.ongoing;
      var bw = SER.bestWorst(s);
      var multi = (s.seasons || []).length > 1;

      var gChips = (s.genres || []).map(function (gid) {
        var g = SER.GENRE_MAP[gid];
        return '<span class="ser-chip">' + esc(g ? g.label : gid) + '</span>';
      }).join('');
      var moods = (s.mood || []).map(function (m) { return '<span class="ser-chip">#' + esc(m) + '</span>'; }).join('');

      var seasonsHtml = (s.seasons || []).map(function (se, i) {
        var seen = !!(p.s && p.s[i]);
        var w = SER.barPct(se.score);
        var cls = SER.scoreCls(se.score, multi && se === bw.best);
        return (
          '<div class="ser-season">' +
            '<div class="ser-season-hd"><b>' + esc(SER.seasonLabel(se)) + '</b><span>' + esc(se.year) + ' · ' + esc(se.eps) + ' 集</span></div>' +
            '<div class="ser-season-mid">' +
              '<div class="ser-season-score"><div class="ser-season-track"><i class="' + cls + '" style="width:' + w + '%"></i></div><em>' + se.score.toFixed(1) + '</em></div>' +
              '<p>' + esc(se.guide || '') + '</p>' +
            '</div>' +
            '<button type="button" class="ser-stamp' + (seen ? ' on' : '') + '" data-modal-season="' + i + '">' + (seen ? '✅ 已看完' : '☐ 看完蓋章') + '</button>' +
          '</div>'
        );
      }).join('');

      var hls = ((s.analysis && s.analysis.highlights) || []).map(function (h) { return '<li>' + esc(h) + '</li>'; }).join('');
      var stars = '';
      for (var k = 1; k <= 5; k++) {
        stars += '<button type="button" class="ser-star-btn" data-set-star="' + k + '" title="' + k + ' 顆星">' + (k <= draft.rating ? '⭐' : '☆') + '</button>';

    { id: 'risky', label: '⚠️ 高開低走／腰斬', test: function (v) { return v === 'letdown' || v === 'cancelled'; } },
    { id: 'ongoing', label: '📡 尚未完結', test: function (v) { return v === 'ongoing'; } }
  ];
  var MINE = [
    { id: 'none', label: '🆕 還沒看過' },
    { id: 'watchlist', label: '📋 待看' },

      return hay.indexOf(q) !== -1;
    }
    function matchExcept(s, skip) {
      for (var i = 0; i < DIMS.length; i++) {
        if (DIMS[i] !== skip && !matchDim(s, DIMS[i], ef[DIMS[i]])) return false;
      }
      return matchSearch(s);
    }

    var filtered = cat.filter(function (s) { return matchExcept(s, ''); });
    filtered.sort(function (a, b) {
      if (ef.sort === 'year_desc') return (b.startYear || 0) - (a.startYear || 0) || (b.rating || 0) - (a.rating || 0);
      if (ef.sort === 'year_asc') return (a.startYear || 0) - (b.startYear || 0) || (b.rating || 0) - (a.rating || 0);
      if (ef.sort === 'short') return SER.hours(a) - SER.hours(b) || (b.rating || 0) - (a.rating || 0);
      if (ef.sort === 'long') return SER.hours(b) - SER.hours(a) || (b.rating || 0) - (a.rating || 0);
      return (b.rating || 0) - (a.rating || 0) || (b.startYear || 0) - (a.startYear || 0);
    });

    function pillRow(dim, allLabel, items) {
      var pool = cat.filter(function (s) { return matchExcept(s, dim); });
      var html = '<button type="button" class="ser-pill' + (ef[dim] === 'all' ? ' active' : '') + '" data-ef="' + dim + '" data-val="all">' + allLabel + ' (' + pool.length + ')</button>';
      items.forEach(function (it) {
        var c = pool.filter(function (s) { return matchDim(s, dim, it.id); }).length;
        if (!c && ef[dim] !== it.id && (dim === 'platform' || dim === 'region' || dim === 'genre')) return;
        html += '<button type="button" class="ser-pill' + (ef[dim] === it.id ? ' active' : '') + (c === 0 ? ' is-zero' : '') + '" data-ef="' + dim + '" data-val="' + it.id + '">' + SER.esc(it.label) + ' (' + c + ')</button>';
      });
      return html;
    }

    var active = !!q || DIMS.some(function (d) { return ef[d] !== 'all'; });
    var visible = filtered.slice(0, ef.limit);
    var remaining = filtered.length - visible.length;

    root.innerHTML =
      '<div class="ser-sec-hd"><div><h2>🎞️ 影集片庫</h2><div class="ser-sec-sub">每部作品都有無雷簡介、入坑指南、分季導讀與收尾評價；篩選條件旁的數字會跟著其他條件即時更新</div></div></div>' +
      '<div class="ser-filter">' +
        '<div class="ser-search-row">' +
          '<input type="search" class="ser-input" id="efSearch" placeholder="搜尋片名、原文片名、主創、演員、頻道…" value="' + SER.esc(ef.q) + '" />' +
          '<select class="ser-select" id="efSort" aria-label="排序方式">' +
            '<option value="rating"' + (ef.sort === 'rating' ? ' selected' : '') + '>排序：推薦指數高→低</option>' +
            '<option value="year_desc"' + (ef.sort === 'year_desc' ? ' selected' : '') + '>排序：開播年份新→舊</option>' +
            '<option value="year_asc"' + (ef.sort === 'year_asc' ? ' selected' : '') + '>排序：開播年份舊→新</option>' +
            '<option value="short"' + (ef.sort === 'short' ? ' selected' : '') + '>排序：最快看完優先</option>' +
            '<option value="long"' + (ef.sort === 'long' ? ' selected' : '') + '>排序：最耐看優先</option>' +
          '</select>' +
        '</div>' +
        '<div class="ser-filter-row"><div class="ser-filter-lbl">地區</div><div class="ser-pills">' + pillRow('region', '全部', SER.REGIONS) + '</div></div>' +
        '<div class="ser-filter-row"><div class="ser-filter-lbl">類型</div><div class="ser-pills">' + pillRow('genre', '全部', SER.GENRES) + '</div></div>' +
        '<div class="ser-filter-row"><div class="ser-filter-lbl">首播平台</div><div class="ser-pills">' + pillRow('platform', '全部', SER.PLATFORMS) + '</div></div>' +
        '<div class="ser-filter-row"><div class="ser-filter-lbl">狀態</div><div class="ser-pills">' + pillRow('status', '全部', STATUS) + '</div></div>' +
        '<div class="ser-filter-row"><div class="ser-filter-lbl">收尾</div><div class="ser-pills">' + pillRow('verdict', '全部', VERDICT_GROUPS) + '</div></div>' +
        '<div class="ser-filter-row"><div class="ser-filter-lbl">片長</div><div class="ser-pills">' + pillRow('length', '全部', SER.LENGTHS) + '</div></div>' +
        '<div class="ser-filter-row"><div class="ser-filter-lbl">我的進度</div><div class="ser-pills">' + pillRow('mine', '全部', MINE) + '</div></div>' +
      '</div>' +
      '<div class="ser-result-bar"><span>找到 <b>' + filtered.length + '</b> 部影集</span>' +
        (active ? '<button type="button" class="ser-link-btn" id="efReset">✕ 清除所有條件</button>' : '') + '</div>' +
      (visible.length
        ? '<div class="ser-grid">' + visible.map(SER.renderCard).join('') + '</div>'
        : '<div class="ser-empty"><b>沒有符合條件的影集</b>試著放寬條件，或到「💬 意見回饋」許願想看的作品。</div>') +
      (remaining > 0
        ? '<div class="ser-more-bar"><button type="button" class="ser-btn" id="efMore">顯示更多（還有 ' + remaining + ' 部）</button></div>'
        : '');

    root.querySelectorAll('[data-ef]').forEach(function (b) {
      b.onclick = function () {
        ef[b.getAttribute('data-ef')] = b.getAttribute('data-val');
        ef.limit = PAGE_STEP;
        SER.renderExplorePage(root);
      };
    });
    var search = document.getElementById('efSearch');
    if (search) {
      var composing = false;
      var timer = null;
      var apply = function () {
        ef.q = search.value;
        ef.limit = PAGE_STEP;
        var pos = search.selectionStart;
        SER.renderExplorePage(root);
        var again = document.getElementById('efSearch');
        if (again) {
          again.focus();
          try { again.setSelectionRange(pos, pos); } catch (e) { /* ignore */ }
        }
      };
      search.addEventListener('compositionstart', function () { composing = true; });
      search.addEventListener('compositionend', function () { composing = false; apply(); });
      search.addEventListener('input', function () {
        if (composing) return;
        clearTimeout(timer);
        timer = setTimeout(apply, 220);
      });
    }
    var sortSel = document.getElementById('efSort');
    if (sortSel) sortSel.onchange = function () { ef.sort = sortSel.value; SER.renderExplorePage(root); };
    var reset = document.getElementById('efReset');
    if (reset) reset.onclick = function () { SER.resetExplore(); SER.renderExplorePage(root); };
    var more = document.getElementById('efMore');
    if (more) {
      more.onclick = function () {
        var y = window.scrollY;
        ef.limit += PAGE_STEP;
        SER.renderExplorePage(root);
        window.scrollTo(0, y);
      };
    }
  };
})();

  <script>
/* 📊 分季避雷雷達（口碑走勢＋收尾評價）與 📡 首播平台索引 */
(function () {
  'use strict';
  var SER = window.SER;

  function radarCard(s) {
    var bw = SER.bestWorst(s);
    var trend = SER.TREND_MAP[SER.trendOf(s)];
    var gap = bw.best.score - bw.worst.score;
    var txt = '口碑高點在' + SER.seasonLabel(bw.best) + '（' + bw.best.score.toFixed(1) + '）';
    if (gap >= 0.3) txt += '，低點在' + SER.seasonLabel(bw.worst) + '（' + bw.worst.score.toFixed(1) + '）';
    else txt += '，各季差距不到 0.3 分';
    return (
      '<div class="ser-radar-card" data-open-series="' + SER.esc(s.id) + '">' +
        '<div class="ser-radar-hd"><b>' + SER.esc(s.title) + '</b><span>' + SER.esc(SER.yearsLabel(s)) + ' · ' + SER.esc(s.seasonsCount) + ' 季 ' + SER.esc(s.episodes) + ' 集</span></div>' +
        SER.seasonBars(s) +
        '<div class="ser-radar-txt">' + SER.esc(txt) + '。</div>' +
        '<div class="ser-radar-foot">' +
          (trend ? '<span class="ser-chip">' + SER.esc(trend.label) + '</span>' : '') +
          SER.verdictChip(s) +
          '<span class="ser-chip">' + SER.esc((SER.REGION_MAP[s.region] || {}).short || '') + '</span>' +
        '</div>' +
      '</div>'
    );
  }

  function trendTab() {
    var multi = SER.getCatalog().filter(function (s) { return (s.seasons || []).length > 1; });
    var cur = SER.state.radarTrend;
    var pillsHtml = '<button type="button" class="ser-pill' + (cur === 'all' ? ' active' : '') + '" data-trend="all">全部 (' + multi.length + ')</button>' +
      SER.TRENDS.map(function (t) {
        var c = multi.filter(function (s) { return SER.trendOf(s) === t.id; }).length;
        return '<button type="button" class="ser-pill' + (cur === t.id ? ' active' : '') + (c ? '' : ' is-zero') + '" data-trend="' + t.id + '">' + SER.esc(t.label) + ' (' + c + ')</button>';
      }).join('');
    var list = multi.filter(function (s) { return cur === 'all' || SER.trendOf(s) === cur; });
    list.sort(function (a, b) {
      if (cur === 'falling') {
        var ga = SER.bestWorst(a); var gb = SER.bestWorst(b);
        return (gb.best.score - gb.worst.score) - (ga.best.score - ga.worst.score);
      }
      return (b.rating || 0) - (a.rating || 0);
    });
    var desc = cur === 'all'
      ? '長條越高代表該季口碑越好：綠色是全劇高點，橘色與紅色是需要留意的低谷。點卡片可看每一季的無雷導讀。'
      : (SER.TREND_MAP[cur] || {}).desc || '';
    return (
      '<div class="ser-filter"><div class="ser-filter-row"><div class="ser-filter-lbl">走勢</div><div class="ser-pills">' + pillsHtml + '</div></div>' +
      '<p class="ser-note" style="margin-top:6px;">' + SER.esc(desc) + '</p></div>' +
      '<div class="ser-result-bar"><span>共 <b>' + list.length + '</b> 部多季作品</span></div>' +
      (list.length ? '<div class="ser-radar-list">' + list.map(radarCard).join('') + '</div>'

    );
  }

  function endingTab() {
    var cat = SER.getCatalog();
    return SER.VERDICTS.map(function (v) {
      var list = cat.filter(function (s) { return s.ending && s.ending.verdict === v.id; })
        .sort(function (a, b) { return (b.rating || 0) - (a.rating || 0); });
      if (!list.length) return '';
      return (
        '<div class="ser-panel ser-verdict-sec">' +
          '<div class="ser-verdict-hd"><b>' + SER.esc(v.label) + '</b><span class="ser-chip ' + v.cls + '">' + list.length + ' 部</span><span class="ser-note">' + SER.esc(v.desc) + '</span></div>' +
          '<div class="ser-verdict-list">' + list.map(function (s) {
            return '<button type="button" class="ser-verdict-item" data-open-series="' + SER.esc(s.id) + '"><b>' + SER.esc(s.title) + '　<span style="display:inline;color:#64748b;font-weight:700;">' + SER.esc(SER.yearsLabel(s)) + '</span></b><span>' + SER.esc((s.ending && s.ending.note) || '') + '</span></button>';
          }).join('') + '</div>' +
        '</div>'
      );
    }).join('');
  }

  SER.renderRadarPage = function (root) {
    var tab = SER.state.radarTab;
    root.innerHTML =
      '<div class="ser-sec-hd"><div><h2>📊 分季避雷雷達</h2><div class="ser-sec-sub">入坑前先看兩件事：哪幾季最精彩、哪幾季口碑下滑，以及這部作品有沒有好好收尾（全程無雷）</div></div></div>' +
      '<div class="ser-subtabs">' +
        '<button type="button" class="ser-pill' + (tab === 'trend' ? ' active' : '') + '" data-radar-tab="trend">📈 分季口碑走勢</button>' +
        '<button type="button" class="ser-pill' + (tab === 'ending' ? ' active' : '') + '" data-radar-tab="ending">🏁 收尾評價總覽</button>' +
      '</div>' +
      (tab === 'ending' ? endingTab() : trendTab()) +
      '<p class="ser-disclaimer">分季口碑指數與收尾評價為編輯綜合各方評價後的主觀整理，僅供選片參考，不代表任何評分網站的數據。</p>';
    root.querySelectorAll('[data-radar-tab]').forEach(function (b) {
      b.onclick = function () { SER.state.radarTab = b.getAttribute('data-radar-tab'); SER.renderRadarPage(root); };
    });
    root.querySelectorAll('[data-trend]').forEach(function (b) {
      b.onclick = function () { SER.state.radarTrend = b.getAttribute('data-trend'); SER.renderRadarPage(root); };
    });
  };

  SER.renderPlatformsPage = function (root) {
    var cat = SER.getCatalog();
    var cards = SER.PLATFORMS.map(function (p) {
      var list = cat.filter(function (s) { return s.platform === p.id; })
        .sort(function (a, b) { return (b.rating || 0) - (a.rating || 0); });
      if (!list.length) return '';
      var nets = {};
      list.forEach(function (s) { nets[s.network] = (nets[s.network] || 0) + 1; });
      var netChips = Object.keys(nets).sort(function (a, b) { return nets[b] - nets[a] || a.localeCompare(b); })
        .map(function (n) { return '<span class="ser-chip">' + SER.esc(n) + ' ' + nets[n] + '</span>'; }).join('');
      var safe = list.filter(function (s) { var v = s.ending && s.ending.verdict; return v === 'perfect' || v === 'good'; }).length;
      var top = list.slice(0, 6).map(function (s) {
        return '<li data-open-series="' + SER.esc(s.id) + '"><b>' + SER.esc(s.title) + '</b><span>★ ' + Number(s.rating || 0).toFixed(1) + ' · ' + SER.esc(SER.hoursLabel(s)) + '</span></li>';
      }).join('');
      return (
        '<div class="ser-plat-card" style="border-top-color:' + p.color + '">' +
          '<div class="ser-plat-hd"><b>' + SER.esc(p.label) + '</b><span class="ser-chip genre">' + list.length + ' 部</span></div>' +
          '<div class="ser-plat-desc">' + SER.esc(p.desc) + '｜其中 ' + safe + ' 部收尾好評</div>' +
          '<div class="ser-plat-nets">' + netChips + '</div>' +
          '<ul class="ser-plat-top">' + top + '</ul>' +
          '<button type="button" class="ser-btn ser-btn-sm" data-plat-all="' + p.id + '">看這個平台的全部 ' + list.length + ' 部 →</button>' +
        '</div>'
      );
    }).join('');
    root.innerHTML =
      '<div class="ser-sec-hd"><div><h2>📡 首播平台索引</h2><div class="ser-sec-sub">依「最初在哪裡播出」整理：想了解某個平台或電視台的招牌作品，從這裡找最快</div></div></div>' +
      '<div class="ser-plat-grid">' + cards + '</div>' +
      '<p class="ser-disclaimer">這裡列的是作品的首播頻道與平台，不是目前的上架資訊。各作品在台灣可觀看的平台會隨授權到期而變動，請以各平台當下的片單為準。</p>';
    root.querySelectorAll('[data-plat-all]').forEach(function (b) {
      b.onclick = function () {
        SER.resetExplore();
        SER.state.explore.platform = b.getAttribute('data-plat-all');
        window.location.hash = '#/explore';
      };
    });
  };
})();

    }).join('');

            '<div class="ser-pass-meta">' + SER.esc((SER.REGION_MAP[s.region] || {}).short || '') + ' · ' + SER.esc(SER.yearsLabel(s)) + ' · ' + SER.esc(s.episodes) + ' 集 · ' + SER.esc(SER.hoursLabel(s)) + SER.esc(stars) + '</div></div>' +
          '<div class="ser-pass-meta"><b>' + SER.seenEpisodes(s) + '</b>／' + SER.esc(s.episodes) + ' 集' + (next ? '　' + SER.esc(next) : '') + '</div>' +
        '</div>' +

        '<div class="ser-stamps">' + stamps + '</div>' +
        (p.note ? '<div class="ser-pass-note">📝 ' + SER.esc(p.note) + '</div>' : '') +
      '</div>'
    );

  SER.renderMyListPage = function (root) {
